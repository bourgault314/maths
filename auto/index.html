<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automatismes maths cycle 4 et DNB | maths&amp;go</title>
<meta name="description" content="Outil d’automatismes de mathématiques pour le cycle 4 et le DNB : entraînez vos élèves en vidéoprojection ou sur téléphone, avec aides et corrections.">
<style>
:root {
  --bg:#f5f7fb; --panel:#fff; --line:#dbe4f3; --text:#10244a; --muted:#61708f;
  --blue:#073b7a; --cyan:#06b3ad; --orange:#ff8200; --green:#10b981; --red:#ef4444;
  --shadow:0 10px 30px rgba(16,36,74,.09);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding:18px;}
.app{max-width:860px;margin:0 auto;}
.header{display:flex;align-items:center;justify-content:center;gap:20px;background:white;border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);}
.logo{height:74px;object-fit:contain}
.logo-link{display:inline-flex;align-items:center;border-radius:12px;outline-offset:4px}
.logo-link:hover .logo{transform:scale(1.025)}
.logo-link:focus-visible{outline:3px solid var(--orange)}
.logo{transition:transform .16s ease}
.title h1{margin:0;font-size:1.45rem;line-height:1.05;color:var(--blue);text-align:center}
.title h1 .title-cycle{display:block;margin-top:.18em;font-size:.72em;letter-spacing:.02em}
.title p{margin:.25rem 0 0;color:var(--muted);font-size:.95rem}
.panel{margin-top:14px;background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
.controls-row{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.controls-row .field-level{flex:1 1 230px}.controls-row .field-visual{flex:1 1 170px}.controls-row .field-count{flex:1 1 170px}.controls-row .field-seed{flex:0 1 110px}.controls-row .field-generate{flex:0 0 auto}
.quick-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-left:auto}
.actions-row{display:flex;align-items:center;justify-content:flex-start;gap:7px;flex-wrap:wrap;margin-top:10px}
.field label{display:block;font-weight:700;font-size:.82rem;margin:0 0 5px;color:var(--blue);text-align:center}
select,input{width:100%;padding:9px 10px;border:1px solid #cfd8ea;border-radius:9px;background:white;font-size:.95rem;color:var(--text)}
button{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;font-size:.95rem}
button.secondary{background:white;color:var(--blue);border:1px solid var(--line)}
button.orange{background:var(--orange)}
.segmented-control{display:grid;gap:4px;width:100%}
.field-level .segmented-control,.field-count .segmented-control{grid-template-columns:repeat(4,minmax(0,1fr))}
.field-visual .segmented-control{grid-template-columns:repeat(2,minmax(0,1fr))}
.segment-btn{min-width:0;min-height:38px;padding:7px 4px;border:1px solid #cfd8ea;border-radius:9px;background:#fff;color:var(--blue);font-size:.84rem;line-height:1;box-shadow:none}
.segment-btn:hover{border-color:var(--cyan);background:#f1fbfb}
.segment-btn.is-active,.segment-btn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
.segment-btn:focus-visible{outline:3px solid rgba(255,130,0,.35);outline-offset:2px}
.segment-btn:disabled{cursor:not-allowed;border-color:#dfe5ef;background:#eef1f6;color:#9aa5b8;opacity:1}
.field-seed input{text-align:center;min-height:38px}
.small{font-size:.84rem;color:var(--muted);line-height:1.35}
.modules{margin-top:14px;display:grid;gap:8px}
.theme-group{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;background:#fff;overflow:hidden}
.theme-group[open]{border-left-color:var(--orange);box-shadow:0 5px 16px rgba(16,36,74,.07)}
.theme-summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:#f8fbff;color:var(--blue);font-weight:800;user-select:none}
.theme-summary::-webkit-details-marker{display:none}
.theme-summary:hover{background:#eef6ff}
.theme-chevron{color:var(--orange);font-size:1.05rem;transition:transform .16s ease}
.theme-group[open] .theme-chevron{transform:rotate(90deg)}
.theme-name{flex:1}
.theme-count{font-size:.75rem;color:var(--muted);font-weight:700;background:white;border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.theme-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.modrow{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;line-height:1.25;padding:6px;border-radius:9px}
.modrow:hover{background:#eef6ff}
.modrow input{width:auto;margin-top:1px}
.badge{font-size:.7rem;background:#e7f7f5;color:#08756f;border-radius:999px;padding:2px 7px;margin-left:5px;white-space:nowrap}
.credit{margin:14px 8px 0;text-align:center;font-size:.78rem;line-height:1.45;color:var(--muted)}
.credit a{color:var(--blue);font-weight:700;text-decoration:none}
.credit a:hover{text-decoration:underline}



/* Interface de sélection */
.logo{max-height:64px}
.modrow{padding:6px 8px;border-radius:8px;font-size:.88rem;line-height:1.15;min-height:auto}
.modrow input{margin-right:6px;transform:scale(.95)}
.modrow .small,.modrow .badge{display:none!important}
.modrow strong{font-weight:650}
.panel{padding:14px}
.panel h1{font-size:1.35rem;margin:.2rem 0}
.controls{gap:8px}
.controls label{font-size:.86rem}
.controls select,.controls input{padding:7px 8px}
button{padding:9px 12px}
@media(max-width:1050px){.controls-row{flex-wrap:wrap}.quick-actions{margin-left:0}.theme-items{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:651px){.controls-row{align-items:stretch}.controls-row>.field{display:flex;flex-direction:column;justify-content:flex-end;padding:8px 6px;background:#f8fbff;border:1px solid var(--line);border-radius:12px}.controls-row>.field label{margin-bottom:7px}.actions-row{justify-content:center}.actions-row .generate-action{flex:0 0 240px}.actions-row .secondary{flex:0 0 150px}}
@media(max-width:650px){body{padding:10px}.header{padding:10px 12px}.controls-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:14px 10px}.controls-row>*{min-width:0}.controls-row>.field{position:relative;z-index:0}.controls-row>.field::before{content:"";position:absolute;z-index:-1;inset:-5px -4px;background:#f8fbff;border:1px solid var(--line);border-radius:11px}.segment-btn{min-height:40px;padding:7px 2px;font-size:.78rem}.field-visual .segment-btn{font-size:.82rem}.quick-actions{flex-basis:100%!important}.actions-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}.actions-row .generate-action{grid-column:1/-1}.actions-row button{width:100%}.theme-items{grid-template-columns:1fr}.theme-count-label{display:none}.theme-count{white-space:nowrap}.title h1{font-size:1.2rem}}


</style>

$B$$. Quelle égalité de Pythagore est correcte ?&&$$AB^2=AC^2+BC^2$$&&$$AC^2=AB^2+BC^2$$&&$$BC^2=AB^2+AC^2$$&&","answer":"[\"2\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":4,"statement":"Le triangle $$RST$$ est rectangle en $$T$$. Quelle est l'hypoténuse ?&&Le côté $$[RS]$$&&Le côté $$[RT]$$&&Le côté $$[ST]$$&&On ne peut pas savoir&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":5,"statement":"Dans un triangle rectangle, les côtés de l'angle droit mesurent ${a} cm et ${b} cm. On appelle $$h$$ l'hypoténuse. Calcule $$h^2$$.","answer":"[\"a*a+b*b\"]","options":{"formula_code":"a=RD(3,12)\nb=RD(4,15)"},"footer":"$$h^2=[[formula]]$$"},{"n":6,"statement":"Dans un triangle rectangle, les deux côtés de l'angle droit mesurent ${a} cm et ${b} cm. Calcule la longueur de l'hypoténuse.","answer":"[\"c\"]","options":{"formula_code":"k=RD(0,4)\na=[3,5,6,8,7][k]\nb=[4,12,8,15,24][k]\nc=[5,13,10,17,25][k]"},"footer":"$$[[formula]]\\text{ cm}$$"},{"n":7,"statement":"Dans un triangle rectangle, l'hypoténuse mesure ${c} cm et un côté de l'angle droit mesure ${a} cm. Calcule la longueur de l'autre côté de l'angle droit.","answer":"[\"b\"]","options":{"formula_code":"k=RD(0,4)\na=[3,5,6,8,7][k]\nb=[4,12,8,15,24][k]\nc=[5,13,10,17,25][k]"},"footer":"$$[[formula]]\\text{ cm}$$"},{"n":8,"statement":"Un triangle a pour côtés ${a} cm, ${b} cm et ${c} cm. On vérifie que $$${c}^2=${a}^2+${b}^2$$. Quelle conclusion est correcte ?&&Le triangle est rectangle&&Le triangle est équilatéral&&Le triangle n'existe pas&&On ne peut rien conclure&&","answer":"[\"1\"]","options":{"formula_code":"k=RD(0,4)\na=[3,5,6,8,7][k]\nb=[4,12,8,15,24][k]\nc=[5,13,10,17,25][k]","shuffle_answers":true},"footer":"[[formula_qcm1]]"},{"n":9,"statement":"Un triangle a pour côtés ${a} cm, ${b} cm et ${c} cm. On calcule : $$${a}^2+${b}^2=${s}$$ et $$${c}^2=${t}$$. Peut-on conclure qu'il est rectangle ?&&Oui, car les trois longueurs sont connues&&Non, car l'égalité de Pythagore n'est pas vérifiée&&Oui, car le plus grand côté est ${c} cm&&Non, car on ne peut jamais utiliser la réciproque&&","answer":"[\"2\"]","options":{"formula_code":"a=RD(3,8)\nb=RD(4,10)\nc=a+b-1\ns=a*a+b*b\nt=c*c","shuffle_answers":true},"footer":"[[formula_qcm1]]"},{"n":10,"statement":"Dans un triangle rectangle, on dit que l'hypoténuse mesure ${h} cm et qu'un autre côté mesure ${c} cm. Que faut-il penser de ces données ?&&C'est impossible : l'hypoténuse doit être le plus grand côté&&C'est toujours possible&&Il suffit d'additionner les deux longueurs&&Le théorème de Pythagore ne concerne pas les longueurs&&","answer":"[\"1\"]","options":{"formula_code":"h=RD(4,9)\nc=h+RD(1,4)","shuffle_answers":true},"footer":"[[formula_qcm1]]"}]},{"id":"dnb_25","num":25,"title":"Thalès triangles emboîtés","level_tags":["3e","DNB"],"source":"import_dnb_zip","has_svg":true,"questions":[{"n":1,"statement":"Sur la figure, $$D$$ est sur $$[AB]$$, $$E$$ est sur $$[AC]$$ et $$(DE)$$ est parallèle à $$(BC)$$.<br><div style=\"text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"auto\" viewBox=\"0 0 320 190\"><polygon points=\"70,35 45,160 280,160\" fill=\"#eef8ff\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><line x1=\"59\" y1=\"94\" x2=\"170\" y2=\"94\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><text x=\"62\" y=\"28\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">A</text><text x=\"27\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">B</text><text x=\"286\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">C</text><text x=\"42\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">D</text><text x=\"175\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">E</text></svg></div><br>Peut-on utiliser le théorème de Thalès ?&&Oui&&Non, car il manque un angle droit&&Non, car les triangles ne sont pas emboîtés&&Non, car les droites ne sont pas parallèles&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":2,"statement":"Dans la configuration suivante, $$D$$ est sur $$[AB]$$, $$E$$ est sur $$[AC]$$ et $$(DE) // (BC)$$.<br><div style=\"text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"auto\" viewBox=\"0 0 320 190\"><polygon points=\"70,35 45,160 280,160\" fill=\"#eef8ff\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><line x1=\"59\" y1=\"94\" x2=\"170\" y2=\"94\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><text x=\"62\" y=\"28\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">A</text><text x=\"27\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">B</text><text x=\"286\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">C</text><text x=\"42\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">D</text><text x=\"175\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">E</text></svg></div><br>Quelle égalité de rapports est correcte ?&&$$\\dfrac{AD}{AB}=\\dfrac{AE}{AC}=\\dfrac{DE}{BC}$$&&$$\\dfrac{AD}{DB}=\\dfrac{AE}{EC}=\\dfrac{DE}{BC}$$&&$$\\dfrac{AB}{AD}=\\dfrac{AE}{EC}=\\dfrac{BC}{DE}$$&&$$\\dfrac{AD}{AC}=\\dfrac{AE}{AB}=\\dfrac{DE}{BC}$$&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":3,"statement":"Dans la figure, $$D$$ est sur $$[AB]$$, $$E$$ est sur $$[AC]$$ et $$(DE)//(BC)$$.<br><div style=\"text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"auto\" viewBox=\"0 0 320 190\"><polygon points=\"70,35 45,160 280,160\" fill=\"#eef8ff\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><line x1=\"59\" y1=\"94\" x2=\"170\" y2=\"94\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><text x=\"62\" y=\"28\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">A</text><text x=\"27\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">B</text><text x=\"286\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">C</text><text x=\"42\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">D</text><text x=\"175\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">E</text></svg></div><br>On donne $$AD=${AD}\\text{ cm}$$, $$AB=${AB}\\text{ cm}$$ et $$AC=${AC}\\text{ cm}$$. Calcule $$AE$$.","answer":"[\"AE\"]","options":{"formula_code":"d=RD(2,7)\nk=RD(2,4)\nc=RD(3,9)\nAD=d\nAB=d*k\nAE=c\nAC=c*k"},"footer":"$$AE=[[formula]]\\text{ cm}$$"},{"n":4,"statement":"Dans la figure, $$D$$ est sur $$[AB]$$, $$E$$ est sur $$[AC]$$ et $$(DE)//(BC)$$.<br><div style=\"text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"auto\" viewBox=\"0 0 320 190\"><polygon points=\"70,35 45,160 280,160\" fill=\"#eef8ff\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><line x1=\"59\" y1=\"94\" x2=\"170\" y2=\"94\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><text x=\"62\" y=\"28\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">A</text><text x=\"27\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">B</text><text x=\"286\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">C</text><text x=\"42\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">D</text><text x=\"175\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">E</text></svg></div><br>On donne $$AD=${AD}\\text{ cm}$$, $$AE=${AE}\\text{ cm}$$ et $$AC=${AC}\\text{ cm}$$. Calcule $$AB$$.","answer":"[\"AB\"]","options":{"formula_code":"d=RD(2,7)\nk=RD(2,4)\ne=RD(2,8)\nAD=d\nAB=d*k\nAE=e\nAC=e*k"},"footer":"$$AB=[[formula]]\\text{ cm}$$"},{"n":5,"statement":"Dans la figure, $$D$$ est sur $$[AB]$$, $$E$$ est sur $$[AC]$$ et $$(DE)//(BC)$$.<br><div style=\"text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"auto\" viewBox=\"0 0 320 190\"><polygon points=\"70,35 45,160 280,160\" fill=\"#eef8ff\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><line x1=\"59\" y1=\"94\" x2=\"170\" y2=\"94\" stroke=\"#1f5f8b\" stroke-width=\"2\"/><text x=\"62\" y=\"28\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">A</text><text x=\"27\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">B</text><text x=\"286\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">C</text><text x=\"42\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">D</text><text x=\"175\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">E</text></svg></div><br>On donne $$AD=${AD}\\text{ cm}$$, $$AB=${AB}\\text{ cm}$$ et $$BC=${BC}\\text{ cm}$$. Calcule $$DE$$.","answer":"[\"DE\"]","options":{"formula_code":"d=RD(2,7)\nk=RD(2,4)\ne=RD(3,9)\nAD=d\nAB=d*k\nDE=e\nBC=e*k"},"footer":"$$DE=[[formula]]\\text{ cm}$$"},{"n":6,"statement":"On sait que $$D$$ est sur $$[AB]$$ et $$E$$ est sur $$[AC]$$. On mesure : $$AD=${AD}\\text{ cm}$$, $$AB=${AB}\\text{ cm}$$, $$AE=${AE}\\text{ cm}$$ et $$AC=${AC}\\text{ cm}$$.<br>Les rapports $$\\dfrac{AD}{AB}$$ et $$\\dfrac{AE}{AC}$$ sont-ils égaux ?&&Oui, donc on peut conclure que $$(DE)//(BC)$$&&Non, donc  $$(DE)$$ et $$(BC)$$ ne sont pas parallèles&&Oui, car les deux petits segments sont égaux&&Non, donc  $$(DE)$$ et $$(BC)$$ sont parallèles&&","answer":"[\"2\"]","options":{"formula_code":"d=RD(2,7)\nk=RD(2,4)\nc=RD(3,8)\nAD=d\nAB=d*k\nAC=c*k\nAE=c+1","shuffle_answers":true},"footer":"[[formula_qcm1]]"},{"n":7,"statement":"Sur cette figure, $$D$$ est sur $$[AB]$$ et $$E$$ est sur $$[AC]$$, mais les droites $$(DE)$$ et $$(BC)$$ ne sont pas parallèles.<br><div style=\"text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"auto\" viewBox=\"0 0 320 190\"><polygon points=\"70,35 45,160 280,160\" fill=\"#fff8e8\" stroke=\"#b36b00\" stroke-width=\"2\"/><line x1=\"59\" y1=\"94\" x2=\"195\" y2=\"108\" stroke=\"#b36b00\" stroke-width=\"2\"/><text x=\"62\" y=\"28\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">A</text><text x=\"27\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">B</text><text x=\"286\" y=\"176\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">C</text><text x=\"42\" y=\"96\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">D</text><text x=\"195\" y=\"108\" font-family=\"serif\" font-style=\"italic\" font-size=\"17\">E</text></svg></div><br>Peut-on appliquer directement le théorème de Thalès ?&&Oui, car il y a deux triangles&&Non, car il manque la condition de parallélisme&&Oui, car les points sont alignés&&Non, car il faudrait un angle droit&&","answer":"[\"2\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":8,"statement":"Dans la figure, $$D$$ est sur $$[AB]$$, $$E$$ est sur $$[AC]$$ et $$(DE)//(BC)$$. On cherche $$x=AE$$.<br>On connaît $$AD=${AD}\\text{ cm}$$, $$AB=${AB}\\text{ cm}$$ et $$AC=${AC}\\text{ cm}$$.<br>Quelle égalité permet de calculer $$x$$ ?&&$$\\dfrac{AD}{AB}=\\dfrac{x}{AC}$$&&$$\\dfrac{AB}{AD}=\\dfrac{x}{AC}$$&&$$\\dfrac{AD}{AC}=\\dfrac{x}{AB}$$&&$$AD+AB=x+AC$$&&","answer":"[\"1\"]","options":{"formula_code":"d=RD(2,7)\nk=RD(2,4)\nc=RD(3,9)\nAD=d\nAB=d*k\nAC=c*k","shuffle_answers":true},"footer":"[[formula_qcm1]]"},{"n":9,"statement":"Dans une configuration de Thalès, $$D$$ appartient au segment $$[AB]$$. Après un calcul, on obtient $$AD=${x}\\text{ cm}$$ alors que $$AB=${AB}\\text{ cm}$$. Que faut-il penser de ce résultat ?&&Le résultat est cohérent&&Le résultat est impossible : si $$D$$ est sur $$[AB]$$, alors $$AD$$ ne peut pas être plus grand que $$AB$$&&Le résultat prouve que le triangle est rectangle&&Le résultat est toujours acceptable avec Thalès&&","answer":"[\"2\"]","options":{"formula_code":"AB=RD(6,14)\nx=AB+RD(1,6)","shuffle_answers":true},"footer":"[[formula_qcm1]]"},{"n":10,"statement":"Dans la figure, $$D$$ est sur $$[AB]$$, $$E$$ est sur $$[AC]$$ et $$(DE)//(BC)$$.<br><div style=\"text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"320\" height=\"auto\" viewBox=\"0 0 320 190\"><po </td></tr><tr><td style=\"border:1px solid #555;padding:8px 18px\">nombre de secteurs</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${r}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${bl}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${v}$$</td></tr></table><br>Quelle est la probabilité que la roue s’arrête sur la couleur ${couleur} ?","answer":"[\"fav/g\",\"total/g\"]","options":{"formula_code":"setNB(1)\nr=RD(1,4)\nbl=RD(1,4)\nv=RD(1,4)\nchoix=RD(0,2)\ncouleur=[\"rouge\",\"bleu\",\"vert\"][choix]\nfav=choix==0?r:(choix==1?bl:v)\ntotal=r+bl+v\ng=GCD(fav,total)"},"footer":"$$P=[[formula_frac]]$$"},{"n":4,"statement":"On lance un dé équilibré à 6 faces. Quelle est la probabilité d’obtenir un nombre pair ?&&$$\\dfrac{1}{2}$$&&$$\\dfrac{1}{3}$$&&$$\\dfrac{2}{3}$$&&$$\\dfrac{3}{6}$$&&","answer":"[\"1\",\"4\"]","options":{"shuffle_answers":true},"footer":"[[qcm]]"},{"n":5,"statement":"On choisit au hasard une carte parmi des cartes numérotées de $$1$$ à $$${n}$$.<br>Quelle est la probabilité d’obtenir un multiple de $$3$$ ?","answer":"[\"fav/g\",\"n/g\"]","options":{"formula_code":"setNB(1)\nn=RD(6,12)\nfav=floor(n/3)\ng=GCD(fav,n)"},"footer":"$$P=[[formula_frac]]$$"},{"n":6,"statement":"On choisit au hasard une lettre du mot :<br><div style=\"text-align:center;font-size:24px;font-weight:bold;letter-spacing:6px\">MATHS</div><br>Chaque lettre a la même probabilité d’être choisie. Quelle est la probabilité de choisir une consonne ?&&$$\\dfrac{4}{5}$$&&$$\\dfrac{2}{5}$$&&$$\\dfrac{1}{5}$$&&$$\\dfrac{5}{3}$$&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":7,"statement":"On lance une pièce équilibrée et un dé équilibré à 6 faces.<br>On considère tous les résultats possibles équiprobables.<br>Quelle est la probabilité d’obtenir « pile » et un nombre pair ?","answer":"[\"1\",\"4\"]","options":null,"footer":"$$P=[[frac-simp]]$$"},{"n":8,"statement":"Une urne contient uniquement des boules rouges et des boules bleues.<br>On tire une boule au hasard. Quelle est la probabilité de tirer une boule verte ?&&$$0$$&&$$1$$&&$$\\dfrac{1}{2}$$&&On ne peut pas savoir.&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":9,"statement":"Dans une classe, on choisit un élève au hasard. Les effectifs sont donnés dans le tableau :<br><table style=\"border-collapse:collapse;margin:auto;text-align:center;font-size:18px\"><tr><td style=\"border:1px solid #555;padding:8px 18px\">niveau</td><td style=\"border:1px solid #555;padding:8px 18px\">6e</td><td style=\"border:1px solid #555;padding:8px 18px\">5e</td><td style=\"border:1px solid #555;padding:8px 18px\">4e</td></tr><tr><td style=\"border:1px solid #555;padding:8px 18px\">effectif</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${a}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${b}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${c}$$</td></tr></table><br>Quelle est la probabilité de choisir un élève de 5e ?","answer":"[\"b/g\",\"total/g\"]","options":{"formula_code":"setNB(1)\na=RD(8,15)\nb=RD(8,15)\nc=RD(8,15)\ntotal=a+b+c\ng=GCD(b,total)"},"footer":"$$P(\\text{5e})=[[formula_frac]]$$"},{"n":10,"statement":"Un sac contient $$${r}$$ jetons rouges, $$${b}$$ jetons bleus et $$${v}$$ jetons verts.<br>On tire un jeton au hasard. Quelle est la probabilité de ne pas tirer un jeton bleu ?","answer":"[\"fav/g\",\"total/g\"]","options":{"formula_code":"setNB(1)\nr=RD(1,6)\nb=RD(1,6)\nv=RD(1,6)\ntotal=r+b+v\nfav=r+v\ng=GCD(fav,total)"},"footer":"$$P(\\text{pas bleu})=[[formula_frac]]$$"}]},{"id":"dnb_29","num":29,"title":"Fréquences simples","level_tags":["4e","3e","DNB"],"source":"import_dnb_zip","has_svg":false,"questions":[{"n":1,"statement":"Lors d’un sondage, $$${e}$$ élèves sur $$${n}$$ répondent « oui ».<br>Quelle est la fréquence des réponses « oui » ?","answer":"[\"e/g\",\"n/g\"]","options":{"formula_code":"setNB(1)\nn=RD(18,36)\ne=RD(3,n-3)\ng=GCD(e,n)"},"footer":"$$f=[[formula_frac]]$$"},{"n":2,"statement":"Dans une classe, on a relevé l’activité pratiquée par les élèves :<br><table style=\"border-collapse:collapse;margin:auto;text-align:center;font-size:18px\"><tr><td style=\"border:1px solid #555;padding:8px 18px\">activité</td><td style=\"border:1px solid #555;padding:8px 18px\">sport</td><td style=\"border:1px solid #555;padding:8px 18px\">musique</td><td style=\"border:1px solid #555;padding:8px 18px\">dessin</td></tr><tr><td style=\"border:1px solid #555;padding:8px 18px\">effectif</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${sport}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${musique}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${dessin}$$</td></tr></table><br>Quelle est la fréquence des élèves qui pratiquent le sport ?","answer":"[\"sport/g\",\"total/g\"]","options":{"formula_code":"setNB(1)\nsport=RD(5,14)\nmusique=RD(4,12)\ndessin=RD(3,10)\ntotal=sport+musique+dessin\ng=GCD(sport,total)"},"footer":"$$f=[[formula_frac]]$$"},{"n":3,"statement":"On lance un dé $$${n}$$ fois. Le nombre $$6$$ est sorti $$${e}$$ fois.<br>Exprime la fréquence d’apparition du nombre $$6$$ sous forme décimale. Arrondis au centième si nécessaire.","answer":"[\"CUT(e/n,2)\"]","options":{"formula_code":"setNB(1)\nn=[20,25,40,50][RD(3)]\ne=RD(1,n-1)"},"footer":"$$f=[[formula]]$$"},{"n":4,"statement":"Pour calculer une fréquence, quelle formule faut-il utiliser ?&&$$\\text{fréquence}=\\dfrac{\\text{effectif de la valeur}}{\\text{effectif total}}$$&&$$\\text{fréquence}=\\dfrac{\\text{effectif total}}{\\text{effectif de la valeur}}$$&&$$\\text{fréquence}=\\text{effectif total}-\\text{effectif de la valeur}$$&&$$\\text{fréquence}=\\text{effectif de la valeur}+\\text{effectif total}$$&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":5,"statement":"Dans une urne, on compte les boules suivantes :<br><table style=\"border-collapse:collapse;margin:auto;text-align:center;font-size:18px\"><tr><td style=\"border:1px solid #555;padding:8px 18px\">couleur</td><td style=\"border:1px solid #555;padding:8px 18px\">rouge</td><td style=\"border:1px solid #555;padding:8px 18px\">bleue</td><td style=\"border:1px solid #555;padding:8px 18px\">verte</td></tr><tr><td style=\"border:1px solid #555;padding:8px 18px\">effectif</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${r}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${b}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${v}$$</td></tr></table><br>Quelle est la fréquence des boules ${couleur}s ?","answer":"[\"fav/g\",\"total/g\"]","options":{"formula_code":"setNB(1)\nr=RD(2,9)\nb=RD(2,9)\nv=RD(2,9)\nchoix=RD(0,2)\ncouleur=[\"rouge\",\"bleue\",\"verte\"][choix]\nfav=choix==0?r:(choix==1?b:v)\ntotal=r+b+v\ng=GCD(fav,total)"},"footer":"$$f=[[formula_frac]]$$"},{"n":6,"statement":"Dans un collège, $$${e}$$ élèves sur $$${n}$$ viennent en bus.<br>Complète la fraction donnant la fréquence des élèves qui viennent en bus.","answer":"[\"e/g\",\"n/g\"]","options":{"formula_code":"setNB(1)\nn=RD(30,80)\ne=RD(5,n-5)\ng=GCD(e,n)"},"footer":"$$f=\\dfrac{[[formula]]}{[[formula]]}$$"},{"n":7,"statement":"Dans une série de $$${n}$$ résultats, la fréquence de la valeur A est $$\\dfrac{${num}}{${den}}$$.<br>Combien de résultats correspondent à la valeur A ?","answer":"[\"e\"]","options":{"formula_code":"setNB(1)\nden=[4,5,10][RD(2)]\nnum=RD(1,den-1)\nk=RD(2,8)\nn=den*k\ne=num*k"},"footer":"$$[[formula]]$$"},{"n":8,"statement":"Dans une classe de $$25$$ élèves, $$10$$ élèves portent des lunettes.<br>Quelle est la fréquence des élèves qui portent des lunettes ?&&$$\\dfrac{2}{5}$$&&$$\\dfrac{10}{15}$$&&$$\\dfrac{15}{25}$$&&$$\\dfrac{25}{10}$$&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":9,"statement":"Dans un groupe de $$${n}$$ personnes, $$${e}$$ personnes ont choisi la réponse A.<br>Exprime la fréquence de la réponse A en pourcentage.","answer":"[\"100*e/n\"]","options":{"formula_code":"setNB(1)\nn=[20,25,50][RD(2)]\ne=RD(1,n-1)"},"footer":"$$f=[[formula]]\\%$$"},{"n":10,"statement":"Dans une classe, il y a $$12$$ filles et $$10$$ garçons. Parmi les filles, $$8$$ portent des lunettes.<br>On étudie la classe entière. Quelle est la fréquence des filles qui portent des lunettes ?&&$$\\dfrac{8}{22}$$&&$$\\dfrac{8}{12}$$&&$$\\dfrac{12}{22}$$&&$$\\dfrac{8}{10}$$&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"}]},{"id":"dnb_30","num":30,"title":"Moyennes","level_tags":["4e","3e","DNB"],"source":"import_dnb_zip","has_svg":false,"questions":[{"n":1,"statement":"On considère les trois valeurs : $$${a}$$, $$${b}$$ et $$${c}$$.<br>Exprime leur moyenne sous forme de fraction.","answer":"[\"s/g\",\"3/g\"]","options":{"formula_code":"setNB(1)\na=RD(2,18)\nb=RD(2,18)\nc=RD(2,18)\ns=a+b+c\ng=GCD(s,3)"},"footer":"$$\\text{moyenne}=[[formula_frac]]$$"},{"n":2,"statement":"Calcule la moyenne des quatre valeurs suivantes :<br><div style=\"text-align:center;font-size:22px\">$$${a} \\quad ; \\quad ${b} \\quad ; \\quad ${c} \\quad ; \\quad ${d}$$</div>","answer":"[\"m\"]","options":{"formula_code":"setNB(1)\nm=RD(6,18)\nd1=RD(1,4)\nd2=RD(1,4)\na=m-d1\nb=m+d1\nc=m-d2\nd=m+d2"},"footer":"$$\\text{moyenne}=[[formula]]$$"},{"n":3,"statement":"Voici les notes obtenues à une évaluation :<br><table style=\"border-collapse:collapse;margin:auto;text-align:center;font-size:18px\"><tr><td style=\"border:1px solid #555;padding:8px 18px\">note</td><td style=\"border:1px solid #555;padding:8px 18px\">8</td><td style=\"border:1px solid #555;padding:8px 18px\">12</td><td style=\"border:1px solid #555;padding:8px 18px\">16</td></tr><tr><td style=\"border:1px solid #555;padding:8px 18px\">effectif</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${e1}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${e2}$$</td><td style=\"border:1px solid #555;padding:8px 18px\">$$${e3}$$</td></tr></table><br>Calcule la moyenne des notes. Arrondis au dixième si nécessaire.","answer":"[\"CUT((8*e1+12*e2+16*e3)/(e1+e2+e3),1)\"]","options":{"formula_code":"setNB(1)\ne1=RD(2,8)\ne2=RD(2,8)\ne3=RD(2,8)"},"footer":"$$\\text{moyenne}=[[formula]]$$"},{"n":4,"statement":"Quelle formule permet de calculer la moyenne d’une série de valeurs ?&&$$\\text{moyenne}=\\dfrac{\\text{somme des valeurs}}{\\text{nombre de valeurs}}$$&&$$\\text{moyenne}=\\dfrac{\\text{nombre de valeurs}}{\\text{somme des valeurs}}$$&&$$\\text{moyenne}=\\text{plus grande valeur}-\\text{plus petite valeur}$$&&$$\\text{moyenne}=\\text{somme des valeurs}+\\text{nombre de valeurs}$$&&","answer":"[\"1\"]","options":{"shuffle_answers":true},"footer":"[[qcm1]]"},{"n":5,"statement":"La moyenne des quatre nombres $$${a}$$, $$${b}$$, $$${c}$$ et $$x$$ est $$${m}$$.<br>Calcule la valeur de $$x$$.","answer":"[\"x\"]","options":{"formula_code":"setNB(1)\nm=RD(8,18)\nd1=RD(1,4)\nd2=RD(1,4)\na=m+d1\nb=m-d1\nc=m+d2\nx=m-d2"},"footer":"$$x=[[formula]]$$"},{"n":6,"statement":"Une série de $$${n}$$ valeurs a pour somme $$${s}$$.<br>Exprime sa moyenne.","answer":"[\"m\"]","options":{"formula_code":"setNB(1)\nn=RD(3,9)\nm=RD(4,20)\ns=n*m"},"footer":"$$\\text{moyenne}=[[formula]]$$"},{"n":7,"statement":"La moyenne de $$${n}$$ valeurs est $$${m}$$.<br>Quelle est la somme de ces $$${n}$$ valeurs ?","answer":"[\"n*m\"]","options":{"formula_code":"setNB(1)\nn=RD(3,10)\nm=RD(5,18)"},"footer":"$$\\text{somme}=[[formula]]$$"},{"n":8,"statement":"Toutes les valeurs d’une série sont comprises entre $$${mini}$$ et $$${maxi}$$.<br>La moyenne de cette série peut-elle être égale à $$${val}$$ ?&&Oui&&Non&&On ne peut pas savoir&&","answer":"[\"2\"]","options":{"formula_code":"setNB(1)\nmini=RD(2,8)\nmaxi=mini+RD(4,8)\nval=maxi+RD(1,4)","shuffle_answers":true},"footer":"[[formula_qcm1]]"},{"n":9,"statement":"On a demandé à des familles le nombre d’enfants qu’elles ont. Les résultats sont donnés dans le tableau :\n\n<table style=\"borde function configureDecimalComparisonModule(){
  const mod=RAW_MODULES.find(m=>m.id==='dnb_02');
  if(!mod) return;
  [1,2].forEach(n=>{
    const q=mod.questions.find(item=>item.n===n);
    if(q) q.statement=q.statement.replace('Dire quel est le plus grand nombre parmi les trois nombres suivants :','Parmi ces nombres, lequel est le plus grand ?');
  });
}
configureDecimalComparisonModule();

function configureSquaresModule(){
  const mod=RAW_MODULES.find(m=>m.id==='dnb_07');
  if(!mod) return;
  const q=n=>mod.questions.find(item=>item.n===n);

  [1,2].forEach(n=>{
    q(n).statement=q(n).statement.replace('Donne le carré de ce nombre :','Donne le carré de ${n} :');
    q(n).footer='$$${n}^2=[[dots]]$$';
  });

  [3,4].forEach(n=>{
    q(n).footer='$$[[dots]]^2=${c}$$';
  });

  q(5).statement=q(5).statement.replace("Complète l'égalité :","Complète l'égalité avec deux nombres entiers :");
  q(5).footer='$$${c}=[[dots]]\\times[[dots]]$$';

  q(9).footer='$$${expr}=[[dots]]$$';

  q(8).options.formula_code='setNB(1)\nn=RD(5,12)\nc=n*n\nlow=floor(c/10)*10\nhigh=low+10\nlow2=low-10\nwrong=2*n\nnlow=floor(wrong/10)*10\nnhigh=nlow+10';
}
configureSquaresModule();

function configureRelationsModule(){
  const mod=RAW_MODULES.find(m=>m.id==='dnb_09');
  if(!mod) return;
  const q=n=>mod.questions.find(item=>item.n===n);

  // Le carré isolé est déjà travaillé dans le module 07. Il reste présent
  // dans la question récapitulative n°1, conformément à la liste DNB.
  mod.questions=mod.questions.filter(item=>item.n!==7);

  q(1).options={...q(1).options,relation_kind:'summary'};
  q(2).options={...q(2).options,relation_kind:'multiple_direct',factor:2};
  q(3).options={...q(3).options,relation_kind:'multiple_direct',factor:3};
  q(4).options={...q(4).options,relation_kind:'fraction_direct',divisor:2};
  q(5).options={...q(5).options,relation_kind:'predecessor'};
  q(6).options={...q(6).options,relation_kind:'successor'};

  // Les relations littérales sont séparées pour être toutes proposées avec
  // la même fréquence dans le tirage du module.
  q(8).statement='Quelle expression correspond à la relation demandée ?';
  q(8).answer='[]';
  q(8).footer='';
  q(8).options={relation_kind:'expression_qcm',expression_target:'double'};

  q(9).options={...q(9).options,relation_kind:'multiple_inverse',factor:2};
  // Le petit problème reste inchangé dans son énoncé ; il reçoit seulement
  // le même schéma du triple que le calcul direct.
  q(10).options={...q(10).options,relation_kind:'multiple_direct',factor:3};

  mod.questions.push({
    n:11,
    statement:'Calcule le quadruple de ce nombre :',
    answer:'["4*n"]',
    options:{formula_code:'setNB(1)\nn=RD(5,30)',relation_kind:'multiple_direct',factor:4},
    footer:'$$\\text{quadruple de }${n}=[[formula]]$$'
  });
  mod.questions.push({
    n:12,
    statement:'Calcule la moitié de ce nombre impair :',
    answer:'["n/2"]',
    options:{formula_code:'setNB(1)\nn=2*RD(2,24)+1',relation_kind:'fraction_direct',divisor:2},
    footer:'$$\\text{moitié de }${n}=[[formula]]$$'
  });
  mod.questions.push({
    n:13,
    statement:'Calcule le quart de ce nombre :',
    answer:'["n/4"]',
    options:{formula_code:'setNB(1)\nn=4*RD(2,25)',relation_kind:'fraction_direct',divisor:4},
    footer:'$$\\text{quart de }${n}=[[formula]]$$'
  });

  [
    [14,'triple'],[15,'quadruple'],[16,'half'],[17,'quarter'],
    [18,'predecessor'],[19,'successor']
  ].forEach(([n,target])=>mod.questions.push({
    n,
    statement:'Quelle expression correspond à la relation demandée ?',
    answer:'[]',
    options:{relation_kind:'expression_qcm',expression_target:target},
    footer:''
  }));
}
configureRelationsModule();

function configureFractionPercentModule(){
  const mod=RAW_MODULES.find(m=>m.id==='dnb_04');
  if(!mod) return;
  const q=n=>mod.questions.find(item=>item.n===n);

  [1,2,3].forEach(n=>{
    q(n).statement='Calcule :';
    q(n).options={...q(n).options,fraction_percent_category:'fraction'};
  });
  [[4,100],[5,50],[6,25],[7,10],[8,1]].forEach(([n,percent])=>{
    q(n).options={...q(n).options,fraction_percent_category:'percent',percent_value:percent};
  });

  q(9).options={
    ...q(9).options,
    fraction_percent_category:'percent',
    percent_dynamic:true,
    formula_code:'setNB(1)\nidx=RD(5)\na=[100,50,25,20,10,1][idx]\nmul=[1,2,4,5,10,100][idx]\nc=RD(2,30)*mul'
  };
  q(10).options={
    ...q(10).options,
    fraction_percent_category:'percent',
    percent_dynamic:true,
    percent_contextual:true,
    formula_code:'setNB(1)\nidx=RD(5)\na=[100,50,25,20,10,1][idx]\nmul=[1,2,4,5,10,100][idx]\nc=RD(2,12)*mul\ncontextIndex=RD(4)'
  };

  if(!q(11)) mod.questions.push({
    n:11,
    statement:'Calcule :',
    answer:'["c/5"]',
    options:{
      formula_code:'setNB(1)\nc=RD(2,50)*5',
      fraction_percent_category:'percent',
      percent_value:20
    },
    footer:'$$20\\%\\text{ de }${c}=[[formula]]$$'
  });

  mod.questions=mod.questions.filter(item=>item.n!==12);
  const displayOrder=[1,2,3,4,5,6,11,7,8,9,10];
  mod.questions.sort((a,b)=>displayOrder.indexOf(a.n)-displayOrder.indexOf(b.n));
}
configureFractionPercentModule();

function configureScientificModule(){
  const mod=RAW_MODULES.find(m=>m.id==='dnb_06');
  if(!mod) return;
  mod.questions
    .filter(q=>q.n<=8)
    .forEach(q=>{ q.footer=q.footer.replace(/\[\[formula\]\]/g,'[[dots]]'); });
  const decimalQuestion=mod.questions.find(q=>q.n===8);
  decimalQuestion.options.formula_code=decimalQuestion.options.formula_code.replace('pow(10,e)','10**e');
  const recognitionQuestion=mod.questions.find(q=>q.n===10);
  if(recognitionQuestion){
    recognitionQuestion.statement="Le nombre $$${m}\\times10^{${e}}$$ est-il écrit en notation scientifique ?&&Oui, c'est une écriture scientifique correcte&&Non, car la partie entière n’est pas comprise entre 1 et 10&&Non, car l'exposant doit être positif&&";
  }

  if(!mod.questions.some(q=>q.n===11)){
    mod.questions.push({
      n:11,
      statement:'Cette notation scientifique correspond à quel nombre décimal ?',
      answer:'["n"]',
      options:{
        formula_code:'setNB(1)\nd=RD(11,99)\nm=d/10\ne=0-RD(2,4)\nn=CUT(m*10**e,8)',
        scientific_kind:'from_scientific'
      },
      footer:'$$${m}\\times10^{${e}}=[[dots]]$$'
    });
  }

  mod.questions.forEach(q=>{
    q.options=q.options||{};
    if(q.n<=7) q.options.scientific_kind='to_scientific';
    if(q.n===8) q.options.scientific_kind='from_scientific';
    if(q.n===9) q.options.scientific_kind='to_scientific_qcm';
    if(q.n===10) q.options.scientific_kind='recognition';
  });
}
configureScientificModule();

let rngSeed=1, quiz=[];
function setSeed(s){ rngSeed=s; }
function rnd(){ rngSeed=(rngSeed*9301+49297)%233280; return rngSeed/233280; }
function RD(a,b,excluded){ let min,max; if(b===undefined){min=0;max=a;} else {min=a;max=b;} let v, tries=0; do{v=Math.floor(rnd()*(max-min+1))+min; tries++;}while(Array.isArray(excluded)&&excluded.includes(v)&&tries<200); return v; }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function setNB(n){ return n; }
function GCD(a,b){ a=Math.abs(Math.trunc(a)); b=Math.abs(Math.trunc(b)); while(b){ const t=b; b=a%b; a=t; } return a||1; }
function CUT(x,d){ return Number(Number(x).toFixed(d===undefined?2:d)); }
const MATHS = {floor:Math.floor, ceil:Math.ceil, round:Math.round, sin:Math.sin, cos:Math.cos, tan:Math.tan, atan2:Math.atan2, sqrt:Math.sqrt, abs:Math.abs, pi:Math.PI, PI:Math.PI};
function cleanEvalExpr(expr){ return String(expr).replace(/(\d),(\d)/g,'$1.$2'); }
function evalInScope(expr, scope){
  expr=cleanEvalExpr(expr);
  const target=Object.assign({}, MATHS, {RD,setNB,GCD,CUT}, scope||{});
  const proxy=new Proxy(target,{has:()=>true, get:(t,k)=> k in t ? t[k] : undefined, set:(t,k,v)=>(t[k]=v,true)});
  try{ return Function('scope','with(scope){ return ('+expr+'); }')(proxy); }catch(e){ return expr; }
}
function runCode(code){
  const target=Object.assign({}, MATHS, {RD,setNB,GCD,CUT});
  const proxy=new Proxy(target,{has:()=>true, get:(t,k)=> k in t ? t[k] : undefined, set:(t,k,v)=>(t[k]=v,true)});
  try{ Function('scope','with(scope){ '+code+' }')(proxy); }catch(e){ target.__error=e.message; }
  return target;
}
function fmt(x){ if(typeof x==='number'){ if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x)).replace('.',','); return String(Number(x.toFixed(6))).replace('.',','); } return String(x).replace('.',','); }
function parseAnswer(q, scope){
  let arr=[]; try{ arr=JSON.parse(q.answer||'[]'); }catch(e){ arr=[]; }
  return arr.map(a=>fmt(evalInScope(a, scope)));
}
function expandGeneratedValue(value, scope){
  if(typeof value!=='string') return fmt(value);
  return value.replace(/\{([A-Za-z_]\w*)\}/g,(m,name)=>

}

function latexCore(s){
  s=String(s ?? '');

  // Environnements alignés utilisés dans les résolutions d'équations.
  s=s.replace(/\\begin\{aligned\}/g,'<span class="aligned-math">')
     .replace(/\\end\{aligned\}/g,'</span>')
     .replace(/\\\\/g,'<br>')
     .replace(/&/g,'');

    s=s.replace(/\\dfrac\{([^{}]+)\}\{([^{}]+)\}/g,'<span class="frac"><span class="frac-num">$1</span><span class="frac-den">$2</span></span>');

  }

  // Commandes avec un argument.
  s=s.replace(/\\text\{([^{}]*)\}/g,'<span class="math-text">$1</span>')
     .replace(/\\mathcal\{([^{}]+)\}/g,'<span class="mathcal">$1</span>')
     .replace(/\\widehat\{([^{}]+)\}/g,'<span class="widehat">$1</span>');

  // Fonctions, symboles et espacements présents dans les 37 modules.
  s=s.replace(/\\cos/g,'cos')
     .replace(/\\times/g,'×')
     .replace(/\\div/g,'÷')
     .replace(/\\cdot/g,'·')
     .replace(/\\leq/g,'≤')
     .replace(/\\geq/g,'≥')
     .replace(/\\neq/g,'≠')
     .replace(/\\approx/g,'≈')
     .replace(/\\sqrt/g,'√')
     .replace(/\\pi/g,'π')
     .replace(/\\circ/g,'°')
     .replace(/\\in/g,'∈')
     .replace(/\\%/g,'%')
     .replace(/\\qquad/g,'<span class="qquad"></span>')
     .replace(/\\quad/g,'<span class="quad"></span>')
     .replace(/\\,/g,' ')
     .replace(/\\;/g,' ');

  // Exposants et indices simples.
  s=s.replace(/\^\{([^{}]+)\}/g,'<sup>$1</sup>')
     .replace(/\^(-?\d+|[A-Za-z])/g,'<sup>$1</sup>')
     .replace(/_\{([^{}]+)\}/g,'<sub>$1</sub>')
     .replace(/_([A-Za-z0-9])/g,'<sub>$1</sub>');

}

function renderMathSegments(html){

function renderPlaceholders(str,answers,mode){
  let answerIndex=0;
  let tokenIndex=0;
  const replacements=new Map();

  function tokenFor(content){
    const token='@@PH'+(tokenIndex++)+'@@';
    replacements.set(token,content);
    return token;
  }

  function nextAnswer(){
    const value=answers[answerIndex]!==undefined ? answers[answerIndex] : (answers[0]||'');
    answerIndex++;
    return String(value);
  }

  function answerSlot(value,small=false){
    const length=Math.max(1,Array.from(String(value)).length);
    const minimum=small?.9:1.05;
    const maximum=small?5:10;
    const width=Math.max(minimum,Math.min(maximum,length*.58+.35));
    const classes='answer-slot'+(small?' answer-slot-small':'')+(mode==='correction'?' answer-slot-filled':'');
    const content=mode==='question'
      ? '<span class="answer-dots">…</span>'
      : '<strong>'+escapeHtml(value)+'</strong>';
    return '<span class="'+classes+'" style="--answer-width:'+width.toFixed(2)+'em">'+content+'</span>';
  }

  let out=String(str||'').replace(/\[\[([^\]]+)\]\]/g,(m,name)=>{
    if(name.includes('qcm')) return '';

    if(name==='dots'){
      return tokenFor(answerSlot(nextAnswer()));
    }

    // Ces deux widgets représentent une fraction complète avec un seul placeholder.
    if(name==='formula_frac' || name==='frac-simp'){
      const num=nextAnswer();
      const den=nextAnswer();
      const n=tokenFor(answerSlot(num,true));
      const d=tokenFor(answerSlot(den,true));
      return '\\dfrac{'+n+'}{'+d+'}';
    }

    return tokenFor(answerSlot(nextAnswer()));
  });

  out=renderMathSegments(out);
  for(const [token,replacement] of replacements){
    out=out.split(token).join(replacement);
  }
  return out;
}
function shuffledQcm(statement, answers){
  const parts=String(statement||'').split('&&');
  if(parts.length<=1) return {statement,answers};
  const prompt=parts[0];
  const opts=parts.slice(1).map(s=>s.trim()).filter(Boolean);
  const permutation=opts.map((_,i)=>i);
  for(let i=permutation.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));
    [permutation[i],permutation[j]]=[permutation[j],permutation[i]];
  }
  const shuffled=permutation.map(i=>opts[i]);
  const remapped=answers.map(a=>{
    const oldIndex=Number(a)-1;
    const newIndex=permutation.indexOf(oldIndex);
    return newIndex>=0 ? String(newIndex+1) : String(a);
  });
  return {statement:prompt+'&&'+shuffled.join('&&')+'&&',answers:remapped};
}

2. une seule nature, avec annulation ;
3. plusieurs natures, sans annulation ;
4. plusieurs natures, avec annulation ;

function makeOneNoCancel(){
  const type=pick(['x2','x','u']);
  for(let tries=0;tries<500;tries++){
    const sign=pick([-1,1]);
    const count=RD(2,3);
    const groups=[];
    for(let i=0;i<count;i++){
      groups.push({type,coeff:sign*RD(1,typeLimit(type))});
    }
    if(validTileLoad(groups)) return groups;
  }
  return [{type,coeff:1},{type,coeff:1}];
}

function makeOneCancel(){

    const groups=[];
    for(let i=0;i<count;i++){

    }

  }

}

function makeMultiNoCancel(){
  for(let tries=0;tries<700;tries++){
    const typeCount=pick([2,3]);
    const types=shuffleLocal(['x2','x','u']).slice(0,typeCount);
    const groupCount=RD(typeCount+1,Math.min(5,typeCount+2));
    const sequence=distributeGroups(types,groupCount);
    const signs={};
    types.forEach(type=>{signs[type]=pick([-1,1]);});
    const groups=sequence.map(type=>({
      type,

    if(hasRepeatedNature(groups) && validTileLoad(groups)) return shuffleLocal(groups);
  }

    {type:'u',coeff:-2},
    {type:'x2',coeff:2}
  ];
}

function makeMultiCancel(){

function simpleQcmGroups(kind){
  const type=pick(['x','x2']);
  const lim=typeLimit(type);

  if(kind==='one_no_cancel'){
    for(let tries=0;tries<300;tries++){
      const a=RD(1,lim);

      const groups=[{type,coeff:a},{type,coeff:b}];

    }

function qcmPowerError(coefficient,type){
  const a=Math.abs(coefficient);
  const sign=coefficient<0?'-':'';
  const body=type==='x2'?'𝑥^4':'𝑥^2';
  return sign+(a===1?'':String(a))+body;
}

function qcmMonomial(coefficient,power){

function makeAlreadyReducedQcm(groups){
  const powers={u:0,x:1,x2:2};
  const correct=expressionLatex(groups);
  const a=groups[0].coeff,b=groups[1].coeff,sum=a+b;
  const ordered=[...groups].sort((g1,g2)=>powers[g1.type]-powers[g2.type]);
  const low=ordered[0].type,high=ordered[1].type;
  const distractors=[
    qcmSamePower(sum,high),
    low==='u'?String(sum):qcmSamePower(sum,low),
    qcmMonomial(a*b,powers[groups[0].type]+powers[groups[1].type])
  ];
  const unique=[correct];
  distractors.forEach(option=>{if(option!==correct&&!unique.includes(option)) unique.push(option);});
  let bump=1;
  while(unique.length<4){
    const fallback=qcmSamePower(sum+bump,high);
    if(!unique.includes(fallback)) unique.push(fallback);
    bump++;
  }
  const options=shuffleLocal(unique.slice(0,4));
  return {options,correctIndex:String(options.indexOf(correct)+1)};
}

function makeSimpleReductionQcm(groups){
  const type=groups[0].type;
  const a=groups[0].coeff;
  const b=groups[1].coeff;
  const isAddition=(a>0 && b>0);

  const correctCoeff=a+b;
  const correct=qcmSamePower(correctCoeff,type);
  let distractors=[];

  if(isAddition){
    distractors=[
      qcmPowerError(correctCoeff,type),
      qcmSamePower(a*b,type),
      qcmProductError(a,b,type)
    ];
  } else {
    const positiveA=Math.abs(a);
    const positiveB=Math.abs(b);
    distractors=[
      qcmSamePower(positiveA+positiveB,type),
      qcmPowerError(correctCoeff,type),
      qcmProductError(a,b,type)
    ];
  }

  const unique=[correct];
  distractors.forEach(option=>{
    if(option!==correct && !unique.includes(option)) unique.push(option);
  });

  let bump=1;
  while(unique.length<4){
    const fallback=qcmSamePower(correctCoeff+bump,type);
    if(!unique.includes(fallback)) unique.push(fallback);
    bump++;
  }

  const options=shuffleLocal(unique.slice(0,4));
  return {
    options,
    correctIndex:String(options.indexOf(correct)+1)
  };
}

function makeSolidsInstance(mod,q){
  const meta=q.options||{};
  let prompt=q.statement||'';
  let correct='';
  let distractors=[];

  if(meta.solid_kind==='count'){
    const elementIndex=Number.isInteger(meta.solid_element_index)
      ? meta.solid_element_index
      : RD(0,2);
    const elementQuestions=[
      'Combien de sommets possède ce solide ?',
      'Combien d’arêtes possède ce solide ?',
      'Combien de faces possède ce solide ?'
    ];
    correct=Number(meta.solid_counts[elementIndex]);
    prompt='<div class="solid-prompt">'+elementQuestions[elementIndex]+'</div>'+prompt;

    const closeValues=shuffleLocal([correct-1,correct+1,correct-2,correct+2]);
    const widerValues=shuffleLocal([4,5,6,7,8,9,10,11,12]);
    const seen=new Set([correct]);
    [...closeValues,...widerValues].forEach(value=>{
      if(value>0&&!seen.has(value)&&distractors.length<3){
        seen.add(value);
        distractors.push(value);
      }
    });
  }else{
    correct=meta.solid_answer;
    distractors=shuffleLocal(SOLID_NAMES.filter(name=>name!==correct)).slice(0,3);
  }

  const qcmOptions=shuffleLocal([correct,...distractors]);
  const correctIndex=String(qcmOptions.indexOf(correct)+1);
  return {
    module:mod,
    q,
    scope:{},
    answers:[correctIndex],
    rawStatement:prompt+'&&'+qcmOptions.join('&&')+'&&',
    rawFooter:'',
    hasSvg:true
  };
}

function scientificFormattedNumber(value){
  const raw=fmt(value);
  const sign=raw.startsWith('-')?'-':'';
  const unsigned=sign?raw.slice(1):raw;
  const parts=unsigned.split(',');
  const grouped=(parts[0]||'0').replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');
  return sign+grouped+(parts.length>1?','+parts.slice(1).join(','):'');
}
function scientificFirstNonZeroData(value){
  const number=Number(value);
  const absolute=Math.abs(number);
  if(!Number.isFinite(absolute)||absolute===0){
    const formatted=scientificFormattedNumber(value);
    return {digit:0,exponent:0,placeValue:0,formatted,highlighted:escapeHtml(formatted)};
  }
  const exponent=Math.floor(Math.log10(absolute)+1e-12);
  const digit=Math.floor(absolute/(10**exponent)+1e-10);
  const placeValue=CUT(digit*(10**exponent),Math.max(0,-exponent));
  const formatted=scientificFormattedNumber(value);
  let highlighted='',done=false;
  for(const char of formatted){
    if(!done&&/[1-9]/.test(char)){
      highlighted+='<span class="scientific-digit-marker">'+escapeHtml(char)+'</span>';
      done=true;
    }else highlighted+=escapeHtml(char);
  }
  return {digit,exponent,placeValue,formatted,highlighted};
}
function scientificPlaceHelp(value,correction=false){
  const data=scientificFirstNonZeroData(value);
  const placeData=scientificFirstNonZeroData(data.placeValue);
  const shownExponent=correction?String(data.exponent):'...';
  return '<div class="scientific-help scientific-place-help" role="img" aria-label="Valeur de position du premier chiffre non nul">'
    +'<div class="scientific-place-equation">'+placeData.highlighted
    +' = '+data.digit+' × 10<sup>'+shownExponent+'</sup></div>'
    +'</div>';
}
function scientificPowerLabel(exponent){
  if(exponent===0) return '1';
  return '10<tspan baseline-shift="super" font-size="10">'+exponent+'</tspan>';
}
function scientificGlideSvg(coefficient,exponent,correction=false){
  const positive=Number(exponent)>0;
  const exponents=positive?[4,3,2,1,0,-1]:[0,-1,-2,-3,-4,-5];
  const x=40,width=600,cellW=width/exponents.length,headY=50,headH=34,rowH=52;
  const startY=headY+headH,targetY=startY+rowH;
  const coefficientText=fmt(coefficient);
  const parts=coefficientText.replace('-','').split(',');
  const digitEntries=[];
  [...(parts[0]||'')].forEach((digit,index)=>digitEntries.push({digit,exponent:index===0?0:-index}));
  [...(parts[1]||'')].forEach((digit,index)=>digitEntries.push({digit,exponent:-1-index}));
  const positionFor=power=>x+(exponents.indexOf(power)+.5)*cellW;
  const direction=positive?'gauche':'droite';
  const arrowStart=positionFor(0),arrowEnd=positionFor(Number(exponent));
  let body='<defs><marker id="scientific-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/></marker></defs>';
  body+='<text x="340" y="17" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#17384d">'+Math.abs(Number(exponent))+' rangs vers la '+direction+'</text>';
  body+='<line x1="'+arrowStart+'" y1="38" x2="'+arrowEnd+'" y2="38" stroke="#111827" stroke-width="4" stroke-linecap="round" marker-end="url(#scientific-arrow)"/>';
  exponents.forEach((power,index)=>{
    const cellX=x+index*cellW;
    body+='<rect x="'+cellX+'" y="'+headY+'" width="'+cellW+'" height="'+headH+'" fill="#f3f7fd" stroke="#9fb3cf" stroke-width="1.3"/>';
    body+='<text x="'+(cellX+cellW/2)+'" y="'+(headY+23)+'" font-family="Arial, sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#60708c">'+scientificPowerLabel(power)+'</text>';
    body+='<rect x="'+cellX+'" y="'+startY+'" width="'+cellW+'" height="'+rowH+'" fill="#eaf3ff" stroke="#1f5f99" stroke-width="1.5"/>';
    body+='<rect x="'+cellX+'" y="'+targetY+'" width="'+cellW+'" height="'+rowH+'" fill="'+(correction?'#ecfdf5':'#fbfdff')+'" stroke="'+(correction?'#10b981':'#9fb3cf')+'" stroke-width="1.5"'+(correction?'':' stroke-dasharray="5 4"')+'/>';
  });
  const commaX=x+(exponents.indexOf(0)+1)*cellW;
  const commaMark=rowY=>'<circle cx="'+commaX+'" cy="'+(rowY+28)+'" r="3.7" fill="#e86100"/><path d="M '+(commaX+1)+' '+(rowY+31)+' Q '+commaX+' '+(rowY+39)+' '+(commaX-6)+' '+(rowY+42)+'" fill="none" stroke="#e86100" stroke-width="3.2" stroke-linecap="round"/>';
  body+=commaMark(startY)+commaMark(targetY);
  digitEntries.forEach(entry=>{
    body+='<text x="'+positionFor(entry.exponent)+'" y="'+(startY+35)+'" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="28" font-weight="800" text-anchor="middle" fill="#17384d">'+escapeHtml(entry.digit)+'</text>';
  });
  if(correction){
    const targetDigits=new Map();
    digitEntries.forEach(entry=>targetDigits.set(entry.exponent+Number(exponent),entry.digit));
    const targetPowers=[...targetDigits.keys()];
    const highest=Math.max(...targetPowers),lowest=Math.min(...targetPowers);
    if(highest<0){
      for(let power=0;power>highest;power--) targetDigits.set(power,'0');
    }else if(lowest>0){
      for(let power=lowest-1;power>=0;power--) targetDigits.set(power,'0');
    }
    exponents.forEach(power=>{
      if(!targetDigits.has(power)) return;
      body+='<text x="'+positionFor(power)+'" y="'+(targetY+35)+'" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="28" font-weight="850" text-anchor="middle" fill="#087a55">'+escapeHtml(targetDigits.get(power))+'</text>';
    });
  }
  return '<div class="scientific-help scientific-glide-help"><svg class="scientific-glide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-label="Glisse-nombre pour une multiplication par une puissance de dix">'+body+'</svg></div>';
}
function scientificRecognitionHelp(coefficient,correction=false){
  const value=Number(coefficient),valid=value>=1&&value<10;
  return '<div class="scientific-help scientific-condition-help">'
    +'<div class="scientific-condition">1 ≤ <span class="scientific-coefficient '+(correction?(valid?'is-valid':'is-invalid'):'')+'">partie entière</span> &lt; 10</div>'

function renderScientificModule(inst,correction=false,mode=null){
  if(mode===null) mode=document.getElementById('visualMode').value;
  const qcm=splitQCM(inst.rawStatement);
  const kind=inst.q.options&&inst.q.options.scientific_kind;
  let prompt=qcm?qcm.prompt:inst.rawStatement;
  if(kind==='to_scientific_qcm'){
    const data=scientificFirstNonZeroData(inst.scope.n);
    prompt='Quelle est l’écriture scientifique de <span class="math-display scientific-inline-number">'+data.highlighted+'</span> ?';
  }
  let html='<div class="scientific-question"><div class="scientific-prompt">'+renderMathSegments(prompt)+'</div></div>';
  if(!qcm&&inst.rawFooter){
    let footerHtml;
    if(kind==='to_scientific'){
      const data=scientificFirstNonZeroData(inst.scope.n);
      footerHtml=renderPlaceholders('$$@@SCISOURCE@@\\,=\\,[[dots]]\\,\\times\\,10^{[[dots]]}$$',inst.answers,correction?'correction':'question')
        .replace('@@SCISOURCE@@','<span class="scientific-inline-number">'+data.highlighted+'</span>');
    }else if(kind==='from_scientific'){
      footerHtml=renderPlaceholders('$$'+scientificFormattedNumber(inst.scope.m)+'\\,\\times\\,10^{'+inst.scope.e+'}\\,=\\,[[dots]]$$',inst.answers,correction?'correction':'question');
    }else footerHtml=renderPlaceholders(inst.rawFooter,inst.answers,correction?'correction':'question');

    html+='<div class="footer scientific-footer">'+footerHtml+'</div>';
  }
  if(!isWithoutVisuals(mode)) html+=scientificVisualHtml(inst,correction);
  else html+=visualPlaceholder(mode);

    const corrects=new Set(inst.answers.map(value=>String(value)));
    html+='<div class="options scientific-options options-'+qcm.opts.length+'">';
    qcm.opts.forEach((option,index)=>{
      const isCorrect=correction&&corrects.has(String(index+1));
      html+='<div class="opt '+(isCorrect?'correct':'')+'"><strong>'+String.fromCharCode(65+index)+'.</strong> '+renderMathSegments(option)+'</div>';
    });

}

function averageBarSegments(items,x,y,width,height,fill,stroke,unknownIndex=-1,correction=false){
  const weights=items.map(item=>Math.max(2,Number(item.value)||0)+2);
  const total=weights.reduce((sum,value)=>sum+value,0)||1;
  let cursor=x,body='';
  items.forEach((item,index)=>{
    const w=index===items.length-1?x+width-cursor:width*weights[index]/total;
    const resolved=correction&&index===unknownIndex;
    body+='<rect x="'+cursor+'" y="'+y+'" width="'+w+'" height="'+height+'" fill="'+(resolved?'#ecfdf5':fill)+'" stroke="'+(resolved?'#10b981':stroke)+'" stroke-width="2"/>';
    const shownLabel=item.label==='x'?'𝑥':item.label;
    body+='<text x="'+(cursor+w/2)+'" y="'+(y+height/2+7)+'" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="22" font-weight="700" text-anchor="middle" fill="'+(resolved?'#087a55':'#17384d')+'">'+escapeHtml(shownLabel)+'</text>';
    cursor+=w;
  });
  return body;
}

      {prompt:`Une bibliothèque possède $$${scope.c}$$ livres. $$${percent}\\%$$ sont des bandes dessinées. Combien de bandes dessinées possède-t-elle ?`,unit:'bandes dessinées'},
      {prompt:`Un club sportif compte $$${scope.c}$$ adhérents. $$${percent}\\%$$ pratiquent la natation. Combien d’adhérents pratiquent la natation ?`,unit:'adhérents'},
      {prompt:`Un verger compte $$${scope.c}$$ arbres. $$${percent}\\%$$ sont des pommiers. Combien de pommiers y a-t-il ?`,unit:'pommiers'},
      {prompt:`Une collection contient $$${scope.c}$$ cartes. $$${percent}\\%$$ sont rares. Combien de cartes rares contient-elle ?`,unit:'cartes rares'}
    ];
    const context=contexts[Number(scope.contextIndex)||0];
    rawStatement='<div style="text-align:justify">'+context.prompt+'</div>';
    rawFooter='$$[[formula]]\\text{ '+context.unit+'}$$';
  }

  return {module:mod,q,scope,answers,rawStatement,rawFooter,hasSvg:false,fractionPercent};
}

function makeAngleSumInstance(mod,q){
  const scope=q.options&&q.options.formula_code?runCode(q.options.formula_code):{};
  let answers=parseAnswer(q,scope);
  let rawStatement=subVars(q.statement||'',scope);
  const rawFooter=subVars(q.footer||'',scope);
  if(q.options&&q.options.shuffle_answers){
    const shuffled=shuffledQcm(rawStatement,answers);
    rawStatement=shuffled.statement;
    answers=shuffled.answers;
  }
  const kind=q.options&&q.options.angle_sum_kind;
  let bar=null;
  if(kind==='general'){
    const third=180-Number(scope.a)-Number(scope.b);
    bar={values:[Number(scope.a),Number(scope.b),third],unknown:[2]};
  }
  if(kind==='right'){
    bar={values:[90,Number(scope.a),90-Number(scope.a)],unknown:[2]};
  }
  if(kind==='isosceles_vertex'){
    const base=(180-Number(scope.a))/2;
    bar={values:[Number(scope.a),base,base],unknown:[1,2]};
  }
  if(kind==='isosceles_base'){
    bar={values:[Number(scope.a),Number(scope.a),180-2*Number(scope.a)],unknown:[2]};
  }
  if(kind==='equilateral'){
    bar={values:[60,60,60],unknown:[0,1,2]};
  }
  if(kind==='validity_three'||kind==='figure'){
    bar={values:[Number(scope.a),Number(scope.b),Number(scope.c)],unknown:kind==='figure'?[2]:[]};
  }
  if(kind==='invalid_two'){
    bar={values:[Number(scope.a),Number(scope.b)],unknown:[],comparison:true};
  }
  return {module:mod,q,scope,answers,rawStatement,rawFooter,hasSvg:/<svg/i.test(rawStatement+rawFooter),angleSum:{kind,bar}};
}

function makeEvolutionInstance(mod,q){
  const scope=q.options&&q.options.formula_code?runCode(q.options.formula_code):{};
  let answers=parseAnswer(q,scope);
  let rawStatement=subVars(q.statement||'',scope);
  const rawFooter=subVars(q.footer||'',scope);
  if(q.options&&q.options.shuffle_answers){
    const shuffled=shuffledQcm(rawStatement,answers);
    rawStatement=shuffled.statement;
    answers=shuffled.answers;
  }

  const n=Number(q.n),kind=q.options&&q.options.evolution_kind;
  const increase=String(kind||'').startsWith('increase');
  const percent=Number(scope.p);
  const normalized=kind==='increase_coefficient'||kind==='decrease_coefficient';
  const initial=normalized?1:Number(n===3||n===4?scope.n:(n===10?scope.qte:scope.prix));
  const amount=initial*percent/100;
  const newTotal=increase?initial+amount:initial-amount;
  const unitPercent=GCD(100,percent);
  const baseCells=100/unitPercent;
  const deltaCells=percent/unitPercent;
  const cellValue=initial/baseCells;
  const evolution={
    kind,
    direction:increase?'increase':'decrease',
    percent,
    initial,
    amount,
    newTotal,
    normalized,
    baseCells,
    deltaCells,
    cellValue,
    braceMode:kind==='increase_amount'?'amount':(normalized?'coefficient':(increase?'newTotal':'remainder'))
  };
  return {module:mod,q,scope,answers,rawStatement,rawFooter,hasSvg:false,evolution};
}

function makeRelationInstance(mod,q){
  if(q.options&&q.options.relation_kind==='expression_qcm'){
    const qcm=relationExpressionChoices(q.options.expression_target);
    return {
      module:mod,q,scope:{},answers:[String(qcm.correctIndex)],
      rawStatement:qcm.prompt,rawFooter:'',hasSvg:false,
      relation:{kind:'expression_qcm',qcm}
    };
  }
  let scope={};
  if(q.options&&q.options.formula_code) scope=runCode(q.options.formula_code);
  let answers=parseAnswer(q,scope);
  let rawStatement=subVars(q.statement||'',scope);
  const rawFooter=subVars(q.footer||'',scope);
  if(q.options&&q.options.shuffle_answers){
    const shuffled=shuffledQcm(rawStatement,answers);
    rawStatement=shuffled.statement;
    answers=shuffled.answers;
  }
  const relationKind=q.options&&q.options.relation_kind;
  let relation=null;
  if(relationKind==='summary') relation={kind:relationKind,value:Number(scope.n)};
  if(relationKind==='multiple_direct') relation={kind:relationKind,factor:Number(q.options.factor),value:Number(scope.n),result:Number(scope.n)*Number(q.options.factor)};
  if(relationKind==='multiple_inverse') relation={kind:relationKind,factor:Number(q.options.factor),value:Number(scope.n),result:Number(scope.c)};
  if(relationKind==='fraction_direct') relation={kind:relationKind,divisor:Number(q.options.divisor),value:Number(scope.n),result:Number(scope.n)/Number(q.options.divisor)};
  if(relationKind==='predecessor') relation={kind:relationKind,value:Number(scope.n),result:Number(scope.n)-1};
  if(relationKind==='successor') relation={kind:relationKind,value:Number(scope.n),result:Number(scope.n)+1};
  return {module:mod,q,scope,answers,rawStatement,rawFooter,hasSvg:false,relation};
}

function makeInstance(mod,q){
  if(mod&&mod.id==='dnb_01') return makeModule01Instance(mod,q);
  if(mod&&mod.id==='dnb_04') return makeFractionPercentInstance(mod,q);

}
function compactQcmClass(options){
  if(!Array.isArray(options) || options.length!==4) return '';
  const allShort=options.every(option=>{
    const visible=String(option)
      .replace(/<[^>]*>/g,' ')
      .replace(/\$\$/g,'')
      .replace(/\\[a-zA-Z]+/g,'x')
      .replace(/[{}]/g,'')
      .replace(/\s+/g,' ')
      .trim();
    return visible.length<=12;
  });
  return allShort?' options-compact':'';
}
function renderGenericQuestion(inst, correction=false, mode=null){
  if(mode===null) mode=document.getElementById('visualMode').value;
  let statement=inst.rawStatement;
  let footer=inst.rawFooter;
  if(isWithoutVisuals(mode)){
    const keepPlaceholder=mode==='without-reveal';

  }
  const qcm=splitQCM(statement);

    html += '<div class="options options-'+qcm.opts.length+compactQcmClass(qcm.opts)+'">';

  }
  if(footer) html += '<div class="footer">'+renderPlaceholders(footer, inst.answers, correction?'correction':'question')+'</div>';
  return html;
}

function fractionPercentPalette(data){
  if(data.kind==='fraction'){
    if([2].includes(data.denominator)) return {fill:'#fff4c9',stroke:'#8a7420'};
    if([3,6].includes(data.denominator)) return {fill:'#fde5eb',stroke:'#9b455f'};
    if([4,8].includes(data.denominator)) return {fill:'#e5f5e4',stroke:'#477a45'};
    if(data.denominator===5) return {fill:'#e4f0f9',stroke:'#35658c'};
    return {fill:'#f2e9fb',stroke:'#6b4c91'};
  }
  if(data.percent===50) return {fill:'#fff4c9',stroke:'#8a7420'};
  if(data.percent===25) return {fill:'#e5f5e4',stroke:'#477a45'};
  if(data.percent===20) return {fill:'#e4f0f9',stroke:'#35658c'};
  if(data.percent===10) return {fill:'#fff0df',stroke:'#a55f1a'};
  if(data.percent===1) return {fill:'#f1e7fb',stroke:'#72509a'};
  return {fill:'#eef1f7',stroke:'#4f6078'};
}

  };
  const percentStrongFill=percent=>percent===50?'#ffe36d':(percent===25?'#91d88e':(percent===20?'#8fc8ed':(percent===10?'#f6b36a':(percent===1?'#c3a1e5':'#b9cce8'))));

      labels+=fractionQuantityLabel(mid,y+20,data.numerator,divisor,data.total,palette.stroke);
    }
  }else{
    labels+=text(x+width/2,topY+topH/2,correction?fmt(data.total):'100 %',25,850);
    for(let i=0;i<divisor;i++){
      fills+=`<rect x="${x+i*cellW}" y="${bottomY}" width="${cellW}" height="${bottomH}" fill="${i===0?percentStrongFill(data.percent):palette.fill}"/>`;
      if(divisor<=10){

  // Une seule grille est tracée par-dessus les fonds : aucune bordure commune

function evolutionBarSvg(data,correction=false){
  const W=1120,x=60,available=900,topY=20,topH=68,bottomY=88,bottomH=68;
  const increase=data.direction==='increase';
  const totalCells=increase?data.baseCells+data.deltaCells:data.baseCells;
  const baseW=increase?available*data.baseCells/totalCells:available;
  const bottomW=increase?available:baseW;
  const cellW=baseW/data.baseCells;
  const border='#18223d';
  const increaseFill='#f9b35e';
  const decreaseFill=data.percent===50?'#ffe36d':(data.percent===25?'#91d88e':'#9ed6f4');
  const mainFill=increase?increaseFill:decreaseFill;
  const neutralFill=increase?'#fff7ee':'#fffdf3';
  const braceY=164;
  const H=correction?238:172;
  const text=(cx,cy,value,size=22,weight=800,fill=border)=>`<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="${size}" font-weight="${weight}" fill="${fill}">${escapeHtml(value)}</text>`;
  let body='<defs><pattern id="evolution-hatch" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fff8fa"/><line x1="0" y1="0" x2="0" y2="18" stroke="#ffb8c6" stroke-width="4"/></pattern></defs>';
  body+=`<rect x="${x}" y="${topY}" width="${baseW}" height="${topH}" fill="${increase?'#fff6eb':'#fffbea'}"/>`;

  const removedStart=data.baseCells-data.deltaCells;
  for(let i=0;i<totalCells;i++){
    const changed=increase?i>=data.baseCells:i>=removedStart;
    let fill=mainFill;
    if(changed&&!correction) fill=neutralFill;
    if(changed&&correction&&!increase) fill='url(#evolution-hatch)';
    body+=`<rect x="${x+i*cellW}" y="${bottomY}" width="${cellW}" height="${bottomH}" fill="${fill}"/>`;
  }

  body+=`<path d="M ${x} ${bottomY} V ${topY} H ${x+baseW} V ${bottomY}" fill="none" stroke="${border}" stroke-width="2.6"/><rect x="${x}" y="${bottomY}" width="${bottomW}" height="${bottomH}" fill="none" stroke="${border}" stroke-width="2.6"/>`;
  for(let i=1;i<totalCells;i++) body+=`<line x1="${x+i*cellW}" y1="${bottomY}" x2="${x+i*cellW}" y2="${bottomY+bottomH}" stroke="${border}" stroke-width="2.1"/>`;

  const topLabel=data.normalized?'100 % = 1':fmt(data.initial);
  body+=text(x+baseW/2,topY+topH/2,topLabel,data.normalized?22:25,850);
  const cellFont=Math.max(11,Math.min(23,cellW*.34));
  for(let i=0;i<totalCells;i++) body+=text(x+(i+.5)*cellW,bottomY+bottomH/2,correction?fmt(data.cellValue):'...',correction?cellFont:Math.max(13,cellFont),800);

  if(correction){

    if(data.braceMode==='remainder'){
      x2=x+cellW*(data.baseCells-data.deltaCells);
      color='#12b878';
      label='Reste = '+fmt(data.newTotal);
    }else if(data.braceMode==='newTotal'){
      label='Nouveau total = '+fmt(data.newTotal);
    }else if(data.braceMode==='amount'){
      x1=x+baseW;

    }else if(data.braceMode==='coefficient'){
      if(!increase) x2=x+cellW*(data.baseCells-data.deltaCells);
      color=increase?'#4778ff':'#12b878';
      label='Coefficient = '+fmt(data.newTotal);
    }
    body+=evolutionBraceSvg(x1,x2,braceY,color,label,W);
  }
  return `<div class="evolution-help${totalCells>13?' evolution-help-scroll':''}"><svg class="evolution-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schéma en barres d’une évolution en pourcentage">${body}</svg></div>`;

function relationPalette(kind,size){
  if(kind==='multiple'&&size===2) return {fill:'#fff7d6',stroke:'#8a7420'};
  if(kind==='multiple'&&size===3) return {fill:'#fde5eb',stroke:'#9b455f'};
  if(kind==='multiple'&&size===4) return {fill:'#e6f5e4',stroke:'#477a45'};
  if(kind==='fraction'&&size===2) return {fill:'#fff7d6',stroke:'#8a7420'};
  if(kind==='fraction'&&size===4) return {fill:'#e6f5e4',stroke:'#477a45'};
  return {fill:'#e7f1fb',stroke:'#35658c'};
}

function relationBarSvg(data,correction=false){
  const x=60,width=640,topY=28,topH=70,bottomY=98,bottomH=70;
  const text=(x,y,value,size=24,weight=800)=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" font-size="${size}" font-weight="${weight}" fill="#17283f">${escapeHtml(value)}</text>`;
  let body='';

  if(data.kind==='multiple_direct'||data.kind==='multiple_inverse'){
    const factor=data.factor;
    const palette=relationPalette('multiple',factor);
    const names={2:'LE DOUBLE',3:'LE TRIPLE',4:'LE QUADRUPLE'};
    const cellW=width/factor;
    body+=`<rect x="${x}" y="${topY}" width="${width}" height="${topH}" fill="${palette.fill}" stroke="#222" stroke-width="2"/>`;
    body+=text(x+width/2,topY+topH/2,correction?fmt(data.result):names[factor],25,850);
    for(let i=0;i<factor;i++){
      body+=`<rect x="${x+i*cellW}" y="${bottomY}" width="${cellW}" height="${bottomH}" fill="${i===0?palette.fill:'#fff'}" stroke="#222" stroke-width="2" ${i===0?'':'stroke-dasharray="8 6"'}/>`;
      if(correction) body+=text(x+(i+.5)*cellW,bottomY+bottomH/2,fmt(data.value),21,800);
    }
    if(!correction) body+=text(x+cellW/2,bottomY+bottomH/2,'la quantité',Math.min(21,Math.max(15,180/cellW*18)),780);
  }

  if(data.kind==='fraction_direct'){
    const divisor=data.divisor;
    const palette=relationPalette('fraction',divisor);
    const names={2:'la moitié',4:'le quart'};
    const cellW=width/divisor;
    body+=`<rect x="${x}" y="${topY}" width="${width}" height="${topH}" fill="${palette.fill}" stroke="#222" stroke-width="2"/>`;
    body+=text(x+width/2,topY+topH/2,correction?fmt(data.value):'LE TOUT',25,850);
    for(let i=0;i<divisor;i++){
      body+=`<rect x="${x+i*cellW}" y="${bottomY}" width="${cellW}" height="${bottomH}" fill="${i===0?palette.fill:'#fff'}" stroke="#222" stroke-width="2"/>`;
      if(correction) body+=text(x+(i+.5)*cellW,bottomY+bottomH/2,fmt(data.result),divisor===4?20:22,800);
    }
    if(!correction) body+=text(x+cellW/2,bottomY+bottomH/2,names[divisor],divisor===4?18:21,780);
  }

  if(data.kind==='predecessor'||data.kind==='successor'){
    const palette=relationPalette('neighbor',1),unitW=82,mainW=width-unitW;
    const isPredecessor=data.kind==='predecessor';
    const topLabel=correction
      ? fmt(isPredecessor?data.value:data.result)
      : (isPredecessor?'LE NOMBRE : '+fmt(data.value):'LE SUCCESSEUR');
    const bottomLabel=correction
      ? fmt(isPredecessor?data.result:data.value)
      : (isPredecessor?'le prédécesseur':'le nombre : '+fmt(data.value));
    body+=`<rect x="${x}" y="${topY}" width="${width}" height="${topH}" fill="${palette.fill}" stroke="#222" stroke-width="2"/>`;
    body+=text(x+width/2,topY+topH/2,topLabel,25,850);
    body+=`<rect x="${x}" y="${bottomY}" width="${mainW}" height="${bottomH}" fill="${palette.fill}" stroke="#222" stroke-width="2"/>`;
    body+=`<rect x="${x+mainW}" y="${bottomY}" width="${unitW}" height="${bottomH}" fill="#fff" stroke="#222" stroke-width="2"/>`;
    body+=text(x+mainW/2,bottomY+bottomH/2,bottomLabel,22,780);
    body+=text(x+mainW+unitW/2,bottomY+bottomH/2,'1',23,850);
  }

  return `<div class="relation-bar-help"><svg class="relation-bar-svg" viewBox="0 0 760 198" role="img" aria-label="Schéma en barres">${body}</svg></div>`;
}

function relationTileUnit(type,sign=1){
  const positive=sign>0,fill=positive?'#31a98e':'#ef5142';
  const label=type==='n2'?(positive?'𝑛²':'−𝑛²'):(type==='n'?(positive?'𝑛':'−𝑛'):(positive?'1':'−1'));
  // Même géométrie que dans le module Réduction : l'unité mesure un tiers
  // de la longueur de n, et le côté de n² est égal à cette longueur.
  const viewW=type==='u'?32:96,viewH=type==='n2'?96:32;
  const scale=.85,w=Math.round(viewW*scale),h=Math.round(viewH*scale);
  const fs=type==='n2'?27:(type==='n'?24:18),baseline=type==='n2'?50:17;
  return `<svg class="relation-algebra-tile relation-algebra-tile-${type}" viewBox="0 0 ${viewW} ${viewH}" width="${w}" height="${h}" aria-hidden="true"><rect x="1" y="1" width="${viewW-2}" height="${viewH-2}" fill="${fill}" stroke="#171717" stroke-width="1.7"/><text x="${viewW/2}" y="${baseline}" dominant-baseline="middle" text-anchor="middle" font-family="Cambria Math,STIX Two Math,Times New Roman,serif" font-size="${fs}" font-weight="700" fill="#111">${label}</text></svg>`;
}

function relationTilesHtml(visual){
  if(!visual) return '';
  if(visual.kind==='fraction'){
    // Une fraction de n garde exactement la géométrie 96 × 32 de la tuile n.
    // Seule la subdivision interne change.
    const width=96,height=32,scale=.85,cellW=width/visual.divisor;
    let cells='';
    for(let i=0;i<visual.divisor;i++) cells+=`<rect x="${i*cellW}" y="0" width="${cellW}" height="${height}" fill="${i===0?'#31a98e':'#fff'}" stroke="#171717" stroke-width="1.5"/>`;
    const cx=cellW/2,fractionSize=visual.divisor===4?9.5:11;
    const fraction=`<text x="${cx}" y="17" text-anchor="middle" dominant-baseline="middle" font-family="Cambria Math,STIX Two Math,Times New Roman,serif" font-size="${fractionSize}" font-style="italic" font-weight="700">n/${visual.divisor}</text>`;
    return `<div class="relation-tile-help"><svg class="relation-algebra-tile relation-algebra-tile-fraction" viewBox="0 0 ${width} ${height}" width="${Math.round(width*scale)}" height="${Math.round(height*scale)}" aria-hidden="true">${cells}${fraction}</svg></div>`;
  }
  let tiles='';
  visual.items.forEach(item=>{for(let i=0;i<item.count;i++) tiles+=relationTileUnit(item.type,item.sign);});
  return `<div class="relation-tile-help">${tiles}</div>`;
}

function relationSummaryItems(value){
  const terms=(...items)=>({kind:'terms',items});
  return [
    {label:'Double',result:2*value,visual:terms({type:'n',count:2,sign:1})},
    {label:'Triple',result:3*value,visual:terms({type:'n',count:3,sign:1})},
    {label:'Moitié',result:value/2,visual:{kind:'fraction',divisor:2}},
    {label:'Prédécesseur',result:value-1,visual:terms({type:'n',count:1,sign:1},{type:'u',count:1,sign:-1})},
    {label:'Successeur',result:value+1,visual:terms({type:'n',count:1,sign:1},{type:'u',count:1,sign:1})},
    {label:'Carré',result:value*value,visual:terms({type:'n2',count:1,sign:1})}
  ];
}
