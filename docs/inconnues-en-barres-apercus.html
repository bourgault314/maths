<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, follow"><title>Aperçus d’Inconnues en barres | maths&amp;go</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>body{margin:0;background:#dfe7ee;color:#16364e;font:15px system-ui,sans-serif}header{padding:12px 18px;background:#fff;display:flex;align-items:center;gap:15px;flex-wrap:wrap}select,button{font:inherit;padding:9px;border:1px solid #b9cbd8;border-radius:6px;background:white}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #7d93a4;background:#fff;transform-origin:top left}p{margin:0}a{color:#135bad}</style></head><body><header><a href="../outils/inconnues-en-barres/">Ouvrir l’application</a><label for="format">Format de l’écran</label><select id="format"><option value="1366,768">Ordinateur 1366 × 768</option><option value="1920,1080">Projection 1920 × 1080</option><option value="1024,768">Projection 4:3</option><option value="390,844">Téléphone 390 × 844</option><option value="844,390">Téléphone paysage</option></select><label for="zoom">Aperçu</label><select id="zoom"><option value="1">100 %</option><option value="0.75">75 %</option><option value="0.5">50 %</option></select><p>La fenêtre de l’application garde les dimensions choisies.</p></header><main><iframe id="apercu" title="Application dans le format choisi" width="1366" height="768" src="../outils/inconnues-en-barres/index.html?ex=IB1-420-15&amp;vue=tout" allow="fullscreen; clipboard-write"></iframe></main><script>const cadre=document.getElementById('apercu');document.getElementById('format').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');cadre.width=w;cadre.height=h;});document.getElementById('zoom').addEventListener('change',e=>cadre.style.transform=`scale(${e.target.value})`);</script></body></html>
