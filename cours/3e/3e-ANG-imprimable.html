/* Moteur commun du livret de cours maths&go — styles (téléphone + impression).
   Tiré de la fiche modèle 4e-TRI-03 (08/11/2026). Ne pas modifier pour une seule fiche :
   un style propre à une fiche va dans son fiche.js (champ css). */
:root{
  --marine:#17324D; --tur:#08A6A6; --turf:#0B6F6D; --tur-cl:#EAF8F7;
  --ora:#F28C28; --oraf:#A85E06; --ora-cl:#FFF3E6; --gris:#F4F7F9; --bord:#cfdde3; --txt2:#3c4b57;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--marine);font-family:"DejaVu Sans Livret","DejaVu Sans",Arial,Helvetica,sans-serif;
  font-size:16px;line-height:1.42;-webkit-print-color-adjust:exact;print-color-adjust:exact}
main{max-width:520px;margin:0 auto;padding:14px 16px 8px}
i.v,.v{font-family:"DejaVu Serif Livret","DejaVu Serif",Georgia,serif;font-style:italic}
.rad{white-space:nowrap}.rad .ri{border-top:1.4px solid currentColor;padding:0 .08em;margin-left:.02em}
/* en-tête */
.haut{border-bottom:2.5px solid var(--tur);padding-bottom:9px}
.chap{font-size:12.5px;font-weight:bold;color:var(--turf);letter-spacing:.05em;text-transform:uppercase}
.niv{display:inline-block;text-transform:none;border:1.4px solid var(--turf);border-radius:4px;padding:0 5px;margin-left:6px;font-size:11.5px;letter-spacing:0}
h1{font-size:19px;line-height:1.24;margin:4px 0 0}
/* titres de parties */
h2{font-size:17.5px;margin:22px 0 10px;padding:6px 10px;background:var(--tur-cl);border-left:4px solid var(--tur);display:flex;align-items:center;gap:8px}
h2 .num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--marine);color:#fff;font-size:13.5px;line-height:1}
h2 .pic{font-size:17px}
/* exemple guidé */
.ex{border:1.6px solid var(--bord);border-radius:12px;padding:10px 12px 12px;margin:0 0 16px}
.ex h3{margin:0;font-size:15px;color:var(--turf)}
.fig{display:block;margin:4px auto 0;width:100%;max-width:250px;height:auto}
.rfig{max-width:240px}
.copie{background:var(--gris);border-left:3px solid var(--tur);border-radius:0 8px 8px 0;padding:6px 10px 7px;margin-top:4px}
.copie .lbl{font-size:12.5px;font-weight:bold;color:var(--txt2);margin-bottom:2px}
.red{display:grid;grid-template-columns:auto auto 1fr;column-gap:.32em;font-size:15.5px;line-height:1.4}
.red .t{grid-column:1/4}
.red .g{text-align:right;white-space:nowrap}.red .s{text-align:center}.red .d{min-width:0}
/* 12/11 (lot T1) : un « = » à côté d'une fraction restait en haut de la ligne ; les trois cases d'une égalité sont centrées
   en hauteur (comme le faisaient déjà les fiches de cosinus pour elles seules) */
.red>.g,.red>.s,.red>.d{align-self:center}
.red .note{font-size:12.5px;color:var(--txt2);font-style:normal;margin-left:.5em;font-family:"DejaVu Sans Livret","DejaVu Sans",Arial,sans-serif}
.red .cache{visibility:hidden}
.pile{display:grid;margin-top:8px}
.pile>.etape{grid-area:1/1;visibility:hidden}
.pile>.etape.on{visibility:visible}
.etape .et{font-size:12.5px;font-weight:bold;color:var(--txt2);letter-spacing:.03em}
.etape .ti{font-weight:bold;font-size:16px;margin:1px 0 3px}
.etape p{margin:0 0 4px;font-size:15.5px;line-height:1.38}
.att{background:var(--ora-cl);border-left:4px solid var(--ora);border-radius:0 8px 8px 0;padding:5px 10px;font-size:15px;line-height:1.36;margin-top:5px}
.att .at{color:var(--oraf);font-weight:bold}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.nav button{white-space:nowrap;font:inherit;font-size:15.5px;font-weight:bold;border-radius:10px;padding:10px 16px;min-height:46px;cursor:pointer;touch-action:manipulation}
.b-ret{background:#fff;color:var(--marine);border:1.6px solid var(--marine)}
.b-ret[disabled]{opacity:.35;cursor:default}
.b-sui{background:var(--marine);color:#fff;border:1.6px solid var(--marine);min-width:168px}
/* je retiens */
.retiens{border:2px solid var(--marine);border-radius:12px;padding:10px 12px 12px}
.pastilles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pa{display:inline-block;font-size:12px;font-weight:bold;letter-spacing:.05em;border-radius:5px;padding:3px 7px}
.pa-jr{background:var(--turf);color:#fff}
.pa-st{background:#fff;color:var(--marine);border:1.6px solid var(--marine)}
.retiens h3{margin:8px 0 0;font-size:17px}
.enon{font-size:16px;margin:6px 0}
.egal{text-align:center;font-size:19px;margin:6px 0 4px;font-weight:bold}
.dit{font-size:14.5px;color:var(--txt2);margin:4px 0 8px}
table.cas{border-collapse:collapse;width:100%;font-size:14.5px}
table.cas td{border:1.3px solid var(--marine);padding:5px 7px;vertical-align:middle}
table.cas td.f{font-size:15.5px;white-space:nowrap;text-align:center}
.ctrl{font-size:14.5px;margin:8px 0 0}
/* rôles de PythaBarre */
.cg{color:#A85E06;font-weight:bold}.cb{color:#11468C;font-weight:bold}.co{color:#0B6F6D;font-weight:bold}
.schemas{display:flex;align-items:center;gap:8px;margin-top:8px}
.schemas .figz{flex:0 0 57%;min-width:0}.schemas .barz{flex:1 1 auto;min-width:0}
svg.tri{display:block;width:100%;height:auto;max-width:250px;margin:0 auto}
.barres{display:flex;flex-direction:column;border:1.6px solid rgba(15,23,42,.45)}
.barres .rang{display:flex;min-height:38px}
.barres .rang+.rang{border-top:1.6px solid rgba(15,23,42,.45)}
.barres .case{display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 3px;font-size:15.5px;line-height:1.15;min-width:0}
.barres .case+.case{border-left:1.6px solid rgba(15,23,42,.45)}
.r-g{background:#FFF3E6}.r-b{background:#E8EFF9}.r-o{background:#EAF8F7}.r-n{background:#fff}
.r-x{background:repeating-linear-gradient(135deg,#eef1f4 0 5px,#c9d1d9 5px 7px);color:#55636f;text-decoration:line-through}
.r-vide{background:#f6f8fa}
.barres.petit{max-width:230px;margin:6px auto 8px}.barres.petit .rang{min-height:30px}.barres.petit .case{font-size:14.5px}
.red .passe{opacity:.5}
.enonce{border:1.6px solid var(--marine);border-radius:8px;padding:6px 10px;margin:6px 0 0;font-size:15.5px;background:#fff}
.retiens .egal .cg,.retiens .egal .cb,.retiens .egal .co{font-weight:bold}
.rfig{display:block;width:100%;max-width:230px;height:auto;margin:4px auto 0}
.carte svg.tri{max-width:170px;margin-top:4px}
.carte .barres.petit{margin:4px 0 6px;max-width:220px}
.pq h4{font-size:15.5px;margin:12px 0 6px;color:var(--turf)}
.niv3{display:inline-block;border:1.4px solid var(--turf);border-radius:4px;padding:0 5px;font-size:11.5px;margin-left:4px}
.deuxfacons{padding-left:20px;margin:0 0 8px}.deuxfacons li{font-size:15.5px;margin-bottom:4px}
.red.preuve{margin:0 0 8px;font-size:15.5px}
/* questions éclair */
.qs{display:flex;flex-direction:column;gap:10px}
.carte{display:grid;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1.6px solid var(--bord);border-radius:12px;padding:9px 12px;cursor:pointer;touch-action:manipulation}
.carte>div{grid-area:1/1}
.carte .rep{visibility:hidden}
.carte.vu{background:var(--tur-cl);border-color:var(--tur)}
.carte.vu .rep{visibility:visible}.carte.vu .qu{visibility:hidden}
.carte .lb{font-size:12.5px;font-weight:bold;color:var(--txt2);letter-spacing:.03em;margin-bottom:2px}
.carte .tx{font-size:15.5px}
.carte .red{font-size:15.5px;line-height:1.45;margin-top:2px}
.aide{font-size:13px;color:var(--txt2);margin:8px 0 0}
/* pourquoi */
details.pq{border:1.6px solid var(--bord);border-radius:12px;padding:0 12px}
details.pq summary{font-weight:bold;font-size:16px;padding:11px 0;cursor:pointer;list-style:none}
details.pq summary::-webkit-details-marker{display:none}
details.pq summary::before{content:"▸ ";color:var(--turf)}
details.pq[open] summary::before{content:"▾ "}
.pq p{font-size:15.5px;margin:0 0 8px}
.figs2{display:flex;gap:10px;justify-content:center;margin:4px 0 8px}
.figs2 figure{margin:0;flex:1 1 0;max-width:180px;text-align:center}
.figs2 figcaption{font-size:12.5px;color:var(--txt2)}
.pq ol{padding-left:22px;margin:0 0 8px}.pq li{font-size:15.5px;margin-bottom:6px}
.concl{font-weight:bold}
/* bas */
.brevet{display:block;margin:18px 0 0;border:1.6px solid var(--marine);border-radius:12px;padding:12px;text-decoration:none;color:var(--marine);font-weight:bold}
.brevet small{display:block;font-weight:normal;color:var(--txt2);font-size:13px}
.outils{text-align:center;margin:14px 0 0}
.outils button{font:inherit;font-size:14px;background:#fff;color:var(--marine);border:1.4px solid var(--bord);border-radius:9px;padding:8px 12px;cursor:pointer}
footer{display:block;margin:18px 0 6px;padding-top:9px;border-top:1px solid #dfe7ec}
.pied{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--txt2)}
footer svg{width:17px;height:17px}
.ids{display:block;text-align:center;font-size:11px;color:#6b7a86;margin-bottom:10px}
.impr{display:none}

<script>
/* ======================================================================
   Moteur commun du livret de cours maths&go (tiré de la fiche modèle 4e-TRI-03, 08/11/2026)
   Une fiche = ses données (fiche.js : FICHE = {...}) ; ce fichier fabrique la page.
   ====================================================================== */

/* ================== Petit balisage ==================
   {AB}        -> lettres de points en italique
   √(74)       -> racine carrée avec sa barre
   <g>…</g>    -> rôle « hypoténuse » / « plus grand côté » (orange)
   <b1>…</b1>  -> rôle « premier côté de l'angle droit » (bleu marine)
   <o>…</o>    -> rôle « second côté de l'angle droit » (turquoise)
   {LK̂M} ou LK̂M (lettre du milieu + U+0302) -> angle, chapeau sur les trois lettres (span.ang)
*/
function m(s){
  s = s.replace(/(\d) (cm|mm|dm|km|m)(?![a-zà-ÿ])/g,'$1 $2').replace(/« /g,'« ').replace(/ ([:;!?»])/g,' $1')
       .replace(/ × /g,' × ').replace(/ ÷ /g,' ÷ ')
       // un calcul ne se coupe pas DEVANT « = », « ≈ », « + », « − » (11/11 : des lignes commençaient par « = ») ; il se coupe après
       // (essayé : « = » insécable des deux côtés → de longues égalités ne tenaient plus sur un téléphone de 360 px)
       .replace(/ ([=≈+−]) /g,' $1 ').replace(/(=|≈|≠) devant/g,'$1 devant').replace(/(\d) (\d{3})(?!\d)/g,'$1 $2');
  return s.replace(/<g>/g,'<span class="cg">').replace(/<\/g>/g,'</span>')
          .replace(/<b1>/g,'<span class="cb">').replace(/<\/b1>/g,'</span>')
          .replace(/<o>/g,'<span class="co">').replace(/<\/o>/g,'</span>')
          .replace(/√\(([^)]+)\)/g,'<span class="rad">√<span class="ri">$1</span></span>')
          .replace(/\{([^}]+)\}/g,'<i class="v">$1</i>')

/* Une ligne de rédaction : texte seul {t}, ou égalité {e:[gauche, signe, droite]} */
function ligne(l, cls){

/* ================== Couleurs ================== */
// rôles fixes (comme PythaBarre), dans les couleurs maths&go : hypoténuse orange, côtés de l'angle droit bleu marine et turquoise
var R = {g:{trait:'#F28C28', fond:'#FFF3E6', txt:'#A85E06'},
         b:{trait:'#3A6FB0', fond:'#E8EFF9', txt:'#11468C'},

var MAR = '#17324D';

/* ================== Triangle ==================
   F = {vb, pts:{A:[x,y]…}, droit:'A' (ou null : aucun angle codé), cotes:{AB:'b', AC:'o', BC:'g'}, noms:{A:[x,y]…},
        longueurs:[{t, x, y, a, cherche, trouve}], aria}

function carreAngle(S, U, V, t){
  function u(P){ var dx=P[0]-S[0], dy=P[1]-S[1], l=Math.hypot(dx,dy); return [dx/l*t, dy/l*t]; }
  var a = u(U), b = u(V);

/* Les côtés ne dépassent pas des sommets (remarque de Gwenaël, 08/11/2026 : « le trait de l'hypoténuse surlignée
   dépasse de chaque côté ») : ils sont découpés par le triangle élargi d'un demi-trait fin (1,5) — angles nets,
   le trait épais (hypoténuse surlignée) déborde vers l'intérieur, jamais au-delà d'un sommet. */
var DECOUPE = 0;
/* polygone convexe élargi de d (chaque côté poussé de d vers l'extérieur) : la découpe des traits (sommets nets) */
function polyElargi(pts, d, limite){
  var n = pts.length, cx = 0, cy = 0;
  pts.forEach(function(p){ cx += p[0]/n; cy += p[1]/n; });
  var L = pts.map(function(a, i){
    var b = pts[(i+1)%n], dx = b[0]-a[0], dy = b[1]-a[1], l = Math.hypot(dx, dy), nx = -dy/l, ny = dx/l;
    if((a[0]-cx)*nx + (a[1]-cy)*ny < 0){ nx = -nx; ny = -ny; }
    return {p:[a[0]+nx*d, a[1]+ny*d], u:[dx/l, dy/l]};
  });

  // (biseau) au lieu de partir en épine loin du sommet (pavé de 3e-PYT-02, lot livret-figures-4)
  var out = [];

    var t = ((D.p[0]-E.p[0])*D.u[1] - (D.p[1]-E.p[1])*D.u[0]) / det;
    var q = [E.p[0]+t*E.u[0], E.p[1]+t*E.u[1]], V = pts[i];
    if(limite && Math.hypot(q[0]-V[0], q[1]-V[1]) > limite*d){
      out.push([E.p[0]-pts[(i+n-1)%n][0]+V[0], E.p[1]-pts[(i+n-1)%n][1]+V[1]], [D.p[0]-V[0]+V[0], D.p[1]-V[1]+V[1]]);
    } else out.push(q);

}
function triangleElargi(pts, d){ return polyElargi(pts, d); }   // Thalès (thFig, thNet) : sans limite, comme validé le 11/11
/* SOMMETS NETS pour une figure dessinée à la main (lot livret-figures-4, 11/11/2026 ; même principe que svgTri et que
   thNet de Thalès) : chaque trait est prolongé de 20 px puis découpé par le polygone convexe élargi d'un demi-trait fin
   (1,5) — angles nets, aucun trait ne dépasse d'un sommet, plus de bout arrondi. poly = sommets du contour (convexe) ;
   traits = [[P, Q, couleur, épaisseur, {a:false (ne pas prolonger en P), b:false (en Q), tirets:true}]…]. On ne prolonge
   pas un trait au bout qui touche la suite d'une même droite (a:false / b:false). */
function traitsNets(poly, traits){
  var id = 'net-'+(++DECOUPE);
  return '<defs><clipPath id="'+id+'"><path d="M'+polyElargi(poly, 1.5, 2.5).map(function(q){ return q[0].toFixed(2)+' '+q[1].toFixed(2); }).join(' L')+' Z"/></clipPath></defs>'+
    // les traits épais d'abord : les traits fins passent par-dessus et finissent nets au sommet (comme svgTri)
    '<g clip-path="url(#'+id+')">'+traits.map(function(T, i){ return [T, i]; }).sort(function(x, y){ return (y[0][3] - x[0][3]) || (x[1] - y[1]); }).map(function(Ti){ var T = Ti[0];
      var P = T[0], Q = T[1], o = T[4] || {}, dx = Q[0]-P[0], dy = Q[1]-P[1], n = Math.hypot(dx, dy) || 1;
      var a = o.a === false ? 0 : 20, b = o.b === false ? 0 : 20;
      var p = [P[0]-dx/n*a, P[1]-dy/n*a], q = [Q[0]+dx/n*b, Q[1]+dy/n*b];
      return '<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="'+T[2]+'" stroke-width="'+T[3]+'" stroke-linecap="butt"'+(o.tirets ? ' stroke-dasharray="'+(o.tirets === true ? '5 4' : o.tirets)+'"' : '')+'/>';
    }).join('')+'</g>';
}
/* LES CÔTÉS DONT PARLE UNE ÉTAPE (st.forts) — la règle est choisie PAR FICHE (FICHE.surlignage, lot livret-figures-4) :
   'gris'  (par défaut : Thalès, trigonométrie) : même épaisseur partout ; ce que l'étape n'utilise pas passe en GRIS ;
   'epais' (Pythagore) : les côtés en jeu sont épaissis et rien ne passe en gris — chaque côté garde la couleur qui le
            relie aux barres (remarque de Gwenaël, 11/11 : « l'hypoténuse est orange parce qu'elle a la couleur du tableau ») ;
            le petit carré de l'angle droit est alors dessiné PAR-DESSUS les traits (un trait épais le cachait) ;
   st.forts = ['BC'] (en jeu), ['*'] (tous en jeu) ; st.ternes = ['AB'] : toujours gris (trigonométrie : côté hors jeu).
   build.py remet 'gris' au début de chaque fiche ; une fiche écrit  SURLIGNAGE = 'epais';  en tête (pour ses figures
   calculées au chargement) et  surlignage:'epais'  dans FICHE (rendreFiche, montrer et exempleImpr la reprennent). */
var SURLIGNAGE = 'gris';
var GRIS_TRAIT = '#B8C4CC';
function enJeu(st, c){

  var fort = f.indexOf('*') >= 0 || f.indexOf(c) >= 0 || f.indexOf(c[1]+c[0]) >= 0;
  if(SURLIGNAGE === 'gris') return (f.length && !fort) ? 'gris' : 'normal';
  return fort ? 'fort' : 'normal';

/* couleur et épaisseur d'un côté c (rôle g|b|o|n) d'une figure dessinée à la main : ep = épaisseur ordinaire,

function styleCote(st, c, role, ep, epFort){
  var e = enJeu(st, c);

function svgTri(F, st){

  var sommets = Object.keys(P), decoupe = '';

    s += '<defs><clipPath id="'+decoupe+'"><path d="M'+polyElargi(sommets.map(function(k){ return P[k]; }), 1.5, 2.5)

  }

    // (remarque de Gwenaël, 11/11 soir : le carré paraissait écrasé par les traits épais)
    var epA = function(c){ var e = enJeu({neutre:st.neutre, forts:forts, ternes:ternes}, c); return e === 'fort' ? 6 : (e === 'neutre' ? 2.2 : 3); };
    var cA = F.cotes[droit+autres[0]] ? droit+autres[0] : autres[0]+droit, cB = F.cotes[droit+autres[1]] ? droit+autres[1] : autres[1]+droit;
    var q = carreAngle(P[droit], P[autres[0]], P[autres[1]], Math.max(epA(cA), epA(cB))/2 + CARRE);
    var d = 'M'+P[droit].join(' ')+' L'+q.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L')+' Z';
    // codage de l'angle droit à la française : seulement les DEUX petits côtés (les deux autres sont sur les côtés du
    // triangle) ; rempli d'orange quand l'étape le montre (remarque de Gwenaël, 11/11, lot livret-figures-4)
    var dL = 'M'+q.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L');
    carre = (st.angle && !st.neutre ? '<path d="'+d+'" fill="#F28C28" stroke="none"/>' : '')+'<path d="'+dL+'" fill="none" stroke="'+MAR+'" stroke-width="'+CARRE_TRAIT+'" stroke-linejoin="miter"/>';
  }

  if(decoupe) s += '<g clip-path="url(#'+decoupe+')">';
  // les côtés épais d'abord ; chaque côté est prolongé de 20 px puis découpé (bouts carrés) : sommets nets, même aigus
  // (lot livret-figures-4 : les bouts ronds laissaient des sommets arrondis, remarque de Code sur 4e-COS-02, 11/11)
  Object.keys(F.cotes).sort(function(x, y){ return (etat(y) === 'fort') - (etat(x) === 'fort'); }).forEach(function(c){
    var a = P[c[0]], b = P[c[1]], r = R[F.cotes[c]], e = etat(c);
    var dx = b[0]-a[0], dy = b[1]-a[1], l = Math.hypot(dx, dy) || 1, k = decoupe ? 20 : 0;
    var a2 = [a[0]-dx/l*k, a[1]-dy/l*k], b2 = [b[0]+dx/l*k, b[1]+dy/l*k];
    s += '<line x1="'+a2[0].toFixed(1)+'" y1="'+a2[1].toFixed(1)+'" x2="'+b2[0].toFixed(1)+'" y2="'+b2[1].toFixed(1)+'" stroke="'+(e === 'gris' ? GRIS_TRAIT : (e === 'neutre' ? MAR : r.trait))+'" stroke-width="'+(e === 'fort' ? 6 : (e === 'neutre' ? 2.2 : 3))+'" stroke-linecap="'+(decoupe ? 'butt' : 'round')+'"/>';
  });

  if(unFort) s += carre;
  Object.keys(F.noms).forEach(function(k){
    var n = F.noms[k];
    s += '<text x="'+n[0]+'" y="'+n[1]+'" '+SERIF+' font-size="15" fill="'+MAR+'" text-anchor="middle">'+k+'</text>';
  });

    var txt = L.t, cherche = !!L.cherche;
    if(cherche) txt = st.trouve ? L.trouve : '?';
    s += '<text x="'+L.x+'" y="'+L.y+'" '+SANS+' font-size="'+(cherche && !st.trouve ? 17 : 13)+'" font-weight="'+(cherche?'bold':'normal')+'" fill="'+MAR+'" text-anchor="'+(L.a||'middle')+'">'+txt+'</text>';

/* étiquette le long d'un segment [PQ] : texte tourné dans le sens du segment, décalé de d (côté gauche de P→Q si d > 0) */
function etiquette(P, Q, txt, d, coul, taille, gras){
  var dx = Q[0]-P[0], dy = Q[1]-P[1], l = Math.hypot(dx, dy), a = Math.atan2(dy, dx)*180/Math.PI;
  var nx = dy/l, ny = -dx/l, x = (P[0]+Q[0])/2 + nx*d, y = (P[1]+Q[1])/2 + ny*d;
  if(a > 90) a -= 180; if(a < -90) a += 180;
  return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" '+SANS+' font-size="'+(taille||12)+'"'+(gras?' font-weight="bold"':'')+' fill="'+(coul||MAR)+'" text-anchor="middle" dominant-baseline="central" transform="rotate('+a.toFixed(1)+' '+x.toFixed(1)+' '+y.toFixed(1)+')">'+txt+'</text>';
}
/* angle droit codé en S entre U et V (petit carré) */
function codeDroit(S, U, V, t, plein){
  // seulement les deux petits côtés (les deux autres sont sur les côtés de l'angle) ; rempli d'orange si plein (lot livret-figures-4)
  // t = taille demandée par la fiche (8 à 10, mesurée depuis l'axe) ; + 2 pour la mesurer depuis le bord d'un trait de 3 px
  var q = carreAngle(S, U, V, (t || 9) + 2), pts = q.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);});
  return (plein ? '<path d="M'+S[0]+' '+S[1]+' L'+pts.join(' L')+' Z" fill="#F28C28" stroke="none"/>' : '')+
         '<path d="M'+pts.join(' L')+'" fill="none" stroke="'+MAR+'" stroke-width="'+CARRE_TRAIT+'" stroke-linejoin="miter"/>';
}
/* étiquettes de lettres (sans figure : « le côté sans la lettre de l'angle droit ») */
function tuilesLettres(lettres, barree, garde){
  var w = 34, g = 10, L = lettres.length*w + (lettres.length-1)*g, s = '<svg class="fig-c" viewBox="0 0 '+(L+8)+' 46" style="max-width:'+Math.round((L+8)*1.15)+'px" role="img" aria-label="Lettres '+lettres.join(', ')+'">';
  lettres.forEach(function(c, i){
    var x = 4 + i*(w+g), b = (c === barree), k = garde && !b;
    s += '<rect x="'+x+'" y="5" width="'+w+'" height="34" rx="6" fill="'+(k ? R.g.fond : (b ? '#EEF1F4' : '#fff'))+'" stroke="'+(k ? R.g.trait : MAR)+'" stroke-width="'+(k?2.4:1.4)+'"/>';
    s += '<text x="'+(x+w/2)+'" y="29" '+SERIF+' font-size="20" fill="'+(b ? '#8A97A3' : MAR)+'" text-anchor="middle">'+c+'</text>';
    if(b) s += '<line x1="'+(x+5)+'" y1="34" x2="'+(x+w-5)+'" y2="10" stroke="#A85E06" stroke-width="2.6" stroke-linecap="round"/>';

}
/* figure d'une étape : objet triangle, fonction(st) -> svg, ou svg tout fait */
function figure(f, st){
  if(!f) return '';
  if(typeof f === 'function') return f(st || {});
  if(typeof f === 'string') return f;

}

/* ================== Schéma en barres ==================
   B = null (cadre vide) ou {haut:[case], bas:[case]} ; case = [texte, rôle g|b|o|x (enlevé)|n, poids]
   B.cmp = true : les deux barres ont la longueur de leur total (comparaison de la réciproque) ;
   la plus courte est complétée par un vide en pointillés.                                      */
function lgCase(t){ return t.replace(/<[^>]+>/g,'').replace(/[{}]/g,'').length; }
function minCase(cases, base){ return cases.length < 2 ? 100 : (cases.some(function(c){ return lgCase(c[0]) > 5; }) ? 46 : base); }
function tailleCase(t){ var n = lgCase(t); return n > 5 ? ' style="font-size:12px"' : (n > 3 ? ' style="font-size:13.5px"' : ''); }
function barres(B, petit){
  if(B && B.cmp) return barresCmp(B, petit);
  var h = '<div class="barres'+(petit?' petit':'')+'">';
  function ligneB(cases){
    var tot = cases.reduce(function(a,c){ return a + (c[2]||1); }, 0);
    return '<div class="rang">'+cases.map(function(c){
      var w = Math.max((c[2]||1)/tot*100, minCase(cases, 30));
      return '<div class="case r-'+c[1]+'" style="flex:'+w.toFixed(1)+' 1 0"><span'+tailleCase(c[0])+'>'+m(c[0])+'</span></div>';
    }).join('')+'</div>';
  }
  if(!B) h += '<div class="rang"><div class="case r-vide" style="flex:1"></div></div><div class="rang"><div class="case r-vide" style="flex:1"></div><div class="case r-vide" style="flex:1"></div></div>';
  else h += ligneB(B.haut) + ligneB(B.bas);
  return h + '</div>';
}
function barresCmp(B, petit){
  function tot(cases){ return cases.reduce(function(a,c){ return a + (c[2]||1); }, 0); }
  var th = tot(B.haut), tb = tot(B.bas), mx = Math.max(th, tb);
  function ligneB(cases, t){
    var plein = t/mx*100, h = '<div class="rang">';
    h += '<div class="plein" style="flex:'+plein.toFixed(2)+' 1 0">'+cases.map(function(c){
      var w = Math.max((c[2]||1)/t*100, minCase(cases, 34));
      return '<div class="case r-'+c[1]+'" style="flex:'+w.toFixed(1)+' 1 0"><span'+tailleCase(c[0])+'>'+m(c[0])+'</span></div>';
    }).join('')+'</div>';
    if(plein < 99.95) h += '<div class="manque" style="flex:'+(100-plein).toFixed(2)+' 1 0"></div>';
    return h + '</div>';
  }
  return '<div class="barres cmp'+(petit?' petit':'')+'">'+ligneB(B.haut, th)+ligneB(B.bas, tb)+
         (B.note !== undefined || B.place ? '<div class="bnote">'+(B.note ? m(B.note) : '')+'</div>' : '')+'</div>';
}

/* ================== Fabrication d'une fiche ==================
   FICHE = {
     titre (onglet), chapitre, niveaux:['4e','3e'], h1, ids:'4e-TRI-03 · 3e-PYT-01',
     sections:['exemples','retiens','qs','pq'] (dans l'ordre voulu),
     exemples:[{titre, fig, enonce, lignes:[{t|e, s}], etapes:[{st, B, ti, p, att}], impr:3}],
     retiens: html (ou fonction), qs:[{q, fig, B, r:[lignes], rfig, rst}], pq: html (ou fonction),

var TITRES = {

function val(x){ return typeof x === 'function' ? x() : (x || ''); }

var PIED = '<footer><div class="pied">'+
  '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="20" fill="#02306D"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 82H85" stroke="#FA7D05" stroke-width="10"/><path d="M18 24L50 66L82 24" stroke="#00AFAA" stroke-width="14"/><path d="M18 18V82 M82 18V82" stroke="#FFFFFF" stroke-width="12"/></g></svg>'+

/* Étape 0 (09/11, remarque de Gwenaël) : chaque exemple s'ouvre sur l'énoncé et la figure, « Sur ma copie » vide,

// la source d'un sujet de brevet, sans les codes « Je sais : 4e-TRI-03… » (09/11 : pas de code pour l'élève)

// la figure de l'étape 0 : X.fig0 / X.st0 si la fiche les donne ; sinon un triangle (objet) avec ses côtés sans les

function figure0(X){
  var E1 = X.etapes[0] || {};

  if(!E1.fig && X.fig && typeof X.fig === 'object') return figure(X.fig, {neutre:true});

/* ================== Le chapitre d'où vient l'élève (#ch=…) ==================
   build.py site pose  var SITE = {retour:'https://suivi.mathsgo.re/#cours=', chapitre:'4e-TRI'} ; build.py tout (pages
   locales) pose  var DEFAUT = '4e-TRI'  (le chapitre de la fiche ouverte sans #ch). L'espace élève (et les sommaires
   locaux) ouvrent une fiche avec #ch=<chapitre> : « ◀ Mes cours » ramène à CE chapitre (une fiche de 4e sert aussi au
   chapitre de 3e) et, depuis un chapitre de 4e, les parties marquées 3e sont cachées. Rien n'est retenu : c'est l'adresse. */
var CH_FORCE = '';
function chapitreDOu(){
  if(CH_FORCE) return CH_FORCE;
  var r = /^#ch=([0-9]e-[A-Z]{2,8})$/.exec(location.hash);
  if(r) return r[1];
  if(typeof SITE !== 'undefined' && SITE) return SITE.chapitre;
  return (typeof DEFAUT !== 'undefined' && DEFAUT) || '';
}
function de4e(){ return /^4e-/.test(chapitreDOu()); }
function enSite(){ return typeof SITE !== 'undefined' && !!SITE; }
// l'adresse du chapitre : dans l'espace élève (site) ou le sommaire local
function adresseChapitre(ch){
  ch = ch || chapitreDOu();
  if(enSite()) return SITE.retour + ch;
  return ch ? '../'+ch.slice(0, 2)+'/'+encodeURI(ch+' - Sommaire du chapitre.html') : '';
}
function poserBarreCours(){
  if(!enSite() || document.querySelector('.barre-cours')) return;
  document.body.insertAdjacentHTML('afterbegin', '<nav class="barre-cours ecran" aria-label="Retour"><div><a href="'+adresseChapitre()+'">◀ Mes cours</a></div></nav>');
}
// un lien vers une autre page du livret garde le chapitre d'où l'on vient (#ch=…)
function lienSite(href){
  if(!href || /^(https?:|#)/.test(href)) return href;
  var ch = chapitreDOu(), h = href.charAt(0) === '/' ? href : encodeURI(href);
  return ch && h.indexOf('#') < 0 ? h+'#ch='+ch : h;
}
// lien(texte, page) : dans une fiche, le lien vers une autre fiche (page = chemin local, réécrit par build.py site)
function lien(t, p){ return '<a class="lien" href="'+lienSite(p)+'">'+t+'</a>'; }

/* Parties de 3e (pastille <span class="niv3">3e</span>, 09/11) : depuis un chapitre de 4e, elles sont cachées.
   Exemple dont le titre porte la pastille : retiré ; étape dont le titre la porte : retirée (et ses lignes de copie) ;
   ligne de copie qui la porte : retirée ; dans un énoncé, tout ce qui suit la pastille ; question éclair qui la porte :
   retirée ; « Pourquoi » dont le titre la porte : retiré. Dans le Je retiens et le Pourquoi : le bloc .bloc2, la figure,
   le h4 et ce qui le suit, l'item de liste, ou la fin du paragraphe qui la porte. */
var NIV3 = /<span class="niv3">3e<\/span>/;
/* Parties de 4e (pastille <span class="niv4">4e</span>, 11/11, lot livret-4e) : l'inverse — montrées SEULEMENT depuis un
   chapitre de 4e (2e exemple de Thalès en triangles emboîtés, questions éclair qui remplacent une question de 3e…) ;
   depuis un chapitre de 3e (ou une page sans chapitre), elles sont retirées, avec les mêmes règles que les parties de 3e. */
var NIV4 = /<span class="niv4">4e<\/span>/;
function apresNiv(t, RE){ return String(t).replace(new RegExp('\\s*' + RE.source + '[\\s\\S]*$'), ''); }
function apres3e(t){ return apresNiv(t, NIV3); }
function sansNiv(F, RE){
  var G = {}; for(var k in F) G[k] = F[k];
  if(F.exemples){
    var nums = {}, nn = 0;
    G.exemples = F.exemples.filter(function(X){ return !RE.test(X.titre); }).map(function(X){
      var Y = {}; for(var k in X) Y[k] = X[k];
      // exercices numérotés « 1 · … », « 1 (suite) · … » : renumérotés
      var r = /^(\d+)(\s|\b)/.exec(X.titre);
      if(r){ if(!nums[r[1]]) nums[r[1]] = String(++nn); Y.titre = X.titre.replace(/^\d+/, nums[r[1]]); }
      var garde = [], carte = {};
      X.etapes.forEach(function(E, i){ if(!RE.test(E.ti || '')){ garde.push(E); carte[i+1] = garde.length; } });
      Y.etapes = garde;
      Y.enonce = apresNiv(X.enonce, RE);
      Y.lignes = X.lignes.filter(function(l){ return !RE.test(l.t || '') && (l.s === undefined || carte[l.s]); })
                         .map(function(l){ var c = {}; for(var k in l) c[k] = l[k]; if(l.s !== undefined) c.s = carte[l.s]; return c; });
      if(Y.impr !== undefined) Y.impr = Math.min(Y.impr, garde.length - 1);
      return Y;
    });
    // « Exemple 1 · … », « Exemple 2 · … » : renumérotés ; un seul exemple restant n'a plus de numéro (10/11)
    var nEx = 0; G.exemples.forEach(function(Y){ if(/^Exemple \d+ ·/.test(Y.titre)) nEx++; });
    var kEx = 0; G.exemples.forEach(function(Y){
      if(/^Exemple \d+ ·/.test(Y.titre)) Y.titre = Y.titre.replace(/^Exemple \d+ ·/, nEx > 1 ? 'Exemple '+(++kEx)+' ·' : 'Exemple ·');
    });

  if(F.qs) G.qs = F.qs.filter(function(Q){ return !RE.test(Q.q); });
  if(F.pq && RE.test(F.pqH2 || '')) G.sections = F.sections.filter(function(t){ return t !== 'pq'; });
  return G;
}
function sans3e(F){ return sansNiv(F, NIV3); }
function sans4e(F){ return sansNiv(F, NIV4); }
function cacherNiv(racine, cls){
  racine.querySelectorAll('.'+cls).forEach(function(p){
    if(!racine.contains(p)) return;
    var b = p.closest('.bloc2') || p.closest('figure') || p.closest('li') || p.closest('tr');
    if(b){ b.remove(); return; }
    var h4 = p.closest('h4');
    if(h4){ var x = h4.nextElementSibling; while(x && !/^H[1-4]$/.test(x.tagName)){ var y = x.nextElementSibling; x.remove(); x = y; } h4.remove(); return; }
    while(p.nextSibling) p.nextSibling.remove();
    var par = p.parentNode; p.remove();
    if(par && !par.textContent.trim() && !par.querySelector('svg')) par.remove();
  });
  // « Démonstration 1 », « Démonstration 2 »… : renumérotées dans chaque bloc ; s'il n'en reste qu'une, plus de numéro
  // (remarque de Gwenaël, 10/11 : « Démonstration 1 » seule depuis un chapitre de 4e)
  var blocs = [];
  racine.querySelectorAll('h4').forEach(function(h){ if(/^Démonstration \d+/.test(h.textContent) && blocs.indexOf(h.parentNode) < 0) blocs.push(h.parentNode); });
  blocs.forEach(function(b){

    hs.forEach(function(h, i){ h.innerHTML = h.innerHTML.replace(/^Démonstration \d+/, hs.length > 1 ? 'Démonstration '+(i+1) : 'Démonstration'); });
  });

// une page d'entraînement brevet ouverte depuis un chapitre de 4e : « Exercices type » (pas de brevet en 4e)
function versionDe4e(F){
  if(!/^Brevet/.test(F.ids || '')) return F;
  F.h1 = F.h1.replace(/^Entraînement brevet/, 'Exercices type');
  if(F.exemplesTitre) F.exemplesTitre = F.exemplesTitre.replace(/^Sujets corrigés pas à pas/, 'Exercices corrigés');
  // 4e (sa remarque du 11/11 : en 4e, pas de « brevet » à l'écran) : « De vrais problèmes. » ; chaque exercice s'appelle
  // « Exercice 1 · … » et la ligne de sa source (« Brevet 2024, … ») n'est pas montrée (elle reste dans la fiche, côté prof)
  if(F.intro) F.intro = F.intro.replace(/^De vrais exercices du brevet des années passées\./, 'De vrais problèmes.');
  // modèle du 12/11 soir (questions flash + problèmes type) : les textes de 4e sont écrits dans la fiche, aucune source montrée
  if(F.intro4e) F.intro = F.intro4e;

    racine.querySelector('.qi').innerHTML = F.qs.map(function(Q){ return '<li><div class="qtxt">'+(Q.src ? '<span class="qsrc">'+Q.src+'</span> ' : '')+m(Q.q)+'</div>'+figure(Q.fig, Q.st || {})+'</li>'; }).join('');
    racine.querySelector('.reps').innerHTML = '<b>Réponses des questions '+(F.qsTitre ? 'flash' : 'éclair')+'</b><div class="repgrille'+(F.qs.length > 3 ? ' qi-n' : '')+'">'+F.qs.map(function(Q, i){
      return '<div class="rq"><b>'+(i+1)+'.</b><div class="red">'+(Q.rimpr || Q.r).map(function(l){return ligne(l);}).join('')+'</div></div>';
    }).join('')+'</div>';
  }
  racine.querySelectorAll('.manip').forEach(function(b, k){ brancherManip(manipListe(F)[k], b); });
  if(F.apres) F.apres(racine);
  if(de4e()) cacher3e(racine); else cacher4e(racine);
  cacherNP(racine);
}
/* ================== « Je manipule » (lot 1 de la carte, 12/11/2026 — son choix : « une dizaine, ciblées ») ==================
   FICHE.manip = {titre, consigne, fig:function(v, etat) -> svg (le MÊME cadre à chaque valeur : rien ne saute),
                  min, max, pas, val (départ), aimant:[valeurs] (le curseur s'y colle à tol près), tol, unite (texte du curseur),
                  etats:['Droites parallèles', 'Droites pas parallèles'] (bascule facultative ; un état peut aussi être un objet
                         {lab:'Je choisis la hauteur', min, max, pas, val, aimant, tol} : le curseur prend alors ses propres réglages),
                  lecture:function(v, etat) -> html,
                  question:{q, r:[lignes]} (la question qui suit, réponse au toucher comme une question éclair),
                  impr:[[v, etat, légende], …] (images fixes de la version imprimable), aria}  — ou une liste de tels objets.
   Section 'manip' dans FICHE.sections (conseillé : juste avant 'pq' : « voir » puis « pourquoi », jamais l'inverse).
   RIEN NE BOUGE SANS L'ÉLÈVE (sa remarque du 06/11 sur « les trucs qui bougent ») : pas d'animation, pas de transition ;
   la figure est redessinée seulement quand l'élève touche le curseur, les flèches ou la bascule ; la hauteur du bloc ne
   change pas d'une valeur à l'autre (contrôle : controle/manip.js). Version imprimable : les images fixes de impr. */
function manipListe(F){ return !F.manip ? [] : (F.manip.length !== undefined ? F.manip : [F.manip]); }
// les réglages du curseur dans l'état e (un état peut avoir les siens)
function manipR(M, e){
  var E = (M.etats || [])[e], o = {};
  ['min', 'max', 'pas', 'val', 'aimant', 'tol'].forEach(function(k){ o[k] = (E && typeof E === 'object' && E[k] !== undefined) ? E[k] : M[k]; });
  return o;
}
function manipLab(E){ return typeof E === 'object' ? E.lab : E; }
function manipVal(M, v, e){
  var Q = manipR(M, e || 0), p = Q.pas || 1;
  v = Math.max(Q.min, Math.min(Q.max, v));
  (Q.aimant || []).forEach(function(a){ if(Math.abs(v - a) <= (Q.tol || 0)) v = a; });
  return Math.round(Math.round((v - Q.min) / p) * p * 1e6) / 1e6 + Q.min;
}
function rendreManip(M, k){
  var R0 = manipR(M, 0), v0 = R0.val !== undefined ? R0.val : R0.min;
  var h = '<div class="manip ecran" data-k="'+k+'">'+(M.titre ? '<h3>'+m(M.titre)+'</h3>' : '')+(M.consigne ? '<p class="mcons">'+m(M.consigne)+'</p>' : '');
  if(M.etats) h += '<div class="metats" role="group">'+M.etats.map(function(e, j){ return '<button type="button" class="m-etat" aria-pressed="'+(j ? 'false' : 'true')+'">'+m(manipLab(e))+'</button>'; }).join('')+'</div>';
  h += '<div class="mfig"></div>'+(M.lecture ? '<div class="mlect" aria-live="polite"></div>' : '');
  h += '<div class="mctrl"><button type="button" class="m-moins" aria-label="Un cran en arrière">◀</button>'+
       '<input type="range" min="'+R0.min+'" max="'+R0.max+'" step="'+(R0.pas || 1)+'" value="'+v0+'" aria-label="'+(M.aria || 'Je fais glisser')+'">'+
       '<button type="button" class="m-plus" aria-label="Un cran en avant">▶</button></div>';
  if(M.question) h += '<div class="qs mq">'+carteQ(M.question, 0).replace('QUESTION 1', 'QUESTION').replace('RÉPONSE 1', 'RÉPONSE')+'</div>';
  h += '</div>';
  // version imprimable : les images fixes, puis la question et sa réponse
  h += '<div class="impr manipi">'+(M.titre ? '<h3>'+m(M.titre)+'</h3>' : '')+'<div class="mimgs">'+(M.impr || [[v0, 0]]).map(function(I){
    return '<figure>'+M.fig(I[0], I[1] || 0)+(I[2] ? '<figcaption>'+m(I[2])+'</figcaption>' : '')+'</figure>'; }).join('')+'</div>'+
    (M.question ? '<div class="mqi"><b>Question.</b> '+m(M.question.q)+'<div class="red">'+M.question.r.map(function(l){ return ligne(l); }).join('')+'</div></div>' : '')+'</div>';
  return h;
}
function brancherManip(M, b){
  if(!M || !b) return;
  var inp = b.querySelector('input[type=range]'), etat = 0, fz = b.querySelector('.mfig'), lz = b.querySelector('.mlect');
  function regler(e){ var Q = manipR(M, e); inp.min = Q.min; inp.max = Q.max; inp.step = Q.pas || 1; }
  function dessiner(){
    var v = manipVal(M, +inp.value, etat); inp.value = v;
    fz.innerHTML = M.fig(v, etat);
    if(lz) lz.innerHTML = M.lecture(v, etat);
    b.dataset.v = v; b.dataset.etat = etat;
  }
  inp.addEventListener('input', dessiner);
  b.querySelector('.m-moins').onclick = function(){ inp.value = manipVal(M, +inp.value - (manipR(M, etat).pas || 1), etat); dessiner(); };
  b.querySelector('.m-plus').onclick = function(){ inp.value = manipVal(M, +inp.value + (manipR(M, etat).pas || 1), etat); dessiner(); };
  b.querySelectorAll('.m-etat').forEach(function(e, j){ e.onclick = function(){
    // un état avec ses propres réglages : le curseur repart de sa valeur de départ
    var E = (M.etats || [])[j]; if(j !== etat && E && typeof E === 'object' && E.min !== undefined){ regler(j); var Q = manipR(M, j); inp.value = Q.val !== undefined ? Q.val : Q.min; }
    etat = j;
    b.querySelectorAll('.m-etat').forEach(function(x, i){ x.setAttribute('aria-pressed', i === j ? 'true' : 'false'); }); dessiner(); }; });
  var c = b.querySelector('.carte');
  if(c) c.onclick = function(){ var vu = c.classList.toggle('vu'); c.setAttribute('aria-pressed', vu); };
  // la ligne de lecture garde la hauteur de sa plus longue phrase (rien ne saute quand la phrase change de longueur)
  function fixerLecture(){
    if(!lz) return; var mx = 0;
    lz.style.minHeight = '';
    for(var e = 0; e < Math.max(1, (M.etats || []).length); e++){ var Q = manipR(M, e); for(var x = Q.min; x <= Q.max + 1e-9; x += (Q.pas || 1)){
      lz.innerHTML = M.lecture(Math.round(x*1e6)/1e6, e); mx = Math.max(mx, lz.getBoundingClientRect().height); } }
    lz.style.minHeight = Math.ceil(mx)+'px';
  }
  var largeur = 0;
  window.addEventListener('resize', function(){ if(Math.abs(innerWidth - largeur) > 1){ largeur = innerWidth; fixerLecture(); dessiner(); } });
  b.manipEtat = function(v, e){ etat = e || 0; regler(etat); inp.value = v;
    b.querySelectorAll('.m-etat').forEach(function(x, i){ x.setAttribute('aria-pressed', i === etat ? 'true' : 'false'); }); dessiner(); };
  largeur = innerWidth; fixerLecture();
  dessiner();
}

/* ================== Nouveau programme : marques np27 / np28 / ap27 / ap28 (lot 1 de la carte, 12/11/2026) ==================
   PROG = l'année de la rentrée pour laquelle le livret est réglé. À changer À LA MAIN, après relecture, à la rentrée 2027
   (la 4e passe au nouveau programme) puis à la rentrée 2028 (la 3e) : rien ne change tout seul avec la date.
   <span class="np27">NP</span> : partie du nouveau programme qui arrive en 4e en 2027-2028 ; montrée depuis un chapitre de 4e
                                  à partir de PROG = 2027, depuis un chapitre de 3e à partir de 2028 (élèves passés par la 4e NP).
   <span class="np28">NP</span> : partie du nouveau programme de 3e (2028-2029) ; montrée à partir de PROG = 2028.
   <span class="ap27">2020</span> : partie du programme 2020 que le nouveau programme retire en 4e : montrée tant que PROG < 2027
                                  (vue de 4e) ou < 2028 (vue de 3e) ;  <span class="ap28">2020</span> : retirée en 3e (PROG < 2028).
   Mêmes endroits et mêmes règles que niv3 / niv4 (titre d'exemple, ti, t, q, pqH2, h1, blocs du Je retiens et du Pourquoi).
   Relecture : une page ouverte avec ?np à la fin de son adresse montre TOUT, les parties marquées signalées par une pastille. */
var PROG = 2026;
/* SECONDE (sa décision du 12/11/2026, 22 h 33 : « tout le nouveau programme de 3e dedans cette année ») : vue depuis un
   chapitre de 3e, TOUT le nouveau programme (np27 et np28) est montré dès maintenant, avec la pastille « pour la seconde ·
   pas au brevet » ; la 4e ne change pas (np27 caché jusqu'à PROG = 2027). Mettre à false pour revenir à l'ancien réglage. */
var SECONDE_3E = true;
var NP_RE = {np27:/<span class="np27">NP<\/span>/, np28:/<span class="np28">NP<\/span>/, ap27:/<span class="ap27">2020<\/span>/, ap28:/<span class="ap28">2020<\/span>/};
function voirNP(){ try{ return /(^\?|&)np(=|&|$)/.test(location.search); }catch(e){ return false; } }
function npMontre(cls, niveau){
  var q = niveau ? niveau === '4e' : de4e(), an = q ? 2027 : 2028;
  if(SECONDE_3E && !q && (cls === 'np27' || cls === 'np28')) return true;
  if(cls === 'np27') return PROG >= an;
  if(cls === 'np28') return PROG >= 2028;
  if(cls === 'ap27') return PROG < an;
  if(cls === 'ap28') return PROG < 2028;
  return true;
}
function sansNP(F){
  if(voirNP()) return F;
  Object.keys(NP_RE).forEach(function(c){ if(!npMontre(c)) F = sansNiv(F, NP_RE[c]); });
  return F;
}
function cacherNP(racine){
  if(voirNP()){ document.body.classList.add('voir-np'); return; }
  if(SECONDE_3E && !de4e() && PROG < 2028) document.body.classList.add('np-seconde');
  Object.keys(NP_RE).forEach(function(c){ if(!npMontre(c)) cacherNiv(racine, c); });
}
function h1NP(h1, niveau){
  if(voirNP()) return h1;
  Object.keys(NP_RE).forEach(function(c){ if(!npMontre(c, niveau)) h1 = apresNiv(h1, NP_RE[c]); });
  return h1;
}
/* Après Suivant ou Retour (idée de Gwenaël, 09/11, sur son téléphone) : si le bas du cadre « Sur ma copie » est caché
   sous les boutons collés en bas, la page descend juste assez pour qu'il s'arrête au-dessus d'eux — l'élève voit ce
   qui a changé. Rien ne bouge quand tout est déjà visible (ordinateur, tablette, étapes courtes). */
function voirCopie(box){
  var c = box.querySelector('.copie'), nav = box.querySelector('.nav');
  if(!c || !nav || !window.scrollBy) return;
  // (13/11) la barre collée en bas s'arrête à innerHeight − sa hauteur : si elle n'est pas encore collée, compter sa place
  var bas = c.getBoundingClientRect().bottom, haut = Math.min(nav.getBoundingClientRect().top, window.innerHeight - nav.offsetHeight);
  var d = Math.round(bas - haut + 6);
  if(d > 0) window.scrollBy({top:d, behavior:'smooth'});
}
/* Retour / Suivant toujours visibles (09/11) : la barre des boutons reste collée en bas de l'écran tant que l'exemple
   est à l'écran (position sticky) ; une ombre quand elle est collée. Rien ne bouge d'une étape à l'autre. */
function navCollee(racine){
  if(!('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ e.target.classList.toggle('colle', e.intersectionRatio < 1 && e.boundingClientRect.top > 0); });
  }, {threshold:[1]});
  racine.querySelectorAll('.ex .nav').forEach(function(n){ io.observe(n); });
}
/* Aperçu de la version imprimable à l'écran (09/11 : le bouton ne marchait pas sur son téléphone, et l'impression
   « ne rendait pas bien ») : la page prend sa mise en page A4 (les règles @media print recopiées sous body.apercu),
   une feuille blanche réduite à la largeur de l'écran, avec « 🖨 Imprimer » et « ◀ Retour à la fiche ». */
function reglesApercu(){
  if(document.getElementById('apercu-css')) return;
  var out = [];
  function pref(sel){
    return sel.split(',').map(function(x){
      x = x.trim();
      if(/^(html|body)\b/.test(x)) return x.replace(/^(html|body)/, 'body.apercu');
      return 'body.apercu '+x;
    }).join(',');
  }
  function lire(regles){
    Array.prototype.forEach.call(regles, function(r){
      if(r.type === 4 && /print/.test(r.media.mediaText)) Array.prototype.forEach.call(r.cssRules, function(q){
        if(q.type === 1 && q.selectorText.indexOf('apercu') < 0) out.push(pref(q.selectorText)+'{'+q.style.cssText+'}');
      });
    });
  }
  Array.prototype.forEach.call(document.styleSheets, function(f){ try{ lire(f.cssRules); }catch(e){} });
  var st = document.createElement('style'); st.id = 'apercu-css'; st.textContent = out.join('\n');
  document.head.appendChild(st);
}
function ajusterApercu(){
  var mn = document.querySelector('main'); if(!mn || !document.body.classList.contains('apercu')) return;
  mn.style.zoom = '';
  var w = mn.getBoundingClientRect().width, place = document.documentElement.clientWidth - 16;
  mn.style.zoom = w > place ? (place / w).toFixed(3) : '';
}
function ouvrirApercu(retour){
  reglesApercu();
  document.querySelectorAll('details.pq').forEach(function(d){ d.open = true; });
  document.body.classList.add('apercu');
  if(!document.querySelector('.barre-apercu')){
    document.body.insertAdjacentHTML('afterbegin', '<nav class="barre-apercu" aria-label="Version imprimable"><div>'+
      (retour ? '<button type="button" class="ba-ret">◀ Retour à la fiche</button>' : (adresseChapitre() ? '<a class="ba-ret" href="'+adresseChapitre()+'">◀ Mes cours</a>' : ''))+
      '<button type="button" class="ba-impr" onclick="window.print()">🖨 Imprimer</button></div></nav>');
    var r = document.querySelector('.ba-ret');
    if(r) r.onclick = fermerApercu;
  }
  ajusterApercu();
  window.scrollTo(0, 0);
}
function fermerApercu(){
  document.body.classList.remove('apercu');
  var b = document.querySelector('.barre-apercu'); if(b) b.remove();
  var mn = document.querySelector('main'); if(mn) mn.style.zoom = '';
  window.scrollTo(0, 0);
}
window.addEventListener('resize', ajusterApercu);
// une page s'ouvre toujours EN HAUT (09/11 : dans l'aperçu, une fiche s'ouvrait au milieu)
function enHaut(){
  try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}
  window.scrollTo(0, 0);
  try{ if(window.top !== window) document.documentElement.scrollIntoView({block:'start'}); }catch(e){}
}
// à l'impression, les démonstrations sont dépliées
window.addEventListener('beforeprint', function(){ document.querySelectorAll('details.pq').forEach(function(d){ d.open = true; }); });
function ouvrirSiImpression(){
  if(location.hash === '#imprimer') document.querySelectorAll('details.pq').forEach(function(d){ d.open = true; });
  enHaut();
}

/* ===== bibliothèque commune _moteur/lib/geometrie.js ===== */
/* ======================================================================
   geometrie.js — bibliothèque commune de GÉOMÉTRIE du livret (lot 1 de la carte, « Angles et repérage », 12/11/2026)
   Écrite et regardée en image par le chef de chantier AVANT les agents (page de démonstration : _moteur/lib/demo-geometrie).
   Insérée UNE fois par build.py dans toute page dont une fiche déclare  biblio:['geometrie']  dans FICHE.
   NE PAS LA RECOPIER dans les fiches : la modifier ICI, puis refaire les pages (build.py tout).
   Elle s'appuie sur le moteur (livret.js) : R (couleurs de rôle), MAR, SERIF, SANS, GRIS_TRAIT, codeDroit, traitsNets.

   Les règles des figures (ses choix du 11/11, NORME-DES-FIGURES.md) sont appliquées ICI une fois pour toutes :
   - points à la française : rien au croisement de deux traits ; une petite croix pour un point seul (G.croix) ;
   - étape 0 neutre : une scène créée avec st.neutre dessine tout en traits sombres, sans fond de couleur ;
   - aucun trait ne dépasse d'un sommet (G.poly passe par traitsNets) ; flèches à pointe PLEINE ;
   - UN NOM OU UN TEXTE NE TOUCHE AUCUN TRAIT NI AUCUN AUTRE TEXTE : tous les textes sont posés à la fin (G.svg), à la place
     demandée si elle est libre (3,5 px de tout trait, arc, croix ou texte), sinon à la place libre la plus proche ;
   - une figure garde le cadre qu'on lui donne (G.svg({cadre:[x0, y0, x1, y1]})) : indispensable pour « Je manipule ».
   Couleurs de rôle (géométrie, carte § 3.5) : 'b' bleu marine, 'o' turquoise, 'g' orange, 'gris', 'n' (trait sombre).
   Aucun nom de couleur dans le texte de la fiche ; en noir et blanc, ce sont les arcs (1, 2 ou 3) et les noms qui guident.
   ====================================================================== */

function geoF(x){ return (Math.round(x * 10) / 10).toString(); }
/* un nombre écrit à la française : virgule, signe moins U+2212 */
function geoNb(v){
  var s = String(Math.round(v * 1000) / 1000).replace('.', ',');
  return s.charAt(0) === '-' ? '−' + s.slice(1) : s;
}
var GEO_GRIS = {trait:'#B8C4CC', fond:'#EEF1F4', txt:'#55636f'};
/* couleur d'un rôle pour cette étape : neutre → trait sombre et pas de fond */
function geoCoul(role, st){
  st = st || {};
  if(st.neutre) return {trait:MAR, fond:'none', txt:MAR};
  if(role === 'gris') return GEO_GRIS;
  return R[role] || R.n;
}
/* pointe de flèche PLEINE en Q, dans l'axe de P→Q ; renvoie [svg, point où le trait doit s'arrêter] */
function geoPointe(P, Q, coul, t){
  t = t || 9;
  var dx = Q[0]-P[0], dy = Q[1]-P[1], l = Math.hypot(dx, dy) || 1, ux = dx/l, uy = dy/l, w = t*0.42;
  var B = [Q[0]-ux*t, Q[1]-uy*t];
  return ['<path d="M'+geoF(Q[0])+' '+geoF(Q[1])+' L'+geoF(B[0]-uy*w)+' '+geoF(B[1]+ux*w)+' L'+geoF(B[0]+uy*w)+' '+geoF(B[1]-ux*w)+' Z" fill="'+coul+'" stroke="none"/>',
          [Q[0]-ux*t*0.7, Q[1]-uy*t*0.7]];
}
/* distance d'un point à un segment */
function geoDPS(px, py, a, b){

  return Math.hypot(px-a[0]-u*dx, py-a[1]-u*dy);
}
/* distance d'une boîte (centre cx, cy ; demi-largeur w, demi-hauteur h) à un segment (0 si ils se coupent) */
function geoDBoite(cx, cy, w, h, a, b){
  var x0 = cx-w, x1 = cx+w, y0 = cy-h, y1 = cy+h;
  function dedans(p){ return p[0] >= x0 && p[0] <= x1 && p[1] >= y0 && p[1] <= y1; }
  function coupe(p, q, r, s){ var d = (q[0]-p[0])*(s[1]-r[1]) - (q[1]-p[1])*(s[0]-r[0]); if(!d) return false;
    var u = ((r[0]-p[0])*(s[1]-r[1]) - (r[1]-p[1])*(s[0]-r[0]))/d, v = ((r[0]-p[0])*(q[1]-p[1]) - (r[1]-p[1])*(q[0]-p[0]))/d;
    return u >= 0 && u <= 1 && v >= 0 && v <= 1; }
  var C = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
  if(dedans(a) || dedans(b) || [0,1,2,3].some(function(i){ return coupe(a, b, C[i], C[(i+1)%4]); })) return 0;
  var m = Math.min.apply(null, C.map(function(c){ return geoDPS(c[0], c[1], a, b); }));

  [a, b].forEach(function(p){ var dx = Math.max(x0 - p[0], 0, p[0] - x1), dy = Math.max(y0 - p[1], 0, p[1] - y1); m = Math.min(m, Math.hypot(dx, dy)); });

}
/* taille approchée d'un texte (demi-largeur, demi-hauteur de l'encre) */
function geoTaille(txt, taille, serif){

  var haut = /[()gjpqy,;]/.test(t) ? 0.5 : (/[bdfhklt𝑑𝑏ℎ𝑘𝑙𝑡]/.test(t) ? 0.43 : (serif ? 0.40 : 0.37));
  return [n*taille/2 + 0.5, haut*taille];
}

function thStyle(){

/* ---------- le tableau des longueurs (petit triangle en haut, grand triangle en bas) ----------
   T = {h:['{AMN}','4','3,2','{MN}'], b:['{ABC}','10','{AC}','7'], k:'× 2,5' (ou '' : flèche sans nombre ; null : pas de flèche),
        on:[[0,1],[1,1]] (cases mises en avant : [ligne, colonne]), cols:[1,2,3] (colonnes affichées),
        kc:['× 2,5','× 2,5'] (une ligne « coefficient » sous chaque colonne), note:'…' (sous le tableau), vide:true,
        kw (largeur réservée au « × k », en px, pour que le tableau garde la même largeur à chaque étape)}  */
function thTab(T){
  var cols = T.cols || [1, 2, 3];
  function cel(r, j){
    if(T.vide) return '<td class="c'+j+' vide">·</td>';
    var v = (r === 0 ? T.h : T.b)[j], on = (T.on || []).some(function(c){ return c[0] === r && c[1] === j; });
    return '<td class="c'+j+(on ? ' on' : '')+'">'+m(v)+'</td>';
  }
  var h = '<table><tr><th'+(T.vide?' class="vide"':'')+'>'+(T.vide ? '·' : m(T.h[0]))+'</th>'+cols.map(function(j){ return cel(0, j); }).join('')+'</tr>'+
          '<tr><th'+(T.vide?' class="vide"':'')+'>'+(T.vide ? '·' : m(T.b[0]))+'</th>'+cols.map(function(j){ return cel(1, j); }).join('')+'</tr>';
  if(T.kc) h += '<tr class="kc"><td></td>'+T.kc.map(function(k){ return '<td>'+m(k)+'</td>'; }).join('')+'</tr>';
  h += '</table>';
  var fl = '';
  if(T.k !== null && !T.kc){ // la flèche garde sa place même cachée (tableau vide) : le tableau ne change pas de largeur
    fl = '<div class="fl"'+(T.vide || T.k === undefined ? ' style="visibility:hidden"' : '')+'>'+
      '<svg viewBox="0 0 16 52" aria-hidden="true"><path d="M1 12 C 13 12, 13 40, 7.5 40" fill="none" stroke="#17324D" stroke-width="1.8"/>'+
      // pointe pleine dans l'axe de la courbe (remarque de Gwenaël du 11/11 : l'ancienne pointe ouverte se confondait avec la courbe)
      '<path d="M1.2 40 L8.2 36.2 L8.2 43.8 Z" fill="#17324D"/></svg>'+
      '<span class="kt"'+(T.kw ? ' style="min-width:'+T.kw+'px"' : '')+'>'+m(T.k || '')+'</span></div>';
  }
  return '<div class="tha-bloc"><div class="tha-tab">'+h+fl+'</div>'+(T.note ? '<div class="tha-note">'+m(T.note)+'</div>' : '')+'</div>';
}

/* ================== Outils propres à la fiche (préfixe sem) ==================
   Deux triangles SÉPARÉS : le second est l'image du premier par un agrandissement (ou une réduction) de rapport s, tourné
   de rot degrés et retourné (flip) ; il est posé à droite du premier, centré en hauteur. Tout est en pixels de la figure.
   RÔLES DE COULEUR : une couleur par PAIRE de côtés homologues = une colonne du tableau (turquoise 'o', orange 'g',
   bleu marine 'b') ; les angles égaux ont le même nombre d'arcs (1, 2 ou 3) : lisible en noir et blanc. */
function semImage(pts, s, rot, flip){
  var r = rot*Math.PI/180, c = Math.cos(r), si = Math.sin(r);
  return pts.map(function(p){ var x = p[0]*s, y = (flip ? -p[1] : p[1])*s; return [x*c + y*si, -x*si + y*c]; });
}
function semBoite(pts){
  var xs = pts.map(function(p){ return p[0]; }), ys = pts.map(function(p){ return p[1]; });
  return [Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)];
}
/* pose T2 à droite de T1 (écart gap), centres à la même hauteur ; renvoie T2 déplacé */
function semPose(T1, T2, gap, dy){
  var b1 = semBoite(T1), b2 = semBoite(T2), tx = b1[2] + gap - b2[0], ty = (b1[1] + b1[3])/2 - (b2[1] + b2[3])/2 + (dy || 0);
  return T2.map(function(p){ return [p[0] + tx, p[1] + ty]; });
}
function semCentre(pts){ var c = [0, 0]; pts.forEach(function(p){ c[0] += p[0]/pts.length; c[1] += p[1]/pts.length; }); return c; }
/* le nom du sommet i, à l'extérieur, sur la bissectrice extérieure */
function semNom(G, pts, i, nom, d){
  var V = pts[i], P = pts[(i + pts.length - 1) % pts.length], N = pts[(i + 1) % pts.length];
  function u(Q){ var dx = Q[0]-V[0], dy = Q[1]-V[1], l = Math.hypot(dx, dy); return [dx/l, dy/l]; }
  var a = u(P), b = u(N), dx = -(a[0]+b[0]), dy = -(a[1]+b[1]), l = Math.hypot(dx, dy) || 1;
  d = d || 12;
  G.nom(V, nom, [dx/l*d, dy/l*d]);
}
/* une longueur écrite (horizontale) le long de [PQ], du côté opposé au centre C ; la boîte du texte touche presque le côté */
function semLong(G, P, Q, C, txt, role, o){
  o = o || {};
  var dx = Q[0]-P[0], dy = Q[1]-P[1], l = Math.hypot(dx, dy), nx = dy/l, ny = -dx/l, mx = (P[0]+Q[0])/2, my = (P[1]+Q[1])/2;
  if((C[0]-mx)*nx + (C[1]-my)*ny > 0){ nx = -nx; ny = -ny; }
  var T = geoTaille(txt, o.taille || 12.5), D = 5 + Math.abs(T[0]*nx) + Math.abs(T[1]*ny);
  G.texte([mx, my], txt, {pref:[nx*D, ny*D], role:role, taille:o.taille || 12.5, gras:o.gras});
}

/* ================== Exemple 1 : par les côtés (définition) ==================
   ABC : AB = 5, BC = 7, AC = 8 cm (en cm, y vers le haut : A(0 ; 0), C(8 ; 0), B(2,5 ; 4,33)).
   DEF = ABC agrandi de rapport 1,5, tourné et retourné : F = image de A, D = image de B, E = image de C
   (DF = 7,5 ↔ AB ; DE = 10,5 ↔ BC ; EF = 12 ↔ AC). 11 px par cm : la figure est à l'échelle. */
var E1 = 11, XB1 = (25 - 49 + 64)/16, YB1 = Math.sqrt(25 - XB1*XB1);
var ABC1 = [[0, 0], [XB1, YB1], [8, 0]].map(function(p){ return [p[0]*E1, -p[1]*E1]; });   // A, B, C
var IMG1 = semImage(ABC1, 1.5, 158, true);                                                // A′, B′, C′ = F, D, E
var DEF1 = semPose(ABC1, IMG1, 34, 0);
var F1 = {A:ABC1[0], B:ABC1[1], C:ABC1[2], F:DEF1[0], D:DEF1[1], E:DEF1[2]};
function semFig1(st){
  st = st || {};
  var G = geoScene(st), P = F1, ep = st.neutre ? 2.2 : 3;
  var c1 = semCentre([P.A, P.B, P.C]), c2 = semCentre([P.D, P.E, P.F]);
  // côtés : [AB] et [DF] turquoise, [BC] et [DE] orange, [AC] et [EF] bleu marine (une couleur par paire)
  G.poly([P.A, P.B, P.C], ['o', 'g', 'b'], {ep:ep});
  G.poly([P.F, P.D, P.E], ['o', 'g', 'b'], {ep:ep});
  semNom(G, [P.A, P.B, P.C], 0, 'A'); semNom(G, [P.A, P.B, P.C], 1, 'B'); semNom(G, [P.A, P.B, P.C], 2, 'C');
  semNom(G, [P.F, P.D, P.E], 0, 'F'); semNom(G, [P.F, P.D, P.E], 1, 'D'); semNom(G, [P.F, P.D, P.E], 2, 'E');
  semLong(G, P.A, P.B, c1, '5 cm', 'o'); semLong(G, P.B, P.C, c1, '7 cm', 'g'); semLong(G, P.A, P.C, c1, '8 cm', 'b');
  semLong(G, P.F, P.D, c2, '7,5 cm', 'o'); semLong(G, P.D, P.E, c2, '10,5 cm', 'g'); semLong(G, P.E, P.F, c2, '12 cm', 'b');
  // cadre FIXE (relecture : « 7,5 cm » changeait de côté d'une étape à l'autre) ; marges larges pour les longueurs dehors
  return G.svg({cadre:F1.cadre, larg:F1.larg, aria:'Le triangle ABC (AB = 5 cm, BC = 7 cm, AC = 8 cm) et le triangle DEF, tourné et retourné (DE = 10,5 cm, EF = 12 cm, DF = 7,5 cm)'});
}
(function(){ var b = semBoite([F1.A, F1.B, F1.C, F1.D, F1.E, F1.F]); F1.cadre = [b[0]-44, b[1]-18, b[2]+64, b[3]+18]; F1.larg = F1.cadre[2]-F1.cadre[0]; })();
function T1(h, b, k, on, kc){ return {h:['{ABC}'].concat(h), b:['{DEF}'].concat(b), k:k, on:on, kc:kc, kw:44}; }
var NOMS1 = T1(['<o>{AB}</o>','<g>{BC}</g>','<b1>{AC}</b1>'], ['<o>{DF}</o>','<g>{DE}</g>','<b1>{EF}</b1>'], '');
function sch1(T){ return function(st){ return '<div class="tha-sch">'+semFig1(st)+thTab(T)+'</div>'; }; }

/* ================== Exemple 2 : par les angles (propriété caractéristique, admise) ==================
   KLM : {LK̂M} = 33°, {KL̂M} = 102°, donc {KM̂L} = 45°. PQR : {QP̂R} = 45°, {PQ̂R} = 33° (donc {PR̂Q} = 102°).
   PQR = KLM agrandi de rapport 1,25, tourné et retourné : Q = image de K, R = image de L, P = image de M.
   Angles À L'ÉCHELLE (geoTriAngles) ; les angles égaux ont le même nombre d'arcs : 33° → 1, 45° → 2, 102° → 3.
   Couleurs : 33° bleu marine, 45° orange (l'angle calculé à l'étape 1), 102° turquoise ; à l'étape 3, chaque côté prend
   la couleur de l'angle qui est EN FACE (une colonne du tableau = une paire de côtés homologues). */
var TK = geoTriAngles([0, 0], 150, 33, 45);                     // B = K (33°), C = M (45°), A = L (102°)
var KLM2 = [TK.B, TK.A, TK.C];                                    // K, L, M
var IMG2 = semImage(KLM2, 1.25, 166, true);                       // Q, R, P
var PQR2 = semPose(KLM2, IMG2, 22, 0);
var F2 = {K:KLM2[0], L:KLM2[1], M:KLM2[2], Q:PQR2[0], R:PQR2[1], P:PQR2[2]};
(function(){ var b = semBoite([F2.K, F2.L, F2.M, F2.P, F2.Q, F2.R]); F2.cadre = [b[0]-24, b[1]-24, b[2]+24, b[3]+24]; F2.larg = F2.cadre[2]-F2.cadre[0]; })();
/* st = {neutre, a1 (étape 1 : l'angle M cherché), tr (45° trouvé), paires (étape 2 : les deux paires d'angles égaux),
         tous (les trois paires), cotes (côtés de la couleur de l'angle en face), nombres:false (sans mesures : Je retiens)} */
function semFig2(st){
  st = st || {};
  var G = geoScene(st), P = F2, ep = st.neutre ? 2.2 : 3, nb = st.nombres !== false;
  var rc = st.cotes ? ['g', 'b', 'o'] : 'n';     // [KL] en face de M (45°), [LM] en face de K (33°), [MK] en face de L (102°)
  G.poly([P.K, P.L, P.M], rc, {ep:ep});
  G.poly([P.Q, P.R, P.P], rc, {ep:ep});            // [QR] en face de P (45°), [RP] en face de Q (33°), [PQ] en face de R (102°)
  // étape 0 : seulement les angles donnés ; étape 1 : l'angle M cherché (orange), ceux de PQR en gris ;
  // étape 2 : les deux paires d'angles égaux (33° et 45°), 102° en gris ; étape 3 : les trois paires (côtés en couleur)
  var donnes = st.neutre || st.vide, pq = st.paires || st.tous;
  G.angle(P.K, P.M, P.L, {n:1, r:24, role:'b', txt:nb ? '33°' : '', remplir:!st.cotes});
  G.angle(P.L, P.K, P.M, {n:3, r:13, role:(st.a1 || st.tous) ? 'o' : 'gris', txt:nb ? '102°' : '', remplir:!st.cotes && !!st.a1});
  if(!donnes) G.angle(P.M, P.L, P.K, {n:2, r:19, role:'g', txt:nb ? (st.tr ? '45°' : '?') : '', remplir:!st.cotes});
  G.angle(P.P, P.Q, P.R, {n:2, r:19, role:(pq || donnes) ? 'g' : 'gris', txt:nb ? '45°' : '', remplir:!st.cotes && !!pq});
  G.angle(P.Q, P.R, P.P, {n:1, r:24, role:(pq || donnes) ? 'b' : 'gris', txt:nb ? '33°' : '', remplir:!st.cotes && !!pq});
  if(st.tous) G.angle(P.R, P.P, P.Q, {n:3, r:13, role:'o', txt:nb ? '102°' : '', remplir:false});
  var t1 = [P.K, P.L, P.M], t2 = [P.Q, P.R, P.P];
  semNom(G, t1, 0, 'K', 13); semNom(G, t1, 1, 'L', 12); semNom(G, t1, 2, 'M', 13);
  semNom(G, t2, 0, 'Q', 13); semNom(G, t2, 1, 'R', 12); semNom(G, t2, 2, 'P', 13);
  return G.svg({cadre:F2.cadre, larg:F2.larg, aria:'Le triangle KLM (angles de 33° en K et de 102° en L) et le triangle PQR, tourné et retourné (angles de 45° en P et de 33° en Q)'});
}
function T2(h, b, k, on){ return {h:['{KLM}'].concat(h), b:['{PQR}'].concat(b), k:k, on:on, kw:44}; }
var NOMS2 = T2(['<o>{KM}</o>','<g>{KL}</g>','<b1>{LM}</b1>'], ['<o>{PQ}</o>','<g>{QR}</g>','<b1>{PR}</b1>']);
/* l'AngleBarre de son outil : 180° EN HAUT (barre entière), les angles DESSOUS, l'angle cherché trouvé en enlevant */
function semBarre(st){
  if(st.neutre || st.vide) return barres({haut:[['&nbsp;', 'n']], bas:[['&nbsp;', 'n', 33], ['&nbsp;', 'n', 102], ['&nbsp;', 'n', 45]]}, true);
  return barres({haut:[['180°', 'n']], bas:[['33°', 'b', 33], ['102°', 'o', 102], [st.tr ? '45°' : '?', 'g', 45]]}, true);
}
function sch2(T){ return function(st){ return '<div class="tha-sch">'+semFig2(st)+(T ? thTab(T) : '<div style="width:100%;max-width:236px">'+semBarre(st)+'</div>')+'</div>'; }; }

// Q1 (NCETM S409 p. 27, Tom) : un triangle (angle de 48° en S) et son agrandissement de rapport 2 ; 10 px par unité
var SQ1 = geoTriAngles([0, 0], 70, 48, 64), SQ1b = semPose([SQ1.B, SQ1.A, SQ1.C], [SQ1.B, SQ1.A, SQ1.C].map(function(p){ return [p[0]*2, p[1]*2]; }), 26, 0);
function semQ1(st){
