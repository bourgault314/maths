function thStyle(){
  if(document.getElementById('tha-style')) return;
  var s = document.createElement('style'); s.id = 'tha-style'; s.textContent = THA_CSS; document.head.appendChild(s);
}

/* ---------- la configuration de Thalès ----------
   C = {S:[x,y] (le sommet commun, en pixels), a1, a2 (directions des deux droites, en degrés, sens de l'écran),
        e (pixels par cm : la figure est dessinée à cette taille), s:'A' (nom du sommet commun), d1:{M:4, B:10} et
        d2:{N:3.2, C:8} (distances au sommet commun, en cm, négatives de l'autre côté : papillon), par:['MN','BC'] (les côtés
        parallèles), petit:'AMN', noms:{A:[dx,dy]…} (place des lettres), lab:[{s:'AM', t:'4 cm', d:12, cote:false, q:'8 cm'}]
        (q : longueur cherchée, « ? » tant qu'elle n'est pas trouvée), larg (largeur maximale en px, sinon la taille dessinée),
        aria, plus:function(P, st) (ajouts)}
   st = {forts:['AM'] (en couleur, le reste en gris) ou ['*'] (tout en couleur), tr:true ou ['AC'] (longueurs trouvées), sans:true (pas de longueurs), ternes:['MN']}      */
function thPoints(C){
  var P = {}; P[C.s] = C.S;
  function pos(a, d){ var r = a*Math.PI/180; return [C.S[0]+Math.cos(r)*d*C.e, C.S[1]+Math.sin(r)*d*C.e]; }
  Object.keys(C.d1).forEach(function(k){ P[k] = pos(C.a1, C.d1[k]); });
  Object.keys(C.d2).forEach(function(k){ P[k] = pos(C.a2, C.d2[k]); });
  return P;
}
function thRole(C, seg){
  var l1 = [C.s].concat(Object.keys(C.d1)), l2 = [C.s].concat(Object.keys(C.d2));
  if(l1.indexOf(seg[0]) >= 0 && l1.indexOf(seg[1]) >= 0) return 'o';
  if(l2.indexOf(seg[0]) >= 0 && l2.indexOf(seg[1]) >= 0) return 'g';
  return 'b';
}
function thLigne(P, Q, coul, ep, extra){
  return '<line x1="'+P[0].toFixed(1)+'" y1="'+P[1].toFixed(1)+'" x2="'+Q[0].toFixed(1)+'" y2="'+Q[1].toFixed(1)+'" stroke="'+coul+'" stroke-width="'+ep+'" stroke-linecap="round"'+(extra||'')+'/>';
}
function thCroix(P){ var a = 3.2, x = P[0], y = P[1];
  return '<path d="M'+(x-a).toFixed(1)+' '+(y-a).toFixed(1)+' L'+(x+a).toFixed(1)+' '+(y+a).toFixed(1)+' M'+(x-a).toFixed(1)+' '+(y+a).toFixed(1)+' L'+(x+a).toFixed(1)+' '+(y-a).toFixed(1)+'" stroke="'+MAR+'" stroke-width="1.6" stroke-linecap="round" fill="none"/>'; }
function thTexte(x, y, t, opt){
  opt = opt || {};
  return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" '+(opt.serif ? SERIF : SANS)+' font-size="'+(opt.taille||12.5)+'"'+(opt.gras?' font-weight="bold"':'')+
         ' fill="'+(opt.coul||MAR)+'" text-anchor="'+(opt.a||'middle')+'" dominant-baseline="central"'+(opt.rot!==undefined?' transform="rotate('+opt.rot.toFixed(1)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"':'')+'>'+t+'</text>';
}
/* une étiquette le long de [PQ] (texte tourné dans le sens du segment, décalé de d : à gauche de P→Q si d > 0) ;
   B (facultatif) reçoit l'encombrement, pour que la figure calcule son cadre */
function thEtiq(P, Q, d, txt, coul, taille, gras, B, hz){
  var dx = Q[0]-P[0], dy = Q[1]-P[1], l = Math.hypot(dx, dy), nx = dy/l, ny = -dx/l, a = Math.atan2(dy, dx)*180/Math.PI;
  var x = (P[0]+Q[0])/2 + nx*d, y = (P[1]+Q[1])/2 + ny*d;
  if(a > 90) a -= 180; if(a < -90) a += 180;
  var w = String(txt).length*(taille||12.5)*0.31 + 2, h = (taille||12.5)*0.6;
  if(hz){ // texte horizontal (petits côtés) : hz = 'end' (à gauche du point d'ancrage), 'start' ou 'middle'
    if(B){ var x0 = hz === 'end' ? x-2*w : (hz === 'start' ? x : x-w); B.push([x0, y-h], [x0+2*w, y+h]); }
    return thTexte(x, y, txt, {coul:coul, taille:taille, gras:gras, a:hz});
  }
  if(B){ // encombrement du texte tourné (rectangle 2w × 2h tourné de a)
    var r = a*Math.PI/180, c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r)), ex = w*c + h*s, ey = w*s + h*c;
    B.push([x-ex, y-ey], [x+ex, y+ey]);
  }
  return thTexte(x, y, txt, {coul:coul, taille:taille, gras:gras, rot:a});
}
/* cote d'un segment : trait fin parallèle, décalé de d, petits traits aux bouts, texte au milieu (au-delà du trait) */
function thCote(P, Q, d, txt, coul, opt, B){
  opt = opt || {};
  var dx = Q[0]-P[0], dy = Q[1]-P[1], l = Math.hypot(dx, dy), nx = dy/l, ny = -dx/l;
  var A = [P[0]+nx*d, P[1]+ny*d], Bq = [Q[0]+nx*d, Q[1]+ny*d], t = 4;
  if(B) B.push(A, Bq);
  var s = thLigne(A, Bq, coul, 1.1) + thLigne([A[0]-nx*t, A[1]-ny*t], [A[0]+nx*t, A[1]+ny*t], coul, 1.1) + thLigne([Bq[0]-nx*t, Bq[1]-ny*t], [Bq[0]+nx*t, Bq[1]+ny*t], coul, 1.1);
  var sg = d > 0 ? 1 : -1;
  return s + thEtiq(P, Q, d + sg*9, txt, coul, opt.taille, opt.gras, B);
}
function thFig(C){
  return function(st){
    st = st || {};
    var P = thPoints(C), neutre = !!st.neutre, forts = neutre ? [] : (st.forts || []), ternes = neutre ? [] : (st.ternes || []), B = [];
    var s = '';
    // le petit triangle
    if(C.petit && !neutre) s += '<path d="M'+C.petit.split('').map(function(k){ return P[k][0].toFixed(1)+' '+P[k][1].toFixed(1); }).join(' L')+' Z" fill="'+THG.fond+'"/>';
    // aucun trait ne dépasse d'un sommet (règle du livret, comme pour Pythagore ; remarque de Gwenaël du 11/11/2026 sur Thalès) :
    // les traits sont découpés par les triangles « sommet commun + côté parallèle », élargis d'un demi-trait fin
    // les côtés dont parle l'étape : tous les traits ont la même épaisseur, ce qui ne sert pas passe en gris
    // (son choix du 11/11/2026, planches 8-9 ; comme les lignes écartées de la trigonométrie)
    var gris = forts.length > 0 && forts.indexOf('*') < 0;
    var dec = 'tha-d'+(++DECOUPE);
    s += '<defs><clipPath id="'+dec+'">'+C.par.map(function(seg){
      return '<path d="M'+triangleElargi([P[C.s], P[seg[0]], P[seg[1]]], 1.5).map(function(q){ return q[0].toFixed(2)+' '+q[1].toFixed(2); }).join(' L')+' Z"/>';
    }).join('')+'</clipPath>'+C.par.map(function(seg, j){
      // chaque côté parallèle est aussi découpé par SON triangle (quand l'ordre des points n'est pas le même, il entrerait dans l'autre)
      return '<clipPath id="'+dec+'p'+j+'"><path d="M'+triangleElargi([P[C.s], P[seg[0]], P[seg[1]]], 1.5).map(function(q){ return q[0].toFixed(2)+' '+q[1].toFixed(2); }).join(' L')+' Z"/></clipPath>';
    }).join('')+'</defs><g clip-path="url(#'+dec+')">';
    function dansSon(seg, trait){ var j = C.par.indexOf(seg) >= 0 ? C.par.indexOf(seg) : C.par.indexOf(seg[1]+seg[0]);
      return j < 0 ? trait : '<g clip-path="url(#'+dec+'p'+j+')">'+trait+'</g>'; }
    // un trait est prolongé au-delà d'un sommet puis découpé : l'angle est net (sans bout arrondi), comme dans Pythagore
    function prol(p, q, a, b){ var dx = q[0]-p[0], dy = q[1]-p[1], n = Math.sqrt(dx*dx+dy*dy) || 1;
      return [[p[0]-dx/n*a, p[1]-dy/n*a], [q[0]+dx/n*b, q[1]+dy/n*b]]; }
    var bouts = [];
    // les deux droites (du point le plus loin d'un côté au point le plus loin de l'autre), puis les côtés parallèles
    [C.d1, C.d2].forEach(function(d, i){
      var ks = Object.keys(d).concat([C.s]), val = function(k){ return k === C.s ? 0 : d[k]; };
      ks.sort(function(a, b){ return val(a) - val(b); });
      var seg = ks[0]+ks[ks.length-1], L = prol(P[ks[0]], P[ks[ks.length-1]], 6, 6); bouts.push(ks[0], ks[ks.length-1]);
      s += thLigne(L[0], L[1], neutre ? MAR : ((gris || ternes.indexOf(seg) >= 0) ? THG.gris : R[i ? 'g' : 'o'].trait), neutre ? 2.2 : 3);
    });
    C.par.forEach(function(seg){ var L = prol(P[seg[0]], P[seg[1]], 6, 6); s += dansSon(seg, thLigne(L[0], L[1], neutre ? MAR : ((gris || ternes.indexOf(seg) >= 0) ? THG.gris : R.b.trait), neutre ? 2.2 : 3)); });
    // les côtés dont parle l'étape, dans leur couleur, par-dessus le gris (« * » : tout est déjà en couleur)
    forts.filter(function(seg){ return seg !== '*'; }).forEach(function(seg){
      // prolongé seulement là où le trait s'arrête (bout d'une droite, côté parallèle) : jamais sur la suite de la droite
      var par = C.par.indexOf(seg) >= 0 || C.par.indexOf(seg[1]+seg[0]) >= 0;
      var L = prol(P[seg[0]], P[seg[1]], (par || bouts.indexOf(seg[0]) >= 0) ? 6 : 0, (par || bouts.indexOf(seg[1]) >= 0) ? 6 : 0);
      s += dansSon(seg, thLigne(L[0], L[1], R[thRole(C, seg)].trait, 3));
    });
    s += '</g>';
    if(C.plus) s += C.plus(P, st, B);
    // les longueurs (toujours placées, même cachées, pour que le cadre de la figure ne change pas)
    (C.lab || []).forEach(function(L){
      var role = thRole(C, L.s), coul = neutre ? MAR : R[role].txt, txt = L.t, gras = false, taille = L.taille || 12.5;
      if(L.q !== undefined){
        var trouve = st.tr === true || (st.tr && st.tr.indexOf(L.s) >= 0);
        txt = trouve ? L.q : '?'; gras = true; if(!trouve) taille = 17;
      }
      var p = P[L.s[0]], q = P[L.s[1]];
      // l'encombrement compte la valeur trouvée ET le « ? » : le cadre de la figure est le même à chaque étape
      if(L.q !== undefined){ var Bx = [];
        if(L.cote){ thCote(p, q, L.d, L.q, coul, {taille:L.taille || 12.5, gras:true}, Bx); thCote(p, q, L.d, '?', coul, {taille:17, gras:true}, Bx); }
        else { thEtiq(p, q, L.d, L.q, coul, L.taille || 12.5, true, Bx, L.h); thEtiq(p, q, L.d, '?', coul, 17, true, Bx, L.h); }
        Bx.forEach(function(b){ B.push(b); });
      }
      var t = L.cote ? thCote(p, q, L.d, txt, coul, {taille:taille, gras:gras}, L.q === undefined ? B : null)
                     : thEtiq(p, q, L.d, txt, coul, taille, gras, L.q === undefined ? B : null, L.h);
      if(!st.sans) s += t;
    });
    // les points et leurs noms : un point au croisement de deux traits n'a pas de marque ; un point seul sur un trait : une croix
    var bouts = C.par.join('');
    // un nom ne touche aucun trait (remarque de Gwenaël du 11/11 : « le point N est sur le segment ») : si la place donnée
    // touche un trait, on cherche autour du point la place libre la plus proche (lettre ≈ 12 × 11 px, 3,5 px de marge)
    var traits = [[C.d1, 0], [C.d2, 0]].map(function(dd){ var d = dd[0], ks = Object.keys(d).concat([C.s]);
      ks.sort(function(a, b){ return (a === C.s ? 0 : d[a]) - (b === C.s ? 0 : d[b]); }); return [P[ks[0]], P[ks[ks.length-1]]]; })
      .concat(C.par.map(function(sg){ return [P[sg[0]], P[sg[1]]]; }))
      // prolongés de 8 px : la pointe d'un angle aigu dépasse un peu le sommet
      .map(function(T){ var dx = T[1][0]-T[0][0], dy = T[1][1]-T[0][1], n = Math.sqrt(dx*dx+dy*dy) || 1;
        return [[T[0][0]-dx/n*8, T[0][1]-dy/n*8], [T[1][0]+dx/n*8, T[1][1]+dy/n*8]]; });
    // distance exacte entre la boîte de la lettre (12 × 11 px) et chaque trait
    function dPS(px, py, a, b){ var dx = b[0]-a[0], dy = b[1]-a[1], l2 = dx*dx+dy*dy, u = l2 ? Math.max(0, Math.min(1, ((px-a[0])*dx+(py-a[1])*dy)/l2)) : 0;
      return Math.hypot(px-a[0]-u*dx, py-a[1]-u*dy); }
    function marge(cx, cy){ var m = Infinity, x0 = cx-6, x1 = cx+6, y0 = cy-5.5, y1 = cy+5.5;
      traits.forEach(function(T){ var bonus = T[2] === 'fin' ? 2 : 0, a = T[0], b = T[1], dd;
        var dedans = function(p){ return p[0] >= x0 && p[0] <= x1 && p[1] >= y0 && p[1] <= y1; };
        var coupe = function(p, q, r, s){ var d = (q[0]-p[0])*(s[1]-r[1]) - (q[1]-p[1])*(s[0]-r[0]); if(!d) return false;
          var u = ((r[0]-p[0])*(s[1]-r[1]) - (r[1]-p[1])*(s[0]-r[0]))/d, v = ((r[0]-p[0])*(q[1]-p[1]) - (r[1]-p[1])*(q[0]-p[0]))/d; return u >= 0 && u <= 1 && v >= 0 && v <= 1; };
        var C4 = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
        if(dedans(a) || dedans(b) || [0,1,2,3].some(function(i){ return coupe(a, b, C4[i], C4[(i+1)%4]); })) dd = 0;
        else dd = Math.min.apply(null, C4.map(function(c){ return dPS(c[0], c[1], a, b); }));
        m = Math.min(m, dd + bonus); });
      return m; }
    // les longueurs écrites (et leurs traits de cote) comptent aussi : un nom ne touche pas une longueur
    var etiqs = [];
    (C.lab || []).forEach(function(L){ var p = P[L.s[0]], q = P[L.s[1]], dx = q[0]-p[0], dy = q[1]-p[1], l = Math.hypot(dx, dy), nx = dy/l, ny = -dx/l;
      var d = L.cote ? L.d + (L.d > 0 ? 9 : -9) : L.d, txt = [L.t, L.q, '?'].filter(function(z){ return z !== undefined; }).sort(function(u, v){ return String(v).length - String(u).length; })[0];
      var tl = L.taille || 12.5, w = String(txt).length*tl*0.27 + 1, h = tl*0.45, x = (p[0]+q[0])/2 + nx*d, y = (p[1]+q[1])/2 + ny*d, an = Math.atan2(dy, dx);
      if(L.h){ var x0 = L.h === 'end' ? x-w : (L.h === 'start' ? x+w : x); etiqs.push([x0, y, w, h, 0]); } else etiqs.push([x, y, w, h, an]);
      if(L.cote) traits.push([[p[0]+nx*L.d, p[1]+ny*L.d], [q[0]+nx*L.d, q[1]+ny*L.d], 'fin']); });
    function surEtiq(cx, cy){ return etiqs.some(function(E){ var c = Math.cos(E[4]), s = Math.sin(E[4]), lx = (cx-E[0])*c + (cy-E[1])*s, ly = -(cx-E[0])*s + (cy-E[1])*c;
      var ex = 6*Math.abs(c) + 5.5*Math.abs(s), ey = 6*Math.abs(s) + 5.5*Math.abs(c); return Math.abs(lx) < E[2]+ex+1 && Math.abs(ly) < E[3]+ey+1; }); }
    var poses = [];
    function placeNom(k, o){
      var p = P[k], libre = function(q){ return marge(p[0]+q[0], p[1]+q[1]) >= 3.5 && !surEtiq(p[0]+q[0], p[1]+q[1]) && poses.every(function(z){ return Math.abs(z[0]-p[0]-q[0]) > 12 || Math.abs(z[1]-p[1]-q[1]) > 11; }); };
      var best = o;
      if(!libre(o)){ var r0 = Math.sqrt(o[0]*o[0]+o[1]*o[1]), a0 = Math.atan2(o[1], o[0]), trouve = null;
        [r0, 12, 14, 16, 18, 21].some(function(r){ for(var j = 0; j <= 12; j++){ var cands = j ? [a0+j*Math.PI/12, a0-j*Math.PI/12] : [a0];
          for(var c = 0; c < cands.length; c++){ var q = [r*Math.cos(cands[c]), r*Math.sin(cands[c])]; if(libre(q)){ trouve = q; return true; } } } return false; });
        if(trouve) best = trouve; }
      poses.push([p[0]+best[0], p[1]+best[1]]); return best;
    }
    Object.keys(P).forEach(function(k){
      B.push(P[k]);
      if(k !== C.s && bouts.indexOf(k) < 0) s += thCroix(P[k]);
      var o = placeNom(k, C.noms[k] || [0, -10]), x = P[k][0]+o[0], y = P[k][1]+o[1];
      B.push([x-6, y-9], [x+6, y+9]);
      s += '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" '+SERIF+' font-size="15" fill="'+MAR+'" text-anchor="middle" dominant-baseline="central">'+k+'</text>';
    });
    // le cadre : ce qui est dessiné, plus une marge ; affiché à sa taille (ou à « larg » px de large au plus)
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    B.forEach(function(p){ x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
    var mg = 3, W = x1-x0+2*mg, vb = (x0-mg).toFixed(1)+' '+(y0-mg).toFixed(1)+' '+W.toFixed(1)+' '+(y1-y0+2*mg).toFixed(1);
    return '<svg class="tri tha-fig" viewBox="'+vb+'" style="max-width:'+Math.round(C.larg || W)+'px" role="img" aria-label="'+C.aria+'">' + s + '</svg>';
  };
}

/* ---------- le tableau des longueurs (petit triangle en haut, grand triangle en bas) ----------
   T = {h:['{AMN}','4','3,2','{MN}'], b:['{ABC}','10','{AC}','7'], k:'× 2,5' (ou '' : flèche sans nombre ; null : pas de flèche),
        on:[[0,1],[1,1]] (cases mises en avant : [ligne, colonne]), cols:[1,2,3] (colonnes affichées),
        kc:['× 2,5','× 2,5'] (une ligne « coefficient » sous chaque colonne), note:'…' (sous le tableau), vide:true,
        kw (largeur réservée au « × k », en px, pour que le tableau garde la même largeur à chaque étape)}  */
function thTab(T){
  var cols = T.cols || [1, 2, 3];
  function cel(r, j){
    if(T.vide) return '<td class="c'+j+' vide">·</td>';
    var v = (r === 0 ? T.h : T.b)[j], on = (T.on || []).some(function(c){ return c[0] === r && c[1] === j; });
    return '<td class="c'+j+(on ? ' on' : '')+'">'+m(v)+'</td>';
  }
  var h = '<table><tr><th'+(T.vide?' class="vide"':'')+'>'+(T.vide ? '·' : m(T.h[0]))+'</th>'+cols.map(function(j){ return cel(0, j); }).join('')+'</tr>'+
          '<tr><th'+(T.vide?' class="vide"':'')+'>'+(T.vide ? '·' : m(T.b[0]))+'</th>'+cols.map(function(j){ return cel(1, j); }).join('')+'</tr>';
  if(T.kc) h += '<tr class="kc"><td></td>'+T.kc.map(function(k){ return '<td>'+m(k)+'</td>'; }).join('')+'</tr>';

/* ---------- texte d'une étiquette : chiffres et signes en gras droit, 𝑥 rond ---------- */
function litTexte(lab, cx, cy, fs, coul, ancre){
  coul = coul || LIT.ENCRE;
  // 09/11 (iPhone) : pas de dominant-baseline. Safari ne le transmet pas au morceau 𝑥 (tspan) : le 𝑥 remontait
  // au-dessus du − et du ², qui ne paraissait plus en exposant. Tout le nom est posé sur la même ligne de base,
  // calculée à la main (milieu de la police DejaVu : 0,346 × taille au-dessus de la ligne de base).
  var s = '<text x="'+cx.toFixed(1)+'" y="'+(cy + 0.346*fs).toFixed(1)+'" text-anchor="'+(ancre||'middle')+'" font-size="'+fs.toFixed(1)+'" fill="'+coul+'" '+LIT_SANS+' font-weight="bold">';
  // découpe en morceaux : lettres rondes (U+1D400-1D7FF) d'un côté, le reste de l'autre
  var morceaux = lab.match(/(\uD835[\uDC00-\uDFFF])+|[^\uD835]+/g) || [];
  morceaux.forEach(function(p){
    if(/^\uD835/.test(p)) s += '<tspan '+LIT_SERIF+' font-weight="normal" font-size="'+(fs*1.12).toFixed(1)+'" stroke="'+coul+'" stroke-width="'+(fs*0.035).toFixed(2)+'">'+p+'</tspan>';
    else s += p;
  });
  return s + '</text>';
}
function litNomTuile(type, signe){
  var m = signe < 0 ? '−' : '';
  return type === '1' ? m+'1' : (type === 'x2' ? m+'𝑥²' : m+'𝑥');
}
/* lecture d'un code de tuile : '1', 'x', 'x2', '-1', '-x', '-x2' -> {type, signe} */
function litCode(c){
  var s = (c.charAt(0) === '-' || c.charAt(0) === '−') ? -1 : 1;
  return {type:c.replace(/^[-−]/,''), signe:s};
}

/* ---------- une tuile ----------
   type : '1' | 'x' (debout, 1 sur 𝑥) | 'xh' (couchée) | 'x2' ; signe : 1 ou -1
   opt : {w, h} (taille imposée, pour les tuiles des bords) ; fantome:true (enlevée : pointillés, sans fond) ;
         etiquette:false (sans nom) ; fs (taille du nom)                                                        */
function litTuile(x, y, type, signe, U, opt){
  opt = opt || {}; U = U || 20;
  var X = LIT.RX*U;
  var w = opt.w || (type === '1' ? U : (type === 'x' ? U : X));
  var h = opt.h || (type === '1' ? U : (type === 'xh' ? U : X));
  var fant = !!opt.fantome;
  var s = '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(fant ? 'none' : (signe < 0 ? LIT.NEG : LIT.POS))+
          '" stroke="'+(fant ? LIT.TERNE : LIT.ENCRE)+'" stroke-width="1.3"'+(fant ? ' stroke-dasharray="3 2.5"' : '')+'/>';
  if(opt.etiquette !== false && !fant && Math.min(w, h) >= 0.68*U){
    var t = (type === 'xh') ? 'x' : type;
    var fs = opt.fs || (t === 'x2' ? Math.min(0.85*U, 17) : Math.min(0.68*U, 13.5));
    // le nom doit tenir dans la tuile (largeur estimée en em : signe 0,84 ; chiffre 0,7 ; 𝑥 0,62 ; ² 0,45)
    var lem = (signe < 0 ? 0.84 : 0) + (t === '1' ? 0.7 : 0.62*1.12) + (t === 'x2' ? 0.45 : 0);
    fs = Math.min(fs, (w - 3) / lem);
    s += litTexte(litNomTuile(t, signe), x + w/2, y + h/2 + (t === 'x' ? -0.04*fs : 0), fs);
  }
  return s;
}

/* ---------- une collection de tuiles posées sur la table ----------
   elements : liste, posée de gauche à droite, tout aligné en bas :
     {t:'x'|'1'|'x2', n:3, s:-1}         n tuiles (les 𝑥 debout côte à côte, les 1 en colonnes de 3)
     {t:'1', n:3, s:-1, fantome:true}    tuiles enlevées (pointillés)
     {paire:'1'|'x'|'x2', n:2, gris:'avant'}   n paires nulles, chacune dans son cadre arrondi
                                         (blanche puis grise ; gris:'avant' = grise puis blanche)
     {txt:'→'} ou {txt:'= 0', coul:'#A85E06', fs:16}   un texte
   opt : {U, gap (entre groupes), aria, max (largeur max affichée), legende}                                   */
function litTas(elements, opt){
  opt = opt || {};
  var U = opt.U || 20, X = LIT.RX*U, e = 0.22*U, G = opt.gap || 0.75*U, pad = 4, fr = 0.2*U;
  var H = 0;   // hauteur utile (la plus haute pile)
  elements.forEach(function(el){
    var t = el.t || el.paire;
    if(t) H = Math.max(H, (t === '1' ? Math.min(el.n || 1, 3)*U + (Math.min(el.n || 1, 3)-1)*e : X) + (el.paire ? 2*fr : 0));
    if(el.txt) H = Math.max(H, U);
  });
  var bas = pad + H, x = pad, s = '';
  elements.forEach(function(el, k){
    if(k > 0) x += G;
    if(el.txt){
      var fs = el.fs || 18, wt = el.txt.length*fs*0.62 + 4;
      s += litTexte(el.txt, x + wt/2, bas - H/2, fs, el.coul || LIT.ENCRE);
      x += wt; return;
    }
    var n = el.n || 1;
    if(el.paire){
      var t = el.paire;
      for(var i = 0; i < n; i++){
        if(i > 0) x += 0.5*U;
        var w1 = (t === 'x2') ? X : U, h1 = (t === '1') ? U : X;
        var signes = el.gris === 'avant' ? [-1, 1] : [1, -1];
        var x1 = x + fr, y1 = bas - fr - h1;
        s += litTuile(x1, y1, t, signes[0], U) + litTuile(x1 + w1 + e, y1, t, signes[1], U);
        var W = 2*w1 + e + 2*fr;
        s += '<rect x="'+x.toFixed(1)+'" y="'+(bas - h1 - 2*fr).toFixed(1)+'" width="'+W.toFixed(1)+'" height="'+(h1 + 2*fr).toFixed(1)+'" rx="'+(0.35*U).toFixed(1)+'" fill="none" stroke="'+LIT.NUL+'" stroke-width="2"/>';
        x += W;
      }
      return;
    }
    var sg = el.s || 1, o = {fantome:!!el.fantome};
    if(el.t === '1'){
      var cols = Math.ceil(n/3);
      for(var c = 0; c < cols; c++){
        var dans = Math.min(3, n - 3*c);
        for(var r = 0; r < dans; r++) s += litTuile(x + c*(U+e), bas - (r+1)*U - r*e, '1', sg, U, o);
      }
      x += cols*U + (cols-1)*e;
    } else {
      var wt2 = (el.t === 'x2') ? X : U;
      for(var j = 0; j < n; j++) s += litTuile(x + j*(wt2+e), bas - X, el.t, sg, U, o);
      x += n*wt2 + (n-1)*e;
    }
  });
  var Wtot = x + pad, Htot = bas + pad;
  return '<svg class="lit-fig" viewBox="0 0 '+Wtot.toFixed(1)+' '+Htot.toFixed(1)+'" style="max-width:'+Math.round(opt.max || Wtot)+'px" role="img" aria-label="'+(opt.aria || 'Des tuiles algébriques')+'">'+s+'</svg>'+
         (opt.legende ? '<p class="lit-leg">'+opt.legende+'</p>' : '');
}

/* ---------- un produit : les facteurs en tuiles sur les bords, le produit au milieu ----------
   opt.haut   : tuiles du SECOND facteur, posées en haut (couchées), ex. ['x','1','1'] pour 𝑥 + 2
   opt.gauche : tuiles du PREMIER facteur, posées à gauche (debout), ex. ['1','1','1'] pour 3
                (codes '1', 'x' ; un facteur négatif ne se dessine pas : litTableau)
   opt.noms   : {haut:[['𝑥',1],['2',2]], gauche:[['3',3]]} : noms des facteurs, chacun au-dessus (ou à gauche)
                du nombre de tuiles indiqué ; sans noms : pas d'étiquettes (l'élève lit les tuiles)
   opt.produit: true (défaut) ; false = rectangle vide en pointillés (à remplir) ; liste de cases à montrer [[r,c],…]
   opt.bords  : true (défaut) ; '?' = bords inconnus (pointillés et « ? ») pour factoriser ; 'haut?' = seul le haut inconnu
   opt.cadres : [{r:[r0,r1], c:[c0,c1]}] cases du produit entourées (turquoise) ; opt.cadresBords:true entoure aussi
                les tuiles des bords correspondantes
   opt.U (20), opt.max, opt.aria, opt.legende                                                                     */
function litRectangle(opt){
  var U = opt.U || 20, X = LIT.RX*U, ins = 0.12*U, g = 0.22*U, pad = 4;
  var H_ = opt.haut.map(litCode), G_ = opt.gauche.map(litCode);
  var w = H_.map(function(c){ return c.type === 'x' ? X : U; });
  var h = G_.map(function(c){ return c.type === 'x' ? X : U; });
  var W = w.reduce(function(a,b){return a+b;}, 0), Hh = h.reduce(function(a,b){return a+b;}, 0);
  var noms = opt.noms || {};
  var fsN = opt.fsNoms || 16;
  function lg(t){ return t.replace(/\uD835[\uDC00-\uDFFF]/g,'x').length; }
  var Lg = noms.gauche ? Math.max.apply(null, noms.gauche.map(function(n){ return lg(n[0]); }))*fsN*0.66 + 6 : 0;
  var Th = noms.haut ? fsN + 6 : 0;
  var x0 = pad + Lg, y0 = pad + Th;
  var px = x0 + U + 2*g, py = y0 + U + 2*g;
  var inconnuHaut = opt.bords === '?' || opt.bords === 'haut?', inconnuGauche = opt.bords === '?';
  var s = '';
  function cum(a, i){ var t = 0; for(var k = 0; k < i; k++) t += a[k]; return t; }
  // tuiles du haut (couchées)
  H_.forEach(function(c, i){
    var xx = px + cum(w, i) + ins;
    s += litTuile(xx, y0, c.type === 'x' ? 'xh' : '1', c.signe, U, {w:w[i]-2*ins, h:U, fantome:inconnuHaut});
  });
  // tuiles de gauche (debout)
  G_.forEach(function(c, j){
    var yy = py + cum(h, j) + ins;
    s += litTuile(x0, yy, c.type === 'x' ? 'x' : '1', c.signe, U, {w:U, h:h[j]-2*ins, fantome:inconnuGauche});
  });
  // le produit
  var montrer = opt.produit === undefined ? true : opt.produit;
  G_.forEach(function(cg, j){
    H_.forEach(function(ch, i){
      var vis = montrer === true || (Array.isArray(montrer) && montrer.some(function(p){ return p[0] === j && p[1] === i; }));
      var tx = (ch.type === 'x' && cg.type === 'x') ? 'x2' : (ch.type === 'x' ? 'xh' : (cg.type === 'x' ? 'x' : '1'));
      s += litTuile(px + cum(w, i), py + cum(h, j), tx, ch.signe*cg.signe, U, {w:w[i], h:h[j], fantome:!vis});
    });
  });
  // les deux traits de séparation
  s += '<path d="M'+pad+' '+(y0+U+g).toFixed(1)+' H'+(px+W).toFixed(1)+'" stroke="'+LIT.ENCRE+'" stroke-width="1.4" fill="none"/>';
  s += '<path d="M'+(x0+U+g).toFixed(1)+' '+pad+' V'+(py+Hh).toFixed(1)+'" stroke="'+LIT.ENCRE+'" stroke-width="1.4" fill="none"/>';
  // cases entourées
  (opt.cadres || []).forEach(function(cd){
    var xa = px + cum(w, cd.c[0]), xb = px + cum(w, cd.c[1]+1), ya = py + cum(h, cd.r[0]), yb = py + cum(h, cd.r[1]+1);
    s += '<rect x="'+(xa-1.5).toFixed(1)+'" y="'+(ya-1.5).toFixed(1)+'" width="'+(xb-xa+3).toFixed(1)+'" height="'+(yb-ya+3).toFixed(1)+'" rx="3" fill="none" stroke="'+LIT.PR.trait+'" stroke-width="3"/>';
    if(opt.cadresBords){
      s += '<rect x="'+(xa-1.5).toFixed(1)+'" y="'+(y0-1.5).toFixed(1)+'" width="'+(xb-xa+3).toFixed(1)+'" height="'+(U+3).toFixed(1)+'" rx="3" fill="none" stroke="'+LIT.P2.trait+'" stroke-width="2.6"/>';
      s += '<rect x="'+(x0-1.5).toFixed(1)+'" y="'+(ya-1.5).toFixed(1)+'" width="'+(U+3).toFixed(1)+'" height="'+(yb-ya+3).toFixed(1)+'" rx="3" fill="none" stroke="'+LIT.P1.trait+'" stroke-width="2.6"/>';
    }
  });
  // noms des facteurs
  var k = 0;
  (noms.haut || []).forEach(function(n){
    var xa = px + cum(w, k), xb = px + cum(w, k + n[1]); k += n[1];
    s += litTexte(inconnuHaut && !opt.nomsConnus ? '?' : n[0], (xa+xb)/2, pad + Th/2 - 1, fsN, LIT.P2.txt);
  });
  k = 0;
  (noms.gauche || []).forEach(function(n){
    var ya = py + cum(h, k), yb = py + cum(h, k + n[1]); k += n[1];
    s += litTexte(inconnuGauche && !opt.nomsConnus ? '?' : n[0], x0 - 5, (ya+yb)/2, fsN, LIT.P1.txt, 'end');
  });
  var Wt = px + W + pad, Ht = py + Hh + pad;
  return '<svg class="lit-fig" viewBox="0 0 '+Wt.toFixed(1)+' '+Ht.toFixed(1)+'" style="max-width:'+Math.round(opt.max || Wt)+'px" role="img" aria-label="'+(opt.aria || 'Un produit avec les tuiles : les facteurs sur les bords, le produit au milieu')+'">'+s+'</svg>'+
         (opt.legende ? '<p class="lit-leg">'+opt.legende+'</p>' : '');
}

/* ---------- le tableau produit seul (HTML) ----------
   opt.haut  : termes du SECOND facteur (en haut), ex. ['𝑥', '−2']
   opt.gauche: termes du PREMIER facteur (à gauche), ex. ['−3'] (plusieurs lignes : double distributivité)
   opt.cases : produits, ligne par ligne, ex. [['−3𝑥', '+6']] ; '' = case vide ; '?' = à trouver (pointillés)
   Dans haut et gauche aussi : '' = vide, '?' = à trouver (factoriser : « je connais les cases, je cherche les bords »).
   opt.marque : [[ligne, colonne], …] cases entourées (celle qu'on calcule) ; opt.petit : plus serré ;
   opt.legende : une ligne sous le tableau.                                                                     */
function litTableau(opt){
  function cel(t, cls){ var q = (t === '?'); return '<td class="'+(q ? 'lit-q' : cls)+'">'+(t === '' ? '&nbsp;' : m(litNB(t)))+'</td>'; }
  var mq = opt.marque || [];
  var h = '<table class="lit-tab'+(opt.petit ? ' lit-petit' : '')+'" role="table"><tr><td class="lit-coin">×</td>'+opt.haut.map(function(t){ return cel(t, 'lit-h'); }).join('')+'</tr>';
  opt.gauche.forEach(function(g, j){
    h += '<tr>'+cel(g, 'lit-gch')+(opt.cases[j] || []).map(function(t, i){
      var marque = mq.some(function(p){ return p[0] === j && p[1] === i; });
      return cel(t, 'lit-c'+(marque ? ' lit-m' : ''));
    }).join('')+'</tr>';
  });
  return '<div class="lit-tabw">'+h+'</table>'+(opt.legende ? '<p class="lit-leg">'+m(litNB(opt.legende))+'</p>' : '')+'</div>';
}

/* ---------- une égalité avec les flèches de ses bilans ----------
   en haut, « Développement » (du produit vers la somme) ; en bas, « Factorisation » (de la somme vers le produit).
   opt.dev:false ou opt.fac:false pour n'en garder qu'une.                                                      */
function litBilan(formule, opt){
  opt = opt || {};
  var nb = /^\[\[([\s\S]*)\]\]$/.exec(formule), f = nb ? nb[1] : formule, i = f.indexOf(' = ');
  // un membre -> [avant, repère, après] (le repère entre deux § ; sans §, tout le membre) ; espaces des bords insécables
  function parts(x){
    var p = x.split('§'); if(p.length !== 3) p = ['', x, ''];
    return p.map(function(s){ s = s.replace(/^ /, '\u00a0').replace(/ $/, '\u00a0'); return m(litNB(nb ? '[['+s+']]' : s)); });
  }
  var G = parts(f.slice(0, i)), D = parts(f.slice(i + 3));
  var bas = '<svg viewBox="0 0 12 10" aria-hidden="true"><path d="M0 0H12L6 10Z" fill="#A85E06"/></svg>',
      haut = '<svg viewBox="0 0 12 10" aria-hidden="true"><path d="M0 10H12L6 0Z" fill="#A85E06"/></svg>';
  // repère vide (« (𝑎 + 𝑏)§§(𝑐 + 𝑑) ») : sa colonne n'a pas de largeur, le trait part d'entre les parenthèses
  var zG = /^§§/.test(f.slice(0, i).replace(/^[^§]*/, '')) ? ' z' : '', zD = /^§§/.test(f.slice(i + 3).replace(/^[^§]*/, '')) ? ' z' : '';
  function fleche(cls, ptG, ptD){
    return '<div></div><div class="lit-a '+cls+' g'+zG+'">'+ptG+'</div><div class="lit-a '+cls+'"></div><div class="lit-a '+cls+'"></div>'+
           '<div class="lit-a '+cls+'"></div><div class="lit-a '+cls+' d'+zD+'">'+ptD+'</div><div></div>';
  }
  return '<div class="lit-bilanw"><div class="lit-bil">'+
         (opt.dev === false ? '' : '<div></div><div class="lit-nom">Développement</div><div></div>'+fleche('lit-haut', '', bas))+
         '<div class="lit-p">'+G[0]+'</div><div class="lit-p">'+G[1]+'</div><div class="lit-p">'+G[2]+'</div><div class="lit-eg">=</div>'+
         '<div class="lit-p">'+D[0]+'</div><div class="lit-p">'+D[1]+'</div><div class="lit-p">'+D[2]+'</div>'+
         (opt.fac === false ? '' : fleche('lit-bas', haut, '')+'<div></div><div class="lit-nom">Factorisation</div><div></div>')+'</div></div>';
}
/* ---------- calculs qui ne se coupent pas en fin de ligne ----------
   Dans un texte, [[2𝑥 + 𝑥 = (2 + 1) × 𝑥 = 3𝑥]] : les espaces deviennent insécables, sauf celle qui suit un signe =
   (la ligne ne peut se couper qu'après un =, et pas du tout dans un calcul court de 16 caractères au plus). litNB(texte) ; litNBtout(objet) traite toutes les chaînes d'un objet
   (exemples, questions) avant que le moteur ne les affiche.                                                    */
function litNB(s){
  // (et pas de coupure devant une parenthèse collée : « )( », « 3𝑥( » : gluon U+2060)
  return s.replace(/\[\[([\s\S]+?)\]\]/g, function(t, c){ return c.replace(/ /g, '\u00a0').replace(/\u00a0=\u00a0/g, c.length > 16 ? '\u00a0= ' : '\u00a0=\u00a0').replace(/([^\s\u00a0])\(/g, '$1\u2060('); });
}
function litNBtout(o){
  if(typeof o === 'string') return litNB(o);
  if(Array.isArray(o)) return o.map(litNBtout);
  if(o && typeof o === 'object'){ Object.keys(o).forEach(function(k){ if(typeof o[k] !== 'function') o[k] = litNBtout(o[k]); }); }
  return o;
}
/* ---------- une boîte de hauteur fixe pour la figure d'un exemple ----------
   Le cadre d'un exemple ne doit pas changer de hauteur d'une étape à l'autre : chaque figure d'étape est posée
   dans une boîte de même hauteur (en px), contenu centré. Garder les figures à 300 px de large au plus
   (elles ne rapetissent pas entre 360 et 390 px d'écran : hauteur identique).                                  */
function litBoite(html, h){
  return '<div class="lit-boite" style="min-height:'+h+'px;height:'+h+'px;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%">'+html+'</div>';
}

/* FICHE 3e-LIT-11 — Je sais développer (𝑎 + 𝑏)² et (𝑎 − 𝑏)² sans oublier le double produit (fiche « méthode », 3e,
   NOUVEAU PROGRAMME : étudiée dès cette année sans être évaluée (IA-IPR), cours partie 2, marche 13, pastilles
   « nouveau programme »). Lot LIT-B, 08/11/2026.
   Matière : son cours partie 2, marche 13 (le carré de tuiles (𝑥 + 3)² : « deux paquets de 3 tuiles 𝑥 : le double produit
   2 × 𝑥 × 3 = 6𝑥 » ; le tableau de (𝑥 − 3)² : « deux cases −3𝑥 : le double produit ») ; « Les pièges » (𝑥² + 9, (2𝑥)²) ;
   feuille 5, ex. 30 à 33 et 37 ; Automatismes 10, ★ du cadre 5. Marche 14, encadré ★ : factoriser avec (𝑎 ± 𝑏)² (nouveau
   programme, pour aller plus loin).
   Rôles de couleur (tuiles.js) : premier facteur = orange <g> ; second facteur = bleu marine <b1> ; produits = turquoise <o>.
   Fabriquée par le moteur commun : python build.py fiche <ce dossier> <sortie.html> */

function nw(s){ return '<span style="white-space:nowrap">'+s+'</span>'; }   // une expression qui ne se coupe pas
function boite(h, contenu){ return '<div style="height:'+h+'px;display:flex;align-items:center;justify-content:center;gap:10px">'+contenu+'</div>'; }

/* ================== Exemple 1 : (𝑥 + 3)², le carré de tuiles ================== */
var PAQUETS = [{r:[0,0], c:[1,3]}, {r:[1,3], c:[0,0]}];
function ex1(st){
  var k = st.k || 0;
  var rect = litRectangle({haut:['x','1','1','1'], gauche:['x','1','1','1'], U:14, max:150,
    noms:{haut:[['𝑥',1],['3',3]], gauche:[['𝑥',1],['3',3]]}, produit:k ? true : [], cadres:st.cadres || [],
    aria:'Le carré de tuiles (𝑥 + 3)² : 𝑥 + 3 à gauche et en haut'});
  var tab = litTableau({haut:['𝑥','3'], gauche:['𝑥','3'], cases:k ? [['𝑥²','3𝑥'],['3𝑥','9']] : [['',''],['','']], petit:true, marque:st.marque || []});
  return boite(150, '<div style="flex:1 1 52%;min-width:0">'+rect+'</div><div style="flex:0 0 auto">'+tab+'</div>');
}
/* ================== Exemple 2 : (2𝑥 − 3)², le tableau seul ================== */
function ex2(st){
  var k = st.k || 0;
  return boite(140, litTableau({haut:['2𝑥','−3'], gauche:['2𝑥','−3'], cases:k ? [['4𝑥²','−6𝑥'],['−6𝑥','+9']] : [['',''],['','']],
    marque:st.marque || [], legende:st.leg || '&nbsp;'}));
}

/* « cos SR̂T », « (sin Â)² » : l'écriture ne se coupe pas en fin de ligne (sans cela, la ligne se coupait avant le chapeau ou avant « )² ») */
function insec(o){
  if(typeof o === 'string') return o.replace(/\((cos|sin) (\{[^}]+\})\)²/g, '<span style="white-space:nowrap">($1 $2)²</span>')
                                    .replace(/\b(cos|sin) (\{[^}]+\})/g, '<span style="white-space:nowrap">$1 $2</span>')
                                    .replace(/\b(cos|sin) (?=[0-9(])/g, '$1\u00a0');
  if(Array.isArray(o)) return o.map(insec);
  if(o && typeof o === 'object'){ var c = {}; for(var k in o) c[k] = insec(o[k]); return c; }
  return o;
}
