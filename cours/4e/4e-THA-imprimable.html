function thStyle(){
  if(document.getElementById('tha-style')) return;
  var s = document.createElement('style'); s.id = 'tha-style'; s.textContent = THA_CSS; document.head.appendChild(s);
}

/* ---------- la configuration de Thalès ----------
   C = {S:[x,y] (le sommet commun, en pixels), a1, a2 (directions des deux droites, en degrés, sens de l'écran),
        e (pixels par cm : la figure est dessinée à cette taille), s:'A' (nom du sommet commun), d1:{M:4, B:10} et
        d2:{N:3.2, C:8} (distances au sommet commun, en cm, négatives de l'autre côté : papillon), par:['MN','BC'] (les côtés
        parallèles), petit:'AMN', noms:{A:[dx,dy]…} (place des lettres), lab:[{s:'AM', t:'4 cm', d:12, cote:false, q:'8 cm'}]
        (q : longueur cherchée, « ? » tant qu'elle n'est pas trouvée), larg (largeur maximale en px, sinon la taille dessinée),
        aria, plus:function(P, st) (ajouts)}
   st = {forts:['AM'] (en couleur, le reste en gris) ou ['*'] (tout en couleur), tr:true ou ['AC'] (longueurs trouvées), sans:true (pas de longueurs), ternes:['MN']}      */
function thPoints(C){
  var P = {}; P[C.s] = C.S;
  function pos(a, d){ var r = a*Math.PI/180; return [C.S[0]+Math.cos(r)*d*C.e, C.S[1]+Math.sin(r)*d*C.e]; }
  Object.keys(C.d1).forEach(function(k){ P[k] = pos(C.a1, C.d1[k]); });
  Object.keys(C.d2).forEach(function(k){ P[k] = pos(C.a2, C.d2[k]); });
  return P;
}
function thRole(C, seg){
  var l1 = [C.s].concat(Object.keys(C.d1)), l2 = [C.s].concat(Object.keys(C.d2));
  if(l1.indexOf(seg[0]) >= 0 && l1.indexOf(seg[1]) >= 0) return 'o';
  if(l2.indexOf(seg[0]) >= 0 && l2.indexOf(seg[1]) >= 0) return 'g';
  return 'b';
}
function thLigne(P, Q, coul, ep, extra){
  return '<line x1="'+P[0].toFixed(1)+'" y1="'+P[1].toFixed(1)+'" x2="'+Q[0].toFixed(1)+'" y2="'+Q[1].toFixed(1)+'" stroke="'+coul+'" stroke-width="'+ep+'" stroke-linecap="round"'+(extra||'')+'/>';
}
function thCroix(P){ var a = 3.2, x = P[0], y = P[1];
  return '<path d="M'+(x-a).toFixed(1)+' '+(y-a).toFixed(1)+' L'+(x+a).toFixed(1)+' '+(y+a).toFixed(1)+' M'+(x-a).toFixed(1)+' '+(y+a).toFixed(1)+' L'+(x+a).toFixed(1)+' '+(y-a).toFixed(1)+'" stroke="'+MAR+'" stroke-width="1.6" stroke-linecap="round" fill="none"/>'; }
function thTexte(x, y, t, opt){
  opt = opt || {};
  return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" '+(opt.serif ? SERIF : SANS)+' font-size="'+(opt.taille||12.5)+'"'+(opt.gras?' font-weight="bold"':'')+
         ' fill="'+(opt.coul||MAR)+'" text-anchor="'+(opt.a||'middle')+'" dominant-baseline="central"'+(opt.rot!==undefined?' transform="rotate('+opt.rot.toFixed(1)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"':'')+'>'+t+'</text>';
}
/* une étiquette le long de [PQ] (texte tourné dans le sens du segment, décalé de d : à gauche de P→Q si d > 0) ;
   B (facultatif) reçoit l'encombrement, pour que la figure calcule son cadre */
function thEtiq(P, Q, d, txt, coul, taille, gras, B, hz){
  var dx = Q[0]-P[0], dy = Q[1]-P[1], l = Math.hypot(dx, dy), nx = dy/l, ny = -dx/l, a = Math.atan2(dy, dx)*180/Math.PI;
  var x = (P[0]+Q[0])/2 + nx*d, y = (P[1]+Q[1])/2 + ny*d;
  if(a > 90) a -= 180; if(a < -90) a += 180;
  var w = String(txt).length*(taille||12.5)*0.31 + 2, h = (taille||12.5)*0.6;
  if(hz){ // texte horizontal (petits côtés) : hz = 'end' (à gauche du point d'ancrage), 'start' ou 'middle'
    if(B){ var x0 = hz === 'end' ? x-2*w : (hz === 'start' ? x : x-w); B.push([x0, y-h], [x0+2*w, y+h]); }
    return thTexte(x, y, txt, {coul:coul, taille:taille, gras:gras, a:hz});
  }
  if(B){ // encombrement du texte tourné (rectangle 2w × 2h tourné de a)
    var r = a*Math.PI/180, c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r)), ex = w*c + h*s, ey = w*s + h*c;
    B.push([x-ex, y-ey], [x+ex, y+ey]);
  }
  return thTexte(x, y, txt, {coul:coul, taille:taille, gras:gras, rot:a});
}
/* cote d'un segment : trait fin parallèle, décalé de d, petits traits aux bouts, texte au milieu (au-delà du trait) */
function thCote(P, Q, d, txt, coul, opt, B){
  opt = opt || {};
  var dx = Q[0]-P[0], dy = Q[1]-P[1], l = Math.hypot(dx, dy), nx = dy/l, ny = -dx/l;
  var A = [P[0]+nx*d, P[1]+ny*d], Bq = [Q[0]+nx*d, Q[1]+ny*d], t = 4;
  if(B) B.push(A, Bq);
  var s = thLigne(A, Bq, coul, 1.1) + thLigne([A[0]-nx*t, A[1]-ny*t], [A[0]+nx*t, A[1]+ny*t], coul, 1.1) + thLigne([Bq[0]-nx*t, Bq[1]-ny*t], [Bq[0]+nx*t, Bq[1]+ny*t], coul, 1.1);
  var sg = d > 0 ? 1 : -1;
  return s + thEtiq(P, Q, d + sg*9, txt, coul, opt.taille, opt.gras, B);
}
function thFig(C){
  return function(st){
    st = st || {};
    var P = thPoints(C), neutre = !!st.neutre, forts = neutre ? [] : (st.forts || []), ternes = neutre ? [] : (st.ternes || []), B = [];
    var s = '';
    // le petit triangle
    if(C.petit && !neutre) s += '<path d="M'+C.petit.split('').map(function(k){ return P[k][0].toFixed(1)+' '+P[k][1].toFixed(1); }).join(' L')+' Z" fill="'+THG.fond+'"/>';
    // aucun trait ne dépasse d'un sommet (règle du livret, comme pour Pythagore ; remarque de Gwenaël du 11/11/2026 sur Thalès) :
    // les traits sont découpés par les triangles « sommet commun + côté parallèle », élargis d'un demi-trait fin
    // les côtés dont parle l'étape : tous les traits ont la même épaisseur, ce qui ne sert pas passe en gris
    // (son choix du 11/11/2026, planches 8-9 ; comme les lignes écartées de la trigonométrie)
    var gris = forts.length > 0 && forts.indexOf('*') < 0;
    var dec = 'tha-d'+(++DECOUPE);
    s += '<defs><clipPath id="'+dec+'">'+C.par.map(function(seg){
      return '<path d="M'+triangleElargi([P[C.s], P[seg[0]], P[seg[1]]], 1.5).map(function(q){ return q[0].toFixed(2)+' '+q[1].toFixed(2); }).join(' L')+' Z"/>';
    }).join('')+'</clipPath>'+C.par.map(function(seg, j){
      // chaque côté parallèle est aussi découpé par SON triangle (quand l'ordre des points n'est pas le même, il entrerait dans l'autre)
      return '<clipPath id="'+dec+'p'+j+'"><path d="M'+triangleElargi([P[C.s], P[seg[0]], P[seg[1]]], 1.5).map(function(q){ return q[0].toFixed(2)+' '+q[1].toFixed(2); }).join(' L')+' Z"/></clipPath>';
    }).join('')+'</defs><g clip-path="url(#'+dec+')">';
    function dansSon(seg, trait){ var j = C.par.indexOf(seg) >= 0 ? C.par.indexOf(seg) : C.par.indexOf(seg[1]+seg[0]);
      return j < 0 ? trait : '<g clip-path="url(#'+dec+'p'+j+')">'+trait+'</g>'; }
    // un trait est prolongé au-delà d'un sommet puis découpé : l'angle est net (sans bout arrondi), comme dans Pythagore
    function prol(p, q, a, b){ var dx = q[0]-p[0], dy = q[1]-p[1], n = Math.sqrt(dx*dx+dy*dy) || 1;
      return [[p[0]-dx/n*a, p[1]-dy/n*a], [q[0]+dx/n*b, q[1]+dy/n*b]]; }
    var bouts = [];
    // les deux droites (du point le plus loin d'un côté au point le plus loin de l'autre), puis les côtés parallèles
    [C.d1, C.d2].forEach(function(d, i){
      var ks = Object.keys(d).concat([C.s]), val = function(k){ return k === C.s ? 0 : d[k]; };
      ks.sort(function(a, b){ return val(a) - val(b); });
      var seg = ks[0]+ks[ks.length-1], L = prol(P[ks[0]], P[ks[ks.length-1]], 6, 6); bouts.push(ks[0], ks[ks.length-1]);
      s += thLigne(L[0], L[1], neutre ? MAR : ((gris || ternes.indexOf(seg) >= 0) ? THG.gris : R[i ? 'g' : 'o'].trait), neutre ? 2.2 : 3);
    });
    C.par.forEach(function(seg){ var L = prol(P[seg[0]], P[seg[1]], 6, 6); s += dansSon(seg, thLigne(L[0], L[1], neutre ? MAR : ((gris || ternes.indexOf(seg) >= 0) ? THG.gris : R.b.trait), neutre ? 2.2 : 3)); });
    // les côtés dont parle l'étape, dans leur couleur, par-dessus le gris (« * » : tout est déjà en couleur)
    forts.filter(function(seg){ return seg !== '*'; }).forEach(function(seg){
      // prolongé seulement là où le trait s'arrête (bout d'une droite, côté parallèle) : jamais sur la suite de la droite
      var par = C.par.indexOf(seg) >= 0 || C.par.indexOf(seg[1]+seg[0]) >= 0;
      var L = prol(P[seg[0]], P[seg[1]], (par || bouts.indexOf(seg[0]) >= 0) ? 6 : 0, (par || bouts.indexOf(seg[1]) >= 0) ? 6 : 0);
      s += dansSon(seg, thLigne(L[0], L[1], R[thRole(C, seg)].trait, 3));
    });
    s += '</g>';
    if(C.plus) s += C.plus(P, st, B);
    // les longueurs (toujours placées, même cachées, pour que le cadre de la figure ne change pas)
    (C.lab || []).forEach(function(L){
      var role = thRole(C, L.s), coul = neutre ? MAR : R[role].txt, txt = L.t, gras = false, taille = L.taille || 12.5;
      if(L.q !== undefined){
        var trouve = st.tr === true || (st.tr && st.tr.indexOf(L.s) >= 0);
        txt = trouve ? L.q : '?'; gras = true; if(!trouve) taille = 17;
      }
      var p = P[L.s[0]], q = P[L.s[1]];
      // l'encombrement compte la valeur trouvée ET le « ? » : le cadre de la figure est le même à chaque étape
      if(L.q !== undefined){ var Bx = [];
        if(L.cote){ thCote(p, q, L.d, L.q, coul, {taille:L.taille || 12.5, gras:true}, Bx); thCote(p, q, L.d, '?', coul, {taille:17, gras:true}, Bx); }
        else { thEtiq(p, q, L.d, L.q, coul, L.taille || 12.5, true, Bx, L.h); thEtiq(p, q, L.d, '?', coul, 17, true, Bx, L.h); }
        Bx.forEach(function(b){ B.push(b); });
      }
      var t = L.cote ? thCote(p, q, L.d, txt, coul, {taille:taille, gras:gras}, L.q === undefined ? B : null)
                     : thEtiq(p, q, L.d, txt, coul, taille, gras, L.q === undefined ? B : null, L.h);
      if(!st.sans) s += t;
    });
    // les points et leurs noms : un point au croisement de deux traits n'a pas de marque ; un point seul sur un trait : une croix
    var bouts = C.par.join('');
    // un nom ne touche aucun trait (remarque de Gwenaël du 11/11 : « le point N est sur le segment ») : si la place donnée
    // touche un trait, on cherche autour du point la place libre la plus proche (lettre ≈ 12 × 11 px, 3,5 px de marge)
    var traits = [[C.d1, 0], [C.d2, 0]].map(function(dd){ var d = dd[0], ks = Object.keys(d).concat([C.s]);
      ks.sort(function(a, b){ return (a === C.s ? 0 : d[a]) - (b === C.s ? 0 : d[b]); }); return [P[ks[0]], P[ks[ks.length-1]]]; })
      .concat(C.par.map(function(sg){ return [P[sg[0]], P[sg[1]]]; }))
      // prolongés de 8 px : la pointe d'un angle aigu dépasse un peu le sommet
      .map(function(T){ var dx = T[1][0]-T[0][0], dy = T[1][1]-T[0][1], n = Math.sqrt(dx*dx+dy*dy) || 1;
        return [[T[0][0]-dx/n*8, T[0][1]-dy/n*8], [T[1][0]+dx/n*8, T[1][1]+dy/n*8]]; });
    // distance exacte entre la boîte de la lettre (12 × 11 px) et chaque trait
    function dPS(px, py, a, b){ var dx = b[0]-a[0], dy = b[1]-a[1], l2 = dx*dx+dy*dy, u = l2 ? Math.max(0, Math.min(1, ((px-a[0])*dx+(py-a[1])*dy)/l2)) : 0;
      return Math.hypot(px-a[0]-u*dx, py-a[1]-u*dy); }
    function marge(cx, cy){ var m = Infinity, x0 = cx-6, x1 = cx+6, y0 = cy-5.5, y1 = cy+5.5;
      traits.forEach(function(T){ var bonus = T[2] === 'fin' ? 2 : 0, a = T[0], b = T[1], dd;
        var dedans = function(p){ return p[0] >= x0 && p[0] <= x1 && p[1] >= y0 && p[1] <= y1; };
        var coupe = function(p, q, r, s){ var d = (q[0]-p[0])*(s[1]-r[1]) - (q[1]-p[1])*(s[0]-r[0]); if(!d) return false;
          var u = ((r[0]-p[0])*(s[1]-r[1]) - (r[1]-p[1])*(s[0]-r[0]))/d, v = ((r[0]-p[0])*(q[1]-p[1]) - (r[1]-p[1])*(q[0]-p[0]))/d; return u >= 0 && u <= 1 && v >= 0 && v <= 1; };
        var C4 = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
        if(dedans(a) || dedans(b) || [0,1,2,3].some(function(i){ return coupe(a, b, C4[i], C4[(i+1)%4]); })) dd = 0;
        else dd = Math.min.apply(null, C4.map(function(c){ return dPS(c[0], c[1], a, b); }));
        m = Math.min(m, dd + bonus); });
      return m; }
    // les longueurs écrites (et leurs traits de cote) comptent aussi : un nom ne touche pas une longueur
    var etiqs = [];
    (C.lab || []).forEach(function(L){ var p = P[L.s[0]], q = P[L.s[1]], dx = q[0]-p[0], dy = q[1]-p[1], l = Math.hypot(dx, dy), nx = dy/l, ny = -dx/l;
      var d = L.cote ? L.d + (L.d > 0 ? 9 : -9) : L.d, txt = [L.t, L.q, '?'].filter(function(z){ return z !== undefined; }).sort(function(u, v){ return String(v).length - String(u).length; })[0];
      var tl = L.taille || 12.5, w = String(txt).length*tl*0.27 + 1, h = tl*0.45, x = (p[0]+q[0])/2 + nx*d, y = (p[1]+q[1])/2 + ny*d, an = Math.atan2(dy, dx);
      if(L.h){ var x0 = L.h === 'end' ? x-w : (L.h === 'start' ? x+w : x); etiqs.push([x0, y, w, h, 0]); } else etiqs.push([x, y, w, h, an]);
      if(L.cote) traits.push([[p[0]+nx*L.d, p[1]+ny*L.d], [q[0]+nx*L.d, q[1]+ny*L.d], 'fin']); });
    function surEtiq(cx, cy){ return etiqs.some(function(E){ var c = Math.cos(E[4]), s = Math.sin(E[4]), lx = (cx-E[0])*c + (cy-E[1])*s, ly = -(cx-E[0])*s + (cy-E[1])*c;
      var ex = 6*Math.abs(c) + 5.5*Math.abs(s), ey = 6*Math.abs(s) + 5.5*Math.abs(c); return Math.abs(lx) < E[2]+ex+1 && Math.abs(ly) < E[3]+ey+1; }); }
    var poses = [];
    function placeNom(k, o){
      var p = P[k], libre = function(q){ return marge(p[0]+q[0], p[1]+q[1]) >= 3.5 && !surEtiq(p[0]+q[0], p[1]+q[1]) && poses.every(function(z){ return Math.abs(z[0]-p[0]-q[0]) > 12 || Math.abs(z[1]-p[1]-q[1]) > 11; }); };
      var best = o;
      if(!libre(o)){ var r0 = Math.sqrt(o[0]*o[0]+o[1]*o[1]), a0 = Math.atan2(o[1], o[0]), trouve = null;
        [r0, 12, 14, 16, 18, 21].some(function(r){ for(var j = 0; j <= 12; j++){ var cands = j ? [a0+j*Math.PI/12, a0-j*Math.PI/12] : [a0];
          for(var c = 0; c < cands.length; c++){ var q = [r*Math.cos(cands[c]), r*Math.sin(cands[c])]; if(libre(q)){ trouve = q; return true; } } } return false; });
        if(trouve) best = trouve; }
      poses.push([p[0]+best[0], p[1]+best[1]]); return best;
    }
    Object.keys(P).forEach(function(k){
      B.push(P[k]);
      if(k !== C.s && bouts.indexOf(k) < 0) s += thCroix(P[k]);
      var o = placeNom(k, C.noms[k] || [0, -10]), x = P[k][0]+o[0], y = P[k][1]+o[1];
      B.push([x-6, y-9], [x+6, y+9]);
      s += '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" '+SERIF+' font-size="15" fill="'+MAR+'" text-anchor="middle" dominant-baseline="central">'+k+'</text>';
    });
    // le cadre : ce qui est dessiné, plus une marge ; affiché à sa taille (ou à « larg » px de large au plus)
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    B.forEach(function(p){ x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
    var mg = 3, W = x1-x0+2*mg, vb = (x0-mg).toFixed(1)+' '+(y0-mg).toFixed(1)+' '+W.toFixed(1)+' '+(y1-y0+2*mg).toFixed(1);
    return '<svg class="tri tha-fig" viewBox="'+vb+'" style="max-width:'+Math.round(C.larg || W)+'px" role="img" aria-label="'+C.aria+'">' + s + '</svg>';
  };
}

/* ---------- le tableau des longueurs (petit triangle en haut, grand triangle en bas) ----------
   T = {h:['{AMN}','4','3,2','{MN}'], b:['{ABC}','10','{AC}','7'], k:'× 2,5' (ou '' : flèche sans nombre ; null : pas de flèche),
        on:[[0,1],[1,1]] (cases mises en avant : [ligne, colonne]), cols:[1,2,3] (colonnes affichées),
        kc:['× 2,5','× 2,5'] (une ligne « coefficient » sous chaque colonne), note:'…' (sous le tableau), vide:true,
        kw (largeur réservée au « × k », en px, pour que le tableau garde la même largeur à chaque étape)}  */
function thTab(T){
  var cols = T.cols || [1, 2, 3];
  function cel(r, j){
    if(T.vide) return '<td class="c'+j+' vide">·</td>';
    var v = (r === 0 ? T.h : T.b)[j], on = (T.on || []).some(function(c){ return c[0] === r && c[1] === j; });
    return '<td class="c'+j+(on ? ' on' : '')+'">'+m(v)+'</td>';
  }
  var h = '<table><tr><th'+(T.vide?' class="vide"':'')+'>'+(T.vide ? '·' : m(T.h[0]))+'</th>'+cols.map(function(j){ return cel(0, j); }).join('')+'</tr>'+
          '<tr><th'+(T.vide?' class="vide"':'')+'>'+(T.vide ? '·' : m(T.b[0]))+'</th>'+cols.map(function(j){ return cel(1, j); }).join('')+'</tr>';
  if(T.kc) h += '<tr class="kc"><td></td>'+T.kc.map(function(k){ return '<td>'+m(k)+'</td>'; }).join('')+'</tr>';
  h += '</table>';
  var fl = '';
  if(T.k !== null && !T.kc){ // la flèche garde sa place même cachée (tableau vide) : le tableau ne change pas de largeur
    fl = '<div class="fl"'+(T.vide || T.k === undefined ? ' style="visibility:hidden"' : '')+'>'+
      '<svg viewBox="0 0 16 52" aria-hidden="true"><path d="M1 12 C 13 12, 13 40, 7.5 40" fill="none" stroke="#17324D" stroke-width="1.8"/>'+
      // pointe pleine dans l'axe de la courbe (remarque de Gwenaël du 11/11 : l'ancienne pointe ouverte se confondait avec la courbe)
      '<path d="M1.2 40 L8.2 36.2 L8.2 43.8 Z" fill="#17324D"/></svg>'+
      '<span class="kt"'+(T.kw ? ' style="min-width:'+T.kw+'px"' : '')+'>'+m(T.k || '')+'</span></div>';
  }
  return '<div class="tha-bloc"><div class="tha-tab">'+h+fl+'</div>'+(T.note ? '<div class="tha-note">'+m(T.note)+'</div>' : '')+'</div>';
