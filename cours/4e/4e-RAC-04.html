  vals.forEach(function(v, i){
    var x = X(v), on = (o.on || []).indexOf(i) >= 0, ch = o.cherche === i;
    G.seg([x, -6], [x, 6], {role:rh, ep:on ? 2.4 : 1.6});
    G.seg([x, gap-6], [x, gap+6], {role:rb, ep:on ? 2.4 : 1.6});
    var th = (H.t && H.t[i] !== undefined) ? H.t[i] : geoNb(v), tb = (B.t && B.t[i] !== undefined) ? B.t[i] : '';
    if(th !== '') G.texte([x, 0], th, {pref:[0, -15], taille:tl, role:rh, gras:on, fixe:true});
    if(tb !== '') G.texte([x, gap], tb, {pref:[0, 16], taille:tl, role:ch ? 'g' : rb, gras:on || ch, fixe:true});
  });
  // noms des deux grandeurs : ENTRE les deux lignes, à gauche (sous la ligne du haut, au-dessus de celle du bas) : toute la largeur
  // reste aux graduations ; l'unité dans le nom (« Prix (€) », « Pourcentage (%) ») plutôt qu'à chaque graduation
  if(H.nom) G.texte([0, 0], H.nom, {pref:[5, 14], taille:11, role:rh, ancre:'start', gras:true, fixe:true});
  if(B.nom) G.texte([0, gap], B.nom, {pref:[5, -14], taille:11, role:rb, ancre:'start', gras:true, fixe:true});
  // les flèches courbes : une flèche dont l'étendue recouvre celle d'une flèche déjà posée sur la même ligne est posée plus loin
  // de la ligne (lev automatique, + 30 px par flèche recouverte ; s.lev l'impose)
  var posees = {h:[], b:[]};
  (o.sauts || []).forEach(function(s){
    var cote = s.l === 'b' ? 'b' : 'h', haut = cote === 'h', xa = X(vals[s.de]), xb = X(vals[s.a]), lo = Math.min(xa, xb), hi = Math.max(xa, xb);
    var lev = s.lev !== undefined ? s.lev : 30*posees[cote].filter(function(r){ return r[0] < hi + 2 && lo < r[1] + 2; }).length;
    posees[cote].push([lo, hi]);
    // (13/11, remarque de Gwenaël : la petite flèche « × 2 » était mal faite) : une flèche courte est plus bombée, sa pointe plus petite
    var y = haut ? -29 - lev : gap + 30 + lev, hh = Math.max(13, Math.min(22, 8 + (hi - lo)*0.12));
    cArc(G, [xa + (xb > xa ? 2 : -2), y], [xb + (xb > xa ? -2 : 2), y], haut ? hh : -hh, {role:s.role || 'n', txt:s.t, fixe:s.fixe, pointe:Math.max(6, Math.min(8.5, (hi - lo)*0.3))});
  });
  if(o.k){ var xk = X(vals[o.k.i]) + (o.k.dx || 0);
    G.seg([xk, 9], [xk, gap - 9], {role:o.k.role || 'n', ep:1.8, fleche:'b', pointe:8});
    G.texte([xk, gap/2], o.k.t, {pref:[o.k.gauche ? -6 : 6, 0], taille:tl, role:o.k.role || 'n', gras:true, ancre:o.k.gauche ? 'end' : 'start', fixe:true}); }
  // places:[nh, nb] : le cadre est réservé pour nh niveaux de flèches au-dessus et nb au-dessous, À TOUTES LES ÉTAPES (la figure
  // d'un exemple ne change jamais de taille d'une étape à l'autre : rien ne bouge)
  var cadre = o.cadre;
  if(!cadre && o.places){ var nh = o.places[0], nb = o.places[1];
    cadre = [-14, nh ? -(29 + 30*(nh-1) + 40) : -26, bout + 6, gap + (nb ? 30 + 30*(nb-1) + 40 : 28)]; }
  return G.svg({cadre:cadre, aria:o.aria || 'Double ligne graduée', larg:o.larg});
}

/* ================== LE TABLEAU DE PROPORTIONNALITÉ À FLÈCHES ==================
   cTab({lignes:[{nom:'Masse (kg)', t:['2', '5', '?'], role:'g'}, {nom:'Prix (€)', t:['3', '7,5', '12'], role:'b'}],
         lc:58 (largeur d'une colonne), ln:96 (largeur de la colonne des noms, 0 = pas de noms), hc:32,
         fl:[{de:0, a:1, t:'× 2,5', l:'h'|'b'}] (flèches entre colonnes, au-dessus ou au-dessous), k:'× 1,5' (flèche du haut vers le bas, à droite),
         cherche:[ligne, colonne], on:[[l, c]…]}, st) */
function cTab(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), lc = o.lc || 58, ln = o.ln === undefined ? 96 : o.ln, hc = o.hc || 32, Ls = o.lignes || [], nc = Ls.length ? Ls[0].t.length : 0;
  Ls.forEach(function(Li, r){
    var y = r*hc, role = st.neutre ? 'n' : (Li.role || 'n'), c = geoCoul(role, st);
    if(ln){ cRect(G, 0, y, ln, hc, {fond:st.neutre ? 'none' : c.fond, trait:MAR});
      cTxt(G, [ln/2, y + hc/2], Li.nom, {taille:cTailleCase(Li.nom, ln, 12.5), role:role}); }
    Li.t.forEach(function(t, j){
      var x = ln + j*lc, ch = o.cherche && o.cherche[0] === r && o.cherche[1] === j, on = (o.on || []).some(function(q){ return q[0] === r && q[1] === j; });
      cRect(G, x, y, lc, hc, {trait:MAR});
      if(t !== '') cTxt(G, [x + lc/2, y + hc/2], t, {taille:cTailleCase(t, lc, 13.5), role:ch ? 'g' : 'n', gras:ch || on});
    });
  });
  (o.fl || []).forEach(function(f){
    var haut = f.l !== 'b', y = haut ? -5 : Ls.length*hc + 5, xa = ln + (f.de + 0.5)*lc, xb = ln + (f.a + 0.5)*lc;
    cArc(G, [xa + 4, y], [xb - 4, y], haut ? 13 : -13, {role:f.role || 'n', txt:f.t});
  });
  if(o.k){ var xr = ln + nc*lc + 6, y0 = hc*0.5, y1 = hc*(Ls.length - 0.5);
    var d = 'M'+geoF(xr)+' '+geoF(y0)+' C '+geoF(xr+18)+' '+geoF(y0)+', '+geoF(xr+18)+' '+geoF(y1)+', '+geoF(xr+9)+' '+geoF(y1);
    var pt = geoPointe([xr+18, y1], [xr+1.5, y1], MAR, 8);
    G.traits.push('<path d="'+d+'" fill="none" stroke="'+MAR+'" stroke-width="1.8"/>'+pt[0]);
    G.obstacle([xr, y0], [xr+15, (y0+y1)/2], 1); G.obstacle([xr+15, (y0+y1)/2], [xr, y1], 1);
    G.texte([xr + 18, (y0+y1)/2], o.k, {pref:[5, 0], taille:13, gras:true, ancre:'start', fixe:true}); }
  return G.svg({cadre:o.cadre, aria:o.aria || 'Tableau de proportionnalité', larg:o.larg});
}

/* ================== LA BARRE DE POURCENTAGE (SES gabarits plastifiés) ==================
   SA RÈGLE (13/11, remarque de Gwenaël) : on ne mélange JAMAIS les pourcentages et les quantités dans une même barre
   (« 100 % = 70 € » est faux : 100 % n'est pas 70 €, c'est 100 % DE 70 €). Deux barres EN PARALLÈLE, comme sa fiche A02 :
   - la barre du GABARIT (mode:'pct') : « 100 % » en haut, « 25 % » dans chaque case ;
   - la barre des VALEURS (mode:'val', par défaut) : le tout en haut (« 140 kg »), une case = « 35 kg » ;
   - sous la barre des valeurs, collée sous les cases prises, la PHRASE juste : « 75 % de 140 kg = 105 kg ».
   cBarre({mode:'val'|'pct', L:290, n:4 (2, 4, 5, 10 ou 100), coul:'p25' (couleur de son gabarit ; par défaut celle de n),
           tout:'140 kg' (mode val ; '?' = cherché, '' = vide), cases:'35 kg' ou ['35 kg', '', …] (mode val),
           pris:3 ou [0, 2] (cases prises : teinte foncée, texte en gras ; les autres claires — comme son exerciseur),
           sous:{n:3, t:'75 % de 140 kg = 105 kg'} (mode val), un:'1 case = 1 %' (n = 100 : légende fléchée),
           cherche:'tout'|'cases'|'sous', mot:'Gabarit' (petit mot à gauche, facultatif)}, st)
   cBarrePaire({…les mêmes réglages…, ecart:16}, st) : les DEUX barres l'une sous l'autre, cases alignées (le gabarit en haut,
   les valeurs dessous) : c'est la figure des exemples de pourcentages. */
function cBarreDessin(G, o, st, y0){
  var L = o.L || 290, n = o.n || 4, gab = o.coul || cGabDe(n), w = L/n, h0 = 30, h1 = n >= 100 ? 26 : 38, y1 = y0 + h0;
  var neutre = st.neutre, pctM = o.mode === 'pct', pct = geoNb(100/n) + ' %';
  var pris = o.pris === undefined ? n : o.pris, estPris = function(i){ return typeof pris === 'number' ? i < pris : pris.indexOf(i) >= 0; };
  // le tout : barre entière au-dessus
  cRect(G, 0, y0, L, h0, {fond:neutre ? 'none' : cTeinte(gab, 0.2), ep:1.8});
  var tv = pctM ? '100 %' : (o.tout || '');
  if(tv !== '') cTxt(G, [L/2, y0 + h0/2], tv, {taille:cTailleCase(tv, L*0.6, 14), gras:true, role:(!pctM && o.cherche === 'tout') ? 'g' : 'n'});
  if(n >= 100){
    var dd = '';
    for(var i = 0; i < n; i++){ var x = i*w, p = estPris(i);
      if(!neutre) G.fonds.push('<rect class="quad" x="'+geoF(x)+'" y="'+y1+'" width="'+geoF(w)+'" height="'+h1+'" fill="'+cTeinte(gab, (o.un && !i) ? 1 : (p ? 0.6 : 0.18))+'"/>');
      if(i) dd += 'M'+geoF(x)+' '+y1+' V'+(y1+h1)+' '; }
    G.traits.push('<path d="'+dd+'" stroke="'+MAR+'" stroke-width="0.6"/>');
    cRect(G, 0, y1, L, h1, {ep:1.6});
    if(o.un){
      G.traits.push('<rect x="'+geoF(-1)+'" y="'+(y1-1)+'" width="'+geoF(w+2)+'" height="'+(h1+8)+'" fill="none" stroke="'+G.coul('g').trait+'" stroke-width="1.8"/>');
      var P = [w/2 + 1, y1 + h1 + 9], T = [Math.min(70, L/3), y1 + h1 + 30];
      G.seg([T[0] - 4, T[1] - 6], P, {role:'n', ep:1.5, fleche:'b', pointe:7});
      G.texte([T[0], T[1]], o.un, {pref:[0, 3], taille:12, ancre:'start', fixe:true}); }
    return y1 + h1 + (o.un ? 40 : 0);
  }
  for(var j = 0; j < n; j++){
    var xj = j*w, pj = estPris(j), v = pctM ? pct : (typeof o.cases === 'string' ? o.cases : ((o.cases || [])[j] || ''));
    cRect(G, xj, y1, w, h1, {fond:neutre ? 'none' : cTeinte(gab, pj ? 0.5 : 0.12), ep:pj ? 1.8 : 1.3, trait:pj || neutre ? MAR : '#8A97A3'});
    if(v !== '') cTxt(G, [xj + w/2, y1 + h1/2], v, {taille:cTailleCase(v, pj ? w*0.9 : w, pctM ? 12 : 13), gras:pj, role:(!pctM && o.cherche === 'cases') ? 'g' : 'n'});
  }
  var yb = y1 + h1;
  if(o.sous && !pctM){ var ns = o.sous.n, ws = Math.max(ns*w, Math.min(L, geoTaille(o.sous.t, 13)[0]*2 + 16));
    // la phrase sous les cases prises : un trait épais (« souligné », comme sa correction), la phrase dessous
    G.seg([0, yb + 5], [ns*w, yb + 5], {role:o.cherche === 'sous' ? 'g' : 'n', ep:2.4});
    G.texte([0, yb + 5], o.sous.t, {pref:[0, 14], taille:13, gras:true, ancre:'start', fixe:true, role:o.cherche === 'sous' ? 'g' : 'n'});
    yb += 30; }
  return yb;
}
function cBarre(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st); cBarreDessin(G, o, st, 0);
  return G.svg({cadre:o.cadre, aria:o.aria || (o.mode === 'pct' ? 'Gabarit de pourcentage' : 'Barre des valeurs'), larg:o.larg});
}
function cBarrePaire(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), op = Object.assign({}, o, {mode:'pct', sous:null, un:null}), ov = Object.assign({}, o, {mode:'val'});
  var y = cBarreDessin(G, op, st, 0);
  cBarreDessin(G, ov, st, y + (o.ecart || 16));
  return G.svg({cadre:o.cadre, aria:o.aria || 'Le gabarit de pourcentage et, dessous, la barre des valeurs', larg:o.larg});
}

/* une ACCOLADE horizontale sous [x0, x1] (pointe vers le bas au milieu), à la hauteur y ; le texte centré dessous
   (sa façon : son exerciseur de pourcentages met « Nouveau total = … » sous une accolade) */
function cAccolade(G, x0, x1, y, txt, o){
  o = o || {};
  var c = G.coul(o.role || 'n').trait, h = 9, m = (x0 + x1)/2, r = Math.min(8, (x1 - x0)/6);
  var d = 'M'+geoF(x0)+' '+geoF(y)+' Q'+geoF(x0)+' '+geoF(y+h/2)+' '+geoF(x0+r)+' '+geoF(y+h/2)+' L'+geoF(m-r)+' '+geoF(y+h/2)+
          ' Q'+geoF(m)+' '+geoF(y+h/2)+' '+geoF(m)+' '+geoF(y+h)+' Q'+geoF(m)+' '+geoF(y+h/2)+' '+geoF(m+r)+' '+geoF(y+h/2)+
          ' L'+geoF(x1-r)+' '+geoF(y+h/2)+' Q'+geoF(x1)+' '+geoF(y+h/2)+' '+geoF(x1)+' '+geoF(y);
  G.traits.push('<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/>');
  G.obstacle([x0, y], [x0, y+h/2], 1); G.obstacle([x0, y+h/2], [x1, y+h/2], 1); G.obstacle([x1, y], [x1, y+h/2], 1); G.obstacle([m, y+h/2], [m, y+h], 1);
  if(txt) G.texte([m, y + h], txt, {pref:[0, 11], taille:o.taille || 13, gras:true, role:o.roleTxt || 'n', fixe:true});
  return y + h + 22;
}

/* ================== DÉPART / APRÈS : une évolution en pourcentage ==================
   Même règle : JAMAIS « 100 % = 35 € ». mode:'val' (par défaut) : les valeurs (« Départ : 35 € », cases « 7 € », « Après : 42 € ») ;
   mode:'pct' : le gabarit (« Départ : 100 % », cases « 20 % », « Après : 120 % »). cAvantApresPaire : les deux, côte à côte
   en hauteur (gabarit en haut, valeurs dessous).
   cAvantApres({mode, L:290, n:5 (cases du départ), val:'7 €' (valeur d'une case), depart:'35 €', plus:1 ou moins:1,
                apres:'42 €', coul:'p20', cache:{apres:true, val:true}, cherche:'depart'|'apres'|'val'}, st)
   Le départ : barre entière (« Départ : 35 € », centré), cases collées dessous. L'après : les cases gardées (+ ajoutées), une
   ACCOLADE dessous avec « Après : 42 € » (sa façon, 13/11) ;
   la case enlevée : bord en tirets, textes gris ; la case ajoutée : teinte foncée, texte en gras. */
function cAvantApresDessin(G, o, st, y0){
  var n = o.n || 5, plus = o.plus || 0, moins = o.moins || 0, nt = n + plus, L = o.L || 290, w = L/nt, gab = o.coul || cGabDe(n);
  var neutre = st.neutre, cache = o.cache || {}, pctM = o.mode === 'pct', pct = geoNb(100/n) + ' %';
  var vcase = pctM ? pct : (cache.val ? '' : (o.val || ''));
  var hb = 28, hc = 34, g = 14;
  // (13/11, remarque de Gwenaël : « le texte décalé tout à droite fait bizarre ») : le texte de la barre est CENTRÉ, « Départ : 35 € »
  function barreTout(y, nb, mot, v, ch){
    cRect(G, 0, y, nb*w, hb, {fond:neutre ? 'none' : cTeinte(gab, 0.2), ep:1.8});
    var t = mot + (v ? ' : ' + v : '');
    cTxt(G, [nb*w/2, y + hb/2], t, {taille:cTailleCase(t, nb*w - 8, 13.5), gras:true, role:ch ? 'g' : 'n'});
  }
  function caseC(x, y, v, mode){
    cRect(G, x, y, w, hc, {fond:neutre || mode === 'enleve' ? 'none' : cTeinte(gab, mode === 'ajoute' ? 0.75 : 0.45),
                           ep:mode === 'enleve' ? 1.4 : 1.6, tirets:mode === 'enleve' ? '5 3' : null, trait:mode === 'enleve' ? '#55636f' : MAR});
    if(v) cTxt(G, [x + w/2, y + hc/2], v, {taille:cTailleCase(v, mode === 'ajoute' ? w*0.9 : w, 12.5), gras:mode === 'ajoute', role:(!pctM && o.cherche === 'val') ? 'g' : (mode === 'enleve' ? 'gris' : 'n')});
  }
  var dv = pctM ? '100 %' : (o.depart || '');
  barreTout(y0, n, o.motDepart || 'Départ', dv, !pctM && o.cherche === 'depart');
  for(var i = 0; i < n; i++) caseC(i*w, y0 + hb, vcase, '');
  // l'APRÈS (13/11, sa remarque : « on mettait une accolade en dessous ») : les cases gardées (+ ajoutées), puis une accolade sous
  // les cases qui restent, avec « Après : 42 € » centré dessous
  var y2 = y0 + hb + hc + g, yfin = y2 + hc + 4 + 9 + 22;
  if(!cache.apres){
    for(var j = 0; j < nt; j++) caseC(j*w, y2, (j >= n || j >= n - moins) && pctM ? pct : vcase, j >= n ? 'ajoute' : (j >= n - moins ? 'enleve' : ''));
    var ng = nt - moins, av = pctM ? geoNb(100*ng/n) + ' %' : (o.apres || '');
    cAccolade(G, 1, ng*w - 1, y2 + hc + 4, (o.motApres || 'Après') + (av ? ' : ' + av : ''), {roleTxt:!pctM && o.cherche === 'apres' ? 'g' : 'n'});
  }
  return yfin;
}
function cAvantApres(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), L = o.L || 290, y = cAvantApresDessin(G, o, st, 0);
  return G.svg({cadre:o.cadre || [-2, -2, L + 2, y + 2], aria:o.aria || 'Barres Départ et Après', larg:o.larg});
}
function cAvantApresPaire(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), L = o.L || 290;
  var y = cAvantApresDessin(G, Object.assign({}, o, {mode:'pct', cherche:null}), st, 0);
  y = cAvantApresDessin(G, Object.assign({}, o, {mode:'val'}), st, y + (o.ecart || 18));
  return G.svg({cadre:o.cadre || [-2, -2, L + 2, y + 2], aria:o.aria || 'Le gabarit (en pourcentages) puis les valeurs, Départ et Après', larg:o.larg});
}

/* ================== LA GRILLE DE 100 CASES ==================
   cGrille100({c:17 (côté d'une case), n:30 (cases coloriées, ligne après ligne), coul:'p10' ou role:'g', t:'30 cases sur 100'
               (légende sous la grille), lignes:true (cases coloriées par lignes entières de 10 : le 10 % se voit)}, st) */
function cGrille100(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), c = o.c || 17, n = o.n || 0, L = 10*c, d = '';
  for(var k = 0; k < n; k++){ var x = (k % 10)*c, y = Math.floor(k/10)*c;
    if(!st.neutre) G.fonds.push('<rect class="quad" x="'+x+'" y="'+y+'" width="'+c+'" height="'+c+'" fill="'+(o.role ? geoCoul(o.role, st).fond : cTeinte(o.coul || 'p10', 0.55))+'"/>');
    else G.fonds.push('<rect x="'+x+'" y="'+y+'" width="'+c+'" height="'+c+'" fill="url(#'+(G.hn || (G.hn = cHachures(G, '#55636f')))+')"/>'); }
  for(var i = 1; i < 10; i++) d += 'M'+(i*c)+' 0 V'+L+' M0 '+(i*c)+' H'+L+' ';
  G.traits.push('<path d="'+d+'" stroke="#8A97A3" stroke-width="0.8"/>');
  cRect(G, 0, 0, L, L, {ep:1.8});
  if(o.t) G.texte([L/2, L], o.t, {pref:[0, 14], taille:12.5, fixe:true});
  return G.svg({cadre:o.cadre, aria:o.aria || 'Grille de 100 cases, '+n+' coloriées', larg:o.larg});
}

/* ================== LE CARRÉ D'AIRE DONNÉE ==================
   cCarre({c:150 (côté en px), quad:9 (carreaux par côté ; 0 = sans quadrillage), aire:'81 cm²' (au centre), cote:'?' (sous le côté du bas),
           coteG:true (le même texte le long du côté gauche), role:'b', unite:'1 cm' (légende d'un carreau, sous la figure à droite)}, st) */
function cCarre(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), c = o.c || 150, q = o.quad || 0, role = o.role || 'b', col = geoCoul(role, st), d = '';
  if(!st.neutre) G.fonds.push('<rect class="quad" x="0" y="0" width="'+c+'" height="'+c+'" fill="'+col.fond+'"/>');
  for(var i = 1; i < q; i++) d += 'M'+geoF(i*c/q)+' 0 V'+c+' M0 '+geoF(i*c/q)+' H'+c+' ';
  if(q) G.fonds.push('<path class="quad" d="'+d+'" stroke="#C5CED6" stroke-width="0.9"/>');
  G.poly([[0, 0], [c, 0], [c, c], [0, c]], role, {ep:2.2});
  if(o.aire) G.texte([c/2, c/2], o.aire, {pref:[0, 0], taille:o.taille || 15, gras:true, halo:true, fixe:true, role:role});
  if(o.cote){ G.texte([c/2, c], o.cote, {pref:[0, 14], taille:14, gras:o.cote === '?', role:o.cote === '?' ? 'g' : 'n', fixe:true});
    if(o.coteG) G.texte([0, c/2], o.cote, {pref:[-12, 0], taille:14, gras:o.cote === '?', role:o.cote === '?' ? 'g' : 'n', ancre:'end', fixe:true}); }
  if(o.unite && q) G.texte([c, c], o.unite, {pref:[0, 34], taille:11, ancre:'end', fixe:true});
  return G.svg({cadre:o.cadre, aria:o.aria || 'Carré d\'aire '+(o.aire || ''), larg:o.larg});
}
/* ================== LES CARRÉS EMBOÎTÉS (encadrer une racine carrée ; PREUVES A5) ==================
   cEmboites({u:56 (px pour 1 unité de longueur), carres:[{c:2, aire:'4', role:'b'}, {c:Math.sqrt(7), aire:'7', cote:'√7', role:'g'},
              {c:3, aire:'9', role:'o'}] (du plus petit au plus grand ; même coin en bas à gauche), aireMot:'aire ', unite:'cm²'}, st)
   Sous la figure : le côté de chaque carré, à sa place (à l'échelle) ; à droite : l'aire de chaque carré, à la hauteur de son bord. */
function cEmboites(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), u = o.u || 56, K = o.carres || [], big = K.length ? K[K.length-1].c*u : 100;
  K.slice().reverse().forEach(function(k){ var s = k.c*u, col = geoCoul(k.role || 'b', st);
    if(!st.neutre) G.fonds.push('<rect class="quad" x="0" y="'+geoF(big - s)+'" width="'+geoF(s)+'" height="'+geoF(s)+'" fill="'+col.fond+'"/>'); });
  K.forEach(function(k, i){ var s = k.c*u, y = big - s;
    G.poly([[0, y], [s, y], [s, big], [0, big]], k.role || 'b', {ep:i === K.length - 1 ? 2.2 : 2});
    var t = (o.aireMot === undefined ? 'aire ' : o.aireMot) + k.aire + (o.unite ? ' ' + o.unite : '');
    G.texte([big, y], t, {pref:[8, 0], taille:12, role:k.role || 'b', ancre:'start', fixe:true});
    G.seg([s, big + 4], [s, big + 10], {role:k.role || 'b', ep:1.6});
    G.texte([s, big], k.cote || geoNb(k.c), {pref:[0, 20], taille:12.5, role:k.role || 'b', gras:!!k.cote, fixe:true});
  });
  return G.svg({cadre:o.cadre, aria:o.aria || 'Carrés emboîtés', larg:o.larg});
}

/* ================== LA DROITE DES CARRÉS ==================
   cDroiteCarres({L:300, de:0, a:25, carres:[0, 1, 4, 9, 16, 25] (nombres écrits en haut, à leur place), point:{v:7, t:'7', r:'√7'},
                  role:'g' (le point), nomH:'nombre', nomB:'sa racine carrée'}, st)
   Dessous, les racines 0, 1, 2, 3… sont RÉGULIÈREMENT espacées (la droite est graduée par les racines) ; au-dessus, leurs carrés
   0, 1, 4, 9, 16, 25 ne le sont PAS (carte T4 et étude du lot 2 : « graduations du haut non régulières »). Un nombre 𝑣 est placé
   en √𝑣 : 7 tombe entre 4 et 9, donc √7 entre 2 et 3. Ce n'est pas une double ligne de proportionnalité (aucune flèche × 𝑘). */
function cDroiteCarres(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), L = o.L || 300, de = o.de || 0, a = o.a || 25, K = o.carres || [0, 1, 4, 9, 16, 25];
  function X(v){ return (Math.sqrt(v) - Math.sqrt(de))/(Math.sqrt(a) - Math.sqrt(de))*L; }
  G.seg([-6, 0], [L + 14, 0], {role:'n', ep:1.8, fleche:'b', pointe:9});
  K.forEach(function(v){ var x = X(v);
    G.seg([x, -5], [x, 5], {role:'n', ep:1.6});
    G.texte([x, 0], geoNb(v), {pref:[0, -14], taille:12.5, fixe:true});
    G.texte([x, 0], geoNb(Math.sqrt(v)), {pref:[0, 16], taille:12.5, role:'b', fixe:true}); });
  if(o.point){ var xp = X(o.point.v); G.croix([xp, 0], o.point.role || 'g');
    G.texte([xp, 0], o.point.t || geoNb(o.point.v), {pref:[0, -14], taille:12.5, gras:true, role:o.point.role || 'g', fixe:true});
    if(o.point.r) G.texte([xp, 0], o.point.r, {pref:[0, 17], taille:12.5, gras:true, role:o.point.role || 'g', fixe:true}); }
  if(o.nomH) G.texte([L + 14, 0], o.nomH, {pref:[0, -30], taille:11, ancre:'end', fixe:true});
  if(o.nomB) G.texte([L + 14, 0], o.nomB, {pref:[0, 33], taille:11, ancre:'end', role:'b', fixe:true});
  return G.svg({cadre:o.cadre, aria:o.aria || 'Droite des carrés', larg:o.larg});
}

/* ================== LE GLISSE-NOMBRE (son outil glisse_nombres_decimaux.html ; S036) ==================
   cGlisse({rangs:['C', 'D', 'U', 'd', 'c', 'm'] (en-têtes : M milliers, C centaines, D dizaines, U unités, d dixièmes,
            c centièmes, m millièmes), de:{U:'3', d:'7'} (chiffres du nombre de départ, par rang),
            vers:{C:'3', D:'7', U:'0'} (chiffres du résultat ; absent = une seule ligne), zeros:['U'] (zéros qui tiennent une place :
            dessinés en rôle turquoise), op:'× 100' (écrit à droite, entre les deux lignes), fleches:true, lc:38}, st)
   La virgule est le trait épais entre U et d ; elle NE BOUGE PAS : ce sont les chiffres qui changent de rang (carte T4, décision 13). */
function cGlisse(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), R = o.rangs || ['C', 'D', 'U', 'd', 'c', 'm'], lc = o.lc || 38, he = 22, hl = 30, g = o.vers ? 34 : 0;
  var W = R.length*lc, y1 = he, y2 = he + hl + g, iu = R.indexOf('U');
  R.forEach(function(r, i){ var x = i*lc;
    cRect(G, x, 0, lc, he, {fond:st.neutre ? 'none' : '#EEF1F4', ep:1.3});
    cTxt(G, [x + lc/2, he/2], r, {taille:12.5, serif:/[a-z]/.test(r) && false, gras:true});
    cRect(G, x, y1, lc, hl, {ep:1.3});
    if(o.vers) cRect(G, x, y2, lc, hl, {ep:1.3}); });
  // la virgule : un trait épais entre U et d, sur toute la hauteur
  if(iu >= 0 && iu < R.length - 1){ var xv = (iu + 1)*lc, yb = o.vers ? y2 + hl : y1 + hl;
    G.seg([xv, 0], [xv, yb], {role:'n', ep:3.4}); }
  function chiffres(D, y, zeros, role){
    Object.keys(D || {}).forEach(function(r){ var i = R.indexOf(r); if(i < 0) return;
      var z = (zeros || []).indexOf(r) >= 0;
      cTxt(G, [i*lc + lc/2, y + hl/2], D[r], {taille:17, gras:true, role:z ? 'o' : role}); });   // le zéro qui tient une place : gras aussi (lisible en noir et blanc)
  }
  chiffres(o.de, y1, o.zerosDe, 'n');
  if(o.vers){ chiffres(o.vers, y2, o.zeros, o.role || 'n');
    if(o.fleches !== false){
      // une flèche par chiffre du départ (pas pour les zéros ajoutés) : du bas de sa case vers le haut de sa nouvelle case
      var dec = o.decalage !== undefined ? o.decalage : 0;
      Object.keys(o.de || {}).forEach(function(r){ var i = R.indexOf(r), j = i - dec; if(i < 0 || j < 0 || j >= R.length) return;
        G.seg([i*lc + lc/2, y1 + hl - 3], [j*lc + lc/2, y2 + 3], {role:o.roleFl || 'g', ep:1.7, fleche:'b', pointe:8}); }); }
    if(o.op) G.texte([W, y1 + hl + g/2], o.op, {pref:[8, 0], taille:14, gras:true, ancre:'start', fixe:true, role:o.roleFl || 'g'});
  }
  return G.svg({cadre:o.cadre, aria:o.aria || 'Tableau de numération', larg:o.larg});
}

   st.e : 0-1 BC cherché (?) ; 2 et plus BC = √65 cm. */
function r4Tri(st){
