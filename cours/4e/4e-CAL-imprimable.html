/* ================== l'OPÉRATION POSÉE, rang par rang ==================
   (écrite ici plutôt qu'avec cPose : il faut des retenues sur n'importe quel rang, un résultat qui se remplit rang par rang,
   la rangée des rangs D U d c au-dessus — comme les « guides de rang » de son outil addition-posee — et un cadre fixe)
   o = {rangs:['D', 'U', 'd', 'c'], lignes:[{U:'2', d:'3', c:'7'}, …], op:'+', res:{c:'2'} (le résultat, rang par rang),
        virgRes:true (la virgule du résultat), ret:{d:'1'} (retenues, au-dessus de leur rang ; dans une soustraction : le nombre
        obtenu après l'échange, « 12 »), barre:{U:true} (soustraction : le chiffre du haut échangé est barré et grisé, comme dans
        SON outil soustraction-posee ; barré par le texte lui-même, line-through : pas un trait qui toucherait le chiffre),
        unites:true (colonne des unités repérée : fond clair), actif:'c' (le rang qu'on calcule : fond orange clair),
        vide:true (étape 0 : pas de chiffres), lc:30} */
function c06Pose(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), R = o.rangs || ['D', 'U', 'd', 'c'], lc = o.lc || 30, x0 = 22, L = o.lignes || [];
  var yt = 9, yr = 28, y1 = 50, hl = 28, n = L.length, yb = y1 + (n - 0.5)*hl + 4, yres = yb + 18, W = x0 + R.length*lc, iu = R.indexOf('U');
  function X(i){ return x0 + (i + 0.5)*lc; }
  if(!st.neutre){
    if(o.unites && iu >= 0) G.fonds.push('<rect class="quad" x="'+geoF(x0 + iu*lc + 2)+'" y="'+(yr - 9)+'" width="'+(lc - 4)+'" height="'+(yres + 13 - yr + 9)+'" rx="4" fill="#E8EFF9"/>');
    if(o.actif){ var ia = R.indexOf(o.actif); if(ia >= 0) G.fonds.push('<rect class="quad" x="'+geoF(x0 + ia*lc + 2)+'" y="'+(yr - 9)+'" width="'+(lc - 4)+'" height="'+(yres + 13 - yr + 9)+'" rx="4" fill="#FFF3E6"/>'); }
  }
  // la rangée des rangs
  R.forEach(function(r, i){ cTxt(G, [X(i), yt], r, {taille:12.5, gras:true, role:'n'}); });   // (14/11, D8) plus grands, lisibles
  function chiffre(c, i, y, role, taille, gras){ if(c) cTxt(G, [X(i), y], c, {taille:taille || 18, gras:gras, role:st.neutre ? 'n' : role}); }
  function virg(y, role){ cTxt(G, [x0 + (iu + 1)*lc, y + 6], ',', {taille:18, role:st.neutre ? 'n' : (role || 'n')}); }
  if(!o.vide) L.forEach(function(Li, k){ var y = y1 + k*hl;
    R.forEach(function(r, i){ var b = k === 0 && o.barre && o.barre[r] && Li[r];
      if(b) cTxt(G, [X(i), y], '<tspan text-decoration="line-through">'+Li[r]+'</tspan>', {taille:18, role:st.neutre ? 'n' : 'gris'});
      else chiffre(Li[r], i, y, 'n'); });
    if(R.slice(iu + 1).some(function(r){ return Li[r]; })) virg(y); });
  if(o.op) cTxt(G, [8, y1 + (n - 1)*hl], o.op, {taille:18, gras:true});
  G.seg([2, yb], [W + 2, yb], {role:'n', ep:1.8});
  R.forEach(function(r, i){ chiffre((o.ret || {})[r], i, yr, 'g', 12, true); chiffre((o.res || {})[r], i, yres, 'o', 18, true); });
  if(o.virgRes) virg(yres, 'o');
  return G.svg({cadre:o.cadre || [-2, -2, W + 6, yres + 16], aria:o.aria || 'Opération posée', larg:o.larg});
}

/* ================== la DROITE GRADUÉE EN DIXIÈMES (exemple 1 : 3,4 − 0,8 = 34 dixièmes − 8 dixièmes) ==================
   De 0 à 4, une graduation par dixième (les unités plus longues et écrites) : 3,4 est la 34e graduation (S166 p. 4-6 : la droite
   graduée ; S037 p. 5 : la droite plutôt que la bande numérique). k = 0 : la droite (neutre) ; k = 1 : 3,4 ; k = 2 : le saut
   de 8 dixièmes vers la gauche ; k = 3 : 2,6. MÊME cadre à toutes les étapes. */
function c06Droite(st){
  st = st || {}; var k = st.k || 0, L = 272, u = L/4, G = geoScene(st);
  function X(v){ return v*u; }
  G.seg([-8, 0], [L + 14, 0], {role:'n', ep:1.8, fleche:'b', pointe:9});
  for(var i = 0; i <= 40; i++){ var e = i % 10 === 0, f = i % 5 === 0;
    G.seg([X(i/10), e ? -7 : (f ? -5 : -3.5)], [X(i/10), e ? 7 : (f ? 5 : 3.5)], {role:'n', ep:e ? 1.7 : 1.1});
    if(e) G.texte([X(i/10), 0], String(i/10), {pref:[0, 16], taille:12, fixe:true}); }
  if(k >= 1){ G.croix([X(3.4), 0], 'b'); G.texte([X(3.4), 0], '3,4', {pref:[0, 16], taille:12.5, gras:true, role:'b', fixe:true}); }
  if(k >= 2) cArc(G, [X(3.4) - 1, -9], [X(2.6) + 1, -9], 13, {role:'g', txt:'− 8 dixièmes', taille:12, gras:true, fixe:true});
  if(k >= 3){ G.croix([X(2.6), 0], 'g'); G.texte([X(2.6), 0], '2,6', {pref:[0, 16], taille:12.5, gras:true, role:'g', fixe:true}); }
  return G.svg({cadre:[-12, -52, L + 18, 26],
    aria:'Droite graduée de 0 à 4, une graduation par dixième'+(k >= 1 ? ' ; 3,4, la 34e graduation' : '')+(k >= 2 ? ' ; un saut de 8 dixièmes vers la gauche' : '')+(k >= 3 ? ' ; on arrive à 2,6' : '')});
}

var C06_E2 = {rangs:['D', 'U', 'd', 'c'], lignes:[{U:'2', d:'3', c:'7'}, {U:'9', d:'8', c:'5'}], op:'+'};

  st = st || {}; var k = st.k || 0, o = Object.assign({}, C06_E2);

  if(k >= 4){ o.actif = k === 4 ? 'U' : null; o.res = {D:'1', U:'2', d:'2', c:'2'}; o.ret = {U:'1', d:'1'}; o.virgRes = true; }

}

/* un nombre ne se sépare pas du nom de son rang (« 8 dixièmes ») ; un signe de comparaison ne se sépare pas de ses nombres */
function c06Nb(x){
  if(typeof x === 'string') return x.replace(/(\d) (?=(unités?|dizaines?|centaines?|milliers?|dixièmes?|centièmes?|millièmes?|rangs?|fois|graduations?)(?![a-zà-ÿ]))/g, '$1 ')
                                     .replace(/ ([<>⩽⩾]) /g, ' $1 ')
                                     // (14/11, relecture D9) une égalité courte « a + b = c » ne se coupe pas
                                     .replace(/(\d[\d,]*) ([+−]) (\d[\d,]*) = (\d[\d,]*)/g, '$1\u00a0$2\u00a0$3\u00a0=\u00a0$4')
                                     .replace(/(\d[\d,]*) = (\d+)[ \u00a0](dixièmes)/g, '$1\u00a0=\u00a0$2\u00a0$3');
  if(Array.isArray(x)) return x.map(c06Nb);
  if(x && typeof x === 'object'){ var y = {}; Object.keys(x).forEach(function(k){ y[k] = (typeof x[k] === 'function') ? x[k] : c06Nb(x[k]); }); return y; }
  return x;
}

/* ================== Je retiens : le tableau des rangs (chaque rang vaut 10 fois le rang à sa droite) ==================
   Une ligne de rangs (M à m), la valeur d'un 1 à chaque rang, la virgule (trait épais) ; au-dessus, des flèches « × 10 » vers
   la gauche ; au-dessous, des flèches « ÷ 10 » vers la droite (le tableau à flèches des manuels de Singapour et d'Angleterre ;
   S036 p. 1 : « une valeur 10 fois plus grande »). */
function c04Rangs(st){
  st = st || {};
  var G = geoScene(st), R = ['M', 'C', 'D', 'U', 'd', 'c', 'm'], V = ['1 000', '100', '10', '1', '0,1', '0,01', '0,001'];
  var lc = 42, he = 24, hv = 30, n = R.length, W = n*lc;
  // une seule taille pour toute la ligne des valeurs : celle qui fait tenir la plus longue (1 000, 0,001)
  var tv = Math.min.apply(null, V.map(function(t){ return cTailleCase(t, lc, 12.5); }));
  R.forEach(function(r, i){ var x = i*lc;
    cRect(G, x, 0, lc, he, {fond:st.neutre ? 'none' : '#EEF1F4', ep:1.3});
    cTxt(G, [x + lc/2, he/2], r, {taille:12.5, gras:true});
    cRect(G, x, he, lc, hv, {ep:1.3});
    cTxt(G, [x + lc/2, he + hv/2], V[i], {taille:tv});
  });
  G.seg([4*lc, 0], [4*lc, he + hv], {role:'n', ep:3.4});
  for(var i = 1; i < n; i++){
    var xa = (i + 0.5)*lc, xb = (i - 0.5)*lc;
    cArc(G, [xa - 4, -5], [xb + 4, -5], 9, {role:'g', txt:'× 10', taille:11});
    cArc(G, [xb + 4, he + hv + 5], [xa - 4, he + hv + 5], -9, {role:'b', txt:'÷ 10', taille:11});
  }
  return G.svg({cadre:[-3, -34, W + 3, he + hv + 34],
    aria:'Le tableau des rangs, des milliers aux millièmes, avec la valeur d\'un 1 à chaque rang : 1 000, 100, 10, 1, 0,1, 0,01, 0,001 ; d\'un rang au rang de gauche, × 10 ; d\'un rang au rang de droite, ÷ 10'});
}

/* ================== Je retiens : la multiplication posée 2,6 × 3,4 (le produit sans virgules, puis la virgule) ==================

   virgule. 26 × 4 = 104 ; 26 × 30 = 780 (le 0 tient la place des unités) ; 104 + 780 = 884 ; 2 chiffres → 8,84. */

      cTxt(G, [x, y], d.charAt(j), {taille:17, gras:o.gras || z, role:z ? 'g' : (o.role || 'n')}); }
    if(nd) cTxt(G, [xr - nd*lc, y + 5], ',', {taille:17, gras:o.gras, role:o.role || 'n'});

/* ---------- LA BANDE DES DIXIÈMES : le quotient vu comme des PAQUETS ----------
   c07Bande({total:10 (cases dessinées, une case = 1 dixième), w:26 (largeur d'une case), n:6 (cases du dividende, coloriées),
             txt:true (« 0,1 » écrit dans chaque case), p:2 (cases par paquet), paquets:3 (paquets montrés), lab:'0,2' (texte de
             chaque paquet), marques:[{i:0, t:'0'}, {i:6, t:'0,6', on:true}] (repères sous la bande, au bord de la case i)}, st)
   Les paquets sont des crochets AU-DESSUS de la bande (rien ne recouvre les cases) ; le cadre ne dépend que de total et w :
   il est le même à toutes les étapes (rien ne bouge). */
var C07_H = 30;
function c07Bande(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), N = o.total || 10, w = o.w || 26, h = C07_H, n = o.n || 0, p = o.p || 1, np = o.paquets || 0;
  var cb = geoCoul('b', st), cg = geoCoul('g', st);
  for(var i = 0; i < N; i++){
    var x = i*w, pris = i < n && !st.neutre;
    cRect(G, x, 0, w, h, {fond:pris ? cb.fond : 'none', trait:(i < n || st.neutre) ? MAR : '#8A97A3', ep:1.2});
    if(o.txt) cTxt(G, [x + w/2, h/2], '0,1', {taille:cTailleCase('0,1', w, 11.5), role:pris ? 'b' : 'n'});
  }
  cRect(G, 0, 0, N*w, h, {ep:1.8});
  // le dividende : un trait épais sous ses cases (la longueur à partager en paquets)
  if(n && !st.neutre) G.seg([0, h + 3], [n*w, h + 3], {role:'b', ep:3});
  // les paquets : un crochet au-dessus de chaque paquet, son texte au-dessus
  for(var k = 0; k < np; k++){
    var a = k*p*w + 3, b = (k + 1)*p*w - 3, y = -5, yh = -11, r = st.neutre ? 'n' : 'g';
    G.seg([a, y], [a, yh], {role:r, ep:2}); G.seg([a, yh], [b, yh], {role:r, ep:2}); G.seg([b, yh], [b, y], {role:r, ep:2});
    G.texte([(a + b)/2, yh], o.lab || '', {pref:[0, -10], taille:12, gras:true, role:r, fixe:true});
  }
  (o.marques || []).forEach(function(q){
    var x = q.i*w;
    G.seg([x, h], [x, h + 7], {role:'n', ep:1.6});

  });

}

/* ---------- une DROITE GRADUÉE à l'échelle ----------
   c01Droite({max:30, L:270, pas:2.5 (petites graduations), ecrire:10 (nombres écrits sous la droite, tous les …),
              marques:[{v:7.5, t:'7,5', role:'b'}] (graduation épaisse + nombre en gras sous la droite, à sa place),
              arcs:[{de:7.5, a:25, t:'÷ 0,3', role:'g', h:22}] (flèches courbes AU-DESSUS de la droite),
              bande:{de:7.5, t:'plus grand que 7,5', role:'g'} (flèche droite SOUS les nombres, jusqu'au bout de la droite),
              zeroG:true (le « 0 » écrit à gauche de sa graduation), cadre}, st)
   Position = valeur ÷ max × L. Le cadre est donné : le même à toutes les étapes. */
function c01Droite(o, st){
  st = st || {}; o = o || {};
  var G = geoScene(st), L = o.L || 270, mx = o.max, pas = o.pas || 1, ec = o.ecrire || 10;
  function X(v){ return v/mx*L; }
  G.seg([-6, 0], [L + 16, 0], {role:'n', ep:1.8, fleche:'b', pointe:9});
  var marques = (o.marques || []).map(function(q){ return q.v; });
  for(var k = 0; k*pas <= mx + 1e-9; k++){
    var v = k*pas, x = X(v), e = Math.abs(v/ec - Math.round(v/ec)) < 1e-9, mq = marques.some(function(w){ return Math.abs(w - v) < 1e-9; });
    if(mq) continue;
    G.seg([x, e ? -6 : -3.5], [x, e ? 6 : 3.5], {role:'n', ep:e ? 1.6 : 1.1});
    var pres = (o.marques || []).some(function(q){ return Math.abs(X(q.v) - x) < geoTaille(geoNb(v), 12)[0] + geoTaille(q.t, 13)[0] + 6; });   // un nombre de marque trop près : on ne l'écrit pas
    // o.zeroG : le « 0 » est écrit à GAUCHE de sa graduation (ancre 'end'), pour s'écarter d'une marque proche (« 2,5 »)
    if(e && !pres) G.texte([v === 0 && o.zeroG ? x + 1 : x, 0], geoNb(v), {pref:[0, 16], taille:12, fixe:true, ancre:v === 0 && o.zeroG ? 'end' : undefined});
  }
  (o.marques || []).forEach(function(q){
    var x = X(q.v), r = st.neutre ? 'n' : (q.role || 'n');
    G.seg([x, -8], [x, 8], {role:r, ep:2.6});
    G.texte([x, 0], q.t, {pref:[0, 17], taille:13, gras:true, role:r, fixe:true});
  });
  (o.arcs || []).forEach(function(a){
    cArc(G, [X(a.de) + 2, -10], [X(a.a) - 2, -10], a.h || 20, {role:st.neutre ? 'n' : (a.role || 'n'), txt:a.t, gras:true, fixe:true});
  });
  if(o.bande){ var b = o.bande, r2 = st.neutre ? 'n' : (b.role || 'g');
    G.seg([X(b.de), 36], [L + 10, 36], {role:r2, ep:2.2, fleche:'b', pointe:8});
    G.seg([X(b.de), 30], [X(b.de), 42], {role:r2, ep:2.2});
    G.texte([(X(b.de) + L + 10)/2, 36], b.t, {pref:[0, 12], taille:12, gras:true, role:r2, fixe:true}); }
  return G.svg({cadre:o.cadre || [-12, -56, L + 22, 62], aria:o.aria || 'Une droite graduée', larg:o.larg});
}

/* ---------- Exemple 1 : le disque de rayon 2 cm (S100 p. 3) ----------
   À l'échelle : 1 cm = 30 px. k = 0 : le disque et son rayon ; k = 1 : le carré de 4 cm partagé en 4 petits carrés de 2 cm
   (un petit carré = 2 cm × 2 cm = 4 cm², c'est le « 2² » de la formule) ; le petit carré du haut à DROITE est mis en avant,
   collé à son étiquette (relecture du 14/11 : le lien ne se fait pas par la couleur seule). */
function c01Disque(st){
  st = st || {}; var k = st.k || 0, G = geoScene(st), u = 30, c = 4*u, C = [c/2, c/2];
  if(k >= 1){
    if(!st.neutre) G.fonds.push('<rect class="quad" x="'+(c/2)+'" y="0" width="'+(c/2)+'" height="'+(c/2)+'" fill="'+geoCoul('g', st).fond+'"/>');
    G.poly([[0, 0], [c, 0], [c, c], [0, c]], 'n', {ep:1.6});
    G.seg([c/2, 0], [c/2, c], {role:'n', ep:1.2, tirets:'4 3'});
    G.seg([0, c/2], [c/2, c/2], {role:'n', ep:1.2, tirets:'4 3'});
    G.poly([[c/2, 0], [c, 0], [c, c/2], [c/2, c/2]], st.neutre ? 'n' : 'g', {ep:2.2});
    G.texte([c + 12, 26], 'un petit carré :', {pref:[0, 0], taille:12, ancre:'start', fixe:true, role:st.neutre ? 'n' : 'g'});
    G.texte([c + 12, 44], '2 cm × 2 cm', {pref:[0, 0], taille:12, ancre:'start', fixe:true, role:st.neutre ? 'n' : 'g'});
    G.texte([c + 12, 62], '= 4 cm²', {pref:[0, 0], taille:12, ancre:'start', gras:true, fixe:true, role:st.neutre ? 'n' : 'g'});
  }
  G.cercle(C, 2*u, {role:st.neutre ? 'n' : 'b', ep:2.2, fond:'b'});
  G.seg(C, [c, c/2], {role:'n', ep:1.8});
  G.texte([c*3/4, c/2], '2 cm', {pref:[0, -11], taille:12.5, gras:true, fixe:true});
  return G.svg({cadre:[-6, -6, c + 132, c + 6],
    aria:'Un disque de rayon 2 cm'+(k >= 1 ? ', dans un carré de 4 cm de côté partagé en quatre petits carrés de 2 cm de côté, chacun d\'aire 4 cm²' : '')});
}
