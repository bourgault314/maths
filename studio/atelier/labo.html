<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Labo — maths&go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--page:#f6f8fb;--papier:#fff;--encre:#10294a;--bleu:#063f86;--attenue:#637287;--ligne:#dce5ef}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--page);color:var(--encre);font-family:"Segoe UI",system-ui,sans-serif;
    padding:14px;max-width:1060px;margin-inline:auto}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-family:Fredoka;color:var(--bleu);font-size:clamp(20px,4vw,28px);margin:0}
  header a{color:var(--attenue);text-decoration:none;font-size:18px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .chips button{font-family:Fredoka;font-weight:600;font-size:14.5px;padding:9px 16px;min-height:44px;
    border-radius:999px;border:2px solid var(--ligne);background:#fff;color:var(--encre);cursor:pointer}
  .chips button.actif{background:linear-gradient(180deg,#60a5fa,#3b82f6);color:#fff;border-color:#3b82f6}
  .vitrine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .vignette{border:1px solid var(--ligne);border-radius:16px;padding:10px;background:#fff;text-align:center;cursor:pointer}
  .vignette:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
  .vignette:active{transform:scale(.98)}
  .vignette svg{max-width:100%;height:auto}
  .vignette figcaption{font-family:Fredoka;font-weight:600;font-size:13.5px;margin-top:4px}
  .carte{border:1px solid var(--ligne);border-radius:14px;padding:8px;background:#fff;text-align:center}
  .carte svg{max-width:100%;height:auto}
  .carte figcaption{font-size:12px;color:var(--attenue);margin-top:4px;font-weight:600}
  figure{margin:0}
  .galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .barre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
  .reglage{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--attenue)}
  .reglage input[type=range]{accent-color:var(--bleu);width:120px;min-height:34px}
  .reglage output{font-weight:700;color:var(--encre)}
  select,button.action{font:inherit;font-size:14.5px;padding:9px 14px;min-height:44px;border-radius:12px;
    border:2px solid var(--ligne);background:#fff;color:var(--encre);cursor:pointer}
  button.principal{background:linear-gradient(180deg,#60a5fa,#3b82f6);color:#fff;border-color:#3b82f6;font-weight:600}
  .pilules{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
  .pilules button{font-size:13.5px;padding:8px 13px;min-height:40px;border-radius:999px;
    border:2px solid var(--ligne);background:#fff;color:var(--encre);cursor:pointer}
  .pilules button.actif{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8;font-weight:700}
  .apercu{background:#fff;border:1px solid var(--ligne);border-radius:18px;text-align:center;
    padding:8px;margin-bottom:14px;overflow-x:auto}
  .apercu svg{max-width:100%;height:auto}
  h2{font-family:Fredoka;color:var(--bleu);font-size:17px;margin:14px 0 8px}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;background:#fef3c7;color:#92400e}
  @media (max-width:560px){
    .reglage{flex:1 1 100%}
    .reglage input[type=range]{flex:1;width:auto}
  }
</style>
</head>
<body>
<header>
  <a href="./index.html" aria-label="Retour à l'Atelier">←</a>
  <h1>🔬 Labo</h1>
  <span id="filAriane" style="font-family:Fredoka;color:var(--attenue)"></span>
</header>

<div class="chips" id="chipsSeries" role="group" aria-label="Séries"></div>

<div id="vueSerie">
  <div class="vitrine" id="vitrineObjets"></div>
</div>

<div id="vueObjet" hidden>
  <div class="barre">
    <button class="action" id="btnRetourSerie">← Objets</button>
    <strong id="titreObjet" style="font-family:Fredoka;font-size:18px"></strong>
    <span class="badge">brouillon</span>
    <button class="principal action" id="btnSvg" style="margin-left:auto">⬇ SVG</button>
  </div>
  <div class="barre" id="parametresObjet"></div>
  <div class="pilules" id="pilulesObjet"></div>
  <div class="barre">
    <label class="reglage">↻ <input type="range" id="regleRotation" min="0" max="359" value="0" step="1"><output id="valRotation">0°</output></label>
    <label class="reglage"><select id="choixTheme" aria-label="Thème"><option value="noir">noir</option><option value="couleur">couleur</option></select></label>
  </div>
  <div class="apercu" id="apercu" aria-live="polite"></div>
  <h2>Toutes les possibilités</h2>
  <div class="galerie" id="plancheObjet"></div>
</div>

<script type="module">
import { dessinerCercle, dessinerFigure } from "../../packages/objets/src/figure.js";
import { CATEGORIES_FIGURES, FIGURES_USUELLES } from "../../packages/objets/src/figures-usuelles.js";

const $ = (id) => document.getElementById(id);
let serieActive = CATEGORIES_FIGURES[0];
let objetActif = null;
let dernierSvg = "";
const actives = new Set(["codages", "noms"]);

function capacitesDe(cle) {
  const entree = FIGURES_USUELLES[cle];
  if (entree.genre === "cercle") {
    return [["centre", "centre"], ["disque", "disque"], ["rayon", "rayon"], ["diametre", "diamètre"],
      ["corde", "corde"], ["tangente", "tangente"], ["secteur", "secteur"]];
  }
  const n = entree.decrire().sommets.length;
  const liste = [["codages", "codages"], ["noms", "noms"], ["sommets", "croix"], ["angles", "angles"],
    ["mesuresAngles", "mesures d'angles"], ["mesuresCotes", "mesures des côtés"],
    ["milieux", "milieux"], ["axes", "axes"]];
  if (n === 4) liste.push(["diagonales", "diagonales"], ["centre", "centre"]);
  else liste.push(["centre", "centre"]);
  if (n === 3) liste.push(["hauteurs", "hauteurs"], ["medianes", "médianes"], ["mediatrices", "médiatrices"],
    ["bissectrices", "bissectrices"], ["cercleInscrit", "cercle inscrit"],
    ["cercleCirconscrit", "cercle circonscrit"], ["centresRemarquables", "G H O I"],
    ["segmentDesMilieux", "segment des milieux"]);
  if (entree.categorie === "Polygones") liste.push(["rayons", "rayons"], ["apotheme", "apothème"]);
  return liste;
}

function lireParametres() {
  const options = {};
  for (const curseur of $("parametresObjet").querySelectorAll("input[type=range]")) {
    options[curseur.dataset.cle] = Number(curseur.value);
  }
  return options;
}

function visibleCercle(actifs) {
  return {
    centre: actifs.has("centre"),
    disque: actifs.has("disque"),
    rayonVersDeg: actifs.has("rayon") ? 40 : null,
    mesureRayon: actifs.has("rayon"),
    diametreVersDeg: actifs.has("diametre") ? 25 : null,
    mesureDiametre: actifs.has("diametre"),
    cordes: actifs.has("corde") ? [{ de: 150, a: 245 }] : [],
    tangente: actifs.has("tangente") ? { en: 40 } : null,
    secteur: actifs.has("secteur") ? { deDeg: 60, aDeg: 130 } : null,
  };
}

function dessinerApercu() {
  const entree = FIGURES_USUELLES[objetActif];
  const description = entree.decrire(lireParametres());
  description.styles = { ...description.styles, theme: $("choixTheme").value };
  description.sortie = { taille: Math.min(430, window.innerWidth - 60) };
  if (entree.genre === "cercle") {
    description.visible = visibleCercle(actives);
    if (!actives.has("rayon")) description.points = [];
    dernierSvg = dessinerCercle(description);
  } else {
    if (!actives.has("codages")) description.codages = [];
    const visible = {};
    for (const [cle] of capacitesDe(objetActif)) {
      if (cle === "codages") continue;
      visible[cle] = actives.has(cle);
    }
    visible.mesuresDiagonales = actives.has("diagonales");
    description.visible = visible;
    description.transform = { rotationDeg: Number($("regleRotation").value) };
    dernierSvg = dessinerFigure(description);
  }
  $("apercu").innerHTML = dernierSvg;
}

function carte(zone, svg, legende) {
  const figure = document.createElement("figure");
  figure.className = "carte";
  figure.innerHTML = svg + "<figcaption></figcaption>";
  figure.querySelector("figcaption").textContent = legende;
  zone.appendChild(figure);
}

function plancheObjet() {
  const zone = $("plancheObjet");
  zone.innerHTML = "";
  const entree = FIGURES_USUELLES[objetActif];
  for (const [cle, libelle] of capacitesDe(objetActif)) {
    try {
      const description = entree.decrire(lireParametres());
      description.sortie = { taille: 150, marge: 38 };
      if (entree.genre === "cercle") {
        description.visible = visibleCercle(new Set([cle]));
        if (cle !== "rayon") description.points = [];
        carte(zone, dessinerCercle(description), libelle);
      } else {
        if (cle !== "codages") description.codages = [];
        description.visible = { noms: ["noms", "codages"].includes(cle) };
        if (!["codages", "noms"].includes(cle)) {
          description.visible[cle] = true;
          if (cle === "diagonales") description.visible.mesuresDiagonales = true;
          if (cle === "mesuresAngles") description.visible.angles = true;
        }
        carte(zone, dessinerFigure(description), libelle);
      }
    } catch (erreur) {
      const alerte = document.createElement("figure");
      alerte.className = "carte";
      alerte.innerHTML = "<figcaption></figcaption>";
      alerte.querySelector("figcaption").textContent = `${libelle} : ERREUR — ${erreur.message}`;
      zone.appendChild(alerte);
    }
  }
}

function ouvrirSerie(serie) {
  serieActive = serie;
  objetActif = null;
  $("vueObjet").hidden = true;
  $("vueSerie").hidden = false;
  $("filAriane").textContent = "";
  [...$("chipsSeries").children].forEach((c) => c.classList.toggle("actif", c.textContent === serie));
  const vitrine = $("vitrineObjets");
  vitrine.innerHTML = "";
  for (const [cle, entree] of Object.entries(FIGURES_USUELLES)) {
    if (entree.categorie !== serie) continue;
    const description = entree.decrire();
    description.sortie = { taille: 130, marge: 32 };
    const svg = entree.genre === "cercle" ? dessinerCercle(description) : dessinerFigure(description);
    const vignette = document.createElement("figure");
    vignette.className = "vignette";
    // activable au clavier comme au clic
    vignette.tabIndex = 0;
    vignette.setAttribute("role", "button");
    vignette.innerHTML = `${svg}<figcaption></figcaption>`;
    vignette.querySelector("figcaption").textContent = entree.titre;
    vignette.addEventListener("click", () => ouvrirObjet(cle));
    vignette.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      ouvrirObjet(cle);
    });
    vitrine.appendChild(vignette);
  }
  window.scrollTo(0, 0);
}

function ouvrirObjet(cle) {
  objetActif = cle;
  const entree = FIGURES_USUELLES[cle];
  $("vueSerie").hidden = true;
  $("vueObjet").hidden = false;
  $("filAriane").textContent = `· ${serieActive}`;
  $("titreObjet").textContent = entree.titre;
  actives.clear();
  actives.add("codages");
  actives.add("noms");
  if (entree.genre === "cercle") { actives.add("centre"); actives.add("rayon"); }
  const zone = $("parametresObjet");
  zone.innerHTML = "";
  for (const parametre of entree.parametres) {
    const label = document.createElement("label");
    label.className = "reglage";
    const sortie = document.createElement("output");
    const curseur = document.createElement("input");
    curseur.type = "range";
    curseur.min = parametre.min; curseur.max = parametre.max;
    curseur.step = parametre.pas ?? 0.5; curseur.value = parametre.defaut;
    curseur.dataset.cle = parametre.cle;
    sortie.textContent = String(parametre.defaut).replace(".", ",");
    curseur.addEventListener("input", () => {
      sortie.textContent = String(curseur.value).replace(".", ",");
      dessinerApercu(); plancheObjet();
    });
    label.append(`${parametre.libelle} `, curseur, sortie);
    zone.appendChild(label);
  }
  const pilules = $("pilulesObjet");
  pilules.innerHTML = "";
  for (const [cleCapacite, libelle] of capacitesDe(cle)) {
    const bouton = document.createElement("button");
    bouton.textContent = libelle;
    bouton.classList.toggle("actif", actives.has(cleCapacite));
    bouton.addEventListener("click", () => {
      actives.has(cleCapacite) ? actives.delete(cleCapacite) : actives.add(cleCapacite);
      bouton.classList.toggle("actif", actives.has(cleCapacite));
      dessinerApercu();
    });
    pilules.appendChild(bouton);
  }
  dessinerApercu();
  plancheObjet();
  window.scrollTo(0, 0);
}

for (const serie of CATEGORIES_FIGURES) {
  const bouton = document.createElement("button");
  bouton.textContent = serie;
  bouton.addEventListener("click", () => ouvrirSerie(serie));
  $("chipsSeries").appendChild(bouton);
}
$("btnRetourSerie").addEventListener("click", () => ouvrirSerie(serieActive));
$("choixTheme").addEventListener("change", dessinerApercu);
$("regleRotation").addEventListener("input", () => {
  $("valRotation").textContent = `${$("regleRotation").value}°`;
  dessinerApercu();
});
$("btnSvg").addEventListener("click", () => {
  const blob = new Blob([dernierSvg], { type: "image/svg+xml" });
  const lien = document.createElement("a");
  lien.href = URL.createObjectURL(blob);
  lien.download = `${objetActif}.svg`;
  lien.click();
  URL.revokeObjectURL(lien.href);
});

ouvrirSerie(serieActive);
</script>
</body>
</html>
