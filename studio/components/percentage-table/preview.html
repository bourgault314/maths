<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maths&go — prévisualisation pourcentage</title>
  <style>
    body { margin: 0; padding: 24px; color: #17283f; font-family: Arial, sans-serif; background: #f7f8fb; }
    main { max-width: 980px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    article { padding: 16px; background: white; border: 1px solid #d9deea; border-radius: 12px; }
    h1 { margin-top: 0; }
    h2 { font-size: 1rem; }
    svg { display: block; width: 100%; height: auto; }
    button { margin: 4px 4px 16px 0; padding: 8px 12px; border: 1px solid #aeb8ca; border-radius: 8px; background: white; cursor: pointer; }
    button[aria-pressed="true"] { background: #17283f; color: white; }
    .error { color: #a33; }
  </style>
</head>
<body>
  <main>
    <h1>Composant pourcentage</h1>
    <p>Cette page appelle le même moteur avec des données différentes. Aucun dessin n'est recopié dans les exercices.</p>
    <div role="group" aria-label="Mode">
      <button data-mode="help" aria-pressed="true">Aide</button>
      <button data-mode="question" aria-pressed="false">Question</button>
      <button data-mode="correction" aria-pressed="false">Correction</button>
    </div>
    <section id="previews" class="grid" aria-live="polite"></section>
  </main>
  <script type="module">
    import { percentageTablePresets, renderPercentageTableSvg } from './renderer.js';

    const previews = document.querySelector('#previews');
    let mode = 'help';

    function render() {
      previews.replaceChildren();
      for (const preset of percentageTablePresets) {
        const article = document.createElement('article');
        const title = document.createElement('h2');
        title.textContent = preset.label;
        article.append(title);
        try {
          article.insertAdjacentHTML('beforeend', renderPercentageTableSvg(preset.data, { mode }));
        } catch (error) {
          const message = document.createElement('p');
          message.className = 'error';
          message.textContent = error.message;
          article.append(message);
        }
        previews.append(article);
      }
      document.querySelectorAll('[data-mode]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
      });
    }

    document.querySelectorAll('[data-mode]').forEach(button => {
      button.addEventListener('click', () => {
        mode = button.dataset.mode;
        render();
      });
    });
    render();
  </script>
</body>
</html>
