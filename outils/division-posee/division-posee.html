<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Une division euclidienne ou décimale guidée étape par étape, avec la table du diviseur toujours visible.">
  <link rel="canonical" href="https://mathsgo.re/outils/division-posee/division-posee.html">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="author" content="Gwenaël Bourgault">
  <meta name="theme-color" content="#f6f8fb">
  <title>Division posée pas à pas | maths&amp;go</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="division-posee.css?v=7">
  <link rel="stylesheet" href="../../assets/css/consentement.css">
  <script defer src="../../assets/js/consentement.js"></script>
  <script type="module" src="division-posee.js?v=9"></script>
</head>
<body>
  <a class="skip-link" href="#outil">Aller à l’outil</a>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-nav">
        <a class="brand" href="/" aria-label="Accueil maths&go">
          <img src="/assets/img/logos/mathsgo/logo.png" alt="maths&go" width="1338" height="622">
        </a>
        <a class="back-link" href="/outils/?domain=nombres-calculs&amp;notion=divisibilite">← Nombres entiers et divisibilité</a>
      </div>
      <div class="title-lockup">
        <p>Outil de classe</p>
        <h1 id="page-title">Division euclidienne</h1>
      </div>
      <div class="header-actions">
        <a class="button button-light" href="gabarit-division-euclidienne.pdf" id="pdf-link">Gabarit A4</a>
        <button class="icon-button" type="button" id="fullscreen" aria-label="Afficher en plein écran" title="Afficher en plein écran">⛶</button>
      </div>
    </header>

    <main id="outil">
      <section class="controls-card" aria-label="Choix de la division">
        <form id="division-form">
          <label class="number-field role-dividend">
            <span>Dividende</span>
            <input id="dividend" inputmode="numeric" type="number" min="0" max="99999999" value="584" required>
          </label>
          <span class="division-symbol" aria-hidden="true">÷</span>
          <label class="number-field role-divisor">
            <span>Diviseur</span>
            <input id="divisor" inputmode="numeric" type="number" min="1" max="9999" value="7" required>
          </label>
          <fieldset class="mode-control">
            <legend>Quotient</legend>
            <div class="segmented">
              <button type="button" class="is-active" data-mode="integer" aria-pressed="true">Entier</button>
              <button type="button" data-mode="decimal" aria-pressed="false">Décimal</button>
            </div>
          </fieldset>
          <label class="rank-control" for="rank-guides">
            <input id="rank-guides" type="checkbox">
            <span class="rank-switch" aria-hidden="true"></span>
            <span class="rank-copy"><strong>Repères de rang</strong><small>c · d · u</small></span>
          </label>
          <label class="decimal-field" id="decimal-field" hidden>
            <span>Décimales</span>
            <select id="decimal-places">
              <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
            </select>
          </label>
          <button class="button button-primary" type="submit">Poser la division</button>
        </form>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </section>

      <section class="projection-recap" id="projection-recap" aria-label="Division affichée" hidden>
        <strong id="projection-problem">584 ÷ 7 · Entier</strong>
        <button class="button button-light" id="edit-problem" type="button">Modifier</button>
      </section>

      <section class="workspace">
        <article class="board-card">
          <div class="instruction" aria-live="polite">
            <div>
              <p id="step-title">J’anticipe</p>
              <h2 id="step-sentence"></h2>
              <p class="step-detail" id="step-detail" hidden></p>
            </div>
            <span id="step-count"></span>
          </div>

          <div class="division-stage">
            <div class="long-division" id="long-division"></div>
            <div class="role-strip" id="role-strip"></div>
          </div>

          <nav class="step-controls" aria-label="Étapes de la division">
            <button class="button button-secondary" id="previous" type="button">← Précédente</button>
            <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
            <button class="button button-quiet" id="show-all" type="button">Tout afficher</button>
            <button class="button button-primary" id="next" type="button">Suivante →</button>
          </nav>
        </article>

        <aside class="table-card" aria-labelledby="table-title">
          <div class="table-heading"><p>Table du diviseur</p><h2 id="table-title">Table de 7</h2></div>
          <div id="multiples" class="multiples"></div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <span>Gwenaël Bourgault</span><span aria-hidden="true">·</span>
      <a href="mailto:gwenael@mathsgo.re?subject=Contact%20depuis%20mathsgo.re">Me contacter</a><span aria-hidden="true">·</span>
      <a href="/outils/">Toutes les ressources</a><span aria-hidden="true">·</span>
      <a href="/mentions-legales.html">Mentions légales</a><span aria-hidden="true">·</span>
      <a href="/confidentialite.html">Confidentialité</a><span aria-hidden="true">·</span>
      <a href="/licence.html">Licence</a><span aria-hidden="true">·</span>
      <button type="button" data-mathsgo-consent-open onclick="window.mathsgoConsentement &amp;&amp; window.mathsgoConsentement.ouvrir()">Gérer mes cookies</button>
    </footer>
  </div>
</body>
</html>
