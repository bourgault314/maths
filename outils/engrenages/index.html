<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maths&amp;go — Laboratoire d’engrenages</title>
  <style>
    :root {
      --ink: #1f2a44;
      --muted: #61708a;
      --blue: #3f7cff;
      --orange: #f0a13a;
      --steel-dark: #4d6079;
      --steel: #c9d4df;
      --steel-light: #eef3f8;
      --paper: rgba(255, 255, 255, 0.9);
      --line: rgba(49, 67, 91, 0.2);
      --shadow: 0 18px 44px rgba(31, 42, 68, 0.13);
      --shadow-strong: 0 28px 70px rgba(31, 42, 68, 0.2);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(760px 440px at 4% 0%, rgba(63, 124, 255, 0.18), transparent 62%),
        radial-gradient(720px 420px at 96% 8%, rgba(240, 161, 58, 0.16), transparent 62%),
        linear-gradient(150deg, #eaf0f6 0%, #ccd7e2 52%, #b8c6d4 100%);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(42, 59, 82, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 59, 82, 0.055) 1px, transparent 1px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 5px);
      background-size: 48px 48px, 48px 48px, auto;
      mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.82) 72%, transparent 100%);
    }

    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 8px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.42;
      background: repeating-linear-gradient(135deg, var(--orange) 0 15px, var(--steel-dark) 15px 30px);
    }

    /* Mécanisme animé conservé */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      color: #36577d;
      opacity: 0.085;
      font-size: 30rem;
    }

    .gear-deco {
      position: absolute;
      display: inline-block;
      line-height: 1;
      animation: rotate linear infinite;
    }

    .g1 {
      top: -10%;
      left: -5%;
      animation-duration: 60s;
    }

    .g2 {
      top: 40%;
      left: 8%;
      font-size: 14rem;
      animation-duration: 25s;
      animation-direction: reverse;
    }

    .g3 {
      right: -5%;
      bottom: -10%;
      font-size: 25rem;
      animation-duration: 45s;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .wrap {
      width: min(1080px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 38px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      height: 54px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .logo-link {
      display: block;
      width: 124px;
      opacity: 0.97;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .logo-link:hover {
      transform: translateY(-1px);
      opacity: 1;
    }

    .logo-link:focus-visible {
      outline: 3px solid rgba(240, 161, 58, 0.5);
      outline-offset: 5px;
      border-radius: 10px;
    }

    .logo-link img {
      display: block;
      width: 100%;
      height: auto;
    }

    main {
      display: grid;
      gap: 28px;
      margin-top: 18px;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--ink);
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.42);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 460px));
      justify-content: center;
      gap: 26px;
    }

    .card {
      --accent: var(--blue);
      overflow: hidden;
      position: relative;
      color: inherit;
      text-decoration: none;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card::before,
    .card::after {
      content: "";
      width: 8px;
      height: 8px;
      position: absolute;
      top: 10px;
      z-index: 2;
      border-radius: 50%;
      background: linear-gradient(145deg, #f8fbff, #718096);
      box-shadow: inset 0 0 0 1px rgba(31, 42, 68, 0.25), 0 1px 2px rgba(31, 42, 68, 0.18);
    }

    .card::before { left: 12px; }
    .card::after { right: 12px; }

    .card:hover {
      transform: translateY(-7px);
      border-color: color-mix(in srgb, var(--accent) 52%, white);
      box-shadow: var(--shadow-strong), inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .card:focus-visible {
      outline: 4px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 5px;
    }

    .preview {
      aspect-ratio: 16 / 10;
      padding: 16px;
      overflow: hidden;
      border-bottom: 1px solid rgba(49, 67, 91, 0.16);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(218, 227, 237, 0.72)),
        repeating-linear-gradient(90deg, rgba(49, 67, 91, 0.04) 0 1px, transparent 1px 6px);
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border: 1px solid rgba(49, 67, 91, 0.2);
      border-radius: 15px;
      background: #f1f5fa;
      box-shadow: 0 14px 28px rgba(31, 42, 68, 0.13);
    }

    .preview img.plateau {
      object-fit: contain;
    }

    .label {
      min-height: 80px;
      padding: 17px 74px 19px 22px;
      display: grid;
      place-items: center;
      position: relative;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(230, 237, 244, 0.92));
      font-size: clamp(1.18rem, 1.8vw, 1.5rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      font-weight: 900;
    }

    .arrow {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      background: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 13px;
      box-shadow: 0 10px 22px rgba(31, 42, 68, 0.18);
      font-size: 1.4rem;
      font-weight: 950;
    }

    @media (max-width: 900px) {
      .wrap {
        width: min(100% - 24px, 640px);
        padding: 18px 0 28px;
      }

      .topbar { height: 48px; }
      .logo-link { width: 112px; }
      main { margin-top: 14px; gap: 22px; }
      .grid { grid-template-columns: 1fr; }
      .bg-layer { opacity: 0.06; }
    }

    @media (max-width: 480px) {
      .preview { padding: 11px; }
      .label { min-height: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gear-deco { animation-play-state: paused; }
      .logo-link, .card { transition: none; }
    }
  </style>
