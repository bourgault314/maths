<style>
  :root{
    --ink:#17324D; --muted:#55636f; --ligne:#dfe6ec; --fond:#f5f7f9;
    --vert:#08A6A6; --vert-clair:#EAF8F7; --accent:#F28C28;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--fond);color:var(--ink);overflow:hidden;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
  .bandeau{background:#fff;border-bottom:2.5px solid var(--vert);padding:8px 14px;
           display:flex;align-items:center;gap:10px;flex:0 0 auto;flex-wrap:wrap}
  .bandeau h1{font-size:17px;margin:0;font-weight:700;flex:1 1 auto}
  .scene{flex:1 1 auto;position:relative;min-height:0;touch-action:none;cursor:grab;
         display:flex;align-items:center;justify-content:center;background:#fff}
  .scene.attrape{cursor:grabbing}
  .scene svg{display:block;width:100%;height:100%}
  .commandes{flex:0 0 auto;background:#fff;border-top:1px solid var(--ligne);padding:10px 14px 12px}
  .rangee{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
          justify-content:center}
  .rangee + .rangee{margin-top:10px}
  button{font:inherit;font-size:15px;min-height:44px;padding:0 14px;border-radius:10px;
         border:1px solid #cfd8e0;background:#fff;color:var(--ink);cursor:pointer}
  button:hover{background:#f2f6f8}
  button.on{background:var(--vert);border-color:var(--vert);color:#fff;font-weight:600}
  button.vedette{background:var(--vert);border-color:var(--vert);color:#fff;font-weight:600}
  button.vedette:hover{background:#079b9b}
  button#btnReel{min-width:172px}
  button[disabled]{opacity:.42;cursor:default}
  button[disabled]:hover{background:#fff}
  .groupe{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .sep{width:1px;align-self:stretch;background:var(--ligne);margin:0 2px}
  .court{display:none}

  dialog{border:none;border-radius:14px;padding:18px;box-shadow:0 18px 50px rgba(23,50,77,.24);
         color:var(--ink);font:inherit;max-width:340px;width:calc(100% - 32px);
         max-height:calc(100vh - 28px);overflow:auto}
  dialog::backdrop{background:rgba(23,50,77,.35)}
  dialog h2{margin:0 0 12px;font-size:16px}
  dialog.large{max-width:760px}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .trio label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
  dialog input[type=number],dialog input[type=text],dialog select{
    width:100%;padding:8px;font:inherit;font-size:16px;border:1px solid #cfd8e0;
    border-radius:8px;min-height:42px;background:#fff;color:var(--ink)}
  .ligne{display:flex;align-items:center;gap:10px;margin:9px 0}
  .ligne > label{font-size:13px;color:var(--muted);margin:0;flex:0 0 auto}
  .ligne .pousse{flex:1 1 auto}
  .val{font-variant-numeric:tabular-nums;font-weight:600}
  .puce{min-height:34px;font-size:13px;padding:0 12px;border-radius:999px}
  .coche{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:14px;cursor:pointer}
  .coche input{width:20px;height:20px;accent-color:var(--vert);flex:0 0 auto}
  .coche.eteinte{opacity:.45}
  input[type=range]{width:100%;min-height:36px;accent-color:var(--vert)}
  .pied{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}

  .deux{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:stretch}
  .apercu{display:flex;align-items:center;justify-content:center;min-height:230px;
          border:1px solid var(--ligne);border-radius:10px;padding:8px;background:#fff}
  .apercu svg{max-width:100%;height:auto}
  .boutons{display:grid;gap:8px;margin-top:14px}
  .boutons button.principal{background:var(--vert);border-color:var(--vert);color:#fff;font-weight:600}
  .boutons button.principal:hover{background:#079b9b}
  .deuxi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .message{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);
     color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
     transition:opacity .18s;z-index:9}
  .message.vu{opacity:1}
  .mention{max-width:1000px;margin:8px auto 0;text-align:center;font-size:11.5px;color:#8b98a5}

  /* Sur un écran large, le panneau du pavé se range à gauche : on tape les
     lettres en regardant le solide les prendre, ce qui serait impossible si la
     boîte se posait au milieu de la figure. */
  @media (min-width:861px){
    #dlgPave{margin:auto auto auto 24px}
  }
  @media (max-width:860px){
    .deux{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:640px){
    .bandeau{flex-wrap:nowrap;padding:6px 10px;gap:8px}
    .bandeau h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bandeau button{padding:0 10px;font-size:13px}
    .commandes{padding:8px 8px 10px}
    .rangee{gap:8px}
    .rangee + .rangee{margin-top:8px}
    .groupe{gap:5px}
    button{font-size:13px;padding:0 9px;min-height:44px}
    button#btnReel{min-width:140px}
    .sep{display:none}
    .long{display:none}
    .court{display:inline}
    dialog{padding:14px}
  }
  @media (max-width:420px){
    button{font-size:12.5px;padding:0 7px}
    button#btnReel{min-width:0}
  }

<script src="../../assets/js/pave-espace-moteur.js?v=20260916-2"></script>
<script defer src="../../assets/js/tool-parent-navigation.js"></script>
<script>
(function(){
  "use strict";
  var M = window.MathsGoPaveEspace;
  var $ = function(id){ return document.getElementById(id); };
  var scene = $("scene");

  /* La pose où le mensonge du dessin saute aux yeux. Mesurée sur le pavé
     5 × 3 × 6 : l'angle ABC lu à l'écran passe de 135° à 105°, et la
     profondeur BC de 0,30 à 0,57 de la largeur AB — elle double presque.
     Depuis la pose de départ (−35° / 20°), elle ne bougeait que de 0,30 à
     0,39 : personne ne voyait rien. */
  var POSE_REELLE = { azimut: -40, elevation: 45 };

  var etat = {
    L: 5, P: 3, H: 6, unite: "cm",
    lettres: "ABCDEFGH",
    t: 0,                    // 0 = le dessin en perspective, 1 = l'objet réel
    azimut: POSE_REELLE.azimut, elevation: POSE_REELLE.elevation,
    triangle: null,          // null | "ABC" | "ACG"
    rabattement: 0
  };
  var solide = M.creerPave(etat.L, etat.P, etat.H);
  var cavaliere = M.matriceCavaliere(0.5, 45);

  // Les lettres affichées, sommet par sommet : « A » reste le nom interne.
  function lettres(){ return M.lireLettres(etat.lettres); }
  function mot(cles){
    var t = lettres();
    return cles.split("").map(function(c){ return t[c]; }).join("");
  }

  /* ------------------------------------------------------------- animations */
  var animations = [];
  var boucleEnCours = false;

  function animer(champ, cible, duree, apres){
    animations = animations.filter(function(a){ return a.champ !== champ; });
    animations.push({
      champ: champ, depart: etat[champ], cible: cible,
      t0: performance.now(), duree: duree || 520, apres: apres
    });
    lancerBoucle();
  }
  function lancerBoucle(){
    if (boucleEnCours) return;
    boucleEnCours = true;
    requestAnimationFrame(pas);
  }
  function pas(maintenant){
    var restantes = [];
    animations.forEach(function(a){
      var u = Math.min(1, (maintenant - a.t0) / a.duree);
      var e = u < 0.5 ? 2*u*u : -1 + (4 - 2*u)*u;   // adouci aux deux bouts
      etat[a.champ] = a.depart + (a.cible - a.depart) * e;
      if (u < 1) restantes.push(a); else if (a.apres) a.apres();
    });
    animations = restantes;
    dessiner();
    if (animations.length) requestAnimationFrame(pas);
    else boucleEnCours = false;
  }

  /* ------------------------------------------------------------------ tracé */
  function joli(v){ return (Math.round(v*100)/100).toString().replace(".", ","); }

  function dessiner(){
    var l = Math.max(240, scene.clientWidth);
    var h = Math.max(200, scene.clientHeight);
    var base = Math.min(l, h);

    var projection = M.melanger(cavaliere, M.matriceReelle(etat.azimut, etat.elevation), etat.t);
    var suffixe = etat.unite ? " " + etat.unite : "";

    scene.innerHTML = M.dessiner({
      solide: solide,
      projection: projection,
      largeur: l,
      hauteur: h,
      marge: Math.round(base * 0.10),
      cadrage: "stable",
      etiquettesFluides: true,
      lettres: etat.lettres,
      cotes: { L: joli(etat.L) + suffixe, P: joli(etat.P) + suffixe, H: joli(etat.H) + suffixe },
      diagonaleBase: etat.triangle === "ABC" || etat.triangle === "ACG",
      triangle: etat.triangle ? etat.triangle.split("") : null,
      rabattement: etat.rabattement,
      uniteRabattement: etat.unite,
      corpsSommet: Math.round(base * 0.048),
      corpsCote: Math.round(base * 0.040)
    }).svg;

    var reel = etat.t >= 0.5;
    $("btnReel").textContent = reel ? "Revenir au dessin" : "Voir l’objet réel";
    $("btnReel").classList.toggle("vedette", !reel);
  }

  /* ------------------------------------------------- les mots qui suivent les lettres */
  function renommer(){
    $("tABC").textContent = "Triangle " + mot("ABC");
    $("tACG").textContent = "Triangle " + mot("ACG");
    $("vACG").textContent = "Plan " + mot("ACG");
    $("fDroitNom").textContent = mot("B");
    remplirSommets();
  }

  /* ------------------------------------------------------------- commandes */
  function versVue(azimut, elevation, bouton){
    ["vFace","vDessus","vACG"].forEach(function(id){
      $(id).classList.toggle("on", id === bouton);
    });
    var cible = azimut;   // le tour le plus court, sinon le pavé fait un demi-tour inutile
    while (cible - etat.azimut > 180) cible -= 360;
    while (cible - etat.azimut < -180) cible += 360;
    animer("azimut", cible, 620);
    animer("elevation", elevation, 620);
    animer("t", 1, 620);
  }

  $("vFace").addEventListener("click", function(){ versVue(0, 0, "vFace"); });
  // Vue de dessus remise d'aplomb : la base doit se lire comme un rectangle.
  $("vDessus").addEventListener("click", function(){ versVue(0, 90, "vDessus"); });
  $("vACG").addEventListener("click", function(){
    var v = M.vueTriangleACG(solide);
    versVue(v.azimut, v.elevation, "vACG");
  });

  function marquerVueLibre(){
    ["vFace","vDessus","vACG"].forEach(function(id){ $(id).classList.remove("on"); });
  }

  // Le bouton du dessin à l'objet : on pose d'abord la caméra à l'angle qui
  // montre quelque chose — tant qu'on est sur le dessin, elle ne se voit pas —
  // puis l'animation se joue d'un seul coup.
  $("btnReel").addEventListener("click", function(){
    if (etat.t >= 0.5) { animer("t", 0, 760); return; }
    marquerVueLibre();
    animations = animations.filter(function(a){ return a.champ === "t"; });
    etat.azimut = POSE_REELLE.azimut;
    etat.elevation = POSE_REELLE.elevation;
    animer("t", 1, 900);
  });

  function choisirTriangle(nom){
    if (etat.triangle === nom) {
      etat.triangle = null;
      animer("rabattement", 0, 420, function(){ etat.rabattement = 0; dessiner(); });
    } else {
      etat.triangle = nom;
      etat.rabattement = 0;
    }
    $("tABC").classList.toggle("on", etat.triangle === "ABC");
    $("tACG").classList.toggle("on", etat.triangle === "ACG");
    $("btnRabattre").disabled = !etat.triangle;
    $("btnRabattre").classList.remove("on");
    $("btnRabattre").textContent = "Rabattre";
    dessiner();
  }
  $("tABC").addEventListener("click", function(){ choisirTriangle("ABC"); });
  $("tACG").addEventListener("click", function(){ choisirTriangle("ACG"); });

  $("btnRabattre").addEventListener("click", function(){
    var plie = etat.rabattement > 0.5;
    animer("rabattement", plie ? 0 : 1, 900);
    this.classList.toggle("on", !plie);
    this.textContent = plie ? "Rabattre" : "Remettre";
  });

  /* ------------------------------------------------- rotation au doigt/souris */
  var prise = null;
  scene.addEventListener("pointerdown", function(ev){
    prise = { x: ev.clientX, y: ev.clientY, a: etat.azimut, e: etat.elevation };
    scene.setPointerCapture(ev.pointerId);
    scene.classList.add("attrape");
    // Toucher le solide, c'est demander à le voir en vrai.
    if (etat.t < 1) animer("t", 1, 420);
    marquerVueLibre();
  });
  scene.addEventListener("pointermove", function(ev){
    if (!prise) return;
    var base = Math.max(240, Math.min(scene.clientWidth, scene.clientHeight));
    etat.azimut = prise.a - ((ev.clientX - prise.x) / base) * 220;
    etat.elevation = Math.max(-88, Math.min(88, prise.e + ((ev.clientY - prise.y) / base) * 200));
    if (!animations.length) dessiner(); else lancerBoucle();
  });
  ["pointerup","pointercancel"].forEach(function(t){
    scene.addEventListener(t, function(){ prise = null; scene.classList.remove("attrape"); });
  });

  /* ------------------------------------------------------------- le pavé */
  var dlgPave = $("dlgPave");
  function ouvrir(dlg){ if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); }
  function fermer(dlg){ if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }

  $("btnPave").addEventListener("click", function(){
    $("dl").value = etat.L; $("dp").value = etat.P; $("dh").value = etat.H;
    $("du").value = etat.unite; $("dsommets").value = etat.lettres;
    ouvrir(dlgPave);
  });
  $("paveOk").addEventListener("click", function(){ fermer(dlgPave); });

  function lirePave(){
    var lire = function(id, def){
      var v = parseFloat(String($(id).value).replace(",", "."));
      return (isFinite(v) && v > 0) ? v : def;
    };
    etat.L = lire("dl", etat.L); etat.P = lire("dp", etat.P); etat.H = lire("dh", etat.H);
    etat.unite = ($("du").value || "").trim();
    var tapees = ($("dsommets").value || "").toUpperCase();
    $("dsommets").value = tapees;
    etat.lettres = tapees;
    solide = M.creerPave(etat.L, etat.P, etat.H);
    renommer();
    dessiner();
    if (dlgFigure.open) figure();
  }
  ["dl","dp","dh","du","dsommets"].forEach(function(id){
    $(id).addEventListener("input", lirePave);
  });
  $("faireCube").addEventListener("click", function(){
    var c = parseFloat(String($("dl").value).replace(",", ".")) || etat.L;
    $("dp").value = c; $("dh").value = c;
    lirePave();
  });

  /* --------------------------------------------------------- la figure */
  var dlgFigure = $("dlgFigure");
  var dernierSvg = "";
  var LARGEUR_FIGURE = 420, HAUTEUR_FIGURE = 328;

  function remplirSommets(){
    var t = lettres();
    [$("fSeg1"), $("fSeg2")].forEach(function(sel){
      var choisi = sel.value;
      sel.innerHTML = '<option value="">—</option>' + M.NOMS.map(function(n){
        return '<option value="' + n + '">' + t[n] + "</option>";
      }).join("");
      sel.value = choisi;
    });
    nommerSegment();
  }
  function nommerSegment(){
    var a = $("fSeg1").value, b = $("fSeg2").value;
    var complet = a && b && a !== b;
    $("fSegNom").disabled = !complet;
    $("lblSegNom").classList.toggle("eteinte", !complet);
    $("fSegNomTexte").textContent = complet ? "écrire " + mot(a + b) : "écrire son nom";
  }

  function figure(){
    var coef = parseFloat($("fCoef").value);
    $("fCoefVal").textContent = joli(coef);
    var unite = etat.unite ? " " + etat.unite : "";
    var a = $("fSeg1").value, b = $("fSeg2").value;

    dernierSvg = M.dessiner({
      solide: solide,
      projection: M.matriceCavaliere(coef, parseFloat($("fAngle").value)),
      largeur: LARGEUR_FIGURE, hauteur: HAUTEUR_FIGURE,
      marge: Math.round(LARGEUR_FIGURE * 0.11),
      cadrage: "juste",
      lettres: etat.lettres,
      nomsSommets: $("fLettres").checked,
      cotes: $("fCotes").checked
        ? { L: joli(etat.L) + unite, P: joli(etat.P) + unite, H: joli(etat.H) + unite }
        : null,
      segments: (a && b && a !== b) ? [{ a: a, b: b, nom: $("fSegNom").checked }] : null,
      angleDroitBase: $("fDroit").checked,
      corpsSommet: Math.max(10, Math.round(LARGEUR_FIGURE * 0.049)),
      corpsCote: Math.max(9, Math.round(LARGEUR_FIGURE * 0.042))
    }).svg;
    $("apercu").innerHTML = dernierSvg;
  }

  $("btnFigure").addEventListener("click", function(){ figure(); ouvrir(dlgFigure); });
  $("figureOk").addEventListener("click", function(){ fermer(dlgFigure); });
  ["fAngle","fCoef","fCotes","fLettres","fDroit","fSegNom"].forEach(function(id){
    $(id).addEventListener("input", figure);
    $(id).addEventListener("change", figure);
  });
  [$("fSeg1"), $("fSeg2")].forEach(function(sel){
    sel.addEventListener("change", function(){ nommerSegment(); figure(); });
  });

  function annoncer(t){
    var m = $("message");
    m.textContent = t; m.classList.add("vu");
    clearTimeout(annoncer.t);
    annoncer.t = setTimeout(function(){ m.classList.remove("vu"); }, 1900);
  }
  function nomFichier(ext){
    return "pave_" + etat.L + "x" + etat.P + "x" + etat.H + "." + ext;
  }
  function telecharger(blob, nom){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  $("dlSvg").addEventListener("click", function(){
    telecharger(new Blob([dernierSvg], { type: "image/svg+xml;charset=utf-8" }), nomFichier("svg"));
  });
  $("copier").addEventListener("click", function(){
    var fini = function(){ annoncer("Code SVG copié"); };
    var secours = function(){
      var z = document.createElement("textarea");
      z.value = dernierSvg; z.style.position = "fixed"; z.style.opacity = "0";
      document.body.appendChild(z); z.select();
      try { document.execCommand("copy"); fini(); }
      catch(e){ annoncer("Copie refusée par le navigateur"); }
      z.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(dernierSvg).then(fini, secours);
    } else { secours(); }
  });
  $("dlPng").addEventListener("click", function(){
    var vue = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(dernierSvg);
    var l = vue ? parseFloat(vue[1]) : LARGEUR_FIGURE, h = vue ? parseFloat(vue[2]) : HAUTEUR_FIGURE;
    var echelle = 3;
    var img = new Image();
    img.onload = function(){
      var c = document.createElement("canvas");
      c.width = Math.round(l * echelle); c.height = Math.round(h * echelle);
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(b){ telecharger(b, nomFichier("png")); }, "image/png");
    };
    img.onerror = function(){ annoncer("Le PNG n’a pas pu être fabriqué"); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(dernierSvg);
  });

  /* -------------------------------------------------------------- démarrage */
  var p = new URLSearchParams(location.search);
  var depuisAdresse = function(cle, def){
    var v = parseFloat(String(p.get(cle) || "").replace(",", "."));
    return (isFinite(v) && v > 0) ? v : def;
  };
  etat.L = depuisAdresse("l", etat.L);
  etat.P = depuisAdresse("p", etat.P);
  etat.H = depuisAdresse("h", etat.H);
  if (p.get("u") !== null) etat.unite = p.get("u");
  if (p.get("s")) etat.lettres = p.get("s").toUpperCase();
  solide = M.creerPave(etat.L, etat.P, etat.H);

  renommer();
  window.addEventListener("resize", dessiner);
  dessiner();
})();
</script>
</body>
</html>
