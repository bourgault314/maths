  <style>
    :root {
      --ink: #172033;
      --paper: rgba(255, 253, 248, 0.88);
      --line: rgba(87, 68, 42, 0.13);
      --blue: #2786b7;
      --green: #15936f;
      --orange: #d9762d;
      --purple: #7c5cb8;
      --rose: #c94f75;
      --shadow: 0 18px 44px rgba(63, 46, 25, 0.12);
      --shadow-strong: 0 28px 62px rgba(63, 46, 25, 0.19);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f1eadf;
    }

    /* Univers atelier : papier, grille de coupe et règle. */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 15%, rgba(255, 206, 141, 0.40), transparent 31%),
        radial-gradient(circle at 84% 20%, rgba(128, 205, 210, 0.28), transparent 34%),
        radial-gradient(circle at 53% 88%, rgba(181, 155, 222, 0.25), transparent 38%),
        linear-gradient(135deg, #fff8ed 0%, #f2eadf 40%, #edf5f3 72%, #f6eff8 100%);
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.42;
      background-image:
        linear-gradient(rgba(89, 73, 50, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89, 73, 50, 0.07) 1px, transparent 1px),
        linear-gradient(rgba(89, 73, 50, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89, 73, 50, 0.035) 1px, transparent 1px);
      background-size: 84px 84px, 84px 84px, 21px 21px, 21px 21px;
      mask-image: radial-gradient(circle at 50% 44%, #000 0 48%, transparent 82%);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: -12%;
      opacity: 0.75;
      background:
        radial-gradient(circle at 22% 62%, rgba(255,255,255,0.48), transparent 22%),
        radial-gradient(circle at 73% 34%, rgba(255,255,255,0.30), transparent 20%);
    }

    .decor {
      position: absolute;
      animation: drift 16s ease-in-out infinite alternate;
      will-change: transform;
    }

    .paper-piece {
      width: 150px;
      height: 205px;
      border: 1px solid rgba(91, 70, 41, 0.13);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.43);
      box-shadow: 0 18px 45px rgba(64, 45, 22, 0.07);
    }

    .paper-piece::before {
      content: "";
      position: absolute;
      inset: 17px;
      border: 1px dashed rgba(217, 118, 45, 0.24);
      border-radius: 4px;
    }

    .paper-1 { top: 12%; left: -52px; rotate: -13deg; }
    .paper-2 { right: -35px; bottom: 10%; rotate: 9deg; animation-delay: -7s; }

    .ruler {
      width: 320px;
      height: 46px;
      top: 13%;
      right: -92px;
      opacity: 0.42;
      rotate: 17deg;
      border: 1px solid rgba(191, 122, 38, 0.22);
      border-radius: 8px;
      background:
        repeating-linear-gradient(90deg, rgba(123, 75, 23, 0.28) 0 1px, transparent 1px 16px) left top / 100% 15px no-repeat,
        linear-gradient(90deg, rgba(247, 185, 75, 0.32), rgba(255, 223, 148, 0.20));
      box-shadow: 0 15px 35px rgba(94, 60, 22, 0.08);
      animation-delay: -4s;
    }

    .cut-grid {
      width: 132px;
      height: 132px;
      left: 5%;
      bottom: 8%;
      opacity: 0.28;
      rotate: -7deg;
      border: 1px dashed rgba(39, 134, 183, 0.34);
      background-image:
        linear-gradient(rgba(39, 134, 183, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(39, 134, 183, 0.18) 1px, transparent 1px);
      background-size: 22px 22px;
      animation-delay: -10s;
    }

    @keyframes drift {
      from { translate: 0 0; scale: 1; }
      to { translate: 0 17px; scale: 1.015; }
    }

    .wrap {
      width: min(1080px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 40px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      height: 54px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .logo-link {
      display: block;
      width: 124px;
      opacity: 0.97;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .logo-link:hover { transform: translateY(-1px); opacity: 1; }

    .logo-link:focus-visible {
      outline: 3px solid rgba(217, 118, 45, 0.35);
      outline-offset: 5px;
      border-radius: 10px;
    }

    .logo-link img { display: block; width: 100%; height: auto; }

    main {
      display: grid;
      gap: 27px;
      margin-top: 18px;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--ink);
      font-size: clamp(2.15rem, 5vw, 3.85rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.66);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 440px));
      justify-content: center;
      gap: 22px;
    }

    .card:last-child:nth-child(odd) {
      width: min(100%, 440px);
      grid-column: 1 / -1;
      justify-self: center;
    }

    .card {
      --accent: var(--blue);
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
      backdrop-filter: blur(12px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--accent) 38%, white);
      box-shadow: var(--shadow-strong), inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .card:focus-visible {
      outline: 4px solid color-mix(in srgb, var(--accent) 30%, transparent);
      outline-offset: 5px;
    }

    .preview {
      aspect-ratio: 16 / 10;
      padding: 14px;
      overflow: hidden;
      position: relative;
      border-bottom: 1px solid rgba(74, 59, 37, 0.10);
      background:
        radial-gradient(260px 160px at 16% 12%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 70%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(248, 244, 236, 0.84));
    }

    .preview::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(89, 73, 50, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89, 73, 50, 0.09) 1px, transparent 1px);
      background-size: 20px 20px;
      mask-image: linear-gradient(90deg, #000, transparent 68%);
    }

    .paper-stack {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .paper-stack img {
      position: absolute;
      display: block;
      object-fit: contain;
      object-position: center;
      border: 1px solid rgba(74, 59, 37, 0.20);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 14px 28px rgba(60, 42, 20, 0.15);
    }

    .paper-stack.duo img {
      width: 58%;
      height: 86%;
      top: 7%;
    }

    .paper-stack.duo img:first-child {
      left: 3%;
      transform: rotate(-3deg);
    }

    .paper-stack.duo img:last-child {
      right: 3%;
      transform: rotate(3deg);
    }

    .paper-stack.trio img {
      width: 48%;
      height: 84%;
      top: 8%;
    }

    .paper-stack.trio img:nth-child(1) {
      left: 2%;
      transform: rotate(-4deg);
    }

    .paper-stack.trio img:nth-child(2) {
      left: 26%;
      top: 5%;
      z-index: 2;
    }

    .paper-stack.trio img:nth-child(3) {
      right: 2%;
      transform: rotate(4deg);
    }

    .paper-stack.cards img:first-child { object-position: center 17%; }
    .paper-stack.cards img:last-child { object-position: center 24%; }
    .paper-stack.grids img:first-child { object-position: center; }
    .paper-stack.grids img:last-child { object-position: center 12%; }
    .paper-stack.decimal img { object-position: center; }

    .label {
      min-height: 76px;
      padding: 16px 72px 18px 20px;
      display: grid;
      place-items: center;
      position: relative;
      text-align: center;
      font-size: clamp(1.08rem, 1.55vw, 1.38rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 900;
    }

    .arrow {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      background: var(--accent);
      border-radius: 13px;
      box-shadow: 0 11px 22px rgba(60, 42, 20, 0.16);
      font-size: 1.35rem;
      font-weight: 950;
    }

    @media (max-width: 900px) {
      .wrap { width: min(100% - 24px, 640px); padding: 18px 0 28px; }
      .topbar { height: 48px; }
      .logo-link { width: 112px; }
      main { margin-top: 14px; gap: 22px; }
      .grid { grid-template-columns: 1fr; }
      .paper-piece, .ruler, .cut-grid { opacity: 0.18; }
    }

    @media (max-width: 560px) {
      .preview { padding: 10px; }
      .paper-piece, .ruler, .cut-grid { display: none; }
      .paper-stack.duo img { width: 61%; }
      .paper-stack.trio img { width: 51%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .decor { animation-play-state: paused; }
      .logo-link, .card { transition: none; }
    }
  </style>
