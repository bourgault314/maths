*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--ui)}
.page{min-height:100%;box-sizing:border-box;padding-block:16px;padding-inline:16px;display:flex;align-items:center;justify-content:center}
.player{width:100%;max-width:1440px;display:flex;flex-direction:column;align-items:center}
/* Lot 3b « aides et carte » (08/11/2026, choix de Gwenaël) : UN cadre blanc — en haut, la ligne des boutons ; dessous,
   séparée par un trait fin gris (comme l'en-tête commun des applis suivies), l'image du film. Plus rien sous le film.
   Pas de bouton PAR-DESSUS l'image : les sous-titres des films s'écrivent en haut de l'image.
   --reserve : la hauteur gardée en dehors de l'image (ligne des boutons + marges de la page), mesurée par le lecteur */
.cadre{width:min(100%, calc((100dvh - var(--reserve,80px)) * 1.7778));min-width:min(100%,320px);max-width:100%;
  background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.08),0 14px 40px rgba(15,23,42,.12)}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--paper);overflow:hidden;cursor:pointer;container-type:inline-size}
.stage svg{display:block;width:100%;height:100%;font-family:var(--ui)}
.bigplay{position:absolute;right:3%;bottom:5%;width:88px;height:88px;border-radius:50%;border:none;
  background:rgba(37,99,235,.92);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(37,99,235,.35)}
.bigplay svg{width:40px;height:40px}
.bigplay:focus-visible{outline:4px solid #93c5fd;outline-offset:4px}
/* en haut du cadre, une seule ligne : la carte, plein écran (et le son), passer le film ; le crédit est sur le carton de titre */
.barre{display:flex;align-items:center;justify-content:space-between;gap:0 16px;padding:4px 6px;border-bottom:1px solid #e3ebf0}
.lien{font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:none;border:none;padding:10px 4px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.lien svg{width:16px;height:16px}
.lien:hover{color:var(--accent)}
.lien:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
/* « Passer le film › » : une pastille, pas un lien gris — l'élève qui arrive par « Étape suivante »
   doit voir qu'il peut aller jouer tout de suite (11/10/2026) */
.passer{color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:9px 18px;font-size:16px;font-weight:800;margin-left:auto}
.passer:hover{color:var(--accent);background:var(--accent-soft-hover)}
/* « ‹ Carte des mondes » (lot « films : liens et boutons », 08/11/2026, choix de Gwenaël) : la même pastille que
   « Passer le film › », toujours à gauche — on peut toujours revenir à la carte sans passer par le jeu */
.carte{color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:9px 18px;font-size:16px;font-weight:800}
.carte:hover{color:var(--accent);background:var(--accent-soft-hover)}
.player.fs{position:fixed;inset:0;z-index:10;max-width:none;background:var(--page);justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.player:fullscreen{max-width:none;background:var(--page);justify-content:center;padding:12px 16px;box-sizing:border-box}
.player:fullscreen .cadre,.player.fs .cadre{width:min(100%, calc((100vh - var(--reserve,80px)) * 1.7778))}
/* portrait : 3:4 pour le film d'introduction ; un film peut demander un autre format (--k = largeur / hauteur,
   posé par le lecteur d'après film.modes.portrait) — le film d'ÉquaSplat est en 9:16, comme l'écran du téléphone */
.player.portrait .stage{aspect-ratio:var(--k,.75)}
.player.portrait .cadre{width:min(100%, calc((100dvh - var(--reserve,80px)) * var(--k,.75)))}
.player.portrait:fullscreen .cadre,.player.portrait.fs .cadre{width:min(100%, calc((100vh - var(--reserve,80px)) * var(--k,.75)))}
.film-lien{cursor:pointer}
.pill{position:absolute;left:2.5%;top:3.5%;background:#fef3c7;color:#78350f;border:2px solid #f59e0b;border-radius:999px;
  padding:.45em 1em;font:inherit;font-size:clamp(13px,1.6vw,20px);font-size:clamp(8px,1.75cqw,32px);line-height:1.2;text-align:center;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(120,53,15,.18)}
/* En paysage, la bulle tient sur deux lignes et grandit avec le cadre (cqw), pas avec la fenêtre :

@media (max-width:640px){

<script>
/* ===== Moteur : tout l'état de l'image est une fonction du temps t (en secondes).
   On peut donc mettre en pause, revenir en arrière, sauter d'étape sans rien casser. ===== */
const NS='http://www.w3.org/2000/svg';
/* Les films de l'univers SPLAT!, tous sur ce lecteur (10/10/2026) : sans paramètre, le film d'introduction ;
   ?film=equasplat (étape 35), ?film=dessine (étape 2), ?film=deux-taches (étape 4). Chaque film s'inscrit
   ici dans son propre bloc <script>, et le dernier bloc lance celui qui est demandé. */
const FILMS={};
const F={
  E(tag,a,p){const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;},
  clamp:(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  out:x=>1-Math.pow(1-x,3),
  inq:x=>x*x,
  lin:x=>x,
  back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);},
  P(t,a,d,e){return (e||F.io)(F.clamp((t-a)/d));},
  L:(a,b,u)=>a+(b-a)*u,
  /* apparaît à a (durée din), disparaît à b (durée dout) */
  W(t,a,din,b,dout){let v=F.P(t,a,din,F.out);if(b!=null)v=Math.min(v,1-F.P(t,b,dout||.3));return v;},
  /* flèche dont la pointe tombe exactement sur tip */
  arrow(x0,y0,x1,y1,head){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy);if(l<1)return{s:'',h:''};
    const ux=dx/l,uy=dy/l,h=Math.min(head,l*.7),w=h*.55,bx=x1-ux*h,by=y1-uy*h;
    return{s:`M${x0},${y0}L${bx+ux*1.5},${by+uy*1.5}`,h:`M${x1},${y1}L${bx-uy*w},${by+ux*w}L${bx+uy*w},${by-ux*w}Z`};},
  /* point d'une courbe de Bézier quadratique (vol en arc) */
  q(p0,c,p1,u){const a=1-u;return[a*a*p0[0]+2*a*u*c[0]+u*u*p1[0],a*a*p0[1]+2*a*u*c[1]+u*u*p1[1]];},
  op(el,v){el.setAttribute('opacity',v<=0.001?0:v>=0.999?1:v.toFixed(3));el.style.display=v<=0.001?'none':'';},
  /* un texte suivi d'un triangle ▶ DESSINÉ, l'ensemble centré sur (cx,cy). Pas le caractère ▶ : sa largeur et sa place
     changent avec la police de l'appareil (Windows, iPhone), et « Je joue ▶ » sortait du centre de son bouton
     (relevé par Gwenaël le 10/10/2026). Le texte est mesuré, puis recalé quand les polices sont arrivées.
     En hauteur : ce sont les CAPITALES (0,7 em) et le triangle qui sont centrés sur cy, ligne de base à cy + 0,35 em.
     « dominant-baseline:central » centrait la boîte de la police : avec Segoe UI, le texte tombait trop bas (10/10, soir). */
  etiquette(p,cx,cy,fs,texte,fill){const g=F.E('g',{},p);
    const t=F.E('text',{x:cx,y:cy+fs*.35,'font-size':fs,'font-weight':900,fill},g);t.textContent=texte;
    const tri=F.E('path',{fill},g);
    const caler=()=>{let w=0;try{w=t.getComputedTextLength();}catch(e){}
      const h=fs*.7,l=h*.88,ecart=fs*.3,x0=cx-(w+ecart+l)/2,tx=x0+w+ecart;
      t.setAttribute('x',x0.toFixed(2));tri.setAttribute('d',`M${tx.toFixed(2)},${(cy-h/2).toFixed(2)}L${(tx+l).toFixed(2)},${cy}L${tx.toFixed(2)},${(cy+h/2).toFixed(2)}Z`);};
    caler();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(caler);return g;},
  /* les boutons de l'écran de fin, communs aux films. Sur le chemin de l'élève (?suite=) : « Je joue ▶ », et dessous
     « ↺ Revoir le film » (un clic sur le film fini le relance). Ouvert depuis la page Splat, sans ?suite= : c'est le
     prof qui présente, le film ne mène pas au jeu — le gros bouton relance le film, le lien dessous ramène à la
     page Splat (choix de Gwenaël, 11/10/2026). */
  boutonsFin(o,fi){
    if(!PRESENTATION){
      o.jouer=F.E('a',{href:SUITE,class:'film-lien'},o.fin);
      F.E('rect',{x:fi.x-fi.jw/2,y:fi.jy-fi.jh/2,width:fi.jw,height:fi.jh,rx:18,fill:'#16a34a'},o.jouer);
      F.etiquette(o.jouer,fi.x,fi.jy,fi.js,'Je joue','#ffffff');
      o.revoir=F.E('text',{x:fi.x,y:fi.jy+fi.jh/2+fi.ssize*1.7,'text-anchor':'middle','font-size':fi.ssize,'font-weight':700,fill:'#2563eb',class:'film-lien'},o.fin);o.revoir.textContent=fi.revoir||'↺ Revoir le film';
      return;}
    /* pas un lien : le clic tombe sur le film, qui repart du début quand il est fini */
    o.jouer=F.E('g',{class:'film-lien'},o.fin);
    const fond=F.E('rect',{y:fi.jy-fi.jh/2,height:fi.jh,rx:18,fill:'#16a34a'},o.jouer);
    const t=F.E('text',{x:fi.x,y:fi.jy+fi.js*.35,'text-anchor':'middle','font-size':fi.js,'font-weight':900,fill:'#ffffff'},o.jouer);t.textContent=fi.revoir||'↺ Revoir le film';
    /* le bouton prend la largeur du texte (mesurée, puis recalée quand les polices sont arrivées), jamais moins que « Je joue » */
    const caler=()=>{let w=0;try{w=t.getComputedTextLength();}catch(e){}const l=Math.max(fi.jw,w+fi.js*1.6);
      fond.setAttribute('x',(fi.x-l/2).toFixed(2));fond.setAttribute('width',l.toFixed(2));};
    caler();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(caler);
    o.revoir=F.E('a',{href:RETOUR_PAGE,class:'film-lien'},o.fin);
    F.E('text',{x:fi.x,y:fi.jy+fi.jh/2+fi.ssize*1.7,'text-anchor':'middle','font-size':fi.ssize,'font-weight':700,fill:'#2563eb'},o.revoir).textContent='‹ Retour à la page Splat';
  }
};

/* Le son des films (15/10/2026 : film « Avec des paquets de jetons », avec les bruitages courts et doux de la vidéo de
   Gwenaël). Un bruitage sonne quand le film passe son instant en lecture normale, jamais quand on saute d'une étape à
   l'autre. Le navigateur ne laisse sonner qu'après un geste : l'appui sur ▶ (ou sur le film) prépare le son. Un bouton
   « Son » sous le film le coupe ; le choix est gardé sur l'appareil. Un film sans « sons » ne montre pas le bouton. */
const SON=(function(){
  let ctx=null,charge=null,coupe=false;const tampons={};
  try{coupe=localStorage.getItem('mathsgo-films-son')==='0';}catch(e){}
  function preparer(fichiers){
    const A=window.AudioContext||window.webkitAudioContext;if(!A||!fichiers)return;
    if(!ctx){try{ctx=new A();}catch(e){return;}}
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    if(!charge)charge=Promise.all(Object.keys(fichiers).map(nom=>fetch(fichiers[nom]).then(r=>r.arrayBuffer())
      .then(b=>new Promise((ok,ko)=>ctx.decodeAudioData(b,ok,ko))).then(buf=>{tampons[nom]=buf;}).catch(()=>{})));}
  function jouer(nom,gain){if(coupe||!ctx||ctx.state!=='running'||!tampons[nom])return;
    const src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=tampons[nom];g.gain.value=gain;src.connect(g);g.connect(ctx.destination);src.start();}
  return {preparer,jouer,get coupe(){return coupe;},couper(v){coupe=v;try{localStorage.setItem('mathsgo-films-son',v?'0':'1');}catch(e){}}};
})();

function lancerLecteur(film,autre){
  const $=id=>document.getElementById(id);
  const svg=$('svg'),stage=$('stage'),big=$('bigplay'),pill=$('pill'),player=$('player'),fsBtn=$('fs');
  /* deux mises en page : paysage (ordinateur, projection) et portrait (téléphone tenu droit) */
  let mode=null;
  function choisirMode(){if(!film.modes||!film.modes.portrait)return 'paysage';return (innerWidth<700&&innerHeight>innerWidth*1.1)?'portrait':'paysage';}
  function construire(){const m=choisirMode();if(m===mode)return false;mode=m;
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    const dim=film.modes?film.modes[m]:{w:1600,h:900};svg.setAttribute('viewBox',`0 0 ${dim.w} ${dim.h}`);
    if(m==='portrait')player.style.setProperty('--k',(dim.w/dim.h).toFixed(4));
    player.classList.toggle('portrait',m==='portrait');film.build(svg,m);poserCredit();return true;}
  /* le crédit (lot 3b, 08/11/2026, choix de Gwenaël) : sur le carton de titre, sous le sous-titre (« Comment on joue ? »),
     comme le générique d'un film — on le voit sur l'image d'attente, avant ▶, et il ne prend aucune place pendant le
     film. Il suit le sous-titre : il apparaît et part avec lui (copié à chaque image, voir film.render plus bas).
     Le nom reste un lien vers le site de Steve Wyborney (un clic sur un lien ne lance pas le film). */
  let credit=null;
  function poserCredit(){credit=null;
    const o=film.o,sous=o&&o.titreSous;if(!film.credit||!sous)return;
    const m=/^([^<]*)<a href="(https:\/\/[^"]+)"[^>]*>([^<]+)<\/a>([^<]*)$/.exec(film.credit);if(!m)return;
    const fs=+sous.getAttribute('font-size'),k=.8;
    credit=F.E('text',{x:sous.getAttribute('x'),y:(+sous.getAttribute('y')+fs*1.3).toFixed(1),'text-anchor':'middle','font-size':(fs*k).toFixed(1),'font-weight':600,fill:'#64748b'},sous.parentNode);
    credit.appendChild(document.createTextNode(m[1]));
    const a=F.E('a',{href:m[2],target:'_blank',rel:'noopener'},credit);
    F.E('tspan',{fill:'#2563eb','text-decoration':'underline'},a).textContent=m[3];
    if(m[4])credit.appendChild(document.createTextNode(m[4]));}
  function suivreSous(){if(!credit)return;const sous=film.o.titreSous;
    credit.setAttribute('opacity',sous.getAttribute('opacity')||'1');credit.style.display=sous.style.display;}
  const dessiner=film.render.bind(film);film.render=x=>{dessiner(x);suivreSous();};
  if(film.aria)svg.setAttribute('aria-label',film.aria);
  if(film.titre)document.title=film.titre;
  construire();
  if(film.passer&&!PRESENTATION&&!DEPUIS_CARTE){$('passer').href=film.passer;$('passer').hidden=false;if(film.passerTexte)$('passer').textContent=film.passerTexte;
    if(DEPUIS_JEU)$('passer').textContent='Retour au jeu ›';}
  if(!PRESENTATION){$('carte').href=CARTE;$('carte').hidden=false;}
  $('barre').classList.toggle('avecPasser',!$('passer').hidden);
  /* le lien vers l'autre façon de voir (le film ou « À toi de faire »), dans la ligne du haut — pour le prof seulement */
  if(autre){const a=$('autre');a.href=autre.href;a.textContent=autre.txt;a.hidden=false;}
  const D=film.duration,C=film.chapters;
  let t=0,playing=false,last=null,fresh=true,enArret=false;
  /* le film s'arrête toujours aux questions : on cherche, puis on relance (bulle, clic sur le film ou espace) */
  /* « À toi de faire » : le film attend aussi à chaque geste de l'élève (film.attentes) — il ne repart que sur le bon toucher */
  const stops=(film.stops||[]).concat(film.attentes||[]).map(s=>s.t).sort((a,b)=>a-b);
  pill.addEventListener('click',e=>{e.stopPropagation();play();});
  function ci(){let i=0;for(let k=0;k<C.length;k++)if(C[k].t<=t+1e-6)i=k;return i;}
  function ui(){
    pill.hidden=!enArret||!!film.attentes;
    /* le grand ▶ : avant le départ, et quand on a mis en pause en touchant le film (pas aux questions, ni à la fin) */
    big.hidden=playing||enArret||(!fresh&&t>=D-1e-3);
    big.setAttribute('aria-label',fresh?'Lancer le film':'Reprendre le film');
  }
  function setT(nt){t=F.clamp(nt,0,D);film.render(t);}
  function loop(ts){
    if(!playing)return;

    /* l'arrêt suivant : strictement après t (16/10/2026). On repart d'un arrêt avec t égal à lui, exactement : il est donc
       sauté. L'ancien « x > t + 1e-6 » sautait aussi un arrêt quand une image tombait à moins d'un millionième avant lui —
       ce qui arrive souvent quand deux arrêts sont séparés d'un nombre rond d'images (mesuré : 1 attente sur 4 manquée). */
    const ns=stops.find(x=>x>t);if(ns!=null&&nt>=ns){sonner(t,ns);setT(ns);enArret=true;pause();return;}
    if(nt>=D){sonner(t,D);setT(D);pause();return;}
    sonner(t,nt);
    setT(nt);requestAnimationFrame(loop);

  /* les bruitages dont l'instant tombe entre deux images */
  function sonner(a,b){if(film.sons)for(const e of film.sons)if(e.t>a&&e.t<=b)SON.jouer(e.f,e.g);}
  if(film.sons){const b=$('son'),maj=()=>{const c=SON.coupe;b.setAttribute('aria-pressed',String(!c));$('sonTxt').textContent=c?'Son coupé':'Son';
      b.title=c?'Remettre le son':'Couper le son';b.querySelector('.on').style.display=c?'none':'';b.querySelector('.off').style.display=c?'':'none';};
    b.hidden=false;maj();b.addEventListener('click',()=>{SON.couper(!SON.coupe);if(!SON.coupe)SON.preparer(film.fichiersSons);maj();});}
  function play(){if(film.sons&&!SON.coupe)SON.preparer(film.fichiersSons);enArret=false;if(fresh){fresh=false;setT(0);}else if(t>=D-1e-3)setT(0);playing=true;last=null;ui();requestAnimationFrame(loop);}
  function pause(){playing=false;last=null;ui();}
  function toggle(){playing?pause():play();}
  /* flèches du clavier (pour le prof) : étape précédente / suivante */
  function jump(nt){fresh=false;enArret=false;setT(nt);if(!playing)play();else ui();}
  function next(){const nc=C.find(c=>c.t>t+1e-6);jump(nc?nc.t:D);}
  function prev(){const i=ci();jump(t-C[i].t>1.2||i===0?C[i].t:C[i-1].t);}
  big.addEventListener('click',e=>{e.stopPropagation();play();});
  stage.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('a'))return;if(film.attentes){toucher(e);return;}toggle();});
  /* « À toi de faire » : un toucher ne met pas en pause ; à une attente, le film regarde où l'élève a touché */
  function toucher(e){if(playing)return;if(fresh||t>=D-1e-3){play();return;}if(!enArret)return;
    let m=null;try{m=svg.getScreenCTM();}catch(er){}if(!m)return;
    const q=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());if(film.toucher(t,[q.x,q.y]))play();else film.render(t);}
  /* le doigt qui montre où toucher bouge pendant l'attente : on redessine tant qu'il est là */
  if(film.anime){const anim=()=>{if(!playing&&film.anime())film.render(t);requestAnimationFrame(anim);};requestAnimationFrame(anim);}
  /* plein écran (avec repli si le navigateur refuse) ; l'iPhone ne sait pas le faire : on n'affiche pas le lien */
  if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsBtn.hidden=true;
  /* rien d'autre que le plein écran dans la ligne du haut (le prof, sans film « À toi de faire ») : au téléphone, où le
     plein écran n'est pas proposé, la ligne disparaît (CSS) ; partout, si le navigateur ne sait pas le plein écran */
  {const b=$('barre'),vide=['carte','son','autre','passer'].every(id=>$(id).hidden);b.classList.toggle('vide',vide);if(vide&&fsBtn.hidden)b.hidden=true;}
  function fsToggle(){
    const on=document.fullscreenElement||player.classList.contains('fs');
    if(on){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});player.classList.remove('fs');majFs();return;}
    if(player.requestFullscreen){player.requestFullscreen().catch(()=>{player.classList.add('fs');majFs();});}else{player.classList.add('fs');majFs();}
  }
  function majFs(){const on=!!document.fullscreenElement||player.classList.contains('fs');
    $('fsTxt').textContent=on?'Quitter le plein écran':'Plein écran';caleReserve();}
  fsBtn.addEventListener('click',fsToggle);
  document.addEventListener('fullscreenchange',majFs);
  document.addEventListener('keydown',e=>{
    if(e.target&&(e.target.tagName==='BUTTON'||e.target.tagName==='A')&&(e.key===' '||e.key==='Enter'))return;
    /* « À toi de faire » des jetons numérotés (lot 4, 08/11/2026) : à une attente, l'élève tape ses nombres au clavier
       (chiffres, « + », Entrée pour valider une fenêtre) ; film.taper dit si la touche est pour lui (null : non) */
    if(film.taper&&enArret&&!playing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const r=film.taper(t,e.key);
      if(r!=null){e.preventDefault();if(r)play();else film.render(t);return;}}
    /* « À toi de faire » : ni pause ni saut d'étape au clavier — on n'avance qu'en faisant le geste */
    if(film.attentes&&(e.key===' '||e.key==='k'||e.key==='ArrowRight'||e.key==='ArrowLeft'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();toggle();}
    else if(e.key==='ArrowRight'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
    else if(e.key==='f'||e.key==='F'){fsToggle();}
    else if(e.key==='Escape'&&player.classList.contains('fs')){player.classList.remove('fs');majFs();}
  });

  t=film.poster||0;film.render(t);ui();
  /* la place gardée en dehors de l'image : la ligne du haut (avec son trait) et les marges de la page (8 px au téléphone,
     16 ailleurs ; celles du lecteur en plein écran) */
  function caleReserve(){const plein=!!document.fullscreenElement||player.classList.contains('fs'),c=getComputedStyle(plein?player:player.parentNode);
    player.style.setProperty('--reserve',($('barre').offsetHeight+parseFloat(c.paddingTop)+parseFloat(c.paddingBottom)+4)+'px');}
  caleReserve();
  addEventListener('resize',()=>{if(construire())film.render(t);caleReserve();});
  window.__film={seek:x=>{fresh=false;enArret=false;setT(x);ui();},D,etat:()=>({t,playing,enArret}),cible:()=>film.cible?film.cible(t):null};
}
