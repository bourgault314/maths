<script>
/* ===== Moteur : tout l'état de l'image est une fonction du temps t (en secondes).
   On peut donc mettre en pause, revenir en arrière, sauter d'étape sans rien casser. ===== */
const NS='http://www.w3.org/2000/svg';
/* Les films de l'univers SPLAT!, tous sur ce lecteur (10/10/2026) : sans paramètre, le film d'introduction ;
   ?film=equasplat (étape 35), ?film=dessine (étape 2), ?film=deux-taches (étape 4). Chaque film s'inscrit
   ici dans son propre bloc <script>, et le dernier bloc lance celui qui est demandé. */
const FILMS={};
const F={
  E(tag,a,p){const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;},
  clamp:(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  out:x=>1-Math.pow(1-x,3),
  inq:x=>x*x,
  lin:x=>x,
  back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);},
  P(t,a,d,e){return (e||F.io)(F.clamp((t-a)/d));},
  L:(a,b,u)=>a+(b-a)*u,
  /* apparaît à a (durée din), disparaît à b (durée dout) */
  W(t,a,din,b,dout){let v=F.P(t,a,din,F.out);if(b!=null)v=Math.min(v,1-F.P(t,b,dout||.3));return v;},
  /* flèche dont la pointe tombe exactement sur tip */
  arrow(x0,y0,x1,y1,head){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy);if(l<1)return{s:'',h:''};
    const ux=dx/l,uy=dy/l,h=Math.min(head,l*.7),w=h*.55,bx=x1-ux*h,by=y1-uy*h;
    return{s:`M${x0},${y0}L${bx+ux*1.5},${by+uy*1.5}`,h:`M${x1},${y1}L${bx-uy*w},${by+ux*w}L${bx+uy*w},${by-ux*w}Z`};},
  /* point d'une courbe de Bézier quadratique (vol en arc) */
  q(p0,c,p1,u){const a=1-u;return[a*a*p0[0]+2*a*u*c[0]+u*u*p1[0],a*a*p0[1]+2*a*u*c[1]+u*u*p1[1]];},
  op(el,v){el.setAttribute('opacity',v<=0.001?0:v>=0.999?1:v.toFixed(3));el.style.display=v<=0.001?'none':'';},
  /* un texte suivi d'un triangle ▶ DESSINÉ, l'ensemble centré sur (cx,cy). Pas le caractère ▶ : sa largeur et sa place
     changent avec la police de l'appareil (Windows, iPhone), et « Je joue ▶ » sortait du centre de son bouton
     (relevé par Gwenaël le 10/10/2026). Le texte est mesuré, puis recalé quand les polices sont arrivées.
     En hauteur : ce sont les CAPITALES (0,7 em) et le triangle qui sont centrés sur cy, ligne de base à cy + 0,35 em.
     « dominant-baseline:central » centrait la boîte de la police : avec Segoe UI, le texte tombait trop bas (10/10, soir). */
  etiquette(p,cx,cy,fs,texte,fill){const g=F.E('g',{},p);
    const t=F.E('text',{x:cx,y:cy+fs*.35,'font-size':fs,'font-weight':900,fill},g);t.textContent=texte;
    const tri=F.E('path',{fill},g);
    const caler=()=>{let w=0;try{w=t.getComputedTextLength();}catch(e){}
      const h=fs*.7,l=h*.88,ecart=fs*.3,x0=cx-(w+ecart+l)/2,tx=x0+w+ecart;
      t.setAttribute('x',x0.toFixed(2));tri.setAttribute('d',`M${tx.toFixed(2)},${(cy-h/2).toFixed(2)}L${(tx+l).toFixed(2)},${cy}L${tx.toFixed(2)},${(cy+h/2).toFixed(2)}Z`);};
    caler();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(caler);return g;},
  /* les boutons de l'écran de fin, communs aux films. Sur le chemin de l'élève (?suite=) : « Je joue ▶ », et dessous
     « ↺ Revoir le film » (un clic sur le film fini le relance). Ouvert depuis la page Splat, sans ?suite= : c'est le
     prof qui présente, le film ne mène pas au jeu — le gros bouton relance le film, le lien dessous ramène à la
     page Splat (choix de Gwenaël, 11/10/2026). */
  boutonsFin(o,fi){
    if(!PRESENTATION){
      o.jouer=F.E('a',{href:SUITE,class:'film-lien'},o.fin);
      F.E('rect',{x:fi.x-fi.jw/2,y:fi.jy-fi.jh/2,width:fi.jw,height:fi.jh,rx:18,fill:'#16a34a'},o.jouer);
      F.etiquette(o.jouer,fi.x,fi.jy,fi.js,'Je joue','#ffffff');
      o.revoir=F.E('text',{x:fi.x,y:fi.jy+fi.jh/2+fi.ssize*1.7,'text-anchor':'middle','font-size':fi.ssize,'font-weight':700,fill:'#2563eb',class:'film-lien'},o.fin);o.revoir.textContent='↺ Revoir le film';
      return;}
    /* pas un lien : le clic tombe sur le film, qui repart du début quand il est fini */
    o.jouer=F.E('g',{class:'film-lien'},o.fin);
    const fond=F.E('rect',{y:fi.jy-fi.jh/2,height:fi.jh,rx:18,fill:'#16a34a'},o.jouer);
    const t=F.E('text',{x:fi.x,y:fi.jy+fi.js*.35,'text-anchor':'middle','font-size':fi.js,'font-weight':900,fill:'#ffffff'},o.jouer);t.textContent='↺ Revoir le film';
    /* le bouton prend la largeur du texte (mesurée, puis recalée quand les polices sont arrivées), jamais moins que « Je joue » */
    const caler=()=>{let w=0;try{w=t.getComputedTextLength();}catch(e){}const l=Math.max(fi.jw,w+fi.js*1.6);
      fond.setAttribute('x',(fi.x-l/2).toFixed(2));fond.setAttribute('width',l.toFixed(2));};
    caler();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(caler);
    o.revoir=F.E('a',{href:RETOUR_PAGE,class:'film-lien'},o.fin);
    F.E('text',{x:fi.x,y:fi.jy+fi.jh/2+fi.ssize*1.7,'text-anchor':'middle','font-size':fi.ssize,'font-weight':700,fill:'#2563eb'},o.revoir).textContent='‹ Retour à la page Splat';
  }
};

function lancerLecteur(film){
  const $=id=>document.getElementById(id);
  const svg=$('svg'),stage=$('stage'),big=$('bigplay'),pill=$('pill'),player=$('player'),fsBtn=$('fs');
  /* deux mises en page : paysage (ordinateur, projection) et portrait (téléphone tenu droit) */
  let mode=null;
  function choisirMode(){if(!film.modes||!film.modes.portrait)return 'paysage';return (innerWidth<700&&innerHeight>innerWidth*1.1)?'portrait':'paysage';}
  function construire(){const m=choisirMode();if(m===mode)return false;mode=m;
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    const dim=film.modes?film.modes[m]:{w:1600,h:900};svg.setAttribute('viewBox',`0 0 ${dim.w} ${dim.h}`);
    if(m==='portrait')player.style.setProperty('--k',(dim.w/dim.h).toFixed(4));
    player.classList.toggle('portrait',m==='portrait');film.build(svg,m);return true;}
  if(film.aria)svg.setAttribute('aria-label',film.aria);
  if(film.titre)document.title=film.titre;
  construire();
  if(film.passer&&!PRESENTATION){$('passer').href=film.passer;$('passer').hidden=false;if(film.passerTexte)$('passer').textContent=film.passerTexte;}
  if(film.credit){$('credit').innerHTML=film.credit;$('credit').hidden=false;}
  const D=film.duration,C=film.chapters;
  let t=0,playing=false,last=null,fresh=true,enArret=false;
  /* le film s'arrête toujours aux questions : on cherche, puis on relance (bulle, clic sur le film ou espace) */
  const stops=(film.stops||[]).map(s=>s.t);
  pill.addEventListener('click',e=>{e.stopPropagation();play();});
  function ci(){let i=0;for(let k=0;k<C.length;k++)if(C[k].t<=t+1e-6)i=k;return i;}
  function ui(){
    pill.hidden=!enArret;
    /* le grand ▶ : avant le départ, et quand on a mis en pause en touchant le film (pas aux questions, ni à la fin) */
    big.hidden=playing||enArret||(!fresh&&t>=D-1e-3);
    big.setAttribute('aria-label',fresh?'Lancer le film':'Reprendre le film');
  }
  function setT(nt){t=F.clamp(nt,0,D);film.render(t);}
  function loop(ts){
    if(!playing)return;
    if(last==null)last=ts;
    const dt=Math.min(.1,(ts-last)/1000);last=ts;let nt=t+dt;
    const ns=stops.find(x=>x>t+1e-6);if(ns!=null&&nt>=ns){setT(ns);enArret=true;pause();return;}
    if(nt>=D){setT(D);pause();return;}
    setT(nt);requestAnimationFrame(loop);
  }
  function play(){enArret=false;if(fresh){fresh=false;setT(0);}else if(t>=D-1e-3)setT(0);playing=true;last=null;ui();requestAnimationFrame(loop);}
  function pause(){playing=false;last=null;ui();}
  function toggle(){playing?pause():play();}
  /* flèches du clavier (pour le prof) : étape précédente / suivante */
  function jump(nt){fresh=false;enArret=false;setT(nt);if(!playing)play();else ui();}
  function next(){const nc=C.find(c=>c.t>t+1e-6);jump(nc?nc.t:D);}
  function prev(){const i=ci();jump(t-C[i].t>1.2||i===0?C[i].t:C[i-1].t);}
  big.addEventListener('click',e=>{e.stopPropagation();play();});
  stage.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('a'))return;toggle();});
  /* plein écran (avec repli si le navigateur refuse) ; l'iPhone ne sait pas le faire : on n'affiche pas le lien */
  if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsBtn.hidden=true;
  function fsToggle(){
    const on=document.fullscreenElement||player.classList.contains('fs');
    if(on){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});player.classList.remove('fs');majFs();return;}
    if(player.requestFullscreen){player.requestFullscreen().catch(()=>{player.classList.add('fs');majFs();});}else{player.classList.add('fs');majFs();}
  }
  function majFs(){const on=!!document.fullscreenElement||player.classList.contains('fs');
    $('fsTxt').textContent=on?'Quitter le plein écran':'Plein écran';caleReserve();}
  fsBtn.addEventListener('click',fsToggle);
  document.addEventListener('fullscreenchange',majFs);
  document.addEventListener('keydown',e=>{
    if(e.target&&(e.target.tagName==='BUTTON'||e.target.tagName==='A')&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();toggle();}
    else if(e.key==='ArrowRight'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
    else if(e.key==='f'||e.key==='F'){fsToggle();}
    else if(e.key==='Escape'&&player.classList.contains('fs')){player.classList.remove('fs');majFs();}
  });
  /* image d'attente : une image complète, pas un écran vide */
  t=film.poster||0;film.render(t);ui();
  /* la place gardée sous le film suit la hauteur réelle de la ligne du bas (elle passe sur deux lignes sur téléphone) */
  function caleReserve(){player.style.setProperty('--reserve',($('pied').offsetHeight+12+32+4)+'px');}
  caleReserve();
  addEventListener('resize',()=>{if(construire())film.render(t);caleReserve();});
  window.__film={seek:x=>{fresh=false;enArret=false;setT(x);ui();},D,etat:()=>({t,playing,enArret})};
}
</script>
<script>
/* ===== Film SPLAT! (monde 1) : compter, la tache tombe, le schéma se construit, on vérifie =====
   Dessin repris de Petit Splat : jetons bleus r = 8 dans une carte 300 × 200, tache noire
   (forme n° 4 du générateur), case du total en haut à droite, schéma : total noir,
   visibles en bleu, case grise avec la petite tache pour les jetons cachés.
   Deux mises en page du même film : « paysage » (ordinateur, projection) et « portrait »
   (téléphone tenu droit) — seules les positions changent, le déroulé est identique. */
const TACHE='M120,40 C160,10 240,40 230,110 C220,180 140,170 100,160 C60,140 40,80 120,40 Z';
const MINI='M130,50 Q170,20 200,60 Q230,80 210,130 Q180,170 130,160 Q80,150 70,100 Q80,40 130,50 Z';
const T_CX=150,T_CY=108,T_SC=.72,T_ROT=-10;
const CACHES=[[195.4,114.8],[104.5,122.9],[142.9,71.1],[152.4,144.3],[184.2,77.9],[139.8,108.5],[116.5,88.4],[167.1,119.2]];
const VISIBLES=[[71.1,35.0],[259.9,78.7],[23.9,155.0],[269.5,165.0],[33.3,62.6],[117.6,181.0],[65.9,97.8],[71.6,173.3],[150.2,30.6],[211.4,28.9],[211.1,170.3]];
const BLEU='#2563eb',BLEU_BORD='#1e40af',ENCRE='#111827',GRIS='#d4deea',VERT='#dcfce7',VERT_TXT='#15803d',BLEU_TXT='#1d4ed8';

const film={

  stops:[{t:T.arret1},{t:T.arret2},{t:T.arret3}],
  modes:{paysage:{w:1600,h:900},portrait:{w:900,h:1200}},
  passer:SUITE, credit:'Jeu SPLAT! créé par <a href="https://stevewyborney.com" target="_blank" rel="noopener">Steve Wyborney</a>',
  chapters:[{t:0,name:'SPLAT!'},{t:3.3,name:'Compter les jetons'},{t:10.6,name:'La tache tombe'},{t:15.5,name:'Le schéma en barres'},
    {t:23.0,name:'Remplir le schéma'},{t:30.6,name:'Répondre'},{t:32.6,name:'Vérifier sous la tache'},{t:40.0,name:'À toi de jouer'}],
  build(svg,mode){
    const E=F.E, o=this.o={}, Y=this.Y=LAY[mode]||LAY.paysage, S=Y.S;
    S.xd=S.x0+(S.x1-S.x0)*11/19;
    /* ordre de comptage : de gauche à droite pour l'apparition ; en tournant pour les visibles et les cachés */
    const tous=[...VISIBLES.map(p=>({p,vis:true})),...CACHES.map(p=>({p,vis:false}))];
    [...tous].sort((a,b)=>a.p[0]-b.p[0]||a.p[1]-b.p[1]).forEach((j,i)=>j.pop=T.popDebut+i*T.popPas);
    const angle=(p,c)=>{let a=Math.atan2(p[1]-c[1],p[0]-c[0])+Math.PI*0.75;return (a+Math.PI*4)%(Math.PI*2);};
    [...tous].sort((a,b)=>angle(a.p,[150,100])-angle(b.p,[150,100])).forEach((j,i)=>j.compte0=T.compte0+i*T.pas0);
    tous.filter(j=>j.vis).sort((a,b)=>angle(a.p,[150,100])-angle(b.p,[150,100])).forEach((j,i)=>j.compte=T.compteVis+i*T.pasVis);
    tous.filter(j=>!j.vis).sort((a,b)=>angle(a.p,[T_CX,T_CY])-angle(b.p,[T_CX,T_CY])).forEach((j,i)=>j.compte=T.compteCache+i*T.pasCache);
    o.jetons=tous;

    /* --- carte de jeu --- */
    o.carte=E('g',{},svg);
    for(const j of tous)j.c=E('circle',{cx:j.p[0],cy:j.p[1],r:8,fill:BLEU,stroke:BLEU_BORD,'stroke-width':.5},o.carte);
    o.tache=E('g',{},o.carte);E('path',{d:TACHE,fill:ENCRE},o.tache);
    o.gouttes=[];
    for(let k=0;k<9;k++){const a=k/9*Math.PI*2+.35*Math.sin(k*7.3);
      o.gouttes.push({a,dist:20+30*((k*37)%5)/4,r0:5+3*((k*13)%3)/2,el:E('circle',{r:4,fill:ENCRE},o.carte)});}
    /* jeton compté = jeton « allumé » : un anneau doré, jamais de chiffre sur un jeton
       (un chiffre sur un jeton veut dire « ce jeton vaut… » dans les mondes suivants) */
    for(const j of tous)j.anneau=E('circle',{cx:j.p[0],cy:j.p[1],r:11.5,fill:'none',stroke:'#f59e0b','stroke-width':3},o.carte);

    o.badgeTxt=E('text',{x:270,y:28.5,'text-anchor':'middle','dominant-baseline':'central','font-size':23,'font-weight':900,fill:ENCRE},o.badge);

    /* --- schéma en barres --- */
    o.schema=E('g',{},svg);
    const w=S.x1-S.x0,h=S.ym-S.y1;o.w=w;o.h=h;
    o.fTotal=E('rect',{x:S.x0,y:S.y1,width:w,height:h,fill:'#ffffff'},o.schema);
    o.fVis=E('rect',{x:S.x0,y:S.ym,width:S.xd-S.x0,height:h,fill:'#ffffff'},o.schema);
    o.fCache=E('rect',{x:S.xd,y:S.ym,width:S.x1-S.xd,height:h,fill:GRIS},o.schema);
    const ms=34/220;
    o.mini=E('g',{},o.schema);E('path',{d:MINI,fill:ENCRE,opacity:.8},o.mini);
    o.per=2*(w+h*2);
    o.cadre=E('path',{d:`M${S.x0},${S.y1}H${S.x1}V${S.y2}H${S.x0}Z`,fill:'none',stroke:ENCRE,'stroke-width':3,'stroke-dasharray':o.per},o.schema);
    o.milieu=E('path',{d:`M${S.x0},${S.ym}H${S.x1}`,stroke:ENCRE,'stroke-width':3,'stroke-dasharray':w},o.schema);
    o.separe=E('path',{d:`M${S.xd},${S.ym}V${S.y2}`,stroke:ENCRE,'stroke-width':3,'stroke-dasharray':h},o.schema);
    const val=(x,y,c)=>E('text',{x,y:y+2,'text-anchor':'middle','dominant-baseline':'central','font-size':Y.val,'font-weight':900,fill:c},o.schema);
    o.vTotal=val((S.x0+S.x1)/2,(S.y1+S.ym)/2,ENCRE);o.vTotal.textContent='19';
    o.vVis=val((S.x0+S.xd)/2,(S.ym+S.y2)/2,BLEU_TXT);
    o.vQ=val((S.xd+S.x1)/2,(S.ym+S.y2)/2,ENCRE);o.vQ.textContent='?';
    o.v8=val((S.xd+S.x1)/2,(S.ym+S.y2)/2,ENCRE);o.v8.textContent='8';

    /* étiquettes et flèches (les mêmes mots que le diaporama d'introduction) */
    /* « cachés », pas « invisibles » : les jetons sont SOUS la tache, et c'est le mot du jeu et des livrets (choix de Gwenaël, 11/10/2026) */
    const textes=[['#fde68a',ENCRE,'en tout'],[BLEU,'#ffffff','visibles'],['#cbd5e1',ENCRE,'cachés']];
    o.tags=Y.tags.map((d,k)=>{
      const g=E('g',{},o.schema);const r=E('rect',{rx:12,fill:textes[k][0]},g);
      const tx=E('text',{x:d.cx,y:d.cy+Y.tag*.43,'text-anchor':'middle','font-size':Y.tag,'font-weight':600,fill:textes[k][1]},g);
      E('tspan',{},tx).textContent='Le nombre de jetons ';E('tspan',{'font-weight':900},tx).textContent=textes[k][2];
      const fl=E('g',{},o.schema);const fs=E('path',{fill:'none',stroke:'#334155','stroke-width':4,'stroke-linecap':'round'},fl);const fh=E('path',{fill:'#334155'},fl);
      return {g,r,tx,cx:d.cx,cy:d.cy,fs,fh,fl,queue:d.q,pointe:d.p};
    });
    for(const tg of o.tags){const Lg=tg.tx.getComputedTextLength()||400,W=Lg+40,H=Y.tag+20;
      tg.cx=Math.max(16+W/2,Math.min(Y.W-16-W/2,tg.cx));tg.tx.setAttribute('x',tg.cx);
      tg.r.setAttribute('x',tg.cx-W/2);tg.r.setAttribute('y',tg.cy-H/2);tg.r.setAttribute('width',W);tg.r.setAttribute('height',H);}

    /* compteur des jetons cachés : une case grise comme celle du schéma, qui monte à chaque jeton allumé */
    o.compteur=E('g',{},svg);
    E('rect',{x:-48,y:-48,width:96,height:96,rx:10,fill:GRIS,stroke:'#1f2937','stroke-width':2.5},o.compteur);
    E('path',{d:MINI,fill:ENCRE,opacity:.8,transform:`translate(${-48+7-40*ms},${-48+7-10*ms}) scale(${ms})`},o.compteur);
    o.compteurTxt=E('text',{x:4,y:6,'text-anchor':'middle','dominant-baseline':'central','font-size':56,'font-weight':900,fill:ENCRE},o.compteur);

    /* --- mot SPLAT !, sous-titre, titre, carton de fin --- */
    o.mot=E('text',{x:0,y:0,'text-anchor':'middle','dominant-baseline':'central','font-size':Y.mot.size,'font-weight':900,fill:ENCRE,stroke:'#ffffff','stroke-width':14,'paint-order':'stroke','stroke-linejoin':'round','letter-spacing':4},svg);
    o.mot.textContent='SPLAT !';
    o.st=E('text',{x:Y.cap.x,y:Y.cap.y,'text-anchor':'middle','font-size':Y.cap.size,'font-weight':800,fill:'#1e293b'},svg);
    o.stCle=null;
    o.titre=E('g',{},svg);
    const lg=Y.logos;
    E('image',{href:LOGO_IREM,x:lg.xl,y:lg.y,height:lg.h,width:lg.h*360/293},o.titre);
    E('image',{href:LOGO_MG,x:lg.xr-lg.h*420/195,y:lg.y,height:lg.h,width:lg.h*420/195},o.titre);
    o.titreTache=E('g',{},o.titre);E('path',{d:TACHE,fill:ENCRE},o.titreTache);
    o.titreMot=E('text',{x:Y.titre.x,y:Y.titre.my,'text-anchor':'middle','font-size':Y.titre.size,'font-weight':900,fill:ENCRE,'letter-spacing':6},o.titre);o.titreMot.textContent='SPLAT!';
    o.titreSous=E('text',{x:Y.titre.x,y:Y.titre.sy,'text-anchor':'middle','font-size':Y.titre.ssize,'font-weight':700,fill:'#475569'},o.titre);o.titreSous.textContent='Comment on joue ?';
    const fi=Y.fin;
    o.fin=E('g',{},svg);
    E('rect',{x:0,y:0,width:Y.W,height:Y.H,fill:'#ffffff'},o.fin);
    o.finTache=E('g',{},o.fin);E('path',{d:TACHE,fill:ENCRE},o.finTache);
    o.finMot=E('text',{x:fi.x,y:fi.my,'text-anchor':'middle','font-size':fi.size,'font-weight':900,fill:ENCRE},o.fin);o.finMot.textContent='À toi de jouer !';
    o.finSous=E('g',{},o.fin);
    fi.lignes.forEach((l,k)=>{E('text',{x:fi.x,y:fi.sy+k*fi.ssize*1.35,'text-anchor':'middle','font-size':fi.ssize,'font-weight':600,fill:'#475569'},o.finSous).textContent=l;});
    /* « Je joue ▶ » ou, présenté depuis la page Splat, « ↺ Revoir le film » : voir F.boutonsFin */
    F.boutonsFin(o,fi);
  },
  /* sous-titre : une ligne, ou deux si la phrase est trop longue pour la largeur */
  legende(txt){
    const o=this.o,Y=this.Y;if(o.stCle===txt)return;o.stCle=txt;
    while(o.st.firstChild)o.st.removeChild(o.st.firstChild);
    o.st.setAttribute('font-size',Y.cap.size);
    const l1=F.E('tspan',{x:Y.cap.x,y:Y.cap.y},o.st);l1.textContent=txt;
    if(!txt||!Y.cap.gap||o.st.getComputedTextLength()<=Y.cap.max)return;
    const mots=txt.split(' ');let best=1,ecart=1e9;
    for(let k=1;k<mots.length;k++){const d=Math.abs(mots.slice(0,k).join(' ').length-mots.slice(k).join(' ').length);if(d<ecart){ecart=d;best=k;}}
    l1.textContent=mots.slice(0,best).join(' ');
    F.E('tspan',{x:Y.cap.x,y:Y.cap.y+Y.cap.gap},o.st).textContent=mots.slice(best).join(' ');
  },
  render(t){
    const o=this.o,Y=this.Y,S=Y.S,P=F.P,L=F.L,op=F.op;
    /* titre */
    const tOut=1-P(t,2.9,.4);
    op(o.titre,tOut);
    if(tOut>0){
      const fall=P(t,.3,.42,F.inq),v=P(t,.72,.45,F.lin),imp=fall>=1?1:0;
      const sx=1+.15*(1-v)*Math.cos(v*Math.PI*2)*imp,sy=1-.13*(1-v)*Math.cos(v*Math.PI*2)*imp;
      o.titreTache.setAttribute('transform',`translate(${Y.titre.x},${L(-200,Y.titre.ty,fall)}) scale(${sx},${sy}) scale(1.05) translate(-145,-97)`);
      op(o.titreTache,t<.3?0:1);
      const m=P(t,.85,.4,F.back);op(o.titreMot,P(t,.85,.15,F.lin));
      const cy=Y.titre.my-Y.titre.size*.35;
      o.titreMot.setAttribute('transform',`translate(${Y.titre.x},${cy}) scale(${L(.4,1,m)}) translate(${-Y.titre.x},${-cy})`);
      op(o.titreSous,P(t,1.4,.4,F.out));
    }
    /* carte : apparition, puis réduction pour laisser la place au schéma */
    op(o.carte,P(t,3.2,.3,F.lin));
    const r=P(t,T.reduire,.9);
    const bx=L(Y.c1.x,Y.c2.x,r),by=L(Y.c1.y,Y.c2.y,r),bs=L(Y.c1.s,Y.c2.s,r);
    o.carte.setAttribute('transform',`translate(${bx},${by}) scale(${bs})`);
    let n0=0;
    for(const j of o.jetons){
      const u=F.clamp((t-j.pop)/.35);if(t>=j.compte0)n0++;
      /* un jeton compté s'allume (premier comptage : les 19 ; second : visibles, puis cachés) */
      const saut=d=>t>=d?.25*Math.sin(Math.PI*F.clamp((t-d)/.3)):0;
      j.c.setAttribute('r',(8*F.back(u)*(1+saut(j.compte0)+saut(j.compte))).toFixed(2));j.c.style.display=u<=0?'none':'';
      const eteint=j.vis?T.question:T.valide+.6;
      const l0=t>=j.compte0?1-F.clamp((t-T.finCompte0)/.5):0, l1=t>=j.compte?1-F.clamp((t-eteint)/.5):0;
      const dep=l1>0?j.compte:j.compte0,a=F.clamp((t-dep)/.35);
      op(j.anneau,Math.max(l0,l1));j.anneau.setAttribute('r',L(18,11.5,F.out(a)).toFixed(2));
    }
    /* case du total */
    op(o.badge,P(t,3.8,.3,F.lin));
    const pulse=1+.12*Math.sin(Math.PI*F.clamp((t-9.6)/.45))+.12*Math.sin(Math.PI*F.clamp((t-T.vol19)/.45));
    o.badge.setAttribute('transform',`translate(270,28) scale(${pulse}) translate(-270,-28)`);
    o.badgeTxt.textContent=n0>0?String(n0):'';
    /* la tache tombe */
    const fall=P(t,T.chute,T.impact-T.chute,F.inq);
    const v=P(t,T.impact,.45,F.lin),imp=t>=T.impact?1:0;
    const sx=1+.15*(1-v)*Math.cos(v*Math.PI*2)*imp,sy=1-.13*(1-v)*Math.cos(v*Math.PI*2)*imp;
    o.tache.setAttribute('transform',`translate(${T_CX},${T_CY+L(-240,0,fall)}) scale(${sx},${sy}) scale(${T_SC}) rotate(${T_ROT}) translate(-150,-100)`);
    op(o.tache,t<T.chute?0:L(1,.15,P(t,T.eclaircir,1)));
    const g=P(t,T.impact,.6,F.out);
    for(const d of o.gouttes){
      const k=.82+d.dist/50*g;d.el.setAttribute('cx',149+Math.cos(d.a)*59*k);d.el.setAttribute('cy',106+Math.sin(d.a)*51*k);
      d.el.setAttribute('r',Math.max(0,d.r0*(1-g)));op(d.el,t>=T.impact&&g<1?1:0);
    }
    /* mot SPLAT ! */
    op(o.mot,F.W(t,T.impact,.12,12.5,.4));
    const mp=P(t,T.impact,.35,F.back),shake=t>T.impact&&t<T.impact+.5?Math.sin((t-T.impact)*60)*4*(1-(t-T.impact)/.5):0;
    o.mot.setAttribute('transform',`translate(${Y.mot.x+shake},${Y.mot.y}) rotate(-5) scale(${L(.3,1,mp)})`);
    /* sous-titres */
    let i=-1;for(let k=0;k<SOUS_TITRES.length;k++)if(SOUS_TITRES[k][0]<=t)i=k;
    if(i<0){op(o.st,0);}else{
      const cur=SOUS_TITRES[i],nx=SOUS_TITRES[i+1];this.legende(cur[1]);
      let a=P(t,cur[0],.3,F.out);if(nx)a=Math.min(a,1-P(t,nx[0]-.22,.22,F.lin));op(o.st,a);
    }
    /* schéma : le cadre se dessine, puis la ligne du milieu, puis la séparation */
    const sc=P(t,T.cadre,.9,F.io);
    o.cadre.setAttribute('stroke-dashoffset',(o.per*(1-sc)).toFixed(1));op(o.cadre,t>=T.cadre?1:0);
    const sm=P(t,T.milieu,.4,F.io);o.milieu.setAttribute('stroke-dashoffset',(o.w*(1-sm)).toFixed(1));op(o.milieu,t>=T.milieu?1:0);
    const sd=P(t,T.separe,.3,F.io);o.separe.setAttribute('stroke-dashoffset',(o.h*(1-sd)).toFixed(1));op(o.separe,t>=T.separe?1:0);
    const vg=P(t,T.valide,.5,F.io);
    o.fTotal.setAttribute('fill',melange('#ffffff',VERT,vg));o.fVis.setAttribute('fill',melange('#ffffff',VERT,vg));
    o.fCache.setAttribute('fill',melange(GRIS,VERT,vg));
    op(o.fTotal,P(t,T.cadre+.4,.4,F.lin));op(o.fVis,P(t,T.cadre+.4,.4,F.lin));
    op(o.fCache,P(t,T.grise,.4,F.lin));
    const mt=P(t,T.grise+.15,.35,F.back),ms=34/220;op(o.mini,P(t,T.grise+.15,.1,F.lin));
    o.mini.setAttribute('transform',`translate(${S.xd+8+110*ms},${S.ym+7+90*ms}) scale(${L(.2,1,mt)}) translate(${-110*ms},${-90*ms}) scale(${ms}) translate(-40,-10)`);
    /* étiquettes */
    const debuts=[T.tagTotal,T.tagVis,T.tagCache];
    o.tags.forEach((tg,k)=>{
      const a=debuts[k],pp=P(t,a,.35,F.back);
      op(tg.g,P(t,a,.15,F.lin));
