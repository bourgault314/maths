   Lecteur de film : une scène 16:9 sur papier blanc (comme les applis du site),
   et une barre de commandes sobre en dessous. Le papier reste blanc dans les deux thèmes. */
:root{
  --page:#e3e9f1;
  --surface:#ffffff;
  --ink:#14213a;
  --muted:#55657f;
  --line:#c6d1df;
  --accent:#2563eb;
  --accent-ink:#ffffff;
  --rail:#cfd8e4;
  --paper:#ffffff;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--ui)}
.page{min-height:100%;box-sizing:border-box;padding-block:16px;padding-inline:16px;display:flex;align-items:center;justify-content:center}
.player{width:100%;max-width:1440px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{position:relative;width:min(100%, calc((100dvh - 132px) * 1.7778));min-width:min(100%,320px);aspect-ratio:16/9;max-width:100%;
  background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.08),0 14px 40px rgba(15,23,42,.12);cursor:pointer}
.stage svg{display:block;width:100%;height:100%;font-family:var(--ui)}
.bigplay{position:absolute;right:3%;bottom:5%;width:88px;height:88px;border-radius:50%;border:none;
  background:rgba(37,99,235,.92);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(37,99,235,.35)}
.bigplay svg{width:40px;height:40px;margin-left:6px}
.bigplay:focus-visible{outline:4px solid #93c5fd;outline-offset:4px}
.bar{width:min(100%, calc((100dvh - 132px) * 1.7778));min-width:min(100%,320px);max-width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.ctl svg{width:20px;height:20px}
.ctl.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctl:hover{border-color:var(--accent)}
.ctl:focus-visible,.track:focus-visible,.step input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.track{position:relative;flex:1 1 220px;min-width:0;height:44px;cursor:pointer;touch-action:none}
.rail{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--rail);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent)}
.tick{position:absolute;top:50%;width:2px;height:14px;margin-top:-7px;background:var(--muted);opacity:.55;border-radius:1px}
.knob{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.chap{font-size:14px;font-weight:700;color:var(--ink);min-width:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.chap b{color:var(--muted);font-weight:700;margin-right:6px}
.step{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;min-height:44px}
.step input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.player.fs{position:fixed;inset:0;z-index:10;max-width:none;background:var(--page);justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.player:fullscreen{max-width:none;background:var(--page);justify-content:center;padding:12px 16px;box-sizing:border-box}
.player:fullscreen .stage,.player:fullscreen .bar,.player.fs .stage,.player.fs .bar{width:min(100%, calc((100vh - 84px) * 1.7778))}
.player.portrait .stage{aspect-ratio:3/4;width:min(100%, calc((100dvh - 190px) * .75))}
.player.portrait .bar{width:100%}
.player.portrait:fullscreen .stage,.player.portrait.fs .stage{width:min(100%, calc((100vh - 170px) * .75))}
.player.portrait:fullscreen .bar,.player.portrait.fs .bar{width:100%}
.passer{font-size:14px;font-weight:800;color:var(--accent);text-decoration:none;padding:12px 6px;white-space:nowrap;margin-left:auto}
.credit{font-size:12px;color:var(--muted);text-align:center}
.credit a{color:var(--accent)}
.film-lien{cursor:pointer}
.pill{position:absolute;left:2.5%;top:3.5%;background:#fef3c7;color:#78350f;border:2px solid #f59e0b;border-radius:999px;
  padding:.45em 1em;font:inherit;font-size:clamp(13px,1.6vw,20px);font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(120,53,15,.18)}
.pill:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.player.portrait .pill{left:50%;top:auto;bottom:2%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(13px,3.6vw,17px)}
.ctl.main.attente{animation:respire 1.4s ease-in-out infinite}
@keyframes respire{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ctl.main.attente{animation:none}}
@media (max-width:640px){
  .track{order:-1;flex-basis:100%}
  .chap{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
  .bigplay{width:56px;height:56px}
  .bigplay svg{width:24px;height:24px;margin-left:4px}
}

<script>
/* ===== Moteur : tout l'état de l'image est une fonction du temps t (en secondes).
   On peut donc mettre en pause, revenir en arrière, sauter d'étape sans rien casser. ===== */
const NS='http://www.w3.org/2000/svg';
const F={
  E(tag,a,p){const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;},
  clamp:(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  out:x=>1-Math.pow(1-x,3),
  inq:x=>x*x,
  lin:x=>x,
  back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);},
  P(t,a,d,e){return (e||F.io)(F.clamp((t-a)/d));},
  L:(a,b,u)=>a+(b-a)*u,
  /* apparaît à a (durée din), disparaît à b (durée dout) */
  W(t,a,din,b,dout){let v=F.P(t,a,din,F.out);if(b!=null)v=Math.min(v,1-F.P(t,b,dout||.3));return v;},
  /* flèche dont la pointe tombe exactement sur tip */
  arrow(x0,y0,x1,y1,head){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy);if(l<1)return{s:'',h:''};
    const ux=dx/l,uy=dy/l,h=Math.min(head,l*.7),w=h*.55,bx=x1-ux*h,by=y1-uy*h;
    return{s:`M${x0},${y0}L${bx+ux*1.5},${by+uy*1.5}`,h:`M${x1},${y1}L${bx-uy*w},${by+ux*w}L${bx+uy*w},${by-ux*w}Z`};},
  /* point d'une courbe de Bézier quadratique (vol en arc) */
  q(p0,c,p1,u){const a=1-u;return[a*a*p0[0]+2*a*u*c[0]+u*u*p1[0],a*a*p0[1]+2*a*u*c[1]+u*u*p1[1]];},
  op(el,v){el.setAttribute('opacity',v<=0.001?0:v>=0.999?1:v.toFixed(3));el.style.display=v<=0.001?'none':'';}
};
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>';
const ICON_REPLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5v4.6h4.6"/></svg>';

function lancerLecteur(film){
  const $=id=>document.getElementById(id);
  const svg=$('svg'),stage=$('stage'),big=$('bigplay'),playBtn=$('play'),fill=$('fill'),knob=$('knob'),
        track=$('track'),chap=$('chap'),stepBox=$('stepMode'),player=$('player');
  /* deux mises en page : paysage (ordinateur, projection) et portrait (téléphone tenu droit) */
  let mode=null;
  function choisirMode(){if(!film.modes||!film.modes.portrait)return 'paysage';return (innerWidth<700&&innerHeight>innerWidth*1.1)?'portrait':'paysage';}
  function construire(){const m=choisirMode();if(m===mode)return false;mode=m;
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    const dim=film.modes?film.modes[m]:{w:1600,h:900};svg.setAttribute('viewBox',`0 0 ${dim.w} ${dim.h}`);
    player.classList.toggle('portrait',m==='portrait');film.build(svg,m);return true;}
  construire();
  if(film.passer){$('passer').href=film.passer;$('passer').hidden=false;}
  if(film.credit){$('credit').innerHTML=film.credit;$('credit').hidden=false;}
  const D=film.duration,C=film.chapters;
  let t=0,playing=false,last=null,fresh=true,lastIcon='';
  C.forEach((c,i)=>{if(i===0)return;const k=document.createElement('div');k.className='tick';k.style.left=(c.t/D*100)+'%';$('ticks').appendChild(k);});
  /* arrêts aux questions (cochés par défaut) : le film s'arrête, on cherche, on relance */
  const stops=(film.stops||[]).map(s=>s.t);
  if(stops.length){$('stepLabel').hidden=false;try{const v=localStorage.getItem('film-arrets');if(v!==null)stepBox.checked=v==='1';}catch(e){}}
  stepBox.addEventListener('change',()=>{try{localStorage.setItem('film-arrets',stepBox.checked?'1':'0');}catch(e){}});
  const pill=$('pill');let enArret=false;
  function arret(on){enArret=on;pill.hidden=!on;playBtn.classList.toggle('attente',on);}
  pill.addEventListener('click',e=>{e.stopPropagation();play();});
  function ci(){let i=0;for(let k=0;k<C.length;k++)if(C[k].t<=t+1e-6)i=k;return i;}
  function ui(){
    const pc=fresh?0:t/D*100;fill.style.width=pc+'%';knob.style.left=pc+'%';track.setAttribute('aria-valuenow',Math.round(pc));
    const i=fresh?0:ci();chap.innerHTML=`<b>${i+1}/${C.length}</b>${C[i].name}`;
    const icon=playing?'pause':(t>=D-1e-3?'replay':'play');
    if(icon!==lastIcon){playBtn.innerHTML=icon==='pause'?ICON_PAUSE:icon==='replay'?ICON_REPLAY:ICON_PLAY;
      playBtn.setAttribute('aria-label',icon==='pause'?'Pause':icon==='replay'?'Revoir le film':'Lecture');lastIcon=icon;}
  }
  function setT(nt){t=F.clamp(nt,0,D);film.render(t);ui();}
  function loop(ts){
    if(!playing)return;
    if(last==null)last=ts;
    const dt=Math.min(.1,(ts-last)/1000);last=ts;let nt=t+dt;
    if(stepBox.checked&&stops.length){const ns=stops.find(x=>x>t+1e-6);if(ns!=null&&nt>=ns){setT(ns);pause();arret(true);return;}}
    if(nt>=D){setT(D);pause();return;}
    setT(nt);requestAnimationFrame(loop);
  }
  function play(){arret(false);if(fresh){fresh=false;setT(0);}else if(t>=D-1e-3)setT(0);big.hidden=true;playing=true;last=null;ui();requestAnimationFrame(loop);}
  function pause(){playing=false;last=null;ui();}
  function toggle(){playing?pause():play();}
  function jump(nt){fresh=false;arret(false);big.hidden=true;setT(nt);if(!playing)play();}
  function next(){const nc=C.find(c=>c.t>t+1e-6);jump(nc?nc.t:D);}
  function prev(){const i=ci();jump(t-C[i].t>1.2||i===0?C[i].t:C[i-1].t);}
  big.addEventListener('click',e=>{e.stopPropagation();play();});
  stage.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('a'))return;toggle();});
  playBtn.addEventListener('click',toggle);
  $('next').addEventListener('click',next);
  $('prev').addEventListener('click',prev);
  /* barre de temps : clic ou glisser */
  let wasPlaying=false,dragging=false;
  function seekX(x){const r=track.getBoundingClientRect();fresh=false;arret(false);big.hidden=true;setT((x-r.left)/r.width*D);}
  track.addEventListener('pointerdown',e=>{dragging=true;wasPlaying=playing;pause();track.setPointerCapture(e.pointerId);seekX(e.clientX);});
  track.addEventListener('pointermove',e=>{if(dragging)seekX(e.clientX);});
  const endDrag=()=>{if(!dragging)return;dragging=false;if(wasPlaying)play();};
  track.addEventListener('pointerup',endDrag);track.addEventListener('pointercancel',endDrag);
  track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();jump(Math.min(D,t+2));}
    if(e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();jump(Math.max(0,t-2));}});
  /* plein écran (avec repli si le navigateur refuse) */
  function fsToggle(){
    const on=document.fullscreenElement||player.classList.contains('fs');
    if(on){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});player.classList.remove('fs');return;}
    if(player.requestFullscreen){player.requestFullscreen().catch(()=>player.classList.add('fs'));}else player.classList.add('fs');
  }
  $('fs').addEventListener('click',fsToggle);
  document.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT')return;
    if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(e.key===' '||e.key==='k'){e.preventDefault();toggle();}
    else if(e.key==='ArrowRight'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
    else if(e.key==='f'||e.key==='F'){fsToggle();}
    else if(e.key==='Escape'&&player.classList.contains('fs'))player.classList.remove('fs');
  });
  /* image d'attente : une image complète, pas un écran vide */
  t=film.poster||0;film.render(t);ui();
  addEventListener('resize',()=>{if(construire())film.render(t);});
  window.__film={seek:x=>{fresh=false;big.hidden=true;setT(x);},D};
}
</script>
<script>
/* ===== Film SPLAT! (monde 1) : compter, la tache tombe, le schéma se construit, on vérifie =====
   Dessin repris de Petit Splat : jetons bleus r = 8 dans une carte 300 × 200, tache noire
   (forme n° 4 du générateur), case du total en haut à droite, schéma : total noir,
   visibles en bleu, case grise avec la petite tache pour les jetons cachés.
   Deux mises en page du même film : « paysage » (ordinateur, projection) et « portrait »
   (téléphone tenu droit) — seules les positions changent, le déroulé est identique. */
const TACHE='M120,40 C160,10 240,40 230,110 C220,180 140,170 100,160 C60,140 40,80 120,40 Z';
const MINI='M130,50 Q170,20 200,60 Q230,80 210,130 Q180,170 130,160 Q80,150 70,100 Q80,40 130,50 Z';
const T_CX=150,T_CY=108,T_SC=.72,T_ROT=-10;

const VISIBLES=[[71.1,35.0],[259.9,78.7],[23.9,155.0],[269.5,165.0],[33.3,62.6],[117.6,181.0],[65.9,97.8],[71.6,173.3],[150.2,30.6],[211.4,28.9],[211.1,170.3]];
const BLEU='#2563eb',BLEU_BORD='#1e40af',ENCRE='#111827',GRIS='#d4deea',VERT='#dcfce7',VERT_TXT='#15803d',BLEU_TXT='#1d4ed8';
/* adresses des logos et de la suite : remplacées à la fabrication de la page */
const LOGO_IREM='/assets/img/logos/irem/logo-print.png', LOGO_MG='/assets/img/logos/mathsgo/logo-print.png';
const SUITE=(()=>{try{const d=new URLSearchParams(location.search).get('suite')||'';return /^\/[^\/]/.test(d)?d:'/outils/splat_univers.html';}catch(e){return '/outils/splat_univers.html';}})();

const LAY={
  paysage:{W:1600,H:900,cap:{x:800,y:92,size:40,max:1520,gap:0},
    c1:{x:410,y:165,s:2.6},c2:{x:522.5,y:112,s:1.85},
    S:{x0:400,x1:1200,y1:570,ym:660,y2:750},val:54,tag:27,
    tags:[{cx:800,cy:512,q:[800,537],p:[800,568]},{cx:420,cy:826,q:[520,803],p:[612,753]},{cx:1240,cy:826,q:[1140,803],p:[1048,753]}],

    c1:{x:22.5,y:270,s:2.85},c2:{x:90,y:150,s:2.4},
    S:{x0:60,x1:840,y1:715,ym:810,y2:905},val:52,tag:28,
    tags:[{cx:450,cy:668,q:[450,693],p:[450,713]},{cx:260,cy:962,q:[330,939],p:[294,909]},{cx:630,cy:1040,q:[660,1017],p:[676,909]}],
    mot:{x:450,y:200,size:120},
    titre:{x:450,ty:420,my:760,size:150,sy:840,ssize:40},
    fin:{x:450,ty:380,my:640,size:80,sy:720,ssize:34,lignes:['Compte les jetons, remplis le schéma,','puis vérifie sous la tache.'],jy:890,jw:340,jh:96,js:46},
    cpt:{x:775,y:655,c:[790,760]},
    logos:{h:120,y:30,xl:30,xr:870}}
};

/* temps du film (secondes) */
const T={
  popDebut:3.6, popPas:.04, arret1:4.8, compte0:5.0, pas0:.22, finCompte0:10.0, arret2:13.8, arret3:29.4,
  chute:10.8, impact:11.25,
  reduire:15.5,
  cadre:16.6, milieu:17.5, separe:17.9, grise:18.2,

    const f=P(t,T.fin,.5,F.lin);op(o.fin,f);
    if(f>0){
      const fi=Y.fin,fp=P(t,T.fin+.4,.45,F.back),my=fi.my-fi.size*.35;
      o.finTache.setAttribute('transform',`translate(${fi.x},${fi.ty}) scale(${L(.2,.62,fp)}) translate(-145,-97)`);
      o.finMot.setAttribute('transform',`translate(${fi.x},${my}) scale(${L(.6,1,fp)}) translate(${-fi.x},${-my})`);
      op(o.finSous,P(t,T.fin+.9,.4,F.out));
      const jp=P(t,T.fin+1.4,.4,F.back);op(o.jouer,P(t,T.fin+1.4,.15,F.lin));
      o.jouer.setAttribute('transform',`translate(${fi.x},${fi.jy}) scale(${L(.5,1,jp)}) translate(${-fi.x},${-fi.jy})`);
    }
  }
};
lancerLecteur(film);
</script>
