function getSplatSvg(item, drawDots, hideVisibleDotsUntilReveal = false, forceHiddenDots = false) {
    const W = 300, H = 200;
    const defaultPathData = SPLAT_SHAPES[item.splatShape % SPLAT_SHAPES.length];
    
    let svg = `<svg class="splat-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
    
    if ((isTBI || forceHiddenDots) && item.hiddenDots && item.hiddenDots.length > 0) {
        const hiddenClass = (isTBI && forceHiddenDots && !document.body.classList.contains('print-only')) ? ' class="solution-dot"' : '';
        for(let p of item.hiddenDots) {
             const dotFill = p.color || '#2563eb';
             svg += `<circle${hiddenClass} cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${dotFill}" stroke="#1e40af" stroke-width="0.5"/>`;
        }
    }

    if (drawDots && item.visible > 0) {
        const dotClass = hideVisibleDotsUntilReveal ? ' class="solution-dot"' : '';
        for(let p of item.dots.arr) {
             svg += `<circle${dotClass} cx="${p.x}" cy="${p.y}" r="${item.dots.r}" fill="#2563eb" stroke="#1e40af" stroke-width="0.5"/>`;
        }
    }
    
    for(let s of item.splats) {
        const splatFill = s.color || getComputedStyle(document.documentElement).getPropertyValue('--splat').trim();
        const shapeIndex = s.pathIndex !== undefined ? s.pathIndex : item.splatShape;
        const pathData = SPLAT_SHAPES[shapeIndex % SPLAT_SHAPES.length] || defaultPathData;
        svg += `<g transform="translate(${s.cx}, ${s.cy}) scale(${s.scale}) rotate(${s.rot}) translate(-150, -100)">`;
        svg += `<path class="splat-path" d="${pathData}" fill="${splatFill}" filter="drop-shadow(3px 3px 2px rgba(0,0,0,0.3))" />`;
        svg += `</g>`;
    }

    svg += `</svg>`;
    return svg;
}

/* ===== Espace sous le schéma : la « table de dessin » (relecture du monde 1, lot 4, 26/09/2026) =====
   Option « Espace sous le schéma » (fiche imprimée, Petit Splat classique) : une bande vide
   de 7,5 mm sous chaque schéma, pour écrire un calcul intermédiaire (« … à diviser en deux »).
   Gwenaël : « surtout pas imposer l'accolade… j'ai juste besoin d'un peu d'espace en dessous ».
   La bande est prise sur la zone du dessin, qui devient plus basse et beaucoup plus large que
   le dessin 300 x 200. Plutôt que de réduire l'image (essai refusé au lot 2 : les jetons se
   tassaient à gauche), on REDESSINE la carte dans une vue 450 x 200 :
   - le TIRAGE ne change pas : createItem consomme le hasard exactement comme avant, les
     nombres (total, visibles, cachés) de chaque carte restent ceux du jeu en ligne et du QR ;
   - la table de dessin ci-dessous place ensuite taches et jetons SANS AUCUN TIRAGE : elle part
     de la place tirée de chaque jeton, étalée sur toute la largeur, ne le pousse (spirale
     déterministe) que s'il touche une tache, un autre jeton, le bord ou le cadre du total,
     puis aère pas à pas les jetons trop serrés ;
   - taches et jetons gardent leur taille imprimée d'avant la bande : c'est l'espace vide
     entre eux qui diminue, pas les objets. Même dessin à l'écran quand l'adresse porte
     espace=1 (QR des fiches 4 et 5 du livret, voir eleveDessinBande).
   Même principe que le Splat classique (leçon du 19/09/2026 : les places consomment le même
   hasard que les valeurs, toute retouche d'apparence passe par une table de dessin). */
const BANDE_VUE_L = { '3x4': 450, '2x4': 690 };  /* largeur de la vue selon la grille (hauteur 200) ; 3x3 : dessin d'origine */
const BANDE_ECHELLE_JETON = 1.30;              /* 8 → 10,4 unités : le jeton garde sa taille imprimée */
const BANDE_ECHELLE_TACHE = 1.30;              /* la tache aussi garde sa taille imprimée */
const BANDE_CADRE = 84;                        /* cadre du total : x > L − 84 et y < 84 (unités de la vue) */

function bandeActive() {
    const c = document.getElementById('espaceSchema');
    return !!(c && c.checked) && !isTBI && !isEleve && getProblemType() === 'classic';
}

/* Contours des taches en polygones (M, Q, C, Z), pour mesurer sans canvas ni hasard. */
let bandePolygonesCache = null;
function bandePolygones() {
    if (bandePolygonesCache) return bandePolygonesCache;
    bandePolygonesCache = SPLAT_SHAPES.map(d => {
        const t = d.match(/[MQCZ]|-?\d+(?:\.\d+)?/g);
        const pts = [];
        let i = 0, cmd = '', x = 0, y = 0;
        const n = () => Number(t[i++]);
        while (i < t.length) {
            if (/[MQCZ]/.test(t[i])) cmd = t[i++];
            if (cmd === 'M') { x = n(); y = n(); pts.push([x, y]); }
            else if (cmd === 'Q') {
                const [ax, ay, bx, by] = [n(), n(), n(), n()];
                for (let k = 1; k <= 16; k++) { const u = k / 16, v = 1 - u; pts.push([v*v*x + 2*v*u*ax + u*u*bx, v*v*y + 2*v*u*ay + u*u*by]); }
                x = bx; y = by;
            } else if (cmd === 'C') {
                const [ax, ay, bx, by, cx, cy] = [n(), n(), n(), n(), n(), n()];
                for (let k = 1; k <= 20; k++) { const u = k / 20, v = 1 - u; pts.push([v*v*v*x + 3*v*v*u*ax + 3*v*u*u*bx + u*u*u*cx, v*v*v*y + 3*v*v*u*ay + 3*v*u*u*by + u*u*u*cy]); }
                x = cx; y = cy;
            } else if (cmd === 'Z') { /* fermé */ }
            else i++;
        }
        return pts;
    });
    return bandePolygonesCache;
}

/* Rayon du cercle qui contient chaque forme (unités locales, autour de 150,100) : un point
   plus loin que ce cercle ne peut pas être plus près de la tache que (distance − rayon). */
function bandeRayonForme(shape) {
    const poly = bandePolygones()[shape % SPLAT_SHAPES.length];
    if (!poly.rayon) poly.rayon = Math.max(...poly.map(([x, y]) => Math.hypot(x - 150, y - 100)));
    return poly.rayon;
}

/* Distance (unités de la vue) du point au bord d'une tache ; négative à l'intérieur. */
function bandeDistanceTache(s, shape, px, py) {
    const poly = bandePolygones()[shape % SPLAT_SHAPES.length];
    const rad = -s.rot * Math.PI / 180;
    const dx = (px - s.cx) / s.scale, dy = (py - s.cy) / s.scale;
    const lx = dx * Math.cos(rad) - dy * Math.sin(rad) + 150;
    const ly = dx * Math.sin(rad) + dy * Math.cos(rad) + 100;
    let dedans = false, d2 = Infinity;
    for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
        const [xa, ya] = poly[a], [xb, yb] = poly[b];
        if ((ya > ly) !== (yb > ly) && lx < (xb - xa) * (ly - ya) / (yb - ya) + xa) dedans = !dedans;
        const ex = xb - xa, ey = yb - ya, l2 = ex * ex + ey * ey;
        const u = l2 ? Math.max(0, Math.min(1, ((lx - xa) * ex + (ly - ya) * ey) / l2)) : 0;
        const qx = xa + u * ex - lx, qy = ya + u * ey - ly;
        d2 = Math.min(d2, qx * qx + qy * qy);
    }
    const d = Math.sqrt(d2) * s.scale;
    return dedans ? -d : d;
}

/* Les taches, un peu plus grandes, doivent rester dans la hauteur (200) et bien séparées.
   On mesure leur hauteur réelle (forme et rotation comprises). Sur deux rangées (4 à 6
   taches), les rangées se répartissent la hauteur : autant de blanc au-dessus, entre elles
   et au-dessous. Si deux taches restaient à moins de 12 unités
   (1,6 mm), toutes rapetissent un peu (3 % à la fois, 12 fois au plus). */
function bandeCadrerTaches(splats, shapeOf) {
    const MARGE = 5, ECART = 12;
    const contour = s => {
        const rad = s.rot * Math.PI / 180, c = Math.cos(rad), si = Math.sin(rad);
        return bandePolygones()[shapeOf(s) % SPLAT_SHAPES.length].filter((_, i) => i % 2 === 0).map(([px, py]) => {
            const x = (px - 150) * s.scale, y = (py - 100) * s.scale;
            return [s.cx + x * c - y * si, s.cy + x * si + y * c];
        });
    };
    const ecartMin = () => {
        let m = Infinity;
        for (let i = 0; i < splats.length; i++) for (let j = i + 1; j < splats.length; j++)
            for (const [x, y] of contour(splats[i])) m = Math.min(m, bandeDistanceTache(splats[j], shapeOf(splats[j]), x, y));
        return m;
    };
    const lignes = [...new Set(splats.map(s => s.cy))].sort((u, v) => u - v);
    const y0 = lignes[0], y1 = lignes[lignes.length - 1];
    for (let essai = 0; essai <= 12; essai++) {
        const demi = s => { const ys = contour(s).map(p => p[1] - s.cy); return [Math.min(...ys), Math.max(...ys)]; };
        if (lignes.length > 1) {
            const h = Math.max(...splats.map(s => Math.max(-demi(s)[0], demi(s)[1])));
            const d = Math.max(0, h + (200 - 4 * h) / 6);   /* marge haute = écart entre rangées = marge basse */
            splats.forEach(s => { s.cy = 100 - d + (s.ly - y0) * 2 * d / (y1 - y0); });
        }
        let dy = 0;
        const bas = Math.max(...splats.map(s => s.cy + demi(s)[1])), haut = Math.min(...splats.map(s => s.cy + demi(s)[0]));
        if (bas > 200 - MARGE) dy = 200 - MARGE - bas;
        if (haut + dy < MARGE) dy = MARGE - haut;
        splats.forEach(s => { s.cy += dy; });
        if (bas - haut <= 200 - 2 * MARGE && (splats.length < 2 || ecartMin() >= ECART)) break;
        splats.forEach(s => { s.scale *= 0.97; });
    }
}

/* Étalement horizontal : la zone tirée 15…285 de l'ancien dessin couvre 15…L−15. */
function bandeEtaleX(x, L) { return 15 + (x - 15) * (L - 30) / 270; }

function tableDeDessinBande(item, L) {
    const kT = BANDE_ECHELLE_JETON, kS = BANDE_ECHELLE_TACHE;
    const splats = item.splats.map(s => ({ ...s, cx: bandeEtaleX(s.cx, L), ly: s.cy, scale: s.scale * kS }));
    const shapeOf = s => (s.pathIndex !== undefined ? s.pathIndex : item.splatShape);
    bandeCadrerTaches(splats, shapeOf);
    const r = (item.dots && item.dots.r ? item.dots.r : ((item.maxTargetContext > 50) ? 5 : 8)) * kT;

    /* jetons cachés (dessinés seulement quand on les montre) : ils suivent leur tache */
    const hiddenDots = (item.hiddenDots || []).map((p, i) => {
        const k = Math.min(item.splats.length - 1, Math.floor(i / Math.max(1, item.hiddenPerSplat || 1)));
        const a = item.splats[k], b = splats[k];
        return { ...p, x: b.cx + (p.x - a.cx) * kS, y: b.cy + (p.y - a.cy) * kS, r: p.r * kS };
    });

    /* exigences, en rayons de jeton, du plus confortable au strict minimum */
    const PALIERS = [
        { jeton: 1.0, tache: 0.8, bord: 0.4, cadre: 0.8 },
        { jeton: 0.6, tache: 0.5, bord: 0.3, cadre: 0.5 },
        { jeton: 0.3, tache: 0.3, bord: 0.2, cadre: 0.3 },
        { jeton: 0.1, tache: 0.1, bord: 0.1, cadre: 0.1 }
    ];
    const placed = [];
    const libre = (x, y, e) => {
        if (x < r * (1 + e.bord) || x > L - r * (1 + e.bord) || y < r * (1 + e.bord) || y > 200 - r * (1 + e.bord)) return false;
        if (x > L - BANDE_CADRE - r * (1 + e.cadre) && y < BANDE_CADRE + r * (1 + e.cadre)) return false;
        for (const p of placed) if (Math.hypot(x - p.x, y - p.y) < r * (2 + e.jeton)) return false;
        for (const s of splats) {
            if (Math.hypot(x - s.cx, y - s.cy) - bandeRayonForme(shapeOf(s)) * s.scale >= r * (1 + e.tache)) continue;
            if (bandeDistanceTache(s, shapeOf(s), x, y) < r * (1 + e.tache)) return false;
        }
        return true;
    };
    const arr = [];
    for (const p of (item.dots && item.dots.arr) || []) {
        const x0 = bandeEtaleX(p.x, L), y0 = p.y;
        let pos = null;
        for (const e of PALIERS) {
            if (libre(x0, y0, e)) { pos = { x: x0, y: y0 }; break; }
            for (let rayon = 2; rayon <= 260 && !pos; rayon += 2) {
                const n = Math.max(12, Math.round(rayon * 1.2));
                for (let k = 0; k < n; k++) {
                    const t = 2 * Math.PI * k / n;
                    const x = x0 + rayon * Math.cos(t), y = y0 + rayon * Math.sin(t);
                    if (libre(x, y, e)) { pos = { x, y }; break; }
                }
            }
            if (pos) break;
        }
        if (!pos) pos = { x: x0, y: y0 };      /* jamais atteint sur les tirages mesurés */
        placed.push(pos); arr.push(pos);
    }

    /* Puis on AÈRE : un jeton à l'étroit (moins de 2 rayons de blanc autour de lui) glisse pas
       à pas vers plus de place, tant que ça l'éloigne de ce qui le serre. Toujours sans hasard.
       Le blanc est compté en rayons : jeton 1, tache 0,8, cadre du total 0,8, bord 0,4 (le
       bord gêne moins qu'un voisin). Le plus petit blanc de la carte ne peut que grandir. */
    const blanc = (i, x, y) => {
        let b = Math.min((x - r) / (0.4 * r), (L - x - r) / (0.4 * r), (y - r) / (0.4 * r), (200 - y - r) / (0.4 * r));
        const cx = Math.max(0, (L - BANDE_CADRE) - x), cy = Math.max(0, y - BANDE_CADRE);
        b = Math.min(b, (Math.hypot(cx, cy) - r) / (0.8 * r));
        arr.forEach((p, j) => { if (j !== i) b = Math.min(b, (Math.hypot(x - p.x, y - p.y) - 2 * r) / r); });
        for (const s of splats) {
            /* tache trop loin pour faire baisser le blanc : on ne la mesure pas en détail */
            if ((Math.hypot(x - s.cx, y - s.cy) - bandeRayonForme(shapeOf(s)) * s.scale - r) / (0.8 * r) >= b) continue;
            b = Math.min(b, (bandeDistanceTache(s, shapeOf(s), x, y) - r) / (0.8 * r));
        }
        return b;
    };
    const DIRECTIONS = Array.from({ length: 12 }, (_, k) => [Math.cos(k * Math.PI / 6), Math.sin(k * Math.PI / 6)]);
    for (let tour = 0; tour < 25; tour++) {
        let bouge = false;
        arr.forEach((p, i) => {
            let b = blanc(i, p.x, p.y);
            if (b >= 2) return;
            for (const pas of [8, 4, 2]) {
                let meilleur = null;
                for (const [ux, uy] of DIRECTIONS) {
                    const v = blanc(i, p.x + pas * ux, p.y + pas * uy);
                    if (v > b + 0.02) { b = v; meilleur = [p.x + pas * ux, p.y + pas * uy]; }
                }
                if (meilleur) { p.x = meilleur[0]; p.y = meilleur[1]; bouge = true; break; }
            }
        });
        if (!bouge) break;
    }
    arr.forEach(p => { p.x = Math.round(p.x * 10) / 10; p.y = Math.round(p.y * 10) / 10; });
    return { L, splats, dots: { arr, r }, hiddenDots };
}

function getSplatSvgBande(item, drawDots, forceHiddenDots = false, largeur = null) {
    const L = largeur || BANDE_VUE_L[document.getElementById('gridSize').value];
    if (!L) return getSplatSvg(item, drawDots);   /* 9 cases : la case reste assez haute, dessin d'origine */
    if (!item.dessinBande || item.dessinBande.L !== L) item.dessinBande = tableDeDessinBande(item, L);
    const d = item.dessinBande;
    const vue = { ...item, splats: d.splats, dots: d.dots, hiddenDots: d.hiddenDots };
    return getSplatSvg(vue, drawDots, false, forceHiddenDots)
        .replace('viewBox="0 0 300 200"', `viewBox="0 0 ${L} 200" data-vbw="${L}"`)
        .replace('class="splat-svg"', 'class="splat-svg splat-svg-bande"');
}

/* Le QR des fiches 4 et 5 du livret porte espace=1 (lot 4, 26/09/2026, décision de Gwenaël :
   « même image par le QR ») : l'élève qui rejoue ses cartes en ligne retrouve EXACTEMENT le
   dessin de sa feuille (mêmes taches, jetons aux mêmes endroits). Seulement pour les cartes
   « complète le schéma » : sur une carte « dessine », l'élève pose lui-même ses jetons dans
   l'ancien dessin. Sans espace=1 (carte des mondes, générateur), l'écran ne change pas. */
function eleveDessinBande(item) {
    const c = document.getElementById('espaceSchema');
    return !!(c && c.checked) && getProblemType() === 'classic' && item.mode === 'find_hidden';
}

/* ===== Parcours élève : l'élève remplit le schéma, la page valide =====
   Réservé au « Petit Splat classique » pour l'instant. La réussite d'une série
   est mémorisée dans le navigateur (clé partagée avec la carte des mondes)
   quand l'adresse porte ?parcours=identifiant. */
/* Lot 2 « outils + carte » du suivi (08/10/2026) : le parcours s'écrit par le moteur partagé
   (assets/js/splat-parcours.js), au format que garde le serveur, dans la case de l'élève à code
   (son code est dans l'onglet, jamais dans l'adresse) ou dans la case sans code d'aujourd'hui ;
   « la meilleure série gagne ». assets/js/splat-suivi.js crée le client au premier besoin, met
   la pastille « ● Léa » dans la barre du haut et pose la garde. Sans ces fichiers, le jeu reste
   jouable : rien n'est enregistré. */
let eleveSuiviObjet;
function eleveSuivi() {
    if (eleveSuiviObjet === undefined) {
        eleveSuiviObjet = null;
        if (parcoursId && window.MathsGoSplatSuivi) {
            eleveSuiviObjet = window.MathsGoSplatSuivi.creer({ surRepere: () => eleveSuiviObjet && eleveSuiviObjet.majPastilles() });
            if (eleveSuiviObjet) eleveSuiviObjet.lancer();
        }
    }
    return eleveSuiviObjet;
}
function eleveSuiviPastilleHtml() { const s = eleveSuivi(); return s ? s.pastilleHtml() : ''; }
/* l'étape telle que la case la garde À CET INSTANT ({fait, etoiles, cartes, vues, essais, date,
   idx?, enCours?}), ou null */
function eleveEtapeLue() {
    const s = eleveSuivi(), p = s ? s.lire() : null;
    return p && p.etapes[parcoursId] ? p.etapes[parcoursId] : null;
}
/* à la reprise : les réponses montrées de la série en cours — celles encore rouges, ou ce que
   la case en a gardé (une étape pas encore étoilée garde le compte, rouges rejouées comprises) */
function eleveVuesReprise(etape, res) {
    const rouges = res.filter(r => r === 'ko').length;
    return etape && !etape.fait ? Math.max(rouges, Number(etape.vues) || 0) : rouges;
}

function eleveEnregistrerReussite(sansFaute, total) {
    if (!parcoursId || !total || eleveSerieNotee) return;
    eleveSerieNotee = true;
    const s = eleveSuivi();
    /* l'étoile ; la sauvegarde « en cours » disparaît. Une série moins bonne que celle déjà
       gardée (plus de réponses vues, moins de cartes du premier coup) ne la remplace pas. */
    if (s) s.ecrire((P, p) => P.enregistrerSerie(p, parcoursId, { fait: true, etoiles: sansFaute, cartes: total, vues: eleveVues }));
}

const ELEVE_MINI_TACHE = '<svg class="miniTache" viewBox="40 10 220 180" aria-hidden="true"><path d="' + SPLAT_SHAPES[0] + '" fill="#111827"/></svg>';

/* Comme sur les fiches imprimées : une case à remplir est une case VIDE, sans
   « ? » ni autre indice (décision du 18/09/2026). */
function eleveCaseInput(attendu, flexGrow, minW, fSize, fond, isTop, avecTache) {
    const cls = isTop ? 'row-top' : 'part-box';
    const style = isTop
        ? `font-size: ${fSize};`
        : `flex-grow: ${flexGrow}; flex-basis: 0; background: ${fond}; min-width: ${minW}; font-size: ${fSize};`;
    return `<div class="${cls} eleve-case${avecTache ? ' avec-tache' : ''}${(!isTop && !avecTache) ? ' eleve-vis' : ''}" style="${style}" data-attendu="${attendu}">` +
           (avecTache ? ELEVE_MINI_TACHE : '') +
           `<input class="eleve-input" type="text" inputmode="numeric" maxlength="3" autocomplete="off"></div>`;
}

function eleveDansUneTache(item, x, y, r) {
    try {
        const canvas = document.createElement('canvas');
        canvas.width = 300; canvas.height = 200;
        const ctx = canvas.getContext('2d');
        const marge = Number(r) > 0 ? Number(r) : 0;
        for (const s of item.splats) {
            const shapeIndex = s.pathIndex !== undefined ? s.pathIndex : item.splatShape;
            const path = new Path2D(SPLAT_SHAPES[shapeIndex % SPLAT_SHAPES.length]);
            const rad = -s.rot * Math.PI / 180;
            const dx = (x - s.cx) / s.scale, dy = (y - s.cy) / s.scale;
            const lx = dx * Math.cos(rad) - dy * Math.sin(rad) + 150;
            const ly = dx * Math.sin(rad) + dy * Math.cos(rad) + 100;
            if (ctx.isPointInPath(path, lx, ly)) return true;
            /* le jeton ne doit pas MORDRE sur la tache : le contour compte aussi */
            if (marge > 0) {
                ctx.lineWidth = 2 * marge / s.scale;
                if (ctx.isPointInStroke(path, lx, ly)) return true;
            }
        }
    } catch (e) { /* sans canvas, on ne bloque pas le jeu */ }
    return false;
}

function eleveRayonJeton(item) {
    return (item.dots && item.dots.r) ? item.dots.r : ((item.maxTargetContext > 50) ? 5 : 8);
}

function eleveRedessinerJetons(svg, r) {
    svg.querySelectorAll('.eleve-jeton').forEach(c => c.remove());
    for (const j of eleveJetonsPoses) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', j.x); c.setAttribute('cy', j.y); c.setAttribute('r', r);
        c.setAttribute('fill', '#2563eb'); c.setAttribute('stroke', '#1e40af'); c.setAttribute('stroke-width', '0.5');
        c.classList.add('eleve-jeton');
        svg.appendChild(c);
    }
}

/* Zone de pose. Le dessin garde ses 300x200 : on ELARGIT seulement la vue
   (viewBox a origine negative) pour que l'eleve puisse poser sur toute la
   largeur du tableau. Les jetons gardent leur taille, le contenu reste centre,
   et la regle devient la meme au telephone et a l'ordinateur. */
function eleveElargirScene(scene) {
    const part = scene.querySelector('.part-splat');
    const svg = part && part.querySelector('svg.eleve-dessin');
    if (!part || !svg) return;
    const elargir = () => {
        const rs = svg.getBoundingClientRect();
        const diag = scene.querySelector('.diagram-container');
        const largeurTableau = diag ? diag.getBoundingClientRect().width : 0;
        let vbW = 300, vbX = 0;
        if (rs.height > 0) {
            const large = largeurTableau > 0 ? Math.min(rs.width, largeurTableau) : rs.width;
            vbW = Math.max(300, Math.round(large * 200 / rs.height));
            vbX = -Math.round((vbW - 300) / 2);
        }
        svg.setAttribute('viewBox', vbX + ' 0 ' + vbW + ' 200');
        svg.dataset.vbx = String(vbX); svg.dataset.vbw = String(vbW);
        /* la vue peut aussi RÉTRÉCIR (fenêtre réduite, tablette tournée) : un jeton
           déjà posé dans la marge revient dedans, au lieu de sortir du dessin tout
           en restant compté — l'élève verrait moins de jetons qu'il n'en a posés */
        const r = eleveItemCourant ? eleveRayonJeton(eleveItemCourant) : 8;
        const marge = r + 4;
        let bouge = false;
        for (const j of eleveJetonsPoses) {
            const x = Math.min(Math.max(j.x, vbX + marge), vbX + vbW - marge);
            if (x !== j.x) { j.x = x; bouge = true; }
        }
        if (bouge) eleveRedessinerJetons(svg, r);
        /* le badge TOTAL se cale sur la zone dessinée : le reposer après CHAQUE
           élargissement, sinon il reste calé sur la largeur précédente */
        eleveCalerBadge(scene);
    };
    elargir();
    requestAnimationFrame(elargir);
    if (!eleveElargirScene._lie) {
        eleveElargirScene._lie = true;
        window.addEventListener('resize', () => { const sc = document.querySelector('.eleve-scene'); if (sc) eleveElargirScene(sc); });
    }
}

/* Le jeton ne doit pas non plus mordre sur la petite case TOTAL, posee par-dessus
   le plateau : on compare en pixels, rayon du jeton compris. */
function eleveSousLeBadge(scene, svg, clientX, clientY, r) {
    const badge = scene.querySelector('.part-splat .total-badge');
    if (!badge) return false;
    const rs = svg.getBoundingClientRect();
    if (!rs.height) return false;
    const b = badge.getBoundingClientRect();
    const k = rs.height / 200; /* pixels par unite de dessin */
    const m = r * k;
    return clientX >= b.left - m && clientX <= b.right + m && clientY >= b.top - m && clientY <= b.bottom + m;
}

function eleveBrancherDessin(scene, item) {
    const svg = scene.querySelector('.part-splat svg.splat-svg');
    if (!svg) return;
    svg.classList.add('eleve-dessin');
    const r = eleveRayonJeton(item);
    svg.addEventListener('pointerdown', ev => {
        const bouton = document.getElementById('eleveValider');
        if (!bouton || bouton.disabled) return;
        ev.preventDefault();
        const pt = svg.createSVGPoint();
        pt.x = ev.clientX; pt.y = ev.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        const vbX = Number(svg.dataset.vbx || 0), vbW = Number(svg.dataset.vbw || 300);
        const marge = r + 4;
        if (p.x < vbX + marge || p.x > vbX + vbW - marge || p.y < marge || p.y > 200 - marge) return;
        const deja = eleveJetonsPoses.findIndex(j => Math.hypot(j.x - p.x, j.y - p.y) <= r * 1.8);
        const msg = document.getElementById('eleveMsg');
        if (deja >= 0) {
            eleveJetonsPoses.splice(deja, 1);
        } else if (eleveSousLeBadge(scene, svg, ev.clientX, ev.clientY, r)) {
            return;
        } else if (eleveDansUneTache(item, p.x, p.y, r)) {
            /* deux refus différents : le clic est SUR la tache, ou seulement assez près
               pour que le disque du jeton la morde. Sans la distinction, l'élève qui
               clique à côté s'entend dire qu'il a cliqué sur une tache. */
            const surLaTache = eleveDansUneTache(item, p.x, p.y);
            if (msg) {
                msg.textContent = surLaTache
                    ? 'Sous une tache, on ne voit pas les jetons !'
                    : 'Trop près : le jeton toucherait la tache !';
                msg.className = 'eleve-msg rate';
            }
            return;
        } else {
            eleveJetonsPoses.push({ x: p.x, y: p.y });
            if (msg && msg.textContent) { msg.textContent = ''; msg.className = 'eleve-msg'; }
        }
        eleveRedessinerJetons(svg, r);
    });
}

/* Une pastille par carte : verte = du premier coup, orange = après correction,
   rouge = réponse montrée (à rejouer), grise = faite (ancienne reprise sans
   détail), contour bleu = en cours. L'étoile récompense l'étape entière sur
   la carte des mondes, et ne s'allume que sans carte rouge. */
function elevePastilleClasse(r) { return r === true ? ' ok' : (r === false ? ' retry' : (r === 'ko' ? ' ko' : ' fait')); }
function elevePastillesHtml() {
    let out = '';
    for (let i = 0; i < eleveSerie.length; i++) {
        let cls = 'p';
        if (i < eleveResultats.length && eleveResultats[i] != null) cls += elevePastilleClasse(eleveResultats[i]);
        else if (i < eleveResultats.length) cls += ' fait';
        if (i === eleveIdx && eleveIdx < eleveSerie.length) cls += ' cur';
        out += `<i class="${cls}"></i>`;
    }
    const faites = Math.min(eleveResultats.length, eleveSerie.length);
    return `<span class="eleve-pastilles" role="img" aria-label="${faites} carte${faites > 1 ? 's' : ''} faite${faites > 1 ? 's' : ''} sur ${eleveSerie.length}">${out}</span>`;
}

/* ===== Pavé de chiffres : téléphone et tablette =====
   Sur un appareil tactile, toucher une case ouvrait le clavier du système :
   la zone visible tombait de moitié et iOS faisait défiler la page vers la
   case touchée — le plateau sautait à chaque case. Le pavé dessiné dans la
   page (assets/js/mathsgo-pave-chiffres.js) le remplace : les champs n'ouvrent
   plus rien, la case active est tenue par le script, et la carte est dessinée
   dans la place qui reste au-dessus du pavé. Sur ordinateur (pointer: fine),
   aucune de ces fonctions ne fait quoi que ce soit. */
let elevePave = null, elevePaveZone = 0, elevePaveLargeur = 0, elevePaveSerre = false;
/* Le plateau rend les pixels qui manquent pour que la carte tienne, mais
   jamais au point qu'on ne puisse plus y poser un jeton. Une réserve reste
   libre sous la carte : c'est là que vient une seconde ligne de message
   (après une validation fausse) — elle doit rester au-dessus du pavé. */
const ELEVE_PLATEAU_MIN = 150, ELEVE_RESERVE = 26, ELEVE_PAVE_JEU = 10;

/* Téléphone au pavé (tactile ET moins de 600 px de large) : la consigne de
   « Pose les jetons » tient en deux lignes au lieu de trois — mesuré de 360 à
   430 px en Segoe UI, Arial et Verdana — et la ligne gagnée revient au
   plateau, là où l'élève pose ses jetons. Tablette et ordinateur gardent le
   texte complet ; aucune autre consigne ne change. */
function eleveConsigneJetons() {
    const telephone = !!(window.MathsGoPaveChiffres && window.MathsGoPaveChiffres.estTactile()
        && window.matchMedia && window.matchMedia('(max-width: 599px)').matches);
    return telephone
        ? 'Pose les jetons, complète le schéma, puis Valider.'
        : 'Pose les jetons sur la carte (touche pour poser, retouche pour enlever), complète le schéma, puis Valider.';
}

function elevePaveObtenir() {
    if (elevePave) return elevePave;
    if (!window.MathsGoPaveChiffres || !window.MathsGoPaveChiffres.estTactile()) return null;
    elevePave = window.MathsGoPaveChiffres.creer({
        surValider: () => { eleveValider(document.getElementById('mainArea')); elevePaveSynchroniser(); }
    });
    if (!elevePave) return null;
    /* une action de la carte (Valider, Voir la réponse, Carte suivante) peut
       éteindre ou rallumer la saisie : le pavé se remet à jour après le clic,
       quand les gestionnaires de la carte ont fini leur travail */
    const main = document.getElementById('mainArea');
    if (main) main.addEventListener('click', () => elevePaveSynchroniser());
    /* Appareil tourné seulement. Une variation de HAUTEUR (barre d'adresse
       d'un navigateur mobile) ne refait pas la place : la carte ne doit pas
       bouger sous les doigts de l'élève. */
    window.addEventListener('resize', () => {
        if (!elevePave || !elevePave.visible()) return;
        if (Math.abs((window.innerWidth || 0) - elevePaveLargeur) < 1) return;
        elevePaveMesurer();
        const scene = document.querySelector('.eleve-scene');
        if (!scene) return;
        /* un téléphone couché dépasse 600 px : la consigne complète revient */
        const consigne = scene.querySelector('.eleve-consigne');
        if (consigne && eleveItemCourant && eleveItemCourant.mode === 'construct') consigne.textContent = eleveConsigneJetons();
        elevePaveCalerCarte(scene);
        /* enchaînés explicitement : tous deux se calent sur la taille du plateau */
        if (eleveItemCourant && eleveItemCourant.mode === 'construct') eleveElargirScene(scene);
        eleveCalerBadge(scene);
    });
    return elevePave;
}

/* La place au-dessus du pavé : hauteur de la fenêtre visible moins hauteur du
   pavé, calculée UNE FOIS — à l'ouverture, puis seulement si la largeur change. */
function elevePaveMesurer() {
    if (!elevePave) return;
    if (elevePaveZone > 0 && Math.abs((window.innerWidth || 0) - elevePaveLargeur) < 1) return;
    const hauteur = elevePave.hauteur();
    document.body.style.setProperty('--pave-h', hauteur + 'px');
    elevePaveZone = Math.max(0, (window.innerHeight || 0) - hauteur);
    elevePaveLargeur = window.innerWidth || 0;
    elevePaveSerre = elevePaveZone > 0 && elevePaveZone < 700;
}

/* La carte tient dans cette place : si elle est trop haute, le plateau rend
   les pixels qui manquent. Mesuré une seule fois par carte, avant que l'élève
   touche quoi que ce soit ; tout ce qui grandit ensuite (message, bouton
   « Voir la réponse ») est SOUS le plateau, qui ne bouge donc plus. */
function elevePaveCalerCarte(scene) {
    const part = scene && scene.querySelector('.part-splat');
    const main = document.getElementById('mainArea');
    if (!part || !main || !elevePaveZone) return;
    part.style.flexBasis = '';
    part.style.minHeight = '';
    const dispo = elevePaveZone - main.getBoundingClientRect().top
        - (parseFloat(getComputedStyle(main).paddingTop) || 0) - ELEVE_PAVE_JEU;
    const plateau = part.getBoundingClientRect().height;
    const besoin = scene.getBoundingClientRect().height + ELEVE_RESERVE;
    if (!plateau || besoin <= dispo) return;
    const cible = Math.max(ELEVE_PLATEAU_MIN, Math.round(plateau - (besoin - dispo)));
    if (cible >= plateau) return;
    part.style.flexBasis = cible + 'px';
    part.style.minHeight = cible + 'px'; /* le CSS en impose 200 */
}

/* Le pavé n'est là que s'il y a une case à remplir : il s'efface dès que la
   correction s'affiche, à la fin de la série et hors du parcours élève. La
   PLACE qu'il occupe reste réservée tant qu'une carte est à l'écran — sans
   quoi la carte remonterait au moment de la correction. */
function elevePaveSynchroniser() {
    if (!elevePave) return;
    const carte = !!document.querySelector('.eleve-scene .eleve-input');
    const bouton = document.getElementById('eleveValider');
    if (carte && bouton && !bouton.disabled) elevePave.afficher();
    else elevePave.masquer();
    /* Les deux classes vont ensemble et suivent la PLACE, pas l'affichage du
       pavé : les marges d'une carte ne doivent pas changer au moment où le
       pavé s'efface, sinon la carte remonterait sous les yeux de l'élève. */
    const place = !!(isEleve && carte);
    document.body.classList.toggle('eleve-pave', place);
    document.body.classList.toggle('eleve-pave-serre', place && elevePaveSerre);
}

/* Appelé à chaque carte : branche les cases, affiche le pavé, cale la carte et
   rend active la première case vide — sans jamais donner le focus à un champ. */
function elevePaveActiver(scene) {
    const pave = elevePaveObtenir();
    if (!pave || !isEleve || !scene) return null;
    const champs = scene.querySelectorAll('.eleve-input');
    if (!champs.length) return null;
    document.body.classList.add('eleve-pave');
    pave.brancher(champs, {
        zone: champ => champ.closest('.eleve-case'),
        /* case rouge (validation fausse) : le premier chiffre remplace le nombre
           faux ; la page retire le rouge à la saisie, la suite s'ajoute */
        aRemplacer: champ => { const c = champ.closest('.eleve-case'); return !!(c && c.classList.contains('eleve-ko')); }
    });
    pave.afficher();
    elevePaveMesurer();
    document.body.classList.toggle('eleve-pave-serre', elevePaveSerre);
    elevePaveCalerCarte(scene); /* les marges serrées d'abord, la mesure ensuite */
    pave.activerPremierVide();
    return pave;
}

function renderEleve(main) {
    main.innerHTML = '';
    elevePaveSynchroniser(); /* plus de carte à l'écran : le pavé s'efface, puis revient avec elle */
    if (getProblemType() !== 'classic') {
        main.innerHTML = '<div class="eleve-scene"><p class="eleve-consigne">Le parcours élève n\u2019existe pas encore pour les enquêtes et relations.<br>Choisis «\u00a0Petit Splat classique\u00a0» pour y jouer dès maintenant.</p></div>';
        return;
    }
    if (eleveIdx === 0 && eleveSerie.length === 0) {
        /* La série suit la fiche : toutes les cartes de la mise en page
           (12 en 3×4, 9 en 3×3…), dans le même ordre. */
        eleveSerie = state.slice();
        eleveOriginaux = eleveSerie.slice(); eleveJumelleRang = []; eleveJumellesPretes = []; /* cartes jumelles : voir eleveJumelle */
        eleveEtoiles = 0; eleveResultats = []; eleveVues = 0; eleveSerieNotee = false;
        /* série interrompue la dernière fois ? on reprend où on en était */
        if (eleveSerie.length && !eleveRepriseFaite && parcoursId) {
            eleveRepriseFaite = true;
            try {
                /* répare les entrées écrites par l'ancien bug : « réussi » sans aucune carte */
                const ancienne = eleveEtapeLue();
                if (ancienne && ancienne.fait && !ancienne.cartes) {
                    eleveSuivi().ecrire((P, p) => { delete p.etapes[parcoursId]; return p; });
                }
                const entree = eleveEtapeLue(); /* la case de l'élève, par le moteur (lot 2 du suivi) */
                /* la reprise ne vaut que pour la série qui l'a écrite : même adresse
                   ?parcours=, mais des cartes différentes d'un livret à l'autre */
                /* idx = nombre de cartes : série finie avec des cartes rouges, retour sur
                   « Encore N cartes ! » (02/10/2026) */
                if (entree && entree.enCours && entree.enCours.sig === eleveSignatureSerie() &&
                    Number.isInteger(entree.enCours.idx) &&
                    entree.enCours.idx > 0 && (entree.enCours.idx < eleveSerie.length ||
                        (entree.enCours.idx === eleveSerie.length && Array.isArray(entree.enCours.res) && entree.enCours.res.includes('ko')))) {
                    eleveIdx = entree.enCours.idx;
                    eleveEtoiles = Number(entree.enCours.etoiles) || 0;
                    /* reprise : cartes faites sans le détail par carte */
                    /* reprise : le détail par carte est mémorisé, sinon pastilles grises */
                    const res = Array.isArray(entree.enCours.res) ? entree.enCours.res : [];
                    eleveResultats = Array.from({ length: eleveIdx }, (_, i) => (res[i] === true || res[i] === false || res[i] === 'ko') ? res[i] : null);
                    eleveVues = eleveVuesReprise(entree, eleveResultats);
                }
            } catch (e) { /* stockage indisponible */ }
        }
    }
    if (!eleveSerie.length) { return; } /* pas encore de cartes générées */
    if (eleveIdx >= eleveSerie.length) { renderEleveFin(main); return; }

    const item = eleveSerie[eleveIdx];
    eleveCarteFautee = false;
    eleveEchecs = 0;
    const scene = document.createElement('div');
    scene.className = 'eleve-scene';

    /* « ● Léa » au bout de la barre, sous un code (lot 2 du suivi) */
    let html = `<div class="eleve-tete">${eleveLienAideHtml() ? eleveLienMondesHtml('eleve-mondes avec-aide') + eleveLienAideHtml() : eleveLienMondesHtml()}<span><span class="mot">Carte </span>${eleveIdx + 1} / ${eleveSerie.length}</span>` +
               `${elevePastillesHtml()}${eleveSuiviPastilleHtml()}</div>`;

    const estConstruct = item.mode === 'construct';
    eleveItemCourant = item;
    eleveJetonsPoses = [];
    const consigne = estConstruct
        ? eleveConsigneJetons() /* texte complet sauf sur un téléphone au pavé */
        : 'Observe la carte et complète le schéma en barres, puis Valider.';
    html += `<div class="eleve-consigne">${consigne}</div>`;

    /* le badge est le total à recopier sur la carte : vide lui aussi */
    const badge = estConstruct
        ? `<div class="total-badge eleve-case" data-attendu="${item.total}">` +
          `<input class="eleve-input" type="text" inputmode="numeric" maxlength="3" autocomplete="off"></div>`
        : `<div class="total-badge">${item.total}</div>`;
    const splatPart = `<div class="part-splat">` +
        (eleveDessinBande(item) ? getSplatSvgBande(item, true, true, BANDE_VUE_L['3x4']) : getSplatSvg(item, !estConstruct, false, true)) +
        badge + `</div>`; /* jetons cachés dessinés sous la tache, dévoilés à la correction */
    html += splatPart;

    const flexVis = Math.max(item.visible, item.total * 0.05, 1);
    const flexHid = Math.max(item.hiddenPerSplat, item.total * 0.05, 1);
    const minW = item.numSplats >= 4 ? '25px' : '40px';
    const fSize = item.numSplats >= 4 ? '16px' : '20px';

    let haut, basVis = '', basTaches = '';
    if (estConstruct) {
        haut = `<div class="row-top" style="font-size: ${fSize};">${item.total}</div>`;
        const indiceVisible = item.clueGiven === 'visible';
        if (item.visible > 0) {
            basVis = indiceVisible
                ? `<div class="part-box" style="flex-grow: ${flexVis}; flex-basis: 0; background: white; color: #2563eb; min-width: ${minW}; font-size: ${fSize};">${item.visible}</div>`
                : eleveCaseInput(item.visible, flexVis, minW, fSize, 'white', false);
        }
        for (let i = 0; i < item.numSplats; i++) {
            basTaches += indiceVisible
                ? eleveCaseInput(item.hiddenPerSplat, flexHid, minW, fSize, '#d4deea', false, true)
                : `<div class="part-box avec-tache" style="flex-grow: ${flexHid}; flex-basis: 0; background: #d4deea; color: #111827; min-width: ${minW}; font-size: ${fSize};">${ELEVE_MINI_TACHE}${item.hiddenPerSplat}</div>`;
        }
    } else {
        haut = eleveCaseInput(item.total, 1, minW, fSize, 'white', true);
        if (item.visible > 0) basVis = eleveCaseInput(item.visible, flexVis, minW, fSize, 'white', false);
        for (let i = 0; i < item.numSplats; i++) basTaches += eleveCaseInput(item.hiddenPerSplat, flexHid, minW, fSize, '#d4deea', false, true);
    }

    html += `<div class="diagram-container"><div class="diagram-inner">${haut}` +
            `<div class="row-bottom">${basVis}${basTaches}</div></div></div>`;

    html += `<div class="eleve-msg" id="eleveMsg"></div>` +
            `<div class="eleve-actions"><button class="eleve-valider" id="eleveValider" type="button">Valider</button></div>`;

    scene.innerHTML = html;
    main.appendChild(scene);

    if (estConstruct) eleveBrancherDessin(scene, item);
    const pave = elevePaveActiver(scene);
    const premierChamp = scene.querySelector('.eleve-input');
    /* Clavier physique : le premier champ prend le focus, comme avant. Au pavé,
       c'est la première case vide qui devient active — un focus rouvrirait le
       clavier du système et ferait défiler la page. */
    if (!pave && premierChamp) premierChamp.focus();
    scene.querySelectorAll('.eleve-input').forEach(inp => {
        /* Entrée valide, et l'appui s'arrête là : une carte juste donne le focus à
           « Carte suivante ▶ », que le même appui cliquait aussitôt — l'élève ne
           voyait ni le Bravo ni la tache dévoilée. Le 2e appui passe à la suite. */
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); eleveValider(main); } });
        inp.addEventListener('input', () => {
            const c = inp.closest('.eleve-case');
            if (c) c.classList.remove('eleve-ko');
        });
    });
    document.getElementById('eleveValider').onclick = () => eleveValider(main);
    if (estConstruct) eleveElargirScene(scene);
    eleveCalerBadge(scene);
}

/* Grand écran seulement : le badge « total » se cale sur le coin haut-droit de la zone
   dessinée (tache + jetons) au lieu du coin du cadre, où il flottait loin du plateau. */
function eleveCalerBadge(scene) {
    const part = scene.querySelector('.part-splat');
    const svg = part && part.querySelector('svg.splat-svg');
    const badge = part && part.querySelector('.total-badge');
    if (!part || !svg || !badge) return;
    const caler = () => {
        /* téléphone et petits écrans : rien ne bouge, le badge garde sa place d'origine */
        if (!window.matchMedia('(min-width: 1000px) and (min-height: 700px)').matches) { badge.style.top = ''; badge.style.right = ''; return; }
        const rp = part.getBoundingClientRect(), rs = svg.getBoundingClientRect();
        /* zone réellement dessinée : viewBox 300×200 ajustée « meet » dans le svg */
        const vbW = Number(svg.dataset.vbw || 300);
        const k = Math.min(rs.width / vbW, rs.height / 200);
        const w = vbW * k, h = 200 * k;
        const top = (rs.top - rp.top) + (rs.height - h) / 2;
        const right = (rp.right - rs.right) + (rs.width - w) / 2;
        badge.style.top = Math.max(0, Math.round(top)) + 'px';
        badge.style.right = Math.max(0, Math.round(right)) + 'px';
    };
    caler();
    if (!eleveCalerBadge._lie) { eleveCalerBadge._lie = true; window.addEventListener('resize', () => { const sc = document.querySelector('.eleve-scene'); if (sc) eleveCalerBadge(sc); }); }
}

function eleveValider(main) {
    const bouton = document.getElementById('eleveValider');
    if (!bouton || bouton.disabled) return;
    const cases = Array.from(document.querySelectorAll('.eleve-case'));
    const msg = document.getElementById('eleveMsg');
    let toutJuste = true;
    cases.forEach(c => {
        const attendu = parseInt(c.getAttribute('data-attendu'), 10);
        const inp = c.querySelector('.eleve-input');
        const repondu = parseInt(String(inp.value).trim(), 10);
        const juste = Number.isFinite(repondu) && repondu === attendu;
        c.classList.toggle('eleve-ko', !juste);
        c.classList.toggle('eleve-ok', juste);
        if (!juste) toutJuste = false;
    });
    let jetonsFaux = false;
    if (eleveItemCourant && eleveItemCourant.mode === 'construct') {
        jetonsFaux = eleveJetonsPoses.length !== eleveItemCourant.visible;
        if (jetonsFaux) toutJuste = false;
    }
    if (toutJuste) {
        /* une carte rejouée après « Voir la réponse » devient orange, jamais verte */
        const etaitRouge = eleveResultats[eleveIdx] === 'ko';
        if (!eleveCarteFautee && !etaitRouge) eleveEtoiles++;
        eleveResultats[eleveIdx] = !eleveCarteFautee && !etaitRouge;
        bouton.disabled = true;
        /* carte finie : plus rien à valider, le Valider s'efface (il restait éteint à côté de
           « Carte suivante » sur ordinateur ; 05/10/2026, Gwenaël) */
        bouton.hidden = true;
        msg.textContent = eleveCarteFautee ? 'Juste ! Regarde sous la tache\u2026' : 'Bravo, du premier coup ! Regarde sous la tache\u2026';
        msg.className = 'eleve-msg bravo';
        cases.forEach(c => { const i = c.querySelector('.eleve-input'); if (i) i.readOnly = true; });
        eleveSauverEnCours();
        eleveDevoilerTache();
        /* comme aux mondes 3-4 : l'élève regarde ce qu'il a fait et enchaîne quand il veut
           (le bouton a le focus : Entrée suffit) */
        const suivant = document.createElement('button');
        suivant.type = 'button'; suivant.className = 'eleve-suivant';
        suivant.textContent = 'Carte suivante \u25b6';
        suivant.onclick = () => eleveCarteSuivante(main);
        bouton.parentNode.appendChild(suivant);
        suivant.focus();
    } else {
        eleveCarteFautee = true;
        eleveEchecs++;
        /* 3 essais, puis la réponse (05/10/2026, Gwenaël, mondes 1 à 4) : à la 3e erreur, la réponse
           s'écrit tout de suite (avant : « Voir la réponse » à côté du Valider) */
        if (eleveEchecs >= ELEVE_ECHECS_MAX) { eleveMontrerReponse(main); return; }
        const badgeVide = cases.some(c => {
            if (!c.classList.contains('total-badge')) return false;
            const i = c.querySelector('.eleve-input');
            return !String(i && i.value || '').trim();
        });
        if (badgeVide) {
            msg.textContent = 'Remplis la petite case en haut \u00e0 droite !';
        } else if (jetonsFaux && cases.every(c => c.classList.contains('eleve-ok'))) {
            msg.textContent = 'Cases justes : recompte bien tes jetons !';
        } else {
            msg.textContent = 'Pas encore : corrige le rouge et revalide !';
        }
        msg.className = 'eleve-msg rate';
    }
}

/* Vérification : la tache devient transparente et laisse voir les jetons
   qu'elle cachait, comme quand on clique sur une carte en usage libre. */
function eleveDevoilerTache() {
    const part = document.querySelector('.eleve-scene .part-splat');
    if (part) part.classList.add('devoile');
}

/* « Étape suivante ▶ » (lot A, 25/09/2026) : le lien passe par la carte des
   mondes (?apres=<parcours>), qui renvoie aussitôt au jeu de l'étape suivante ;
   assets/js/splat-etapes.js écrit sous le bouton où il mène (« Étape 2 · Dessine
   les jetons », « Nouveau monde : … »). Sans ce fichier : « Étape suivante ▶ » seul. */
function eleveEtapeSuivante() {
    if (window.MathsGoSplatEtapes) return window.MathsGoSplatEtapes.bouton(parcoursId, ELEVE_URL_MONDES);
    return { html: '\u00c9tape suivante \u25b6', href: `${ELEVE_URL_MONDES}?apres=${encodeURIComponent(parcoursId)}`, versCarte: false };
}

/* Lien vers la carte des mondes (seulement quand on vient du parcours). */
function eleveLienMondesHtml(classe, libelle) {
    if (!parcoursId) return '';
    return `<a class="${classe || 'eleve-mondes'}" href="${ELEVE_URL_MONDES}" title="Retour \u00e0 la carte des mondes">` +
        (libelle || '\u25c0 <span class="txt">Carte des mondes</span>') + `</a>`;
}

/* « ? Aide » (lot 3 « aides et carte », 08/11/2026, choix de Gwenaël) : collé à « ◀ Carte des mondes », il ouvre
   l'aide de l'étape (assets/js/splat-etapes.js : seulement les étapes qui ont leur propre film) ; « Retour au jeu › » sous le
   film rouvre CETTE adresse, et la reprise remet l'élève sur sa carte. Rien sans parcours ni sans aide. */
function eleveLienAideHtml() {
    const E = window.MathsGoSplatEtapes;
    const href = parcoursId && E && typeof E.aide === 'function'
        ? E.aide(parcoursId, location.pathname + location.search + location.hash) : null;
    if (!href) return '';
    return `<a class="eleve-aide" href="${href.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" title="Comment faire : le film" aria-label="Comment faire">? <span class="txt">Comment faire</span></a>`;
}

/* Empreinte de la série en cours : ce qui détermine les cartes tirées.
   Deux fiches peuvent partager le même ?parcours= (les trois livrets Petit SPLAT!
   valident la même étoile du monde 1) tout en portant des cartes différentes : sans
   cette empreinte, la reprise de l'une s'appliquait à l'autre et sautait des cartes. */
function eleveSignatureSerie() {
    const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
    /* jetons=0 et sansjetons=N changent les cartes : ils entrent dans l'empreinte, seulement
       quand ils sont posés (les empreintes déjà enregistrées ne changent pas). */
    return [activeSeed, getProblemType(), val('targetVal'), val('splatMode'),
            val('gameMode'), val('gridSize')].join('|')
           + (jetonsAutourCoche() ? '' : '|jetons0')
           + (jetonsAutourCoche() && sansJetonsNombre > 0 && getProblemType() === 'classic' ? '|sansjetons' + sansJetonsNombre : '');
}

/* Sauvegarde « en cours » : l'indice de la prochaine carte + le détail des pastilles. */
function eleveSauverEnCours() {
    if (!parcoursId) return;
    /* dernière carte jouée, ou carte rouge rejouée : la série est finie */
    if (eleveRejeu || eleveIdx + 1 >= eleveSerie.length) { eleveSauverFinDeSerie(); return; }
    /* l'étoile déjà gagnée ne bouge pas ; la reprise (empreinte, pastilles) reste sur l'appareil,
       le serveur ne reçoit que la carte atteinte et les comptes */
    const s = eleveSuivi();
    if (s) s.ecrire((P, p) => P.enregistrerEnCours(p, parcoursId, { sig: eleveSignatureSerie(), idx: eleveIdx + 1, etoiles: eleveEtoiles,
        res: eleveResultats.slice(0, eleveIdx + 1), vues: eleveVues, cartes: eleveSerie.length }));
}

/* Série finie (dernière carte jouée, ou carte rouge rejouée), enregistrée tout de
   suite, sans attendre « Carte suivante » (02/10/2026) : l'élève qui quitte là ne
   repart pas de la carte 1. Tout vert : l'étoile s'allume. Des cartes rouges : il
   revient sur « Encore N cartes ! », avec ses pastilles (celles déjà rejouées comptent). */
function eleveSauverFinDeSerie() {
    if (!parcoursId) return;
    const total = eleveSerie.length;
    const res = Array.from({ length: total }, (_, i) => eleveResultats[i] === undefined ? null : eleveResultats[i]);
    const vertes = res.filter(r => r === true).length;
    if (!res.includes('ko')) { eleveEnregistrerReussite(vertes, total); return; }
    const s = eleveSuivi();
    if (s) s.ecrire((P, p) => P.enregistrerEnCours(p, parcoursId, { sig: eleveSignatureSerie(), idx: total, etoiles: vertes, res: res,
        vues: eleveVues, cartes: total }));
}

/* « Rejouer toute la série » : l'élève repart de zéro, la sauvegarde « en cours »
   s'efface (l'étoile, elle, reste) ; s'il ferme avant de répondre à la carte 1, il
   revient sur la carte 1, comme dans ÉquaSplat (décision de Gwenaël, 03/10/2026). */
function eleveEffacerEnCours() {
    if (!parcoursId) return;
    const e = eleveEtapeLue();
    if (!e || (!e.enCours && !e.idx)) return; /* rien en cours : rien à écrire ni à envoyer */
    eleveSuivi().ecrire((P, p) => P.effacerEnCours(p, parcoursId));
}

/* Carte suivante : dans l'ordre, ou la prochaine carte rouge quand on les rejoue. */
function eleveCarteSuivante(main) {
    if (eleveRejeu) {
        /* une carte rouge revient en jumelle (05/10/2026) : même carte, d'autres nombres */
        if (eleveRejeu.length) { eleveIdx = eleveRejeu.shift(); eleveJumellePoser(eleveIdx); }
        else { eleveRejeu = null; eleveIdx = eleveSerie.length; }
    } else {
        eleveIdx++;
    }
    renderEleve(main);
}

/* ===== Les cartes jumelles (décision de Gwenaël du 05/10/2026, mondes 1 à 4) =====
   En fin de série, une carte rouge (réponse montrée à la 3e erreur) ne revient plus identique :
   elle revient en JUMELLE — même exercice, autant de taches, même forme et même place des taches,
   des jetons autour ou pas, comme elle ; d'autres nombres (ce que cache une tache change, donc
   le total aussi). L'élève refait le raisonnement au lieu de recopier la réponse qu'il a vue.
   Rien de nouveau n'est enregistré : la jumelle a SON hasard (graine : l'empreinte de la série,
   la place de la carte, le nombre de fois qu'elle revient) — la même carte rouge redonne la même
   jumelle, une 2e fois une autre ; la série, les fiches et la reprise ne bougent pas. Le tirage
   est celui de createItem (mêmes bornes), avec la graine de la jumelle, puis la graine de la
   série est remise. */
/* La jumelle de la carte i pour sa prochaine venue, tirée une seule fois (l'écran « Encore N
   cartes ! » la prépare, pour sa phrase ; le clic la pose). null : pas de jumelle. */
function eleveJumellePreparer(i) {
    const rang = (eleveJumelleRang[i] || 0) + 1;
    const prete = eleveJumellesPretes[i];
    if (prete && prete.rang === rang) return prete.carte;
    let j = null;
    try { j = eleveJumelle(eleveOriginaux[i], hashSeed(eleveSignatureSerie() + '|jumelle|' + i + '|' + rang)); }
    catch (e) { j = null; } /* jamais de carte cassée : la carte d'origine revient */
    eleveJumellesPretes[i] = { rang, carte: j };
    return j;
}
function eleveJumellePoser(i) {
    const o = eleveOriginaux[i];
    if (!o) return;
    const j = eleveJumellePreparer(i);
    eleveJumelleRang[i] = (eleveJumelleRang[i] || 0) + 1;
    eleveSerie[i] = j || o;
}
function eleveJumelle(item, graine) {
    if (!item || item.kind || !(item.numSplats >= 1) || !(item.hiddenPerSplat >= 1)) return null;
    const sauve = currentRand;
    currentRand = mulberry32(graine);
    try {
        const cible = item.maxTargetContext, n = item.numSplats;
        const maxH = Math.max(1, Math.floor(cible / n));
        for (let essai = 0; essai < 500; essai++) {
            const h = Math.floor(rand() * maxH) + 1;
            const cache = h * n;
            let maxV = Math.min(cible - cache, 20);
            if (maxV < 0) maxV = 0;
            const v = Math.floor(rand() * (maxV + 1));
            if (h === item.hiddenPerSplat) continue;          /* la réponse change */
            if (item.hiddenPerSplat >= 2 && h < 2) continue;  /* pas d'un coup un seul jeton par tache */
            if ((v === 0) !== (item.visible === 0)) continue; /* des jetons autour, ou pas, comme elle */
            if (v > 0 && v === item.visible) continue;         /* et pas les mêmes */
            if (cache + v === item.total) continue;           /* le total change aussi */
            const j = Object.assign({}, item, {
                total: cache + v, visible: v, hidden: cache, hiddenPerSplat: h,
                dots: generateDotPositions(v, cible, item.splatShape, item.splats),
                hiddenDots: generateHiddenDots(item.splats, h, item.splatShape, cible)
            });
            delete j.dessinBande; /* le dessin « espace=1 » de la carte d'origine, gardé en cache */
            return j;
        }
        return null;
    } finally {
        currentRand = sauve;
    }
}

/* 3e erreur (05/10/2026) : les cases se remplissent en rouge, la pastille devient
   rouge, et l'élève passe à la carte suivante quand il veut. */
function eleveMontrerReponse(main) {
    const bouton = document.getElementById('eleveValider');
    const msg = document.getElementById('eleveMsg');
    if (!bouton) return;
    document.querySelectorAll('.eleve-case').forEach(c => {
        const inp = c.querySelector('.eleve-input');
        if (inp) { inp.value = c.getAttribute('data-attendu'); inp.readOnly = true; }
        c.classList.remove('eleve-ko', 'eleve-ok');
        c.classList.add('eleve-montre');
    });
    const item = eleveItemCourant;
    let texte = 'Voil\u00e0 la r\u00e9ponse. Tu rejoueras cette carte \u00e0 la fin.';
    if (item && item.mode === 'construct') texte = `Il fallait ${item.visible} jeton${item.visible > 1 ? 's' : ''}. Tu rejoueras cette carte \u00e0 la fin.`;
    msg.textContent = texte;
    msg.className = 'eleve-msg rate';
    if (eleveResultats[eleveIdx] !== 'ko') eleveVues++; /* une rouge rejouée ne compte pas deux fois */
    eleveResultats[eleveIdx] = 'ko';
    eleveSauverEnCours();
    eleveDevoilerTache();
    bouton.disabled = true;
    bouton.hidden = true; /* plus rien à valider (05/10/2026) */
    const suivant = document.createElement('button');
    suivant.type = 'button'; suivant.className = 'eleve-suivant';
    suivant.textContent = 'Carte suivante \u25b6';
    suivant.onclick = () => eleveCarteSuivante(main);
    bouton.parentNode.appendChild(suivant);
    suivant.focus();
    /* la barre du haut reflète tout de suite la pastille rouge */
    const tete = document.querySelector('.eleve-tete .eleve-pastilles');
    if (tete) tete.outerHTML = elevePastillesHtml();
}

/* « Rejoue-la » ; « Rejoue-la, avec d'autres nombres, » quand chaque carte rouge revient en
   jumelle (choix A de Gwenaël, 14/10/2026 : dit une fois, sur l'écran de fin, avant de rejouer). */
function eleveRejouePhrase(nbR, jumelles) {
    return `Rejoue-l${nbR > 1 ? 'es' : 'a'}` + (jumelles ? `, avec d'autres nombres,` : ``);
}

function renderEleveFin(main) {
    const total = eleveSerie.length;
    const rouges = [];
    for (let i = 0; i < total; i++) if (eleveResultats[i] === 'ko') rouges.push(i);
    eleveEtoiles = eleveResultats.filter(r => r === true).length;
    const scene = document.createElement('div');
    scene.className = 'eleve-scene';
    if (rouges.length) {
        /* des cartes rouges : pas d'étoile, on propose de les rejouer */
        eleveSauverFinDeSerie(); /* au retour, l'élève revient sur cet écran */
        const nbR = rouges.length, plR = nbR > 1 ? 's' : '';
        scene.innerHTML = `<div class="eleve-fin">` +
            (parcoursId ? `<div class="fin-etoile">\u2b50</div>` : ``) +
            `<h2>Encore ${nbR} carte${plR}\u00a0!</h2>` +
            `<div class="fin-pastilles">${elevePastillesHtml()}</div>` +
            `<p class="fin-sous">${eleveRejouePhrase(nbR, rouges.every(i => !!eleveJumellePreparer(i)))} ` +
            (parcoursId ? `et ton \u00e9toile s'allume sur la carte des mondes.` : `pour finir la s\u00e9rie.`) + `</p>` +
            `<div class="fin-action"><button id="eleveRejouerRouges" type="button">Je rejoue ${nbR > 1 ? `mes ${nbR} cartes rouges` : `ma carte rouge`} \u25b6</button></div>` +
            `<div class="fin-sorties"><button id="eleveRejouer" type="button">Rejouer toute la s\u00e9rie</button>` +
            `${eleveLienMondesHtml('fin-lien', 'Retour \u00e0 la carte des mondes')}</div>` +
            `</div>`;
        main.appendChild(scene);
        document.getElementById('eleveRejouerRouges').onclick = () => { eleveRejeu = rouges.slice(); eleveCarteSuivante(main); };
    } else {
        eleveEnregistrerReussite(eleveEtoiles, total);
        const suite = parcoursId ? eleveEtapeSuivante() : null;
        scene.innerHTML = `<div class="eleve-fin">` +
            `<div class="fin-etoile on">\u2B50</div>` +
            `<h2>S\u00e9rie termin\u00e9e, bravo\u00a0!</h2>` +
            `<div class="fin-pastilles">${elevePastillesHtml()}</div>` +
            `<p>${eleveEtoiles} carte${eleveEtoiles > 1 ? 's' : ''} sur ${total} du premier coup.` +
            (parcoursId ? ` Ton \u00e9toile est allum\u00e9e sur la carte des mondes\u00a0!` : ``) + `</p>` +
            /* dans le parcours : « Étape suivante ▶ » en gros, rejouer et la carte en liens
               dessous (comme l'écran des cartes rouges) ; hors parcours, rien ne change */
            (parcoursId
                ? `<div class="fin-action"><button id="eleveEtapeSuivante" type="button">${suite.html}</button></div>` +
                  `<div class="fin-sorties"><button id="eleveRejouer" type="button">Rejouer la s\u00e9rie</button>` +
                  `${suite.versCarte ? '' : eleveLienMondesHtml('fin-lien', 'Retour \u00e0 la carte des mondes')}</div>`
                : `<div class="eleve-actions"><button class="eleve-valider" id="eleveRejouer" type="button">Rejouer la s\u00e9rie</button>${eleveLienMondesHtml('eleve-lien')}</div>`) +
            `</div>`;
        main.appendChild(scene);
        const suivante = document.getElementById('eleveEtapeSuivante');
        if (suivante) suivante.onclick = () => { window.location.href = suite.href; };
    }
    document.getElementById('eleveRejouer').onclick = () => { eleveEffacerEnCours(); eleveIdx = 0; eleveEtoiles = 0; eleveSerie = []; eleveResultats = []; eleveVues = 0; eleveRejeu = null; renderEleve(main); };
}

window.onload = () => {
    updateUI();
    if (loadSharedConfiguration()) {
        toggleMode();
        startGen();
    } else {
        updateProblemTypeUI();
        startGen();
        toggleMode();
    }
};
