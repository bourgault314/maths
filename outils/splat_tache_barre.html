<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Petit SPLAT! — fiches et schémas en barres | maths&amp;go</title>
  <meta name="description" content="Composez une fiche de Petits Splats avec jetons cachés et schémas en barres à compléter.">
  <link rel="canonical" href="https://mathsgo.re/outils/splat_tache_barre.html">
  <meta name="robots" content="index, follow, max-image-preview:large">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <style>
    :root {
      --ink: #111827;
      --bg: #f8fafc;
      --panel: #ffffff;
      --accent: #2563eb;
      --splat: #000000;
      --border: #cbd5e1;
      --grid-line: #94a3b8; 
      --page-w: 210mm;
      --page-h: 297mm;
      --page-margin: 10mm;
      --cols: 3; 
      --rows: 4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR */
    aside { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
    .sb-header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fff; display:flex; align-items:center; gap:10px; }
    .sb-title { font-size: 17px; font-weight: 800; color: var(--accent); margin: 0; text-transform: uppercase; letter-spacing: -0.5px; }
    .splat-back { width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; border:1px solid #cbd5e1; border-radius:9px; color:#2563eb; background:#fff; text-decoration:none; }
    .splat-back:hover { background:#eff6ff; }
    .splat-back svg { width:19px; height:19px; display:block; }
    .sb-scroll { flex: 1; overflow-y: auto; padding: 12px 14px 10px 14px; display: flex; flex-direction: column; gap: 9px; }
    .section { border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
    .sec-title { font-size: 10px; text-transform: uppercase; color: #64748b; font-weight: 800; margin-bottom: 6px; }
    
    select, input[type="number"], input[type="text"] { padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-weight: 600; width: 100%; outline: none; background: #fff; }

    .support-section { background: #eff6ff; padding: 9px; border-radius: 8px; border: 1px solid #bfdbfe; }
    .support-section .sec-title { color: #1e3a8a; }
    .compact-options { display: flex; flex-direction: column; gap: 6px; }
    .control { margin-bottom: 7px; }
    .control:last-child { margin-bottom: 0; }
    .control label { display: block; font-size: 11px; font-weight: 700; color: #334155; margin-bottom: 4px; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seed-section { padding-bottom: 4px; }

    .seed-row { display: grid; grid-template-columns: 1fr 38px 38px; gap: 6px; align-items: center; }
    .seed-btn { height: 32px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f1f5f9; cursor: pointer; font-size: 16px; font-weight: 800; }
    .seed-btn:hover { background: #e2e8f0; }
    #seedInput.seed-auto { color: #94a3b8; font-style: italic; border-color: #e2e8f0; }
    #seedInput.seed-manual { color: #1e40af; font-style: normal; border-color: #93c5fd; background: #eff6ff; }
    .seed-status { margin-top: 3px; font-size: 11px; font-weight: 700; color: #94a3b8; }
    .seed-status.manual { color: #1e40af; }
    .seed-meta { margin-top: 3px; min-height: 18px; }
    .seed-meta .seed-status { margin-top: 0; }
    /* « Lien copié ! » prend deux secondes la place de « graine automatique ». */
    .seed-status.copied { color: #059669; }
    .seed-status.error { color: #b91c1c; }
    
    .flags { display: flex; gap: 10px; margin-bottom: 10px; }
    .flag-btn { font-size: 12px; font-weight: 800; cursor: pointer; opacity: 0.5; padding: 4px 10px; border-radius: 6px; background:#f1f5f9; border: 1px solid #e2e8f0; }
    .flag-btn.active { opacity: 1; background: var(--accent); color: white; border-color: var(--accent); }
    
    .corr-group { display: flex; gap: 7px; align-items: stretch; margin-bottom: 6px; }
    .check-control { flex: 1; display: flex; align-items: center; gap: 8px; background: #f1f5f9; padding: 7px 8px; border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; margin-bottom: 0; min-height: 34px; }
    .check-control input { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
    .check-text { font-size: 11.5px; font-weight: 700; color: #334155; }
    
    .rv-btn { 
        display: flex; align-items: center; justify-content: center; 
        font-size: 12px; font-weight: 800; cursor: pointer; 
        padding: 0 12px; border-radius: 8px; 
        background: #f1f5f9; border: 1px solid #e2e8f0; color: #64748b;
        transition: all 0.2s;
    }
    .rv-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .rv-btn.disabled { opacity: 0.3; pointer-events: none; }
    
    .print-title-control {
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 12px;
    }
    .print-title-control label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 5px;
    }
    .print-title-control input {
        width: 100%;
        height: 34px;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        font-size: 13px;
        font-weight: 700;
        outline: none;
        background: #fff;
    }
    .print-title-control input::placeholder { color: #94a3b8; font-weight: 600; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; flex: 0 0 auto; padding: 10px 14px 4px; border-top: 1px solid var(--border); background: var(--panel); }
    .btn { padding: 11px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; color: white; font-size: 13px; }
    .btn-new { background: var(--accent); }
    .btn-print { background: #10b981; }

    /* MAIN PREVIEW */
    main { flex: 1; overflow: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; background: #e2e8f0; }
    .page { width: var(--page-w); height: var(--page-h); background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; flex-shrink: 0; page-break-after: always; }
    .page-inner { position: absolute; top: var(--page-margin); bottom: var(--page-margin); left: var(--page-margin); right: var(--page-margin); display: flex; flex-direction: column; }
    
    .grid { flex: 1; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); border: 2px solid var(--ink); min-height: 0; }
    .cell {
      border: none;
      border-right: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
      display: flex;
      flex-direction: column;
      padding: 4px;
      position: relative;
      overflow: hidden;
      background: white;
    }
    .grid-3x4 .cell:nth-child(3n),
    .grid-3x3 .cell:nth-child(3n),
    .grid-2x4 .cell:nth-child(2n),
    .grid-2x3 .cell:nth-child(2n),
    .grid-2x2 .cell:nth-child(2n) { border-right: none; }
    .grid-3x4 .cell:nth-child(n+10),
    .grid-3x3 .cell:nth-child(n+7),
    .grid-2x4 .cell:nth-child(n+7),
    .grid-2x3 .cell:nth-child(n+5),
    .grid-2x2 .cell:nth-child(n+3) { border-bottom: none; }
    
    /* ANIMATIONS TBI MODE */
    .tbi-mode { cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .tbi-mode:hover { transform: scale(1.01); box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 5; border-color: var(--accent); }
    .splat-path { transition: opacity 0.6s ease; }
    .tbi-mode.revealed .splat-path { opacity: 0.15; }
    .hidden-val { opacity: 0; transition: opacity 0.6s ease; }
    .tbi-mode.revealed .hidden-val { opacity: 1; }
    .solution-dot { opacity: 1; transition: opacity 0.6s ease; }
    .tbi-mode .solution-dot { opacity: 0; }
    .tbi-mode.revealed .solution-dot { opacity: 1; }

    .part-splat { flex: 1; position: relative; border-bottom: 1px dashed #cbd5e1; margin-bottom: 5px; overflow: hidden; min-height: 0; }
    .grid.schema-a-faire .part-splat { border-bottom: 1.3px dashed #64748b; }
    /* 9 cases, « Schéma à tracer » (26/09/2026, Gwenaël : « il faut resserrer le haut pour
       laisser plus de place en bas pour dessiner ») : le dessin est resserré, et toute la place
       gagnée va à la zone VIDE où l'élève fait son schéma. Un schéma imprimé (exemple, schéma
       donné, corrigé) garde exactement sa taille habituelle. */
    .activity-print-page .grid.schema-a-faire.grille-3x3 .part-splat { flex: 0 0 125px; }
    .activity-print-page .grid.schema-a-faire.grille-3x3 .diagram-container.zone-vide { flex: 1 1 auto; }
    .splat-svg { width: 100%; height: 100%; display: block; }

    .total-badge {
        position: absolute; top: 5px; right: 5px; width: 38px; height: 38px;
        background: white; border: 2px solid #334155; display: flex; align-items: center; justify-content: center;
        font-size: 18px; font-weight: 900; color: #111827; z-index: 10; box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
    }

    /* DIAGRAMME */
    .diagram-container { flex: 0 0 70px; display: flex; flex-direction: column; width: 90%; margin: 0 auto 5px auto; }
    .diagram-inner { display: flex; flex-direction: column; flex: 1; border: 2px solid #111827; border-radius: 0; overflow: hidden; background: white; }
    .row-top { flex: 1; border-bottom: 2px solid #111827; display: flex; align-items: center; justify-content: center; font-weight: 900; background: #fff; min-height: 25px; }
    .row-bottom { flex: 1; display: flex; min-height: 25px; }
    .part-box { display: flex; align-items: center; justify-content: center; font-weight: 900; border-right: 2px solid #111827; overflow: hidden; }
    .part-box:last-child { border-right: none; }

    /* Aperçu téléphone : réglages au-dessus et feuille A4 réduite à la largeur. */
    @media (max-width:700px) {
      :root { --page-margin: 4vw; }
      body { flex-direction: column; height: 100dvh; }
      aside { width: 100%; max-height: 44dvh; border-right: 0; border-bottom: 1px solid var(--border); }
      .sb-scroll { padding: 8px 10px; }
      .actions { padding: 8px 10px 2px; }
      main { padding: 8px; gap: 10px; }
      .page { width: 100%; height: auto; aspect-ratio: 210 / 297; }
      .actions .btn { min-height: 44px; }
    }


    /* MODULE RELATION ENTRE 2 TACHES */
    .module-hint {
      margin-top: 5px;
      padding: 6px 7px;
      border-radius: 7px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }
    .relation-clue {
      flex: 0 0 auto;
      margin: 0 auto 5px auto;
      width: 92%;
      padding: 4px 6px;
      border: 1.5px solid #111827;
      border-radius: 7px;
      background: #fff7ed;
      color: #111827;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.12;
      text-align: center;
    }
    .relation-diagram { flex: 0 0 92px; width: 94%; }
    .schema-a-tracer > * { visibility: hidden; }
    .relation-diagram .diagram-inner {
      border-width: 2px;
      flex: 0 0 72px;
      height: 72px;
      min-height: 0;
      width: 100%;
    }
    .relation-diagram .row-top {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .relation-row-bottom {
      flex: 1 1 0;
      display: grid;
      grid-template-columns: var(--rel-cols);
      column-gap: 2px;
      min-height: 0;
      width: 100%;
      box-sizing: border-box;
      background: #111827; /* traits verticaux robustes, même à l'impression */
    }
    .relation-part-box {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: none;
      overflow: hidden;
      min-width: 0;
      box-sizing: border-box;
      background: #fff;
    }
    .relation-part-box.relation-visible { background: #fff; }
    .relation-part-box.relation-a { background: #e5e7eb; }
    .relation-part-box.relation-b { background: #ffedd5; }
    .relation-part-box.relation-c { background: #fee2e2; }
    .relation-part-value {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 17px;
      font-weight: 950;
      line-height: 1;
      background: transparent;
    }
    .relation-visible .relation-part-value { color: #2563eb; }
    .relation-label-row {
      flex: 0 0 16px;
      display: grid;
      grid-template-columns: var(--rel-cols);
      width: calc(100% - 4px);
      margin-left: 2px;
      margin-right: 2px;
      align-items: center;
      justify-content: stretch;
      column-gap: 2px;
      padding-top: 2px;
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      line-height: 1;
      box-sizing: border-box;
    }
    .relation-label {
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      box-sizing: border-box;
    }
    .relation-label-visible { color: #2563eb; }
    .relation-label-a { color: #111827; }
    .relation-label-b { color: #ea580c; }
    .relation-label-c { color: #dc2626; }
    .relation-given-part .relation-part-value { font-weight: 950; }
    .relation-clue-3 { font-size: 10.4px; line-height: 1.05; padding: 3px 5px; }
    /* Deux indices de deux lignes chacun : un petit blanc pour voir où finit le premier. */
    .relation-clue > div + div { margin-top: 3px; }
    .relation3-cell { padding: 5px; }
    .relation3-cell .part-splat { flex: 1.55 1 0; margin-bottom: 5px; }
    .relation3-cell .relation-clue { width: 94%; font-size: 11.5px; line-height: 1.08; padding: 5px 7px; margin-bottom: 6px; }
    .relation3-cell .relation-diagram { flex-basis: 100px; width: 94%; }
    .relation3-cell .relation-diagram .diagram-inner { flex-basis: 80px; height: 80px; }

    .sums3-cell .relation-clue {
      width: 94%;
      font-size: 15px;
      line-height: 1.12;
      padding: 5px 7px;
      margin-bottom: 6px;
      font-weight: 900;
      text-align: center;
    }
    /* 4 cases par page (Enquête et Système, essai du 26/09/2026) : plateau, indices et
       schéma gardent EXACTEMENT la taille qu'ils ont en 6 par page ; toute la hauteur
       gagnée reste blanche sous l'indice, pour que l'élève y dessine son schéma
       (« Schéma à tracer »). Le plateau des 6 cases n'a pas de hauteur fixe : il prend
       la place que lui laissent les indices, qui dépend de la police et de la phrase.
       Une cale blanche d'un tiers de la case (la hauteur gagnée : 1/2 - 1/3 de la
       grille) laisse donc au-dessus exactement une case de 6 par page, où tout se
       place comme en 6. Le + 2 × padding + 1 px compense le rembourrage et le trait. */
    .grid-2x2 .relation-cell::after { content: ''; flex: 0 0 calc((100% + 11px) / 3); }
    .grid-2x2 .relation2-cell::after { flex-basis: calc((100% + 9px) / 3); }
    /* Cases « + − » et « × ÷ » : le signe en gros, les mots dessous. */
    #relationControls .check-control { display: flex; margin-bottom: 0; }
    .check-sym { display: block; font-size: 15px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .check-sub { display: block; font-size: 10px; font-weight: 600; color: #64748b; }
    .relation-controls { margin-top: 3px; }
    .option-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .option-pair .check-control { min-height: 32px; padding: 6px 7px; }
    .option-pair .check-text { font-size: 10.5px; }
    #relationHintOption { margin-bottom: 0; }
    #relationHintOption .check-control { min-height: 32px; padding: 6px 7px; }

    .grid-mirror { direction: rtl; } 
    .grid-mirror .cell { direction: ltr; }

    /* Label de page : URL en minuscules et positionné tout en bas */
    .page-label { position: absolute; bottom: -25px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: bold; color: #64748b; text-transform: none; }
    .print-logo { position: absolute; bottom: -34px; left: 0; width: 45mm; height: auto; display: block; }



    /* FICHE D'ACTIVITÉ - uniquement pour le mode impression */
    .activity-print-page .page-inner { top: 8mm; bottom: 8mm; left: 8mm; right: 8mm; }
    .activity-header {
        flex: 0 0 16mm;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2.5mm 4mm;
        margin-bottom: 3mm;
        background: linear-gradient(90deg, #ff9815 0%, #ffc46d 58%, #fff4dc 100%);
        border-radius: 0;
        overflow: hidden;
    }
    .activity-title-block { display: flex; flex-direction: column; justify-content: center; line-height: 1.02; min-width: 65mm; }
    .activity-title { font-size: 20px; font-weight: 950; color: #063b7a; text-transform: uppercase; letter-spacing: -0.7px; }
    .activity-subtitle { font-size: 15px; font-weight: 900; color: #000; margin-top: 1mm; }
    .activity-logos { display: flex; align-items: center; justify-content: flex-end; gap: 4mm; height: 100%; }
    .activity-logo-irem { height: 14mm; width: auto; object-fit: contain; display: block; }
    .activity-logo-maths { height: 12mm; width: auto; object-fit: contain; display: block; }
    .activity-instruction {
        flex: 0 0 auto;
        margin-bottom: 3mm;
        padding: 3mm 4mm;
        border: 1.4px solid #5b6574;
        border-radius: 6px;
        background: #fff;
        font-size: 14.5px;
        line-height: 1.22;
        color: #111827;
    }
    .activity-instruction-title { font-weight: 900; margin-bottom: 0.6mm; }
    .activity-instruction-line { padding-left: 6mm; text-indent: -4mm; }
    .activity-instruction-note {
        margin-top: 1.6mm;
        font-size: 13.2px;
        font-weight: 700;
        color: #334155;
    }
    /* QR « je rejoue en ligne » (Petit Splat classique, 26/09/2026) : même boîte, même taille
       et même texte que le QR des livrets (_sources/livret-petit-splat/render.py, CSS_QR).
       À l'écran, la boîte est aussi un lien : sur ordinateur, on clique au lieu de scanner. */
    .activity-instruction.avec-qr { display: flex; align-items: center; gap: 5mm; }
    .activity-instruction.avec-qr > .txt { flex: 1 1 auto; min-width: 0; }
    .qr-fiche { margin-left: auto; display: flex; align-items: center; gap: 3mm; flex: 0 0 auto; color: inherit; text-decoration: none; border-radius: 4px; }
    .qr-fiche:hover .lib em, .qr-fiche:focus-visible .lib em { text-decoration: underline; }
    .qr-fiche svg { width: 20mm; height: 20mm; display: block; }
    .qr-fiche .lib { text-align: right; font-size: 11.5px; font-weight: 900; color: #0f172a; line-height: 1.25; white-space: nowrap; }
    .qr-fiche .lib em { display: block; font-style: normal; font-weight: 400; font-size: 10.5px; color: #475569; margin-top: 0.6mm; }
    .activity-print-page .grid { width: 100%; }
    .activity-print-page .diagram-container { flex-basis: 64px; }
    /* Option « Espace sous le schéma » (lot 4, 26/09/2026) : 7,5 mm vides sous chaque schéma,
       pris sur la zone du dessin ; le dessin est refait par la table de dessin (voir
       tableDeDessinBande), sans aucun tirage : les cartes ne changent pas. */
    .activity-print-page .grid.avec-bande .diagram-container { margin-bottom: calc(5px + 7.5mm); }
    .activity-print-page .grid.avec-ligne .diagram-container { margin-bottom: calc(5px + 7.5mm); }
    /* 8 cases (2 x 4) avec la bande : le schéma garde la largeur qu'il a en 12 cases, centré
       (26/09/2026, Gwenaël : « ils ne sont pas jolis aussi larges ») */
    .activity-print-page .grid.avec-bande.grille-2x4 .diagram-container { width: 56mm; max-width: 100%; margin-left: auto; margin-right: auto; box-sizing: border-box; }
    /* « ? = 6 » sous le schéma, dans le corrigé d'une fiche « Schéma à tracer » */
    .diagram-container.avec-reponse { position: relative; }
    .diagram-container .reponse-corr { position: absolute; left: 0; right: 0; top: calc(100% + 2.6mm); text-align: left; font-size: 19px; font-weight: 700; color: #0f172a; line-height: 1; }
    /* « ? = …… » à compléter : tenu par le BAS (26/09/2026, choix C de Gwenaël, planche 13 : « plus
       gros », 19 px au lieu de 15) — la ligne grossit vers le haut, son bas reste là où il était,
       à la même distance du bord de la case. */
    .diagram-container .reponse-corr.reponse-a-faire,
    .diagram-container .reponse-corr.reponse-bas { top: auto; bottom: calc(-2.6mm - 15px); }
    /* Carte au schéma donné (?donne=N), 9 cases : le schéma reste en haut, à sa taille, et
       « ? = …… » descend en bas de la case, au même niveau que sur les cartes à faire (choix C,
       26/09/2026) : l'élève voit que c'est à remplir. */
    .activity-print-page .grid.schema-a-faire.grille-3x3 .diagram-container.schema-donne { flex: 1 1 auto; }
    .diagram-container.schema-donne > .diagram-inner { flex: 0 0 64px; }
    /* la carte exemple (?exemple=N) : une étiquette à droite, sur la ligne de « ? = 7 » (en haut, elle
       pouvait cacher un jeton), lisible en noir et blanc */
    .cell.carte-exemple { position: relative; }

/* échecs sur la carte en cours (au 3e, on propose la réponse) et file des cartes rouges à rejouer */

/* cartes jumelles : les cartes de la série telles que tirées, combien de fois chacune est revenue,
   et la jumelle tirée d'avance (écran « Encore N cartes ! ») */
let eleveOriginaux = [], eleveJumelleRang = [], eleveJumellesPretes = [];

let eleveJetonsPoses = [], eleveItemCourant = null, eleveRepriseFaite = false;
/* cartes de la série dont la réponse a été montrée (3e erreur) : rejouées, elles deviennent
   orange comme une carte réussie après une erreur — on les compte donc à part (lot 2 du suivi) */
let eleveVues = 0;
/* la série en cours est-elle déjà notée ? Sa fin s'enregistre dès la dernière carte jouée, puis
   l'écran de fin la redemande : la seconde fois ne compte pas une série de plus */
let eleveSerieNotee = false;
let seedMode = 'auto';
let activeSeed = '';
/* ?sansjetons=N (Petit Splat classique, 26/09/2026, livrets « je dessine le schéma ») : N
   cartes « complète le schéma » de la série perdent leurs jetons posés. Elles sont choisies
   par un hasard À PART (graine + « |sansjetons ») : le tirage des cartes ne change pas.
   Réglage d'adresse seulement (livret, QR, lien 🔗), sans case dans le panneau. */
let sansJetonsNombre = 0;
let carteExemple = 0;      /* ?exemple=N : les N premières cartes résolues, voir createPageElement */
let ligneReponse = false;  /* ?reponse=1 : « ? = …… » imprimé sous chaque carte à faire */
let carteSchemaDonne = 0;  /* ?donne=N : après les exemples, N cartes ont leur schéma imprimé (« ? » dans les cases), la réponse reste à trouver */
let currentRand = Math.random;
let shareFeedbackTimer = null;

function hashSeed(seed) {
    let h = 2166136261 >>> 0;
    const str = String(seed);
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return h >>> 0;
}

function mulberry32(seed) {
    return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function rand() {
    return currentRand();
}

function makeAutoSeed() {
    return String(Math.floor(100000 + Math.random() * 900000));
}

function updateSeedUI() {
    const input = document.getElementById('seedInput');
    const status = document.getElementById('seedStatus');
    if (!input || !status) return;

    const dict = i18n[currentLang] || i18n.fr;
    input.classList.toggle('seed-auto', seedMode === 'auto');
    input.classList.toggle('seed-manual', seedMode === 'manual');
    status.classList.toggle('manual', seedMode === 'manual');
    if (shareFeedbackTimer) return; /* « Lien copié ! » reste ses deux secondes */
    status.innerText = seedMode === 'manual' ? dict.seed_status_manual : dict.seed_status_auto;
}

function prepareSeedForGeneration() {
    const input = document.getElementById('seedInput');
    if (!input) {
        activeSeed = makeAutoSeed();
    } else if (seedMode === 'manual') {
        activeSeed = input.value.trim();
        if (!activeSeed) {
            seedMode = 'auto';
            activeSeed = makeAutoSeed();
        }
    } else {
        activeSeed = makeAutoSeed();
    }

    if (input) input.value = activeSeed;
    currentRand = mulberry32(hashSeed(activeSeed));
    updateSeedUI();
    return activeSeed;
}

function onSeedInput() {
    const input = document.getElementById('seedInput');
    if (!input || input.value.trim() === '') {
        seedMode = 'auto';
    } else {
        seedMode = 'manual';
        activeSeed = input.value.trim();
    }
    updateSeedUI();
}

function newAutoSeed() {
    seedMode = 'auto';
    startGen();
}

function setSelectValue(id, value) {
    if (value === null) return false;
    const select = document.getElementById(id);
    if (!select) return false;
    const option = Array.from(select.options).find(item => item.value === value && !item.disabled);
    if (!option) return false;
    select.value = value;
    return true;
}

function readBooleanParam(params, name, fallback) {
    const value = params.get(name);
    if (value === '1' || value === 'true') return true;
    if (value === '0' || value === 'false') return false;
    return fallback;
}

function loadSharedConfiguration() {
    const params = new URLSearchParams(window.location.search);
    const sharedNames = ['seed', 'support', 'grid', 'problem', 'target', 'splats', 'exercise', 'level', 'ops', 'kmax', 'vocab', 'structure', 'given', 'correction', 'rv', 'diagram', 'scale', 'espace', 'jetons', 'sansjetons', 'exemple', 'donne', 'reponse', 'title', 'parcours'];
    if (!sharedNames.some(name => params.has(name))) return false;

    const seed = params.get('seed');
    if (seed && seed.trim() && seed.trim().length <= 128) {
        const input = document.getElementById('seedInput');
        seedMode = 'manual';
        activeSeed = seed.trim();
        if (input) input.value = activeSeed;
    }

    setSelectValue('supportMode', params.get('support'));
    parcoursId = (params.get('parcours') || '').slice(0, 64);
    if (params.get('support') === 'eleve') document.body.classList.add('eleve-lien');
    setSelectValue('problemType', params.get('problem'));
    updateProblemTypeUI();
    setSelectValue('gridSize', params.get('grid'));
    setSelectValue('targetVal', params.get('target'));

    const problemType = getProblemType();
    if (problemType === 'classic') {
        setSelectValue('splatMode', params.get('splats'));
        setSelectValue('gameMode', params.get('exercise'));
    } else {
        readRelationParams(params);
        const giveOnePart = document.getElementById('giveOnePart');
        if (giveOnePart) giveOnePart.checked = readBooleanParam(params, 'given', giveOnePart.checked);
    }
    /* « Jetons autour » : Enquête, Système, et depuis le 26/09/2026 Petit Splat classique
       (livrets « je dessine le schéma », fiche 2 : des taches, aucun jeton posé). */
    const jetonsAutour = document.getElementById('jetonsAutour');
    if (jetonsAutour) jetonsAutour.checked = readBooleanParam(params, 'jetons', true);
    const sj = parseInt(params.get('sansjetons') || '0', 10);
    sansJetonsNombre = problemType === 'classic' && sj > 0 ? Math.min(sj, 12) : 0;
    const ex = parseInt(params.get('exemple') || '0', 10);
    carteExemple = problemType === 'classic' && ex > 0 ? Math.min(ex, 12) : 0;
    ligneReponse = problemType === 'classic' && params.get('reponse') === '1';
    const dn = parseInt(params.get('donne') || '0', 10);
    carteSchemaDonne = problemType === 'classic' && dn > 0 ? Math.min(dn, 12) : 0;

    /* « Espace sous le schéma » : lu pour tous les supports, le parcours élève s'en sert aussi
       (QR des fiches 4 et 5 du livret) */
    const espaceSchema = document.getElementById('espaceSchema');
    if (espaceSchema) espaceSchema.checked = readBooleanParam(params, 'espace', false);

    if (document.getElementById('supportMode').value === 'print') {
        const showCorr = document.getElementById('showCorr');
        const hideDiagram = document.getElementById('hideDiagram');
        const nonPropDiagram = document.getElementById('nonPropDiagram');
        const activityLabel = document.getElementById('activityLabel');
        if (showCorr) showCorr.checked = readBooleanParam(params, 'correction', showCorr.checked);
        const diagram = params.get('diagram');
        const scale = params.get('scale');
        if (hideDiagram && (diagram === 'draw' || diagram === 'complete')) hideDiagram.checked = diagram === 'draw';
        if (nonPropDiagram && (scale === 'equal' || scale === 'proportional')) nonPropDiagram.checked = scale === 'equal';
        if (activityLabel && params.has('title')) activityLabel.value = params.get('title').slice(0, 160);

        isRVMode = !!(showCorr && showCorr.checked && readBooleanParam(params, 'rv', false));
        const rvBtn = document.getElementById('btnRV');
        if (rvBtn) {
            rvBtn.classList.toggle('disabled', !(showCorr && showCorr.checked));
            rvBtn.classList.toggle('active', isRVMode);
        }
    }

    updateSeedUI();
    return true;
}

function buildShareUrl() {
    const url = new URL('/splat/petit/', window.location.origin);
    const params = new URLSearchParams();
    const problemType = getProblemType();
    const supportMode = document.getElementById('supportMode').value;

    params.set('seed', activeSeed);
    params.set('support', supportMode);
    params.set('grid', document.getElementById('gridSize').value);
    params.set('problem', problemType);
    params.set('target', document.getElementById('targetVal').value);

    if (problemType === 'classic') {
        params.set('splats', document.getElementById('splatMode').value);
        params.set('exercise', document.getElementById('gameMode').value);
    } else {
        writeRelationParams(params, problemType);
        params.set('given', document.getElementById('giveOnePart').checked ? '1' : '0');
    }
    if (!jetonsAutourCoche()) params.set('jetons', '0');   /* écrit seulement décochée : les anciens liens ne bougent pas */
    else if (problemType === 'classic' && sansJetonsNombre > 0) params.set('sansjetons', String(sansJetonsNombre));
    if (problemType === 'classic' && carteExemple) params.set('exemple', String(carteExemple));
    if (problemType === 'classic' && carteSchemaDonne) params.set('donne', String(carteSchemaDonne));
    if (problemType === 'classic' && ligneReponse) params.set('reponse', '1');

    if (problemType === 'classic' && document.getElementById('espaceSchema').checked) params.set('espace', '1');

    if (supportMode === 'print') {
        const showCorr = document.getElementById('showCorr').checked;
        params.set('correction', showCorr ? '1' : '0');
        if (showCorr) params.set('rv', isRVMode ? '1' : '0');
        params.set('diagram', document.getElementById('hideDiagram').checked ? 'draw' : 'complete');
        params.set('scale', document.getElementById('nonPropDiagram').checked ? 'equal' : 'proportional');
        const title = document.getElementById('activityLabel').value.trim();
        if (title) params.set('title', title);
    }

    url.search = params.toString();
    url.hash = '';
    return url.toString();
}

/* ===== QR « je rejoue en ligne » sur chaque fiche classique (26/09/2026, demande de Gwenaël) =====
   Chaque fiche imprimée de Petit Splat classique porte, dans son cadre de consigne, le QR de
   SES cartes en version élève : même graine, donc mêmes cartes (prouvé au lot 4), comme les
   QR des livrets. Toujours présent, sans réglage. L'adresse du QR est toujours celle du site
   (une feuille imprimée ne connaît pas le serveur local) ; à l'écran, la boîte est aussi un
   lien, vers la même adresse sur le serveur qui sert la page.
   Les livrets posent déjà leur propre QR au même endroit : render.py demande qr=0. */
const QR_SITE = 'https://mathsgo.re';
const QR_FICHE_ACTIF = new URLSearchParams(window.location.search).get('qr') !== '0';

function adresseEleveFiche(origine) {
    const url = new URL('/splat/petit/', origine);
    const params = new URLSearchParams();
    params.set('support', 'eleve');
    params.set('problem', 'classic');
    params.set('target', document.getElementById('targetVal').value);
    params.set('splats', document.getElementById('splatMode').value);
    params.set('exercise', document.getElementById('gameMode').value);
    params.set('seed', activeSeed);
    /* 8 ou 9 cases : l'élève rejoue le même nombre de cartes que sur sa feuille */
    const grille = document.getElementById('gridSize').value;
    if (grille !== '3x4') params.set('grid', grille);
    if (document.getElementById('espaceSchema').checked) params.set('espace', '1');
    if (!jetonsAutourCoche()) params.set('jetons', '0');
    else if (sansJetonsNombre > 0) params.set('sansjetons', String(sansJetonsNombre));
    if (parcoursId) params.set('parcours', parcoursId);
    url.search = params.toString();
    return url.toString();
}

function ajouterQrFiche(instruction) {
    if (!QR_FICHE_ACTIF || isTBI || isEleve || getProblemType() !== 'classic') return;
    if (typeof window.qrcode !== 'function') return;   /* générateur absent : la fiche reste sans QR */
    let svg = '';
    try {
        const qr = window.qrcode(0, 'M');
        qr.addData(adresseEleveFiche(QR_SITE), 'Byte');
        qr.make();
        svg = qr.createSvgTag({ cellSize: 1, margin: 2, scalable: true });
    } catch (e) {
        return;
    }
    const txt = document.createElement('div');
    txt.className = 'txt';
    while (instruction.firstChild) txt.appendChild(instruction.firstChild);
    const lien = document.createElement('a');
    lien.className = 'qr-fiche';
    lien.href = adresseEleveFiche(window.location.origin);
    lien.target = '_blank';
    lien.rel = 'noopener';
    lien.title = 'Rejouer ces cartes en ligne (version élève)';
    lien.innerHTML = `<div class="lib">J'ai terminé<br>ma fiche,<em>je rejoue en ligne</em></div>` + svg;
    instruction.classList.add('avec-qr');
    instruction.append(txt, lien);
}

function fallbackCopyText(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
    textarea.remove();
    return copied;
}

/* « Lien copié ! » s'écrit deux secondes à la place de « graine automatique »
   (ou « graine fixée »), puis la ligne revient d'elle-même. */
function showShareFeedback(message, isError) {
    const status = document.getElementById('seedStatus');
    if (!status) return;
    status.innerText = message;
    status.classList.toggle('copied', !isError);

function readRelationParams(params) {
    const ops = params.get('ops');
    const isNew = ['ops', 'kmax', 'vocab', 'structure'].some(name => params.has(name));
    const level = params.get('level');
    if (!isNew && RELATION_LEVELS[level]) {
        const old = RELATION_LEVELS[level];
        relationLegacyLevel = level;
        document.getElementById('relOpAdd').checked = true;
        document.getElementById('relOpMult').checked = true;
        setSelectValue('relKmax', old.kmax);
        setSelectValue('relVocab', 'mix');
        setSelectValue('relStructure', old.structure);
    } else {
        if (ops) {
            const list = ops.split(',');
            const add = list.includes('add'), mult = list.includes('mult');
            if (add || mult) {
                document.getElementById('relOpAdd').checked = add;
                document.getElementById('relOpMult').checked = mult;
            }
        }
        setSelectValue('relKmax', params.get('kmax'));
        setSelectValue('relVocab', params.get('vocab'));
        setSelectValue('relStructure', params.get('structure'));
    }
    updateProblemTypeUI();

    if (relationLegacyLevel) {
        params.set('level', relationLegacyLevel);
        return;
    }
    if (problemType === 'sums3') return; /* le Système ne se règle que par la cible */
    const ops = [];
    if (document.getElementById('relOpAdd').checked) ops.push('add');
    if (document.getElementById('relOpMult').checked) ops.push('mult');
    params.set('ops', ops.join(','));
    if (ops.includes('mult')) {
        params.set('kmax', document.getElementById('relKmax').value);
        params.set('vocab', document.getElementById('relVocab').value);

    if (problemType === 'relation3') params.set('structure', document.getElementById('relStructure').value);

function startGen() {
  prepareSeedForGeneration();
  updateProblemTypeUI();

  const sizeSelect = document.getElementById('gridSize').value;
  const [cols, rows] = sizeSelect.split('x').map(Number);
  document.documentElement.style.setProperty('--cols', cols);
  document.documentElement.style.setProperty('--rows', rows);
  
  const targetMax = parseInt(document.getElementById('targetVal').value);
  const gameMode = document.getElementById('gameMode').value;
  const splatMode = document.getElementById('splatMode').value;
  const problemType = getProblemType();
  
  state = [];
  eleveIdx = 0;
  /* Sans quoi le parcours élève rejouerait les cartes d'avant : la série
     doit être reconstruite à partir des cartes qui viennent d'être générées. */
  eleveSerie = [];
  eleveResultats = [];
  eleveVues = 0;
  const totalItems = cols * rows;

  const sansJetons = !jetonsAutourCoche();
  for(let i=0; i<totalItems; i++) {
      if (problemType === 'relation2') {
          state.push(retirerJetonsSiBesoin(createRelation2Item(targetMax), sansJetons));
      } else if (problemType === 'relation3') {
          state.push(retirerJetonsSiBesoin(createRelation3Item(targetMax), sansJetons));
      } else if (problemType === 'sums3') {
          state.push(retirerJetonsSiBesoin(createSums3Item(targetMax), sansJetons));
      } else {
          /* Classique : seules les cartes « complète le schéma » perdent leurs jetons posés
             (une carte « dessine » sans jeton n'aurait plus rien à dessiner). Le tirage est
             le même, coché ou non : mêmes taches, mêmes cartes suivantes. */
          const c = createItem(gameMode, targetMax, splatMode);
          state.push(c.mode === 'find_hidden' ? retirerJetonsSiBesoin(c, sansJetons) : c);
      }
  }
  if (problemType === 'classic' && !sansJetons && sansJetonsNombre > 0) {
      const r2 = mulberry32(hashSeed(activeSeed + '|sansjetons'));
      const choix = state.map((c, i) => i).filter(i => state[i].mode === 'find_hidden' && state[i].visible > 0);
      for (let k = 0; k < sansJetonsNombre && choix.length; k++) {
          const j = Math.floor(r2() * choix.length);
          retirerJetonsSiBesoin(state[choix[j]], true);
          choix.splice(j, 1);
      }
  }
  
  renderPages();
}

function retirerJetonsSiBesoin(item, sansJetons) {

    item.visible = 0;
    item.dots = { arr: [], r: item.dots ? item.dots.r : 8 };
    return item;

function generateHiddenDotsBySplat(splats, counts, splatShape, maxTarget) {
    const W = 300, H = 200;
    let dotR = (maxTarget > 50) ? 5 : 8;
    let ctx = null;

    try {
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        ctx = canvas.getContext('2d');
    } catch (e) { return []; }

    const allHiddenDots = [];

    for (let idx = 0; idx < splats.length; idx++) {
        const s = splats[idx];
        const count = counts[idx] || 0;
        const shapeIndex = (s.pathIndex !== undefined ? s.pathIndex : splatShape) % SPLAT_SHAPES.length;
        const splatPath = new Path2D(SPLAT_SHAPES[shapeIndex]);
        ctx.lineWidth = ((dotR * 2) + 6) / s.scale;
        const placed = [];

        for (let k = 0; k < count; k++) {
            let safe = false;
            let bestDX = undefined, bestDY = undefined;
            let attempts = 0;

            while (!safe && attempts < 300) {
                attempts++;
                let localX = 150 + (rand() - 0.5) * 160;
                let localY = 100 + (rand() - 0.5) * 160;

                if (!ctx.isPointInPath(splatPath, localX, localY)) continue;
                if (ctx.isPointInStroke(splatPath, localX, localY)) continue;

                let rad = s.rot * Math.PI / 180;
                let cos = Math.cos(rad), sin = Math.sin(rad);
                let scaledX = (localX - 150) * s.scale;
                let scaledY = (localY - 100) * s.scale;
                let currentDX = (scaledX * cos - scaledY * sin) + s.cx;
                let currentDY = (scaledX * sin + scaledY * cos) + s.cy;

                bestDX = currentDX;
                bestDY = currentDY;

                let overlap = false;
                let minReqDist = dotR * 2.2;
                if (attempts > 100) minReqDist = dotR * 1.2;
                if (attempts > 200) minReqDist = 0;

                for (let p of placed) {
                    if (Math.sqrt((currentDX - p.x)**2 + (currentDY - p.y)**2) < minReqDist) { overlap = true; break; }
                }
                if (!overlap) safe = true;
            }

            if (bestDX !== undefined) {
                placed.push({x: bestDX, y: bestDY});
                allHiddenDots.push({x: bestDX, y: bestDY, r: dotR, color: s.dotColor || '#2563eb'});
            }
        }
    }
    return allHiddenDots;
}

/* Réglages des Enquêtes et du Système (26/09/2026), qui remplacent « Niveau » :
   - Indices « + − » et « × ÷ » (au moins un des deux) ;
   - Rapport max ×2 / ×3 / ×4, et Vocabulaire, quand « × ÷ » est coché ;
   - Structure (3 taches) : pivot, chaîne ou au hasard ;
   - la Cible max règle la taille des écarts (« de plus ») et, pour le Système,
     la plage des nombres cachés (20 : petits, 50 : moyens, 100 : grands).
   Une ancienne adresse « level= » rejoue l'ancien niveau à l'identique. */
const RELATION_DELTA_BY_TARGET = { 20: 6, 50: 10, 100: 12 };
const SUMS_LEVEL_BY_TARGET = { 20: 'simple', 50: 'advanced', 100: 'expert' };
const RELATION_BASE_DIVISOR = { 2: 5, 3: 6, 4: 7 };

function getRelationSettings(maxTarget) {
    const legacy = RELATION_LEVELS[relationLegacyLevel];
    if (legacy) {
        const kmax = Number(legacy.kmax);
        return {
            add: true, mult: true,
            factors: [2, 3, 4].filter(k => k <= kmax),
            deltaLimit: legacy.deltaLimit,
            baseDivisor: legacy.baseDivisor,
            structure: legacy.structure, chainRate: 0.38, pivotNoire: legacy.pivotNoire,
            vocab: 'mix',
            sumsLevel: legacy.sums
        };
    }
    const value = (id, fallback) => { const el = document.getElementById(id); return el ? el.value : fallback; };
    const addEl = document.getElementById('relOpAdd');
    const multEl = document.getElementById('relOpMult');
    let add = addEl ? addEl.checked : true;
    let mult = multEl ? multEl.checked : true;
    if (!add && !mult) { add = true; mult = true; }
    const kmax = mult ? (Number(value('relKmax', '2')) || 2) : 2;
    return {
        add, mult,
        factors: [2, 3, 4].filter(k => k <= kmax),
        deltaLimit: RELATION_DELTA_BY_TARGET[maxTarget] || 6,
        baseDivisor: RELATION_BASE_DIVISOR[kmax] || 5,
        structure: value('relStructure', 'pivot'), chainRate: 0.5, pivotNoire: false,
        vocab: mult ? value('relVocab', 'fois') : 'fois',
        sumsLevel: SUMS_LEVEL_BY_TARGET[maxTarget] || 'simple'
    };
}

function shouldGiveOnePart() {
    const el = document.getElementById('giveOnePart');
    return !!(el && el.checked);
}

function chooseGivenPartId(parts) {
    if (!shouldGiveOnePart() || !parts || !parts.length) return null;
    return parts[Math.floor(rand() * parts.length)].id;
}

function pluralJetons(n) {
    return `jeton${n > 1 ? 's' : ''}`;
}

function fractionWord(factor) {
    if (factor === 2) return 'la moitié';
    if (factor === 3) return 'le tiers';
    if (factor === 4) return 'le quart';
    return `1/${factor}`;
}

function multipleWord(factor) {
    if (factor === 2) return 'le double';
    if (factor === 3) return 'le triple';
    if (factor === 4) return 'le quadruple';
    return `${factor} fois`;
}

/* Les phrases des indices sont celles de SPLAT! mode C (26/09/2026) :
   « Sous la tache orange, il y a 3 fois plus de jetons que sous la tache noire. »
   Menu « Vocabulaire » : « fois plus / fois moins », « le double, la moitié… »
   (« Sous la tache orange, il y a le triple des jetons de la tache noire. »,
   « Sous la tache noire, il y a le tiers des jetons de la tache orange. »), ou les deux.
   Un seul tirage choisit la phrase, quel que soit le vocabulaire : les nombres
   d'une graine ne dépendent pas de ce menu. */
function multStyles(vocab) {
    if (vocab === 'mots') return ['grand-mot', 'petit-mot'];
    if (vocab === 'mix') return ['grand-fois', 'petit-fois', 'grand-mot', 'petit-mot'];
    return ['grand-fois', 'petit-fois'];
}

function multPhrase(style, bigger, smaller, factor) {
    if (style === 'petit-fois') return `Sous la tache ${smaller}, il y a ${factor} fois moins de jetons que sous la tache ${bigger}.`;
    if (style === 'grand-mot') return `Sous la tache ${bigger}, il y a ${multipleWord(factor)} des jetons de la tache ${smaller}.`;
    if (style === 'petit-mot') return `Sous la tache ${smaller}, il y a ${fractionWord(factor)} des jetons de la tache ${bigger}.`;
    return `Sous la tache ${bigger}, il y a ${factor} fois plus de jetons que sous la tache ${smaller}.`;
}

function addPhrase(style, bigger, smaller, delta) {
    const jetons = `${delta} ${pluralJetons(delta)}`;
    if (style === 'moins') return `Sous la tache ${smaller}, il y a ${jetons} de moins que sous la tache ${bigger}.`;
    return `Sous la tache ${bigger}, il y a ${jetons} de plus que sous la tache ${smaller}.`;
}

function pickStyle(styles) {
    return styles[Math.floor(rand() * styles.length)];
}

/* Un tirage « + − » ou « × ÷ » seulement si les deux sont cochés. */
function chooseRelationFamily(settings) {
    if (settings.add && settings.mult) return ['add', 'mult'][Math.floor(rand() * 2)];
    return settings.add ? 'add' : 'mult';
}

function makeRelationToReference(baseValue, otherLabel, refLabel, settings, maxTarget) {
    const family = chooseRelationFamily(settings);
    const cap = Math.max(12, maxTarget);

    if (family === 'mult') {
        const factors = settings.factors;
        const factor = factors[Math.floor(rand() * factors.length)];
        let otherValue;
        let otherIsBig = rand() > 0.35;

        if (otherIsBig) {
            otherValue = baseValue * factor;
        } else if (baseValue % factor === 0 && baseValue / factor >= 1) {
            otherValue = baseValue / factor;
        } else {
            otherIsBig = true;
            otherValue = baseValue * factor;
        }

        const bigger = otherValue > baseValue ? otherLabel : refLabel;
        const smaller = otherValue > baseValue ? refLabel : otherLabel;
        return {
            value: otherValue,
            text: multPhrase(pickStyle(multStyles(settings.vocab)), bigger, smaller, factor),
            family: 'mult',
            factor,
            from: otherLabel,
            ref: refLabel
        };
    }

    const deltaMax = Math.max(1, Math.min(settings.deltaLimit, cap - 3));
    let delta = Math.floor(rand() * deltaMax) + 1;
    let otherIsBig = rand() > 0.45;

    if (!otherIsBig && baseValue - delta < 1) otherIsBig = true;
    const otherValue = otherIsBig ? baseValue + delta : baseValue - delta;
    const bigger = otherValue > baseValue ? otherLabel : refLabel;
    const smaller = otherValue > baseValue ? refLabel : otherLabel;
    return {
        value: otherValue,
        text: addPhrase(pickStyle(['plus', 'moins']), bigger, smaller, delta),
        family: 'add',
        delta,
        from: otherLabel,
        ref: refLabel
    };
}

function relationSignature(rel) {
    return rel.family === 'mult' ? `${rel.family}:${rel.factor}` : `${rel.family}:${rel.delta}`;
}

function chooseBaseValueForRelation3(settings, cap) {
    const divisor = settings.baseDivisor;
    const baseMax = Math.max(3, Math.floor(cap / divisor) + 2);
    return Math.floor(rand() * baseMax) + 2;
}

function createRelation2Item(maxTarget) {
    // Génération pensée pour le primaire : on choisit d'abord les valeurs cachées,
    // puis on calcule le total. Ainsi le problème est toujours soluble proprement.
    const settings = getRelationSettings(maxTarget);
    const family = chooseRelationFamily(settings);
    const cap = Math.max(12, maxTarget);

    const shapeA = Math.floor(rand() * SPLAT_SHAPES.length);
    const shapeB = (shapeA + 1 + Math.floor(rand() * (SPLAT_SHAPES.length - 1))) % SPLAT_SHAPES.length;
    const rotA = Math.floor(rand() * 360);
    const rotB = (rotA + 35 + Math.floor(rand() * 120)) % 360;

    let a = 1, b = 2, visible = 0, total = 0;
    let relationText = '';
    let relationMeta = {};

    const labels = { A: 'noire', B: 'orange' };

    if (family === 'mult') {
        const factors = settings.factors;
        const factor = factors[Math.floor(rand() * factors.length)];
        const smallMax = Math.max(1, Math.floor((cap - 1) / (factor + 1)));
        const small = Math.floor(rand() * smallMax) + 1;
        const big = small * factor;
        const orangeIsBig = rand() > 0.5;
        a = orangeIsBig ? small : big;
        b = orangeIsBig ? big : small;

        const maxVisibleAllowed = Math.max(0, Math.min(20, cap - a - b));
        visible = maxVisibleAllowed >= 1 ? Math.floor(rand() * maxVisibleAllowed) + 1 : 0;
        total = a + b + visible;

        const bigger = a > b ? labels.A : labels.B;
        const smaller = a > b ? labels.B : labels.A;
        relationText = multPhrase(pickStyle(multStyles(settings.vocab)), bigger, smaller, factor);
        relationMeta = { family: 'mult', factor };
    } else {
        const deltaMax = Math.max(1, Math.min(settings.deltaLimit, cap - 3));
        const delta = Math.floor(rand() * deltaMax) + 1;
        const smallMax = Math.max(1, Math.floor((cap - delta - 1) / 2));
        const small = Math.floor(rand() * smallMax) + 1;
        const big = small + delta;
        const orangeIsBig = rand() > 0.5;
        a = orangeIsBig ? small : big;
        b = orangeIsBig ? big : small;

        const maxVisibleAllowed = Math.max(0, Math.min(20, cap - a - b));
        visible = maxVisibleAllowed >= 1 ? Math.floor(rand() * maxVisibleAllowed) + 1 : 0;
        total = a + b + visible;

        const bigger = a > b ? labels.A : labels.B;
        const smaller = a > b ? labels.B : labels.A;
        relationText = addPhrase(pickStyle(['plus', 'moins']), bigger, smaller, delta);
        relationMeta = { family: 'add', delta };
    }

    const splats = [
        { cx: 75, y: 115, cy: 115, scale: 0.62, rot: rotA, color: '#111827', dotColor: '#2563eb', label: 'noire', pathIndex: shapeA },
        { cx: 185, y: 115, cy: 115, scale: 0.62, rot: rotB, color: '#f97316', dotColor: '#2563eb', label: 'orange', pathIndex: shapeB }
    ];

    const dotsPositions = generateDotPositions(visible, maxTarget, shapeA, splats);
    const hiddenDots = generateHiddenDotsBySplat(splats, [a, b], shapeA, maxTarget);

    const parts = [
        { id: 'A', short: 'N', label: 'noire', value: a, color: '#111827' },
        { id: 'B', short: 'O', label: 'orange', value: b, color: '#ea580c' }
    ];
    const givenPartId = chooseGivenPartId(parts);

    return {
        kind: 'relation2',
        mode: 'relation2',
        total,
        visible,
        hidden: a + b,
        splatShape: shapeA,
        splats,
        dots: dotsPositions,
        hiddenDots,
        maxTargetContext: maxTarget,
        parts,
        givenPartId,
        clues: [relationText],
        relationText,
        ...relationMeta
    };
}


function createRelation3Item(maxTarget) {
    // Enquête à 3 taches : menu « Structure ».
    // Pivot : les deux indices partent de la même tache (tirée au hasard ;
    //         toujours la noire pour une ancienne adresse « level=simple »).
    // Chaîne : le second indice part de la tache trouvée avec le premier.
    // Au hasard : pivot ou chaîne.
    const settings = getRelationSettings(maxTarget);
    const cap = Math.max(18, maxTarget);
    /* Avec « × ÷ » seul et ×2 seulement, les deux indices ont forcément la même forme. */
    const canVary = settings.add || settings.factors.length > 1;
    const labels = { A: 'noire', B: 'orange', C: 'rouge' };
    const ids = ['A', 'B', 'C'];

    let values = { A: 3, B: 5, C: 6 };
    let visible = 2, total = 16;
    let clues = [];
    let structure = 'pivot-fixed';
    let pivotId = 'A';

    for (let attempt = 0; attempt < 1200; attempt++) {
        const candidateValues = {};
        const candidateClues = [];
        let candidateStructure = 'pivot-fixed';
        let candidatePivot = 'A';

        const useChain = settings.structure === 'chain' ||
            (settings.structure === 'mix' && rand() < settings.chainRate);

        if (useChain) {
            candidateStructure = 'chain';
            const order = ids.slice();
            // Mélange déterministe via rand() pour respecter la graine.
            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
            }

            const first = order[0], second = order[1], third = order[2];
            const firstValue = chooseBaseValueForRelation3(settings, cap);
            const relSecond = makeRelationToReference(firstValue, labels[second], labels[first], settings, maxTarget);
            const relThird = makeRelationToReference(relSecond.value, labels[third], labels[second], settings, maxTarget);

            candidateValues[first] = firstValue;
            candidateValues[second] = relSecond.value;
            candidateValues[third] = relThird.value;
            candidateClues.push(relSecond.text, relThird.text);
            candidatePivot = first;
        } else {
            candidateStructure = settings.pivotNoire ? 'pivot-fixed' : 'pivot-variable';
            candidatePivot = settings.pivotNoire ? 'A' : ids[Math.floor(rand() * ids.length)];
            const others = ids.filter(id => id !== candidatePivot);
            const pivotValue = chooseBaseValueForRelation3(settings, cap);
            const rel1 = makeRelationToReference(pivotValue, labels[others[0]], labels[candidatePivot], settings, maxTarget);
            const rel2 = makeRelationToReference(pivotValue, labels[others[1]], labels[candidatePivot], settings, maxTarget);

            candidateValues[candidatePivot] = pivotValue;
            candidateValues[others[0]] = rel1.value;
            candidateValues[others[1]] = rel2.value;
            candidateClues.push(rel1.text, rel2.text);

            // On évite deux indices exactement du même type numérique sur la même carte.
            if (canVary && relationSignature(rel1) === relationSignature(rel2)) continue;
        }

        const valueList = ids.map(id => candidateValues[id]);
        if (valueList.some(v => !Number.isFinite(v) || v < 2 || v > cap)) continue;
        if (new Set(valueList).size < 3) continue;

        const sumHidden = valueList.reduce((x, y) => x + y, 0);
        if (sumHidden >= cap) continue;

        const maxVisibleAllowed = Math.max(1, Math.min(18, cap - sumHidden));
        const vis = Math.floor(rand() * maxVisibleAllowed) + 1;
        if (sumHidden + vis > cap) continue;

        values = candidateValues;
        visible = vis;
        total = sumHidden + visible;
        clues = candidateClues;
        structure = candidateStructure;
        pivotId = candidatePivot;
        break;
    }

    if (!clues.length) {
        values = { A: 4, B: 8, C: 6 };
        visible = 2; total = 20;
        clues = [
            'Sous la tache orange, il y a 2\u00a0fois plus de jetons que sous la tache noire.',
            'Sous la tache rouge, il y a 2\u00a0jetons de plus que sous la tache noire.'
        ];
        structure = 'pivot-fixed';
        pivotId = 'A';
    }

    const shapeA = Math.floor(rand() * SPLAT_SHAPES.length);
    const shapeB = (shapeA + 1 + Math.floor(rand() * (SPLAT_SHAPES.length - 1))) % SPLAT_SHAPES.length;
    let shapeC = (shapeB + 1 + Math.floor(rand() * (SPLAT_SHAPES.length - 1))) % SPLAT_SHAPES.length;
    if (shapeC === shapeA) shapeC = (shapeC + 1) % SPLAT_SHAPES.length;

    const rotA = Math.floor(rand() * 360);
    const rotB = (rotA + 35 + Math.floor(rand() * 120)) % 360;
    const rotC = (rotB + 35 + Math.floor(rand() * 120)) % 360;

    // Disposition spéciale 6 cases : triangle plus ouvert, taches plus grandes et plus espacées.
    const splats = [
        // Taches plus étalées sur la largeur ; rouge remontée pour éviter la zone d'indice.
        { cx: 44,  y: 88,  cy: 88,  scale: 0.65, rot: rotA, color: '#111827', dotColor: '#2563eb', label: labels.A, pathIndex: shapeA },
        { cx: 236, y: 90,  cy: 90,  scale: 0.65, rot: rotB, color: '#f97316', dotColor: '#2563eb', label: labels.B, pathIndex: shapeB },
        { cx: 140, y: 138, cy: 138, scale: 0.59, rot: rotC, color: '#dc2626', dotColor: '#2563eb', label: labels.C, pathIndex: shapeC }
    ];

    const dotsPositions = generateDotPositions(visible, maxTarget, shapeA, splats);
    const hiddenDots = generateHiddenDotsBySplat(splats, [values.A, values.B, values.C], shapeA, maxTarget);

    const parts = [
        { id: 'A', short: 'N', label: labels.A, value: values.A, color: '#111827' },
        { id: 'B', short: 'O', label: labels.B, value: values.B, color: '#ea580c' },
        { id: 'C', short: 'R', label: labels.C, value: values.C, color: '#dc2626' }
    ];
    const givenPartId = chooseGivenPartId(parts);

    return {
        kind: 'relation3',
        mode: 'relation3',
        total,
        visible,
        hidden: values.A + values.B + values.C,
        splatShape: shapeA,
        splats,
        dots: dotsPositions,
        hiddenDots,
        maxTargetContext: maxTarget,
        structure,
        pivotId,
        parts,
        givenPartId,
        clues,
        relationText: clues.join('\n')
    };
}

function chooseValueRangeForSums(level, cap) {
    const maxByCap = Math.max(5, Math.floor((cap - 2) / 3));
    if (level === 'expert') return { min: 3, max: Math.max(6, Math.min(28, maxByCap + 10)) };
    if (level === 'advanced') return { min: 2, max: Math.max(6, Math.min(20, maxByCap + 6)) };
    return { min: 2, max: Math.max(5, Math.min(12, maxByCap + 3)) };
}

function createSums3Item(maxTarget) {
    // Défi : trois taches, indices donnés sous forme de sommes de deux taches.
    // Exemple : N + O = 15 ; O + R = 17 ; N + R = 14.
    const settings = getRelationSettings(maxTarget);
    const cap = Math.max(20, maxTarget);
    const labels = { A: 'noire', B: 'orange', C: 'rouge' };
    const shorts = { A: 'N', B: 'O', C: 'R' };

    let values = { A: 4, B: 6, C: 8 };
    let visible = 2;
    let total = 20;

    const range = chooseValueRangeForSums(settings.sumsLevel, cap);

    for (let attempt = 0; attempt < 900; attempt++) {
        const a = range.min + Math.floor(rand() * (range.max - range.min + 1));
        const b = range.min + Math.floor(rand() * (range.max - range.min + 1));
        const c = range.min + Math.floor(rand() * (range.max - range.min + 1));
        if (new Set([a, b, c]).size < 3) continue;

        const hidden = a + b + c;
        if (hidden >= cap) continue;

        const maxVisibleAllowed = Math.max(1, Math.min(18, cap - hidden));
        const vis = Math.floor(rand() * maxVisibleAllowed) + 1;
        if (hidden + vis > cap) continue;

        values = { A: a, B: b, C: c };
        visible = vis;
        total = hidden + visible;
        break;
    }

    const shapeA = Math.floor(rand() * SPLAT_SHAPES.length);
    const shapeB = (shapeA + 1 + Math.floor(rand() * (SPLAT_SHAPES.length - 1))) % SPLAT_SHAPES.length;
    let shapeC = (shapeB + 1 + Math.floor(rand() * (SPLAT_SHAPES.length - 1))) % SPLAT_SHAPES.length;
    if (shapeC === shapeA) shapeC = (shapeC + 1) % SPLAT_SHAPES.length;

    const rotA = Math.floor(rand() * 360);
    const rotB = (rotA + 35 + Math.floor(rand() * 120)) % 360;
    const rotC = (rotB + 35 + Math.floor(rand() * 120)) % 360;

    const splats = [
        { cx: 44,  y: 88,  cy: 88,  scale: 0.65, rot: rotA, color: '#111827', dotColor: '#2563eb', label: labels.A, pathIndex: shapeA },
        { cx: 236, y: 90,  cy: 90,  scale: 0.65, rot: rotB, color: '#f97316', dotColor: '#2563eb', label: labels.B, pathIndex: shapeB },
        { cx: 140, y: 138, cy: 138, scale: 0.59, rot: rotC, color: '#dc2626', dotColor: '#2563eb', label: labels.C, pathIndex: shapeC }
    ];

    const pairClues = [
        { text: `${shorts.A} + ${shorts.B} = ${values.A + values.B}`, order: rand() },
        { text: `${shorts.B} + ${shorts.C} = ${values.B + values.C}`, order: rand() },
        { text: `${shorts.A} + ${shorts.C} = ${values.A + values.C}`, order: rand() }
    ].sort((x, y) => x.order - y.order).map(x => x.text);

    const dotsPositions = generateDotPositions(visible, maxTarget, shapeA, splats);
    const hiddenDots = generateHiddenDotsBySplat(splats, [values.A, values.B, values.C], shapeA, maxTarget);

    const parts = [
        { id: 'A', short: 'N', label: labels.A, value: values.A, color: '#111827' },
        { id: 'B', short: 'O', label: labels.B, value: values.B, color: '#ea580c' },
        { id: 'C', short: 'R', label: labels.C, value: values.C, color: '#dc2626' }
    ];
    const givenPartId = chooseGivenPartId(parts);

    return {
        kind: 'sums3',
        mode: 'sums3',
        total,
        visible,
        hidden: values.A + values.B + values.C,
        splatShape: shapeA,
        splats,
        dots: dotsPositions,
        hiddenDots,
        maxTargetContext: maxTarget,
        structure: 'pair-sums',
        parts,
        givenPartId,
        clues: pairClues,
        relationText: pairClues.join('\n')
    };
}

function createItem(mode, maxTarget, splatMode) {
    let actualMode = mode === 'mix' ? (rand() > 0.5 ? 'find_hidden' : 'construct') : mode;
    let clueGiven = rand() > 0.5 ? 'visible' : 'hidden';

    let numSplats = 1;
    if (splatMode === 'mix') {
        numSplats = Math.floor(rand() * 5) + 2; 
    } else if (splatMode === 'mix4') {
        /* « Mélange (2 à 4) » (26/09/2026, livrets « je dessine le schéma », fiche 4) :
           le même nombre de tirages que « 2 à 6 », pour monter doucement vers le mélange. */
        numSplats = Math.floor(rand() * 3) + 2;
    } else {
        numSplats = parseInt(splatMode);
    }

    let maxHiddenPerSplat = Math.max(1, Math.floor(maxTarget / numSplats));
    let hiddenPerSplat = Math.floor(rand() * maxHiddenPerSplat) + 1;
    let hidden = hiddenPerSplat * numSplats;

    let maxVisibleAllowed = Math.min(maxTarget - hidden, 20);
    if (maxVisibleAllowed < 0) maxVisibleAllowed = 0;
    let visible = Math.floor(rand() * (maxVisibleAllowed + 1));
    
    let total = hidden + visible;

    const splatShape = Math.floor(rand() * SPLAT_SHAPES.length);
    const splatRot = Math.floor(rand() * 360);

    const layouts = {
        1: [{x: 135, y: 110, s: 0.85}],
        2: [{x: 75, y: 115, s: 0.6}, {x: 185, y: 115, s: 0.6}],
        3: [{x: 55, y: 125, s: 0.45}, {x: 135, y: 125, s: 0.45}, {x: 215, y: 125, s: 0.45}],
        4: [{x: 75, y: 85, s: 0.4}, {x: 185, y: 85, s: 0.4}, {x: 75, y: 155, s: 0.4}, {x: 185, y: 155, s: 0.4}],
        5: [{x: 55, y: 85, s: 0.35}, {x: 195, y: 85, s: 0.35}, {x: 125, y: 120, s: 0.35}, {x: 55, y: 160, s: 0.35}, {x: 195, y: 160, s: 0.35}],
        6: [{x: 55, y: 90, s: 0.35}, {x: 125, y: 90, s: 0.35}, {x: 195, y: 90, s: 0.35}, {x: 55, y: 160, s: 0.35}, {x: 125, y: 160, s: 0.35}, {x: 195, y: 160, s: 0.35}]
    };
    
    let splats = layouts[numSplats].map(l => ({ cx: l.x, cy: l.y, scale: l.s, rot: splatRot }));
    const dotsPositions = generateDotPositions(visible, maxTarget, splatShape, splats);
    const hiddenDots = generateHiddenDots(splats, hiddenPerSplat, splatShape, maxTarget);

    return { 
        total, visible, hidden, numSplats, hiddenPerSplat,
        mode: actualMode, clueGiven, splatShape, splats,
        dots: dotsPositions, hiddenDots: hiddenDots, maxTargetContext: maxTarget
    };
}

function generateHiddenDots(splats, countPerSplat, splatShape, maxTarget) {
    const W = 300, H = 200;
    let dotR = (maxTarget > 50) ? 5 : 8;
    let ctx = null, splatPath = null;

    try {
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        ctx = canvas.getContext('2d');
        splatPath = new Path2D(SPLAT_SHAPES[splatShape % SPLAT_SHAPES.length]);
    } catch (e) { return []; }

    const allHiddenDots = [];
    
    for (let s of splats) {
        // CORRECTION ICI : La ligne virtuelle qui repousse les jetons s'adapte à l'échelle de la tache
        // pour garantir qu'aucune bille ne dépasse, même si la tache est très petite !
        ctx.lineWidth = ((dotR * 2) + 6) / s.scale; 

        const placed = [];
        for (let k = 0; k < countPerSplat; k++) {
            let safe = false;
            let bestDX = undefined, bestDY = undefined;
            let attempts = 0;
            
            while (!safe && attempts < 300) {
                attempts++;
                let localX = 150 + (rand() - 0.5) * 160;
                let localY = 100 + (rand() - 0.5) * 160;
                
                if (!ctx.isPointInPath(splatPath, localX, localY)) continue;
                if (ctx.isPointInStroke(splatPath, localX, localY)) continue;
                
                let rad = s.rot * Math.PI / 180;
                let cos = Math.cos(rad), sin = Math.sin(rad);
                let scaledX = (localX - 150) * s.scale;
                let scaledY = (localY - 100) * s.scale;
                let currentDX = (scaledX * cos - scaledY * sin) + s.cx;
                let currentDY = (scaledX * sin + scaledY * cos) + s.cy;

                bestDX = currentDX;
                bestDY = currentDY;

                let overlap = false;
                let minReqDist = dotR * 2.2; 
                if (attempts > 100) minReqDist = dotR * 1.2; 
                if (attempts > 200) minReqDist = 0; 

                for (let p of placed) {
                    if (Math.sqrt((currentDX - p.x)**2 + (currentDY - p.y)**2) < minReqDist) { overlap = true; break; }
                }
                if (!overlap) safe = true;
            }
            
            if (bestDX !== undefined) {
                placed.push({x: bestDX, y: bestDY});
                allHiddenDots.push({x: bestDX, y: bestDY, r: dotR});
            }
        }
    }
    return allHiddenDots;
}


function generateDotPositions(count, maxTarget, splatShape, splats) {
    const W = 300, H = 200;
    let dotR = (maxTarget > 50) ? 5 : 8;
    let canTestSplat = false, ctx = null, splatPath = null;

    function inverseTransform(px, py, cx, cy, rot, scale) {
        let dx = px - cx, dy = py - cy;
        let rad = -rot * Math.PI / 180;
        let cos = Math.cos(rad), sin = Math.sin(rad);
        let rx = dx * cos - dy * sin;
        let ry = dx * sin + dy * cos;
        return { x: (rx / scale) + 150, y: (ry / scale) + 100 };
    }

    try {
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        ctx = canvas.getContext('2d');
        splatPath = new Path2D(SPLAT_SHAPES[splatShape % SPLAT_SHAPES.length]);
        canTestSplat = !!ctx && !!splatPath;
    } catch (e) { canTestSplat = false; }

    const placed = [];
    
    for (let k = 0; k < count; k++) {
        let bestCand = null;
        let maxMinDist = -1;
        
        for (let c = 0; c < 40; c++) {
            let dX = 15 + rand() * (W - 30);
            let dY = 15 + rand() * (H - 30);

            if (dX > 220 && dY < 80) continue;

            let touchSplat = false;
            if (canTestSplat) {
                for(let s of splats) {
                    let p = inverseTransform(dX, dY, s.cx, s.cy, s.rot, s.scale);
                    const shapeIndex = (s.pathIndex !== undefined ? s.pathIndex : splatShape) % SPLAT_SHAPES.length;
                    const testPath = new Path2D(SPLAT_SHAPES[shapeIndex]);
                    ctx.lineWidth = ((dotR * 2) + 12) / s.scale; 
                    if (ctx.isPointInPath(testPath, p.x, p.y) || ctx.isPointInStroke(testPath, p.x, p.y)) { touchSplat = true; break; }
                }
            } else {
                for(let s of splats) {
                    let dist = Math.sqrt((dX - s.cx)**2 + (dY - s.cy)**2);
                    if (dist < 90 * s.scale) { touchSplat = true; break; }
                }
            }
            if (touchSplat) continue;

            if (placed.length === 0) {
                bestCand = {x: dX, y: dY};
                break;
            }

            let minDist = 9999;
            for (let p of placed) {
                let distP = Math.sqrt((dX - p.x)**2 + (dY - p.y)**2);
                if (distP < minDist) minDist = distP;
            }

            if (minDist > maxMinDist) {
                maxMinDist = minDist;
                bestCand = {x: dX, y: dY};
            }
        }
        
        if (bestCand) placed.push(bestCand);
    }
    return { arr: placed, r: dotR };
}

    }
    if (problemType === 'relation3') {
        return `<div class="activity-instruction-title">Pour chaque carte :</div>
                <div class="activity-instruction-line">- observe le total, les jetons visibles et les deux indices,</div>
                <div class="activity-instruction-line">- complète le schéma en barres,</div>
                <div class="activity-instruction-line">- trouve combien de jetons cache chaque tache.</div>`;
    }

                <div class="activity-instruction-line">- complète le schéma en barres,</div>

                <div class="activity-instruction-line">- observe le schéma en barres,</div>
                <div class="activity-instruction-line">- complète le dessin et le schéma.</div>`;

                <div class="activity-instruction-line">- observe les informations données,</div>
                <div class="activity-instruction-line">- complète ce qui manque dans le dessin ou le schéma en barres.</div>`;

        /* « Schéma à tracer » (26/09/2026, livrets « je dessine le schéma ») : le schéma n'est
           pas imprimé, la consigne dit donc de le dessiner. */
        const hd = document.getElementById('hideDiagram');
        const verbe = hd && hd.checked ? 'dessine le schéma en barres, puis' : 'complète le schéma en barres,';

        html += `<div class="activity-instruction-note">Lorsque plusieurs taches apparaissent, elles cachent le même nombre de jetons.</div>`;

function echapperHtml(texte) {
    return String(texte == null ? '' : texte)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

    const splatPart = document.createElement('div');
    splatPart.className = 'part-splat';
    let htmlContent = getSplatSvg(item, showVisualDots, hideVisualDotsUntilReveal, showHiddenDots);
    htmlContent += `<div class="total-badge">${item.total}</div>`;
    splatPart.innerHTML = htmlContent;
    cell.appendChild(splatPart);

    const clues = item.clues || (item.relationText ? [item.relationText] : []);
    const clue = document.createElement('div');
    clue.className = 'relation-clue' + (item.kind === 'relation3' ? ' relation-clue-3' : '');
    clue.innerHTML = clues.map(t => `<div>${t}</div>`).join('');
    cell.appendChild(clue);

    const diag = document.createElement('div');
    diag.className = 'diagram-container relation-diagram';

    /* « Schéma à tracer » (26/09/2026, Gwenaël) : le schéma est construit puis rendu
       INVISIBLE, au lieu d'être retiré. Retiré, sa case retombait à 64 px et le dessin
       grossissait d'environ 7 mm, alors que le but est justement de laisser toute la
       place pour tracer : le dessin garde exactement la même taille, coché ou non. */
    const aTracer = hideDiagram && !isCorrectionPage && !isTBI;
    if (aTracer) diag.classList.add('schema-a-tracer');

    // Sur la fiche élève, le total du schéma est à compléter :
    // il est déjà donné sur le plateau, dans le badge. On ne le remplit qu'en correction.
    /* Interactif (26/09/2026) : le schéma se remplit au clic sur la carte, comme dans le
       classique ; avant, les réponses y étaient écrites dès l'affichage. La tache donnée
       (« Une tache donnée ») reste visible. */
    const revealParts = isTBI && !isCorrectionPage;
    const displayTotal = isCorrectionPage ? item.total : (revealParts ? getRelationValueDisplay(item.total, true) : '');
    const displayVis = isCorrectionPage ? item.visible : (revealParts ? getRelationValueDisplay(item.visible, true) : '');

    const minCol = item.parts.length >= 3 ? 27 : 34;
    const flexVis = isNonProp ? 1 : Math.max(item.visible, item.total * 0.05, 1);
    const partFlexes = item.parts.map(p => isNonProp ? 1 : Math.max(p.value, item.total * 0.05, 1));
    const relationCols = `${item.visible > 0 ? `minmax(${minCol}px, ${flexVis}fr) ` : ''}${partFlexes.map(f => `minmax(${minCol}px, ${f}fr)`).join(' ')}`;

    const partBoxes = item.parts.map((p, idx) => {
        const isGivenPart = item.givenPartId === p.id;
        const display = isCorrectionPage ? p.value : (isGivenPart ? p.value : (isTBI ? p.value : ''));
        const givenClass = isGivenPart && !isCorrectionPage ? ' relation-given-part' : '';
        return `<div class="relation-part-box relation-${p.id.toLowerCase()}${givenClass}"><div class="relation-part-value">${getRelationValueDisplay(display, revealParts && !isGivenPart)}</div></div>`;
    }).join('');

    const partLabels = item.parts.map(p => {
        const short = p.short || (p.id === 'A' ? 'N' : (p.id === 'B' ? 'O' : p.id));
        return `<div class="relation-label relation-label-${p.id.toLowerCase()}">${short}</div>`;
    }).join('');

    diag.innerHTML = `
        <div class="diagram-inner" style="--rel-cols:${relationCols};">
            <div class="row-top" style="font-size: 18px;">${displayTotal}</div>
            <div class="relation-row-bottom">
                ${item.visible > 0 ? `<div class="relation-part-box relation-visible"><div class="relation-part-value">${displayVis}</div></div>` : ''}
                ${partBoxes}
            </div>
        </div>
        <div class="relation-label-row" style="--rel-cols:${relationCols};">
            ${item.visible > 0 ? `<div class="relation-label relation-label-visible">V</div>` : ''}
            ${partLabels}
        </div>`;

    cell.appendChild(diag);
}

        const estExemple = carteExemple && hideDiagram && !isCorrectionPage && !isTBI
