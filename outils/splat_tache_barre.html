function getSplatSvg(item, drawDots, hideVisibleDotsUntilReveal = false, forceHiddenDots = false) {
    const W = 300, H = 200;
    const defaultPathData = SPLAT_SHAPES[item.splatShape % SPLAT_SHAPES.length];
    
    let svg = `<svg class="splat-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
    
    if ((isTBI || forceHiddenDots) && item.hiddenDots && item.hiddenDots.length > 0) {
        const hiddenClass = (isTBI && forceHiddenDots && !document.body.classList.contains('print-only')) ? ' class="solution-dot"' : '';
        for(let p of item.hiddenDots) {
             const dotFill = p.color || '#2563eb';
             svg += `<circle${hiddenClass} cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${dotFill}" stroke="#1e40af" stroke-width="0.5"/>`;
        }
    }

    if (drawDots && item.visible > 0) {
        const dotClass = hideVisibleDotsUntilReveal ? ' class="solution-dot"' : '';
        for(let p of item.dots.arr) {
             svg += `<circle${dotClass} cx="${p.x}" cy="${p.y}" r="${item.dots.r}" fill="#2563eb" stroke="#1e40af" stroke-width="0.5"/>`;
        }
    }
    
    for(let s of item.splats) {
        const splatFill = s.color || getComputedStyle(document.documentElement).getPropertyValue('--splat').trim();
        const shapeIndex = s.pathIndex !== undefined ? s.pathIndex : item.splatShape;
        const pathData = SPLAT_SHAPES[shapeIndex % SPLAT_SHAPES.length] || defaultPathData;
        svg += `<g transform="translate(${s.cx}, ${s.cy}) scale(${s.scale}) rotate(${s.rot}) translate(-150, -100)">`;
        svg += `<path class="splat-path" d="${pathData}" fill="${splatFill}" filter="drop-shadow(3px 3px 2px rgba(0,0,0,0.3))" />`;
        svg += `</g>`;
    }

    svg += `</svg>`;
    return svg;
}


/* ===== Parcours élève : l'élève remplit le schéma, la page valide =====
   Réservé au « Petit Splat classique » pour l'instant. La réussite d'une série
   est mémorisée dans le navigateur (clé partagée avec la carte des mondes)
   quand l'adresse porte ?parcours=identifiant. */
const ELEVE_STORE_KEY = 'mathsgo-splat-parcours';

function eleveEnregistrerReussite(sansFaute, total) {
    if (!parcoursId || !total) return;
    try {
        const tout = JSON.parse(localStorage.getItem(ELEVE_STORE_KEY) || '{}');
        tout[parcoursId] = { fait: true, etoiles: sansFaute, cartes: total, date: new Date().toISOString().slice(0, 10) };
        localStorage.setItem(ELEVE_STORE_KEY, JSON.stringify(tout));
    } catch (e) { /* stockage indisponible : le jeu reste jouable */ }
}

const ELEVE_MINI_TACHE = '<svg class="miniTache" viewBox="40 10 220 180" aria-hidden="true"><path d="' + SPLAT_SHAPES[0] + '" fill="#111827"/></svg>';

function eleveCaseInput(attendu, flexGrow, minW, fSize, fond, isTop, avecTache) {
    const cls = isTop ? 'row-top' : 'part-box';
    const style = isTop
        ? `font-size: ${fSize};`
        : `flex-grow: ${flexGrow}; flex-basis: 0; background: ${fond}; min-width: ${minW}; font-size: ${fSize};`;
    return `<div class="${cls} eleve-case${avecTache ? ' avec-tache' : ''}${(!isTop && !avecTache) ? ' eleve-vis' : ''}" style="${style}" data-attendu="${attendu}">` +
           (avecTache ? ELEVE_MINI_TACHE : '') +
           `<input class="eleve-input" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="?"></div>`;
}

function eleveDansUneTache(item, x, y) {
    try {
        const canvas = document.createElement('canvas');
        canvas.width = 300; canvas.height = 200;
        const ctx = canvas.getContext('2d');
        for (const s of item.splats) {
            const shapeIndex = s.pathIndex !== undefined ? s.pathIndex : item.splatShape;
            const path = new Path2D(SPLAT_SHAPES[shapeIndex % SPLAT_SHAPES.length]);
            const rad = -s.rot * Math.PI / 180;
            const dx = (x - s.cx) / s.scale, dy = (y - s.cy) / s.scale;
            const lx = dx * Math.cos(rad) - dy * Math.sin(rad) + 150;
            const ly = dx * Math.sin(rad) + dy * Math.cos(rad) + 100;
            if (ctx.isPointInPath(path, lx, ly)) return true;
        }
    } catch (e) { /* sans canvas, on ne bloque pas le jeu */ }
    return false;
}

function eleveRayonJeton(item) {
    return (item.dots && item.dots.r) ? item.dots.r : ((item.maxTargetContext > 50) ? 5 : 8);
}

function eleveRedessinerJetons(svg, r) {
    svg.querySelectorAll('.eleve-jeton').forEach(c => c.remove());
    for (const j of eleveJetonsPoses) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', j.x); c.setAttribute('cy', j.y); c.setAttribute('r', r);
        c.setAttribute('fill', '#2563eb'); c.setAttribute('stroke', '#1e40af'); c.setAttribute('stroke-width', '0.5');
        c.classList.add('eleve-jeton');
        svg.appendChild(c);
    }
}

function eleveBrancherDessin(scene, item) {
    const svg = scene.querySelector('.part-splat svg.splat-svg');
    if (!svg) return;
    svg.classList.add('eleve-dessin');
    const r = eleveRayonJeton(item);
    svg.addEventListener('pointerdown', ev => {
        const bouton = document.getElementById('eleveValider');
        if (!bouton || bouton.disabled) return;
        ev.preventDefault();
        const pt = svg.createSVGPoint();
        pt.x = ev.clientX; pt.y = ev.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        if (p.x < 12 || p.x > 288 || p.y < 12 || p.y > 188) return;
        const deja = eleveJetonsPoses.findIndex(j => Math.hypot(j.x - p.x, j.y - p.y) <= r * 1.8);
        const msg = document.getElementById('eleveMsg');
        if (deja >= 0) {
            eleveJetonsPoses.splice(deja, 1);
        } else if (eleveDansUneTache(item, p.x, p.y)) {
            if (msg) { msg.textContent = 'Sous une tache, on ne voit pas les jetons !'; msg.className = 'eleve-msg rate'; }
            return;
        } else {
            eleveJetonsPoses.push({ x: p.x, y: p.y });
            if (msg && msg.textContent) { msg.textContent = ''; msg.className = 'eleve-msg'; }
        }
        eleveRedessinerJetons(svg, r);
    });
}

/* Une pastille par carte : verte = du premier coup, orange = après correction,
   rouge = réponse montrée (à rejouer), grise = faite (ancienne reprise sans
   détail), contour bleu = en cours. L'étoile récompense l'étape entière sur
   la carte des mondes, et ne s'allume que sans carte rouge. */
function elevePastilleClasse(r) { return r === true ? ' ok' : (r === false ? ' retry' : (r === 'ko' ? ' ko' : ' fait')); }
function elevePastillesHtml() {
    let out = '';
    for (let i = 0; i < eleveSerie.length; i++) {
        let cls = 'p';
        if (i < eleveResultats.length && eleveResultats[i] != null) cls += elevePastilleClasse(eleveResultats[i]);
        else if (i < eleveResultats.length) cls += ' fait';
        if (i === eleveIdx && eleveIdx < eleveSerie.length) cls += ' cur';
        out += `<i class="${cls}"></i>`;
    }
    const faites = Math.min(eleveResultats.length, eleveSerie.length);
    return `<span class="eleve-pastilles" role="img" aria-label="${faites} carte${faites > 1 ? 's' : ''} faite${faites > 1 ? 's' : ''} sur ${eleveSerie.length}">${out}</span>`;
}

function renderEleve(main) {
    main.innerHTML = '';
    if (getProblemType() !== 'classic') {
        main.innerHTML = '<div class="eleve-scene"><p class="eleve-consigne">Le parcours élève n\u2019existe pas encore pour les enquêtes et relations.<br>Choisis « Petit Splat classique » pour y jouer dès maintenant.</p></div>';
        return;
    }
    if (eleveIdx === 0 && eleveSerie.length === 0) {
        /* La série suit la fiche : toutes les cartes de la mise en page
           (12 en 3×4, 9 en 3×3…), dans le même ordre. */
        eleveSerie = state.slice();
        eleveEtoiles = 0; eleveResultats = [];
        /* série interrompue la dernière fois ? on reprend où on en était */
        if (eleveSerie.length && !eleveRepriseFaite && parcoursId) {
            eleveRepriseFaite = true;
            try {
                /* répare les entrées écrites par l'ancien bug : « réussi » sans aucune carte */
                const tout = JSON.parse(localStorage.getItem(ELEVE_STORE_KEY) || '{}');
                if (tout[parcoursId] && tout[parcoursId].fait && !tout[parcoursId].cartes) {
                    delete tout[parcoursId];
                    localStorage.setItem(ELEVE_STORE_KEY, JSON.stringify(tout));
                }
                const entree = (JSON.parse(localStorage.getItem(ELEVE_STORE_KEY) || '{}'))[parcoursId];
                if (entree && entree.enCours && Number.isInteger(entree.enCours.idx) &&
                    entree.enCours.idx > 0 && entree.enCours.idx < eleveSerie.length) {
                    eleveIdx = entree.enCours.idx;
                    eleveEtoiles = Number(entree.enCours.etoiles) || 0;
                    /* reprise : cartes faites sans le détail par carte */
                    /* reprise : le détail par carte est mémorisé, sinon pastilles grises */
                    const res = Array.isArray(entree.enCours.res) ? entree.enCours.res : [];
                    eleveResultats = Array.from({ length: eleveIdx }, (_, i) => (res[i] === true || res[i] === false || res[i] === 'ko') ? res[i] : null);
                }
            } catch (e) { /* stockage indisponible */ }
        }
    }
    if (!eleveSerie.length) { return; } /* pas encore de cartes générées */
    if (eleveIdx >= eleveSerie.length) { renderEleveFin(main); return; }

    const item = eleveSerie[eleveIdx];
    eleveCarteFautee = false;
    eleveEchecs = 0;
    const scene = document.createElement('div');
    scene.className = 'eleve-scene';

    let html = `<div class="eleve-tete">${eleveLienMondesHtml()}<span>Carte ${eleveIdx + 1} / ${eleveSerie.length}</span>` +
               `${elevePastillesHtml()}</div>`;

    const estConstruct = item.mode === 'construct';
    eleveItemCourant = item;
    eleveJetonsPoses = [];
    const consigne = estConstruct
        ? 'Pose les jetons sur la carte (touche pour poser, retouche pour enlever), complète le schéma, puis Valider.'
        : 'Observe la carte et complète le schéma en barres, puis Valider.';
    html += `<div class="eleve-consigne">${consigne}</div>`;

    const badge = estConstruct
        ? `<div class="total-badge eleve-case" data-attendu="${item.total}">` +
          `<input class="eleve-input" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="?"></div>`
        : `<div class="total-badge">${item.total}</div>`;
    const splatPart = `<div class="part-splat">` +
        getSplatSvg(item, !estConstruct, false, true) + badge + `</div>`; /* jetons cachés dessinés sous la tache, dévoilés à la correction */
    html += splatPart;

    const flexVis = Math.max(item.visible, item.total * 0.05, 1);
    const flexHid = Math.max(item.hiddenPerSplat, item.total * 0.05, 1);
    const minW = item.numSplats >= 4 ? '25px' : '40px';
    const fSize = item.numSplats >= 4 ? '16px' : '20px';

    let haut, basVis = '', basTaches = '';
    if (estConstruct) {
        haut = `<div class="row-top" style="font-size: ${fSize};">${item.total}</div>`;
        const indiceVisible = item.clueGiven === 'visible';
        if (item.visible > 0) {
            basVis = indiceVisible
                ? `<div class="part-box" style="flex-grow: ${flexVis}; flex-basis: 0; background: white; color: #2563eb; min-width: ${minW}; font-size: ${fSize};">${item.visible}</div>`
                : eleveCaseInput(item.visible, flexVis, minW, fSize, 'white', false);
        }
        for (let i = 0; i < item.numSplats; i++) {
            basTaches += indiceVisible
                ? eleveCaseInput(item.hiddenPerSplat, flexHid, minW, fSize, '#d4deea', false, true)
                : `<div class="part-box avec-tache" style="flex-grow: ${flexHid}; flex-basis: 0; background: #d4deea; color: #111827; min-width: ${minW}; font-size: ${fSize};">${ELEVE_MINI_TACHE}${item.hiddenPerSplat}</div>`;
        }
    } else {
        haut = eleveCaseInput(item.total, 1, minW, fSize, 'white', true);
        if (item.visible > 0) basVis = eleveCaseInput(item.visible, flexVis, minW, fSize, 'white', false);
        for (let i = 0; i < item.numSplats; i++) basTaches += eleveCaseInput(item.hiddenPerSplat, flexHid, minW, fSize, '#d4deea', false, true);
    }

    html += `<div class="diagram-container"><div class="diagram-inner">${haut}` +
            `<div class="row-bottom">${basVis}${basTaches}</div></div></div>`;

    html += `<div class="eleve-msg" id="eleveMsg"></div>` +
            `<div class="eleve-actions"><button class="eleve-valider" id="eleveValider" type="button">Valider</button></div>`;

    scene.innerHTML = html;
    main.appendChild(scene);

    if (estConstruct) eleveBrancherDessin(scene, item);
    const premierChamp = scene.querySelector('.eleve-input');
    if (premierChamp) premierChamp.focus();
    scene.querySelectorAll('.eleve-input').forEach(inp => {
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') eleveValider(main); });
        inp.addEventListener('input', () => {
            const c = inp.closest('.eleve-case');
            if (c) c.classList.remove('eleve-ko');
        });
    });
    document.getElementById('eleveValider').onclick = () => eleveValider(main);
    eleveCalerBadge(scene);
}

/* Grand écran seulement : le badge « total » se cale sur le coin haut-droit de la zone
   dessinée (tache + jetons) au lieu du coin du cadre, où il flottait loin du plateau. */
function eleveCalerBadge(scene) {
    const part = scene.querySelector('.part-splat');
    const svg = part && part.querySelector('svg.splat-svg');
    const badge = part && part.querySelector('.total-badge');
    if (!part || !svg || !badge) return;
    const caler = () => {
        /* téléphone et petits écrans : rien ne bouge, le badge garde sa place d'origine */
        if (!window.matchMedia('(min-width: 1000px) and (min-height: 700px)').matches) { badge.style.top = ''; badge.style.right = ''; return; }
        const rp = part.getBoundingClientRect(), rs = svg.getBoundingClientRect();
        /* zone réellement dessinée : viewBox 300×200 ajustée « meet » dans le svg */
        const k = Math.min(rs.width / 300, rs.height / 200);
        const w = 300 * k, h = 200 * k;
        const top = (rs.top - rp.top) + (rs.height - h) / 2;
        const right = (rp.right - rs.right) + (rs.width - w) / 2;
        badge.style.top = Math.max(0, Math.round(top)) + 'px';
        badge.style.right = Math.max(0, Math.round(right)) + 'px';
    };
    caler();
    if (!eleveCalerBadge._lie) { eleveCalerBadge._lie = true; window.addEventListener('resize', () => { const sc = document.querySelector('.eleve-scene'); if (sc) eleveCalerBadge(sc); }); }
}

function eleveValider(main) {
    const bouton = document.getElementById('eleveValider');
    if (!bouton || bouton.disabled) return;
    const cases = Array.from(document.querySelectorAll('.eleve-case'));
    const msg = document.getElementById('eleveMsg');
    let toutJuste = true;
    cases.forEach(c => {
        const attendu = parseInt(c.getAttribute('data-attendu'), 10);
        const inp = c.querySelector('.eleve-input');
        const repondu = parseInt(String(inp.value).trim(), 10);
        const juste = Number.isFinite(repondu) && repondu === attendu;
        c.classList.toggle('eleve-ko', !juste);
        c.classList.toggle('eleve-ok', juste);
        if (!juste) toutJuste = false;
    });
    let jetonsFaux = false;
    if (eleveItemCourant && eleveItemCourant.mode === 'construct') {
        jetonsFaux = eleveJetonsPoses.length !== eleveItemCourant.visible;
        if (jetonsFaux) toutJuste = false;
    }
    if (toutJuste) {
        /* une carte rejouée après « Voir la réponse » devient orange, jamais verte */
        const etaitRouge = eleveResultats[eleveIdx] === 'ko';
        if (!eleveCarteFautee && !etaitRouge) eleveEtoiles++;
        eleveResultats[eleveIdx] = !eleveCarteFautee && !etaitRouge;
        bouton.disabled = true;
        msg.textContent = eleveCarteFautee ? 'Juste ! Regarde sous la tache\u2026' : 'Bravo, du premier coup ! Regarde sous la tache\u2026';
        msg.className = 'eleve-msg bravo';
        cases.forEach(c => { const i = c.querySelector('.eleve-input'); if (i) i.readOnly = true; });
        eleveSauverEnCours();
        eleveDevoilerTache();
        /* comme aux mondes 3-4 : l'élève regarde ce qu'il a fait et enchaîne quand il veut
           (le bouton a le focus : Entrée suffit) */
        const suivant = document.createElement('button');
        suivant.type = 'button'; suivant.className = 'eleve-suivant';
        suivant.textContent = 'Carte suivante \u25b6';
        suivant.onclick = () => eleveCarteSuivante(main);
        bouton.parentNode.appendChild(suivant);
        suivant.focus();
    } else {
        eleveCarteFautee = true;
        eleveEchecs++;
        const badgeVide = cases.some(c => {
            if (!c.classList.contains('total-badge')) return false;
            const i = c.querySelector('.eleve-input');
            return !String(i && i.value || '').trim();
        });
        if (badgeVide) {
            msg.textContent = 'La petite case en haut \u00e0 droite est \u00e0 remplir !';
        } else if (jetonsFaux && cases.every(c => c.classList.contains('eleve-ok'))) {
            msg.textContent = 'Les cases sont justes\u2026 mais compte bien tes jetons !';
        } else {
            msg.textContent = 'Pas encore\u2026 corrige ce qui est en rouge et revalide !';
        }
        msg.className = 'eleve-msg rate';
        /* au 3e échec, on propose de voir la réponse (la carte restera rouge) */
        if (eleveEchecs >= ELEVE_ECHECS_MAX && !document.getElementById('eleveVoir')) {
            const actions = bouton.parentNode;
            const voir = document.createElement('button');
            voir.type = 'button'; voir.id = 'eleveVoir'; voir.className = 'eleve-secondaire';
            voir.textContent = 'Voir la r\u00e9ponse';
            voir.onclick = () => eleveMontrerReponse(main);
            actions.appendChild(voir);
        }
    }
}

/* Vérification : la tache devient transparente et laisse voir les jetons
   qu'elle cachait, comme quand on clique sur une carte en usage libre. */
function eleveDevoilerTache() {
    const part = document.querySelector('.eleve-scene .part-splat');
    if (part) part.classList.add('devoile');
}

/* Lien vers la carte des mondes (seulement quand on vient du parcours). */
function eleveLienMondesHtml(classe) {
    if (!parcoursId) return '';
    return `<a class="${classe || 'eleve-mondes'}" href="${ELEVE_URL_MONDES}" title="Retour \u00e0 la carte des mondes">\u25c0 <span class="txt">Carte des mondes</span></a>`;
}

/* Sauvegarde « en cours » : l'indice de la prochaine carte + le détail des pastilles. */
function eleveSauverEnCours() {
    if (!parcoursId || eleveRejeu) return;
    if (eleveIdx + 1 >= eleveSerie.length) return; /* la fin de série gère l'enregistrement */
    try {
        const tout = JSON.parse(localStorage.getItem(ELEVE_STORE_KEY) || '{}');
        tout[parcoursId] = Object.assign({}, tout[parcoursId] || {}, { enCours: { idx: eleveIdx + 1, etoiles: eleveEtoiles, res: eleveResultats.slice(0, eleveIdx + 1) } });
        localStorage.setItem(ELEVE_STORE_KEY, JSON.stringify(tout));
    } catch (e) { /* stockage indisponible */ }
}

/* Carte suivante : dans l'ordre, ou la prochaine carte rouge quand on les rejoue. */
function eleveCarteSuivante(main) {
    if (eleveRejeu) {
        if (eleveRejeu.length) { eleveIdx = eleveRejeu.shift(); }
        else { eleveRejeu = null; eleveIdx = eleveSerie.length; }
    } else {
        eleveIdx++;
    }
    renderEleve(main);
}

/* L'élève bloqué voit la réponse : les cases se remplissent en rouge, la
   pastille devient rouge, et il passe à la carte suivante quand il veut. */
function eleveMontrerReponse(main) {
    const bouton = document.getElementById('eleveValider');
    const voir = document.getElementById('eleveVoir');
    const msg = document.getElementById('eleveMsg');
    if (!bouton) return;
    document.querySelectorAll('.eleve-case').forEach(c => {
        const inp = c.querySelector('.eleve-input');
        if (inp) { inp.value = c.getAttribute('data-attendu'); inp.readOnly = true; }
        c.classList.remove('eleve-ko', 'eleve-ok');
        c.classList.add('eleve-montre');
    });
    const item = eleveItemCourant;
    let texte = 'Voil\u00e0 la r\u00e9ponse. Regarde bien, tu pourras rejouer cette carte \u00e0 la fin.';
    if (item && item.mode === 'construct') texte = `Il fallait poser ${item.visible} jeton${item.visible > 1 ? 's' : ''}. ` + texte;
    msg.textContent = texte;
    msg.className = 'eleve-msg rate';
    eleveResultats[eleveIdx] = 'ko';
    eleveSauverEnCours();
    eleveDevoilerTache();
    bouton.disabled = true;
    if (voir) voir.remove();
    const suivant = document.createElement('button');
    suivant.type = 'button'; suivant.className = 'eleve-suivant';
    suivant.textContent = 'Carte suivante \u25b6';
    suivant.onclick = () => eleveCarteSuivante(main);
    bouton.parentNode.appendChild(suivant);
    suivant.focus();
    /* la barre du haut reflète tout de suite la pastille rouge */
    const tete = document.querySelector('.eleve-tete .eleve-pastilles');
    if (tete) tete.outerHTML = elevePastillesHtml();
}

function renderEleveFin(main) {
    const total = eleveSerie.length;
    const rouges = [];
    for (let i = 0; i < total; i++) if (eleveResultats[i] === 'ko') rouges.push(i);
    eleveEtoiles = eleveResultats.filter(r => r === true).length;
    const scene = document.createElement('div');
    scene.className = 'eleve-scene';
    if (rouges.length) {
        /* des cartes rouges : pas d'étoile, on propose de les rejouer */
        try {
            const tout = JSON.parse(localStorage.getItem(ELEVE_STORE_KEY) || '{}');
            if (parcoursId && tout[parcoursId] && tout[parcoursId].enCours) { delete tout[parcoursId].enCours; localStorage.setItem(ELEVE_STORE_KEY, JSON.stringify(tout)); }
        } catch (e) { /* stockage indisponible */ }
        scene.innerHTML = `<div class="eleve-fin">` +
            `<div class="fin-etoiles">\ud83d\udcaa</div>` +
            `<h2>S\u00e9rie termin\u00e9e !</h2>` +
            `<div class="fin-pastilles">${elevePastillesHtml()}</div>` +
            `<p>${rouges.length} carte${rouges.length > 1 ? 's' : ''} rouge${rouges.length > 1 ? 's' : ''} : rejoue-l${rouges.length > 1 ? 'es' : 'a'} pour ` +
            (parcoursId ? `allumer ton \u00e9toile sur la carte des mondes.` : `finir la s\u00e9rie.`) + `</p>` +
            `<div class="eleve-actions"><button class="eleve-valider" id="eleveRejouerRouges" type="button">Rejouer les cartes rouges</button>` +
            `<button class="eleve-secondaire" id="eleveRejouer" type="button">Toute la s\u00e9rie</button>${eleveLienMondesHtml('eleve-lien')}</div>` +
            `</div>`;
        main.appendChild(scene);
        document.getElementById('eleveRejouerRouges').onclick = () => { eleveRejeu = rouges.slice(); eleveCarteSuivante(main); };
    } else {
        eleveEnregistrerReussite(eleveEtoiles, total);
        scene.innerHTML = `<div class="eleve-fin">` +
            `<div class="fin-etoiles">\u2B50</div>` +
            `<h2>S\u00e9rie termin\u00e9e, bravo !</h2>` +
            `<div class="fin-pastilles">${elevePastillesHtml()}</div>` +
            `<p>${eleveEtoiles} carte${eleveEtoiles > 1 ? 's' : ''} sur ${total} du premier coup.` +
            (parcoursId ? ` Ton \u00e9toile est allum\u00e9e sur la carte des mondes !` : ``) + `</p>` +
            `<div class="eleve-actions"><button class="eleve-valider" id="eleveRejouer" type="button">Rejouer la s\u00e9rie</button>${eleveLienMondesHtml('eleve-lien')}</div>` +
            `</div>`;
        main.appendChild(scene);
    }
    document.getElementById('eleveRejouer').onclick = () => { eleveIdx = 0; eleveEtoiles = 0; eleveSerie = []; eleveResultats = []; eleveRejeu = null; renderEleve(main); };
}

window.onload = () => {
    updateUI();
    if (loadSharedConfiguration()) {
        toggleMode();
        startGen();
    } else {
        updateProblemTypeUI();
        startGen();
        toggleMode();
    }
};
</script>
</body>
</html>
