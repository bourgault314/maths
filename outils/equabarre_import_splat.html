<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Équabarre import — réception Splat</title>
  <meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<!--
  Cette page recevait les équations envoyées par Splat, Splat Équations et les Automatismes.
  ÉquaBarre (equabarre.html) sait maintenant recevoir les mêmes données (?data= ou #data=) :
  on redirige vers lui en conservant l'équation transmise, pour que les anciens liens
  continuent de fonctionner.
-->
<script>
  (function(){
    var destination = "./equabarre.html" + window.location.search + window.location.hash;
    window.location.replace(destination);
  })();
</script>
</head>
<body>
<p>Cette page a déménagé dans <a id="lienEquabarre" href="./equabarre.html">ÉquaBarre</a>.</p>
<script>
  (function(){
    var lien = document.getElementById("lienEquabarre");
    if(lien) lien.href = "./equabarre.html" + window.location.search + window.location.hash;
  })();
</script>
</body>
</html>
