        .token:active {

            transform: scale(1.1);

            box-shadow: 0 10px 15px rgba(0,0,0,0.3);

            border: 3px solid #7f1d1d;

        .token.is-zero {

            z-index: 5;

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .fade-out {
            transition: all 0.5s ease-out;
            opacity: 0 !important;
            transform: scale(0) !important;
            pointer-events: none;

        /* Scrollbar masquée */

        /* --- DESSIN --- */

        /* CURSEUR VIRTUEL */

        /* --- Curseur « main » : on utilise la main de Windows (celle des liens, `pointer`).

        <aside class="w-20 sm:w-24 bg-slate-100 border-r border-slate-300 flex flex-col items-center py-4 gap-4 z-20 shadow-lg shrink-0 overflow-y-auto relative">
            <span id="action-label" class="text-[10px] font-bold text-slate-400 uppercase text-center transition-colors">Ajouter</span>
            
            <button data-palette="green" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-green-500 border-2 border-green-700 text-white font-bold text-xl shadow hover:scale-105 active:scale-95 transition flex items-center justify-center" title="Raccourci: +">
                +1
            </button>
            <button data-palette="red" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-red-500 border-2 border-red-700 text-white font-bold text-xl shadow hover:scale-105 active:scale-95 transition flex items-center justify-center" title="Raccourci: -">
                -1
            </button>

            <div class="w-12 h-px bg-slate-300 my-1"></div>

            <!-- Bouton REGROUPER -->
            <button onclick="organizeBoard()" class="w-full px-1 py-2 text-slate-600 text-[10px] sm:text-xs font-bold hover:bg-slate-200 flex flex-col items-center gap-1 rounded transition border border-slate-200 bg-white shadow-sm" title="Raccourci: Espace">
                REGROUPER
            </button>

            <button id="btn-auto-simplify" onclick="animateSimplification()" class="w-14 h-14 rounded-full bg-indigo-100 text-indigo-700 border-2 border-indigo-200 flex flex-col items-center justify-center shadow-sm hover:bg-indigo-200 active:scale-95 transition" title="Raccourci: Entrée">
                <span class="text-xs font-bold">AUTO</span>
                <span class="text-lg font-bold">0</span>
            </button>
        </aside>

        <!-- BOARD (DROITE) -->
        <main id="board" class="flex-1 relative bg-white overflow-hidden touch-none">
            <div class="absolute inset-0 opacity-20 pointer-events-none" 
                 style="background-image: radial-gradient(#94a3b8 1px, transparent 1px); background-size: 24px 24px;">
            </div>
            
            <div class="absolute top-2 left-2 pointer-events-none opacity-40">
                <p class="text-xs text-slate-400">Zone de manipulation</p>
            </div>
        </main>
    </div>

    <script>
        const SNAP_THRESHOLD = 80;
        const TOKEN_SIZE = 70;
        const SPACING = 80;
        const GROUP_GAP = 120; 
        const LINE_HEIGHT = 120; 
        
        const state = {
            phase: 1, 
            operators: [], 
            tokens: [],    
            nextId: 1,
            locked: false,
            isAligned: false,
            isReduced: false, 
            currentPendingMode: null,
            currentTool: 'hand',
            lastInputType: null,
            transformMode: false,
            forceNewGroup: false // Nouveau flag pour forcer la séparation après transformation
        };

        // Stack d'historique
        const historyStack = [];

        const board = document.getElementById('board');
        const equationTerms = document.getElementById('equation-terms');
        const btnPlus = document.getElementById('btn-plus');
        const btnMinus = document.getElementById('btn-minus');
        const btnTransform = document.getElementById('btn-transform'); 
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const cursorDiv = document.getElementById('custom-cursor');

        // --- AUDIO ENGINE ---
        let soundEnabled = false;
        try { soundEnabled = JSON.parse(localStorage.getItem('relatifs_sound_v2') ?? 'false') === true; } catch(e) { soundEnabled = false; }

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function getAudioContext() {
            if (audioCtx || !AudioContextClass) return audioCtx;
            try { audioCtx = new AudioContextClass(); } catch (_) { audioCtx = null; }
            return audioCtx;
        }
        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume().catch(() => {});
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            const now = ctx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } 
            else if (type === 'whoosh') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
            else if (type === 'snap') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
            else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
            else if (type === 'magic') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
            else if (type === 'delete') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function syncSoundIcon() {
            const on = document.getElementById('icon-sound-on');
            const off = document.getElementById('icon-sound-off');
            const btn = document.getElementById('btn-sound');
            if (!on || !off) return;
            on.classList.toggle('hidden', !soundEnabled);
            off.classList.toggle('hidden', soundEnabled);
            if (btn) {
                btn.setAttribute('aria-pressed', String(soundEnabled));
                btn.setAttribute('aria-label', soundEnabled ? 'Désactiver le son' : 'Activer le son');
                btn.title = soundEnabled ? 'Désactiver le son' : 'Activer le son';
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            try { localStorage.setItem('relatifs_sound_v2', JSON.stringify(soundEnabled)); } catch(e) {}
            syncSoundIcon();
            if (soundEnabled) playSound('click');
        }

        syncSoundIcon();

        // --- KEYBOARD SHORTCUTS ---
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.key === '+' || e.key === '=') { handleSideButton('green'); playSound('click'); }
            if (e.key === '-' || e.key === '_') { handleSideButton('red'); playSound('click'); }
            if (e.code === 'Space') { e.preventDefault(); organizeBoard(); playSound('whoosh'); }
            if (e.key === 'Enter') { animateSimplification(); playSound('click'); }
            if (e.key === 'Delete') { resetBoard(); playSound('whoosh'); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { undo(); } // Raccourci Undo
        });

        // --- DESSIN & CURSEUR ---
        let isDrawing = false;
        let lastX = 0; let lastY = 0;

        function resizeCanvas() {
            const boardRect = board.getBoundingClientRect();
            canvas.style.width = boardRect.width + 'px';
            canvas.style.height = boardRect.height + 'px';
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(boardRect.width * dpr);
            canvas.height = Math.round(boardRect.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (state.currentTool === 'pen') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 3;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        function setTool(tool) {
            if (tool === 'hand') {
                state.currentTool = 'hand';
                canvas.style.pointerEvents = 'none';
                board.classList.remove('hide-cursor');
                board.style.cursor = 'var(--curseur-main)';
                cursorDiv.style.display = 'none';
                document.getElementById('tool-hand').className = "p-2 rounded bg-white shadow text-gray-700 border border-gray-200";
                document.getElementById('tool-pen').className = "p-2 rounded text-gray-500 hover:bg-gray-200";
            } else if (tool === 'pen') {
                state.currentTool = 'pen';
                canvas.style.pointerEvents = 'auto';
                board.classList.add('hide-cursor');
                board.style.cursor = '';
                cursorDiv.style.display = 'block';
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 3;
                document.getElementById('tool-hand').className = "p-2 rounded text-gray-500 hover:bg-gray-200";
                document.getElementById('tool-pen').className = "p-2 rounded bg-white shadow text-gray-700 border border-gray-200";
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width / (window.devicePixelRatio||1), canvas.height / (window.devicePixelRatio||1));
        }

        function updateCustomCursor(e) {
            if (state.currentTool !== 'pen') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            cursorDiv.style.left = clientX + 'px';
            cursorDiv.style.top = clientY + 'px';
            cursorDiv.style.transform = 'translate(-2px, -30px)';
        }
        window.addEventListener('mousemove', updateCustomCursor);
        window.addEventListener('touchmove', updateCustomCursor, {passive: false});

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDraw(e) {
            if (state.currentTool !== 'pen') return;
            isDrawing = true;
            updateCustomCursor(e);
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing || state.currentTool !== 'pen') return;
            e.preventDefault();
            updateCustomCursor(e);
            const pos = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            lastX = pos.x; lastY = pos.y;
        }

        function endDraw() { isDrawing = false; }
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchstart', startDraw, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', endDraw);


        // --- GESTION HISTORIQUE (UNDO) ---
        
        function saveState() {
            if (historyStack.length > 20) historyStack.shift();
            
            const stateCopy = {
                phase: state.phase,
                operators: [...state.operators],
                nextId: state.nextId,
                locked: state.locked,
                isAligned: state.isAligned,
                isReduced: state.isReduced,
                currentPendingMode: state.currentPendingMode,
                lastInputType: state.lastInputType,
                transformMode: state.transformMode,
                forceNewGroup: state.forceNewGroup,
                tokensData: state.tokens.map(t => ({
                    id: t.id,
                    type: t.type,
                    x: t.x,
                    y: t.y,
                    pairId: t.pairId,
                    creationPhase: t.creationPhase,
                    isToRemove: t.isToRemove
                }))
            };
            historyStack.push(stateCopy);
        }

        function undo() {
            if (historyStack.length === 0) return;
            
            playSound('pop');
            const previousState = historyStack.pop();
            
            state.phase = previousState.phase;
            state.operators = previousState.operators;
            state.nextId = previousState.nextId;
            state.locked = previousState.locked;
            state.isAligned = previousState.isAligned;
            state.isReduced = previousState.isReduced;
            state.currentPendingMode = previousState.currentPendingMode;
            state.lastInputType = previousState.lastInputType;
            state.transformMode = previousState.transformMode;
            state.forceNewGroup = previousState.forceNewGroup;
            
            board.innerHTML = '<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#94a3b8 1px, transparent 1px); background-size: 24px 24px;"></div><div class="absolute top-2 left-2 pointer-events-none opacity-40"><p class="text-xs text-slate-400">Zone de manipulation</p></div>';
            state.tokens = [];

            previousState.tokensData.forEach(tData => {
                const el = document.createElement('div');
                el.classList.add('token', tData.type);
                if (tData.isToRemove) el.classList.add('to-remove');
                if (tData.pairId !== null) el.classList.add('is-zero');
                
                el.innerText = tData.type === 'green' ? '+1' : '-1';
                el.id = `token-${tData.id}`;
                el.style.left = tData.x + 'px';
                el.style.top = tData.y + 'px';
                
                if (tData.isToRemove) {
                    el.setAttribute('onclick', 'removeSingleToken(this)');
                } else {
                    el.addEventListener('mousedown', handleDragStart);
                    el.addEventListener('touchstart', handleDragStart, {passive: false});
                }
                
                board.appendChild(el);
                
                if (tData.pairId !== null && !document.getElementById(`badge-${tData.id}-${tData.pairId}`) && !document.getElementById(`badge-${tData.pairId}-${tData.id}`)) {
                    const badge = document.createElement('div');
                    badge.classList.add('zero-badge');
                    badge.innerText = '0';
                    const id1 = tData.id;
                    const id2 = tData.pairId;
                    badge.id = `badge-${id1}-${id2}`;
                    badge.style.left = (tData.x - 12) + 'px'; 
                    badge.style.top = (tData.y - 30) + 'px';
                    board.appendChild(badge);
                }

                state.tokens.push({
                    ...tData,
                    element: el
                });
            });

            updateLogic();
        }


        // --- LOGIQUE PRINCIPALE ---

        function handleSideButton(type, x = null, y = null) {
            saveState(); 
            playSound('pop');
            state.isReduced = false; 
            
            // Check force new group (after transform)
            if (state.forceNewGroup) {
                setOperator('add');
                state.forceNewGroup = false;
            }

            // CORRECTION: Si on change de "bouton" (couleur), on force une nouvelle addition
            // Cela permet de sortir du mode soustraction "collant" et de séparer les groupes
            if (state.lastInputType && state.lastInputType !== type) {
                setOperator('add'); 
            }
            
            state.lastInputType = type; // Mémorise le dernier type cliqué
            addToken(type, x, y);
        }

        function addToken(type, x = null, y = null) {
            let finalType = type;
            
            // MODE EXPERT : Soustraction = Ajout de l'opposé DIRECT
            if (state.currentPendingMode === 'subtract') {
                finalType = (type === 'green') ? 'red' : 'green';
            }

            const id = state.nextId++;
            const el = document.createElement('div');
            el.classList.add('token', finalType);
            el.innerText = finalType === 'green' ? '+1' : '-1';
            el.id = `token-${id}`;
            
            const pos = (x === null || y === null) ? findFreePosition() : {x, y};
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';
            
            el.addEventListener('mousedown', handleDragStart);
            el.addEventListener('touchstart', handleDragStart, {passive: false});
            
            board.appendChild(el);
            
            const tokenObj = { 
                id: id, 
                type: finalType, 
                element: el, 
                x: pos.x, 
                y: pos.y, 
                pairId: null, 
                creationPhase: state.phase,
                isToRemove: false 
            };
            
            state.tokens.push(tokenObj);
            updateLogic();
            return tokenObj;
        }

        function findFreePosition() {
            const startX = 50;
            const startY = 30;
            const availableWidth = board.clientWidth - 80;
            
            const currentPhaseTokens = state.tokens.filter(t => t.creationPhase === state.phase);
            
            if (currentPhaseTokens.length > 0) {
                const lastToken = currentPhaseTokens[currentPhaseTokens.length - 1];
                let nextX = lastToken.x + SPACING;
                let nextY = lastToken.y;
                
                if (nextX > availableWidth) {
                    nextX = 50;
                    nextY += LINE_HEIGHT;
                }
                return { x: nextX, y: nextY };
            } 
            else {
                if (state.phase > 1) {
                    let maxToken = null;
                    state.tokens.forEach(t => {
                        if (t.creationPhase < state.phase) {
                            if (!maxToken) maxToken = t;
                            else {
                                if (t.y > maxToken.y) maxToken = t;
                                else if (t.y === maxToken.y && t.x > maxToken.x) maxToken = t;
                            }
                        }
                    });
                    
                    if (maxToken) {
                        let nextX = maxToken.x + GROUP_GAP;
                        let nextY = maxToken.y;
                        
                        if (nextX > availableWidth) {
                            nextX = 50;
                            nextY += LINE_HEIGHT;
                        }
                        return { x: nextX, y: nextY };
                    }
                }
                return { x: startX, y: startY };
            }
        }

        function setOperator(opType) {
            // On ne sauvegarde pas ici car setOperator est souvent appelé par handleSideButton qui sauvegarde déjà
            
            playSound('click');
            state.isReduced = false;
            state.lastInputType = null; // Reset du type d'input pour le nouveau groupe
            
            if (opType === 'add') {
                state.phase++;
                state.operators.push('+');
                state.currentPendingMode = null; 
            } 
            else if (opType === 'subtract') {
                state.phase++;
                state.operators.push('-');
                state.currentPendingMode = 'subtract';
            }
            updateLogic();
        }

        // Wrapper pour les boutons d'opérateurs pour gérer l'historique
        function handleOperatorClick(opType) {
            saveState();
            // IMPORTANT: si on vient de faire 'AJOUTER L'OPPOSÉ', le flag forceNewGroup
            // ne doit PAS s'appliquer quand l'utilisateur choisit explicitement un opérateur (+ ou -).
            // Sinon, le prochain jeton auto-insère un '+' et annule la soustraction (bug : '- puis +1' affiche '+1').
            state.forceNewGroup = false;
            setOperator(opType);
        }

        function reduceEquation() {
            saveState();
            playSound('whoosh');
            state.isReduced = true;
            updateLogic();
            organizeBoard(); 
        }

        // --- TRANSFORMATION ---
        function transformSubtractions() {
            saveState();
            playSound('magic');
            // 1. On remplace les opérateurs
            state.operators = state.operators.map(op => op === '-' ? '+' : op);
            
            // 2. On ferme le mode soustraction et on force un nouveau groupe
            state.currentPendingMode = null;
            state.forceNewGroup = true;
            
            updateLogic();
        }

        // MISE A JOUR DE L'AFFICHAGE SIMPLIFIE
        function updateLogic() {
            
            // GESTION BOUTON TRANSFORMER
            // Il apparaît si il y a un opérateur '-' dans la liste actuelle
            const hasSubtraction = state.operators.includes('-');
            if (hasSubtraction) {
                btnTransform.classList.remove('hidden');
            } else {
                btnTransform.classList.add('hidden');
            }

            if (state.isReduced) {
                const positives = state.tokens.filter(t => t.pairId === null && t.type === 'green').length;
                const negatives = state.tokens.filter(t => t.pairId === null && t.type === 'red').length;

                let html = '';
                if (positives > 0) html += `<span class="text-3xl sm:text-4xl font-bold text-green-600 tracking-tight transition-colors">${positives}</span>`;
                if (negatives > 0) {
                    if (positives > 0) html += `<span class="text-3xl sm:text-4xl font-bold text-red-600 mx-2">-</span>`;
                    else html += `<span class="text-3xl sm:text-4xl font-bold text-red-600 tracking-tight transition-colors">-</span>`; 
                    html += `<span class="text-3xl sm:text-4xl font-bold text-red-600 tracking-tight transition-colors mx-2">${negatives}</span>`;
                }
                if (positives === 0 && negatives === 0) html = '<span class="text-3xl sm:text-4xl font-bold text-slate-400 tracking-tight transition-colors">0</span>';
                equationTerms.innerHTML = html;
                return;
            }

            let fullHtml = '';
            
            for (let p = 1; p <= state.phase; p++) {
                const tokensP = state.tokens.filter(t => t.creationPhase === p && t.pairId === null);
                
                if (tokensP.length === 0) {
                    if (p > 1 && p-1 <= state.operators.length) {
                        const op = state.operators[p-2];
                        if (op === '-' && p === state.phase) {
                             // Si c'est un '-' encore présent, on l'affiche en orange
                             fullHtml += `<span class="text-3xl sm:text-4xl font-bold text-amber-500 mx-2">&nbsp;-&nbsp;</span>`;
                        } else if (op === '+' && p === state.phase) {
                             fullHtml += `<span class="text-3xl sm:text-4xl font-bold text-slate-800 mx-2">&nbsp;+&nbsp;</span>`;
                        }
                    }
                    continue;
                }

                let rawValueOnBoard = tokensP.reduce((acc, t) => acc + (t.type === 'green' ? 1 : -1), 0);
                const phaseOperator = (p === 1) ? '+' : state.operators[p-2];

                let valToDisplay, sign, colorClass, displayOp;

                // Cas 1 : Soustraction ENCORE PRÉSENTE (Orange)
                if (phaseOperator === '-') {
                    let intendedValue = -rawValueOnBoard; 
                    valToDisplay = Math.abs(intendedValue);
                    let intendedColor = intendedValue >= 0 ? 'text-green-600' : 'text-red-600';
                    let intendedSign = intendedValue >= 0 ? '+' : '-'; 
                    
                    // L'opérateur est ORANGE
                    displayOp = `<span class="text-3xl sm:text-4xl font-bold text-amber-500 mx-2">-</span>`;
                    
                    // ON FORCE L'AFFICHAGE DU SIGNE ET PARENTHÈSES POUR CLARTE
                    // ex: - (-1)
                    if (fullHtml === '') {
                         fullHtml += `<span class="text-3xl sm:text-4xl font-bold text-amber-500">-</span>`;
                    } else {
                         fullHtml += displayOp;
                    }
                    
                    // Le nombre entre parenthèses avec son signe explicite
                    fullHtml += `<span class="text-3xl sm:text-4xl font-bold ${intendedColor} mx-1">(${intendedSign}&nbsp;${valToDisplay})</span>`;
                    
                } 
                
                // Cas 2 : Addition / Simplifié
                else {
                    valToDisplay = Math.abs(rawValueOnBoard);
                    sign = rawValueOnBoard >= 0 ? '+' : '-';
                    colorClass = rawValueOnBoard >= 0 ? 'text-green-600' : 'text-red-600';
                    
                    if (fullHtml === '') {
                        if (sign === '-') {
                            fullHtml += `<span class="text-3xl sm:text-4xl font-bold ${colorClass}">-</span>`;
                            fullHtml += `<span class="text-3xl sm:text-4xl font-bold ${colorClass} mx-1">${valToDisplay}</span>`;
                        } else {
                            fullHtml += `<span class="text-3xl sm:text-4xl font-bold ${colorClass}">${valToDisplay}</span>`;
                        }
                    } else {
                        fullHtml += `<span class="text-3xl sm:text-4xl font-bold ${colorClass} mx-2">${sign}</span>`;
                        fullHtml += `<span class="text-3xl sm:text-4xl font-bold ${colorClass}">${valToDisplay}</span>`;
                    }
                }
            }

            if (fullHtml === '') fullHtml = '<span class="text-3xl sm:text-4xl font-bold text-slate-400 tracking-tight transition-colors">0</span>';
            equationTerms.innerHTML = fullHtml;
        }
        
        function organizeBoard() {
            saveState(); 
            playSound('whoosh');
            state.isAligned = true;
            
            const availableWidth = board.clientWidth - 80; 
            let currentX = 50;
            let currentY = 80; 

            const activeTokens = state.tokens.filter(t => t.pairId === null);
            const zeroTokens = state.tokens.filter(t => t.pairId !== null); 

            const greenTokens = activeTokens.filter(t => t.type === 'green').sort((a,b) => (a.creationPhase - b.creationPhase) || (a.id - b.id));
            const redTokens = activeTokens.filter(t => t.type === 'red').sort((a,b) => (a.creationPhase - b.creationPhase) || (a.id - b.id));

            const placeGroup = (tokens) => {
                if (tokens.length === 0) return;
                
                let prevPhase = tokens[0].creationPhase;
                
                tokens.forEach((token, index) => {
                    let gap = SPACING;
                    
                    if (!state.isReduced && index > 0 && token.creationPhase !== prevPhase) {
                        gap = GROUP_GAP;
                    }
                    prevPhase = token.creationPhase;

                    if (index > 0) {
                        currentX += gap;
                    }

                    if (currentX > availableWidth) {
                        currentX = 50;
                        currentY += LINE_HEIGHT;
                    }

                    moveTokenTo(token, currentX, currentY);
                });
            };

            if (state.isReduced) {
                if (greenTokens.length > 0) {
                    placeGroup(greenTokens);
                    currentX = 50;
                    currentY += LINE_HEIGHT;
                }
                
                if (redTokens.length > 0) {
                    placeGroup(redTokens);
                }
            } 
            else {
                if (greenTokens.length > 0) {
                    placeGroup(greenTokens);
                }

                if (greenTokens.length > 0 && redTokens.length > 0) {
                    const separation = GROUP_GAP * 1.5;
                    const nextStart = currentX + separation;
                    if (nextStart < availableWidth - 100) {
                         currentX += separation;
                    } else {
                         currentX = 50;
                         currentY += LINE_HEIGHT;
                    }
                }

                if (redTokens.length > 0) {
                    placeGroup(redTokens);
                }
            }

            if (zeroTokens.length > 0) {
                currentX = 50;
                currentY += LINE_HEIGHT; 
                
                const placedZeros = new Set();
                
                zeroTokens.forEach(t1 => {
                    if (placedZeros.has(t1.id)) return;
                    
                    const t2 = zeroTokens.find(t => t.id === t1.pairId);
                    
                    if (currentX > availableWidth) {
                        currentX = 50;
                        currentY += LINE_HEIGHT;
                    }
                    moveTokenTo(t1, currentX, currentY);
                    placedZeros.add(t1.id);
                    
                    if (t2) {
                        moveTokenTo(t2, currentX + 30, currentY + 20); 
                        placedZeros.add(t2.id);
                    }
                    
                    currentX += SPACING + 40; 
                });
            }

            updateLogic();
        }
        
        function moveTokenTo(t, x, y) {
            t.x = x; t.y = y;
            t.element.style.left = (x - TOKEN_SIZE/2) + 'px';
            t.element.style.top = (y - TOKEN_SIZE/2) + 'px';
        }

        let draggedToken = null;
        let dragOffset = {x:0, y:0};

        function handleDragStart(e) {
            if (state.currentTool !== 'hand') return; 
            
            e.preventDefault();
            const el = e.target.closest('.token');
            if(!el) return;
            const id = parseInt(el.id.split('-')[1]);
            draggedToken = state.tokens.find(t => t.id === id);
            
            if (draggedToken.pairId !== null) {
                saveState(); // Unpairing is an action
                unpairTokens(draggedToken);
            }
            
            el.style.zIndex = 1000;
            el.style.transform = "scale(1.15)";
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const rect = el.getBoundingClientRect();
            dragOffset.x = clientX - rect.left;
            dragOffset.y = clientY - rect.top;
            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('touchmove', handleDragMove, {passive: false});
            document.addEventListener('mouseup', handleDragEnd);
            document.addEventListener('touchend', handleDragEnd);
        }

        function handleDragMove(e) {
            if (!draggedToken) return;
            e.preventDefault();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const boardRect = board.getBoundingClientRect();
            let newX = clientX - boardRect.left - dragOffset.x; 
            let newY = clientY - boardRect.top - dragOffset.y;
            draggedToken.element.style.left = newX + 'px';
            draggedToken.element.style.top = newY + 'px';
            draggedToken.x = newX + TOKEN_SIZE/2;
            draggedToken.y = newY + TOKEN_SIZE/2;
        }

        function handleDragEnd(e) {
            if (!draggedToken) return;
            checkForPairing(draggedToken);
            draggedToken.element.style.zIndex = '';
            draggedToken.element.style.transform = "";
            draggedToken = null;
            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchend', handleDragEnd);
            updateLogic();
        }

        function checkForPairing(token) {
            const targetType = token.type === 'green' ? 'red' : 'green';
            let bestCandidate = null;
            let minDistance = SNAP_THRESHOLD; 
            for (let t of state.tokens) {
                if (t.type === targetType && t.pairId === null) {
                    const dist = Math.hypot(t.x - token.x, t.y - token.y);
                    if (dist < minDistance) { minDistance = dist; bestCandidate = t; }
                }
            }
            if (bestCandidate) { 
                saveState(); // Pairing is an action
                playSound('snap'); 
                createZeroPair(token, bestCandidate); 
            }
        }

        function createZeroPair(t1, t2) {
            const midX = (t1.x + t2.x) / 2;
            const midY = (t1.y + t2.y) / 2;
            moveTokenTo(t1, midX, midY);
            moveTokenTo(t2, midX, midY);
            t1.pairId = t2.id; t2.pairId = t1.id;
            t1.element.classList.add('is-zero'); t2.element.classList.add('is-zero');
            const badge = document.createElement('div');
            badge.classList.add('zero-badge');
            badge.innerText = '0';
            badge.id = `badge-${t1.id}-${t2.id}`;
            badge.style.left = (midX - 12) + 'px'; 
            badge.style.top = (midY - 30) + 'px';
            board.appendChild(badge);
            
            updateLogic();
        }

        function unpairTokens(token) {
            if (token.pairId === null) return;
            const partner = state.tokens.find(t => t.id === token.pairId);
            if (partner) { partner.pairId = null; partner.element.classList.remove('is-zero'); }
            token.pairId = null; token.element.classList.remove('is-zero');
            let badge = document.getElementById(`badge-${token.id}-${partner?.id}`);
            if (!badge && partner) badge = document.getElementById(`badge-${partner.id}-${token.id}`);
            if (badge) badge.remove();
            
            updateLogic();
        }

        function animateSimplification() {
            saveState(); // Undoable
            state.locked = true;
            playSound('whoosh');

            const processedIds = new Set();
            const existingPairs = [];
            state.tokens.forEach(t => {
                if (t.pairId !== null && !processedIds.has(t.id)) {
                    const partner = state.tokens.find(p => p.id === t.pairId);
                    if (partner) {
                        existingPairs.push([t, partner]);
                        processedIds.add(t.id);
                        processedIds.add(partner.id);
                    }
                }
            });

            const activeTokens = state.tokens.filter(t => t.pairId === null);
            
            const logicalPositives = activeTokens.filter(t => t.type === 'green').sort((a,b) => (a.x - b.x) || (a.y - b.y));
            const logicalNegatives = activeTokens.filter(t => t.type === 'red').sort((a,b) => (a.x - b.x) || (a.y - b.y));

            const newPairs = [];
            const count = Math.min(logicalPositives.length, logicalNegatives.length);
            for(let i=0; i<count; i++) {
                newPairs.push([logicalPositives[i], logicalNegatives[i]]);
            }

            if (existingPairs.length === 0 && newPairs.length === 0) {
                 state.locked = false;
                 return;
            }

            let delayForNewPairs = 0;

            if (existingPairs.length > 0) {
                existingPairs.forEach((pair, i) => {
                    setTimeout(() => {
                        removePairElements(pair[0], pair[1]);
                    }, i * 100); 
                });
                delayForNewPairs = (existingPairs.length * 100) + 600; 
            }

            setTimeout(() => {
                const interval = 500; 
                newPairs.forEach((pair, index) => {
                    setTimeout(() => {
                        const [t1, t2] = pair;
                        moveTokenTo(t2, t1.x, t1.y);
                        setTimeout(() => {
                            createZeroPair(t1, t2); 
                            playSound('snap');
                            setTimeout(() => {
                                removePairElements(t1, t2);
                            }, 400); 
                        }, 350); 
                    }, index * interval);
                });

                const totalTime = (newPairs.length * interval) + 500 + 600 + 200;
                setTimeout(() => {
                    state.locked = false;
                    updateLogic();
                    organizeBoard();
                }, totalTime);

            }, delayForNewPairs);
        }

        function removePairElements(t1, t2) {
             t1.element.classList.add('fade-out');
             t2.element.classList.add('fade-out');
             
             let badge = document.getElementById(`badge-${t1.id}-${t2.id}`);
             if (!badge) badge = document.getElementById(`badge-${t2.id}-${t1.id}`);
             
             if(badge) {
                 badge.style.transition = 'opacity 0.5s';
                 badge.style.opacity = '0';
             }
             
             setTimeout(() => {
                 if(t1.element.parentNode) t1.element.remove();
                 if(t2.element.parentNode) t2.element.remove();
                 if(badge && badge.parentNode) badge.remove();
                 state.tokens = state.tokens.filter(t => t.id !== t1.id && t.id !== t2.id);
                 updateLogic();
             }, 500);
        }

        function resetBoard() {
            saveState(); // Reset is undoable
            playSound('click');
            state.tokens.forEach(t => t.element.remove());
            document.querySelectorAll('.zero-badge').forEach(b => b.remove());
            clearCanvas();
            
            state.tokens = [];
            state.phase = 1;
            state.operators = [];
            state.resultRevealed = false;
            state.locked = false;
            state.isAligned = false;
            state.isReduced = false;
            state.currentPendingMode = null;
            state.lastInputType = null;
            state.transformMode = false;
            state.forceNewGroup = false;
            
            document.getElementById('equation-terms').innerHTML = '<span class="text-3xl sm:text-4xl font-bold text-slate-400 tracking-tight transition-colors">0</span>';
            
            btnTransform.classList.add('hidden');
            setTool('hand');
            updateLogic();
        }
    
        // --- Réserve : clic = ajout comme avant ; prendre et glisser = dépôt à l'endroit voulu ---
        (function initReserveGlisserDeposer() {
            const boutons = Array.from(document.querySelectorAll('button[data-palette]'));
            if (!boutons.length) return;

            const SEUIL = 8; // px avant de considérer que l'on glisse (sinon : clic)
            const glisser = { actif: false, bouge: false, type: null, x0: 0, y0: 0, pointerId: null, fantome: null };

            // Zoom interne du plateau (version B) : sinon repère identité.
            function vue() { return (typeof view !== 'undefined' && view) ? view : { x: 0, y: 0, scale: 1 }; }

            function dansPlateau(cx, cy) {
                const r = board.getBoundingClientRect();
                return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
            }

            // Point de dépôt -> coin haut-gauche du jeton (centré sous le pointeur), borné au plateau.
            function versPlateau(cx, cy) {
                const r = board.getBoundingClientRect();
                const v = vue();
                const x = (cx - r.left - v.x) / v.scale - TOKEN_SIZE / 2;
                const y = (cy - r.top - v.y) / v.scale - TOKEN_SIZE / 2;
                const maxX = Math.max(0, board.clientWidth / v.scale - TOKEN_SIZE);
                const maxY = Math.max(0, board.clientHeight / v.scale - TOKEN_SIZE);
                return { x: Math.max(0, Math.min(maxX, x)), y: Math.max(0, Math.min(maxY, y)) };
            }

            function creerFantome(type) {
                const g = document.createElement('div');
                g.className = 'palette-ghost';
                const t = document.createElement('div');
                t.className = 'token ' + type;
                t.innerText = type === 'green' ? '+1' : '-1';
                g.appendChild(t);
                document.body.appendChild(g);
                return g;
            }

            function debut(e) {
                if (e.button !== undefined && e.button !== 0) return;
                glisser.actif = true;
                glisser.bouge = false;
                glisser.type = e.currentTarget.dataset.palette;
                glisser.x0 = e.clientX;
                glisser.y0 = e.clientY;
                glisser.pointerId = e.pointerId;
                glisser.fantome = null;
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
                e.preventDefault();
            }

            function mouvement(e) {
                if (!glisser.actif || e.pointerId !== glisser.pointerId) return;
                if (!glisser.bouge) {
                    if (Math.hypot(e.clientX - glisser.x0, e.clientY - glisser.y0) < SEUIL) return;
                    glisser.bouge = true;
                    glisser.fantome = creerFantome(glisser.type);
                    document.body.classList.add('palette-dragging');
                }
                glisser.fantome.style.left = e.clientX + 'px';
                glisser.fantome.style.top = e.clientY + 'px';
                e.preventDefault();
            }

            function fin(e) {
                if (!glisser.actif || e.pointerId !== glisser.pointerId) return;
                const type = glisser.type, bouge = glisser.bouge, fantome = glisser.fantome;
                glisser.actif = false; glisser.bouge = false; glisser.type = null; glisser.pointerId = null; glisser.fantome = null;
                document.body.classList.remove('palette-dragging');
                if (fantome) fantome.remove();

                if (!bouge) { handleSideButton(type); return; }           // simple clic : comme avant
                if (dansPlateau(e.clientX, e.clientY)) {                   // dépôt sur le plateau
                    const p = versPlateau(e.clientX, e.clientY);
                    handleSideButton(type, p.x, p.y);
                }                                                          // lâché ailleurs : rien
            }

            function annule(e) {
                if (!glisser.actif || e.pointerId !== glisser.pointerId) return;
                glisser.actif = false; glisser.bouge = false; glisser.pointerId = null;
                document.body.classList.remove('palette-dragging');
                if (glisser.fantome) glisser.fantome.remove();
                glisser.fantome = null;
            }

            boutons.forEach(b => {
                b.addEventListener('pointerdown', debut, { passive: false });
                b.addEventListener('pointermove', mouvement, { passive: false });
                b.addEventListener('pointerup', fin, { passive: false });
                b.addEventListener('pointercancel', annule, { passive: false });
            });
            // Filet de sécurité si la capture du pointeur saute.
            window.addEventListener('pointermove', mouvement, { passive: false });
            window.addEventListener('pointerup', fin, { passive: false });
            window.addEventListener('pointercancel', annule, { passive: false });
        })();
</script>
