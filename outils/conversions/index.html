<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maths&amp;go — Conversions &amp; Grandeurs</title>
  <style>
    :root {
      --ink: #0a3d86;
      --muted: #64748b;
      --teal: #10b9b2;
      --orange: #ff8a00;
      --blue: #0a3d86;
      --paper: rgba(255, 255, 255, 0.9);
      --line: rgba(10, 61, 134, 0.12);
      --shadow: 0 18px 44px rgba(10, 61, 134, 0.1);
      --shadow-strong: 0 28px 72px rgba(10, 61, 134, 0.16);
      --radius: 30px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(760px 430px at 4% 0%, rgba(16, 185, 178, 0.17), transparent 60%),
        radial-gradient(780px 450px at 97% 3%, rgba(255, 138, 0, 0.15), transparent 60%),
        radial-gradient(720px 420px at 50% 100%, rgba(10, 61, 134, 0.1), transparent 65%),
        linear-gradient(180deg, #fbfdff 0%, #f5faff 58%, #f0f7fd 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(10, 61, 134, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10, 61, 134, 0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.62), transparent 88%);
    }

    .wrap {
      width: min(1140px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .topbar {
      height: 54px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .logo-link {
      display: block;
      width: 124px;
      opacity: 0.96;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .logo-link:hover {
      transform: translateY(-1px);
      opacity: 1;
    }

    .logo-link:focus-visible {
      outline: 3px solid rgba(255, 138, 0, 0.28);
      outline-offset: 5px;
      border-radius: 10px;
    }

    .logo-link img {
      display: block;
      width: 100%;
      height: auto;
    }

    main {
      display: grid;
      gap: 26px;
      margin-top: 18px;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--ink);
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 440px));
      justify-content: center;
      gap: 22px;
    }

    .card {
      --accent: var(--teal);
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--accent) 38%, transparent);
      box-shadow: var(--shadow-strong);
    }

    .card:focus-visible {
      outline: 4px solid rgba(255, 138, 0, 0.24);
      outline-offset: 5px;
    }

    .card:last-child {
      width: calc(50% - 11px);
      grid-column: 1 / -1;
      justify-self: center;
    }

    .preview {
      aspect-ratio: 16 / 10;
      padding: 18px;
      overflow: hidden;
      border-bottom: 1px solid rgba(10, 61, 134, 0.08);
      background:
        radial-gradient(300px 180px at 15% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 68%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(245, 250, 255, 0.86));
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border: 1.5px solid rgba(10, 61, 134, 0.14);
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 16px 34px rgba(10, 61, 134, 0.11);
    }

    .preview img.area { object-position: center 34%; }

    .label {
      min-height: 76px;
      padding: 16px 72px 18px 20px;
      display: grid;
      place-items: center;
      position: relative;
      text-align: center;
      font-size: clamp(1.08rem, 1.55vw, 1.38rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 900;
    }

    .arrow {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      background: var(--accent);
      border-radius: 13px;
      box-shadow: 0 12px 24px rgba(10, 61, 134, 0.14);
      font-size: 1.35rem;
      font-weight: 950;
    }

    @media (max-width: 900px) {
      .wrap {
        width: min(100% - 24px, 640px);
        padding: 18px 0 24px;
      }

      .topbar { height: 48px; }
      .logo-link { width: 112px; }
      main { margin-top: 14px; gap: 22px; }
      .grid { grid-template-columns: 1fr; }
      .card:last-child {
        width: auto;
        grid-column: auto;
        justify-self: stretch;
      }
    }

    @media (max-width: 480px) {
      .preview { padding: 12px; }
      .label { min-height: 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-link, .card { transition: none; }
    }
  </style>
