  <style>
    :root {
      --bg: #f4f7fc; --panel: #ffffff; --panel-border: #dbe4f3;
      --text: #1f2a44; --muted: #5a6784; --accent: #1283ff; --accent-dark: #0b67c6;
      --success: #10b981; --length: #1283ff; --mass: #16a34a; 
      --cap: #06b6d4; --area: #f59e0b; --vol: #7c3aed; --prob: #ef4444; --est: #0d9488;
      --shadow: 0 10px 30px rgba(31,42,68,0.08);
      --ink:#1b1b1b;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito', Arial, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    /* PANNEAU DE CONFIGURATION COMPACT */
    .config-panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px 20px; width: 100%; max-width: 1200px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .config-header { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center;}
    .config-header h2 { margin: 0; font-size: 1.25rem; color: #1f2a44; }
    
    .theme-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 16px; align-items: stretch; }
    .config-col { display: flex; flex-direction: column; gap: 15px; }
    
    .theme-col { background: #fbfdff; border: 1px solid #e7edf8; border-radius: 8px; padding: 12px; flex-grow: 1;}
    .theme-col h3 { margin: 0 0 10px 0; font-size: 0.95rem; border-bottom: 2px solid #eef4ff; padding-bottom: 4px;}
    
    .theme-col.length h3 { color: var(--length); border-bottom-color: color-mix(in srgb, var(--length) 20%, transparent); }
    .theme-col.mass h3 { color: var(--mass); border-bottom-color: color-mix(in srgb, var(--mass) 20%, transparent); }
    .theme-col.cap h3 { color: var(--cap); border-bottom-color: color-mix(in srgb, var(--cap) 20%, transparent); }
    .theme-col.area h3 { color: var(--area); border-bottom-color: color-mix(in srgb, var(--area) 20%, transparent); }
    .theme-col.vol h3 { color: var(--vol); border-bottom-color: color-mix(in srgb, var(--vol) 20%, transparent); }
    .theme-col.prob h3 { color: var(--prob); border-bottom-color: color-mix(in srgb, var(--prob) 20%, transparent); }
    .theme-col.est h3 { color: var(--est); border-bottom-color: color-mix(in srgb, var(--est) 20%, transparent); }
    
    .checkbox-list { display: flex; flex-direction: column; gap: 6px; }
    .cb-row { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 0.85rem; line-height: 1.3;}
    .cb-row input { margin-top: 2px; cursor: pointer; }
    .theme-col.length .cb-row input { accent-color: var(--length); }
    .theme-col.mass .cb-row input { accent-color: var(--mass); }
    .theme-col.cap .cb-row input { accent-color: var(--cap); }
    .theme-col.area .cb-row input { accent-color: var(--area); }
    .theme-col.vol .cb-row input { accent-color: var(--vol); }
    .theme-col.prob .cb-row input { accent-color: var(--prob); }
    .theme-col.est .cb-row input { accent-color: var(--est); }

    .bottom-config { display: flex; justify-content: space-between; align-items: stretch; flex-wrap: wrap; gap: 12px; background: #f4f7fc; padding: 12px 16px; border-radius: 8px; border: 1px solid #dbe4f3; }
    .config-options { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .config-block { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.9rem; }
    .config-block select { padding: 6px 10px; border-radius: 6px; border: 1px solid #cfd8ea; font-size: 0.95rem; outline: none; font-family: 'Nunito', sans-serif;}
    .config-block input[type="text"] { padding: 6px 10px; border-radius: 6px; border: 1px solid #cfd8ea; font-size: 0.95rem; outline: none; font-family: 'Nunito', sans-serif; text-transform: uppercase; width: 90px;}
    
    .btn-wrap { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch;}
    .btn-main { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.1s; font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center;}
    .btn-main.print { background: #9c27b0; }
    .btn-main:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }

    .config-msg { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; font-weight: bold; font-size: 0.95rem; }
    .config-msg[hidden] { display: none; }
    .nb { white-space: nowrap; }
    .print-group { display: flex; gap: 15px; border: 2px dashed #cfd8ea; padding: 8px 15px; border-radius: 8px; background: white; align-items: center;}
    .print-options-col { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: bold;}

    /* LAYOUT DIAPORAMA */
    .diapo-container { background: white; border-radius: 18px; box-shadow: var(--shadow); width: 100%; max-width: 1100px; display: none; flex-direction: column; overflow: hidden; border: 1px solid var(--panel-border); margin-top: 20px; min-height: 600px;}
    .diapo-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid #e7edf8; }
    .slide-counter { font-weight: bold; color: var(--muted); font-size: 1.1rem; }
    .btn-nav { background: white; border: 1px solid #dbe4f3; border-radius: 8px; padding: 8px 16px; font-weight: bold; cursor: pointer; color: var(--text); min-width: 130px; transition: background 0.1s; font-family: 'Nunito', sans-serif;}
    .btn-nav:hover:not(:disabled) { background: #f1f5f9; }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-icon { min-width: 40px; padding: 8px 12px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    #btnNext { min-width: 220px; text-align: center; }

    .question-box { padding: 25px 40px 10px 40px; text-align: center; }
    .question-emoji { font-size: 5.5rem; margin-bottom: 15px; line-height: 1; display: none; text-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .question-text { font-size: 2.2rem; font-weight: 900; color: #1f2a44; line-height: 1.4; margin: 0; }
    .question-subtext { font-size: 1.5rem; color: var(--muted); font-weight: bold; margin-top: 15px; line-height: 1.3;}

    .table-box { padding: 10px 40px; display: none; justify-content: center; align-items: flex-start; flex-grow: 1; width: 100%; position: relative;}

    /* BOÎTE POUR LES ORDRES DE GRANDEUR */
    .est-board { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; margin-top: 20px; padding-bottom: 40px;}
    
    .est-frise { display: flex; justify-content: center; gap: 15px; width: 100%; margin-bottom: 20px; flex-wrap: wrap; background: #f0fdfa; padding: 15px; border-radius: 12px; border: 2px dashed #0d9488; }
    .est-frise-item { display: flex; flex-direction: column; align-items: center; gap: 8px; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-width: 70px;}
    .est-frise-unit { font-weight: 900; color: var(--est); font-size: 1.2rem; }
    .est-frise-emoji { font-size: 2.5rem; line-height: 1;}

    .est-choices-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; width: 100%; }
    .est-btn { 
      background: white; border: 3px solid #cfd8ea; border-radius: 16px; 
      padding: 15px 25px; font-size: 1.6rem; font-weight: 900; color: var(--text);
      transition: 0.3s; display: flex; align-items: center; justify-content: flex-start;
      min-width: 220px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      font-family: 'Nunito', sans-serif;
    }
    .est-badge {
      background: #eef4ff; color: var(--accent); width: 45px; height: 45px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 900; margin-right: 20px; flex-shrink: 0;
    }
    .est-btn.correct { background: var(--success); color: white; border-color: var(--success); transform: scale(1.05); box-shadow: 0 10px 25px rgba(16,185,129,0.3); }
    .est-btn.correct .est-badge { background: rgba(255,255,255,0.3); color: white; }
    .est-btn.wrong { opacity: 0.3; filter: grayscale(1); border-color: #e2e8f0; background: #f8fafc; }
    
    .est-action-msg { font-size: 1.8rem; font-weight: 900; color: var(--est); background: #f0fdfa; padding: 20px 40px; border-radius: 15px; border: 3px dashed var(--est); margin-top: 10px;}

    /* Conteneur pour l'exercice d'Association */
    .est-assoc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 600px; text-align: left; font-size: 1.5rem; font-weight: bold; background: white; padding: 20px; border-radius: 12px; border: 2px solid #cfd8ea; }
    .est-assoc-col { display: flex; flex-direction: column; gap: 15px; }

    .thumbnails-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 15px; background: #f8fafc; border-top: 1px solid #e7edf8; margin-top: auto; }
    .thumb-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid #cfd8ea; background: white; color: var(--muted); cursor: pointer; transition: 0.2s; text-align: center; line-height: 1.2; font-family: 'Nunito', sans-serif;}
    .thumb-btn .th-q { font-weight: bold; font-size: 0.95rem; margin-bottom: 3px; display: block; color: inherit; }
    .thumb-btn .th-txt { font-size: 0.75rem; opacity: 0.9; }
    .thumb-btn:hover { background: #eef4ff; }
    .thumb-btn.active { background: var(--accent); color: white; border-color: var(--accent); transform: scale(1.05); }
    .thumb-btn.done { background: var(--success); color: white; border-color: var(--success); }

    #diapoContainer:fullscreen { max-width: none; width: 100vw; height: 100vh; border-radius: 0; border: none; justify-content: flex-start; padding-top: 4vh; overflow-y: auto; background: white;}
    #diapoContainer:fullscreen .thumbnails-bar { display: none !important; }
    #diapoContainer:fullscreen .table-box { padding-top: 30px; }

    /* LE MOTEUR DU TABLEAU EXACT */
    .board { background: transparent; border: none; padding: 0; width: 100%; max-width: 1000px; margin: 0 auto; container-type: inline-size;}
    .inner { position: relative; padding-top: 100px; padding-bottom: 100px; } 
    .board-columns { display: grid; grid-template-columns: repeat(var(--cols, 7), 1fr); gap: 4px; position: relative; z-index: 1; user-select: none; }
    .family-col { display: flex; flex-direction: column; gap: 6px; }
    .cursor { position: absolute; left: 0; box-sizing: border-box; background: color-mix(in srgb, var(--accent) 15%, transparent); border: 3px solid color-mix(in srgb, var(--accent-dark) 60%, transparent); border-radius: 8px; pointer-events: none; transition: transform 1s ease-in-out, width 1s ease-in-out, top 1s ease-in-out, height 1s ease-in-out; z-index: 3; }
    .cursor::after { content: ","; position: absolute; bottom: 32px; right: -11px; font-family: 'Nunito', Arial, sans-serif; font-size: 3.5rem; font-weight: 800; color: var(--accent-dark); line-height: 0; text-shadow: 2px 2px 0 var(--panel), -2px -2px 0 var(--panel), 2px -2px 0 var(--panel), -2px 2px 0 var(--panel); z-index: 10; }
    .handle { position: absolute; left: 0; width: 140px; height: 75px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border: 2px solid #fff; border-radius: 12px; z-index: 11; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; user-select: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); padding: 6px; transition: transform 1s ease-in-out, top 1s ease-in-out; }
    .h-text { font-size: 1.1rem; font-weight: 900; line-height: 1.15; text-transform: uppercase; }
    .handle-top::after { content: ""; position: absolute; bottom: -14px; left: calc(50% + var(--decal, 0px)); transform: translateX(-50%); border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 14px solid var(--accent-dark); }
    .handle-bottom::before { content: ""; position: absolute; top: -14px; left: calc(50% + var(--decal, 0px)); transform: translateX(-50%); border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 14px solid var(--accent); }
    .head-group { display: grid; gap: 4px; }
    .unitBtn { background: color-mix(in srgb, var(--accent) 12%, #fff); border: 2px solid var(--accent); border-radius: 8px; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0; }
    .unitBtn span { font-weight: 700; }
    .unitBtn.empty-unit { background: transparent; border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .cell { position: relative; background: transparent; min-height: auto; display: flex; align-items: stretch; justify-content: center; }
    .slots { margin-top: 0; display: grid; gap: 4px; width: 100%; align-items: stretch; }
    .digit { box-sizing: border-box; width: 100%; text-align: center; font-weight: 600; font-size: 2.8rem; border: 2px solid var(--accent); border-radius: 8px; background: #fff; color: #000; padding: 0 4px; min-height: 92px; outline: none; font-family: 'Nunito', sans-serif; }
    /* un tableau élargi (nombre qui déborde) garde des chiffres entiers dans leurs cases */
    @supports (width: 1cqw) { .digit { font-size: min(2.8rem, calc(95cqw / var(--n, 7))); } }
    .unit-highlight, .unit-highlight-text { color: var(--accent-dark) !important; font-weight: 900 !important; text-shadow: 0 0 1px var(--accent-dark), 0 0 1px var(--accent-dark); }
    .subhead-group { display: grid; gap: 4px; height: 22px; position: relative; z-index: 4; pointer-events: none; }
    .sub-lab-wrapper { display: flex; justify-content: center; align-items: flex-end; }
    .sub-lab { white-space: nowrap; font-weight: 900; color: color-mix(in srgb, var(--accent-dark) 90%, black); line-height: 1; }

    /* LAYOUT IMPRESSION */
    #printContainer { display: none; width: 100%; max-width: 950px; background: white; }
    @media screen and (max-width: 700px) {
      body { padding: 8px; }
      .config-panel { padding: 12px; border-radius: 10px; }
      .config-header h2 { font-size: 1.05rem; line-height: 1.25; }
      .theme-grid { gap: 8px; }
      .config-col { flex: 1 1 145px !important; min-width: 0 !important; gap: 8px; }
      .theme-col { padding: 9px; }
      .theme-col .checkbox-list[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
      .bottom-config, .config-options, .btn-wrap, .print-group { width: 100%; }
      .bottom-config { align-items: stretch; padding: 10px; }
      .config-options { gap: 10px; }
      .btn-wrap { align-items: stretch; }
      .print-group { flex-wrap: wrap; }
      .btn-main { min-height: 44px; padding: 9px 10px; }
      .diapo-container { margin-top: 8px; min-height: 100vh; min-height: 100svh; border-radius: 12px; }
      .table-box { padding: 10px 6px; }
      .digit { padding: 0; }
      .diapo-header { display: grid; grid-template-columns: 44px minmax(70px, 1fr) auto; gap: 6px; padding: 8px; }
      .diapo-header > div:last-child { gap: 5px !important; min-width: 0; }
      .btn-nav { min-width: 0; min-height: 44px; padding: 8px; }
      #btnPrev { width: 44px; overflow: hidden; color: transparent; font-size: 0; }
      #btnPrev::before { content: "◄"; color: var(--text); font-size: 1rem; }
      #btnNext { min-width: 0; max-width: 145px; font-size: .76rem; line-height: 1.15; }
      .slide-counter { font-size: .82rem; text-align: center; }
      .question-box { padding: 18px 10px 8px; }
      .question-text { font-size: clamp(1.25rem, 6vw, 1.9rem); line-height: 1.25; }
      .hint-box, .correction-box { padding-inline: 10px !important; }
      .correction-text { font-size: clamp(1.15rem, 5.6vw, 1.75rem); }
      .thumbnails-bar { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; }
      .thumb-btn { flex: 0 0 auto; }
      .est-assoc-grid { grid-template-columns: 1fr; gap: 10px; padding: 12px; font-size: 1.05rem; }
    }
    @media print {
      body { background: white; padding: 0; margin: 0; align-items: flex-start; justify-content: center; }
      .config-panel, .diapo-container { display: none !important; }
      #printContainer { display: block !important; margin: 0 auto; }
      .print-page { page-break-after: always; padding: 10px 0; }
      .print-header { display: flex; align-items: center; justify-content: flex-start; gap: 20px; font-size: 0.95rem; color: #333; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #ccc; }
      .print-seed { margin-left: auto; font-weight: bold; color: var(--muted); border: 2px solid var(--muted); padding: 4px 8px; border-radius: 6px; }
      .print-title { text-align: center; font-size: 1.4rem; margin: 5px 0 25px 0; color: #1f2a44; font-weight: bold; }
      .print-q { margin-bottom: 30px; page-break-inside: avoid; display: flex; flex-direction: column; align-items: flex-start; width: 100%;}
      .print-q-text { font-size: 1.25rem; margin-bottom: 15px; width: 100%; font-weight: bold; text-align: left;}
      .print-board { box-shadow: none !important; border: 2px solid var(--accent); margin: 0; padding: 10px 10px 20px 10px; border-radius: 10px; transform: none !important; width: 100%;}
      .print-inner { padding-top: 0 !important; padding-bottom: 0 !important; position: relative;}
      .print-static-comma { position: absolute; bottom: 8px; right: -12px; font-family: 'Nunito', sans-serif; font-size: 3.5rem; font-weight: 900; color: var(--accent-dark); line-height: 0; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff; z-index: 10;}
      
      .print-est-choices { display: flex; gap: 15px; justify-content: flex-start; margin-top: 10px; flex-wrap: wrap;}
      .print-est-box { border: 2px solid #ccc; padding: 8px 15px; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;}
      .print-est-box.correct { border-color: var(--success); background: #f0fdf4; font-weight: bold;}
      .print-est-check { width: 20px; height: 20px; border: 2px solid #999; border-radius: 4px; display: inline-block;}
      .print-est-box.correct .print-est-check { background: var(--success); border-color: var(--success); position: relative;}
      .print-est-box.correct .print-est-check::after { content: "✓"; color: white; position: absolute; top: -4px; left: 2px; font-size: 16px;}
      
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>

<body>

  <div class="config-panel">
    <div class="config-header">
      <h2>📏 Générateur : conversions et ordres de grandeur</h2>
    </div>
    
    <div class="theme-grid">
      <div class="config-col" style="flex: 1; min-width: 160px;">
          <div class="theme-col length">
            <h3>Longueur (m)</h3>
            <div class="checkbox-list">
              <label class="cb-row"><input type="checkbox" value="length"> <div><strong>km ↔ mm</strong></div></label>
            </div>
          </div>
          <div class="theme-col mass">
            <h3>Masse (g)</h3>
            <div class="checkbox-list">
              <label class="cb-row"><input type="checkbox" value="mass"> <div><strong>kg ↔ mg</strong></div></label>
              <label class="cb-row"><input type="checkbox" value="massT"> <div><strong>t ↔ mg</strong></div></label>
            </div>
          </div>
          <div class="theme-col cap">
            <h3>Capacité (L)</h3>
            <div class="checkbox-list">
              <label class="cb-row"><input type="checkbox" value="volL"> <div><strong>kL ↔ mL</strong></div></label>
            </div>
          </div>
      </div>

      <div class="config-col" style="flex: 1; min-width: 160px;">
          <div class="theme-col area">
            <h3>Aire (m²)</h3>
            <div class="checkbox-list">
              <label class="cb-row"><input type="checkbox" value="area"> <div><strong>km² ↔ mm²</strong></div></label>
            </div>
          </div>
          <div class="theme-col vol">
            <h3>Volume (m³)</h3>
            <div class="checkbox-list">
              <label class="cb-row"><input type="checkbox" value="volM3"> <div><strong>km³ ↔ mm³</strong></div></label>
              <label class="cb-row"><input type="checkbox" value="cross"> <div><strong>L ↔ m³</strong></div></label>
            </div>
          </div>
      </div>

      <div class="config-col" style="flex: 1.5; min-width: 250px;">
          <div class="theme-col prob" style="height: 100%;">
            <h3>Problèmes de calcul</h3>
            <div class="checkbox-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <label class="cb-row"><input type="checkbox" value="prob_add"> <div><strong>Additions (+)</strong></div></label>
              <label class="cb-row"><input type="checkbox" value="prob_sub"> <div><strong>Soustractions (-)</strong></div></label>
              <label class="cb-row"><input type="checkbox" value="prob_mult"> <div><strong>Multiplications (×)</strong></div></label>
              <label class="cb-row"><input type="checkbox" value="prob_div"> <div><strong>Divisions (÷)</strong></div></label>
              <label class="cb-row"><input type="checkbox" value="prob_frac"> <div><strong>Fractions (¼, ½)</strong></div></label>

  <script>
    const THEMES = {
      length:['#1283ff','#0b67c6'], mass:['#16a34a','#0e7a36'], massT:['#16a34a','#0e7a36'],
      volL:['#06b6d4','#0a8aa3'], area:['#f59e0b','#b77207'], volM3:['#7c3aed','#5a27b0'], cross:['#db2777','#a81d5a']
    };
    const CROSS_LABELS = { '3_2': 'kL', '4_0': 'hL', '4_1': 'daL', '4_2': 'L', '5_0': 'dL', '5_1': 'cL', '5_2': 'mL' };
    const AREA_LABELS = { '1_1': 'ha', '2_1': 'a' };
    const SCHEMAS = {
      length:{id:'length', label:'Longueur (m)', units:['km','hm','dam','m','dm','cm','mm'], slots:1},
      mass:  {id:'mass', label:'Masse (g)', units:['kg','hg','dag','g','dg','cg','mg'], slots:1},
      massT: {id:'massT', label:'Masse complète (t)', units:['t','q','-','kg','hg','dag','g','dg','cg','mg'], slots:1},
      volL:  {id:'volL', label:'Capacité (L)', units:['kL','hL','daL','L','dL','cL','mL'], slots:1},
      area:  {id:'area', label:'Aire (m²)', units:['km²','hm²','dam²','m²','dm²','cm²','mm²'], slots:2, labels: AREA_LABELS},
      volM3: {id:'volM3', label:'Volume (m³)', units:['km³','hm³','dam³','m³','dm³','cm³','mm³'], slots:3},
      cross: {id:'cross', label:'Litres ↔ m³', units:['km³','hm³','dam³','m³','dm³','cm³','mm³'], slots:3, labels: CROSS_LABELS}
    };

    /* =========================================
       NOMBRES EXACTS
       Un nombre est une chaîne « 12,5 » (virgule, sans espace) : on ne calcule
       jamais en virgule flottante, on déplace la virgule (calcul exact).
       ========================================= */
    const NBSP = ' ';
    function versChaine(v) { return String(v).replace('.', ','); }
    function normaliser(s) {
      let [e, d = ''] = String(s).replace('.', ',').split(',');
      e = e.replace(/^0+/, '') || '0';
      d = d.replace(/0+$/, '');
      return d ? `${e},${d}` : e;
    }
    // × 10^k, exactement
    function decaler(s, k) {
      let [e, d = ''] = String(s).replace('.', ',').split(',');
      let chiffres = e + d, virgule = e.length + k;
      if (virgule < 1) { chiffres = '0'.repeat(1 - virgule) + chiffres; virgule = 1; }
      if (virgule > chiffres.length) chiffres += '0'.repeat(virgule - chiffres.length);
      return normaliser(chiffres.slice(0, virgule) + ',' + chiffres.slice(virgule));
    }
    // un entier n compté en 10^-d (ex. depuisEntier(215, 2) = « 2,15 »)
    function depuisEntier(n, d = 0) { return decaler(String(n), -d); }
    // l'entier qui vaut s × 10^d (ex. versEntier(« 2,15 », 2) = 215)
    function versEntier(s, d = 0) { return parseInt(decaler(s, d), 10); }
    // écriture à la française : espaces (insécables) par groupes de trois
    function ecrire(s) {
      let [e, d] = String(s).split(',');
      let r = e.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
      if (d !== undefined) r += ',' + d.replace(/(\d{3})(?=\d)/g, '$1' + NBSP);
      return r;
    }
    function mesure(s, u) { return `${ecrire(s)}${NBSP}${u}`; }
    // un nombre ne se sépare ni de son unité, ni du nombre qui le suit ; « ? », « ! », « : » restent collés
    function typo(html) {
      return String(html)
        .replace(/(\d) (?=[^\s<])/g, '$1' + NBSP)
        .replace(/ ([?!:;»])/g, NBSP + '$1')
        .replace(/« /g, '«' + NBSP);
    }
    // puissance de 10 de chaque unité par rapport à l'unité principale (pour comparer deux mesures)
    const PUISSANCE = { mm:-3, cm:-2, dm:-1, m:0, dam:1, hm:2, km:3, mg:-3, cg:-2, dg:-1, g:0, dag:1, hg:2, kg:3, q:5, t:6,
      mL:-3, cL:-2, dL:-1, L:0, daL:1, hL:2, kL:3, 'mm²':-6, 'cm²':-4, 'dm²':-2, 'm²':0, 'dam²':2, 'hm²':4, 'km²':6,
      'mm³':-9, 'cm³':-6, 'dm³':-3, 'm³':0, 'dam³':3, 'hm³':6, 'km³':9 };
    function valeurDe(v, u) { return decaler(versChaine(v), PUISSANCE[u]); }

    /* =========================================
       LE TABLEAU : place des unités, élargissement
       ========================================= */
    // position (numéro de case) du chiffre des unités d'une unité dans le tableau de base
    function posUnite(schema, unite) {
      const i = schema.units.indexOf(unite);
      if (i >= 0) return i * schema.slots + schema.slots - 1;
      for (const [k, v] of Object.entries(schema.labels || {})) {
        if (v === unite) { const [c, s] = k.split('_').map(Number); return c * schema.slots + s; }
      }
      return -1;
    }
    // cases occupées par un nombre dont le chiffre des unités est en « pos »
    function etendue(s, pos) { const [e, d = ''] = s.split(','); return [pos - e.length + 1, pos + d.length]; }
    // le tableau s'élargit (colonnes sans nom) quand le nombre en déborde
    function tableauPour(base, valStr, srcPos, calcStr, tgtPos) {
      const n = base.units.length * base.slots;
      const [a1, b1] = etendue(valStr, srcPos), [a2, b2] = etendue(calcStr, tgtPos);
      const min = Math.min(a1, a2), max = Math.max(b1, b2);
      const extG = min < 0 ? Math.ceil(-min / base.slots) : 0;
      const extD = max > n - 1 ? Math.ceil((max - n + 1) / base.slots) : 0;
      let schema = base;
      if (extG || extD) {
        let labels = null;
        if (base.labels) {
          labels = {};
          for (const [k, v] of Object.entries(base.labels)) { const [c, s] = k.split('_').map(Number); labels[`${c + extG}_${s}`] = v; }
        }
        schema = { ...base, units: [...Array(extG).fill(''), ...base.units, ...Array(extD).fill('')], labels };
      }
      const dec = extG * base.slots;
      const sourcePos = srcPos + dec, targetPos = tgtPos + dec;
      return { schema, sourcePos, targetPos, sourceIdx: Math.floor(sourcePos / base.slots), targetIdx: Math.floor(targetPos / base.slots) };
    }
    // les chiffres de la question (et, pour la correction, du résultat) case par case
    function chiffresDuTableau(q, isCorrection) {
      const total = q.schema.units.length * q.schema.slots;
      const digits = new Array(total).fill('');
      const [e, d = ''] = q.valStr.split(',');
      for (let i = 0; i < e.length; i++) digits[q.sourcePos - e.length + 1 + i] = e[i];
      for (let i = 0; i < d.length; i++) digits[q.sourcePos + 1 + i] = d[i];
      if (isCorrection) {
        let minIdx = total, maxIdx = -1;
        digits.forEach((v, i) => { if (v !== '') { minIdx = Math.min(minIdx, i); maxIdx = Math.max(maxIdx, i); } });
        for (let i = Math.min(minIdx, q.targetPos); i <= Math.max(maxIdx, q.targetPos); i++) if (digits[i] === '') digits[i] = '0';
      }
      return digits;
    }

    /* =========================================
       LES BANQUES
       ========================================= */

    // (mm, g, mL) ; un objet n'est tiré que si les nombres de la question lui vont.

    function seededRandom() {
        var t = prngSeed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    function setSeed(str) {
        let h = 2166136261 >>> 0;
        for(let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);

    function questionDeConversion(base, valStr, sourceUnit, targetUnit, srcPos, tgtPos) {

    const LITRES = ['hL', 'L', 'dL', 'cL', 'mL'];
    const CUBES = ['m³', 'dm³', 'cm³'];
    function buildCrossLogic(level) {
      const base = SCHEMAS.cross;
      const paires = [];
      for (const l of LITRES) for (const c of CUBES) {
        const pl = posUnite(base, l), pc = posUnite(base, c);
        paires.push([l, c, pl, pc], [c, l, pc, pl]);
      }
      // niveau 1 : jamais vers une unité plus grande
      const possibles = paires.filter(([, , a, b]) => level === 1 ? b >= a : true);
      const [src, tgt, a, b] = pick(possibles);
      return questionDeConversion(base, valeurDuNiveau(level), src, tgt, a, b);
    }

      let direction = (level === 1) ? 1 : (rand(1, 2) === 1 ? 1 : -1);

      let validStarts = [];
      for (let i = 0; i < schema.units.length; i++) {
          let targetIdx = i + (gap * direction);
          if (targetIdx >= 0 && targetIdx < schema.units.length && schema.units[i] !== '-' && schema.units[targetIdx] !== '-') validStarts.push(i);
      }
      let uIndex1 = pick(validStarts); let uIndex2 = uIndex1 + (gap * direction);

      const s = schema.slots;
      return questionDeConversion(schema, valStr, schema.units[uIndex1], schema.units[uIndex2], uIndex1 * s + s - 1, uIndex2 * s + s - 1);

            return tirer(() => {

                if (!objets.length) return null;
                const o = pick(objets);
                const conv = versEntier(v1, G.fin - pf);

                const debut = g === 'length' ? `J'assemble ${o.n} de <strong>${mesure(v1, G.grand)}</strong> avec ${autre}`

                return problemeAvec(G.s, v1, G.grand, petit, texte, corr);

        if (family === 'sub') {
            return tirer(() => {
                const g = pick(['length', 'mass', 'cap']), G = GRANDEURS[g];
                let v1;
                if (level === 1) v1 = String(rand(3, 9));
                else if (level === 2) v1 = depuisEntier(rand(2, 6) * 10 + 5, 1);
                else v1 = depuisEntier(rand(2, 5) * 100 + pick([15, 45, 85]), 2);
                const conv = versEntier(v1, G.fin - G.pf);   // en cm, g ou cL
                let v2;
                if (level === 1) v2 = rand(2, 9) * 10;
                else if (level === 2) v2 = rand(6, 9) * 10;
                else v2 = rand(25, Math.min(95, Math.floor((conv - 1) / 10))) * 10;
                if (v2 >= conv) return null;                  // jamais de reste négatif
                const f1 = versEntier(v1, G.fin);
                const objets = PROBLEMES.sub[g].filter(o => f1 >= o.min && f1 <= o.max);
                if (!objets.length) return null;
                const o = pick(objets);
                const texte = `Dans ${o.n} de <strong>${mesure(v1, G.grand)}</strong>, ${pick(o.a)} <strong>${mesure(v2, G.petit)}</strong>. Combien reste-t-il en <strong>${G.petit}</strong> ?`;
                const corr = `Calcul : ${ecrire(conv)} − ${ecrire(v2)} = <strong>${mesure(conv - v2, G.petit)}</strong>.`;
                return problemeAvec(G.s, v1, G.grand, G.petit, texte, corr);
            });
        }
        if (family === 'mult') {
            return tirer(() => {
                const g = pick(['length', 'mass', 'cap']), G = GRANDEURS[g];
                const o = pick(PROBLEMES.mult[g]);
                let v1, qte, src, tgt;
                if (level === 3) {
                    // en grande unité, au centième (pas de 0,05) : « Un dictionnaire fait 1,25 kg »
                    const pas = 10 ** (G.fin - 2) * 5;
                    const k = entre(o.min / pas, o.max / pas, k => (k * pas) % (10 ** G.fin) !== 0);
                    if (!k.length) return null;
                    v1 = depuisEntier(pick(k) * pas, G.fin); qte = rand(4, 8); src = G.grand; tgt = G.petit;
                } else {
                    // en petite unité : multiple de 10 au niveau 1, de 5 (et pas de 10) au niveau 2
                    const u = 10 ** G.pf;
                    const k = entre(o.min / u, o.max / u, k => level === 1 ? k % 10 === 0 : (k % 5 === 0 && k % 10 !== 0));
                    if (!k.length) return null;
                    v1 = String(pick(k)); qte = level === 1 ? rand(2, 5) : rand(6, 9); src = G.petit; tgt = G.grand;
                }
                const dS = src === G.grand ? G.fin : G.fin - G.pf;   // la source comptée en 10^-dS
                const total = depuisEntier(versEntier(v1, dS) * qte, dS);
                const sP = posUnite(G.s, src), tP = posUnite(G.s, tgt);
                const conv = decaler(total, tP - sP);
                const texte = `${o.n} fait <strong>${mesure(v1, src)}</strong>. Quel est le total pour <strong>${qte} ${o.p} identiques</strong> en <strong>${tgt}</strong> ?`;
                const corr = `1) Calcul : ${qte} × ${mesure(v1, src)} = ${mesure(total, src)}. <br> 2) Conversion : <strong>${mesure(conv, tgt)}</strong>.`;
                return problemeAvec(G.s, total, src, tgt, texte, corr);
            });
        }
        if (family === 'div') {
            return tirer(() => {
                const g = pick(['length', 'mass', 'cap']), G = GRANDEURS[g];
                const o = pick(PROBLEMES.div[g]);
                const div = level === 1 ? pick([2, 4]) : (level === 2 ? pick([3, 6]) : pick([4, 5, 7]));
                const dixiemes = level !== 1;
                const pas = 10 ** (G.fin - (dixiemes ? 1 : 0));         // le nombre de départ, en dixièmes ou en unités
                const versPetit = 10 ** (G.pf);                          // mm → cm, mL → cL
                const k = entre(o.min / pas, o.max / pas, k => (!dixiemes || k % 10 !== 0) && ((k * pas / versPetit) % div === 0));
                if (!k.length) return null;
                const n = pick(k);
                const v1 = depuisEntier(n * pas, G.fin);
                const conv = n * pas / versPetit;
                const texte = `Je partage ${o.n} de <strong>${mesure(v1, G.grand)}</strong> en <strong>${div} parts égales</strong>. Combien fait une part en <strong>${G.petit}</strong> ?`;
                const corr = `Calcul après conversion : ${ecrire(conv)} ÷ ${div} = <strong>${mesure(conv / div, G.petit)}</strong>.`;
                return problemeAvec(G.s, v1, G.grand, G.petit, texte, corr);
            });
        }
        if (family === 'frac') {
            return tirer(() => {
                const g = pick(['mass', 'cap']);
                const s = g === 'mass' ? SCHEMAS.mass : SCHEMAS.volL;
                const grand = g === 'mass' ? 'kg' : 'L', petit = g === 'mass' ? 'g' : 'mL';
                const DEMI = { num: 1, den: 2, le: "la moitié" }, QUART = { num: 1, den: 4, le: "le quart" }, TROIS = { num: 3, den: 4, le: "les trois quarts" };
                let v1, frac;
                if (level === 1) { v1 = "1"; frac = pick([DEMI, QUART]); }
                else if (level === 2) { v1 = pick(["2", "3", "4"]); frac = pick([DEMI, TROIS]); }
                else { v1 = pick(["1,2", "1,5", "2,4"]); frac = pick([QUART, TROIS]); }
                const conv = versEntier(v1, 3);
                const rep = conv * frac.num / frac.den;
                const objets = PROBLEMES.frac[g].filter(o => rep <= o.max);
                if (!objets.length || !Number.isInteger(rep)) return null;
                const o = pick(objets);
                let expr;
                if (level === 1) {
                    const mot = g === 'mass' ? 'kilogramme' : 'litre';
                    expr = frac === DEMI ? `un demi-${mot}` : `un quart de ${mot}`;
                } else expr = `${frac.le} de ${mesure(v1, grand)}`;
                const texte = `Dans une recette, il faut <strong>${expr}</strong> ${o.n}. Combien cela fait-il en <strong>${petit}</strong> ?`;
                const corr = `1) Conversion : ${mesure(v1, grand)} = ${mesure(conv, petit)}.<br> 2) Calcul : ${frac.le} de ${mesure(conv, petit)} = <strong>${mesure(rep, petit)}</strong>.`;
                return problemeAvec(s, v1, grand, petit, texte, corr);
            });
        }
        // family === 'geom'
        let mode = (level === 1) ? 'perim' : (level === 2 ? 'area' : pick(['perim', 'area']));
        if (mode === 'perim') {
            const m = level === 1 ? String(rand(3, 8)) : depuisEntier(rand(2, 5) * 10 + pick([2, 5]), 1);
            const cm = rand(2, 8) * 10;
            const mToCm = versEntier(m, 2), perim = (mToCm + cm) * 2;
            const texte = `Un rectangle mesure <strong>${mesure(m, 'm')}</strong> de long et <strong>${mesure(cm, 'cm')}</strong> de large. Quel est son périmètre en <strong>cm</strong> ?`;
            const corr = `1) Conversion : ${mesure(m, 'm')} = ${mesure(mToCm, 'cm')}.<br> 2) Calcul : (${ecrire(mToCm)} + ${cm}) × 2 = <strong>${mesure(perim, 'cm')}</strong>.`;
            return problemeAvec(SCHEMAS.length, m, 'm', 'cm', texte, corr);
        }
        return tirer(() => {
            const m = rand(2, 6), cm = (level === 2) ? rand(3, 9) * 10 : rand(4, 9) * 10;
            const objets = PROBLEMES.aire.filter(o => m >= o.m[0] && m <= o.m[1] && cm >= o.cm[0] && cm <= o.cm[1]);
            if (!objets.length) return null;
            const o = pick(objets);
            const cmToM = depuisEntier(cm, 2), aire = depuisEntier(m * cm, 2);
            const texte = `${o.n} rectangulaire mesure <strong>${mesure(m, 'm')}</strong> de long et <strong>${mesure(cm, 'cm')}</strong> de large. Quelle est son aire en <strong>m²</strong> ?`;
            const corr = `1) Conversion : ${mesure(cm, 'cm')} = ${mesure(cmToM, 'm')}.<br> 2) Aire : ${mesure(m, 'm')} × ${mesure(cmToM, 'm')} = <strong>${mesure(aire, 'm²')}</strong>.`;
            return problemeAvec(SCHEMAS.length, String(cm), 'cm', 'm', texte, corr);
        });
    }

    /* =========================================
       LE GÉNÉRATEUR DES ORDRES DE GRANDEUR
       ========================================= */
    const TOUTES_DIMS = ['len', 'mass', 'cap', 'area', 'vol'];
    function convertTricky(val, unit) {
        const v = versChaine(val);
        if (unit === 'g') return { val: decaler(v, -3), unit: 'kg' };
        if (unit === 'kg') return { val: decaler(v, 3), unit: 'g' };
        if (unit === 't') return { val: decaler(v, 3), unit: 'kg' };
        if (unit === 'mm') return { val: decaler(v, -1), unit: 'cm' };
        if (unit === 'cm') return { val: decaler(v, -2), unit: 'm' };
        if (unit === 'm') return { val: decaler(v, 2), unit: 'cm' };
        if (unit === 'km') return { val: decaler(v, 3), unit: 'm' };
        if (unit === 'mL') return { val: decaler(v, -1), unit: 'cL' };
        if (unit === 'cL') return { val: decaler(v, 1), unit: 'mL' };
        if (unit === 'L') return { val: decaler(v, 2), unit: 'cL' };
        return { val: normaliser(v), unit: unit };
    }
    // « La masse d'un œuf » → « La masse d'un œuf est d'environ »
    function debutDePhrase(n) { return `${majuscule(n)} est d'environ`; }
    // les choix A, B, C dans un ordre tiré au hasard ; le bon choix est le premier de la liste reçue
    function melangerChoix(choices) {
        let finalChoices = []; let correctIndex = 0;
        let indices = choices.map((c, i) => i); shuffle(indices);
        for (let i = 0; i < indices.length; i++) { finalChoices.push(choices[indices[i]]); if (indices[i] === 0) correctIndex = i; }
        return { choices: finalChoices, correctIndex };
    }
    // des mesures fausses toutes différentes entre elles et de la bonne (on compare les grandeurs, pas l'écriture)
    function distracteurs(bonne, candidats, n) {
        const vus = new Set([valeurDe(bonne.val, bonne.unit)]);
        const r = [];
        for (const c of shuffle([...candidats])) {
            const k = valeurDe(c.val, c.unit);
            if (vus.has(k) || c.val === '0') continue;
            vus.add(k); r.push(c);
            if (r.length === n) break;
        }
        return r;
    }

    function buildEstimationLogic(level, qTypeStr, allowedDims) {
        const dims = allowedDims && allowedDims.length ? allowedDims : TOUTES_DIMS;
        let qType = 1;
        if(qTypeStr === 'est_val') qType = 2;
        if(qTypeStr === 'est_obj') qType = 3;
        if(qTypeStr === 'est_tf') qType = 4;
        if(qTypeStr === 'est_action') qType = 5;
        if(qTypeStr === 'est_grandeur') qType = 6;
        if(qTypeStr === 'est_pont') qType = 7;
        if(qTypeStr === 'est_assoc') qType = 8;
        if(qTypeStr === 'est_trou') qType = 9;
        if(qTypeStr === 'est_tri') qType = 10;

        if (qType === 5) {
            let actionsList = ACTIONS_DB.filter(a => a.lvl <= level);
            if(actionsList.length === 0) actionsList = ACTIONS_DB;
            let act = pick(actionsList);
            return { isProblem: false, isEstimation: true, qType: 5, problemText: act.q, choices: [], correctIndex: 0, correctionText: act.c, phase: 0, textId: act.q, emoji: "🕵️" };
        }

        if (qType === 6) {
            let dim = pick(TOUTES_DIMS);
            let item = pick(EST_DB[dim]);
            let pickedQItem = pick(item.items);
            let qObject = pickedQItem.n;
            const NOMS = { len: "Une longueur", mass: "Une masse", cap: "Une capacité", area: "Une aire", vol: "Un volume" };
            let correctG = NOMS[dim];
            // « volume » et « capacité » jamais ensemble : les deux pourraient être justes
            const voisin = d => d === 'cap' ? 'vol' : (d === 'vol' ? 'cap' : null);
            const pris = [dim];
            for (const d of shuffle(TOUTES_DIMS.filter(d => d !== dim))) {
                if (pris.length === 3) break;
                if (!pris.some(p => voisin(p) === d)) pris.push(d);
            }
            const m = melangerChoix(pris.map(d => NOMS[d]));
            let problemText = `Quelle grandeur mesure-t-on pour : <strong>${qObject}</strong> ?`;
            return { isProblem: false, isEstimation: true, qType: 6, problemText: problemText, choices: m.choices, correctIndex: m.correctIndex, correctionText: `On cherche à mesurer ${correctG.toLowerCase()}.`, phase: 0, textId: problemText, emoji: pickedQItem.e };
        }

        if (qType === 7) {
            let pontsList = PONTS_DB.filter(p => p.lvl <= level);
            if(pontsList.length === 0) pontsList = PONTS_DB;
            let pont = pick(pontsList);
            const m = melangerChoix([pont.c, pont.w1, pont.w2]);
            return { isProblem: false, isEstimation: true, qType: 7, problemText: pont.q, choices: m.choices, correctIndex: m.correctIndex, correctionText: `L'équivalence est : <strong>${pont.c}</strong>.`, phase: 0, textId: pont.q, emoji: pont.e };
        }

        if (qType === 8) {
            let objects = [], values = [];
            const vues = new Set();
            const ajouter = (it, v, u) => { objects.push(pick(it.items).n); values.push(mesure(v, u)); vues.add(valeurDe(v, u)); };
            if (level === 1) {
                shuffle([...TOUTES_DIMS]).slice(0, 3).forEach(dim => {
                    let it = pick(EST_DB[dim].filter(i => i.lvl === 1));
                    if (!it) it = pick(EST_DB[dim]);
                    ajouter(it, versChaine(it.val), it.unit);
                });
            } else {
                let dim = pick(dims);
                let pool = shuffle(EST_DB[dim].filter(i => level === 3 || i.lvl <= 2));
                if (pool.length < 3) pool = shuffle([...EST_DB[dim]]);
                for (const it of pool) {
                    if (objects.length === 3) break;
                    if (vues.has(valeurDe(it.val, it.unit))) continue;   // deux objets de même mesure : association ambiguë
                    if (level === 3 && rand(1, 2) === 1) { const conv = convertTricky(it.val, it.unit); ajouter(it, conv.val, conv.unit); }
                    else ajouter(it, versChaine(it.val), it.unit);
                }
            }
            let shuffledVals = shuffle([...values]);
            let letters = ["A", "B", "C"];
            let htmlStr = `Associe chaque élément à la bonne valeur :<br><br>
               <div style="display:flex; justify-content:center; gap: 50px; font-size:0.9em; text-align:left;">
                 <div>1) ${objects[0]}<br>2) ${objects[1]}<br>3) ${objects[2]}</div>
                 <div>A) ${shuffledVals[0]}<br>B) ${shuffledVals[1]}<br>C) ${shuffledVals[2]}</div>
               </div>`;
            let correctStr = `1 → ${letters[shuffledVals.indexOf(values[0])]} | 2 → ${letters[shuffledVals.indexOf(values[1])]} | 3 → ${letters[shuffledVals.indexOf(values[2])]}`;
            return { isProblem: false, isEstimation: true, qType: 8, problemText: htmlStr, choices: [], correctIndex: 0, correctionText: `La bonne combinaison : <strong>${correctStr}</strong>.`, phase: 0, textId: objects.join(""), emoji: "🔗" };
        }

        if (qType === 9) {
            let dim = pick(dims);
            let db = EST_DB[dim].filter(item => item.lvl <= level);
            if(db.length === 0) db = EST_DB[dim];
            let targetItem = pick(db);
            let pickedQItem = pick(targetItem.items);
            let displayUnit = targetItem.unit;
            let displayVal = versChaine(targetItem.val);
            if (level === 3) {
                let conv = convertTricky(targetItem.val, targetItem.unit);
                displayUnit = conv.unit; displayVal = conv.val;
            }
            let problemText = `Complète la phrase : <br><br><strong>${debutDePhrase(pickedQItem.n)}</strong> ....... <strong>${displayUnit}</strong>.`;
            return { isProblem: false, isEstimation: true, qType: 9, problemText: problemText, choices: [], correctIndex: 0, correctionText: `Il fallait trouver la valeur : <strong>${ecrire(displayVal)}</strong>.`, phase: 0, textId: problemText, emoji: pickedQItem.e };
        }

        if (qType === 10) {
            let db = TRI_DB.filter(item => item.lvl <= level);
            if(db.length === 0) db = TRI_DB;
            let targetItem = pick(db);
            let sorted = [...targetItem.arr];
            let shuf = shuffle([...targetItem.arr]);
            let problemText = `Classe ces mesures de la plus petite à la plus grande :<br><br><span style='color:var(--accent); font-size:1.1em;'>${shuf.join(' &nbsp; | &nbsp; ')}</span>`;
            return { isProblem: false, isEstimation: true, qType: 10, problemText: problemText, choices: [], correctIndex: 0, correctionText: `Le bon ordre : <strong>${sorted.join(' &nbsp;&lt;&nbsp; ')}</strong>.`, phase: 0, textId: problemText, emoji: "📶" };
        }

        let dim = pick(dims);
        let db = EST_DB[dim].filter(item => item.lvl <= level);
        // « Quelle unité ? » : seulement les objets dont l'unité est vraiment la plus adaptée
        if (qType === 1) db = db.filter(item => item.unite !== false && UNITES_USUELLES[dim].includes(item.unit));
        if(db.length === 0) db = EST_DB[dim].filter(item => qType !== 1 || (item.unite !== false && UNITES_USUELLES[dim].includes(item.unit)));
        let targetItem = pick(db);

        let pickedQItem = pick(targetItem.items);
        let qObject = pickedQItem.n;
        let emoji = pickedQItem.e;
        const bonne = { val: versChaine(targetItem.val), unit: targetItem.unit };

        let problemText = "";
        let correctionText = `Rappel : ${targetItem.repere}.`;
        let choices = [];
        let friseHtml = "";

        if (qType === 1) {
            problemText = `Pour <strong>${qObject}</strong>, quelle est l'unité la plus adaptée ?`;
            let wrongUnits = shuffle(UNITES_USUELLES[dim].filter(u => u !== targetItem.unit)).slice(0, 2);
            choices = [targetItem.unit, wrongUnits[0], wrongUnits[1]];
            friseHtml = generateFriseHTML(dim);
        }
        else if (qType === 2) {
            problemText = `<strong>${debutDePhrase(qObject)}</strong> :`;
            let juste = bonne, pool;
            if (level === 1 || level === 2) {
                const v = Number(bonne.val.replace(',', '.'));
                pool = [1, 2, 3].map(k => ({ val: decaler(bonne.val, k), unit: bonne.unit }));
                if (v >= 10) pool.push({ val: decaler(bonne.val, -1), unit: bonne.unit });
                if (v >= 100) pool.push({ val: decaler(bonne.val, -2), unit: bonne.unit });
            } else {
                juste = convertTricky(targetItem.val, targetItem.unit);
                pool = [
                    { val: decaler(bonne.val, 1), unit: bonne.unit },
                    { val: decaler(juste.val, 2), unit: juste.unit },
                    { val: decaler(bonne.val, -1), unit: bonne.unit },
                    { val: decaler(juste.val, -1), unit: juste.unit },
                    { val: decaler(bonne.val, 2), unit: bonne.unit }
                ];
            }
            // pas de nombre trop petit pour être lu (« 0,15 cm » oui, « 0,015 cm » non)
            pool = pool.filter(c => !/^0,0/.test(c.val));
            const faux = distracteurs(juste, pool, 2);
            choices = [mesure(juste.val, juste.unit), ...faux.map(c => mesure(c.val, c.unit))];
        }
        else if (qType === 3) {
            problemText = `Qu'est-ce qui a une mesure d'environ <strong>${mesure(bonne.val, bonne.unit)}</strong> ?`;
            let wrongItems = shuffle(EST_DB[dim].filter(i => valeurDe(i.val, i.unit) !== valeurDe(targetItem.val, targetItem.unit))).slice(0, 2);
            choices = [majuscule(qObject), majuscule(pick(wrongItems[0].items).n), majuscule(pick(wrongItems[1].items).n)];
            emoji = null;
        }
        else if (qType === 4) {
            let isTrue = rand(1, 2) === 1;
            let affiche = bonne;
            if (!isTrue) {
                // faux : au moins 10 fois trop grand ou trop petit (jamais « 2 fois », qui reste « environ »)
                if (level === 1) affiche = { val: decaler(bonne.val, pick([2, 3])), unit: bonne.unit };
                else if (level === 2) affiche = { val: decaler(bonne.val, pick([1, -1])), unit: bonne.unit };
                else affiche = { val: bonne.val, unit: pick(UNITES_PIEGES[dim].filter(u => u !== bonne.unit)) };
            }
            problemText = `<strong>${debutDePhrase(qObject)} ${mesure(affiche.val, affiche.unit)}</strong>.`;
            const m = { choices: ["Vrai", "Faux"], correctIndex: isTrue ? 0 : 1 };
            correctionText = (isTrue ? "C'est vrai ! " : "C'est faux ! ") + correctionText;
            return { isProblem: false, isEstimation: true, qType, problemText, choices: m.choices, correctIndex: m.correctIndex, correctionText, phase: 0, textId: problemText, friseHtml, emoji };
        }

        const m = melangerChoix(choices);
        return { isProblem: false, isEstimation: true, qType, problemText, choices: m.choices, correctIndex: m.correctIndex, correctionText, phase: 0, textId: problemText, friseHtml, emoji };
    }

    /* =========================================
       LE TIRAGE D'UNE SÉRIE
       Chaque case cochée sort au moins une fois quand le nombre de questions le permet,
       chaque niveau coché aussi ; jamais deux fois le même énoncé.
       ========================================= */
    function construireQuestion(type, level, allowedDims) {
        if (type.startsWith('prob_')) return buildProblemLogic(level, type.replace('prob_', ''));
        if (type.startsWith('est_')) return buildEstimationLogic(level, type, allowedDims);
        return buildQuestionLogic(type, level);
    }
    function dimsDesCases(types) {
        let allowedDims = [];
        if (types.includes('length')) allowedDims.push('len');
        if (types.includes('mass') || types.includes('massT')) allowedDims.push('mass');
        if (types.includes('volL')) allowedDims.push('cap');
        if (types.includes('area')) allowedDims.push('area');
        if (types.includes('volM3') || types.includes('cross')) allowedDims.push('vol');
        return allowedDims;
    }
    // la suite des valeurs, chacune au moins une fois, dans un ordre tiré au hasard
    function repartir(valeurs, n) {
        let r = [];
        while (r.length < n) r = r.concat(shuffle([...valeurs]));
        return shuffle(r.slice(0, n));
    }
    function tirerSerie(types, levels, count, seed) {
        setSeed(seed);
        const allowedDims = dimsDesCases(types);
        const lesTypes = repartir(types, count), lesNiveaux = repartir(levels, count);
        const serie = [], vus = new Set();
        for (let i = 0; i < count; i++) {
            const type = lesTypes[i];
            // le niveau prévu d'abord, puis les autres niveaux cochés ; si tout est déjà sorti, la série s'arrête là
            const essais = [lesNiveaux[i], ...shuffle(levels.filter(l => l !== lesNiveaux[i]))];
            let q = null;
            for (const level of essais) {
                for (let t = 0; t < 60 && !q; t++) {
                    const c = construireQuestion(type, level, allowedDims);
                    if (!vus.has(c.textId)) q = c;
                }
                if (q) break;
            }
            if (!q) continue;
            vus.add(q.textId);
            q.caseCochee = type;
            serie.push(q);
        }
        return serie;
    }

    function montrerMessage(texte) {
      const el = document.getElementById('msgConfig');
      if (!el) return;
      el.textContent = texte || '';
      el.hidden = !texte;
    }

    function getQuizData() {
      let rawTypes = Array.from(document.querySelectorAll('.theme-grid input[type="checkbox"]:checked')).map(cb => cb.value);
      if (rawTypes.length === 0) { montrerMessage("⚠️ Coche au moins une case dans le menu !"); return false; }
      const levelCbs = document.querySelectorAll('input[name="cbLevel"]:checked');
      if (levelCbs.length === 0) { montrerMessage("⚠️ Coche au moins un niveau !"); return false; }
      montrerMessage('');

      let seedInputElem = document.getElementById('inputSeed');
      // le code est réécrit dans la fiche imprimée : on n'y laisse passer aucun caractère de balise
      let seedInput = seedInputElem.value.trim().toUpperCase().replace(/[<>&"'`]/g, '');
      if (!seedInput || seedInput === lastGeneratedSeed) {
          const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          seedInput = "";
          for(let i=0; i<4; i++) seedInput += chars.charAt(Math.floor(Math.random() * chars.length));
          seedInputElem.value = seedInput;
          lastGeneratedSeed = seedInput;
      } else {
          lastGeneratedSeed = "";
      }
      currentSeedStr = seedInput;

      let levels = Array.from(levelCbs).map(cb => parseInt(cb.value));
      let targetCount = parseInt(document.getElementById('selCount').value, 10);
      quizData = tirerSerie(rawTypes, levels, targetCount, currentSeedStr);
      return true;
    }

    /* =========================================
       CONSTRUCTION DU DOM
       ========================================= */
    function buildHTMLColumns(schema, isPrint = false, q = null, mode = 'diapo') {
      let html = '';
      const labelsMap = schema.labels || null;
      let digits = [];
      if (isPrint && q && mode !== 'empty') digits = chiffresDuTableau(q, mode === 'correction');

      let slotIndex = 0;
      schema.units.forEach((u, ci) => {
        html += `<div class="family-col">`;
        html += `<div class="head-group" style="grid-template-columns: repeat(${schema.slots}, 1fr)">`;
        for(let si=0; si<schema.slots; si++){
          let isLast = (si === schema.slots - 1);
          let classes = `unitBtn ${!isLast || !u ? 'empty-unit' : ''}`;
          if (isPrint && mode === 'correction' && isLast && u === q.targetUnit && ci * schema.slots + si === q.targetPos) classes += ' unit-highlight-text';
          let styleText = '';
          if (isLast && u.length >= 4 && schema.slots === 3) styleText = 'font-size: 0.82em; letter-spacing: -0.5px;';
          html += `<div class="${classes}">${isLast && u ? `<span style="${styleText}">${u}</span>` : ''}</div>`;
        }
        html += `</div>`;

        if (labelsMap) {
            html += `<div class="subhead-group" style="grid-template-columns: repeat(${schema.slots}, 1fr)">`;
            for (let si = 0; si < schema.slots; si++) {
                let key = `${ci}_${si}`;
                let lab = labelsMap[key];
                let hl = isPrint && mode === 'correction' && lab === q.targetUnit && ci * schema.slots + si === q.targetPos ? ' unit-highlight-text' : '';
                html += `<div class="sub-lab-wrapper">${lab ? `<span class="sub-lab${hl}">${lab}</span>` : ''}</div>`;
            }
            html += `</div>`;
        }

        html += `<div class="cell"><div class="slots" style="grid-template-columns: repeat(${schema.slots}, 1fr)">`;
        for(let i=0; i<schema.slots; i++){
          let isTargetSlot = isPrint && mode === 'correction' && slotIndex === q.targetPos;
          let extraClass = isTargetSlot ? ' unit-highlight' : '';
          let val = (isPrint && mode !== 'empty') ? digits[slotIndex] : '';
          html += `<input class="digit${extraClass}" readonly tabindex="-1" aria-hidden="true" value="${val}" />`;
          if (isPrint && isTargetSlot && q.calcValStr.includes(',')) html += `<div class="print-static-comma">,</div>`;
          slotIndex++;
        }
        html += `</div></div></div>`;
      });
      return html;
    }

    // Au téléphone (décision de Gwenaël du 21/11, choix B) : un tableau de plus de 12 cases (aires, volumes,
    // tableau élargi) ne montre que les colonnes où il y a des chiffres, plus une voisine si la place le permet.
    // Mêmes colonnes à l'aide et à la correction : rien ne bouge d'une étape à l'autre.
    const CASES_TELEPHONE = 12;
    function petitEcran() { return typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width: 700px)').matches; }
    function vueColonnesUtiles(q) {
      const s = q.schema, sl = s.slots, nc = s.units.length;
      if (nc * sl <= CASES_TELEPHONE) return q;
      const d = chiffresDuTableau(q, true);
      let a = Math.min(q.sourcePos, q.targetPos), b = Math.max(q.sourcePos, q.targetPos);
      d.forEach((v, i) => { if (v) { a = Math.min(a, i); b = Math.max(b, i); } });
      let c0 = Math.floor(a / sl), c1 = Math.floor(b / sl);
      if ((c1 - c0 + 2) * sl <= CASES_TELEPHONE && c0 > 0) c0--;
      if ((c1 - c0 + 2) * sl <= CASES_TELEPHONE && c1 < nc - 1) c1++;
      let labels = null;
      if (s.labels) {
        labels = {};
        for (const [k, v] of Object.entries(s.labels)) { const [c, x] = k.split('_').map(Number); if (c >= c0 && c <= c1) labels[`${c - c0}_${x}`] = v; }
      }
      return { ...q, schema: { ...s, units: s.units.slice(c0, c1 + 1), labels }, sourcePos: q.sourcePos - c0 * sl, targetPos: q.targetPos - c0 * sl };
    }
    function vueDuTableau(q) {
      const tel = petitEcran();
      if (!q._vue || q._vueTel !== tel) { q._vue = tel ? vueColonnesUtiles(q) : q; q._vueTel = tel; }
      return q._vue;
    }

    function buildDiapoTableDOM(schema) {
      currentSchema = schema;
      const [c, cd] = THEMES[schema.id];
      document.documentElement.style.setProperty('--accent', c);
      document.documentElement.style.setProperty('--accent-dark', cd);
      const columnsContainer = document.getElementById('diapoBoardColumns');
      columnsContainer.style.setProperty('--cols', schema.units.length);
      columnsContainer.style.setProperty('--n', schema.units.length * schema.slots);
      columnsContainer.innerHTML = buildHTMLColumns(schema, false, null, 'diapo');
    }

    function buildEstimationDOM(q, showCorrection = false) {
      const estBoard = document.getElementById('estBoard');
      estBoard.innerHTML = '';
      if (q.qType === 1) estBoard.innerHTML = q.friseHtml;

      if (q.choices && q.choices.length > 0) {
          let choicesContainer = document.createElement('div');
          choicesContainer.className = 'est-choices-container';
          const labels = ["A", "B", "C"];
          q.choices.forEach((choice, idx) => {
             let btn = document.createElement('div');
             btn.className = 'est-btn';
             if (q.choices.length === 2) {
                 btn.innerHTML = typo(choice);
                 btn.style.justifyContent = 'center';
             } else {
                 btn.innerHTML = `<div class="est-badge">${labels[idx]}</div> <div>${typo(choice)}</div>`;
             }
             if (showCorrection) {
                 if (idx === q.correctIndex) btn.classList.add('correct');
                 else btn.classList.add('wrong');
             }
             choicesContainer.appendChild(btn);
          });
          estBoard.appendChild(choicesContainer);
      } else {
          if (!showCorrection && q.qType !== 8 && q.qType !== 10) {
              let msg = "🖍️ À ton ardoise !";
              if(q.qType === 5) msg = "👀 Prépare-toi à montrer !";
              estBoard.innerHTML = `<div class="est-action-msg">${msg}</div>`;
          }
      }
    }

    function fillDiapoDigits(q, isCorrection) {
      const inputs = Array.from(document.querySelectorAll('#diapoBoardColumns .digit'));
      const digits = chiffresDuTableau(q, isCorrection);
      inputs.forEach((inp, i) => { inp.value = digits[i] || ''; inp.classList.remove('unit-highlight'); });
    }

    // la fenêtre de l'unité se pose sur la case « pos » (le chiffre des unités de l'unité « unite »)
    function positionDiapoCursor(pos, animate, q, isFinal) {
      const cursor = document.getElementById('diapoCursor');
      const handles = [document.getElementById('diapoHandleTop'), document.getElementById('diapoHandleBottom')];
      const inner = document.getElementById('diapoInner');
      const slots = currentSchema.slots;
      const colDiv = document.getElementById('diapoBoardColumns').children[Math.floor(pos / slots)];
      if (!colDiv) return;
      const si = pos % slots;
      const headBtn = colDiv.querySelectorAll('.unitBtn')[si];
      const cellTarget = colDiv.querySelectorAll('.digit')[si];
      if (!headBtn || !cellTarget) return;
      const unite = isFinal ? q.targetUnit : q.sourceUnit;
      const labels = Array.from(colDiv.querySelectorAll('.sub-lab-wrapper'));
      const labEl = labels[si] && labels[si].querySelector('.sub-lab');
      const texteUnite = (labEl && labEl.textContent === unite) ? labEl : headBtn;

      const trans = animate ? 'transform 1s ease-in-out, width 1s ease-in-out, top 1s ease-in-out, height 1s ease-in-out' : 'none';
      const handleTrans = animate ? 'transform 1s ease-in-out, top 1s ease-in-out' : 'none';
      cursor.style.transition = trans;
      handles.forEach(h => h.style.transition = handleTrans);

      const innerRect = inner.getBoundingClientRect();
      const headRect = headBtn.getBoundingClientRect();
      const cellRect = cellTarget.getBoundingClientRect();

      let x = cellRect.left - innerRect.left;
      let w = cellRect.width;
      let cx = x + w / 2;
      let gap = 4;
      cursor.style.width = `${w + gap}px`;
      cursor.style.transform = `translateX(${x - gap/2}px)`;

      let topPx = headRect.top - innerRect.top;
      let bottomPx = cellRect.bottom - innerRect.top;
      cursor.style.top = `${topPx - gap/2}px`;
      cursor.style.height = `${(bottomPx - topPx) + gap}px`;

      handles[0].style.top = `${topPx - 75 - 14}px`;
      handles[1].style.top = `${bottomPx + 14}px`;
      // une étiquette près du bord reste dans le cadre ; sa pointe, elle, reste sur la colonne
      const boxRect = document.getElementById('tBox').getBoundingClientRect();
      const demi = handles[0].offsetWidth / 2;
      const mini = boxRect.left - innerRect.left + 4 + demi, maxi = boxRect.right - innerRect.left - 4 - demi;
      const hx = maxi > mini ? Math.min(Math.max(cx, mini), maxi) : cx;
      handles.forEach(h => { h.style.transform = `translateX(calc(${hx}px - 50%))`; h.style.setProperty('--decal', `${cx - hx}px`); });

      document.querySelectorAll('#diapoBoardColumns .digit').forEach(inp => inp.classList.remove('unit-highlight'));
      cellTarget.classList.add('unit-highlight');
      document.querySelectorAll('#diapoBoardColumns .unitBtn, #diapoBoardColumns .sub-lab').forEach(b => b.classList.remove('unit-highlight-text'));
      texteUnite.classList.add('unit-highlight-text');

      let currentStr = isFinal ? q.calcValStr : q.valStr;
      if(!document.getElementById('hideCommaStyle')) {
         const style = document.createElement('style');
         style.id = 'hideCommaStyle';
         style.innerHTML = `.cursor.hide-comma::after { display: none !important; }`;
         document.head.appendChild(style);
      }
      if (!currentStr.includes(',')) cursor.classList.add('hide-comma');
      else cursor.classList.remove('hide-comma');
    }

    /* =========================================
       NAVIGATION DIAPORAMA ET UI
       ========================================= */
    function buildThumbnails() {
      const tb = document.getElementById('thumbBar'); tb.innerHTML = '';
      quizData.forEach((q, idx) => {
        let btn = document.createElement('button'); btn.className = 'thumb-btn';
        if(q.isEstimation) {
            let label = "Estimer";
            if(q.qType === 5) label = "Action";
            if(q.qType === 6) label = "Grandeur";
            if(q.qType === 7) label = "Pont";
            if(q.qType === 8) label = "Associer";
            if(q.qType === 9) label = "Trou";
            if(q.qType === 10) label = "Trier";
            btn.innerHTML = `<span class="th-q">Q${idx + 1}</span><span class="th-txt">${label}</span>`;
        } else if(q.isProblem) {
            btn.innerHTML = `<span class="th-q">Q${idx + 1}</span><span class="th-txt">Problème</span>`;
        } else {
            btn.innerHTML = `<span class="th-q">Q${idx + 1}</span><span class="th-txt">${mesure(q.valStr, q.sourceUnit)} = …${NBSP}${q.targetUnit}</span>`;
        }
        btn.onclick = () => loadSlide(idx, q.phase);
        tb.appendChild(btn);
      });
    }

    function updateThumbnails() {
      const btns = document.getElementById('thumbBar').children;
      for(let i=0; i<btns.length; i++) {
        btns[i].className = 'thumb-btn';
        if (quizData[i].phase === 2) btns[i].classList.add('done');
        if (i === currentIndex) btns[i].classList.add('active');
      }
    }

    function updateUI() {
      const q = quizData[currentIndex]; const btnNext = document.getElementById('btnNext');
      document.getElementById('slideCounter').textContent = `Question ${currentIndex + 1} / ${quizData.length}`;
      document.getElementById('btnPrev').disabled = (currentIndex === 0 && q.phase === 0);

      const tBox = document.getElementById('tBox');
      const mainBoard = document.getElementById('mainBoard');
      const estBoard = document.getElementById('estBoard');
      const qText = document.getElementById('qText');
      const qSubtext = document.getElementById('qSubtext');
      const qEmoji = document.getElementById('qEmoji');
      qSubtext.innerHTML = "";

      if (q.isEstimation && q.emoji) {
          qEmoji.innerText = q.emoji;
          qEmoji.style.display = 'block';
      } else {
          qEmoji.style.display = 'none';
      }

      if (q.isEstimation) {
          mainBoard.style.display = 'none';
          document.documentElement.style.setProperty('--accent', '#0d9488');
          qText.innerHTML = typo(q.problemText);
          if (q.phase === 0) {
              estBoard.style.display = 'none';
              tBox.style.display = 'flex';
              let btnText = "Voir les choix 💡 ►";
              if (q.choices && q.choices.length === 0) btnText = "Correction ✓ ►";
              if (q.qType === 5) btnText = "Lancer l'action 💡 ►";
              btnNext.innerHTML = btnText;
          }
          else if (q.phase === 1) {
              if (q.choices && q.choices.length > 0) qSubtext.innerHTML = `<span style="color:var(--muted)">Quel est ton choix${NBSP}?</span>`;
              tBox.style.display = 'flex';
              estBoard.style.display = 'flex';
              buildEstimationDOM(q, false);
              btnNext.innerHTML = "Correction ✓ ►";
          }
          else if (q.phase === 2) {
              qSubtext.innerHTML = `<span style="color:var(--success)">${typo(q.correctionText)}</span>`;
              tBox.style.display = 'flex';
              estBoard.style.display = 'flex';
              buildEstimationDOM(q, true);
              if (currentIndex === quizData.length - 1) { btnNext.innerHTML = "Terminé ✓"; btnNext.disabled = true; }
              else { btnNext.innerHTML = "Question suiv. ►"; btnNext.disabled = false; }
          }
      }
      else if (q.isProblem) {
          mainBoard.style.display = 'block';
          estBoard.style.display = 'none';
          qText.innerHTML = typo(q.problemText);
          if (q.phase === 0) {
            tBox.style.display = 'none';
            btnNext.innerHTML = "Aide : placer dans le tableau 💡 ►";
          }
          else if (q.phase === 1) {
            qSubtext.innerHTML = `<span style="color:var(--muted)">Étape 1${NBSP}: place la grandeur à convertir dans le tableau.</span>`;
            tBox.style.display = 'flex';
            const v = vueDuTableau(q);
            buildDiapoTableDOM(v.schema);
            fillDiapoDigits(v, false);
            requestAnimationFrame(() => positionDiapoCursor(v.sourcePos, false, v, false));
            btnNext.innerHTML = "Correction et calcul ✓ ►";
          }
          else if (q.phase === 2) {
            qSubtext.innerHTML = `<span style="color:var(--success)">${typo(q.correctionText)}</span>`;
            tBox.style.display = 'flex';
            const v = vueDuTableau(q);
            if(document.getElementById('diapoBoardColumns').children.length === 0 || currentSchema !== v.schema) {
               buildDiapoTableDOM(v.schema);
            }
            fillDiapoDigits(v, true);
            requestAnimationFrame(() => positionDiapoCursor(v.targetPos, true, v, true));
            if (currentIndex === quizData.length - 1) { btnNext.innerHTML = "Terminé ✓"; btnNext.disabled = true; }
            else { btnNext.innerHTML = "Question suiv. ►"; btnNext.disabled = false; }
          }
      }
      else {
          mainBoard.style.display = 'block';
          estBoard.style.display = 'none';
          let formattedSource = `<span class="nb">${highlightUnitText(q.valStr)}${NBSP}<span class="unit-highlight-text">${q.sourceUnit}</span></span>`;
          let formattedTarget = `<span class="nb">${highlightUnitText(q.calcValStr)}${NBSP}<span class="unit-highlight-text">${q.targetUnit}</span></span>`;
          let trous = `<span class="nb">.............${NBSP}${q.targetUnit}</span>`;

          if (q.phase === 0) {
            qText.innerHTML = `Convertis${NBSP}: ${formattedSource} = ${trous}`;
            tBox.style.display = 'none';
            btnNext.innerHTML = "Aide : placer dans le tableau 💡 ►";
          }
          else if (q.phase === 1) {
            qText.innerHTML = `Convertis${NBSP}: ${formattedSource} = ${trous}`;
            tBox.style.display = 'flex';
            const v = vueDuTableau(q);
            buildDiapoTableDOM(v.schema);
            fillDiapoDigits(v, false);
            requestAnimationFrame(() => positionDiapoCursor(v.sourcePos, false, v, false));
            btnNext.innerHTML = "Correction 👀 ►";
          }
          else if (q.phase === 2) {
            qText.innerHTML = `Convertis${NBSP}: <span class="nb">${mesure(q.valStr, q.sourceUnit)}</span> = ${formattedTarget}`;
            tBox.style.display = 'flex';
            const v = vueDuTableau(q);
            if(document.getElementById('diapoBoardColumns').children.length === 0 || currentSchema !== v.schema) {
               buildDiapoTableDOM(v.schema);
            }
            fillDiapoDigits(v, true);
            requestAnimationFrame(() => positionDiapoCursor(v.targetPos, true, v, true));
            if (currentIndex === quizData.length - 1) { btnNext.innerHTML = "Terminé ✓"; btnNext.disabled = true; }
            else { btnNext.innerHTML = "Question suiv. ►"; btnNext.disabled = false; }
          }
      }
      updateThumbnails();
    }

    function generateQuiz() {
      if(!getQuizData()) return;
      document.getElementById('diapoContainer').style.display = 'flex';
      buildThumbnails(); loadSlide(0, 0);
      document.getElementById('diapoContainer').scrollIntoView({ behavior: "smooth" });
    }

    function loadSlide(index, startPhase = 0) { currentIndex = index; quizData[currentIndex].phase = startPhase; document.getElementById('btnNext').disabled = false; updateUI(); }

    function nextAction() {
      const q = quizData[currentIndex];
      if (q.isEstimation && (!q.choices || q.choices.length === 0) && q.phase === 0) {
          q.phase = 2;
      }
      else if (q.phase === 0) q.phase = 1;
      else if (q.phase === 1) q.phase = 2;
      else if (q.phase === 2 && currentIndex < quizData.length - 1) loadSlide(currentIndex + 1, 0);
      updateUI();
    }

    function prevSlide() {
      const q = quizData[currentIndex];
      if (q.isEstimation && (!q.choices || q.choices.length === 0) && q.phase === 2) {
          q.phase = 0;
      }
      else if (q.phase === 2) q.phase = 1;
      else if (q.phase === 1) q.phase = 0;
      else if (q.phase === 0 && currentIndex > 0) loadSlide(currentIndex - 1, 2);
      updateUI();
    }

    function toggleFullscreen() {
      let elem = document.getElementById("diapoContainer");
      // si le plein écran est refusé (certains téléphones), le diaporama reste simplement dans la page
      if (!document.fullscreenElement) { if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {}); }
      else document.exitFullscreen();
    }

    document.addEventListener("keydown", (e) => {
      if (document.getElementById('diapoContainer').style.display !== "none") {
        if (e.key === "ArrowRight") { if (!document.getElementById('btnNext').disabled) nextAction(); }
        else if (e.key === "ArrowLeft") { if (!document.getElementById('btnPrev').disabled) prevSlide(); }
      }
    });

    /* =========================================
       MOTEUR IMPRESSION PDF
       ========================================= */
    function buildPrintContainer(q, mode) {
      if (q.isEstimation) {
          if (!q.choices || q.choices.length === 0) return `<div style="margin-top:10px; height: 30px; border-bottom: 2px dashed #ccc;"></div>`;
          let html = `<div class="print-est-choices">`;
          const labels = ["A", "B", "C"];
          q.choices.forEach((choice, idx) => {
              let isCorrectClass = (mode === 'correction' && idx === q.correctIndex) ? 'correct' : '';
              let labelStr = (q.choices.length === 2) ? "" : `<strong>${labels[idx]}</strong>) `;
              html += `<div class="print-est-box ${isCorrectClass}"><div class="print-est-check"></div> ${labelStr}${typo(choice)}</div>`;
          });
          html += `</div>`;
          return html;
      }
      const s = q.schema;
      const [c, cd] = THEMES[s.id];
      let html = `<div class="board print-board" style="--accent: ${c}; --accent-dark: ${cd};"><div class="inner print-inner">`;
      html += `<div class="board-columns" style="--cols: ${s.units.length}; --n: ${s.units.length * s.slots}">`;
      html += buildHTMLColumns(s, true, q, mode);
      html += `</div></div></div>`;
      return html;
    }

      if(!getQuizData()) return;
      const cbStudentEmpty = document.getElementById('cbStudentEmpty').checked;
      const cbStudentFilled = document.getElementById('cbStudentFilled').checked;

      if (cbStudentEmpty || cbStudentFilled) {
          let page1 = document.createElement('div'); page1.className = 'print-page';
          page1.innerHTML = `<div class="print-header"><div>Nom : ........................................</div><div>Prénom : ........................................</div><div>Classe : ....................</div><div class="print-seed">Série : ${currentSeedStr}</div></div><h2 class="print-title">Conversions & Problèmes</h2>`;
          quizData.forEach((q, i) => {
            let qDiv = document.createElement('div'); qDiv.className = 'print-q';

            if (q.isEstimation) {
                let em = q.emoji && q.qType !== 8 && q.qType !== 10 ? q.emoji + ' ' : '';
                qTextHtml = `${i+1}) ${em}${typo(q.problemText)}`;
            }
            else if (q.isProblem) qTextHtml = `${i+1}) ${typo(q.problemText)}`;

            qDiv.innerHTML = `<div class="print-q-text">${qTextHtml}</div>`;
            if (cbStudentFilled && !q.isEstimation) qDiv.innerHTML += buildPrintContainer(q, 'filled');
            else if (cbStudentEmpty || q.isEstimation) qDiv.innerHTML += buildPrintContainer(q, 'empty');
            page1.appendChild(qDiv);
          });
          container.appendChild(page1);
      }

      let page2 = document.createElement('div'); page2.className = 'print-page';
      page2.innerHTML = `<div class="print-header"><div class="print-seed">CORRIGÉ | Série : ${currentSeedStr}</div></div><h2 class="print-title">Correction détaillée</h2>`;
      quizData.forEach((q, i) => {
        let qDiv = document.createElement('div'); qDiv.className = 'print-q';
        let cTextHtml;
        if (q.isEstimation || q.isProblem) {
            let em = q.emoji && q.isEstimation && q.qType !== 8 && q.qType !== 10 ? q.emoji + ' ' : '';
            cTextHtml = `${i+1}) ${em}${typo(q.problemText)}<br><span style="color:var(--success); font-size:0.9em; display:block; margin-top:5px;">${typo(q.correctionText)}</span>`;
        }
        else cTextHtml = `${i+1}) <strong>${mesure(q.valStr, q.sourceUnit)}</strong> = <strong>${mesure(q.calcValStr, q.targetUnit)}</strong>`;
        qDiv.innerHTML = `<div class="print-q-text">${cTextHtml}</div>`;
        if (cbCorrGabarits) qDiv.innerHTML += buildPrintContainer(q, 'correction');
        else {
            qDiv.style.marginBottom = "15px";
            qDiv.style.borderBottom = "1px solid #eee";
            qDiv.style.paddingBottom = "10px";
        }
        page2.appendChild(qDiv);
      });
      container.appendChild(page2);
      setTimeout(() => { window.print(); }, 300);
    }
  </script>
</body>
