        ajouter(el("div", "verd neutre", enEntier ? "Tu refais J'apprends en entier, puis Je valide." : "Tu refais « À toi », puis Je valide.".replace(/« /g, `«${NB}`).replace(/ »/g, `${NB}»`)), espace());
        ajouterSuite([[enEntier ? "J'apprends →" : "J'apprends : À toi →", "", () => { nouvelleSeance(); monEtape(code); }]]);
      }
    }
    // Après une ceinture : « Avant de partir » s'il le faut, sinon
    // l'accueil, où elle est.
    function suiteSeule(boutons) {
      if (etat.aRedemander.length) avantDePartir(boutons);
      else accueil();
    }

    // ------------------------------------------------------------ les ceintures
    // Lot 3a (choix de Gwenaël du 14/11) : une ceinture par palier (toutes
    // ses étapes validées), de la jaune à la noire ; un liseré doré quand
    // toutes ses étoiles sont là ; les six dorées : la Légende des
    // conversions. Un écran pour chacune, à la place de l'ancienne médaille.
    function montrerRecompenses(liste, ensuite) {
      if (!liste.length) { ensuite(); return; }
      ecranCeinture(liste[0], () => montrerRecompenses(liste.slice(1), ensuite));
    }
    function ecranCeinture(r, ensuite) {
      ecran({serre: false, forme: "fin"});
      clavier = null;
      const haut = el("div", "eti centre");
      const dessin = el("div", "ceinture-gde");
      let titre;
      let phrase;
      if (r.sorte === "legende") {
        haut.textContent = "Toutes les ceintures";
        CARTE.PALIERS.forEach(pal => dessin.appendChild(ceintureEl(pal.n, {gagnee: true, doree: true, taille: 72})));
        dessin.classList.add("six");
        titre = `Légende des conversions${NB}!`;
        phrase = "Toutes les étapes sont solides ★.\nTu sais convertir, du CE1 à la 3e.";
      } else {
        const pal = CARTE.palier(r.n);
        haut.textContent = r.sorte === "doree" ? "Liseré doré" : "Nouvelle ceinture";
        dessin.appendChild(ceintureEl(r.n, {gagnee: true, doree: r.sorte === "doree", taille: 220}));
        titre = r.sorte === "doree" ? `Ceinture ${pal.ceinture} dorée${NB}!` : `Ceinture ${pal.ceinture}${NB}!`;
        phrase = r.sorte === "doree" ? `Toutes les étapes du palier ${r.n} sont solides ★.\nTa ceinture est sur ton accueil.`
          : `Tu as validé les ${PALIERS_CODES[r.n].length} étapes du palier ${r.n}.\nTa ceinture est sur ton accueil.`;
      }
      ajouter(haut, dessin, el("div", "titre-fin", titre), texteLignes("note", phrase), espace(), bouton("Continuer →", "", ensuite));
    }

    // ---------------------------------------------------------- Je me souviens
    // Lot 3a (choix de Gwenaël du 14/11 : ses « trois choses à retenir »,
    // dans l'ordre « demander d'abord ») : au début de la séance, les étapes
    // qui reviennent (P.tirerSouvenirs : 6 au plus, les plus anciennes dues
    // d'abord ; rien le premier jour), sans aide. 2 questions au premier
    // retour d'une étape, 1 ensuite ; les étapes se mêlent. Une erreur (ou
    // « Je ne sais pas ») : la correction tout de suite (la bonne réponse,
    // la relation, le glisse-unité qui glisse) ; ce qui est raté revient
    // « Avant de partir ». Un retour réussi (toutes ses questions justes)
    // compte pour l'étoile ; un retour raté ne retire rien.
    // La séance en cours : les petites cases de ses questions.
    function casesSerie(resultats, total, ici) {
      const d = el("div", `dix${total > 8 ? " serre" : ""}`);
      for (let k = 0; k < total; k += 1) {
        const r = resultats[k];
        d.appendChild(el("i", r === true ? "ok" : r === false ? "ko" : k === ici ? "ici" : "", r === true ? "✓" : r === false ? "✗" : String(k + 1)));
      }
      return d;
    }
    // Ce qui est écrit au-dessus de la question : l'étape qui revient, les
    // cases, une phrase calme.
    function zoneRetour(zone, code, resultats, total, phrase) {
      remplirZone(zone, "info fixe centre");
      const nom = el("div", "souv-nom");
      nom.append(el("span", "eti", "Ça revient"), el("b", "", nomEtape(code)));
      zone.append(nom, casesSerie(resultats, total, resultats.length < total ? resultats.length : -1), texteLignes("calme", phrase));
    }
    // Une série de questions de retour (Je me souviens, Avant de partir) :
    // `liste` [{code, qn}], `noter(element, verdict)` après chaque réponse,
    // `finir(bilan)` à la fin.
    function serieRetours({liste, titre, chemin, retour, phrase, noter, finir}) {
      const bilan = [];
      const resultats = [];
      let i = 0;
      let hauteurQ = 0;
      let hauteurZone = 0;
      const questions = liste.map(x => x.qn);
      const question = () => {
        if (i >= liste.length) { finir(bilan); return; }
        const item = liste[i];
        const qn = item.qn;
        const ui = ecranQuestion({petit: "Ma séance du jour", titre, chip: `${i + 1} / ${liste.length}`, chemin, retour, hauteurPx: hauteurQ,
          zone: "info", hauteurZone, jnsp: true});
        cadre.classList.add("bas-court");
        if (!hauteurQ) { hauteurQ = hauteurSerie(ui.q, liste.map(x => x.code), questions); cadre.style.setProperty("--q-h", `${hauteurQ}px`); }
        if (!hauteurZone) {
          hauteurZone = mesurerZone(ui.zone, liste.map(x => z => zoneRetour(z, x.code, [], liste.length, phrase)).concat(questions.map(x => z => remplirErreurZone(z, x))));
          cadre.style.setProperty("--z-h", `${hauteurZone}px`);
        }
        interroger(ui, qn, {
          avant(zone) { zoneRetour(zone, item.code, resultats, liste.length, phrase); },
          apres: {fait(v) {
            resultats.push(v.juste);
            bilan.push({juste: v.juste, texte: qn.resume, code: item.code});
            i += 1;
            noter(item, v, bilan);
            if (v.juste) { zoneRetour(ui.zone, item.code, resultats, liste.length, phrase); apresDelai(question); return; }
            remplirErreur(ui, qn, v.retour, choisi(qn, v), casesSerie(resultats, liste.length, -1), {neutre: v.jnsp});
            ui.action.style.visibility = "";
            ui.action.textContent = "Suivant →";
            ui.action.disabled = false;
            ui.action.onclick = question;
          }}
        });
      };
      question();
    }
    function listeBilan(bilan) {
      const liste = el("div", "listev");
      bilan.forEach(b => {
        const d = el("div", b.juste ? "ok" : "ko");
        d.append(el("span", "r", b.juste ? "✓" : "✗"), document.createTextNode(b.texte));
        liste.appendChild(d);
      });
      return liste;
    }

    function jeMeSouviens(ensuite, {source = null, retour} = {}) {
      const p0 = source || etat.parcours;
      const items = P.tirerSouvenirs(p0, etat.jour, PRETS).map(it => Object.assign({code: it.code, resultats: []}, questionsRetour(p0, it.code, it.questions)));
      // Les étapes se mêlent : la 1re question de chacune, puis les 2es.
      const liste = [];
      [0, 1].forEach(k => items.forEach(it => { if (it.qs[k]) liste.push({code: it.code, qn: it.qs[k], etape: it}); }));
      if (!liste.length) { ensuite(); return; }
      const avantC = ceintures();
      const legendeAvant = P.legende(etat.parcours);
      const etoiles = [];
      const ratees = [];
      serieRetours({
        liste, titre: "Je me souviens", chemin: {noms: ["Je me souviens", "Mon étape"], ici: 0}, retour,
        phrase: "Sans aide. Une erreur ne t'enlève rien.",
        noter(item, v, bilan) {
          const e = item.etape;
          e.resultats.push(v.juste);
          if (!v.juste) {
            if (!ratees.includes(item.code)) ratees.push(item.code);
            const deja = etat.aRedemander.some(x => x.code === item.code && x.repere === (item.qn.repere || null));
            if (!deja && etat.aRedemander.length < P.SEUILS.avantDePartir) etat.aRedemander.push({code: item.code, repere: item.qn.repere || null});
          }
          if (PROF) return;
          if (item.qn.repere) changer(p => P.noterRepere(p, item.qn.repere, v.juste, etat.jour));
          // Le retour de l'étape est fini quand toutes ses questions le sont.
          if (e.resultats.length === e.qs.length) {
            const avant = P.estSolide(etat.parcours, e.code);
            changer(p => P.noterRetour(p, e.code, e.resultats.every(Boolean), etat.jour, e.graine));
            if (!avant && P.estSolide(etat.parcours, e.code)) etoiles.push(e.code);
          }
          noterSeance({posees: bilan.length, justes: bilan.filter(b => b.juste).length, ratees: ratees.slice(0, 3)});
        },
        finir(bilan) { finSouvenirs(bilan, etoiles, recompensesGagnees(avantC, legendeAvant), ensuite, retour); }
      });
    }
    function finSouvenirs(bilan, etoiles, recompenses, ensuite, retour) {
      const justes = bilan.filter(b => b.juste).length;
      ecranQuestionFin("Ma séance du jour", "Je me souviens", 1, retour, ["Je me souviens", "Mon étape"]);
      const t = el("div", "titre-fin", justes === bilan.length ? `Tout est juste${NB}!` : "Je me souviens");
      t.appendChild(el("small", "", T(`${justes} ${justes > 1 ? "justes" : "juste"} sur ${bilan.length}`)));
      const defile = el("div", "ecran-defile");
      // Une nouvelle étoile : l'étape est solide (3 retours réussis de suite).
      etoiles.forEach(code => {
        const e = el("div", "etoile-nouvelle");
        e.append(el("span", "etoile", "★"), el("span", "", T(`Nouvelle étoile : « ${nomEtape(code)} » est solide.`)));
        defile.appendChild(e);
      });
      defile.appendChild(listeBilan(bilan));
      ajouter(t, defile);
      if (justes < bilan.length) ajouter(el("div", "verd neutre", !etat.aRedemander.length ? "Une erreur ne t'enlève rien."
        : "Ce que tu as raté revient « Avant de partir ».".replace(/« /g, `«${NB}`).replace(/ »/g, `${NB}»`)));
      const code = PROF ? null : P.monEtape(etat.parcours, PRETS);
      const action = code ? P.actionDe(etat.parcours, code, etat.jour) : null;
      const texte = PROF ? "Suivant →" : action === "valide" ? "Mon étape : Je valide →" : code ? "Mon étape : J'apprends →" : etat.aRedemander.length ? "Avant de partir →" : "Accueil";
      ajouter(bouton(texte, "", () => montrerRecompenses(recompenses, ensuite)));
    }

    // ---------------------------------------------------------- Avant de partir
    // Lot 3a : ce qui a été raté dans « Je me souviens », redemandé en fin de
    // séance, 3 au plus : une nouvelle question de la même étape (jamais deux
    // fois la même question dans une séance), ou le même repère pour une
    // étape de repères (c'est lui qu'on retient). Rien n'y est compté faux,
    // rien n'est enregistré. `boutons` : la suite, à la fin.
    function avantDePartir(boutons, {retour} = {}) {
      const items = etat.aRedemander.slice(0, P.SEUILS.avantDePartir);
      etat.aRedemander = [];
      const liste = items.map(it => ({code: it.code, qn: it.repere ? G.questionRepere(it.repere, graine() + 7)
        : questionsRetour(etat.parcours, it.code, 1, {avantDePartir: true}).qs[0]})).filter(x => x.qn);
      const fin = bilan => {
        ecranQuestionFin("Ma séance du jour", "Avant de partir", 3, retour, ["Je me souviens", "Mon étape", "Avant de partir"]);
        const justes = bilan.filter(b => b.juste).length;
        const t = el("div", "titre-fin", justes === bilan.length ? `Tu t'en souviens${NB}!` : "À retenir");
        if (bilan.length) t.appendChild(el("small", "", T(`${justes} ${justes > 1 ? "justes" : "juste"} sur ${bilan.length} · rien n'est compté`)));
        ajouter(t, listeBilan(bilan), espace());
        boutons.forEach(([texte, classe, action]) => ajouter(bouton(texte, classe, action)));
      };
      if (!liste.length) { fin([]); return; }
      serieRetours({
        liste, titre: "Avant de partir", chemin: {noms: ["Je me souviens", "Mon étape", "Avant de partir"], ici: 2}, retour,
        phrase: "Tout à l'heure, c'était raté.\nRien n'est compté : c'est pour retenir.",
        noter() {},
        finir: fin
      });
    }

    // ------------------------------------------------------ Tu connais déjà ?
    function introTest(depart, {retour, fin} = {}) {
      const palierN = CARTE.etape(depart).palier;
      ecranQuestionFin(`Palier ${palierN} · ${CARTE.palier(palierN).nom}`, T("Tu connais déjà ?"), -1, retour, []);
      cadre.querySelector(".chemin").remove();
      cadre.querySelector(".chip").textContent = "";
      // (Lot 3b-3 : les tailles dans le CSS, plus serrées au petit
      // téléphone : avec une police plus large, « Plus tard » sortait du
      // cadre.)
      const e = grosDessin("escalier");
      e.classList.add("esc-annonce");
      const t = el("div", "titre-fin", T("Tu connais déjà ?"));
      t.appendChild(el("small", "", "On monte marche par marche, une marche par étape."));
      const c = texteLignes("carte regles-test", "• 3 questions par étape, sans aide.\n• 3 justes : l'étape est validée, tu montes.\n• Une erreur : une 4e question.\n• Tu t'arrêtes quand tu veux : ce qui est validé reste validé.");
      ajouter(e, t, c, espace(), bouton("Je commence →", "", () => test(depart, {retour, fin})), bouton("Plus tard", "cl", fin || accueil));
    }

    function test(depart, {retour, fin} = {}) {
      if (!PROF) nouvelleSeance();
      const sur = PROF ? P.creer() : null;
      const valideeIci = code => (PROF ? P.estValidee(sur, code) : P.estValidee(etat.parcours, code));
      const avantRecompenses = {ceintures: ceintures(), legende: P.legende(etat.parcours)};
      const marches = PRETS.slice(PRETS.indexOf(depart)).filter(c => !valideeIci(c));
      const faites = [];
      let ratee = null;
      let k = 0;
      let hauteurZone = 0;
      const remplirMarche = (zone, code, resultats, total) => {
        const etape = CARTE.etape(code);
        const dansPalier = PALIERS_CODES[etape.palier];
        remplirZone(zone, "info");
        zone.appendChild(escalier(dansPalier, faites.concat(PROF ? [] : dansPalier.filter(c => P.estValidee(etat.parcours, c))), code, null));
        const nomMarche = nom => `Marche ${dansPalier.indexOf(code) + 1} : ${nom}`.replace(" :", `${NB}:`);
        const m = el("div", "marche-nom", nomMarche(etape.nom));
        zone.appendChild(m);
        // (Lot B1-2 : sur deux lignes, le nom court ; « Marche 7 : Toutes les
        // relations à connaître » cachait « question 1 sur 3 » au petit
        // téléphone, l'escalier du palier 2 ayant 16 marches.)
        if (etape.nomCourt !== etape.nom && m.getBoundingClientRect().height > parseFloat(getComputedStyle(m).fontSize) * 1.9) m.textContent = nomMarche(etape.nomCourt);
        const s = suiteRonds(resultats.filter(Boolean).length, total, false);
        s.appendChild(el("span", "", `question ${resultats.length + 1} sur ${total}`));
        zone.appendChild(s);
      };
      const marche = () => {
        if (k >= marches.length) { finTest(faites, null, avantRecompenses, {retour, fin}); return; }
        const code = marches[k];
        const serie = G.serie(code, {usage: "test", graine: graine()});
        const resultats = [];
        const question = () => {
          const suivi = P.suivreMarche(resultats);
          if (suivi.fini) {
            if (suivi.reussie) {
              faites.push(code);
              if (!PROF) {
                changer(p => P.noterTest(p, code, etat.jour));
                noterSeance({test: faites.length});
              }
              k += 1;
              marche();
            } else { ratee = code; finTest(faites, ratee, avantRecompenses, {retour, fin}); }
            return;
          }
          const qn = serie[resultats.length];
          const etape = CARTE.etape(code);
          const palierN = etape.palier;
          const dansPalier = PALIERS_CODES[palierN];
          const ui = ecranQuestion({petit: `Palier ${palierN} · ${CARTE.palier(palierN).nom}`, titre: T("Tu connais déjà ?"),
            chip: `marche ${dansPalier.indexOf(code) + 1}`, chemin: {noms: [], ici: 0}, retour: () => finTest(faites, null, avantRecompenses, {retour, fin}),
            zone: "info", hauteurZone});
          cadre.style.setProperty("--q-h", `${hauteurSerie(ui.q, code, serie)}px`);
          cadre.classList.add("bas-court");
          cadre.querySelector(".chemin").remove();
          // La même hauteur pour toutes les marches (un nom d'étape long
          // passe sur deux lignes) : rien ne bouge en montant.
          if (!hauteurZone) {
            hauteurZone = mesurerZone(ui.zone, marches.map(c => z => remplirMarche(z, c, [], 4)));
            cadre.style.setProperty("--z-h", `${hauteurZone}px`);
          }
          ui.zone.classList.add("fixe");
          interroger(ui, qn, {
            avant(zone) { remplirMarche(zone, code, resultats, suivi.total); zone.classList.add("fixe"); },
            apres: {montrerBon: false, fait(v) {
              resultats.push(v.juste);
              apresDelai(question, v.juste ? 450 : 900);
            }}
          });
          // « Je m'arrête là » à côté de Valider, toujours à la même place.
          const duo = el("div", "duo");
          ui.action.replaceWith(duo);
          duo.append(ui.action, bouton("Je m'arrête là", "cl", () => finTest(faites, null, avantRecompenses, {retour, fin})));
          if (qn.choix) { ui.action.style.visibility = "hidden"; }
        };
        question();
      };
      marche();
    }

    function escalier(codes, ok, ici, ko) {
      // Les marches montent régulièrement, quel que soit leur nombre (le
      // palier 1 en a 10 depuis le lot A2 bis).
      const e = el("div", "esc");
      codes.forEach((c, i) => {
        const etatM = ok.includes(c) ? "ok" : c === ko ? "ko" : c === ici ? "ici" : "";
        const b = el("i", etatM, etatM === "ok" ? "✓" : etatM === "ko" ? "✗" : String(i + 1));
        // (Lot 3b-3 : la 1re marche garde la hauteur de son numéro, même
        // dans un escalier bas, au petit téléphone ; les autres montent
        // régulièrement jusqu'en haut.)
        b.style.height = `calc(1.25rem + (100% - 1.25rem) * ${(i / Math.max(1, codes.length - 1)).toFixed(4)})`;
        e.appendChild(b);
      });
      return e;
    }

    function finTest(faites, ratee, avantRecompenses, {retour, fin} = {}) {
      const nouvelles = recompensesGagnees(avantRecompenses.ceintures, avantRecompenses.legende);
      const resultat = () => {
        const premier = faites[0] || ratee || PRETS[0];
        const palierN = CARTE.etape(premier).palier;
        ecranQuestionFin(`Palier ${palierN} · ${CARTE.palier(palierN).nom}`, T("Tu connais déjà ?"), -1, retour, []);
        cadre.querySelector(".chemin").remove();
        const t = el("div", "titre-fin");
        t.style.marginTop = rem(6);
        if (faites.length) {
          t.textContent = `${faites.length} ${faites.length > 1 ? "étapes validées" : "étape validée"}${NB}!`;
          t.appendChild(el("small", "", "Tu as sauté ce que tu savais déjà."));
        } else {
          t.textContent = "On commence par cette étape";
          t.appendChild(el("small", "", "Tu vas l'apprendre pas à pas."));
        }
        ajouter(t);
        const dansPalier = PALIERS_CODES[palierN];
        const okPalier = PROF ? faites : dansPalier.filter(c => P.estValidee(etat.parcours, c));
        ajouter(escalier(dansPalier, okPalier, null, ratee));
        const liste = el("div", "listev");
        faites.forEach(c => {
          const d = el("div", "ok");
          d.append(el("span", "r", "✓"), document.createTextNode(nomEtape(c)));
          liste.appendChild(d);
        });
        if (ratee) {
          const d = el("div", "ko");
          d.append(el("span", "r", "✗"), document.createTextNode(nomEtape(ratee)), el("small", "", "ton étape"));
          liste.appendChild(d);
        }
        ajouter(liste, espace());
        if (fin) { ajouter(bouton("Accueil", "", fin)); return; }
        if (ratee) ajouter(bouton(`J'apprends : ${nomEtape(ratee)} →`.replace(" :", `${NB}:`), "", () => { nouvelleSeance(); monEtape(ratee); }));
        else ajouter(bouton("Accueil", "", accueil));
      };
      montrerRecompenses(nouvelles, resultat);
    }

    // ------------------------------------------------------------ Mon parcours
    function monParcours(palierN) {
      ecran();
      const p = etat.parcours;
      ajouter(teteEcran("Mon parcours", accueil));
      const n = P.validees(p).length;
      const s = el("div", "petit");
      s.appendChild(el("b", "", T(`${n} ${n > 1 ? "étapes validées" : "étape validée"} sur ${CARTE.ORDRE.length}`))).style.color = "var(--ink)";
      ajouter(s);
      const tabs = el("div", "pal-tabs");
      CARTE.PALIERS.forEach(pal => {
        const pret = CARTE.palierPret(pal.n);
        const b = el("button", `${pret ? "" : "prep"}${pal.n === palierN ? " ici" : ""}`, String(pal.n));
        b.type = "button";
        b.setAttribute("aria-label", `Palier ${pal.n}`);
        const codes = PALIERS_CODES[pal.n];
        b.appendChild(el("small", "", pret ? `${codes.filter(c => P.estValidee(p, c)).length}/${codes.length}` : "bientôt"));
        b.addEventListener("click", () => monParcours(pal.n));
        tabs.appendChild(b);
      });
      ajouter(tabs);
      const pal = CARTE.palier(palierN);
      ajouter(el("div", "palier-titre", `Palier ${palierN} · ${pal.nom}`));
      // Lot 3a : la ceinture du palier, toujours avec son nom.
      const c = ceintures()[palierN - 1];
      const ligneC = el("div", "pceinture");
      ligneC.appendChild(ceintureEl(palierN, {gagnee: c.gagnee, doree: c.doree, taille: 44}));
      const nomC = `Ceinture ${pal.ceinture}`;
      ligneC.appendChild(el("span", "", T(c.doree ? `${nomC} dorée : toutes les étapes sont solides ★`
        : c.gagnee ? `${nomC} gagnée · ${c.solides} ★ sur ${c.total}` : `${nomC} : ${c.validees} ${c.validees > 1 ? "étapes validées" : "étape validée"} sur ${c.total}`)));
      ajouter(ligneC);
      const defile = el("div", "ecran-defile");
      const pret = CARTE.palierPret(palierN);
      if (!pret) {
        const prep = el("div", "bandeau-prep");
        prep.append(AIDES.icone("chantier"), document.createTextNode(" Ce palier est en préparation : ses étapes arrivent bientôt. Tu peux déjà voir leurs noms."));
        defile.appendChild(prep);
      }
      defile.appendChild(listeEtapes(palierN, {prep: !pret, cours: P.monEtape(p, PRETS), validee: x => P.estValidee(p, x), solide: x => P.estSolide(p, x)}));
      if (pret) defile.appendChild(el("div", "note legende-etapes", T("✓ étape validée · ★ étape solide : réussie trois fois de suite quand elle revient")));
      ajouter(defile);
    }

    function listeEtapes(palierN, {prep, cours, validee, solide, choisir, possible = () => true}) {
      const bloc = el("div");
      bloc.className = "familles";
      CARTE.famillesDuPalier(palierN).forEach(f => {
        const groupe = el("div", "fam-groupe");
        bloc.appendChild(groupe);
        groupe.appendChild(el("div", "fam", f.nom));
        f.etapes.forEach(e => {
          const peut = possible(e.code);
          const classe = prep || !peut ? "prep" : solide && solide(e.code) ? "ok solide" : validee && validee(e.code) ? "ok" : e.code === cours ? "cours" : "";
          const ligne = el(choisir && peut ? "button" : "div", `li2 ${classe}`);
          if (choisir && peut) { ligne.type = "button"; ligne.addEventListener("click", () => choisir(e.code)); }
          ligne.append(el("span", "r"), el("span", "", e.nomCourt), el("small", "", e.exemple));
          groupe.appendChild(ligne);
        });
      });
      return bloc;
    }

    // ------------------------------------------------------------ Mon carnet
    function monCarnet() {
      ecran();
      ajouter(teteEcran("Mon carnet de repères", accueil));
      const reps = carnet();
      ajouter(el("div", "petit", "Les repères de tes étapes validées. Je les recopie dans mon cahier et je les apprends par cœur."));

      reps.forEach(r => defile.appendChild(AIDES.carteRepere(r.code)));
      ajouter(defile, el("div", "note", T(`${reps.length} ${reps.length > 1 ? "repères" : "repère"} sur ${CARTE.REPERES.length}`)));
    }

    // ----------------------------------------------------- Comment ça marche ?

    // ============================================================ MODE PROFESSEUR
    // Toutes les étapes, rien n'est enregistré (comme Défi calcul).
    function bandeauProf() {
      const b = el("div", "bprof");
      b.appendChild(document.createTextNode("Mode professeur · "));
      const q = el("a", "", "Quitter");
      q.href = window.location.pathname;
      b.appendChild(q);
      b.appendChild(el("br"));
      const s = el("span", "", "toutes les étapes, rien n'est enregistré");
      s.style.fontWeight = "600";
      b.appendChild(s);
      return b;
    }
    // Un élève fictif, pour « Je me souviens » et le mélange de Je valide :
    // les étapes avant celle choisie validées les jours d'avant (elles
    // reviennent toutes aujourd'hui).
    function parcoursFictif(code) {
      let p = P.creer();
      const avant = PRETS.slice(0, Math.max(1, PRETS.indexOf(code)));
      avant.forEach((c, i) => {
        const jour = P.ajouterJours(etat.jour, -(avant.length - i) * 2);
        p = P.noterTest(p, c, jour);
      });
      return p;
    }
    function accueilProf() {
      ecran({rond: true, serre: true});
      clavier = null;
      const code = etat.profEtape;
      const e = CARTE.etape(code);
      ajouter(bandeauProf());
      const c = el("div", "carte");
      c.style.padding = `${rem(10)} ${rem(12)}`;
      const l = el("div");
      l.style.cssText = "display:flex;justify-content:space-between;align-items:baseline";
      l.append(el("span", "eti", `Palier ${e.palier} · ${CARTE.palier(e.palier).nom}`), lien("Changer d'étape", changerEtapeProf, "bleu"));
      const h = el("h2", "", e.nom);
      h.style.cssText = `font-size:${rem(22)};margin:${rem(4)} 0 0`;
      c.append(l, h);
      ajouter(c);
      const fin = accueilProf;
      const acts = [
        ["1", "J'apprends : on te montre", "les trois temps", () => onTeMontre(code, fin, {retour: fin})],
        ["2", "J'apprends : à toi", "l'outil, l'image, puis sans rien, et « À retenir »", () => aToi(code, {retour: fin, fin})],
        ["3", "Je valide", "10 questions sans aide, dont 3 des étapes d'avant", () => jeValide(code, {retour: fin, fin, source: parcoursFictif(code)})],
        ["4", "Tu connais déjà ?", "l'escalier, à partir de cette étape", () => introTest(code, {retour: fin, fin})],
        ["5", "Je me souviens", "les étapes qui reviennent, pour un élève qui a fait les étapes d'avant", () => {
          etat.aRedemander = [];
          jeMeSouviens(() => (etat.aRedemander.length ? avantDePartir([["Accueil", "", fin]], {retour: fin}) : fin()), {source: parcoursFictif(code), retour: fin});
        }],
        [AIDES.icone("oeil"), "Voir une série", "10 questions et leurs réponses", () => { etat.profSerie = {usage: "valide", graine: graine()}; voirSerie(); }]
      ];
      const d = el("div", "ecran-defile acts");
      acts.forEach(([n, t, p, action], i) => {
        const b = el("button", `act${i === 5 ? " violet" : ""}`);
        b.type = "button";
        const txt = el("div");
        txt.append(el("b", "", T(t)), el("span", "petit", T(p)));
        const rond = el("span", "n", typeof n === "string" ? n : "");
        if (typeof n !== "string") rond.appendChild(n);
        b.append(rond, txt, el("span", "fl", "→"));
        b.addEventListener("click", action);
        d.appendChild(b);
      });
      const lc = el("div", "liens2 un");
      lc.appendChild(lien(T("Comment ça marche ?"), commentCaMarche));
      d.appendChild(lc);
      ajouter(d);
    }
    function changerEtapeProf() {
      ecran({rond: true, serre: true});
      ajouter(bandeauProf());
      const t = teteEcran("Changer d'étape", accueilProf);
      t.querySelector("b").style.cssText = `font-size:${rem(21)};text-align:left;margin:0`;
      ajouter(t);
      const d = el("div", "ecran-defile");
      CARTE.PALIERS.forEach(pal => {
        const pret = CARTE.palierPret(pal.n);
        // (Lot B1-1 : un palier en construction montre ses étapes prêtes, à
        // essayer ; les autres restent grises.)
        const ouvert = CARTE.etapesDuPalier(pal.n).some(e => e.pret);
        const titre = el("div", "palier-titre", `Palier ${pal.n} · ${pal.nom}`);
        if (!pret) titre.style.color = "#8ea1af";
        d.appendChild(titre);
        if (ouvert) d.appendChild(listeEtapes(pal.n, {cours: etat.profEtape, choisir: c => { etat.profEtape = c; accueilProf(); }, possible: c => CARTE.etape(c).pret}));
        else {
          const b = el("div", "bandeau-prep", T(`En préparation · ${pal.etapes} étapes`));
          b.style.cssText = `font-size:${rem(13)};padding:${rem(6)} ${rem(10)}`;
          d.appendChild(b);
        }
      });
      ajouter(d);
    }
    const USAGES_PROF = [["valide", "Je valide · 10"], ["entraine", "J'apprends · 25"], ["test", "Test"]];
    function voirSerie() {
      ecran({rond: true, serre: true});
      const code = etat.profEtape;
      const {usage, graine: g} = etat.profSerie;
      ajouter(bandeauProf());
      const t = el("div", "tete-ecran");
      const r = el("button", "rond"); r.appendChild(fleche());
      r.type = "button";
      r.setAttribute("aria-label", "Retour");
      r.addEventListener("click", accueilProf);
      const tt = el("div");
      const b = el("b", "", "Voir une série");
      b.style.cssText = `font-size:${rem(20)};display:block;text-align:left;margin:0`;
      tt.append(b, el("span", "petit", nomEtape(code)));
      t.append(r, tt);
      ajouter(t);
      const onglets = el("div", "onglets");
      USAGES_PROF.forEach(([u, nom]) => {
        const o = el("button", u === usage ? "ici" : "", T(nom));
        o.type = "button";
        o.addEventListener("click", () => { etat.profSerie = {usage: u, graine: g}; voirSerie(); });
        onglets.appendChild(o);
      });
      ajouter(onglets);
      const serie = G.serie(code, {usage, graine: g});
      const d = el("div", "ecran-defile");
      const table = el("table", "serie");
      serie.forEach((qn, i) => {
        const tr = el("tr", i + 1 < serie.length && serie[i + 1].degre !== qn.degre ? "sep" : "");
        tr.append(el("td", "n", String(i + 1)), el("td", "dg", `d${qn.degre}`), el("td", "", qn.texte), el("td", "rp", qn.reponseTexte));
        table.appendChild(tr);
      });
      d.appendChild(table);
      const note = el("div", "note", T(`Série n° ${String(g).replace(/\B(?=(\d{3})+(?!\d))/g, " ")} : ce numéro redonne exactement la même série.`));
      note.style.textAlign = "left";
      d.appendChild(note);
      const ret = el("form", "retrouver");
      const label = el("label", "", "Retrouver la série n°");
      const champ = el("input");
      champ.inputMode = "numeric";
      champ.id = "retrouver-serie";
      label.htmlFor = "retrouver-serie";
      const ok = el("button", "lien bleu", "Voir");
      ok.type = "submit";
      ret.append(label, champ, ok);
      ret.addEventListener("submit", ev => {
        ev.preventDefault();
        const n = Number(String(champ.value).replace(/\D/g, ""));
        if (n >= 1 && n <= 99999) { etat.profSerie = {usage, graine: n}; voirSerie(); }
      });
      d.appendChild(ret);
      ajouter(d, bouton("Une autre série ↻", "", () => { etat.profSerie = {usage, graine: graine()}; voirSerie(); }));
    }

    accueil();
  })();
  </script>
</body>
