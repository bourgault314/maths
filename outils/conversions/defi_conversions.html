<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Défi conversions | maths&amp;go</title>
  <meta name="description" content="Apprendre à convertir des mesures, palier par palier : repères, relations, conversions, durées et problèmes.">
  <!-- Lot 1 (11/11/2026) : en ligne par lien direct, HORS catalogue (ni
       vignette, ni sitemap, ni moteur de recherche) tant que le serveur de
       suivi et la page prof (lot 2) ne sont pas là. Le code d'élève est
       ignoré : tout le monde est visiteur, la progression reste sur
       l'appareil. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="./defi_conversions.css?v=20261115-b2">
  <script>
    // Un code d'élève ou un billet dans l'adresse n'est pas lu (lot 1) : il
    // est seulement effacé, pour qu'il ne reste ni dans l'historique ni au
    // tableau.
    (function (w) {
      try {
        var h = String(w.location.hash || "");
        if (/(^#|&)(code|fiche|b)=/.test(h)) w.history.replaceState(null, "", w.location.pathname + w.location.search);
      } catch (e) {}
    })(window);
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="hautv">
      <a href="/" aria-label="Accueil maths&amp;go"><img src="/assets/img/mathsgo-logo.png" alt="maths&amp;go" width="1338" height="622"></a>
      <a class="retour-site" id="retour-site" href="/outils/?domain=proportionnalite-mesures&amp;notion=conversions" aria-label="Retour aux conversions"><span class="fleche" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="retour-site-mot">Conversions</span></a>
    </header>
    <main class="cadre" id="cadre" aria-live="polite"></main>
    <div class="voile" id="voile" hidden></div>
  </div>

  <script src="./conversions_carte.js?v=20261115-b2"></script>
  <script src="./conversions_generateurs.js?v=20261115-b2"></script>
  <script src="./defi_conversions_parcours.js?v=20261115-b1"></script>
  <script src="./defi_conversions_aides.js?v=20261115-b2"></script>
  <script>
  (function () {
    "use strict";
    const CARTE = window.MATHSGO_CONVERSIONS_CARTE;
    const G = window.MATHSGO_CONVERSIONS;
    const P = window.MATHSGO_DEFI_CONVERSIONS_PARCOURS;
    const AIDES = window.MATHSGO_DEFI_CONVERSIONS_AIDES;
    const NB = " ";
    const T = CARTE.typo;

    const params = new URLSearchParams(window.location.search);
    const PROF = params.get("prof") === "1";

    // Les étapes prêtes, dans l'ordre du parcours. Lot B1-1 : pour l'élève,
    // seulement celles des paliers prêts (CARTE.PARCOURS) ; le mode
    // professeur voit toutes les étapes construites (CARTE.PRETES), même
    // dans un palier en construction.
    const PRETS = PROF ? CARTE.PRETES : CARTE.PARCOURS;
    const REPERES_PAR_ETAPE = {};
    CARTE.ETAPES.forEach(e => { if (e.reperes && e.reperes.length) REPERES_PAR_ETAPE[e.code] = e.reperes; });
    const PALIERS_CODES = {};
    CARTE.PALIERS.forEach(p => { PALIERS_CODES[p.n] = CARTE.etapesDuPalier(p.n).map(e => e.code); });

    function stockage() {
      try { return window.localStorage; } catch (e) { return null; }
    }

    const etat = {
      jour: P.jourLocal(),
      parcours: PROF ? P.creer() : P.charger(stockage()),
      seance: null,
      profEtape: PRETS[0],
      profSerie: {usage: "valide", graine: 0},
      // Lot 3a : les questions déjà vues aujourd'hui (leurs clés), et ce
      // qui a été raté dans « Je me souviens », à redemander « Avant de
      // partir » (3 au plus).
      vues: new Set(),
      aRedemander: []
    };

    const app = document.getElementById("app");
    const cadre = document.getElementById("cadre");
    const voile = document.getElementById("voile");
    const retourSite = document.getElementById("retour-site");

    // ------------------------------------------------------------ outils DOM
    function el(tag, classe, texte) {
      const e = document.createElement(tag);
      if (classe) e.className = classe;
      if (texte !== undefined && texte !== null) e.textContent = texte;
      return e;
    }
    function bouton(texte, classe, action) {
      const b = el("button", `btn${classe ? ` ${classe}` : ""}`, texte);
      b.type = "button";
      b.addEventListener("click", action);
      return b;
    }
    function lien(texte, action, classe) {
      const b = el("button", `lien${classe ? ` ${classe}` : ""}`, texte);
      b.type = "button";
      b.addEventListener("click", action);
      return b;
    }
    // Les tailles écrites ici sont en rem, comme la feuille de style : elles
    // grandissent avec l'écran (lot A2). rem(23) = 23 px au téléphone.
    function rem(px) {
      return `${px / 16}rem`;
    }
    // `forme` : la mise en page de l'écran sur un grand écran (lot A2) —
    // « seance » (une question), « accueil », « liste » (Mon parcours, Mon
    // carnet, Comment ça marche ?, le mode professeur), « fin » (un écran
    // court : on le centre).
    function ecran({rond = false, serre = false, forme = "liste"} = {}) {
      cadre.textContent = "";
      cadre.className = `cadre${serre ? " serre" : ""}`;
      cadre.dataset.forme = forme;
      // Lot A2 ter : la forme de l'écran sur l'appli entière (au téléphone
      // peu haut, la ligne du logo laisse sa place pendant une séance).
      app.dataset.forme = forme;
      cadre.style.removeProperty("--q-h");
      cadre.style.removeProperty("--z-h");
      retourSite.hidden = !rond;
      voile.hidden = true;
      voile.textContent = "";
      cadre.scrollTop = 0;
      return cadre;
    }
    function ajouter(...enfants) {
      enfants.filter(Boolean).forEach(e => cadre.appendChild(e));
    }
    function espace() {
      return el("div", "espace");
    }
    function texteLignes(classe, texte) {
      return AIDES.lignes(classe, texte);
    }
    // La ceinture d'un palier (lot 3a, choix de Gwenaël du 14/11 : elle
    // remplace la médaille) : à sa couleur quand elle est gagnée, avec un
    // liseré doré quand toutes les étoiles du palier sont là, sinon en
    // pointillés. Son nom est toujours écrit à côté par l'écran.
    function ceintureEl(n, {gagnee = false, doree = false, taille = 64} = {}) {
      const nom = CARTE.palier(n).ceinture;
      return AIDES.ceinture(n, {etat: gagnee ? "gagnee" : "vide", doree, taille,
        titre: `Ceinture ${nom}${gagnee ? (doree ? " dorée" : "") : ", pas encore gagnée"}`});
    }
    // La flèche de retour du site (le trait épais des autres applis), jamais le
    // caractère « ← », trop maigre (règle de Gwenaël, Défi tables).
    function fleche() {
      const f = el("span", "fleche");
      f.setAttribute("aria-hidden", "true");
      f.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      return f;
    }
    // Lot 3b-2 : les grands dessins des écrans de fin (plus d'émoticônes).
    function grosDessin(nom) {
      const d = el("div", "gros-emoji");
      d.appendChild(AIDES.icone(nom));
      return d;
    }
    function teteEcran(titre, retour) {
      const t = el("div", "tete-ecran");
      const r = el("button", "rond"); r.appendChild(fleche());
      r.type = "button";
      r.setAttribute("aria-label", "Retour");
      r.addEventListener("click", retour);
      t.appendChild(r);
      t.appendChild(el("b", "", titre));
      return t;
    }

    // ------------------------------------------------------------ données
    function sauver() {
      if (!PROF) P.sauver(stockage(), etat.parcours);
    }
    function nouvelleSeance() {
      etat.seance = {id: P.idLibre(etat.parcours), ordre: null, jour: etat.jour, etape: null, montre: 0, atoi: 0, valide: 0,
        posees: 0, justes: 0, ratees: [], test: 0};
    }
    function noterSeance(changement) {
      if (!etat.seance) nouvelleSeance();
      Object.assign(etat.seance, changement || {});
      if (PROF) return;
      const r = P.noterSeance(etat.parcours, etat.seance, etat.jour);
      etat.parcours = r.parcours;
      if (r.ordre) { etat.seance.ordre = r.ordre; etat.seance.jour = r.jour; }
      sauver();
    }
    function changer(fonction) {
      etat.parcours = fonction(etat.parcours);
      sauver();
    }
    function graine() {
      return 1 + Math.floor(Math.random() * 99998);
    }
    function nomEtape(code) {
      return CARTE.etape(code).nom;
    }
    function carnet() {
      return P.carnet(etat.parcours, REPERES_PAR_ETAPE);
    }
    function ceintures(source) {
      return P.ceintures(source || etat.parcours, PALIERS_CODES);
    }
    // Ce qui vient d'être gagné entre deux états des ceintures (lot 3a) :
    // une ceinture, un liseré doré, puis la Légende des conversions.
    function recompensesGagnees(avant, legendeAvant) {
      if (PROF) return [];
      const liste = [];
      ceintures().forEach((c, k) => {
        const a = avant[k];
        if (c.gagnee && !a.gagnee) liste.push({n: c.n, sorte: c.doree ? "doree" : "gagnee"});
        else if (c.doree && !a.doree) liste.push({n: c.n, sorte: "doree"});
      });
      if (!legendeAvant && P.legende(etat.parcours)) liste.push({sorte: "legende"});
      return liste;
    }

    // ------------------------------------------------- les questions vues
    // Lot 3a : jamais deux fois la même question dans une séance, et « Je
    // valide » ne reprend rien de « À toi » le même jour. Les clés des
    // questions posées aujourd'hui (rien d'autre : ni réponse ni prénom),
    // gardées le temps de l'onglet.
    const CLE_VUES = "mathsgo-defi-conversions-vues";
    function cleDe(q) {
      return q.cleBase || q.cle;
    }
    function chargerVues() {
      try {
        const v = JSON.parse(window.sessionStorage.getItem(CLE_VUES) || "null");
        if (v && v.jour === etat.jour && Array.isArray(v.cles)) return new Set(v.cles.filter(c => typeof c === "string" && c.length < 80).slice(-300));
      } catch (e) { /* rien */ }
      return new Set();
    }
    function voir(question) {
      if (!question) return;
      etat.vues.add(cleDe(question));
      if (PROF) return;
      try { window.sessionStorage.setItem(CLE_VUES, JSON.stringify({jour: etat.jour, cles: [...etat.vues].slice(-300)})); } catch (e) { /* rien */ }
    }
    etat.vues = PROF ? new Set() : chargerVues();
    // Une série qui évite les questions déjà vues aujourd'hui. Une étape de
    // faits à savoir par cœur (les 10 repères, les 20 relations) n'en a pas
    // toujours assez : on évite alors les 10 dernières vues, puis les 4,
    // puis la dernière, puis rien.
    function serieSure(code, options) {
      const vues = [...etat.vues];
      const en = options.exclure || [];
      for (const exclure of [vues, vues.slice(-10), vues.slice(-4), vues.slice(-1), []]) {
        const s = G.serie(code, Object.assign({}, options, {exclure: exclure.concat(en)}));
        if (s.length) return s;
      }
      return G.serie(code, Object.assign({}, options, {exclure: []}));
    }
    // Les questions d'un retour (« Je me souviens ») ou de « Avant de
    // partir » : `n` (1 ou 2) d'une étape.
    // - Une étape de repères : les repères à redemander (celui raté la
    //   dernière fois d'abord, puis le plus ancien).
    // - Sinon, la série « retour » d'une graine, toujours tirée sans rien
    //   exclure (la même graine redonne les mêmes questions : le retour
    //   suivant les évite), en prenant la première graine dont les questions
    //   ne sont ni vues aujourd'hui ni celles du retour d'avant.
    function questionsRetour(source, code, n, {avantDePartir = false} = {}) {
      const reps = REPERES_PAR_ETAPE[code];
      if (reps) {
        const choisis = P.reperesARedemander(source, reps, n);
        return {graine: 0, qs: choisis.map((r, k) => G.questionRepere(r, graine() + k)).filter(Boolean)};
      }
      const interdits = new Set(etat.vues);
      const g0 = avantDePartir ? 0 : P.graineRetour(source, code);
      if (g0) G.serie(code, {usage: "retour", graine: g0}).forEach(q => interdits.add(cleDe(q)));
      let g = graine();
      let qs = [];
      for (let essai = 0; essai < 40; essai += 1) {
        qs = G.serie(code, {usage: "retour", graine: g}).slice(0, n);
        if (qs.length === n && qs.every(q => !interdits.has(cleDe(q)))) break;
        g = g >= 99999 ? 1 : g + 1;
      }
      return {graine: g, qs};
    }
    function suivante(code) {
      const i = PRETS.indexOf(code);
      return PRETS.slice(i + 1).find(c => !P.estValidee(etat.parcours, c)) || null;
    }

    // ============================================================ L'ACCUEIL
    function accueil() {
      if (PROF) { accueilProf(); return; }
      etat.seance = null;
      ecran({rond: true, forme: "accueil"});
      // Deux colonnes sur un grand écran (mon étape à gauche, mes ceintures
      // et mes tuiles à droite) ; au téléphone, les colonnes s'effacent
      // (display: contents) et l'ordre reste le même.
      const gauche = el("div", "col col-g");
      const droite = el("div", "col col-d");
      cadre.append(gauche, droite);
      const ajouterG = (...e) => e.filter(Boolean).forEach(x => gauche.appendChild(x));
      const ajouterD = (...e) => e.filter(Boolean).forEach(x => droite.appendChild(x));
      const p = etat.parcours;
      const code = P.monEtape(p, PRETS);
      const palierN = code ? CARTE.etape(code).palier : 1;
      const codesPalier = PALIERS_CODES[palierN];
      const valideesPalier = codesPalier.filter(c => P.estValidee(p, c)).length;
      const solidesPalier = codesPalier.filter(c => P.estSolide(p, c)).length;
      const lesCeintures = ceintures();
      const ici = lesCeintures[palierN - 1];

      // Lot 3a : la ceinture du palier, à la place exacte du rond de la
      // flèche des autres écrans (même boîte, même centre : rien ne saute).
      const haut = el("div", "acc-palier");
      const boite = el("span", "acc-ceinture");
      boite.appendChild(ceintureEl(palierN, {gagnee: ici.gagnee, doree: ici.doree, taille: 40}));
      haut.appendChild(boite);
      const info = el("div", "info");
      info.appendChild(el("span", "eti", `Palier ${palierN} · ${CARTE.palier(palierN).nom}`));
      const ligne = el("b", "", T(`${valideesPalier} ${valideesPalier > 1 ? "étapes validées" : "étape validée"} sur ${codesPalier.length}`));
      if (solidesPalier) ligne.appendChild(el("span", "etoiles", ` · ${solidesPalier}${NB}★`));
      info.appendChild(ligne);
      const prog = el("div", "prog");
      const barre = el("i");
      barre.style.width = `${(100 * valideesPalier) / codesPalier.length}%`;
      prog.appendChild(barre);
      info.appendChild(prog);
      haut.appendChild(info);
      ajouterG(haut);

      // Mon étape. Lot 3a : la séance du jour en pastilles — « Je me
      // souviens » (s'il y a des étapes qui reviennent), J'apprends, Je
      // valide (le jour même).
      const souvenirs = P.tirerSouvenirs(p, etat.jour, PRETS);
      const carteEtape = el("div", "carte bleue");
      carteEtape.appendChild(el("div", "eti", "Mon étape"));
      if (!code) {
        carteEtape.appendChild(el("h2", "", `Le palier ${palierN + 1} arrive bientôt`));
        carteEtape.appendChild(el("div", "petit", souvenirs.length ? "Tu as fini tout ce qui est prêt. Tes étapes reviennent : elles restent en mémoire."
          : "Tu as fini tout ce qui est prêt. Tes étapes reviendront dans les prochains jours."));
        if (souvenirs.length) carteEtape.appendChild(bouton("Je me souviens →", "", () => lancerSeance()));
      } else {
        const action = P.actionDe(p, code, etat.jour);
        carteEtape.appendChild(el("h2", "", nomEtape(code)));
        const pastilles = el("div", `etape3${souvenirs.length ? "" : " deux"}`);
        const pastille = (classe, marque, texte) => {
          const d = el("div", classe);
          d.append(el("em", "", marque), document.createTextNode(texte));
          return d;
        };
        const numeros = ["①", "②", "③"];
        let k = 0;
        if (souvenirs.length) pastilles.appendChild(pastille("ici", numeros[k++], "Je me souviens"));
        const appris = action === "valide";
        pastilles.appendChild(pastille(appris ? "fait" : souvenirs.length ? "" : "ici", appris ? "✓" : numeros[k], "J'apprends"));
        k += 1;
        pastilles.appendChild(pastille(appris && !souvenirs.length ? "ici" : "", numeros[k], "Je valide"));
        carteEtape.appendChild(pastilles);
        carteEtape.appendChild(bouton(P.estVide(p) ? "Commencer →" : "C'est parti →", "", () => lancerSeance()));
      }
      ajouterG(carteEtape);

      if (code && !P.etapeDe(p, code)[0]) {
        const test = el("button", "test-carte");
        test.type = "button";
        test.appendChild(AIDES.icone("escalier")).style.fontSize = rem(30);
        const t = el("div");
        t.appendChild(el("b", "", T("Tu connais déjà ?")));
        t.appendChild(el("span", "petit", "Un petit test : tu sautes les étapes que tu sais."));
        test.appendChild(t);
        test.appendChild(el("span", "fl", "→"));
        test.addEventListener("click", () => introTest(code));
        ajouterG(test);
      }

      // Mes ceintures (lot 3a) : les six, la gagnée à sa couleur, les autres
      // en pointillés, chacune avec son nom (on voit la suite).
      const nbGagnees = lesCeintures.filter(c => c.gagnee).length;
      const legende = P.legende(p);
      const carteC = el("div", "carte ceintures-carte");
      const teteC = el("div", "cc-tete");
      teteC.append(el("b", "", legende ? "Légende des conversions" : "Mes ceintures"), el("span", "petit", T(`${nbGagnees} sur 6`)));
      carteC.appendChild(teteC);
      const rangC = el("div", "cc-rang");
      lesCeintures.forEach(c => {
        const f = el("div", `cc${c.gagnee ? " gagnee" : ""}`);
        f.appendChild(ceintureEl(c.n, {gagnee: c.gagnee, doree: c.doree, taille: 44}));
        f.appendChild(el("span", "", c.doree ? `${CARTE.palier(c.n).ceinture}${NB}★` : CARTE.palier(c.n).ceinture));
        rangC.appendChild(f);
      });
      carteC.appendChild(rangC);
      ajouterD(carteC);

      const nbValidees = P.validees(p).length;
      const nbReperes = carnet().length;
      const tuiles = el("div", "tuiles");
      const tParcours = el("button", "tuile");
      tParcours.type = "button";
      const ic = el("span", "ic");
      ic.appendChild(iconeCarte());
      tParcours.append(ic, el("b", "", "Mon parcours"), el("span", "petit", T(nbValidees ? `${nbValidees} ${nbValidees > 1 ? "étapes" : "étape"} sur ${CARTE.ORDRE.length}` : `6 paliers, ${CARTE.ORDRE.length} étapes`)));
      tParcours.addEventListener("click", () => monParcours(palierN));
      const tCarnet = el("button", "tuile");
      tCarnet.type = "button";
      const icCarnet = el("span", "ic");
      icCarnet.appendChild(AIDES.icone("carnet"));
      tCarnet.append(icCarnet, el("b", "", "Mon carnet"), el("span", "petit", nbReperes ? T(`${nbReperes} ${nbReperes > 1 ? "repères" : "repère"}`) : "tes repères"));
      tCarnet.addEventListener("click", monCarnet);
      tuiles.append(tParcours, tCarnet);
      ajouterD(tuiles, espace());

      const vide = P.estVide(p);
      const liens = el("div", "liens2");
      liens.appendChild(lien(T("Comment ça marche ?"), commentCaMarche));
      if (vide) liens.appendChild(lien("Mode professeur", allerProf));
      else liens.appendChild(lien("Effacer mon historique", confirmerEffacer));
      ajouterD(liens);
      // (Lot 3b-3 bis : « Mode professeur » dans la même grille : à
      // l'ordinateur sur sa ligne, comme avant ; au téléphone, les trois
      // liens sur une seule rangée, chacun avec sa zone de 40 px.)
      if (!vide) {
        liens.classList.add("trois");
        liens.appendChild(lien("Mode professeur", allerProf, "seul"));
      }
    }

    function iconeCarte() {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("width", "34");
      s.setAttribute("height", "30");
      s.setAttribute("viewBox", "0 0 34 30");
      s.setAttribute("aria-hidden", "true");
      const p1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p1.setAttribute("d", "M2 5l9-3 12 4 9-3v22l-9 3-12-4-9 3z");
      p1.setAttribute("fill", "none");
      p1.setAttribute("stroke", "#087a71");
      p1.setAttribute("stroke-width", "2.5");
      p1.setAttribute("stroke-linejoin", "round");
      const p2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p2.setAttribute("d", "M11 2v22M23 6v22");
      p2.setAttribute("stroke", "#087a71");
      p2.setAttribute("stroke-width", "2.5");
      s.append(p1, p2);
      return s;
    }

    function allerProf() {
      window.location.href = `${window.location.pathname}?prof=1`;
    }

    // « Effacer mon historique » : la question posée par-dessus l'écran,
    // rien ne bouge derrière (choix de Gwenaël du 06/11).
    function confirmerEffacer() {
      voile.textContent = "";
      const boite = el("div", "boite");
      boite.setAttribute("role", "dialog");
      boite.setAttribute("aria-modal", "true");
      boite.append(el("b", "", "Effacer tout ton historique ?".replace(" ?", `${NB}?`)),
        el("div", "petit", "Tes étapes validées, tes étoiles, tes ceintures et ton carnet seront effacés sur cet appareil. On ne peut pas revenir en arrière."));
      boite.lastChild.style.fontSize = rem(15);
      const oui = bouton("Oui, tout effacer", "rouge", () => {
        etat.parcours = P.effacer(stockage());
        accueil();
      });
      const non = bouton("Non, je garde tout", "cl", () => { voile.hidden = true; voile.textContent = ""; });
      boite.append(oui, non);
      voile.appendChild(boite);
      voile.hidden = false;
      non.focus();
    }

    // ============================================================ LA SÉANCE
    // Lot 3a (choix de Gwenaël du 14/11) : une séance = « Je me souviens »
    // (les étapes qui reviennent ; rien le premier jour), puis Mon étape (On
    // te montre → À toi → Je valide, juste après), puis « Avant de partir »
    // (ce qui a été raté au début, redemandé ; rien n'y est compté).
    function lancerSeance() {
      nouvelleSeance();
      if (P.tirerSouvenirs(etat.parcours, etat.jour, PRETS).length) jeMeSouviens(() => monEtape());
      else monEtape();
    }
    function monEtape(code) {
      const c = code || P.monEtape(etat.parcours, PRETS);
      // Plus d'étape prête (le palier est fini) : la séance finit par « Avant
      // de partir » s'il y a quelque chose à redemander.
      if (!c) { if (etat.aRedemander.length) avantDePartir([["Accueil", "", accueil]]); else accueil(); return; }
      const action = PROF ? "apprends" : P.actionDe(etat.parcours, c, etat.jour);
      if (action === "validee") { accueil(); return; }
      noterSeance({etape: c});
      if (action === "valide") { jeValide(c); return; }
      changer(p => P.marquerVue(p, c, etat.jour));
      if (action === "apprends") onTeMontre(c, () => aToi(c));
      else aToi(c);
    }
    // Les boutons de la fin d'une étape : « Avant de partir → » d'abord s'il
    // y a quelque chose à redemander (ses boutons viendront après), sinon
    // les boutons eux-mêmes. `boutons` : [[texte, classe, action]…].
    function ajouterSuite(boutons) {
      if (etat.aRedemander.length) { ajouter(bouton("Avant de partir →", "", () => avantDePartir(boutons))); return; }
      boutons.forEach(([texte, classe, action]) => ajouter(bouton(texte, classe, action)));
    }

    // --------------------------------------------------- l'écran d'une question
    // Bandeau, chemin, question (hauteur fixe pour la séance), zone d'aide
    // (même place, même taille), pavé ou choix, bouton.
    // `zone` : « aide » (À toi : la place fixe de l'aide, à la
    // hauteur `hauteurZone` mesurée pour la série), « info » (Je valide, Tu
    // connais déjà ? : ce qu'il y a à dire, sans boîte), « montre » (On te
    // montre : à la hauteur du dessin), ou « aucune » (plus utilisée depuis
    // le lot 3a : « Je me souviens » a sa zone, pour la correction dessinée).
    // `jnsp` (lot 3a) : le bouton « Je ne sais pas », à gauche de
    // « Valider », dans la même rangée : sa place est toujours là (il se
    // cache sans rien faire bouger).
    function ecranQuestion({petit, titre, chip, chemin, retour, hauteur, hauteurPx, zone: sorteZone = "aide", hauteurZone, jnsp = false}) {
      ecran({serre: true, forme: "seance"});
      if (sorteZone === "aucune") cadre.classList.add("sans-aide");
      // Une aide à côté du pavé (À toi) ou l'escalier (Tu connais
      // déjà ?) : sur un écran peu haut, le pavé se fait plus court.
      if (sorteZone === "aide") cadre.classList.add("bas-court");
      if (hauteurPx) cadre.style.setProperty("--q-h", `${hauteurPx}px`);
      else if (hauteur) cadre.style.setProperty("--q-h", rem(hauteur));
      if (hauteurZone) cadre.style.setProperty("--z-h", `${hauteurZone}px`);
      const b = el("div", "bseance");
      const r = el("button", "rond"); r.appendChild(fleche());
      r.type = "button";
      r.setAttribute("aria-label", "Retour à l'accueil");
      r.addEventListener("click", retour || accueil);
      const t = el("div", "t");
      t.append(el("small", "", petit), el("b", "", titre));
      const c = el("span", "chip", chip || "");
      b.append(r, t, c);
      const ch = el("div", "chemin");
      chemin.noms.forEach((n, i) => {
        if (i) ch.appendChild(el("s"));
        ch.appendChild(el("i", i < chemin.ici ? "fait" : i === chemin.ici ? "ici" : "", n));
      });
      const q = el("div", "q");
      const zone = sorteZone === "aucune" ? null : el("div", `zone ${sorteZone === "info" ? "info" : sorteZone === "montre" ? "outil montre" : "vide"}`);
      const bas = el("div", "bas");
      const action = bouton("Valider", "", () => {});
      action.classList.add("action");
      let jnspEl = null;
      let rangee = action;
      if (jnsp) {
        jnspEl = bouton("Je ne sais pas", "cl jnsp", () => {});
        rangee = el("div", "duo duo-jnsp");
        rangee.append(jnspEl, action);
      }
      ajouter(b, ch, q, zone, bas, rangee);
      raccourcir(t.firstChild);
      return {q, zone, bas, action, chip: c, jnsp: jnspEl};
    }

    // La hauteur de la zone pour toute une série : celle du contenu le plus
    // haut parmi `remplissages` (chaque fonction remplit la zone), mesurée à
    // la vraie largeur de la zone, à cette taille d'écran. Ensuite, rien ne
    // bouge d'une question à l'autre (lot A2 : la zone n'est plus « toute la
    // hauteur libre », elle est juste assez haute).
    function mesurerZone(zone, remplissages) {
      const classe = zone.className;
      const style = zone.getAttribute("style");
      zone.style.cssText = "height:auto;min-height:0;flex:0 0 auto;align-self:start";
      let max = 0;
      remplissages.forEach(remplir => {
        zone.textContent = "";
        zone.className = classe;
        remplir(zone);
        max = Math.max(max, zone.getBoundingClientRect().height);
      });
      zone.textContent = "";
      zone.className = classe;
      if (style === null) zone.removeAttribute("style"); else zone.setAttribute("style", style);
      return Math.ceil(max + 1);
    }
    // Après une erreur dans « À toi », « Je valide » ou « Je me souviens » (lot A2 ter ; lot 3a) :
    // - la zone dit la bonne réponse ; pour une conversion, le glisse-unité
    //   de la question glisse tout seul de l'unité de départ à celle de la
    //   réponse, comme le glisse-unité animé de l'exerciseur, puis la réponse
    //   s'écrit dessous ;
    // - le pourquoi (l'erreur reconnue), la suite et les ronds viennent à la
    //   place des réponses, qui ne servent plus :
    //   les ronds ne passent plus jamais sous les réponses (Gwenaël, le 13/11).
    // `phrase` (lot 3b-2) : dans « À toi », la phrase que le glisse-unité
    // accompagne (« Chaque mètre devient 100 centimètres. ») ; pas dans les
    // séries sans aide, où la place manque au petit téléphone.
    function remplirErreurZone(zone, qn, {animer = false, phrase = false} = {}) {
      remplirZone(zone, "ko", ["ko", "La bonne réponse"]);
      const reponse = el("div", "reponse-bonne");
      // Un repère : sa carte (l'objet et sa mesure).
      // (Lot 3b : aussi le repère demandé au pavé.)
      if (qn.repere && (qn.forme === "qcm" || qn.forme === "phrase")) reponse.appendChild(AIDES.carteRepere(qn.repere, {grande: true}));
      // « Qu'est-ce que je mesure ? » : les quatre grandeurs, la bonne en vert.
      else if (qn.outil === "grandeurs") AIDES.montrer(reponse, {type: "grandeurs", bonne: qn.grandeur});
      else bonneReponse(reponse, qn);
      if (AIDES.correctionGlisse(zone, qn, {phrase, ensuite: () => { reponse.style.visibility = ""; }})) {
        if (animer) reponse.style.visibility = "hidden";
      } else if (!qn.choix && !qn.objets && !qn.ordre && qn.correction && qn.correction[0] && qn.correction[0] !== qn.resume && !reponse.querySelector(".horl-ligne")) {
        // Sans glisse-unité : la relation (ou le premier pas) sous la réponse.
        reponse.appendChild(el("div", "rel petite", qn.correction[0]));
      }
      zone.appendChild(reponse);
    }
    // `neutre` (lot 3a) : après « Je ne sais pas », pas de rouge ni de
    // reproche : la correction, et c'est tout.
    function remplirErreurBas(bas, retour, note, ronds, {neutre = false} = {}) {
      bas.textContent = "";
      const panneau = el("div", `zone ${neutre ? "neutre" : "ko"} panneau pourquoi`);
      if (retour && !neutre) panneau.appendChild(el("div", "verd ko", retour));
      if (note) panneau.appendChild(el("div", "note", note));
      if (ronds) panneau.appendChild(ronds);
      if (neutre) panneau.prepend(el("div", "verd neutre", "Regarde bien la correction."));
      else if (!retour) panneau.prepend(el("div", "verd ko", "Ce n'est pas ça."));
      bas.appendChild(panneau);
      ajusterZone(panneau);
    }
    function remplirErreur(ui, qn, retour, note, ronds, options = {}) {
      remplirErreurZone(ui.zone, qn, {animer: true, phrase: Boolean(options.phrase)});
      ajusterZone(ui.zone);
      remplirErreurBas(ui.bas, retour, note, ronds, options);
    }

    // La hauteur de la question d'une série (en px) : au moins celle de sa
    // question la plus haute (lot A2 ter) ; quand l'écran a de la place (plus
    // de 800 px de haut, ou un grand écran de plus de 700 px), celle d'avant,
    // fixe par étape (rien ne change à l'ordinateur ni au téléphone haut).
    // `codes` : le code de l'étape, ou les codes d'une série mêlée (lot 3a).
    function hauteurSerie(qEl, codes, questions) {
      const mesure = mesurerQuestions(qEl, questions);
      const plusHaute = Math.max(...[].concat(codes).map(hauteurQuestion));
      const px = plusHaute * parseFloat(getComputedStyle(document.documentElement).fontSize) / 16;
      const haut = window.innerHeight > 800 || (window.innerWidth >= 900 && window.innerHeight > 700);
      return haut ? Math.max(mesure, Math.round(px)) : mesure;
    }
    // La hauteur de la question est FIXE pendant toute la séance d'une
    // étape (rien ne bouge d'une question à l'autre) : celle de sa forme la
    // plus haute.
    function hauteurQuestion(code) {
      // Lot A2 bis : la durée entre deux heures a un énoncé (comme un
      // problème) ; les euros ont des pièces à compter dans la question.
      if (CARTE.etape(code).famille === "problemes" || code === "D7") return 178;
      return code === "E1" ? 156 : 124;
    }

    // Lot A2 ter : l'aide tient toujours dans sa zone. Au téléphone peu haut
    // (375 × 548, le petit iPhone), la zone a moins de place que l'aide
    // la plus haute de la série : son contenu se réduit d'un seul tenant, à
    // la place qu'il a, au lieu de passer sous l'étiquette « L'OUTIL » ou sous
    // les réponses (vu par Gwenaël sur son iPhone, le 13/11). L'étiquette (et
    // la relation posée à côté d'elle) ne bougent pas.
    function ajusterZone(zone) {
      if (!zone || !zone.isConnected || zone.classList.contains("info")) return;
      // La relation posée à côté de l'étiquette : trop longue pour la place
      // (« 1 € = 100 c, donc 7 € = 7 × 100 c » au petit téléphone), elle
      // revient dans l'aide, sous l'étiquette.
      const rel = zone.querySelector(":scope > .rel.petite:not(.libre)");
      const etiq = zone.querySelector(":scope > .etiq");
      if (rel && etiq && getComputedStyle(rel).position === "absolute") {
        const a = rel.getBoundingClientRect();
        const b = etiq.getBoundingClientRect();
        if (a.left < b.right + 4 && a.bottom > b.top && a.top < b.bottom) rel.classList.add("libre");
      }
      const libre = n => n.nodeType === 1 && (n.classList.contains("etiq") || n.classList.contains("zone-in")
        || (n === zone.querySelector(":scope > .rel.petite:not(.libre)") && getComputedStyle(n).position === "absolute"));
      let dedans = zone.querySelector(":scope > .zone-in");
      if (!dedans) { dedans = el("div", "zone-in"); zone.appendChild(dedans); }
      [...zone.childNodes].filter(n => !libre(n)).forEach(n => dedans.appendChild(n));
      dedans.style.transform = "";
      dedans.style.marginBottom = "";
      const s = getComputedStyle(zone);
      const place = zone.clientHeight - parseFloat(s.paddingTop) - parseFloat(s.paddingBottom);
      const besoin = dedans.scrollHeight;
      if (place > 0 && besoin > place + 1) {
        const k = Math.max(0.5, place / besoin);
        dedans.style.transform = `scale(${k.toFixed(3)})`;
        dedans.style.marginBottom = `${(-(besoin * (1 - k))).toFixed(1)}px`;
      }
      dedans.dataset.echelle = besoin > place + 1 && place > 0 ? (place / besoin).toFixed(2) : "1";
    }
    if (window.ResizeObserver) new ResizeObserver(() => ajusterZone(cadre.querySelector(".zone"))).observe(cadre);

    function remplirZone(zone, classe, etiquette) {
      zone.textContent = "";
      zone.className = `zone ${classe}`;
      if (etiquette) zone.appendChild(el("span", `etiq ${etiquette[0]}`, etiquette[1]));
    }

    // Une ligne « avant = case unité » trop large pour l'écran (« 1 h 20 min
    // = … min », « une demi-heure = … min » au téléphone) : le début passe
    // sur sa propre ligne, la case et l'unité dessous, comme pour une
    // phrase. Mesuré au rendu ; la hauteur de la question ne change pas
    // (audit du 12/11 : ces questions sortaient de l'écran).
    function couperSiTropLarge(q, ligne, avantEl) {
      const style = getComputedStyle(ligne);
      const ecart = parseFloat(style.columnGap || style.gap) || 0;
      const enfants = [...ligne.children];
      const besoin = enfants.reduce((a, c) => a + c.getBoundingClientRect().width, 0) + ecart * (enfants.length - 1);
      const place = q.clientWidth - parseFloat(getComputedStyle(q).paddingLeft) - parseFloat(getComputedStyle(q).paddingRight);
      if (besoin <= place) return false;
      const p = el("div", "phrase-t", avantEl.textContent);
      avantEl.remove();
      ligne.before(p);
      return true;
    }

    // Pose une question et attend la réponse. `avant(zone)` remplit la zone
    // avant la réponse ; `apres(verdict)` est appelé après « Valider ».
    // La question dans son bloc (lot A2 ter : à part, pour mesurer d'avance
    // la question la plus haute d'une série, à la largeur de l'écran).
    // `toucherCase(i)` : une case touchée. Rend les cases.
    function poserQuestion(qEl, question, toucherCase = () => {}) {
      const nbCases = question.forme === "deux-cases" ? 2 : 1;
      const casesEl = [];
      qEl.textContent = "";
      qEl.classList.toggle("long", Boolean(question.morceaux.long));
      const m = question.morceaux;
      const nouvelleCase = (i, petite) => {
        const c = el("span", `case${petite ? " petite" : ""}${i === 0 ? " focus" : ""}`, "");
        c.setAttribute("role", "textbox");
        c.setAttribute("aria-label", "Ta réponse");
        c.addEventListener("click", () => toucherCase(i));
        casesEl.push(c);
        return c;
      };
      // Les pièces à compter (lot A2 bis), sous la phrase de la question.
      const pieces = () => { if (m.pieces) qEl.appendChild(AIDES.rangeePieces(m.pieces, {classe: "pieces-q"})); };
      // La règle à lire (lot 3b-2) : l'objet posé sur la règle, sous la phrase.
      const regle = () => { if (m.regle) qEl.appendChild(AIDES.regle(m.regle)); };
      const deuxCases = l => {
        l.append(nouvelleCase(0, true), el("span", "", m.cases[0]), nouvelleCase(1, true));
        if (m.cases[1]) l.appendChild(el("span", "", m.cases[1]));
      };
      if (question.forme === "qcm" || question.forme === "vrai-faux") {
        if (m.enonce) qEl.appendChild(el("div", "enonce", m.enonce));
        if (m.proposition) qEl.appendChild(el("div", "prop", m.proposition));
        // L'horloge à lire (lot 3b-3) : l'horloge à gauche de la phrase, sur
        // une seule ligne (la question reste basse).
        if (m.horloge) {
          const l = el("div", "horloge-q");
          l.append(AIDES.horlogeHeure(m.horloge.h, m.horloge.m, "Une horloge"), el("div", "phrase-t", m.phrase));
          qEl.appendChild(l);
        } else if (m.phrase) qEl.appendChild(el("div", "phrase-t", m.phrase));
        regle();
        if (m.consigne) qEl.appendChild(el("div", "consigne2", m.consigne));
        if (question.forme === "vrai-faux") qEl.appendChild(el("div", "consigne2", T("Est-ce vraisemblable ?")));
      } else if (question.forme === "associer" || question.forme === "ranger") {
        // Lot A2 bis : relier, ranger. La consigne ; les objets et les
        // mesures sont à la place du pavé.
        qEl.appendChild(el("div", "phrase-t", m.phrase));
        if (m.consigne) qEl.appendChild(el("div", "consigne2", m.consigne));
      } else if (m.enonce) {
        qEl.appendChild(el("div", "enonce", m.enonce));
        const l = el("div", "l1");
        const avantEl = el("span", "", m.avant);
        l.appendChild(avantEl);
        if (m.cases) deuxCases(l);
        else l.append(nouvelleCase(0), el("span", "", m.apres));
        qEl.appendChild(l);
        if (m.cases) couperSiTropLarge(qEl, l, avantEl);
      } else if (m.phrase) {
        qEl.appendChild(el("div", "phrase-t", m.phrase));
        pieces();
        const l = el("div", "l1");
        l.append(nouvelleCase(0), el("span", "", m.apres));
        qEl.appendChild(l);
      } else if (nbCases === 2) {
        qEl.appendChild(el("div", "phrase-t", m.avant));
        pieces();
        const l = el("div", "l1");
        deuxCases(l);
        qEl.appendChild(l);
      } else {
        const l = el("div", "l1");
        const avantEl = el("span", "", m.avant);
        l.append(avantEl, nouvelleCase(0), el("span", "", m.apres));
        qEl.appendChild(l);
        couperSiTropLarge(qEl, l, avantEl);
      }
      return casesEl;
    }
    // La hauteur de la question pour toute une série : celle de la plus
    // haute, mesurée à la largeur de l'écran (lot A2 ter ; avant, une
    // hauteur fixe par étape, pensée pour 375 × 667, prenait la place de
    // l'aide au petit téléphone). Jamais moins que `mini` (en px).
    function mesurerQuestions(qEl, questions, mini = 0) {
      const style = qEl.getAttribute("style");
      qEl.style.cssText = "height:auto;flex:0 0 auto";
      let max = mini;
      questions.filter(Boolean).forEach(x => {
        poserQuestion(qEl, x);
        max = Math.max(max, qEl.getBoundingClientRect().height);
      });
      qEl.textContent = "";
      if (style === null) qEl.removeAttribute("style"); else qEl.setAttribute("style", style);
      return Math.ceil(max + 1);
    }

    // Pour le robot de vérification (tests/defi-conversions-*.cjs) : la
    // question à l'écran, pour y répondre juste ou faux (lot 3a : les séries
    // mêlées et sans les questions déjà vues ne se recalculent plus de
    // l'extérieur). Rien qu'on ne puisse déjà trouver avec les générateurs.
    let ici = null;
    const sensPourRobot = x => { const f = G.fauxDeSens(x); return f ? Object.assign({grandit: G.sensDe(x).grandit}, f) : null; };
    window.MATHSGO_DEFI_CONVERSIONS_ECRAN = Object.freeze({
      question: () => (ici ? {forme: ici.forme, reponse: ici.reponse, choix: ici.choix || null, bon: ici.bon, bonnes: ici.bonnes || null,
        ordre: ici.ordre || null, code: ici.code, cle: cleDe(ici), sens: sensPourRobot(ici), resume: ici.resume} : null)
    });

    // Le nom d'un objet à relier (lot 3b-2) : au téléphone peu haut, son
    // dessin au-dessus et un nom court quand le nom entier prendrait trois
    // lignes (« La plus petite graduation »).
    function nomObjet(o) {
      const t = el("span", "t");
      if (!o.court) { t.textContent = o.texte; return t; }
      t.append(el("span", "t-long", o.texte), el("span", "t-court", o.court));
      return t;
    }
    function interroger(ui, question, {avant, apres}) {
      const saisie = {cases: ["", ""], focus: 0, fige: false};
      const nbCases = question.forme === "deux-cases" ? 2 : 1;
      const m = question.morceaux;
      const casesEl = poserQuestion(ui.q, question, i => { if (!saisie.fige) { saisie.focus = i; peindre(); } });
      ici = question;
      voir(question);
      function peindre() {
        casesEl.forEach((c, i) => {
          c.textContent = saisie.cases[i].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
          if (!saisie.fige) c.className = `case${nbCases === 2 ? " petite" : ""}${i === saisie.focus ? " focus" : ""}`;
        });
      }
      function taper(touche) {
        if (saisie.fige) return;
        let v = saisie.cases[saisie.focus];
        if (touche === "⌫") v = v.slice(0, -1);
        else if (touche === ",") { if (!v.includes(",")) v = (v || "0") + ","; }
        else if (/^\d$/.test(touche) && v.replace(",", "").length < 9) v = v === "0" ? touche : v + touche;
        saisie.cases[saisie.focus] = v;
        peindre();
      }
      ui.bas.textContent = "";
      let choixEl = null;
      // Relier, ranger (lot A2 bis) : au doigt, rien ne bouge. Relier : on
      // touche un objet, puis sa mesure (ou l'inverse) ; la mesure prend la
      // lettre de l'objet. Ranger : on touche les mesures dans l'ordre, elles
      // prennent leur numéro ; on touche un numéro pour l'enlever.
      const relie = {lien: [null, null, null], sel: null};
      const range = [];
      let gesteEl = null;
      const complet = () => (question.forme === "associer" ? relie.lien.every(x => x !== null) : range.length === 4);
      function peindreGeste() {
        if (!gesteEl) return;
        if (question.forme === "associer") {
          [...gesteEl.querySelectorAll(".obj")].forEach((b, i) => {
            b.classList.toggle("sel", Boolean(relie.sel && relie.sel[0] === "obj" && relie.sel[1] === i));
            b.classList.toggle("lie", relie.lien[i] !== null);
          });
          [...gesteEl.querySelectorAll(".mes")].forEach((b, j) => {
            const i = relie.lien.indexOf(j);
            const lettre = b.querySelector(".lettre");
            lettre.textContent = i >= 0 ? "ABC"[i] : "";
            lettre.className = `lettre ${i >= 0 ? `l${i}` : "vide"}`;
            b.classList.toggle("sel", Boolean(relie.sel && relie.sel[0] === "mes" && relie.sel[1] === j));
            b.classList.toggle("lie", i >= 0);
          });
        } else {
          [...gesteEl.children].forEach((b, k) => {
            const n = range.indexOf(k);
            const rang = b.querySelector(".rang");
            rang.textContent = n >= 0 ? String(n + 1) : "";
            rang.className = `rang${n >= 0 ? " pris" : ""}`;
          });
        }
        if (!saisie.fige) ui.action.disabled = !complet();
      }
      function toucherGeste(sorte, k) {
        if (saisie.fige) return;
        if (question.forme === "ranger") {
          const n = range.indexOf(k);
          if (n >= 0) range.splice(n, 1); else range.push(k);
        } else if (relie.sel && relie.sel[0] !== sorte) {
          const [i, j] = sorte === "obj" ? [k, relie.sel[1]] : [relie.sel[1], k];
          relie.lien = relie.lien.map(x => (x === j ? null : x));
          relie.lien[i] = j;
          relie.sel = null;
        } else relie.sel = relie.sel && relie.sel[0] === sorte && relie.sel[1] === k ? null : [sorte, k];
        peindreGeste();
      }
      if (question.forme === "associer") {
        gesteEl = el("div", `assoc${question.objets.every(o => !o.repere) ? " sans-dessins" : ""}${question.morceaux.mots ? " mots" : ""}`);
        question.objets.forEach((o, i) => {
          // (Lot 3b-3 : un objet sans dessin, « 1 L », s'écrit en grand.)
          const b = el("button", o.repere ? "obj" : "obj sans-dessin");
          b.type = "button";
          // (Lot 3b : relier des relations, « 1 m », « 1 kg » : pas d'image.)
          b.append(...[el("span", `lettre l${i}`, "ABC"[i]), o.repere ? AIDES.imageRepere(o.repere) : null, nomObjet(o)].filter(Boolean));
          b.addEventListener("click", () => toucherGeste("obj", i));
          const mb = el("button", "mes");
          mb.type = "button";
          mb.append(el("span", "lettre vide", ""), el("span", "t", question.mesures[i]));
          mb.addEventListener("click", () => toucherGeste("mes", i));
          gesteEl.append(b, mb);
        });
      } else if (question.forme === "ranger") {
        gesteEl = el("div", "ranger");
        question.mesures.forEach((t, k) => {
          const b = el("button", "");
          b.type = "button";
          b.append(el("span", "rang", ""), el("span", "t", t));
          b.addEventListener("click", () => toucherGeste("mes", k));
          gesteEl.appendChild(b);
        });
      }
      if (gesteEl) {
        ui.bas.appendChild(gesteEl);
        ui.action.style.visibility = "";
        ui.action.textContent = "Valider";
        ui.action.disabled = true;
        ui.action.onclick = () => repondre(null);
        peindreGeste();
      } else if (question.choix) {
        // Quatre réponses : deux par ligne, toujours (empilées, elles
        // débordaient de la zone au petit téléphone ; vu par le robot dans
        // WebKit, lot A2 bis).
        // (Lot 3b-3 : des réponses en mots, « sept heures moins le quart » :
        // « mots », elles passent sur plusieurs lignes dans leur bouton.)
        choixEl = el("div", `choix${question.choix.length === 2 ? " deux" : ""}${question.choix.length === 4 ? " quatre" : ""}${m.sorte === "horloge" || m.sorte === "mots" ? " mots" : ""}`);
        if (m.sorte === "objets") choixEl.classList.add("objets");
        question.choix.forEach((texte, i) => {
          const b = el("button", "", question.forme === "vrai-faux" ? texte : (m.sorte === "valeur" ? T(`${texte} ${m.apres}`) : texte));
          // Lot B1-1 : « Qu'est-ce qui mesure 400 m ? » — les repères
          // dessinés, leur nom court dessous.
          if (m.sorte === "objets") {
            b.textContent = "";
            b.append(AIDES.imageRepere(m.reperes[i]), nomObjet({texte}));
          }
          b.type = "button";
          b.addEventListener("click", () => repondre(i));
          choixEl.appendChild(b);
        });
        ui.bas.appendChild(choixEl);
        ui.action.style.visibility = "hidden";
      } else {
        const pave = el("div", "pave4");
        ["1", "2", "3", "4", "5", "6", "7", "8", "9", ",", "0", "⌫"].forEach(t => {
          const b = el("button", t === "⌫" ? "gris" : "", t);
          b.type = "button";
          if (t === "⌫") b.setAttribute("aria-label", "Effacer");
          b.addEventListener("click", () => taper(t));
          pave.appendChild(b);
        });
        ui.bas.appendChild(pave);
        ui.action.style.visibility = "";
        ui.action.textContent = "Valider";
        ui.action.disabled = false;
        ui.action.onclick = () => repondre(null);
      }
      clavier = ev => {
        if (saisie.fige) { if (ev.key === "Enter" && !ui.action.disabled && ui.action.style.visibility !== "hidden") { ev.preventDefault(); ui.action.click(); } return; }
        if (gesteEl) { if (ev.key === "Enter" && complet()) { ev.preventDefault(); repondre(null); } return; }
        if (question.choix) {
          const n = Number(ev.key);
          if (n >= 1 && n <= question.choix.length) repondre(n - 1);
          return;
        }
        if (/^\d$/.test(ev.key)) taper(ev.key);
        else if (ev.key === "," || ev.key === ".") taper(",");
        else if (ev.key === "Backspace") { ev.preventDefault(); taper("⌫"); }
        else if (ev.key === "Tab" && nbCases === 2) { ev.preventDefault(); saisie.focus = 1 - saisie.focus; peindre(); }
        else if (ev.key === "Enter") { ev.preventDefault(); repondre(null); }
      };
      // « Je ne sais pas » (lot 3a) : la correction, comptée comme une erreur.
      if (ui.jnsp) {
        ui.jnsp.style.visibility = "";
        ui.jnsp.onclick = () => repondre(null, true);
      }
      avant(ui.zone);
      ajusterZone(ui.zone);

      function repondre(choix, jeNeSaisPas = false) {
        if (saisie.fige) return;
        let reponse = null;
        if (jeNeSaisPas) reponse = null;
        else if (gesteEl) {
          if (!complet()) return;
          reponse = question.forme === "associer" ? relie.lien.slice() : range.slice();
        } else if (question.choix) reponse = choix;
        else {
          if (saisie.cases.slice(0, nbCases).some(v => v === "" || v === ",")) {
            saisie.focus = saisie.cases.findIndex(v => v === "" || v === ",");
            peindre();
            return;
          }
          reponse = nbCases === 2 ? saisie.cases.slice(0, 2) : saisie.cases[0];
        }
        saisie.fige = true;
        if (ui.jnsp) ui.jnsp.style.visibility = "hidden";
        const verdict = jeNeSaisPas ? {juste: false, erreur: null, retour: null, jnsp: true} : G.verifier(question, reponse);
        verdict.tape = jeNeSaisPas || gesteEl ? "" : question.choix ? question.choix[choix] : (nbCases === 2 ? `${saisie.cases[0]} ; ${saisie.cases[1]}` : saisie.cases[0]);
        if (gesteEl) {
          // Chaque objet relié (ou chaque mesure rangée) : juste ou faux.
          gesteEl.classList.add("fige");
          if (jeNeSaisPas) { /* rien de relié : la correction dit tout */ } else if (question.forme === "associer") {
            relie.lien.forEach((j, i) => {
              const ok = j === question.bonnes[i];
              gesteEl.querySelectorAll(".obj")[i].classList.add(ok ? "bon" : "faux");
              gesteEl.querySelectorAll(".mes")[j].classList.add(ok ? "bon" : "faux");
            });
          } else range.forEach((k, n) => gesteEl.children[k].classList.add(k === question.ordre[n] ? "bon" : "faux"));
          ui.action.disabled = false;
        } else if (choixEl) {
          choixEl.classList.add("fige");
          [...choixEl.children].forEach((b, i) => {
            if (!jeNeSaisPas && i === choix) b.classList.add(verdict.juste ? "bon" : "faux");
            else if (!verdict.juste && i === question.bon && apres.montrerBon !== false) b.classList.add("bon");
            else b.classList.add("eteint");
          });
        } else {
          casesEl.forEach(c => { c.className = `case${nbCases === 2 ? " petite" : ""}${jeNeSaisPas ? "" : verdict.juste ? " vert" : " rouge"}`; });
          const pave = ui.bas.querySelector(".pave4");
          if (pave) pave.classList.add("pale");
        }
        apres.fait(verdict, {montrerBon: () => {
          if (choixEl) [...choixEl.children].forEach((b, i) => { if (i === question.bon) { b.classList.remove("eteint"); b.classList.add("bon"); } });
        }});
      }
      peindre();
    }

    let clavier = null;
    document.addEventListener("keydown", ev => {
      if (!voile.hidden) { if (ev.key === "Escape") { voile.hidden = true; voile.textContent = ""; } return; }
      if (clavier && !ev.ctrlKey && !ev.metaKey && !ev.altKey) clavier(ev);
    });

    // « C'est à toi ! » (et son crayon) sur une seule ligne (lot A2 ter : la zone sans
    // aide était la plus haute de la série, et laissait un grand vide sous
    // l'outil au téléphone).
    function cEstAToi() {
      const l = el("div", "calme grand ligne-toi");
      l.append(AIDES.icone("crayon", "emoji-calme"), document.createTextNode(T("C'est à toi !")));
      return l;
    }
    function suiteRonds(n, total = 5, legende = true, grand = false) {
      const s = el("div", `suite${grand ? " grand" : ""}`);
      for (let i = 0; i < total; i += 1) s.appendChild(el("i", i < n ? "ok" : ""));
      if (legende) s.appendChild(el("span", "", "justes de suite"));
      return s;
    }
    function dixCases(resultats, ici) {
      const d = el("div", "dix");
      for (let i = 0; i < 10; i += 1) {
        const r = resultats[i];
        d.appendChild(el("i", r === true ? "ok" : r === false ? "ko" : i === ici ? "ici" : "", r === true ? "✓" : r === false ? "✗" : String(i + 1)));
      }
      return d;
    }
    function bonneReponse(zone, question) {
      // (Lot 3b : une conversion au choix, sous son glisse-unité, s'écrit
      // comme une conversion au pavé : une ligne, la réponse en vert.)
      const choixGlisse = question.forme === "qcm" && question.glisse && question.resume.endsWith(question.reponseTexte);
      // La règle à lire (lot 3b-2) : la longueur en vert sur la règle, puis
      // le calcul.
      if (question.morceaux.regle) {
        zone.appendChild(AIDES.regle(Object.assign({}, question.morceaux.regle, {marquer: true, classe: "regle-c"})));
        zone.appendChild(texteLignes("grosse petite-grosse", question.correction.join("\n")));
        return;
      }
      // L'horloge à lire (lot 3b-3) : l'horloge à côté des trois lignes.
      if (question.morceaux.horloge) {
        const ligne = el("div", "horl-ligne");
        const col = el("div", "col-h");
        col.appendChild(texteLignes("grosse petite-grosse", question.correction.join("\n")));
        ligne.append(AIDES.horlogeHeure(question.morceaux.horloge.h, question.morceaux.horloge.m), col);
        zone.appendChild(ligne);
        return;
      }
      if (!choixGlisse && (question.forme === "qcm" || question.forme === "vrai-faux" || question.forme === "associer" || question.forme === "ranger")) {
        // Une seule ligne (« Je mesure une masse. ») : en grand ; plusieurs
        // (relier, ranger) : à la taille d'une phrase.
        zone.appendChild(texteLignes(question.correction.length > 1 ? "grosse petite-grosse" : "grosse", question.correction.join("\n")));
        return;
      }
      // Lot 3b-3 bis : une ligne longue (« 7 km + 629 m = 7 629 m ») se fait
      // un peu plus petite au téléphone, pour tenir sur une ligne (sur deux,
      // l'aide d'« À toi » tombait à 75 % au petit iPhone).
      const g = resumeEnVert(el("div", question.resume.length > 17 ? "grosse longue" : "grosse"), question);
      // L'heure en mots (lot 3b-2) : l'horloge à côté de la réponse.
      if (question.donnees.type === "heure-mots") {
        const ligne = el("div", "horl-ligne");
        const col = el("div", "col-h");
        col.append(g, el("div", "rel petite", question.correction[0]));
        ligne.append(AIDES.horlogeHeure(question.donnees.h, question.donnees.m), col);
        zone.appendChild(ligne);
        return;
      }
      zone.appendChild(g);
    }
    function apresDelai(fonction, ms = 650) {
      clavier = null;
      setTimeout(fonction, ms);
    }

    // ---------------------------------------------------------- On te montre
    function onTeMontre(code, ensuite, {retour} = {}) {
      const etape = CARTE.etape(code);
      let i = 0;
      const temps = () => {
        const ex = etape.apprends[i];
        const ui = ecranQuestion({petit: etape.nom, titre: "J'apprends", chip: `${i + 1} / 3`, chemin: {noms: ["J'apprends", "Je valide"], ici: 0},
          retour, hauteur: ex.question.enonce ? 160 : (ex.question.avant || "").length > 14 ? 112 : 70, zone: "montre"});
        ui.bas.remove();
        // La question, sa case remplie quand le geste est fait.
        const q = ui.q;
        let caseEl = null;
        if (ex.question.vraisemblable) {
          q.appendChild(el("div", "enonce", ex.question.enonce));
        } else {
          if (ex.question.enonce) q.appendChild(el("div", "enonce", ex.question.enonce));
          const l = el("div", "l1");
          caseEl = el("span", "case", "");
          // Une phrase longue sur sa ligne, la case dessous (rien ne déborde).
          if (ex.question.avant.length > 14 && !ex.question.enonce) {
            q.appendChild(el("div", "phrase-t", ex.question.avant));
            l.append(caseEl, el("span", "", ex.question.apres));
          } else {
            const avantEl = el("span", "", ex.question.avant);
            l.append(avantEl, caseEl, el("span", "", ex.question.apres));
            q.appendChild(l);
            // Coupée en deux lignes : la question prend la hauteur des
            // phrases longues (On te montre change de hauteur d'un temps à
            // l'autre ; pendant À toi, rien ne bouge).
            if (!ex.question.enonce && couperSiTropLarge(q, l, avantEl)) cadre.style.setProperty("--q-h", rem(112));
          }
          if (!l.parentNode) q.appendChild(l);
        }
        const consigne = ex.relation ? texteLignes("rel", ex.relation.join("\n")) : texteLignes("consigne2", ex.consigne || "");
        consigne.classList.add("consigne-montre");
        ui.zone.before(consigne);
        ui.zone.appendChild(el("span", "etiq outil", `On te montre · ${ex.etiquette}`));
        let geste = false;
        const fini = () => {
          geste = true;
          if (caseEl) { caseEl.textContent = ex.question.reponse; caseEl.className = "case vert"; }
          if (ex.apres && !ui.zone.querySelector(".apres")) {
            // La somme qui s'est construite laisse sa place à l'écriture finale.
            const somme = ui.zone.querySelector(".barres .somme, .dessin-boite .somme");
            if (somme) somme.remove();
            const a = el("div", "apres");
            ex.apres.forEach((ligne, k) => {
              if (k) a.appendChild(el("br"));
              const vert = ex.apres.length > 1 && k === ex.apres.length - 1 && /^=/.test(ligne);
              a.appendChild(vert ? el("span", "v", ligne) : document.createTextNode(ligne));
            });
            ui.zone.appendChild(a);
          }
          ajusterZone(ui.zone);
        };
        // Lot A2 ter : « Suivant » sans avoir fait le geste le joue à la
        // place de l'élève (on voit l'animation, la case se remplit,
        // l'explication apparaît) ; le second appui passe au temps suivant.
        // On peut toujours toucher soi-même.
        const jouer = AIDES.montrer(ui.zone, ex.aide, {fini});
        if (ex.legende) ui.zone.appendChild(texteLignes("note", ex.legende));
        ajusterZone(ui.zone);
        let joue = false;
        ui.action.textContent = "Suivant →";
        ui.action.onclick = () => {
          if (!geste && jouer) {
            if (!joue) { joue = true; ui.zone.classList.add("joue"); jouer(); }
            return;
          }
          i += 1;
          if (i < 3) temps();
          else {
            noterSeance({montre: 1});
            ensuite();
          }
        };
        clavier = ev => { if (ev.key === "Enter") { ev.preventDefault(); ui.action.click(); } };
      };
      temps();
    }

    // ---------------------------------------------------------------- À toi
    function aToi(code, {retour, fin} = {}) {
      const etape = CARTE.etape(code);
      // Lot 3a : sans les questions déjà vues aujourd'hui (« Je me souviens »).
      const serie = serieSure(code, {usage: "entraine", graine: graine()});
      const reponses = [];
      let i = 0;
      let hauteurZone = 0;
      let hauteurQ = 0;
      noterSeance({atoi: 2});
      const question = () => {
        const suivi = P.suivreEntrainement(reponses);
        if (suivi.reussi) {
          noterSeance({atoi: 1});
          changer(p => P.marquerEntrainee(p, code, etat.jour));
          aRetenir(code, {retour, fin});
          return;
        }
        if (suivi.fini || i >= serie.length) { finAToiSansReussir(code, {retour, fin}); return; }
        const qn = serie[i];
        const ui = ecranQuestion({petit: etape.nom, titre: "J'apprends", chip: `à toi · ${i + 1}`, chemin: {noms: ["J'apprends", "Je valide"], ici: 0},
          retour, hauteurPx: hauteurQ, hauteurZone, jnsp: true});
        if (!hauteurQ) { hauteurQ = hauteurSerie(ui.q, code, serie); cadre.style.setProperty("--q-h", `${hauteurQ}px`); }
        // La première fois : la hauteur de l'aide la plus haute de la série
        // (l'outil, l'image, une erreur), pour que rien ne bouge ensuite.
        if (!hauteurZone) {
          hauteurZone = mesurerZone(ui.zone, serie.flatMap(qn => [
            z => { remplirZone(z, "outil", ["outil", "L'outil"]); AIDES.outil(z, qn); },
            z => { remplirZone(z, "image", ["image", "L'image"]); AIDES.image(z, qn); },
            z => remplirErreurZone(z, qn, {phrase: true})
          ]).concat(z => { remplirZone(z, "vide", ["sans", "Sans aide"]); z.append(cEstAToi(), suiteRonds(4, 5, true, true)); }));
          cadre.style.setProperty("--z-h", `${hauteurZone}px`);
        }
        const phase = suivi.outil;
        // `deuxieme` : la question reposée après « Je prévois » (lot 3b-2) ;
        // elle ne compte pas une deuxième fois (l'erreur est déjà comptée).
        const poser = deuxieme => interroger(ui, qn, {
          avant(zone) {
            if (phase === "outil") { remplirZone(zone, "outil", ["outil", "L'outil"]); AIDES.outil(zone, qn); }
            else if (phase === "image") { remplirZone(zone, "image", ["image", "L'image"]); AIDES.image(zone, qn); }
            else { remplirZone(zone, "vide", ["sans", "Sans aide"]); zone.append(cEstAToi(), suiteRonds(suivi.justesDeSuite, 5, true, true)); }
          },
          apres: {fait(v) {
            if (!deuxieme) {
              reponses.push({juste: v.juste, outil: phase, jnsp: Boolean(v.jnsp)});
              i += 1;
            }
            if (v.juste) {
              if (phase === "aucun" && !deuxieme) { const s = ui.zone.querySelector(".suite"); if (s) s.replaceWith(suiteRonds(suivi.justesDeSuite + 1, 5, true, true)); }
              apresDelai(question);
              return;
            }
            // Une erreur de sens (diviser au lieu de multiplier, ou
            // l'inverse) : « Je prévois », puis l'élève recommence. Une fois
            // par question.
            if (!deuxieme && !v.jnsp && G.erreurDeSens(qn, v.tape)) { jePrevois(ui, qn, () => poser(true)); return; }
            const apresErreur = P.suivreEntrainement(reponses);
            // (Après « Je prévois », le pourquoi a déjà été dit.)
            // (Lot 3b-3 : la suite en peu de mots, « À la prochaine
            // question, » passait sur deux lignes et réduisait le panneau
            // au petit iPhone.)
            remplirErreur(ui, qn, deuxieme ? null : v.retour, phase === "outil" ? "Tu gardes l'outil." : apresErreur.outil === "outil" ? "L'outil revient." : "L'image revient.",
              suiteRonds(0), {neutre: v.jnsp, phrase: true});
            ui.action.style.visibility = "";
            ui.action.textContent = "Suivant →";
            ui.action.onclick = question;
          }}
        });
        poser(false);
      };
      question();
    }

    // « Je prévois » (lot 3b-2, choix de Gwenaël du 14/11 : seulement après
    // une erreur de sens). La question reste en haut ; la zone demande
    // « Le nombre va-t-il grandir ou rapetisser ? », les deux réponses
    // prennent la place du pavé. Rien ne bouge. Puis l'élève recommence.
    function jePrevois(ui, qn, recommencer) {
      const sens = G.sensDe(qn);
      clavier = null;
      ici = null;
      remplirZone(ui.zone, "prevois", ["prevois", "Je prévois"]);
      ui.zone.appendChild(el("div", "grosse petite-grosse", sens.question));
      ajusterZone(ui.zone);
      ui.bas.textContent = "";
      if (ui.jnsp) ui.jnsp.style.visibility = "hidden";
      ui.action.style.visibility = "hidden";
      const choix = el("div", "choix deux prevois-choix");
      const reponses = [[true, "Il grandit", "↑"], [false, "Il rapetisse", "↓"]];
      const repondre = grandit => {
        choix.classList.add("fige");
        [...choix.children].forEach((b, k) => b.classList.add(reponses[k][0] === sens.grandit ? "bon" : (reponses[k][0] === grandit ? "faux" : "eteint")));
        const juste = grandit === sens.grandit;
        ui.zone.appendChild(el("div", `verd ${juste ? "ok" : "ko"}`, juste ? "Oui !" : "Non."));
        ui.zone.appendChild(el("div", "rel petite", sens.phrase));
        ajusterZone(ui.zone);
        ui.action.style.visibility = "";
        ui.action.textContent = "Réessayer →";
        ui.action.onclick = recommencer;
        clavier = ev => { if (ev.key === "Enter") { ev.preventDefault(); recommencer(); } };
      };
      reponses.forEach(([grandit, texte, fleche]) => {
        const b = el("button", "");
        b.type = "button";
        b.append(el("span", "fl-sens", fleche), document.createTextNode(` ${texte}`));
        b.addEventListener("click", () => { if (!choix.classList.contains("fige")) repondre(grandit); });
        choix.appendChild(b);
      });
      ui.bas.appendChild(choix);
      clavier = ev => { if (ev.key === "1" || ev.key === "2") repondre(ev.key === "1"); };
    }

    function finAToiSansReussir(code, {retour, fin} = {}) {
      const etape = CARTE.etape(code);
      ecranQuestionFin(etape.nom, "J'apprends", 0, retour);
      ajouter(grosDessin("calendrier"));
      const t = el("div", "titre-fin", "On continue la prochaine fois");
      t.appendChild(el("small", "", "25 questions aujourd'hui : c'est beaucoup ! Tu reprendras « À toi » à ta prochaine séance.".replace(/« /g, `«${NB}`).replace(/ »/g, `${NB}»`)));
      ajouter(t, espace());
      if (fin) ajouter(bouton("Accueil", "", fin));
      else ajouterSuite([["Accueil", "", accueil]]);
    }

    function ecranQuestionFin(petit, titre, ici, retour, noms = ["J'apprends", "Je valide"]) {
      ecran({serre: false, forme: "fin"});
      const b = el("div", "bseance");
      const r = el("button", "rond"); r.appendChild(fleche());
      r.type = "button";
      r.setAttribute("aria-label", "Retour à l'accueil");
      r.addEventListener("click", retour || accueil);
      const t = el("div", "t");
      t.append(el("small", "", petit), el("b", "", titre));
      b.append(r, t, el("span", "chip", "fini"));
      const ch = el("div", "chemin");
      noms.forEach((n, i) => {
        if (i) ch.appendChild(el("s"));
        ch.appendChild(el("i", i < ici ? "fait" : i === ici ? "ici" : "", n));
      });
      ajouter(b, ch);
      raccourcir(t.firstChild);
      clavier = null;
    }
    // Lot 3b-3 : le nom de l'étape, au-dessus du titre du bandeau, prend son
    // nom court quand le long ne tient pas (au téléphone, « Combien de temps
    // entre deux heur… » devient « Entre deux heures »).
    function raccourcir(petitEl) {
      const e = CARTE.ETAPES.find(x => x.nom === petitEl.textContent);
      if (e && e.nomCourt && e.nomCourt !== e.nom && petitEl.scrollWidth > petitEl.clientWidth + 1) petitEl.textContent = e.nomCourt;
    }

    // ------------------------------------------------------------- À retenir
    function blocRetenir(code) {
      const etape = CARTE.etape(code);
      const r = el("div", "retenir");
      r.appendChild(el("div", "eti", "À retenir"));
      const p = el("p");
      etape.retenir.split("\n").forEach((l, i) => { if (i) p.appendChild(el("br")); p.appendChild(document.createTextNode(l)); });
      r.appendChild(p);
      return r;
    }
    // Les cases de « À retenir » : le tableau des relations, les cartes des
    // repères. Lot A2 ter (choix de Gwenaël, le 13/11 : « ça fait beaucoup à
    // lire là-haut ; on laisse que les trucs que tu as mis en dessous, dans
    // les cases ») : quand les cases disent tout, il n'y a plus de texte
    // au-dessus ; sinon, le texte dit en une ou deux phrases la règle ou la
    // méthode, que les cases ne disent pas.
    function casesRetenir(code) {
      const etape = CARTE.etape(code);
      const cases = [];
      if (etape.relations) {
        const c = el("div", "carte");
        c.style.padding = `${rem(10)} ${rem(12)}`;
        // (Lot B1-2 : le titre propre à l'étape, « Les six préfixes ».)
        const e = el("div", "eti", etape.titreRelations || (etape.retenir ? "Les relations de cette étape" : "À retenir : les relations"));
        e.style.marginBottom = rem(4);
        c.appendChild(e);
        const g = el("div", "relations");
        etape.relations.forEach(rel => g.appendChild(el("span", "", rel)));
        c.appendChild(g);
        cases.push(c);
      }
      if (etape.reperes && etape.reperes.length) {
        if (!etape.retenir) cases.push(el("div", "eti", "À retenir : mes repères"));
        const liste = el("div", "carnet refs");
        etape.reperes.forEach(rc => liste.appendChild(AIDES.carteRepere(rc)));
        cases.push(liste);
      }
      return cases;
    }
    function aRetenir(code, {retour, fin} = {}) {
      const etape = CARTE.etape(code);
      ecranQuestionFin(etape.nom, "J'apprends", 0, retour);
      const defile = el("div", "ecran-defile");
      if (etape.retenir) defile.appendChild(blocRetenir(code));
      casesRetenir(code).forEach(c => defile.appendChild(c));
      const cahier = el("div", "cahier");
      cahier.append(AIDES.icone("crayon"), document.createTextNode(` ${etape.cahier}`));
      // (Lot 3b-3 : « Je recopie cela dans mon cahier » sous la liste qui
      // défile, toujours visible ; au petit téléphone, il était coupé à
      // moitié au bas de la liste.)
      ajouter(defile, cahier);
      if (fin) { ajouter(bouton("Accueil", "", fin)); return; }
      // Lot 3a : Je valide vient juste après, le jour même.
      ajouter(bouton("Je valide →", "", () => jeValide(code)));
    }

    // ------------------------------------------------------------- Je valide
    // Lot 3a (choix de Gwenaël du 14/11) : le jour même, juste après « À
    // toi ». 10 questions, 8 justes, arrêt à la 3e erreur.
    // - Le mélange : 7 questions de l'étape et, aux places 3, 6 et 9, 3 des
    //   étapes déjà validées du palier (P.planValidation).
    // - La correction vient TOUT DE SUITE après une erreur : la bonne
    //   réponse, la relation, le glisse-unité qui glisse, comme dans « À
    //   toi » ; à la fin, la liste des erreurs est rappelée.
    // - « Je ne sais pas » compte comme une erreur.
    // - Aucune question vue aujourd'hui (dans « À toi » ou « Je me
    //   souviens ») ne revient.

    // La sorte d'une question (pour garder les questions à ranger, à relier,
    // en phrase… quand on n'en garde que 7).
    function sorteDe(q) {
      const d = q.donnees || {};
      return [q.forme, q.somme ? "somme" : "", d.type || "", d.sorte || "", d.cherche || ""].join("/");
    }
    // 7 questions de l'étape sur ses 10 : on retire une question de chaque
    // degré (1, 2 et 3), celle dont la sorte est la plus répétée dans la
    // série, jamais la dernière (une somme, deux cases, relier…).
    function retirerTrois(s) {
      if (s.length !== 10) return s.slice(0, 7);
      const garde = s.map(() => true);
      [[0, 1, 2], [3, 4, 5, 6], [7, 8]].forEach(groupe => {
        const compte = q => s.filter((x, k) => garde[k] && sorteDe(x) === sorteDe(q)).length;
        const milieu = (groupe[0] + groupe[groupe.length - 1]) / 2;
        let meilleur = null;
        groupe.forEach(k => {
          const c = compte(s[k]);
          if (!meilleur || c > meilleur.c || (c === meilleur.c && Math.abs(k - milieu) < Math.abs(meilleur.k - milieu))) meilleur = {k, c};
        });
        garde[meilleur.k] = false;
      });
      return s.filter((x, k) => garde[k]);
    }
    // Les 10 questions de Je valide, dans l'ordre du plan.
    function questionsValidation(code, source) {
      const plan = P.planValidation(source, code, PALIERS_CODES[CARTE.etape(code).palier]);
      const g = graine();
      const autres = plan.filter(c => c !== code);
      const siennes = serieSure(code, {usage: "valide", graine: g});
      const propres = autres.length ? retirerTrois(siennes) : siennes;
      const series = {};
      const deja = {};
      let k = 0;
      const questions = plan.map(c => {
        if (c === code) return propres[k++];
        // Une étape d'avant : une question de degré 2 de sa série (la 4e,
        // puis la 5e et la 6e si elle revient).
        series[c] = series[c] || serieSure(c, {usage: "valide", graine: g + 1});
        deja[c] = (deja[c] || 0) + 1;
        return series[c][2 + deja[c]] || series[c][deja[c]];
      });
      return {plan, questions: questions.every(Boolean) ? questions : siennes};
    }

    function jeValide(code, {retour, fin, source = null} = {}) {
      const etape = CARTE.etape(code);
      const {plan, questions} = questionsValidation(code, source || etat.parcours);
      const resultats = [];
      const erreurs = [];
      const avantC = ceintures();
      const legendeAvant = P.legende(etat.parcours);
      let i = 0;
      let hauteurQ = 0;
      let hauteurZone = 0;
      // Sans aide : les 10 cases et la consigne, au milieu de leur zone.
      const consigne = zone => {
        remplirZone(zone, "info fixe centre");
        zone.appendChild(dixCases(resultats, resultats.length < 10 ? resultats.length : -1));
        zone.appendChild(texteLignes("calme", "Sans aide.\n8 justes sur 10 pour valider l'étape."));
      };
      const question = () => {
        const suivi = P.suivreValidation(resultats);
        if (suivi.fini) { finValidation(code, suivi, erreurs, avantC, legendeAvant, resultats, {retour, fin}); return; }
        const qn = questions[i];
        const ui = ecranQuestion({petit: etape.nom, titre: "Je valide", chip: `${i + 1} / 10`, chemin: {noms: ["J'apprends", "Je valide"], ici: 1},
          retour, hauteurPx: hauteurQ, zone: "info", hauteurZone, jnsp: true});
        cadre.classList.add("bas-court");
        if (!hauteurQ) { hauteurQ = hauteurSerie(ui.q, plan, questions); cadre.style.setProperty("--q-h", `${hauteurQ}px`); }
        // La place de la correction, mesurée une fois : rien ne bouge
        // quand elle vient.
        if (!hauteurZone) {
          hauteurZone = mesurerZone(ui.zone, [consigne].concat(questions.map(x => z => remplirErreurZone(z, x))));
          cadre.style.setProperty("--z-h", `${hauteurZone}px`);
        }
        interroger(ui, qn, {
          avant(zone) { consigne(zone); },
          apres: {fait(v) {
            resultats.push(v.juste);
            i += 1;
            if (v.juste) { consigne(ui.zone); apresDelai(question, 500); return; }
            erreurs.push({question: qn, tape: v.tape, jnsp: Boolean(v.jnsp)});
            remplirErreur(ui, qn, v.retour, choisi(qn, v), dixCases(resultats, -1), {neutre: v.jnsp});
            ui.action.style.visibility = "";
            ui.action.textContent = "Suivant →";
            ui.action.disabled = false;
            ui.action.onclick = question;
          }}
        });
      };
      question();
    }

    // Une réponse à choix ratée : ce qui a été choisi (les réponses ont
    // laissé leur place à la correction).
    function choisi(qn, v) {
      return qn.choix && !v.jnsp && v.tape ? T(`Tu as choisi : ${v.tape}`) : null;
    }
    // Le résumé d'une question, la réponse en vert là où elle est écrite.
    // Lot 3b-3 bis (rapport de Codex, F06) : un repère ne finit pas toujours
    // par sa mesure (« Une voiture : environ 4 m de long », « Une feuille
    // A4 : 21 cm sur 29,7 cm ») ; couper à la longueur de la réponse donnait
    // « Une voiture : environ 4 m de l4 m ».
    function resumeEnVert(parent, question) {
      const r = question.resume;
      const v = question.reponseTexte;
      const k = r.endsWith(v) ? r.length - v.length : r.lastIndexOf(v);
      if (k < 0) { parent.appendChild(document.createTextNode(r)); return parent; }
      parent.append(document.createTextNode(r.slice(0, k)), el("span", "v", v));
      if (k + v.length < r.length) parent.appendChild(document.createTextNode(r.slice(k + v.length)));
      return parent;
    }
    function blocCorrection(erreurs) {
      const c = el("div", "corr");
      erreurs.forEach(({question, tape, jnsp}) => {
        const ligne = el("div");
        const gauche = el("span");
        if (question.forme === "qcm" || question.forme === "vrai-faux" || question.forme === "associer" || question.forme === "ranger") gauche.textContent = question.resume;
        else resumeEnVert(gauche, question);
        const geste = question.forme === "associer" || question.forme === "ranger";
        ligne.append(gauche, el("small", "", jnsp ? "je ne savais pas" : geste ? "à revoir" : question.choix ? `tu as choisi ${tape}` : `tu as écrit ${String(tape).replace(/\B(?=(\d{3})+(?!\d))/g, " ")}`));
        c.appendChild(ligne);
      });
      return c;
    }

    function finValidation(code, suivi, erreurs, avantC, legendeAvant, resultats, {retour, fin} = {}) {
      const etape = CARTE.etape(code);
      const reussie = suivi.reussie;
      const avantRatees = P.etapeDe(etat.parcours, code)[P.E.ratees];
      if (!PROF) {
        noterSeance({valide: reussie ? 1 : 2});
        changer(p => P.noterValidation(p, code, reussie, etat.jour));
      }
      ecranQuestionFin(etape.nom, "Je valide", reussie ? 2 : 1, retour);
      if (reussie) {
        ajouter(grosDessin("fete"));
        const t = el("div", "titre-fin", "Étape validée !".replace(" !", `${NB}!`));
        t.appendChild(el("small", "", T(`${suivi.justes} justes sur 10 · « ${etape.nom} »`)));
        ajouter(t);
      } else {
        const t = el("div", "titre-fin", `Pas encore : ${suivi.erreurs} erreurs`.replace(" :", `${NB}:`));
        t.style.fontSize = rem(23);
        t.appendChild(el("small", "", "8 sur 10 n'est plus possible, on s'arrête là."));
        ajouter(t);
      }
      ajouter(dixCases(resultats, -1));
      // Lot 3a : la correction a été vue tout de suite ; la liste la rappelle.
      if (erreurs.length) ajouter(el("div", "eti", erreurs.length > 1 ? "Mes erreurs, corrigées" : "Mon erreur, corrigée"), blocCorrection(erreurs));
      if (fin) { ajouter(espace(), bouton("Accueil", "", fin)); return; }
      if (reussie) {
        ajouter(el("div", "verd neutre", "Elle revient demain dans « Je me souviens ».".replace(/« /g, `«${NB}`).replace(/ »/g, `${NB}»`)), espace());
        const apres = suivante(code);
        const boutons = apres ? [["Étape suivante →", "", () => { nouvelleSeance(); monEtape(apres); }], ["Accueil", "cl", accueil]] : [["Accueil", "", accueil]];
        const nouvelles = recompensesGagnees(avantC, legendeAvant);
        if (nouvelles.length) { ajouter(bouton("Continuer →", "", () => montrerRecompenses(nouvelles, () => suiteSeule(boutons)))); return; }
        ajouterSuite(boutons);
      } else {
        const enEntier = avantRatees + 1 === P.SEUILS.ratees.apprendsEnEntier;
