<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>maths&go — Tuiles algébriques à découper</title>
<style>
:root{
  --bg:#f6efe7; --panel:#fffdf9; --ink:#23201d; --muted:#6d6258; --line:#ded2c6;
  --accent:#f47c20; --shadow:0 12px 32px rgba(68,45,22,.14);
  --pos:#72c475; --neg:#ef3f35; --x2:#2f8fc9; --x:#72c475; --u:#ffe64c; --grey:#dedede;
  --tileUnit:12.4mm; --tileX:39.6mm; --gap:3.1mm; --stroke:.45mm;
  --backOffsetX:0mm; --backOffsetY:0mm;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff8ef,var(--bg));}
.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr;gap:12px;padding:10px;}
.controls{position:sticky;top:10px;height:calc(100vh - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px;}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin:0 0 8px;padding:8px 0 10px;border-bottom:1px solid #eaded2}
.brand-link{display:block;line-height:0;text-decoration:none;flex:0 0 auto}
.brand-logo{width:160px;max-width:92%;height:auto;display:block;filter:drop-shadow(0 2px 3px rgba(68,45,22,.10))}
.brand-text h1{font-size:1.22rem;line-height:1.03;margin:2px 0 0;letter-spacing:-.045em;font-weight:1000}
.subtitle{font-size:.84rem;color:var(--muted);margin-top:2px;line-height:1.15;font-weight:500}
.block{border-top:1px solid #eee4d9;margin-top:7px;padding-top:7px}
.block-title{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:#8a7462;font-weight:950;margin-bottom:5px}
.field{margin:4px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label.main-label{display:block;font-weight:850;margin-bottom:3px;font-size:.76rem}
select,input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit;color:var(--ink);font-size:.82rem}
input[type="checkbox"]{width:auto;accent-color:var(--accent)}
.check{display:flex;gap:7px;align-items:flex-start;padding:6px 8px;border:1px solid #ece5db;border-radius:10px;background:#faf8f5;font-size:.76rem;font-weight:650;line-height:1.18;margin:5px 0}
.buttons{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px;padding-top:8px;background:linear-gradient(180deg,rgba(255,253,249,.80),var(--panel) 38%)}
button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:9px 8px;font-weight:950;font-size:.82rem;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
button:hover{filter:brightness(.985);transform:translateY(-1px)}
.mini{font-size:.69rem;color:var(--muted);line-height:1.18;margin-top:3px}
.warning{background:#fff0e7;border:1px solid #ffd0b5;border-radius:12px;padding:8px 10px;font-size:.78rem;line-height:1.28;color:#6f4331;margin-top:8px}

.advanced{border-top:1px solid #eee4d9;margin-top:7px;padding-top:7px}
.advanced summary{cursor:pointer;list-style:none;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:#8a7462;font-weight:950;margin-bottom:5px}
.advanced summary::-webkit-details-marker{display:none}
.advanced summary::after{content:'+';float:right;color:var(--accent);font-size:.9rem;line-height:1}
.advanced[open] summary::after{content:'−'}

.choice-grid{display:grid;gap:6px}
.choice-grid.cols-2{grid-template-columns:1fr 1fr}
.choice-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.choice-grid.cols-2-tight{grid-template-columns:1fr 1fr}
.choice-grid.cols-4{grid-template-columns:repeat(2,1fr)}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:block;padding:6px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;font-size:.76rem;font-weight:800;line-height:1.12;cursor:pointer}
.choice input:checked + span{background:#fff7ef;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:#8e4a12}
.choice.compact span{font-size:.73rem;padding:6px 5px}

.preview-wrap{overflow:auto;padding-bottom:42px}
.page-stack{display:flex;flex-direction:column;gap:18px;align-items:center}
.page{background:white;box-shadow:var(--shadow);position:relative;overflow:hidden;border:1px solid #ddd;page:a4-portrait}
.page.portrait{width:210mm;height:297mm}
.page.cazoom{--tileUnit:12.4mm;--tileX:39.6mm;--gap:3.1mm}
.page.large{--tileUnit:16mm;--tileX:51mm;--gap:3.4mm}
.page.xlarge{--tileUnit:20mm;--tileX:64mm;--gap:4.2mm}
.sheet{position:absolute;inset:0;padding:10mm 10mm 7mm;display:flex;flex-direction:column}
.sheet-inner{height:100%;display:flex;flex-direction:column;min-height:0}
.sheet.back .sheet-inner{transform:translate(var(--backOffsetX),var(--backOffsetY));}
.sheet-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.8mm solid var(--accent);padding-bottom:3mm;margin-bottom:3mm;gap:8mm;flex:0 0 auto}
.title{font-size:20px;font-weight:1000;letter-spacing:-.035em;line-height:1.02}
.cut-note{font-size:10.8px;color:#7d7067;margin-top:1.2mm;line-height:1.25}
.meta{font-size:10px;color:#555;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1.2mm}
.header-logo{width:42mm;height:auto;display:block;filter:drop-shadow(0 1px 2px rgba(68,45,22,.10))}
.sheet-content{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
.crop{position:absolute;width:8mm;height:8mm;border-color:#333;opacity:.65;pointer-events:none}
.crop.tl{left:5mm;top:5mm;border-left:.25mm solid;border-top:.25mm solid}
.crop.tr{right:5mm;top:5mm;border-right:.25mm solid;border-top:.25mm solid}
.crop.bl{left:5mm;bottom:5mm;border-left:.25mm solid;border-bottom:.25mm solid}
.crop.br{right:5mm;bottom:5mm;border-right:.25mm solid;border-bottom:.25mm solid}
.tile{position:relative;display:grid;place-items:center;flex:0 0 auto;border:var(--stroke) solid #222;background:var(--fill);font-weight:950;font-family:"Arial Rounded MT Bold","Aptos Rounded","Trebuchet MS",system-ui,sans-serif;color:#151515;line-height:1;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.tile.x2{width:var(--tileX);height:var(--tileX);font-size:calc(var(--tileUnit)*.72)}
.tile.x{width:var(--tileX);height:var(--tileUnit);font-size:calc(var(--tileUnit)*.58)}
.tile.unit{width:var(--tileUnit);height:var(--tileUnit);font-size:calc(var(--tileUnit)*.50)}
/* Les x ne dépendent plus d’une police installée : ils sont dessinés en SVG.
   Version précédente : x manuscrit arrondi. */
.tile-label{transform:translateY(-1%)}
.algebra-label{display:inline-flex;align-items:center;justify-content:center;gap:.025em;font-family:inherit;font-weight:950;letter-spacing:-.04em;font-variant-ligatures:none}
.x-glyph{width:.98em;height:.98em;overflow:visible;display:inline-block;vertical-align:-.11em}
.x-glyph path{fill:none;stroke:currentColor;stroke-width:var(--xStroke,10.5);stroke-linecap:round;stroke-linejoin:round}
.algebra-label .minus{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:950;margin-right:.015em;transform:translateY(-.02em)}
.algebra-label .power{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:.46em;font-weight:950;align-self:flex-start;margin-left:.015em;transform:translateY(-.10em)}
.label-small .algebra-label{gap:.01em}
.label-small .x-glyph{width:.82em;height:.82em}
.label-small .algebra-label .power{font-size:.42em;transform:translateY(-.08em)}
.label-small .tile-label{position:absolute;right:1.2mm;bottom:1mm;font-size:55%;transform:none}
.label-none .tile-label{display:none}
.tile.negative{color:#101010}
.outline .tile{background:white!important}
.bw .tile.negative{background:var(--grey)!important}
.bw .tile.positive{background:white!important}
.sign .tile.positive{background:var(--pos)!important}
.sign .tile.negative{background:var(--neg)!important}
.type .tile.x2.positive{background:var(--x2)!important}
.type .tile.x.positive{background:var(--x)!important}
.type .tile.unit.positive{background:var(--u)!important}
.type .tile.negative{background:var(--neg)!important}
/* Mode bleu / jaune : toutes les positives bleues, tous les opposés jaunes. */
.blueyellow .tile.positive{background:var(--x2)!important}
.blueyellow .tile.negative{background:var(--u)!important}
.classicenglish .tile.positive{background:var(--u)!important}
.classicenglish .tile.negative{background:var(--neg)!important}
.page.thin{--stroke:.30mm;--xStroke:7.2}
.board{display:flex;flex-direction:column;gap:calc(var(--gap) + .3mm);padding-top:1mm;width:100%;align-items:center}
.page.large .board{gap:3.6mm}
.page.xlarge .board{gap:4.2mm}
.row-tiles{display:flex;gap:var(--gap);align-items:flex-start;justify-content:center;width:100%}
.row-tiles.units{gap:2.4mm}
.group-gap{width:8mm;flex:0 0 auto}
.centered .row-tiles{justify-content:center}
.spread .row-tiles{justify-content:center}
@media(max-width:1050px){.app{grid-template-columns:1fr}.controls{position:relative;height:auto;top:0}.preview-wrap{padding:0}.page{transform-origin:top left}}
@page a4-portrait{size:A4 portrait;margin:0}
@media print{html,body{width:210mm!important;min-height:0!important;background:white!important;margin:0!important;padding:0!important;overflow:visible!important}.app{display:block!important;min-height:0!important;padding:0!important}.controls{display:none!important}.preview-wrap{overflow:visible!important;padding:0!important;height:auto!important}.page-stack{display:block!important;gap:0!important}.page{width:210mm!important;height:297mm!important;box-shadow:none!important;border:0!important;margin:0!important;overflow:hidden!important;break-inside:avoid!important;page-break-inside:avoid!important;break-after:auto;page-break-after:auto}.page:not(:last-child){break-after:page!important;page-break-after:always!important}.sheet-header{display:none!important}.tile{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}
</style>
</head>

<script>
(function(){
const $=id=>document.getElementById(id);
const checkedValue=name=>document.querySelector(`input[name="${name}"]:checked`)?.value;
const sizeKey=()=>checkedValue('size')||'cazoom';
const sizeLabel=()=>({cazoom:'normal',large:'grand',xlarge:'très grand'}[sizeKey()]||'normal');
function safeLetter(){return ($('letter').value||'x').trim().slice(0,3)||'x'}
function label(kind,sign){const l=safeLetter(); const minus=sign<0?'−':''; if(kind==='x2') return minus+l+'²'; if(kind==='x') return minus+l; return minus+'1'}
function roundedXGlyph(){
  return `<svg class="x-glyph" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M18 70 C31 79 43 75 50 50 C57 75 69 79 82 70"></path><path d="M18 30 C31 21 43 25 50 50 C57 25 69 21 82 30"></path></svg>`;
}
function algebraLabel(kind,sign){
  const l=safeLetter();
  const minus=sign<0?'<span class="minus">−</span>':'';
  const isX=l.toLowerCase()==='x';
  const base=isX ? roundedXGlyph() : `<span class="fallback-letter">${l}</span>`;
  const power=kind==='x2'?'<sup class="power">2</sup>':'';
  return `${minus}${base}${power}`;
}
function tile(kind,sign){
  const isUnit=kind==='unit';
  const content=isUnit ? label(kind,sign) : algebraLabel(kind,sign);

  return `<div class="tile ${isUnit?'unit':kind} ${sign<0?'negative':'positive'}"><span class="${labelClass}">${content}</span></div>`
}

function crops(){return '<div class="crop tl"></div><div class="crop tr"></div><div class="crop bl"></div><div class="crop br"></div>'}

const layouts={
  cazoom:{
    kit:{x2Rows:2,x2Pos:2,x2Neg:2,xRows:5,xPos:2,xNeg:2,uRows:5,uPos:5,uNeg:5},
    x2Only:{rows:5,pos:2,neg:2},
    xOnly:{rows:15,pos:2,neg:2},
    unitOnly:{rows:15,pos:5,neg:5}
  },
  large:{
    kit:{x2Rows:1,x2Pos:1,x2Neg:1,xRows:4,xPos:1,xNeg:1,uRows:5,uPos:4,uNeg:4},
    x2Only:{rows:4,pos:1,neg:1},
    xOnly:{rows:12,pos:1,neg:1},
    unitOnly:{rows:12,pos:4,neg:4}
  },
  xlarge:{
    kit:{x2Rows:1,x2Pos:1,x2Neg:1,xRows:3,xPos:1,xNeg:1,uRows:4,uPos:3,uNeg:3},
    x2Only:{rows:3,pos:1,neg:1},
    xOnly:{rows:10,pos:1,neg:1},
    unitOnly:{rows:10,pos:3,neg:3}
  }
};
function currentLayout(mode){return layouts[sizeKey()][mode]}
function tileRow(kind,pos,neg,units=false,back=false){
  const left = back ? repeat(kind,-1,neg) : repeat(kind,1,pos);
  const right = back ? repeat(kind,1,pos) : repeat(kind,-1,neg);
  return `<div class="row-tiles${units?' units':''}">${left}${units?'<div class="group-gap"></div>':''}${right}</div>`
}
function boardKit(back=false){
  const l=currentLayout('kit');
  let rows='';
  for(let i=0;i<l.x2Rows;i++) rows += tileRow('x2',l.x2Pos,l.x2Neg,false,back);
  for(let i=0;i<l.xRows;i++) rows += tileRow('x',l.xPos,l.xNeg,false,back);
  for(let i=0;i<l.uRows;i++) rows += tileRow('unit',l.uPos,l.uNeg,true,back);
  return `<div class="board spread">${rows}</div>`;
}
function boardX2(back=false){
  const l=currentLayout('x2Only');
  let rows='';
  for(let i=0;i<l.rows;i++) rows += tileRow('x2',l.pos,l.neg,false,back);
  return `<div class="board centered">${rows}</div>`;
}
function boardX(back=false){
  const l=currentLayout('xOnly');
  let rows='';
  for(let i=0;i<l.rows;i++) rows += tileRow('x',l.pos,l.neg,false,back);
  return `<div class="board centered">${rows}</div>`;
}
function boardU(back=false){
  const l=currentLayout('unitOnly');
  let rows='';
  for(let i=0;i<l.rows;i++) rows += tileRow('unit',l.pos,l.neg,true,back);
  return `<div class="board centered">${rows}</div>`;
}
function contentByMode(back=false){const m=checkedValue('mode'); if(m==='kit') return boardKit(back); if(m==='x2Only') return boardX2(back); if(m==='xOnly') return boardX(back); return boardU(back);}
function page(back=false){
  const pageClass=`page portrait ${checkedValue('size')} ${$('thinLines').checked?'thin':''} ${$('colorMode').value} label-${checkedValue('labels')}`;
  return `<section class="${pageClass}">${crops()}<div class="sheet ${back?'back':''}"><div class="sheet-inner">${header()}<div class="sheet-content">${contentByMode(back)}</div></div></div></section>`
}

function build(){
  document.documentElement.style.setProperty('--backOffsetX',($('offsetX').value||0)+'mm');
  document.documentElement.style.setProperty('--backOffsetY',($('offsetY').value||0)+'mm');
  let html = page(false);
  if($('doubleSided').checked) html += page(true);
  $('pages').innerHTML = html;
}
document.querySelectorAll('input[name="mode"], input[name="size"], input[name="labels"]').forEach(el=>el.addEventListener('input', build));
['letter','colorMode','thinLines','doubleSided','offsetX','offsetY'].forEach(id=>$(id).addEventListener('input', build));
$('printBtn').addEventListener('click', ()=>{build(); setTimeout(()=>window.print(), 80);});
build();
})();
</script>
