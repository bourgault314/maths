                    packMeta: JSON.parse(JSON.stringify(this.packMeta)),
                    lastPack: this.lastPack ? {...this.lastPack} : null,
                    isSubtractingInput: this.isSubtractingInput,
                    isMultiplyingInput: this.isMultiplyingInput,
                    displayMode: this.displayMode,
                    lastPos: {...this.lastPos},
                    lastSequentialPackId: this.lastSequentialPackId,
                    pendingPackGap: this.pendingPackGap,
                    penStrokes: this.clonePenStrokes(),
                    colorMode: this.colorMode,
                    productFrame: this.productFrame ? { x: this.productFrame.x, y: this.productFrame.y } : null
                };
                this.history.push(state);
            }

            undo() {
                if (this.history.length === 0) return;
                const state = this.history.pop();
                
                this.tokens.forEach(t => t.element && t.element.remove());
                document.querySelectorAll('.zero-badge').forEach(b => b.remove());
                this.removeProductFrameElement(false);
                
                this.steps = state.steps;
                this.currentStepIndex = state.currentStepIndex;
                this.nextId = state.nextId;
                this.nextPackId = state.nextPackId;
                this.nextPackOrder = state.nextPackOrder;
                this.packMeta = state.packMeta;
                this.lastPack = state.lastPack;
                this.isSubtractingInput = state.isSubtractingInput;
                this.isMultiplyingInput = state.isMultiplyingInput;
                this.displayMode = state.displayMode;
                this.lastPos = state.lastPos;
                this.lastSequentialPackId = state.lastSequentialPackId;
                this.pendingPackGap = state.pendingPackGap;
                this.penStrokes = state.penStrokes || [];
                this.currentStroke = null;
                this.colorMode = (state.colorMode === 'matignon') ? 'mathigon' : (state.colorMode || 'blueyellow');
                const colorSelect = document.getElementById('color-mode-select');
                if (colorSelect) colorSelect.value = this.colorMode;
                this.redrawPen();
                
                this.tokens = state.tokens.map(data => {
                    const el = document.createElement('div');
                    data.classes.forEach(c => el.classList.add(c));
                    let label = "";
                    if (data.type === 'x2') label = data.sign === 1 ? "x²" : "-x²";
                    else if (data.type === 'x') label = data.sign === 1 ? "x" : "-x";
                    else label = data.sign === 1 ? "1" : "-1";
                    el.innerHTML = `<span style="pointer-events:none;">${label}</span>`;
                    el.id = `t-${data.id}`;
                    el.style.left = data.x + 'px';
                    el.style.top = data.y + 'px';
                    
                    el.addEventListener('mousedown', (e) => this.handleDragStart(e));
                    el.addEventListener('touchstart', (e) => this.handleDragStart(e), {passive: false});
                    this.boardWorld.appendChild(el);
                    this.styleTileElement(el, data.type, data.sign);
                    
                    return { ...data, element: el };
                });
                
                const btnClose = document.getElementById('btn-close-parenthesis');
                if (this.isSubtractingInput || this.isMultiplyingInput) btnClose.classList.remove('hidden'); else btnClose.classList.add('hidden');
                
                this.checkOppositeAvailable();
                this.productFrame = state.productFrame ? { ...state.productFrame, element: null } : null;
                if (this.productFrame) { this.renderProductFrame(); this.reflowProductFrameTokens(); }
                this.applyColorMode(false);
                this.updateEquation();
            }

            initListeners() {
                this.boardContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    // Zoom vers le curseur (ancre sous la souris)
                    const r = this.boardContainer.getBoundingClientRect();
                    const localX = e.clientX - r.left;
                    const localY = e.clientY - r.top;

                    const worldX = (localX - this.pan.x) / this.scale;
                    const worldY = (localY - this.pan.y) / this.scale;

                    const delta = -e.deltaY * 0.001;
                    const newScale = Math.min(Math.max(0.5, this.scale + delta), 3);

                    this.pan.x = localX - worldX * newScale;
                    this.pan.y = localY - worldY * newScale;
                    this.scale = newScale;

                    this.updateTransform();
                    this.redrawPen();
                }, { passive: false });
                this.boardContainer.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    if (this.currentTool === 'pen' || this.currentTool === 'erase' || e.target.closest('.token') || e.target.closest('.product-frame')) return;
                    this.isPanning = true;
                    this.panStart = { x: e.clientX - this.pan.x, y: e.clientY - this.pan.y };
                    this.boardContainer.classList.add('panning');
                });
                window.addEventListener('mousemove', (e) => {
                    this.moveCursor(e);
                    if (this.isPanning) {
                        this.pan.x = e.clientX - this.panStart.x;
                        this.pan.y = e.clientY - this.panStart.y;
                        this.updateTransform();
                    }
                });
                window.addEventListener('mouseup', () => {
                    this.isPanning = false;
                    this.boardContainer.classList.remove('panning');
                });
                // Le stylo utilise uniquement Pointer Events : moins de doubles événements souris/stylet.
                
                // --- Support stylet (Pointer Events) : essentiel sur Windows/tablettes ---
                this.boardContainer.addEventListener('pointerdown', (e) => {
                    if (this.currentTool !== 'pen') return;
                    // Empêche le scroll/ink et évite le double déclenchement souris
                    e.preventDefault();
                    this.ignoreMouse = true;
                    setTimeout(() => { this.ignoreMouse = false; }, 60);

                    this.activePointerId = e.pointerId;
                    try { this.boardContainer.setPointerCapture(e.pointerId); } catch (err) {}

                    this.startDraw(e);
                }, { passive: false });

                window.addEventListener('pointermove', (e) => {
                    if (this.currentTool === 'pen') this.moveCursor(e);
                    if (!this.isDrawing || this.currentTool !== 'pen') return;
                    if (this.activePointerId !== null && e.pointerId !== this.activePointerId) return;
                    e.preventDefault();
                    this.draw(e);
                }, { passive: false });

                const stopPointerDraw = (e) => {
                    if (this.activePointerId === null) return;
                    if (e.pointerId !== this.activePointerId) return;
                    this.activePointerId = null;
                    this.isDrawing = false;
                    this.currentStroke = null;
                    try { this.boardContainer.releasePointerCapture(e.pointerId); } catch (err) {}
                };
                window.addEventListener('pointerup', stopPointerDraw);
                window.addEventListener('pointercancel', stopPointerDraw);

                const colorSelect = document.getElementById('color-mode-select');
                if (colorSelect) colorSelect.addEventListener('input', () => this.applyColorMode(false));
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            updateTransform() {
                this.boardWorld.style.transform = `translate(${this.pan.x}px, ${this.pan.y}px) scale(${this.scale})`;
                if (this.ctx && !this.isDrawing) this.ctx.lineWidth = this.getPenWorldWidth();
            }
            getWorldPos(cx, cy) {
                const r = this.boardContainer.getBoundingClientRect();
                return { x: (cx - r.left - this.pan.x) / this.scale, y: (cy - r.top - this.pan.y) / this.scale };
            }

            // --- VUE / OUTILS (petites actions sans risque) ---
            resetView() {
                this.scale = INITIAL_SCALE;
                this.pan = { x: 0, y: 0 };
                this.updateTransform();
            }

            toggleSound() {
                soundEnabled = !soundEnabled;
                // Création du contexte seulement si on réactive
                if (soundEnabled) ensureAudioCtx();
                this.updateSoundButton();
            }

            updateSoundButton() {
                const onIcon = document.getElementById('icon-sound-on');
                const offIcon = document.getElementById('icon-sound-off');
                const btn = document.getElementById('btn-sound');
                if (!onIcon || !offIcon || !btn) return;
                const isOn = !!soundEnabled;
                onIcon.classList.toggle('hidden', !isOn);
                offIcon.classList.toggle('hidden', isOn);
                btn.title = isOn ? 'Son : activé' : 'Son : coupé';
            }

            toggleFullscreen() {
                const doc = document;
                if (!doc.fullscreenElement) {
                    let p = null;
                    if (document.documentElement.requestFullscreen) {
                        try { p = document.documentElement.requestFullscreen({ navigationUI: 'hide' }); }
                        catch (e) { p = document.documentElement.requestFullscreen(); }
                    }
                    else if (document.body.requestFullscreen) p = document.body.requestFullscreen();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                } else {
                    const p = doc.exitFullscreen ? doc.exitFullscreen() : null;
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                }
            }

            updateFullscreenButton() {
                const enterIcon = document.getElementById('icon-fs-enter');
                const exitIcon = document.getElementById('icon-fs-exit');
                const btn = document.getElementById('btn-fullscreen');
                if (!enterIcon || !exitIcon || !btn) return;
                const isFs = !!document.fullscreenElement;
                enterIcon.classList.toggle('hidden', isFs);
                exitIcon.classList.toggle('hidden', !isFs);
                btn.title = isFs ? 'Quitter le plein écran' : 'Plein écran';
            }
            updateToolButtons() {
                const handBtn = document.getElementById('tool-hand');
                const penBtn = document.getElementById('tool-pen');
                const trashBtn = document.getElementById('tile-trash-zone');
                if (!handBtn || !penBtn) return;

                const setActive = (btn) => {
                    btn.classList.add('bg-white', 'shadow', 'text-gray-700');
                    btn.classList.remove('text-gray-500');
                };
                const setInactive = (btn) => {
                    btn.classList.remove('bg-white', 'shadow', 'text-gray-700');
                    btn.classList.add('text-gray-500');
                };

                setInactive(handBtn);
                setInactive(penBtn);
                if (trashBtn) trashBtn.classList.remove('tool-active');

                if (this.currentTool === 'pen') setActive(penBtn);
                else if (this.currentTool === 'erase') {
                    if (trashBtn) trashBtn.classList.add('tool-active');
                } else {
                    setActive(handBtn);
                }
            }

            // --- STYLO (undo + persistance après resize) ---
            clonePenStrokes() {
                try {
                    if (typeof structuredClone === 'function') return structuredClone(this.penStrokes);
                    return JSON.parse(JSON.stringify(this.penStrokes));
                } catch (e) {
                    return [];
                }
            }

            getPenWorldWidth() {
                // Le plateau est zoomé par CSS. On réduit donc l'épaisseur en coordonnées plateau
                // pour éviter un trait énorme quand le zoom de départ est supérieur à 100%.
                return PEN_SCREEN_WIDTH / Math.max(this.scale || 1, 0.5);
            }

            clearPenCanvas() {
                this.ctx.save();
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.restore();
            }

            redrawPen() {
                this.clearPenCanvas();
                if (!this.penStrokes || this.penStrokes.length === 0) return;

                const prevWidth = this.ctx.lineWidth;
                const prevColor = this.ctx.strokeStyle;
                const prevCap = this.ctx.lineCap;

                this.ctx.lineCap = 'round';

                for (const stroke of this.penStrokes) {
                    const pts = stroke.points || [];
                    if (pts.length < 2) continue;

                    this.ctx.strokeStyle = stroke.color || '#2563eb';
                    this.ctx.lineWidth = stroke.screenWidth ? (stroke.screenWidth / Math.max(this.scale || 1, 0.5)) : (stroke.width || this.getPenWorldWidth());

                    this.ctx.beginPath();
                    this.ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) this.ctx.lineTo(pts[i].x, pts[i].y);
                    this.ctx.stroke();
                }

                // Restore style
                this.ctx.lineWidth = prevWidth;
                this.ctx.strokeStyle = prevColor;
                this.ctx.lineCap = prevCap;
            }

            addTile(type, sign, x = null, y = null, withSound = true, orientation = 'h') {
                this.saveState();
                if(this.displayMode !== 'normal') { this.displayMode = 'normal'; this.isReduced = false; }
                if (withSound) playSound('pop'); // Son joué lors de l'ajout réel (drop ou clic)
                this.createTileToken(type, sign, (x!==null)?'manual':'auto', x, y, orientation);
                this.updateEquation();
            }

            createTileToken(type, sign, placementMode, customX=null, customY=null, orientation='h') {
                let tileSign = sign;
                let step = this.steps[this.currentStepIndex];
                
                if (this.isSubtractingInput && step.type === 'subtraction' && !step.oppositeApplied) tileSign = -sign;
                if (this.isMultiplyingInput && step.operator === '-') tileSign = -sign;

                // FIX 1: Allow manual placement to reuse the last pack if types match
                let pid;
                const lp = this.lastPack;
                // Un x horizontal et un x vertical représentent la même valeur algébrique.
                // On les autorise donc à appartenir au même paquet si on les pose à la suite.
                const sameOrientationOrSameX = type === 'x' || (lp && (lp.orientation || 'h') === orientation);
                const canReusePack = lp && lp.type === type && lp.sign === tileSign && sameOrientationOrSameX && lp.stepIndex === this.currentStepIndex;

                if (placementMode === 'auto') {
                    if (canReusePack) {
                        pid = lp.packId;
                    } else {
                        pid = this.nextPackId++;
                        this.packMeta[pid] = { order: this.nextPackOrder++ };
                        this.lastPack = { packId: pid, type, sign: tileSign, orientation, stepIndex: this.currentStepIndex };
                    }
                } else {
                    // Manual placement
                    if (canReusePack) {
                        pid = lp.packId;
                    } else {
                        pid = this.nextPackId++;
                        this.packMeta[pid] = { order: this.nextPackOrder++ };
                        // Update lastPack so subsequent drags/clicks group with this one
                        this.lastPack = { packId: pid, type, sign: tileSign, orientation, stepIndex: this.currentStepIndex };
                    }
                }

                const id = this.nextId++;
                const el = document.createElement('div');
                const colorClass = tileSign === 1 ? 'green' : 'red';
                el.classList.add('token', colorClass, `type-${type}`);
                if (type === 'x' && orientation === 'v') el.classList.add('orient-v');
                
                if (this.isSubtractingInput) el.classList.add('in-bracket');
                if ((this.isMultiplyingInput && !step.distributed)) el.classList.add('pending-mult');

                let label = getTileLabel(type, tileSign);
                el.innerHTML = `<span style="pointer-events:none;">${label}</span>`;
                this.styleTileElement(el, type, tileSign);
                el.id = `t-${id}`;

                let pos;
                if (placementMode === 'manual' && customX !== null) {
                    pos = { x: customX, y: customY };
                } else {
                    // Logic to add gap if pack changed
                    let gap = 0;
                    if (this.pendingPackGap > 0) {
                        gap = this.pendingPackGap;
                        this.pendingPackGap = 0;
                    } else if (this.lastSequentialPackId !== null && pid !== this.lastSequentialPackId) {
                        gap = PACK_GAP;
                    }
                    const size = getTileSize(type, orientation);
                    pos = this.getSequentialPosition(size.w, size.h, gap);
                }

                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                
                el.addEventListener('mousedown', (e) => this.handleDragStart(e));
                el.addEventListener('touchstart', (e) => this.handleDragStart(e), {passive: false});
                this.boardWorld.appendChild(el);

                const tokenObj = {
                    id, type, orientation, originalOrientation: orientation, sign: tileSign, displaySign: sign, element: el, x: pos.x, y: pos.y,
                    pairId: null, packId: pid, ghostIds: []
                };
                this.tokens.push(tokenObj);

                this.steps[this.currentStepIndex].tokenIds.push(id);
                
                // Update sequential pack tracking for both auto and manual
                this.lastSequentialPackId = pid;

                if (this.isMultiplyingInput && step.type === 'multiplication' && step.factor > 1) {
                    const strideH = SIZES['x2'].h + 20;
                    for(let i=1; i<step.factor; i++) {
                        const gid = this.nextId++;
                        const gel = el.cloneNode(true);
                        gel.id = `t-${gid}`;
                        const gpos = { x: pos.x, y: pos.y + i * strideH };
                        gel.style.top = gpos.y + 'px';
                        gel.addEventListener('mousedown', (e) => this.handleDragStart(e));
                        gel.addEventListener('touchstart', (e) => this.handleDragStart(e), {passive: false});
                        this.boardWorld.appendChild(gel);
                        // FIX: Assign correct packId to ghosts (same as master) to fix "Order" grouping
                        const gToken = { id: gid, type, orientation, originalOrientation: orientation, sign: tileSign, displaySign: sign, element: gel, x: gpos.x, y: gpos.y, pairId: null, packId: pid, ghostIds: [] };
                        this.tokens.push(gToken);
                        tokenObj.ghostIds.push(gid);
                    }
                }
            }

            getSequentialPosition(w, h, gap = 0) {
                const padding = 2; // tight spacing inside pack
                const viewW = this.boardContainer.clientWidth / this.scale;
                const wrapLimit = viewW - 50; 

                this.lastPos.x += gap;

                if (this.lastPos.x + w + padding > wrapLimit) {
                    this.lastPos.x = 40;
                    this.lastPos.y += this.lastPos.maxYInRow + 20;
                    this.lastPos.maxYInRow = 0;
                }
                const x = this.lastPos.x;
                const y = this.lastPos.y; 
                this.lastPos.x += w + padding;
                if (h > this.lastPos.maxYInRow) this.lastPos.maxYInRow = h;
                return {x, y};
            }

            separatePack() { this.saveState(); playSound('pop'); this.lastPack = null; this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP); }
            setOperator(op) { 
                this.saveState();
                if(this.isSubtractingInput) return; 
                this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
                this.steps.push({id:this.steps.length, operator:'-', type:'subtraction', tokenIds:[], factor:1, oppositeApplied:false, distributed:false, isClosed:false});
                this.currentStepIndex++; this.isSubtractingInput = true;
                document.getElementById('btn-close-parenthesis').classList.remove('hidden');
                this.updateEquation();
            }
            closeParenthesis() { 
                this.saveState();
                const s = this.steps[this.currentStepIndex];
                if(this.isSubtractingInput) { this.isSubtractingInput=false; s.isClosed=true; document.getElementById('btn-close-parenthesis').classList.add('hidden'); this.checkOppositeAvailable(); }
                else if(this.isMultiplyingInput) { s.isClosed=true; this.isMultiplyingInput=false; document.getElementById('btn-close-parenthesis').classList.add('hidden'); }
                this.updateEquation();
            }
            checkOppositeAvailable() { 
                const has = this.steps.some(s=>s.type==='subtraction'&&!s.oppositeApplied); 
                const btn=document.getElementById('btn-opposite'); if(has)btn.classList.remove('hidden'); else btn.classList.add('hidden');
            }
            applyOpposite() {
                this.saveState();
                const p = this.steps.filter(s=>s.type==='subtraction'&&!s.oppositeApplied);
                if(!p.length) return; playSound('flip');
                p.forEach(s => {
                    s.tokenIds.forEach(id => { const t=this.tokens.find(x=>x.id===id); if(t){ t.displaySign=t.sign; t.element.classList.remove('in-bracket'); } });
                    s.oppositeApplied=true;
                });
                this.checkOppositeAvailable(); this.updateEquation();
            }
            startMultiplication(f) { 
                this.saveState();
                const cur = this.steps[this.currentStepIndex];
                if (this.isSubtractingInput && cur.type==='subtraction' && cur.tokenIds.length===0) {
                    cur.type='multiplication'; cur.factor=f; this.isSubtractingInput=false; this.isMultiplyingInput=true;
                    document.getElementById('btn-close-parenthesis').classList.remove('hidden');
                    this.updateEquation(); return;
                }
                if(this.isSubtractingInput||this.isMultiplyingInput)return;
                this.steps.push({id:this.steps.length, operator:'+', type:'multiplication', tokenIds:[], factor:f, distributed:false, isClosed:false});
                this.currentStepIndex = this.steps.length-1; this.isMultiplyingInput=true;
                document.getElementById('btn-close-parenthesis').classList.remove('hidden');
                this.updateEquation();
            }
            applyDistribution() {
                this.saveState();
                const step = this.steps.find(s=>s.type==='multiplication'&&!s.distributed&&s.isClosed);
                if(!step) return;
                const masters = step.tokenIds.map(id=>this.tokens.find(t=>t.id===id)).filter(Boolean);
                if(step.operator==='-') step.operator='+';
                
                masters.forEach(t=>{
                    // FIX: Ensure master displays its true sign now that brackets are gone
                    t.displaySign = t.sign;
                    
                    t.ghostIds.forEach(gid=>{ 
                        const g=this.tokens.find(tk=>tk.id===gid); 
                        if(g){ 
                            step.tokenIds.push(gid); 
                            g.element.classList.remove('pending-mult'); 
                            // FIX: Ensure ghost displays true sign
                            g.displaySign = g.sign;
                        } 
                    });
                    t.ghostIds=[]; t.element.classList.remove('pending-mult');
                });
                step.distributed=true; document.getElementById('btn-distribute').classList.add('hidden');
                this.reflowBoardSequential(); this.updateEquation();
            }
            
            reflowBoardSequential() {
                this.lastPos = { x: 40, y: 60, maxYInRow: 0 };
                this.lastSequentialPackId = null; // Reset for reflow tracking
                
                this.steps.forEach((step, idx) => {
                    const toks = step.tokenIds.map(id=>this.tokens.find(t=>t.id===id)).filter(Boolean);
                    if(!toks.length) return;
                    
                    // FIX: Replaced custom layout logic with getSequentialPosition to ensure wrapping works
                    if(step.type==='multiplication'&&step.distributed) {
                        // FIX: Sort by ID to preserve chronological input order (e.g. 1, 1, x2, x2)
                        // instead of grouping by type.
                        toks.sort((a,b) => a.id - b.id);
                        
                        // Add gap before distributed block
                        if (idx > 0 && this.lastPos.x > 40) this.lastPos.x += PACK_GAP;

                        let localLastPackId = null;

                        toks.forEach(t => {
                            // FIX: Add gap if pack ID changes to separate groups visually
                            let gap = 0;
                            if (localLastPackId !== null && t.packId !== localLastPackId) {
                                gap = PACK_GAP;
                            }

                            const size = getTileSize(t.type, t.orientation);
                            const pos = this.getSequentialPosition(size.w, size.h, gap);
                            
                            t.element.classList.add('animating'); 
                            this.moveToken(t, pos.x, pos.y); 
                            setTimeout(()=>t.element.classList.remove('animating'),500); 
                            
                            localLastPackId = t.packId;
                        });
                    } else {
                        // Standard sequential reflow
                        if(idx>0 && this.lastPos.x>40) this.lastPos.x+=PACK_GAP;
                        let localLastPackId = null;
                        
                        toks.forEach(t=>{
                            let gap = 0;
                            // Check for pack changes within the step
                            if (localLastPackId !== null && t.packId !== localLastPackId) {
                                gap = PACK_GAP;
                            }
                            const size = getTileSize(t.type, t.orientation);
                            const pos = this.getSequentialPosition(size.w, size.h, gap);
                            t.element.classList.add('animating'); this.moveToken(t, pos.x, pos.y); setTimeout(()=>t.element.classList.remove('animating'),500);
                            localLastPackId = t.packId;
                        });
                    }
                });
            }

            orderAll() { this.saveState(); playSound('pop'); this.displayMode='ordered'; this.isReduced=false; this.organizeBoard(false); this.updateEquation(); }
            reduceExpression() { this.saveState(); playSound('magic'); this.displayMode='reduced'; this.isReduced=true; this.organizeBoard(true); this.updateEquation(); }
            
            organizeBoard(reduced) {
                const subset = (this.productFrame ? this.tokens.filter(t => !t.productZone) : this.tokens)
                    .filter(t => t.pairId === null && !t._canceling && t.element);
                if (!subset.length) return;

                // Avant, Ordonner/Réduire repartait toujours en haut à gauche du monde (20, 60).
                // Après un développement sous un tableau produit, cela donnait l'impression que les tuiles
                // partaient à l'autre bout du plateau. On conserve maintenant l'ancrage du paquet courant.
                const bounds = this.getTokenBounds(subset);
                const margin = 8;
                const startX = Math.max(20, bounds.minX - margin);
                const startY = Math.max(20, bounds.minY - margin);
                const visibleRight = (-this.pan.x + this.boardContainer.clientWidth) / this.scale;
                const naturalRight = startX + Math.max(420, this.boardContainer.clientWidth / this.scale - 80);
                const limitX = Math.max(startX + 260, visibleRight - 20, naturalRight);

                this.organizeSubset(subset, startX, startY, limitX, reduced);
            }

            getTokenBounds(tokens) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                tokens.forEach(t => {
                    const size = getTileSize(t.type, t.orientation);
                    minX = Math.min(minX, t.x);
                    minY = Math.min(minY, t.y);
                    maxX = Math.max(maxX, t.x + size.w);
                    maxY = Math.max(maxY, t.y + size.h);
                });
                return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
            }
            
            organizeSubset(subset, startX, startY, limitX, reduced) {
                const rows = [{type:'x2',s:1},{type:'x2',s:-1},{type:'x',s:1},{type:'x',s:-1},{type:'unit',s:1},{type:'unit',s:-1}];
                let y = startY;
                rows.forEach(r => {
                    const eligible = subset.filter(t => t.type===r.type && t.sign===r.s && t.pairId===null);
                    if(!eligible.length) return;

                    // Group by packs to preserve spacing in "Order" mode
                    let packs = [];
                    if (reduced) {
                        packs = [eligible]; // One big pack per type/sign
                    } else {
                        const map = new Map();
                        eligible.forEach(t => {
                            const pid = (typeof t.packId !== 'undefined') ? t.packId : -1;
                            if(!map.has(pid)) map.set(pid, []);
                            map.get(pid).push(t);
                        });
                        // Sort packs by packMeta order to keep chronological input order
                        const sortedPids = Array.from(map.keys()).sort((a,b) => {
                            const oa = this.packMeta[a]?.order ?? a;
                            const ob = this.packMeta[b]?.order ?? b;
                            return oa - ob;
                        });
                        packs = sortedPids.map(pid => map.get(pid));
                    }

                    let cx = startX; 
                    let rowH = 0;
                    
                    packs.forEach(pack => {
                        pack.forEach(t => {
                            const s = getTileSize(t.type, t.orientation);
                            if(cx + s.w > limitX) { 
                                cx = startX; 
                                y += rowH + (reduced?10:18); 
                                rowH = 0; 
                            }
                            t.element.classList.add('animating'); 
                            this.moveToken(t, cx, y); 
                            setTimeout(()=>t.element.classList.remove('animating'), 500);
                            cx += s.w + 2; 
                            rowH = Math.max(rowH, s.h);
                        });
                        if (!reduced) cx += 25; // Add visual gap between packs
                    });
                    
                    y += rowH + (reduced?18:18);
                });
            }

            moveToken(t,x,y) { t.x=x; t.y=y; t.element.style.left=x+'px'; t.element.style.top=y+'px'; }

            autoSimplify() { if(this._autoSimplifyActive)return; this.saveState(); this._autoSimplifyActive=true; if(this._timer) clearTimeout(this._timer); playSound('whoosh'); this.runSimplify(); }
            runSimplify() {
                const pairs = [];
                
                // FIX 3: Collect existing manual pairs (is-zero) first
                const processedManual = new Set();
                this.tokens.filter(t => t.pairId !== null && !t._canceling).forEach(t => {
                    if (processedManual.has(t.id)) return;
                    const partner = this.tokens.find(p => p.id === t.pairId);
                    if (partner && !partner._canceling) {
                        pairs.push([t, partner]);
                        processedManual.add(t.id);
                        processedManual.add(partner.id);
                    }
                });

                // Then find new pairs among available tokens
                const available = this.tokens.filter(t=>!t._canceling && t.pairId===null && !t.element.classList.contains('in-bracket'));
                const types=['x2','x','unit'];
                types.forEach(ty=>{
                    const g = available.filter(t=>t.type===ty && t.sign===1);
                    const r = available.filter(t=>t.type===ty && t.sign===-1);
                    g.sort((a,b)=>(a.y-b.y)||(a.x-b.x)); r.sort((a,b)=>(a.y-b.y)||(a.x-b.x));
                    g.forEach(gg=>{
                        if(!r.length)return;
                        let best=-1, dist=Infinity;
                        r.forEach((rr,i)=>{
                            const d = Math.hypot(gg.x-rr.x, gg.y-rr.y);
                            if(d<dist){ dist=d; best=i; }
                        });
                        if(best!==-1) pairs.push([gg, r.splice(best,1)[0]]);
                    });
                });
                if(!pairs.length) { this._autoSimplifyActive=false; this.updateEquation(); return; }
                pairs.forEach((p,i)=>setTimeout(()=>this.animateCancel(p[0],p[1]), i*400));
                this._timer = setTimeout(()=>this.runSimplify(), pairs.length*400+1500);
            }
            animateCancel(t1, t2) {
                const pairOrientation = t1.type === 'x' ? (t2.orientation || t1.orientation || 'h') : (t2.orientation || 'h');
                if (t1.type === 'x') {
                    this.setTokenOrientation(t1, pairOrientation);
                    this.setTokenOrientation(t2, pairOrientation);
                }
                const pairSize = getTileSize(t2.type, pairOrientation);
                const endX=t2.x; const endY=t2.y;
                t1._canceling=true; t2._canceling=true;
                t1.element.classList.add('animating'); t2.element.classList.add('animating');
                this.moveToken(t1, endX, endY);
                setTimeout(()=>{
                    const b=this.createZeroBadge(null, endX, endY, pairSize);
                    t1.element.classList.add('vanish'); t2.element.classList.add('vanish'); b.classList.add('vanish');
                    // Remove old pair badge if exists
                    const oldBadge = document.getElementById(`badge-${t1.id}-${t2.id}`) || document.getElementById(`badge-${t2.id}-${t1.id}`);
                    if(oldBadge) oldBadge.remove();

                    setTimeout(()=>{ this.removeTokens([t1,t2]); b.remove(); }, 900);
                }, 300);
            }

            removeTokens(list) {
                list.forEach(t=>t.element.remove());
                const ids=list.map(t=>t.id);
                this.tokens=this.tokens.filter(t=>!ids.includes(t.id));
                this.steps.forEach(s=>s.tokenIds=s.tokenIds.filter(id=>!ids.includes(id)));
                this.updateEquation();
            }

            resetBoard(keepEquationMode = false) {
                playSound('pop');
                this.tokens.forEach(t => t.element.remove());
                document.querySelectorAll('.zero-badge').forEach(b => b.remove());
                this.removeProductFrameElement(false);
                this.tokens = [];
                if (!keepEquationMode) {
                    this.steps = [{ id: 0, operator: '', type: 'simple', tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false }];
                    this.currentStepIndex = 0;
                }
                
                this.lastPos = { x: 40, y: 60, maxYInRow: 0 };
                this.lastSequentialPackId = null;
                this.scale = INITIAL_SCALE; this.pan = {x:0, y:0};
                
                // FORCE UI RESET
                this.isSubtractingInput = false;
                this.isMultiplyingInput = false;
                // FIX 2: Reset display mode to normal to show (...) instead of 0
                this.displayMode = 'normal';
                
                document.getElementById('btn-close-parenthesis').classList.add('hidden');
                document.getElementById('btn-opposite').classList.add('hidden');
                document.getElementById('btn-distribute').classList.add('hidden');
                
                this.updateTransform();
                this.clearDrawing(false);
                this.updateEquation();
            }

            // --- EQUATION TEXT ---
            updateEquation() {
                let displayString = "";
                displayString = this.productFrame ? this.generateExpressionWithProductFrameLatex() : this.generateExpressionString(this.displayMode);
                displayString = displayString.replace(/(\\;|\\,|\\quad|\\qquad)/g, "").replace(/\s+/g, "");
                katex.render(displayString, document.getElementById('equation-display'), { throwOnError: false });
                
                const hasPending = this.steps.some(s => s.type === 'multiplication' && !s.distributed && s.isClosed && s.factor > 1);
                const distBtn = document.getElementById('btn-distribute');
                if (hasPending) distBtn.classList.remove('hidden'); else distBtn.classList.add('hidden');
            }

            generateExpressionString(mode, excludeProduct = false) {
                // FIX 2: Check for empty tokens and return 0 (User request: empty board = 0)
                const expressionTokens = excludeProduct ? this.tokens.filter(t => !t.productZone) : this.tokens;
                if (expressionTokens.length === 0) return "0";

                if (!excludeProduct && mode === 'ordered') return this.generateOrderedLatex();
                if (!excludeProduct && mode === 'reduced') return this.generateGroupedLatex();
                let latex = ""; let isEmpty = true;
                const stepHasTokens = (step) => (step?.tokenIds || []).some(id => {
                    const t = this.tokens.find(tok => tok.id === id);
                    return t && (!excludeProduct || !t.productZone);
                });
                const hasNonEmptyBefore = (idx) => { for(let i=0; i<idx; i++) if(stepHasTokens(this.steps[i])) return true; return false; };
                this.steps.forEach((step, index) => {
                    const toks = step.tokenIds.map(id => this.tokens.find(t => t.id === id)).filter(t => t && (!excludeProduct || !t.productZone));
                    if (!toks.length && (excludeProduct || index !== this.currentStepIndex)) return;
                    let content = this.tokensToSeparatedLatex(toks); if (!toks.length || content === "") content = (content==="" && toks.length>0) ? "" : "\\dots";
                    let pStr = "";
                    if (step.type === 'multiplication') {
                        if (step.distributed) {
                            // FIX: Sort tokens by ID (creation order) instead of type
                            // Use tokensToSeparatedLatex to preserve the group structure (e.g. -4x^2 instead of -2x^2 -2x^2)
                            const distributedToks = [...toks].sort((a,b) => a.id - b.id);
                            pStr = this.tokensToSeparatedLatex(distributedToks);
                        }
                        else pStr = step.factor + "(" + content + ")";
                    } else if (step.type === 'subtraction') {
                        if (step.distributed || !step.oppositeApplied) pStr = "(" + content + ")";
                        else pStr = this.tokensToSeparatedLatex(toks);
                    } else {
                        pStr = content; if (index > 0 && this.latexStartsWithMinus(pStr)) pStr = "(" + pStr + ")";
                    }
                    if (index > 0 && hasNonEmptyBefore(index)) {
                        const plus = this.colorLatex(this.getEquationOperatorColor(1), '+'); const minusColor = this.colorLatex(this.getEquationOperatorColor(-1), '-');
                        if (step.type === 'subtraction' && step.oppositeApplied) { if (!this.latexStartsWithMinus(pStr)) latex += `\\;${plus}\\;`; }
                        else if (step.type === 'multiplication' && step.distributed && this.latexStartsWithMinus(pStr)) {}
                        else if (step.operator === '+' && !this.latexStartsWithMinus(pStr)) latex += `\\;${plus}\\;`;
                        else if (step.operator === '-') latex += `\\;${minusColor}\\;`;
                    }
                    latex += pStr; isEmpty = false;
                });
                
                // FIX: If result is empty string (e.g. all cancelled out), show 0
                if (latex === "") return "0";
                
                return isEmpty ? "\\dots" : latex;
            }
            tokensToSeparatedLatex(tokens) {
                if (!tokens || !tokens.length) return "";
                // FIX 2: Filter out tokens involved in a zero pair
                tokens = tokens.filter(t => t.pairId === null);

                const groups=[]; let cur=null;
                tokens.forEach(t=>{
                    const s=(t.displaySign===-1)?-1:1;
                    // L'orientation ne change pas la valeur : x horizontal et x vertical se lisent tous les deux x.
                    // On combine seulement les termes consécutifs de même type et même signe :
                    // x | x devient 2x, mais x | 1 | x reste x + 1 + x.
                    if(cur && cur.type===t.type && cur.s===s){
                        cur.c++;
                    } else {
                        if(cur) groups.push(cur);
                        cur={type:t.type,s:s,c:1};
                    }
                });
                if(cur)groups.push(cur);
                let l=""; let first=true;
                groups.forEach(g=>{
                    let term = (g.c===1?"":g.c)+(g.type==='x2'?"x^2":(g.type==='x'?"x":"")); if(g.type==='unit')term=String(g.c);
                    const col=this.getEquationColor(g.type, g.s);
                    const plusCol=this.getEquationOperatorColor(1);
                    const cTerm=this.colorLatex(col, term);
                    if(first) l+=(g.s===-1?this.colorLatex(col, "-"):"")+cTerm; else l+=(g.s===-1?`\\;${this.colorLatex(col, "-")}\\;`:`\\;${this.colorLatex(plusCol, "+")}\\;`)+cTerm;
                    first=false;
                });
                return l;
            }
            tokensToReducedSumLatex(tokens) {
                if (!tokens || !tokens.length) return "";

                // CORRECTION : Ordre imposé (x² -> x -> unit) au lieu de l'ordre de découverte
                const ord = ['x2', 'x', 'unit'];

                const c={x2:{p:0,n:0},x:{p:0,n:0},unit:{p:0,n:0}};
                tokens.forEach(t=>{ if(t._canceling || t.pairId !== null)return; if(t.sign===1)c[t.type].p++; else c[t.type].n++; });
                let l=""; let has=false;
                ord.forEach(ty=>{
                    if(c[ty].p>0) { 
                        const core=(c[ty].p===1&&ty!=='unit')?'':c[ty].p; const s=(ty==='x2'?'x^2':(ty==='x'?'x':'')); 
                        const col=this.getEquationColor(ty, 1);
                        const plusCol=this.getEquationOperatorColor(1);
                        const t=this.colorLatex(col, `${core}${s}`);
                        if(!has)l+=t; else l+=`\\;${this.colorLatex(plusCol, "+")}\\;`+t; has=true; 
                    }
                    if(c[ty].n>0) {
                        const core=(c[ty].n===1&&ty!=='unit')?'':c[ty].n; const s=(ty==='x2'?'x^2':(ty==='x'?'x':''));
                        const col=this.getEquationColor(ty, -1);
                        const t=this.colorLatex(col, `${core}${s}`);
                        if(!has)l+=this.colorLatex(col, "-")+t; else l+=`\\;${this.colorLatex(col, "-")}\\;`+t; has=true;
                    }
                });
                return l||"0";
            }
            generateOrderedLatex() { 
                // Group by Pack ID first
                const byPack = new Map();
                this.tokens.forEach(t => {
                    if (t.pairId !== null) return;
                    const pid = (typeof t.packId !== 'undefined') ? t.packId : -1;
                    if (!byPack.has(pid)) byPack.set(pid, []);
                    byPack.get(pid).push(t);
                });

                // Sort packs by order (preserves input sequence)
                const packs = Array.from(byPack.keys()).map(pid => ({
                    pid,
                    order: this.packMeta[pid]?.order ?? pid,
                    tokens: byPack.get(pid)
                })).sort((a, b) => a.order - b.order);

                let l = "";
                let first = true;

                // Standard Sort Order for types
                const types = [
                    {type:'x2', s:1}, {type:'x2', s:-1},
                    {type:'x', s:1}, {type:'x', s:-1},
                    {type:'unit', s:1}, {type:'unit', s:-1}
                ];

                types.forEach(spec => {
                    packs.forEach(p => {
                        const count = p.tokens.filter(t => t.type === spec.type && t.sign === spec.s).length;
                        if (count > 0) {
                            let term = (count === 1 && spec.type !== 'unit') ? "" : String(count);
                            if (spec.type === 'x2') term += "x^2";
                            else if (spec.type === 'x') term += "x";

                            const col = this.getEquationColor(spec.type, spec.s);
                            const plusCol = this.getEquationOperatorColor(1);
                            const cTerm = this.colorLatex(col, term);

                            if (first) {
                                l += (spec.s === -1 ? this.colorLatex(col, "-") : "") + cTerm;
                            } else {
                                l += (spec.s === -1 ? `\\;${this.colorLatex(col, "-")}\\;` : `\\;${this.colorLatex(plusCol, "+")}\\;`) + cTerm;
                            }
                            first = false;
                        }
                    });
                });

                return l || "0";
            } 

            generateGroupedLatex() { return this.tokensToReducedSumLatex(this.tokens); }
            latexStartsWithMinus(s) { return (s||'').trim().startsWith('-') || /^\{\\color\{[^}]+\}\{-\}\}/.test(s||''); }
            

            getClientPoint(ev) {
                const src = ev.changedTouches && ev.changedTouches.length ? ev.changedTouches[0] : (ev.touches && ev.touches.length ? ev.touches[0] : ev);
                return { x: src.clientX, y: src.clientY };
            }

            isOverTileTrash(cx, cy) {
                const zone = document.getElementById('tile-trash-zone');
                if (!zone) return false;
                const r = zone.getBoundingClientRect();
                return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
            }

            setTileTrashActive(active) {
                const zone = document.getElementById('tile-trash-zone');
                if (zone) zone.classList.toggle('trash-active', !!active);
            }

            deleteToken(token, save = true) {
                if (!token) return;
                if (save) this.saveState();
                playSound('pop');

                const ids = new Set([token.id]);
                if (Array.isArray(token.ghostIds)) token.ghostIds.forEach(id => ids.add(id));

                // Si on supprime un en-tête du tableau produit, on supprime aussi les cases de cette ligne/colonne
                // et on décale proprement les indices des autres cases.
                const removedTop = [];
                const removedLeft = [];
                this.tokens.forEach(t => {
                    if (!ids.has(t.id)) return;
                    if (t.productZone === 'top') removedTop.push(t.productIndex ?? 0);
                    if (t.productZone === 'left') removedLeft.push(t.productIndex ?? 0);
                });
                if (removedTop.length || removedLeft.length) {
                    this.tokens.forEach(t => {
                        if (t.productZone !== 'cell') return;
                        if (removedTop.includes(t.productCol ?? 0) || removedLeft.includes(t.productRow ?? 0)) ids.add(t.id);
                    });
                }

                // Si la tuile était dans une paire nulle, on libère l'autre tuile.
                this.tokens.forEach(t => {
                    if (!ids.has(t.id) || !t.pairId) return;
                    const partner = this.tokens.find(p => p.id === t.pairId);
                    if (partner && !ids.has(partner.id)) {
                        partner.pairId = null;
                        partner.element?.classList.remove('is-zero');
                        this.restoreTokenOrientation(partner);
                    }
                    const b = document.getElementById(`badge-${t.id}-${t.pairId}`) || document.getElementById(`badge-${t.pairId}-${t.id}`);
                    if (b) b.remove();
                });

                const removed = this.tokens.filter(t => ids.has(t.id));
                removed.forEach(t => t.element && t.element.remove());
                this.tokens = this.tokens.filter(t => !ids.has(t.id));
                this.steps.forEach(s => s.tokenIds = s.tokenIds.filter(id => !ids.has(id)));
                this.tokens.forEach(t => {
                    if (Array.isArray(t.ghostIds)) t.ghostIds = t.ghostIds.filter(id => !ids.has(id));
                    if (t.productZone === 'cell') {
                        t.productCol = (t.productCol ?? 0) - removedTop.filter(i => i < (t.productCol ?? 0)).length;
                        t.productRow = (t.productRow ?? 0) - removedLeft.filter(i => i < (t.productRow ?? 0)).length;
                    }
                });

                if (removed.some(t => t.productZone)) {
                    this.reindexProductHeaders('top');
                    this.reindexProductHeaders('left');
                    if (this.productFrame) {
                        this.renderProductFrame();
                        this.reflowProductFrameTokens();
                    }
                }
                this.checkOppositeAvailable();
                this.updateEquation();
            }

            handleDragStart(e) { 
                const el = e.target.closest('.token'); if(!el) return;
                const id = parseInt(el.id.split('-')[1]);
                if (this.currentTool === 'erase') {
                    e.preventDefault();
                    e.stopPropagation();
                    const token = this.tokens.find(t => t.id === id);
                    this.deleteToken(token);
                    return;
                }
                if (this.currentTool !== 'hand') return; e.stopPropagation();
                this.draggedToken = this.tokens.find(t => t.id === id);
                this.dragStartState = this.draggedToken ? {
                    x: this.draggedToken.x,
                    y: this.draggedToken.y,
                    orientation: this.draggedToken.orientation || 'h',
                    productZone: this.draggedToken.productZone,
                    productIndex: this.draggedToken.productIndex,
                    productRow: this.draggedToken.productRow,
                    productCol: this.draggedToken.productCol
                } : null;
                if(this.draggedToken.pairId) { 
                     const p=this.tokens.find(x=>x.id===this.draggedToken.pairId);
                     if(p){
                        p.pairId=null;
                        p.element.classList.remove('is-zero');
                        this.restoreTokenOrientation(p);
                     }
                     this.draggedToken.pairId=null;
                     this.draggedToken.element.classList.remove('is-zero');
                     this.restoreTokenOrientation(this.draggedToken);
                     const b=document.getElementById(`badge-${this.draggedToken.id}-${p?.id}`)||document.getElementById(`badge-${p?.id}-${this.draggedToken.id}`); if(b)b.remove();
                }
                el.classList.add('dragging');
                const r = el.getBoundingClientRect(); 
                this.dragOffset = { x: (e.touches?e.touches[0].clientX:e.clientX) - r.left, y: (e.touches?e.touches[0].clientY:e.clientY) - r.top };
                
                const move=(ev)=>{
                    ev.preventDefault();
                    const pt = this.getClientPoint(ev);
                    const cx = pt.x; const cy = pt.y;
                    const br = this.boardContainer.getBoundingClientRect();
                    const wx = (cx - br.left - this.pan.x - this.dragOffset.x)/this.scale;
                    const wy = (cy - br.top - this.pan.y - this.dragOffset.y)/this.scale;
                    this.draggedToken.element.style.left=wx+'px'; this.draggedToken.element.style.top=wy+'px';
                    this.draggedToken.x=wx; this.draggedToken.y=wy;
                    this.setTileTrashActive(this.isOverTileTrash(cx, cy));
                };
                const end=(ev)=>{
                    document.removeEventListener('mousemove',move); document.removeEventListener('touchmove',move);
                    document.removeEventListener('mouseup',end); document.removeEventListener('touchend',end);
                    if(this.draggedToken) {
                        this.draggedToken.element.classList.remove('dragging');
                        const pt = this.getClientPoint(ev || {});
                        if (this.isOverTileTrash(pt.x, pt.y)) {
                            const tokenToDelete = this.draggedToken;
                            if (this.dragStartState) {
                                tokenToDelete.x = this.dragStartState.x;
                                tokenToDelete.y = this.dragStartState.y;
                                tokenToDelete.orientation = this.dragStartState.orientation || tokenToDelete.orientation;
                                tokenToDelete.productZone = this.dragStartState.productZone;
                                tokenToDelete.productIndex = this.dragStartState.productIndex;
                                tokenToDelete.productRow = this.dragStartState.productRow;
                                tokenToDelete.productCol = this.dragStartState.productCol;
                            }
                            this.draggedToken=null;
                            this.dragStartState=null;
                            this.setTileTrashActive(false);
                            this.deleteToken(tokenToDelete, true);
                            return;
                        }
                        const productHandled = this.snapTokenToProductFrame(this.draggedToken);
                        if (!productHandled) this.checkSnapAndFinalize(this.draggedToken);
                        this.draggedToken=null; this.dragStartState=null; this.setTileTrashActive(false); this.updateEquation();
                    } else {
                        this.setTileTrashActive(false);
                    }
                };
                document.addEventListener('mousemove',move); document.addEventListener('touchmove',move,{passive:false});
                document.addEventListener('mouseup',end); document.addEventListener('touchend',end);
            }

            setTool(t) {
                this.currentTool = t;
                const p = t === 'pen';
                this.boardContainer.classList.toggle('hide-cursor', p);
                document.getElementById('custom-cursor').style.display = p ? 'block' : 'none';
                this.updateToolButtons();
            }

            startDraw(e) {
                // Undo doit aussi annuler le stylo : on snapshot au début du trait
                this.saveState();
                this.isDrawing = true;

                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                const p = this.getWorldPos(cx, cy);

                const penWidth = this.getPenWorldWidth();
                this.ctx.lineWidth = penWidth;
                this.currentStroke = { color: this.ctx.strokeStyle, screenWidth: PEN_SCREEN_WIDTH, width: penWidth, points: [p] };
                this.penStrokes.push(this.currentStroke);

                this.lastDrawPos = p;
                this.ctx.beginPath();
                this.ctx.moveTo(p.x, p.y);
            }

            draw(e) {
                e.preventDefault();
                if (!this.isDrawing) return;

                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                const p = this.getWorldPos(cx, cy);

                if (this.currentStroke) {
                    this.currentStroke.points.push(p);
                    this.ctx.lineWidth = (this.currentStroke.screenWidth || PEN_SCREEN_WIDTH) / Math.max(this.scale || 1, 0.5);
                }

                this.ctx.lineTo(p.x, p.y);
                this.ctx.stroke();
                this.lastDrawPos = p;
            }

            clearDrawing(saveToHistory = true) {
                if (saveToHistory) this.saveState();
                this.penStrokes = [];
                this.currentStroke = null;
                this.clearPenCanvas();
            }

            resizeCanvas() {
                // Canvas HiDPI en coordonnées de plateau.
                // Le canvas commence maintenant avant l'origine (CANVAS_WORLD_MIN négatif),
                // sinon, après un dézoom, la partie haute visible du plateau peut correspondre
                // à des coordonnées négatives : le stylo écrit bien, mais hors du canvas.
                const dpr = Math.min(window.devicePixelRatio || 1, MAX_CANVAS_DPR);
                this.canvasPixelRatio = dpr;
                this.canvas.width = Math.round(CANVAS_WORLD_SIZE * dpr);
                this.canvas.height = Math.round(CANVAS_WORLD_SIZE * dpr);
                this.canvas.style.left = CANVAS_WORLD_MIN + 'px';
                this.canvas.style.top = CANVAS_WORLD_MIN + 'px';
                this.canvas.style.width = CANVAS_WORLD_SIZE + 'px';
                this.canvas.style.height = CANVAS_WORLD_SIZE + 'px';
                this.ctx.setTransform(dpr, 0, 0, dpr, -CANVAS_WORLD_MIN * dpr, -CANVAS_WORLD_MIN * dpr);
                this.ctx.lineWidth = this.getPenWorldWidth();
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.strokeStyle = '#2563eb';

                // IMPORTANT : resize efface le canvas -> on redessine les traits
                this.redrawPen();
            }

            moveCursor(e) {
                if (this.currentTool !== 'pen') return;
                const c = document.getElementById('custom-cursor');
                c.style.left = e.clientX + 'px';
                c.style.top = e.clientY + 'px';
                c.style.transform = 'translate(-7px,-7px)';
            }
        }

        const app = new AlgebraApp();
    </script>
</body>
