            reflowProductFrameTokens(animate = true) {
                if (!this.productFrame) return;
                if (this.productFrame.mode === 'facto') { this.factoReplacer(animate); return; }
                const f = this.productFrame;
                const m = this.getProductMetrics(f);
                const topObjs = this.getProductHeaderObjects('top');
                const leftObjs = this.getProductHeaderObjects('left');

                topObjs.forEach((o, c) => {
                    const t = o.t;
                    if (t.type === 'x') this.setTokenOrientation(t, 'h');
                    const size = getTileSize(t.type, t.orientation);
                    const x = m.colX(c) + (m.colWidths[c] - size.w) / 2;
                    const y = m.oy + m.toolbarH + (m.topH - size.h) / 2;
                    if (animate && t.element) t.element.classList.add('animating');
                    this.moveToken(t, x, y);
                    if (animate) setTimeout(() => t.element && t.element.classList.remove('animating'), 350);
                });

                leftObjs.forEach((o, r) => {
                    const t = o.t;
                    if (t.type === 'x') this.setTokenOrientation(t, 'v');
                    const size = getTileSize(t.type, t.orientation);
                    const x = m.ox + (m.leftW - size.w) / 2;
                    const y = m.rowY(r) + (m.rowHeights[r] - size.h) / 2;
                    if (animate && t.element) t.element.classList.add('animating');
                    this.moveToken(t, x, y);
                    if (animate) setTimeout(() => t.element && t.element.classList.remove('animating'), 350);
                });

                this.productTokens('cell').forEach(o => {
                    const t = o.t;
                    const spec = this.expectedProductForCell(o.info.row, o.info.col);
                    if (spec && t.type === 'x') this.setTokenOrientation(t, spec.orientation);
                    const size = getTileSize(t.type, t.orientation);
                    const x = m.colX(o.info.col) + (m.colWidths[o.info.col] - size.w) / 2;
                    const y = m.rowY(o.info.row) + (m.rowHeights[o.info.row] - size.h) / 2;
                    if (animate && t.element) t.element.classList.add('animating');
                    this.moveToken(t, x, y);
                    if (animate) setTimeout(() => t.element && t.element.classList.remove('animating'), 350);
                });
            }

            snapTokenToProductFrame(t) {
                if (!this.productFrame || !t || t.pairId !== null) return false;
                if (this.isFlipPending(t)) return false; // parenthèse « − » pas encore retournée
                if (this.productFrame.mode === 'facto') return this.factoPoser(t);
                const info = this.getProductZoneInfo(t);
                if (!info) {
                    if (t.productZone) {
                        this.clearProductPlacement(t);
                        this.reindexProductHeaders('top');
                        this.reindexProductHeaders('left');
                        this.renderProductFrame();
                        this.reflowProductFrameTokens();
                        this.updateEquation();
                        return true;
                    }
                    return false;
                }

                if (info.zone === 'top' || info.zone === 'left') {
                    // Pour l’instant, les facteurs du tableau sont linéaires : x et 1.
                    if (t.type === 'x2') {
                        this.markProductError(t);
                        this.restoreDraggedToken(t);
                        return true;
                    }
                    const zone = info.zone;
                    const others = this.productTokens(zone).map(o => o.t).filter(x => x !== t);
                    this.clearProductPlacement(t);
                    t.productZone = zone;
                    t.productIndex = others.length; // append : x, puis x, puis 1, puis 1...
                    if (t.type === 'x') this.setTokenOrientation(t, zone === 'top' ? 'h' : 'v');
                    this.reindexProductHeaders('top');
                    this.reindexProductHeaders('left');
                    this.renderProductFrame();
                    this.reflowProductFrameTokens();
                    this.updateEquation();
                    return true;
                }

                if (info.zone === 'cell') {
                    const expected = this.expectedProductForCell(info.row, info.col);
                    if (!expected || this.productCellOccupied(info.row, info.col, t) || t.type !== expected.type || t.sign !== expected.sign) {
                        this.markProductError(t);
                        this.restoreDraggedToken(t);
                        return true;
                    }
                    this.clearProductPlacement(t);
                    t.productZone = 'cell';
                    t.productRow = info.row;
                    t.productCol = info.col;
                    if (t.type === 'x') this.setTokenOrientation(t, expected.orientation);
                    this.renderProductFrame();
                    this.reflowProductFrameTokens();
                    this.updateEquation();
                    return true;
                }
                return false;
            }

            tokensToLooseLatex(tokens) {
                if (!tokens || !tokens.length) return "";
                let l = "";
                tokens.filter(t => t.pairId === null).forEach((t, idx) => {
                    const sign = t.sign === -1 ? -1 : 1;
                    const term = t.type === 'x2' ? 'x^2' : (t.type === 'x' ? 'x' : '1');
                    const col = this.getEquationColor(t.type, sign);
                    const plusCol = this.getEquationOperatorColor(1);
                    const cTerm = this.colorLatex(col, term);
                    if (idx === 0) l += (sign === -1 ? this.colorLatex(col, '-') : '') + cTerm;
                    else l += sign === -1 ? `\\;${this.colorLatex(col, '-')}\\;${cTerm}` : `\\;${this.colorLatex(plusCol, '+')}\\;${cTerm}`;
                });
                return l;
            }

            tokensToProductFactorLatex(tokens) {
                // Dans les facteurs du tableau, on respecte l'ordre réel des colonnes/lignes.
                // x | x | 1 devient 2x + 1, mais x | 1 | x reste x + 1 + x.
                // On combine donc seulement les tuiles consécutives de même type et même signe.
                return this.tokensToSeparatedLatex(tokens);
            }

            generateProductFrameLatex() {
                const top = this.productTokens('top').map(o => o.t);
                const left = this.productTokens('left').map(o => o.t);
                const topStr = top.length ? this.tokensToProductFactorLatex(top) : "\\dots";
                const leftStr = left.length ? this.tokensToProductFactorLatex(left) : "\\dots";
                // Tant que le gabarit est présent, on garde le produit sous forme factorisée.
                // Le développement n'apparaît dans l'équation qu'après "Développer sur le plateau".
                const leftSeul = left.length && new Set(left.map(t => `${t.type}:${t.sign}`)).size === 1;
                return leftSeul ? `${leftStr}(${topStr})` : `(${leftStr})(${topStr})`;
            }

            hasFreeExpressionTokens() {
                return this.tokens.some(t => !t.productZone && !t._canceling && t.pairId === null);
            }

            generateExpressionWithProductFrameLatex() {
                const product = this.generateProductFrameLatex();
                if (!this.hasFreeExpressionTokens()) return product;
                const free = this.generateExpressionString('normal', true);
                if (!free || free === "0" || free === "\\dots") return product;
                const plus = this.colorLatex(this.getEquationOperatorColor(1), '+');
                return `${free}\\;${plus}\\;${product}`;
            }

            normalizeProductDevelopmentSpecs(specs) {
                // Quand le tableau est envoyé sur le plateau, on veut une écriture compacte
                // sans faire les annulations : x + x + x -> 3x, mais 3x - 2x reste 3x - 2x.
                // On range donc les tuiles par type et par signe avant de les créer sur le plateau.
                const order = { 'x2:1': 0, 'x2:-1': 1, 'x:1': 2, 'x:-1': 3, 'unit:1': 4, 'unit:-1': 5 };
                return [...specs].map(spec => ({
                    ...spec,
                    // Sur le plateau de réduction, les bandes x sont regroupées plus proprement
                    // en horizontal. La valeur reste bien x, seule l'orientation visuelle change.
                    orientation: spec.type === 'x' ? 'h' : (spec.orientation || 'h')
                })).sort((a, b) => {
                    const ka = `${a.type}:${a.sign}`;
                    const kb = `${b.type}:${b.sign}`;
                    return (order[ka] ?? 99) - (order[kb] ?? 99);
                });
            }

            developProductFrame() {
                if (!this.productFrame) return;
                const cellObjects = this.productTokens('cell');
                if (!cellObjects.length) return;
                this.saveState();
                const f = this.productFrame;
                const m = this.getProductMetrics(f);
                const specs = cellObjects.map(o => ({ type: o.t.type, sign: o.t.sign, orientation: o.t.orientation || 'h' }));
                const cellBounds = cellObjects.reduce((b, o) => {
                    const s = getTileSize(o.t.type, o.t.orientation || 'h');
                    return {
                        minX: Math.min(b.minX, o.t.x),
                        minY: Math.min(b.minY, o.t.y),
                        maxX: Math.max(b.maxX, o.t.x + s.w),
                        maxY: Math.max(b.maxY, o.t.y + s.h)
                    };
                }, { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity });
                const allFrameTokens = ['top', 'left', 'cell'].flatMap(z => this.productTokens(z).map(o => o.t));
                const ids = new Set(allFrameTokens.map(t => t.id));
                allFrameTokens.forEach(t => { if (t.element) t.element.remove(); });
                this.tokens = this.tokens.filter(t => !ids.has(t.id));
                this.steps.forEach(s => s.tokenIds = s.tokenIds.filter(id => !ids.has(id)));
                this.removeProductFrameElement(false);

                this.lastPack = null;
                this.lastSequentialPackId = null;
                this.pendingPackGap = 0;
                this.displayMode = 'normal';
                this.isSubtractingInput = false;
                this.isMultiplyingInput = false;

                // On remplace le tableau par les tuiles développées au niveau exact des cases remplies.
                // Le point de départ est donc le coin haut-gauche des tuiles qui étaient réellement dans le tableau,
                // pas le bas du gabarit complet.
                const startX = Math.max(20, Number.isFinite(cellBounds.minX) ? cellBounds.minX : m.centralX + 8);
                const startY = Math.max(20, Number.isFinite(cellBounds.minY) ? cellBounds.minY : m.centralY + 8);
                const visibleRight = (-this.pan.x + this.boardContainer.clientWidth) / this.scale;
                const maxX = Math.max(startX + 420, visibleRight - 40, f.x + m.width + 180);
                const arrangedSpecs = this.normalizeProductDevelopmentSpecs(specs);
                let x = startX;
                let y = startY;
                let rowH = 0;
                let previousKey = null;
                arrangedSpecs.forEach(spec => {
                    const size = getTileSize(spec.type, spec.orientation || 'h');
                    const key = `${spec.type}:${spec.sign}:${spec.orientation || 'h'}`;
                    const gap = previousKey && previousKey !== key ? PACK_GAP : 2;
                    if (x > startX && x + gap + size.w > maxX) {
                        x = startX;
                        y += rowH + 20;
                        rowH = 0;
                    } else {
                        x += (x > startX ? gap : 0);
                    }
                    this.createTileToken(spec.type, spec.sign, 'manual', x, y, spec.orientation || 'h');
                    x += size.w;
                    rowH = Math.max(rowH, size.h);
                    previousKey = key;
                });
                this.lastPos = { x, y, maxYInRow: rowH };
                this.applyColorMode(false);
                this.updateEquation();
            }

            getOppositeSnapThreshold(token, target) {
                const s1 = getTileSize(token.type, token.orientation);
                const s2 = getTileSize(target.type, target.orientation);
                const minDim = Math.min(s1.w, s1.h, s2.w, s2.h);
                if (token.type === 'unit') return Math.max(18, minDim * 0.78);
                if (token.type === 'x2') return Math.min(48, Math.max(34, minDim * 0.45));
                return Math.min(38, Math.max(22, minDim * 0.85));
            }

            stepIndexOfToken(t) { return this.steps.findIndex(s => s.tokenIds.includes(t.id)); }

            checkSnapAndFinalize(token) {
                if (token?.productZone) return;
                const s1 = getTileSize(token.type, token.orientation);
                const c1 = { x: token.x + s1.w/2, y: token.y + s1.h/2 };
                let best = null;

                // Avant, on prenait la première tuile opposée trouvée dans la liste.
                // Si deux unités étaient côte à côte, le seuil était assez grand pour attraper
                // la voisine au lieu de celle visée. On choisit maintenant la plus proche,
                // avec un seuil adapté à la taille de la tuile.
                for (let t of this.tokens) {
                    if (t === token || t.productZone || t.pairId || t.type !== token.type || t.sign === token.sign) continue;
                    // Une tuile d'une parenthèse « − » pas encore retournée ne s'annule qu'avec une tuile de la MÊME
                    // parenthèse : affichée « x » vert, elle vaut −x, et un x vert du dehors ne doit pas l'effacer.
                    if (this.isFlipPending(t) !== this.isFlipPending(token)) continue;
                    if (this.isFlipPending(t) && this.stepIndexOfToken(t) !== this.stepIndexOfToken(token)) continue;
                    const s2 = getTileSize(t.type, t.orientation);
                    const c2 = { x: t.x + s2.w/2, y: t.y + s2.h/2 };
                    const dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                    const threshold = this.getOppositeSnapThreshold(token, t);
                    if (dist <= threshold && (!best || dist < best.dist)) {
                        best = { t, dist };
                    }
                }

                if (!best) return;

                const t = best.t;
                const s2 = getTileSize(t.type, t.orientation);
                const c2 = { x: t.x + s2.w/2, y: t.y + s2.h/2 };
                playSound('snap');
                const pairCenter = { x: (c1.x + c2.x) / 2, y: (c1.y + c2.y) / 2 };
                // Pour x horizontal + x vertical : pendant l'annulation, on force les deux
                // à l'orientation de la tuile déjà sur le plateau. Au détachement, chacun
                // retrouve son orientation de départ.
                const pairOrientation = token.type === 'x' ? (t.orientation || token.orientation || 'h') : (token.orientation || 'h');
                if (token.type === 'x') {
                    token._preZeroOrientation = token.originalOrientation || token.orientation || 'h';
                    t._preZeroOrientation = t.originalOrientation || t.orientation || 'h';
                    this.setTokenOrientation(token, pairOrientation);
                    this.setTokenOrientation(t, pairOrientation);
                }
                const pairSize = getTileSize(token.type, pairOrientation);
                const mx = pairCenter.x - pairSize.w / 2;
                const my = pairCenter.y - pairSize.h / 2;
                this.moveToken(token, mx, my);
                this.moveToken(t, mx, my);
                token.pairId = t.id;
                t.pairId = token.id;
                token.element.classList.add('is-zero');
                t.element.classList.add('is-zero');
                this.createZeroBadge(`badge-${token.id}-${t.id}`, mx, my, pairSize);
                this.updateEquation();
            }

            saveState() {
                if (this.history.length > 20) this.history.shift();
                const state = {
                    tokens: this.tokens.map(t => ({...t, element: null, classes: [...t.element.classList]})),
                    steps: JSON.parse(JSON.stringify(this.steps)),
                    currentStepIndex: this.currentStepIndex,
                    nextId: this.nextId,
                    nextPackId: this.nextPackId,
                    nextPackOrder: this.nextPackOrder,
                    packMeta: JSON.parse(JSON.stringify(this.packMeta)),
                    lastPack: this.lastPack ? {...this.lastPack} : null,
                    isSubtractingInput: this.isSubtractingInput,
                    isMultiplyingInput: this.isMultiplyingInput,
                    displayMode: this.displayMode,
                    lastPos: {...this.lastPos},
                    lastSequentialPackId: this.lastSequentialPackId,
                    pendingPackGap: this.pendingPackGap,
                    penStrokes: this.clonePenStrokes(),
                    colorMode: this.colorMode,
                    productFrame: this.productFrame ? { x: this.productFrame.x, y: this.productFrame.y, mode: this.productFrame.mode, cible: this.productFrame.cible ? { ...this.productFrame.cible } : undefined, dejaJuste: this.productFrame.dejaJuste } : null
                };
                this.history.push(state);
            }

            undo() {
                if (this.history.length === 0) return;
                const state = this.history.pop();
                this.stopFlip();
                this.fermerBulle();
                
                this.tokens.forEach(t => t.element && t.element.remove());
                document.querySelectorAll('.zero-badge').forEach(b => b.remove());
                this.removeProductFrameElement(false);
                
                this.steps = state.steps;
                this.currentStepIndex = state.currentStepIndex;
                this.nextId = state.nextId;
                this.nextPackId = state.nextPackId;
                this.nextPackOrder = state.nextPackOrder;
                this.packMeta = state.packMeta;
                this.lastPack = state.lastPack;
                this.isSubtractingInput = state.isSubtractingInput;
                this.isMultiplyingInput = state.isMultiplyingInput;
                this.displayMode = state.displayMode;
                this.lastPos = state.lastPos;
                this.lastSequentialPackId = state.lastSequentialPackId;
                this.pendingPackGap = state.pendingPackGap;
                this.penStrokes = state.penStrokes || [];
                this.currentStroke = null;
                this.colorMode = (state.colorMode === 'matignon') ? 'mathigon' : (state.colorMode || 'sign');
                const colorSelect = document.getElementById('color-mode-select');
                if (colorSelect) colorSelect.value = this.colorMode;
                this.redrawPen();
                
                this.tokens = state.tokens.map(data => {
                    const el = document.createElement('div');
                    data.classes.forEach(c => el.classList.add(c));
                    const shown = (data.displaySign === 1 || data.displaySign === -1) ? data.displaySign : data.sign;
                    el.classList.toggle('green', shown === 1); el.classList.toggle('red', shown !== 1);
                    el.innerHTML = `<span style="pointer-events:none;">${getTileLabel(data.type, shown)}</span>`;
                    el.id = `t-${data.id}`;
                    el.style.left = data.x + 'px';
                    el.style.top = data.y + 'px';
                    
                    el.addEventListener('mousedown', (e) => this.handleDragStart(e));
                    el.addEventListener('touchstart', (e) => this.handleDragStart(e), {passive: false});
                    this.boardWorld.appendChild(el);
                    this.styleTileElement(el, data.type, shown);
                    
                    return { ...data, element: el };
                });
                
                const btnClose = document.getElementById('btn-close-parenthesis');
                if (this.isSubtractingInput || this.isMultiplyingInput) btnClose.classList.remove('hidden'); else btnClose.classList.add('hidden');
                
                this.checkOppositeAvailable();
                this.productFrame = state.productFrame ? { ...state.productFrame, element: null } : null;
                if (this.productFrame) { this.renderProductFrame(); this.reflowProductFrameTokens(); }
                this.applyColorMode(false);
                this.updateEquation();
            }

            initListeners() {
                this.boardContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    // Zoom vers le curseur (ancre sous la souris)
                    const r = this.boardContainer.getBoundingClientRect();
                    const localX = e.clientX - r.left;
                    const localY = e.clientY - r.top;

                    const worldX = (localX - this.pan.x) / this.scale;
                    const worldY = (localY - this.pan.y) / this.scale;

                    const delta = -e.deltaY * 0.001;
                    const newScale = Math.min(Math.max(MIN_SCALE, this.scale + delta), MAX_SCALE);
                    this.viewTouched = true;

                    this.pan.x = localX - worldX * newScale;
                    this.pan.y = localY - worldY * newScale;
                    this.scale = newScale;

                    this.updateTransform();
                    this.redrawPen();
                }, { passive: false });
                this.boardContainer.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    if (this.currentTool === 'pen' || e.target.closest('.token') || e.target.closest('.product-frame')) return;
                    this.isPanning = true; this.viewTouched = true;
                    this.panStart = { x: e.clientX - this.pan.x, y: e.clientY - this.pan.y };
                    this.boardContainer.classList.add('panning');
                });
                window.addEventListener('mousemove', (e) => {
                    this.moveCursor(e);
                    if (this.isPanning) {
                        this.pan.x = e.clientX - this.panStart.x;
                        this.pan.y = e.clientY - this.panStart.y;
                        this.updateTransform();
                    }
                });
                window.addEventListener('mouseup', () => {
                    this.isPanning = false;
                    this.boardContainer.classList.remove('panning');
                });
                // --- TACTILE : glisser le plateau à un doigt sur le fond, pincer pour zoomer ---
                // Avant, seuls la souris et la molette bougeaient la vue : au doigt, rien.
                // Une tuile touchée garde son propre glisser (handleDragStart arrête l'événement) ;
                // ici on ne reçoit donc que les doigts posés sur le fond du plateau.
                // Pas de geste de vue en mode stylo : le doigt y dessine.
                this.boardContainer.addEventListener('touchstart', (e) => this.handleBoardTouch(e), { passive: false });
                this.boardContainer.addEventListener('touchmove', (e) => this.handleBoardTouch(e), { passive: false });
                this.boardContainer.addEventListener('touchend', (e) => this.handleBoardTouch(e), { passive: false });
                this.boardContainer.addEventListener('touchcancel', (e) => this.handleBoardTouch(e), { passive: false });

                // Le stylo utilise uniquement Pointer Events : moins de doubles événements souris/stylet.
                
                // --- Support stylet (Pointer Events) : essentiel sur Windows/tablettes ---
                this.boardContainer.addEventListener('pointerdown', (e) => {
                    if (this.currentTool !== 'pen') return;
                    // Empêche le scroll/ink et évite le double déclenchement souris
                    e.preventDefault();
                    this.ignoreMouse = true;
                    setTimeout(() => { this.ignoreMouse = false; }, 60);

                    this.activePointerId = e.pointerId;
                    try { this.boardContainer.setPointerCapture(e.pointerId); } catch (err) {}

                    this.startDraw(e);
                }, { passive: false });

                window.addEventListener('pointermove', (e) => {
                    if (this.currentTool === 'pen') this.moveCursor(e);
                    if (!this.isDrawing || this.currentTool !== 'pen') return;
                    if (this.activePointerId !== null && e.pointerId !== this.activePointerId) return;
                    e.preventDefault();
                    // Lot 8 : tous les points reçus depuis la dernière image (souris rapide, stylet), pas seulement le dernier.
                    const lot = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [];
                    this.draw(lot.length ? lot : [e]);
                }, { passive: false });

                const stopPointerDraw = (e) => {
                    if (this.activePointerId === null) return;
                    if (e.pointerId !== this.activePointerId) return;
                    this.activePointerId = null;
                    this.isDrawing = false;
                    this.currentStroke = null;
                    this.redrawPen(); // le dernier demi-bout du trait, et la même courbe que plus tard
                    try { this.boardContainer.releasePointerCapture(e.pointerId); } catch (err) {}
                };
                window.addEventListener('pointerup', stopPointerDraw);
                window.addEventListener('pointercancel', stopPointerDraw);

                const colorSelect = document.getElementById('color-mode-select');
                if (colorSelect) colorSelect.addEventListener('input', () => this.applyColorMode(false));
                window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.currentTool !== 'hand') this.setTool('hand'); });
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                    // Rotation du téléphone, plein écran… : tant que la vue n'a pas été touchée,
                    // on garde le zoom de départ adapté au nouveau plateau.
                    if (!this.viewTouched) { const s = this.getInitialScale(); if (s !== this.scale) { this.scale = s; this.updateTransform(); this.redrawPen(); } }
                });
            }

            // Doigts posés sur le FOND du plateau (pas sur une tuile ni sur le tableau produit).
            handleBoardTouch(e) {
                const fingers = [...e.touches].filter(t => {
                    const el = t.target && t.target.closest ? t.target : null;
                    return !(el && (el.closest('.token') || el.closest('.product-frame')));
                });
                if (e.type === 'touchstart') {
                    if (this.currentTool === 'pen' || this.draggedToken) { this.touchView = null; return; }
                    if (!fingers.length) return;
                }
                if (!this.touchView && e.type !== 'touchstart') return;
                if (this.currentTool === 'pen' || this.draggedToken) { this.touchView = null; return; }
                e.preventDefault();
                const r = this.boardContainer.getBoundingClientRect();
                const local = (t) => ({ x: t.clientX - r.left, y: t.clientY - r.top });
                if (!fingers.length) { this.touchView = null; this.redrawPen(); return; }
                if (fingers.length === 1) {
                    const p = local(fingers[0]);
                    if (e.type !== 'touchmove' || !this.touchView || this.touchView.mode !== 'pan' || this.touchView.id !== fingers[0].identifier) {
                        // départ (ou retour à un seul doigt après un pincement) : on repart d'ici
                        this.touchView = { mode: 'pan', id: fingers[0].identifier, start: p, pan0: { ...this.pan } };
                        return;
                    }
                    this.pan.x = this.touchView.pan0.x + (p.x - this.touchView.start.x);
                    this.pan.y = this.touchView.pan0.y + (p.y - this.touchView.start.y);
                    this.viewTouched = true;
                    this.updateTransform();
                    return;
                }
                const a = local(fingers[0]), b = local(fingers[1]);
                const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                const dist = Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
                const ids = fingers[0].identifier + ':' + fingers[1].identifier;
                if (!this.touchView || this.touchView.mode !== 'pinch' || this.touchView.ids !== ids) {
                    this.touchView = {
                        mode: 'pinch', ids, dist0: dist, scale0: this.scale,
                        world: { x: (mid.x - this.pan.x) / this.scale, y: (mid.y - this.pan.y) / this.scale }
                    };
                    return;
                }
                // Le point du plateau qui était sous les deux doigts y reste : on zoome et on glisse en même temps.
                const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, this.touchView.scale0 * dist / this.touchView.dist0));
                this.scale = s;
                this.pan.x = mid.x - this.touchView.world.x * s;
                this.pan.y = mid.y - this.touchView.world.y * s;
                this.viewTouched = true;
                this.updateTransform();
            }

            updateTransform() {
                this.boardWorld.style.transform = `translate(${this.pan.x}px, ${this.pan.y}px) scale(${this.scale})`;
                // Lot 8 : la toile du stylo est à la taille de l'écran ; elle suit la vue en redessinant ses traits.
                if (this.ctx) this.redrawPen();
                this.fermerBulle();
            }
            getWorldPos(cx, cy) {
                const r = this.boardContainer.getBoundingClientRect();
                return { x: (cx - r.left - this.pan.x) / this.scale, y: (cy - r.top - this.pan.y) / this.scale };
            }

            // --- VUE / OUTILS (petites actions sans risque) ---
            getInitialScale() {
                const w = this.boardContainer ? this.boardContainer.clientWidth : 0;
                const h = this.boardContainer ? this.boardContainer.clientHeight : 0;
                if (!w || !h) return INITIAL_SCALE;
                const fit = Math.min(w / INITIAL_VIEW_WORLD, h / INITIAL_VIEW_WORLD_H);
                return Math.round(Math.min(INITIAL_SCALE, Math.max(MIN_SCALE, fit)) * 100) / 100;
            }

            resetView() {
                this.scale = this.getInitialScale();
                this.pan = { x: 0, y: 0 };
                this.viewTouched = false;
                this.updateTransform();
                this.redrawPen();
            }

            toggleSound() {
                soundEnabled = !soundEnabled;
                // Création du contexte seulement si on réactive
                if (soundEnabled) ensureAudioCtx();
                this.updateSoundButton();
            }

            updateSoundButton() {
                const onIcon = document.getElementById('icon-sound-on');
                const offIcon = document.getElementById('icon-sound-off');
                const btn = document.getElementById('btn-sound');
                if (!onIcon || !offIcon || !btn) return;
                const isOn = !!soundEnabled;
                onIcon.classList.toggle('hidden', !isOn);
                offIcon.classList.toggle('hidden', isOn);
                btn.title = isOn ? 'Son : activé' : 'Son : coupé';
            }

            toggleFullscreen() {
                const doc = document;
                if (!doc.fullscreenElement) {
                    let p = null;
                    if (document.documentElement.requestFullscreen) {
                        try { p = document.documentElement.requestFullscreen({ navigationUI: 'hide' }); }
                        catch (e) { p = document.documentElement.requestFullscreen(); }
                    }
                    else if (document.body.requestFullscreen) p = document.body.requestFullscreen();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                } else {
                    const p = doc.exitFullscreen ? doc.exitFullscreen() : null;
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                }
            }

            updateFullscreenButton() {
                const enterIcon = document.getElementById('icon-fs-enter');
                const exitIcon = document.getElementById('icon-fs-exit');
                const btn = document.getElementById('btn-fullscreen');
                if (!enterIcon || !exitIcon || !btn) return;
                const isFs = !!document.fullscreenElement;
                enterIcon.classList.toggle('hidden', isFs);
                exitIcon.classList.toggle('hidden', !isFs);
                btn.title = isFs ? 'Quitter le plein écran' : 'Plein écran';
            }
            updateToolButtons() {
                // Lot 8 : un seul outil à allumer, le stylo (la main est l'état normal, sans bouton).
                const penBtn = document.getElementById('tool-pen');
                if (!penBtn) return;
                const on = this.currentTool === 'pen';
                penBtn.classList.toggle('bg-white', on); penBtn.classList.toggle('shadow', on);
                penBtn.classList.toggle('text-gray-700', on); penBtn.classList.toggle('text-gray-500', !on);
                penBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }

            // --- STYLO (undo + persistance après resize) ---
            clonePenStrokes() {
                try {
                    if (typeof structuredClone === 'function') return structuredClone(this.penStrokes);
                    return JSON.parse(JSON.stringify(this.penStrokes));
                } catch (e) {
                    return [];
                }
            }

            getPenWorldWidth() {
                // Épaisseur en coordonnées de plateau : à l'écran, le trait garde PEN_SCREEN_WIDTH quel que soit le zoom.
                return PEN_SCREEN_WIDTH / Math.max(this.scale || 1, 0.5);
            }

            // Lot 8 : la toile couvre l'écran ; on y dessine en coordonnées de plateau (pan + zoom de la vue).
            applyPenTransform() {
                const d = this.canvasPixelRatio || 1;
                this.ctx.setTransform(d * this.scale, 0, 0, d * this.scale, d * this.pan.x, d * this.pan.y);
            }

            clearPenCanvas() {
                this.ctx.save();
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.restore();
            }

            // Un trait passe par les milieux de ses points (courbes) : l'écriture est arrondie, pas en zigzag.
            tracerTrait(pts) {
                const c = this.ctx;
                if (pts.length === 1) { c.beginPath(); c.arc(pts[0].x, pts[0].y, c.lineWidth / 2, 0, Math.PI * 2); c.fillStyle = c.strokeStyle; c.fill(); return; }
                c.beginPath();
                c.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length - 1; i++) {
                    const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
                    c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
                }
                const z = pts[pts.length - 1];
                c.lineTo(z.x, z.y);
                c.stroke();
            }

            redrawPen() {
                if (!this.ctx) return;
                this.clearPenCanvas();
                if (!this.penStrokes || this.penStrokes.length === 0) return;
                this.applyPenTransform();
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                for (const stroke of this.penStrokes) {
                    const pts = stroke.points || [];
                    if (!pts.length) continue;
                    this.ctx.strokeStyle = stroke.color || '#2563eb';
                    this.ctx.lineWidth = (stroke.screenWidth || PEN_SCREEN_WIDTH) / Math.max(this.scale || 1, 0.5);
                    this.tracerTrait(pts);
                }
            }

            addTile(type, sign, x = null, y = null, withSound = true, orientation = 'h') {
                this.saveState();
                if(this.displayMode !== 'normal') { this.displayMode = 'normal'; this.isReduced = false; }
                if (withSound) playSound('pop'); // Son joué lors de l'ajout réel (drop ou clic)
                this.createTileToken(type, sign, (x!==null)?'manual':'auto', x, y, orientation);
                this.updateEquation();
            }

            createTileToken(type, sign, placementMode, customX=null, customY=null, orientation='h') {
                let tileSign = sign;
                let step = this.steps[this.currentStepIndex];
                
                if (this.isSubtractingInput && step.type === 'subtraction' && !step.oppositeApplied) tileSign = -sign;
                if (this.isMultiplyingInput && step.operator === '-') tileSign = -sign;

                // FIX 1: Allow manual placement to reuse the last pack if types match
                let pid;
                const lp = this.lastPack;
                // Un x horizontal et un x vertical représentent la même valeur algébrique.
                // On les autorise donc à appartenir au même paquet si on les pose à la suite.
                const sameOrientationOrSameX = type === 'x' || (lp && (lp.orientation || 'h') === orientation);
                const canReusePack = lp && lp.type === type && lp.sign === tileSign && sameOrientationOrSameX && lp.stepIndex === this.currentStepIndex;

                if (placementMode === 'auto') {
                    if (canReusePack) {
                        pid = lp.packId;
                    } else {
                        pid = this.nextPackId++;
                        this.packMeta[pid] = { order: this.nextPackOrder++ };
                        this.lastPack = { packId: pid, type, sign: tileSign, orientation, stepIndex: this.currentStepIndex };
                    }
                } else {
                    // Manual placement
                    if (canReusePack) {
                        pid = lp.packId;
                    } else {
                        pid = this.nextPackId++;
                        this.packMeta[pid] = { order: this.nextPackOrder++ };
                        // Update lastPack so subsequent drags/clicks group with this one
                        this.lastPack = { packId: pid, type, sign: tileSign, orientation, stepIndex: this.currentStepIndex };
                    }
                }

                const id = this.nextId++;
                const el = document.createElement('div');
                // Affichée telle qu'on la tape (sign), même dans une parenthèse « − » : c'est « Ajouter l'opposé »
                // qui la retourne. Avant, elle arrivait déjà retournée (x tapé → −x rouge) et seul le texte changeait.
                const colorClass = sign === 1 ? 'green' : 'red';
                el.classList.add('token', colorClass, `type-${type}`);
                if (type === 'x' && orientation === 'v') el.classList.add('orient-v');
                
                if (this.isSubtractingInput) el.classList.add('in-bracket');
                if ((this.isMultiplyingInput && !step.distributed)) el.classList.add('pending-mult');

                let label = getTileLabel(type, sign);
                el.innerHTML = `<span style="pointer-events:none;">${label}</span>`;
                this.styleTileElement(el, type, sign);
                el.id = `t-${id}`;

                let pos;
                if (placementMode === 'manual' && customX !== null) {
                    pos = { x: customX, y: customY };
                } else {
                    // Logic to add gap if pack changed
                    let gap = 0;
                    if (this.pendingPackGap > 0) {
                        gap = this.pendingPackGap;
                        this.pendingPackGap = 0;
                    } else if (this.lastSequentialPackId !== null && pid !== this.lastSequentialPackId) {
                        gap = PACK_GAP;
                    }
                    const size = getTileSize(type, orientation);
                    pos = this.getSequentialPosition(size.w, size.h, gap);
                }

                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                
                el.addEventListener('mousedown', (e) => this.handleDragStart(e));
                el.addEventListener('touchstart', (e) => this.handleDragStart(e), {passive: false});
                this.boardWorld.appendChild(el);

                const tokenObj = {
                    id, type, orientation, originalOrientation: orientation, sign: tileSign, displaySign: sign, element: el, x: pos.x, y: pos.y,
                    pairId: null, packId: pid, ghostIds: []
                };
                this.tokens.push(tokenObj);

                this.steps[this.currentStepIndex].tokenIds.push(id);
                
                // Update sequential pack tracking for both auto and manual
                this.lastSequentialPackId = pid;

                if (this.isMultiplyingInput && step.type === 'multiplication' && step.factor > 1) {
                    const strideH = SIZES['x2'].h + 20;
                    for(let i=1; i<step.factor; i++) {
                        const gid = this.nextId++;
                        const gel = el.cloneNode(true);
                        gel.id = `t-${gid}`;
                        const gpos = { x: pos.x, y: pos.y + i * strideH };
                        gel.style.top = gpos.y + 'px';
                        gel.addEventListener('mousedown', (e) => this.handleDragStart(e));
                        gel.addEventListener('touchstart', (e) => this.handleDragStart(e), {passive: false});
                        this.boardWorld.appendChild(gel);
                        // FIX: Assign correct packId to ghosts (same as master) to fix "Order" grouping
                        const gToken = { id: gid, type, orientation, originalOrientation: orientation, sign: tileSign, displaySign: sign, element: gel, x: gpos.x, y: gpos.y, pairId: null, packId: pid, ghostIds: [] };
                        this.tokens.push(gToken);
                        tokenObj.ghostIds.push(gid);
                    }
                }
            }

            getSequentialPosition(w, h, gap = 0) {
                const padding = 2; // tight spacing inside pack
                const viewW = this.boardContainer.clientWidth / this.scale;
                const wrapLimit = viewW - 50; 

                this.lastPos.x += gap;

                if (this.lastPos.x + w + padding > wrapLimit) {
                    this.lastPos.x = 40;
                    this.lastPos.y += this.lastPos.maxYInRow + 20;
                    this.lastPos.maxYInRow = 0;
                }
                const x = this.lastPos.x;
                const y = this.lastPos.y; 
                this.lastPos.x += w + padding;
                if (h > this.lastPos.maxYInRow) this.lastPos.maxYInRow = h;
                return {x, y};
            }

            // Bouton « + » : commence un nouveau groupe de tuiles.
            // Avant, il ne faisait qu'un espace sur le plateau : l'équation recollait les tuiles
            // de même sorte (3x² puis + puis x² s'écrivait 4x²). Désormais, hors parenthèse,
            // il ouvre une nouvelle étape « + » : l'équation affiche « 3x² + … » tout de suite,
            // puis « 3x² + x² ». Dans une parenthèse ouverte, il sépare les groupes de la parenthèse.
            separatePack() {
                const cur = this.steps[this.currentStepIndex];
                const curHasTokens = !!cur && cur.tokenIds.some(id => this.tokens.some(t => t.id === id));
                const anyToken = this.tokens.length > 0;
                if (!this.isSubtractingInput && !this.isMultiplyingInput) {
                    if (!anyToken) return; // rien encore sur le plateau : un « + » ne veut rien dire
                    if (cur && cur.plusStep && !cur.implicit && !curHasTokens) return; // déjà « + … »
                }
                this.saveState(); playSound('pop');
                this.lastPack = null; this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
                if (this.isSubtractingInput || this.isMultiplyingInput) { this.updateEquation(); return; }
                if (cur && cur.implicit && !curHasTokens) {
                    cur.implicit = false; // juste après une parenthèse fermée : on garde cette étape
                } else {
                    this.steps.push({ id: this.steps.length, operator: '+', type: 'simple', plusStep: true, implicit: false, tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false });
                    this.currentStepIndex = this.steps.length - 1;
                }
                this.updateEquation();
            }
            setOperator(op) { 
                this.saveState();
                if(this.isSubtractingInput) return; 
                this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
                this.steps.push({id:this.steps.length, operator:'-', type:'subtraction', tokenIds:[], factor:1, oppositeApplied:false, distributed:false, isClosed:false});
                this.currentStepIndex++; this.isSubtractingInput = true;
                document.getElementById('btn-close-parenthesis').classList.remove('hidden');
                this.updateEquation();
            }
            closeParenthesis() { 
                this.saveState();
                const s = this.steps[this.currentStepIndex];
                if(this.isSubtractingInput) { this.isSubtractingInput=false; s.isClosed=true; document.getElementById('btn-close-parenthesis').classList.add('hidden'); this.checkOppositeAvailable(); }
                else if(this.isMultiplyingInput) { s.isClosed=true; this.isMultiplyingInput=false; document.getElementById('btn-close-parenthesis').classList.add('hidden'); }
                // Après la parenthèse fermée, les tuiles suivantes vont APRÈS elle.
                // Avant, elles restaient comptées dans la parenthèse : x − (x + 1), puis une tuile 1,
                // s'écrivait x − (x + 2) alors que le plateau valait 0. Cette étape ne s'affiche
                // (« + 1 », « − x ») qu'une fois une tuile posée.
                this.steps.push({ id: this.steps.length, operator: '+', type: 'simple', plusStep: true, implicit: true, tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false });
                this.currentStepIndex = this.steps.length - 1;
                this.lastPack = null;
                this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
                this.updateEquation();
            }
            checkOppositeAvailable() { 
                const has = this.steps.some(s=>s.type==='subtraction'&&!s.oppositeApplied); 
                const btn=document.getElementById('btn-opposite'); if(has)btn.classList.remove('hidden'); else btn.classList.add('hidden');
            }
            applyOpposite() {
                if (this.flippingSteps.size) return; // un retournement est déjà en cours
                const p = this.steps.filter(s=>s.type==='subtraction'&&!s.oppositeApplied);
                if(!p.length) return;
                this.saveState();
                this.flipPendingBrackets();
            }

            // Ferme la parenthèse « − » encore ouverte, sans l'enregistrer dans l'historique
            // (l'appelant l'a déjà fait). Sert à « Ordonner » et « Réduire ».
            closeOpenSubtraction() {
                if (!this.isSubtractingInput) return;
                const s = this.steps[this.currentStepIndex];
                this.isSubtractingInput = false; if (s) s.isClosed = true;
                document.getElementById('btn-close-parenthesis').classList.add('hidden');
                this.steps.push({ id: this.steps.length, operator: '+', type: 'simple', plusStep: true, implicit: true, tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false });
                this.currentStepIndex = this.steps.length - 1;
                this.lastPack = null;
                this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
            }

            // « Ajouter l'opposé » : chaque tuile des parenthèses « − » se retourne, une à une.
            // Les données changent tout de suite (signe affiché = signe réel) ; seul le dessin suit, tuile
            // par tuile, puis l'équation et le cadre pointillé à la fin. Renvoie la durée totale en ms.
            // Avant : les tuiles étaient déjà retournées à la pose, seul le texte de l'équation changeait.
            flipPendingBrackets(after = null) {
                const steps = this.steps.filter(s => s.type === 'subtraction' && !s.oppositeApplied);
                if (!steps.length) { if (after) after(); return 0; }
                this.closeOpenSubtraction();
                const run = ++this.flipRun;
                const toFlip = [];
                steps.forEach(s => {
                    this.flippingSteps.add(s.id);
                    const toks = s.tokenIds.map(id => this.tokens.find(t => t.id === id)).filter(Boolean);
                    // de gauche à droite, ligne par ligne, comme on lit
                    toks.sort((a, b) => (Math.round(a.y / 40) - Math.round(b.y / 40)) || (a.x - b.x) || (a.id - b.id));
                    toks.forEach(t => {
                        if (this.isFlipPending(t)) { this.flipShown.set(t.id, t.displaySign); toFlip.push(t); }
                        t.displaySign = t.sign;
                    });
                    s.oppositeApplied = true;
                });
                document.getElementById('btn-opposite').classList.add('hidden');
                const stagger = toFlip.length > 8 ? Math.max(90, Math.round(1840 / toFlip.length)) : FLIP_STAGGER_MS;
                toFlip.forEach((t, i) => setTimeout(() => { if (run === this.flipRun) this.flipTileVisual(t, run); }, i * stagger));
                const total = toFlip.length ? (toFlip.length - 1) * stagger + 2 * FLIP_HALF_MS + 60 : 0;
                this.flipTimer = setTimeout(() => {
                    if (run !== this.flipRun) return;
                    this.flippingSteps.clear(); this.flipShown.clear();
                    this.tokens.forEach(t => { if (t.element && !this.isFlipPending(t)) t.element.classList.remove('in-bracket'); });
                    this.checkOppositeAvailable();
                    if (after) after(); else this.updateEquation();
                }, total);
                return total;
            }

            flipTileVisual(t, run) {
                const el = t.element; if (!el || !el.isConnected) return;
                playSound('flip');
                const base = el.style.transform && el.style.transform !== 'none' ? el.style.transform + ' ' : '';
                const origin = el.style.transformOrigin;
                el.style.transformOrigin = '50% 50%';
                el.classList.add('flipping');
                const half = (from, to, easing) => el.animate(
                    [{ transform: `${base}perspective(500px) rotateY(${from}deg)` }, { transform: `${base}perspective(500px) rotateY(${to}deg)` }],
                    { duration: FLIP_HALF_MS, easing, fill: 'forwards' });
                const a1 = half(0, 90, 'ease-in');
                a1.onfinish = () => {
                    if (run !== this.flipRun) { a1.cancel(); el.style.transformOrigin = origin; el.classList.remove('flipping'); return; }
                    this.flipShown.delete(t.id);
                    this.paintToken(t);
                    el.classList.remove('in-bracket');
                    a1.cancel();
                    const a2 = half(-90, 0, 'ease-out');
                    a2.onfinish = () => { a2.cancel(); el.style.transformOrigin = origin; el.classList.remove('flipping'); };
                };
            }

            // « Précédent » ou « Tout recommencer » pendant un retournement : on l'arrête net.
            stopFlip() {
                this.flipRun++;
                if (this.flipTimer) clearTimeout(this.flipTimer);
                this.flipTimer = null;
                this.flipShown.clear(); this.flippingSteps.clear();
            }

            // Cadre pointillé autour des tuiles de chaque parenthèse « − » pas encore retournée.
            renderBracketFrames() {
                const steps = this.steps.filter(s => s.type === 'subtraction' && (!s.oppositeApplied || this.flippingSteps.has(s.id)));
                const keep = new Set();
                steps.forEach(s => {
                    const toks = s.tokenIds.map(id => this.tokens.find(t => t.id === id)).filter(t => t && t.element && !t.productZone);
                    if (!toks.length) return;
                    const b = this.getTokenBounds(toks);
                    const pad = 7;
                    const fid = `bracket-frame-${s.id}`;
                    keep.add(fid);
                    let el = document.getElementById(fid);
                    if (!el) {
                        el = document.createElement('div');
                        el.id = fid; el.className = 'bracket-frame';
                        el.setAttribute('aria-hidden', 'true');
                        this.boardWorld.appendChild(el);
                    }
                    el.classList.toggle('dragging-follow', !!this.draggedToken);
                    el.style.left = (b.minX - pad) + 'px'; el.style.top = (b.minY - pad) + 'px';
                    el.style.width = (b.width + 2 * pad) + 'px'; el.style.height = (b.height + 2 * pad) + 'px';
                });
                this.boardWorld.querySelectorAll('.bracket-frame').forEach(el => { if (!keep.has(el.id)) el.remove(); });
            }
            startMultiplication(f) { 
                this.saveState();
                const cur = this.steps[this.currentStepIndex];
                if (this.isSubtractingInput && cur.type==='subtraction' && cur.tokenIds.length===0) {
                    cur.type='multiplication'; cur.factor=f; this.isSubtractingInput=false; this.isMultiplyingInput=true;
                    document.getElementById('btn-close-parenthesis').classList.remove('hidden');
                    this.updateEquation(); return;
                }
                if(this.isSubtractingInput||this.isMultiplyingInput)return;
                this.steps.push({id:this.steps.length, operator:'+', type:'multiplication', tokenIds:[], factor:f, distributed:false, isClosed:false});
                this.currentStepIndex = this.steps.length-1; this.isMultiplyingInput=true;
                document.getElementById('btn-close-parenthesis').classList.remove('hidden');
                this.updateEquation();
            }
            applyDistribution() {
                this.saveState();
                const step = this.steps.find(s=>s.type==='multiplication'&&!s.distributed&&s.isClosed);
                if(!step) return;
                const masters = step.tokenIds.map(id=>this.tokens.find(t=>t.id===id)).filter(Boolean);
                if(step.operator==='-') step.operator='+';
                
                masters.forEach(t=>{
                    // FIX: Ensure master displays its true sign now that brackets are gone
                    t.displaySign = t.sign;
                    
                    t.ghostIds.forEach(gid=>{ 
                        const g=this.tokens.find(tk=>tk.id===gid); 
                        if(g){ 
                            step.tokenIds.push(gid); 
                            g.element.classList.remove('pending-mult'); 
                            // FIX: Ensure ghost displays true sign
                            g.displaySign = g.sign;
                        } 
                    });
                    t.ghostIds=[]; t.element.classList.remove('pending-mult');
                });
                step.distributed=true; document.getElementById('btn-distribute').classList.add('hidden');
                this.reflowBoardSequential(); this.updateEquation();
            }
            
            reflowBoardSequential() {
                this.lastPos = { x: 40, y: 60, maxYInRow: 0 };
                this.lastSequentialPackId = null; // Reset for reflow tracking
                
                this.steps.forEach((step, idx) => {
                    const toks = step.tokenIds.map(id=>this.tokens.find(t=>t.id===id)).filter(Boolean);
                    if(!toks.length) return;
                    
                    // FIX: Replaced custom layout logic with getSequentialPosition to ensure wrapping works
                    if(step.type==='multiplication'&&step.distributed) {
                        // FIX: Sort by ID to preserve chronological input order (e.g. 1, 1, x2, x2)
                        // instead of grouping by type.
                        toks.sort((a,b) => a.id - b.id);
                        
                        // Add gap before distributed block
                        if (idx > 0 && this.lastPos.x > 40) this.lastPos.x += PACK_GAP;

                        let localLastPackId = null;

                        toks.forEach(t => {
                            // FIX: Add gap if pack ID changes to separate groups visually
                            let gap = 0;
                            if (localLastPackId !== null && t.packId !== localLastPackId) {
                                gap = PACK_GAP;
                            }

                            const size = getTileSize(t.type, t.orientation);
                            const pos = this.getSequentialPosition(size.w, size.h, gap);
                            
                            t.element.classList.add('animating'); 
                            this.moveToken(t, pos.x, pos.y); 
                            setTimeout(()=>t.element.classList.remove('animating'),500); 
                            
                            localLastPackId = t.packId;
                        });
                    } else {
                        // Standard sequential reflow
                        if(idx>0 && this.lastPos.x>40) this.lastPos.x+=PACK_GAP;
                        let localLastPackId = null;
                        
                        toks.forEach(t=>{
                            let gap = 0;
                            // Check for pack changes within the step
                            if (localLastPackId !== null && t.packId !== localLastPackId) {
                                gap = PACK_GAP;
                            }
                            const size = getTileSize(t.type, t.orientation);
                            const pos = this.getSequentialPosition(size.w, size.h, gap);
                            t.element.classList.add('animating'); this.moveToken(t, pos.x, pos.y); setTimeout(()=>t.element.classList.remove('animating'),500);
                            localLastPackId = t.packId;
                        });
                    }
                });
            }

            // Une parenthèse « − » pas encore retournée : Ordonner et Réduire jouent d'abord « Ajouter l'opposé »
            // (choix du 06/11/2026), puis rangent. x − (x + 1) devient x − x − 1.
            orderAll() {
                if (this.flippingSteps.size) return;
                this.saveState(); playSound('pop');
                this.flipPendingBrackets(() => { this.displayMode='ordered'; this.isReduced=false; this.organizeBoard(false); this.updateEquation(); });
            }
            reduceExpression() {
                if (this.flippingSteps.size) return;
                this.saveState(); playSound('magic');
                this.flipPendingBrackets(() => { this.displayMode='reduced'; this.isReduced=true; this.organizeBoard(true); this.updateEquation(); });
            }
            
            organizeBoard(reduced) {
                const subset = (this.productFrame ? this.tokens.filter(t => !t.productZone) : this.tokens)
                    .filter(t => t.pairId === null && !t._canceling && t.element);
                if (!subset.length) return;

                // Avant, Ordonner/Réduire repartait toujours en haut à gauche du monde (20, 60).
                // Après un développement sous un tableau produit, cela donnait l'impression que les tuiles
                // partaient à l'autre bout du plateau. On conserve maintenant l'ancrage du paquet courant.
                const bounds = this.getTokenBounds(subset);
                const margin = 8;
                const startX = Math.max(20, bounds.minX - margin);
                const startY = Math.max(20, bounds.minY - margin);
                const visibleRight = (-this.pan.x + this.boardContainer.clientWidth) / this.scale;
                const naturalRight = startX + Math.max(420, this.boardContainer.clientWidth / this.scale - 80);
                const limitX = Math.max(startX + 260, visibleRight - 20, naturalRight);

                this.organizeSubset(subset, startX, startY, limitX, reduced);
            }

            getTokenBounds(tokens) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                tokens.forEach(t => {
                    const size = getTileSize(t.type, t.orientation);
                    minX = Math.min(minX, t.x);
                    minY = Math.min(minY, t.y);
                    maxX = Math.max(maxX, t.x + size.w);
                    maxY = Math.max(maxY, t.y + size.h);
                });
                return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
            }
            
            organizeSubset(subset, startX, startY, limitX, reduced) {
                const rows = [{type:'x2',s:1},{type:'x2',s:-1},{type:'x',s:1},{type:'x',s:-1},{type:'unit',s:1},{type:'unit',s:-1}];
                let y = startY;
                rows.forEach(r => {
                    const eligible = subset.filter(t => t.type===r.type && t.sign===r.s && t.pairId===null);
                    if(!eligible.length) return;

                    // Group by packs to preserve spacing in "Order" mode
                    let packs = [];
                    if (reduced) {
                        packs = [eligible]; // One big pack per type/sign
                    } else {
                        const map = new Map();
                        eligible.forEach(t => {
                            const pid = (typeof t.packId !== 'undefined') ? t.packId : -1;
                            if(!map.has(pid)) map.set(pid, []);
                            map.get(pid).push(t);
                        });
                        // Sort packs by packMeta order to keep chronological input order
                        const sortedPids = Array.from(map.keys()).sort((a,b) => {
                            const oa = this.packMeta[a]?.order ?? a;
                            const ob = this.packMeta[b]?.order ?? b;
                            return oa - ob;
                        });
                        packs = sortedPids.map(pid => map.get(pid));
                    }

                    let cx = startX; 
                    let rowH = 0;
                    
                    packs.forEach(pack => {
                        pack.forEach(t => {
                            const s = getTileSize(t.type, t.orientation);
                            if(cx + s.w > limitX) { 
                                cx = startX; 
                                y += rowH + (reduced?10:18); 
                                rowH = 0; 
                            }
                            t.element.classList.add('animating'); 
                            this.moveToken(t, cx, y); 
                            setTimeout(()=>t.element.classList.remove('animating'), 500);
                            cx += s.w + 2; 
                            rowH = Math.max(rowH, s.h);
                        });
                        if (!reduced) cx += 25; // Add visual gap between packs
                    });
                    
                    y += rowH + (reduced?18:18);
                });
            }

            moveToken(t,x,y) { t.x=x; t.y=y; t.element.style.left=x+'px'; t.element.style.top=y+'px'; }

            autoSimplify() { if(this._autoSimplifyActive)return; this.saveState(); this._autoSimplifyActive=true; if(this._timer) clearTimeout(this._timer); playSound('whoosh'); this.runSimplify(); }
            runSimplify() {
                const pairs = [];
                
                // FIX 3: Collect existing manual pairs (is-zero) first
                const processedManual = new Set();
                this.tokens.filter(t => t.pairId !== null && !t._canceling).forEach(t => {
                    if (processedManual.has(t.id)) return;
                    const partner = this.tokens.find(p => p.id === t.pairId);
                    if (partner && !partner._canceling) {
                        pairs.push([t, partner]);
                        processedManual.add(t.id);
                        processedManual.add(partner.id);
                    }
                });

                // Then find new pairs among available tokens
                const available = this.tokens.filter(t=>!t._canceling && t.pairId===null && !this.isFlipPending(t));
                const types=['x2','x','unit'];
                types.forEach(ty=>{
                    const g = available.filter(t=>t.type===ty && t.sign===1);
                    const r = available.filter(t=>t.type===ty && t.sign===-1);
                    g.sort((a,b)=>(a.y-b.y)||(a.x-b.x)); r.sort((a,b)=>(a.y-b.y)||(a.x-b.x));
                    g.forEach(gg=>{
                        if(!r.length)return;
                        let best=-1, dist=Infinity;
                        r.forEach((rr,i)=>{
                            const d = Math.hypot(gg.x-rr.x, gg.y-rr.y);
                            if(d<dist){ dist=d; best=i; }
                        });
                        if(best!==-1) pairs.push([gg, r.splice(best,1)[0]]);
                    });
                });
                if(!pairs.length) { this._autoSimplifyActive=false; this.updateEquation(); return; }
                pairs.forEach((p,i)=>setTimeout(()=>this.animateCancel(p[0],p[1]), i*400));
                this._timer = setTimeout(()=>this.runSimplify(), pairs.length*400+1500);
            }
            animateCancel(t1, t2) {
                const pairOrientation = t1.type === 'x' ? (t2.orientation || t1.orientation || 'h') : (t2.orientation || 'h');
                if (t1.type === 'x') {
                    this.setTokenOrientation(t1, pairOrientation);
                    this.setTokenOrientation(t2, pairOrientation);
                }
                const pairSize = getTileSize(t2.type, pairOrientation);
                const endX=t2.x; const endY=t2.y;
                t1._canceling=true; t2._canceling=true;
                t1.element.classList.add('animating'); t2.element.classList.add('animating');
                this.moveToken(t1, endX, endY);
                setTimeout(()=>{
                    const b=this.createZeroBadge(null, endX, endY, pairSize);
                    t1.element.classList.add('vanish'); t2.element.classList.add('vanish'); b.classList.add('vanish');
                    // Remove old pair badge if exists
                    const oldBadge = document.getElementById(`badge-${t1.id}-${t2.id}`) || document.getElementById(`badge-${t2.id}-${t1.id}`);
                    if(oldBadge) oldBadge.remove();

                    setTimeout(()=>{ this.removeTokens([t1,t2]); b.remove(); }, 900);
                }, 300);
            }

            removeTokens(list) {
                list.forEach(t=>t.element.remove());
                const ids=list.map(t=>t.id);
                this.tokens=this.tokens.filter(t=>!ids.includes(t.id));
                this.steps.forEach(s=>s.tokenIds=s.tokenIds.filter(id=>!ids.includes(id)));
                this.updateEquation();
            }

            resetBoard(keepEquationMode = false) {
                this.saveState(); // « Tout recommencer » peut maintenant s'annuler (flèche ↶)
                playSound('pop');
                this.stopFlip();
                this.tokens.forEach(t => t.element.remove());
                document.querySelectorAll('.zero-badge').forEach(b => b.remove());
                this.removeProductFrameElement(false);
                this.tokens = [];
                if (!keepEquationMode) {
                    this.steps = [{ id: 0, operator: '', type: 'simple', tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false }];
                    this.currentStepIndex = 0;
                }
                
                this.lastPos = { x: 40, y: 60, maxYInRow: 0 };
                this.lastSequentialPackId = null;
                this.scale = this.getInitialScale(); this.pan = {x:0, y:0}; this.viewTouched = false;
                
                // FORCE UI RESET
                this.isSubtractingInput = false;
                this.isMultiplyingInput = false;
                // FIX 2: Reset display mode to normal to show (...) instead of 0
                this.displayMode = 'normal';
                
                document.getElementById('btn-close-parenthesis').classList.add('hidden');
                document.getElementById('btn-opposite').classList.add('hidden');
                document.getElementById('btn-distribute').classList.add('hidden');
                
                this.updateTransform();
                this.clearDrawing(false);
                this.setTool('hand'); // on repart toujours avec la main (avant, « Supprimer » restait actif)
                this.updateEquation();
            }

            // --- TAPER UNE EXPRESSION (lot 4, 06/11/2026) ---
            // Bouton « Taper » → pavé posé sur le plateau → « Poser les tuiles » REMPLACE le plateau
            // (↶ ramène l'ancien). Au toucher, seul le pavé de l'appli : le champ n'est pas un <input>,
            // donc le clavier du téléphone ne s'ouvre pas et ne cache pas le plateau. À l'ordinateur,
            // pavé ET clavier (x2 ou x^2 pour 𝑥², Entrée pour poser, Échap pour fermer).
            initTaper() {
                this.taper = { texte: '', caret: 0, ouvert: false, lu: lireExpressionTapee('') };
                const champ = document.getElementById('taper-champ');
                const pave = document.getElementById('taper-pave');
                if (!champ || !pave) return;
                champ.addEventListener('keydown', (e) => this.taperClavier(e));
                champ.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const t = (e.clipboardData || window.clipboardData)?.getData('text') || '';
                    this.taperInserer(normaliserSaisie(t));
                });
                champ.addEventListener('pointerdown', (e) => this.taperClicChamp(e));
                // le pointerdown redessine le champ : le mousedown qui suit vise une lettre déjà retirée,
                // et Chrome ne rendrait le focus à personne (la frappe suivante serait perdue).
                champ.addEventListener('mousedown', (e) => e.preventDefault());
                // une touche du pavé ne doit pas voler le clavier au champ (ordinateur)
                pave.addEventListener('mousedown', (e) => e.preventDefault());
                pave.addEventListener('click', (e) => {
                    const b = e.target.closest('button[data-touche]'); if (!b) return;
                    this.taperTouche(b.dataset.touche);
                });
                window.addEventListener('resize', () => { if (this.taper.ouvert) this.placerTaper(); });
                this.rendreTaper();
            }

            basculerTaper() { if (this.taper.ouvert) this.fermerTaper(); else this.ouvrirTaper(); }

            ouvrirTaper() {
                const p = document.getElementById('taper-panneau'); if (!p) return;
                this.taper.ouvert = true; p.hidden = false;
                document.getElementById('btn-taper')?.classList.add('on');
                document.getElementById('btn-taper')?.setAttribute('aria-expanded', 'true');
                this.taper.caret = this.taper.texte.length;
                this.placerTaper(); this.rendreTaper();
                try { document.getElementById('taper-champ').focus({ preventScroll: true }); } catch (err) {}
            }

            fermerTaper() {
                const p = document.getElementById('taper-panneau'); if (!p) return;
                this.taper.ouvert = false; p.hidden = true;
                document.getElementById('btn-taper')?.classList.remove('on');
                document.getElementById('btn-taper')?.setAttribute('aria-expanded', 'false');
            }

            // Ordinateur : sous la barre, à droite de la colonne des tuiles. Téléphone : en bas (CSS).
            placerTaper() {
                const p = document.getElementById('taper-panneau'); if (!p) return;
                if (window.matchMedia('(max-width: 640px)').matches) { p.style.top = ''; p.style.left = ''; return; }
                const h = document.querySelector('header').getBoundingClientRect();
                const a = document.querySelector('aside').getBoundingClientRect();
                p.style.top = Math.round(h.bottom + 14) + 'px';
                p.style.left = Math.round(a.right + 16) + 'px';
            }

            taperModifier(texte, caret) {
                // x2 → 𝑥² se fait à la frappe : on recalcule la place du curseur dans le texte rangé
                const t = normaliserSaisie(texte);
                this.taper.caret = Math.min(t.length, normaliserSaisie(texte.slice(0, caret)).length);
                this.taper.texte = t;
                this.rendreTaper();
            }

            taperInserer(str) {
                if (!str) return;
                const { texte, caret } = this.taper;
                this.taperModifier(texte.slice(0, caret) + str + texte.slice(caret), caret + str.length);
            }

            taperTouche(k) {
                const { texte, caret } = this.taper;
                if (k === 'retour') { if (caret > 0) this.taperModifier(texte.slice(0, caret - 1) + texte.slice(caret), caret - 1); }
                else if (k === 'effacer') this.taperModifier('', 0);
                else this.taperInserer(k);
            }

            taperClavier(e) {
                if (e.ctrlKey || e.metaKey || e.altKey) return; // copier-coller, raccourcis du navigateur
                const { texte, caret } = this.taper;
                const k = e.key;
                if (k === 'Enter') { e.preventDefault(); this.taperPoser(); return; }
                if (k === 'Escape') { e.preventDefault(); this.fermerTaper(); return; }
                if (k === 'Backspace') { e.preventDefault(); this.taperTouche('retour'); return; }
                if (k === 'Delete') { e.preventDefault(); if (caret < texte.length) this.taperModifier(texte.slice(0, caret) + texte.slice(caret + 1), caret); return; }
                if (k === 'ArrowLeft') { e.preventDefault(); this.taper.caret = Math.max(0, caret - 1); this.rendreTaper(); return; }
                if (k === 'ArrowRight') { e.preventDefault(); this.taper.caret = Math.min(texte.length, caret + 1); this.rendreTaper(); return; }
                if (k === 'Home') { e.preventDefault(); this.taper.caret = 0; this.rendreTaper(); return; }
                if (k === 'End') { e.preventDefault(); this.taper.caret = texte.length; this.rendreTaper(); return; }
                if (k === 'Tab') return;
                if (k.length === 1 || Array.from(k).length === 1) { e.preventDefault(); if (k !== ' ') this.taperInserer(normaliserSaisie(k)); }
            }

            // Toucher le champ place le curseur avant ou après la lettre touchée.
            taperClicChamp(e) {
                const c = e.target.closest('[data-i]');
                if (c) {
                    const r = c.getBoundingClientRect();
                    const i = parseInt(c.dataset.i, 10);
                    this.taper.caret = e.clientX < r.left + r.width / 2 ? i : i + 1;
                } else this.taper.caret = this.taper.texte.length;
                this.rendreTaper();
                try { document.getElementById('taper-champ').focus({ preventScroll: true }); } catch (err) {}
            }

            rendreTaper() {
                const champ = document.getElementById('taper-champ');
                const lis = document.getElementById('taper-lis');
                const btn = document.getElementById('taper-poser');
                if (!champ || !lis || !btn) return;
                const { texte, caret } = this.taper;
                const r = lireExpressionTapee(texte);
                this.taper.lu = r;
                const bad = (!r.ok && r.message) ? [r.start, r.end] : null;
                const esc = (c) => c === '<' ? '&lt;' : (c === '>' ? '&gt;' : (c === '&' ? '&amp;' : c));
                let html = '';
                for (let i = 0; i <= texte.length; i++) {
                    if (i === caret) html += '<span class="taper-caret" aria-hidden="true"></span>';
                    if (i === texte.length) break;
                    const c = texte[i];
                    const cls = ['c'];
                    if (c === 'x') cls.push('lettre');
                    if (c === '+' || c === '−' || c === '×') cls.push('op');
                    if (bad && i >= bad[0] && i < bad[1]) cls.push('bad');
                    html += `<span class="${cls.join(' ')}" data-i="${i}">${c === 'x' ? '𝑥' : esc(c)}</span>`;
                }
                if (!texte) html += '<span class="taper-vide">par exemple 2𝑥² + 3𝑥 − 2</span>';
                champ.innerHTML = html;
                champ.classList.toggle('err', !!bad);
                champ.setAttribute('aria-label', texte ? `Expression : ${texte}` : 'Expression à taper');
                lis.className = 'taper-lis';
                if (r.ok) {
                    lis.innerHTML = 'Je lis : <span class="k"></span>';
                    katex.render(this.latexDeLecture(r), lis.querySelector('.k'), { throwOnError: false });
                } else if (r.message) {
                    lis.classList.add('err');
