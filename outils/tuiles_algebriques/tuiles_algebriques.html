                    lis.innerHTML = '';
                    const m = document.createElement('div'); m.className = 'm'; m.textContent = r.message; lis.appendChild(m);
                    if (r.aide) { const a = document.createElement('div'); a.className = 'a'; a.textContent = TAPER_AIDE; lis.appendChild(a); }
                } else if (r.incomplet) lis.innerHTML = '<span class="attente">À compléter…</span>';
                else lis.innerHTML = '';
                btn.disabled = !r.ok;
            }

            // Ce que « Je lis » écrit : l'expression comme on l'a tapée, aux couleurs des tuiles.
            latexDeLecture(r) {
                const plus = this.colorLatex(this.getEquationOperatorColor(1), '+');
                const moins = this.colorLatex(this.getEquationOperatorColor(-1), '-');
                const terme = (t, premier) => {
                    const col = this.getEquationColor(t.type, t.sign);
                    const corps = t.type === 'unit' ? String(t.count) : (t.count === 1 ? '' : String(t.count)) + (t.type === 'x2' ? 'x^2' : 'x');
                    const c = this.colorLatex(col, corps);
                    if (premier) return (t.sign === -1 ? this.colorLatex(col, '-') : '') + c;
                    return t.sign === -1 ? `\\:${this.colorLatex(col, '-')}\\:${c}` : `\\:${plus}\\:${c}`;
                };
                const suite = (terms) => terms.map((t, i) => terme(t, i === 0)).join('');
                if (r.kind === 'product') {
                    const [a, b] = r.facteurs;
                    const ecrire = (f) => f.groupe ? `(${suite(f.termes)})` : suite(f.termes);
                    const signe = a.moinsDevant ? moins : '';
                    return signe + ecrire(a) + (!a.groupe && !b.groupe ? '\\times ' : '') + ecrire(b);
                }
                let l = ''; let premier = true;
                r.segments.forEach(seg => {
                    if (seg.kind === 'plain') { seg.terms.forEach(t => { l += terme(t, premier); premier = false; }); return; }
                    l += premier ? (seg.kind === 'minus' ? moins : '') : `\\:${seg.kind === 'minus' ? moins : plus}\\:`;
                    l += `(${suite(seg.terms)})`;
                    premier = false;
                });
                return l;
            }

            taperPoser() {
                const r = lireExpressionTapee(this.taper.texte);
                if (!r.ok) { this.rendreTaper(); return; }
                this.poserExpressionTapee(r);
                this.fermerTaper();
            }

            // Remplace le plateau par les tuiles de l'expression lue. Un seul pas dans l'historique (↶).
            poserExpressionTapee(r) {
                this.resetBoard(); // enregistre l'état d'avant : ↶ ramène l'ancien plateau
                if (r.kind === 'product') { this.poserProduitTape(r); return; }
                const poser = (terms) => terms.forEach(t => {
                    this.lastPack = null; // un terme tapé = un groupe : 𝑥 + 𝑥 reste 𝑥 + 𝑥 (pas 2𝑥)
                    for (let i = 0; i < t.count; i++) this.createTileToken(t.type, t.sign, 'auto');
                });
                const etapeApres = () => { // ce qui suit une parenthèse va APRÈS elle (comme closeParenthesis)
                    this.steps.push({ id: this.steps.length, operator: '+', type: 'simple', plusStep: true, implicit: true, tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false });
                    this.currentStepIndex = this.steps.length - 1;
                    this.lastPack = null;
                    this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
                };
                r.segments.forEach(seg => {
                    if (seg.kind === 'minus') {
                        // comme le bouton − puis « ) » : tuiles affichées telles qu'on les tape, cadre pointillé,
                        // retournées au clic sur « Ajouter l'opposé »
                        this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
                        this.steps.push({ id: this.steps.length, operator: '-', type: 'subtraction', tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false });
                        this.currentStepIndex = this.steps.length - 1;
                        this.isSubtractingInput = true;
                        poser(seg.terms);
                        this.isSubtractingInput = false;
                        this.steps[this.currentStepIndex].isClosed = true;
                        etapeApres();
                    } else if (seg.kind === 'plus') {
                        // comme le bouton + : 𝑥 + (−2) garde sa parenthèse
                        const cur = this.steps[this.currentStepIndex];
                        if (cur && cur.implicit && !cur.tokenIds.length) cur.implicit = false;
                        else {
                            this.steps.push({ id: this.steps.length, operator: '+', type: 'simple', plusStep: true, implicit: false, tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false });
                            this.currentStepIndex = this.steps.length - 1;
                        }
                        this.pendingPackGap = Math.max(this.pendingPackGap, PACK_GAP);
                        poser(seg.terms);
                        etapeApres();
                    } else poser(seg.terms);
                });
                document.getElementById('btn-close-parenthesis').classList.add('hidden');
                this.checkOppositeAvailable();
                this.updateEquation();
            }

            // 2(𝑥 + 1), (𝑥 + 1)(𝑥 − 2) : le tableau produit, premier facteur à gauche, second en haut,
            // cases vides à remplir. Le tableau tient dans le plateau visible (zoom réduit s'il le faut).
            poserProduitTape(r) {
                this.productFrame = { x: 0, y: 0, element: null };
                const [gauche, haut] = r.facteurs;
                const poser = (f, zone, inverser) => {
                    let idx = 0;
                    f.termes.forEach(t => {
                        const sign = inverser ? -t.sign : t.sign;
                        for (let i = 0; i < t.count; i++) {
                            this.createTileToken(t.type, sign, 'manual', 0, 0, t.type === 'x' && zone === 'left' ? 'v' : 'h');
                            const tok = this.tokens[this.tokens.length - 1];
                            tok.productZone = zone; tok.productIndex = idx++;
                        }
                    });
                };
                poser(gauche, 'left', gauche.moinsDevant);
                poser(haut, 'top', false);
                this.lastPack = null;
                const m = this.getProductMetrics(this.productFrame);
                const w = this.boardContainer.clientWidth, h = this.boardContainer.clientHeight;
                const marge = 16;
                const fit = Math.min((w - 2 * marge) / m.width, (h - 2 * marge) / m.height);
                if (fit < this.scale) { this.scale = Math.max(MIN_SCALE, Math.floor(fit * 100) / 100); this.viewTouched = true; this.updateTransform(); this.redrawPen(); }
                this.productFrame.x = Math.round(marge / this.scale);
                this.productFrame.y = Math.round(marge / this.scale);
                this.renderProductFrame();
                this.reflowProductFrameTokens(false);
                this.updateEquation();
            }

            // --- FACTORISER (lot 5, 06/11/2026) ---
            // Bouton « Factoriser » de la colonne : les tuiles du plateau sont rangées à côté d'un tableau
            // vide qui s'agrandit. L'élève y fait un rectangle (une case = une tuile), puis pose les côtés
            // avec des tuiles du menu. L'équation écrit « expression de départ = côté × côté ».
            factoDonnees(exclu = null) {
                const dans = (z) => this.tokens.filter(t => t !== exclu && t.productZone === z && t.pairId === null);
                const cells = dans('cell').map(t => ({ id: t.id, row: t.productRow ?? 0, col: t.productCol ?? 0, type: t.type, sign: t.sign, orientation: t.orientation || 'h' }));
                const tops = dans('top').map(t => ({ id: t.id, col: t.productIndex ?? 0, type: t.type, sign: t.sign }));
                const lefts = dans('left').map(t => ({ id: t.id, row: t.productIndex ?? 0, type: t.type, sign: t.sign }));
                const libres = this.tokens.filter(t => t !== exclu && !t.productZone && t.pairId === null && !t._canceling);
                const R = Math.max(0, ...cells.map(c => c.row + 1), ...lefts.map(l => l.row + 1));
                const C = Math.max(0, ...cells.map(c => c.col + 1), ...tops.map(t => t.col + 1));
                return { R, C, cells, tops, lefts, cible: this.productFrame?.cible || { x2: 0, x: 0, unit: 0 }, resteValeur: factoValeur(libres), resteNombre: libres.length };
            }

            // Plus de ligne ni de colonne vide au milieu : on renumérote 0, 1, 2…
            factoTasser() {
                const z = (n) => this.tokens.filter(t => t.productZone === n);
                const tasser = (cles, lire, ecrire) => {
                    const vus = [...new Set(cles.map(lire))].sort((a, b) => a - b);
                    const place = new Map(vus.map((v, i) => [v, i]));
                    cles.forEach(t => ecrire(t, place.get(lire(t))));
                };
                tasser([...z('cell'), ...z('left')], t => t.productZone === 'cell' ? (t.productRow ?? 0) : (t.productIndex ?? 0),
                    (t, i) => { if (t.productZone === 'cell') t.productRow = i; else t.productIndex = i; });
                tasser([...z('cell'), ...z('top')], t => t.productZone === 'cell' ? (t.productCol ?? 0) : (t.productIndex ?? 0),
                    (t, i) => { if (t.productZone === 'cell') t.productCol = i; else t.productIndex = i; });
            }

            factoEtat() { return factoAnalyser(this.factoDonnees()); }

            factoMetrics(frame) {
                const d = this.factoDonnees();
                const etat = factoAnalyser(d);
                const fantome = !factoEstJuste(etat); // la colonne et la ligne « + » où l'on agrandit le rectangle
                const PAD = 8, FANTOME = 72;
                const cols = d.C + (fantome ? 1 : 0), rows = d.R + (fantome ? 1 : 0);
                const colWidths = Array.from({ length: cols }, (_, c) => {
                    if (c >= d.C) return FANTOME;
                    const top = d.tops.find(t => t.col === c);
                    const ws = d.cells.filter(x => x.col === c).map(x => getTileSize(x.type, x.orientation).w);
                    if (top) ws.push(getTileSize(top.type, 'h').w);
                    return Math.max(...ws, 34) + PAD;
                });
                const rowHeights = Array.from({ length: rows }, (_, r) => {
                    if (r >= d.R) return FANTOME;
                    const left = d.lefts.find(t => t.row === r);
                    const hs = d.cells.filter(x => x.row === r).map(x => getTileSize(x.type, x.orientation).h);
                    if (left) hs.push(getTileSize(left.type, 'v').h);
                    return Math.max(...hs, 34) + PAD;
                });
                const toolbarH = 34, leftW = 62, topH = 50, statutH = 52; // deux lignes de texte
                const gridW = leftW + colWidths.reduce((a, b) => a + b, 0);
                const bord = PRODUCT_FRAME_BORDER; // compté dans la taille ; on place depuis le bord intérieur
                const width = Math.max(300, gridW + 2 * bord);
                const height = toolbarH + topH + rowHeights.reduce((a, b) => a + b, 0) + statutH + 2 * bord;
                const ox = (frame?.x || 0) + bord, oy = (frame?.y || 0) + bord;
                const colX = (c) => ox + leftW + colWidths.slice(0, c).reduce((a, b) => a + b, 0);
                const rowY = (r) => oy + toolbarH + topH + rowHeights.slice(0, r).reduce((a, b) => a + b, 0);
                return {
                    rows, cols, toolbarH, leftW, topH, colWidths, rowHeights, width, height, gridW, statutH, etat, d, fantome, bord, ox, oy,
                    gridY: oy + toolbarH,
                    centralX: ox + leftW,
                    centralY: oy + toolbarH + topH,
                    colX, rowY
                };
            }

            factoRendre() {
                const f = this.productFrame;
                if (f.element) f.element.remove();
                const m = this.factoMetrics(f);
                const juste = factoEstJuste(m.etat);
                const el = document.createElement('div');
                el.className = 'product-frame product-dynamic facto' + (juste ? ' facto-juste' : '');
                el.style.left = f.x + 'px';
                el.style.top = f.y + 'px';
                el.style.width = m.width + 'px';
                el.style.height = m.height + 'px';

                const toolbar = document.createElement('div');
                toolbar.className = 'product-toolbar';
                toolbar.title = 'Déplacer le tableau';
                toolbar.innerHTML = `<span>Factoriser</span><div class="flex gap-1"><button class="paire" onclick="app.factoAjouterPaire()" title="Ajouter 𝑥 et −𝑥 : ensemble, elles valent 0">+ 𝑥 et −𝑥</button><button class="danger" onclick="app.deleteProductFrame(true)" title="Fermer le tableau">×</button></div>`;
                toolbar.addEventListener('pointerdown', (e) => this.startProductFrameDrag(e));
                toolbar.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('pointerdown', e => e.stopPropagation());
                    btn.addEventListener('mousedown', e => e.stopPropagation());
                });
                el.addEventListener('mousedown', e => e.stopPropagation());
                el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
                el.appendChild(toolbar);

                const grid = document.createElement('div');
                grid.className = 'product-grid';
                grid.style.gridTemplateColumns = `${m.leftW}px ${m.colWidths.map(w => `${w}px`).join(' ')}`;
                grid.style.gridTemplateRows = `${m.topH}px ${m.rowHeights.map(h => `${h}px`).join(' ')}`;
                grid.style.width = m.gridW + 'px';
                const corner = document.createElement('div');
                corner.className = 'product-corner';
                corner.textContent = '×';
                grid.appendChild(corner);
                for (let c = 0; c < m.cols; c++) {
                    const slot = document.createElement('div');
                    slot.className = 'product-slot top' + (c >= m.d.C ? ' fantome' : '');
                    grid.appendChild(slot);
                }
                for (let r = 0; r < m.rows; r++) {
                    const left = document.createElement('div');
                    left.className = 'product-slot left' + (r >= m.d.R ? ' fantome' : '');
                    grid.appendChild(left);
                    for (let c = 0; c < m.cols; c++) {
                        const cell = document.createElement('div');
                        const fantome = r >= m.d.R || c >= m.d.C;
                        cell.className = 'product-cell' + (fantome ? ' fantome' : '');
                        if (fantome) cell.textContent = '+';
                        grid.appendChild(cell);
                    }
                }
                el.appendChild(grid);

                const statut = document.createElement('div');
                statut.className = 'facto-statut' + (juste ? ' ok' : '') + (this.factoMessage ? ' alerte' : '');
                statut.style.height = m.statutH + 'px';
                statut.textContent = this.factoMessage || factoTexte(m.etat);
                el.appendChild(statut);

                this.boardWorld.appendChild(el);
                f.element = el;
                if (juste && !f.dejaJuste) playSound('magic');
                f.dejaJuste = juste;
            }

            factoReplacer(animate = true) {
                const f = this.productFrame;
                const m = this.factoMetrics(f);
                const mal = new Set(m.etat.etat === 'taille' ? m.etat.mal : []);
                const placer = (t, x, y) => {
                    if (animate && t.element) t.element.classList.add('animating');
                    this.moveToken(t, x, y);
                    if (animate) setTimeout(() => t.element && t.element.classList.remove('animating'), 350);
                };
                this.tokens.forEach(t => {
                    if (t.element) t.element.classList.toggle('facto-mal', mal.has(t.id));
                    if (!t.productZone || t.pairId !== null) return;
                    if (t.productZone === 'top') {
                        if (t.type === 'x') this.setTokenOrientation(t, 'h');
                        const s = getTileSize(t.type, t.orientation), c = t.productIndex ?? 0;
                        placer(t, m.colX(c) + (m.colWidths[c] - s.w) / 2, m.oy + m.toolbarH + (m.topH - s.h) / 2);
                    } else if (t.productZone === 'left') {
                        if (t.type === 'x') this.setTokenOrientation(t, 'v');
                        const s = getTileSize(t.type, t.orientation), r = t.productIndex ?? 0;
                        placer(t, m.ox + (m.leftW - s.w) / 2, m.rowY(r) + (m.rowHeights[r] - s.h) / 2);
                    } else {
                        const s = getTileSize(t.type, t.orientation), r = t.productRow ?? 0, c = t.productCol ?? 0;
                        placer(t, m.colX(c) + (m.colWidths[c] - s.w) / 2, m.rowY(r) + (m.rowHeights[r] - s.h) / 2);
                    }
                });
            }

            // Une tuile 𝑥 posée dans une case se couche ou se met debout selon sa colonne, puis sa ligne.
            factoOrienter(t) {
                if (t.type !== 'x') return;
                const d = this.factoDonnees(t);
                const sorte = (liste, cle) => { const k = new Set(liste.map(cle)); return k.size === 1 ? [...k][0] : null; };
                const top = d.tops.find(x => x.col === t.productCol), left = d.lefts.find(x => x.row === t.productRow);
                const colK = top ? factoCote(top.type) : sorte(d.cells.filter(c => c.col === t.productCol), c => factoDims(c.type, c.orientation).l);
                const ligK = left ? factoCote(left.type) : sorte(d.cells.filter(c => c.row === t.productRow), c => factoDims(c.type, c.orientation).h);
                let o = t.orientation || 'h';
                if (colK === 'x') o = 'h'; else if (colK === '1') o = 'v'; else if (ligK === 'x') o = 'v'; else if (ligK === '1') o = 'h';
                this.setTokenOrientation(t, o);
                t.originalOrientation = o;
            }

            factoPoser(t) {
                const info = this.getProductZoneInfo(t);
                const fini = () => { this.factoTasser(); this.renderProductFrame(); this.reflowProductFrameTokens(); this.updateEquation(); return true; };
                const refuser = (message) => {
                    this.history.pop(); // rien n'a changé : le pas enregistré au début du geste ne sert à rien
                    this.markProductError(t);
                    if (message) this.factoDire(message);
                    if (this.dragStartState) this.restoreDraggedToken(t);
                    else setTimeout(() => this.deleteToken(t, false), 420); // tuile tirée du menu : elle repart
                    return true;
                };
                if (!info) {
                    if (!t.productZone) return false;
                    this.clearProductPlacement(t);
                    return fini();
                }
                const d = this.factoDonnees(t);
                if (info.zone === 'cell') {
                    const row = Math.min(info.row, d.R), col = Math.min(info.col, d.C);
                    if (d.cells.some(c => c.row === row && c.col === col)) return refuser(null);
                    this.clearProductPlacement(t);
                    t.productZone = 'cell'; t.productRow = row; t.productCol = col;
                    this.factoOrienter(t);
                    playSound('snap');
                    return fini();
                }
                const index = info.zone === 'top' ? info.col : info.row;
                if (!factoCoteAccepte(d, { zone: info.zone, index, type: t.type, sign: t.sign }))
                    return refuser(t.type === 'x2' ? 'Un côté se fait avec des tuiles 𝑥 et 1.' : 'Ce côté ne va pas : case = côté × côté.');
                this.clearProductPlacement(t);
                t.productZone = info.zone; t.productIndex = index;
                if (t.type === 'x') this.setTokenOrientation(t, info.zone === 'top' ? 'h' : 'v');
                playSound('snap');
                return fini();
            }

            // Un message court à la place de l'état, le temps de le lire.
            factoDire(texte) {
                this.factoMessage = texte;
                clearTimeout(this._factoTimer);
                this._factoTimer = setTimeout(() => { this.factoMessage = null; if (this.productFrame?.mode === 'facto') { this.renderProductFrame(); } }, 2600);
                if (this.productFrame?.mode === 'facto') this.renderProductFrame();
            }

            // Sous le bouton « Factoriser » quand il ne peut pas se lancer.
            factoBulle(texte) {
                const b = document.getElementById('btn-factoriser');
                let bulle = document.getElementById('facto-bulle');
                if (!bulle) { bulle = document.createElement('div'); bulle.id = 'facto-bulle'; bulle.setAttribute('role', 'status'); document.body.appendChild(bulle); }
                bulle.textContent = texte;
                const r = b.getBoundingClientRect();
                bulle.style.left = Math.round(r.right + 10) + 'px';
                bulle.style.top = Math.round(r.top + r.height / 2) + 'px';
                bulle.hidden = false;
                b.classList.remove('pivot-refus'); void b.offsetWidth; b.classList.add('pivot-refus');
                clearTimeout(this._bulleTimer);
                this._bulleTimer = setTimeout(() => { bulle.hidden = true; b.classList.remove('pivot-refus'); }, 2600);
            }

            lancerFactoriser() {
                if (this.productFrame) { this.factoBulle('Un tableau est déjà ouvert : ferme-le d’abord (×).'); return; }
                if (this.tokens.some(t => this.isFlipPending(t))) { this.factoBulle('Retourne d’abord la parenthèse : « Ajouter l’opposé ».'); return; }
                const libres = this.tokens.filter(t => t.pairId === null && !t._canceling);
                const cible = factoValeur(libres);
                if (factoEgales(cible, { x2: 0, x: 0, unit: 0 })) { this.factoBulle('Pose ou tape d’abord une expression.'); return; }
                this.saveState();
                if (this.taper?.ouvert) this.fermerTaper();
                this.setTool('hand');
                this.stopFlip();
                // Le tableau en haut à gauche de la vue ; les tuiles à côté (écran large) ou dessous (téléphone),
                // rangées par sorte : 𝑥², 𝑥, 1, les vertes d'abord.
                const sc = this.scale, w = this.boardContainer.clientWidth / sc, h = this.boardContainer.clientHeight / sc;
                const x0 = -this.pan.x / sc, y0 = -this.pan.y / sc, marge = 16 / sc;
                this.productFrame = { x: Math.round(x0 + marge), y: Math.round(y0 + marge), element: null, mode: 'facto', cible, dejaJuste: false };
                const estW = 440, estH = 400;
                const aCote = w - estW - 2 * marge >= 250;
                const rx = aCote ? this.productFrame.x + estW + 24 : this.productFrame.x;
                const ry = aCote ? this.productFrame.y + 8 : this.productFrame.y + estH;
                const rw = aCote ? x0 + w - marge - rx : w - 2 * marge;
                const ordre = { x2: 0, x: 1, unit: 2 };
                const rangees = [...libres].sort((a, b) => ordre[a.type] - ordre[b.type] || b.sign - a.sign || a.id - b.id);
                let x = rx, y = ry, hRang = 0, avant = null;
                rangees.forEach(t => {
                    if (t.type === 'x') { this.setTokenOrientation(t, 'h'); t.originalOrientation = 'h'; }
                    const s = getTileSize(t.type, t.orientation);
                    const cle = t.type + ':' + t.sign;
                    const gap = avant === null ? 0 : (avant === cle ? 6 : 18);
                    if (x > rx && x + gap + s.w > rx + rw) { x = rx; y += hRang + 14; hRang = 0; }
                    else x += (x > rx ? gap : 0);
                    this.moveToken(t, x, y);
                    x += s.w; hRang = Math.max(hRang, s.h); avant = cle;
                });
                this.factoReserve = { x: rx, y: y + hRang + 24, w: rw };
                this.factoMessage = null;
                this.renderProductFrame();
                this.reflowProductFrameTokens(false);
                this.updateEquation();
            }

            // « + 𝑥 et −𝑥 » : deux tuiles qui ensemble valent 0 (pour 𝑥² − 1, 𝑥² + 𝑥 − 2…), posées sous les tuiles.
            factoAjouterPaire() {
                this.saveState();
                playSound('pop');
                const f = this.productFrame, m = this.factoMetrics(f);
                const r = this.factoReserve || { x: f.x + m.width + 24, y: f.y, w: 260 };
                const libre = (x, y, w, h) => !this.tokens.some(t => { const s = getTileSize(t.type, t.orientation); return x < t.x + s.w + 6 && t.x < x + w + 6 && y < t.y + s.h + 6 && t.y < y + h + 6; })
                    && !(x < f.x + m.width + 6 && f.x < x + w + 6 && y < f.y + m.height + 6 && f.y < y + h + 6);
                let px = r.x, py = r.y;
                for (let essai = 0; essai < 400 && !libre(px, py, 236, 34); essai++) { py += 20; }
                this.createTileToken('x', 1, 'manual', px, py, 'h');
                this.createTileToken('x', -1, 'manual', px + 126, py, 'h');
                this.applyColorMode(false);
                this.renderProductFrame();
                this.updateEquation();
            }

            // L'équation : « expression de départ = côté × côté », avec … tant qu'un côté manque.
            factoLatex() {
                const f = this.productFrame;
                const compte = [];
                [['x2', 1], ['x2', -1], ['x', 1], ['x', -1], ['unit', 1], ['unit', -1]].forEach(([type, sign]) => {
                    const n = sign === 1 ? Math.max(0, f.cible[type]) : Math.max(0, -f.cible[type]);
                    for (let i = 0; i < n; i++) compte.push({ type, sign, pairId: null });
                });
                const cible = this.tokensToReducedSumLatex(compte) || '0';
                const cote = (zone) => this.productTokens(zone).map(o => o.t);
                const g = cote('left'), h = cote('top');
                const d = this.factoDonnees();
                // un côté pas fini s'écrit avec « … » : (𝑥 + …), jamais un produit faux comme 𝑥(𝑥 + 2)
                const fini = (l, n) => l.length > 0 && l.length >= n;
                const seul = (l, n) => fini(l, n) && new Set(l.map(t => t.type + ':' + t.sign)).size === 1;
                const ecrit = (l, n) => !l.length ? '\\dots' : this.tokensToReducedSumLatex(l) + (fini(l, n) ? '' : `\\;${this.colorLatex(this.getEquationOperatorColor(1), '+')}\\;\\dots`);
                const sg = seul(g, d.R), sh = seul(h, d.C);
                const lg = ecrit(g, d.R), lh = ecrit(h, d.C);
                let produit;
                if (sg && sh) produit = `${lg}\\times ${lh}`;
                else if (sg) produit = `${lg}(${lh})`;
                else if (sh) produit = `${lh}(${lg})`;
                else if (fini(g, d.R) && fini(h, d.C) && lg === lh) produit = `(${lg})^2`;
                else produit = `(${lg})(${lh})`;
                return `${cible}\\;=\\;${produit}`;
            }

            // --- PIVOTER UNE TUILE 𝑥 (lot 4) : outil comme la corbeille, couchée ↔ debout ---
            pivoterTuile(t) {
                if (!t || !t.element) return;
                // x² et 1 sont carrés ; dans le tableau produit ou dans une paire nulle, c'est l'appli qui oriente
                const caseFacto = t.productZone === 'cell' && this.productFrame?.mode === 'facto';
                if (t.type !== 'x' || (t.productZone && !caseFacto) || t.pairId !== null) {
                    t.element.classList.remove('pivot-refus'); void t.element.offsetWidth; t.element.classList.add('pivot-refus');
                    setTimeout(() => t.element && t.element.classList.remove('pivot-refus'), 600);
                    return;
                }
                this.saveState();
                playSound('pop');
                const avant = getTileSize(t.type, t.orientation);
                const cx = t.x + avant.w / 2, cy = t.y + avant.h / 2;
                const o = t.orientation === 'v' ? 'h' : 'v';
                this.setTokenOrientation(t, o);
                t.originalOrientation = o; // une paire nulle défaite lui rend CETTE orientation
                const apres = getTileSize(t.type, o);
                this.moveToken(t, Math.round(cx - apres.w / 2), Math.round(cy - apres.h / 2));
                if (caseFacto) { this.renderProductFrame(); this.reflowProductFrameTokens(false); }
                const el = t.element;
                el.style.transformOrigin = '50% 50%';
                const a = el.animate([{ transform: 'rotate(-90deg)' }, { transform: 'rotate(0deg)' }], { duration: 220, easing: 'ease-out' });
                a.onfinish = () => { el.style.transformOrigin = ''; };
                this.updateEquation();
            }

            // --- LOT 8 : LA BULLE D'UNE TUILE ---
            // Toucher une tuile sans la bouger (ou clic droit) ouvre une petite bulle au-dessus d'elle :
            // Pivoter, Dupliquer, Opposé, Supprimer. Seuls les boutons qui s'appliquent à cette tuile sont montrés.
            initBulle() {
                this.bulle = document.getElementById('bulle-tuile');
                this.bulleTuile = null;
                if (!this.bulle) return;
                this.bulle.addEventListener('click', (e) => {
                    const b = e.target.closest('button[data-action]');
                    if (b) this.actionBulle(b.dataset.action);
                });
                // Clic droit (ou appui long) sur une tuile : la même bulle.
                this.boardContainer.addEventListener('contextmenu', (e) => {
                    const el = e.target.closest && e.target.closest('.token');
                    if (!el) return;
                    e.preventDefault();
                    if (this.currentTool !== 'hand') return;
                    const t = this.tokens.find(x => x.element === el);
                    if (t) this.ouvrirBulle(t);
                });
                // Toucher ailleurs ferme la bulle.
                document.addEventListener('pointerdown', (e) => {
                    if (this.bulleTuile && !this.bulle.contains(e.target)) this.fermerBulle();
                }, true);
                window.addEventListener('keydown', (e) => { if (e.key === 'Escape') this.fermerBulle(); });
                window.addEventListener('resize', () => this.fermerBulle());
            }

            // Ce que la bulle propose pour une tuile.
            actionsBulle(t) {
                const facto = this.productFrame?.mode === 'facto';
                const step = this.steps[this.stepIndexOfToken(t)];
                // Dupliquer et Opposé : seulement une tuile « libre » de l'expression (pas dans le tableau,
                // pas dans une paire nulle, pas une copie d'un facteur 2(…) pas encore développé).
                const libre = !!step && !t.productZone && t.pairId === null && !t._canceling && !facto
                    && !(t.ghostIds && t.ghostIds.length) && !(step.type === 'multiplication' && !step.distributed);
                return {
                    pivoter: t.type === 'x' && t.pairId === null && (!t.productZone || (t.productZone === 'cell' && facto)),
                    dupliquer: libre,
                    // une parenthèse « − » pas encore retournée : c'est « Ajouter l'opposé » qui s'en charge
                    oppose: libre && !this.isFlipPending(t) && !(step.type === 'subtraction' && !step.oppositeApplied) && !this.flippingSteps.size,
                    supprimer: true
                };
            }

            ouvrirBulle(t) {
                if (!this.bulle || !t || !t.element || !t.element.isConnected) return;
                this.bulleTuile = t;
                const a = this.actionsBulle(t);
                this.bulle.querySelectorAll('button[data-action]').forEach(b => { b.hidden = !a[b.dataset.action]; });
                this.bulle.hidden = false;
                this.placerBulle();
            }

            placerBulle() {
                const t = this.bulleTuile; if (!t || !t.element) return;
                const r = t.element.getBoundingClientRect();
                const zone = this.boardContainer.getBoundingClientRect();
                const bw = this.bulle.offsetWidth, bh = this.bulle.offsetHeight, ecart = 10;
                let x = r.left + r.width / 2 - bw / 2;
                x = Math.max(zone.left + 6, Math.min(x, zone.right - bw - 6));
                let y = r.top - bh - ecart; // au-dessus de la tuile…
                if (y < zone.top + 6) y = r.bottom + ecart; // …ou dessous s'il n'y a pas la place
                this.bulle.style.left = Math.round(x) + 'px';
                this.bulle.style.top = Math.round(y) + 'px';
            }

            fermerBulle() {
                if (!this.bulle) return;
                this.bulleTuile = null;
                this.bulle.hidden = true;
            }

            actionBulle(action) {
                const t = this.bulleTuile;
                if (!t || !this.tokens.includes(t)) { this.fermerBulle(); return; }
                if (!this.actionsBulle(t)[action]) return;
                if (action === 'supprimer') { this.fermerBulle(); this.deleteToken(t, true); return; }
                if (action === 'pivoter') this.pivoterTuile(t);
                else if (action === 'dupliquer') this.dupliquerTuile(t);
                else if (action === 'oppose') this.opposeTuile(t);
                // la bulle reste ouverte sur la tuile (pivoter deux fois, dupliquer trois fois…)
                if (this.tokens.includes(t)) this.ouvrirBulle(t); else this.fermerBulle();
            }

            // Une place libre à côté de la tuile, à droite d'abord, puis dessous.
            placeLibrePres(t) {
                const s = getTileSize(t.type, t.orientation);
                const occupe = (x, y) => this.tokens.some(o => {
                    if (!o.element || o.productZone) return false;
                    const q = getTileSize(o.type, o.orientation);
                    return x < o.x + q.w + 3 && o.x < x + s.w + 3 && y < o.y + q.h + 3 && o.y < y + s.h + 3;
                }) || (() => {
                    const f = this.productFrame?.element; if (!f) return false;
                    const fx = this.productFrame.x, fy = this.productFrame.y, fw = f.offsetWidth, fh = f.offsetHeight;
                    return x < fx + fw + 6 && fx < x + s.w + 6 && y < fy + fh + 6 && fy < y + s.h + 6;
                })();
                for (let k = 1; k <= 30; k++) { const x = t.x + k * (s.w + 4); if (!occupe(x, t.y)) return { x, y: t.y }; }
                for (let k = 1; k <= 30; k++) { const y = t.y + k * (s.h + 8); if (!occupe(t.x, y)) return { x: t.x, y }; }
                return { x: t.x + s.w + 4, y: t.y };
            }

            // Dupliquer : la même tuile, dans le même groupe de l'expression (𝑥 devient 2𝑥).
            dupliquerTuile(t) {
                this.saveState();
                playSound('pop');
                if (this.displayMode !== 'normal') { this.displayMode = 'normal'; this.isReduced = false; }
                const shown = this.shownSign(t);
                const pos = this.placeLibrePres(t);
                const id = this.nextId++;
                const el = document.createElement('div');
                ['token', `type-${t.type}`, 'in-bracket'].forEach(c => { if (c !== 'in-bracket' || t.element.classList.contains('in-bracket')) el.classList.add(c); });
                if (t.type === 'x' && t.orientation === 'v') el.classList.add('orient-v');
                el.classList.add(shown === 1 ? 'green' : 'red');
                el.innerHTML = `<span style="pointer-events:none;">${getTileLabel(t.type, shown)}</span>`;
                this.styleTileElement(el, t.type, shown);
                el.id = `t-${id}`;
                el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
                el.addEventListener('mousedown', (e) => this.handleDragStart(e));
                el.addEventListener('touchstart', (e) => this.handleDragStart(e), {passive: false});
                this.boardWorld.appendChild(el);
                const copie = { id, type: t.type, orientation: t.orientation, originalOrientation: t.originalOrientation || t.orientation,
                    sign: t.sign, displaySign: t.displaySign, element: el, x: pos.x, y: pos.y, pairId: null, packId: t.packId, ghostIds: [] };
                this.tokens.push(copie);
                const step = this.steps[this.stepIndexOfToken(t)];
                step.tokenIds.splice(step.tokenIds.indexOf(t.id) + 1, 0, id);
                el.animate([{ transform: 'scale(0.6)', opacity: 0.3 }, { transform: 'scale(1)', opacity: 1 }], { duration: 180, easing: 'ease-out' });
                this.updateEquation();
            }

            // Opposé : la tuile se retourne (𝑥 ↔ −𝑥). Elle passe en fin de son groupe : 𝑥 + 𝑥 + 𝑥 → 2𝑥 − 𝑥.
            opposeTuile(t) {
                this.saveState();
                if (this.displayMode !== 'normal') { this.displayMode = 'normal'; this.isReduced = false; }
                const avant = this.shownSign(t);
                t.sign = -t.sign; t.displaySign = t.sign;
                const step = this.steps[this.stepIndexOfToken(t)];
                step.tokenIds = step.tokenIds.filter(i => i !== t.id); step.tokenIds.push(t.id);
                t.packId = this.nextPackId++; this.packMeta[t.packId] = { order: this.nextPackOrder++ };
                this.lastPack = null;
                this.flipShown.set(t.id, avant);
                this.flipTileVisual(t, this.flipRun);
                this.checkOppositeAvailable();
                this.updateEquation();
            }

            // --- EQUATION TEXT ---
            updateEquation() {
                let displayString = "";
                displayString = this.productFrame?.mode === 'facto' ? this.factoLatex()
                    : (this.productFrame ? this.generateExpressionWithProductFrameLatex() : this.generateExpressionString(this.displayMode));
                // Espace moyen autour de + et − (avant, tout était collé : « 3x²+2x−(x−1) », peu lisible au tableau).
                displayString = displayString.replace(/\s+/g, "").replace(/\\;/g, "\\:").replace(/(\\,|\\quad|\\qquad)/g, "");
                katex.render(displayString, document.getElementById('equation-display'), { throwOnError: false });
                this.ajusterEquation();
                this.renderBracketFrames();
                
                const hasPending = this.steps.some(s => s.type === 'multiplication' && !s.distributed && s.isClosed && s.factor > 1);
                const distBtn = document.getElementById('btn-distribute');
                if (hasPending) distBtn.classList.remove('hidden'); else distBtn.classList.add('hidden');
            }

            // Une équation trop longue pour sa boîte (« 𝑥² + 3𝑥 + 2 = (𝑥 + 1)(𝑥 + 2) » au téléphone) rapetisse
            // jusqu'à tenir, au lieu de passer sous l'œil ; elle ne descend pas sous 13 px.
            ajusterEquation() {
                const eq = document.getElementById('equation-display');
                const boite = eq?.parentElement;
                if (!eq || !boite) return;
                eq.style.fontSize = '';
                const st = getComputedStyle(boite);
                const place = boite.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
                const besoin = eq.scrollWidth;
                if (place > 0 && besoin > place) {
                    const base = parseFloat(getComputedStyle(eq).fontSize);
                    eq.style.fontSize = Math.max(13, Math.floor(base * place / besoin * 0.97)) + 'px';
                }
            }

            generateExpressionString(mode, excludeProduct = false) {
                // FIX 2: Check for empty tokens and return 0 (User request: empty board = 0)
                const expressionTokens = excludeProduct ? this.tokens.filter(t => !t.productZone) : this.tokens;
                if (expressionTokens.length === 0) return "0";

                if (!excludeProduct && mode === 'ordered') return this.generateOrderedLatex();
                if (!excludeProduct && mode === 'reduced') return this.generateGroupedLatex();
                let latex = ""; let isEmpty = true;
                const stepHasTokens = (step) => (step?.tokenIds || []).some(id => {
                    const t = this.tokens.find(tok => tok.id === id);
                    return t && (!excludeProduct || !t.productZone);
                });
                const hasNonEmptyBefore = (idx) => { for(let i=0; i<idx; i++) if(stepHasTokens(this.steps[i])) return true; return false; };
                this.steps.forEach((step, index) => {
                    const toks = step.tokenIds.map(id => this.tokens.find(t => t.id === id)).filter(t => t && (!excludeProduct || !t.productZone));
                    if (!toks.length && (excludeProduct || index !== this.currentStepIndex || step.implicit)) return;
                    let content = this.tokensToSeparatedLatex(toks, true); if (!toks.length || content === "") content = (content==="" && toks.length>0) ? "" : "\\dots";
                    let pStr = "";
                    if (step.type === 'multiplication') {
                        if (step.distributed) {
                            // FIX: Sort tokens by ID (creation order) instead of type
                            // Use tokensToSeparatedLatex to preserve the group structure (e.g. -4x^2 instead of -2x^2 -2x^2)
                            const distributedToks = [...toks].sort((a,b) => a.id - b.id);
                            pStr = this.tokensToSeparatedLatex(distributedToks);
                        }
                        else pStr = step.factor + "(" + content + ")";
                    } else if (step.type === 'subtraction') {
                        if (step.distributed || !step.oppositeApplied) pStr = "(" + content + ")";
                        else pStr = this.tokensToSeparatedLatex(toks);
                    } else {
                        // Après « + » : 3x² + (−x). Après une parenthèse fermée, on écrit simplement − x.
                        pStr = content; if (index > 0 && !step.implicit && this.latexStartsWithMinus(pStr)) pStr = "(" + pStr + ")";
                    }
                    if (index > 0 && hasNonEmptyBefore(index)) {
                        const plus = this.colorLatex(this.getEquationOperatorColor(1), '+'); const minusColor = this.colorLatex(this.getEquationOperatorColor(-1), '-');
                        if (step.type === 'subtraction' && step.oppositeApplied) { if (!this.latexStartsWithMinus(pStr)) latex += `\\;${plus}\\;`; else pStr = this.spaceLeadingMinus(pStr); }
                        else if (step.type === 'multiplication' && step.distributed && this.latexStartsWithMinus(pStr)) { pStr = this.spaceLeadingMinus(pStr); }
                        else if (step.operator === '+' && !this.latexStartsWithMinus(pStr)) latex += `\\;${plus}\\;`;
                        else if (step.operator === '-') latex += `\\;${minusColor}\\;`;
                        else if (this.latexStartsWithMinus(pStr)) pStr = this.spaceLeadingMinus(pStr); // après une parenthèse fermée : ) − x
                    } else if (step.type === 'subtraction' && !step.oppositeApplied) {
                        // « − » en tout premier : −(x + 1). Avant, le moins disparaissait et on lisait (x + 1).
                        latex += this.colorLatex(this.getEquationOperatorColor(-1), '-');
                    }
                    latex += pStr; isEmpty = false;
                });
                
                // FIX: If result is empty string (e.g. all cancelled out), show 0
                if (latex === "") return "0";
                
                return isEmpty ? "\\dots" : latex;
            }
            tokensToSeparatedLatex(tokens, splitPacks = false) {
                if (!tokens || !tokens.length) return "";
                // FIX 2: Filter out tokens involved in a zero pair
                tokens = tokens.filter(t => t.pairId === null);

                const groups=[]; let cur=null;
                tokens.forEach(t=>{
                    const s=(t.displaySign===-1)?-1:1;
                    // L'orientation ne change pas la valeur : x horizontal et x vertical se lisent tous les deux x.
                    // On combine seulement les termes consécutifs de même type et même signe :
                    // x | x devient 2x, mais x | 1 | x reste x + 1 + x.
                    // splitPacks : deux groupes séparés par « + » restent séparés (x² + x², pas 2x²).
                    if(cur && cur.type===t.type && cur.s===s && (!splitPacks || cur.packId===t.packId)){
                        cur.c++;
                    } else {
                        if(cur) groups.push(cur);
                        cur={type:t.type,s:s,c:1,packId:t.packId};
                    }
                });
                if(cur)groups.push(cur);
                let l=""; let first=true;
                groups.forEach(g=>{
                    let term = (g.c===1?"":g.c)+(g.type==='x2'?"x^2":(g.type==='x'?"x":"")); if(g.type==='unit')term=String(g.c);
                    const col=this.getEquationColor(g.type, g.s);
                    const plusCol=this.getEquationOperatorColor(1);
                    const cTerm=this.colorLatex(col, term);
                    if(first) l+=(g.s===-1?this.colorLatex(col, "-"):"")+cTerm; else l+=(g.s===-1?`\\;${this.colorLatex(col, "-")}\\;`:`\\;${this.colorLatex(plusCol, "+")}\\;`)+cTerm;
                    first=false;
                });
                return l;
            }
            tokensToReducedSumLatex(tokens) {
                if (!tokens || !tokens.length) return "";

                // CORRECTION : Ordre imposé (x² -> x -> unit) au lieu de l'ordre de découverte
                const ord = ['x2', 'x', 'unit'];

                const c={x2:{p:0,n:0},x:{p:0,n:0},unit:{p:0,n:0}};
                tokens.forEach(t=>{ if(t._canceling || t.pairId !== null)return; if(t.sign===1)c[t.type].p++; else c[t.type].n++; });
                let l=""; let has=false;
                ord.forEach(ty=>{
                    if(c[ty].p>0) { 
                        const core=(c[ty].p===1&&ty!=='unit')?'':c[ty].p; const s=(ty==='x2'?'x^2':(ty==='x'?'x':'')); 
                        const col=this.getEquationColor(ty, 1);
                        const plusCol=this.getEquationOperatorColor(1);
                        const t=this.colorLatex(col, `${core}${s}`);
                        if(!has)l+=t; else l+=`\\;${this.colorLatex(plusCol, "+")}\\;`+t; has=true; 
                    }
                    if(c[ty].n>0) {
                        const core=(c[ty].n===1&&ty!=='unit')?'':c[ty].n; const s=(ty==='x2'?'x^2':(ty==='x'?'x':''));
                        const col=this.getEquationColor(ty, -1);
                        const t=this.colorLatex(col, `${core}${s}`);
                        if(!has)l+=this.colorLatex(col, "-")+t; else l+=`\\;${this.colorLatex(col, "-")}\\;`+t; has=true;
                    }
                });
                return l||"0";
            }
            generateOrderedLatex() { 
                // Group by Pack ID first
                const byPack = new Map();
                this.tokens.forEach(t => {
                    if (t.pairId !== null) return;
                    const pid = (typeof t.packId !== 'undefined') ? t.packId : -1;
                    if (!byPack.has(pid)) byPack.set(pid, []);
                    byPack.get(pid).push(t);
                });

                // Sort packs by order (preserves input sequence)
                const packs = Array.from(byPack.keys()).map(pid => ({
                    pid,
                    order: this.packMeta[pid]?.order ?? pid,
                    tokens: byPack.get(pid)
                })).sort((a, b) => a.order - b.order);

                let l = "";
                let first = true;

                // Standard Sort Order for types
                const types = [
                    {type:'x2', s:1}, {type:'x2', s:-1},
                    {type:'x', s:1}, {type:'x', s:-1},
                    {type:'unit', s:1}, {type:'unit', s:-1}
                ];

                types.forEach(spec => {
                    packs.forEach(p => {
                        const count = p.tokens.filter(t => t.type === spec.type && t.sign === spec.s).length;
                        if (count > 0) {
                            let term = (count === 1 && spec.type !== 'unit') ? "" : String(count);
                            if (spec.type === 'x2') term += "x^2";
                            else if (spec.type === 'x') term += "x";

                            const col = this.getEquationColor(spec.type, spec.s);
                            const plusCol = this.getEquationOperatorColor(1);
                            const cTerm = this.colorLatex(col, term);

                            if (first) {
                                l += (spec.s === -1 ? this.colorLatex(col, "-") : "") + cTerm;
                            } else {
                                l += (spec.s === -1 ? `\\;${this.colorLatex(col, "-")}\\;` : `\\;${this.colorLatex(plusCol, "+")}\\;`) + cTerm;
                            }
                            first = false;
                        }
                    });
                });

                return l || "0";
            } 

            generateGroupedLatex() { return this.tokensToReducedSumLatex(this.tokens); }
            // Un « − » en tête de morceau, collé à ce qui précède, s'écrivait sans espace (2x−x) :
            // dans {\color{…}{-}}, KaTeX le prend pour un signe et non une opération. On l'entoure d'espaces.
            spaceLeadingMinus(s) { return (s||'').replace(/^\{\\color\{[^}]+\}\{-\}\}/, m => `\\;${m}\\;`); }
            latexStartsWithMinus(s) { return (s||'').trim().startsWith('-') || /^\{\\color\{[^}]+\}\{-\}\}/.test(s||''); }
            

            getClientPoint(ev) {
                const src = ev.changedTouches && ev.changedTouches.length ? ev.changedTouches[0] : (ev.touches && ev.touches.length ? ev.touches[0] : ev);
                return { x: src.clientX, y: src.clientY };
            }

            // Lot 8 : la colonne de gauche (d'où viennent les tuiles) remplace la corbeille.
            isOverTileTrash(cx, cy) {
                const zone = document.getElementById('colonne-tuiles');
                if (!zone) return false;
                const r = zone.getBoundingClientRect();
                return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
            }

            setTileTrashActive(active) {
                const zone = document.getElementById('colonne-tuiles');
                if (zone) zone.classList.toggle('rangement', !!active);
            }

            deleteToken(token, save = true) {
                if (!token) return;
                if (save) this.saveState();
                playSound('pop');

                const ids = new Set([token.id]);
                if (Array.isArray(token.ghostIds)) token.ghostIds.forEach(id => ids.add(id));

                // Si on supprime un en-tête du tableau produit, on supprime aussi les cases de cette ligne/colonne
                // et on décale proprement les indices des autres cases.
                const removedTop = [];
                const removedLeft = [];
                const facto = this.productFrame?.mode === 'facto'; // Factoriser : enlever un côté laisse les tuiles du rectangle
                this.tokens.forEach(t => {
                    if (!ids.has(t.id) || facto) return;
                    if (t.productZone === 'top') removedTop.push(t.productIndex ?? 0);
                    if (t.productZone === 'left') removedLeft.push(t.productIndex ?? 0);
                });
                if (removedTop.length || removedLeft.length) {
                    this.tokens.forEach(t => {
                        if (t.productZone !== 'cell') return;
                        if (removedTop.includes(t.productCol ?? 0) || removedLeft.includes(t.productRow ?? 0)) ids.add(t.id);
                    });
                }

                // Si la tuile était dans une paire nulle, on libère l'autre tuile.
                this.tokens.forEach(t => {
                    if (!ids.has(t.id) || !t.pairId) return;
                    const partner = this.tokens.find(p => p.id === t.pairId);
                    if (partner && !ids.has(partner.id)) {
                        partner.pairId = null;
                        partner.element?.classList.remove('is-zero');
                        this.restoreTokenOrientation(partner);
                    }
                    const b = document.getElementById(`badge-${t.id}-${t.pairId}`) || document.getElementById(`badge-${t.pairId}-${t.id}`);
                    if (b) b.remove();
                });

                const removed = this.tokens.filter(t => ids.has(t.id));
                removed.forEach(t => t.element && t.element.remove());
                this.tokens = this.tokens.filter(t => !ids.has(t.id));
                this.steps.forEach(s => s.tokenIds = s.tokenIds.filter(id => !ids.has(id)));
                this.tokens.forEach(t => {
                    if (Array.isArray(t.ghostIds)) t.ghostIds = t.ghostIds.filter(id => !ids.has(id));
                    if (t.productZone === 'cell') {
                        t.productCol = (t.productCol ?? 0) - removedTop.filter(i => i < (t.productCol ?? 0)).length;
                        t.productRow = (t.productRow ?? 0) - removedLeft.filter(i => i < (t.productRow ?? 0)).length;
                    }
                });

                if (removed.some(t => t.productZone)) {
                    this.reindexProductHeaders('top');
                    this.reindexProductHeaders('left');
                    if (this.productFrame) {
                        this.renderProductFrame();
                        this.reflowProductFrameTokens();
                    }
                }
                this.checkOppositeAvailable();
                this.updateEquation();
            }

            handleDragStart(e) { 
                const el = e.target.closest('.token'); if(!el) return;
                const id = parseInt(el.id.split('-')[1]);
                if (this.currentTool !== 'hand') return; e.stopPropagation();
                if (e.button !== undefined && e.button !== 0) return; // clic droit : c'est la bulle (contextmenu)
                // Lot 8 : toucher une tuile SANS la bouger ouvre sa bulle (voir end()).
                const depart = this.getClientPoint(e);
                const toucher = { x: depart.x, y: depart.y, historique: this.history.length };
                // Factoriser : chaque tuile rangée (ou sortie) du rectangle s'annule avec ↶
                if (this.productFrame?.mode === 'facto') this.saveState();
                this.draggedToken = this.tokens.find(t => t.id === id);
                this.dragStartState = this.draggedToken ? {
                    x: this.draggedToken.x,
                    y: this.draggedToken.y,
                    orientation: this.draggedToken.orientation || 'h',
                    productZone: this.draggedToken.productZone,
                    productIndex: this.draggedToken.productIndex,
                    productRow: this.draggedToken.productRow,
                    productCol: this.draggedToken.productCol
                } : null;
                if(this.draggedToken.pairId) { 
                     const p=this.tokens.find(x=>x.id===this.draggedToken.pairId);
                     if(p){
                        p.pairId=null;
                        p.element.classList.remove('is-zero');
                        this.restoreTokenOrientation(p);
                     }
                     this.draggedToken.pairId=null;
                     this.draggedToken.element.classList.remove('is-zero');
                     this.restoreTokenOrientation(this.draggedToken);
                     const b=document.getElementById(`badge-${this.draggedToken.id}-${p?.id}`)||document.getElementById(`badge-${p?.id}-${this.draggedToken.id}`); if(b)b.remove();
                }
                el.classList.add('dragging');
                const r = el.getBoundingClientRect(); 
                this.dragOffset = { x: (e.touches?e.touches[0].clientX:e.clientX) - r.left, y: (e.touches?e.touches[0].clientY:e.clientY) - r.top };
                
                const move=(ev)=>{
                    ev.preventDefault();
                    const pt = this.getClientPoint(ev);
                    const cx = pt.x; const cy = pt.y;
                    const br = this.boardContainer.getBoundingClientRect();
                    const wx = (cx - br.left - this.pan.x - this.dragOffset.x)/this.scale;
                    const wy = (cy - br.top - this.pan.y - this.dragOffset.y)/this.scale;
                    this.draggedToken.element.style.left=wx+'px'; this.draggedToken.element.style.top=wy+'px';
                    this.draggedToken.x=wx; this.draggedToken.y=wy;
                    if (this.isFlipPending(this.draggedToken)) this.renderBracketFrames();
                    this.setTileTrashActive(this.isOverTileTrash(cx, cy));
                };
                const end=(ev)=>{
                    document.removeEventListener('mousemove',move); document.removeEventListener('touchmove',move);
                    document.removeEventListener('mouseup',end); document.removeEventListener('touchend',end);
                    if(this.draggedToken) {
                        this.draggedToken.element.classList.remove('dragging');
                        const pt = this.getClientPoint(ev || {});
                        if (this.isOverTileTrash(pt.x, pt.y)) {
                            const tokenToDelete = this.draggedToken;
                            if (this.dragStartState) {
                                tokenToDelete.x = this.dragStartState.x;
                                tokenToDelete.y = this.dragStartState.y;
                                tokenToDelete.orientation = this.dragStartState.orientation || tokenToDelete.orientation;
                                tokenToDelete.productZone = this.dragStartState.productZone;
                                tokenToDelete.productIndex = this.dragStartState.productIndex;
                                tokenToDelete.productRow = this.dragStartState.productRow;
                                tokenToDelete.productCol = this.dragStartState.productCol;
                            }
                            this.draggedToken=null;
                            this.dragStartState=null;
                            this.setTileTrashActive(false);
                            this.deleteToken(tokenToDelete, true);
                            return;
                        }
                        const tuile = this.draggedToken;
                        // Lot 8 : simple toucher (moins de 6 px) → la tuile reste où elle était et sa bulle s'ouvre.
                        const touche = Math.hypot(pt.x - toucher.x, pt.y - toucher.y) < 6;
                        if (touche && this.dragStartState) this.moveToken(tuile, this.dragStartState.x, this.dragStartState.y);
                        const productHandled = this.snapTokenToProductFrame(this.draggedToken);
                        if (!productHandled) this.checkSnapAndFinalize(this.draggedToken); // une paire nulle touchée se reforme
                        this.draggedToken=null; this.dragStartState=null; this.setTileTrashActive(false); this.updateEquation();
                        if (touche) {
                            this.history.length = Math.min(this.history.length, toucher.historique); // rien à annuler avec ↶
                            this.ouvrirBulle(tuile);
                        }
                    } else {
                        this.setTileTrashActive(false);
                    }
                };
                document.addEventListener('mousemove',move); document.addEventListener('touchmove',move,{passive:false});
                document.addEventListener('mouseup',end); document.addEventListener('touchend',end);
            }

            setTool(t) {
                if (t !== 'pen') t = 'hand'; // lot 8 : plus d'outil Pivoter ni Supprimer, la bulle les remplace
                this.currentTool = t;
                const p = t === 'pen';
                this.fermerBulle();
                this.boardContainer.classList.toggle('hide-cursor', p);
                document.getElementById('custom-cursor').style.display = p ? 'block' : 'none';
                this.updateToolButtons();
            }

            startDraw(e) {
                // Undo doit aussi annuler le stylo : on snapshot au début du trait
                this.saveState();
                this.fermerBulle();
                this.isDrawing = true;
                const p = this.getWorldPos(e.clientX, e.clientY);
                this.currentStroke = { color: '#2563eb', screenWidth: PEN_SCREEN_WIDTH, points: [p] };
                this.penStrokes.push(this.currentStroke);
                this.applyPenTransform();
                this.ctx.strokeStyle = this.currentStroke.color;
                this.ctx.lineWidth = this.getPenWorldWidth();
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                this.tracerTrait([p]);
            }

            // Lot 8 : on ne dessine que le nouveau bout du trait (avant : tout le trait, à chaque mouvement,
            // sur une toile de 12 000 × 12 000 points → saccadé). Même courbe que redrawPen.
            draw(events) {
                if (!this.isDrawing || !this.currentStroke) return;
                const pts = this.currentStroke.points;
                const c = this.ctx;
                this.applyPenTransform();
                c.strokeStyle = this.currentStroke.color;
                c.lineWidth = this.getPenWorldWidth();
                c.lineCap = 'round'; c.lineJoin = 'round';
                for (const ev of events) {
                    const p = this.getWorldPos(ev.clientX, ev.clientY);
                    const a = pts[pts.length - 1];
                    if (Math.abs(p.x - a.x) < 0.3 && Math.abs(p.y - a.y) < 0.3) continue;
                    pts.push(p);
                    const n = pts.length;
                    // du milieu (n-3, n-2) au milieu (n-2, n-1), en passant par le point n-2
                    const m0 = n >= 3 ? { x: (pts[n - 3].x + pts[n - 2].x) / 2, y: (pts[n - 3].y + pts[n - 2].y) / 2 } : pts[0];
                    const m1 = { x: (pts[n - 2].x + p.x) / 2, y: (pts[n - 2].y + p.y) / 2 };
                    c.beginPath();
                    c.moveTo(m0.x, m0.y);
                    c.quadraticCurveTo(pts[n - 2].x, pts[n - 2].y, m1.x, m1.y);
                    c.stroke();
                }
            }

            clearDrawing(saveToHistory = true) {
                if (saveToHistory) this.saveState();
                this.penStrokes = [];
                this.currentStroke = null;
                this.clearPenCanvas();
            }

            resizeCanvas() {
                // Lot 8 : toile HiDPI de la taille du plateau à l'écran (avant : 12 000 × 12 000 points dans le
                // plateau zoomé, que le navigateur repeignait à chaque mouvement du stylo → trait saccadé).
                const dpr = Math.min(window.devicePixelRatio || 1, MAX_CANVAS_DPR);
                const w = Math.max(1, this.boardContainer.clientWidth), h = Math.max(1, this.boardContainer.clientHeight);
                this.canvasPixelRatio = dpr;
                this.canvas.width = Math.round(w * dpr);
                this.canvas.height = Math.round(h * dpr);
                this.canvas.style.width = w + 'px';
                this.canvas.style.height = h + 'px';
                // IMPORTANT : resize efface la toile -> on redessine les traits
                this.redrawPen();
            }

            moveCursor(e) {
                if (this.currentTool !== 'pen') return;
                const c = document.getElementById('custom-cursor');
                c.style.left = e.clientX + 'px';
                c.style.top = e.clientY + 'px';
                c.style.transform = 'translate(-7px,-7px)';
            }
        }

        const app = new AlgebraApp();
    </script>
</body>
</html>
