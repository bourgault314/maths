        /* --- STYLES DES TUILES --- */
        .token {

            transform-origin: 0 0;

        .token.dragging {

        /* STYLE DU FANTÔME (DRAG MENU) */

        }

        /* Classe pour la transition fluide de taille lors du drag */

        @keyframes vanish {

        /* Paire nulle : les deux tuiles empilées deviennent une seule tuile grise.

    <div id="custom-cursor">
        
        <!-- Curseur : petite croix (pour le plateau, en mode stylo) -->
        <svg class="drop-shadow-lg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 1v12" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
            <path d="M1 7h12" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>

    <header class="bg-white p-2 shadow-md z-30 flex flex-wrap items-center gap-4 shrink-0">
        <div id="barre-outils" class="flex flex-wrap items-center gap-2">
            <!-- UNDO BUTTON -->
            <button onclick="app.undo()" class="bg-blue-100 text-blue-600 hover:bg-blue-200 p-2 rounded-lg font-bold border border-blue-200 shadow-sm flex items-center gap-1 active:scale-95 transition" title="Précédent (Annuler)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                </svg>
            </button>

            <!-- RESET BOARD BUTTON -->
            <button onclick="app.resetBoard()" class="bg-rose-100 text-rose-600 hover:bg-rose-200 p-2 rounded-lg font-bold border border-rose-200 shadow-sm flex items-center gap-1 active:scale-95 transition" title="Tout recommencer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v6h6M20 20v-6h-6" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 9a8 8 0 00-13.66-3.66L4 7.68M4 15a8 8 0 0013.66 3.66L20 16.32" />
                </svg>
            </button>

            <div class="h-8 w-px bg-slate-200 mx-1"></div>

            <!-- OUTILS (lot 8) : le stylo s'allume et s'éteint d'un clic (Échap l'éteint aussi), la gomme efface
                 ses traits. La main, Pivoter et la corbeille sont partis : toucher une tuile ouvre sa bulle
                 (Pivoter, Dupliquer, Opposé, Supprimer), et une tuile glissée dans la colonne de gauche s'enlève. -->
            <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-lg">
            <button onclick="app.setTool(app.currentTool === 'pen' ? 'hand' : 'pen')" id="tool-pen" class="p-2 rounded text-gray-500 hover:bg-gray-200" title="Stylo : un clic pour écrire, un autre pour revenir aux tuiles" aria-label="Stylo" aria-pressed="false">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20l4.2-1.1L19.1 8a2.1 2.1 0 00-3-3L5.2 15.9 4 20z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.5 6.5l3 3"/>
                </svg>
            </button>

<button onclick="app.clearDrawing()" id="btn-clear-drawing" class="p-2 rounded text-gray-500 hover:bg-gray-200" title="Effacer le stylo">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 16.5l7.9-7.9a2 2 0 012.8 0l2.7 2.7a2 2 0 010 2.8l-5.2 5.2H8.2L5 16.5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.8 9.7l5.5 5.5" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.8 20h16.4" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M6.2 5.7h3.2M7.8 4.1v3.2" opacity=".65" />
                </svg>
            </button>
            </div>
            <button id="btn-distribute" onclick="app.applyDistribution()" class="hidden btn-distribute bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-4 rounded-lg shadow-md border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition text-sm">Développer</button>
            <div class="h-8 w-px bg-slate-200 mx-1"></div>
            
            <div id="ops-panel" class="flex gap-1 items-center">
                <div class="flex gap-1 items-center bg-blue-50 rounded-full p-1 border border-blue-100">
                    <button onclick="app.separatePack()" class="w-10 h-10 bg-blue-100 text-blue-700 rounded-full border-2 border-blue-400 font-bold text-xl active:scale-95 transition hover:bg-blue-200" title="Séparer les groupes">+</button>
                </div>
                <div class="flex gap-1 items-center bg-orange-50 rounded-full p-1 border border-orange-100">
                    <button onclick="app.setOperator('subtract')" class="w-10 h-10 bg-orange-100 text-orange-700 rounded-full border-2 border-orange-400 font-bold text-xl active:scale-95 transition hover:bg-orange-200" title="Soustraire (Ouvrir parenthèse)">-</button>
                    <button id="btn-close-parenthesis" onclick="app.closeParenthesis()" class="hidden w-10 h-10 bg-orange-500 text-white rounded-full border-2 border-orange-700 font-bold text-xl active:scale-95 transition shadow-lg animate-pulse" title="Fermer parenthèse"> ) </button>
                </div>
                <!-- TAPER (lot 4) : ouvre le pavé pour taper une expression -->
                <button id="btn-taper" type="button" onclick="app.basculerTaper()" aria-expanded="false" aria-controls="taper-panneau" title="Taper une expression">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>Taper
                </button>
                <button id="btn-opposite" onclick="app.applyOpposite()" class="hidden btn-opposite ml-2 bg-orange-600 text-white px-3 py-1 rounded-full font-bold shadow-lg border-b-4 border-orange-800 active:border-b-0 active:translate-y-1 text-xs sm:text-sm uppercase tracking-wide flex flex-col items-center leading-none py-2"><span class="text-xs sm:text-sm leading-none">Ajouter l'opposé</span></button>
            </div>
        </div>

        <div class="eq-zone flex-1 flex flex-col items-center justify-center min-w-[200px] px-2">
            <div class="relative w-full">
                <div id="eq-boite" class="flex items-center gap-2 bg-slate-50 pl-4 pr-12 py-2 rounded-xl border border-slate-200 shadow-inner mb-1 w-full justify-start overflow-x-auto no-scrollbar">
                    <div id="equation-display" class="text-xl sm:text-3xl font-bold text-slate-600 tracking-tight flex items-center gap-1 font-mono whitespace-nowrap transition-all duration-300">(...)</div>
                </div>
                <button id="btn-toggle-eye" onclick="app.toggleVisibility()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-white/80 hover:bg-white rounded-full text-slate-400 hover:text-slate-600 shadow-sm border border-slate-200 transition z-10" title="Afficher/Masquer l'équation">
                    <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M3 3l18 18" />
                    </svg>
                </button>
            </div>
        </div>

        
        <!-- VUE : recentrer, son, plein écran -->
        <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-lg">

            <button onclick="app.resetView()" id="btn-reset-view" class="p-2 rounded text-gray-500 hover:bg-gray-200" title="Recentrer la vue">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 0116 0 8 8 0 01-16 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v8m-4-4h8"/>
                </svg>
            </button>

            <button onclick="app.toggleSound()" id="btn-sound" class="p-2 rounded text-gray-500 hover:bg-gray-200" title="Son : on/off">
                <svg id="icon-sound-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5l-5 4H3v6h3l5 4V5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.54 8.46a5 5 0 010 7.07"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.07 4.93a10 10 0 010 14.14"/>
                </svg>
                <svg id="icon-sound-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5l-5 4H3v6h3l5 4V5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 9l4 4m0-4l-4 4"/>
                </svg>
            </button>

            <button onclick="app.toggleFullscreen()" id="btn-fullscreen" class="p-2 rounded text-gray-500 hover:bg-gray-200" title="Plein écran">
                <svg id="icon-fs-enter" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 9V4h5M4 4l6 6M20 9V4h-5M20 4l-6 6M4 15v5h5M4 20l6-6M20 15v5h-5M20 20l-6-6"/>
                
                </svg>
                <svg id="icon-fs-exit" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5 5l4 4M9 9V6M9 9H6M19 5l-4 4M15 9V6M15 9H18M5 19l4-4M9 15V18M9 15H6M19 19l-4-4M15 15V18M15 15H18"/>
                
                </svg>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <aside id="colonne-tuiles" class="w-28 bg-slate-50 border-r border-slate-300 flex flex-col items-center py-4 gap-4 z-20 shadow-lg shrink-0 overflow-y-auto select-none">
            
            <span class="text-[9px] font-bold text-slate-400 uppercase leading-tight">Tuiles</span>
            <div class="flex flex-col gap-2 w-full px-1 items-center">
                <!-- x² pair -->
                <div class="flex gap-2">
                    <button onmousedown="app.handleSidebarTouchStart(event, 'x2', 1)" ontouchstart="app.handleSidebarTouchStart(event, 'x2', 1)" class="tile-btn w-10 h-10" title="+x²"><div data-preview-type="x2" data-preview-sign="1" class="preview-shape ps-green w-8 h-8 text-sm">𝑥²</div></button>
                    <button onmousedown="app.handleSidebarTouchStart(event, 'x2', -1)" ontouchstart="app.handleSidebarTouchStart(event, 'x2', -1)" class="tile-btn w-10 h-10" title="-x²"><div data-preview-type="x2" data-preview-sign="-1" class="preview-shape ps-red w-8 h-8 text-sm">-𝑥²</div></button>
                </div>
                <!-- x pair horizontal -->
                <div class="flex gap-2">
                    <button onmousedown="app.handleSidebarTouchStart(event, 'x', 1, 'h')" ontouchstart="app.handleSidebarTouchStart(event, 'x', 1, 'h')" class="tile-btn w-12 h-8" title="+x horizontal"><div data-preview-type="x" data-preview-sign="1" class="preview-shape ps-green w-10 h-[14px] text-sm">𝑥</div></button>
                    <button onmousedown="app.handleSidebarTouchStart(event, 'x', -1, 'h')" ontouchstart="app.handleSidebarTouchStart(event, 'x', -1, 'h')" class="tile-btn w-12 h-8" title="-x horizontal"><div data-preview-type="x" data-preview-sign="-1" class="preview-shape ps-red w-10 h-[14px] text-sm">-𝑥</div></button>
                </div>
                <!-- x pair vertical -->
                <div class="flex gap-2">
                    <button onmousedown="app.handleSidebarTouchStart(event, 'x', 1, 'v')" ontouchstart="app.handleSidebarTouchStart(event, 'x', 1, 'v')" class="tile-btn w-8 h-12" title="+x vertical"><div data-preview-type="x" data-preview-sign="1" class="preview-shape ps-green w-5 h-10 text-[10px]">𝑥</div></button>
                    <button onmousedown="app.handleSidebarTouchStart(event, 'x', -1, 'v')" ontouchstart="app.handleSidebarTouchStart(event, 'x', -1, 'v')" class="tile-btn w-8 h-12" title="-x vertical"><div data-preview-type="x" data-preview-sign="-1" class="preview-shape ps-red w-5 h-10 text-[10px]">-𝑥</div></button>
                </div>
                <!-- 1 pair -->
                <div class="flex gap-2">
                    <button onmousedown="app.handleSidebarTouchStart(event, 'unit', 1)" ontouchstart="app.handleSidebarTouchStart(event, 'unit', 1)" class="tile-btn w-8 h-8" title="+1"><div data-preview-type="unit" data-preview-sign="1" class="preview-shape ps-green w-6 h-6 text-xs font-normal">1</div></button>
                    <button onmousedown="app.handleSidebarTouchStart(event, 'unit', -1)" ontouchstart="app.handleSidebarTouchStart(event, 'unit', -1)" class="tile-btn w-8 h-8" title="-1"><div data-preview-type="unit" data-preview-sign="-1" class="preview-shape ps-red w-6 h-6 text-xs font-normal">-1</div></button>
                </div>
            </div>

            <div class="w-16 h-px bg-slate-200"></div>

            <div class="flex flex-col gap-1 w-full px-2 items-center">
                <span class="text-[9px] font-bold text-slate-400 uppercase text-center leading-tight">Couleurs</span>
                <select id="color-mode-select" class="w-full text-[11px] font-bold text-slate-700 border border-slate-300 rounded bg-white px-2 py-1.5 shadow-sm">
                    <option value="sign" selected>Vert rouge</option>
                    <option value="blueyellow">Bleu jaune</option>
                    <option value="mathigon">Mathigon</option>
                    <option value="bw">Blanc gris</option>
                </select>
            </div>

            <div class="w-16 h-px bg-slate-200"></div>

            <div class="flex flex-col gap-2 w-full px-2 items-center">
                <span class="text-[9px] font-bold text-slate-400 uppercase text-center leading-tight">Produit</span>
                <button onclick="app.createProductFrame()" class="w-full py-2 bg-white border border-purple-300 rounded text-[11px] font-bold text-purple-700 shadow-sm active:bg-purple-50 hover:bg-purple-50 transition" title="Ajouter un tableau produit">Tableau produit</button>
                <button id="btn-factoriser" onclick="app.lancerFactoriser()" class="w-full py-2 bg-white border border-purple-300 rounded text-[11px] font-bold text-purple-700 shadow-sm active:bg-purple-50 hover:bg-purple-50 transition" title="Factoriser : ranger les tuiles du plateau en rectangle">Factoriser</button>
            </div>

            <div class="w-16 h-px bg-slate-200"></div>

            <div class="flex flex-col gap-2 w-full px-2 items-center">
                <span class="text-[9px] font-bold text-slate-400 uppercase text-center leading-tight">Actions</span>
                
                <button id="btn-order" onclick="app.orderAll()" class="w-full py-2 bg-white border border-blue-300 rounded text-[11px] font-bold text-blue-700 shadow-sm active:bg-blue-50 hover:bg-blue-50 transition" title="Ordonner les tuiles">Ordonner</button>
                
                <button id="btn-reduce" onclick="app.reduceExpression()" class="w-full py-2 bg-white border border-yellow-300 rounded text-[11px] font-bold text-yellow-700 shadow-sm active:bg-yellow-50 hover:bg-yellow-50 transition" title="Réduire (regrouper les termes)">Réduire</button>
                
                <button id="btn-simplify" onclick="app.autoSimplify()" class="w-full py-2 bg-white border border-yellow-300 rounded text-[11px] font-bold text-yellow-700 shadow-sm active:bg-yellow-50 hover:bg-yellow-50 transition" title="Simplifier (annuler + et -)">Simplifier</button>
            </div>
        </aside>

        <main id="board" class="flex-1 relative bg-white overflow-hidden">
            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: linear-gradient(#94a3b8 1px, transparent 1px), linear-gradient(90deg, #94a3b8 1px, transparent 1px); background-size: 40px 40px;"></div>
            <div id="board-container">
                <div id="board-world"></div>
                <!-- Lot 8 : le stylo dessine sur une toile de la taille de l'écran, posée sur le plateau
                     (avant : une toile de 12 000 × 12 000 points dans le plateau zoomé → trait saccadé). -->
                <canvas id="drawing-canvas"></canvas>
            </div>
        </main>
    </div>


    <!-- LOT 8 : la bulle d'une tuile (toucher une tuile sans la bouger, ou clic droit). Les boutons qui ne
         s'appliquent pas à la tuile touchée sont cachés (ex. Pivoter sur un carré). -->
    <div id="bulle-tuile" role="toolbar" aria-label="Actions sur la tuile" hidden>
        <button type="button" data-action="pivoter" title="Pivoter la tuile 𝑥 (couchée ↔ debout)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="1" y="13" width="9" height="5" stroke-width="2" stroke-linejoin="round"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15.5h4.5M13.8 13.5l2 2-2 2"/><rect x="17.5" y="3" width="5" height="17" stroke-width="2" stroke-linejoin="round"/></svg>Pivoter</button>
        <button type="button" data-action="dupliquer" title="Poser une tuile pareille à côté">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="1" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8V4a1 1 0 00-1-1H4a1 1 0 00-1 1v11a1 1 0 001 1h4"/></svg>Dupliquer</button>
        <button type="button" data-action="oppose" title="Remplacer la tuile par son opposé">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18L3 21z" fill="#72c475" stroke="#2f7f35" stroke-width="1.5" stroke-linejoin="round"/><path d="M21 3v18H3z" fill="#ef3f35" stroke="#a61f18" stroke-width="1.5" stroke-linejoin="round"/></svg>Opposé</button>
        <button type="button" data-action="supprimer" class="bulle-suppr" title="Enlever la tuile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"/></svg>Supprimer</button>
    </div>

    <!-- TAPER UNE EXPRESSION (lot 4, 06/11/2026) : le pavé, posé sur le plateau -->
    <div id="taper-panneau" role="dialog" aria-label="Taper une expression" hidden>
        <div class="taper-ligne">
            <div id="taper-champ" role="textbox" tabindex="0" aria-label="Expression à taper"></div>
            <button type="button" class="taper-fermer" onclick="app.fermerTaper()" title="Fermer" aria-label="Fermer">×</button>
        </div>
        <div id="taper-lis" class="taper-lis" aria-live="polite"></div>
        <div id="taper-pave">
            <button type="button" data-touche="7">7</button><button type="button" data-touche="8">8</button><button type="button" data-touche="9">9</button><button type="button" class="lettre" data-touche="x²">𝑥²</button><button type="button" class="par" data-touche="(">(</button><button type="button" class="eff" data-touche="retour" aria-label="Effacer le dernier signe">⌫</button>
            <button type="button" data-touche="4">4</button><button type="button" data-touche="5">5</button><button type="button" data-touche="6">6</button><button type="button" class="lettre" data-touche="x">𝑥</button><button type="button" class="par" data-touche=")">)</button><button type="button" class="eff tout" data-touche="effacer">Tout<br>effacer</button>
            <button type="button" data-touche="1">1</button><button type="button" data-touche="2">2</button><button type="button" data-touche="3">3</button><button type="button" data-touche="0">0</button><button type="button" class="op" data-touche="+">+</button><button type="button" class="op" data-touche="−">−</button>
        </div>
        <button type="button" id="taper-poser" onclick="app.taperPoser()" disabled>✓ Poser les tuiles</button>
        <div class="taper-aide">Au clavier : x2 ou x^2 pour 𝑥², puis Entrée</div>
    </div>
    <script>
        const SNAP_THRESHOLD = 60;
        const INITIAL_SCALE = 1.45; // Zoom de départ : plus proche du tableau dès l'ouverture
        // Zoom de départ adapté au plateau : on veut voir au moins INITIAL_VIEW_WORLD × INITIAL_VIEW_WORLD_H
        // (en unités de plateau). Avant, 1,45 partout : au téléphone, une tuile x² remplissait l'écran.
        // Au tableau (1920) et sur ordinateur (1366), la limite 1,45 reste celle qui s'applique.
        const INITIAL_VIEW_WORLD = 400;   // environ trois tuiles x² côte à côte
        const INITIAL_VIEW_WORLD_H = 300;
        const MIN_SCALE = 0.5, MAX_SCALE = 3;
        const PRODUCT_FRAME_BORDER = 3; // bord des tableaux (.product-frame, border: 3px) : compté dans leur taille
        const FLIP_HALF_MS = 170;   // « Ajouter l'opposé » : durée d'un demi-retournement
        const FLIP_STAGGER_MS = 230; // délai entre deux tuiles retournées
        const PEN_SCREEN_WIDTH = 2.2; // Épaisseur visuelle du stylo, compensée selon le zoom
        const MAX_CANVAS_DPR = 2;
        const PACK_GAP = 25; // Espace constant de 25px
        const SIZES = { 'unit': { w: 34, h: 34 }, 'x': { w: 110, h: 34 }, 'x2': { w: 110, h: 110 } };
        const COLORS = { pos: 'green', neg: 'red', orange: 'orange' };
        function getTileSize(type, orientation = 'h') {
            if (type === 'x' && orientation === 'v') return { w: SIZES.unit.w, h: SIZES.x.w };
            return SIZES[type];
        }
        function getTileLabel(type, sign) {
            if (type === 'x2') return sign === 1 ? '𝑥²' : '-𝑥²';
            if (type === 'x') return sign === 1 ? '𝑥' : '-𝑥';
            return sign === 1 ? '1' : '-1';
        }
        const TILE_COLOR_MODES = {
            blueyellow: {
                positive: { bg: '#2f8fc9', border: '#1f5f8c', text: '#111827', eq: '#2f8fc9' },
                negative: { bg: '#ffe64c', border: '#b59a11', text: '#111827', eq: '#b59a11' }
            },
            sign: {
                positive: { bg: '#72c475', border: '#2f7f35', text: '#111827', eq: '#2f7f35' },
                negative: { bg: '#ef3f35', border: '#a61f18', text: '#111827', eq: '#ef3f35' }
            },
            bw: {
                positive: { bg: '#ffffff', border: '#222222', text: '#111827', eq: '#111827' },
                negative: { bg: '#dedede', border: '#666666', text: '#111827', eq: '#7a7a7a' }
            },
            mathigon: {
                x2:   { bg: '#2f8fc9', border: '#1f5f8c', text: '#111827', eq: '#2f8fc9' },
                x:    { bg: '#72c475', border: '#2f7f35', text: '#111827', eq: '#2f7f35' },
                unit: { bg: '#ffe64c', border: '#b59a11', text: '#111827', eq: '#b59a11' },
                negative: { bg: '#ef3f35', border: '#a61f18', text: '#111827', eq: '#ef3f35' }
            }
        };
                // --- SON (avec bouton on/off + AudioContext créé à la demande) ---
        let soundEnabled = false;
        let audioCtx = null;

        function ensureAudioCtx() {
            if (!soundEnabled) return null;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    // Resume peut échouer hors geste utilisateur : on ignore proprement
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            } catch (e) {
                return null;
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = ensureAudioCtx();
            if (!ctx) return;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            const now = ctx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'snap') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'flip') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'magic') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'whoosh') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // === LECTURE DE L'EXPRESSION TAPÉE (lot 4, 06/11/2026) ===
        // « Taper » : le texte du champ devient une liste de tuiles. Fonctions pures (sans la page),
        // testées seules par tests/tuiles-algebriques-lot-4.test.mjs.
        // Ce qu'on peut taper : 𝑥², 𝑥, des nombres entiers, +, −, une paire de parenthèses à la fois
        // (−( ) retournée au clic sur « Ajouter l'opposé », comme au bouton −), et un produit seul de
        // deux facteurs sans 𝑥², 2(𝑥 + 1) ou (𝑥 + 1)(𝑥 − 2), posé dans le tableau produit.
        const TAPER_MAX_PAR_TERME = 20; // choix du 06/11 : 20 tuiles au plus par terme
        const TAPER_AIDE = 'On peut taper : 𝑥², 𝑥, des nombres, +, − et des parenthèses.';

        // Le texte tel qu'on le range dans le champ : sans espace, un seul signe moins, 𝑥 écrit x,
        // x2 et x^2 écrits x². Les positions des erreurs se comptent dans CE texte.
        function normaliserSaisie(s) {
            return String(s || '')
                .replace(/[\s  ]+/g, '')
                .replace(/[X𝑥]/gu, 'x')
                .replace(/[-–—‐‑]/g, '−')
                .replace(/[*·∙⋅]/g, '×')
                .replace(/x\^2/g, 'x²')
                .replace(/x2/g, 'x²');
        }

        function lireExpressionTapee(brut) {
            const s = normaliserSaisie(brut);
            if (!s) return { ok: false, vide: true, texte: s };
            const erreur = (message, start, end, aide = false) => ({ ok: false, message, start, end, aide, texte: s });
            const incomplet = () => ({ ok: false, incomplet: true, texte: s });

            // 1) les morceaux
            const toks = [];
            for (let i = 0; i < s.length;) {
                const c = s[i];
                if (/[0-9]/.test(c)) {
                    let j = i; while (j < s.length && /[0-9]/.test(s[j])) j++;
                    toks.push({ k: 'num', v: parseInt(s.slice(i, j), 10), start: i, end: j }); i = j; continue;
                }
                if (c === 'x') {
                    if (s[i + 1] === '²') { toks.push({ k: 'x', p: 2, start: i, end: i + 2 }); i += 2; continue; }
                    if (s[i + 1] === '³' || (s[i + 1] === '^' && /[0-9]/.test(s[i + 2] || ''))) {
                        return erreur('Les tuiles s’arrêtent à 𝑥².', i, i + (s[i + 1] === '³' ? 2 : 3));
                    }
                    if (s[i + 1] === '^') { if (i + 2 >= s.length) return incomplet(); return erreur('Après « ^ », seulement 2 : 𝑥^2 s\u2019écrit 𝑥².', i, i + 3); }
                    toks.push({ k: 'x', p: 1, start: i, end: i + 1 }); i += 1; continue;
                }
                if (c === '+' || c === '−') { toks.push({ k: 'op', v: c === '+' ? 1 : -1, start: i, end: i + 1 }); i++; continue; }
                if (c === '(') { toks.push({ k: '(', start: i, end: i + 1 }); i++; continue; }
                if (c === ')') { toks.push({ k: ')', start: i, end: i + 1 }); i++; continue; }
                if (c === '×') { toks.push({ k: '×', start: i, end: i + 1 }); i++; continue; }
                if (c === '²') return erreur('« ² » se tape juste après 𝑥.', i, i + 1);
                const car = Array.from(s.slice(i))[0];
                return erreur(`Je ne connais pas « ${car} ».`, i, i + car.length, true);
            }

            // 2) la structure : somme d'éléments, chaque élément un terme, une parenthèse ou un produit
            let pos = 0;
            const voir = () => toks[pos];
            const terme = () => { // [nombre] [𝑥 ou 𝑥²]
                const t = voir(); if (!t) return null;
                if (t.k === 'num') {
                    pos++;
                    const n = voir();
                    if (n && n.k === 'x') { pos++; return { n: 'terme', type: n.p === 2 ? 'x2' : 'x', count: t.v, start: t.start, end: n.end }; }
                    return { n: 'terme', type: 'unit', count: t.v, start: t.start, end: t.end };
                }
                if (t.k === 'x') { pos++; return { n: 'terme', type: t.p === 2 ? 'x2' : 'x', count: 1, start: t.start, end: t.end }; }
                return null;
            };
            let profondeur = 0;
            const somme = () => { // [signe] élément (signe élément)*
                const items = [];
                let signe = 1, signeTok = null;
                if (voir() && voir().k === 'op') { signeTok = voir(); signe = signeTok.v; pos++; }
                for (;;) {
                    const t = voir();
                    if (!t) return { incomplet: true };
                    if (t.k === 'op') return { err: erreur('Deux signes de suite : mets une parenthèse, comme + (−2).', (signeTok || t).start, t.end) };
                    if (t.k === ')') return { err: erreur(signeTok ? 'Il manque un terme après le signe.' : 'Parenthèse « ) » sans « ( ».', t.start, t.end) };
                    if (t.k === '×') return { err: erreur('Il manque un facteur avant « × ».', t.start, t.end) };
                    const el = element();
                    if (el.err || el.incomplet) return el;
                    items.push({ signe, el, start: signeTok ? signeTok.start : el.start, end: el.end });
                    const n = voir();
                    if (!n || n.k === ')') return { items };
                    if (n.k === 'op') { signeTok = n; signe = n.v; pos++; continue; }
                    // deux termes collés sans signe : 2𝑥 3, 𝑥𝑥…
                    const prec = toks[pos - 1];
                    if (n.k === 'x' && prec.k === 'x') return { err: erreur('Écris 𝑥² plutôt que 𝑥𝑥.', prec.start, n.end) };
                    return { err: erreur('Il manque + ou − ici.', prec.start, n.end) };
                }
            };
            const facteur = () => { // un terme ou une parenthèse
                const t = voir();
                if (!t) return { incomplet: true };
                if (t.k === '(') {
                    pos++; profondeur++;
                    if (profondeur > 1) return { err: erreur('Une seule paire de parenthèses à la fois.', t.start, t.end) };
                    if (voir() && voir().k === ')') return { err: erreur('Parenthèses vides.', t.start, voir().end) };
                    const r = somme();
                    if (r.err || r.incomplet) return r;
                    const f = voir();
                    if (!f) return { incomplet: true };
                    pos++; profondeur--;
                    return { n: 'groupe', items: r.items, start: t.start, end: f.end };
                }
                const te = terme();
                if (te) return te;
                return { err: erreur('Il manque un terme ici.', t.start, t.end) };
            };
            const element = () => { // un facteur, ou plusieurs facteurs = un produit
                const premier = facteur();
                if (premier.err || premier.incomplet) return premier;
                const facteurs = [premier];
                for (;;) {
                    const n = voir();
                    const derniere = facteurs[facteurs.length - 1];
                    let colle = false;
                    if (n && n.k === '×') { pos++; colle = true; if (!voir()) return { incomplet: true }; }
                    else if (n && n.k === '(') colle = true;
                    else if (n && (n.k === 'num' || n.k === 'x') && derniere.n === 'groupe') colle = true;
                    if (!colle) break;
                    const f = facteur();
                    if (f.err || f.incomplet) return f;
                    facteurs.push(f);
                }
                if (facteurs.length === 1) return premier;
                return { n: 'produit', facteurs, start: premier.start, end: facteurs[facteurs.length - 1].end };
            };

            const r = somme();
            if (r.incomplet) return incomplet();
            if (r.err) return r.err;
            if (pos < toks.length) { const t = toks[pos]; return erreur('Parenthèse « ) » sans « ( ».', t.start, t.end); }

            // 3) les tuiles
            const tuiles = (te, signe) => {
                if (te.count === 0) return { err: erreur('« 0 » ne pose aucune tuile.', te.start, te.end) };
                if (te.count > TAPER_MAX_PAR_TERME) return { err: erreur(`${TAPER_MAX_PAR_TERME} tuiles au plus par terme.`, te.start, te.end) };
                return { type: te.type, sign: signe, count: te.count, start: te.start, end: te.end };
            };
            const termesDuGroupe = (items) => {
                const out = [];
                for (const it of items) {
                    if (it.el.n !== 'terme') return { err: erreur(it.el.n === 'produit' ? 'Un produit se tape seul, par exemple 2(𝑥 + 1).' : 'Une seule paire de parenthèses à la fois.', it.el.start, it.el.end) };
                    const t = tuiles(it.el, it.signe); if (t.err) return t; out.push(t);
                }
                return { termes: out };
            };

            const produit = r.items.find(it => it.el.n === 'produit');
            if (produit) {
                if (r.items.length > 1) return erreur('Un produit se tape seul, par exemple 2(𝑥 + 1) ou (𝑥 + 1)(𝑥 − 2).', produit.el.start, produit.el.end);
                const fs = produit.el.facteurs;
                if (fs.length > 2) return erreur('Deux facteurs au plus.', fs[2].start, fs[fs.length - 1].end);
                const facteurs = [];
                for (let i = 0; i < 2; i++) {
                    const f = fs[i];
                    const lu = f.n === 'groupe' ? termesDuGroupe(f.items) : termesDuGroupe([{ signe: 1, el: f }]);
                    if (lu.err) return lu.err;
                    const x2 = lu.termes.find(t => t.type === 'x2');
                    if (x2) return erreur('Dans un produit, seulement des 𝑥 et des nombres.', x2.start, x2.end);
                    // le signe tapé devant le produit (−2(𝑥 + 1)) ira au premier facteur, à la pose
                    facteurs.push({ termes: lu.termes, groupe: f.n === 'groupe', moinsDevant: i === 0 && produit.signe === -1 });
                }
                return { ok: true, kind: 'product', facteurs, texte: s };
            }

            const segments = [];
            const plat = () => { let d = segments[segments.length - 1]; if (!d || d.kind !== 'plain') { d = { kind: 'plain', terms: [] }; segments.push(d); } return d; };
            for (let i = 0; i < r.items.length; i++) {
                const it = r.items[i];
                if (it.el.n === 'terme') { const t = tuiles(it.el, it.signe); if (t.err) return t.err; plat().terms.push(t); continue; }
                const lu = termesDuGroupe(it.el.items); if (lu.err) return lu.err;
                if (it.signe === -1) segments.push({ kind: 'minus', terms: lu.termes });
                else if (i === 0) lu.termes.forEach(t => plat().terms.push(t)); // (𝑥 + 1) au début : rien à séparer
                else segments.push({ kind: 'plus', terms: lu.termes });
            }
            return { ok: true, kind: 'sum', segments, texte: s };
        }
        // === FIN DE LA LECTURE DE L'EXPRESSION TAPÉE ===

        // === FACTORISER : ANALYSE DU RECTANGLE (lot 5, 06/11/2026) ===
        // L'élève range les tuiles de l'expression dans un tableau qui s'agrandit (une case = une tuile), puis
        // pose les côtés. Chaque tuile a deux côtés, 'x' (long) ou '1' (court) : 𝑥² = 𝑥 × 𝑥, 𝑥 couché = 𝑥 × 1,
        // 𝑥 debout = 1 × 𝑥, 1 = 1 × 1. Dans une colonne, toutes les tuiles ont la même largeur ; dans une
        // ligne, la même hauteur ; et chaque case = côté de sa ligne × côté de sa colonne, signes compris.
        function factoDims(type, orientation) {
            if (type === 'x2') return { l: 'x', h: 'x' };
            if (type === 'x') return orientation === 'v' ? { l: '1', h: 'x' } : { l: 'x', h: '1' };
            return { l: '1', h: '1' };
        }
        function factoCote(type) { return type === 'x' ? 'x' : (type === 'unit' ? '1' : null); }
        function factoValeur(liste) {
            const v = { x2: 0, x: 0, unit: 0 };
            liste.forEach(t => { v[t.type] += t.sign; });
            return v;
        }
        function factoEgales(a, b) { return a.x2 === b.x2 && a.x === b.x && a.unit === b.unit; }
        function factoPgcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; }

        // La taille de chaque colonne et de chaque ligne. Un côté posé décide ; sinon la tuile du haut
        // (de gauche) de la colonne (de la ligne). Rend les tuiles qui ne remplissent pas leur case.
        function factoTailles(R, C, cells, tops, lefts) {
            const col = Array(C).fill(null), lig = Array(R).fill(null);
            tops.forEach(t => { if (t.col < C) col[t.col] = factoCote(t.type); });
            lefts.forEach(t => { if (t.row < R) lig[t.row] = factoCote(t.type); });
            const ordre = [...cells].sort((a, b) => a.row - b.row || a.col - b.col);
            ordre.forEach(c => { if (col[c.col] === null) col[c.col] = factoDims(c.type, c.orientation).l; });
            [...cells].sort((a, b) => a.col - b.col || a.row - b.row)
                .forEach(c => { if (lig[c.row] === null) lig[c.row] = factoDims(c.type, c.orientation).h; });
            const mal = cells.filter(c => { const d = factoDims(c.type, c.orientation); return d.l !== col[c.col] || d.h !== lig[c.row]; });
            return { col, lig, mal };
        }

        // Les signes : chaque case = signe de sa ligne × signe de sa colonne ; un côté posé fixe le sien.
        // Rend { lig, col } (+1 ou −1, 0 si rien ne le dit) ou null si c'est impossible.
        // Sans côté posé, la première ligne est mise en +1 : on lit (𝑥 + 1)(𝑥 − 2), pas (−𝑥 − 1)(−𝑥 + 2).
        function factoSignes(R, C, cells, tops, lefts) {
            const n = R + C, val = Array(n).fill(0), voisins = Array.from({ length: n }, () => []);
            cells.forEach(c => { voisins[c.row].push([R + c.col, c.sign]); voisins[R + c.col].push([c.row, c.sign]); });
            const fixe = Array(n).fill(0);
            lefts.forEach(t => { if (t.row < R) fixe[t.row] = t.sign; });
            tops.forEach(t => { if (t.col < C) fixe[R + t.col] = t.sign; });
            const propager = (depart, v) => {
                val[depart] = v;
                const file = [depart];
                while (file.length) {
                    const a = file.shift();
                    for (const [b, s] of voisins[a]) {
                        const vb = val[a] * s;
                        if (val[b] === 0) { if (fixe[b] && fixe[b] !== vb) return false; val[b] = vb; file.push(b); }
                        else if (val[b] !== vb) return false;
                    }
                }
                return true;
            };
            for (let i = 0; i < n; i++) if (fixe[i] && val[i] === 0 && !propager(i, fixe[i])) return null;
            for (let i = 0; i < n; i++) if (fixe[i] && val[i] !== fixe[i]) return null;
            for (let i = 0; i < n; i++) if (val[i] === 0 && voisins[i].length && !propager(i, 1)) return null;
            return { lig: val.slice(0, R), col: val.slice(R) };
        }

        // Un côté posé sur la colonne (top) ou la ligne (left) « index » : accepté s'il a la taille de la
        // colonne (de la ligne) et si les signes restent possibles.
        function factoCoteAccepte(d, cote) {
            const k = factoCote(cote.type);
            if (!k) return false;
            const haut = cote.zone === 'top';
            const n = haut ? d.C : d.R;
            if (cote.index < 0 || cote.index >= n) return false;
            if ((haut ? d.tops : d.lefts).some(t => (haut ? t.col : t.row) === cote.index)) return false;
            const dedans = d.cells.filter(c => (haut ? c.col : c.row) === cote.index);
            if (!dedans.length) return false;
            if (dedans.some(c => (haut ? factoDims(c.type, c.orientation).l : factoDims(c.type, c.orientation).h) !== k)) return false;
            const tops = haut ? [...d.tops, { col: cote.index, type: cote.type, sign: cote.sign }] : d.tops;
            const lefts = haut ? d.lefts : [...d.lefts, { row: cote.index, type: cote.type, sign: cote.sign }];
            return factoSignes(d.R, d.C, d.cells, tops, lefts) !== null;
        }

        // Où en est l'élève : le premier point qui manque, dans l'ordre où il le rencontre.
        function factoAnalyser(d) {
            const { R, C, cells, tops, lefts, cible } = d;
            if (!cells.length) return { etat: 'vide' };
            if (d.resteNombre > 0 && !factoEgales(d.resteValeur, { x2: 0, x: 0, unit: 0 })) return { etat: 'reste', n: d.resteNombre };
            const occ = new Set(cells.map(c => c.row + ':' + c.col));
            for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (!occ.has(r + ':' + c)) return { etat: 'trou' };
            const tailles = factoTailles(R, C, cells, tops, lefts);
            if (tailles.mal.length) return { etat: 'taille', mal: tailles.mal.map(c => c.id) };
            if (!factoSignes(R, C, cells, [], [])) return { etat: 'signes' };
            if (!factoEgales(factoValeur(cells), cible)) return { etat: 'valeur' };
            if (!factoSignes(R, C, cells, tops, lefts)) return { etat: 'cote-faux' };
            if (tops.length < C || lefts.length < R) return { etat: 'cotes', manque: R + C - tops.length - lefts.length };
            const facteur = (hs) => ({ x: hs.filter(t => t.type === 'x').reduce((s, t) => s + t.sign, 0), unit: hs.filter(t => t.type === 'unit').reduce((s, t) => s + t.sign, 0) });
            const g = facteur(lefts), h = facteur(tops);
            const vautUn = (f) => f.x === 0 && Math.abs(f.unit) === 1;
            if (vautUn(g) || vautUn(h)) return { etat: 'juste-1' };
            const encore = (f) => f.x !== 0 && f.unit !== 0 && factoPgcd(f.x, f.unit) > 1;
            if (encore(g) || encore(h)) return { etat: 'juste-plus' };
            return { etat: 'juste' };
        }
        const FACTO_TEXTES = {
            vide: 'Glisse les tuiles dans le tableau pour en faire un rectangle.',
            reste: (e) => e.n === 1 ? 'Encore 1 tuile à ranger.' : `Encore ${e.n} tuiles à ranger.`,
            trou: 'Il y a un trou : chaque case reçoit une tuile.',
            taille: 'Une tuile n’a pas la taille de sa case.',
            signes: 'Les couleurs ne vont pas ensemble : échange deux tuiles.',
            valeur: 'Ce rectangle ne vaut pas l’expression de départ.',
            'cote-faux': 'Un côté ne va plus avec le rectangle : enlève-le.',
            cotes: 'C’est un rectangle ! Pose ses côtés avec les tuiles du menu.',
            'juste-1': '✓ Juste, mais un côté vaut 1 : cherche un rectangle plus haut.',
            'juste-plus': '✓ Juste. On peut encore mettre un nombre en facteur.',
            juste: '✓ Factorisé !'
        };
        function factoTexte(e) { const t = FACTO_TEXTES[e.etat]; return typeof t === 'function' ? t(e) : (t || ''); }
        function factoEstJuste(e) { return e.etat === 'juste' || e.etat === 'juste-1' || e.etat === 'juste-plus'; }
        // === FIN DE L'ANALYSE DU RECTANGLE ===

        class AlgebraApp {
            constructor() {
                this.history = [];
                this.tokens = [];
                this.steps = [{ id: 0, operator: '', type: 'simple', tokenIds: [], factor: 1, oppositeApplied: false, distributed: false, isClosed: false }];
                this.currentStepIndex = 0;
                this.nextId = 1; this.nextPackId = 1; this.nextPackOrder = 1; this.packMeta = {}; this.lastPack = null;
                this.isSubtractingInput = false; this.isMultiplyingInput = false; this.isReduced = false;
                this.displayMode = 'normal'; 
                this.lastPos = { x: 40, y: 60, maxYInRow: 0 };
                this.lastSequentialPackId = null; // Important for gaps
                this.pendingPackGap = 0;
                this.scale = 1; this.pan = { x: 0, y: 0 }; this.isPanning = false; this.panStart = { x: 0, y: 0 }; // zoom réglé plus bas (getInitialScale)
                this.currentTool = 'hand'; this.isDrawing = false; this.lastDrawPos = {x:0, y:0};
                this.activePointerId = null; this.ignoreMouse = false;
                this.penStrokes = []; this.currentStroke = null;
                this.isEquationVisible = true; // État de visibilité de l'équation
                this.colorMode = 'sign'; // Vert rouge : le choix par défaut
                this.productFrame = null;

                this.boardContainer = document.getElementById('board-container');
                this.boardWorld = document.getElementById('board-world');
                this.canvas = document.getElementById('drawing-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.viewTouched = false; // la vue a-t-elle été déplacée ou zoomée à la main ?
                this.flipRun = 0; this.flipShown = new Map(); this.flippingSteps = new Set();
                this.touchView = null;
                this.scale = this.getInitialScale();
                
                this.updateTransform();
                this.initListeners(); this.resizeCanvas(); this.updateEquation();
                this.applyColorMode(false);
                this.updateToolButtons();
                this.updateSoundButton();
                this.updateFullscreenButton();
                this.initTaper();
                this.initBulle();
                document.addEventListener('fullscreenchange', () => { this.updateFullscreenButton(); });
                window.addEventListener('resize', () => this.ajusterEquation());
            }


            getTileColorSpec(type, sign) {
                const mode = this.colorMode || 'sign';
                if (mode === 'mathigon' || mode === 'matignon') {
                    if (sign === -1) return TILE_COLOR_MODES.mathigon.negative;
                    return TILE_COLOR_MODES.mathigon[type] || TILE_COLOR_MODES.mathigon.x;
                }
                if (mode === 'blueyellow') return sign === 1 ? TILE_COLOR_MODES.blueyellow.positive : TILE_COLOR_MODES.blueyellow.negative;
                if (mode === 'bw') return sign === 1 ? TILE_COLOR_MODES.bw.positive : TILE_COLOR_MODES.bw.negative;
                return sign === 1 ? TILE_COLOR_MODES.sign.positive : TILE_COLOR_MODES.sign.negative;
            }

            getEquationColor(type, sign) {
                const spec = this.getTileColorSpec(type, sign);
                return spec.eq || spec.bg;
            }

            getEquationOperatorColor(sign = 1) {
                if (sign === -1) return this.getEquationColor('unit', -1);
                const mode = this.colorMode || 'sign';
                if (mode === 'mathigon' || mode === 'matignon') return this.getEquationColor('x', 1);
                return this.getEquationColor('unit', 1);
            }

            colorLatex(color, content) {
                return `{\\color{${color}}{${content}}}`;
            }

            // Une tuile d'une parenthèse « − » pas encore retournée garde le signe tapé :
            // son signe réel (t.sign) est l'opposé, son signe affiché (t.displaySign) celui qu'on a tapé.
            isFlipPending(t) { return !!t && t.displaySign !== undefined && t.displaySign !== t.sign; }
            shownSign(t) {
                if (this.flipShown && this.flipShown.has(t.id)) return this.flipShown.get(t.id);
                return (t.displaySign === 1 || t.displaySign === -1) ? t.displaySign : t.sign;
            }
            paintToken(t, sign = this.shownSign(t)) {
                const el = t.element; if (!el) return;
                el.classList.toggle('green', sign === 1); el.classList.toggle('red', sign !== 1);
                el.innerHTML = `<span style="pointer-events:none;">${getTileLabel(t.type, sign)}</span>`;
                this.styleTileElement(el, t.type, sign);
            }

            styleTileElement(el, type, sign) {
                if (!el) return;
                const spec = this.getTileColorSpec(type, sign);
                el.style.background = spec.bg;
                el.style.borderColor = spec.border;
                el.style.color = spec.text;
                el.style.textShadow = 'none';
            }

            applyColorMode(saveToHistory = false) {
                const select = document.getElementById('color-mode-select');
                if (select) this.colorMode = select.value || 'sign';
                this.tokens.forEach(t => this.styleTileElement(t.element, t.type, this.shownSign(t)));
                if (this.menuDrag && this.menuDrag.el) this.styleTileElement(this.menuDrag.el, this.menuDrag.type, this.menuDrag.sign);
                document.querySelectorAll('[data-preview-type]').forEach(el => {
                    const type = el.dataset.previewType;
                    const sign = parseInt(el.dataset.previewSign || '1', 10);
                    this.styleTileElement(el, type, sign);
                });
                this.updateEquation();
            }

            // --- TOGGLE EQUATION VISIBILITY ---
            toggleVisibility() {
                this.isEquationVisible = !this.isEquationVisible;
                const eq = document.getElementById('equation-display');
                const eyeOpen = document.getElementById('icon-eye-open');
                const eyeClosed = document.getElementById('icon-eye-closed');
                
                if (this.isEquationVisible) {
                    eq.classList.remove('opacity-0');
                    eyeOpen.classList.remove('hidden');
                    eyeClosed.classList.add('hidden');
                } else {
                    eq.classList.add('opacity-0');
                    eyeOpen.classList.add('hidden');
                    eyeClosed.classList.remove('hidden');
                }
            }

            // --- NOUVELLE GESTION DE CRÉATION DEPUIS LE MENU (STYLE FANTÔME AVEC SEUIL) ---
            handleSidebarTouchStart(e, type, sign, orientation = 'h') {
                e.preventDefault();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;

                // On initialise l'état du drag sans créer l'élément visuel tout de suite
                this.menuDrag = {
                    isDragging: false, // On attend de bouger pour passer à true
                    type: type,
                    sign: sign,
                    orientation: orientation,
                    startPos: { x: cx, y: cy },
                    el: null,
                    offset: null
                };

                // Attacher les écouteurs globaux
                const move = (ev) => this.handleMenuDragMove(ev);
                const end = (ev) => {
                    document.removeEventListener('mousemove', move);
                    document.removeEventListener('touchmove', move);
                    document.removeEventListener('mouseup', end);
                    document.removeEventListener('touchend', end);
                    this.handleMenuDragEnd(ev);
                };
                
                document.addEventListener('mousemove', move);
                document.addEventListener('touchmove', move, { passive: false });
                document.addEventListener('mouseup', end);
                document.addEventListener('touchend', end);
            }

            handleMenuDragMove(ev) {
                if (!this.menuDrag) return;
                ev.preventDefault();
                const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
                const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
                
                // Si on n'a pas encore commencé à 'draguer' visuellement
                if (!this.menuDrag.isDragging) {
                    const dist = Math.hypot(cx - this.menuDrag.startPos.x, cy - this.menuDrag.startPos.y);
                    if (dist > 5) {
                        // SEUIL DÉPASSÉ : On crée le fantôme maintenant
                        this.menuDrag.isDragging = true;
                        this.createMenuGhost(cx, cy);
                    }
                }

                // Si le fantôme existe, on le bouge
                if (this.menuDrag.isDragging && this.menuDrag.el) {
                    this.menuDrag.el.style.left = (cx - this.menuDrag.offset.x) + 'px';
                    this.menuDrag.el.style.top = (cy - this.menuDrag.offset.y) + 'px';
                    
                    // Gestion taille (Menu vs Plateau)
                    const sidebarWidth = 112;
                    if (cx < sidebarWidth) {
                        const s = this.getPreviewScale(this.menuDrag.type, this.menuDrag.orientation);
                        this.menuDrag.el.style.transform = `scale(${s})`;
                    } else {
                        this.menuDrag.el.style.transform = `scale(${this.scale})`;
                    }
                }
            }

            createMenuGhost(cx, cy) {
                const type = this.menuDrag.type;
                const sign = this.menuDrag.sign;
                const orientation = this.menuDrag.orientation || 'h';
                
                const el = document.createElement('div');
                const colorClass = sign === 1 ? 'green' : 'red';
                el.classList.add('token', colorClass, `type-${type}`, 'drag-ghost');
                if (type === 'x' && orientation === 'v') el.classList.add('orient-v');
                
                let label = getTileLabel(type, sign);
                el.innerHTML = `<span style="pointer-events:none;">${label}</span>`;
                this.styleTileElement(el, type, sign);
                
                // Style initial
                el.style.transformOrigin = 'center';
                document.body.appendChild(el);

                const size = getTileSize(type, orientation);
                // Offset non zoomé : avec transformOrigin='center', le centre visuel reste à left + width/2.
                // Avant, l'offset utilisait la taille zoomée, ce qui créait un décalage du fantôme quand le plateau n'était pas à 100%.
                const offset = { 
                    x: size.w / 2, 
                    y: size.h / 2 
                };
                this.menuDrag.offset = offset;
                this.menuDrag.el = el;

                // Position immédiate
                el.style.left = (cx - offset.x) + 'px';
                el.style.top = (cy - offset.y) + 'px';
                
                // Initial scale check
                const sidebarWidth = 112;
                if (cx < sidebarWidth) {
                    const s = this.getPreviewScale(type);
                    el.style.transform = `scale(${s})`;
                } else {
                    el.style.transform = `scale(${this.scale})`;
                }
            }

            handleMenuDragEnd(ev) {
                if (!this.menuDrag) return;
                
                if (this.menuDrag.isDragging && this.menuDrag.el) {
                    // C'était un vrai DRAG
                    const endX = ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX;
                    const endY = ev.changedTouches ? ev.changedTouches[0].clientY : ev.clientY;
                    
                    this.menuDrag.el.remove();
                    
                    const sidebarWidth = 112;
                    if (endX > sidebarWidth) {
                        // Drop sur plateau
                        const worldPos = this.getWorldPos(endX, endY);
                        const size = getTileSize(this.menuDrag.type, this.menuDrag.orientation);
                        this.addTile(this.menuDrag.type, this.menuDrag.sign, worldPos.x - size.w/2, worldPos.y - size.h/2, true, this.menuDrag.orientation);
                        const newToken = this.tokens[this.tokens.length - 1];
                        if (newToken) {
                            this.checkSnapAndFinalize(newToken);
                            this.dragStartState = null;
                            this.snapTokenToProductFrame(newToken);
                        }
                    }
                    // Si drop dans menu, on annule (rien ne se passe)
                } else {
                    // C'était un CLIC (pas de mouvement suffisant pour créer le fantôme)
                    // Ajout automatique direct
                    this.addTile(this.menuDrag.type, this.menuDrag.sign, null, null, true, this.menuDrag.orientation);
                }
                
                this.menuDrag = null;
            }

            getPreviewScale(type, orientation = 'h') {
                // Tailles visuelles approximatives dans le menu (pixels)
                // Pour que les icones aient l'air d'avoir la même taille que dans le menu
                let previewW = 0;
                if (type === 'x2') previewW = 32;      // w-8 equivalent visuel (40px dans bouton w-10)
                else if (type === 'x' && orientation === 'v') previewW = 20;
                else if (type === 'x') previewW = 40;  // w-10
                else previewW = 24;                    // w-6
                
                const realW = getTileSize(type, orientation).w;
                // On calcule le ratio pour que la taille affichée corresponde à la taille du menu, peu importe le zoom du plateau
                return previewW / (realW * this.scale);
            }

            dragMove(ev) {
                ev.preventDefault();
                if (!this.draggedToken) return;
                const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
                const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
                const br = this.boardContainer.getBoundingClientRect();
                
                const wx = (cx - br.left - this.pan.x - this.dragOffset.x) / this.scale;
                const wy = (cy - br.top - this.pan.y - this.dragOffset.y) / this.scale;
                
                this.draggedToken.element.style.left = wx + 'px';
                this.draggedToken.element.style.top = wy + 'px';
                this.draggedToken.x = wx;
                this.draggedToken.y = wy;

                // AJOUT : Gestion de la taille dynamique (Menu vs Plateau)
                const sidebarWidth = 112; // Largeur de la barre latérale ajustée
                
                if (cx < sidebarWidth) {
                    // Dans le menu : on réduit la taille
                    const s = this.getPreviewScale(this.draggedToken.type, this.draggedToken.orientation);
                    this.draggedToken.element.style.transform = `scale(${s})`;
                    this.draggedToken.element.style.transformOrigin = 'center';
                } else {
                    // Sur le plateau : taille normale (scale 1)
                    this.draggedToken.element.style.transform = `scale(1)`;
                    this.draggedToken.element.style.transformOrigin = 'center';
                }
            }

            setTokenOrientation(t, orientation) {
                if (!t || t.type !== 'x') return;
                t.orientation = orientation || 'h';
                t.element.classList.toggle('orient-v', t.orientation === 'v');
            }

            restoreTokenOrientation(t) {
                if (!t || t.type !== 'x') return;
                const before = getTileSize(t.type, t.orientation);
                const center = { x: t.x + before.w / 2, y: t.y + before.h / 2 };
                const restored = t._preZeroOrientation || t.originalOrientation || t.orientation || 'h';
                this.setTokenOrientation(t, restored);
                const after = getTileSize(t.type, t.orientation);
                this.moveToken(t, center.x - after.w / 2, center.y - after.h / 2);
                delete t._preZeroOrientation;
            }

            createZeroBadge(id, x, y, size) {
                const b = document.createElement('div');
                b.className = 'zero-badge';
                b.textContent = '0';
                if (id) b.id = id;
                b.style.left = x + 'px';
                b.style.top = y + 'px';
                b.style.width = size.w + 'px';
                b.style.height = size.h + 'px';
                const fontSize = Math.max(20, Math.min(44, Math.min(size.w, size.h) * 0.62));
                b.style.fontSize = fontSize + 'px';
                this.boardWorld.appendChild(b);
                return b;
            }


            getProductHeaderObjects(zone) {
                return this.tokens
                    .filter(t => t.productZone === zone && t.pairId === null)
                    .sort((a, b) => (a.productIndex ?? 0) - (b.productIndex ?? 0) || a.id - b.id)
                    .map((t, i) => ({ t, index: i }));
            }

            productTokenSizeForZone(t, zone) {
                let orientation = t.orientation || 'h';
                if (t.type === 'x' && zone === 'top') orientation = 'h';
                if (t.type === 'x' && zone === 'left') orientation = 'v';
                return getTileSize(t.type, orientation);
            }

            productSpecFromFactors(left, top) {
                if (!left || !top) return null;
                // Le gabarit actuel est prévu pour les facteurs linéaires : x et 1.
                // x² dans un facteur demanderait des puissances supérieures non gérées par les tuiles actuelles.
                if (left.type === 'x2' || top.type === 'x2') return null;
                let type = 'unit';
                if (left.type === 'x' && top.type === 'x') type = 'x2';
                else if (left.type === 'x' || top.type === 'x') type = 'x';
                let orientation = 'h';
                if (type === 'x' && left.type === 'x' && top.type === 'unit') orientation = 'v';
                if (type === 'x' && left.type === 'unit' && top.type === 'x') orientation = 'h';
                return { type, sign: left.sign * top.sign, orientation };
            }

            getProductMetrics(frame = this.productFrame) {
                if (frame?.mode === 'facto') return this.factoMetrics(frame);
                const topObjs = this.getProductHeaderObjects('top');
                const leftObjs = this.getProductHeaderObjects('left');
                const rows = Math.max(1, leftObjs.length);
                const cols = Math.max(1, topObjs.length);
                const toolbarH = 34;
                const minHeader = 64;
                const pad = 22;
                const leftW = Math.max(78, ...leftObjs.map(o => this.productTokenSizeForZone(o.t, 'left').w + 28));
                const topH = Math.max(58, ...topObjs.map(o => this.productTokenSizeForZone(o.t, 'top').h + 26));

                const colWidths = Array.from({ length: cols }, (_, c) => {
                    const top = topObjs[c]?.t;
                    let w = Math.max(72, top ? this.productTokenSizeForZone(top, 'top').w + pad : 88);
                    leftObjs.forEach(lo => {
                        const spec = this.productSpecFromFactors(lo.t, top);
                        if (spec) w = Math.max(w, getTileSize(spec.type, spec.orientation).w + pad);
                    });
                    return w;
                });

                const rowHeights = Array.from({ length: rows }, (_, r) => {
                    const left = leftObjs[r]?.t;
                    let h = Math.max(62, left ? this.productTokenSizeForZone(left, 'left').h + pad : 88);
                    topObjs.forEach(to => {
                        const spec = this.productSpecFromFactors(left, to.t);
                        if (spec) h = Math.max(h, getTileSize(spec.type, spec.orientation).h + pad);
                    });
                    return h;
                });

                // Le cadre a un bord de 3 px (box-sizing: border-box) : on le compte dans sa taille, et
                // tout ce qui est placé dans le cadre part de son bord intérieur (ox, oy).
                const bord = PRODUCT_FRAME_BORDER;
                const gridW = leftW + colWidths.reduce((a, b) => a + b, 0);
                const gridH = topH + rowHeights.reduce((a, b) => a + b, 0);
                const width = gridW + 2 * bord;
                const height = toolbarH + gridH + 2 * bord;
                const ox = (frame?.x || 0) + bord, oy = (frame?.y || 0) + bord;
                const colX = (c) => ox + leftW + colWidths.slice(0, c).reduce((a, b) => a + b, 0);
                const rowY = (r) => oy + toolbarH + topH + rowHeights.slice(0, r).reduce((a, b) => a + b, 0);
                return {
                    rows, cols, toolbarH, leftW, topH, colWidths, rowHeights, width, height, gridW, gridH, bord, ox, oy,
                    gridY: oy + toolbarH,
                    centralX: ox + leftW,
                    centralY: oy + toolbarH + topH,
                    colX, rowY
                };
            }

            createProductFrame() {
                this.saveState();
                if (this.productFrame) {
                    this.tokens.forEach(t => this.clearProductPlacement(t));
                    this.removeProductFrameElement(false);
                }
                const br = this.boardContainer.getBoundingClientRect();
                const p = this.getWorldPos(br.left + 130, br.top + 90);
                this.productFrame = { x: p.x, y: p.y, element: null };
                this.renderProductFrame();
                this.updateEquation();
            }

            renderProductFrame() {
                if (!this.productFrame) return;
                if (this.productFrame.mode === 'facto') { this.factoRendre(); return; }
                if (this.productFrame.element) this.productFrame.element.remove();
                const f = this.productFrame;
                const m = this.getProductMetrics(f);
                const el = document.createElement('div');
                el.className = 'product-frame product-dynamic';
                el.style.left = f.x + 'px';
                el.style.top = f.y + 'px';
                el.style.width = m.width + 'px';
                el.style.height = m.height + 'px';

                const toolbar = document.createElement('div');
                toolbar.className = 'product-toolbar';
                toolbar.title = 'Déplacer le tableau';
                toolbar.innerHTML = `<span>Tableau produit</span><div class="flex gap-1"><button class="primary" onclick="app.developProductFrame()">Développer sur le plateau</button><button class="danger" onclick="app.deleteProductFrame(false)">×</button></div>`;
                toolbar.addEventListener('pointerdown', (e) => this.startProductFrameDrag(e));
                toolbar.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('pointerdown', e => e.stopPropagation());
                    btn.addEventListener('mousedown', e => e.stopPropagation());
                });
                el.addEventListener('mousedown', e => e.stopPropagation());
                el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
                el.appendChild(toolbar);

                const grid = document.createElement('div');
                grid.className = 'product-grid';
                grid.style.gridTemplateColumns = `${m.leftW}px ${m.colWidths.map(w => `${w}px`).join(' ')}`;
                grid.style.gridTemplateRows = `${m.topH}px ${m.rowHeights.map(h => `${h}px`).join(' ')}`;
                grid.style.width = m.gridW + 'px';
                grid.style.height = m.gridH + 'px';

                const corner = document.createElement('div');
                corner.className = 'product-corner';
                corner.textContent = '×';
                grid.appendChild(corner);
                for (let c = 0; c < m.cols; c++) {
                    const slot = document.createElement('div');
                    slot.className = 'product-slot top';
                    slot.dataset.label = c === 0 && !this.getProductHeaderObjects('top').length ? 'facteur haut' : '';
                    grid.appendChild(slot);
                }
                for (let r = 0; r < m.rows; r++) {
                    const left = document.createElement('div');
                    left.className = 'product-slot left';
                    left.dataset.label = r === 0 && !this.getProductHeaderObjects('left').length ? 'gauche' : '';
                    grid.appendChild(left);
                    for (let c = 0; c < m.cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'product-cell';
                        grid.appendChild(cell);
                    }
                }
                el.appendChild(grid);
                this.boardWorld.appendChild(el);
                f.element = el;
            }

            startProductFrameDrag(e) {
                if (!this.productFrame || this.currentTool !== 'hand') return;
                if (e.target.closest('button')) return;
                if (e.button !== undefined && e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();

                this.saveState();
                const frame = this.productFrame;
                const start = this.getWorldPos(e.clientX, e.clientY);
                const origin = { x: frame.x, y: frame.y };
                const el = frame.element;
                this.isPanning = false;
                this.boardContainer.classList.remove('panning');
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}

                const move = (ev) => {
                    if (ev.pointerId !== e.pointerId) return;
                    ev.preventDefault();
                    ev.stopPropagation();
                    const p = this.getWorldPos(ev.clientX, ev.clientY);
                    frame.x = origin.x + (p.x - start.x);
                    frame.y = origin.y + (p.y - start.y);
                    if (el) {
                        el.style.left = frame.x + 'px';
                        el.style.top = frame.y + 'px';
                    }
                    this.reflowProductFrameTokens(false);
                };

                const up = (ev) => {
                    if (ev.pointerId !== e.pointerId) return;
                    window.removeEventListener('pointermove', move);
                    window.removeEventListener('pointerup', up);
                    window.removeEventListener('pointercancel', up);
                    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
                    this.reflowProductFrameTokens(false);
                    this.updateEquation();
                };

                window.addEventListener('pointermove', move, { passive: false });
                window.addEventListener('pointerup', up);
                window.addEventListener('pointercancel', up);
            }

            removeProductFrameElement(update = true) {
                if (this.productFrame?.element) this.productFrame.element.remove();
                if (this.productFrame) this.productFrame.element = null;
                this.productFrame = null;
                if (update) this.updateEquation();
            }

            deleteProductFrame(save = true) {
                if (save) this.saveState();
                this.tokens.forEach(t => this.clearProductPlacement(t));
                this.removeProductFrameElement(true);
            }

            tokenCenter(t) {
                const s = getTileSize(t.type, t.orientation);
                return { x: t.x + s.w / 2, y: t.y + s.h / 2 };
            }

            metricIndexFromPosition(value, start, sizes) {
                let acc = start;
                for (let i = 0; i < sizes.length; i++) {
                    if (value >= acc && value <= acc + sizes[i]) return i;
                    acc += sizes[i];
                }
                return sizes.length - 1;
            }

            getProductZoneInfo(t) {
                if (!this.productFrame || !t || t.pairId !== null) return null;
                const f = this.productFrame;
                const m = this.getProductMetrics(f);
                const c = this.tokenCenter(t);
                const x = c.x, y = c.y;
                const topStartY = m.oy + m.toolbarH;
                const topEndY = topStartY + m.topH;
                const leftStartX = m.ox;
                const leftEndX = m.ox + m.leftW;
                const centralX = m.centralX;
                const centralY = m.centralY;
                const centralEndX = centralX + m.colWidths.reduce((a, b) => a + b, 0);
                const centralEndY = centralY + m.rowHeights.reduce((a, b) => a + b, 0);

                if (x >= centralX && x <= centralEndX && y >= topStartY && y <= topEndY) {
                    return { zone: 'top', col: this.metricIndexFromPosition(x, centralX, m.colWidths) };
                }
                if (x >= leftStartX && x <= leftEndX && y >= centralY && y <= centralEndY) {
                    return { zone: 'left', row: this.metricIndexFromPosition(y, centralY, m.rowHeights) };
                }
                if (x >= centralX && x <= centralEndX && y >= centralY && y <= centralEndY) {
                    return {
                        zone: 'cell',
                        row: this.metricIndexFromPosition(y, centralY, m.rowHeights),
                        col: this.metricIndexFromPosition(x, centralX, m.colWidths)
                    };
                }
                return null;
            }

            productTokens(zone) {
                if (zone === 'top' || zone === 'left') return this.getProductHeaderObjects(zone).map(o => ({ t: o.t, info: { zone, [zone === 'top' ? 'col' : 'row']: o.index } }));
                return this.tokens
                    .filter(t => t.productZone === 'cell' && t.pairId === null)
                    .map(t => ({ t, info: { zone: 'cell', row: t.productRow ?? 0, col: t.productCol ?? 0 } }))
                    .sort((a, b) => (a.info.row - b.info.row) || (a.info.col - b.info.col) || (a.t.id - b.t.id));
            }

            reindexProductHeaders(zone) {
                if (this.productFrame?.mode === 'facto') { this.factoTasser(); return; } // un côté reste sur SA colonne
                this.getProductHeaderObjects(zone).forEach((o, i) => { o.t.productIndex = i; });
            }

            expectedProductForCell(row, col) {
                const top = this.getProductHeaderObjects('top')[col]?.t || null;
                const left = this.getProductHeaderObjects('left')[row]?.t || null;
                return this.productSpecFromFactors(left, top);
            }

            productCellOccupied(row, col, exceptToken = null) {
                return this.tokens.some(t => t !== exceptToken && t.productZone === 'cell' && t.productRow === row && t.productCol === col && t.pairId === null);
            }

            markProductError(t) {
                if (!t || !t.element) return;
                t.element.classList.add('product-wrong');
                setTimeout(() => t.element && t.element.classList.remove('product-wrong'), 650);
            }

            restoreDraggedToken(t) {
                const s = this.dragStartState;
                if (!t || !s) return;
                t.productZone = s.productZone;
                t.productIndex = s.productIndex;
                t.productRow = s.productRow;
                t.productCol = s.productCol;
                if (t.type === 'x') this.setTokenOrientation(t, s.orientation || 'h');
                this.moveToken(t, s.x, s.y);
                this.reindexProductHeaders('top');
                this.reindexProductHeaders('left');
                this.renderProductFrame();
                this.reflowProductFrameTokens();
            }

            clearProductPlacement(t) {
                delete t.productZone;
                delete t.productIndex;
                delete t.productRow;
                delete t.productCol;
            }
