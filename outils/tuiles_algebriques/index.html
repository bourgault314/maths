<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>maths&go — Calcul littéral</title>
  <style>
    :root{
      --bg:#f6efe5;
      --paper:rgba(255,255,255,.84);
      --ink:#0a3d86;
      --muted:#6e675d;
      --line:rgba(10,61,134,.12);
      --teal:#10b9b2;
      --orange:#ff8a00;
      --sky:#57c9ee;
      --green:#8ad88d;
      --yellow:#ffc533;
      --shadow:0 18px 44px rgba(10,61,134,.10);
      --shadow-strong:0 28px 72px rgba(10,61,134,.16);
      --radius:30px;
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(760px 420px at 6% 0%, rgba(16,185,178,.14), transparent 58%),
        radial-gradient(780px 440px at 96% 4%, rgba(255,138,0,.14), transparent 58%),
        linear-gradient(180deg,#fbf7f1 0%, #f6efe5 56%, #f2eadd 100%);
      overflow-x:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(10,61,134,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,61,134,.03) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.75), transparent 82%);
    }

    .wrap{
      width:min(1140px, calc(100% - 40px));
      margin:0 auto;
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:28px;
      padding:28px 0 30px;
      position:relative;
      z-index:1;
    }

    .topbar{
      height:34px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .logo-link{
      display:block;
      width:92px;
      opacity:.96;
      text-decoration:none;
      transition:transform .16s ease, opacity .16s ease;
    }

    .logo-link:hover{
      transform:translateY(-1px);
      opacity:1;
    }

    .logo-link:focus-visible{
      outline:3px solid rgba(255,138,0,.28);
      outline-offset:5px;
      border-radius:10px;
    }

    .logo-link img{
      display:block;
      width:100%;
      height:auto;
    }

    .hero{
      display:grid;
      gap:26px;
      align-content:start;
    }

    .title-block{
      text-align:center;
      display:grid;
      gap:8px;
      margin-top:-10px;
    }

    h1{
      margin:0;
      font-size:clamp(2.2rem,5vw,4rem);
      line-height:.96;
      letter-spacing:-.06em;
      color:var(--ink);
    }

    .subtitle{
      margin:0;
      color:var(--muted);
      font-size:1.03rem;
      font-weight:700;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:24px;
    }

    .card{
      text-decoration:none;
      color:inherit;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      position:relative;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:var(--shadow-strong);
      border-color:rgba(10,61,134,.22);
    }

    .card:focus-visible{
      outline:4px solid rgba(255,138,0,.24);
      outline-offset:5px;
    }

    .preview{
      aspect-ratio:16/9;
      padding:18px;
      display:grid;
      place-items:center;
      border-bottom:1px solid rgba(10,61,134,.08);
      position:relative;
      overflow:hidden;
    }

    .card.tiles .preview{
      background:
        radial-gradient(280px 170px at 12% 18%, rgba(16,185,178,.16), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(251,247,241,.88));
    }

    .card.exercises .preview{
      background:
        radial-gradient(300px 170px at 86% 16%, rgba(255,138,0,.14), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(251,247,241,.88));
    }

    .label{
      padding:16px 20px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    .label .text{
      font-size:clamp(1.18rem,1.8vw,1.55rem);
      line-height:1.02;
      letter-spacing:-.04em;
      font-weight:950;
      color:var(--ink);
    }

    .arrow{
      width:44px;
      height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:1.35rem;
      font-weight:950;
      background:var(--accent);
      box-shadow:0 12px 24px rgba(10,61,134,.12);
      flex:0 0 auto;
    }

    .tile-board{
      width:min(100%, 360px);
      aspect-ratio:1 / 1.02;
      background:#fff;
      border:1.5px solid rgba(10,61,134,.15);
      box-shadow:0 14px 28px rgba(10,61,134,.08);
      padding:18px;
      transform:rotate(-2.5deg);
      display:grid;
      grid-template-rows:repeat(3,1fr);
      gap:12px;
    }

    .tile-row{display:flex;align-items:center;justify-content:center;gap:12px}
    .tile-sq,.tile-rect,.tile-unit{
      border:1.6px solid rgba(10,61,134,.52);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      flex:0 0 auto;
    }
    .tile-sq{width:54px;height:54px;background:linear-gradient(145deg,#74daf4,var(--sky));}
    .tile-rect{width:76px;height:18px;background:linear-gradient(145deg,#ade8ad,var(--green));}
    .tile-unit{width:16px;height:16px;background:linear-gradient(145deg,#ffdf77,var(--yellow));}
    .unit-pack{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:90px}

    .worksheet{
      width:min(100%, 360px);
      aspect-ratio:1 / 1.02;
      background:#fff;
      border:1.5px solid rgba(10,61,134,.15);
      box-shadow:0 14px 28px rgba(10,61,134,.08);
      padding:16px;
      transform:rotate(2deg);
      position:relative;
      display:grid;
      grid-template-rows:auto auto 1fr;
      gap:12px;
    }

    .worksheet::after{
      content:"";
      position:absolute;
      right:-18px;
      bottom:14px;
      width:122px;
      height:12px;
      border-radius:999px 8px 8px 999px;
      background:linear-gradient(90deg,var(--orange),#ffb13b);
      transform:rotate(-24deg);
      box-shadow:0 8px 20px rgba(255,138,0,.18);
      opacity:.92;
    }

    .ws-title{
      height:16px;
      width:58%;
      border-radius:999px;
      background:rgba(255,138,0,.22);
    }

    .ws-lines{display:grid;gap:8px}
    .line{height:10px;border-radius:999px;background:rgba(10,61,134,.10)}
    .l1{width:78%}.l2{width:62%}

    .example-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      align-content:start;
    }

    .example{
      border:1px solid rgba(10,61,134,.16);
      padding:10px;
      display:grid;
      gap:8px;
      min-height:88px;
      background:rgba(255,255,255,.86);
    }

    .example .bar{height:8px;border-radius:999px;background:rgba(10,61,134,.10);width:72%}
    .example .bar.short{width:46%}
    .example .mini{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .mini-sq,.mini-rect,.mini-unit{
      border:1px solid rgba(10,61,134,.45);
      flex:0 0 auto;
    }
    .mini-sq{width:20px;height:20px;background:linear-gradient(145deg,#74daf4,var(--sky));}
    .mini-rect{width:28px;height:10px;background:linear-gradient(145deg,#ade8ad,var(--green));}
    .mini-unit{width:10px;height:10px;background:linear-gradient(145deg,#ffdf77,var(--yellow));}

    footer{
      min-height:0;
    }


    /* Aperçus réels des fiches PDF */
    .card.course .preview{
      background:
        radial-gradient(300px 170px at 16% 16%, rgba(87,201,238,.16), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(251,247,241,.88));
    }

    .card.board .preview{
      background:
        radial-gradient(300px 170px at 84% 18%, rgba(138,216,141,.20), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(251,247,241,.88));
    }

    .pdf-page{
      --rot:-2deg;
      position:absolute;
      left:50%;
      top:50%;
      height:calc(100% - 36px);
      max-width:72%;
      object-fit:contain;
      background:#fff;
      border:1.5px solid rgba(10,61,134,.14);
      border-radius:3px;
      box-shadow:0 16px 34px rgba(10,61,134,.12);
      display:block;
      transform:translate(-50%, -50%) rotate(var(--rot));
      transform-origin:center center;
    }

    .card.exercises .pdf-page{
      --rot:2deg;
    }

    .card.course .pdf-page{
      --rot:-1.2deg;
      max-width:74%;
    }

    .manip-board{
      width:min(100%, 380px);
      aspect-ratio:1.35 / 1;
      background:rgba(255,255,255,.96);
      border:1.5px solid rgba(10,61,134,.16);
      border-radius:22px;
      box-shadow:0 16px 34px rgba(10,61,134,.10);
      padding:18px;
      transform:rotate(1.8deg);
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:auto 1fr auto;
      gap:12px;
      position:relative;
    }

    .manip-board::before{
      content:"Plateau virtuel";
      grid-column:1 / -1;
      color:var(--ink);
      font-weight:950;
      letter-spacing:-.04em;
      font-size:1.08rem;
    }

    .drop-zone{
      border:2px dashed rgba(10,61,134,.18);
      border-radius:16px;
      min-height:120px;
      padding:12px;
      display:flex;
      gap:8px;
      align-content:flex-start;
      flex-wrap:wrap;
      background:rgba(246,239,229,.45);
    }

    .tool-rack{
      grid-column:1 / -1;
      min-height:42px;
      border-radius:16px;
      background:rgba(10,61,134,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:8px;
    }

    .drag-tile{
      display:grid;
      place-items:center;
      border:1.6px solid rgba(0,0,0,.62);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 10px rgba(10,61,134,.10);
      color:#111;
      font-weight:950;
      line-height:1;
      flex:0 0 auto;
    }

    .drag-tile.x2{width:44px;height:44px;background:#10b09c;font-size:.82rem;}
    .drag-tile.x{width:62px;height:20px;background:#72c475;font-size:.78rem;}
    .drag-tile.u{width:22px;height:22px;background:#ffe15a;font-size:.72rem;}
    .drag-tile.neg{background:#ef3f35;}


    @media (max-width: 900px){
      .wrap{width:min(100% - 24px, 640px); gap:22px; padding:18px 0 24px}
      .topbar{height:34px;justify-content:center}
      .logo-link{width:92px}
      .title-block{margin-top:0}
      .grid{grid-template-columns:1fr}
      .preview{padding:18px}
      .label{padding:16px 18px 18px}
    }
  </style>
</head>
