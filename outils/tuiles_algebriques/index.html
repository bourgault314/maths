<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>maths&go — Calcul littéral</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <style>
    :root{
      --bg:#f6efe5;
      --paper:rgba(255,255,255,.84);
      --ink:#0a3d86;
      --muted:#6e675d;
      --line:rgba(10,61,134,.12);
      --teal:#10b9b2;
      --orange:#ff8a00;
      --sky:#57c9ee;
      --green:#8ad88d;
      --yellow:#ffc533;
      --shadow:0 18px 44px rgba(10,61,134,.10);
      --shadow-strong:0 28px 72px rgba(10,61,134,.16);
      --radius:30px;
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(760px 420px at 6% 0%, rgba(16,185,178,.14), transparent 58%),
        radial-gradient(780px 440px at 96% 4%, rgba(255,138,0,.14), transparent 58%),
        linear-gradient(180deg,#fbf7f1 0%, #f6efe5 56%, #f2eadd 100%);
      overflow-x:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(10,61,134,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,61,134,.03) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.75), transparent 82%);
    }

    .wrap{
      width:min(1140px, calc(100% - 40px));
      margin:0 auto;
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:28px;
      padding:28px 0 30px;
      position:relative;
      z-index:1;
    }

    .topbar{
      height:54px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .logo-link{
      display:block;
      width:124px;
      opacity:.96;
      text-decoration:none;
      transition:transform .16s ease, opacity .16s ease;
    }

    .logo-link:hover{
      transform:translateY(-1px);
      opacity:1;
    }

    .logo-link:focus-visible{
      outline:3px solid rgba(255,138,0,.28);
      outline-offset:5px;
      border-radius:10px;
    }

    .logo-link img{
      display:block;
      width:100%;
      height:auto;
    }

    .hero{
      display:grid;
      gap:26px;
      align-content:start;
    }

    .title-block{
      text-align:center;
      display:grid;
      gap:8px;
      margin-top:-10px;
    }

    h1{
      margin:0;
      font-size:clamp(2.2rem,5vw,4rem);
      line-height:.96;
      letter-spacing:-.06em;
      color:var(--ink);
    }

    .subtitle{
      margin:0;
      color:var(--muted);
      font-size:1.03rem;
      font-weight:700;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,440px));
      justify-content:center;
      gap:22px;
    }

    .card{
      text-decoration:none;
      color:inherit;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      position:relative;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:var(--shadow-strong);
      border-color:rgba(10,61,134,.22);
    }

    .card:focus-visible{
      outline:4px solid rgba(255,138,0,.24);
      outline-offset:5px;
    }

    .preview{
      aspect-ratio:4/3;
      padding:18px;
      display:grid;
      place-items:center;
      border-bottom:1px solid rgba(10,61,134,.08);
      position:relative;
      overflow:hidden;
    }

    .card.tiles .preview{
      background:
        radial-gradient(280px 170px at 12% 18%, rgba(16,185,178,.16), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(251,247,241,.88));
    }

    .card.exercises .preview{
      background:
        radial-gradient(300px 170px at 86% 16%, rgba(255,138,0,.14), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(251,247,241,.88));
    }

    .label{
      padding:16px 20px 18px;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      min-height:74px;
    }

    .label .text{
      width:100%;
      text-align:center;
      padding:0 50px;
      font-size:clamp(1.14rem,1.7vw,1.48rem);
      line-height:1.04;
      letter-spacing:-.04em;
      font-weight:950;
      color:var(--ink);
    }

    .arrow{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:1.3rem;
      font-weight:950;
      background:var(--accent);
      box-shadow:0 12px 24px rgba(10,61,134,.12);
      position:absolute;
      right:18px;
      top:50%;
      transform:translateY(-50%);
    }

    .tile-board{
      width:min(100%, 360px);
      aspect-ratio:1 / 1.02;
      background:#fff;
      border:1.5px solid rgba(10,61,134,.15);
      box-shadow:0 14px 28px rgba(10,61,134,.08);
      padding:18px;
      transform:rotate(-2.5deg);
      display:grid;
      grid-template-rows:repeat(3,1fr);
      gap:12px;
    }

    .tile-row{display:flex;align-items:center;justify-content:center;gap:12px}
    .tile-sq,.tile-rect,.tile-unit{
      border:1.6px solid rgba(10,61,134,.52);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      flex:0 0 auto;
    }
    .tile-sq{width:54px;height:54px;background:linear-gradient(145deg,#74daf4,var(--sky));}
    .tile-rect{width:76px;height:18px;background:linear-gradient(145deg,#ade8ad,var(--green));}
    .tile-unit{width:16px;height:16px;background:linear-gradient(145deg,#ffdf77,var(--yellow));}
    .unit-pack{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:90px}

    .worksheet{
      width:min(100%, 360px);
      aspect-ratio:1 / 1.02;
      background:#fff;
      border:1.5px solid rgba(10,61,134,.15);
      box-shadow:0 14px 28px rgba(10,61,134,.08);
      padding:16px;
      transform:rotate(2deg);
      position:relative;
      display:grid;
      grid-template-rows:auto auto 1fr;
      gap:12px;
    }

    .worksheet::after{
      content:"";
      position:absolute;
      right:-18px;
      bottom:14px;
      width:122px;
      height:12px;
      border-radius:999px 8px 8px 999px;
      background:linear-gradient(90deg,var(--orange),#ffb13b);
      transform:rotate(-24deg);
      box-shadow:0 8px 20px rgba(255,138,0,.18);
      opacity:.92;
    }

    .ws-title{
      height:16px;
      width:58%;
      border-radius:999px;
      background:rgba(255,138,0,.22);
    }

    .ws-lines{display:grid;gap:8px}
    .line{height:10px;border-radius:999px;background:rgba(10,61,134,.10)}
    .l1{width:78%}.l2{width:62%}

    .example-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      align-content:start;
    }

    .example{
      border:1px solid rgba(10,61,134,.16);
      padding:10px;
      display:grid;
      gap:8px;
      min-height:88px;
      background:rgba(255,255,255,.86);
    }

    .example .bar{height:8px;border-radius:999px;background:rgba(10,61,134,.10);width:72%}
    .example .bar.short{width:46%}
    .example .mini{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .mini-sq,.mini-rect,.mini-unit{
      border:1px solid rgba(10,61,134,.45);
      flex:0 0 auto;
    }
    .mini-sq{width:20px;height:20px;background:linear-gradient(145deg,#74daf4,var(--sky));}
    .mini-rect{width:28px;height:10px;background:linear-gradient(145deg,#ade8ad,var(--green));}
    .mini-unit{width:10px;height:10px;background:linear-gradient(145deg,#ffdf77,var(--yellow));}

    footer{
      min-height:0;
    }


    /* Aperçus réels des fiches PDF */
    .card.course .preview{
      background:
        radial-gradient(300px 170px at 16% 16%, rgba(87,201,238,.16), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(251,247,241,.88));
    }

    .card.board .preview{
      background:
        radial-gradient(300px 170px at 84% 18%, rgba(87,201,238,.20), transparent 66%),
        radial-gradient(260px 150px at 18% 82%, rgba(59,130,246,.10), transparent 64%),
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(251,247,241,.88));
    }

    .pdf-page{
      --rot:-2deg;
      position:absolute;
      left:50%;
      top:50%;
      height:calc(100% - 36px);
      max-width:72%;
      object-fit:contain;
      background:#fff;
      border:1.5px solid rgba(10,61,134,.14);
      border-radius:3px;
      box-shadow:0 16px 34px rgba(10,61,134,.12);
      display:block;
      transform:translate(-50%, -50%) rotate(var(--rot));
      transform-origin:center center;
    }

    .card.exercises .pdf-page{
      --rot:2deg;
    }

    .card.course .pdf-page{
      --rot:-1.2deg;
      max-width:74%;
    }


    .card.tiles .tile-cut-thumb{
      --rot:-1.6deg;
      height:calc(100% - 30px);
      max-width:76%;
      object-fit:contain;
      object-position:top center;
    }

    .manip-board{
      width:min(100%, 380px);
      aspect-ratio:1.35 / 1;
      background:rgba(255,255,255,.96);
      border:1.5px solid rgba(10,61,134,.16);
      border-radius:22px;
      box-shadow:0 16px 34px rgba(10,61,134,.10);
      padding:18px;
      transform:rotate(1.8deg);
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:auto 1fr auto;
      gap:12px;
      position:relative;
    }

    .manip-board::before{
      content:"Plateau virtuel";
      grid-column:1 / -1;
      color:var(--ink);
      font-weight:950;
      letter-spacing:-.04em;
      font-size:1.08rem;
    }

    .drop-zone{
      border:2px dashed rgba(10,61,134,.18);
      border-radius:16px;
      min-height:120px;
      padding:12px;
      display:flex;
      gap:8px;
      align-content:flex-start;
      flex-wrap:wrap;
      background:rgba(246,239,229,.45);
    }

    .tool-rack{
      grid-column:1 / -1;
      min-height:42px;
      border-radius:16px;
      background:rgba(10,61,134,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:8px;
    }

    .drag-tile{
      display:grid;
      place-items:center;
      border:1.8px solid rgba(0,0,0,.62);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 10px rgba(10,61,134,.10);
      color:#111;
      font-weight:950;
      line-height:1;
      flex:0 0 auto;
      font-family:'Times New Roman', serif;
      font-style:italic;
    }

    .drag-tile.x2{width:44px;height:44px;background:linear-gradient(145deg,#69b8ff,#3b8fda);font-size:.84rem;}
    .drag-tile.x{width:62px;height:20px;background:linear-gradient(145deg,#69b8ff,#3b8fda);font-size:.82rem;}
    .drag-tile.u{width:22px;height:22px;background:linear-gradient(145deg,#69b8ff,#3b8fda);font-size:.74rem;font-style:normal;}
    .drag-tile.neg{background:linear-gradient(145deg,#fff173,#ffe24a);}
    .drag-tile.zero{background:#9ca3af;border-color:#6b7280;color:#111;font-style:normal;font-size:.82rem;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 4px 10px rgba(10,61,134,.10);}
    .drag-tile.zero-x{width:62px;height:20px;font-size:.78rem;}


    .card.equation .preview{
      background:
        radial-gradient(300px 170px at 52% 18%, rgba(59,130,246,.16), transparent 66%),
        radial-gradient(280px 160px at 18% 84%, rgba(250,204,21,.16), transparent 66%),
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(251,247,241,.88));
    }

    .card.equation{
      grid-column:1 / -1;
      width:min(100%, 440px);
      justify-self:center;
    }

    .equation-board{
      width:min(100%, 382px);
      aspect-ratio:1.35 / 1;
      background:rgba(255,255,255,.97);
      border:1.5px solid rgba(10,61,134,.16);
      border-radius:22px;
      box-shadow:0 16px 34px rgba(10,61,134,.10);
      padding:16px;
      transform:rotate(-1.4deg);
      display:grid;
      grid-template-columns:1fr 4px 1fr;
      grid-template-rows:auto 1fr auto;
      gap:12px;
      position:relative;
      overflow:hidden;
    }

    .equation-board::before{
      content:"Résoudre une équation";
      grid-column:1 / -1;
      color:var(--ink);
      font-weight:950;
      letter-spacing:-.04em;
      font-size:1.02rem;
      text-align:center;
      z-index:2;
    }

    .eq-divider-mini{
      grid-column:2;
      grid-row:2 / 4;
      width:4px;
      border-left:2px dashed rgba(10,61,134,.28);
      border-right:2px dashed rgba(10,61,134,.28);
      background:rgba(10,61,134,.08);
      border-radius:999px;
      position:relative;
    }

    .eq-divider-mini::after{
      content:"=";
      position:absolute;
      left:50%;
      top:46%;
      transform:translate(-50%, -50%);
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:#fff;
      color:var(--ink);
      border:1.5px solid rgba(10,61,134,.14);
      box-shadow:0 9px 18px rgba(10,61,134,.10);
      font-weight:950;
      font-size:1.35rem;
    }

    .eq-side{
      border:2px dashed rgba(10,61,134,.16);
      border-radius:16px;
      min-height:126px;
      padding:14px;
      display:flex;
      gap:8px;
      align-content:flex-start;
      flex-wrap:wrap;
      background:rgba(246,239,229,.45);
    }

    .eq-side.left{grid-column:1;grid-row:2;}
    .eq-side.right{grid-column:3;grid-row:2;}

    .eq-caption{
      color:rgba(10,61,134,.72);
      font-size:.72rem;
      font-weight:900;
      text-align:center;
      align-self:center;
    }

    .eq-caption.left{grid-column:1;grid-row:3;}
    .eq-caption.right{grid-column:3;grid-row:3;}

    .eq-tile{
      display:grid;
      place-items:center;
      border:1.6px solid rgba(0,0,0,.62);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 10px rgba(10,61,134,.10);
      color:#111;
      font-family:'Times New Roman', serif;
      font-style:italic;
      font-weight:950;
      line-height:1;
      flex:0 0 auto;
    }

    .eq-tile.x{width:62px;height:22px;background:linear-gradient(145deg,#69b8ff,#3b8fda);font-size:.86rem;}
    .eq-tile.u{width:22px;height:22px;background:linear-gradient(145deg,#69b8ff,#3b8fda);font-size:.75rem;font-style:normal;}
    .eq-tile.neg{background:linear-gradient(145deg,#fff2a8,#f4d63f);}




    /* Carte livrets : plusieurs versions du cours */
    .card.course{
      cursor:default;
    }

    .course-stack{
      width:min(100%, 390px);
      height:100%;
      min-height:245px;
      position:relative;
      display:grid;
      place-items:center;
    }

    .course-stack .mini-livret{
      position:absolute;
      height:calc(100% - 24px);
      max-height:258px;
      aspect-ratio:210 / 297;
      object-fit:cover;
      object-position:top center;
      background:#fff;
      border:1.4px solid rgba(10,61,134,.16);
      border-radius:4px;
      box-shadow:0 14px 28px rgba(10,61,134,.12);
      transform-origin:center bottom;
    }

    .course-stack .mini-livret:not(.course-page){display:none;}
    .mini-livret.course-page{
      height:calc(100% - 12px);
      max-height:276px;
      object-fit:cover;
      object-position:top center;
    }
    .mini-livret.course-page.activity{
      transform:translate(-88px, 1px) rotate(-3deg);
      z-index:3;
    }
    .mini-livret.course-page.synthesis{
      transform:translate(88px, 1px) rotate(3deg);
      z-index:4;
    }

    .mini-livret.livret-bw{transform:translate(-92px, 18px) rotate(-10deg) scale(.75); z-index:1; opacity:.95;}
    .mini-livret.livret-greenred{transform:translate(-48px, 8px) rotate(-5deg) scale(.82); z-index:2; opacity:.98;}
    .mini-livret.livret-default{transform:translate(0, -2px) rotate(0deg) scale(.92); z-index:5;}
    .mini-livret.livret-mathigon{transform:translate(62px, 12px) rotate(7deg) scale(.79); z-index:2; opacity:.97;}
    .mini-livret.livret-outline{transform:translate(94px, 18px) rotate(10deg) scale(.75); z-index:1; opacity:.95;}

    .course-badge{
      display:none;
      position:absolute;
      left:50%;
      bottom:12px;
      z-index:6;
      transform:translateX(-50%);
      padding:6px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.92);
      border:1px solid rgba(10,61,134,.14);
      box-shadow:0 10px 22px rgba(10,61,134,.12);
      color:var(--ink);
      font-weight:950;
      font-size:.78rem;
      letter-spacing:-.02em;
      white-space:nowrap;
    }

    .course-card-label{
      padding:14px 18px 16px;
      display:grid;
      gap:9px;
      border-top:1px solid rgba(10,61,134,.08);
    }

    .course-card-label .text{
      text-align:center;
      font-size:clamp(1.14rem,1.7vw,1.48rem);
      line-height:1.04;
      letter-spacing:-.04em;
      font-weight:950;
      color:var(--ink);
    }

    .course-links{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:6px;
    }

    .course-link{
      display:inline-grid;
      place-items:center;
      min-height:28px;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid rgba(10,61,134,.12);
      background:#fff;
      color:var(--ink);
      text-decoration:none;
      font-size:.72rem;
      font-weight:900;
      text-align:center;
      line-height:1.05;
      box-shadow:0 6px 12px rgba(10,61,134,.05);
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .course-link:hover,
    .course-link:focus-visible{
      transform:translateY(-1px);
      box-shadow:0 10px 16px rgba(10,61,134,.09);
      border-color:rgba(10,61,134,.22);
      outline:none;
    }

    .course-link.default{
      background:linear-gradient(135deg, rgba(87,201,238,.18), rgba(255,197,51,.22));
      border-color:rgba(10,61,134,.20);
    }

    @media (max-width: 900px){
      .wrap{width:min(100% - 24px, 640px); gap:22px; padding:18px 0 24px}
      .topbar{height:48px;justify-content:center}
      .logo-link{width:112px}
      .title-block{margin-top:0}
      .grid{grid-template-columns:1fr}
      .preview{padding:18px}
      .course-stack{min-height:235px;}
      .mini-livret.course-page.activity{transform:translate(-74px, 1px) rotate(-3deg)}
      .mini-livret.course-page.synthesis{transform:translate(74px, 1px) rotate(3deg)}
      .label{padding:16px 18px 18px}
    }
  </style>
<link rel="stylesheet" href="../../assets/css/consentement.css">
<script defer src="../../assets/js/consentement.js"></script>
</head>
<body>
  <div class="wrap">
