  }
  function uniqueExercises(n){
    const out=[]; const seen=new Set(); let guard=0;
    while(out.length<n&&guard<1500){
      guard++;
      const ex=makeExercise(); const key=ex.expr+'//'+reducedKey(ex.raw);
      if(!seen.has(key)){seen.add(key);out.push(ex);}
    }
    // Si le niveau choisi ne permet pas assez de variantes uniques, on complète quand même la fiche.
    while(out.length<n){out.push(makeExercise());}
    return out;
  }

  function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
  function tileFill(kind,sign){
    const mode=$('colorMode').value;
    const blue=cssVar('--x2'), green=cssVar('--x'), yellow=cssVar('--unit'), red=cssVar('--neg'), grey=cssVar('--bwneg');
    if(mode==='blueyellow') return sign<0?yellow:blue;
    if(mode==='bw') return sign<0?grey:'#fff';
    if(mode==='outline') return '#fff';
    if(mode==='sign') return sign<0?red:green;
    if(sign<0) return red;
    if(kind==='x2') return blue;
    if(kind==='x') return green;
    return yellow;
  }
  function tileHTML(kind,sign,orient='h'){const cls=['tile',kind==='u'?'u':kind]; if(kind==='x'&&orient==='v') cls.push('v'); if(sign<0) cls.push('neg'); let text=''; if(kind==='x2') text=sign<0?'−x²':'x²'; if(kind==='x') text=sign<0?'−x':'x'; if(kind==='u') text=sign<0?'−1':'1'; const labelText=roundedXText(text); const fill=tileFill(kind,sign); return `<span class="${cls.join(' ')}" aria-label="${text}"><svg class="tile-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" width="98" height="98" rx="0" fill="${fill}" stroke="#000" stroke-width="0.45" vector-effect="non-scaling-stroke" shape-rendering="crispEdges"/></svg><span class="tile-label">${labelText}</span></span>`;}
  function tileGroupsHTML(terms,compactClass=''){let html=`<div class="tile-groups ${compactClass}" data-base-class="${compactClass}">`; terms.forEach(t=>{const n=Math.abs(t.coeff), sign=Math.sign(t.coeff); const groupCls=['term-group']; if(t.kind==='x2')groupCls.push('x2group'); if(t.kind==='x')groupCls.push('xgroup'); if(t.kind==='u')groupCls.push('unitgroup'); html+=`<div class="${groupCls.join(' ')}" title="${termText(t,true)}">`; for(let i=0;i<n;i++) html+=tileHTML(t.kind,sign); html+='</div>';}); return html+'</div>';}
  function termBlockHTML(t){const sign=Math.sign(t.coeff); const fill=tileFill(t.kind,sign); const cls=['term-block',t.kind==='u'?'u':t.kind]; if(sign<0) cls.push('neg'); return `<span class="${cls.join(' ')}" style="--fill:${fill}">${mathifyExpr(termText(t,true))}</span>`;}
  function termVisualHTML(t,where='cell'){const n=Math.abs(t.coeff); if(n===0)return ''; const limit=where==='axis'?8:10; if(n>limit) return termBlockHTML(t); return tileGroupsHTML([t],where==='axis'?'axis-mini':'cell-mini');}
  function axisLabel(t,index=0){return termText(t,index===0).replace('+ ','+').replace('− ','−');}
  function axisFitClass(t,pos='top'){
    const n=Math.abs(t.coeff);
    if(t.kind==='x'){
      if(n>=5) return 'fit-tiny';
      if(n>=4) return 'fit-small';
      if(n>=3) return 'fit-medium';
    }
    if(t.kind==='u'&&pos==='top'){
      if(n>=8) return 'fit-small';
      if(n>=5) return 'fit-medium';
    }
    return '';
  }
  function axisTilesHTML(t,pos='top'){
    const n=Math.abs(t.coeff); if(!n) return '';
    const sign=Math.sign(t.coeff);
    const orient=(pos==='left'&&t.kind==='x')?'v':'h';
    const fit=axisFitClass(t,pos);
    let html=`<div class="axis-tiles ${pos} ${fit}" aria-hidden="true">`;
    const max=12;
    if(n>max) return `<div class="axis-tiles ${pos}">${termBlockHTML(t)}</div>`;
    for(let i=0;i<n;i++) html+=tileHTML(t.kind,sign,orient);
    return html+'</div>';
  }
  function axisHTML(t,visual,pos='top',index=0){
    const tiles=(visual==='tiles'||visual==='factors')?axisTilesHTML(t,pos):'';
    return `<div class="axis-content ${pos}"><span class="axis-label">${mathifyExpr(axisLabel(t,index))}</span>${tiles}</div>`;
  }
  function productFitClass(prod,rows,cols){
    const total=Math.abs(prod.coeff);
    const maxDim=Math.max(rows,cols);
    if(prod.kind==='x2'){
      if(total>=9 || maxDim>=3) return 'fit-tiny';
      if(total>=4) return 'fit-small';
      if(total>=2) return 'fit-medium';
      return '';
    }
    if(prod.kind==='x'){
      if(total>=9 || maxDim>=4) return 'fit-tiny';
      if(total>=5 || maxDim>=3) return 'fit-small';
      if(total>=3) return 'fit-medium';
      return '';
    }
    if(prod.kind==='u'){
      if(total>=12 || maxDim>=4) return 'fit-small';
      if(total>=7 || maxDim>=3) return 'fit-medium';
    }
    return '';
  }
  function productCellHTML(rowTerm,colTerm,visual){
    if(visual!=='tiles') return '';
    const prod=multiplyTerms(rowTerm,colTerm);
    const total=Math.abs(prod.coeff);
    if(total===0) return '';
    if(total>80) return termBlockHTML(prod);
    const sign=Math.sign(prod.coeff);
    const rows=Math.max(1,Math.abs(rowTerm.coeff));
    const cols=Math.max(1,Math.abs(colTerm.coeff));
    const orient=(prod.kind==='x'&&rowTerm.kind==='x'&&colTerm.kind==='u')?'v':'h';
    const fit=productFitClass(prod,rows,cols);
    let html=`<div class="product-grid kind-${prod.kind} orient-${orient} ${fit}" style="--pc:${cols};--pr:${rows};">`;
    for(let i=0;i<rows*cols;i++) html+=tileHTML(prod.kind,sign,orient);
    return html+'</div>';
  }
  function cellHTML(t,visual){if(visual==='tiles') return termVisualHTML(t,'cell'); return '';}

  function renderSingleModel(ex,visual){
    if(visual==='expression') return `<div class="plain-work"></div>`;
    const outside=[...ex.before,...ex.after];
    let outer=outside.length?`<div class="outer-terms">${outside.map(t=>termVisualHTML(t,'axis')).join('')}</div>`:'';
    const left=ex.left||{kind:'u',coeff:ex.mult};
    // Comme en double distributivité, on donne plus de largeur à une colonne 2x/3x
    // qu'à une colonne de constantes. Sinon, 3 tuiles x sont centrées puis coupées.
    const colTracks=ex.inside.map(t=>`minmax(0,${trackWeight(t)}fr)`).join(' ');
    const rowTrack=`minmax(0,${trackWeight(left)}fr)`;
    const gridStyle=`grid-template-columns:var(--am-left,82px) ${colTracks};grid-template-rows:var(--am-top,72px) ${rowTrack};`;
    let model=`<div class="area-model single" style="${gridStyle}"><div class="corner"></div>`;
    ex.inside.forEach((t,i)=>model+=`<div class="axis-top">${axisHTML(t,visual,'top',i)}</div>`);
    model+=`<div class="axis-left">${axisHTML(left,visual,'left',0)}</div>`;
    ex.inside.forEach(c=>model+=`<div class="area-cell product ${visual!=='tiles'?'blank':''}">${productCellHTML(left,c,visual)}</div>`);
    model+='</div>';
    return `<div class="model-wrap">${outer}${model}</div>`;
  }
  function trackWeight(t){
    const n=Math.max(1,Math.abs(t.coeff));
    return t.kind==='x' ? Math.max(2.4,n*2.8) : Math.max(1.15,n*1.15);
  }
  function renderDoubleModel(ex,visual){
    if(visual==='expression') return `<div class="plain-work"></div>`;
    const cw=ex.cols.map(trackWeight), rw=ex.rows.map(trackWeight);
    const gridStyle=`grid-template-columns:var(--am-left,82px) minmax(0,${cw[0]}fr) minmax(0,${cw[1]}fr);grid-template-rows:var(--am-top,72px) minmax(0,${rw[0]}fr) minmax(0,${rw[1]}fr);`;
    let model=`<div class="area-model double" style="${gridStyle}"><div class="corner"></div>`;
    ex.cols.forEach((t,i)=>model+=`<div class="axis-top">${axisHTML(t,visual,'top',i)}</div>`);
    ex.rows.forEach((r,ri)=>{model+=`<div class="axis-left">${axisHTML(r,visual,'left',ri)}</div>`; ex.cols.forEach((c,ci)=>{model+=`<div class="area-cell product ${visual!=='tiles'?'blank':''}">${productCellHTML(r,c,visual)}</div>`;});});
    model+='</div>';
    return `<div class="model-wrap">${model}</div>`;
  }
  function tilesOverflow(group,zone){return group.scrollHeight>zone.clientHeight+1||group.scrollWidth>zone.clientWidth+1;}
  function fitTiles(){document.querySelectorAll('.tile-groups').forEach(group=>{const zone=group.closest('.tile-zone,.area-cell,.axis-top,.axis-left,.outer-terms');if(!zone)return;group.classList.remove('compact','tiny','micro');const base=(group.dataset.baseClass||'').trim();if(base)group.classList.add(base);const steps=base==='tiny'?['micro']:(base==='compact'?['tiny','micro']:['compact','tiny','micro']);for(const cls of steps){if(!tilesOverflow(group,zone))break;group.classList.add(cls);}});}
  function gridInfo(count,format,activity,visual){
    let cols=format==='portrait'?2:3;
    if(activity==='mixed') cols=2;
    const rows=Math.ceil(count/cols);const dense=(format==='landscape'&&rows>=3&&activity!=='reduce')||(format==='landscape'&&rows>=4)||(format==='portrait'&&rows>=4);return {cols,rows,dense};
  }
  function headerHTML(title){return `<div class="sheet-header"><div><div class="sheet-title">${title}</div><div class="student-line">Nom : ........................................ &nbsp;&nbsp; Date : ........................</div></div><div class="sheet-meta"><img class="sheet-logo" src="${LOGO}" alt="maths&go"><span>Tuiles algébriques</span></div></div>`;}
  function modelInstruction(activity,visual,exprMode){
    const hidden=exprMode==='hidden';
    if(activity==='reduce') return hidden
      ? 'Écris l’expression correspondant aux tuiles, puis réduis-la.'
      : 'Réduis chaque expression en regroupant les termes semblables.';
    if(hidden){
      if(visual==='tiles') return 'Écris l’expression correspondant au schéma, puis développe et réduis.';
      if(visual==='factors') return 'Écris l’expression correspondant au schéma, complète les cases, puis développe et réduis.';
      if(visual==='grid') return 'Écris l’expression correspondant au schéma, puis complète-le.';
      return 'Écris l’expression, puis développe et réduis.';
    }
    if(visual==='tiles') return 'Observe les tuiles algébriques, puis écris le résultat développé et réduit.';
    if(visual==='factors') return 'Complète les cases, puis écris le résultat développé et réduit.';
    if(visual==='grid') return 'Complète le schéma, puis développe et réduis.';
    return 'Développe puis réduis chaque expression.';
  }
  function titleAndInstruction(activity,visual,exprMode){
    if(activity==='reduce') return ['Réduire une expression',modelInstruction(activity,visual,exprMode)];
    if(activity==='single') return ['Distributivité simple',modelInstruction(activity,visual,exprMode)];
    if(activity==='double') return ['Double distributivité',modelInstruction(activity,visual,exprMode)];
    return ['Calcul littéral — entraînement mixte',exprMode==='hidden'?'Écris les expressions à partir des aides visuelles, puis calcule.':'Réduis, développe ou complète selon la situation. Écris les étapes utiles.'];
  }
  function renderExerciseCard(ex,i,number,activity,visual,exprMode,info,showAnswer){
    const visualForEx=(activity==='mixed'?(visual==='auto'?(ex.visual||'factors'):visual):visual);
    const headHTML=exprMode==='hidden'
      ? '<span class="math-part expr-blank">Expression :</span>'
      : `<span class="math-part">${mathifyExpr(ex.expr)}</span>`;
    let html=`<article class="card ${i>=(info.rows-1)*info.cols?'last-row':''}"><div class="expr-line"><span class="num">${number})</span>${headHTML}</div>`;
    if(ex.type==='reduce'){
      const total=allTileCount(ex.terms); const compactClass=(info.dense||total>20)?'tiny':(total>15?'compact':'');
      html+=`<div class="tile-zone">${visualForEx==='tiles'?tileGroupsHTML(ex.terms,compactClass):'<div class="plain-work"></div>'}</div>`;
    } else if(ex.type==='single') {
      html+=`<div class="work-zone">${renderSingleModel(ex,visualForEx)}</div>`;
    } else {
      html+=`<div class="work-zone">${renderDoubleModel(ex,visualForEx)}</div>`;
    }
    const answerMarkup=answerHTML(ex.raw);
    html+=`<div class="answer-line">Réponse : ${showAnswer?answerMarkup:''}</div></article>`;
    return html;
  }
  function blankCard(i,info){
    return `<article class="card placeholder ${i>=(info.rows-1)*info.cols?'last-row':''}"></article>`;
  }
  function pageSlots(pageExercises,pageIndex,count,info,mirror=false){
    const slots=Array(info.rows*info.cols).fill(null);
    pageExercises.forEach((ex,i)=>{
      const row=Math.floor(i/info.cols), col=i%info.cols;
      const slot=mirror ? row*info.cols+(info.cols-1-col) : i;
      slots[slot]={ex,number:pageIndex*count+i+1};
    });
    return slots;
  }
  function renderPage(pageExercises,pageIndex,count,activity,visual,exprMode,info,pageClass,title,instruction,showAnswer,mirror=false){
    let html=`<section class="${pageClass}"><div class="sheet">`;
    html+=headerHTML(title);
    html+=`<div class="section-title"><span class="pill">Exercices</span><span class="section-instruction">${instruction}</span></div>`;
    html+=`<div class="exercise-grid cols-${info.cols}" style="--cols:${info.cols};--rows:${info.rows};">`;
    pageSlots(pageExercises,pageIndex,count,info,mirror).forEach((item,i)=>{
      html+=item?renderExerciseCard(item.ex,i,item.number,activity,visual,exprMode,info,showAnswer):blankCard(i,info);
    });
    html+=`</div></div><div class="footer">aca.re/maths/mathsgo</div></section>`;
    return html;
  }
  function syncSimpleModeFromAnswers(){
    const mode=$('showAnswers').checked?'answer':'student';
    if($('printMode').value!==mode) $('printMode').value=mode;
  }
  function syncAnswersFromPrintMode(){
    const mode=$('printMode').value;
    if(mode==='student') $('showAnswers').checked=false;
    if(mode==='answer') $('showAnswers').checked=true;
  }
  function fitPreviewPages(){
    const preview=document.querySelector('.preview-wrap');
    if(!preview) return;
    const pages=Array.from(preview.querySelectorAll('.page'));
    pages.forEach(page=>page.style.removeProperty('zoom'));
    if(!window.matchMedia('(max-width: 1050px)').matches || window.matchMedia('print').matches) return;
    const availableWidth=Math.max(0,preview.clientWidth-10);
    pages.forEach(page=>{
      const naturalWidth=page.offsetWidth;
      if(naturalWidth>0) page.style.zoom=String(Math.min(1,availableWidth/naturalWidth));
    });
  }
  function render(useExisting=false){
    const activity=$('activity').value, visual=$('visual').value, format=$('format').value, exprMode=$('exprTop').value;
    const printMode=$('printMode')?$('printMode').value:($('showAnswers').checked?'answer':'student');
    const maxPerPage=12;
    $('count').max=maxPerPage;
    const count=Math.max(2,Math.min(maxPerPage,+$('count').value||6));
    const pages=Math.max(1,Math.min(4,+$('pages').value||1));
    const totalCount=count*pages;
    const info=gridInfo(count,format,activity,visual);
    if(!useExisting||currentExercises.length!==totalCount) currentExercises=uniqueExercises(totalCount);
    const pageClass=`page ${format} ${info.dense?'dense':''} ${activity!=='reduce'?'model':''} color-${$('colorMode').value} ${$('showLabels').checked?'':'no-labels'}`;
    const [title,instruction]=titleAndInstruction(activity,visual,exprMode);
    const preview=document.querySelector('.preview-wrap');
    let allPages='';
    if(printMode==='sequence'){
      for(let p=0;p<pages;p++) allPages+=renderPage(currentExercises.slice(p*count,(p+1)*count),p,count,activity,visual,exprMode,info,pageClass,title,instruction,false,false);
      for(let p=0;p<pages;p++) allPages+=renderPage(currentExercises.slice(p*count,(p+1)*count),p,count,activity,visual,exprMode,info,pageClass,title,instruction,true,false);
    } else if(printMode==='duplex'){
      for(let p=0;p<pages;p++){
        const pageExercises=currentExercises.slice(p*count,(p+1)*count);
        allPages+=renderPage(pageExercises,p,count,activity,visual,exprMode,info,pageClass,title,instruction,false,false);
        allPages+=renderPage(pageExercises,p,count,activity,visual,exprMode,info,pageClass,title,instruction,true,true);
      }
    } else {
      const showAnswer=printMode==='answer';
      for(let p=0;p<pages;p++) allPages+=renderPage(currentExercises.slice(p*count,(p+1)*count),p,count,activity,visual,exprMode,info,pageClass,title,instruction,showAnswer,false);
    }
    preview.innerHTML=allPages;
    requestAnimationFrame(()=>{fitTiles();fitPreviewPages();});
  }
  bindControlPanel();
  $('activity').addEventListener('change',()=>{updateMenu(true);refreshControlUI();render(false);});
  $('visual').addEventListener('change',()=>{syncSegmentGroup('visual');render(true);});
  $('exprTop').addEventListener('change',()=>{syncSegmentGroup('exprTop');render(true);});
  $('level').addEventListener('change',()=>{syncSegmentGroup('level');render(false);});
  $('generateBtn').addEventListener('click',()=>render(false));
  $('printBtn').addEventListener('click',()=>{render(true);requestAnimationFrame(()=>{fitTiles();setTimeout(()=>window.print(),80);});});
  $('studentBtn').addEventListener('click',()=>{$('printMode').value='student';$('showAnswers').checked=false;refreshControlUI();render(true)});
  $('answerBtn').addEventListener('click',()=>{$('printMode').value='answer';$('showAnswers').checked=true;refreshControlUI();render(true)});
  ['count','pages','format'].forEach(id=>$(id).addEventListener('change',()=>{syncSegmentGroup(id);updateStepperDisplays();render(false);}));
  $('printMode').addEventListener('change',()=>{syncAnswersFromPrintMode();refreshControlUI();render(true);});
  $('showAnswers').addEventListener('change',()=>{syncSimpleModeFromAnswers();refreshControlUI();render(true);});
  ['showLabels','colorMode'].forEach(id=>{$(id).addEventListener('input',()=>{refreshControlUI();render(true);});$(id).addEventListener('change',()=>{refreshControlUI();render(true);});});
  window.addEventListener('resize',()=>requestAnimationFrame(()=>{fitTiles();fitPreviewPages();}));
  window.addEventListener('beforeprint',fitTiles);
  window.addEventListener('afterprint',()=>requestAnimationFrame(fitPreviewPages));
  updateMenu(false); $('level').value='5'; refreshControlUI(); render(false);
})();
</script>
</body>
