<script id="moteur-tuiles">
/* ==========================================================================
   MOTEUR DES TUILES — fiches d'exercices (lot 1 puis lot 2 « par marches », 21/11/2026)
   Aucun accès à la page ici : ce bloc se teste seul avec node --test
   (tests/generateur-tuiles-fiches.test.mjs).
   - le dessin des tuiles est celui des feuilles de 3e (figures.py), en SVG, en mm :
     tuile 1 = carré de 4,4 mm, 𝑥 = 3,4 unités (on ne « compte » pas un 𝑥 avec des 1),
     tuiles des bords à la même taille que celles du rectangle,
     signe d'une tuile du produit = règle des signes ;
   - les marches du cours (0 à 15), chacune avec ses variantes qui tournent, tirées au hasard
     (graine) ; chaque réponse vérifiée en relisant le TEXTE affiché (analyseur indépendant du tirage).
   ========================================================================== */
const MoteurTuiles = (function () {
  'use strict';

  // ------------------------------------------------------------------ dessin
  const U = 4.4;            // tuile 1, en mm (la même partout)
  const XU = 3.4;           // longueur de 𝑥 en unités
  const GAP = 0.9;          // jour entre deux tuiles d'un tas
  const E = 1.6;            // écart bords / rectangle (le trait du « × » passe au milieu)
  const FS_MIN = 2.65;      // 7,5 pt : jamais d'étiquette plus petite
  const TRAIT = '#17324D';
  const ORANGE = '#B45309';
  const MOINS = '−';
  const POLICE = "SplatLettres, MGPoppins, 'Poppins', sans-serif";

  const f2 = (v) => (Math.round(v * 100) / 100).toString();

  // largeur approchée d'une étiquette, en « em » (Poppins Bold ; 𝑥 de SplatLettres agrandi 1,1 fois)
  function largeur(t) {
    let s = 0;
    for (const c of t) s += c === MOINS ? 0.55 : c === '²' ? 0.42 : c === 'x' ? 0.73 : c === '1' ? 0.4 : 0.62;
    return s;
  }

  // une étiquette : chiffres et signes en Poppins, la lettre en 𝑥 rond (SplatLettres)
  function etiquetteSvg(t, fs) {
    let out = '';
    for (const c of t) out += c === 'x' ? `<tspan font-size="${f2(fs * 1.1)}">\u{1D465}</tspan>` : c;
    return out;
  }

  function tuile(x, y, w, h, neg, label, fs, vertical) {
    let s = `<rect class="${neg ? 'tn' : 'tp'}" x="${f2(x)}" y="${f2(y)}" width="${f2(w)}" height="${f2(h)}" stroke="${TRAIT}" stroke-width="0.3"/>`;
    if (!label) return s;
    const cx = x + w / 2, cy = y + h / 2;
    if (vertical) fs = Math.min(fs, w * (label[0] === MOINS ? 0.46 : 0.62));
    else if (h < 2 * fs) fs = Math.min(fs, h * 0.72);
    let serre = '';
    if (fs < FS_MIN) {
      fs = FS_MIN;
      if (largeur(label) * fs > w - 0.6) serre = ` textLength="${f2(w - 0.6)}" lengthAdjust="spacingAndGlyphs"`;
    }
    // ligne de base : les chiffres (hauteur de capitale 0,70) se centrent à +0,35 ;
    // le 𝑥 rond (bas de casse) un peu plus haut, le 𝑥² entre les deux (mesuré au navigateur)
    const k = label.includes('x') ? (label.includes('²') ? 0.31 : 0.25) : 0.35;
    s += `<text x="${f2(cx)}" y="${f2(cy + k * fs)}" text-anchor="middle" font-size="${f2(fs)}" font-weight="700" fill="${TRAIT}"${serre}>${etiquetteSvg(label, fs)}</text>`;
    return s;
  }

  function svg(w, h, corps, cls) {
    return {
      html: `<svg xmlns="http://www.w3.org/2000/svg" class="tuiles${cls ? ' ' + cls : ''}" viewBox="0 0 ${f2(w)} ${f2(h)}" width="${f2(w)}mm" height="${f2(h)}mm" font-family="${POLICE}">${corps}</svg>`,
      w, h, corps,
    };
  }

  const LAB = { x2: 'x²', x: 'x', 1: '1' };
  const lab = (k, neg) => (neg ? MOINS : '') + LAB[k];

  /** Un tas : groupes [[sorte, nombre]] (nombre < 0 : tuiles de l'autre couleur), les 𝑥 debout,
   *  les 1 en colonnes de 3 posées en bas. */
  function tas(groupes, o = {}) {
    const u = o.u || U, sc = u / U, gap = GAP * sc, X = XU * u;
    const gg = o.gg != null ? o.gg : 1.5 * u;
    let H;
    if (groupes.every((g) => g[0] === '1')) {
      const h = Math.min(3, Math.max(...groupes.map((g) => Math.abs(g[1]))));
      H = h * u + (h - 1) * gap * 0.6;
    } else H = X;
    const fs = 0.95 * u;
    let cx = 0, corps = '';
    groupes.forEach(([k, n], gi) => {
      const neg = n < 0;
      n = Math.abs(n);
      if (gi > 0) cx += gg - gap;
      if (k === 'x2') {
        for (let i = 0; i < n; i++) { corps += tuile(cx, 0, X, X, neg, lab('x2', neg), fs * 1.15); cx += X + gap; }
      } else if (k === 'x') {
        for (let i = 0; i < n; i++) { corps += tuile(cx, 0, u, X, neg, lab('x', neg), fs * 0.9, true); cx += u + gap; }
      } else {
        while (n > 0) {
          const kk = Math.min(3, n);
          for (let r = 0; r < kk; r++) corps += tuile(cx, H - (r + 1) * u - r * gap * 0.6, u, u, neg, lab('1', neg), 0.42 * u);
          n -= kk; cx += u + gap;
        }
      }
    });
    const w = Math.max(cx - gap, 1);
    return svg(w + 0.4, H + 0.4, `<g transform="translate(0.2 0.2)">${corps}</g>`);
  }

  /** Une paire nulle entourée : la tuile (de la couleur « neg ») et celle de même forme, de l'autre couleur. */
  function paire(k, neg, o = {}) {
    const u = o.u || U, sc = u / U, gap = GAP * sc, X = XU * u, pad = 1.0 * sc;
    const fs = 0.95 * u;
    const hy = k === '1' ? u : X;
    let cx = pad, corps = '';
    for (const g of [neg, !neg]) {
      if (k === 'x') { corps += tuile(cx, pad, u, X, g, lab('x', g), fs * 0.9, true); cx += u + gap; }
      else if (k === 'x2') { corps += tuile(cx, pad, X, X, g, lab('x2', g), fs * 1.15); cx += X + gap; }
      else { corps += tuile(cx, pad, u, u, g, lab('1', g), 0.42 * u); cx += u + gap; }
    }
    cx -= gap;
    corps += `<rect x="0" y="0" width="${f2(cx + pad)}" height="${f2(hy + 2 * pad)}" rx="${f2(1.6 * sc)}" fill="none" stroke="${ORANGE}" stroke-width="${f2(0.45 * Math.max(sc, 0.7))}"/>`;
    return svg(cx + pad + 0.5, hy + 2 * pad + 0.5, `<g transform="translate(0.25 0.25)">${corps}</g>`);
  }

  /** Plusieurs paires dans un seul dessin, posées en bas (icône du menu). */
  function paires(liste, o = {}) {
    const ent = 2.4 * ((o.u || U) / U);
    const ps = liste.map(([k, neg]) => paire(k, neg, o));
    const H = Math.max(...ps.map((p) => p.h));
    let x = 0, corps = '';
    for (const p of ps) { corps += `<g transform="translate(${f2(x)} ${f2(H - p.h)})">${p.corps}</g>`; x += p.w + ent; }
    return svg(x - ent, H, corps);
  }

  const NEGT = (k) => k[0] === '-';
  const BASE = (k) => k.replace('-', '');

  /** Le rectangle de tuiles (modèle d'aire) : les facteurs en tuiles sur les bords
   *  (gauche : tuiles debout ; haut : tuiles couchées), le produit au milieu.
   *  vide = 'interieur' : cadre pointillé à remplir ; 'bords' : bords vides avec « ? ». */
  function rectangle(gauche, haut, o = {}) {
    const u = o.u || U, sc = u / U, X = XU * u, e = E * sc, vide = o.vide || null;
    const L = (k) => (BASE(k) === 'x' ? X : u);
    const fs = 0.95 * u;
    const ox = u + e + 0.4 * sc, oy = u + e + 0.4 * sc;
    const W = haut.reduce((s, k) => s + L(k), 0);
    const H = gauche.reduce((s, k) => s + L(k), 0);
    let corps = '';
    if (vide !== 'interieur') {
      let y = oy;
      for (const g of gauche) {
        let x = ox;
        for (const h of haut) {
          const w = L(h), hh = L(g), gb = BASE(g), hb = BASE(h);
          const neg = NEGT(g) !== NEGT(h);
          let t, vert = false;
          if (gb === 'x' && hb === 'x') t = 'x²';
          else if (gb === 'x' || hb === 'x') { t = 'x'; vert = hb === '1'; }
          else t = '1';
          const taille = t === 'x²' ? fs * 1.1 : t === '1' ? 0.44 * u : fs * 0.9;
          corps += tuile(x, y, w, hh, neg, (neg ? MOINS : '') + t, taille, vert);
          x += w;
        }
        y += L(g);
      }
    } else {
      corps += `<rect x="${f2(ox)}" y="${f2(oy)}" width="${f2(W)}" height="${f2(H)}" fill="none" stroke="${TRAIT}" stroke-width="0.3" stroke-dasharray="1.2 0.9"/>`;
    }
    const yh = oy - e - u, xg = ox - e - u;
    if (vide === 'bords') {
      // lot 3 : les bords à trouver sont deux bandes vides en pointillés (l'élève y dessine ses tuiles), plus de « ? »
      corps += `<rect class="bord-vide" x="${f2(ox)}" y="${f2(yh)}" width="${f2(W)}" height="${f2(u)}" fill="none" stroke="${TRAIT}" stroke-width="0.3" stroke-dasharray="1.2 0.9"/>`;
      corps += `<rect class="bord-vide" x="${f2(xg)}" y="${f2(oy)}" width="${f2(u)}" height="${f2(H)}" fill="none" stroke="${TRAIT}" stroke-width="0.3" stroke-dasharray="1.2 0.9"/>`;
    } else {
      let x = ox;
      for (const h of haut) {
        const m = NEGT(h) ? MOINS : '';
        if (BASE(h) === 'x') corps += tuile(x, yh, X, u, NEGT(h), m + 'x', fs * 0.9);
        else corps += tuile(x, yh, u, u, NEGT(h), m + '1', 0.44 * u);
        x += L(h);
      }
      let y = oy;
      for (const g of gauche) {
        const m = NEGT(g) ? MOINS : '';
        if (BASE(g) === 'x') corps += tuile(xg, y, u, X, NEGT(g), m + 'x', fs * 0.9, true);
        else corps += tuile(xg, y, u, u, NEGT(g), m + '1', 0.44 * u);
        y += L(g);
      }
    }
    corps += `<path d="M${f2(xg)} ${f2(oy - e / 2)} H${f2(ox + W)}" stroke="${TRAIT}" stroke-width="0.3" fill="none"/>`;
    corps += `<path d="M${f2(ox - e / 2)} ${f2(yh)} V${f2(oy + H)}" stroke="${TRAIT}" stroke-width="0.3" fill="none"/>`;
    return svg(ox + W + 0.6 * sc, oy + H + 0.6 * sc, corps);
  }

  // ------------------------------------------------------------------ polynômes (tableaux de coefficients)
  const P = {
    norm(p) { const q = p.slice(); while (q.length > 1 && q[q.length - 1] === 0) q.pop(); return q.length ? q : [0]; },
    add(a, b) { const n = Math.max(a.length, b.length), r = []; for (let i = 0; i < n; i++) r.push((a[i] || 0) + (b[i] || 0)); return P.norm(r); },
    neg(a) { return a.map((c) => -c || 0); },
    mul(a, b) { const r = new Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { r[i + j] += x * y; })); return P.norm(r); },
    eq(a, b) { a = P.norm(a); b = P.norm(b); return a.length === b.length && a.every((c, i) => c === b[i]); },
    nul(a) { return P.norm(a).every((c) => c === 0); },
  };
  const DEG = { x2: 2, x: 1, 1: 0 };
  const SORTE = ['1', 'x', 'x2'];
  function polyGroupes(g) { const p = [0, 0, 0]; for (const [k, n] of g) p[DEG[k]] += n; return P.norm(p); }
  function polyTermes(t) { const p = [0, 0, 0]; for (const m of t) p[m.k] += m.c; return P.norm(p); }
  function polyTuiles(liste) { const p = [0, 0]; for (const k of liste) p[BASE(k) === 'x' ? 1 : 0] += NEGT(k) ? -1 : 1; return P.norm(p); }
  /** Ce que le rectangle contient vraiment, tuile par tuile (règle des signes). */
  function polyRectangle(gauche, haut) {
    const p = [0, 0, 0];
    for (const g of gauche) for (const h of haut) p[(BASE(g) === 'x') + (BASE(h) === 'x')] += NEGT(g) !== NEGT(h) ? -1 : 1;
    return P.norm(p);
  }

  // ------------------------------------------------------------------ écriture (texte « clavier » : x, ², −)
  function txtMono(c, k, premier) {
    const s = c < 0 ? (premier ? MOINS : ` ${MOINS} `) : (premier ? '' : ' + ');
    const a = Math.abs(c);
    return s + (k === 0 ? String(a) : (a === 1 ? '' : String(a)) + (k === 2 ? 'x²' : 'x'));
  }
  const txtTermes = (l) => l.map((t, i) => txtMono(t.c, t.k, i === 0)).join('');
  function txtPoly(p) {
    const l = [];
    for (const k of [2, 1, 0]) if (p[k]) l.push({ k, c: p[k] });
    return l.length ? txtTermes(l) : '0';
  }
  const txtMonoSeul = (m) => txtMono(m.c, m.k, true);

  // ------------------------------------------------------------------ relecture du texte affiché (vérification)
  function analyser(txt) {
    const s = txt.replace(/\s+/g, '').replace(/−/g, '-').replace(/×/g, '*').replace(/\[/g, '(').replace(/\]/g, ')');
    let i = 0;
    const voir = () => s[i];
    function expr() {
      let p = [0], signe = 1;
      if (voir() === '-') { signe = -1; i++; } else if (voir() === '+') i++;
      p = P.add(p, signe < 0 ? P.neg(terme()) : terme());
      while (i < s.length && (voir() === '+' || voir() === '-')) {
        const sg = s[i++];
        p = P.add(p, sg === '-' ? P.neg(terme()) : terme());
      }
      return p;
    }
    function terme() {
      let p = facteur();
      while (i < s.length && (voir() === '*' || voir() === '(' || voir() === 'x' || /[0-9]/.test(voir()))) {
        if (voir() === '*') i++;
        p = P.mul(p, facteur());
      }
      return p;
    }
    function facteur() {
      let p;
      if (voir() === '(') {
        i++; p = expr();
        if (voir() !== ')') throw new Error('parenthèse non fermée : ' + txt);
        i++;
      } else if (voir() === 'x') { i++; p = [0, 1]; }
      else if (/[0-9]/.test(voir())) { let n = ''; while (/[0-9]/.test(voir() || '')) n += s[i++]; p = [Number(n)]; }
      else if (voir() === '-') { i++; p = P.neg(facteur()); }
      else throw new Error(`lecture impossible (${voir()}) : ${txt}`);
      if (voir() === '²') { i++; p = P.mul(p, p); }
      return p;
    }
    const p = expr();
    if (i !== s.length) throw new Error('fin inattendue : ' + txt);
    return p;
  }
  /** Une expression réduite : au plus un terme de chaque sorte, rangés x², x, nombre. */
  function estReduite(txt) {
    const t = txt.replace(/^−/, '').split(/ [+−] /);
    const sortes = t.map((m) => (/x²$/.test(m) ? 2 : /x$/.test(m) ? 1 : 0));
    return sortes.every((k, j) => j === 0 || k < sortes[j - 1]);
  }

  /** Les tableaux produits (lot 3) : chaque case = bord de gauche × bord du haut, relu dans le texte affiché. */
  function verifierTabs(it) {
    for (const t of it.tabs || []) {
      if (t.c.length !== t.g.length) return 'tableau : lignes';
      for (let i = 0; i < t.g.length; i++) {
        if (t.c[i].length !== t.h.length) return 'tableau : colonnes';
        for (let j = 0; j < t.h.length; j++) {
          if (!P.eq(analyser(t.c[i][j]), P.mul(analyser(t.g[i]), analyser(t.h[j])))) return `case fausse : ${t.g[i]} × ${t.h[j]} ≠ ${t.c[i][j]}`;
        }
      }
    }
    return null;
  }
  const sommeCases = (t) => t.c.flat().reduce((s, c) => P.add(s, analyser(c)), [0]);

  function verifierItem(it) {
    const err = (m) => `${it.forme} « ${it.enonce || it.reponse} » : ${m}`;
    try {
      const ft = verifierTabs(it);
      if (ft) return err(ft);
      if (it.tabs && it.tabs.length === 1 && it.forme !== 'ensemble' && !P.eq(sommeCases(it.tabs[0]), analyser(it.enonce))) return err('somme des cases ≠ énoncé');
      switch (it.forme) {
        case 'commun': {        // marche 12 : (𝑥 + 2)(𝑥 + 3) + (𝑥 + 2)(2𝑥 − 1) = (𝑥 + 2)[(𝑥 + 3) + (2𝑥 − 1)] = (𝑥 + 2)(3𝑥 + 2)
          const e = analyser(it.enonce);
          for (const l of it.lignes) if (!P.eq(analyser(l), e)) return err(`ligne fausse : ${l}`);
          if (!it.lignes[0].startsWith(it.commun + '[')) return err('le facteur commun n\'est pas devant');
          const fin = it.lignes[it.lignes.length - 1].match(/^(\([^()]*\))(\([^()]*\))$/);
          if (!fin || fin[1] !== it.commun) return err('la dernière ligne n\'est pas (facteur commun)( … )');
          if (!estReduite(fin[2].slice(1, -1))) return err('la parenthèse n\'est pas réduite');
          return null;
        }
        case 'carres': {        // marche 14 : 𝑎² − 𝑏² = (𝑎 − 𝑏)(𝑎 + 𝑏)
          const e = analyser(it.enonce), A = analyser(it.a), B = analyser(it.b);
          if (!P.eq(P.add(P.mul(A, A), P.neg(P.mul(B, B))), e)) return err('𝑎² − 𝑏² ≠ énoncé');
          if (!P.eq(analyser(it.reponse), e)) return err('produit faux');
          if (it.reponse !== `(${it.a} ${MOINS} ${it.b})(${it.a} + ${it.b})`) return err('pas la forme (𝑎 − 𝑏)(𝑎 + 𝑏)');
          return null;
        }
        case 'ecrire':
          if (!P.eq(polyGroupes(it.tas), analyser(it.reponse))) return err('tuiles ≠ réponse');
          if (!estReduite(it.reponse)) return err('réponse non réduite');
          return null;
        case 'oppose':
          if (!P.eq(polyGroupes(it.tas), analyser(it.enonce))) return err('tuiles ≠ énoncé');
          if (!P.nul(P.add(analyser(it.enonce), analyser(it.reponse)))) return err('la somme ne fait pas 0');
          if (it.ecrit && !P.eq(analyser(it.ecrit), analyser(it.reponse))) return err('−( ) ≠ réponse');
          if (!P.eq(polyGroupes(it.paires.map(([k, n]) => [k, n ? -1 : 1])), polyGroupes(it.tas))) return err('paires ≠ tuiles');
          return null;
        case 'reduire': {
          const e = analyser(it.enonce);
          if (!P.eq(polyGroupes(it.tas), e)) return err('tuiles ≠ énoncé');
          if (!P.eq(e, analyser(it.reponse))) return err('réduction fausse');
          if (!estReduite(it.reponse)) return err('réponse non réduite');
          if (!P.eq(polyGroupes(it.reste), e)) return err('le reste ≠ la réponse');
          return null;
        }
        case 'produit': {
          const e = analyser(it.enonce);
          for (const l of it.lignes) if (!P.eq(analyser(l), e)) return err(`ligne fausse : ${l}`);
          if (!estReduite(it.lignes[it.lignes.length - 1]) && it.lignes.length > 1) return err('dernière ligne non réduite');
          if (!P.eq(polyRectangle(it.gauche, it.haut), e)) return err('rectangle ≠ produit');
          if (!P.eq(P.mul(polyTuiles(it.gauche), polyTuiles(it.haut)), e)) return err('bords ≠ facteurs');
          if (it.f1 && !P.eq(P.mul(polyTermes(it.f1), polyTermes(it.f2)), e)) return err('facteurs ≠ énoncé');
          return null;
        }
        case 'factoriser': {
          const e = analyser(it.enonce);
          if (!estReduite(it.enonce)) return err('somme non réduite');
          if (!P.eq(analyser(it.reponse), e)) return err('produit faux');
          if (!/\)/.test(it.reponse)) return err('la réponse n\'est pas un produit');
          if (!P.eq(polyRectangle(it.gauche, it.haut), e)) return err('rectangle ≠ somme');
          return null;
        }
        case 'ensemble': {
          const e = analyser(it.enonce);
          let tot = [0];
          for (const m of it.morceaux) {
            const q = m.tas ? polyGroupes(m.tas) : polyRectangle(m.gauche, m.haut);
            tot = P.add(tot, m.moins ? P.neg(q) : q);
          }
          if (!P.eq(tot, e)) return err('tuiles ≠ énoncé');
          // les tableaux : un par produit, dans l'ordre des morceaux (le « − » devant un produit reste hors du tableau)
          const prods = it.morceaux.filter((m) => !m.tas);
          if (it.tabs && it.tabs.length !== prods.length) return err('un tableau par produit');
          if (it.tabs) for (let i = 0; i < prods.length; i++) if (!P.eq(sommeCases(it.tabs[i]), polyRectangle(prods[i].gauche, prods[i].haut))) return err('tableau ≠ produit');
          for (const l of it.lignes) if (!P.eq(analyser(l), e)) return err(`ligne fausse : ${l}`);
          if (!estReduite(it.lignes[it.lignes.length - 1])) return err('dernière ligne non réduite');
          return null;
        }
        default: return err('forme inconnue');
      }
    } catch (x) { return err(x.message); }
  }

  // ------------------------------------------------------------------ hasard (graine)
  function hasard(graine) {
    let a = graine >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hacher(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  const ent = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  const choix = (r, t) => t[Math.floor(r() * t.length)];
  const pgcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

  // ------------------------------------------------------------------ les marches du cours (lot 2)
  // Le menu suit les marches du cours de 3e (0 à 15). Chaque marche a ses VARIANTES (ses cas) :
  // une fiche les fait toutes tourner, la marche est « équilibrée d'office ».
  const lin = (a, b) => [{ k: 1, c: a }, { k: 0, c: b }];          // a𝑥 + b
  const linInv = (a, b) => [{ k: 0, c: b }, { k: 1, c: a }];       // b + a𝑥 (le nombre d'abord)
  const tuilesDe = (f) => { const l = []; for (const m of f) for (let i = 0; i < Math.abs(m.c); i++) l.push((m.c < 0 ? '-' : '') + (m.k === 1 ? 'x' : '1')); return l; };
  /** Longueur d'un facteur posé en tuiles, en unités (𝑥 = 3,4) : la place qu'il prend sur un bord. */
  const longueur = (f) => f.reduce((t, m) => t + Math.abs(m.c) * (m.k === 1 ? XU : 1), 0);
  const L_HAUT = 16, L_GAUCHE = 11.2;       // au-delà, le rectangle ne tient plus sur une demi-page (ou devient trop haut) : on tire autre chose
  const L_DOUBLE = 9.8;                     // (2𝑥 + 3)(…) : avec deux lignes de calcul dessous, trois rangées tiennent sur une page
  const L_APRES = 8.5;                      // (2𝑥 + 1) × 3 : la parenthèse est à gauche, debout — on la garde courte
  const par = (f) => `(${txtTermes(f)})`;
  const signe = (r, p) => (r() < p ? -1 : 1);

  // ---- lot 3 : le support. Avec les tuiles, les nombres sont bornés par la place (une tuile ne rapetisse jamais) ;
  // avec le tableau ou sans aide, ils sont variés : −4𝑥(2𝑥 − 9), (5𝑥 − 7)(3𝑥 + 2), (3𝑥 − 4)², 9𝑥² − 16…
  // GRAND est posé par reserve() le temps d'un tirage. Avec les tuiles, le tirage est EXACTEMENT celui du lot 2
  // (mêmes appels au hasard) : une fiche en tuiles ne change pas pour une même graine.
  let GRAND = false;
  const G = (petit, grand) => (GRAND ? grand : petit);

  /** Le tableau produit de f1 × f2, comme dans le cours : bords et cases en termes signés, « + » devant une case quand
   *  deux négatifs se multiplient (−3 × (−2) = +6). Un facteur seul (un nombre, 3𝑥) va à gauche. */
  function tabDe(f1, f2) {
    if (f1.length > 1 && f2.length === 1) [f1, f2] = [f2, f1];
    return {
      g: f1.map(txtMonoSeul), h: f2.map(txtMonoSeul),
      c: f1.map((a) => f2.map((b) => (a.c < 0 && b.c < 0 ? '+' : '') + txtMonoSeul({ k: a.k + b.k, c: a.c * b.c }))),
    };
  }

  // ---- marches 0 à 2 : les tas de tuiles
  const V_TAS = { x1: [false, false], x1n: [false, true], x2: [true, false], x2n: [true, true] };

  function groupesAuHasard(r, avecX2, neg, auMoinsDeux) {
    let sortes;
    if (avecX2) sortes = choix(r, [['x2', 'x', '1'], ['x2', 'x'], ['x2', '1'], ['x2', 'x', '1'], ['x', '1']]);
    else sortes = auMoinsDeux || r() < 0.85 ? ['x', '1'] : ['x'];
    // avec 1 et 𝑥 seulement, des tas un peu plus grands (sinon trop peu d'exercices différents) ;
    // avec 𝑥², des tas qui tiennent dans une colonne sur trois ; sans tuiles, des nombres jusqu'à 9
    let max;
    if (GRAND) max = { x2: 7, x: 9, 1: 9 };
    else if (!avecX2) max = { x: 6, 1: 6 };
    else if (sortes.length === 3) max = { x2: 1, x: 3, 1: 3 };
    else max = { x2: 2, x: 3, 1: 5 };
    const g = sortes.map((k) => [k, ent(r, 1, max[k])]);
    if (avecX2 && !g.some(([k]) => k === 'x2')) return null;       // ce cas-là appartient à « 1 et 𝑥 »
    if (neg) {
      g.forEach((gr) => { if (r() < 0.5) gr[1] = -gr[1]; });
      if (g.every((gr) => gr[1] > 0)) { const i = ent(r, 0, g.length - 1); g[i][1] = -g[i][1]; }
    }
    return g;
  }

  function genEcrire(r, v) {
    const g = groupesAuHasard(r, V_TAS[v][0], V_TAS[v][1], false);
    if (!g) return null;
    const rep = txtPoly(polyGroupes(g));
    return { forme: 'ecrire', tas: g, reponse: rep, cle: 'e:' + rep };
  }

  // marche 2 — l'opposé, sous ses deux écritures : « (2𝑥 − 3) + …… = 0 » (ce qu'il faut ajouter pour obtenir 0)
  // et « −(2𝑥 − 3) = …… » (variantes qui commencent par « - »). Les mêmes tuiles pour les deux.
  function genOppose(r, v) {
    const moins = v[0] === '-';
    if (moins) v = v.slice(1);
    const g = groupesAuHasard(r, V_TAS[v][0], V_TAS[v][1], true);
    if (!g || g.length < 2) return null;
    // le corrigé pose chaque tuile à côté de son opposée : des tas courts (au plus 6 tuiles)
    const nbT = g.reduce((t, [, n]) => t + Math.abs(n), 0);
    const avecX2 = g.some(([k]) => k === 'x2');
    if (!GRAND && (nbT > (avecX2 ? 4 : 6) || g.some(([k, n]) => k === 'x2' && Math.abs(n) > 1))) return null;
    const p = polyGroupes(g);
    const paires = [];
    for (const [k, n] of g) for (let i = 0; i < Math.abs(n); i++) paires.push([k, n < 0]);
    const e = txtPoly(p);
    return { forme: 'oppose', tas: g, enonce: e, ecrit: moins ? `${MOINS}(${e})` : null, reponse: txtPoly(P.neg(p)), paires, cle: (moins ? 'o-:' : 'o:') + e };
  }

  function genReduire(r, v) {
    const [avecX2, neg] = V_TAS[v];
    const sortes = avecX2 ? ['x2', 'x', '1'] : ['x', '1'];
    const T = avecX2 ? ent(r, G(5, 4), G(7, 5)) : ent(r, 4, 5);       // sans tuiles, de grands nombres : des sommes plus courtes (deux colonnes)
    const seq = [];
    for (let i = 0; i < T; i++) { let k; do k = choix(r, sortes); while (seq.length && seq[seq.length - 1] === k); seq.push(k); }
    if (avecX2 && !seq.includes('x2')) return null;
    const MAXR = GRAND ? { x2: 7, x: 9, 1: 9 } : { x2: 2, x: 4, 1: 5 };
    const t = seq.map((k, i) => {
      let c = ent(r, 1, MAXR[k]);
      if (neg && r() < (i === 0 ? 0.15 : 0.45)) c = -c;
      return [k, c];
    });
    const pos = {}, nega = {};
    for (const [k, c] of t) { if (c > 0) pos[k] = (pos[k] || 0) + c; else nega[k] = (nega[k] || 0) - c; }
    if (neg && !SORTE.some((k) => pos[k] && nega[k])) return null;      // au moins une paire nulle
    // la place : pas plus de tuiles d'une sorte qu'on ne peut en poser proprement
    const tot = (k) => (pos[k] || 0) + (nega[k] || 0);
    if (!GRAND && (tot('x2') > 5 || tot('x') > 9 || tot('1') > 11)) return null;
    const p = polyGroupes(t);
    if (P.nul(p)) return null;
    const paires = [], reste = [];
    for (const k of ['x2', 'x', '1']) {
      const m = Math.min(pos[k] || 0, nega[k] || 0);
      for (let i = 0; i < m; i++) paires.push([k, false]);
      const d = (pos[k] || 0) - (nega[k] || 0);
      if (d) reste.push([k, d]);
    }
    const termes = t.map(([k, c]) => ({ k: DEG[k], c }));
    return { forme: 'reduire', tas: t, enonce: txtTermes(termes), reponse: txtPoly(p), paires, reste, cle: 'r:' + txtTermes(termes) };
  }

  // ---- les rectangles : un produit de deux facteurs posés sur les bords
  const devTermes = (f1, f2) => { const d = []; for (const a of f1) for (const b of f2) d.push({ k: a.k + b.k, c: a.c * b.c }); return d; };
  const termesPoly = (p) => { const l = []; for (const k of [2, 1, 0]) if (p[k]) l.push({ k, c: p[k] }); return l; };

  /** L'exercice « je développe » : f1 à gauche, f2 en haut ; une ligne, ou deux quand il faut réduire. */
  const propre = (f) => f.length < 2 || Math.abs(f.find((m) => m.k === 1).c) === 1 || pgcd(f[0].c, f[1].c) === 1;
  function itemProduit(f1, f2, ecr) {
    if (!GRAND && (longueur(f1) > (f1.length > 1 ? L_DOUBLE : L_GAUCHE) || longueur(f2) > L_HAUT)) return null;
    if (!propre(f1) || !propre(f2)) return null;        // 2(2𝑥 + 4) : la parenthèse se factorise encore, on tire autre chose
    const p = P.mul(polyTermes(f1), polyTermes(f2));
    const dev = devTermes(f1, f2);
    const sortes = dev.map((m) => m.k);
    const doublon = sortes.some((k, i) => sortes.indexOf(k) !== i);
    return { forme: 'produit', gauche: tuilesDe(f1), haut: tuilesDe(f2), f1, f2, tabs: f1.length + f2.length > 2 ? [tabDe(f1, f2)] : null,
      enonce: ecr, lignes: doublon ? [txtTermes(dev), txtPoly(p)] : [txtTermes(dev)], cle: 'p:' + ecr };
  }

  /** k(…) ou (…) × k : le facteur seul devant (à gauche du rectangle) ou après (en haut). */
  function ecrMono(mono, f, apres) {
    const m = txtMonoSeul(mono);
    if (apres) return `${par(f)} × ${mono.c < 0 ? `(${m})` : m}`;
    if (mono.k === 0 && mono.c === -1) return MOINS + par(f);       // −(𝑥 − 7) : multiplier par −1
    return m + par(f);
  }
  const produitMono = (mono, f, apres) => (apres ? (!GRAND && longueur(f) > L_APRES ? null : itemProduit(f, [mono], ecrMono(mono, f, true))) : itemProduit([mono], f, ecrMono(mono, f, false)));

  // marche 3 — multiplier : 3 × 2𝑥, 𝑥 × 𝑥, 3𝑥 × 2𝑥
  function genMultiplier(r, v) {
    let m1, m2;
    const forme = v === 'signe' ? choix(r, ['n-ax', 'ax-n', 'x-ax', 'ax-bx']) : v;
    if (forme === 'n-ax') { m1 = { k: 0, c: ent(r, 2, G(5, 9)) }; m2 = { k: 1, c: ent(r, 2, G(3, 9)) }; }
    else if (forme === 'ax-n') { m1 = { k: 1, c: ent(r, 1, G(3, 9)) }; m2 = { k: 0, c: ent(r, 2, G(5, 9)) }; }
    else if (forme === 'x-ax') { const a = ent(r, 1, G(4, 9)); [m1, m2] = r() < 0.5 ? [{ k: 1, c: 1 }, { k: 1, c: a }] : [{ k: 1, c: a }, { k: 1, c: 1 }]; }
    else { m1 = { k: 1, c: ent(r, 2, G(3, 9)) }; m2 = { k: 1, c: ent(r, 2, G(3, 9)) }; }
    if (v === 'signe') {
      const motif = choix(r, ['+-', '-+', '+-', '-+', '--']);
      if (motif[0] === '-') m1.c = -m1.c;
      if (motif[1] === '-') m2.c = -m2.c;
    }
    const t1 = txtMonoSeul(m1), t2 = txtMonoSeul(m2);
    const ecr = `${m1.c < 0 && m2.c < 0 ? `(${t1})` : t1} × ${m2.c < 0 ? `(${t2})` : t2}`;
    return itemProduit([m1], [m2], ecr);
  }

  // marche 4 — développer, le facteur est un nombre positif
  function genFacteurPositif(r, v) {
    const apres = v[0] === '(';
    const grand = /ax/.test(v) || (apres && r() < 0.5);
    const a = grand ? ent(r, 2, G(3, 9)) : 1;
    const k = ent(r, 2, a === 1 ? G(5, 9) : G(4, 9));
    const b = ent(r, 1, a === 1 ? G(5, 9) : G(4, 9));
    let f;
    if (v === 'k(b-x)') f = linInv(GRAND ? -ent(r, 1, 9) : (r() < 0.3 ? -2 : -1), ent(r, 1, G(4, 9)));
    else f = lin(a, /-/.test(v) ? -b : b);
    return produitMono({ k: 0, c: k }, f, apres);
  }

  // marche 5 — développer, le facteur contient 𝑥 (positif)
  function genFacteurX(r, v) {
    const b = ent(r, 1, G(5, 9));
    switch (v) {
      case 'x(x+b)': return produitMono({ k: 1, c: 1 }, lin(1, b), false);
      case 'x(x-b)': return produitMono({ k: 1, c: 1 }, lin(1, -b), false);
      case 'cx(x±b)': return produitMono({ k: 1, c: ent(r, 2, G(3, 9)) }, lin(1, b * signe(r, 0.5)), false);
      case 'x(ax±b)': return produitMono({ k: 1, c: 1 }, lin(ent(r, 2, G(3, 9)), b * signe(r, 0.5)), false);
      case '(±)cx': return produitMono({ k: 1, c: ent(r, 1, G(2, 9)) }, lin(1, ent(r, 1, G(6, 9)) * signe(r, 0.5)), true);
      case 'cx(b-x)': return produitMono({ k: 1, c: ent(r, 1, G(2, 9)) }, linInv(GRAND ? -ent(r, 1, 9) : (r() < 0.3 ? -2 : -1), ent(r, 1, G(4, 9))), false);
      default: return produitMono({ k: 1, c: ent(r, 2, G(3, 9)) }, lin(ent(r, 2, G(3, 9)), b * signe(r, 0.5)), false);      // 2𝑥(3𝑥 − 5)
    }
  }

  // marche 6 — développer, le facteur est négatif (en tuiles : rouge × rouge = vert)
  function genFacteurNegatif(r, v) {
    const b = ent(r, 1, G(5, 9));
    switch (v) {
      case '-k(x+b)': return produitMono({ k: 0, c: -ent(r, 2, G(4, 9)) }, lin(1, b), false);
      case '-k(x-b)': return produitMono({ k: 0, c: -ent(r, 2, G(4, 9)) }, lin(1, -b), false);
      case '-k(ax±b)': return produitMono({ k: 0, c: -ent(r, 2, G(4, 9)) }, lin(ent(r, 2, G(3, 9)), ent(r, 1, G(4, 9)) * signe(r, 0.6)), false);
      case '-(±)': return produitMono({ k: 0, c: -1 }, lin(ent(r, 1, G(3, 9)), b * signe(r, 0.7)), false);
      case '-x(x±b)': return produitMono({ k: 1, c: -1 }, lin(1, b * signe(r, 0.6)), false);
      case '-cx(ax±b)': { const c = ent(r, 1, G(2, 9)); return produitMono({ k: 1, c: -c }, lin(ent(r, c === 1 ? 2 : 1, G(3, 9)), b * signe(r, 0.5)), false); }
      case '(±)(-k)': return produitMono({ k: 0, c: -ent(r, 2, G(4, 9)) }, lin(ent(r, 1, G(2, 9)), ent(r, 1, G(4, 9)) * signe(r, 0.4)), true);
      default: return produitMono({ k: 0, c: -ent(r, 2, G(4, 9)) }, lin(-1, ent(r, 1, G(5, 9))), false);          // −2(−𝑥 + 3)
    }
  }

  // marche 7 — factoriser : le rectangle est rempli, on cherche les bords. Le facteur trouvé est positif,
  // et la parenthèse ne se factorise plus (pas de 2(2𝑥 + 4)).
  function genFactoriser(r, v) {
    let mono, f;
    const b = ent(r, 1, G(5, 9));
    switch (v) {
      case 'k(x+b)': mono = { k: 0, c: ent(r, 2, G(5, 9)) }; f = lin(1, b); break;
      case 'k(x-b)': mono = { k: 0, c: ent(r, 2, G(5, 9)) }; f = lin(1, -b); break;
      case 'k(ax±b)': mono = { k: 0, c: ent(r, 2, G(4, 9)) }; f = lin(ent(r, 2, G(3, 7)), ent(r, 1, G(4, 9)) * signe(r, 0.5)); break;
      case 'x(x+b)': mono = { k: 1, c: 1 }; f = lin(1, b); break;
      case 'x(x-b)': mono = { k: 1, c: 1 }; f = lin(1, -b); break;
      case 'x(ax±b)': mono = { k: 1, c: 1 }; f = lin(ent(r, 2, G(3, 9)), b * signe(r, 0.5)); break;
      default: mono = { k: 1, c: ent(r, 2, G(3, 9)) }; f = lin(ent(r, 1, G(2, 7)), ent(r, 1, G(4, 9)) * signe(r, 0.5));    // 2𝑥(𝑥 + 3), 2𝑥(2𝑥 − 3)
    }
    if (pgcd(f[0].c, f[1].c) !== 1) return null;
    if (!GRAND && (longueur([mono]) > L_GAUCHE || longueur(f) > L_HAUT)) return null;
    const ecr = ecrMono(mono, f, false);
    const p = P.mul(polyTermes([mono]), polyTermes(f));
    return { forme: 'factoriser', gauche: tuilesDe([mono]), haut: tuilesDe(f), tabs: [tabDe([mono], f)], enonce: txtPoly(p), reponse: ecr, cle: 'f:' + ecr };
  }

  // ★ pour aller plus loin — factoriser 𝑥² + 5𝑥 + 6 en rangeant les tuiles en rectangle (avec les tuiles seulement)
  function genTrinome(r, v) {
    let f1, f2;
    if (v === '(x+a)²') { f1 = lin(1, ent(r, 1, 4)); f2 = f1; }
    else if (v === '(2x+a)(x+b)') { f1 = lin(2, ent(r, 1, 3)); f2 = lin(1, ent(r, 1, 3)); if (pgcd(2, f1[1].c) !== 1) return null; }
    else { const a = ent(r, 1, 3), b = ent(r, a + 1, 5); [f1, f2] = [lin(1, a), lin(1, b)]; }
    if (longueur(f1) > L_DOUBLE || longueur(f2) > L_HAUT) return null;
    const p = P.mul(polyTermes(f1), polyTermes(f2));
    const ecr = f1 === f2 ? par(f1) + '²' : par(f1) + par(f2);
    const tas = [['x2', p[2]], ['x', p[1]], ['1', p[0]]];
    return { forme: 'factoriser', ranger: true, tas, gauche: tuilesDe(f1), haut: tuilesDe(f2), enonce: txtPoly(p), reponse: ecr, cle: 'f2:' + ecr };
  }

  // marches 9 et 10 — la double distributivité, sans puis avec des signes −
  function genDouble(signes) {
    return function (r, v) {
      let a1 = 1, a2 = 1;
      if (v === 'ax-x') { if (r() < 0.5) a1 = ent(r, 2, G(3, 7)); else a2 = ent(r, 2, G(3, 7)); }
      else if (v === 'ax-cx') { a1 = ent(r, 2, G(3, 7)); a2 = ent(r, 2, G(3, 7)); }
      const b1 = ent(r, 1, GRAND ? 9 : (a1 === 3 ? 4 : 5)), b2 = ent(r, 1, GRAND ? 9 : (a2 === 3 ? 4 : 5));
      let g1, g2;
      if (v === 'inv') {                                   // (3 − 𝑥)(𝑥 + 2) : le nombre d'abord
        g1 = linInv(GRAND ? -ent(r, 1, 5) : (r() < 0.25 ? -2 : -1), ent(r, 1, G(4, 9)));
        g2 = r() < 0.3 ? linInv(-1, ent(r, 1, G(4, 9))) : lin(ent(r, 1, G(2, 7)), b2 * signe(r, 0.3));
        if (r() < 0.5) [g1, g2] = [g2, g1];
      } else {
        const motif = signes ? choix(r, ['+-', '-+', '--']) : '++';
        g1 = lin(a1, motif[0] === '-' ? -b1 : b1);
        g2 = lin(a2, motif[1] === '-' ? -b2 : b2);
      }
      if (txtTermes(g1) === txtTermes(g2)) return null;                              // un carré : marche 13
      if (g1[0].k === g2[0].k && g1[0].c === g2[0].c && g1[1].c === -g2[1].c) return null;   // (a + b)(a − b) : marche 13
      return itemProduit(g1, g2, par(g1) + par(g2));
    };
  }

  // marche 13 — les identités remarquables
  function genIdentite(r, v) {
    const a = /ax/.test(v) ? ent(r, 2, G(3, 5)) : 1;
    const b = ent(r, 1, a === 1 ? G(6, 9) : G(3, 7));
    if (pgcd(a, b) !== 1) return null;
    if (/\)\(/.test(v)) {
      let g1 = lin(a, b), g2 = lin(a, -b);
      if (r() < 0.5) [g1, g2] = [g2, g1];
      return itemProduit(g1, g2, par(g1) + par(g2));
    }
    const g = lin(a, /-/.test(v) ? -b : b);
    return itemProduit(g, g, par(g) + '²');
  }

  // marche 14 — factoriser une différence de deux carrés (sans tuiles) : 𝑎² − 𝑏² = (𝑎 − 𝑏)(𝑎 + 𝑏)
  function genDeuxCarres(r, v) {
    let a, b, e;
    if (v === 'x²-b²') { const n = ent(r, 1, 12); a = 'x'; b = String(n); e = `x² ${MOINS} ${n * n}`; }
    else if (v === 'a²x²-b²') {
      const k = ent(r, 2, 6), n = ent(r, 1, 9);
      if (pgcd(k, n) !== 1) return null;
      a = `${k}x`; b = String(n); e = `${k * k}x² ${MOINS} ${n * n}`;
    } else if (v === 'b²-x²') { const n = ent(r, 1, 12); a = String(n); b = 'x'; e = `${n * n} ${MOINS} x²`; }
    else {
      const k = ent(r, 2, 6), n = ent(r, 1, 9);
      if (pgcd(k, n) !== 1) return null;
      a = String(n); b = `${k}x`; e = `${n * n} ${MOINS} ${k * k}x²`;
    }
    return { forme: 'carres', enonce: e, a, b, reponse: `(${a} ${MOINS} ${b})(${a} + ${b})`, cle: 'c:' + e };
  }

  // marches 8, 11 et 15 — tout ensemble : plusieurs morceaux côte à côte (rectangles ou tableaux, tuiles seules),
  // je développe chaque produit, puis je réduis. Avec les tuiles, un signe − va TOUJOURS avec un facteur simple
  // (−2(𝑥 − 1) : les tuiles du bord sont rouges). Un − devant ( )( ) (marche 11, et 15 hors tuiles) : je garde la parenthèse,
  // 5 − (𝑥 + 1)(𝑥 − 2) = 5 − (𝑥² − 𝑥 − 2) = −𝑥² + 𝑥 + 7 ; le tableau est celui du produit, le − reste dehors.
  const mMono = (mono, f) => ({ f1: [mono], f2: f, gauche: tuilesDe([mono]), haut: tuilesDe(f), ecr: ecrMono(mono, f, false), termes: devTermes([mono], f) });
  const mDouble = (g1, g2) => ({ f1: g1, f2: g2, gauche: tuilesDe(g1), haut: tuilesDe(g2), ecr: txtTermes(g1) === txtTermes(g2) ? par(g1) + '²' : par(g1) + par(g2), termes: termesPoly(P.mul(polyTermes(g1), polyTermes(g2))) });
  const mTas = (mono) => ({ tas: [[SORTE[mono.k], mono.c]], ecr: txtMonoSeul(mono), termes: [mono] });
  const moinsDevant = (m) => (m ? { ...m, moins: true, ecr: MOINS + m.ecr } : null);
  const LARGEUR_ENSEMBLE = 82;              // mm : les morceaux côte à côte tiennent sur une demi-page

  function assembler(morceaux) {
    if (morceaux.some((m) => !m)) return null;
    let enonce = '', w = 0, l1 = '', prem = true;
    const termes = [];
    morceaux.forEach((m, i) => {
      enonce += i === 0 ? m.ecr : m.ecr.startsWith(MOINS) ? ` ${MOINS} ${m.ecr.slice(1)}` : ` + ${m.ecr}`;
      if (m.moins) {
        // − devant un produit : la 1re ligne garde la parenthèse, avec le produit développé et réduit dedans
        l1 += (prem ? MOINS : ` ${MOINS} `) + `(${txtPoly(polyTermes(m.termes))})`;
        termes.push(...m.termes.map((t) => ({ k: t.k, c: -t.c })));
      } else {
        for (const t of m.termes) { l1 += txtMono(t.c, t.k, prem); prem = false; }
        termes.push(...m.termes);
      }
      prem = false;
      if (!GRAND) w += (m.tas ? tas(m.tas).w : rectangle(m.gauche, m.haut).w) + (i ? 5 : 0);
    });
    if (w > LARGEUR_ENSEMBLE) return null;
    if (new Set(morceaux.map((m) => m.ecr.replace(MOINS, ''))).size < morceaux.length) return null;      // deux fois le même produit
    const p = polyTermes(termes.map((t) => ({ k: t.k, c: t.c })));
    const l2 = txtPoly(p);
    if (P.nul(p) || l1 === l2) return null;                 // il faut qu'il reste quelque chose à réduire
    const sortes = termes.map((t) => t.k);
    if (!morceaux.some((m) => m.moins) && !sortes.some((k, i) => sortes.indexOf(k) !== i)) return null;
    const prods = morceaux.filter((m) => !m.tas);
    return {
      forme: 'ensemble',
      morceaux: morceaux.map((m) => (m.tas ? { tas: m.tas } : { gauche: m.gauche, haut: m.haut, moins: !!m.moins })),
      tabs: prods.map((m) => tabDe(m.f1, m.f2)),
      enonce, lignes: [l1, l2], cle: 't:' + enonce,
    };
  }
  // une parenthèse qui ne se factorise plus (pas de (3𝑥 − 3)²) ; avec les tuiles, 𝑥 seul : le premier essai est le bon
  const petitLin = (r, pNeg) => { for (;;) { const f = lin(GRAND && r() < 0.35 ? ent(r, 2, 3) : 1, ent(r, 1, G(3, 9)) * signe(r, pNeg)); if (propre(f)) return f; } };

  /** a𝑥 ± b avec a ≤ amax, b ≤ bmax, qui ne se factorise plus (lot 3 : le lot 2 tirait parfois 4(2𝑥 − 2)). */
  const linP = (r, amax, bmax) => { for (;;) { const f = lin(ent(r, 1, amax), ent(r, 1, bmax) * signe(r, 0.5)); if (propre(f)) return f; } };

  function genEnsemble1(r, v) {
    const k = () => ({ k: 0, c: ent(r, 2, G(4, 9)) });
    switch (v) {
      case 'k()+mx': return assembler([mMono(k(), petitLin(r, 0.4)), mTas(r() < 0.6 ? { k: 1, c: ent(r, 1, G(4, 9)) * signe(r, 0.3) } : { k: 0, c: ent(r, 1, G(5, 9)) * signe(r, 0.4) })]);
      case 'k()+m()': return assembler([mMono(k(), petitLin(r, 0.3)), mMono(k(), petitLin(r, 0.5))]);
      case 'k()-m()': { const m = k(); m.c = -m.c; return assembler([mMono(k(), petitLin(r, 0.3)), mMono(m, petitLin(r, 0.6))]); }
      case 'k()-()': return assembler([mMono(k(), linP(r, G(2, 5), G(3, 9))), mMono({ k: 0, c: -1 }, linP(r, G(2, 5), G(4, 9)))]);
      case 'x()+k()': return assembler([mMono({ k: 1, c: 1 }, petitLin(r, 0.4)), mMono(k(), petitLin(r, 0.5))]);
      case 'cx()-x()': return assembler([mMono({ k: 1, c: ent(r, 1, G(2, 5)) }, petitLin(r, 0.5)), mMono({ k: 1, c: -1 }, petitLin(r, 0.5))]);
      default: return assembler([mTas({ k: 0, c: ent(r, 2, G(6, 9)) }), mMono({ k: 0, c: -ent(r, 2, G(3, 9)) }, r() < 0.5 ? linInv(-1, ent(r, 1, G(3, 9))) : petitLin(r, 0.6))]);   // 4 − 3(2 − 𝑥)
    }
  }

  function genEnsemble2(r, v) {
    const carre = () => { const g = petitLin(r, 0.5); return mDouble(g, g); };
    const conj = () => { const b = ent(r, 1, G(3, 9)); return mDouble(lin(1, b), lin(1, -b)); };
    const dbl = (pNeg) => { for (let n = 0; n < 50; n++) { const g1 = petitLin(r, pNeg), g2 = petitLin(r, pNeg); if (Math.abs(g1[1].c) !== Math.abs(g2[1].c)) return mDouble(g1, g2); } return null; };
    const k = (neg) => ({ k: 0, c: ent(r, 2, G(3, 9)) * (neg ? -1 : 1) });
    switch (v) {
      case '()²+()()': return assembler([carre(), dbl(0.5)]);
      case '()()+k()': return assembler([dbl(0.4), mMono(k(false), petitLin(r, 0.5))]);
      case '()()-k()': return assembler([r() < 0.3 ? conj() : dbl(0.5), mMono(k(true), petitLin(r, 0.5))]);
      case '()²-x()': return assembler([r() < 0.35 ? conj() : carre(), mMono({ k: 1, c: -1 }, petitLin(r, 0.5))]);
      // lot 3, hors tuiles : un − devant un produit de deux parenthèses, et le « tout mélangé » de la marche 11 du cours
      case '()²-()()': return assembler([carre(), moinsDevant(dbl(0.5))]);
      case '()()-()()': return assembler([dbl(0.4), moinsDevant(dbl(0.5))]);
      case 'k()+()()': return assembler([mMono(k(true), petitLin(r, 0.5)), dbl(0.5)]);
      case 'cx()-()()': return assembler([mMono({ k: 1, c: ent(r, 1, 5) }, petitLin(r, 0.5)), moinsDevant(dbl(0.5))]);
      default: return assembler([dbl(0.4), r() < 0.4 ? carre() : dbl(0.5)]);                         // ( )( ) + ( )( )
    }
  }

  // marche 11 — un signe − devant un produit (sans tuiles) : je garde la parenthèse
  function genMoinsProduit(r, v) {
    const L = (pNeg) => { for (;;) { const f = lin(r() < 0.35 ? ent(r, 2, 3) : 1, ent(r, 1, 9) * signe(r, pNeg)); if (propre(f)) return f; } };
    const dbl = (pNeg) => {
      for (let n = 0; n < 50; n++) {
        const g1 = L(pNeg), g2 = L(pNeg);
        if (txtTermes(g1) !== txtTermes(g2) && !(g1[0].c === g2[0].c && g1[1].c === -g2[1].c)) return mDouble(g1, g2);
      }
      return null;
    };
    switch (v) {
      case 'k-()()': return assembler([mTas({ k: 0, c: ent(r, 2, 9) }), moinsDevant(dbl(0.5))]);
      case 'x²-()()': return assembler([mTas({ k: 2, c: ent(r, 1, 3) }), moinsDevant(dbl(0.5))]);
      case '()()-()()': return assembler([dbl(0.4), moinsDevant(dbl(0.5))]);
      default: return assembler([dbl(0.5), moinsDevant(mMono({ k: 1, c: ent(r, 1, 4) }, L(0.4)))]);      // (2𝑥 + 1)(𝑥 − 2) − 2𝑥(𝑥 + 3)
    }
  }

  // marche 12 — factoriser, le facteur commun est une parenthèse (sans tuiles) :
  // (𝑥 + 2)(𝑥 + 3) + (𝑥 + 2)(2𝑥 − 1) = (𝑥 + 2)[(𝑥 + 3) + (2𝑥 − 1)] = (𝑥 + 2)(3𝑥 + 2) ; il peut être seul (× 1)
  function genFacteurCommun(r, v) {
    const L = (pNeg, amax) => lin(ent(r, 1, amax), ent(r, 1, 9) * signe(r, pNeg));
    const A = lin(r() < 0.3 ? ent(r, 2, 5) : 1, ent(r, 1, 9) * signe(r, 0.4));
    const B = L(0.5, 5);
    const moins = /-/.test(v);
    const seul = /A$/.test(v);                                  // … + (𝑥 + 7) : le facteur commun est seul
    const C = seul ? [{ k: 0, c: 1 }] : L(0.5, 4);
    if (pgcd(A[0].c, A[1].c) !== 1 || pgcd(B[0].c, B[1].c) !== 1 || (!seul && pgcd(C[0].c, C[1].c) !== 1)) return null;
    const inner = P.add(polyTermes(B), moins ? P.neg(polyTermes(C)) : polyTermes(C));
    if (inner.length < 2 || inner[1] <= 0 || !inner[0] || pgcd(inner[0], inner[1]) !== 1) return null;   // ( … ) garde un 𝑥 positif et un nombre, et ne se factorise plus
    const iT = [{ k: 1, c: inner[1] }, { k: 0, c: inner[0] }];
    if ([iT, B, C].some((f) => txtTermes(f) === txtTermes(A))) return null;   // (𝑥 + 2)(𝑥 + 2) : un carré, on tire autre chose
    const a = par(A), b = par(B), c = seul ? '1' : par(C), s = moins ? ` ${MOINS} ` : ' + ';
    const premier = v.startsWith('BA') ? b + a : a + b;        // le facteur commun n'est pas toujours devant
    const enonce = premier + s + (seul ? a : a + c);
    return {
      forme: 'commun', commun: a, enonce,
      lignes: [`${a}[${b}${s}${c}]`, a + par(iT)],
      tabs: [{ g: [a], h: [b, (moins ? MOINS : '') + c], c: [[premier, (moins ? MOINS : '') + (seul ? a : a + c)]] }],
      cle: 'k:' + enonce,
    };
  }

  /** Les marches du cours (0 à 15) et ★. « sansTuiles » : la marche ne se fait pas avec les tuiles (11, 12, 14) ;
   *  « seulTuiles » : elle n'a de sens qu'avec les tuiles (0, ★). variantesG : les cas hors tuiles, quand ils diffèrent. */
  const MARCHES = [
    { n: 0, partie: 1, nom: 'Écrire l’expression', exemple: 'les tuiles → x² + 2x − 3', titre: 'Écrire l’expression', forme: 'ecrire', gen: genEcrire, variantes: ['x1', 'x1n', 'x2', 'x2n'], seulTuiles: true },
    { n: 1, partie: 1, nom: 'Réduire', exemple: '2x + 5 + x − 3', titre: 'Réduire', forme: 'reduire', gen: genReduire, variantes: ['x1', 'x1n', 'x2', 'x2n'] },
    { n: 2, partie: 1, nom: 'L’opposé', exemple: '(2x − 3) + … = 0 · −(2x − 3)', titre: 'L’opposé d’une expression', forme: 'oppose', gen: genOppose, variantes: ['x1', 'x1n', 'x2', 'x2n', '-x1', '-x1n', '-x2', '-x2n'], famille: (v) => v[0] === '-' },
    { n: 3, partie: 1, nom: 'Multiplier', exemple: '3 × 2x · x × x · 3x × 2x', titre: 'Multiplier', forme: 'produit', gen: genMultiplier, variantes: ['n-ax', 'x-ax', 'ax-n', 'ax-bx', 'signe'] },
    { n: 4, partie: 1, nom: 'Développer', exemple: 'facteur positif · 3(x + 2)', titre: 'Développer — le facteur est un nombre positif', forme: 'produit', gen: genFacteurPositif,
      variantes: ['k(x+b)', 'k(ax+b)', '(+)k', 'k(x-b)', 'k(ax-b)', 'k(b-x)', '(-)k'] },
    { n: 5, partie: 1, nom: 'Développer', exemple: 'facteur en x · 2x(3x − 5)', titre: 'Développer — le facteur contient x', forme: 'produit', gen: genFacteurX,
      variantes: ['x(x+b)', 'x(x-b)', 'cx(x±b)', 'x(ax±b)', '(±)cx', 'cx(b-x)', 'cx(ax±b)'] },
    { n: 6, partie: 1, nom: 'Développer', exemple: 'facteur négatif · −3(x − 2)', titre: 'Développer — le facteur est négatif', forme: 'produit', gen: genFacteurNegatif,
      variantes: ['-k(x+b)', '-k(x-b)', '-(±)', '-x(x±b)', '-k(ax±b)', '(±)(-k)', '-k(-x+b)', '-cx(ax±b)'] },
    { n: 7, partie: 1, nom: 'Factoriser', exemple: '4x + 12 = 4(x + 3)', titre: 'Factoriser', forme: 'factoriser', gen: genFactoriser,
      variantes: ['k(x+b)', 'k(x-b)', 'x(x+b)', 'x(x-b)', 'k(ax±b)', 'x(ax±b)', 'cx(ax±b)'] },
    { n: 8, partie: 1, nom: 'Tout ensemble', exemple: '3(x + 2) − 2(x − 1)', titre: 'Tout ensemble', forme: 'ensemble', gen: genEnsemble1, pile: true,
      variantes: ['k()+mx', 'k()+m()', 'k()-m()', 'x()+k()', 'k()-()', 'cx()-x()', 'c-k()'] },
    { n: 9, partie: 2, nom: 'Double distributivité', exemple: '(x + 2)(2x + 3)', titre: 'La double distributivité', forme: 'produit', gen: genDouble(false), pile: true, variantes: ['x-x', 'ax-x', 'ax-cx'] },
    { n: 10, partie: 2, nom: 'Avec des signes −', exemple: '(2x + 1)(2x − 3)', titre: 'La double distributivité, avec des signes −', forme: 'produit', gen: genDouble(true), pile: true,
      variantes: ['x-x', 'ax-x', 'inv', 'ax-cx'] },
    { n: 11, partie: 2, nom: 'Un − devant un produit', exemple: '5 − (x + 1)(x − 2)', titre: 'Un signe − devant un produit', forme: 'ensemble', gen: genMoinsProduit, pile: true,
      variantes: ['k-()()', 'x²-()()', '()()-()()', '()()-cx()'], sansTuiles: true },
    { n: 12, partie: 2, nom: 'Factoriser', exemple: 'le facteur commun est une ( )', titre: 'Factoriser — le facteur commun est une parenthèse', forme: 'commun', gen: genFacteurCommun, pile: true,
      variantes: ['AB+AC', 'AB+A', 'AB-AC', 'AB-A', 'BA+AC'], sansTuiles: true },
    // lot 3 (remarque 8 retenue) : (𝑎 + 𝑏)(𝑎 − 𝑏) d'abord — la seule exigible cette année, celle qui sert à la marche 14
    { n: 13, partie: 2, nom: 'Identités remarquables', exemple: '(x + 3)(x − 3) · (x + 3)²', titre: 'Les identités remarquables', forme: 'produit', gen: genIdentite, pile: true,
      variantes: ['(x+b)(x-b)', '(x+b)²', '(x-b)²', '(ax+b)(ax-b)', '(ax+b)²', '(ax-b)²'] },
    { n: 14, partie: 2, nom: 'Factoriser', exemple: 'deux carrés · x² − 25', titre: 'Factoriser une différence de deux carrés', forme: 'carres', gen: genDeuxCarres,
      variantes: ['x²-b²', 'a²x²-b²', 'b²-x²', 'b²-a²x²'], sansTuiles: true },
    { n: 15, partie: 2, nom: 'Tout ensemble', exemple: '(x + 3)² + (x + 1)(x − 2)', titre: 'Tout ensemble', forme: 'ensemble', gen: genEnsemble2, pile: true,
      variantes: ['()()+k()', '()²+()()', '()()-k()', '()²-x()', '()()+()()'],
      variantesG: ['()()+k()', '()²+()()', 'k()+()()', '()()-k()', '()²-x()', '()()+()()', '()²-()()', 'cx()-()()', '()()-()()'] },
    { n: 16, partie: 2, etoile: true, nom: 'Pour aller plus loin', exemple: 'x² + 5x + 6 = (x + 2)(x + 3)', titre: 'Pour aller plus loin — factoriser en rangeant les tuiles', forme: 'factoriser',
      gen: genTrinome, variantes: ['(x+a)(x+b)', '(x+a)²', '(2x+a)(x+b)'], seulTuiles: true },
  ];
  const marche = (n) => MARCHES.find((m) => m.n === n);
  const SUPPORTS = ['tuiles', 'tableau', 'sans'];
  /** Une marche se fait-elle avec ce support ? */
  const possible = (m, support) => (support === 'tuiles' ? !m.sansTuiles : !m.seulTuiles);

  /** Une réserve d'exercices tous différents pour une marche. Les variantes tournent : à chaque tour,
   *  toutes les variantes de la marche passent une fois, dans un ordre tiré au hasard (la fiche « fait
   *  tous les cas », et deux tirages ne commencent pas par les mêmes). rang = place de la variante dans
   *  la marche, du plus simple au plus difficile (l'appli range les exercices d'une fiche dans cet ordre).
   *  support : 'tuiles' (nombres bornés par la place), 'tableau' ou 'sans' (nombres variés, les MÊMES pour les deux :
   *  passer du tableau à « sans aide » garde les exercices, on enlève seulement l'aide). */
  function reserve(n, graine, nb, support = 'tuiles') {
    const m = marche(n);
    if (!m || !possible(m, support)) return [];
    const tuiles = support === 'tuiles';
    const variantes = (!tuiles && m.variantesG) || m.variantes;
    const r = hasard(hacher(tuiles ? `marche${n}|${graine}` : `marche${n}|${graine}|grand`));
    const out = [], vus = new Set(), epuises = new Set();
    let garde = 0;
    GRAND = !tuiles;
    try {
      while (out.length < nb && epuises.size < variantes.length && garde++ < 200) {
        const tour = variantes.filter((v) => !epuises.has(v));
        for (let i = tour.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [tour[i], tour[j]] = [tour[j], tour[i]]; }
        // deux écritures dans une marche (l'opposé) : elles alternent, une fiche courte montre les deux
        let ordre = tour;
        if (m.famille) {
          const a = tour.filter((v) => m.famille(v)), b = tour.filter((v) => !m.famille(v));
          ordre = [];
          for (let i = 0; i < Math.max(a.length, b.length); i++) { if (i < b.length) ordre.push(b[i]); if (i < a.length) ordre.push(a[i]); }
        }
        for (const v of ordre) {
          if (out.length >= nb) break;
          let it = null;
          for (let essai = 0; essai < 300 && !it; essai++) {
            const c = m.gen(r, v);
            if (c && !vus.has(c.cle) && !verifierItem(c)) it = c;
          }
          if (!it) { epuises.add(v); continue; }
          it.marche = n; it.sous = v; it.rang = variantes.indexOf(v); it.pile = !!m.pile; it.support = support;
          vus.add(it.cle); out.push(it);
        }
      }
    } finally { GRAND = false; }
    return out;
  }

  return {
    U, XU, MARCHES, marche, MOINS, SUPPORTS, possible,
    tas, paire, paires, rectangle, reserve,
    verifierItem, analyser, estReduite, txtPoly, polyGroupes, polyRectangle, P,
    hasard, hacher,
  };
})();
if (typeof module !== 'undefined') module.exports = MoteurTuiles;
</script>
<script>
(function () {
  'use strict';
  const M = MoteurTuiles;
  const $ = (id) => document.getElementById(id);
  const MM = 96 / 25.4;                       // px par mm (CSS)
  const LARGEUR_BLOC = 210 - 26 - 8 - 0.6;    // largeur utile dans un cadre d'exercice (mm)
  const ECART_COL = 4, ECART_RANG = 5;        // mm (comme la feuille .grille)
  const HAUTEUR_UTILE = 297 - 11 - 15 - 2;    // au-dessus du pied, avec 2 mm de sécurité
  const SEUIL = 0.7;                          // part des exercices d'un cas qui doit tenir dans la colonne
  const MAX_LETTRES = 26;                     // un cadre d'exercice va de a à z

  // ---------------------------------------------------------------- l'état
  const etat = {
    marches: [0, 1, 2, 4],                    // les marches du cours cochées
    support: 'tuiles',                        // tuiles | tableau | sans (lot 3) : avec le tableau et sans aide, nombres variés
    rectangle: 'lire',                        // lire | construire | deux : une manière de travailler, les nombres ne changent pas
    pages: '1', couleurs: 'vr', imprimer: 'deux',
  };
  let graine = (() => {
    const g = Number(new URLSearchParams(location.search).get('graine'));
    if (Number.isInteger(g) && g > 0) return g;
    try { return crypto.getRandomValues(new Uint32Array(1))[0] || 1; } catch (_) { return Math.floor(Math.random() * 4e9) + 1; }
  })();
  let fiche = null;                           // { sections, pages } de la dernière composition

  /** Une marche se fait-elle avec le support choisi ? Avec les tuiles : pas 11, 12 et 14 ; avec le tableau ou sans aide : pas 0 ni ★. */
  const disponible = (m) => M.possible(m, etat.support);
  const AVEC_RECTANGLE = (m) => etat.support === 'tuiles' && (m.forme === 'produit' || m.forme === 'ensemble');

  // ---------------------------------------------------------------- écriture
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const h = (t) => esc(t).replace(/(?<![A-Za-zÀ-ÿ])x(?![A-Za-zÀ-ÿ])/g, '\u{1D465}');
  const rep = (t) => `<span class="rep">${h(t)}</span>`;
  const largeurTrou = (t, max) => Math.max(24, Math.min(max || 64, Math.round(t.length * 2.3 + 8)));
  const trou = (mm) => `<span class="trou" style="width:${mm}mm"></span>`;

  function calc(lignes) {
    return '<div class="calc">' + lignes.map(([g, d]) => `<span class="g">${g}</span><span class="egal">=</span><span>${d}</span>`).join('') + '</div>';
  }

  /** Le calcul sous la figure. Marches à deux lignes (double distributivité, tout ensemble) : l'expression
   *  sur sa ligne, puis « = …… » dessous, alignés — une longue expression garde toute la largeur pour répondre. */
  function lignesCalcul(it, L, C) {
    if (it.pile) {
      return `<div class="pile"><div class="ligne">${L}<span>${h(it.enonce)}</span></div>`
        + it.lignes.map((l) => `<div class="suite"><span class="egal">=</span>${C ? rep(l) : trou(largeurTrou(l, 72))}</div>`).join('') + '</div>';
    }
    return calc(it.lignes.map((l, i) => [i ? '' : L + h(it.enonce), C ? rep(l) : trou(largeurTrou(l))]));
  }

  /** Le tableau produit du cours. cherche = 'cases' (je développe) ou 'bords' (je factorise) : dans le sujet, ce qu'on
   *  cherche est caché (la case garde sa taille) ; dans le corrigé, il est écrit en turquoise. */
  function tableauHtml(t, cherche, C) {
    const cel = (txt, but, balise, cls) => {
      const c = [cls, but ? (C ? 'r' : 'cache') : ''].filter(Boolean).join(' ');
      return `<${balise}${c ? ` class="${c}"` : ''}>${h(txt)}</${balise}>`;
    };
    const bords = cherche === 'bords', cases = cherche === 'cases';
    let html = `<table class="tp"><tr><th class="coin">×</th>${t.h.map((x) => cel(x, bords, 'th')).join('')}</tr>`;
    t.g.forEach((g, i) => { html += `<tr>${cel(g, bords, 'th', 'gauche')}${t.c[i].map((x) => cel(x, cases, 'td')).join('')}</tr>`; });
    return html + '</table>';
  }

  /** marche 14 avec le tableau : l'aide du cours, « 𝑎 = …… et 𝑏 = …… », puis la forme factorisée */
  function carresAide(it, L, C) {
    const ab = (n, val) => `<span class="ab">${n} =</span>${C ? rep(val) : trou(13)}`;
    return `<div class="pile"><div class="ligne">${L}<span>${h(it.enonce)}</span><span class="ab">:</span>${ab('\u{1D44E}', it.a)}${ab('\u{1D44F}', it.b)}</div>`
      + `<div class="suite"><span class="egal">=</span>${C ? rep(it.reponse) : trou(largeurTrou(it.reponse, 60))}</div></div>`;
  }

  function cellule(it, lettre, v, construire) {
    const C = v === 'C';
    const L = `<span class="l">${lettre}.</span>`;
    const vide = construire && !C ? 'interieur' : null;
    const sup = it.support || 'tuiles';
    let fig = '', txt, cls = '';
    if (sup !== 'tuiles') {
      // le tableau, ou rien : les mêmes nombres, l'aide en moins
      const avec = sup === 'tableau' && it.tabs && it.tabs.length;
      switch (it.forme) {
        case 'reduire': txt = calc([[L + h(it.enonce), C ? rep(it.reponse) : trou(largeurTrou(it.reponse))]]); break;
        case 'oppose':
          txt = it.ecrit ? calc([[L + h(it.ecrit), C ? rep(it.reponse) : trou(largeurTrou(it.reponse))]])
            : `<div class="ligne">${L}<span>(${h(it.enonce)}) +</span>${C ? rep(it.reponse) : trou(largeurTrou(it.reponse))}<span>= 0</span></div>`;
          break;
        case 'factoriser':
          if (avec) fig = tableauHtml(it.tabs[0], 'bords', C);
          txt = calc([[L + h(it.enonce), C ? rep(it.reponse) : trou(largeurTrou(it.reponse))]]);
          break;
        case 'commun':
          if (avec) fig = tableauHtml(it.tabs[0], 'bords', C);
          txt = lignesCalcul(it, L, C);
          break;
        case 'carres':
          txt = sup === 'tableau' ? carresAide(it, L, C) : calc([[L + h(it.enonce), C ? rep(it.reponse) : trou(largeurTrou(it.reponse))]]);
          break;
        default:      // produit, ensemble : un tableau par produit
          if (avec) { fig = it.tabs.map((t) => tableauHtml(t, 'cases', C)).join(''); cls = ' fig--tabs'; }
          txt = lignesCalcul(it, L, C);
      }
      if (!fig) return `<div class="cel cel--seul${it.large ? ' cel--large' : ''}"><div class="txt">${txt}</div></div>`;
      return `<div class="cel${it.large ? ' cel--large' : ''}"><div class="fig${cls}">${fig}</div><div class="txt">${txt}</div></div>`;
    }
    switch (it.forme) {
      case 'ecrire':
        fig = M.tas(it.tas).html;
        txt = `<div class="ligne">${L}${C ? rep(it.reponse) : trou(30)}</div>`;
        break;
      case 'reduire':
        if (C) {
          fig = it.paires.map(([k, n]) => M.paire(k, n).html).join('');
          fig += (it.paires.length ? '<span class="plus">+</span>' : '') + M.tas(it.reste).html;
        } else fig = M.tas(it.tas).html;
        txt = calc([[L + h(it.enonce), C ? rep(it.reponse) : trou(largeurTrou(it.reponse))]]);
        break;
      case 'oppose':
        fig = C ? it.paires.map(([k, n]) => M.paire(k, n).html).join('') : M.tas(it.tas).html;
        txt = it.ecrit ? calc([[L + h(it.ecrit), C ? rep(it.reponse) : trou(largeurTrou(it.reponse))]])
          : `<div class="ligne">${L}<span>(${h(it.enonce)}) +</span>${C ? rep(it.reponse) : trou(largeurTrou(it.reponse))}<span>= 0</span></div>`;
        break;
      case 'produit':
        fig = M.rectangle(it.gauche, it.haut, { vide }).html;
        txt = lignesCalcul(it, L, C);
        break;
      case 'ensemble':
        cls = ' fig--morceaux';
        fig = it.morceaux.map((m) => (m.tas ? M.tas(m.tas).html : M.rectangle(m.gauche, m.haut, { vide }).html)).join('');
        txt = lignesCalcul(it, L, C);
        break;
      case 'factoriser':
        // ★ : le sujet donne les tuiles en tas, à ranger en rectangle ; le corrigé montre le rectangle et ses bords
        if (it.ranger && !C) fig = M.tas(it.tas).html;
        else fig = M.rectangle(it.gauche, it.haut, { vide: C ? null : 'bords' }).html;
        txt = calc([[L + h(it.enonce), C ? rep(it.reponse) : trou(largeurTrou(it.reponse))]]);
        break;
    }
    return `<div class="cel${it.large ? ' cel--large' : ''}"><div class="fig${cls}">${fig}</div><div class="txt">${txt}</div></div>`;
  }

  const BADGE = { tuiles: 'Tuiles algébriques', tableau: 'Tableau produit', sans: 'Entraînement' };
  const AVEC = { tuiles: 'avec les tuiles', tableau: 'avec le tableau', sans: 'sans aide' };
  function entete(v) {
    return `<div class="entete-tout" style="display:flow-root"><div class="entete"><span class="badge">${BADGE[etat.support]}</span>`
      + `<h2>Calcul littéral</h2><p>Fiche d’entraînement ${AVEC[etat.support]}` + (v === 'C' ? ' · <b>CORRIGÉ</b>' : '') + '</p></div><hr class="filet"></div>';
  }

  /** Les consignes avec le tableau et sans aide (lot 3) : les mots du cours. */
  function consigneSans(m) {
    const tab = etat.support === 'tableau';
    switch (m.forme) {
      case 'reduire': return 'j’écris l’expression réduite';
      case 'oppose': return 'l’opposé, c’est ce qu’il faut ajouter pour obtenir 0 · −(2x\u00a0+\u00a01) : je change tous les signes';
      case 'factoriser': return tab ? 'je trouve les bords du tableau (le facteur commun à gauche), j’écris le produit' : 'je factorise : le plus grand facteur commun devant';
      case 'commun': return tab ? 'le facteur commun à gauche, ce qui reste en haut ; 1re ligne avec les crochets, 2e ligne : je réduis'
        : '1re ligne : le facteur commun devant, ce qui reste entre crochets ; 2e ligne : je réduis';
      case 'carres': return tab ? 'j’écris \u{1D44E} et \u{1D44F}, puis \u{1D44E}² − \u{1D44F}² = (\u{1D44E} − \u{1D44F})(\u{1D44E} + \u{1D44F})' : 'je repère les deux carrés séparés par −, j’écris la forme factorisée';
      case 'ensemble':
        if (m.n === 11) return tab ? 'je complète le tableau du produit ; 1re ligne : je garde la parenthèse, 2e ligne : je réduis'
          : '1re ligne : je développe le produit entre parenthèses, 2e ligne : je change les signes et je réduis';
        return tab ? 'un tableau par produit ; 1re ligne : je développe chaque produit, 2e ligne : je réduis'
          : '1re ligne : je développe chaque produit, 2e ligne : je réduis';
      default:
        if (m.n === 3) return 'je calcule le produit';
        if (m.pile) return tab ? 'je complète le tableau ; 1re ligne : la somme des cases, 2e ligne : je réduis' : '1re ligne : je développe, 2e ligne : je réduis';
        return tab ? 'je complète le tableau, j’écris la somme des cases' : 'je développe';
    }
  }

  function consigne(m) {
    if (etat.support !== 'tuiles') return consigneSans(m);
    const mode = etat.rectangle;
    switch (m.forme) {
      case 'ecrire': return 'j’écris l’expression représentée par les tuiles';
      case 'reduire': return 'j’entoure les paires nulles s’il y en a, puis j’écris l’expression réduite';
      case 'oppose': return 'l’opposé, c’est ce qu’il faut ajouter pour obtenir 0 : à chaque tuile, la tuile de même forme, de l’autre couleur · −(2x\u00a0+\u00a01) se lit «\u00a0l’opposé de 2x\u00a0+\u00a01\u00a0»';
      case 'factoriser': return m.etoile ? 'je range ces tuiles en un rectangle avec mes tuiles, je lis ses bords, j’écris le produit'
        : 'je trouve les bords du rectangle (je les dessine), j’écris le produit';
      case 'ensemble':
        if (mode === 'lire') return 'je développe chaque produit en comptant les tuiles de son rectangle, puis je réduis';
        if (mode === 'construire') return 'je construis chaque rectangle avec mes tuiles et je le dessine dans son cadre ; je développe, puis je réduis';
        return 'rectangles remplis : je compte les tuiles · cadres vides : je les remplis avec mes tuiles et je les dessine · puis je réduis';
      default:
        if (m.pile) {       // double distributivité, identités : deux lignes de calcul, une consigne courte (la place)
          if (mode === 'lire') return 'je compte les tuiles du rectangle, puis je réduis';
          if (mode === 'construire') return 'je construis le rectangle avec mes tuiles, je le dessine dans le cadre, puis je réduis';
          return 'rectangle rempli : je compte les tuiles · cadre vide : je le construis et je le dessine · puis je réduis';
        }
        if (mode === 'lire') return 'les facteurs sont sur les bords, je compte les tuiles du rectangle';
        if (mode === 'construire') return 'je pose les facteurs avec mes tuiles, je remplis le rectangle, je le dessine dans le cadre, j’écris le résultat';
        return 'rectangle rempli : je compte les tuiles · cadre vide : je le remplis avec mes tuiles et je le dessine';
    }
  }

  function teteExo(m, num) {
    return `<div class="exo-tete"><span class="pastille">${num}</span><span class="exo-titre">${h(m.titre)}</span>`
      + `<span class="exo-consigne">${h(consigne(m))}</span></div>`;
  }

  const lettre = (i) => String.fromCharCode(97 + i);
  /** Avec « les deux », un exercice sur deux a son rectangle rempli, l'autre son cadre vide. */
  const aConstruire = (i) => etat.rectangle === 'construire' || (etat.rectangle === 'deux' && i % 2 === 1);

  // ---------------------------------------------------------------- composer : tirer, mesurer, ranger
  function composer() {
    const marches = M.MARCHES.filter((m) => etat.marches.includes(m.n) && disponible(m));
    const P = Number(etat.pages);
    const mes = $('mesure');
    const colW = (n) => (LARGEUR_BLOC - (n - 1) * ECART_COL) / n;

    // 1. l'en-tête de la première page
    mes.innerHTML = `<div class="page">${entete('S')}</div>`;
    const hEntete = mes.querySelector('.entete-tout').getBoundingClientRect().height / MM;

    // 2. une réserve d'exercices par marche, puis la LARGEUR de chacun, sujet et corrigé sur une ligne
    // sans figure (sans aide ; avec le tableau : réduire, l'opposé, multiplier, deux carrés), une page en prend bien plus
    const sansFigure = (m) => etat.support === 'sans' || (etat.support === 'tableau' && (['reduire', 'oppose', 'carres'].includes(m.forme) || m.n === 3));
    const sections = marches.map((m) => ({ m, items: M.reserve(m.n, graine, (sansFigure(m) ? 64 : 26) * P + 8, etat.support) }));
    let html = '';
    sections.forEach((s, si) => s.items.forEach((it, ii) => {
      for (const v of ['S', 'C']) html += `<div class="m-l" data-k="${si}.${ii}" data-v="w${v}">${cellule(it, 'm', v, false)}</div>`;
    }));
    mes.innerHTML = `<div class="page">${html}</div>`;
    mes.querySelectorAll('.m-l').forEach((el) => {
      const [si, ii] = el.dataset.k.split('.').map(Number);
      const it = sections[si].items[ii];
      it[el.dataset.v] = el.getBoundingClientRect().width / MM;
      it.w = Math.max(it.wS || 0, it.wC || 0);
    });

    // 3. le nombre de colonnes de chaque marche : les tuiles gardent leur taille, c'est la grille qui s'adapte.
    //    Quand tous les cas tiennent dans la même colonne, la grille est régulière. Quand un cas est bien plus
    //    large que les autres (une longue réduction avec des 𝑥²), il prend toute la largeur, sur sa propre rangée.
    for (const s of sections) {
      const cas = [...new Set(s.items.map((it) => it.sous))];
      const tient = (c, n) => {
        const l = s.items.filter((it) => it.sous === c);
        return l.filter((it) => it.w <= colW(n) + 0.01).length >= Math.max(1, Math.ceil(SEUIL * l.length));
      };
      let n = [3, 2, 1].find((k) => cas.every((c) => tient(c, k))) || 1;
      let larges = new Set();
      if (n === 1 && cas.length > 1) {
        const k = [3, 2].find((q) => cas.filter((c) => tient(c, q)).length * 2 >= cas.length);
        if (k) { n = k; larges = new Set(cas.filter((c) => !tient(c, k))); }
      }
      s.n = n;
      // sur toute la largeur, le corrigé (paires entourées) peut passer à la ligne ; le sujet, jamais
      s.items = s.items.filter((it) => {
        it.large = n > 1 && larges.has(it.sous);
        return (n === 1 || it.large ? it.wS : it.w) <= colW(n === 1 || it.large ? 1 : n) + 0.01;
      });
      // les rangées, dans l'ordre du tirage : un exercice large a la sienne, les autres se groupent par n
      s.rangs = [];
      let attente = [];
      for (const it of s.items) {
        if (n === 1 || it.large) s.rangs.push([it]);
        else { attente.push(it); if (attente.length === n) { s.rangs.push(attente); attente = []; } }
      }
      if (attente.length) s.rangs.push(attente);
    }

    // 4. la HAUTEUR de chaque exercice à la largeur de sa colonne (sujet et corrigé : on garde la plus grande)
    html = '';
    sections.forEach((s, si) => {
      html += `<div class="bloc" data-chrome="${si}">${teteExo(s.m, 9)}<div class="grille" style="grid-template-rows:10mm"><div></div></div></div>`;
      s.items.forEach((it, ii) => {
        for (const v of ['S', 'C']) html += `<div style="width:${colW(s.n === 1 || it.large ? 1 : s.n)}mm;display:flex" data-h="${si}.${ii}">${cellule(it, 'm', v, false)}</div>`;
      });
    });
    mes.innerHTML = `<div class="page">${html}</div>`;
    mes.querySelectorAll('[data-h]').forEach((el) => {
      const [si, ii] = el.dataset.h.split('.').map(Number);
      const it = sections[si].items[ii];
      it.h = Math.max(it.h || 0, el.getBoundingClientRect().height / MM);
    });
    mes.querySelectorAll('[data-chrome]').forEach((el) => {
      sections[Number(el.dataset.chrome)].chrome = el.getBoundingClientRect().height / MM - 10 + 2.6;
    });
    mes.innerHTML = '';

    // 5. les r premières rangées d'une marche, RANGÉES du cas le plus simple au plus difficile
    const seul = (s, l) => s.n === 1 || l[0].large;
    const rangees = (s, r) => {
      const pris = s.rangs.slice(0, r);
      const etroits = pris.filter((l) => !seul(s, l)).flat().sort((a, b) => a.rang - b.rang || a.h - b.h);
      const lignes = pris.filter((l) => seul(s, l));
      for (let i = 0; i < etroits.length; i += s.n) lignes.push(etroits.slice(i, i + s.n));
      lignes.sort((a, b) => a[0].rang - b[0].rang || a[0].h - b[0].h);
      return lignes.map((l) => ({ items: l, h: Math.max(...l.map((it) => it.h)) }));
    };
    const maxRangees = (s) => s.rangs.length;
    const compte = (s, r) => s.rangs.slice(0, r).reduce((t, l) => t + l.length, 0);

    // ranger dans les pages : un cadre d'exercice entier reste sur sa page ; plus grand qu'une page, il se coupe
    function plan(r) {
      const pages = [[]];
      let reste = HAUTEUR_UTILE - hEntete;
      sections.forEach((s, si) => {
        const R = rangees(s, r[si]);
        const hBloc = (a, b) => s.chrome + R.slice(a, b).reduce((t, x) => t + x.h, 0) + (b - a - 1) * ECART_RANG;
        // lot 3 : un cadre a au plus 26 exercices (de a à z) ; au-delà (sans aide, une page en prend bien plus), un second cadre
        const fin = (a) => { let n = 0, b = a; while (b < R.length && n + R[b].items.length <= MAX_LETTRES) { n += R[b].items.length; b++; } return Math.max(b, a + 1); };
        let a = 0;
        while (a < R.length) {
          const B = fin(a);
          const vide = pages[pages.length - 1].length === 0;
          if (hBloc(a, B) <= reste) { pages[pages.length - 1].push({ si, R: R.slice(a, B) }); reste -= hBloc(a, B); a = B; continue; }
          if (!vide && hBloc(a, B) <= HAUTEUR_UTILE) { pages.push([]); reste = HAUTEUR_UTILE; continue; }
          let b = a;
          while (b < B && hBloc(a, b + 1) <= reste) b++;
          if (b === a) { if (!vide) { pages.push([]); reste = HAUTEUR_UTILE; continue; } b = a + 1; }
          pages[pages.length - 1].push({ si, R: R.slice(a, b) });
          reste -= hBloc(a, b); a = b;
          if (a < R.length) { pages.push([]); reste = HAUTEUR_UTILE; }
        }
      });
      return pages;
    }

    // 6. remplir : on ajoute une rangée à la marche qui a le moins d'exercices, tant que tout tient
    const r = sections.map((s) => (s.items.length ? 1 : 0));
    let pages = plan(r);
    const plein = new Set();
    const ecartees = sections.map(() => 0);
    if (pages.length <= P) {
      for (;;) {
        let k = -1;
        sections.forEach((s, i) => {
          if (plein.has(i)) return;
          if (r[i] >= maxRangees(s)) { plein.add(i); return; }
          if (k < 0 || compte(s, r[i]) < compte(sections[k], r[k])) k = i;
        });
        if (k < 0) break;
        r[k]++;
        const p2 = plan(r);
        if (p2.length > P) {
          // la rangée suivante ne tient pas dans la place qui reste (un rectangle haut) : on l'écarte et on essaie
          // celle d'après, jusqu'au bout de la réserve — la page se remplit avec ce qui tient
          r[k]--;
          sections[k].rangs.splice(r[k], 1);
          ecartees[k]++;
        } else pages = p2;
      }
    }
    const epuise = sections.every((s, i) => r[i] >= maxRangees(s) && !ecartees[i]);
    fiche = { sections, pages, P, epuise, total: sections.reduce((t, s, i) => t + compte(s, r[i]), 0) };
  }

  // ---------------------------------------------------------------- dessiner les pages
  function pagesHtml(v) {
    let num = 0;
    return fiche.pages.map((blocs, pi) => {
      let c = pi === 0 ? entete(v) : '';
      for (const b of blocs) {
        const s = fiche.sections[b.si];
        num++;
        let cel = '', i = 0;
        for (const rg of b.R) for (const it of rg.items) { cel += cellule(it, lettre(i), v, AVEC_RECTANGLE(s.m) && aConstruire(i)); i++; }
        c += `<div class="bloc">${teteExo(s.m, num)}<div class="grille" style="grid-template-columns:repeat(${s.n},minmax(0,1fr));`
          + `grid-template-rows:${b.R.map((x) => x.h.toFixed(2) + 'mm').join(' ')}">${cel}</div></div>`;
      }
      return `<section class="page" data-feuille="${v}">${c}<div class="pied"><span class="g"></span>`
        + '<span class="sig"><img src="/favicon.svg" alt="" width="17" height="17"><span>mathsgo.re · CC BY-NC-SA 4.0</span></span>'
        + `<span class="d">${pi + 1}</span></div></section>`;
    });
  }

  function afficher() {
    const liste = [];
    if (etat.imprimer !== 'corrige') liste.push(...pagesHtml('S'));
    if (etat.imprimer !== 'sujet') liste.push(...pagesHtml('C'));
    $('feuilles').innerHTML = liste.map((p) => `<div class="cadre">${p}</div>`).join('');
    echelle();
    const n = fiche.pages.length, P = fiche.P;
    const e = $('etat');
    e.classList.toggle('alerte', n > P);
    if (n > P) e.textContent = `Les marches cochées ne tiennent pas sur ${P} page${P > 1 ? 's' : ''} : la fiche en fait ${n}.`;
    else if (fiche.epuise) e.textContent = `${fiche.total} exercices : tous ceux que ces marches permettent.`;
    else e.textContent = `${fiche.total} exercices sur ${n} page${n > 1 ? 's' : ''}, le corrigé à l’identique.`;
  }

  function echelle() {
    const zone = $('apercu');
    const dispo = zone.clientWidth - (window.innerWidth > 900 ? 40 : 20);
    const s = Math.min(1, dispo / (210 * MM));
    document.querySelectorAll('.cadre').forEach((c) => {
      c.style.width = (210 * MM * s).toFixed(1) + 'px';
      c.style.height = (297 * MM * s).toFixed(1) + 'px';
      c.firstElementChild.style.transform = `scale(${s.toFixed(4)})`;
    });
  }

  // ---------------------------------------------------------------- le menu : les marches du cours, en deux parties
  const PARTIES = { 1: 'marches 0 à 8', 2: 'marches 9 à 15' };
  const NOTE = {
    tuiles: 'En gris : pas avec les tuiles. Elles se font avec le tableau, ou sans aide.',
    autre: 'En gris : la marche 0 et ★ se font seulement avec les tuiles.',
  };
  function construireMenu() {
    $('marches').innerHTML = [1, 2].map((p) => {
      const lignes = M.MARCHES.filter((m) => m.partie === p).map((m) =>
        `<button type="button" class="marche" data-marche="${m.n}" aria-pressed="false"><span class="coche" aria-hidden="true"></span>`
        + `<span class="mtxt"><span class="mnom"><b>${m.etoile ? '★' : m.n}</b>${h(m.nom)}</span><span class="mex">${h(m.exemple)}</span></span></button>`).join('');
      return `<div class="partie"><p class="ptitre"><span>Partie ${p} <small>· ${PARTIES[p]}</small></span>`
        + `<button type="button" class="tout" data-partie="${p}" aria-pressed="false" aria-label="Cocher toute la partie ${p}">tout</button></p>${lignes}`
        + (p === 2 ? `<p class="note-gris" id="noteGris">${NOTE.tuiles}</p>` : '') + '</div>';
    }).join('');
  }

  const dansPartie = (p) => M.MARCHES.filter((m) => m.partie === p && disponible(m)).map((m) => m.n);

  function majMenu() {
    document.querySelectorAll('.marche').forEach((b) => {
      const m = M.marche(Number(b.dataset.marche));
      const libre = disponible(m);
      const on = libre && etat.marches.includes(m.n);
      b.disabled = !libre;
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('.coche').textContent = on ? '✓' : '';
    });
    document.querySelectorAll('.tout').forEach((b) => {
      b.setAttribute('aria-pressed', String(dansPartie(Number(b.dataset.partie)).every((n) => etat.marches.includes(n))));
    });
    document.querySelectorAll('.seg').forEach((g) => {
      const val = etat[g.dataset.reglage];
      g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(val === b.dataset.v)));
    });
    $('noteGris').textContent = etat.support === 'tuiles' ? NOTE.tuiles : NOTE.autre;
    // « Rectangle » ne sert que s'il y a un rectangle à lire ou à construire sur la fiche (avec les tuiles)
    const actif = M.MARCHES.some((m) => etat.marches.includes(m.n) && disponible(m) && AVEC_RECTANGLE(m));
    const g = $('groupeRect');
    g.classList.toggle('grise', !actif);
    g.querySelectorAll('button').forEach((b) => { b.disabled = !actif; });
    document.body.classList.toggle('couleurs-bg', etat.couleurs === 'bg');
  }

  function toutRefaire() { composer(); afficher(); }
  const trier = (l) => M.MARCHES.map((m) => m.n).filter((n) => l.includes(n));
  const libres = (l) => l.filter((n) => disponible(M.marche(n)));

  function brancher() {
    $('marches').addEventListener('click', (ev) => {
      const tout = ev.target.closest('.tout');
      if (tout) {
        const l = dansPartie(Number(tout.dataset.partie));
        if (l.every((n) => etat.marches.includes(n))) {
          const reste = etat.marches.filter((n) => !l.includes(n));
          if (!libres(reste).length) return;               // il reste toujours une marche cochée (faisable avec ce support)
          etat.marches = reste;
        } else etat.marches = trier([...etat.marches, ...l]);
        majMenu(); toutRefaire();
        return;
      }
      const b = ev.target.closest('.marche');
      if (!b || b.disabled) return;
      const n = Number(b.dataset.marche);
      if (etat.marches.includes(n)) { if (libres(etat.marches).length === 1) return; etat.marches = etat.marches.filter((x) => x !== n); }
      else etat.marches = trier([...etat.marches, n]);
      majMenu(); toutRefaire();
    });
    document.querySelectorAll('.seg').forEach((g) => g.addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b || b.disabled) return;
      const cle = g.dataset.reglage, v = b.dataset.v;
      if (etat[cle] === v) return;
      etat[cle] = v;
      // un autre support : les marches cochées qu'il ne fait pas restent en mémoire (elles reviennent avec les tuiles) ;
      // s'il n'en reste aucune, on coche la plus proche qu'il sait faire
      if (cle === 'support' && !libres(etat.marches).length) {
        const ok = M.MARCHES.filter(disponible).map((m) => m.n);
        etat.marches = trier([...etat.marches, ok.find((n) => n >= Math.min(...etat.marches)) ?? ok[0]]);
      }
      majMenu();
      if (cle === 'couleurs') return;            // les couleurs ne changent ni les nombres ni la place
      if (cle === 'imprimer') { afficher(); return; }
      toutRefaire();
    }));
    $('autres').addEventListener('click', () => { graine = (graine * 1103515245 + 12345) % 4294967291 || 7; toutRefaire(); });
    // la police du 𝑥 doit être chargée avant l'impression
    $('imprimer').addEventListener('click', () => { document.fonts.ready.then(() => setTimeout(() => window.print(), 80)); });
    let attente = null;
    window.addEventListener('resize', () => { clearTimeout(attente); attente = setTimeout(echelle, 60); });
  }

  // les mesures se font avec les vraies polices : on les charge d'abord
  construireMenu(); majMenu(); brancher();
  const polices = ['400 10pt MGPoppins', '700 10pt MGPoppins', '700 10pt SplatLettres', '400 10pt SplatLettres']
    .map((p) => document.fonts.load(p, 'a1\u{1D465}').catch(() => null));
  Promise.all(polices).then(() => document.fonts.ready).then(toutRefaire, toutRefaire);
  // pour les contrôles automatiques (aucun effet sur l'usage normal)
  window.__generateurTuiles = { etat, composer: () => fiche, refaire: () => { majMenu(); toutRefaire(); }, graine: () => graine, fixerGraine: (g) => { graine = g; } };
})();
</script>
