<style>
  :root{
    --bg:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --border:#cbd5e1;
    --shadow:0 2px 10px rgba(0,0,0,.08);
    --btn:#ffffff;
    --btnHover:#f1f5f9;
    --accent:#2563eb;
    --danger:#dc2626;
  }
  html,body{height:100%; margin:0; background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;}
  #app{height:100%; display:flex; flex-direction:column;}

  #toolbar{
    display:flex; flex-wrap:wrap; gap:8px;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    background:#fff;
    align-items:center;
    box-shadow:var(--shadow);
    z-index:2;
  }
  .group{display:flex; gap:8px; align-items:center; border-right:1px solid #e2e8f0; padding-right:12px; margin-right:4px;}
  .group:last-child{border-right:none;}
  .spacer{flex:1;}

  button, .toggle, select{
    border:1px solid var(--border);
    background:var(--btn);
    padding:8px 10px;
    border-radius:10px;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    user-select:none;
    font-family:inherit;
  }
  #backMenu{
    min-height:40px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 11px;
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--ink);
    background:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
  }
  #backMenu:hover{background:var(--btnHover);}
  select{padding-right:24px; font-weight:600; max-width: 320px;}
  button:hover, .toggle:hover, select:hover{background:var(--btnHover);}
  button:active{transform:translateY(1px);}

  button.primary{border-color:rgba(37,99,235,.45);}
  button.primary.on{background:rgba(37,99,235,.12); border-color:rgba(37,99,235,.7);}
  button.danger{border-color:rgba(220,38,38,.45);}
  button.danger:hover{background:rgba(220,38,38,.08);}

  .toggle{display:flex; gap:10px; align-items:center;}
  .pill{
    width:36px; height:22px; border-radius:999px;
    background:#e2e8f0;
    position:relative;
    border:1px solid var(--border);
    flex:0 0 auto;
  }
  .pill::after{
    content:"";
    width:18px; height:18px; border-radius:50%;
    position:absolute; top:1px; left:1px;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
    transition:all .15s ease;
  }
  .toggle.on .pill{background:rgba(37,99,235,.18); border-color:rgba(37,99,235,.5);}
  .toggle.on .pill::after{left:17px;}

  #stageWrap{flex:1; position:relative; overflow:hidden; background:#fff; touch-action:none;}
  #mobilePuzzleHint{display:none; padding:7px 12px; background:#f8fafc; border-bottom:1px solid var(--border); color:var(--muted); font-size:13px; text-align:center;}
  #puzzleStatus{min-height:0; padding:0 12px; color:var(--muted); font-size:13px; text-align:center;}
  #puzzleStatus:not(:empty){padding-top:6px; padding-bottom:6px;}
  #puzzleStatus.success{color:#166534; font-weight:700;}
  #puzzleStatus.error{color:#b91c1c; font-weight:700;}
  #celebration{
    position:absolute; inset:0; z-index:8; overflow:hidden;
    display:none; pointer-events:none;
  }
  #celebration.on{display:block;}
  .celebrationMessage{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(.82);
    min-width:min(310px,76vw); padding:18px 26px 17px;
    border:3px solid rgba(255,255,255,.9); border-radius:26px;
    background:linear-gradient(135deg,#2563eb 0%,#4f46e5 52%,#7c3aed 100%);
    color:#fff; text-align:center;
    box-shadow:0 22px 60px rgba(37,99,235,.32),0 8px 20px rgba(15,23,42,.2);
    animation:bravoPop 2.8s ease both;
  }
  .celebrationIcon{
    display:grid; place-items:center; width:52px; height:52px; margin:-42px auto 7px;
    border:3px solid #fff; border-radius:50%; background:#fbbf24; color:#78350f;
    box-shadow:0 7px 18px rgba(15,23,42,.2); font-size:29px; line-height:1;
  }
  .celebrationTitle{display:block;font-size:clamp(30px,7vw,48px);font-weight:950;line-height:1.04;letter-spacing:-.03em;}
  .celebrationSubtitle{display:block;margin-top:5px;font-size:clamp(14px,3.5vw,18px);font-weight:750;opacity:.94;}
  .confettiPiece{
    position:absolute; top:-24px; width:10px; height:18px; border-radius:3px;
    background:var(--confetti-color); opacity:0;
    animation:confettiFall var(--confetti-duration) cubic-bezier(.2,.7,.25,1) var(--confetti-delay) both;
  }
  @keyframes bravoPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
    16%,76%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-56%) scale(.96)}
  }
  @keyframes confettiFall{
    0%{opacity:0;transform:translate3d(0,-20px,0) rotate(0deg)}
    10%{opacity:1}
    100%{opacity:0;transform:translate3d(var(--confetti-drift),110vh,0) rotate(var(--confetti-spin))}
  }
  @media (prefers-reduced-motion:reduce){
    .confettiPiece{display:none;}
    .celebrationMessage{animation:none;opacity:1;}
  }
  svg{width:100%; height:100%; display:block; touch-action:none;}

  .boardLine{stroke:#111827; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .thinLine{stroke:#111827; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .rightAngle{stroke:#111827; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:1;}
  .label{font-size:22px; font-weight:700; fill:#111827; paint-order:stroke; stroke:#fff; stroke-width:5px; display:none;}
  .showLetters .label{display:block;}
  .mobileNote{display:none; font-size:28px; font-weight:800; fill:#64748b; text-anchor:middle;}

  .piecePoly{stroke:#111827; stroke-width:3.2; stroke-linejoin:round; cursor:grab;}
  .piecePoly:active{cursor:grabbing;}
  .previewPoly{stroke:#111827; stroke-width:3.2; stroke-linejoin:round; opacity:.9; pointer-events:none;}
  .targetSquare{fill:rgba(248,250,252,.72);}

  .pieceSelected .piecePoly{stroke-width:5.2;}
  .handle{pointer-events:auto; cursor:crosshair;}
  .handleHit{fill:transparent; stroke:none; pointer-events:all;}
  .handleLine{stroke:#111827; stroke-width:3; opacity:.8;}
  .handleDot{fill:#fff; stroke:#111827; stroke-width:3;}

  /* Mode vide = moulin unique sans pièces ni lettres */
  .modeVide #pieces,
  .modeVide .handle{display:none;}

  /* Modal Énoncé */
  #enonceModal{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(15,23,42,.55);
    z-index:10;
    padding:16px;
  }
  #enonceCard{
    width:min(860px, 96vw);
    max-height:min(84vh, 900px);
    overflow:auto;
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    padding:16px 16px 12px;
  }
  #enonceHead{display:flex; align-items:flex-start; gap:12px;}
  #enonceTitle{margin:0; font-size:18px;}
  #enonceClose{margin-left:auto; border-radius:12px;}
  #enonceBody{color:var(--ink); line-height:1.35; font-size:14px;}
  #enonceBody .muted{color:var(--muted);}
  #enonceBody ul{margin:8px 0 0 18px;}

  @media (pointer: coarse), (max-width: 900px){
    #toolbar{gap:6px; padding:8px 10px;}
    button, .toggle, select{padding:10px 12px; font-size:15px;}
    .group{border:none; padding:0; margin:0;}
  }

  @media (max-width:700px){
    html,body{overflow-x:hidden;}
    /* Sur téléphone, les pièces occupent a² et b² et doivent rejoindre c²
       sur l'unique figure, comme sur ordinateur. */
    #stageWrap{touch-action:pan-y; overflow-x:hidden;}
    svg#stage{touch-action:pan-y;}
    svg#stage.isDragging{touch-action:none;}
    svg#stage.compactLayout .label{display:none!important;}
    svg#stage .piecePoly,
    svg#stage .handle{touch-action:none;}
    #fullscreen{display:none;}
    #mobilePuzzleHint{display:none;}
  }

  /* maths&go — interface compacte : l'activité reste au premier plan. */
  #toolbar{
    gap:6px;
    padding:8px 12px;
    box-shadow:0 2px 12px rgba(15,23,42,.06);
  }
  #toolbar .group{gap:6px; padding-right:8px; margin-right:0;}
  #toolbar button,
  #toolbar select{min-height:40px; border-radius:12px; font-weight:750;}
  #puzzleSelect{min-width:250px;}
  #stageWrap{background:transparent;}
  #mobilePuzzleHint{background:#f8fafc; border-bottom:1px solid #e2e8f0;}

  @media (max-width:700px){
    #toolbar{display:grid; grid-template-columns:minmax(0,1fr); gap:7px; width:100%; max-width:100%; padding:8px 10px; box-sizing:border-box;}
    #toolbar .group{display:flex; min-width:0; max-width:100%; border:0; padding:0; margin:0;}
    #toolbar .group:first-child{width:100%;}
    #backMenu{width:44px;min-width:44px;padding:0;font-size:0;}
    #backMenu::before{content:"←";font-size:22px;line-height:1;}
    #puzzleSelect{width:auto; flex:1; max-width:none; min-width:0; min-height:44px;}
    #toolbar .group:nth-child(2),
    #toolbar .group:nth-child(3),
    #toolbar #checkSolution,
    #toolbar #fullscreen{display:none;}
    #toolbar .group:nth-child(4){display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); width:100%; gap:6px;}
    #toolbar .group:nth-child(4) button{width:100%; min-width:0; padding:9px 5px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    #toolbar .spacer{display:none;}
    #toolbar .group:last-child{width:100%;}
    #toolbar #enonce{width:100%; min-height:44px;}
    #mobilePuzzleHint{display:none;}
    #puzzleStatus{font-size:12px; padding-left:8px; padding-right:8px;}
    #stageWrap{min-height:0;}
  }

  @media (min-width:701px){
    #toolbar .group:nth-child(2){order:4;}
    #toolbar .group:nth-child(3){order:5;}
    #toolbar .group:nth-child(4){order:3;}
  }

</style>

<script src="../../assets/js/pythagore-snap-engine.js"></script>
<script>
(() => {
  "use strict";

  const SnapEngine=window.MathsGoPythagoreSnapEngine;
  if(!SnapEngine) throw new Error("Le moteur géométrique du Moulin n’est pas chargé.");

  const BASE = { b: 420, ratio: 0.5, gap: 170, margin: 60 };
  const COLORS = {
    green: "#52b788", magenta: "#d66b9c", yellow: "#f3c969", blue: "#5aa7e8",
    gray: "#8b95a1", red: "#df766f", purple: "#9b83d4", orange: "#e99a5d",
    teal: "#57b5aa", lightblue: "#9dc9ee", lightBlue: "#9dc9ee", darkblue: "#4f7fb9", brown: "#8b6b58",
    lightRed: "#f2aaa5", softGray: "#c3cad2",
    black: "#111827"
  };

  const SNAP = { pos: 22, posStrong: 28, rot: 7 };
  const DOUBLE_TAP_MS = 380;
  const TAP_MOVE_TOL = 6; // en unités monde

  function lineIntersection(p1,p2, p3,p4){
    const x1=p1.x,y1=p1.y,x2=p2.x,y2=p2.y;
    const x3=p3.x,y3=p3.y,x4=p4.x,y4=p4.y;
    const den = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
    if (Math.abs(den) < 1e-9) return null;
    return {
      x: ((x1*y2 - y1*x2)*(x3-x4) - (x1-x2)*(x3*y4 - y3*x4)) / den,
      y: ((x1*y2 - y1*x2)*(y3-y4) - (y1-y2)*(x3*y4 - y3*x4)) / den
    };
  }

  function deg(rad){ return rad * 180 / Math.PI; }
  function rad(deg){ return deg * Math.PI / 180; }
  function normAngleDeg(a){ let x = a % 360; return x < -180 ? x+360 : (x>180 ? x-360 : x); }

  function polygonCentroid(pts){
    let A=0, cx=0, cy=0;
    for(let i=0; i<pts.length; i++){
      const p=pts[i], q=pts[(i+1)%pts.length], cross=p.x*q.y-q.x*p.y;
      A+=cross; cx+=(p.x+q.x)*cross; cy+=(p.y+q.y)*cross;
    }
    A*=0.5;
    if(Math.abs(A)<1e-9) return {x:pts[0].x, y:pts[0].y};
    return {x:cx/(6*A), y:cy/(6*A)};
  }

  function bboxOfPoints(pts){
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    for(const p of pts){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
    return {minX, minY, maxX, maxY, w:maxX-minX, h:maxY-minY};
  }

  function svgEl(name, attrs = {}){
    const el = document.createElementNS("http://www.w3.org/2000/svg", name);
    for(const [k,v] of Object.entries(attrs)) el.setAttribute(k, String(v));
    return el;
  }

  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const stageWrap = document.getElementById("stageWrap");
  const btnModeEleves = document.getElementById("modeEleves");
  const btnModeVide = document.getElementById("modeVide");
  const puzzleSelect = document.getElementById("puzzleSelect");
  const toggleLetters = document.getElementById("toggleLetters");
  const btnReset = document.getElementById("reset");
  const btnFlip = document.getElementById("flip");
  const btnCheckSolution = document.getElementById("checkSolution");
  const btnFullscreen = document.getElementById("fullscreen");
  const btnEnonce = document.getElementById("enonce");
  const puzzleStatus = document.getElementById("puzzleStatus");
  const celebration = document.getElementById("celebration");

  const modal = document.getElementById("enonceModal");
  const modalTitle = document.getElementById("enonceTitle");
  const modalBody = document.getElementById("enonceBody");
  const modalClose = document.getElementById("enonceClose");

  const state = {
    mode: "eleves",
    layoutCompact: null,
    puzzle: "perigal",
    snapEnabled: true,
    angleSnapEnabled: true,
    lettersEnabled: false,
    selectedId: null,
    dragging: null,
    pieces: new Map(),
    solutionPoses: new Map(),
    snapPoints: [],
    molds: [],
    moulins: {L:null, R:null},
    worldTransform: {s: 1, tx: 0, ty: 0},
    lastTap: null,
    lastPointerWorld: null,
    celebrated: false,
    completionTimer: null,
    celebrationTimer: null
  };

  function applyWorldTransform(){
    const {s, tx, ty} = state.worldTransform;
    world.setAttribute("transform", `translate(${tx},${ty}) scale(${s})`);
    updateHandleGeometry();
  }

  function isCompactViewport(){
    return window.matchMedia && window.matchMedia("(max-width: 700px)").matches;
  }

  function isBhaskaraPuzzle(){
    return state.puzzle === "bhaskara";
  }

  function activePuzzleMoulin(){
    return state.moulins?.L;
  }

  function clientToWorld(evt){
    const pt = stage.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const m = world.getScreenCTM();
    return pt.matrixTransform(m.inverse());
  }

  function pieceWorldVertices(piece){
    const t=rad(piece.rot), c=Math.cos(t), s=Math.sin(t);
    const sx = piece.flipX ? -1 : 1;
    return piece.verticesLocal.map(v => {
      const x0 = sx * v.x;
      const y0 = v.y;
      return {
        x: piece.pos.x + (x0*c - y0*s),
        y: piece.pos.y + (x0*s + y0*c)
      };
    });
  }

  function applyPieceTransform(p){
    const sx = p.flipX ? -1 : 1;
    p.el.setAttribute("transform", `translate(${p.pos.x},${p.pos.y}) rotate(${p.rot}) scale(${sx},1)`);
  }

  function screenPixelsToWorld(px){
    const ctm = world.getScreenCTM();
    if(!ctm) return px;
    const scale = Math.hypot(ctm.a, ctm.b) || 1;
    return px / scale;
  }

  function updateHandleGeometry(){
    const compact=isCompactViewport();
    const hitRadius=compact ? screenPixelsToWorld(25) : 34;
    const dotRadius=compact ? screenPixelsToWorld(12) : 18;
    const textSize=compact ? screenPixelsToWorld(20) : 22;
    for(const piece of state.pieces.values()){
      if(!piece.handleHitEl) continue;
      const topExtent=Math.max(0,...piece.verticesLocal.map(vertex=>-vertex.y));
      const distance=compact
        ? Math.max(screenPixelsToWorld(56),topExtent+screenPixelsToWorld(34))
        : 64;
      piece.handleHitEl.setAttribute("cy",-distance);
      piece.handleHitEl.setAttribute("r",hitRadius);
      piece.handleLineEl.setAttribute("y2",-distance);
      piece.handleDotEl.setAttribute("cy",-distance);
      piece.handleDotEl.setAttribute("r",dotRadius);
      piece.handleTextEl.setAttribute("y",-distance);
      piece.handleTextEl.style.fontSize=`${textSize}px`;
    }
  }

  function touchFriendlyDistance(desktopDistance, mobilePixels){
    return isCompactViewport()
      ? Math.max(desktopDistance, screenPixelsToWorld(mobilePixels))
      : desktopDistance;
  }

  function signedPolygonArea(points){
    let sum = 0;
    for(let i=0; i<points.length; i++){
      const a = points[i], b = points[(i+1)%points.length];
      sum += a.x*b.y - b.x*a.y;
    }
    return sum / 2;
  }

  function polygonArea(points){ return Math.abs(signedPolygonArea(points)); }

  function transformLocalVertices(piece, pos, rot, flipX){
    const t=rad(rot), c=Math.cos(t), s=Math.sin(t), sx=flipX ? -1 : 1;
    return piece.verticesLocal.map(v=>{
      const x=sx*v.x, y=v.y;
      return {x:pos.x+x*c-y*s, y:pos.y+x*s+y*c};
    });
  }

  // Cherche une pose exacte d'une pièce sur un polygone cible congruent.
  // On autorise la rotation et le retournement manuel, jamais un étirement.
  function poseForTargetPolygon(piece, targetPoints){
    if(!piece || !targetPoints || piece.verticesLocal.length !== targetPoints.length) return null;
    const src=piece.verticesLocal;
    for(const flipX of [false,true]){
      const sx=flipX ? -1 : 1;
      const flipped=src.map(v=>({x:sx*v.x,y:v.y}));
      for(let si=0; si<src.length; si++){
        for(let sj=0; sj<src.length; sj++){
          if(si===sj) continue;
          const sv={x:flipped[sj].x-flipped[si].x,y:flipped[sj].y-flipped[si].y};
          const sl=Math.hypot(sv.x,sv.y);
          if(sl<1e-8) continue;
          for(let ti=0; ti<targetPoints.length; ti++){
            for(let tj=0; tj<targetPoints.length; tj++){
              if(ti===tj) continue;
              const tv={x:targetPoints[tj].x-targetPoints[ti].x,y:targetPoints[tj].y-targetPoints[ti].y};
              const tl=Math.hypot(tv.x,tv.y);
              if(Math.abs(sl-tl)>1e-4) continue;
              const rot=deg(Math.atan2(tv.y,tv.x)-Math.atan2(sv.y,sv.x));
              const rq=rotatePointLocal(flipped[si],rot);
              const pos={x:targetPoints[ti].x-rq.x,y:targetPoints[ti].y-rq.y};
              const actual=transformLocalVertices(piece,pos,rot,flipX);
              const unused=new Set(targetPoints.map((_,i)=>i));
              const expected=[];
              let maxD=0;
              for(const v of actual){
                let best=-1, bestD=Infinity;
                for(const k of unused){
                  const d=Math.hypot(v.x-targetPoints[k].x,v.y-targetPoints[k].y);
                  if(d<bestD){bestD=d;best=k;}
                }
                if(best<0) { maxD=Infinity; break; }
                unused.delete(best);
                expected.push({...targetPoints[best]});
                maxD=Math.max(maxD,bestD);
              }
              if(maxD<0.5) return {pos,rot,flipX,expectedVertices:expected};
            }
          }
        }
      }
    }
    return null;
  }

  // Solution exacte du cadre de Bhaskara : quatre triangles autour du carré
  // central de côté |b-a|. Cette construction sert aussi de test de congruence
  // pour les futures variantes de quatre triangles.
  function bhaskaraSolutionPolygons(){
    const targetMoulin=activePuzzleMoulin();
    if(!targetMoulin) return null;
    const {a,b,c}=targetMoulin.mold;
    const {B,C,Cw,Bw}=targetMoulin;
    const edges=[[B,C],[C,Cw],[Cw,Bw],[Bw,B]];
    const thirdPoints=edges.map(([p,q])=>{
      const ex=(q.x-p.x)/c, ey=(q.y-p.y)/c;
      const nx=ey, ny=-ex; // normale vers l'intérieur du carré cible
      return {x:p.x+(b*b/c)*ex+(a*b/c)*nx,y:p.y+(b*b/c)*ey+(a*b/c)*ny};
    });
    return {
      triangles:edges.map(([p,q],i)=>[p,q,thirdPoints[i]]),
      square:thirdPoints
    };
  }

  function exactSolutionPolygons(){
    const targetMoulin=activePuzzleMoulin();
    const layout=EXACT_SOLUTION_UV[state.puzzle];
    if(!targetMoulin || !layout) return null;
    const {C,mold}=targetMoulin;
    return Object.fromEntries(Object.entries(layout).map(([key,points])=>[
      key,
      points.map(([u,v])=>({
        x:C.x+(u*mold.a)*mold.uvec.x+(v*mold.a)*mold.vvec.x,
        y:C.y+(u*mold.a)*mold.uvec.y+(v*mold.a)*mold.vvec.y
      }))
    ]));
  }

  function prepareSolutionPoses(){
    state.solutionPoses.clear();
    if(isBhaskaraPuzzle()){
      const target=bhaskaraSolutionPolygons();
      if(!target) return;
      target.triangles.forEach((poly,i)=>{
        const piece=state.pieces.get(`L-t${i+1}`);
        if(!piece) return;
        const pose=poseForTargetPolygon(piece,poly);
        if(pose) state.solutionPoses.set(piece.id,pose);
      });
      const squarePiece=state.pieces.get("L-sq");
      if(squarePiece){
        const squarePose=poseForTargetPolygon(squarePiece,target.square);
        if(squarePose) state.solutionPoses.set(squarePiece.id,squarePose);
      }
      return;
    }

    const target=exactSolutionPolygons();
    if(!target) return;
    Object.entries(target).forEach(([key,poly])=>{
      const piece=state.pieces.get(`L-${key}`);
      if(!piece) return;
      const pose=poseForTargetPolygon(piece,poly);
      if(pose) state.solutionPoses.set(piece.id,pose);
    });
  }

  // Conservation interne de la solution exacte : elle sert aux contrôles de
  // géométrie et pourra être réutilisée, mais elle n'est plus exposée à l'élève.
  function showSolution(){
    if(!state.solutionPoses.size){
      setPuzzleStatus("La solution automatique de ce découpage doit encore être validée géométriquement.","error");
      return;
    }
    state.solutionPoses.forEach((pose,id)=>{
      const piece=state.pieces.get(id);
      if(!piece) return;
      piece.pos={...pose.pos};
      piece.rot=pose.rot;
      piece.flipX=pose.flipX;
      applyPieceTransform(piece);
    });
    setSelected(null);
    setPuzzleStatus("Solution affichée. Tu peux recommencer pour rejouer le puzzle.","success");
  }

  function clipConvexPolygon(subject,clip){
    let output=subject.map(p=>({...p}));
    const orientation=Math.sign(signedPolygonArea(clip)) || 1;
    for(let i=0;i<clip.length;i++){
      const a=clip[i], b=clip[(i+1)%clip.length];
      const inside=p=>orientation*((b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x)) >= -1e-7;
      const input=output; output=[];
      if(!input.length) break;
      for(let j=0;j<input.length;j++){
        const p=input[j], q=input[(j+1)%input.length];
        const pin=inside(p), qin=inside(q);
        if(pin && qin) output.push(q);
        else if(pin && !qin){
          const hit=lineIntersection(p,q,a,b); if(hit) output.push(hit);
        } else if(!pin && qin){
          const hit=lineIntersection(p,q,a,b); if(hit) output.push(hit);
          output.push(q);
        }
      }
    }
    return output;
  }

  function checkPuzzleSolution({quiet=false,celebrate=false}={}){
    const targetMoulin=activePuzzleMoulin();
    if(!targetMoulin || !state.pieces.size) return false;
    const target=targetMoulin.mold.corners;
    const pieces=[...state.pieces.values()].map(piece=>({piece,points:pieceWorldVertices(piece)}));
    const targetArea=polygonArea(target);
    const totalArea=pieces.reduce((sum,item)=>sum+polygonArea(item.points),0);
    if(Math.abs(totalArea-targetArea)>Math.max(20,targetArea*0.002)){
      if(!quiet) setPuzzleStatus("Les pièces ne correspondent pas à la surface du carré cible.","error");
      return false;
    }
    if(pieces.some(item=>item.points.some(point=>!pointInConvexPolygon(point,target,1.5)))){
      if(!quiet) setPuzzleStatus("Une pièce dépasse encore du carré cible.","error");
      return false;
    }
    for(let i=0;i<pieces.length;i++){
      for(let j=i+1;j<pieces.length;j++){
        const overlap=polygonArea(clipConvexPolygon(pieces[i].points,pieces[j].points));
        if(overlap>Math.max(12,targetArea*0.0002)){
          if(!quiet) setPuzzleStatus("Les pièces se chevauchent encore.","error");
          return false;
        }
      }
    }
    setPuzzleStatus("Bravo : les pièces remplissent exactement le carré de l’hypoténuse.","success");
    if(celebrate && !state.celebrated){
      state.celebrated=true;
      launchCelebration();
    }
    return true;
  }

  function queueCompletionCheck(){
    if(state.mode!=="eleves" || state.celebrated) return;
    if(state.completionTimer) clearTimeout(state.completionTimer);
    state.completionTimer=setTimeout(()=>{
      state.completionTimer=null;
      checkPuzzleSolution({quiet:true,celebrate:true});
    },80);
  }

  function setSelected(id){
    if(state.selectedId && state.pieces.has(state.selectedId)){
      const prev=state.pieces.get(state.selectedId);
      prev.el.classList.remove("pieceSelected");
      prev.handleEl.style.display="none";
    }
    state.selectedId=id;
    if(id && state.pieces.has(id)){
      const p=state.pieces.get(id);
      p.el.classList.add("pieceSelected");
      p.handleEl.style.display="block";
      // au premier plan
      p.el.parentNode.appendChild(p.el);
    }
  }

  function flipPiece(id){
    if(!id || !state.pieces.has(id)) return;
    const p = state.pieces.get(id);
    p.flipX = !p.flipX;
    p.placed=false;
    applyPieceTransform(p);
    queueCompletionCheck();
  }

  function fitWorldToViewport(){
    // Centre et ajuste le zoom en se basant sur les plateaux, et sur la zone
    // initiale des pièces en mode téléphone. Le déplacement d'une pièce ne
    // relance pas ce calcul : le cadrage reste donc fixe pendant le jeu.
    const W = stageWrap.clientWidth || 1;
    const H = stageWrap.clientHeight || 1;

    const gBoards = document.getElementById("boards");
    const gBoardsL = document.getElementById("boardsL");
    const gPieces = document.getElementById("pieces");

    const compact = isCompactViewport() && state.mode === "eleves";
    // Sur téléphone, le moulin de gauche est le puzzle complet : pièces sur
    // a² et b², avec c² vide sur cette même figure.
    const target = (gBoardsL || gBoards) || world;
    let bb = target.getBBox();
    if(compact && gPieces){
      const piecesBox = gPieces.getBBox();
      if(piecesBox.width || piecesBox.height){
        const minX=Math.min(bb.x,piecesBox.x), minY=Math.min(bb.y,piecesBox.y);
        const maxX=Math.max(bb.x+bb.width,piecesBox.x+piecesBox.width);
        const maxY=Math.max(bb.y+bb.height,piecesBox.y+piecesBox.height);
        bb={x:minX,y:minY,width:maxX-minX,height:maxY-minY};
      }
    }
    const pad = compact ? 18 : 32;
    const contentW = bb.width  + pad * 2;
    const contentH = bb.height + pad * 2;

    if(compact){
      // Une seule figure est cadrée sur téléphone afin de rendre les pièces
      // suffisamment grandes et directement manipulables.
      const s = Math.min(W / contentW, 1.35);
      const sceneH = Math.max(H, contentH * s);
      stage.style.height = `${sceneH}px`;
      stage.style.minHeight = `${sceneH}px`;
      stageWrap.style.overflowY = sceneH > H + 1 ? "auto" : "hidden";
      state.worldTransform.s  = s;
      state.worldTransform.tx = (W - contentW * s) / 2 - bb.x * s + pad * s;
      state.worldTransform.ty = pad * s - bb.y * s + 12;
    } else {
      stage.style.height = "";
      stage.style.minHeight = "";
      stageWrap.style.overflowY = "hidden";
      const s = Math.min(W / contentW, H / contentH, 1.35);
      state.worldTransform.s  = s;
      state.worldTransform.tx = (W - contentW * s) / 2 - bb.x * s + pad * s;
      state.worldTransform.ty = (H - contentH * s) / 2 - bb.y * s + pad * s - 8;
    }

    applyWorldTransform();
  }

  const PUZZLES = {
    perigal: {
      name: "Périgal",
      generate: (Ax, Ay, b, ratio) => {
        const a = b * ratio;
        const A={x:Ax, y:Ay}, B={x:Ax+b, y:Ay}, C={x:Ax, y:Ay+a};
        const TL={x:A.x, y:A.y-b}, TR={x:B.x, y:B.y-b}, L={x:A.x, y:A.y-(b-a)}, T={x:A.x+(b-a), y:A.y-b};
        const P = lineIntersection(L, TR, B, T);
        return [
          { key:"y",  fill:COLORS.yellow, points:[ TL, T, P, L ] },
          { key:"b",  fill:COLORS.blue,   points:[ T, TR, P ] },
          { key:"g",  fill:COLORS.gray,   points:[ B, TR, P ] },
          { key:"m",  fill:COLORS.magenta,points:[ A, B, P, L ] },
          { key:"sq", fill:COLORS.green,  points:[ {x:A.x-a, y:A.y}, {x:A.x, y:A.y}, {x:C.x, y:C.y}, {x:C.x-a, y:C.y} ] },
        ];
      }

    bhaskara: {
      name: "Bhaskara",
      generate: (Ax, Ay, b, ratio) => {
        const a = b * ratio;
        const mkTri = (ox, oy, w, h) => [ {x:ox, y:oy}, {x:ox+w, y:oy}, {x:ox, y:oy+h} ];
        // Dans la construction de Bhaskara, le carré intérieur a pour côté |b-a|.
        // Pour le triangle utilisé ici (a=b/2), ce côté vaut a ; l'écrire ainsi
        // garde toutefois le générateur cohérent si le rapport évolue plus tard.
        const d = Math.abs(b-a);
        const sq = { key:"sq", fill:COLORS.softGray, points:[ {x:Ax-d, y:Ay}, {x:Ax, y:Ay}, {x:Ax, y:Ay+d}, {x:Ax-d, y:Ay+d} ]};
        const TopL = {x:Ax, y:Ay-b};
        return [
          { key:"t1", fill:COLORS.yellow, points: mkTri(TopL.x,     TopL.y,   a,  b) },
          { key:"t2", fill:COLORS.blue,   points: mkTri(TopL.x+a,   TopL.y+b, -a, -b) },
          { key:"t3", fill:COLORS.red,    points: mkTri(TopL.x+a,   TopL.y,   a,  b) },
          { key:"t4", fill:COLORS.green,  points: mkTri(TopL.x+2*a, TopL.y+b, -a, -b) },

    lapeyronnie: {

    leitzmann: {
      name: "Liu Hui — 8 triangles",
      generate: (Ax, Ay, b, ratio) => {
        const a = b * ratio;
        const t = b / (a + b); // position du point sur la diagonale (construction Liu Hui)

        // Carré b² (sur AB, au-dessus)
        const A  = {x:Ax,   y:Ay};
        const B  = {x:Ax+b, y:Ay};
        const TL = {x:Ax,   y:Ay-b};
        const TR = {x:Ax+b, y:Ay-b};

        const Xb = { x: A.x + t*b, y: A.y - t*b }; // sur la diagonale A→TR
        const bTop    = { key:"bTop",    fill:COLORS.blue,      points:[ TL, TR, Xb ] };
        const bLeft   = { key:"bLeft",   fill:COLORS.lightblue, points:[ TL, A,  Xb ] };
        const bBottom = { key:"bBottom", fill:COLORS.teal,      points:[ A,  B,  Xb ] };
        const bRight  = { key:"bRight",  fill:COLORS.darkblue,  points:[ B,  TR, Xb ] };

        // Carré a² (sur AC, à gauche)
        const Aw = {x:Ax-a, y:Ay};
        const C  = {x:Ax,   y:Ay+a};
        const Cw = {x:Ax-a, y:Ay+a};

        const Xa = { x: Cw.x + t*a, y: Cw.y - t*a }; // sur la diagonale Cw→A
        const aTop    = { key:"aTop",    fill:COLORS.red,    points:[ Aw, A,  Xa ] };
        const aLeft   = { key:"aLeft",   fill:COLORS.orange, points:[ Aw, Cw, Xa ] };
        const aBottom = { key:"aBottom", fill:COLORS.yellow, points:[ Cw, C,  Xa ] };
        const aRight  = { key:"aRight",  fill:COLORS.green,  points:[ C,  A,  Xa ] };

        // Astuce : éviter 2 pièces identiques en "noir" (on n'en met pas)
        return [ bTop, bLeft, bBottom, bRight, aTop, aLeft, aBottom, aRight ];
      }
    }
,
    quatreIdentiques: {
      name: "Découpage croisé",
      generate: (Ax, Ay, b, ratio) => {
        const a = b * ratio;
        const c = Math.hypot(a, b);

        // Direction parallèle à l'hypoténuse BC (sens quelconque)
        const u = { x: b / c, y: -a / c };
        const v = { x: a / c, y:  b / c }; // perpendiculaire

        function lineSquareIntersections(cx, cy, dx, dy, xmin, xmax, ymin, ymax){
          const pts = [];
          const eps = 1e-9;

          // x = xmin / xmax
          if(Math.abs(dx) > eps){
            let t = (xmin - cx)/dx;
            let y = cy + t*dy;
            if(y >= ymin-eps && y <= ymax+eps) pts.push({x:xmin, y, edge:"left"});
            t = (xmax - cx)/dx;
            y = cy + t*dy;
            if(y >= ymin-eps && y <= ymax+eps) pts.push({x:xmax, y, edge:"right"});
          }
          // y = ymin / ymax
          if(Math.abs(dy) > eps){
            let t = (ymin - cy)/dy;
            let x = cx + t*dx;
            if(x >= xmin-eps && x <= xmax+eps) pts.push({x, y:ymin, edge:"top"});
            t = (ymax - cy)/dy;
            x = cx + t*dx;
            if(x >= xmin-eps && x <= xmax+eps) pts.push({x, y:ymax, edge:"bottom"});
          }

          // dédoublonnage (cas où la droite passe pile par un coin)
          const uniq = [];
          for(const p of pts){
            if(!uniq.some(q => Math.hypot(p.x-q.x, p.y-q.y) < 1e-6)) uniq.push(p);
          }
          return uniq;
        }

        function pickEdgePoint(points, edge, corner){
          const candidates = points.filter(p=>p.edge===edge);
          if(!candidates.length) return null;
          let best=candidates[0], bestD=Infinity;
          for(const p of candidates){
            const d=Math.hypot(p.x-corner.x, p.y-corner.y);
            if(d<bestD){bestD=d; best=p;}
          }
          return {x:best.x, y:best.y};
        }

        function cutSquare4(xmin, xmax, ymin, ymax, center, u, v){
          const cx=center.x, cy=center.y;
          const all = [
            ...lineSquareIntersections(cx,cy,u.x,u.y,xmin,xmax,ymin,ymax),
            ...lineSquareIntersections(cx,cy,v.x,v.y,xmin,xmax,ymin,ymax)
          ];

          const TL={x:xmin,y:ymin}, TR={x:xmax,y:ymin}, BR={x:xmax,y:ymax}, BL={x:xmin,y:ymax};
          const C0={x:cx,y:cy};

          const top_TL    = pickEdgePoint(all,"top",TL);
          const left_TL   = pickEdgePoint(all,"left",TL);

          const right_TR  = pickEdgePoint(all,"right",TR);
          const top_TR    = pickEdgePoint(all,"top",TR);

          const bottom_BR = pickEdgePoint(all,"bottom",BR);
          const right_BR  = pickEdgePoint(all,"right",BR);

          const left_BL   = pickEdgePoint(all,"left",BL);
          const bottom_BL = pickEdgePoint(all,"bottom",BL);

          // ultra-sûr : si une intersection manque (cas extrême), on abandonne proprement
          if(!top_TL || !left_TL || !right_TR || !top_TR || !bottom_BR || !right_BR || !left_BL || !bottom_BL){
            return [];
          }

          return [
            { key:"q1", fill:COLORS.red,    points:[ TL, top_TL, C0, left_TL ] },
            { key:"q2", fill:COLORS.yellow, points:[ TR, right_TR, C0, top_TR ] },
            { key:"q3", fill:COLORS.blue,   points:[ BR, bottom_BR, C0, right_BR ] },
            { key:"q4", fill:COLORS.green,  points:[ BL, left_BL, C0, bottom_BL ] }
          ];
        }

        // Carrés : b² (au-dessus de A) et a² (à gauche de A)
        const aSquarePts = [
          {x:Ax-a, y:Ay}, {x:Ax, y:Ay}, {x:Ax, y:Ay+a}, {x:Ax-a, y:Ay+a}
        ];
        const bSquarePts = [
          {x:Ax, y:Ay-b}, {x:Ax+b, y:Ay-b}, {x:Ax+b, y:Ay}, {x:Ax, y:Ay}
        ];

        // Règle : le petit carré reste entier, le grand est découpé en quatre
        // quadrilatères par deux droites perpendiculaires.
        const keepA = a <= b;

        if(keepA){
          // a² entier, découpe b²
          const xmin=Ax, xmax=Ax+b, ymin=Ay-b, ymax=Ay;
          const center={x:(xmin+xmax)/2, y:(ymin+ymax)/2};
          const four = cutSquare4(xmin,xmax,ymin,ymax,center,u,v);
          const small = { key:"aSq", fill:COLORS.purple, points:aSquarePts };
          return [...four, small];
        } else {
          // b² entier, découpe a²
          const xmin=Ax-a, xmax=Ax, ymin=Ay, ymax=Ay+a;
          const center={x:(xmin+xmax)/2, y:(ymin+ymax)/2};
          const four = cutSquare4(xmin,xmax,ymin,ymax,center,u,v);
          const small = { key:"bSq", fill:COLORS.purple, points:bSquarePts };
          return [...four, small];
        }
      }
    }
  };

  // ---------- Construction du moulin + snap ----------
  function buildMoulin(moulinId, Ax, Ay, b, ratio){
    const a=b*ratio;
    const c=Math.hypot(b, a);
    const A={x:Ax, y:Ay};
    const B={x:Ax+b, y:Ay};
    const C={x:Ax, y:Ay+a};

    // carré sur l'hypoténuse (incliné) : à partir de BC
    const w={x:a, y:b};
    const Bw={x:B.x+w.x, y:B.y+w.y};
    const Cw={x:C.x+w.x, y:C.y+w.y};

    const mold = {
      id:moulinId,
      a, b, c,
      corners:[B, C, Cw, Bw],
      uvec:{x:(B.x-C.x)/c, y:(B.y-C.y)/c},
      vvec:{x:(Cw.x-C.x)/c, y:(Cw.y-C.y)/c},
      bbox:bboxOfPoints([B,C,Cw,Bw])
    };

    // Points d'aimantation dans le carré incliné.
    // On ajoute les repères liés à a ET à b : certains puzzles (notamment Bhaskara)
    // ont besoin de sommets situés à une distance b du bord, pas seulement a.
    const snapValues = Array.from(new Set([0, a, b, c, c / 2]))
      .filter(v => v >= -1e-9 && v <= c + 1e-9)
      .sort((x, y) => x - y);

    const snapsUV = [];
    for (const u of snapValues) {
      for (const v of snapValues) {
        snapsUV.push({ u, v });
      }
    }

    const snapPoints = snapsUV.map(s => ({
      x:C.x + s.u*mold.uvec.x + s.v*mold.vvec.x,
      y:C.y + s.u*mold.uvec.y + s.v*mold.vvec.y,
      moulinId
    }));

    const piecesDef = PUZZLES[state.puzzle].generate(Ax, Ay, b, ratio);
    return {moulinId, A,B,C, Bw,Cw, pieces: piecesDef, mold, snapPoints};
  }

  function buildScene(){
    clearCelebration(true);
    while(world.firstChild) world.removeChild(world.firstChild);
    state.pieces.clear();
    state.solutionPoses.clear();
    state.snapPoints=[];
    state.molds=[];

    const b=BASE.b;
    const r=PUZZLES[state.puzzle]?.ratio ?? BASE.ratio;
    const a=b*r;
    const compact = isCompactViewport();
    stage.classList.toggle("compactLayout", compact);
    const leftX = BASE.margin+a;
    const topY = BASE.margin+b;
    const left = buildMoulin(
      "L",
      leftX,
      topY,
      b,
      r
    );
    const right = buildMoulin(
      "R",
      leftX+(b+2*a)+BASE.gap,
      topY,
      b,
      r
    );
    state.layoutCompact = compact;

    state.moulins = {L:left, R:right};
    const interactiveTarget = left;
    state.molds.push(interactiveTarget.mold);
    state.snapPoints.push(...interactiveTarget.snapPoints);

    const gB=svgEl("g", {id:"boards"});
    const gP=svgEl("g", {id:"pieces"});
    const gL=svgEl("g", {id:"labels"});
    world.append(gB, gP, gL);

    // Le plateau manipulable ne montre qu'un moulin. La seconde copie reste
    // disponible dans state.moulins.R exclusivement pour l'impression.
    [left].forEach(m => {
      const {A,B,C,Bw,Cw} = m;

      const gBM = svgEl("g", {id:"boards"+m.moulinId});
      gB.appendChild(gBM);

      // Carrés des deux côtés de l'angle droit
      gBM.append(
        svgEl("rect",{x:A.x,y:A.y-b,width:b,height:b,class:"boardLine"}),
        svgEl("rect",{x:A.x-a,y:A.y,width:a,height:a,class:"boardLine"})
      );

      // Triangle ABC
      gBM.append(
        svgEl("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:"thinLine"}),
        svgEl("line",{x1:A.x,y1:A.y,x2:C.x,y2:C.y,class:"thinLine"}),
        svgEl("line",{x1:B.x,y1:B.y,x2:C.x,y2:C.y,class:"thinLine"})
      );

      // Carré sur l'hypoténuse
      gBM.appendChild(svgEl("polygon", {
        points:`${B.x},${B.y} ${C.x},${C.y} ${Cw.x},${Cw.y} ${Bw.x},${Bw.y}`,
        class:"boardLine"
      }));

      // Angle droit (repère)
      const ra=24;
      gBM.appendChild(svgEl("polyline", {
        points:`${A.x},${A.y} ${A.x+ra},${A.y} ${A.x+ra},${A.y+ra} ${A.x},${A.y+ra}`,
        class:"rightAngle"
      }));

      // Lettres
      [{x:A.x-28,y:A.y-14,t:"A"},{x:B.x+10,y:B.y+6,t:"B"},{x:C.x-14,y:C.y+26,t:"C"}].forEach(l=>{
        const t=svgEl("text",{x:l.x,y:l.y,class:"label","data-side":m.moulinId});
        t.textContent=l.t;
        gL.appendChild(t);
      });


      if(m.moulinId === "L"){

      // Pièces
      m.pieces.forEach(pdef => {
        const id=`${m.moulinId}-${pdef.key}`;
        const ctr=polygonCentroid(pdef.points);
        const lPts=pdef.points.map(q=>({x:q.x-ctr.x,y:q.y-ctr.y}));

        const g=svgEl("g",{"data-id":id});
        const poly=svgEl("polygon",{
          class:"piecePoly",
          fill:pdef.fill,
          points:lPts.map(q=>`${q.x},${q.y}`).join(" ")
        });

        const gh=svgEl("g",{class:"handle","data-id":id,style:"display:none;"});
        const handleHit=svgEl("circle",{cx:0,cy:-64,r:34,class:"handleHit"});
        const handleLine=svgEl("line",{x1:0,y1:0,x2:0,y2:-64,class:"handleLine"});
        const handleDot=svgEl("circle",{cx:0,cy:-64,r:18,class:"handleDot"});
        gh.append(handleHit,handleLine,handleDot);
        const it=svgEl("text",{x:0,y:-64,"text-anchor":"middle","dominant-baseline":"central",style:"font-size:22px;font-weight:900;"});
        it.textContent="↻";
        gh.appendChild(it);

        g.append(poly, gh);
        gP.appendChild(g);

        const p={
          id,
          pos:{...ctr},
          rot:0,
          flipX:false,
          hasMoved:false,
          placed:false,
          home:{...ctr},
          el:g,
          polyEl:poly,
          handleEl:gh,
          handleHitEl:handleHit,
          handleLineEl:handleLine,
          handleDotEl:handleDot,
          handleTextEl:it,
          verticesLocal:lPts
        };

        state.pieces.set(id,p);
        applyPieceTransform(p);

        poly.addEventListener("pointerdown", onPiecePointerDown);
        gh.addEventListener("pointerdown", onHandlePointerDown);

      });
      }
    });

    prepareSolutionPoses();
    fitWorldToViewport();
  }


  // ---------- Aide de rotation spécifique Bhaskara ----------
  // Problème ciblé : pour Bhaskara, il ne suffit pas de coller un coin.
  // Il faut aussi que l'hypoténuse d'un triangle devienne exactement parallèle
  // à un côté du carré incliné c². On ajoute donc des angles d'aimantation
  // basés sur les directions du carré c², et non seulement 0°/90°/180°/270°.
  function edgeAnglesLocal(piece){
    const sx = piece.flipX ? -1 : 1;
    const pts = piece.verticesLocal.map(v => ({x: sx * v.x, y: v.y}));
    const angles = [];
    for(let i=0; i<pts.length; i++){
      const p = pts[i];
      const q = pts[(i+1) % pts.length];
      const dx = q.x - p.x;
      const dy = q.y - p.y;
      if(Math.hypot(dx, dy) > 1e-9){
        angles.push(deg(Math.atan2(dy, dx)));
      }
    }
    return angles;
  }

  function bhaskaraTargetAngles(){
    const targetMoulin = activePuzzleMoulin();
    if(!targetMoulin) return [];
    const u = targetMoulin.mold.uvec;
    const v = targetMoulin.mold.vvec;

    const au = deg(Math.atan2(u.y, u.x));
    const av = deg(Math.atan2(v.y, v.x));

    // On ajoute aussi les directions opposées : une arête peut être parcourue
    // dans un sens ou dans l'autre.
    return [au, au + 180, av, av + 180];
  }

  function isNearTargetMoulin(piece, extra = 170){
    const targetMoulin = activePuzzleMoulin();
    if(!targetMoulin) return false;
    const bb = targetMoulin.mold.bbox;
    return (
      piece.pos.x >= bb.minX - extra &&
      piece.pos.x <= bb.maxX + extra &&
      piece.pos.y >= bb.minY - extra &&
      piece.pos.y <= bb.maxY + extra
    );
  }

  function applyBhaskaraAngleSnap(piece, thresholdDeg = 14){
    if(!isBhaskaraPuzzle() || !piece) return false;

    // On n'applique cette aide que près du moulin cible, pour éviter
    // de perturber les pièces encore posées sur le moulin de gauche.
    if(!isNearTargetMoulin(piece)) return false;

    const localEdges = edgeAnglesLocal(piece);
    const targetAngles = bhaskaraTargetAngles();
    if(!localEdges.length || !targetAngles.length) return false;

    let bestRot = null;
    let bestD = Infinity;

    for(const localA of localEdges){
      for(const targetA of targetAngles){
        const candidateRot = normAngleDeg(targetA - localA);
        const d = Math.abs(normAngleDeg(piece.rot - candidateRot));
        if(d < bestD){
          bestD = d;
          bestRot = candidateRot;
        }
      }
    }

    if(bestRot !== null && bestD < thresholdDeg){
      piece.rot = bestRot;
      applyPieceTransform(piece);
      return true;
    }

    return false;
  }

  function longestLocalEdge(piece){
    const sx = piece.flipX ? -1 : 1;
    const pts = piece.verticesLocal.map(v => ({x: sx * v.x, y: v.y}));
    let best = null;

    for(let i=0; i<pts.length; i++){
      const j = (i + 1) % pts.length;
      const p = pts[i], q = pts[j];
      const len = Math.hypot(q.x - p.x, q.y - p.y);
      if(!best || len > best.len){
        best = {i, j, p, q, len};
      }
    }

    return best;
  }

  function rotatePointLocal(p, rotDeg){
    const t = rad(rotDeg), c = Math.cos(t), s = Math.sin(t);
    return {
      x: p.x * c - p.y * s,
      y: p.x * s + p.y * c
    };
  }

  function bhaskaraTargetEdges(){
    const targetMoulin = activePuzzleMoulin();
    if(!targetMoulin) return [];

    // Carré de l'hypoténuse : ordre des sommets [B, C, Cw, Bw]
    const {B,C,Cw,Bw} = targetMoulin;
    return [
      {a:B,  b:C},
      {a:C,  b:Cw},
      {a:Cw, b:Bw},
      {a:Bw, b:B}
    ];
  }

  function pointInConvexPolygon(pt, poly, tol = 6){
    // Accepte les points à l'intérieur ou très proches du bord.
    // Fonction robuste pour polygone convexe, quel que soit le sens des sommets.
    if(!poly || poly.length < 3) return false;

    let sign = 0;
    for(let i=0; i<poly.length; i++){
      const a = poly[i];
      const b = poly[(i+1) % poly.length];
      const cross = (b.x - a.x) * (pt.y - a.y) - (b.y - a.y) * (pt.x - a.x);

      if(Math.abs(cross) <= tol) continue;
      const s = Math.sign(cross);
      if(sign === 0) sign = s;
      else if(s !== sign) return false;
    }
    return true;
  }

  function transformedVerticesForEdgeSnap(piece, pos, rotDeg){
    const t = rad(rotDeg), c = Math.cos(t), s = Math.sin(t);
    const sx = piece.flipX ? -1 : 1;

    return piece.verticesLocal.map(v => {
      const x0 = sx * v.x;
      const y0 = v.y;
      return {
        x: pos.x + (x0*c - y0*s),
        y: pos.y + (x0*s + y0*c)
      };
    });
  }

  function tryBhaskaraEdgeSnap(piece){
    if(!isBhaskaraPuzzle() || !piece) return false;
    if(piece.id.endsWith("-sq")) return false;
    if(!isNearTargetMoulin(piece, 260)) return false;

    // V13 : on ne colle plus l'hypoténuse sur "n'importe quel côté possible".
    // On utilise les poses exactes déjà calculées pour le puzzle Bhaskara.
    // Puis on capture la pièce si SON hypoténuse actuelle est proche de
    // l'hypoténuse de l'une de ces poses exactes.
    const exactPose = state.solutionPoses.get(piece.id);
    const candidates = exactPose ? [exactPose] : [];
    if(!candidates.length) return false;

    const hyp = longestLocalEdge(piece);
    if(!hyp) return false;

    const current = pieceWorldVertices(piece);
    const curA = current[hyp.i];
    const curB = current[hyp.j];

    let best = null;

    for(const cand of candidates){
      // Aucun retournement automatique.
      if(cand.flipX !== piece.flipX) continue;

      const targetA = cand.expectedVertices[hyp.i];
      const targetB = cand.expectedVertices[hyp.j];
      if(!targetA || !targetB) continue;

      const dA = Math.hypot(curA.x - targetA.x, curA.y - targetA.y);
      const dB = Math.hypot(curB.x - targetB.x, curB.y - targetB.y);
      const avgEndD = (dA + dB) / 2;
      const maxEndD = Math.max(dA, dB);

      const centerD = Math.hypot(piece.pos.x - cand.pos.x, piece.pos.y - cand.pos.y);
      const rotD = Math.abs(normAngleDeg(piece.rot - cand.rot));

      // Score : priorité aux deux bouts de l'hypoténuse, puis centre/rotation.
      const score = avgEndD * 1.35 + maxEndD * 0.55 + centerD * 0.18 + rotD * 1.2;

      if(!best || score < best.score){
        best = {cand, avgEndD, maxEndD, centerD, rotD, score};
      }
    }

    if(!best) return false;

    // Capture pratique : si l'élève met l'hypoténuse à peu près au bon endroit,
    // on pose le triangle exactement sur LA pose de pavage correspondante.
    const shouldSnap =
      best.maxEndD < 125 ||
      (best.avgEndD < 92 && best.centerD < 250) ||
      (best.centerD < 165 && best.rotD < 28);

    if(shouldSnap){
      piece.pos = {...best.cand.pos};
      piece.rot = best.cand.rot;
      piece.flipX = best.cand.flipX; // identique à l'état actuel
      applyPieceTransform(piece);
      return true;
    }

    return false;
  }

  function tryBhaskaraSquareSnap(piece){
    if(!isBhaskaraPuzzle() || !piece) return false;
    if(!piece.id.endsWith("-sq")) return false;
    if(!isNearTargetMoulin(piece, 240)) return false;

    const exactPose = state.solutionPoses.get(piece.id);
    const candidates = exactPose ? [exactPose] : [];
    if(!candidates.length) return false;

    let best = null;

    for(const cand of candidates){
      // Aucun retournement automatique, même pour le carré.
      if(cand.flipX !== piece.flipX) continue;

      const centerD = Math.hypot(piece.pos.x - cand.pos.x, piece.pos.y - cand.pos.y);
      const angleD = Math.abs(normAngleDeg(piece.rot - cand.rot));

      // Le carré peut être visuellement équivalent avec plusieurs rotations,
      // mais ici on garde la pose calculée par le puzzle pour que ses arêtes
      // coïncident exactement avec celles des triangles.
      const score = centerD + angleD * 1.8;

      if(!best || score < best.score){
        best = {cand, centerD, angleD, score};
      }
    }

    if(!best) return false;

    // Capture assez généreuse : l'élève amène le carré au centre,
    // puis le programme le pose exactement pour supprimer les micro-décalages.
    if(best.centerD < 180 || (best.centerD < 230 && best.angleD < 28)){
      piece.pos = {...best.cand.pos};
      piece.rot = best.cand.rot;
      piece.flipX = best.cand.flipX;
      applyPieceTransform(piece);
      return true;
    }

    return false;
  }

  function segmentsFromVertices(vertices){
    const out = [];
    for(let i=0; i<vertices.length; i++){
      out.push({a:vertices[i], b:vertices[(i+1)%vertices.length]});
    }
    return out;
  }

  function legacySnappedRotation(piece,proposedRot,threshold=SNAP.rot){
    const candidates=[0,90,180,270];
    if(isBhaskaraPuzzle() && piece && isNearTargetMoulin(piece,260)){
      for(const localA of edgeAnglesLocal(piece)){
        for(const targetA of bhaskaraTargetAngles()) candidates.push(normAngleDeg(targetA-localA));
      }
    }
    let best=proposedRot, bestD=Infinity;
    for(const candidate of candidates){
      const d=Math.abs(normAngleDeg(proposedRot-candidate));
      if(d<bestD){bestD=d;best=candidate;}
    }
    return bestD<threshold ? best : proposedRot;
  }

  // Aimantation locale : un sommet peut rejoindre n'importe quel point d'un
  // bord du carré c², et deux bords presque parallèles peuvent se coller. Les
  // pièces restées dans leur position de départ ne servent pas de cibles.
  function tryLegacyEdgeSnap(piece){
    if(!piece || !isNearTargetMoulin(piece,260)) return false;
    const targetMoulin=activePuzzleMoulin();
    if(!targetMoulin) return false;

    const targetSegments=segmentsFromVertices(targetMoulin.mold.corners);
    for(const [id,other] of state.pieces.entries()){
      if(id===piece.id || !isNearTargetMoulin(other,260)) continue;
      targetSegments.push(...segmentsFromVertices(pieceWorldVertices(other)));
    }

    const pieceSegments=segmentsFromVertices(pieceWorldVertices(piece));
    let best=null;
    for(const ps of pieceSegments){
      const pAngle=deg(Math.atan2(ps.b.y-ps.a.y,ps.b.x-ps.a.x));
      const pLen=Math.hypot(ps.b.x-ps.a.x,ps.b.y-ps.a.y);
      for(const ts of targetSegments){
        const tLen=Math.hypot(ts.b.x-ts.a.x,ts.b.y-ts.a.y);
        if(Math.abs(pLen-tLen)>SNAP.posStrong*1.8) continue;
        for(const [ta,tb] of [[ts.a,ts.b],[ts.b,ts.a]]){
          const targetAngle=deg(Math.atan2(tb.y-ta.y,tb.x-ta.x));
          const angleD=Math.abs(normAngleDeg(pAngle-targetAngle));
          if(angleD>12) continue;
          const delta={x:ta.x-ps.a.x,y:ta.y-ps.a.y};
          const movedB={x:ps.b.x+delta.x,y:ps.b.y+delta.y};
          const endD=Math.hypot(movedB.x-tb.x,movedB.y-tb.y);
          if(endD>42) continue;
          const score=endD+Math.abs(pLen-tLen)*0.6+angleD*1.4;
          if(!best || score<best.score) best={delta,score};
        }
      }
    }
    if(!best) return false;
    piece.pos.x+=best.delta.x;
    piece.pos.y+=best.delta.y;
    applyPieceTransform(piece);
    return true;
  }

  // Snap de finition commun à tous les puzzles. Il ne retourne jamais une
  // pièce automatiquement : l'élève garde la décision de Retourner. Dès que
  // la bonne face est orientée et déposée près de sa pose exacte, les petits
  // écarts tactiles sont supprimés pour fermer proprement le pavage.
  function tryExactSolutionSnap(piece){
    const nearDistance=isCompactViewport() ? touchFriendlyDistance(180,100) : 260;
    if(!piece || !isNearTargetMoulin(piece,nearDistance)) return false;
    const pose=state.solutionPoses.get(piece.id);
    if(!pose || pose.flipX !== piece.flipX || !pose.expectedVertices) return false;

    const current=pieceWorldVertices(piece);
    if(current.length !== pose.expectedVertices.length) return false;
    let total=0, maxD=0;
    for(let i=0;i<current.length;i++){
      const d=Math.hypot(current[i].x-pose.expectedVertices[i].x,current[i].y-pose.expectedVertices[i].y);
      total+=d;
      maxD=Math.max(maxD,d);
    }
    const avgD=total/current.length;
    const centerD=Math.hypot(piece.pos.x-pose.pos.x,piece.pos.y-pose.pos.y);
    const rotD=Math.abs(normAngleDeg(piece.rot-pose.rot));
    const compact=isCompactViewport();
    const vertexDistance=compact ? touchFriendlyDistance(30,18) : 92;
    const averageDistance=compact ? touchFriendlyDistance(24,14) : 74;
    const centerDistance=compact ? touchFriendlyDistance(42,24) : 145;
    const closeEnough=compact
      ? maxD<vertexDistance || (avgD<averageDistance && centerD<centerDistance && rotD<8)
      : maxD<vertexDistance || (avgD<averageDistance && centerD<centerDistance) || (centerD<96 && rotD<24);
    if(!closeEnough) return false;

    piece.pos={...pose.pos};
    piece.rot=pose.rot;
    piece.flipX=pose.flipX;
    applyPieceTransform(piece);
    return true;
  }


  // ---------- Interactions ----------
  function addGesturePointer(evt){
    const drag=state.dragging;
    if(!drag || (drag.type!=="move" && drag.type!=="transform") || drag.pointers.size>=2) return false;
    const point=clientToWorld(evt);
    const captureEl=evt.currentTarget || stage;
    drag.pointers.set(evt.pointerId,{point,captureEl});
    try{ captureEl.setPointerCapture(evt.pointerId); }catch(_err){}

    if(drag.pointers.size===2){
      const entries=[...drag.pointers.entries()];
      const a=entries[0][1].point, b=entries[1][1].point;
      const piece=state.pieces.get(drag.pieceId);
      drag.type="transform";
      drag.startMidpoint={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      drag.startGestureAngle=Math.atan2(b.y-a.y,b.x-a.x);
      drag.startPos={...piece.pos};
      drag.startRot=piece.rot;
    }
    return true;
  }

  function onPiecePointerDown(evt){
    evt.preventDefault();
    evt.stopPropagation();
    const id=evt.currentTarget.closest("g").getAttribute("data-id");

    if(state.dragging){
      if(state.dragging.pieceId===id) addGesturePointer(evt);
      return;
    }

    setSelected(id);
    const p0 = clientToWorld(evt);
    state.dragging={
      type:"move",
      pieceId:id,
      startPointer:p0,
      startPos:{...state.pieces.get(id).pos},
      pointers:new Map()
    };
    stage.classList.add("isDragging");
    addGesturePointer(evt);
  }

  function onHandlePointerDown(evt){
    evt.preventDefault();
    evt.stopPropagation();
    if(state.dragging) return;
    const id=evt.currentTarget.getAttribute("data-id");
    const p0=clientToWorld(evt);
    const piece=state.pieces.get(id);
    setSelected(id);
    state.dragging={
      type:"rotate",
      pieceId:id,
      startPointer:p0,
      startAngleRad:Math.atan2(p0.y-piece.pos.y,p0.x-piece.pos.x),
      startRot:piece.rot,
      pointerId:evt.pointerId,
      captureEl:evt.currentTarget
    };
    stage.classList.add("isDragging");
    try{ evt.currentTarget.setPointerCapture(evt.pointerId); }catch(_err){}
  }

  stage.addEventListener("pointermove", evt => {
    if(!state.dragging) return;
    evt.preventDefault();
    const drag=state.dragging;
    const piece=state.pieces.get(drag.pieceId);
    const p=clientToWorld(evt);
    state.lastPointerWorld = p;

    if(drag.type==="move" || drag.type==="transform"){
      const pointer=drag.pointers.get(evt.pointerId);
      if(!pointer) return;
      pointer.point=p;
    }

    if(drag.type==="move"){
      piece.pos.x=drag.startPos.x+(p.x-drag.startPointer.x);
      piece.pos.y=drag.startPos.y+(p.y-drag.startPointer.y);
      piece.hasMoved=true;
    } else if(drag.type==="transform"){
      const pointers=[...drag.pointers.values()];
      if(pointers.length<2) return;
      const a=pointers[0].point, b=pointers[1].point;
      const midpoint={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      const angle=Math.atan2(b.y-a.y,b.x-a.x);
      piece.pos.x=drag.startPos.x+(midpoint.x-drag.startMidpoint.x);
      piece.pos.y=drag.startPos.y+(midpoint.y-drag.startMidpoint.y);
      const proposed=drag.startRot+deg(angle-drag.startGestureAngle);
      piece.rot=!isCompactViewport() && state.angleSnapEnabled
        ? legacySnappedRotation(piece,proposed,SNAP.rot)
        : proposed;
      piece.hasMoved=true;
    } else if(drag.type==="rotate"){
      if(evt.pointerId!==drag.pointerId) return;
      const a=Math.atan2(p.y-piece.pos.y,p.x-piece.pos.x);
      const proposed=drag.startRot+deg(a-drag.startAngleRad);
      const threshold=isBhaskaraPuzzle() && isNearTargetMoulin(piece,260) ? 12 : SNAP.rot;
      piece.rot=!isCompactViewport() && state.angleSnapEnabled && !evt.shiftKey
        ? legacySnappedRotation(piece,proposed,threshold)
        : proposed;
      piece.hasMoved=true;
    }
    applyPieceTransform(piece);
  });

  function tryLegacyPointSnap(piece){
    if(!piece) return false;
    const targets=[...state.snapPoints];
    for(const other of state.pieces.values()){
      if(other.id===piece.id) continue;
      for(const vertex of pieceWorldVertices(other)) targets.push(vertex);
    }

    let bestDelta=null, minD=Infinity;
    const threshold=touchFriendlyDistance(SNAP.posStrong,30);
    for(const vertex of pieceWorldVertices(piece)){
      for(const target of targets){
        const d=Math.hypot(vertex.x-target.x,vertex.y-target.y);
        if(d<minD && d<threshold){
          minD=d;
          bestDelta={x:target.x-vertex.x,y:target.y-vertex.y};
        }
      }
    }
    if(!bestDelta) return false;
    piece.pos.x+=bestDelta.x;
    piece.pos.y+=bestDelta.y;
    applyPieceTransform(piece);
    return true;
  }

  function snapMobilePiece(piece){
    const targetMoulin=activePuzzleMoulin();
    if(!piece || !targetMoulin) return false;
    const ctm=world.getScreenCTM();
    const scale=ctm ? Math.hypot(ctm.a,ctm.b)||1 : 1;
    const targetPolygon=targetMoulin.mold.corners;
    const placedPolygons=[];

    for(const other of state.pieces.values()){
      if(other.id===piece.id) continue;
      if(other.placed) placedPolygons.push({id:other.id,vertices:pieceWorldVertices(other)});
    }

    const result=SnapEngine.findBestSnap({
      piece,
      targetPolygon,
      placedPolygons,
      exactPose:state.solutionPoses.get(piece.id)||null,
      scale,
      thresholds:{
        maxTranslationPx:48,
        maxRotationDeg:20,
        exactTranslationPx:34,
        exactRotationDeg:14,
        containmentTolerancePx:6,
        contactTolerancePx:1.5,
        minEdgeOverlapPx:10
      }
    });

    if(result){
      piece.pos={...result.pose.pos};
      piece.rot=result.pose.rot;
      piece.flipX=result.pose.flipX;
      piece.lastSnapKind=result.kind;
      applyPieceTransform(piece);
    }
    const finalVertices=pieceWorldVertices(piece);
    const overlapsPlaced=placedPolygons.some(other=>
      SnapEngine.polygonsOverlapInterior(finalVertices,other.vertices,1.5/scale)
    );
    piece.placed=SnapEngine.pieceInsideTarget(piece,targetPolygon,scale,4) && !overlapsPlaced;
    return !!result;
  }

  function snapPieceAfterDrop(piece){
    if(!piece || !piece.hasMoved || !state.snapEnabled) return;

    if(!isCompactViewport()){
      applyBhaskaraAngleSnap(piece,18);
      let snapped=tryExactSolutionSnap(piece);
      if(!snapped && isBhaskaraPuzzle()) snapped=tryBhaskaraEdgeSnap(piece) || tryBhaskaraSquareSnap(piece);
      if(!snapped) snapped=tryLegacyEdgeSnap(piece);
      if(!snapped) tryLegacyPointSnap(piece);
      return;
    }
    snapMobilePiece(piece);
  }

  function finishPointerInteraction(evt){
    if(!state.dragging) return;
    evt.preventDefault();
    const drag=state.dragging;
    const id = drag.pieceId;
    const piece = state.pieces.get(id);

    if(drag.type==="move" || drag.type==="transform"){
      const pointer=drag.pointers.get(evt.pointerId);
      if(!pointer) return;
      try{ if(pointer.captureEl.hasPointerCapture(evt.pointerId)) pointer.captureEl.releasePointerCapture(evt.pointerId); }catch(_err){}
      drag.pointers.delete(evt.pointerId);

      if(drag.pointers.size){
        const [remainingId,remaining]=drag.pointers.entries().next().value;
        drag.type="move";
        drag.startPointer={...remaining.point};
        drag.startPos={...piece.pos};
        drag.primaryPointerId=remainingId;
        return;
      }
    } else if(drag.type==="rotate"){
      if(evt.pointerId!==drag.pointerId) return;
      try{ if(drag.captureEl.hasPointerCapture(evt.pointerId)) drag.captureEl.releasePointerCapture(evt.pointerId); }catch(_err){}
    }

    state.dragging=null;
    stage.classList.remove("isDragging");
    snapPieceAfterDrop(piece);
    queueCompletionCheck();
  }

  stage.addEventListener("pointerup", finishPointerInteraction);
  stage.addEventListener("pointercancel", finishPointerInteraction);

  // Sélection via clic sur le fond
  stage.addEventListener("pointerdown", (evt)=>{
    // Pendant un glissement tactile, le second doigt peut se poser n'importe
    // où sur le plateau : il pilote alors librement la rotation de la pièce.
    if(state.dragging && evt.pointerType==="touch"){
      evt.preventDefault();
      evt.stopPropagation();
      addGesturePointer(evt);
      return;
    }
    // si clic sur le fond du SVG (pas sur une pièce)
    if(evt.target === stage || evt.target === world){
      setSelected(null);
    }
  });

  // ---------- UI ----------
  function setMode(mode){
    state.mode = mode;
    if(mode === "vide"){
      btnModeVide.classList.add("on");
      btnModeEleves.classList.remove("on");
      stage.classList.add("modeVide");

    } else {
      btnModeEleves.classList.add("on");
      btnModeVide.classList.remove("on");
      stage.classList.remove("modeVide");
    }

    // Visibilité explicite du moulin unique en mode « Vide ».
    const gPieces = document.getElementById("pieces");
    if(gPieces)  gPieces.style.display  = (mode === "vide") ? "none" : "";

    // Visibilité robuste (pour le centrage et pour que #labels puisse fonctionner en mode vide)
    fitWorldToViewport();
  }

  btnModeEleves.onclick = () => setMode("eleves");
  btnModeVide.onclick   = () => setMode("vide");

  toggleLetters.onclick = () => {
    state.lettersEnabled = !state.lettersEnabled;
    toggleLetters.classList.toggle("on", state.lettersEnabled);
    stage.classList.toggle("showLetters", state.lettersEnabled);
    if(state.mode === "vide") fitWorldToViewport();

  btnReset.onclick = () => {

    state.pieces.forEach(p=>{

      p.hasMoved=false;
      p.placed=false;

    setSelected(null);

  btnFlip.onclick = () => {
    if(state.mode === "vide") return;

  btnCheckSolution.onclick = () => checkPuzzleSolution({celebrate:true});

  puzzleSelect.onchange = (e) => {
    state.puzzle = e.target.value;

    setMode(state.mode);
  };

  btnFullscreen.onclick = () => {
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  };

  // ---------- Énoncé (impression) ----------

  // ----- SVG : page 1 (deux moulins) -----
  function buildPage1SVG() {
  const L = state.moulins?.L;
  const R = state.moulins?.R;
  if (!L || !R) return `<svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"></svg>`;

  const pts = [];
  for (const m of [L, R]) {
    const { a, b } = m.mold;
    const TL = { x: m.A.x, y: m.A.y - b };
    const TR = { x: m.B.x, y: m.B.y - b };
    pts.push(m.A, m.B, m.C, m.Bw, m.Cw, TL, TR, { x: m.A.x - a, y: m.A.y }, { x: m.A.x - a, y: m.C.y });
    pts.push(...m.mold.corners);
    if (Array.isArray(m.pieces)) {
      for (const pd of m.pieces) pts.push(...pd.points);
    }
  }

  const bb = bboxOfPoints(pts);
  const pad = 28;
  const vb = `${(bb.minX - pad).toFixed(2)} ${(bb.minY - pad).toFixed(2)} ${(bb.w + 2 * pad).toFixed(2)} ${(bb.h + 2 * pad).toFixed(2)}`;

  const tag1x = L.A.x + 14, tag1y = (L.A.y - L.mold.b) + 30;
  const tag2x = R.A.x + 14, tag2y = (R.A.y - R.mold.b) + 30;

  return `
<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-label="Deux moulins de Pythagore">
  <text class="tag" x="${tag1x}" y="${tag1y}">1</text>
  <text class="tag" x="${tag2x}" y="${tag2y}">2</text>
  ${drawMoulinStatic(L, true)}
  ${drawMoulinStatic(R, true)}
</svg>`;
}

  function drawMoulinStatic(m, withPieces = true) {
  const { a, b } = m.mold;

  const TL = { x: m.A.x, y: m.A.y - b };
  const TR = { x: m.B.x, y: m.B.y - b };

  // Petit marqueur d'angle droit (au point A)
  const raSize = 18;
  const ra = [
    `${m.A.x},${m.A.y}`,
    `${m.A.x + raSize},${m.A.y}`,
    `${m.A.x + raSize},${m.A.y + raSize}`,
    `${m.A.x},${m.A.y + raSize}`,
  ].join(" ");

  // Carré de l'hypoténuse (grand carré blanc)
  const bigSqPts = [m.B, m.C, m.Cw, m.Bw].map(p => `${p.x},${p.y}`).join(" ");

  // Carrés colorés (a² et b²) — couleurs lisibles à l'impression
  const fillB = COLORS.lightBlue;
  const fillA = COLORS.lightRed;

  let piecesSvg = "";
  if (withPieces && Array.isArray(m.pieces)) {
    // On dessine les pièces "au repos" (dans les petits carrés), telles que générées par le puzzle
    for (const pd of m.pieces) {
      const pts = pd.points.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" ");
      const fill = pd.fill || "#cccccc";
      piecesSvg += `<polygon class="piece" points="${pts}" fill="${fill}"></polygon>`;
    }
  }

  return `
  <g class="moulinStatic">
    <!-- Carré b² (au-dessus de AB) -->
    <rect x="${m.A.x}" y="${m.A.y - b}" width="${b}" height="${b}" class="sq" fill="${fillB}"></rect>
    <!-- Carré a² (à gauche de AC) -->
    <rect x="${m.A.x - a}" y="${m.A.y}" width="${a}" height="${a}" class="sq" fill="${fillA}"></rect>

    <!-- Triangle + grand carré -->
    <polygon class="bigSq" points="${bigSqPts}"></polygon>
    <line class="edge" x1="${m.A.x}" y1="${m.A.y}" x2="${m.B.x}" y2="${m.B.y}"></line>
    <line class="edge" x1="${m.A.x}" y1="${m.A.y}" x2="${m.C.x}" y2="${m.C.y}"></line>
    <line class="edge" x1="${m.B.x}" y1="${m.B.y}" x2="${m.C.x}" y2="${m.C.y}"></line>

    <polyline class="rightAngle" points="${ra}"></polyline>

    ${piecesSvg}

    <!-- Lettres -->
    <text class="label" x="${m.A.x - 34}" y="${m.A.y - 18}">A</text>
    <text class="label" x="${m.B.x + 12}" y="${m.B.y - 14}">B</text>
    <text class="label" x="${m.C.x - 26}" y="${m.C.y + 40}">C</text>
  </g>`;
}

  // ----- SVG : squelettes vides -----
  function drawMoulinSkeleton(m){
    const a = m.mold.a, b = m.mold.b;
    const B = m.B, C = m.C, Bw = m.Bw, Cw = m.Cw;

    const bigSqPts = [B,C,Cw,Bw].map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" ");

    const ra = Math.max(18, Math.min(34, b*0.08));
    const raPts = [
      {x:m.A.x, y:m.A.y},
      {x:m.A.x+ra, y:m.A.y},
      {x:m.A.x+ra, y:m.A.y+ra},
      {x:m.A.x, y:m.A.y+ra},
    ];

    const labA = {x: m.A.x - 34, y: m.A.y - 12, t:"A"};
    const labB = {x: m.B.x + 10, y: m.B.y + 8, t:"B"};
    const labC = {x: m.C.x - 16, y: m.C.y + 30, t:"C"};

    return `<g>
      <rect class="boardLine" x="${m.A.x}" y="${m.A.y - b}" width="${b}" height="${b}"/>
      <rect class="boardLine" x="${m.A.x - a}" y="${m.A.y}" width="${a}" height="${a}"/>

      <line class="thinLine" x1="${m.A.x}" y1="${m.A.y}" x2="${m.B.x}" y2="${m.B.y}"/>
      <line class="thinLine" x1="${m.A.x}" y1="${m.A.y}" x2="${m.C.x}" y2="${m.C.y}"/>
      <line class="thinLine" x1="${m.B.x}" y1="${m.B.y}" x2="${m.C.x}" y2="${m.C.y}"/>

      <polygon class="boardLine" points="${bigSqPts}"/>

      <polyline class="rightAngle" points="${raPts.map(p=>`${p.x},${p.y}`).join(" ")}"/>

    </g>`;
  }

  function buildEmptyDoubleSVG() {
  const L = state.moulins?.L;
  const R = state.moulins?.R;
  if (!L || !R) return `<svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"></svg>`;

  const pts = [];
  for (const m of [L, R]) {
    const { a, b } = m.mold;
    const TL = { x: m.A.x, y: m.A.y - b };
    const TR = { x: m.B.x, y: m.B.y - b };
    pts.push(m.A, m.B, m.C, m.Bw, m.Cw, TL, TR, { x: m.A.x - a, y: m.A.y }, { x: m.A.x - a, y: m.C.y });
    pts.push(...m.mold.corners);
  }
  const bb = bboxOfPoints(pts);
  const pad = 26;
  const vb = `${(bb.minX - pad).toFixed(2)} ${(bb.minY - pad).toFixed(2)} ${(bb.w + 2 * pad).toFixed(2)} ${(bb.h + 2 * pad).toFixed(2)}`;

  return `
<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-label="Deux moulins vides">
  ${drawMoulinSkeleton(L)}

}

function buildApplicationMoulinSVG(AB_cm = 5, AC_cm = 12) {
  // Grand moulin "vide" pour écrire dedans (application du théorème de Pythagore)
  const ratio = AC_cm / AB_cm;

  // Dimensions "visuelles" (en unités SVG) : on veut un grand carré assez large pour écrire dedans
  const b = 150;               // correspond à AB (visuel)
  const a = b * ratio;         // correspond à AC (visuel)
  const Ax = 0, Ay = 0;

  // Géométrie du moulin (sans dépendre d'un puzzle particulier)
  const A = { x: Ax, y: Ay };
  const B = { x: Ax + b, y: Ay };
  const C = { x: Ax, y: Ay + a };
  const w = { x: a, y: b };
  const Bw = { x: B.x + w.x, y: B.y + w.y };
  const Cw = { x: C.x + w.x, y: C.y + w.y };

  const mold = {
    a, b,
    c: Math.hypot(a, b),
    corners: [A, B, C, Bw, Cw, { x: Ax - a, y: Ay }, { x: Ax - a, y: Ay + a }, { x: Ax, y: Ay - b }, { x: Ax + b, y: Ay - b }]
  };

  const m = { A, B, C, Bw, Cw, mold };

  // BBox
  const bb = bboxOfPoints(mold.corners);
  const pad = 30;
  const vb = `${(bb.minX - pad).toFixed(2)} ${(bb.minY - pad).toFixed(2)} ${(bb.w + 2 * pad).toFixed(2)} ${(bb.h + 2 * pad).toFixed(2)}`;

  // Labels
  const midAB = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
  const midAC = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 };

  const raSize = 18;
  const ra = [
    `${A.x},${A.y}`,
    `${A.x + raSize},${A.y}`,
    `${A.x + raSize},${A.y + raSize}`,
    `${A.x},${A.y + raSize}`,
  ].join(" ");

  const bigSqPts = [B, C, Cw, Bw].map(p => `${p.x},${p.y}`).join(" ");

  return `
<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-label="Moulin vide pour application">
  <g class="moulinStatic">
    <!-- Carrés vides -->
    <rect x="${A.x}" y="${A.y - b}" width="${b}" height="${b}" class="sqEmpty"></rect>
    <rect x="${A.x - a}" y="${A.y}" width="${a}" height="${a}" class="sqEmpty"></rect>
    <polygon class="bigSq" points="${bigSqPts}"></polygon>

    <!-- Triangle -->
    <line class="edge" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"></line>
    <line class="edge" x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}"></line>
    <line class="edge" x1="${B.x}" y1="${B.y}" x2="${C.x}" y2="${C.y}"></line>
    <polyline class="rightAngle" points="${ra}"></polyline>

    <!-- Lettres -->
    <text class="label" x="${A.x - 34}" y="${A.y - 18}">A</text>
    <text class="label" x="${B.x + 12}" y="${B.y - 14}">B</text>
    <text class="label" x="${C.x - 26}" y="${C.y + 40}">C</text>

    <!-- Données -->
    <text class="data" x="${midAB.x}" y="${midAB.y - 12}" text-anchor="middle">AB = ${AB_cm} cm</text>
    <text class="data" x="${midAC.x - 10}" y="${midAC.y}" text-anchor="end" dominant-baseline="middle">AC = ${AC_cm} cm</text>
  </g>
</svg>`;
}


  function buildSingleSkeletonSVG(){
    const m = state.moulins?.L;
    if(!m) return `<svg viewBox="0 0 10 10"></svg>`;

    const pts = [];
    const a = m.mold.a, b = m.mold.b;
    pts.push(m.A,m.B,m.C,m.Bw,m.Cw);
    pts.push({x:m.A.x, y:m.A.y-b}, {x:m.A.x+b, y:m.A.y-b}, {x:m.A.x+b, y:m.A.y}, {x:m.A.x, y:m.A.y});
    pts.push({x:m.A.x-a, y:m.A.y}, {x:m.A.x-a, y:m.A.y+a}, {x:m.A.x, y:m.A.y+a});
    pts.push(...m.mold.corners);

    const bb = bboxOfPoints(pts);
    const pad = 14;
    const vb = `${(bb.minX-pad).toFixed(2)} ${(bb.minY-pad).toFixed(2)} ${(bb.w+2*pad).toFixed(2)} ${(bb.h+2*pad).toFixed(2)}`;

    return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-label="Moulin vide (squelette)">
      ${drawMoulinSkeleton(m)}
    </svg>`;
  }

  function buildMiniSkeletonSheetHTML(count = 12) {
  // Mini moulins vides : EXACTEMENT le même dessin que le moulin principal, simplement réduit via CSS.
  // (Ainsi, c’est une vraie réduction, pas un autre moulin “reconstruit” avec des dimensions différentes.)
  const baseSVG = buildSingleSkeletonSVG();
  const cells = Array.from({ length: count }, () => `<div class="miniCell">${baseSVG}</div>`).join("");
  return `<div class="miniGrid">${cells}</div>`;
}


  // ----- SVG : triangle rectangle (AB, AC donnés) -----
  function buildTriangleSVG(abCm, acCm){
    // (copie fidèle de l’énoncé d’origine : juste la figure + les longueurs, sans zones "calculs")
    const scale = 12; // px par mm (approximatif)
    const ab = abCm * 10 * scale;
    const ac = acCm * 10 * scale;

    const margin = 70;
    const A = {x: margin + ac + 120, y: margin + ab + 120};
    const B = {x: A.x + ab, y: A.y};
    const C = {x: A.x, y: A.y + ac};

    // Carré sur AB (au-dessus)
    const AB2 = {x: B.x, y: B.y - ab};
    const AA2 = {x: A.x, y: A.y - ab};

    // Carré sur AC (à gauche)
    const CC2 = {x: C.x - ac, y: C.y};
    const AA3 = {x: A.x - ac, y: A.y};

    // Carré sur BC
    const w = {x: ac, y: ab};
    const Bw = {x: B.x + w.x, y: B.y + w.y};
    const Cw = {x: C.x + w.x, y: C.y + w.y};

    const ra = 70;
    const raPts = [
      {x:A.x, y:A.y},
      {x:A.x+ra, y:A.y},
      {x:A.x+ra, y:A.y+ra},
      {x:A.x, y:A.y+ra},
    ];

    const ptsAll = [A,B,C,AB2,AA2,CC2,AA3,Bw,Cw];
    const bb = bboxOfPoints(ptsAll);
    const pad = 90;
    const vb = `${(bb.minX-pad).toFixed(2)} ${(bb.minY-pad).toFixed(2)} ${(bb.w+2*pad).toFixed(2)} ${(bb.h+2*pad).toFixed(2)}`;

    return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-label="Triangle rectangle avec carrés">
      <!-- carrés -->
      <polygon class="boardLine" points="${[A,B,AB2,AA2].map(p=>`${p.x},${p.y}`).join(" ")}"/>
      <polygon class="boardLine" points="${[A,C,CC2,AA3].map(p=>`${p.x},${p.y}`).join(" ")}"/>
      <polygon class="boardLine" points="${[B,C,Cw,Bw].map(p=>`${p.x},${p.y}`).join(" ")}"/>

      <!-- triangle -->
      <line class="thinLine" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="thinLine" x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}"/>
      <line class="thinLine" x1="${B.x}" y1="${B.y}" x2="${C.x}" y2="${C.y}"/>
      <polyline class="rightAngle" points="${raPts.map(p=>`${p.x},${p.y}`).join(" ")}"/>

      <!-- points -->
      <circle cx="${A.x}" cy="${A.y}" r="10" fill="#000"/>
      <circle cx="${B.x}" cy="${B.y}" r="10" fill="#000"/>
      <circle cx="${C.x}" cy="${C.y}" r="10" fill="#000"/>

      <!-- labels -->
      <text class="subtitle" x="${A.x-30}" y="${A.y-30}">A</text>
      <text class="subtitle" x="${B.x+20}" y="${B.y+20}">B</text>
      <text class="subtitle" x="${C.x-30}" y="${C.y+55}">C</text>

      <text class="subtitle" x="${(A.x+B.x)/2}" y="${A.y-24}" text-anchor="middle">AB = ${abCm} cm</text>
      <text class="subtitle" x="${A.x-24}" y="${(A.y+C.y)/2}" text-anchor="end">AC = ${acCm} cm</text>
      <text class="subtitle" x="${(B.x+C.x)/2 + 28}" y="${(B.y+C.y)/2 + 18}" text-anchor="start">BC = ? cm</text>
    </svg>`;
  }

// ----- utilitaires (impression) -----
  function pieceVerticesAt(piece, cx, cy, rotDeg, flipX){
    const vs = piece.verticesLocal || [];
    const out = [];
    const ang = rotDeg ? (Math.PI * rotDeg / 180) : 0;
    const cos = Math.cos(ang), sin = Math.sin(ang);
    for(const v of vs){
      const lx = flipX ? -v.x : v.x;
      const ly = v.y;
      // rotation autour du centroïde (cx,cy)
      const rx = (lx * cos) - (ly * sin);
      const ry = (lx * sin) + (ly * cos);
      out.push({x: cx + rx, y: cy + ry});
    }
    return out;
  }

  function escapeHTML(str){
    return String(str)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  // On garde le modal en secours (popup bloquée) + clic de fond neutralisé
  function closeEnonce(){ modal.style.display = "none"; }
  modalClose.onclick = closeEnonce;
  modal.addEventListener("pointerdown", (e)=>{ e.preventDefault(); e.stopPropagation(); });

  // Contrat d’intégration pour une fiche élève : ouvrir directement un puzzle.
  function puzzleLaunchConfig(override={}){
    const params = new URLSearchParams(window.location.search);
    const globalConfig = window.MATHSGO_PYTHAGORE_PUZZLE_CONFIG;
    const base = globalConfig && typeof globalConfig === "object" ? globalConfig : {};
    const query = {};
    if(params.has("puzzle")) query.puzzle = params.get("puzzle");
    if(params.has("mode")) query.mode = params.get("mode");
    if(params.has("letters")) query.letters = /^(1|true|oui|yes)$/i.test(params.get("letters"));
    return {...base, ...query, ...override};
  }

  function applyPuzzleLaunchConfig(override={}){
    const cfg = puzzleLaunchConfig(override);
    if(cfg.puzzle && [...puzzleSelect.options].some(opt => opt.value === cfg.puzzle)){
      state.puzzle = cfg.puzzle;
      puzzleSelect.value = cfg.puzzle;
    }
    if(cfg.mode === "eleves" || cfg.mode === "vide") state.mode = cfg.mode;
    if(typeof cfg.letters === "boolean") state.lettersEnabled = cfg.letters;
    return cfg;
  }

  // ---------- init ----------
  applyPuzzleLaunchConfig();
  buildScene();
  fitWorldToViewport();
  setMode(state.mode);
  toggleLetters.classList.toggle("on", state.lettersEnabled);
  stage.classList.toggle("showLetters", state.lettersEnabled);
  window.MathsGoPythagorePuzzle = {
    launch(config={}){
      applyPuzzleLaunchConfig(config);
      buildScene();
      fitWorldToViewport();
      setMode(state.mode);
      toggleLetters.classList.toggle("on", state.lettersEnabled);
      stage.classList.toggle("showLetters", state.lettersEnabled);
    },
    start(config={}){ this.launch(config); }
  };
  window.addEventListener("resize", () => {
    const compact = isCompactViewport();
    if(state.layoutCompact !== compact){
      buildScene();
      setMode(state.mode);
    } else {
      fitWorldToViewport();
    }
  });
})();
</script>
