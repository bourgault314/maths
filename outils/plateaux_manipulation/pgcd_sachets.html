<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PGCD</title>
<style>
  :root{
    --ink:#111827;
    --muted:#64748b;
    --line:#d8e1ec;
    --bg:#f7f9fc;
    --card:rgba(255,255,255,.92);
    --pink:#ec4b86;
    --pink-soft:#fff0f6;
    --pink-line:#f7aac8;
    --blue:#1485e5;
    --blue-soft:#eef7ff;
    --blue-line:#9ed0ff;
    --green:#20a44a;
    --red:#e23a3a;
    --amber:#f59e0b;
    --shadow:0 12px 30px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:radial-gradient(circle at top,#ffffff 0,#f5f8fc 68%,#eef3f9 100%);
    color:var(--ink);
  }
  .app{
    height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr;
    gap:8px;
    padding:8px;
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    flex-wrap:wrap;
    overflow:hidden;
  }
  .title{
    font-size:24px;
    font-weight:950;
    color:#0f172a;
    white-space:nowrap;
    margin-right:2px;
  }
  .brand{
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0;
    margin:0 6px 0 0;
    border:0;
    background:transparent;
    flex:0 0 auto;
    text-decoration:none;
    cursor:pointer;
    border-radius:12px;
  }
  .brand:hover{
    filter:brightness(1.04);
  }
  .brand:focus-visible{
    outline:3px solid rgba(20,133,229,.35);
    outline-offset:3px;
  }
  .brandLogo{
    display:block;
    height:38px;
    width:auto;
    max-width:150px;
    object-fit:contain;
  }
  .group{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 8px;
    border:1px solid #e2e8f0;
    border-radius:15px;
    background:#fff;
  }
  label{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:850;
    font-size:15px;
    color:#334155;
    white-space:nowrap;
  }
  .countGroup{
    gap:10px;
    flex:0 1 auto;
  }
  .itemLabel{
    gap:5px;
  }
  .nameInput{
    width:84px;
    min-width:64px;
    border:0;
    outline:0;
    background:transparent;
    padding:6px 0;
    font-size:15px;
    font-weight:950;
    text-align:right;
    color:currentColor;
  }
  .nameInput:focus{
    border-bottom:2px solid currentColor;
  }
  input[type="number"]{
    width:84px;
    border:0;
    outline:0;
    border-radius:10px;
    background:#f8fafc;
    padding:7px 9px;
    font-size:18px;
    font-weight:950;
    text-align:center;
    color:#0f172a;
  }
  .pinkTxt{color:var(--pink)}
  .blueTxt{color:var(--blue)}
  .packControl{
    flex:1 1 360px;
    min-width:280px;
    max-width:620px;
  }
  .packLabel{
    min-width:105px;
    justify-content:flex-start;
  }
  .packLabel strong{
    color:#0f172a;
    font-size:26px;
    line-height:1;
    min-width:34px;
    text-align:center;
  }
  input[type="range"]{
    flex:1 1 180px;
    width:100%;
    min-width:120px;
    accent-color:var(--pink);
    cursor:pointer;
  }
  button{
    border:1px solid #dbe3ee;
    background:#fff;
    color:#0f172a;
    border-radius:15px;
    min-height:40px;
    padding:8px 12px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    white-space:nowrap;
  }
  button:hover{box-shadow:0 5px 15px rgba(15,23,42,.10)}
  button.active{
    border-color:#a8d0ff;
    background:#eff7ff;
    color:#0968bd;
  }
  .plateau{
    --stage-top:64px;
    --stage-bottom:106px;
    min-height:0;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:24px;
    background:#ffffff;
    box-shadow:var(--shadow);
  }
  .plateau.zoomed{
    cursor:grab;
  }
  .plateau.panning{
    cursor:grabbing;
  }
  svg{
    position:absolute;
    left:0;
    top:var(--stage-top);
    width:100%;
    height:calc(100% - var(--stage-top) - var(--stage-bottom));
    display:block;
    touch-action:none;
    user-select:none;
  }
  .dotNode{
    transition:opacity .22s ease;
  }
  .dotNode circle.main{
    stroke-width:1.2;
    filter:url(#softShadow);
  }
  .dotNode circle.shine{
    fill:rgba(255,255,255,.55);
    pointer-events:none;
  }
  .guideRect{
    fill:#fff;
    stroke-width:2;
    stroke-dasharray:8 8;
  }
  .columnBand{
    fill:#0f172a;
    opacity:.028;
  }
  .columnNum{
    font-size:16px;
    font-weight:950;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .rowLabelBig{
    font-size:34px;
    font-weight:950;
    text-anchor:end;
    dominant-baseline:middle;
  }
  .rowLabelSmall{
    font-size:18px;
    font-weight:900;
    text-anchor:end;
    dominant-baseline:middle;
  }
  .restLabel{
    font-size:17px;
    font-weight:950;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .separateur{
    stroke:#cbd5e1;
    stroke-width:2;
    stroke-dasharray:8 8;
  }
  .caption{
    font-size:15px;
    fill:#64748b;
    font-weight:800;
  }
  .packageIndex{
    font-size:16px;
    font-weight:950;
    text-anchor:middle;
    dominant-baseline:middle;
    fill:#475569;
  }
  .packetLabel{
    font-size:16px;
    font-weight:950;
    text-anchor:middle;
    dominant-baseline:middle;
    fill:#64748b;
    letter-spacing:.02em;
  }
  .quotientNum{
    font-size:17px;
    font-weight:950;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .restValue{
    font-size:17px;
    font-weight:950;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .eqText{
    font-size:30px;
    font-weight:1000;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .svgPillText{
    font-size:18px;
    font-weight:950;
    text-anchor:middle;
    dominant-baseline:middle;
    fill:#111827;
  }
  .pgcdSvgText{
    font-size:21px;
    font-weight:1000;
  }
  .eqOverlay{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    z-index:4;
    display:flex;
    justify-content:center;
    max-width:calc(100% - 32px);
    pointer-events:none;
  }
  .eqOverlayTop{ top:10px; }
  .eqOverlayBottom{ bottom:62px; }
  .calcPanel{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    z-index:5;
    max-width:calc(100% - 220px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    pointer-events:none;
  }
  .calcPanel[hidden]{display:none}

  .zoomPanel{
    position:absolute;
    right:16px;
    bottom:14px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(255,255,255,.94);
    box-shadow:0 10px 24px rgba(15,23,42,.10);
    z-index:5;
  }
  .zoomPanel button{
    min-height:34px;
    min-width:36px;
    padding:6px 9px;
    border-radius:13px;
    font-size:14px;
  }
  .zoomValue{
    min-width:52px;
    text-align:center;
    font-size:14px;
    font-weight:950;
    color:#334155;
    user-select:none;
  }
  .pill{
    background:#fff;
    border:1px solid #dbe3ee;
    border-radius:14px;
    padding:8px 12px;
    font-size:16px;
    font-weight:950;
    white-space:nowrap;
  }
  .eqOverlay .pill{
    font-size:24px;
    font-weight:1000;
    padding:8px 16px;
    box-shadow:0 8px 22px rgba(15,23,42,.10);
  }
  .pill.pink{color:var(--pink);border-color:#ffd0df;background:rgba(255,247,250,.96)}
  .pill.blue{color:var(--blue);border-color:#cde8ff;background:rgba(246,251,255,.96)}
  .pill.pgcd{color:#0f7a35;border-color:#20a44a;background:#ecfdf5;border-width:2px;font-size:21px}
  .message{
    min-width:min(430px,100%);
    text-align:center;
    border-radius:14px;
    padding:8px 12px;
    font-size:17px;
    font-weight:950;
  }
  .message.ok{background:#edf9f1;color:#126f2a;border:1px solid #b7e6c4}
  .message.bad{background:#fff8e8;color:#664000;border:1px solid #ffd99a}

  .divisorsTab{
    position:absolute;
    left:16px;
    top:14px;
    bottom:auto;
    z-index:6;
    width:min(420px, calc(50% - 34px));
    min-width:260px;
    border:1px solid #dbe3ee;
    border-radius:18px;
    background:rgba(255,255,255,.96);
    box-shadow:0 10px 24px rgba(15,23,42,.10);
    overflow:hidden;
    transition:width .22s ease, min-width .22s ease, box-shadow .22s ease;
  }
  .divisorsTab.collapsed{
    width:auto;
    min-width:0;
    max-width:min(520px, calc(50% - 34px));
  }
  .divisorsTab.collapsed .divisorsToggle{
    min-height:42px;
    padding:8px 12px;
  }
  .divisorsTab.collapsed .divisorsTitle{
    white-space:nowrap;
    font-size:15px;
  }
  .divisorsTab.expanded{
    width:min(620px, calc(50% - 34px));
    min-width:420px;
    box-shadow:0 16px 36px rgba(15,23,42,.16);
  }
  .divisorsToggle{
    width:100%;
    border:0;
    border-radius:0;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    min-height:42px;
    padding:9px 12px;
    color:#0f172a;
    box-shadow:none;
  }
  .divisorsTab.expanded .divisorsToggle{
    min-height:52px;
    padding:11px 16px;
  }
  .divisorsToggle:hover{box-shadow:none;background:#f8fafc}
  .divisorsTitle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:950;
  }
  .divisorsTab.expanded .divisorsTitle{
    font-size:18px;
  }
  .divisorsMini{
    display:inline-flex;
    align-items:center;
    gap:4px;
    flex-wrap:wrap;
    max-width:180px;
    overflow:hidden;
  }
  .divisorsMiniChip{
    min-width:22px;
    height:22px;
    padding:0 6px;
    border-radius:999px;
    background:#eff6ff;
    color:#095ca8;
    border:1px solid #bfdbfe;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:1000;
  }
  .divisorsTab.expanded .divisorsMini{display:none;}
  .divisorsChevron{
    font-size:18px;
    font-weight:1000;
    color:#64748b;
  }
  .divisorsTab.expanded .divisorsChevron{
    font-size:22px;
  }
  .divisorsContent{
    border-top:1px solid #e2e8f0;
    padding:10px 12px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .divisorsTab.expanded .divisorsContent{
    padding:14px 16px 16px;
    gap:14px;
  }
  .divisorsContent[hidden],
  .divisorsTab.collapsed .divisorsContent{
    display:none !important;
  }
  .divisorList{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:7px;
    min-height:30px;
  }
  .divisorsTab.expanded .divisorList{
    gap:10px;
    min-height:44px;
  }
  .divisorChip{
    min-width:34px;
    height:30px;
    padding:0 10px;
    border-radius:999px;
    background:#eff6ff;
    color:#095ca8;
    border:1px solid #bfdbfe;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:1000;
  }
  .divisorsTab.expanded .divisorChip{
    min-width:48px;
    height:40px;
    padding:0 14px;
    font-size:21px;
  }
  .divisorEmpty{
    color:#64748b;
    font-size:14px;
    font-weight:800;
  }
  .divisorActions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .divisorsTab.expanded .divisorActions{
    gap:12px;
  }
  .divisorsTab.expanded .addDivisorBtn,
  .divisorsTab.expanded .clearDivisorsBtn{
    min-height:46px;
    padding:10px 16px;
    font-size:16px;
  }
  .addDivisorBtn{
    color:#126f2a;
    background:#ecfdf5;
    border-color:#b7e6c4;
  }
  .addDivisorBtn:disabled{
    opacity:.46;
    cursor:not-allowed;
    background:#f8fafc;
    color:#64748b;
    border-color:#e2e8f0;
  }
  .clearDivisorsBtn{
    min-height:36px;
    color:#64748b;
    background:#fff;
  }
  .clearDivisorsBtn:disabled{
    opacity:.38;
    cursor:not-allowed;
  }
  @media(max-width:980px){
    body{overflow:hidden}
    .plateau{--stage-top:60px;--stage-bottom:104px}
    .app{height:100dvh;min-height:0}
    .toolbar{gap:6px}
    .title{font-size:19px}
    .brand{display:none}
    button{min-height:36px;padding:7px 9px;font-size:14px}
    .packControl{order:10;flex-basis:100%;min-width:220px;max-width:none}
    .message{min-width:0;flex-basis:100%}
    .eqOverlay .pill{font-size:19px;padding:7px 12px}
    .calcPanel{max-width:calc(100% - 28px);bottom:14px}
    .eqOverlayBottom{bottom:62px}
    .divisorsTab{left:10px;top:52px;bottom:auto;width:min(460px, calc(100% - 20px));min-width:0}
    .divisorsTab.expanded{left:10px;top:52px;width:calc(100% - 20px);min-width:0}
    .zoomPanel{right:10px;bottom:10px}
  }
</style>
</head>

      <label class="itemLabel blueTxt"><input id="nameB" class="nameInput" type="text" value="bonbons" aria-label="Nom de la collection bleue"><input id="nB" type="number" min="1" max="240" value="36" aria-label="Quantité bleue"></label>
    </div>
    <button id="minusBtn" title="un paquet de moins">−</button>
    <div class="group packControl">
      <label class="packLabel">Paquets <strong id="sOut">8</strong></label>
      <input id="sRange" type="range" min="1" max="24" step="1" value="8" aria-label="Nombre de paquets">
      <button id="plusBtn" title="un paquet de plus">+</button>
    </div>
    <button id="guidesBtn" class="active" title="Afficher ou masquer les contours des paquets">Guides</button>
    <button id="calcBtn" title="Afficher ou masquer la réponse">Réponse</button>
    <button id="revealBtn" title="Afficher ou masquer le PGCD">PGCD</button>
    <button id="fullBtn" title="Plein écran">Plein écran</button>
  </div>

  <main class="plateau" id="plateau">
    <svg id="svg" aria-label="Plateau de points pour chercher le PGCD" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="softShadow" x="-80%" y="-80%" width="260%" height="260%">
          <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.18"/>
        </filter>
      </defs>
      <g id="bandsLayer"></g>
      <g id="guidesLayer"></g>
      <g id="labelsLayer"></g>
      <g id="dotsLayer"></g>
    </svg>
    <div class="eqOverlay eqOverlayTop" aria-live="polite">
      <div class="pill pink" id="eqA">24 = 8 × 3</div>
    </div>
    <div class="eqOverlay eqOverlayBottom" aria-live="polite">
      <div class="pill blue" id="eqB">36 = 8 × 4 + 4</div>
    </div>
    <div class="calcPanel" id="calcPanel" hidden aria-live="polite">
      <div class="message bad" id="message" hidden>8 n’est pas un diviseur commun.</div>
      <div class="pill pgcd" id="pgcdPill" hidden></div>
    </div>
    <div class="divisorsTab collapsed" id="divisorsTab">
      <button class="divisorsToggle" id="divisorsToggle" aria-expanded="false">
        <span class="divisorsTitle">Liste des diviseurs communs <span class="divisorsMini" id="divisorsMini"></span></span>
        <span class="divisorsChevron" id="divisorsChevron">▸</span>
      </button>
      <div class="divisorsContent" id="divisorsContent" hidden>
        <div class="divisorList" id="divisorList"><span class="divisorEmpty">aucun pour l’instant</span></div>
        <div class="divisorActions">
          <button class="addDivisorBtn" id="addDivisorBtn">Ajouter 8</button>
          <button class="clearDivisorsBtn" id="clearDivisorsBtn">Vider</button>
        </div>
      </div>
    </div>
    <div class="zoomPanel" id="zoomPanel" aria-label="Zoom du plateau">
      <button id="zoomOutBtn" title="Dézoomer">−</button>
      <span class="zoomValue" id="zoomValue">100%</span>
      <button id="zoomInBtn" title="Zoomer">+</button>
      <button id="zoomFitBtn" title="Ajuster au plateau">Ajuster</button>
    </div>
  </main>
</div>
<script>
(function(){
  const svg = document.getElementById('svg');
  const plateau = document.getElementById('plateau');
  const bandsLayer = document.getElementById('bandsLayer');
  const guidesLayer = document.getElementById('guidesLayer');
  const labelsLayer = document.getElementById('labelsLayer');
  const dotsLayer = document.getElementById('dotsLayer');
  const nameAInput = document.getElementById('nameA');
  const nameBInput = document.getElementById('nameB');
  const nAInput = document.getElementById('nA');
  const nBInput = document.getElementById('nB');
  const sRange = document.getElementById('sRange');
  const sOut = document.getElementById('sOut');
  const calcPanel = document.getElementById('calcPanel');
  const eqA = document.getElementById('eqA');
  const eqB = document.getElementById('eqB');
  const message = document.getElementById('message');
  const pgcdPill = document.getElementById('pgcdPill');
  const calcBtn = document.getElementById('calcBtn');
  const guidesBtn = document.getElementById('guidesBtn');
  const revealBtn = document.getElementById('revealBtn');
  const fullBtn = document.getElementById('fullBtn');
  const zoomPanel = document.getElementById('zoomPanel');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomFitBtn = document.getElementById('zoomFitBtn');
  const zoomValue = document.getElementById('zoomValue');
  const divisorsTab = document.getElementById('divisorsTab');
  const divisorsToggle = document.getElementById('divisorsToggle');
  const divisorsContent = document.getElementById('divisorsContent');
  const divisorsChevron = document.getElementById('divisorsChevron');
  const divisorsMini = document.getElementById('divisorsMini');
  const divisorList = document.getElementById('divisorList');
  const addDivisorBtn = document.getElementById('addDivisorBtn');
  const clearDivisorsBtn = document.getElementById('clearDivisorsBtn');

  const state = {
    A:24,
    B:36,
    s:8,
    guides:true,
    calc:false,
    reveal:false,
    manualZoom:1,
    panX:0,
    panY:0,
    lastBounds:null,
    divisorsMode:0,
    divisorsOpen:false,
    commonDivisors:[]
  };

  const COLORS = {
    A:{fill:'#ec4b86', stroke:'#b91e56', soft:'#fff0f6', line:'#f7aac8', name:'dragées'},
    B:{fill:'#1485e5', stroke:'#0866b6', soft:'#eef7ff', line:'#9ed0ff', name:'bonbons'}
  };

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a; }
  function divText(N,s){ const q=Math.floor(N/s), r=N%s; return r===0 ? `${N} = ${s} × ${q}` : `${N} = ${s} × ${q} + ${r}`; }
  function elt(name, attrs={}){
    const e=document.createElementNS('http://www.w3.org/2000/svg', name);
    for(const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }
  function textNode(str, attrs={}){
    const t=elt('text', attrs);
    t.textContent=str;
    return t;
  }
  function bestInnerCols(q){
    if(q<=8) return 1;
    if(q<=20) return 2;
    if(q<=42) return 3;
    if(q<=72) return 4;
    return 5;
  }
  function restCols(r){
    if(r<=8) return 1;
    if(r<=24) return 2;
    if(r<=54) return 3;
    return 4;
  }
  function computeLayout(A,B,s){
    const qA=Math.floor(A/s), rA=A%s;
    const qB=Math.floor(B/s), rB=B%s;
    const colsA=bestInnerCols(qA), colsB=bestInnerCols(qB);
    const innerCols=Math.max(colsA, colsB, 1);
    const cell=28;
    const dotR=7.6;
    const padX=18;
    const padY=22;
    const packetW=Math.max(44, innerCols*cell + padX*2);
    const rowsA=Math.max(1, Math.ceil(Math.max(qA,1)/colsA));
    const rowsB=Math.max(1, Math.ceil(Math.max(qB,1)/colsB));
    const packetHA=Math.max(76, rowsA*cell + padY*2);
    const packetHB=Math.max(76, rowsB*cell + padY*2);
    const gap=18;
    const left=150;
    const top=34;
    const labelGap=44;
    const yA=top+44;
    const restGap=34;
    const rColsA=restCols(rA), rColsB=restCols(rB);
    const restInnerCols=Math.max(rColsA, rColsB, 1);
    const restW=Math.max(70, restInnerCols*cell+padX*2);
    const restHA=Math.max(76, Math.ceil(Math.max(1,rA)/rColsA)*cell+padY*2);
    const restHB=Math.max(76, Math.ceil(Math.max(1,rB)/rColsB)*cell+padY*2);
    const rowHA=Math.max(packetHA, restHA);
    const rowHB=Math.max(packetHB, restHB);
    const yB=yA+rowHA+labelGap;
    const restX=left+s*(packetW+gap)+restGap;
    const totalW=restX+restW+70;
    const extraBottom=28;
    const totalH=yB+rowHB+extraBottom;
    return {A,B,s,qA,rA,qB,rB,colsA,colsB,cell,dotR,padX,padY,packetW,packetHA,packetHB,rowHA,rowHB,gap,left,top,yA,yB,restX,restW,restHA,restHB,totalW,totalH,restGap};
  }
  function getName(input, fallback){
    const value=(input?.value || '').trim();
    return value || fallback;
  }
  function packetTop(layout, rowKey){
    const isA=rowKey==='A';
    const y0=isA?layout.yA:layout.yB;
    const rowH=isA?layout.rowHA:layout.rowHB;
    const packetH=isA?layout.packetHA:layout.packetHB;
    return y0+(rowH-packetH)/2;
  }
  function restTop(layout, rowKey){
    const isA=rowKey==='A';
    const y0=isA?layout.yA:layout.yB;
    const rowH=isA?layout.rowHA:layout.rowHB;
    const packetH=isA?layout.packetHA:layout.packetHB;
    const restH=isA?layout.restHA:layout.restHB;
    // Si le reste est plus petit que les sachets, on l'aligne en haut des sachets
    // au lieu de le laisser flotter au milieu de la ligne.
    if(restH<=packetH) return y0+(rowH-packetH)/2;
    return y0+(rowH-restH)/2;
  }
  function posInPacket(layout, rowKey, dotIndex){
    const isA=rowKey==='A';
    const N=isA?layout.A:layout.B;
    const q=isA?layout.qA:layout.qB;
    const r=isA?layout.rA:layout.rB;
    const cols=isA?layout.colsA:layout.colsB;
    const y0=isA?layout.yA:layout.yB;
    const h=isA?layout.packetHA:layout.packetHB;
    const rowH=isA?layout.rowHA:layout.rowHB;
    const full=layout.s*q;
    if(dotIndex < full){
      const col=dotIndex % layout.s;
      const rank=Math.floor(dotIndex / layout.s);
      const localCol=rank % cols;
      const localRow=Math.floor(rank / cols);
      const gridW=cols*layout.cell;
      const gridH=Math.ceil(Math.max(q,1)/cols)*layout.cell;
      const x0=layout.left + col*(layout.packetW+layout.gap);
      const x=x0 + (layout.packetW-gridW)/2 + localCol*layout.cell + layout.cell/2;
      const y=y0 + (rowH-h)/2 + (h-gridH)/2 + localRow*layout.cell + layout.cell/2;
      return {x,y};
    }
    const restIndex=dotIndex-full;
    const rCols=restCols(r);
    const localCol=restIndex % rCols;
    const localRow=Math.floor(restIndex / rCols);
    const rRows=Math.max(1, Math.ceil(Math.max(r,1)/rCols));
    const gridW=rCols*layout.cell;
    const gridH=rRows*layout.cell;
    const restH=isA?layout.restHA:layout.restHB;
    const x=layout.restX + (layout.restW-gridW)/2 + localCol*layout.cell + layout.cell/2;
    const y=restTop(layout,rowKey) + (restH-gridH)/2 + localRow*layout.cell + layout.cell/2;
    return {x,y};
  }
  function ensureDot(rowKey, index){
    const id=`${rowKey}-${index}`;
    let g=document.getElementById(id);
    if(!g){
      const c=COLORS[rowKey];
      g=elt('g', {id, class:'dotNode'});
      const main=elt('circle', {class:'main', cx:0, cy:0, r:7.6, fill:c.fill, stroke:c.stroke});
      const shine=elt('circle', {class:'shine', cx:-2.6, cy:-3, r:2.6});
      g.appendChild(main);
      g.appendChild(shine);
      g.style.opacity='0';
      dotsLayer.appendChild(g);
      requestAnimationFrame(()=>g.style.opacity='1');
    }
    return g;
  }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function moveDot(g,x,y){
    const startX = Number.isFinite(g.__currentX) ? g.__currentX : (Number(g.dataset.x) || x);
    const startY = Number.isFinite(g.__currentY) ? g.__currentY : (Number(g.dataset.y) || y);
    const endX=x, endY=y;
    if(g.__raf) cancelAnimationFrame(g.__raf);
    const dx=endX-startX, dy=endY-startY;
    if(Math.abs(dx)+Math.abs(dy)<0.5){
      g.__currentX=endX; g.__currentY=endY;
      g.dataset.x=endX; g.dataset.y=endY;
      g.setAttribute('transform',`translate(${endX} ${endY})`);
      return;
    }
    const t0=performance.now();
    const duration=560;
    const run=(now)=>{
      const p=Math.min(1,(now-t0)/duration);
      const e=easeOutCubic(p);
      const cx=startX+dx*e;
      const cy=startY+dy*e;
      g.__currentX=cx; g.__currentY=cy;
      g.setAttribute('transform',`translate(${cx} ${cy})`);
      if(p<1){ g.__raf=requestAnimationFrame(run); }
      else {
        g.__currentX=endX; g.__currentY=endY;
        g.dataset.x=endX; g.dataset.y=endY;
        g.setAttribute('transform',`translate(${endX} ${endY})`);
        g.__raf=null;
      }
    };
    g.__raf=requestAnimationFrame(run);
  }
  function syncDots(rowKey, N, layout){
    for(let i=0;i<N;i++){
      const g=ensureDot(rowKey,i);
      const p=posInPacket(layout,rowKey,i);
      g.style.opacity='1';
      moveDot(g,p.x,p.y);
    }
    // supprime les anciens points si le nombre diminue
    [...dotsLayer.querySelectorAll(`[id^="${rowKey}-"]`)].forEach(g=>{
      const idx=Number(g.id.split('-')[1]);
      if(idx>=N){
        g.style.opacity='0';
        setTimeout(()=>{ if(g.parentNode && Number(g.id.split('-')[1])>=N) g.remove(); },260);
      }
    });
  }
  function drawGuides(layout){
    bandsLayer.innerHTML='';
    guidesLayer.innerHTML='';
    labelsLayer.innerHTML='';
    const {s,left,packetW,gap,yA,yB,packetHA,packetHB,rowHA,rowHB,restX,restW,restHA,restHB}=layout;
    const labelA=getName(nameAInput, COLORS.A.name);
    const labelB=getName(nameBInput, COLORS.B.name);
    const yRectA=packetTop(layout,'A');
    const yRectB=packetTop(layout,'B');
    const yRestA=restTop(layout,'A');
    const yRestB=restTop(layout,'B');
    const fullTop=yA-34;
    const fullBottom=yB+rowHB+20;
    if(state.guides){
      const groupW=(s-1)*(packetW+gap)+packetW;
      labelsLayer.appendChild(textNode('Paquets',{class:'packetLabel', x:left+groupW/2, y:yA-72}));
    }
    for(let col=0; col<s; col++){
      const x=left+col*(packetW+gap);
      if(state.guides){
        bandsLayer.appendChild(elt('rect',{class:'columnBand', x:x, y:fullTop, width:packetW, height:fullBottom-fullTop, rx:18, ry:18}));
        // Le numéro du paquet est commun aux deux lignes : paquet 1 = dragées + bonbons alignés.
        labelsLayer.appendChild(textNode(String(col+1),{class:'packageIndex', x:x+packetW/2, y:yA-48}));
        // Les nombres colorés indiquent combien il y a dans chaque paquet.
        // Ils sont placés sous les paquets pour ne pas se mélanger avec les numéros 1, 2, 3...
        labelsLayer.appendChild(textNode(String(layout.qA),{class:'quotientNum', x:x+packetW/2, y:yRectA+packetHA+22, fill:'#ec4b86'}));
        labelsLayer.appendChild(textNode(String(layout.qB),{class:'quotientNum', x:x+packetW/2, y:yRectB+packetHB+22, fill:'#1485e5'}));
        guidesLayer.appendChild(elt('rect',{class:'guideRect', x:x, y:yRectA, width:packetW, height:packetHA, rx:18, ry:18, stroke:COLORS.A.line}));
        guidesLayer.appendChild(elt('rect',{class:'guideRect', x:x, y:yRectB, width:packetW, height:packetHB, rx:18, ry:18, stroke:COLORS.B.line}));
      }
    }
    // Zones de reste séparées visuellement : surtout pas dans un paquet.
    const sepX=restX-18;
    guidesLayer.appendChild(elt('line',{class:'separateur', x1:sepX, y1:yRectA-18, x2:sepX, y2:Math.max(yRectA+packetHA,yRestA+restHA)+18}));
    guidesLayer.appendChild(elt('line',{class:'separateur', x1:sepX, y1:yRectB-18, x2:sepX, y2:Math.max(yRectB+packetHB,yRestB+restHB)+18}));
    if(state.guides){
      guidesLayer.appendChild(elt('rect',{class:'guideRect', x:restX, y:yRestA, width:restW, height:restHA, rx:18, ry:18, stroke:COLORS.A.line}));
      guidesLayer.appendChild(elt('rect',{class:'guideRect', x:restX, y:yRestB, width:restW, height:restHB, rx:18, ry:18, stroke:COLORS.B.line}));
    }
    if(state.guides){
      const restTextA = layout.rA>0 ? `reste : ${layout.rA}` : 'aucun reste';
      const restTextB = layout.rB>0 ? `reste : ${layout.rB}` : 'aucun reste';
      labelsLayer.appendChild(textNode(restTextA,{class:'restValue', x:restX+restW/2, y:yRestA+restHA+22, fill:'#ec4b86'}));
      labelsLayer.appendChild(textNode(restTextB,{class:'restValue', x:restX+restW/2, y:yRestB+restHB+22, fill:'#1485e5'}));
    }
    // Labels de lignes, mais pas de grosses cartes : on garde le plateau épuré.
    labelsLayer.appendChild(textNode(String(layout.A),{class:'rowLabelBig', x:108, y:yA+rowHA/2-12, fill:'#ec4b86'}));
    labelsLayer.appendChild(textNode(labelA,{class:'rowLabelSmall', x:108, y:yA+rowHA/2+25, fill:'#ec4b86'}));
    labelsLayer.appendChild(textNode(String(layout.B),{class:'rowLabelBig', x:108, y:yB+rowHB/2-12, fill:'#1485e5'}));
    labelsLayer.appendChild(textNode(labelB,{class:'rowLabelSmall', x:108, y:yB+rowHB/2+25, fill:'#1485e5'}));

    // Les décompositions et les conclusions sont affichées dans des calques HTML fixes.
    // Elles restent lisibles même quand le plateau est dézoomé, zoomé ou déplacé.
  }
  function syncZoomUi(){
    if(!zoomValue) return;
    zoomValue.textContent = `${Math.round(state.manualZoom*100)}%`;
    zoomOutBtn.disabled = state.manualZoom <= 1.01;
    zoomInBtn.disabled = state.manualZoom >= 2.49;
    plateau.classList.toggle('zoomed', state.manualZoom > 1.01);
  }

  function syncDivisorsUi(ok){
    if(typeof state.divisorsMode !== 'number') state.divisorsMode = 0;
    state.divisorsMode = state.divisorsMode === 2 ? 2 : 0;
    const expanded = state.divisorsMode === 2;
    state.divisorsOpen = expanded;
    divisorsTab.classList.toggle('open', expanded);
    divisorsTab.classList.toggle('expanded', expanded);
    divisorsTab.classList.toggle('collapsed', !expanded);
    divisorsToggle.setAttribute('aria-expanded', String(expanded));
    divisorsToggle.setAttribute('aria-label', expanded ? 'Réduire la liste des diviseurs communs' : 'Agrandir la liste des diviseurs communs');
    divisorsContent.hidden = !expanded;
    divisorsChevron.textContent = expanded ? '▴' : '▾';

    if(divisorsMini){
      divisorsMini.innerHTML = '';
      state.commonDivisors.slice().sort((a,b)=>a-b).forEach(v=>{
        const chip=document.createElement('span');
        chip.className='divisorsMiniChip';
        chip.textContent=String(v);
        divisorsMini.appendChild(chip);
      });
    }

    divisorList.innerHTML = '';
    if(state.commonDivisors.length===0){
      const empty=document.createElement('span');
      empty.className='divisorEmpty';
      empty.textContent='aucun pour l’instant';
      divisorList.appendChild(empty);
    }else{
      state.commonDivisors.slice().sort((a,b)=>a-b).forEach(v=>{
        const chip=document.createElement('span');
        chip.className='divisorChip';
        chip.textContent=String(v);
        divisorList.appendChild(chip);
      });
    }

    const already=state.commonDivisors.includes(state.s);
    addDivisorBtn.disabled = !ok || already;
    addDivisorBtn.textContent = already ? `${state.s} déjà dans la liste` : `Ajouter ${state.s}`;
    addDivisorBtn.title = ok ? '' : 'Possible seulement quand il n’y a aucun reste dans les deux collections.';
    clearDivisorsBtn.disabled = state.commonDivisors.length===0;
  }

  function clampPan(W,H,vw,vh){
    const maxX=Math.max(0,(W-vw)/2);
    const maxY=Math.max(0,(H-vh)/2);
    state.panX=clamp(state.panX,-maxX,maxX);
    state.panY=clamp(state.panY,-maxY,maxY);
    if(state.manualZoom<=1.01){ state.panX=0; state.panY=0; }
  }
  function setZoom(value, resetPan=false){
    state.manualZoom = clamp(value, 1, 2.5);
    if(resetPan || state.manualZoom<=1.01){
      state.panX=0;
      state.panY=0;
    }
    render();
  }
  function setViewBox(layout){
    // Mode ajusté : tout rentre. En zoom manuel, on garde le même plateau, mais on peut le déplacer.
    const margin=26;
    const W=layout.totalW+margin*2;
    const H=layout.totalH+margin*2;
    const zoom=state.manualZoom || 1;
    const vw=W/zoom;
    const vh=H/zoom;
    clampPan(W,H,vw,vh);
    const cx=W/2 + state.panX;
    const cy=H/2 + state.panY;
    svg.setAttribute('viewBox', `${cx-vw/2} ${cy-vh/2} ${vw} ${vh}`);
    state.lastBounds={W,H,vw,vh};
    syncZoomUi();
  }
  function applyPan(dx,dy,start){
    if(!state.lastBounds || state.manualZoom<=1.01) return;
    const rect=svg.getBoundingClientRect();
    const scaleX=state.lastBounds.vw/Math.max(1,rect.width);
    const scaleY=state.lastBounds.vh/Math.max(1,rect.height);
    state.panX=start.panX - dx*scaleX;
    state.panY=start.panY - dy*scaleY;
    setViewBox(state.lastLayout);
  }
  function updateMax(){
    // Le nombre de paquets utile ne dépasse pas la plus petite collection :
    // au-delà, une des deux collections aurait 0 objet par paquet.
    // On ne limite plus artificiellement à 48 ; le plateau dézoome si nécessaire.
    const max=clamp(Math.min(state.A,state.B),1,240);
    sRange.max=String(max);
    if(state.s>max) state.s=max;
    sRange.value=String(state.s);
  }
  function render(){
    const nextA=clamp(parseInt(nAInput.value||1,10),1,240);
    const nextB=clamp(parseInt(nBInput.value||1,10),1,240);
    if(nextA!==state.A || nextB!==state.B){
      state.commonDivisors=[];
    }
    state.A=nextA;
    state.B=nextB;
    nAInput.value=state.A;
    nBInput.value=state.B;
    updateMax();
    state.s=clamp(parseInt(sRange.value||1,10),1,Number(sRange.max));
    sRange.value=String(state.s);
    sOut.textContent=state.s;
    const layout=computeLayout(state.A,state.B,state.s);
    state.lastLayout=layout;
    drawGuides(layout);
    syncDots('A', state.A, layout);
    syncDots('B', state.B, layout);
    setViewBox(layout);
    // Les écritures globales restent fixes au-dessus du plateau : elles ne zooment pas.
    eqA.textContent=divText(state.A,state.s);
    eqB.textContent=divText(state.B,state.s);
    const ok=(state.A%state.s===0 && state.B%state.s===0);
    calcPanel.hidden=!(state.calc || state.reveal);
    message.hidden=!state.calc;
    message.className='message '+(ok?'ok':'bad');
    message.textContent= ok ? `${state.s} est un diviseur commun.` : `${state.s} n’est pas un diviseur commun.`;
    syncDivisorsUi(ok);
    if(state.reveal){
      const g=gcd(state.A,state.B);
      pgcdPill.hidden=false;
      pgcdPill.className='pill pgcd';
      pgcdPill.textContent=`PGCD(${state.A} ; ${state.B}) = ${g}`;
    }else{
      pgcdPill.hidden=true;
    }
  }
  function step(delta){
    state.s=clamp(state.s+delta,1,Number(sRange.max));
    sRange.value=String(state.s);
    render();
  }
  nameAInput.addEventListener('input', render);
  nameBInput.addEventListener('input', render);
  nAInput.addEventListener('change', render);
  nBInput.addEventListener('change', render);
  sRange.addEventListener('input',()=>{ state.s=Number(sRange.value); render(); });
  document.getElementById('minusBtn').addEventListener('click',()=>step(-1));
  document.getElementById('plusBtn').addEventListener('click',()=>step(1));
  calcBtn.addEventListener('click',()=>{ state.calc=!state.calc; calcBtn.classList.toggle('active',state.calc); render(); });
  guidesBtn.addEventListener('click',()=>{ state.guides=!state.guides; guidesBtn.classList.toggle('active',state.guides); render(); });
  revealBtn.addEventListener('click',()=>{ state.reveal=!state.reveal; revealBtn.classList.toggle('active',state.reveal); render(); });
  divisorsTab.addEventListener('pointerdown', e=>e.stopPropagation());
  divisorsTab.addEventListener('click', e=>e.stopPropagation());
  divisorsToggle.addEventListener('click',()=>{
    // Deux états seulement : petit résumé → grande liste.
    state.divisorsMode = (state.divisorsMode === 2) ? 0 : 2;
    state.divisorsOpen = state.divisorsMode === 2;
    syncDivisorsUi(state.A%state.s===0 && state.B%state.s===0);
  });
  addDivisorBtn.addEventListener('click',()=>{
    const ok=(state.A%state.s===0 && state.B%state.s===0);
    if(!ok || state.commonDivisors.includes(state.s)) return;
    state.commonDivisors.push(state.s);
    state.commonDivisors.sort((a,b)=>a-b);
    state.divisorsMode = 2;
    state.divisorsOpen=true;
    syncDivisorsUi(ok);
  });
  clearDivisorsBtn.addEventListener('click',()=>{ state.commonDivisors=[]; syncDivisorsUi(state.A%state.s===0 && state.B%state.s===0); });
  fullBtn.addEventListener('click',async()=>{
    if(!document.fullscreenElement){ await document.getElementById('app').requestFullscreen?.(); }
    else { await document.exitFullscreen?.(); }
  });
  zoomPanel.addEventListener('pointerdown', e=>e.stopPropagation());
  zoomPanel.addEventListener('click', e=>e.stopPropagation());
  zoomOutBtn.addEventListener('click',()=>setZoom(Math.round((state.manualZoom-0.15)*100)/100));
  zoomInBtn.addEventListener('click',()=>setZoom(Math.round((state.manualZoom+0.15)*100)/100));
  zoomFitBtn.addEventListener('click',()=>setZoom(1, true));
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); }
    if(e.key==='ArrowRight'){ e.preventDefault(); step(1); }
  });
  window.addEventListener('resize',()=>{ if(state.lastBounds) render(); });

  // Le plateau sert maintenant à observer : quand on zoome, on peut le déplacer.
  // Le nombre de paquets ne change plus en tirant le plateau : seulement avec −, +, le curseur ou les flèches.
  let panStart=null;
  plateau.addEventListener('pointerdown',e=>{
    if(state.manualZoom<=1.01) return;
    panStart={x:e.clientX, y:e.clientY, panX:state.panX, panY:state.panY};
    plateau.classList.add('panning');
    plateau.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });
  plateau.addEventListener('pointermove',e=>{
    if(!panStart) return;
    applyPan(e.clientX-panStart.x, e.clientY-panStart.y, panStart);
  });
  function endPan(){
    panStart=null;
    plateau.classList.remove('panning');
  }
  plateau.addEventListener('pointerup',endPan);
  plateau.addEventListener('pointercancel',endPan);

  render();
})();
</script>
</body>
</html>
