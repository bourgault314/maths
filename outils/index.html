<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Outils pédagogiques de mathématiques par thème | maths&amp;go</title>
  <meta name="description" content="Explorez les outils maths&go par thème : nombres, fractions, fonctions, algèbre, géométrie, probabilités, algorithmique et jeux mathématiques.">
  <link rel="canonical" href="https://mathsgo.re/outils/">
  <link rel="stylesheet" href="../assets/css/catalogue-refonte.css">
  <link rel="stylesheet" href="../assets/css/consentement.css">
  <script defer src="../assets/js/consentement.js"></script>
  <script defer src="../assets/js/catalogue-refonte-data.js"></script>
  <script defer src="../assets/js/catalogue-refonte.js"></script>
</head>
<body data-root-prefix="../">
  <a class="skip-link" href="#catalogue">Aller aux thèmes</a>

  <div class="site-shell">
    <header class="site-header">
      <a class="brand-link" href="../index.html" aria-label="Accueil maths&go">
        <img src="../assets/img/mathsgo-logo.png" alt="maths&go" width="1338" height="622">
      </a>
      <a class="header-home" href="../index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9h-5v-6H9v6H4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Accueil</span>
      </a>
    </header>

    <main class="main-panel" id="catalogue">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Explorer les outils</p>
        <h1 id="page-title">Choisissez un thème</h1>
        <p class="hero-lead" id="hero-lead">Retrouvez les univers illustrés de maths&amp;go, puis entrez dans celui qui vous intéresse.</p>
      </section>

      <div class="catalogue-controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <label class="visually-hidden" for="catalogue-search">Rechercher un thème ou un outil</label>
          <input id="catalogue-search" type="search" autocomplete="off" placeholder="Fractions, angles, rapporteur, conversions…">
          <button id="search-clear" class="search-clear" type="button" aria-label="Effacer la recherche" hidden>×</button>
        </div>

        <div class="type-box">
          <label for="type-filter">Accès direct</label>
          <select id="type-filter">
            <option value="">Par thème</option>
            <option value="plateau">Plateaux &amp; manipulations</option>
            <option value="exerciseur">Exercices interactifs</option>
            <option value="generateur">Générateurs</option>
            <option value="imprimable">À imprimer</option>
          </select>
        </div>
      </div>

      <nav class="domain-nav" aria-label="Filtrer les thèmes mathématiques">
        <button class="domain-tab" type="button" data-domain="" aria-pressed="true" style="--tab-color:#063f86">Tous</button>
        <button class="domain-tab" type="button" data-notion="calcul-mental" aria-pressed="false" style="--tab-color:#7c3aed">Automatismes</button>
        <button class="domain-tab" type="button" data-domain="nombres-calculs" aria-pressed="false" style="--tab-color:#0b67b2">Nombres</button>
        <button class="domain-tab" type="button" data-domain="proportionnalite-mesures" aria-pressed="false" style="--tab-color:#d86b16">Grandeurs &amp; fonctions</button>
        <button class="domain-tab" type="button" data-domain="algebre" aria-pressed="false" style="--tab-color:#7b42b4">Algèbre</button>
        <button class="domain-tab" type="button" data-domain="geometrie" aria-pressed="false" style="--tab-color:#087f78">Géométrie</button>
        <button class="domain-tab" type="button" data-domain="donnees" aria-pressed="false" style="--tab-color:#be3e68">Données</button>
        <button class="domain-tab" type="button" data-domain="informatique" aria-pressed="false" style="--tab-color:#4f5fb3">Informatique</button>
        <button class="domain-tab" type="button" data-domain="jeux-recherches" aria-pressed="false" style="--tab-color:#2f6d3f">Jeux &amp; recherches</button>
      </nav>

      <section aria-labelledby="results-title">
        <div class="section-heading">
          <div>
            <h2 id="results-title">Tous les thèmes</h2>
            <p class="results-summary" id="results-summary" aria-live="polite"></p>
          </div>
          <button class="back-themes" id="back-themes" type="button" hidden>← Tous les thèmes</button>
        </div>

        <div class="notion-grid" id="notion-grid"></div>
        <div class="resource-grid" id="resource-grid" hidden></div>
        <noscript><p class="empty-state">Activez JavaScript pour afficher le catalogue des thèmes.</p></noscript>
      </section>
    </main>

    <footer class="site-footer">
      <span>Gwenaël Bourgault</span><span aria-hidden="true">·</span>
      <a href="mailto:gwenael@mathsgo.re?subject=Contact%20depuis%20mathsgo.re">Me contacter</a><span aria-hidden="true">·</span>
      <a href="../mentions-legales.html">Mentions légales</a><span aria-hidden="true">·</span>
      <a href="../confidentialite.html">Confidentialité</a><span aria-hidden="true">·</span>
      <button type="button" onclick="window.mathsgoConsentement &amp;&amp; window.mathsgoConsentement.ouvrir()">Gérer mes cookies</button>
    </footer>
  </div>
</body>
</html>
