<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Une addition d’entiers ou de décimaux à poser en option puis à compléter colonne par colonne, avec des erreurs localisées et des indices progressifs.">
  <link rel="canonical" href="https://mathsgo.re/outils/addition-posee/addition-posee-interactive.html">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="author" content="Gwenaël Bourgault">
  <meta name="theme-color" content="#f6f8fb">
  <title>À toi de poser l’addition | maths&amp;go</title>
  <link rel="icon" href="../../favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="addition-posee.css?v=1">
  <link rel="stylesheet" href="addition-posee-interactive.css?v=1">
  <script defer src="../../assets/js/mention-confidentialite.js"></script>
  <script type="module" src="addition-posee-interactive.js?v=1"></script>
</head>
<body class="practice-page">
  <a class="skip-link" href="#outil">Aller à l’entraînement</a>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-nav">
        <a class="brand" href="../../index.html" aria-label="Accueil maths&amp;go">
          <img src="../../assets/img/logos/mathsgo/logo.png" alt="maths&amp;go" width="1338" height="622">
        </a>
        <a class="back-link" href="./">← Addition posée</a>
      </div>
      <div class="title-lockup">
        <p>S’entraîner</p>
        <h1>Addition posée</h1>
      </div>
      <div class="header-actions">
        <a class="button button-light walkthrough-link" href="addition-posee.html">Voir le pas à pas</a>
        <button class="icon-button" type="button" id="fullscreen" aria-label="Afficher en plein écran" title="Afficher en plein écran">
          <svg class="fullscreen-expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
          <svg class="fullscreen-collapse" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>
        </button>
      </div>
    </header>

    <main id="outil">
      <section class="controls-card" aria-label="Choix de l’addition">
        <form id="addition-form" novalidate>
          <label class="number-field role-first">
            <span>Premier terme</span>
            <input id="first-term" inputmode="decimal" type="text" maxlength="15" value="584" autocomplete="off" spellcheck="false" enterkeyhint="next" aria-describedby="form-error" required>
          </label>
          <span class="addition-form-symbol" aria-hidden="true">+</span>
          <label class="number-field role-second">
            <span>Second terme</span>
            <input id="second-term" inputmode="decimal" type="text" maxlength="15" value="279" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-describedby="form-error" required>
          </label>
          <div class="practice-options" aria-label="Options de l’entraînement">
            <label class="rank-control" for="rank-guides">
              <input id="rank-guides" type="checkbox">
              <span class="rank-switch" aria-hidden="true"></span>
              <span class="rank-copy"><strong>Repères de rang</strong><small>c · d · u</small></span>
            </label>
            <label class="rank-control placement-control" for="placement-mode">
              <input id="placement-mode" type="checkbox">
              <span class="rank-switch" aria-hidden="true"></span>
              <span class="rank-copy"><strong>Je place les nombres</strong><small>Avant de calculer</small></span>
            </label>
          </div>
          <button class="button button-secondary" id="random-problem" type="button">Au hasard</button>
          <button class="button button-primary" type="submit">Commencer</button>
        </form>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </section>

      <section class="projection-recap" id="projection-recap" aria-label="Addition affichée" hidden>
        <strong id="projection-problem">584 + 279</strong>
        <button class="button button-light" id="edit-problem" type="button">Modifier</button>
      </section>

      <section class="workspace practice-workspace">
        <article class="board-card practice-board">
          <div class="instruction practice-instruction" aria-live="polite" aria-atomic="true">
            <div class="instruction-copy">
              <p id="step-title">Je calcule</p>
              <h2 id="step-sentence"></h2>
              <p class="step-detail" id="step-detail" hidden></p>
              <div class="calculation-prompt" id="calculation-prompt"></div>
              <p class="exchange-memo" id="exchange-memo" hidden></p>
            </div>
            <span id="step-count"></span>
          </div>

          <div class="addition-stage practice-stage">
            <div class="addition-scroll" id="addition-scroll">
              <div id="posed-addition"></div>
            </div>
            <div class="verification-relation" id="verification-relation" hidden aria-label="Vérification de l’addition"></div>
          </div>

          <div class="practice-actions">
            <button class="button button-light help-button" id="help" type="button">Un indice</button>
            <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
            <button class="button button-primary validate-button" id="validate" type="button">Vérifier l’étape</button>
          </div>
          <div class="practice-progress" role="progressbar" aria-label="Progression dans l’addition" aria-valuemin="0"><span id="progress-bar"></span></div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <span>Gwenaël Bourgault</span><span aria-hidden="true">·</span>
      <a href="mailto:gwenael@mathsgo.re?subject=Contact%20depuis%20mathsgo.re">Me contacter</a><span aria-hidden="true">·</span>
      <a href="../toutes-les-ressources.html">Toutes les ressources</a><span aria-hidden="true">·</span>
      <a href="../../mentions-legales.html">Mentions légales</a><span aria-hidden="true">·</span>
      <a href="../../confidentialite.html">Confidentialité</a><span aria-hidden="true">·</span>
      <a href="../../licence.html">Licence</a><span aria-hidden="true">·</span>
      <span data-mathsgo-confidentialite>Sans cookie ni traceur</span>
    </footer>
  </div>
</body>
</html>
