  function svgPointFromEvent(e){
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function mobileSvgViewHeight(){
    // Réception au téléphone : le dessin épouse la hauteur réelle du cadre.
    const width = Math.max(1, svg.clientWidth || 1600);
    const height = Math.max(1, svg.clientHeight || 1050);
    return clamp(Math.round(1600 * height / width), 980, 1420);
  }

  function desktopSvgViewHeight(){
    // Ordinateur / tablette : le dessin épouse la forme réelle du cadre (PATCH ESPACE 2026-08-22).
    // Avant, le viewBox 1600×820 était figé : dans un cadre plus plat, le tableau
    // n'occupait que la moitié de la largeur et laissait du gris vide de chaque côté.
    const width = svg.clientWidth || 0;
    const height = svg.clientHeight || 0;
    if(width < 50 || height < 50) return 820;
    return clamp(Math.round(1600 * height / width), 700, 1100);
  }

  function getTrayForSide(side){
    if(isPhoneLayout()){
      return side === "left"
        ? {x:24, y:34, w:736, h:1212}
        : {x:840, y:34, w:736, h:1212};
    }
    if(isMobileImportLayout()){
      const viewHeight = mobileSvgViewHeight();
      return side === "left"
        ? {x:8, y:36, w:760, h:viewHeight-72}
        : {x:832, y:36, w:760, h:viewHeight-72};
    }
    const trayHeight = desktopSvgViewHeight() - 170; // 820 − 170 = 650 : géométrie d'origine
    return side === "left"
      ? {x:40, y:74, w:720, h:trayHeight}
      : {x:840, y:74, w:720, h:trayHeight};
  }

  function findFusionCandidate(side, draggedId, cx, cy){
    if(!state || !state[side]) return null;
    const dragged = state[side].find(p => p.id === draggedId);
    if(!dragged || dragged.removed || dragged.type !== "token") return null;

    const tray = getTrayForSide(side);
    const items = renderPiecesForSide(side);
    const positions = layoutItems(tray, items);
    let best = null;
    let bestDist = Infinity;

    for(const other of activePieces(side)){
      if(other.id === draggedId || other.type !== "token" || other.removed) continue;
      const pos = positions.get(other.id);
      if(!pos) continue;
      const dist = Math.hypot(cx - pos.cx, cy - pos.cy);
      // Fusion seulement si on dépose vraiment le jeton sur l'autre :
      // seuil assoupli : il faut déposer franchement sur l’autre jeton,
      // mais sans devoir viser parfaitement le centre.
      const threshold = (dragged.unit || other.unit)
        ? (tokenRadius(dragged) + tokenRadius(other)) * 0.95
        : tokenRadius() * 1.55;
      if(dist < threshold && dist < bestDist){
        best = other;
        bestDist = dist;
      }
    }
    return best;
  }

  function openFusionDialog(side, sourceId, targetId){
    const source = state && state[side] ? state[side].find(p => p.id === sourceId) : null;
    const target = state && state[side] ? state[side].find(p => p.id === targetId) : null;
    if(!source || !target || source.removed || target.removed) return;
    if(source.type !== "token" || target.type !== "token") return;

    const a = Number(target.value);
    const b = Number(source.value);
    if(!isRelativeUniverse() && (a < 0 || b < 0)) return;
    const expected = a + b;
    pendingFusion = {side, sourceId, targetId, a, b, expected};
    fusionDialogText.innerHTML = `${formatFusionTerm(a)} + ${formatFusionTerm(b)} = ?`;
    fusionInput.value = "";
    fusionFeedback.textContent = "";
    openAppDialog(fusionDialog, fusionInput, {
      allowMinus:isRelativeUniverse(),
      submitLabel:"Fusionner",
      onSubmit:applyFusion
    });
  }

  function removeTransientZero(side, id){
    if(!state || !state[side]) return;
    const idx = state[side].findIndex(p => p.id === id && p.type === "token" && Number(p.value) === 0);
    if(idx < 0) return;
    state[side].splice(idx, 1);
    updateCurrentEquationStep();
    render();
    setInstruction("La paire nulle vaut 0 : elle disparaît du plateau.");
  }

  function applyFusion(){
    if(!pendingFusion) return;
    const answer = Number(fusionInput.value);
    if(!Number.isFinite(answer)){
      fusionFeedback.textContent = "Écris un nombre.";
      return;
    }
    if(answer !== pendingFusion.expected){
      fusionFeedback.textContent = "Ce n’est pas encore le bon résultat.";
      fusionInput.select();
      return;
    }

    const {side, sourceId, targetId, expected} = pendingFusion;
    const arr = state && state[side] ? state[side] : null;
    if(!arr) return;
    const source = arr.find(p => p.id === sourceId);
    const target = arr.find(p => p.id === targetId);
    if(!source || !target || source.removed || target.removed) return;

    pushHistory();
    const merged = makeToken(expected);
    const sx = Number.isFinite(source.x) ? source.x : null;
    const sy = Number.isFinite(source.y) ? source.y : null;
    const tx = Number.isFinite(target.x) ? target.x : null;
    const ty = Number.isFinite(target.y) ? target.y : null;
    merged.x = Number.isFinite(sx) && Number.isFinite(tx) ? (sx + tx) / 2 : (Number.isFinite(sx) ? sx : tx);
    merged.y = Number.isFinite(sy) && Number.isFinite(ty) ? (sy + ty) / 2 : (Number.isFinite(sy) ? sy : ty);
    if(expected === 0) merged.transientZero = true;

    const firstIndex = Math.min(arr.findIndex(p => p.id === sourceId), arr.findIndex(p => p.id === targetId));
    const filtered = arr.filter(p => p.id !== sourceId && p.id !== targetId);
    filtered.splice(firstIndex, 0, merged);
    state[side] = filtered;

    pendingFusion = null;
    fusionDialog.close();
    recordEquationStep();
    render();
    if(expected === 0){
      setInstruction("Paire nulle : <strong>0</strong> apparaît, puis disparaît.");
      setTimeout(() => removeTransientZero(side, merged.id), 950);
    }else{
      setInstruction(`Jetons fusionnés : <strong>${formatSignedNumber(expected)}</strong>.`);
    }
  }

  function beginTokenDrag(e, side, item, pos, group){
    if(item.removed || item.type !== "token") return;
    if(e.button !== undefined && e.button !== 0) return;
    const p = svgPointFromEvent(e);
    dragState = {
      side,
      id:item.id,
      group,
      startSvg:p,
      startCx:pos.cx,
      startCy:pos.cy,
      cx:pos.cx,
      cy:pos.cy,
      moved:false
    };
    try{ group.setPointerCapture(e.pointerId); }catch(_e){}
  }

  function moveTokenDrag(e){
    if(!dragState) return;
    const p = svgPointFromEvent(e);
    const tray = getTrayForSide(dragState.side);
    const draggedPiece = state && state[dragState.side] ? state[dragState.side].find(piece => piece.id === dragState.id) : null;
    const next = clampTokenPosition(tray, dragState.startCx + (p.x - dragState.startSvg.x), dragState.startCy + (p.y - dragState.startSvg.y), tokenRadius(draggedPiece), false);
    const dx = next.cx - dragState.startCx;
    const dy = next.cy - dragState.startCy;
    if(Math.hypot(dx, dy) > 3) dragState.moved = true;
    dragState.cx = next.cx;
    dragState.cy = next.cy;
    dragState.group.classList.toggle("dragging", dragState.moved);
    dragState.group.setAttribute("transform", `translate(${dx} ${dy})`);
    if(dragState.moved) e.preventDefault();
  }

  function endTokenDrag(e){
    if(!dragState) return;
    const ds = dragState;
    dragState = null;
    try{ ds.group.releasePointerCapture(e.pointerId); }catch(_e){}
    ds.group.classList.remove("dragging");
    ds.group.removeAttribute("transform");
    if(ds.moved){
      const piece = state && state[ds.side] ? state[ds.side].find(p => p.id === ds.id) : null;
      let fusionTarget = null;
      if(piece){
        const safe = clampTokenPosition(getTrayForSide(ds.side), ds.cx, ds.cy, tokenRadius(piece), true, ds.side);
        piece.x = safe.cx;
        piece.y = safe.cy;
        fusionTarget = findFusionCandidate(ds.side, ds.id, safe.cx, safe.cy);
      }
      suppressNextClickFor = ds.id;
      render();
      if(fusionTarget){
        setTimeout(()=>openFusionDialog(ds.side, ds.id, fusionTarget.id), 40);
      }
    }
  }

  function drawItem(side, item, pos, selectedIds, groupSelectedIds){
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    if(item.type === "token") g.classList.add("tokenDragGroup");
    if(item.type === "token" && item.transientZero) g.classList.add("transientZero");
    if(item.removed) g.classList.add("removedGroup");
    g.dataset.side = side;
    g.dataset.id = item.id;
    svg.appendChild(g);

    if(item.type === "x"){
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r));
      path.setAttribute("class", xSign(item) < 0 ? "splatShape oppositeX" : "splatShape");
      g.appendChild(path);
      drawText(pos.cx, pos.cy + 5, xPieceLabel(item), "splatText", g);
      if(item.removed){
        const overlay = document.createElementNS("http://www.w3.org/2000/svg", "path");
        overlay.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r));
        overlay.setAttribute("class", "removedOverlay");
        g.appendChild(overlay);
      }
      if(selectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
        outline.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r+12));
        outline.setAttribute("class", "selectedOutline");
        g.appendChild(outline);
      }
      if(groupSelectedIds && groupSelectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
        outline.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r+12));
        outline.setAttribute("class", "groupSelectedOutline");
        g.appendChild(outline);
      }
    }else{
      const hit = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      hit.setAttribute("cx", pos.cx);
      hit.setAttribute("cy", pos.cy);
      hit.setAttribute("r", pos.r + tokenHitExtra(item));
      hit.setAttribute("fill", "transparent");
      hit.setAttribute("class", "tokenHitArea");
      g.appendChild(hit);

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", pos.cx);
      circle.setAttribute("cy", pos.cy);
      circle.setAttribute("r", pos.r);
      const tokenClass = Number(item.value) < 0
        ? "tokenCircle negative"
        : (Number(item.value) === 0 ? "tokenCircle zero" : (isRelativeUniverse() ? "tokenCircle positive relativePositive" : "tokenCircle positive"));
      circle.setAttribute("class", tokenClass);
      if(!isRelativeUniverse() && Number(item.value) > 0){
        const col = positiveTokenColorForValue(item.value);
        // Style inline pour éviter que la classe .tokenCircle.positive écrase
        // les couleurs variées du Splat positif.
        circle.style.fill = col.fill;
        circle.style.stroke = col.stroke;
      }
      g.appendChild(circle);
      if(item.unit){
        // Les jetons unitaires importés du mode primaire restent de petites billes bleues,
        // sans chiffre apparent, comme dans Splat Équations.
        circle.style.fill = "rgba(27,102,255,0.18)";
        circle.style.stroke = "rgba(27,102,255,0.58)";
      }else{
        drawText(pos.cx, pos.cy + 2, formatSignedNumber(item.value), "tokenText", g);
      }
      if(item.removed){
        const overlay = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        overlay.setAttribute("cx", pos.cx);
        overlay.setAttribute("cy", pos.cy);
        overlay.setAttribute("r", pos.r);
        overlay.setAttribute("class", "removedOverlay");
        g.appendChild(overlay);
      }
      if(selectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        outline.setAttribute("cx", pos.cx);
        outline.setAttribute("cy", pos.cy);
        outline.setAttribute("r", pos.r+12);
        outline.setAttribute("class", "selectedOutline");
        g.appendChild(outline);
      }
      if(groupSelectedIds && groupSelectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        outline.setAttribute("cx", pos.cx);
        outline.setAttribute("cy", pos.cy);
        outline.setAttribute("r", pos.r+12);
        outline.setAttribute("class", "groupSelectedOutline");
        g.appendChild(outline);
      }
    }

    if(item.type === "token"){
      g.addEventListener("pointerdown", (e) => beginTokenDrag(e, side, item, pos, g));
      g.addEventListener("pointermove", moveTokenDrag);
      g.addEventListener("pointerup", endTokenDrag);
      g.addEventListener("pointercancel", endTokenDrag);
    }

    g.addEventListener("click", (e) => {
      if(suppressNextClickFor === item.id){
        suppressNextClickFor = null;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if(item.removed) return;
      dismissInitialEqualityInstruction();
      if(actionMode === "decompose"){
        if(item.type === "token") openDecomposeDialog(side, item.id);
        else setInstruction("En mode Décomposer, clique sur un jeton numérique.");
        return;
      }
      if(actionMode === "group"){
        if(item.type === "token" || (item.type === "x" && oppositeXEnabled())) selectForGrouping(side, item.id);
        else setInstruction(oppositeXEnabled()
          ? "En mode Regrouper, clique sur des jetons numériques ou des taches opposées."
          : "En mode Regrouper, clique sur des jetons numériques.");
        return;
      }
    if(actionMode === "share"){
        if(item.type === "token") openShareDialog(side, item.id);
        else setInstruction("En mode Partager, clique sur un jeton numérique.");
        return;
      }
      if(actionMode === "delete") selectForDeletion(side, item.id);
    });
  }

  /* MODE RÉCEPTION — paquets de billes (« Faire des paquets »). */
  function clearUnitPacketChoiceIfInvalid(){
    if(!unitPacketChoice || !state) return;
    const pieces = activePieces(unitPacketChoice.side || "right");
    const tokenCount = pieces.filter(p => p.type === "token" && p.unit && Number(p.value) === 1).length;
    if(tokenCount !== unitPacketChoice.tokenCount){
      unitPacketChoice = null;
      clearUnitPacketConclusion();
    }
  }

  function packetGridForTray(tray, packetCount){
    packetCount = Math.max(1, Math.round(Number(packetCount) || 1));
    const cols = Math.ceil(Math.sqrt(packetCount));
    const rows = Math.ceil(packetCount / cols);
    const pad = 34;
    const gap = 14;
    const boxW = (tray.w - pad*2 - gap*(cols-1)) / cols;
    const boxH = (tray.h - 96 - pad - gap*(rows-1)) / rows;
    const boxes = [];
    for(let i=0; i<packetCount; i++){
      const col = i % cols;
      const row = Math.floor(i / cols);
      boxes.push({
        x:tray.x + pad + col*(boxW + gap),
        y:tray.y + 78 + row*(boxH + gap),
        w:boxW,
        h:boxH,
        index:i
      });
    }
    return boxes;
  }

  function positionsInPacketBox(box, count){
    const r = TOKEN_UNIT_R;
    const pad = 24;
    const cols = Math.max(1, Math.floor((box.w - pad*2) / (r*2 + 8)));
    const rows = Math.max(1, Math.ceil(count / cols));
    const stepX = count === 1 ? 0 : Math.min(r*2 + 12, (box.w - pad*2) / Math.max(1, Math.min(cols, count) - 1 || 1));
    const stepY = rows <= 1 ? 0 : Math.min(r*2 + 10, (box.h - pad*2 - 18) / Math.max(1, rows - 1));
    const startY = box.y + box.h/2 - ((rows - 1) * stepY)/2 + 8;
    const positions = [];
    for(let i=0; i<count; i++){
      const row = Math.floor(i / cols);
      const col = i % cols;
      const usedCols = Math.min(cols, count - row*cols);
      const startX = box.x + box.w/2 - ((usedCols - 1) * stepX)/2;
      positions.push({cx:startX + col*stepX, cy:startY + row*stepY, r});
    }
    return positions;
  }

  function applyUnitPacketPositions(){
    if(!unitPacketChoice || !state) return null;
    const side = unitPacketChoice.side;
    const activeUnits = activePieces(side).filter(p => p.type === "token" && p.unit && Number(p.value) === 1);
    if(activeUnits.length !== unitPacketChoice.tokenCount){
      unitPacketChoice = null;
      return null;
    }
    const tray = getTrayForSide(side);
    const boxes = packetGridForTray(tray, unitPacketChoice.packetCount);
    let cursor = 0;
    boxes.forEach((box, packetIndex) => {
      const positions = positionsInPacketBox(box, unitPacketChoice.each);
      for(let i=0; i<unitPacketChoice.each && cursor < activeUnits.length; i++, cursor++){
        activeUnits[cursor].x = positions[i].cx;
        activeUnits[cursor].y = positions[i].cy;
        activeUnits[cursor].packetIndex = packetIndex;
      }
    });
    return {side, boxes};
  }

  function drawUnitPacketBoxes(packetLayout){
    if(!packetLayout || !unitPacketChoice || !state) return;
    const side = unitPacketChoice.side;
    const units = activePieces(side).filter(p => p.type === "token" && p.unit && Number(p.value) === 1 && Number.isFinite(Number(p.packetIndex)));
    const groups = new Map();
    for(const p of units){
      const idx = Math.round(Number(p.packetIndex) || 0);
      if(!groups.has(idx)) groups.set(idx, []);
      groups.get(idx).push(p);
    }
    const tray = getTrayForSide(side);
    for(let i=0; i<unitPacketChoice.packetCount; i++){
      const group = groups.get(i) || [];
      if(!group.length) continue;
      const r = TOKEN_UNIT_R;
      const pad = 12;
      const minX = Math.min(...group.map(p => Number(p.x) || 0));
      const maxX = Math.max(...group.map(p => Number(p.x) || 0));
      const minY = Math.min(...group.map(p => Number(p.y) || 0));
      const maxY = Math.max(...group.map(p => Number(p.y) || 0));
      let x = minX - r - pad;
      let y = minY - r - pad;
      let w = (maxX - minX) + 2*r + 2*pad;
      let h = (maxY - minY) + 2*r + 2*pad;
      const minW = r*2 + 2*pad + 4;
      const minH = r*2 + 2*pad + 4;
      if(w < minW){ x -= (minW - w)/2; w = minW; }
      if(h < minH){ y -= (minH - h)/2; h = minH; }
      if(tray){
        x = clamp(x, tray.x + 12, tray.x + tray.w - w - 12);
        y = clamp(y, tray.y + 56, tray.y + tray.h - h - 12);
      }
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", w);
      rect.setAttribute("height", h);
      rect.setAttribute("rx", 16);
      rect.setAttribute("class", `packetBox${unitPacketChoice.isCorrect ? " matchXCount" : ""}`);
      svg.appendChild(rect);
    }
  }

  function drawPendingShareGroups(viewHeight){
    const pending = state && state.pendingShareConclusion;
    if(!pending || pending.count < 2) return false;

    const count = pending.count;
    const cols = count <= 3 ? 1 : 2;
    const rows = Math.ceil(count / cols);
    const outer = 28;
    const gap = 20;
    const cardW = (1600 - outer*2 - gap*(cols-1)) / cols;
    const cardH = (viewHeight - outer*2 - gap*(rows-1)) / rows;

    for(let index=0; index<count; index++){
      const row = Math.floor(index / cols);
      const col = index % cols;
      const isCenteredLast = cols === 2 && count % 2 === 1 && index === count - 1;
      const x = isCenteredLast ? (1600 - cardW)/2 : outer + col*(cardW + gap);
      const y = outer + row*(cardH + gap);
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "pendingShareGroup");
      g.style.animationDelay = `${index * 110}ms`;
      g.setAttribute("role", "button");
      g.setAttribute("tabindex", "0");
      const leftLabel = pending.xSide === "left" ? displayedUnknown() : formatSignedNumber(pending.each);
      const rightLabel = pending.xSide === "right" ? displayedUnknown() : formatSignedNumber(pending.each);
      g.setAttribute("aria-label", `Mini-plateau ${index + 1} sur ${count} : ${leftLabel} à gauche et ${rightLabel} à droite. Choisir ce plateau.`);
      g.dataset.pendingShareGroup = String(index);

      const card = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      card.setAttribute("x", x);
      card.setAttribute("y", y);
      card.setAttribute("width", cardW);
      card.setAttribute("height", cardH);
      card.setAttribute("rx", Math.min(30, cardH*.14));
      card.setAttribute("class", "pendingShareGroupCard");
      g.appendChild(card);

      const centerY = y + cardH/2;
      const leftX = x + cardW*.29;
      const dividerX = x + cardW*.50;
      const rightX = x + cardW*.71;
      const splatX = pending.xSide === "left" ? leftX : rightX;
      const tokenX = pending.tokenSide === "left" ? leftX : rightX;
      const splatR = Math.min(94, cardH*.28, cardW*.13);
      const tokenR = Math.min(66, cardH*.22, cardW*.10);

      const splat = document.createElementNS("http://www.w3.org/2000/svg", "path");
      splat.setAttribute("d", blobPath(splatX, centerY, splatR));
      splat.setAttribute("class", "splatShape");
      g.appendChild(splat);
      drawText(splatX, centerY + 5, displayedUnknown(), "splatText", g);

      const divider = document.createElementNS("http://www.w3.org/2000/svg", "line");
      divider.setAttribute("x1", dividerX);
      divider.setAttribute("x2", dividerX);
      divider.setAttribute("y1", y);
      divider.setAttribute("y2", y + cardH);
      divider.setAttribute("class", "pendingShareDivider");
      g.appendChild(divider);

      const token = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      token.setAttribute("cx", tokenX);
      token.setAttribute("cy", centerY);
      token.setAttribute("r", tokenR);
      token.setAttribute("class", Number(pending.each) < 0 ? "tokenCircle negative" : "tokenCircle positive");
      if(!isRelativeUniverse() && Number(pending.each) > 0){
        const color = positiveTokenColorForValue(pending.each);
        token.style.fill = color.fill;
        token.style.stroke = color.stroke;
      }
      g.appendChild(token);
      drawText(tokenX, centerY + 2, formatSignedNumber(pending.each), "tokenText", g);

      const choose = () => {
        const fresh = state && state.pendingShareConclusion;
        if(!fresh || fresh.finalizing || fresh.id !== pending.id) return;
        fresh.finalizing = true;
        const groups = svg.querySelectorAll(".pendingShareGroup");
        groups.forEach((group, groupIndex) => group.classList.add(groupIndex === index ? "chosen" : "discarded"));
        setTimeout(() => finalizePendingShare(pending.id), 420);
      };
      g.addEventListener("click", choose);
      g.addEventListener("keydown", event => {
        if(event.key === "Enter" || event.key === " "){
          event.preventDefault();
          choose();
        }
      });
      svg.appendChild(g);
    }
    return true;
  }

  function renderSvg(){
    svg.innerHTML = "";
    const viewHeight = isMobileImportLayout() ? mobileSvgViewHeight() : (isPhoneLayout() ? 1280 : desktopSvgViewHeight());
    svg.setAttribute("viewBox", `0 0 1600 ${viewHeight}`);
    drawDefs();
    if(drawPendingShareGroups(viewHeight)) return;
    const leftTray = getTrayForSide("left");
    const rightTray = getTrayForSide("right");
    drawSharedTray(leftTray, rightTray);

    clearUnitPacketChoiceIfInvalid();
    const packetLayout = applyUnitPacketPositions();
    const leftItems = renderPiecesForSide("left");
    const rightItems = renderPiecesForSide("right");
    const leftPos = layoutItems(leftTray, leftItems, state.left);
    const rightPos = layoutItems(rightTray, rightItems, state.right);
    drawUnitPacketBoxes(packetLayout);
    const selectedIds = selectedDeleteIds();
    const groupSelectedIds = selectedGroupIds();
    leftItems.forEach(item => drawItem("left", item, leftPos.get(item.id), selectedIds, groupSelectedIds));
    rightItems.forEach(item => drawItem("right", item, rightPos.get(item.id), selectedIds, groupSelectedIds));
  }


  function miniSplatButtonHtml(sign){
    const v = currentVar();
    const label = sign < 0 ? `−${v}` : v;
    const fill = sign < 0 ? "#4c1d95" : "#111827";
    return `<span class="miniSplatWrap"><span>Ajouter</span><svg class="miniSplatSvg" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path d="${blobPath(60, 60, 43)}" fill="${fill}" stroke="rgba(0,0,0,.22)" stroke-width="3"></path><text x="60" y="64">${label}</text></svg></span>`;
  }

  function openAddBothDialog(){
    if(!state) return;
    dismissInitialEqualityInstruction();
    addBothInput.value = "";
    addBothFeedback.textContent = "";
    const canAddX = oppositeXEnabled();
    const v = currentVar();
    if(isRelativeUniverse()){
      addBothDialogText.textContent = canAddX
        ? "Ajoute le même jeton numérique, ou la même tache, dans chaque membre."
        : "Ajoute le même jeton dans chaque membre. Tu peux écrire une valeur positive ou négative.";
      addBothInput.min = "-99";
    }else{
      addBothDialogText.textContent = "Ajoute le même jeton positif dans chaque membre.";
      addBothInput.min = "1";
    }
    addBothInput.max = "99";
    if(addBothXChoices) addBothXChoices.classList.toggle("open", canAddX);
    if(addBothXCount) addBothXCount.value = "1";
    if(btnAddBothPositiveX) btnAddBothPositiveX.innerHTML = miniSplatButtonHtml(1);
    if(btnAddBothNegativeX) btnAddBothNegativeX.innerHTML = miniSplatButtonHtml(-1);
    openAppDialog(addBothDialog, addBothInput, {
      allowMinus:isRelativeUniverse(),
      submitLabel:"Ajouter",
      onSubmit:applyAddBoth
    });
    if(usesTouchKeypad() && addBothXCount) prepareTouchInput(addBothXCount);
  }

  function finishAddBothAction(operation=null){
    deleteSelection = [];
    groupSelection = [];
    selectedPieceRef = null;
    recordEquationStep(operation);
    addBothDialog.close();
    render();
  }

  function applyAddBoth(){
    if(!state) return;
    const raw = Number(addBothInput.value);
    if(!Number.isFinite(raw) || Math.round(raw) !== raw || raw === 0){
      addBothFeedback.textContent = isRelativeUniverse() ? "Écris un entier non nul, positif ou négatif." : "Écris un entier positif non nul.";
      addBothInput.select();
      return;
    }

    const value = Math.round(raw);
    if(!isRelativeUniverse() && value < 0){
      addBothFeedback.textContent = "Dans Splat positif, on n’ajoute que des jetons positifs.";
      addBothInput.select();
      return;
    }
    pushHistory();
    state.left.push(makeToken(value));
    state.right.push(makeToken(value));
    finishAddBothAction(makeBothSidesOperation(formatSignedOperationNumber(value)));
  }

  function applyAddBothX(sign){
    if(!state || !oppositeXEnabled()) return;
    const rawCount = addBothXCount ? Number(addBothXCount.value) : 1;
    const count = Math.round(rawCount);
    if(!Number.isFinite(rawCount) || count < 1 || count > 8){
      addBothFeedback.textContent = "Choisis un nombre de taches entre 1 et 8.";
      if(addBothXCount) addBothXCount.select();
      return;
    }
    pushHistory();
    for(let i=0; i<count; i++){
      state.left.push(makeX(sign));
      state.right.push(makeX(sign));
    }
    finishAddBothAction(makeBothSidesOperation(formatSignedOperationX(sign * count)));
  }

  function takeOppositeOfBothMembers(){
    if(!state || !oppositeXEnabled()) return;
    pushHistory();
    for(const side of ["left", "right"]){
      for(const piece of state[side]){
        if(piece.removed) continue;
        if(piece.type === "token") piece.value = -Number(piece.value || 0);
        if(piece.type === "x") piece.sign = -xSign(piece);
      }
    }
    deleteSelection = [];
    groupSelection = [];
    selectedPieceRef = null;
    recordEquationStep(makeBothSidesOperation("×(−1)"));
    render();
  }

  /* MODE RÉCEPTION — billes unitaires de Splat Équations : « Faire des paquets ». */
  function isImportedUnitMode(){
    return importedNumberMode === "unit" || document.body.classList.contains("importUnitMode");
  }

  function sideOnlyPositiveX(pieces){
    return pieces.length > 0 && pieces.every(p => p.type === "x" && xSign(p) > 0);
  }

  function sideOnlyUnitTokens(pieces){
    return pieces.length > 0 && pieces.every(p => p.type === "token" && p.unit && Number(p.value) === 1);
  }

  function divisorsOf(n){
    n = Math.max(1, Math.round(Number(n) || 1));
    const out = [];
    for(let d=1; d<=n; d++){
      if(n % d === 0) out.push(d);
    }
    return out;
  }

  function getUnitShareSituation(){
    if(!state || !isImportedUnitMode()) return null;
    const left = activePieces("left");
    const right = activePieces("right");

    function build(varSide, tokenSide, xPieces, tokenPieces){
      const xCount = xPieces.length;
      const tokenCount = tokenPieces.length;
      if(xCount <= 1 || tokenCount <= 0) return null;
      return {
        varSide,
        tokenSide,
        xCount,
        tokenCount,
        choices:divisorsOf(tokenCount).map(packetCount => ({packetCount, each: tokenCount / packetCount}))
      };
    }

    if(sideOnlyPositiveX(left) && sideOnlyUnitTokens(right)){
      return build("left", "right", left, right);
    }
    if(sideOnlyUnitTokens(left) && sideOnlyPositiveX(right)){
      return build("right", "left", right, left);
    }
    return null;
  }

  function getUnitShareOpportunity(){
    const situation = getUnitShareSituation();
    if(!situation || situation.tokenCount % situation.xCount !== 0) return null;
    return {...situation, each:situation.tokenCount / situation.xCount};
  }

  function clearUnitPacketConclusion(){
    if(!state) return;
    if(state._unitPacketConclusion && Array.isArray(state.steps) && state.steps.length){
      state.steps.pop();
      if(Array.isArray(state.stepOps) && state.stepOps.length) state.stepOps.pop();
    }
    delete state._unitPacketConclusion;
  }

  function addUnitPacketConclusion(value, operationLabel, varSide="left"){
    if(!state) return;
    const n = Math.round(Number(value) || 0);
    const unknown = displayedUnknown();
    // Comme la conclusion ordinaire, on garde l'inconnue du côté où elle était.
    const eq = varSide === "right" ? `${n} = ${unknown}` : `${unknown} = ${n}`;
    if(!Array.isArray(state.steps)) state.steps = [];
    if(!Array.isArray(state.stepOps)) state.stepOps = [];
    if(state.steps[state.steps.length - 1] !== eq){
      if(state.steps.length > 0) state.stepOps.push(makeBothSidesOperation(operationLabel));
      state.steps.push(eq);
    }
    state._unitPacketConclusion = true;
  }

  function applyUnitPacketChoice(packetCount){
    const situation = getUnitShareSituation();
    packetCount = Math.round(Number(packetCount) || 0);
    if(!situation || packetCount <= 0 || situation.tokenCount % packetCount !== 0){
      setInstruction("Choisis un partage possible des jetons.");
      return;
    }

    pushHistory();
    clearUnitPacketConclusion();

    const each = situation.tokenCount / packetCount;
    const isCorrectShare = packetCount === situation.xCount;
    unitPacketChoice = {
      side:situation.tokenSide,
      packetCount,
      each,
      xCount:situation.xCount,
      tokenCount:situation.tokenCount,
      isCorrect:!!isCorrectShare
    };

    if(isCorrectShare){
      addUnitPacketConclusion(each, `÷ ${situation.xCount}`, situation.varSide);
    }

    deleteSelection = [];
    groupSelection = [];
    selectedPieceRef = null;
    pendingFusion = null;
    actionMode = "delete";
    render();
    setInstruction("");
  }

  function applyUnitShareTokens(){
    dismissInitialEqualityInstruction();
    const situation = getUnitShareSituation();
    if(!situation){
      setInstruction("On peut faire des paquets quand il ne reste que plusieurs taches d’un côté et des jetons unitaires de l’autre.");
      return;
    }
    actionMode = "unitShare";
    render();
  }

  function renderActions(){
    actionZone.innerHTML = "";
    solutionEl.textContent = "";

    if(state && state.pendingShareConclusion){
      const count = state.pendingShareConclusion.count;
      setInstruction(`<span class="shareInstruction"><strong>${count} groupes identiques</strong> — touche-en un.</span>`);
      return;
    }

    if(isImportedUnitMode()){
      const situation = getUnitShareSituation();
      if(situation){
        setInstruction(`Il reste <strong>${situation.xCount}</strong> taches et <strong>${situation.tokenCount}</strong> jetons : on peut faire des paquets.`);
      }else if(actionMode !== "delete"){
        setInstruction("Avec les petites billes, utilise surtout <strong>Enlever dans chaque membre</strong>, puis <strong>Faire des paquets</strong> quand il ne reste que des taches d’un côté.");
      }
    }

    const conclusionInfo = getConclusionInfo();
    if(conclusionInfo){
      if(conclusionInfo.count === 1 || (state && state.conclusionDone)){
        setInstruction("");
        return;
      }
      setInstruction("On voit maintenant la valeur d’une tache. On peut conclure.");
      const btn = document.createElement("button");
      btn.className = "green";
      btn.textContent = "Conclure";
      btn.addEventListener("click", concludeSolution);
      actionZone.appendChild(btn);
      return;
    }

    if(actionMode === "unitShare"){
      const situation = getUnitShareSituation();
      if(!situation){
        setInstruction("On peut faire des paquets quand il ne reste que plusieurs taches d’un côté et des jetons unitaires de l’autre.");
        return;
      }
      setInstruction(`Choisis comment ranger les <strong>${situation.tokenCount}</strong> jetons en paquets.`);
      const row = document.createElement("div");
      row.className = "btnrow";
      for(const choice of situation.choices){
        const btn = document.createElement("button");
        btn.className = "unitPacketChoice";
        btn.textContent = `${choice.packetCount} paquet${choice.packetCount > 1 ? "s" : ""} de ${choice.each}`;
        btn.addEventListener("click", () => applyUnitPacketChoice(choice.packetCount));
        row.appendChild(btn);
      }
      actionZone.appendChild(row);
      return;
    }

    if(actionMode === "decompose"){
      setInstruction("Décompose un jeton numérique.");
      return;
    }

    if(actionMode === "group"){
      const info = groupSelectionInfo();
      const selected = selectedGroupPieces();
      if(selected.length === 0){
        setInstruction(oppositeXEnabled()
          ? "Sélectionne plusieurs jetons numériques d’un même membre, ou une paire de taches opposées."
          : "Sélectionne plusieurs jetons numériques d’un même membre.");
        return;
      }

      const btn = document.createElement("button");
      btn.className = "green";
      btn.textContent = "Regrouper";
      btn.addEventListener("click", () => {
        const freshInfo = groupSelectionInfo();
        if(freshInfo.ok && freshInfo.kind === "zeroX") applyZeroXGroup(freshInfo);
        else openGroupDialog();
      });

      const clear = document.createElement("button");
      clear.className = "ghost";
      clear.textContent = "Effacer";
      clear.addEventListener("click", () => { groupSelection = []; render(); });

      if(!info.ok){
        let message = "Sélectionne au moins deux éléments compatibles.";
        if(info.reason === "differentSides") message = "Regroupe seulement des éléments du même membre.";
        else if(info.reason === "mixedTypes") message = "Ne mélange pas jetons numériques et taches.";
        else if(info.reason === "notZeroX") message = "Pour regrouper des taches, sélectionne autant de taches positives que de taches opposées.";
        else if(info.reason === "oppositeDisabled") message = "Les taches opposées doivent être activées pour regrouper x et −x.";
        setInstruction(message);
        actionZone.appendChild(clear);
        return;
      }

      if(info.kind === "zeroX"){
        setInstruction("Paire nulle sélectionnée : <strong>x + (−x) = 0</strong>.");
        actionZone.appendChild(btn);
        actionZone.appendChild(clear);
        return;
      }

      setInstruction(`<strong>${selected.length}</strong>&nbsp;jetons sélectionnés. Calcule leur somme pour les regrouper.`);
      actionZone.appendChild(btn);
      actionZone.appendChild(clear);
      return;
    }

    if(actionMode === "share"){
      const suggested = getShareOpportunity();
      if(suggested){
        setInstruction(`Partage&nbsp;<strong>${formatSignedNumber(suggested.token.value)}</strong>&nbsp;en <strong>${suggested.count}</strong> parts égales.`);
      }else{
        setInstruction("Partage un jeton en parts égales.");
      }
      return;
    }

    if(actionMode === "delete"){
      const info = deletionGroupInfo();
      const zeroInfo = zeroXPairSelectionInfo();
      const {left, right} = selectedDeletePiecesBySide();
      if(left.length === 0 && right.length === 0){
        setInstruction(oppositeXEnabled()
          ? "Sélectionne la même quantité dans les deux membres, ou une paire x / −x dans un même membre."
          : "Sélectionne la même quantité dans les deux membres.");
        return;
      }
      if(zeroInfo.ok){
        setInstruction("Paire nulle sélectionnée : <strong>x + (−x) = 0</strong>.");
        const btn = document.createElement("button");
        btn.className = "green";
        btn.textContent = "Annuler la paire";
        btn.addEventListener("click", cancelZeroXPair);
        actionZone.appendChild(btn);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
        return;
      }
      if(left.length === 0 || right.length === 0){
        let message = "Sélectionne maintenant l’autre membre.";
        if(oppositeXEnabled() && (left.length || right.length)){
          const selected = left.length ? left : right;
          if(selected.every(p => p.type === "x")){
            const coef = selected.reduce((sum,p)=>sum + xSign(p), 0);
            if(coef !== 0) message = "Pour annuler dans un même membre, sélectionne autant de taches x que de taches −x.";
          }
        }
        setInstruction(message);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
        return;
      }
      if(info.ok){
        setInstruction(`Même quantité sélectionnée :&nbsp;<strong>${info.label}</strong>.`);
        const btn = document.createElement("button");
        btn.className = "orange";
        btn.textContent = "Valider la suppression";
        btn.addEventListener("click", deleteMatching);
        actionZone.appendChild(btn);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer la sélection";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
      }else{
        let reason = "Les deux quantités sélectionnées ne sont pas identiques.";
        if(info.reason === "differentCounts") reason = "Il faut le même nombre de taches de chaque côté.";
        else if(info.reason === "differentXCoef") reason = "Les taches sélectionnées ne représentent pas la même quantité d’inconnues.";
        else if(info.reason === "zeroXSelection") reason = "Pour annuler une paire nulle, sélectionne les taches x et −x dans un seul même membre.";
        else if(info.reason === "differentSums") reason = "Les jetons sélectionnés ne font pas la même somme.";
        else if(info.reason === "mixedTypes") reason = "Ne mélange pas taches et jetons numériques.";
        setInstruction(reason);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer la sélection";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
      }
    }
  }

  /* MODE RÉCEPTION — zone de validation stable et espace des commandes au téléphone. */
  function stabilizeMobileActionZone(){
    if(!isMobileImportLayout()) return;
    for(const child of Array.from(actionZone.children)){
      if(child.tagName === "BUTTON" && /^Effacer/.test(child.textContent || "")){
        child.remove();
      }
    }

    const children = Array.from(actionZone.children);
    if(children.some(child => child.classList.contains("btnrow"))) return;

    const makePlaceholder = (label) => {
      const button = document.createElement("button");
      button.type = "button";
      button.disabled = true;
      button.className = "actionPlaceholder";
      button.textContent = label;
      return button;
    };

    if(children.length === 0){
      actionZone.appendChild(makePlaceholder("Valider"));
    }
  }

  function syncMobileBottomControlsSpace(){
    if(!mobileBottomControlsEl) return;
    const docked = window.matchMedia(MOBILE_IMPORT_QUERY).matches
      && document.body.classList.contains("importMode")
      && !document.fullscreenElement
      && window.getComputedStyle(mobileBottomControlsEl).position === "fixed";
    const height = docked ? Math.ceil(mobileBottomControlsEl.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty("--mobile-controls-height", `${height}px`);
  }

  if(mobileBottomControlsEl && typeof ResizeObserver === "function"){
    new ResizeObserver(syncMobileBottomControlsSpace).observe(mobileBottomControlsEl);
  }
  window.addEventListener("resize", syncMobileBottomControlsSpace);
  document.addEventListener("fullscreenchange", syncMobileBottomControlsSpace);

  // PATCH ESPACE 2026-08-22 — le plateau suit la taille réelle de son cadre.
  let svgRedrawHandle = 0;
  function scheduleSvgRedraw(){
    if(svgRedrawHandle) cancelAnimationFrame(svgRedrawHandle);
    svgRedrawHandle = requestAnimationFrame(() => {
      svgRedrawHandle = 0;
      if(state && !dragState) renderSvg();
    });
  }
  window.addEventListener("resize", scheduleSvgRedraw);
  document.addEventListener("fullscreenchange", scheduleSvgRedraw);
  if(typeof ResizeObserver === "function"){
    new ResizeObserver(scheduleSvgRedraw).observe(svg);
  }

  // Œil : masquer / afficher l'équation sans faire bouger le plateau (la place reste réservée).
  const btnToggleEquation = document.getElementById("btnToggleEquation");
  const btnToggleUnknown = document.getElementById("btnToggleUnknown");
  function eyeIconSvg(hidden=false){
    if(hidden){
      return `<svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M10.7 5.2A9.4 9.4 0 0 1 12 5c5.2 0 8.7 4.5 9.7 6.1.2.3.2.7 0 1.1a16 16 0 0 1-2.6 3.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.5 6.7A15.8 15.8 0 0 0 2.3 11c-.2.3-.2.7 0 1.1C3.3 13.7 6.8 18 12 18c1.3 0 2.5-.3 3.6-.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.8 9.8a3.1 3.1 0 0 0 4.4 4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>`;
    }
    return `<svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2.3 11.1C3.3 9.5 6.8 5 12 5s8.7 4.5 9.7 6.1c.2.3.2.7 0 1.1C20.7 13.8 17.2 18 12 18S3.3 13.8 2.3 12.2c-.2-.3-.2-.7 0-1.1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="12" cy="11.7" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>`;
  }
  function syncEquationToggleButton(){
    if(!btnToggleEquation || !stageEl) return;
    const hidden = stageEl.classList.contains("equationHidden");
    btnToggleEquation.innerHTML = eyeIconSvg(hidden);
    btnToggleEquation.title = hidden ? "Afficher l’équation" : "Masquer l’équation";
    btnToggleEquation.classList.toggle("is-hidden", hidden);
  }
  if(btnToggleEquation && stageEl){
    btnToggleEquation.addEventListener("click", () => {
      stageEl.classList.toggle("equationHidden");
      syncEquationToggleButton();
    });
    syncEquationToggleButton();
  }

  // Lettre / « ? » : même réglage que le menu, mais accessible pendant l'activité.
  function syncUnknownToggleButton(){
    const btnToggleUnknown = document.getElementById("btnToggleUnknown");
    if(!btnToggleUnknown) return;
    const question = !!(unknownDisplayModeEl && unknownDisplayModeEl.value === "question");
    btnToggleUnknown.textContent = question ? "?" : currentVar();
    btnToggleUnknown.title = question ? "Écrire l’inconnue avec sa lettre" : "Écrire l’inconnue avec un ?";
    btnToggleUnknown.classList.toggle("is-question", question);
  }
  function escapeRegExp(text){ return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function convertUnknownInText(text, toQuestion){
    // Réécrit une ligne déjà dans l'historique avec l'autre écriture de l'inconnue,
    // en suivant exactement formatXTerm : « 3a » ⇄ « 3 × ? », « a » ⇄ « ? ».
    const v = currentVar();
    const str = String(text || "");
    if(toQuestion){
      return str.replace(new RegExp("(\\d+)" + escapeRegExp(v), "g"), "$1 × ?").split(v).join("?");
    }
    return str.replace(/(\d+) × \?/g, `$1${v}`).split("?").join(v);
  }
  if(btnToggleUnknown && unknownDisplayModeEl){
    btnToggleUnknown.addEventListener("click", () => {
      const toQuestion = unknownDisplayModeEl.value !== "question";
      unknownDisplayModeEl.value = toQuestion ? "question" : "letter";
      // Contrairement au menu de départ, on ne repart pas de zéro : les lignes
      // déjà écrites par l'élève sont conservées et réécrites avec la nouvelle écriture.
      if(state && Array.isArray(state.steps)){
        state.steps = state.steps.map(line => convertUnknownInText(line, toQuestion));
      }
      if(state && Array.isArray(state.stepOps)){
        state.stepOps = state.stepOps.map(op => op && op.label ? {...op, label:convertUnknownInText(op.label, toQuestion)} : op);
      }
      syncUnknownToggleButton();
      if(state) render();
    });
    unknownDisplayModeEl.addEventListener("change", syncUnknownToggleButton);
    syncUnknownToggleButton();
  }

  function render(){
    if(!state) return;
    const sharePending = !!state.pendingShareConclusion;
    [toolDecompose, toolGroup, toolShare, toolShareUnits, toolDelete, toolAddBoth, toolOppositeBoth].forEach(button => {
      if(button) button.disabled = sharePending;
    });
    if(getSolvedValue() !== null) updateCurrentEquationStep();
    renderEquationHistory();
    syncUnknownToggleButton();
    renderSvg();
    renderActions();
    stabilizeMobileActionZone();
    requestAnimationFrame(syncMobileBottomControlsSpace);
  }

  const mobileImportMedia = window.matchMedia(MOBILE_IMPORT_QUERY);
  const rerenderForMobileLayoutChange = () => {
    if(state && isImportLayout()) render();
  };
  if(typeof mobileImportMedia.addEventListener === "function") mobileImportMedia.addEventListener("change", rerenderForMobileLayoutChange);
  else if(typeof mobileImportMedia.addListener === "function") mobileImportMedia.addListener(rerenderForMobileLayoutChange);

  function undo(){
    if(!history.length) return;
    state = history.pop();
    unitPacketChoice = null;
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    render();
  }

  function syncUniverseUI(options={validate:false}){
    if(!workUniverseEl) return;
    const relative = isRelativeUniverse();
    const allowOppositeX = oppositeXEnabled();

    if(oppositeXModeEl){
      oppositeXModeEl.disabled = !relative;
      if(!relative) oppositeXModeEl.value = "off";
    }
    if(oppositeXModeWrap) oppositeXModeWrap.classList.toggle("isDisabledSoft", !relative);
    if(oppositeXModeLabel) oppositeXModeLabel.style.opacity = "1";
    if(equationWritingModeWrap) equationWritingModeWrap.classList.toggle("isDisabledSoft", !relative);
    if(equationWritingModeEl) equationWritingModeEl.disabled = !relative;

    if(toolAddBoth){
      toolAddBoth.title = relative ? "Ajouter un jeton positif ou négatif aux deux membres" : "Ajouter un jeton positif aux deux membres";
    }
    if(toolOppositeBoth){
      toolOppositeBoth.style.display = allowOppositeX ? "" : "none";
    }

    [constBEl, constCEl, constDEl].forEach(el => {
      if(!el) return;
      el.min = relative ? "-200" : "0";
      el.max = "200";
      if(!relative && Number(el.value) < 0) el.value = "0";
    });
    if(constCEl && !relative && Number(constCEl.value) < 1) constCEl.value = "1";

    [coefAEl, coefCEl].forEach(el => {
      if(!el) return;
      el.min = allowOppositeX ? "-8" : "1";
      el.max = "8";
      if(!allowOppositeX && Number(el.value) < 1) el.value = "1";
      if(allowOppositeX && Number(el.value) === 0) el.value = "1";
    });
    if(!allowOppositeX && coefAEl && Number(coefAEl.value) < 2) coefAEl.value = "2";

    if(options.validate !== false) updateProfEquationInfo();
  }

  document.getElementById("btnBuild").addEventListener("click", buildAndOpen);
  document.getElementById("btnRandom").addEventListener("click", () => fillRandomEquationInput({build:false}));
  document.getElementById("btnReset").addEventListener("click", resetCurrentExercise);
  if(btnBackToMenu) btnBackToMenu.addEventListener("click", returnToStartMenu);
  if(btnViewClassic) btnViewClassic.addEventListener("click", () => chooseView("classic"));
  if(btnViewRedaction) btnViewRedaction.addEventListener("click", () => chooseView("redaction"));
  if(phoneLayoutMedia.addEventListener) phoneLayoutMedia.addEventListener("change", syncPhoneLayout);
  else if(phoneLayoutMedia.addListener) phoneLayoutMedia.addListener(syncPhoneLayout);
  // « Recommencer » : en réception, resetCurrentExercise ramène l'équation
  // reçue (restartImportedEquation) ; en usage libre, l'équation construite.
  if(btnStageReset) btnStageReset.addEventListener("click", resetCurrentExercise);
  btnStageRandom.addEventListener("click", randomAndOpen);
  toolDecompose.addEventListener("click", () => { dismissInitialEqualityInstruction(); setActionMode("decompose"); });
  toolGroup.addEventListener("click", () => { dismissInitialEqualityInstruction(); setActionMode("group"); });
  toolShare.addEventListener("click", () => { dismissInitialEqualityInstruction(); setActionMode("share"); });
  if(toolShareUnits) toolShareUnits.addEventListener("click", applyUnitShareTokens);
  toolDelete.addEventListener("click", () => { dismissInitialEqualityInstruction(); setActionMode("delete"); });
  toolAddBoth.addEventListener("click", openAddBothDialog);
  if(toolOppositeBoth) toolOppositeBoth.addEventListener("click", takeOppositeOfBothMembers);
  toolUndo.addEventListener("click", undo);
  if(btnStageUndo) btnStageUndo.addEventListener("click", undo);
  btnShowSuggestions.addEventListener("click", showDecomposeSuggestions);
  document.getElementById("btnApplyDecompose").addEventListener("click", applyDecomposeInput);
  document.getElementById("btnCancelDialog").addEventListener("click", () => decomposeDialog.close());
  document.getElementById("btnCancelShareDialog").addEventListener("click", () => shareDialog.close());
  document.getElementById("btnApplyGroup").addEventListener("click", applyGroup);
  document.getElementById("btnCancelGroup").addEventListener("click", () => groupDialog.close());
  groupInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); applyGroup(); }
  });
  document.getElementById("btnApplyAddBoth").addEventListener("click", applyAddBoth);
  document.getElementById("btnCancelAddBoth").addEventListener("click", () => addBothDialog.close());
  if(btnAddBothPositiveX) btnAddBothPositiveX.addEventListener("click", () => applyAddBothX(1));
  if(btnAddBothNegativeX) btnAddBothNegativeX.addEventListener("click", () => applyAddBothX(-1));
  addBothInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); applyAddBoth(); }
  });
  document.getElementById("btnApplyFusion").addEventListener("click", applyFusion);
  document.getElementById("btnCancelFusion").addEventListener("click", () => { pendingFusion = null; fusionDialog.close(); });
  fusionInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); applyFusion(); }
  });
  btnFullscreen.addEventListener("click", () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else if(stageEl.requestFullscreen) stageEl.requestFullscreen();
  });

  // PATCH 1.2.2 — auto-mise à jour seulement pour les menus.
  // Les champs numériques (coefficients et constantes) redeviennent manuels :
  // on peut les effacer/taper tranquillement, puis cliquer sur Créer ou 🎲.
  function rebuildFromCurrentSettings(){
    // Dans le menu de départ, les réglages changent maintenant directement
    // la proposition d'équation affichée en bas, sans construire le plateau.
    clearTeacherInfo();
    syncUniverseUI();
    syncTeacherControls();
    renderEquationExamples();
    if(appLayoutMode === "active"){
      randomAndOpen();
      return;
    }
    refreshEquationProposalFromMenus();
  }

  [modeEl, initialTokenCountEl, oppositeXModeEl].forEach(el => {
    if(!el) return;
    el.addEventListener("change", rebuildFromCurrentSettings);
  });

  [coefAEl, constBEl, coefCEl, constCEl, constDEl].forEach(el => {
    if(!el) return;
    el.addEventListener("input", markManualEquationDirty);
    el.addEventListener("change", markManualEquationDirty);
  });

  if(workUniverseEl){
    workUniverseEl.addEventListener("change", rebuildFromCurrentSettings);
  }
  unknownDisplayModeEl.addEventListener("change", () => {
    if(appLayoutMode === "start"){ refreshEquationProposalFromMenus(); return; }
    if(state){ state.conclusionDone = false; state.steps = [currentEquationString()]; state.stepOps = []; render(); }
  });
  if(equationWritingModeEl){
    equationWritingModeEl.addEventListener("change", () => {
      if(appLayoutMode === "start"){ refreshEquationProposalFromMenus(); return; }
      if(state){ state.conclusionDone = false; state.steps = [currentEquationString()]; state.stepOps = []; render(); }
    });
  }
  removedDisplayModeEl.addEventListener("change", render);
  if(equationInput){
    equationInput.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){ e.preventDefault(); buildAndOpen(); }
    });
    equationInput.addEventListener("input", clearTeacherInfo);
  }

  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") return;
    if(e.key === "z" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); undo(); }
    if(e.key.toLowerCase() === "f" && !decomposeDialog.open && !shareDialog.open && !addBothDialog.open && !fusionDialog.open){
      e.preventDefault(); btnFullscreen.click();
    }
  });

  /* ══════════════════════════════════════════════════════════════════
     MODE RÉCEPTION — IMPORT SPLAT ÉQUATIONS / AUTOMATISMES → ÉQUASPLAT
     (repris de l'ancienne page equasplat_import_splat.html, devenue une
     redirection vers celle-ci).
     La page peut recevoir une équation dans l'adresse, en JSON (encodé en
     URL ou en base64url) dans ?data=..., ?eqs=..., #data=... ou directement
     dans l'ancre. Format attendu : { source:"splat_equations", variable:"𝑥",
     unknownDisplay:"letter"|"question", universe:"positive"|"relative",
     numberMode:"grouped"|"unit", signedWritingMode:"simplified"|"parentheses",
     x:..., left/top/haut:[...], right/bottom/bas:[...] }.
     ══════════════════════════════════════════════════════════════════ */
  function decodeBase64Url(str){
    const clean = String(str || "").trim().replace(/-/g, "+").replace(/_/g, "/");
    const pad = clean.length % 4 ? "=".repeat(4 - (clean.length % 4)) : "";
    return decodeURIComponent(escape(atob(clean + pad)));
  }

  function readImportRawPayload(){
    const search = new URLSearchParams(window.location.search || "");
    if(search.has("data")) return search.get("data");
    if(search.has("eqs")) return search.get("eqs");

    const hash = String(window.location.hash || "").replace(/^#/, "");
    if(!hash) return "";
    const hashParams = new URLSearchParams(hash);
    if(hashParams.has("data")) return hashParams.get("data");
    if(hashParams.has("eqs")) return hashParams.get("eqs");
    return hash;
  }

  function parseImportedPayload(){
    const raw = readImportRawPayload();
    if(!raw) return null;

    const candidates = [];
    try{ candidates.push(decodeURIComponent(raw)); }catch(e){}
    try{ candidates.push(decodeBase64Url(raw)); }catch(e){}
    candidates.push(raw);

    for(const candidate of candidates){
      try{
        const parsed = JSON.parse(candidate);
        if(parsed && typeof parsed === "object") return parsed;
      }catch(e){}
    }
    return null;
  }

  function normalizeImportedPiece(piece){
    if(piece == null) return null;
    if(typeof piece === "number") return makeToken(piece);
    if(typeof piece === "string"){
      const s = piece.trim().toLowerCase();
      if(s === "x" || s === "𝑥" || s === "?") return makeX(1);
      if(s === "-x" || s === "−x" || s === "-𝑥" || s === "−𝑥") return makeX(-1);
      const n = Number(s.replace(",", ".").replace("−", "-"));
      return Number.isFinite(n) ? makeToken(n) : null;
    }
    if(typeof piece === "object"){
      const type = String(piece.type || piece.kind || "").toLowerCase();
      const rawSign = Number(piece.sign);
      const sign = rawSign < 0 || piece.opposed === true || piece.negative === true ? -1 : 1;
      if(type === "x" || type === "unknown" || type === "variable") return makeX(sign);
      if(type === "number" || type === "token" || type === "const" || type === "constant" || type === "v"){
        const n = Number(piece.value);
        return Number.isFinite(n) ? makeToken(n, {unit: piece.unit === true || piece.unit === "true"}) : null;
      }
    }
    return null;
  }

  function normalizeImportedSide(arr, opts = {}){
    if(!Array.isArray(arr)) return [];
    const useUnits = !!opts.unitMode;
    const out = [];
    arr.forEach(raw => {
      const piece = normalizeImportedPiece(raw);
      if(!piece) return;
      if(piece.type === "token" && Number(piece.value) === 0) return;
      if(useUnits && piece.type === "token" && !piece.unit){
        const n = Number(piece.value);
        if(n > 0 && Number.isInteger(n) && n <= 80){
          for(let i=0;i<n;i++) out.push(makeToken(1, {unit:true}));
          return;
        }
      }
      out.push(piece);
    });
    return out;
  }

  function importedSideStats(pieces){
    return pieces.reduce((acc, p) => {
      if(p.type === "x") acc.x += xSign(p);
      else acc.n += Number(p.value) || 0;
      return acc;
    }, {x:0,n:0});
  }

  function inferImportedX(leftPieces, rightPieces){
    const l = importedSideStats(leftPieces);
    const r = importedSideStats(rightPieces);
    const denom = l.x - r.x;
    if(denom !== 0){
      const x = (r.n - l.n) / denom;
      if(Number.isFinite(x) && x !== 0) return x;
    }
    return 1;
  }

  function restartImportedEquation(){
    if(!initialImportState) return;
    state = clone(initialImportState);
    history = [];
    unitPacketChoice = null;
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    pendingFusion = null;
    setActionMode(isImportedUnitMode() ? "delete" : "decompose");
    showInitialEqualityInstruction();
  }

  function createImportedEquationState(payload){
    if(!payload || typeof payload !== "object") return false;

    const wantedVar = typeof payload.variable === "string" && payload.variable.trim() ? payload.variable.trim() : "𝑥";
    const rawDisplay = String(payload.unknownDisplay || payload.display || "letter").toLowerCase();
    const wantedDisplay = (rawDisplay === "question" || rawDisplay === "?" || rawDisplay === "interrogation") ? "question" : "letter";

    const unitMode = String(payload.numberMode || payload.tokenMode || "").toLowerCase() === "unit";
    importedNumberMode = unitMode ? "unit" : "grouped";
    const rawSignedWritingMode = String(payload.signedWritingMode || payload.signedNotation || payload.writingMode || "simplified").toLowerCase();
    const parenthesesWriting = (rawSignedWritingMode === "parentheses" || rawSignedWritingMode === "parenthesis" || rawSignedWritingMode === "parenthèses");
    unitPacketChoice = null;
    const leftPieces = normalizeImportedSide(payload.left || payload.top || payload.haut || [], {unitMode});
    const rightPieces = normalizeImportedSide(payload.right || payload.bottom || payload.bas || [], {unitMode});
    if(!leftPieces.length || !rightPieces.length) return false;

    const containsRelative = leftPieces.concat(rightPieces).some(p =>
      (p.type === "token" && Number(p.value) < 0) || (p.type === "x" && xSign(p) < 0)
    );
    const universe = String(payload.universe || payload.workUniverse || "").toLowerCase() === "relative" || containsRelative ? "relative" : "positive";
    if(workUniverseEl) workUniverseEl.value = universe;
    if(oppositeXModeEl) oppositeXModeEl.value = leftPieces.concat(rightPieces).some(p => p.type === "x" && xSign(p) < 0) ? "on" : "off";
    if(unknownDisplayModeEl) unknownDisplayModeEl.value = wantedDisplay;
    // L'écriture des relatifs suit la demande de l'émetteur : « x + (−4) »
    // (parenthèses = écriture détaillée) ou « x − 4 » (simplifiée).
    if(equationWritingModeEl) equationWritingModeEl.value = parenthesesWriting ? "detailed" : "simplified";
    // Dans l’activité importée, les éléments enlevés disparaissent toujours :
    // cela libère l’interface et évite toute ambiguïté entre l’état courant et l’historique.
    syncRemovedDisplayControls("hide");

    const importedX = Number(payload.x);
    const xValue = Number.isFinite(importedX) && importedX !== 0 ? importedX : inferImportedX(leftPieces, rightPieces);
    const statsLeft = importedSideStats(leftPieces);
    const statsRight = importedSideStats(rightPieces);

    state = {
      original:{
        mode:"import",
        modeLabel:"Import Splat Équations",
        a:statsLeft.x,
        b:statsLeft.n,
        rightA:statsRight.x,
        d:statsRight.n,
        x:xValue,
        c:statsRight.x * xValue + statsRight.n,
        varChar:wantedVar
      },
      left:leftPieces,
      right:rightPieces,
      steps:[],
      stepOps:[],
      conclusionDone:false
    };

    recordEquationStep();
    initialImportState = clone(state);
    initialState = clone(state);
    history = [];
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    pendingFusion = null;
    syncUniverseUI({validate:false});
    syncTeacherControls({validate:false});
    setAppLayout("import");
    // Réception : on arrive en vue Classique (équation au-dessus du plateau, comme
    // avant la fusion) ; la vue Rédaction reste à un clic dans la barre du haut.
    setViewMode("classic");
    document.body.classList.toggle("importUnitMode", unitMode);
    setActionMode(unitMode ? "delete" : "decompose");
    showInitialEqualityInstruction();
    return true;
  }

  function tryImportFromUrl(){
    const payload = parseImportedPayload();
    if(!payload) return false;
    const ok = createImportedEquationState(payload);
    if(!ok){
      setAppLayout("import");
      document.body.classList.remove("importUnitMode");
      state = null;
      equationHistory.innerHTML = "";
      svg.innerHTML = "";
      setInstruction("<strong>Impossible de lire l’équation importée.</strong>");
    }
    return ok;
  }

  syncUniverseUI();
  syncTeacherControls();
  renderEquationExamples();
  setViewMode("redaction");
  if(!tryImportFromUrl()){
    setAppLayout("start");
    refreshEquationProposalFromMenus();
  }
})();
