    range.selectNodeContents(span);
    const rects = range.getClientRects();
    if(!rects.length) return null;
    let left = Infinity, right = -Infinity;
    for(const r of rects){
      if(r.width === 0) continue;
      left = Math.min(left, r.left);
      right = Math.max(right, r.right);
    }
    return Number.isFinite(left) ? {left, right} : null;
  }

  function drawOperationArrowsOverlay(){
    const list = equationHistory.querySelector(".equationList");
    if(!list) return;
    const old = list.querySelector(".opArrowLayer");
    if(old) old.remove();
    list.style.paddingLeft = "";
    list.style.paddingRight = "";
    list.classList.remove("hasOpArrows");
    const ops = (state && state.stepOps) || [];
    const rowEls = Array.from(list.querySelectorAll(".equationRow"));
    const visibleOps = ops.map((op, i) => (op && op.type === "bothSides" && op.label && rowEls[i] && rowEls[i + 1]) ? op : null);
    if(!operationArrowsEnabled() || !visibleOps.some(Boolean)) return;

    // La classe change éventuellement la taille d'écriture (vue Rédaction) :
    // on la pose avant de mesurer.
    list.classList.add("hasOpArrows");
    const fontPx = parseFloat(getComputedStyle(list).fontSize) || 32;
    const labelFs = Math.max(12, Math.round(fontPx * 0.58));
    const bulge = Math.round(labelFs * 0.9);
    const strokeW = Math.max(2, labelFs * 0.12);
    const head = Math.round(labelFs * 0.345);
    const labelGap = Math.round(labelFs * 0.25);
    let labelMax = 0;
    visibleOps.forEach(op => { if(op) labelMax = Math.max(labelMax, measureOpLabelWidth(op.label, labelFs)); });
    // Place réservée dans la marge : renflement + étiquette + respiration.
    const gutter = Math.ceil(bulge + labelGap + labelMax + labelFs * 0.35);
    list.style.paddingLeft = `${gutter}px`;
    list.style.paddingRight = `${gutter}px`;

    // Après le remplissage des marges, les lignes ont éventuellement été recoupées :
    // on mesure maintenant.
    const listRect = list.getBoundingClientRect();
    let textLeft = Infinity, textRight = -Infinity;
    rowEls.forEach(row => {
      const l = textRectOf(row.querySelector(".lhs"));
      const r = textRectOf(row.querySelector(".rhs"));
      if(l) textLeft = Math.min(textLeft, l.left);
      if(r) textRight = Math.max(textRight, r.right);
    });
    if(!Number.isFinite(textLeft)) textLeft = listRect.left + gutter;
    if(!Number.isFinite(textRight)) textRight = listRect.right - gutter;
    const margin = Math.round(labelFs * 0.55);
    // Abscisses communes à toutes les flèches (alignées comme dans Splat Équations),
    // bornées pour que l'étiquette reste dans la liste.
    const xL = Math.max(textLeft - listRect.left - margin, gutter - labelFs * 0.2);
    const xR = Math.min(textRight - listRect.left + margin, listRect.width - gutter + labelFs * 0.2);

    const ns = "http://www.w3.org/2000/svg";
    const layer = document.createElementNS(ns, "svg");
    layer.setAttribute("class", "opArrowLayer");
    layer.setAttribute("aria-hidden", "true");
    layer.setAttribute("width", String(Math.round(listRect.width)));
    layer.setAttribute("height", String(Math.round(list.scrollHeight)));
    layer.setAttribute("viewBox", `0 0 ${Math.round(listRect.width)} ${Math.round(list.scrollHeight)}`);

    const addArrow = (x, y1, y2, dir, label) => {
      const path = document.createElementNS(ns, "path");
      const cx = x + dir * bulge, cy = (y1 + y2) / 2;
      path.setAttribute("d", `M ${x} ${y1} Q ${cx} ${cy} ${x} ${y2}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "currentColor");
      path.setAttribute("stroke-width", String(strokeW));
      path.setAttribute("stroke-linecap", "round");
      layer.appendChild(path);
      // Pointe alignée sur la tangente d'arrivée de la courbe (elle vient du côté du renflement).
      const tx = x - cx, ty = y2 - cy;
      const tl = Math.hypot(tx, ty) || 1;
      const ux = tx / tl, uy = ty / tl;
      const px = -uy, py = ux;
      const bx = x - ux * head, by = y2 - uy * head;
      const tip = document.createElementNS(ns, "path");
      tip.setAttribute("d", `M ${bx + px * head * 0.7} ${by + py * head * 0.7} L ${x} ${y2} L ${bx - px * head * 0.7} ${by - py * head * 0.7}`);
      tip.setAttribute("fill", "none");
      tip.setAttribute("stroke", "currentColor");
      tip.setAttribute("stroke-width", String(strokeW));
      tip.setAttribute("stroke-linecap", "round");
      tip.setAttribute("stroke-linejoin", "round");
      layer.appendChild(tip);
      const text = document.createElementNS(ns, "text");
      text.setAttribute("x", String(x + dir * (bulge + labelGap)));
      text.setAttribute("y", String(cy + labelFs * 0.36));
      text.setAttribute("text-anchor", dir < 0 ? "end" : "start");
      text.setAttribute("font-size", String(labelFs));
      text.setAttribute("class", "opArrowLabel");
      text.textContent = label;
      layer.appendChild(text);
    };

    visibleOps.forEach((op, i) => {
      if(!op) return;
      const a = rowEls[i].getBoundingClientRect();
      const b = rowEls[i + 1].getBoundingClientRect();
      const y1 = a.top + a.height / 2 - listRect.top;
      const y2 = b.top + b.height / 2 - listRect.top;
      addArrow(xL, y1, y2, -1, op.label);
      addArrow(xR, y1, y2, 1, op.label);
    });
    list.appendChild(layer);
  }

  let opArrowRedrawHandle = 0;
  function scheduleOperationArrowsRedraw(){
    if(opArrowRedrawHandle) cancelAnimationFrame(opArrowRedrawHandle);
    opArrowRedrawHandle = requestAnimationFrame(() => {
      opArrowRedrawHandle = 0;
      if(state) drawOperationArrowsOverlay();
    });
  }
  window.addEventListener("resize", scheduleOperationArrowsRedraw);
  document.addEventListener("fullscreenchange", scheduleOperationArrowsRedraw);
  if(OP_ARROW_MEDIA && OP_ARROW_MEDIA.addEventListener) OP_ARROW_MEDIA.addEventListener("change", scheduleOperationArrowsRedraw);
  if(typeof ResizeObserver === "function"){
    new ResizeObserver(scheduleOperationArrowsRedraw).observe(equationHistory);
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleOperationArrowsRedraw);
  /* La police des lettres (SplatLettres, 27/09/2026) n'est téléchargée qu'au premier « 𝑥 »
     affiché, parfois après « fonts.ready » : les étiquettes des flèches (« − 2𝑡 ») ont pu être
     mesurées avec une police de secours. Une fois qu'elle est là, on redessine les flèches. */
  if(document.fonts && document.fonts.load) document.fonts.load("1em SplatLettres", "\u{1D465}").then(() => {
    scheduleOperationArrowsRedraw();
    // la lettre des taches est centrée sur son encre : on la remesure dans la bonne police
    if(document.fonts.load) document.fonts.load("italic 950 1em SplatLettres", "\u{1D465}").then(() => { splatLettreEncre.clear(); if(state) renderSvg(); }, () => {});
  }, () => {});

  // MODE RÉCEPTION — au départ, l'équation reçue s'annonce par l'égalité des
  // deux quantités ; la consigne s'efface au premier geste de l'élève.
  const INITIAL_EQUALITY_INSTRUCTION = "<strong>Il y a la même quantité à gauche qu’à droite.</strong>";
  /* La zone de consigne est une boîte flex (pour centrer). Posés directement dedans, le
     texte et chaque <strong> devenaient des boîtes séparées et l'espace entre deux
     disparaissait (« Jetons regroupés :0. »). Toute la consigne va maintenant dans une
     seule boîte, où les espaces comptent normalement (29/09/2026). */
  /* ÉQUATION RÉSOLUE (15/10/2026, choix de Gwenaël) : la phrase du milieu s'efface. Elle gardait
     la dernière consigne (« Sélectionne la même quantité des deux côtés. », « Jetons regroupés :
     7. ») alors que le bandeau dit déjà « ✅ Résolue ! ». Elle revient dès que l'élève défait. */
  function setInstruction(html){
    const content = initialEqualityInstructionVisible
      ? INITIAL_EQUALITY_INSTRUCTION
      : (eleveEquationResolue() ? "" : (html || ""));
    instructionZone.innerHTML = content ? `<span class="instructionText">${content}</span>` : "";
  }
  function dismissInitialEqualityInstruction(){
    initialEqualityInstructionVisible = false;
  }
  function showInitialEqualityInstruction(){
    initialEqualityInstructionVisible = true;
    setInstruction("");
  }

  function getPieceBySideAndId(ref){
    if(!ref || !state || !state[ref.side]) return null;
    return state[ref.side].find(p => p.id === ref.id) || null;
  }

  function selectedDeleteIds(){ return new Set(deleteSelection.map(ref => ref.id)); }

  function selectedDeletePiecesBySide(){
    const left = [], right = [];
    for(const ref of deleteSelection){
      const p = getPieceBySideAndId(ref);
      if(!p || p.removed) continue;
      if(ref.side === "left") left.push(p);
      if(ref.side === "right") right.push(p);
    }
    return {left, right};
  }

  function zeroXPairSelectionInfo(){
    const {left, right} = selectedDeletePiecesBySide();
    const selected = left.length ? left : right;
    const side = left.length ? "left" : (right.length ? "right" : null);
    if(!oppositeXEnabled()) return {ok:false, reason:"disabled", left, right};
    if(!side || (left.length && right.length)) return {ok:false, reason:"oneSideOnly", left, right};
    if(selected.length < 2) return {ok:false, reason:"notEnough", left, right};
    if(selected.some(p => p.type !== "x")) return {ok:false, reason:"notOnlyX", left, right};
    const coef = selected.reduce((sum,p)=>sum + xSign(p), 0);
    if(coef !== 0) return {ok:false, reason:"notZero", left, right, coef};
    return {ok:true, side, selected, left, right};
  }

  function cancelZeroXPair(){
    const info = zeroXPairSelectionInfo();
    if(!info.ok) return;
    pushHistory();
    const ids = new Set(deleteSelection.map(ref => ref.id));
    for(const p of state[info.side]){
      if(ids.has(p.id)) p.removed = true;
    }
    deleteSelection = [];
    recordSimplifyStep();
    render();
  }

  function deletionGroupInfo(){
    const {left, right} = selectedDeletePiecesBySide();
    if(left.length === 0 || right.length === 0) return {ok:false, reason:"needBoth", left, right};
    const all = left.concat(right);
    const firstType = all[0].type;
    if(all.some(p => p.type !== firstType)) return {ok:false, reason:"mixedTypes", left, right};
    if(firstType === "x"){
      const leftCoef = left.reduce((sum,p)=>sum + xSign(p), 0);
      const rightCoef = right.reduce((sum,p)=>sum + xSign(p), 0);
      if(leftCoef !== rightCoef) return {ok:false, reason:"differentXCoef", left, right, leftCoef, rightCoef};
      if(leftCoef === 0) return {ok:false, reason:"zeroXSelection", left, right, leftCoef, rightCoef};
      return {ok:true, type:"x", coef:leftCoef, label:formatXTerm(leftCoef), left, right};
    }
    const leftSum = left.reduce((s,p)=>s + Number(p.value || 0), 0);
    const rightSum = right.reduce((s,p)=>s + Number(p.value || 0), 0);
    if(leftSum !== rightSum) return {ok:false, reason:"differentSums", left, right, leftSum, rightSum};
    return {ok:true, type:"token", value:leftSum, label:String(leftSum), left, right};
  }

  function selectForDeletion(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.removed) return;
    const alreadyIndex = deleteSelection.findIndex(ref => ref.side === side && ref.id === id);
    if(alreadyIndex >= 0){ deleteSelection.splice(alreadyIndex,1); render(); return; }
    const currentPieces = deleteSelection.map(getPieceBySideAndId).filter(Boolean);
    if(currentPieces.length && piece.type !== currentPieces[0].type) deleteSelection = [];
    deleteSelection.push({side,id});
    render();
  }

  function deleteMatching(){
    const info = deletionGroupInfo();
    if(!info.ok) return;
    pushHistory();
    const ids = selectedDeleteIds();
    for(const side of ["left","right"]){
      for(const p of state[side]) if(ids.has(p.id)) p.removed = true;
    }
    const opLabel = formatSubtractBothSidesOperation(info);
    deleteSelection = [];
    recordEquationStep(makeBothSidesOperation(opLabel));
    render();
  }

  function selectedGroupIds(){ return new Set(groupSelection.map(ref => ref.id)); }

  function selectedGroupPieces(){
    const pieces = [];
    for(const ref of groupSelection){
      const p = getPieceBySideAndId(ref);
      if(!p || p.removed) continue;
      pieces.push({ref, piece:p});
    }
    return pieces;
  }

  function groupSelectionInfo(){
    const selected = selectedGroupPieces();
    if(selected.length < 2) return {ok:false, reason:"notEnough", selected};
    const side = selected[0].ref.side;
    if(selected.some(x => x.ref.side !== side)) return {ok:false, reason:"differentSides", selected};

    const firstType = selected[0].piece.type;
    if(selected.some(x => x.piece.type !== firstType)) return {ok:false, reason:"mixedTypes", selected};

    if(firstType === "token"){
      const sum = selected.reduce((total, x) => total + Number(x.piece.value || 0), 0);
      return {ok:true, kind:"tokens", side, sum, selected};
    }

    if(firstType === "x"){
      if(!oppositeXEnabled()) return {ok:false, reason:"oppositeDisabled", selected};
      const coef = selected.reduce((total, x) => total + xSign(x.piece), 0);
      if(coef !== 0) return {ok:false, reason:"notZeroX", side, coef, selected};
      return {ok:true, kind:"zeroX", side, coef, selected};
    }

    return {ok:false, reason:"unsupported", selected};
  }

  function selectForGrouping(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.removed) return;

    const canSelect = piece.type === "token" || (piece.type === "x" && oppositeXEnabled());
    if(!canSelect){
      setInstruction(oppositeXEnabled()
        ? "En mode Regrouper, sélectionne des jetons numériques ou des taches opposées."
        : "En mode Regrouper, sélectionne seulement des jetons numériques.");
      return;
    }

    const alreadyIndex = groupSelection.findIndex(ref => ref.side === side && ref.id === id);
    if(alreadyIndex >= 0){
      groupSelection.splice(alreadyIndex, 1);
      render();
      return;
    }

    // On regroupe uniquement dans un même membre et avec une même nature d’objet.
    if(groupSelection.length){
      const currentPieces = selectedGroupPieces();
      const currentType = currentPieces.length ? currentPieces[0].piece.type : null;
      if(groupSelection[0].side !== side || currentType !== piece.type) groupSelection = [];
    }

    groupSelection.push({side, id});
    render();
  }

  /* CE QU'IL RESTE À TOUCHER POUR REGROUPER (15/10/2026, choix de Gwenaël : des phrases d'élève de
     6e, selon ce qui est déjà touché, à la place de « Sélectionne au moins deux éléments
     compatibles. »). La sélection ne garde qu'un côté et qu'une sorte de pièce (selectForGrouping
     repart de zéro sinon) : il reste un jeton seul, ou des taches qui ne s'annulent pas encore. */
  function groupHint(selected){
    const pieces = selected.map(x => x.piece);
    if(pieces.length && pieces.every(p => p.type === "x")){
      const coef = pieces.reduce((total, p) => total + xSign(p), 0);
      return coef > 0
        ? `Touche une tache −${unknownHtml()} du même côté.`
        : `Touche une tache ${unknownHtml()} du même côté.`;
    }
    return "Touche un autre jeton du même côté.";
  }

  function openGroupDialog(){
    const info = groupSelectionInfo();
    if(!info.ok || info.kind !== "tokens") return;
    groupDialogText.innerHTML = `${formatSumOfTerms(info.selected.map(x => x.piece.value))} = ?`;
    groupInput.value = "";
    groupFeedback.textContent = "";
    openAppDialog(groupDialog, groupInput, {
      allowMinus:isRelativeUniverse(),
      submitLabel:"Regrouper",
      onSubmit:applyGroup
    });
  }

  function applyZeroXGroup(info){
    if(!info || !info.ok || info.kind !== "zeroX") return;
    pushHistory();
    // Même logique visuelle que 1 + (−1) : on remplace la paire par un
    // jeton 0 temporaire, puis il disparaît progressivement. Il apparaît là où
    // était la paire (29/09/2026 : les taches n'avaient pas de place à elles,
    // le 0 tombait n'importe où sur le plateau).
    const ids = new Set(info.selected.map(x => x.ref.id));
    const positions = currentSplatPositions(getTrayForSide(info.side), state[info.side]);
    const places = info.selected.map(x => positions.get(x.ref.id)).filter(Boolean);
    const at = places.length
      ? {cx:places.reduce((sum,p)=>sum + p.cx, 0) / places.length, cy:places.reduce((sum,p)=>sum + p.cy, 0) / places.length}
      : null;
    const zero = replaceWithTransientZero(info.side, ids, at);

    groupSelection = [];
    deleteSelection = [];
    selectedPieceRef = null;
    recordSimplifyStep();
    render();
    setInstruction(zeroXPairInstruction());
    setTimeout(() => removeTransientZero(info.side, zero.id), 950);
  }

  function zeroXPairInstruction(){
    const v = displayedUnknown();
    return `Paire nulle : <strong>${escapeHtml(v)} + (−${escapeHtml(v)}) = 0</strong>, puis le 0 disparaît.`;
  }

  /* Les consignes des taches opposées écrivent la lettre de l'équation (ou « ? »), comme
     les taches elles-mêmes : « 𝑐 + (−𝑐) = 0 », plus « x + (−x) » (29/09/2026). */
  function unknownHtml(){ return escapeHtml(displayedUnknown()); }
  function zeroXPairSelectedInstruction(){
    const v = unknownHtml();
    return `Paire nulle sélectionnée : <strong>${v} + (−${v}) = 0</strong>.`;
  }

  // Remplace des pièces d'un membre par un jeton 0 qui s'efface (removeTransientZero).
  function replaceWithTransientZero(side, ids, at){
    const arr = state[side];
    const indexes = arr.map((p, i) => ids.has(p.id) ? i : -1).filter(i => i >= 0);
    const zero = makeToken(0);
    zero.transientZero = true;
    if(at){
      zero.x = at.cx;
      zero.y = at.cy;
    }
    const filtered = arr.filter(p => !ids.has(p.id));
    filtered.splice(indexes.length ? Math.min(Math.min(...indexes), filtered.length) : filtered.length, 0, zero);
    state[side] = filtered;
    return zero;
  }

  function applyGroup(){
    const info = groupSelectionInfo();
    if(!info.ok){
      if(groupFeedback) groupFeedback.textContent = "Touche au moins deux jetons du même côté.";
      return;
    }

    if(info.kind === "zeroX"){
      applyZeroXGroup(info);
      return;
    }

    if(info.kind !== "tokens") return;

    const rawAnswer = String(groupInput.value || "").trim().replace(/−/g, "-");
    const answer = Number(rawAnswer);
    // Une case vide valait 0 (Number("") = 0) : elle passait pour juste devant 13 et −13.
    if(!rawAnswer || !Number.isFinite(answer) || Math.round(answer) !== answer){
      groupFeedback.textContent = "Écris un nombre entier.";
      groupInput.select();
      return;
    }

    if(answer !== info.sum){
      groupFeedback.textContent = "Ce n’est pas encore la bonne somme.";
      groupInput.select();
      return;
    }

    pushHistory();
    const arr = state[info.side];
    const ids = new Set(info.selected.map(x => x.ref.id));
    const indexes = info.selected.map(x => arr.findIndex(p => p.id === x.ref.id)).filter(i => i >= 0);
    const firstIndex = Math.min(...indexes);
    const merged = makeToken(info.sum);
    const coords = info.selected
      .map(x => x.piece)
      .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
    if(coords.length){
      merged.x = coords.reduce((sum,p)=>sum + p.x, 0) / coords.length;
      merged.y = coords.reduce((sum,p)=>sum + p.y, 0) / coords.length;
    }

    // Somme nulle (13 et −13) : le 0 apparaît puis disparaît, comme quand on glisse un jeton
    // sur l'autre (applyFusion). Avant (relevé le 28/09/2026), il restait sur le plateau.
    if(info.sum === 0) merged.transientZero = true;

    state[info.side] = arr.filter(p => !ids.has(p.id));
    state[info.side].splice(firstIndex, 0, merged);
    groupSelection = [];
    deleteSelection = [];
    selectedPieceRef = null;
    recordSimplifyStep();
    groupDialog.close();
    render();
    if(info.sum === 0){
      setInstruction("Paire nulle : <strong>0</strong> apparaît, puis disparaît.");
      setTimeout(() => removeTransientZero(info.side, merged.id), 950);
    }else{
      setInstruction(`Jetons regroupés : <strong>${formatSignedNumber(info.sum)}</strong>.`);
    }
  }

  function getShareOpportunity(){
    const left = activePieces("left");
    const right = activePieces("right");
    const leftTokens = left.filter(p => p.type === "token");
    const rightTokens = right.filter(p => p.type === "token");
    const leftX = left.filter(p => p.type === "x");
    const rightX = right.filter(p => p.type === "x");
    // Seules des taches positives ouvrent un partage final : face à des taches
    // −x, « x = 4 » serait faux, l'élève doit d'abord prendre l'opposé.
    if(rightTokens.length === 1 && rightX.length === 0 && leftTokens.length === 0 && leftX.length >= 2 && xSign(leftX[0]) > 0 && leftX.every(p => xSign(p) === xSign(leftX[0]))){
      const value = rightTokens[0].value;
      if(value % leftX.length === 0) return {tokenSide:"right", xSide:"left", token:rightTokens[0], count:leftX.length, result:value/leftX.length};
    }
    if(leftTokens.length === 1 && leftX.length === 0 && rightTokens.length === 0 && rightX.length >= 2 && xSign(rightX[0]) > 0 && rightX.every(p => xSign(p) === xSign(rightX[0]))){
      const value = leftTokens[0].value;
      if(value % rightX.length === 0) return {tokenSide:"left", xSide:"right", token:leftTokens[0], count:rightX.length, result:value/rightX.length};
    }
    return null;
  }

  function pendingShareFinalEquation(pending){
    const unknown = displayedUnknown();
    const value = formatSignedNumber(pending.each);
    return pending.xSide === "left" ? `${unknown} = ${value}` : `${value} = ${unknown}`;
  }

  function beginPendingShareConclusion(opportunity, each){
    const pending = {
      id:uid(),
      count:opportunity.count,
      each:Number(each),
      xSide:opportunity.xSide,
      tokenSide:opportunity.tokenSide,
      finalizing:false
    };
    state.pendingShareConclusion = pending;
    if(!state.steps) state.steps = [];
    if(!state.stepOps) state.stepOps = [];
    const finalEquation = pendingShareFinalEquation(pending);
    if(state.steps[state.steps.length - 1] !== finalEquation){
      if(state.steps.length > 0){
        state.stepOps.push(makeBothSidesOperation(`÷ ${pending.count}`));
      }
      state.steps.push(finalEquation);
    }
  }

  function decompositionMatchesFinalShare(opportunity, side, id, values){
    if(!opportunity || opportunity.tokenSide !== side || opportunity.token.id !== id) return false;
    if(values.length !== opportunity.count) return false;
    return values.every(value => Number(value) === Number(opportunity.result));
  }

  /* UNE LIGNE = UNE OPÉRATION DES DEUX CÔTÉS (28/09/2026, même règle que Splat Équations).
     Casser un jeton (Décomposer, ou Partager dans un autre nombre de parts que de taches)
     ne change pas l'équation : le geste se voit sur le plateau, et la ligne suivante arrive
     avec sa flèche (« 28 = 𝑥 + 12 », −12, « 16 = 𝑥 »). Avant, on écrivait
     « 16 + 12 = 𝑥 + 12 » ou « 3𝑥 = 2 × 12 », des lignes sans flèche que le corrigé
     imprimé n'a pas. */
  function applyTokenSplit(side, id, values){
    const arr = state[side];
    const idx = arr.findIndex(p => p.id === id);
    if(idx < 0) return;
    const opportunity = getShareOpportunity();
    const isFinalShare = decompositionMatchesFinalShare(opportunity, side, id, values);
    pushHistory();
    if(isFinalShare){
      beginPendingShareConclusion(opportunity, Number(opportunity.result));
    }else{
      arr.splice(idx, 1, ...values.map(makeToken));
    }
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    render();
  }

  function applySharedTokenSplit(side, id, partCount, partValue){
    const arr = state[side];
    const idx = arr.findIndex(piece => piece.id === id);
    if(idx < 0) return;
    const count = Math.round(Number(partCount) || 0);
    const each = Number(partValue);
    if(count < 2 || !Number.isFinite(each)) return;

    const opportunity = getShareOpportunity();
    pushHistory();
    const isFinalShare = !!opportunity
      && opportunity.tokenSide === side
      && opportunity.token.id === id
      && opportunity.count === count;
    if(isFinalShare){
      beginPendingShareConclusion(opportunity, each);
    }else{
      // Les parts d'un même partage restent liées (« 3 × 4 » si une ligne s'écrit plus tard),
      // mais le partage lui-même n'écrit plus de ligne (voir applyTokenSplit).
      const shareBatch = uid();
      arr.splice(idx, 1, ...Array.from({length:count}, () => makeToken(each, {shareBatch})));
    }
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    render();
  }

  /* Somme tapée dans Décomposer. Repris de la page import : une soustraction s'écrit
     naturellement, « 30 − 2 » vaut 30 + (−2). 15/10/2026 (Gwenaël) : « −3 + −6 » était refusé
     avec un message faux (« au moins deux termes »), alors que c'est ce que le pavé permet
     d'écrire pour deux jetons négatifs. Chaque terme peut porter son signe après + ou −,
     avec ou sans parenthèses (clavier) : « −3 + −6 », « −3 − 6 », « −3 + (−6) ». */
  function parseSum(text){
    const raw = String(text || "").replace(/[−–]/g,"-").replace(/\s+/g,"");
    if(!raw) return null;
    const term = /([+-]?)(\(?)([+-]?)(\d+)(\)?)/y;
    const values = [];
    let i = 0;
    while(i < raw.length){
      term.lastIndex = i;
      const m = term.exec(raw);
      if(!m || !m[0]) return null;
      const [all, op, open, sign, digits, close] = m;
      if(values.length && !op) return null;
      if(!values.length && op && sign) return null;
      if(!!open !== !!close) return null;
      let value = Number(digits);
      if(sign === "-") value = -value;
      if(op === "-") value = -value;
      values.push(value);
      i += all.length;
    }
    return values;
  }

  function openDecomposeDialog(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.type !== "token" || piece.removed) return;
    selectedPieceRef = {side,id};
    dialogText.innerHTML = jetonDialogueHtml(piece);
    decomposeInput.value = "";
    openAppDialog(decomposeDialog, decomposeInput, {
      expression:true,
      allowMinus:isRelativeUniverse(),
      submitLabel:"Décomposer",
      onSubmit:applyDecomposeInput
    });
  }

  /* PLUS DE PROPOSITIONS DANS DÉCOMPOSER (29/09/2026, choix de Gwenaël). Le bouton « ? »
     listait des sommes de deux termes, dont celle qui fait apparaître la quantité d'en face
     (12 + 16 pour 28 face à 𝑥 + 12) : l'élève n'avait plus qu'à la reconnaître, alors que tout
     le travail de Décomposer est de trouver quoi faire apparaître. Regrouper n'en a jamais eu.
     Restent le contrôle de la somme et l'exemple d'écriture (applyDecomposeInput). */
  /* Une erreur de Décomposer s'écrit sous le jeton, qui reste affiché (18/10/2026). Les
     messages sont des phrases fixes : seuls des nombres calculés y entrent. */
  function decomposeMessage(piece, html){
    dialogText.innerHTML = jetonDialogueHtml(piece) + `<span class="dialogMessage">${html}</span>`;
  }

  function applyDecomposeInput(){
    if(!selectedPieceRef) return;
    const piece = getPieceBySideAndId(selectedPieceRef);
    if(!piece) return;
    const values = parseSum(decomposeInput.value);
    if(!values || values.length < 2){
      // L'exemple s'écrit comme Regrouper (« −5 + (−4) ») ; il proposait « -5 + -4 », que
      // l'outil refusait lui-même.
      const half = Math.trunc(piece.value/2);
      const exemple = half !== 0 ? [half, piece.value - half] : [2 * piece.value, -piece.value];
      decomposeMessage(piece, `Écris une somme avec au moins deux termes, par exemple <strong>${formatSumOfTerms(exemple)}</strong>.`);
      return;
    }
    // « −9 + 0 » posait un jeton 0 qui restait sur le plateau.
    if(values.some(v => v === 0)){
      decomposeMessage(piece, "Pas de jeton <strong>0</strong> : écris des nombres différents de 0.");
      return;
    }
    const sum = values.reduce((a,b)=>a+b,0);
    if(sum !== piece.value){
      decomposeMessage(piece, `La somme doit faire <strong>${formatSignedNumber(piece.value)}</strong>. Ici, elle fait <strong>${formatSignedNumber(sum)}</strong>.`);
      return;
    }
    if(!isRelativeUniverse() && values.some(v => v < 0)){
      decomposeMessage(piece, "En Splat positif, écris une somme de nombres <strong>positifs</strong>.");
      return;
    }
    applyTokenSplit(selectedPieceRef.side, selectedPieceRef.id, values);
    decomposeDialog.close();
  }

  /* PARTAGER (29/09/2026, choix de Gwenaël). Les boutons disaient « 3 parts de 8 » : face à
     3 taches, la solution était écrite sur le bouton avant tout calcul. Ils disent maintenant
     « 3 parts » (c'est l'élève qui choisit le nombre de parts, parmi les partages entiers), puis
     il tape ce que vaut une part, comme il tape la somme dans Regrouper. */
  let pendingShare = null;

  function openShareDialog(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.type !== "token" || piece.removed) return;
    selectedPieceRef = {side,id};
    const value = Number(piece.value);
    pendingShare = {side, id, value, count:null, piece};
    shareDialogText.innerHTML = jetonDialogueHtml(piece);
    sharePartStep.hidden = true;
    btnApplyShare.hidden = true;
    sharePartInput.value = "";
    shareFeedback.textContent = "";
    /* 9, 10 OU 11 TACHES (15/10/2026, relevé en jouant les défis du monde 6) : les parts allaient de
       2 à 8. Face à 11 taches et au jeton 99, seul « 3 parts » était proposé : pour finir, l'élève
       devait décomposer 99 en onze 9. On propose maintenant jusqu'au nombre de taches du plateau
       quand il dépasse 8 — tous les partages entiers, sans mettre le bon en avant. */
    const tachesDuPlateau = activePieces("left").concat(activePieces("right")).filter(p => p.type === "x").length;
    const maxParts = Math.max(8, tachesDuPlateau);
    const counts = [];
    for(let n=2;n<=maxParts;n++){
      if(value % n === 0) counts.push(n);
    }
    if(!counts.length){
      shareChoices.innerHTML = `<div class="dialogText">Aucun partage entier simple proposé.</div>`;
    }else{
      shareChoices.innerHTML = counts.map(n => `<button class="chip" type="button" data-n="${n}">${n} parts</button>`).join("");
      shareChoices.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => chooseShareCount(Number(btn.dataset.n)));
      });
    }
    openAppDialog(shareDialog);
    /* À l'ouverture, le navigateur donne la main au premier bouton : après une touche du
       clavier (Échap…), « 2 parts » s'affichait entouré, comme une réponse suggérée. Le
       titre prend la main à sa place ; Tab mène toujours aux boutons (29/09/2026). */
    const shareTitle = document.getElementById("shareDialogTitle");
    if(shareTitle) shareTitle.focus({preventScroll:true});
  }

  function sharePartKeypadOptions(){
    return {allowMinus:isRelativeUniverse(), submitLabel:"Partager", onSubmit:applyShareInput};
  }

  /* LES PETITS JETONS BLEUS (monde 5, 23/10/2026, choix de Gwenaël) : « Faire des paquets » disparaît.
     Le bouton s'appelle Partager équitablement, comme pour les jetons numérotés, et on ne touche aucun
     jeton : on partage le groupe. La fenêtre s'ouvre tout de suite, l'élève choisit le nombre de parts
     puis TAPE ce que vaut une part (les boutons « 3 paquets de 2 » donnaient la réponse). Toutes les
     parts entières sont proposées (2 parts, 3 parts… jusqu'au nombre de jetons), sans mettre la bonne
     en avant. */
  function openUnitShareDialog(situation){
    if(!situation) return;
    selectedPieceRef = null;
    pendingShare = {unit:true, value:situation.tokenCount, count:null};
    shareDialogText.innerHTML = groupeJetonsDialogueHtml(situation.tokenCount);
    sharePartStep.hidden = true;
    btnApplyShare.hidden = true;
    sharePartInput.value = "";
    shareFeedback.textContent = "";
    const counts = situation.parts;
    if(!counts.length){
      shareChoices.innerHTML = `<div class="dialogText">Aucun partage entier simple proposé.</div>`;
    }else{
      shareChoices.innerHTML = counts.map(n => `<button class="chip" type="button" data-n="${n}">${n} parts</button>`).join("");
      shareChoices.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => chooseShareCount(Number(btn.dataset.n)));
      });
    }
    openAppDialog(shareDialog);
    const shareTitle = document.getElementById("shareDialogTitle");
    if(shareTitle) shareTitle.focus({preventScroll:true});
  }

  function chooseShareCount(count){
    if(!pendingShare) return;
    pendingShare.count = count;
    shareChoices.querySelectorAll(".chip").forEach(btn => btn.classList.toggle("selected", Number(btn.dataset.n) === count));
    shareDialogText.innerHTML = pendingShare.unit ? groupeJetonsDialogueHtml(pendingShare.value) : jetonDialogueHtml(pendingShare.piece); /* la puce choisie dit le nombre de parts */
    sharePartStep.hidden = false;
    btnApplyShare.hidden = false;
    sharePartInput.value = "";
    shareFeedback.textContent = "";
    if(!activateTouchKeypad(sharePartInput, sharePartKeypadOptions())){
      setTimeout(() => sharePartInput.focus({preventScroll:true}), 40);
    }
  }

  function applyShareInput(){
    if(!pendingShare || !pendingShare.count) return;
    const raw = String(sharePartInput.value || "").trim().replace(/−/g, "-");
    const answer = Number(raw);
    if(!raw || !Number.isFinite(answer)){
      shareFeedback.textContent = "Écris un nombre.";
      return;
    }
    if(answer !== pendingShare.value / pendingShare.count){
      shareFeedback.textContent = "Ce n’est pas encore la bonne part.";
      if(typeof sharePartInput.select === "function") sharePartInput.select();
      return;
    }
    if(pendingShare.unit){
      /* les petits jetons : le plateau se range en parts, comme le faisait « Faire des paquets » ; si
         le nombre de parts est celui des taches, les mini-plateaux apparaissent (« touche-en un ») */
      const parts = pendingShare.count;
      pendingShare = null;
      shareDialog.close();
      applyUnitPacketChoice(parts);
      return;
    }
    const {side, id, count} = pendingShare;
    pendingShare = null;
    // Partager est une action sur le plateau : le « ÷ n » ne s'écrit que si le nombre de parts
    // est celui des taches (applySharedTokenSplit), sinon rien ne s'écrit.
    applySharedTokenSplit(side, id, count, answer);
    shareDialog.close();
  }

  function blobPath(cx, cy, r){
    const n = 36, lobes = 5, pts = [];
    for(let i=0;i<n;i++){
      const a = (Math.PI*2*i)/n;
      const k = 0.90 + 0.16*Math.sin(lobes*a) + 0.04*Math.sin(2*lobes*a);
      const rr = r*k;
      pts.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr]);
    }
    function cr2bz(p0,p1,p2,p3){
      const t = 1/6;
      return [p1[0]+(p2[0]-p0[0])*t, p1[1]+(p2[1]-p0[1])*t, p2[0]-(p3[0]-p1[0])*t, p2[1]-(p3[1]-p1[1])*t, p2[0], p2[1]];
    }
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for(let i=0;i<n;i++){
      const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
      const [c1x,c1y,c2x,c2y,x,y] = cr2bz(p0,p1,p2,p3);
      d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x} ${y}`;
    }
    return d + " Z";
  }

  function tokenAreaForTray(tray){
    // PATCH 0.4 : zone de manipulation plus grande et plus proche des bords.
    // Le jeton doit pouvoir circuler presque partout sur le plateau.
    // On garde seulement une marge intérieure pour éviter qu'il colle au bord.
    return {x:tray.x+42, y:tray.y+54, w:tray.w-84, h:tray.h-96};
  }

  function tokenPlacementAreaForTray(tray){
    if(!isPhoneLayout()) return tokenAreaForTray(tray);
    // Au téléphone, les nouveaux jetons se rangent d'abord dans le tiers bas.
    // Ils restent ensuite déplaçables sur toute la surface du plateau.
    return {
      x:tray.x+48,
      y:tray.y+tray.h*.62,
      w:tray.w-96,
      h:tray.h*.32
    };
  }

  function rowsForSplats(n){
    if(n <= 1) return [n];
    if(n === 2) return [2];
    if(n === 3) return [2,1];
    if(n === 4) return [2,2];
    if(!isPhoneLayout()) return [3, n-3];
    if(n <= 6) return [3, n-3];
    return [3,3,n-6];
  }

  /* Répartition des taches et taille commune (PATCH TACHES 2026-09-21).
     Jusqu'à 6 taches : rien ne change, mêmes rangées et même taille qu'avant.
     À partir de 7, deux choses n'allaient pas. Les rangées restaient « 3 en haut, tout le
     reste en bas » (à 8 : 3 + 5), et surtout la taille ne regardait pas combien il y en
     avait dans une rangée : cinq taches de la taille de trois se chevauchaient. On essaie
     donc les répartitions en 2, 3 ou 4 rangées et on garde celle qui laisse la plus grosse
     tache, sans jamais dépasser la taille d'avant. Cela vaut d'où que viennent les taches :
     l'équation du professeur, une carte importée, ou « ajouter une tache » cliqué plusieurs
     fois. 2,20 = deux dessins de tache côte à côte (le dessin monte à 1,076 fois le rayon,
     soit 2,152) plus une marge. La taille n'est jamais augmentée, seulement réduite quand
     la place manque : sur un écran ordinaire, de 1 à 6 taches, elle ne bouge pas d'un pixel.
     Elle ne se réduit en dessous de 7 que dans un cadre très plat (plein écran avec
     l'équation au-dessus), où les deux rangées se touchaient déjà. */
  const SPLAT_ESPACE = 2.20;
  function repartirEnRangees(n, lignes){
    const base = Math.floor(n / lignes), reste = n % lignes;
    return Array.from({length: lignes}, (_, i) => base + (i < reste ? 1 : 0));
  }
  function splatLayoutFor(n, area, rmax){
    const tenir = (rows) => {
      const cols = Math.max(1, ...rows);
      return Math.min(rmax, area.w / cols / SPLAT_ESPACE, area.h / rows.length / SPLAT_ESPACE);
    };
    if(n <= 6){
      const rows = rowsForSplats(n);
      return { rows, r: tenir(rows) };
    }
    let best = null;
    for(let lignes = 2; lignes <= 4; lignes++){
      const rows = repartirEnRangees(n, lignes);
      const r = tenir(rows);
      if(!best || r > best.r) best = { rows, r };
    }
    return best;
  }

  function splatAreaFor(tray){
    const mobileLayout = isMobileImportLayout();
    return isPhoneLayout()
      ? {x:tray.x+70, y:tray.y+54, w:tray.w-140, h:tray.h*.55}
      : {
          x:tray.x+(mobileLayout ? 45 : 70),
          y:tray.y+80,
          w:tray.w-(mobileLayout ? 90 : 140),
          // Ordinateur : 400 dans la géométrie d'origine (plateau de 650), et
          // proportionnel quand le cadre est plus plat (PATCH ESPACE 2026-08-22).
          h:mobileLayout ? Math.min(760, tray.h * .58) : Math.min(400, tray.h * .62)
        };
  }

  function splatPositionsForItems(tray, items){
    const xs = items.filter(p => p.type === "x");
    const out = new Map();
    // PATCH 0.7.2 : taches légèrement plus grandes et mieux espacées.
    // Elles doivent pouvoir cacher visuellement un jeton numéroté,
    // sans se toucher lorsque plusieurs inconnues sont présentes.
    // Réception au téléphone : taches plus grandes, zone élargie (page import).
    const splatArea = splatAreaFor(tray);
    const rmax = commonSplatRadius();
    const rows = splatLayoutFor(xs.length, splatArea, rmax).rows;
    const radius = commonSplatLayoutRadius(splatArea);
    let k = 0;
    for(let r=0;r<rows.length;r++){
      const cols = rows[r];
      const cellW = splatArea.w / Math.max(1, cols);
      const cy = splatArea.y + splatArea.h*((r+.5)/rows.length);
      for(let c=0;c<cols && k<xs.length;c++){
        const cx = splatArea.x + cellW*(c+.5);
        // rRef : la taille qu'aurait la tache sans le rétrécissement — la lettre s'y accroche
        out.set(xs[k].id, {cx,cy,r:radius,rRef:rmax});
        k++;
      }
    }
    return out;
  }

  function avoidSplatsOnDrop(tray, items, cx, cy, r=40){
    // Si le jeton est relâché sur une tache, on le repousse doucement
    // vers le bord libre le plus proche, plutôt que de le bloquer dans la zone basse.
    let p = {cx, cy};
    const splats = Array.from(currentSplatPositions(tray, items).values());

    for(let pass=0; pass<5; pass++){
      let changed = false;
      for(const s of splats){
        const minDist = s.r + r + 16;
        let dx = p.cx - s.cx;
        let dy = p.cy - s.cy;
        let dist = Math.hypot(dx, dy);
        if(dist < minDist){
          if(dist < 0.001){
            dx = 1; dy = 0; dist = 1;
          }
          const push = minDist - dist;
          p.cx += (dx / dist) * push;
          p.cy += (dy / dist) * push;
          p = clampTokenPosition(tray, p.cx, p.cy, r, false);
          changed = true;
        }
      }
      if(!changed) break;
    }
    return p;
  }

  function clampTokenPosition(tray, cx, cy, r=40, avoid=true, side=null){
    const area = tokenAreaForTray(tray);
    let p = {
      cx: clamp(cx, area.x + r, area.x + area.w - r),
      cy: clamp(cy, area.y + r, area.y + area.h - r)
    };
    if(avoid && side && state && state[side]){
      p = avoidSplatsOnDrop(tray, state[side], p.cx, p.cy, r);
    }
    return p;
  }

  function tokenOverlapsExisting(candidate, placed, minDist){
    for(const p of placed){
      // Sans distance imposée (réception : billes et jetons mêlés), on s'appuie
      // sur les rayons réels des deux jetons.
      const required = Number.isFinite(minDist) ? minDist : ((candidate.r || TOKEN_R_DESKTOP) + (p.r || TOKEN_R_DESKTOP) + 10);
      if(Math.hypot(candidate.cx - p.cx, candidate.cy - p.cy) < required) return true;
    }
    return false;
  }

  function tokenOverlapsSplats(candidate, splats, tokenR){
    for(const s of splats){
      if(Math.hypot(candidate.cx - s.cx, candidate.cy - s.cy) < s.r + tokenR + 18) return true;
    }
    return false;
  }

  function randomTokenPositionInTray(tray, sideName, visible, placed, token){
    const area = tokenPlacementAreaForTray(tray);
    const splats = Array.from(currentSplatPositions(tray, visible).values());
    const r = tokenRadius(token);
    // Réception : billes et jetons mêlés, la distance suit les rayons réels.
    const minTokenDist = isImportLayout() ? undefined : r * 2.12;

    // Placement naturel : au téléphone on commence dans la zone basse ;
    // dans tous les cas, on évite les taches et les jetons trop proches.
    for(let attempt=0; attempt<140; attempt++){
      const cx = area.x + r + Math.random() * Math.max(1, area.w - 2*r);
      const cy = area.y + r + Math.random() * Math.max(1, area.h - 2*r);
      const p = clampTokenPosition(tray, cx, cy, r, true, sideName);
      p.r = r;
      if(tokenOverlapsSplats(p, splats, r)) continue;
      if(tokenOverlapsExisting(p, placed, minTokenDist)) continue;
      return p;
    }

    // Deuxième passe : on accepte que les jetons soient plus proches,
    // mais toujours pas sur une tache.
    for(let attempt=0; attempt<100; attempt++){
      const cx = area.x + r + Math.random() * Math.max(1, area.w - 2*r);
      const cy = area.y + r + Math.random() * Math.max(1, area.h - 2*r);
      const p = clampTokenPosition(tray, cx, cy, r, true, sideName);
      p.r = r;
      if(tokenOverlapsSplats(p, splats, r)) continue;
      if(tokenOverlapsExisting(p, placed, r * 1.82)) continue;
      return p;
    }

    // Secours déterministe : si le plateau est très chargé, on reprend
    // une position corrigée par l'évitement des taches.
    const fallback = {
      cx: area.x + area.w * (0.28 + Math.random()*0.44),
      cy: area.y + area.h * (0.56 + Math.random()*0.34)
    };
    const p = clampTokenPosition(tray, fallback.cx, fallback.cy, r, true, sideName);
    p.r = r;
    return p;
  }

  function separateTokenPositions(tray, visible, tokens, sideName){
    // PATCH 0.7.3 : après le placement naturel, on effectue une petite
    // relaxation géométrique pour supprimer les derniers chevauchements
    // entre jetons, tout en continuant à éviter les taches.
    if(tokens.length < 2) return;

    for(let pass=0; pass<18; pass++){
      let moved = false;

      for(let i=0; i<tokens.length; i++){
        for(let j=i+1; j<tokens.length; j++){
          const a = tokens[i];
          const b = tokens[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let dist = Math.hypot(dx, dy);

          if(dist < 0.001){
            dx = 1;
            dy = 0;
            dist = 1;
          }

          // Avec des billes (réception), la distance suit les deux rayons réels.
          const minDist = (a.unit || b.unit) ? tokenRadius(a) + tokenRadius(b) + 12 : tokenRadius() * 2.10;
          if(dist < minDist){
            const push = (minDist - dist) / 2;
            const ux = dx / dist;
            const uy = dy / dist;

            let pa = clampTokenPosition(tray, a.x - ux * push, a.y - uy * push, tokenRadius(a), true, sideName);
            let pb = clampTokenPosition(tray, b.x + ux * push, b.y + uy * push, tokenRadius(b), true, sideName);

            a.x = pa.cx;
            a.y = pa.cy;
            b.x = pb.cx;
            b.y = pb.cy;
            moved = true;
          }
        }
      }

      // Une passe de sécurité contre les taches après les déplacements entre jetons.
      for(const t of tokens){
        const safe = clampTokenPosition(tray, t.x, t.y, tokenRadius(t), true, sideName);
        if(Math.abs(safe.cx - t.x) > 0.5 || Math.abs(safe.cy - t.y) > 0.5){
          t.x = safe.cx;
          t.y = safe.cy;
          moved = true;
        }
      }

      if(!moved) break;
    }
  }

  /* TACHES DÉPLAÇABLES (29/09/2026, choix de Gwenaël). Tant que l'élève n'a déplacé aucune
     tache d'un membre, la grille range les taches comme avant (et les réarrange quand leur
     nombre change). Dès qu'il en a déplacé une, toutes les taches de ce membre gardent leur
     place (x, y), comme les jetons : la page ne range plus derrière lui, sinon « Ajouter 𝑥 »
     déferait son rangement. Une tache qui arrive ensuite se pose à la place libre la plus proche
     de sa case de grille. Rien ne se pose sur rien : une tache lâchée sur un jeton ou sur une
     tache de même signe glisse à la place libre la plus proche, et rien d'autre ne bouge. */
  function splatHasOwnPlace(piece){
    return !!piece && piece.type === "x" && Number.isFinite(piece.x) && Number.isFinite(piece.y);
  }

  function clampSplatCenter(tray, cx, cy, r){
    const area = tokenAreaForTray(tray);
    return {
      cx: clamp(cx, area.x + r, Math.max(area.x + r, area.x + area.w - r)),
      cy: clamp(cy, area.y + r, Math.max(area.y + r, area.y + area.h - r))
    };
  }

  // Deux taches se chevauchent sous l'écart de la grille (SPLAT_ESPACE rayons de centre à
  // centre) ; une tache et un jeton, sous ce que les jetons demandent (avoidSplatsOnDrop : + 16).
  // Une tache qu'on pose cherche d'abord une place un peu plus large (« aise »), pour ne pas
  // sembler collée à ses voisins, et ne se contente de la place juste qu'à défaut.
  const SPLAT_AISE = 2.5;
  function splatSpotIsFree(cx, cy, r, splats, tokens, aise=false){
    const ecart = aise ? SPLAT_AISE : SPLAT_ESPACE;
    for(const s of splats){
      if(Math.hypot(cx - s.cx, cy - s.cy) < (r + s.r) * ecart / 2) return false;
    }
    for(const t of tokens){
      if(Math.hypot(cx - t.cx, cy - t.cy) < r * (aise ? 1.08 : 1) + t.r + (aise ? 24 : 18)) return false;
    }
    return true;
  }

  function freeSplatSpot(tray, cx, cy, r, splats, tokens){
    const start = clampSplatCenter(tray, cx, cy, r);
    const area = tokenAreaForTray(tray);
    const step = Math.max(6, r * 0.2);
    for(const aise of [true, false]){
      if(splatSpotIsFree(start.cx, start.cy, r, splats, tokens, aise)) return start;
      let best = null;
      let bestDist = Infinity;
      for(let y = area.y + r; y <= area.y + area.h - r + 0.01; y += step){
        for(let x = area.x + r; x <= area.x + area.w - r + 0.01; x += step){
          const d = Math.hypot(x - start.cx, y - start.cy);
          if(d >= bestDist || !splatSpotIsFree(x, y, r, splats, tokens, aise)) continue;
          best = {cx:x, cy:y};
          bestDist = d;
        }
      }
      if(best) return best;
    }
    return null;
  }

  function tokenObstaclesFor(pieces){
    return pieces
      .filter(p => p.type === "token" && (!p.removed || shouldKeepRemovedPieces()) && Number.isFinite(p.x) && Number.isFinite(p.y))
      .map(p => ({cx:p.x, cy:p.y, r:tokenRadius(p)}));
  }

  // Les taches là où elles sont : la grille tant qu'aucune tache du membre n'a de place à elle ;
  // sinon leur place, bornée au plateau, sans jamais en poser deux l'une sur l'autre (plateau
  // redimensionné, taches regrossies). Une tache sans place dans un membre rangé à la main en
  // reçoit une ici, à l'écart des taches et des jetons.
  function placeSplats(tray, pieces, grid){
    const xs = pieces.filter(p => p.type === "x");
    if(!xs.some(splatHasOwnPlace)) return grid;
    const out = new Map();
    const splats = [];
    const tokens = tokenObstaclesFor(pieces);
    const drawn = xs.filter(p => !p.removed || shouldKeepRemovedPieces());
    for(const alreadyPlaced of [true, false]){
      for(const p of drawn){
        if(splatHasOwnPlace(p) !== alreadyPlaced || out.has(p.id)) continue;
        const g = grid.get(p.id);
        if(!g) continue;
        const avoidTokens = alreadyPlaced ? [] : tokens;
        let spot = clampSplatCenter(tray, alreadyPlaced ? p.x : g.cx, alreadyPlaced ? p.y : g.cy, g.r);
        if(!splatSpotIsFree(spot.cx, spot.cy, g.r, splats, avoidTokens)){
          spot = freeSplatSpot(tray, spot.cx, spot.cy, g.r, splats, avoidTokens) || spot;
        }
        p.x = spot.cx;
        p.y = spot.cy;
        const pos = {cx:spot.cx, cy:spot.cy, r:g.r, rRef:g.rRef};
        out.set(p.id, pos);
        splats.push(pos);
      }
    }
    return out;
  }

  function currentSplatPositions(tray, pieces){
    return placeSplats(tray, pieces, splatPositionsForItems(tray, pieces));
  }

  // Au premier déplacement d'une tache, toutes celles du membre prennent la place où on les voit.
  function pinSplatsOfSide(side){
    const positions = currentSplatPositions(getTrayForSide(side), state[side]);
    for(const p of state[side]){
      if(p.type !== "x" || splatHasOwnPlace(p)) continue;
      const pos = positions.get(p.id);
      if(pos){
        p.x = pos.cx;
        p.y = pos.cy;
      }
    }
  }

  function findSplatFusionCandidate(side, draggedId, cx, cy){
    if(!state || !state[side] || !oppositeXEnabled()) return null;
    const dragged = state[side].find(p => p.id === draggedId);
    if(!dragged || dragged.removed || dragged.type !== "x") return null;
    const positions = currentSplatPositions(getTrayForSide(side), state[side]);
    let best = null;
    let bestDist = Infinity;
    for(const other of activePieces(side)){
      if(other.id === draggedId || other.type !== "x" || xSign(other) === xSign(dragged)) continue;
      const pos = positions.get(other.id);
      if(!pos) continue;
      // Il faut la poser franchement dessus : moins d'un rayon entre les deux centres.
      const dist = Math.hypot(cx - pos.cx, cy - pos.cy);
      if(dist < pos.r * 1.05 && dist < bestDist){
        best = other;
        bestDist = dist;
      }
    }
    return best;
  }

  /* Après un glisser, le « clic » qui suit le lâcher ne doit pas sélectionner la pièce. Mais le
     dessin est refait au lâcher : ce clic n'arrive souvent jamais, et la pièce restait marquée,
     si bien que le PREMIER vrai toucher sur elle était ignoré (29/09/2026). La marque ne vit
     donc que le temps de ce clic. */
  function suppressClickAfterDrag(id){
    suppressNextClickFor = id;
    setTimeout(() => { if(suppressNextClickFor === id) suppressNextClickFor = null; }, 0);
  }

  function endSplatDrag(ds, piece){
    const tray = getTrayForSide(ds.side);
    const target = findSplatFusionCandidate(ds.side, ds.id, ds.cx, ds.cy);
    pinSplatsOfSide(ds.side);
    suppressClickAfterDrag(ds.id);
    if(target){
      // Posée sur la tache opposée : elle reste à sa place le temps de la petite fenêtre
      // (si l'élève annule, rien n'a bougé).
      render();
      setTimeout(() => openFusionDialog(ds.side, ds.id, target.id), 40);
      return;
    }
    const others = Array.from(currentSplatPositions(tray, state[ds.side]).entries())
      .filter(([id]) => id !== ds.id)
      .map(([, pos]) => pos);
    const spot = freeSplatSpot(tray, ds.cx, ds.cy, ds.r, others, tokenObstaclesFor(state[ds.side]));
    if(spot){
      piece.x = spot.cx;
      piece.y = spot.cy;
    }
    render();
  }

  /* AUCUN JETON CACHÉ (30/09/2026). Les poussées d'avoidSplatsOnDrop et de
     separateTokenPositions travaillent tache par tache et jeton par jeton : quand les taches
     remplissent le plateau, un jeton repoussé d'une tache retombait sur une autre, ou pile
     sur un autre jeton (carte 5𝑛 + 49 + 5 = −6𝑛 + 55 + 57 + 41 : 55 caché sous 57 dès le
     départ, puis 49, 55 et 57 cachés après « +6𝑛 »). Dernière passe : un jeton qui touche
     encore une tache ou un jeton déjà posé va à la place libre la plus proche — d'abord une
     place à l'aise (les écarts du placement normal), sinon une place juste (il ne touche plus
     rien). Si le plateau est trop plein pour ça, il se pose là où il mord le moins sur une
     tache, mais jamais sur un autre jeton ; et les jetons se dessinent par-dessus les taches
     (renderSvg), donc un bord de tache ne cache jamais un nombre. Un jeton bien posé ne
     bouge pas. */
  function tokenSplatBite(cx, cy, r, splats, marge){
    let pire = -Infinity;
    for(const s of splats){
      pire = Math.max(pire, s.r * 1.08 + r + marge - Math.hypot(cx - s.cx, cy - s.cy));
    }
    return pire;
  }

  function tokenClearOfTokens(cx, cy, r, placed, aise){
    for(const t of placed){
      if(Math.hypot(cx - t.cx, cy - t.cy) < (aise ? r * 2.10 : r + t.r + 4)) return false;
    }
    return true;
  }

  function unhideTokens(tray, tokens, splats){
    const area = tokenAreaForTray(tray);
    const placed = [];
    for(const token of tokens){
      const r = tokenRadius(token);
      const bien = tokenSplatBite(token.x, token.y, r, splats, 4) <= 0
        && tokenClearOfTokens(token.x, token.y, r, placed, false);
      if(!token.unit && !bien){
        const step = Math.max(6, r * 0.25);
        const points = [];
        for(let y = area.y + r; y <= area.y + area.h - r + 0.01; y += step){
          for(let x = area.x + r; x <= area.x + area.w - r + 0.01; x += step){
            points.push({cx:x, cy:y, d:Math.hypot(x - token.x, y - token.y)});
          }
        }
        let best = null;
        for(const aise of [true, false]){
          for(const pt of points){
            if(best && pt.d >= best.d) continue;
            if(tokenSplatBite(pt.cx, pt.cy, r, splats, aise ? 18 : 4) > 0) continue;
            if(!tokenClearOfTokens(pt.cx, pt.cy, r, placed, aise)) continue;
            best = pt;
          }
          if(best) break;
        }
        if(!best){
          // Plateau plein : on mord le moins possible sur une tache, jamais sur un jeton.
          let bestBite = Infinity;
          for(const pt of points){
            if(!tokenClearOfTokens(pt.cx, pt.cy, r, placed, false)) continue;
            const bite = Math.round(tokenSplatBite(pt.cx, pt.cy, r, splats, 4));
            if(bite < bestBite || (bite === bestBite && pt.d < best.d)){
              best = pt;
              bestBite = bite;
            }
          }
        }
        if(best){
          token.x = best.cx;
          token.y = best.cy;
        }
      }
      placed.push({cx:token.x, cy:token.y, r});
    }
  }

  function layoutItems(tray, items, splatLayoutItems=items){
    const visible = items;
    const tokens = visible.filter(p => p.type === "token");
    const out = new Map();

    // Une tache supprimée n'est plus dessinée, mais sa case reste réservée :
    // les taches encore visibles ne changent pas de place après la suppression.
    const splatPositions = placeSplats(tray, splatLayoutItems, splatPositionsForItems(tray, splatLayoutItems));
    for(const [id, pos] of splatPositions.entries()) out.set(id, pos);

    const sideName = tray.x < 800 ? "left" : "right";
    const placedTokens = [];

    for(const token of tokens){
      if(Number.isFinite(token.x) && Number.isFinite(token.y)){
        const r = tokenRadius(token);
        const clamped = clampTokenPosition(tray, token.x, token.y, r, true, sideName);
        token.x = clamped.cx;
        token.y = clamped.cy;
        placedTokens.push({cx:clamped.cx, cy:clamped.cy, r});
      }else{
        const p = randomTokenPositionInTray(tray, sideName, visible, placedTokens, token);
        token.x = p.cx;
        token.y = p.cy;
        placedTokens.push({cx:p.cx, cy:p.cy, r:tokenRadius(token)});
      }
    }

    separateTokenPositions(tray, visible, tokens, sideName);
    unhideTokens(tray, tokens, Array.from(splatPositions.values()));
    for(const token of tokens){
      out.set(token.id, {cx:token.x, cy:token.y, r:tokenRadius(token)});
    }

    return out;
  }

  function drawDefs(){
    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    defs.innerHTML = `
      <pattern id="hatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="rgba(229,231,235,.56)"></rect>
        <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(15,23,42,.50)" stroke-width="3"></line>
      </pattern>
    `;
    svg.appendChild(defs);
  }

  function drawText(x,y,text,cls,parent=svg){
    const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
    el.setAttribute("x", x);
    el.setAttribute("y", y);
    el.setAttribute("class", cls);
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  /* La lettre (ou le « ? ») d'une tache — 27/09/2026. Sa taille suit le rayon de la tache
     (SPLAT_LETTRE_K × r) : la même proportion à l'ordinateur, au téléphone (où la tache est
     plus grande dans le dessin) et dans les mini-plateaux du partage. Avant, la lettre avait
     une taille fixe (38 px) : « toute petite » dans la tache, surtout au téléphone.
     Elle est centrée sur son ENCRE, mesurée dans la police réellement dessinée : un « 𝑡 » a
     une hampe, un « 𝑥 » non — un centrage sur la ligne d'écriture les faisait monter. */
  const SPLAT_LETTRE_K = 0.8;
  const splatLettreEncre = new Map();
  let splatLettreCtx = null;
  function splatLettreDecalage(label){
    // [dx, dy] en em : ce qu'il faut déplacer le texte (ancré au milieu, sur sa ligne de base)
    // pour que le milieu de son encre tombe sur le centre de la tache
    if(splatLettreEncre.has(label)) return splatLettreEncre.get(label);
    let decalage = [0, 0.33];
    try{
      if(!splatLettreCtx) splatLettreCtx = document.createElement("canvas").getContext("2d");
      splatLettreCtx.font = "italic 950 100px SplatLettres, Georgia, 'Times New Roman', serif";
      const m = splatLettreCtx.measureText(String(label));
      if(Number.isFinite(m.actualBoundingBoxAscent) && m.actualBoundingBoxAscent > 0){
        decalage = [(m.width - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft)) / 200,
                    (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 200];
        // gardé en mémoire seulement une fois la police des lettres arrivée
        if(!document.fonts || document.fonts.check("italic 950 100px SplatLettres", "\u{1D465}")) splatLettreEncre.set(label, decalage);
      }
    }catch(e){}
    return decalage;
  }
  function drawSplatLetter(g, cx, cy, r, label){
    const t = drawText(cx, cy, label, "splatText", g);
    const [dx, dy] = splatLettreDecalage(label);
    t.style.fontSize = `${(r * SPLAT_LETTRE_K).toFixed(1)}px`;
    t.style.dominantBaseline = "alphabetic";
    t.setAttribute("dx", `${dx.toFixed(3)}em`);
    t.setAttribute("dy", `${dy.toFixed(3)}em`);
    return t;
  }

  function drawTray(tray, title){
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", tray.x);
    rect.setAttribute("y", tray.y);
    rect.setAttribute("width", tray.w);
    rect.setAttribute("height", tray.h);
    rect.setAttribute("rx", 34);
    rect.setAttribute("class", "tray");
    svg.appendChild(rect);
    if(title) drawText(tray.x + tray.w/2, tray.y + 44, title, "trayTitle");
  }

  function drawSharedTray(leftTray, rightTray){
    const x = leftTray.x;
    const y = Math.min(leftTray.y, rightTray.y);
    const right = rightTray.x + rightTray.w;
    const bottom = Math.max(leftTray.y + leftTray.h, rightTray.y + rightTray.h);
    drawTray({x, y, w:right-x, h:bottom-y}, "");
    const divider = document.createElementNS("http://www.w3.org/2000/svg", "line");
    divider.setAttribute("x1", 800);
    divider.setAttribute("x2", 800);
    divider.setAttribute("y1", y);
    divider.setAttribute("y2", bottom);
    divider.setAttribute("class", "trayDivider");
    svg.appendChild(divider);
  }

  function svgPointFromEvent(e){
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function mobileSvgViewHeight(){
    // Réception au téléphone : le dessin épouse la hauteur réelle du cadre.
    const width = Math.max(1, svg.clientWidth || 1600);
    const height = Math.max(1, svg.clientHeight || 1050);
    return clamp(Math.round(1600 * height / width), 980, 1420);
  }

  function desktopSvgViewHeight(){
    // Ordinateur / tablette : le dessin épouse la forme réelle du cadre (PATCH ESPACE 2026-08-22).
    // Avant, le viewBox 1600×820 était figé : dans un cadre plus plat, le tableau
    // n'occupait que la moitié de la largeur et laissait du gris vide de chaque côté.
    const width = svg.clientWidth || 0;
    const height = svg.clientHeight || 0;
    if(width < 50 || height < 50) return 820;
    // Borne basse 560 (au lieu de 700) : dans un cadre très plat (plein écran avec
    // l'équation au-dessus), le dessin épouse la largeur au lieu de laisser du gris
    // de chaque côté ; les plateaux sont alors plus larges, pas plus petits.
    return clamp(Math.round(1600 * height / width), 560, 1100);
  }

  function getTrayForSide(side){
    if(isPhoneLayout()){
      return side === "left"
        ? {x:24, y:34, w:736, h:1212}
        : {x:840, y:34, w:736, h:1212};
    }
    if(isMobileImportLayout()){
      const viewHeight = mobileSvgViewHeight();
      return side === "left"
        ? {x:8, y:36, w:760, h:viewHeight-72}
        : {x:832, y:36, w:760, h:viewHeight-72};
    }
    // 2026-08-23 : le plateau remplit son dessin. Les marges 74 / 96 de la géométrie
    // d'origine (820 de haut) ne portaient rien et faisaient perdre un quart de la
    // hauteur du cadre gris ; il reste 24 en haut et en bas pour l'ombre du cadre.
    const trayHeight = desktopSvgViewHeight() - 48;
    return side === "left"
      ? {x:40, y:24, w:720, h:trayHeight}
      : {x:840, y:24, w:720, h:trayHeight};
  }

  function findFusionCandidate(side, draggedId, cx, cy){
    if(!state || !state[side]) return null;
    const dragged = state[side].find(p => p.id === draggedId);
    if(!dragged || dragged.removed || dragged.type !== "token") return null;

    /* On mesure jusqu'au jeton TEL QU'IL EST DESSINÉ (sa place, gardée à chaque dessin), sans
       refaire la mise en place du plateau : elle écartait le jeton lâché de celui qu'il couvrait,
       ou le sortait de sous une tache, AVANT la mesure — près des taches, la fenêtre Regrouper ne
       s'ouvrait presque jamais (0 fois sur 20 à l'ordinateur, mesuré le 15/10/2026). */
    let best = null;
    let bestDist = Infinity;

    for(const other of activePieces(side)){
      if(other.id === draggedId || other.type !== "token" || other.removed) continue;
      if(!Number.isFinite(other.x) || !Number.isFinite(other.y)) continue;
      const dist = Math.hypot(cx - other.x, cy - other.y);
      // Fusion seulement si on dépose vraiment le jeton sur l'autre :
      // seuil assoupli : il faut déposer franchement sur l’autre jeton,
      // mais sans devoir viser parfaitement le centre.
      const threshold = (dragged.unit || other.unit)
        ? (tokenRadius(dragged) + tokenRadius(other)) * 0.95
        : tokenRadius() * 1.55;
      if(dist < threshold && dist < bestDist){
        best = other;
        bestDist = dist;
      }
    }
    return best;
  }

  function openFusionDialog(side, sourceId, targetId){
    const source = state && state[side] ? state[side].find(p => p.id === sourceId) : null;
    const target = state && state[side] ? state[side].find(p => p.id === targetId) : null;
    if(!source || !target || source.removed || target.removed) return;
    const title = fusionDialog.querySelector(".dialogTitle");

    if(source.type === "x" && target.type === "x"){
      /* 𝑥 POSÉ SUR −𝑥 (29/09/2026, choix de Gwenaël) : même petite fenêtre que pour deux
         jetons ; l'élève écrit 0, et la paire disparaît comme avec Regrouper. */
      if(!oppositeXEnabled() || xSign(source) === xSign(target)) return;
      const positive = xSign(source) > 0 ? source : target;
      const negative = positive === source ? target : source;
      pendingFusion = {side, sourceId, targetId, kind:"x", expected:0};
      if(title) title.textContent = "Regrouper";
      if(fusionLabel) fusionLabel.textContent = "Somme des deux taches";
      fusionDialogText.innerHTML = `${escapeHtml(xPieceLabel(positive))} + (${escapeHtml(xPieceLabel(negative))}) = ?`;
      fusionInput.value = "";
      fusionFeedback.textContent = "";
      openAppDialog(fusionDialog, fusionInput, {
        allowMinus:isRelativeUniverse(),
        submitLabel:"Regrouper",
        onSubmit:applyFusion
      });
      return;
    }
    if(source.type !== "token" || target.type !== "token") return;

    const a = Number(target.value);
    const b = Number(source.value);
    if(!isRelativeUniverse() && (a < 0 || b < 0)) return;
    const expected = a + b;
    pendingFusion = {side, sourceId, targetId, a, b, expected};
    if(title) title.textContent = "Regrouper";
    if(fusionLabel) fusionLabel.textContent = "Somme des deux jetons";
    fusionDialogText.innerHTML = `${formatSumOfTerms([a, b])} = ?`;
    fusionInput.value = "";
    fusionFeedback.textContent = "";
    openAppDialog(fusionDialog, fusionInput, {
      allowMinus:isRelativeUniverse(),
      submitLabel:"Regrouper",
      onSubmit:applyFusion
    });
  }

  function removeTransientZero(side, id){
    if(!state || !state[side]) return;
    const idx = state[side].findIndex(p => p.id === id && p.type === "token" && Number(p.value) === 0);
    if(idx < 0) return;
    state[side].splice(idx, 1);
    updateCurrentEquationStep();
    render();
    // Une conclusion possible (« 0 = 4𝑥 ») garde la phrase posée par renderActions.
    if(!getConclusionInfo()) setInstruction("La paire nulle vaut 0 : elle disparaît du plateau.");
  }

  function applyFusion(){
    if(!pendingFusion) return;
    const rawAnswer = String(fusionInput.value || "").trim().replace(/−/g, "-");
    const answer = Number(rawAnswer);
    // Une case vide valait 0 (Number("") = 0) : elle passait pour juste devant une paire nulle.
    if(!rawAnswer || !Number.isFinite(answer)){
      fusionFeedback.textContent = "Écris un nombre.";
      return;
    }
    if(answer !== pendingFusion.expected){
      fusionFeedback.textContent = "Ce n’est pas encore le bon résultat.";
      fusionInput.select();
      return;
    }
    if(pendingFusion.kind === "x"){
      applySplatFusion();
      return;
    }

    const {side, sourceId, targetId, expected} = pendingFusion;
    const arr = state && state[side] ? state[side] : null;
    if(!arr) return;
    const source = arr.find(p => p.id === sourceId);
    const target = arr.find(p => p.id === targetId);
    if(!source || !target || source.removed || target.removed) return;

    pushHistory();
    const merged = makeToken(expected);
    const sx = Number.isFinite(source.x) ? source.x : null;
    const sy = Number.isFinite(source.y) ? source.y : null;
    const tx = Number.isFinite(target.x) ? target.x : null;
    const ty = Number.isFinite(target.y) ? target.y : null;
    merged.x = Number.isFinite(sx) && Number.isFinite(tx) ? (sx + tx) / 2 : (Number.isFinite(sx) ? sx : tx);
    merged.y = Number.isFinite(sy) && Number.isFinite(ty) ? (sy + ty) / 2 : (Number.isFinite(sy) ? sy : ty);
    if(expected === 0) merged.transientZero = true;

    const firstIndex = Math.min(arr.findIndex(p => p.id === sourceId), arr.findIndex(p => p.id === targetId));
    const filtered = arr.filter(p => p.id !== sourceId && p.id !== targetId);
    filtered.splice(firstIndex, 0, merged);
    state[side] = filtered;

    pendingFusion = null;
    fusionDialog.close();
    recordSimplifyStep();
    render();
    if(expected === 0){
      setInstruction("Paire nulle : <strong>0</strong> apparaît, puis disparaît.");
      setTimeout(() => removeTransientZero(side, merged.id), 950);
    }else{
      setInstruction(`Jetons regroupés : <strong>${formatSignedNumber(expected)}</strong>.`);
    }
  }

  function applySplatFusion(){
    const {side, sourceId, targetId} = pendingFusion;
    const arr = state && state[side] ? state[side] : null;
    const source = arr ? arr.find(p => p.id === sourceId) : null;
    const target = arr ? arr.find(p => p.id === targetId) : null;
    pendingFusion = null;
    fusionDialog.close();
    if(!source || !target || source.removed || target.removed) return;
    pushHistory();
    // Le 0 apparaît sur la tache visée, là où l'élève a posé l'autre.
    const at = currentSplatPositions(getTrayForSide(side), arr).get(targetId) || null;
    const zero = replaceWithTransientZero(side, new Set([sourceId, targetId]), at);
    groupSelection = [];
    deleteSelection = [];
    selectedPieceRef = null;
    recordSimplifyStep();
    render();
    setInstruction(zeroXPairInstruction());
    setTimeout(() => removeTransientZero(side, zero.id), 950);
  }

  function beginTokenDrag(e, side, item, pos, group){
    if(item.removed || (item.type !== "token" && item.type !== "x")) return;
    if(e.button !== undefined && e.button !== 0) return;
    const p = svgPointFromEvent(e);
    dragState = {
      side,
      id:item.id,
      type:item.type,
      r:pos.r,
      group,
      startSvg:p,
      startCx:pos.cx,
      startCy:pos.cy,
      cx:pos.cx,
      cy:pos.cy,
      moved:false
    };
    try{ group.setPointerCapture(e.pointerId); }catch(_e){}
  }

  function moveTokenDrag(e){
    if(!dragState) return;
    const p = svgPointFromEvent(e);
    const tray = getTrayForSide(dragState.side);
    const draggedPiece = state && state[dragState.side] ? state[dragState.side].find(piece => piece.id === dragState.id) : null;
    const wantedX = dragState.startCx + (p.x - dragState.startSvg.x);
    const wantedY = dragState.startCy + (p.y - dragState.startSvg.y);
    const next = dragState.type === "x"
      ? clampSplatCenter(tray, wantedX, wantedY, dragState.r)
      : clampTokenPosition(tray, wantedX, wantedY, tokenRadius(draggedPiece), false);
    const dx = next.cx - dragState.startCx;
    const dy = next.cy - dragState.startCy;
    if(Math.hypot(dx, dy) > 3 && !dragState.moved){
      dragState.moved = true;
      // Ce qu'on glisse passe au-dessus du reste (29/09/2026 : une tache glissait sous les jetons).
      const g = dragState.group;
      if(g.parentNode && g !== g.parentNode.lastChild){
        g.parentNode.appendChild(g);
        try{ g.setPointerCapture(e.pointerId); }catch(_e){}
      }
    }
    dragState.cx = next.cx;
    dragState.cy = next.cy;
    dragState.group.classList.toggle("dragging", dragState.moved);
    dragState.group.setAttribute("transform", `translate(${dx} ${dy})`);
    if(dragState.moved) e.preventDefault();
  }

  function endTokenDrag(e){
    if(!dragState) return;
    const ds = dragState;
    dragState = null;
    try{ ds.group.releasePointerCapture(e.pointerId); }catch(_e){}
    ds.group.classList.remove("dragging");
    ds.group.removeAttribute("transform");
    if(ds.moved){
      const piece = state && state[ds.side] ? state[ds.side].find(p => p.id === ds.id) : null;
      if(piece && piece.type === "x"){
        endSplatDrag(ds, piece);
        return;
      }
      let fusionTarget = null;
      if(piece){
        const tray = getTrayForSide(ds.side);
        const safe = clampTokenPosition(tray, ds.cx, ds.cy, tokenRadius(piece), true, ds.side);
        /* LE JETON VISÉ, LÀ OÙ L'ÉLÈVE L'A LÂCHÉ (15/10/2026, trouvé en jouant les séries). Le jeton
           lâché est repoussé hors des taches (avoidSplatsOnDrop) ; la fusion se cherchait APRÈS ce
           recul : lâché sur un jeton posé près d'une tache — c'est souvent le cas, les jetons sont
           dessinés par-dessus les taches —, il sautait de côté et la fenêtre Regrouper ne s'ouvrait
           pas. On cherche le jeton visé à l'endroit du lâcher ; le jeton, lui, se pose à l'abri. */
        const lache = clampTokenPosition(tray, ds.cx, ds.cy, tokenRadius(piece), false);
        piece.x = safe.cx;
        piece.y = safe.cy;
        fusionTarget = findFusionCandidate(ds.side, ds.id, lache.cx, lache.cy);
      }
      suppressClickAfterDrag(ds.id);
      render();
      if(fusionTarget){
        setTimeout(()=>openFusionDialog(ds.side, ds.id, fusionTarget.id), 40);
      }
    }
  }

  // Anneau de sélection : épais au téléphone (#230), fin sur ordinateur et tablette.
  function selectionRingIsFine(){ return !isPhoneLayout() && !isMobileImportLayout(); }
  function selectionRingGap(){ return selectionRingIsFine() ? 6 : 12; }
  function selectionRingClass(base){ return selectionRingIsFine() ? `${base} fineRing` : base; }

  /* UN NOMBRE TIENT DANS SON JETON (30/09/2026). « −54 » (trois signes) débordait du cercle,
     surtout depuis que les jetons rapetissent avec beaucoup de taches. Le nombre garde sa
     taille normale, et ne rapetisse que s'il dépasse 1,6 fois le rayon du jeton. */
  function fitTokenLabel(label, r){
    if(!label || typeof label.getComputedTextLength !== "function") return;
    const largeur = label.getComputedTextLength();
    const max = r * 1.6;
    if(!(largeur > max)) return;
    const taille = parseFloat(getComputedStyle(label).fontSize);
    if(Number.isFinite(taille)) label.style.fontSize = `${(taille * max / largeur).toFixed(1)}px`;
  }

  function drawItem(side, item, pos, selectedIds, groupSelectedIds){
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    if(item.type === "token") g.classList.add("tokenDragGroup");
    if(item.type === "x" && !item.removed) g.classList.add("splatDragGroup");
    if(item.type === "token" && item.transientZero) g.classList.add("transientZero");
    if(item.removed) g.classList.add("removedGroup");
    g.dataset.side = side;
    g.dataset.id = item.id;
    svg.appendChild(g);

    if(item.type === "x"){
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r));
      path.setAttribute("class", xSign(item) < 0 ? "splatShape oppositeX" : "splatShape");
      // La lettre rétrécit avec sa tache, jamais toute seule.
      if(pos.rRef) g.style.setProperty("--splatEchelle", (pos.r / pos.rRef).toFixed(3));
      g.appendChild(path);
      drawSplatLetter(g, pos.cx, pos.cy, pos.r, xPieceLabel(item));
      if(item.removed){
        const overlay = document.createElementNS("http://www.w3.org/2000/svg", "path");
        overlay.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r));
        overlay.setAttribute("class", "removedOverlay");
        g.appendChild(overlay);
      }
      if(selectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
        outline.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r+selectionRingGap()));
        outline.setAttribute("class", selectionRingClass("selectedOutline"));
        g.appendChild(outline);
      }
      if(groupSelectedIds && groupSelectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
        outline.setAttribute("d", blobPath(pos.cx, pos.cy, pos.r+selectionRingGap()));
        outline.setAttribute("class", selectionRingClass("groupSelectedOutline"));
        g.appendChild(outline);
      }
    }else{
      const hit = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      hit.setAttribute("cx", pos.cx);
      hit.setAttribute("cy", pos.cy);
      hit.setAttribute("r", pos.r + tokenHitExtra(item));
      hit.setAttribute("fill", "transparent");
      hit.setAttribute("class", "tokenHitArea");
      g.appendChild(hit);

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", pos.cx);
      circle.setAttribute("cy", pos.cy);
      circle.setAttribute("r", pos.r);
      const jetonEchelle = pos.r / tokenRadiusBase(item);
      if(jetonEchelle < 0.999) g.style.setProperty("--jetonEchelle", jetonEchelle.toFixed(3));
      const tokenClass = Number(item.value) < 0
        ? "tokenCircle negative"
        : (Number(item.value) === 0 ? "tokenCircle zero" : (isRelativeUniverse() ? "tokenCircle positive relativePositive" : "tokenCircle positive"));
      circle.setAttribute("class", tokenClass);
      if(!isRelativeUniverse() && Number(item.value) > 0){
        const col = positiveTokenColorForValue(item.value);
        // Style inline pour éviter que la classe .tokenCircle.positive écrase
        // les couleurs variées du Splat positif.
        circle.style.fill = col.fill;
        circle.style.stroke = col.stroke;
      }
      g.appendChild(circle);
      if(item.unit){
        // Les jetons unitaires importés du mode primaire restent de petites billes bleues,
        // sans chiffre apparent, comme dans Splat Équations.
        circle.style.fill = "rgba(27,102,255,0.18)";
        circle.style.stroke = "rgba(27,102,255,0.58)";
      }else{
        fitTokenLabel(drawText(pos.cx, pos.cy + 2, formatSignedNumber(item.value), "tokenText", g), pos.r);
      }
      if(item.removed){
        const overlay = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        overlay.setAttribute("cx", pos.cx);
        overlay.setAttribute("cy", pos.cy);
        overlay.setAttribute("r", pos.r);
        overlay.setAttribute("class", "removedOverlay");
        g.appendChild(overlay);
      }
      if(selectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        outline.setAttribute("cx", pos.cx);
        outline.setAttribute("cy", pos.cy);
        outline.setAttribute("r", pos.r+selectionRingGap());
        outline.setAttribute("class", selectionRingClass("selectedOutline"));
        g.appendChild(outline);
      }
      if(groupSelectedIds && groupSelectedIds.has(item.id)){
        const outline = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        outline.setAttribute("cx", pos.cx);
        outline.setAttribute("cy", pos.cy);
        outline.setAttribute("r", pos.r+selectionRingGap());
        outline.setAttribute("class", selectionRingClass("groupSelectedOutline"));
        g.appendChild(outline);
      }
    }

    if(item.type === "token" || item.type === "x"){
      g.addEventListener("pointerdown", (e) => beginTokenDrag(e, side, item, pos, g));
      g.addEventListener("pointermove", moveTokenDrag);
      g.addEventListener("pointerup", endTokenDrag);
      g.addEventListener("pointercancel", endTokenDrag);
    }

    g.addEventListener("click", (e) => {
      if(suppressNextClickFor === item.id){
        suppressNextClickFor = null;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
