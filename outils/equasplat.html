      if(item.removed) return;
      dismissInitialEqualityInstruction();
      /* Aucun bouton choisi (rien n'est allumé au départ, 15/10/2026) : le toucher ne fait rien,
         une phrase le dit. Glisser un jeton sur un autre, lui, marche sans bouton. */
      if(!actionMode){
        setInstruction("Choisis d’abord un bouton.");
        return;
      }
      if(actionMode === "decompose"){
        if(item.type === "token") openDecomposeDialog(side, item.id);
        else setInstruction("Une tache ne se décompose pas : touche un jeton.");
        return;
      }
      if(actionMode === "group"){
        if(item.type === "token" || (item.type === "x" && oppositeXEnabled())) selectForGrouping(side, item.id);
        else setInstruction("Les taches ne se regroupent pas : touche un jeton.");
        return;
      }
    if(actionMode === "share"){
        if(item.type === "token") openShareDialog(side, item.id);
        else setInstruction("Une tache ne se partage pas : touche un jeton.");
        return;
      }
      if(actionMode === "delete") selectForDeletion(side, item.id);
    });
  }

  /* MODE RÉCEPTION — les billes rangées en parts (« Partager équitablement », ex-« Faire des paquets »). */
  function clearUnitPacketChoiceIfInvalid(){
    if(!unitPacketChoice || !state) return;
    const pieces = activePieces(unitPacketChoice.side || "right");
    const tokenCount = pieces.filter(p => p.type === "token" && p.unit && Number(p.value) === 1).length;
    if(tokenCount !== unitPacketChoice.tokenCount){
      unitPacketChoice = null;
      clearUnitPacketConclusion();
    }
  }

  function packetGridForTray(tray, packetCount){
    packetCount = Math.max(1, Math.round(Number(packetCount) || 1));
    const cols = Math.ceil(Math.sqrt(packetCount));
    const rows = Math.ceil(packetCount / cols);
    const pad = 34;
    const gap = 14;
    const boxW = (tray.w - pad*2 - gap*(cols-1)) / cols;
    const boxH = (tray.h - 96 - pad - gap*(rows-1)) / rows;
    const boxes = [];
    for(let i=0; i<packetCount; i++){
      const col = i % cols;
      const row = Math.floor(i / cols);
      boxes.push({
        x:tray.x + pad + col*(boxW + gap),
        y:tray.y + 78 + row*(boxH + gap),
        w:boxW,
        h:boxH,
        index:i
      });
    }
    return boxes;
  }

  function positionsInPacketBox(box, count){
    const r = TOKEN_UNIT_R;
    const pad = 24;
    const cols = Math.max(1, Math.floor((box.w - pad*2) / (r*2 + 8)));
    const rows = Math.max(1, Math.ceil(count / cols));
    const stepX = count === 1 ? 0 : Math.min(r*2 + 12, (box.w - pad*2) / Math.max(1, Math.min(cols, count) - 1 || 1));
    const stepY = rows <= 1 ? 0 : Math.min(r*2 + 10, (box.h - pad*2 - 18) / Math.max(1, rows - 1));
    const startY = box.y + box.h/2 - ((rows - 1) * stepY)/2 + 8;
    const positions = [];
    for(let i=0; i<count; i++){
      const row = Math.floor(i / cols);
      const col = i % cols;
      const usedCols = Math.min(cols, count - row*cols);
      const startX = box.x + box.w/2 - ((usedCols - 1) * stepX)/2;
      positions.push({cx:startX + col*stepX, cy:startY + row*stepY, r});
    }
    return positions;
  }

  function applyUnitPacketPositions(){
    if(!unitPacketChoice || !state) return null;
    const side = unitPacketChoice.side;
    const activeUnits = activePieces(side).filter(p => p.type === "token" && p.unit && Number(p.value) === 1);
    if(activeUnits.length !== unitPacketChoice.tokenCount){
      unitPacketChoice = null;
      return null;
    }
    const tray = getTrayForSide(side);
    const boxes = packetGridForTray(tray, unitPacketChoice.packetCount);
    let cursor = 0;
    boxes.forEach((box, packetIndex) => {
      const positions = positionsInPacketBox(box, unitPacketChoice.each);
      for(let i=0; i<unitPacketChoice.each && cursor < activeUnits.length; i++, cursor++){
        activeUnits[cursor].x = positions[i].cx;
        activeUnits[cursor].y = positions[i].cy;
        activeUnits[cursor].packetIndex = packetIndex;
      }
    });
    return {side, boxes};
  }

  function drawUnitPacketBoxes(packetLayout){
    if(!packetLayout || !unitPacketChoice || !state) return;
    const side = unitPacketChoice.side;
    const units = activePieces(side).filter(p => p.type === "token" && p.unit && Number(p.value) === 1 && Number.isFinite(Number(p.packetIndex)));
    const groups = new Map();
    for(const p of units){
      const idx = Math.round(Number(p.packetIndex) || 0);
      if(!groups.has(idx)) groups.set(idx, []);
      groups.get(idx).push(p);
    }
    const tray = getTrayForSide(side);
    for(let i=0; i<unitPacketChoice.packetCount; i++){
      const group = groups.get(i) || [];
      if(!group.length) continue;
      const r = TOKEN_UNIT_R;
      const pad = 12;
      const minX = Math.min(...group.map(p => Number(p.x) || 0));
      const maxX = Math.max(...group.map(p => Number(p.x) || 0));
      const minY = Math.min(...group.map(p => Number(p.y) || 0));
      const maxY = Math.max(...group.map(p => Number(p.y) || 0));
      let x = minX - r - pad;
      let y = minY - r - pad;
      let w = (maxX - minX) + 2*r + 2*pad;
      let h = (maxY - minY) + 2*r + 2*pad;
      const minW = r*2 + 2*pad + 4;
      const minH = r*2 + 2*pad + 4;
      if(w < minW){ x -= (minW - w)/2; w = minW; }
      if(h < minH){ y -= (minH - h)/2; h = minH; }
      if(tray){
        x = clamp(x, tray.x + 12, tray.x + tray.w - w - 12);
        y = clamp(y, tray.y + 56, tray.y + tray.h - h - 12);
      }
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", w);
      rect.setAttribute("height", h);
      rect.setAttribute("rx", 16);
      rect.setAttribute("class", `packetBox${unitPacketChoice.isCorrect ? " matchXCount" : ""}`);
      svg.appendChild(rect);
    }
  }

  function drawPendingShareGroups(viewHeight){
    const pending = state && state.pendingShareConclusion;
    if(!pending || pending.count < 2) return false;

    const count = pending.count;
    const cols = count <= 3 ? 1 : 2;
    const rows = Math.ceil(count / cols);
    const outer = 28;
    const gap = 20;
    const cardW = (1600 - outer*2 - gap*(cols-1)) / cols;
    const cardH = (viewHeight - outer*2 - gap*(rows-1)) / rows;

    for(let index=0; index<count; index++){
      const row = Math.floor(index / cols);
      const col = index % cols;
      const isCenteredLast = cols === 2 && count % 2 === 1 && index === count - 1;
      const x = isCenteredLast ? (1600 - cardW)/2 : outer + col*(cardW + gap);
      const y = outer + row*(cardH + gap);
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "pendingShareGroup");
      g.style.animationDelay = `${index * 110}ms`;
      g.setAttribute("role", "button");
      g.setAttribute("tabindex", "0");
      const leftLabel = pending.xSide === "left" ? displayedUnknown() : formatSignedNumber(pending.each);
      const rightLabel = pending.xSide === "right" ? displayedUnknown() : formatSignedNumber(pending.each);
      g.setAttribute("aria-label", `Mini-plateau ${index + 1} sur ${count} : ${leftLabel} à gauche et ${rightLabel} à droite. Choisir ce plateau.`);
      g.dataset.pendingShareGroup = String(index);

      const card = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      card.setAttribute("x", x);
      card.setAttribute("y", y);
      card.setAttribute("width", cardW);
      card.setAttribute("height", cardH);
      card.setAttribute("rx", Math.min(30, cardH*.14));
      card.setAttribute("class", "pendingShareGroupCard");
      g.appendChild(card);

      const centerY = y + cardH/2;
      const leftX = x + cardW*.29;
      const dividerX = x + cardW*.50;
      const rightX = x + cardW*.71;
      const splatX = pending.xSide === "left" ? leftX : rightX;
      const tokenX = pending.tokenSide === "left" ? leftX : rightX;
      // Mini-plateaux du partage : taches et jetons un peu plus grands qu'avant
      // (cartes plates), et la lettre suit la taille de la tache au lieu de garder
      // la police du plateau normal — elle paraissait trop grosse et décentrée.
      const splatR = Math.min(94, cardH*.36, cardW*.13);
      const tokenR = Math.min(66, cardH*.27, cardW*.10);

      const splat = document.createElementNS("http://www.w3.org/2000/svg", "path");
      splat.setAttribute("d", blobPath(splatX, centerY, splatR));
      splat.setAttribute("class", "splatShape");
      g.appendChild(splat);
      drawSplatLetter(g, splatX, centerY, splatR, displayedUnknown());

      const divider = document.createElementNS("http://www.w3.org/2000/svg", "line");
      divider.setAttribute("x1", dividerX);
      divider.setAttribute("x2", dividerX);
      divider.setAttribute("y1", y);
      divider.setAttribute("y2", y + cardH);
      divider.setAttribute("class", "pendingShareDivider");
      g.appendChild(divider);

      if(pending.unit){
        // Billes unitaires : on montre « each » petites billes, pas un jeton numéroté.
        const n = Math.max(1, Math.round(Number(pending.each)));
        const bCols = n <= 3 ? n : Math.ceil(Math.sqrt(n));
        const bRows = Math.ceil(n / bCols);
        const r = Math.min(tokenR*.55, (cardW*.34) / (bCols*2.3), (cardH*.8) / (bRows*2.3));
        const step = r*2.3;
        for(let k=0; k<n; k++){
          const bc = k % bCols, br = Math.floor(k / bCols);
          const rowCount = Math.min(bCols, n - br*bCols);
          const bx = tokenX + (bc - (rowCount-1)/2) * step;
          const by = centerY + (br - (bRows-1)/2) * step;
          const bille = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          bille.setAttribute("cx", bx);
          bille.setAttribute("cy", by);
          bille.setAttribute("r", r);
          bille.setAttribute("class", "tokenCircle positive");
          bille.style.fill = "rgba(27,102,255,0.18)";
          bille.style.stroke = "rgba(27,102,255,0.58)";
          g.appendChild(bille);
        }
      }else{
      const token = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      token.setAttribute("cx", tokenX);
      token.setAttribute("cy", centerY);
      token.setAttribute("r", tokenR);
      token.setAttribute("class", Number(pending.each) < 0 ? "tokenCircle negative" : "tokenCircle positive");
      if(!isRelativeUniverse() && Number(pending.each) > 0){
        const color = positiveTokenColorForValue(pending.each);
        token.style.fill = color.fill;
        token.style.stroke = color.stroke;
      }
      g.appendChild(token);
      const tokenLabel = drawText(tokenX, centerY + 2, formatSignedNumber(pending.each), "tokenText", g);
      tokenLabel.style.fontSize = `${Math.round(tokenR*.9)}px`;
      }

      const choose = () => {
        const fresh = state && state.pendingShareConclusion;
        if(!fresh || fresh.finalizing || fresh.id !== pending.id) return;
        fresh.finalizing = true;
        const groups = svg.querySelectorAll(".pendingShareGroup");
        groups.forEach((group, groupIndex) => group.classList.add(groupIndex === index ? "chosen" : "discarded"));
        setTimeout(() => finalizePendingShare(pending.id), 420);
      };
      g.addEventListener("click", choose);
      g.addEventListener("keydown", event => {
        if(event.key === "Enter" || event.key === " "){
          event.preventDefault();
          choose();
        }
      });
      svg.appendChild(g);
    }
    return true;
  }

  function renderSvg(){
    svg.innerHTML = "";
    const viewHeight = isMobileImportLayout() ? mobileSvgViewHeight() : (isPhoneLayout() ? 1280 : desktopSvgViewHeight());
    svg.setAttribute("viewBox", `0 0 1600 ${viewHeight}`);
    drawDefs();
    if(drawPendingShareGroups(viewHeight)) return;
    const leftTray = getTrayForSide("left");
    const rightTray = getTrayForSide("right");
    drawSharedTray(leftTray, rightTray);

    clearUnitPacketChoiceIfInvalid();
    const packetLayout = applyUnitPacketPositions();
    const leftItems = renderPiecesForSide("left");
    const rightItems = renderPiecesForSide("right");
    const leftPos = layoutItems(leftTray, leftItems, state.left);
    const rightPos = layoutItems(rightTray, rightItems, state.right);
    drawUnitPacketBoxes(packetLayout);
    const selectedIds = selectedDeleteIds();
    const groupSelectedIds = selectedGroupIds();
    // Les taches d'abord, les jetons ensuite : un jeton n'est jamais caché sous une tache.
    const splatsFirst = items => items.filter(p => p.type !== "token").concat(items.filter(p => p.type === "token"));
    splatsFirst(leftItems).forEach(item => drawItem("left", item, leftPos.get(item.id), selectedIds, groupSelectedIds));
    splatsFirst(rightItems).forEach(item => drawItem("right", item, rightPos.get(item.id), selectedIds, groupSelectedIds));
  }


  /* Une petite tache dessinée comme celles du plateau : même forme, même lettre, même
     centrage (splatLettreDecalage) — la lettre était minuscule et décentrée dans l'ancien bouton. */
  function miniSplatSvgHtml(sign){
    const v = currentVar();
    const label = sign < 0 ? `−${v}` : v;
    const fill = sign < 0 ? "#4c1d95" : "#111827";
    const r = 46;
    const [dx, dy] = splatLettreDecalage(label);
    const size = (r * SPLAT_LETTRE_K).toFixed(1);
    return `<svg class="miniSplatSvg" viewBox="11 14 100 100" aria-hidden="true" focusable="false"><path d="${blobPath(60, 60, r)}" fill="${fill}" stroke="rgba(0,0,0,.22)" stroke-width="3"></path><text x="60" y="60" dx="${dx.toFixed(3)}em" dy="${dy.toFixed(3)}em" style="font-size:${size}px;dominant-baseline:alphabetic">${escapeHtml(label)}</text></svg>`;
  }

  const ADD_BOTH_X_MAX = 8;
  let addBothX = {sign:1, count:1};

  function showAddBothTab(onglet){
    addBothDialog.dataset.onglet = onglet;
    if(btnAddBothTabToken) btnAddBothTabToken.setAttribute("aria-selected", onglet === "jeton" ? "true" : "false");
    if(btnAddBothTabX) btnAddBothTabX.setAttribute("aria-selected", onglet === "taches" ? "true" : "false");
  }

  function renderAddBothX(){
    if(!addBothXChoices) return;
    if(btnAddBothPositiveX) btnAddBothPositiveX.setAttribute("aria-checked", addBothX.sign > 0 ? "true" : "false");
    if(btnAddBothNegativeX) btnAddBothNegativeX.setAttribute("aria-checked", addBothX.sign < 0 ? "true" : "false");
    if(addBothXPreview) addBothXPreview.innerHTML = Array.from({length:addBothX.count}, () => miniSplatSvgHtml(addBothX.sign)).join("");
    if(btnAddBothXLess) btnAddBothXLess.disabled = addBothX.count <= 1;
    if(btnAddBothXMore) btnAddBothXMore.disabled = addBothX.count >= ADD_BOTH_X_MAX;
    if(btnApplyAddBothX) btnApplyAddBothX.textContent = addBothX.count > 1 ? `Ajouter ${addBothX.count} taches` : "Ajouter 1 tache";
    if(addBothXFeedback) addBothXFeedback.textContent = "";
  }

  function openAddBothDialog(){
    if(!state) return;
    dismissInitialEqualityInstruction();
    addBothInput.value = "";
    addBothFeedback.textContent = "";
    const canAddX = oppositeXEnabled();
    const v = currentVar();
    if(isRelativeUniverse()){
      addBothDialogText.textContent = canAddX
        ? "Ajoute le même jeton numérique, ou la même tache, de chaque côté."
        : "Ajoute le même jeton de chaque côté. Tu peux écrire une valeur positive ou négative.";
      addBothInput.min = "-99";
    }else{
      addBothDialogText.textContent = "Ajoute le même jeton positif de chaque côté.";
      addBothInput.min = "1";
    }
    addBothInput.max = "99";
    if(addBothXChoices) addBothXChoices.classList.toggle("open", canAddX);
    addBothDialog.classList.toggle("deuxParties", canAddX);
    addBothX = {sign:1, count:1};
    showAddBothTab("jeton");
    if(btnAddBothPositiveX) btnAddBothPositiveX.innerHTML = miniSplatSvgHtml(1);
    if(btnAddBothNegativeX) btnAddBothNegativeX.innerHTML = miniSplatSvgHtml(-1);
    renderAddBothX();
    openAppDialog(addBothDialog, addBothInput, {
      allowMinus:isRelativeUniverse(),
      submitLabel:"Ajouter",
      onSubmit:applyAddBoth
    });
  }

  function finishAddBothAction(operation=null){
    deleteSelection = [];
    groupSelection = [];
    selectedPieceRef = null;
    recordEquationStep(operation);
    addBothDialog.close();
    render();
  }

  function applyAddBoth(){
    if(!state) return;
    const raw = Number(String(addBothInput.value || "").trim().replace(/−/g, "-")); /* « −7 » au pavé */
    if(!Number.isFinite(raw) || Math.round(raw) !== raw || raw === 0){
      addBothFeedback.textContent = isRelativeUniverse() ? "Écris un entier non nul, positif ou négatif." : "Écris un entier positif non nul.";
      addBothInput.select();
      return;
    }

    const value = Math.round(raw);
    if(!isRelativeUniverse() && value < 0){
      addBothFeedback.textContent = "Dans Splat positif, on n’ajoute que des jetons positifs.";
      addBothInput.select();
      return;
    }
    pushHistory();
    state.left.push(makeToken(value));
    state.right.push(makeToken(value));
    finishAddBothAction(makeBothSidesOperation(formatSignedOperationNumber(value)));
  }

  function applyAddBothX(){
    if(!state || !oppositeXEnabled()) return;
    const sign = addBothX.sign < 0 ? -1 : 1;
    const count = Math.round(addBothX.count);
    if(!Number.isFinite(count) || count < 1 || count > ADD_BOTH_X_MAX) return;
    pushHistory();
    for(let i=0; i<count; i++){
      state.left.push(makeX(sign));
      state.right.push(makeX(sign));
    }
    finishAddBothAction(makeBothSidesOperation(formatSignedOperationX(sign * count)));
  }

  function takeOppositeOfBothMembers(){
    if(!state || !oppositeXEnabled()) return;
    pushHistory();
    for(const side of ["left", "right"]){
      for(const piece of state[side]){
        if(piece.removed) continue;
        if(piece.type === "token") piece.value = -Number(piece.value || 0);
        if(piece.type === "x") piece.sign = -xSign(piece);
      }
    }
    deleteSelection = [];
    groupSelection = [];
    selectedPieceRef = null;
    recordEquationStep(makeBothSidesOperation("×(−1)"));
    render();
  }

  /* MODE RÉCEPTION — billes unitaires de Splat Équations : « Partager équitablement » (« Faire des
     paquets » jusqu'au 23/10/2026). */
  function isImportedUnitMode(){
    return importedNumberMode === "unit" || document.body.classList.contains("importUnitMode");
  }

  function sideOnlyPositiveX(pieces){
    return pieces.length > 0 && pieces.every(p => p.type === "x" && xSign(p) > 0);
  }

  function sideOnlyUnitTokens(pieces){
    return pieces.length > 0 && pieces.every(p => p.type === "token" && p.unit && Number(p.value) === 1);
  }

  function divisorsOf(n){
    n = Math.max(1, Math.round(Number(n) || 1));
    const out = [];
    for(let d=1; d<=n; d++){
      if(n % d === 0) out.push(d);
    }
    return out;
  }

  function getUnitShareSituation(){
    if(!state || !isImportedUnitMode()) return null;
    const left = activePieces("left");
    const right = activePieces("right");

    function build(varSide, tokenSide, xPieces, tokenPieces){
      const xCount = xPieces.length;
      const tokenCount = tokenPieces.length;
      if(xCount <= 1 || tokenCount <= 0) return null;
      return {
        varSide,
        tokenSide,
        xCount,
        tokenCount,
        parts:divisorsOf(tokenCount).filter(n => n >= 2)
      };
    }

    if(sideOnlyPositiveX(left) && sideOnlyUnitTokens(right)){
      return build("left", "right", left, right);
    }
    if(sideOnlyUnitTokens(left) && sideOnlyPositiveX(right)){
      return build("right", "left", right, left);
    }
    return null;
  }

  function getUnitShareOpportunity(){
    const situation = getUnitShareSituation();
    if(!situation || situation.tokenCount % situation.xCount !== 0) return null;
    return {...situation, each:situation.tokenCount / situation.xCount};
  }

  function clearUnitPacketConclusion(){
    if(!state) return;
    if(state._unitPacketConclusion && Array.isArray(state.steps) && state.steps.length){
      state.steps.pop();
      if(Array.isArray(state.stepOps) && state.stepOps.length) state.stepOps.pop();
    }
    delete state._unitPacketConclusion;
  }

  function addUnitPacketConclusion(value, operationLabel, varSide="left"){
    if(!state) return;
    const n = Math.round(Number(value) || 0);
    const unknown = displayedUnknown();
    // Comme la conclusion ordinaire, on garde l'inconnue du côté où elle était.
    const eq = varSide === "right" ? `${n} = ${unknown}` : `${unknown} = ${n}`;
    if(!Array.isArray(state.steps)) state.steps = [];
    if(!Array.isArray(state.stepOps)) state.stepOps = [];
    if(state.steps[state.steps.length - 1] !== eq){
      if(state.steps.length > 0) state.stepOps.push(makeBothSidesOperation(operationLabel));
      state.steps.push(eq);
    }
    state._unitPacketConclusion = true;
  }

  function applyUnitPacketChoice(packetCount){
    const situation = getUnitShareSituation();
    packetCount = Math.round(Number(packetCount) || 0);
    if(!situation || packetCount <= 0 || situation.tokenCount % packetCount !== 0){
      setInstruction("Choisis un partage possible des jetons.");
      return;
    }

    pushHistory();
    clearUnitPacketConclusion();

    const each = situation.tokenCount / packetCount;
    const isCorrectShare = packetCount === situation.xCount;
    unitPacketChoice = {
      side:situation.tokenSide,
      packetCount,
      each,
      xCount:situation.xCount,
      tokenCount:situation.tokenCount,
      isCorrect:!!isCorrectShare
    };

    if(isCorrectShare){
      // Même rituel qu'avec les jetons numérotés : les mini-plateaux apparaissent,
      // l'élève en touche un, et « ÷ k » puis « 𝑛 = … » s'écrivent à ce moment-là.
      beginPendingShareConclusion({count:situation.xCount, xSide:situation.varSide, tokenSide:situation.tokenSide}, each);
      state.pendingShareConclusion.unit = true;
    }

    deleteSelection = [];
    groupSelection = [];
    selectedPieceRef = null;
    pendingFusion = null;
    /* Le choix fait, on revient au mode de départ, comme avant ; ce mode est maintenant « aucun bouton »
       (15/10/2026) : « Enlever », que l'élève n'a pas touché, ne s'allume plus tout seul ici. */
    setActionMode(null);
    if(!(state && state.pendingShareConclusion)) setInstruction("");
  }

  function applyUnitShareTokens(){
    dismissInitialEqualityInstruction();
    const situation = getUnitShareSituation();
    if(!situation){
      setInstruction("On peut partager quand il ne reste que plusieurs taches d’un côté et des jetons unitaires de l’autre.");
      return;
    }
    /* le bouton touché s'allume, comme les autres, le temps de la fenêtre ; elle s'ouvre tout de suite
       (23/10/2026 : on partage le groupe, on ne touche aucun jeton) */
    setActionMode("unitShare");
    openUnitShareDialog(situation);
  }

  function renderActions(){
    actionZone.innerHTML = "";
    solutionEl.textContent = "";

    if(state && state.pendingShareConclusion){
      const count = state.pendingShareConclusion.count;
      setInstruction(`<span class="shareInstruction"><strong>${count} groupes identiques</strong> — touche-en un.</span>`);
      return;
    }

    if(isImportedUnitMode()){
      // Conclusion faite (mini-plateau touché) : plus rien à faire ici.
      if(state && state.conclusionDone){ setInstruction(""); return; }
      const situation = getUnitShareSituation();
      if(situation){
        // Les espaces autour des nombres sont insécables : la zone de consigne est
        // une boîte flex, et l'espace ordinaire entre deux éléments y disparaît
        // (« Il reste4taches et4jetons »).
        setInstruction(`Il reste&nbsp;<strong>${situation.xCount}</strong>&nbsp;taches et&nbsp;<strong>${situation.tokenCount}</strong>&nbsp;jetons : on peut partager.`);
        // Cette consigne doit rester : sans elle, le message générique du mode
        // « Enlever » (« Sélectionne la même quantité dans les deux membres »)
        // reprend la main alors qu'il ne reste que des taches d'un côté et des
        // billes de l'autre — il n'y a plus rien à enlever. Tant qu'aucune
        // pièce n'est sélectionnée, on s'arrête ici.
        const selection = selectedDeletePiecesBySide();
        if(actionMode === "delete" && !selection.left.length && !selection.right.length) return;
      }else if(actionMode !== "delete"){
        /* le nom du bouton tel que l'élève le voit : « Partager » au téléphone (25/10/2026, choix de Gwenaël) */
        setInstruction("Avec les petits jetons, utilise surtout&nbsp;<strong>Enlever des deux côtés</strong>, puis&nbsp;<strong><span class=\"desktopLabel\">Partager équitablement</span><span class=\"mobileLabel\">Partager</span></strong>&nbsp;quand il ne reste que des taches d’un côté.");
      }
    }

    /* −2𝑥 = −16 PARTAGÉ AVANT L'OPPOSÉ (15/10/2026, choix de Gwenaël). Partager −16 en 2 face à
       deux taches −𝑥 laisse « −𝑥 −𝑥 = −8 −8 » : rien ne s'écrit (une tache −𝑥 n'est pas 𝑥, pas de
       conclusion magique), et l'élève ne savait plus quoi faire. Une phrase l'oriente ; l'outil
       ne calcule rien à sa place. Tant qu'il ne sélectionne rien (sinon ses boutons d'action). */
    if(oppositeTachesFacingEqualTokens() && !deleteSelection.length && !groupSelection.length){
      const v = displayedUnknown();
      setInstruction(`Prends l’opposé pour trouver ${v === "?" ? "la valeur cachée" : escapeHtml(v)}.`);
      return;
    }

    const conclusionInfo = getConclusionInfo();
    if(conclusionInfo){
      if(conclusionInfo.count === 1 || (state && state.conclusionDone)){
        setInstruction("");
        return;
      }
      /* « 0 = 4𝑥 » (15/10/2026, choix de Gwenaël) : rien en face des taches, il n'y a rien à
         partager — la phrase le dit, au lieu de garder « La paire nulle vaut 0… ». */
      setInstruction(Number(conclusionInfo.value) === 0
        ? "De l’autre côté, il ne reste rien. On peut conclure."
        : "On voit maintenant la valeur d’une tache. On peut conclure.");
      const btn = document.createElement("button");
      btn.className = "green";
      btn.textContent = "Conclure";
      btn.addEventListener("click", concludeSolution);
      actionZone.appendChild(btn);
      return;
    }

    /* Partager équitablement (petits jetons) : tout se passe dans la fenêtre ; plus de rangée de
       boutons « 3 paquets de 2 » sous le plateau (23/10/2026) */
    if(actionMode === "unitShare"){
      if(!getUnitShareSituation()) setInstruction("On peut partager quand il ne reste que plusieurs taches d’un côté et des jetons unitaires de l’autre.");
      return;
    }

    if(actionMode === "decompose"){
      setInstruction("Touche le jeton à décomposer.");
      return;
    }

    if(actionMode === "group"){
      const info = groupSelectionInfo();
      const selected = selectedGroupPieces();
      if(selected.length === 0){
        setInstruction(oppositeXEnabled()
          ? `Touche les jetons à regrouper, ou une tache ${unknownHtml()} et une tache −${unknownHtml()}, du même côté.`
          : "Touche les jetons à regrouper, du même côté.");
        return;
      }

      const btn = document.createElement("button");
      btn.className = "green";
      btn.textContent = "Regrouper";
      btn.addEventListener("click", () => {
        const freshInfo = groupSelectionInfo();
        if(freshInfo.ok && freshInfo.kind === "zeroX") applyZeroXGroup(freshInfo);
        else openGroupDialog();
      });

      const clear = document.createElement("button");
      clear.className = "ghost";
      clear.textContent = "Effacer";
      clear.addEventListener("click", () => { groupSelection = []; render(); });

      if(!info.ok){
        setInstruction(groupHint(selected));
        actionZone.appendChild(clear);
        return;
      }

      if(info.kind === "zeroX"){
        setInstruction(zeroXPairSelectedInstruction());
        actionZone.appendChild(btn);
        actionZone.appendChild(clear);
        return;
      }

      setInstruction(`<strong>${selected.length}</strong>&nbsp;jetons sélectionnés. Calcule leur somme pour les regrouper.`);
      actionZone.appendChild(btn);
      actionZone.appendChild(clear);
      return;
    }

    if(actionMode === "share"){
      // La consigne ne dit JAMAIS en combien de parts : c'est précisément ce que
      // l'élève doit décider (14 en 2 parts de 7, ou en 7 parts de 2 ?). Elle
      // annonçait « Partage 14 en 2 parts égales », c'est-à-dire la réponse.
      // La fenêtre de partage, elle, propose tous les partages entiers dans
      // l'ordre des diviseurs, sans en mettre un en avant.
      setInstruction("Touche le jeton à partager.");
      return;
    }

    if(actionMode === "delete"){
      const info = deletionGroupInfo();
      const zeroInfo = zeroXPairSelectionInfo();
      const {left, right} = selectedDeletePiecesBySide();
      if(left.length === 0 && right.length === 0){
        setInstruction(oppositeXEnabled()
          ? `Sélectionne la même quantité des deux côtés, ou une paire ${unknownHtml()} / −${unknownHtml()} d’un même côté.`
          : "Sélectionne la même quantité des deux côtés.");
        return;
      }
      if(zeroInfo.ok){
        setInstruction(zeroXPairSelectedInstruction());
        const btn = document.createElement("button");
        btn.className = "green";
        btn.textContent = "Annuler la paire";
        btn.addEventListener("click", cancelZeroXPair);
        actionZone.appendChild(btn);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
        return;
      }
      if(left.length === 0 || right.length === 0){
        let message = "Sélectionne maintenant l’autre côté.";
        if(oppositeXEnabled() && (left.length || right.length)){
          const selected = left.length ? left : right;
          if(selected.every(p => p.type === "x")){
            const coef = selected.reduce((sum,p)=>sum + xSign(p), 0);
            if(coef !== 0) message = `Pour annuler d’un même côté, sélectionne autant de taches ${unknownHtml()} que de taches −${unknownHtml()}.`;
          }
        }
        setInstruction(message);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
        return;
      }
      if(info.ok){
        setInstruction(`Même quantité sélectionnée :&nbsp;<strong>${info.label}</strong>.`);
        const btn = document.createElement("button");
        btn.className = "orange";
        btn.textContent = "Valider la suppression";
        btn.addEventListener("click", deleteMatching);
        actionZone.appendChild(btn);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer la sélection";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
      }else{
        let reason = "Les deux quantités sélectionnées ne sont pas identiques.";
        if(info.reason === "differentCounts") reason = "Il faut le même nombre de taches de chaque côté.";
        else if(info.reason === "differentXCoef") reason = "Les taches sélectionnées ne représentent pas la même quantité d’inconnues.";
        else if(info.reason === "zeroXSelection") reason = `Pour annuler une paire nulle, sélectionne les taches ${unknownHtml()} et −${unknownHtml()} d’un seul côté.`;
        else if(info.reason === "differentSums") reason = "Les jetons sélectionnés ne font pas la même somme.";
        else if(info.reason === "mixedTypes") reason = "Ne mélange pas taches et jetons numériques.";
        setInstruction(reason);
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "Effacer la sélection";
        clear.addEventListener("click", () => { deleteSelection = []; render(); });
        actionZone.appendChild(clear);
      }
    }
  }

  /* MODE RÉCEPTION — zone de validation stable et espace des commandes au téléphone. */
  function stabilizeMobileActionZone(){
    if(!isMobileImportLayout()) return;
    for(const child of Array.from(actionZone.children)){
      if(child.tagName === "BUTTON" && /^Effacer/.test(child.textContent || "")){
        child.remove();
      }
    }

    const children = Array.from(actionZone.children);
    if(children.some(child => child.classList.contains("btnrow"))) return;

    const makePlaceholder = (label) => {
      const button = document.createElement("button");
      button.type = "button";
      button.disabled = true;
      button.className = "actionPlaceholder";
      button.textContent = label;
      return button;
    };

    if(children.length === 0){
      actionZone.appendChild(makePlaceholder("Valider"));
    }
  }

  function syncMobileBottomControlsSpace(){
    if(!mobileBottomControlsEl) return;
    const docked = window.matchMedia(MOBILE_IMPORT_QUERY).matches
      && document.body.classList.contains("importMode")
      && !document.fullscreenElement
      && window.getComputedStyle(mobileBottomControlsEl).position === "fixed";
    const height = docked ? Math.ceil(mobileBottomControlsEl.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty("--mobile-controls-height", `${height}px`);
  }

  if(mobileBottomControlsEl && typeof ResizeObserver === "function"){
    new ResizeObserver(syncMobileBottomControlsSpace).observe(mobileBottomControlsEl);
  }
  window.addEventListener("resize", syncMobileBottomControlsSpace);
  document.addEventListener("fullscreenchange", syncMobileBottomControlsSpace);

  // PATCH ESPACE 2026-08-22 — le plateau suit la taille réelle de son cadre.
  let svgRedrawHandle = 0;
  function scheduleSvgRedraw(){
    if(svgRedrawHandle) cancelAnimationFrame(svgRedrawHandle);
    svgRedrawHandle = requestAnimationFrame(() => {
      svgRedrawHandle = 0;
      if(state && !dragState) renderSvg();
    });
  }
  window.addEventListener("resize", scheduleSvgRedraw);
  document.addEventListener("fullscreenchange", scheduleSvgRedraw);
  if(typeof ResizeObserver === "function"){
    new ResizeObserver(scheduleSvgRedraw).observe(svg);
  }

  const btnToggleEquation = document.getElementById("btnToggleEquation");
  const btnToggleUnknown = document.getElementById("btnToggleUnknown");

        <path d="M6.5 6.7A15.8 15.8 0 0 0 2.3 11c-.2.3-.2.7 0 1.1C3.3 13.7 6.8 18 12 18c1.3 0 2.5-.3 3.6-.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.8 9.8a3.1 3.1 0 0 0 4.4 4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

      <circle cx="12" cy="11.7" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>

  function syncEquationToggleButton(){
    if(!btnToggleEquation || !stageEl) return;
    const hidden = stageEl.classList.contains("equationHidden");
    btnToggleEquation.innerHTML = eyeIconSvg(hidden);
    btnToggleEquation.title = hidden ? "Afficher l’équation" : "Masquer l’équation";
    btnToggleEquation.classList.toggle("is-hidden", hidden);
  }
  if(btnToggleEquation && stageEl){
    btnToggleEquation.addEventListener("click", () => {
      stageEl.classList.toggle("equationHidden");
      syncEquationToggleButton();
    });
    syncEquationToggleButton();
  }

  // Lettre / « ? » : même réglage que le menu, mais accessible pendant l'activité.
  function syncUnknownToggleButton(){
    const btnToggleUnknown = document.getElementById("btnToggleUnknown");
    if(!btnToggleUnknown) return;
    const question = !!(unknownDisplayModeEl && unknownDisplayModeEl.value === "question");
    btnToggleUnknown.textContent = question ? "?" : currentVar();
    btnToggleUnknown.title = question ? "Écrire l’inconnue avec sa lettre" : "Écrire l’inconnue avec un ?";
    btnToggleUnknown.classList.toggle("is-question", question);
  }
  function escapeRegExp(text){ return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function convertUnknownInText(text, toQuestion){
    // Réécrit une ligne déjà dans l'historique avec l'autre écriture de l'inconnue,
    // en suivant exactement formatXTerm : « 3a » ⇄ « 3 × ? », « a » ⇄ « ? ».
    const v = currentVar();
    const str = String(text || "");
    if(toQuestion){
      return str.replace(new RegExp("(\\d+)" + escapeRegExp(v), "g"), "$1 × ?").split(v).join("?");
    }
    return str.replace(/(\d+) × \?/g, `$1${v}`).split("?").join(v);
  }
  if(btnToggleUnknown && unknownDisplayModeEl){
    btnToggleUnknown.addEventListener("click", () => {
      const toQuestion = unknownDisplayModeEl.value !== "question";
      unknownDisplayModeEl.value = toQuestion ? "question" : "letter";
      // Contrairement au menu de départ, on ne repart pas de zéro : les lignes
      // déjà écrites par l'élève sont conservées et réécrites avec la nouvelle écriture.
      if(state && Array.isArray(state.steps)){
        state.steps = state.steps.map(line => convertUnknownInText(line, toQuestion));
      }
      if(state && Array.isArray(state.stepOps)){
        state.stepOps = state.stepOps.map(op => op && op.label ? {...op, label:convertUnknownInText(op.label, toQuestion)} : op);
      }
      syncUnknownToggleButton();
      if(state) render();
      /* bandeau « Bravo » déjà posé (parcours élève) : il suit la nouvelle écriture */
      if(document.body.classList.contains("eleveBravoVisible")) eleveEtatResolue("bravo");
    });
    unknownDisplayModeEl.addEventListener("change", syncUnknownToggleButton);
    syncUnknownToggleButton();
  }

  // Hachures : garder hachuré / masquer ce que l'on enlève — même réglage que le
  // menu de départ (« Après suppression »), mais accessible pendant l'activité
  // et en réception, où le menu n'existe pas.
  const btnToggleRemoved = document.getElementById("btnToggleRemoved");
  function removedIconSvg(hiding=false){
    const hatch = hiding ? "" : `
      <g clip-path="url(#removedIconClip)" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M1 13 L13 1"/><path d="M3 19 L19 3"/><path d="M8 22 L22 8"/><path d="M14 24 L24 14"/>
      </g>`;
    return `<svg viewBox="0 0 24 24" aria-hidden="true">
      <defs><clipPath id="removedIconClip"><circle cx="12" cy="12" r="8.6"/></clipPath></defs>
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2"${hiding ? ' stroke-dasharray="2.6 2.6"' : ""}/>
      ${hatch}
    </svg>`;
  }
  function syncRemovedToggleButton(){
    if(!btnToggleRemoved) return;
    const hiding = !shouldKeepRemovedPieces();
    btnToggleRemoved.innerHTML = removedIconSvg(hiding);
    btnToggleRemoved.title = hiding ? "Garder hachuré ce que l’on enlève" : "Masquer ce que l’on enlève";
    btnToggleRemoved.classList.toggle("is-hiding", hiding);
  }
  if(btnToggleRemoved && removedDisplayModeEl){
    btnToggleRemoved.addEventListener("click", () => {
      removedDisplayModeEl.value = shouldKeepRemovedPieces() ? "hide" : "keep";
      syncRemovedToggleButton();
      if(state) render();
    });
    removedDisplayModeEl.addEventListener("change", syncRemovedToggleButton);
    syncRemovedToggleButton();
  }

  function render(){
    if(!state) return;
    const sharePending = !!state.pendingShareConclusion;
    [toolDecompose, toolGroup, toolShare, toolShareUnits, toolDelete, toolAddBoth, toolOppositeBoth].forEach(button => {
      if(button) button.disabled = sharePending;
    });
    // Seule la dernière ligne « 𝑥 = … » se réécrit ici. Plus de « 3𝑥 = 3 × 8 » posé sur
    // « 3𝑥 = 24 » quand des décompositions laissent trois jetons de 8 (28/09/2026) :
    // « Conclure » écrit ÷ 3 depuis « 3𝑥 = 24 ».
    const conclusion = getConclusionInfo();
    if(conclusion && (conclusion.count === 1 || state.conclusionDone)) updateCurrentEquationStep();
    renderEquationHistory();
    syncUnknownToggleButton();
    renderSvg();
    renderActions();
    stabilizeMobileActionZone();
    requestAnimationFrame(syncMobileBottomControlsSpace);
  }

  const mobileImportMedia = window.matchMedia(MOBILE_IMPORT_QUERY);
  const rerenderForMobileLayoutChange = () => {
    if(state && isImportLayout()) render();
  };
  if(typeof mobileImportMedia.addEventListener === "function") mobileImportMedia.addEventListener("change", rerenderForMobileLayoutChange);
  else if(typeof mobileImportMedia.addListener === "function") mobileImportMedia.addListener(rerenderForMobileLayoutChange);

  function undo(){
    if(!history.length) return;
    state = history.pop();
    unitPacketChoice = null;
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    render();
  }

  function syncUniverseUI(options={validate:false}){
    if(!workUniverseEl) return;
    const relative = isRelativeUniverse();
    const allowOppositeX = oppositeXEnabled();

    if(oppositeXModeEl){
      oppositeXModeEl.disabled = !relative;
      if(!relative) oppositeXModeEl.value = "off";
    }
    if(oppositeXModeWrap) oppositeXModeWrap.classList.toggle("isDisabledSoft", !relative);
    if(oppositeXModeLabel) oppositeXModeLabel.style.opacity = "1";
    if(equationWritingModeWrap) equationWritingModeWrap.classList.toggle("isDisabledSoft", !relative);
    if(equationWritingModeEl) equationWritingModeEl.disabled = !relative;

    if(toolAddBoth){
      toolAddBoth.title = relative ? "Ajouter un jeton positif ou négatif des deux côtés" : "Ajouter un jeton positif des deux côtés";
    }
    if(toolOppositeBoth){
      toolOppositeBoth.style.display = allowOppositeX ? "" : "none";
    }

    [constBEl, constCEl, constDEl].forEach(el => {
      if(!el) return;
      el.min = relative ? "-200" : "0";
      el.max = "200";
      if(!relative && Number(el.value) < 0) el.value = "0";
    });
    if(constCEl && !relative && Number(constCEl.value) < 1) constCEl.value = "1";

    [coefAEl, coefCEl].forEach(el => {
      if(!el) return;
      el.min = allowOppositeX ? "-8" : "1";
      el.max = "8";
      if(!allowOppositeX && Number(el.value) < 1) el.value = "1";
      if(allowOppositeX && Number(el.value) === 0) el.value = "1";
    });
    if(!allowOppositeX && coefAEl && Number(coefAEl.value) < 2) coefAEl.value = "2";

    if(options.validate !== false) updateProfEquationInfo();
  }

  /* ══════════════════════════════════════════════════════════════════
     MODE RÉCEPTION — IMPORT SPLAT ÉQUATIONS / AUTOMATISMES → ÉQUASPLAT
     (repris de l'ancienne page equasplat_import_splat.html, devenue une
     redirection vers celle-ci).
     La page peut recevoir une équation dans l'adresse, en JSON (encodé en
     URL ou en base64url) dans ?data=..., ?eqs=..., #data=... ou directement
     dans l'ancre. Format attendu : { source:"splat_equations", variable:"𝑥",
     unknownDisplay:"letter"|"question", universe:"positive"|"relative",
     numberMode:"grouped"|"unit", signedWritingMode:"simplified"|"parentheses",
     x:..., left/top/haut:[...], right/bottom/bas:[...] }.
     ══════════════════════════════════════════════════════════════════ */
  function decodeBase64Url(str){
    const clean = String(str || "").trim().replace(/-/g, "+").replace(/_/g, "/");
    const pad = clean.length % 4 ? "=".repeat(4 - (clean.length % 4)) : "";
    return decodeURIComponent(escape(atob(clean + pad)));
  }

  function readImportRawPayload(){
    const search = new URLSearchParams(window.location.search || "");
    if(search.has("data")) return search.get("data");
    if(search.has("eqs")) return search.get("eqs");

    const hash = String(window.location.hash || "").replace(/^#/, "");
    if(!hash) return "";
    const hashParams = new URLSearchParams(hash);
    if(hashParams.has("data")) return hashParams.get("data");
    if(hashParams.has("eqs")) return hashParams.get("eqs");
    return hash;
  }

  function parseImportedPayload(){
    const raw = readImportRawPayload();
    if(!raw) return null;

    const candidates = [];
    try{ candidates.push(decodeURIComponent(raw)); }catch(e){}
    try{ candidates.push(decodeBase64Url(raw)); }catch(e){}
    candidates.push(raw);

    for(const candidate of candidates){
      try{
        const parsed = JSON.parse(candidate);
        if(parsed && typeof parsed === "object") return parsed;
      }catch(e){}
    }
    return null;
  }

  function normalizeImportedPiece(piece){
    if(piece == null) return null;
    if(typeof piece === "number") return makeToken(piece);
    if(typeof piece === "string"){
      const s = piece.trim().toLowerCase();
      if(s === "x" || s === "𝑥" || s === "?") return makeX(1);
      if(s === "-x" || s === "−x" || s === "-𝑥" || s === "−𝑥") return makeX(-1);
      const n = Number(s.replace(",", ".").replace("−", "-"));
      return Number.isFinite(n) ? makeToken(n) : null;
    }
    if(typeof piece === "object"){
      const type = String(piece.type || piece.kind || "").toLowerCase();
      const rawSign = Number(piece.sign);
      const sign = rawSign < 0 || piece.opposed === true || piece.negative === true ? -1 : 1;
      if(type === "x" || type === "unknown" || type === "variable") return makeX(sign);
      if(type === "number" || type === "token" || type === "const" || type === "constant" || type === "v"){
        const n = Number(piece.value);
        return Number.isFinite(n) ? makeToken(n, {unit: piece.unit === true || piece.unit === "true"}) : null;
      }
    }
    return null;
  }

  /* Et un pirate ? (15/10/2026) Un lien fabriqué avec 3 000 jetons, ou 300 jetons de 80 en billes
     (24 000 billes), figeait la page plus de 30 secondes. Une équation reçue par lien garde la
     limite du menu du professeur (parseEquationInputToModel) : 80 objets sur le plateau au plus,
     billes comprises — les liens du site en ont 17 au plus. Une série garde 100 équations au plus
     (12 sur le site) : 20 000 équations faisaient 20 000 pastilles dans la barre. */
  const IMPORT_MAX_OBJETS = 80, IMPORT_MAX_SERIE = 100;

  function normalizeImportedSide(arr, opts = {}){
    if(!Array.isArray(arr) || arr.length > IMPORT_MAX_OBJETS) return [];
    const useUnits = !!opts.unitMode;
    const out = [];
    arr.forEach(raw => {
      if(out.length > IMPORT_MAX_OBJETS) return;
      const piece = normalizeImportedPiece(raw);
      if(!piece) return;
      if(piece.type === "token" && Number(piece.value) === 0) return;
      if(useUnits && piece.type === "token" && !piece.unit){
        const n = Number(piece.value);
        if(n > 0 && Number.isInteger(n) && n <= 80){
          for(let i=0;i<n;i++) out.push(makeToken(1, {unit:true}));
          return;
        }
      }
      out.push(piece);
    });
    return out;
  }

  function importedSideStats(pieces){
    return pieces.reduce((acc, p) => {
      if(p.type === "x") acc.x += xSign(p);
      else acc.n += Number(p.value) || 0;
      return acc;
    }, {x:0,n:0});
  }

  function inferImportedX(leftPieces, rightPieces){
    const l = importedSideStats(leftPieces);
    const r = importedSideStats(rightPieces);
    const denom = l.x - r.x;
    if(denom !== 0){
      const x = (r.n - l.n) / denom;
      if(Number.isFinite(x) && x !== 0) return x;
    }
    return 1;
  }

  function restartImportedEquation(){
    if(!initialImportState) return;
    state = clone(initialImportState);
    history = [];
    unitPacketChoice = null;
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    pendingFusion = null;
    setActionMode(null);
    showInitialEqualityInstruction();
  }

  function createImportedEquationState(payload){
    if(!payload || typeof payload !== "object") return false;

    /* Et un pirate ? (15/10/2026) La lettre arrive par le lien (#data=) : une seule lettre, sinon 𝑥.
       Un lien fabriqué glissait du code dans la page par la fenêtre Ajouter (la lettre y était
       écrite sans précaution), et ce code aurait pu lire le code élève du suivi. */
    const rawVar = typeof payload.variable === "string" ? payload.variable.trim() : "";
    const wantedVar = /^\p{L}$/u.test(rawVar) ? rawVar : "𝑥";
    const rawDisplay = String(payload.unknownDisplay || payload.display || "letter").toLowerCase();
    const wantedDisplay = (rawDisplay === "question" || rawDisplay === "?" || rawDisplay === "interrogation") ? "question" : "letter";

    const unitMode = String(payload.numberMode || payload.tokenMode || "").toLowerCase() === "unit";
    importedNumberMode = unitMode ? "unit" : "grouped";
    const rawSignedWritingMode = String(payload.signedWritingMode || payload.signedNotation || payload.writingMode || "simplified").toLowerCase();
    const parenthesesWriting = (rawSignedWritingMode === "parentheses" || rawSignedWritingMode === "parenthesis" || rawSignedWritingMode === "parenthèses");
    unitPacketChoice = null;
    const leftPieces = normalizeImportedSide(payload.left || payload.top || payload.haut || [], {unitMode});
    const rightPieces = normalizeImportedSide(payload.right || payload.bottom || payload.bas || [], {unitMode});
    if(!leftPieces.length || !rightPieces.length) return false;
    if(leftPieces.length + rightPieces.length > IMPORT_MAX_OBJETS) return false;

    const containsRelative = leftPieces.concat(rightPieces).some(p =>
      (p.type === "token" && Number(p.value) < 0) || (p.type === "x" && xSign(p) < 0)
    );
    const universe = String(payload.universe || payload.workUniverse || "").toLowerCase() === "relative" || containsRelative ? "relative" : "positive";
    if(workUniverseEl) workUniverseEl.value = universe;
    if(oppositeXModeEl) oppositeXModeEl.value = leftPieces.concat(rightPieces).some(p => p.type === "x" && xSign(p) < 0) ? "on" : "off";
    if(unknownDisplayModeEl) unknownDisplayModeEl.value = wantedDisplay;
    // L'écriture des relatifs suit la demande de l'émetteur : « x + (−4) »
    // (parenthèses = écriture détaillée) ou « x − 4 » (simplifiée).
    if(equationWritingModeEl) equationWritingModeEl.value = parenthesesWriting ? "detailed" : "simplified";
    // Dans l’activité importée, les éléments enlevés disparaissent toujours :
    // cela libère l’interface et évite toute ambiguïté entre l’état courant et l’historique.
    syncRemovedDisplayControls("hide");

    const importedX = Number(payload.x);
    const xValue = Number.isFinite(importedX) && importedX !== 0 ? importedX : inferImportedX(leftPieces, rightPieces);
    const statsLeft = importedSideStats(leftPieces);
    const statsRight = importedSideStats(rightPieces);

    state = {
      original:{
        mode:"import",
        modeLabel:"Import Splat Équations",
        a:statsLeft.x,
        b:statsLeft.n,
        rightA:statsRight.x,
        d:statsRight.n,
        x:xValue,
        c:statsRight.x * xValue + statsRight.n,
        varChar:wantedVar
      },
      left:leftPieces,
      right:rightPieces,
      steps:[],
      stepOps:[],
      conclusionDone:false,
      /* une carte de billes 1 / −1 (échauffement du monde 6) : en relatifs, tous les jetons
         valent 1 ou −1 — getConclusionInfo n'y propose pas le raccourci « 3 × (−1) » */
      billes:universe === "relative" && leftPieces.concat(rightPieces).some(p => p.type === "token") &&
        leftPieces.concat(rightPieces).every(p => p.type !== "token" || Math.abs(Number(p.value)) === 1)
    };

    recordEquationStep();
    initialImportState = clone(state);
    initialState = clone(state);
    history = [];
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    pendingFusion = null;
    syncUniverseUI({validate:false});
    syncTeacherControls({validate:false});
    setAppLayout("import");
    // Réception : on arrive en vue Classique (équation au-dessus du plateau, comme
    // avant la fusion) ; la vue Rédaction reste à un clic dans la barre du haut.
    setViewMode("classic");
    document.body.classList.toggle("importUnitMode", unitMode);
    setActionMode(null);
    showInitialEqualityInstruction();
    return true;
  }


  /* ══════════════════════════════════════════════════════════════════
     PARCOURS ÉLÈVE (?eleve=1&parcours=id + payload {serie:[...]})
     Une série d'équations à résoudre sur le plateau, l'une après l'autre.
     La progression est mémorisée dans le navigateur : on peut s'arrêter
     au milieu et reprendre plus tard là où on en était. ══════════════ */
  let eleveMode = false, eleveParcours = "", eleveEqs = [], eleveIdx = 0, eleveResolues = 0, eleveCompteeCourante = false, eleveAttenteSuivante = false;
  /* eleveRes[i] : true = résolue, "ko" = passée (rouge, à rejouer) ; eleveRejeu : file des rouges à rejouer ;
     elevePasserVisible : le bouton « Passer » est là tant que l'équation est en jeu. Depuis le 25/10/2026
     (choix de Gwenaël), il est visible DÈS LE DÉBUT, en discret : avant, il surgissait en jaune au bout
     de 1 min 30 sur la même équation, et cette apparition stressait les élèves. */
  let eleveRes = [], eleveRejeu = null, elevePasserVisible = false, eleveBravoTimer = null;
  const ELEVE_URL_MONDES = "/outils/splat_univers.html";
  /* équations de la série passées (« Passer ») : rejouées et résolues, elles redeviennent vertes —
     on les compte donc à part, c'est ce que le professeur voit (lot 2 du suivi) ; et la série
     est-elle déjà notée (sa fin s'écrit à la dernière équation, puis l'écran de fin la redemande) */
  let eleveVues = 0, eleveSerieNotee = false;

  /* Le parcours de l'élève (lot 2 « outils + carte » du suivi, 08/10/2026) : il s'écrit par le
     moteur partagé (assets/js/splat-parcours.js), au format que garde le serveur, dans la case
     de l'élève à code (son code est dans l'onglet, jamais dans l'adresse) ou dans la case sans
     code d'aujourd'hui ; « la meilleure série gagne ». assets/js/splat-suivi.js crée le client
     au premier besoin, met la pastille « ● Léa » dans la barre du haut et pose la garde. Sans
     ces fichiers, le jeu reste jouable : rien n'est enregistré. eleveLireEntree et
     eleveEcrireEntree gardent leur forme d'avant : {fait, etoiles, cartes} ou
     {enCours:{sig, idx, resolues, res}}, ou {} pour effacer la sauvegarde « en cours ». */
  let eleveSuiviObjet;
  function eleveSuivi(){
    if(eleveSuiviObjet === undefined){
      eleveSuiviObjet = null;
      if(eleveParcours && window.MathsGoSplatSuivi){
        eleveSuiviObjet = window.MathsGoSplatSuivi.creer({ surRepere: () => eleveSuiviObjet && eleveSuiviObjet.majPastilles() });
        if(eleveSuiviObjet) eleveSuiviObjet.lancer();
      }
    }
    return eleveSuiviObjet;
  }
  function eleveSuiviPastilleHtml(){ const s = eleveSuivi(); return s ? s.pastilleHtml() : ""; }
  function eleveLireEntree(){
    const s = eleveSuivi(), p = s ? s.lire() : null;
    const etape = p && p.etapes[eleveParcours] ? p.etapes[eleveParcours] : null;
    if(!etape) return null;
    const entree = Object.assign({}, etape);
    /* le moteur range « etoiles » ; ÉquaSplat lit « resolues » */
    if(etape.enCours) entree.enCours = { sig: etape.enCours.sig, idx: etape.enCours.idx, resolues: etape.enCours.etoiles, res: etape.enCours.res };
    return entree;
  }
  function eleveEcrireEntree(entree){
    if(!eleveParcours || !entree) return;
    const s = eleveSuivi();
    if(!s) return;
    if(entree.fait){
      if(eleveSerieNotee) return;
      eleveSerieNotee = true;
      s.ecrire((P, p) => P.enregistrerSerie(p, eleveParcours, { fait: true, etoiles: entree.etoiles, cartes: entree.cartes, vues: eleveVues }));
    }else if(entree.enCours){
      const e = entree.enCours;
      s.ecrire((P, p) => P.enregistrerEnCours(p, eleveParcours, { sig: e.sig, idx: e.idx, etoiles: e.resolues, res: e.res, vues: eleveVues, cartes: eleveEqs.length }));
    }else{
      const avant = eleveLireEntree();
      if(avant && (avant.enCours || avant.idx)) s.ecrire((P, p) => P.effacerEnCours(p, eleveParcours));
    }
  }
  /* à la reprise : les équations passées de la série en cours — celles encore rouges, ou ce que
     la case en a gardé (une étape pas encore étoilée garde le compte, rouges rejouées comprises) */
  function eleveVuesReprise(entree, res){
    const rouges = res.filter(r => r === "ko").length;
    return entree && !entree.fait ? Math.max(rouges, Number(entree.vues) || 0) : rouges;
  }

  /* Une pastille par équation : verte = résolue, rouge = passée (à rejouer),
     contour bleu = en cours. L'étoile récompense l'étape entière sur la carte
     des mondes, et ne s'allume que sans pastille rouge. */
  function elevePastillesHtml(){
    let out = "";
    for(let i = 0; i < eleveEqs.length; i++){
      let cls = "p";
      if(eleveRes[i] === true) cls += " ok";
      else if(eleveRes[i] === "ko") cls += " ko";
      if(i === eleveIdx && eleveIdx < eleveEqs.length) cls += " cur";
      out += `<i class="${cls}"></i>`;
    }
    const n = eleveRes.filter(r => r === true).length;
    return `<span class="elevePastilles" role="img" aria-label="${n} \u00e9quation${n > 1 ? "s" : ""} r\u00e9solue${n > 1 ? "s" : ""} sur ${eleveEqs.length}">${out}</span>`;
  }
  /* Sur téléphone, la barre doit tenir sur UNE ligne : sinon elle pousse le
     cadre de l'équation et cache la dernière ligne, c'est-à-dire la solution. */
  function eleveEcranEtroit(){ return window.innerWidth <= 760; }
  /* « Étape suivante ▶ » (lot A, 25/09/2026) : le lien passe par la carte des
     mondes (?apres=<parcours>), qui renvoie aussitôt au jeu de l'étape suivante ;
     assets/js/splat-etapes.js écrit sous le bouton où il mène (« Étape 36 · Des
     paquets de jetons », « Nouveau monde : … »). Sans ce fichier : le bouton seul. */
  function eleveEtapeSuivante(){
    if(window.MathsGoSplatEtapes) return window.MathsGoSplatEtapes.bouton(eleveParcours, ELEVE_URL_MONDES);
    return { html: "\u00c9tape suivante \u25b6", href: `${ELEVE_URL_MONDES}?apres=${encodeURIComponent(eleveParcours)}`, versCarte: false };
  }
  function eleveLienMondesHtml(classe, libelle){
    if(!eleveParcours) return "";
    return `<a class="${classe}" href="${ELEVE_URL_MONDES}" title="Retour \u00e0 la carte des mondes">` +
      (libelle || '\u25c0 <span class="txt">Carte des mondes</span>') + `</a>`;
  }
  function eleveBarreHtml(message){
    return eleveLienMondesHtml("eleveMondes") +
           `<span class="eleveBarreTexte"><span class="mot">\u00c9quation </span>${Math.min(eleveIdx + 1, eleveEqs.length)} / ${eleveEqs.length}</span>` +
           elevePastillesHtml() +
           (message && !(eleveAttenteSuivante && eleveEcranEtroit()) ? `<span class="eleveBarreNote">${message}</span>` : "") +
           (!eleveAttenteSuivante && elevePasserVisible ? `<button type="button" id="elevePasser" title="Je bloque : passer \u00e0 la suivante, je la rejouerai \u00e0 la fin">Passer \u25b6</button>` : "") +
           eleveSuiviPastilleHtml(); /* « ● Léa » au bout de la barre, sous un code (lot 2 du suivi) */
  }
  function eleveMajBarre(message){
    let barre = document.getElementById("eleveBarre");
    if(!barre){
      barre = document.createElement("div");
      barre.id = "eleveBarre";
      eleveHote().prepend(barre);
      /* le bouton est reconstruit avec la barre : un seul écouteur, délégué */
      barre.addEventListener("click", ev => {
        if(ev.target && ev.target.id === "elevePasser") elevePasser();
      });
    }
    barre.innerHTML = eleveBarreHtml(message || "");
    eleveMesurerBarre(); /* le message ou le bouton a pu changer sa hauteur */
  }

  /* Équation résolue (21/10/2026) : « fige » grise les boutons et le plateau, « bravo » pose le
     bandeau vert à leur place (sous le plateau), « » remet tout en jeu. Le bandeau recopie la
     dernière ligne écrite, l'inconnue d'abord (« 2 = 𝑏 » → « 𝑏 = 2 ») : l'outil ne calcule rien
     que l'élève n'a pas déjà écrit. Sans ligne de solution lisible, « 🎉 Bravo ! » seul. */
  function eleveSolutionTexte(){
    const steps = state && Array.isArray(state.steps) ? state.steps : [];
    const derniere = steps.length ? steps[steps.length - 1] : currentEquationString();
    if(!isSolvedEquationString(derniere)) return "";
    const {lhs, rhs} = splitEquation(derniere);
    const v = displayedUnknown();
    return lhs === v ? `${lhs} = ${rhs}` : `${rhs} = ${lhs}`;
  }
  /* Le bandeau centré dans la zone sous le plateau (21/10/2026, remarque de Gwenaël : « il ne me paraît pas centré ») :
     sur ordinateur et tablette, sous les boutons, la zone d'action (« Valider la suppression ») garde sa place vide ; le
     bandeau couvre donc les boutons ET cette zone, et se centre sur l'ensemble (mesuré à 1440 × 791 : 29 px au-dessus,
     81 en dessous avant ; 54 et 55 après). Au téléphone, on n'y touche pas : le bandeau reste sur les boutons (depuis
     le 23/10/2026, plus de lien « Sans cookie ni traceur » sous la zone d'action : la place rendue va au cadre de
     l'équation, en haut, et les boutons gardent le même écart avec le plateau). Rien ne bouge : le bandeau est posé
     par-dessus, il ne prend pas de place. */
  function eleveCentrerBravo(){
    const bravo = document.getElementById("eleveBravo"), outils = document.getElementById("toolBar");
    if(!bravo || bravo.hidden || !outils) return;
    let bas = 0;
    const zone = document.getElementById("actionZone");
    if(zone && !eleveEcranEtroit()){
      const ecart = zone.getBoundingClientRect().bottom - outils.getBoundingClientRect().bottom;
      if(ecart > 0 && ecart < 200) bas = ecart;
    }
    bravo.style.bottom = bas ? `${-Math.round(bas)}px` : "";
  }
  window.addEventListener("resize", eleveCentrerBravo);
  document.addEventListener("fullscreenchange", () => window.requestAnimationFrame(eleveCentrerBravo));

  function eleveEtatResolue(etat){
    document.body.classList.toggle("eleveResolue", etat === "fige" || etat === "bravo");
    document.body.classList.toggle("eleveBravoVisible", etat === "bravo");
    let bravo = document.getElementById("eleveBravo");
    if(etat !== "bravo"){ if(bravo) bravo.hidden = true; return; }
    const outils = document.getElementById("toolBar");
    if(!outils) return;
    if(!bravo){
      bravo = document.createElement("div");
      bravo.id = "eleveBravo";
      bravo.setAttribute("role", "status");
      bravo.addEventListener("click", ev => {
        if(!ev.target || !ev.target.closest("button")) return;
        eleveAttenteSuivante = false;
        eleveEquationSuivante();
      });
    }
    if(bravo.parentNode !== outils) outils.appendChild(bravo);
    const solution = eleveSolutionTexte();
    bravo.innerHTML = `<div class="bravoBandeau"><span class="bravoTexte">\ud83c\udf89 Bravo\u00a0!` +
      (solution ? ` Tu as trouv\u00e9 <span class="bravoSolution">${escapeHtml(solution)}</span>` : ``) + `</span>` +
      `<button type="button">\u00c9quation suivante \u25b6</button></div>`;
    bravo.hidden = false;
    eleveCentrerBravo();
    const bouton = bravo.querySelector("button");
    if(bouton) bouton.focus({ preventScroll: true }); /* Entr\u00e9e suffit pour encha\u00eener */
  }

  /* Plein écran (09/10/2026). Le bouton ⛶ met la SCÈNE seule en plein écran (#stage) :
     le navigateur n'affiche plus rien d'autre. Or la barre du parcours (pastilles,
     « Passer ▶ », « Équation suivante ▶ »), le carton de fin de série et la question
     « C'est toujours toi ? » du suivi (assets/js/splat-suivi.js) sont posés sur <body> :
     ils existaient, mais invisibles — l'élève résolvait son équation et restait bloqué.
     On les range donc DANS la scène le temps du plein écran, et on les remet sur <body>
     à la sortie. La garde du suivi, construite à son premier besoin, peut naître en plein
     écran : un observateur la rattrape. Le focus suit l'élément déplacé (Entrée suffit
     toujours pour enchaîner). */
  function eleveHote(){
    return document.fullscreenElement && document.fullscreenElement === stageEl ? stageEl : document.body;
  }
  function eleveMesurerBarre(){
    const barre = document.getElementById("eleveBarre");
    if(barre && barre.parentNode === stageEl) stageEl.style.setProperty("--eleve-barre-h", barre.offsetHeight + "px");
  }
  function eleveRangerPleinEcran(){
    if(!eleveMode) return;
    const hote = eleveHote(), actif = document.activeElement;
    const ranger = (el, enTete) => {
      if(!el || el.parentNode === hote) return;
      const avaitFocus = actif && el.contains(actif);
      if(enTete) hote.prepend(el); else hote.appendChild(el);
      if(avaitFocus && typeof actif.focus === "function") actif.focus();
      /* garde du suivi née en plein écran : elle a voulu donner le focus à son champ alors
         qu'elle était encore hors de la scène, le navigateur l'a refusé — on le redonne */
      else if(el.matches("[data-suivi-garde]") && !el.hidden){
        const champ = el.querySelector("input");
        if(champ) champ.focus({ preventScroll: true });
      }
    };
    ranger(document.getElementById("eleveBarre"), true);
    document.querySelectorAll(".eleveVoile, [data-suivi-garde]").forEach(el => ranger(el, false));
    eleveMesurerBarre();
  }
  document.addEventListener("fullscreenchange", eleveRangerPleinEcran);
  if(typeof MutationObserver === "function"){
    new MutationObserver(() => { if(eleveMode && eleveHote() === stageEl) eleveRangerPleinEcran(); })
      .observe(document.body, { childList: true });
  }

  function eleveChargerEquation(){
    eleveCompteeCourante = false;
    elevePasserVisible = false;
    if(eleveBravoTimer){ window.clearTimeout(eleveBravoTimer); eleveBravoTimer = null; }
    eleveEtatResolue("");
    const ok = createImportedEquationState(eleveEqs[eleveIdx]);
    if(ok){
      elevePasserVisible = true; /* « Passer » discret, là dès le début (25/10/2026) */
      eleveMajBarre();
    }
    return ok;
  }

  /* Équation suivante : dans l'ordre, ou la prochaine rouge quand on les rejoue. */
  function eleveEquationSuivante(){
    if(eleveRejeu){
      if(eleveRejeu.length){ eleveIdx = eleveRejeu.shift(); }
      else { eleveRejeu = null; eleveIdx = eleveEqs.length; }
    }else{
      eleveIdx++;
    }
    if(eleveIdx >= eleveEqs.length){ eleveFinDeSerie(); return; }
    eleveChargerEquation();
  }

  /* L'empreinte de la série (lot Q5, 25/09/2026) : la même étoile peut se gagner avec deux
     séries différentes — la fiche 35 du livret et la fiche 35 du livret « Le défi » ont le même
     parcours (m3e1). La reprise « en cours » ne vaut donc que pour la série qui l'a écrite,
     comme dans splat.html (monde 2) ; une sauvegarde d'avant l'empreinte n'est pas reprise
     (l'étoile, elle, reste). FNV-1a 32 bits sur les équations de la série. */
  function eleveSignatureSerie(){
    const t = JSON.stringify(eleveEqs);
    let h = 0x811c9dc5;
    for(let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return eleveEqs.length + ":" + h.toString(16).padStart(8, "0");
  }

  function eleveSauverEnCours(){
    const suivante = eleveIdx + 1;
    /* dernière équation jouée, ou équation rouge rejouée : la série est finie */
    if(eleveRejeu || suivante >= eleveEqs.length){ eleveSauverFinDeSerie(); return; }
    eleveEcrireEntree({ enCours:{ sig:eleveSignatureSerie(), idx:suivante, resolues:eleveResolues, res:eleveRes.slice(0, suivante) } });
  }
  /* Série finie, enregistrée tout de suite (02/10/2026) : l'élève qui quitte là ne
     repart pas de l'équation 1. Tout vert : l'étoile s'allume. Des rouges : il revient
     sur « Encore N équations ! », avec ses pastilles (celles déjà rejouées comptent). */
  function eleveSauverFinDeSerie(){
    const total = eleveEqs.length;
    const res = Array.from({ length: total }, (_, i) => eleveRes[i] === true ? true : (eleveRes[i] === "ko" ? "ko" : null));
    const vertes = res.filter(r => r === true).length;
    if(vertes === total){
      eleveEcrireEntree({ fait:true, etoiles:vertes, cartes:total, date:new Date().toISOString().slice(0,10) });
    }else{
      eleveEcrireEntree({ enCours:{ sig:eleveSignatureSerie(), idx:total, resolues:eleveResolues, res:res } });
    }
  }

  /* L'élève bloqué passe : pastille rouge, il rejouera cette équation à la fin. */
  function elevePasser(){
    if(eleveCompteeCourante) return;
    eleveCompteeCourante = true;
    elevePasserVisible = false;
    if(eleveRes[eleveIdx] !== "ko") eleveVues++; /* une rouge repassée ne compte pas deux fois */
    eleveRes[eleveIdx] = "ko";
    eleveSauverEnCours();
    eleveEquationSuivante();
  }

  function eleveDemarrerSerie(payload){
    eleveMode = true;
    eleveEqs = payload.serie;
    document.body.classList.add("eleveMode");
    eleveVues = 0; eleveSerieNotee = false;
    const entree = eleveLireEntree();
    let reprise = "";
    /* idx = nombre d'équations : série finie avec des rouges, retour sur
       « Encore N équations ! » (02/10/2026) */
    const finAvecRouges = !!(entree && entree.enCours && entree.enCours.sig === eleveSignatureSerie() &&
       entree.enCours.idx === eleveEqs.length && Array.isArray(entree.enCours.res) &&
       entree.enCours.res.length === eleveEqs.length && entree.enCours.res.some(r => r !== true));
    if(finAvecRouges){
      eleveRes = entree.enCours.res.map(r => r === true ? true : (r === "ko" ? "ko" : undefined));
      eleveResolues = Number(entree.enCours.resolues) || 0;
      eleveVues = eleveVuesReprise(entree, entree.enCours.res);
      eleveIdx = eleveEqs.length - 1; /* la dernière équation reste dessous, comme en fin de série */
      const okFin = eleveChargerEquation();
      eleveCompteeCourante = true; /* rien à surveiller ni à passer sous l'écran de fin */
      elevePasserVisible = false;
      window.setInterval(eleveSurveillerResolution, 400);
      eleveFinDeSerie();
      return okFin;
    }
    if(entree && entree.enCours && entree.enCours.sig === eleveSignatureSerie() &&
       Number.isInteger(entree.enCours.idx) && entree.enCours.idx > 0 && entree.enCours.idx < eleveEqs.length){
      eleveIdx = entree.enCours.idx;
      eleveResolues = Number(entree.enCours.resolues) || eleveIdx;
      const res = Array.isArray(entree.enCours.res) ? entree.enCours.res : null;
      /* détail mémorisé (vert/rouge) ; sinon, ancienne sauvegarde : tout en vert */
      eleveRes = Array.from({ length: eleveIdx }, (_, i) => res ? (res[i] === "ko" ? "ko" : (res[i] === true ? true : undefined)) : true);
      eleveVues = eleveVuesReprise(entree, eleveRes);
      reprise = `Tu reprends l\u00e0 o\u00f9 tu t'\u00e9tais arr\u00eat\u00e9 !`;
    }
    const ok = eleveChargerEquation();
    /* au téléphone, pas de message de reprise (25/10/2026, choix de Gwenaël) : avec 12 pastilles et
       « Passer », il mettait la barre sur deux lignes et faisait descendre tout le jeu ; « 2 / 12 » et
       les pastilles disent déjà où il en est. À l'ordinateur, le message tient sur la ligne : il reste. */
    if(ok && reprise && !eleveEcranEtroit()) eleveMajBarre(reprise);
    window.setInterval(eleveSurveillerResolution, 400);
    return ok;
  }

  /* « Résolue ? » — l'équation courante, ou, avec les billes unitaires
     (monde 5, fiche 35), la conclusion posée par « Faire des paquets » :
     le plateau garde alors ses paquets et ses taches, seule la dernière
     ligne écrite (« 2 = 𝑏 ») dit que c'est fini. Une seule tache face à
     des billes unitaires est aussi une équation résolue (𝑏 = 1 + 1 + 1). */
  function eleveEquationResolue(){
    if(!state) return false;
    if(state._unitPacketConclusion && Array.isArray(state.steps) && state.steps.length){
      return isSolvedEquationString(state.steps[state.steps.length - 1]);
    }
    if(isImportedUnitMode()){
      const left = activePieces("left"), right = activePieces("right");
      if((sideOnlyPositiveX(left) && left.length === 1 && sideOnlyUnitTokens(right)) ||
         (sideOnlyPositiveX(right) && right.length === 1 && sideOnlyUnitTokens(left))) return true;
    }
    return isSolvedEquationString(currentEquationString());
  }

  function eleveSurveillerResolution(){
    if(!eleveMode || eleveCompteeCourante || !state) return;
    if(!eleveEquationResolue()) return;
    eleveCompteeCourante = true;
    elevePasserVisible = false;
    eleveResolues++;
    eleveRes[eleveIdx] = true;
    eleveSauverEnCours();
    const derniere = eleveRejeu ? eleveRejeu.length === 0 : eleveIdx + 1 >= eleveEqs.length;
    eleveCelebrer(derniere);
  }

  /* Quand l'\u00e9quation est r\u00e9solue, RIEN ne recouvre le plateau : l'\u00e9l\u00e8ve
     garde sa solution (« 2 = \ud835\udc4e ») sous les yeux aussi longtemps qu'il veut,
     la pastille passe au vert, la barre affiche « \u2705 R\u00e9solue ! », les boutons se
     figent, et apr\u00e8s une pause le bandeau vert « Bravo » arrive sous le plateau avec
     \u00ab \u00c9quation suivante \u00bb : c'est LUI qui clique (le bouton a le focus : Entr\u00e9e suffit).
     Seule la fin de s\u00e9rie pose un carton, apr\u00e8s la m\u00eame pause. */
  const ELEVE_PAUSE_SOLUTION = 1400;

  function eleveCelebrer(finale){
    eleveEtatResolue("fige");
    if(finale){
      eleveMajBarre("\u2705 R\u00e9solue !");
      window.setTimeout(eleveFinDeSerie, ELEVE_PAUSE_SOLUTION);
    }else{
      eleveAttenteSuivante = true;
      eleveMajBarre("\u2705 R\u00e9solue !");
      if(eleveBravoTimer) window.clearTimeout(eleveBravoTimer);
      eleveBravoTimer = window.setTimeout(() => {
        eleveBravoTimer = null;
        if(eleveAttenteSuivante) eleveEtatResolue("bravo");
      }, ELEVE_PAUSE_SOLUTION);
    }
  }

  /* Fin de série : l'étoile si tout est vert ; sinon on propose de rejouer les rouges. */
  function eleveFinDeSerie(){
    eleveRejeu = null;
    eleveIdx = eleveEqs.length;
    eleveAttenteSuivante = false;
    elevePasserVisible = false; /* rien à passer sous l'écran de fin */
    const rouges = [];
    for(let i = 0; i < eleveEqs.length; i++) if(eleveRes[i] !== true) rouges.push(i);
    const vertes = eleveEqs.length - rouges.length;
    const voile = document.createElement("div");
    voile.className = "eleveVoile";
    if(rouges.length){
      eleveSauverFinDeSerie(); /* au retour, l'élève revient sur cet écran */
      const nbR = rouges.length, plR = nbR > 1 ? "s" : "";
      voile.innerHTML = `<div class="eleveCarton">` +
        (eleveParcours ? `<div class="finEtoile">\u2b50</div>` : ``) +
        `<h2>Encore ${nbR} \u00e9quation${plR}\u00a0!</h2>` +
        `<p class="finSous">${vertes} r\u00e9solue${vertes > 1 ? "s" : ""} sur ${eleveEqs.length}. Rejoue-l${nbR > 1 ? "es" : "a"} ` +
        (eleveParcours ? `et ton \u00e9toile s'allume sur la carte des mondes.` : `pour finir la s\u00e9rie.`) + `</p>` +
        `<div class="finAction"><button type="button" id="eleveRejouerRouges">Je rejoue ${nbR > 1 ? `mes ${nbR} \u00e9quations rouges` : `mon \u00e9quation rouge`} \u25b6</button></div>` +
        `<div class="finSorties"><button type="button" id="eleveRejouer">Rejouer toute la s\u00e9rie</button>` +
        `${eleveLienMondesHtml("finLien", "Retour \u00e0 la carte des mondes")}</div></div>`;
      voile.querySelector("#eleveRejouerRouges").addEventListener("click", () => {
        voile.remove();
        eleveRejeu = rouges.slice();
        eleveEquationSuivante();
      });
    }else{
      eleveEcrireEntree({ fait:true, etoiles:vertes, cartes:eleveEqs.length, date:new Date().toISOString().slice(0,10) });
      const suite = eleveParcours ? eleveEtapeSuivante() : null;
      voile.innerHTML = `<div class="eleveCarton"><div class="finEtoile on">\u2B50</div>` +
        `<h2>S\u00e9rie termin\u00e9e, bravo\u00a0!</h2><p>${eleveEqs.length} \u00e9quations r\u00e9solues sur le plateau.` +
        (eleveParcours ? ` Ton \u00e9toile est allum\u00e9e sur la carte des mondes\u00a0!` : ``) + `</p>` +
        /* dans le parcours : « Étape suivante ▶ » en gros (il prend le focus : Entrée
           suffit), rejouer et la carte en liens dessous ; hors parcours, rien ne change */
        (eleveParcours
          ? `<div class="finAction"><button type="button" id="eleveEtapeSuivante">${suite.html}</button></div>` +
            `<div class="finSorties"><button type="button" id="eleveRejouer">Rejouer la s\u00e9rie</button>` +
            `${suite.versCarte ? "" : eleveLienMondesHtml("finLien", "Retour \u00e0 la carte des mondes")}</div></div>`
          : `<div class="eleveCartonBoutons"><button type="button" id="eleveRejouer">Rejouer la s\u00e9rie</button>${eleveLienMondesHtml("eleveMondesLien")}</div></div>`);
      const suivante = voile.querySelector("#eleveEtapeSuivante");
      if(suivante) suivante.addEventListener("click", () => { window.location.href = suite.href; });
    }
    voile.querySelector("#eleveRejouer").addEventListener("click", () => {
      voile.remove();
      eleveIdx = 0; eleveResolues = 0; eleveRes = []; eleveRejeu = null; eleveVues = 0; eleveSerieNotee = false;
      eleveEcrireEntree({});
      eleveChargerEquation();
    });
    eleveHote().appendChild(voile); /* en plein écran : dans la scène, sinon invisible */
    const bouton = voile.querySelector("button");
    if(bouton) bouton.focus();
    eleveMajBarre();
  }

  function tryImportFromUrl(){
    const payload = parseImportedPayload();
    if(!payload) return false;
    const searchEleve = new URLSearchParams(window.location.search || "");
    if(Array.isArray(payload.serie) && payload.serie.length && payload.serie.length <= IMPORT_MAX_SERIE){
      eleveParcours = String(payload.parcours || searchEleve.get("parcours") || "").slice(0, 64);
      return eleveDemarrerSerie(payload);
    }
    const ok = createImportedEquationState(payload);
    if(!ok){
      setAppLayout("import");
      document.body.classList.remove("importUnitMode");
      state = null;
      equationHistory.innerHTML = "";
      svg.innerHTML = "";
      setInstruction("<strong>Impossible de lire l’équation importée.</strong>");
    }
    return ok;
  }

  syncUniverseUI();
  syncTeacherControls();
  renderEquationExamples();
  setViewMode("redaction");
  if(!tryImportFromUrl()){
    setAppLayout("start");
    refreshEquationProposalFromMenus();
  }
})();

</script>
</body>
