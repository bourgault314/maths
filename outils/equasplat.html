  function resetCurrentExercise(){
    if(isImportLayout()){
      // « Recommencer » en réception ramène toujours l'équation reçue.
      restartImportedEquation();
      return;
    }
    if(!initialState){
      buildAndOpen();
      return;
    }
    state = clone(initialState);
    history = [];
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    pendingFusion = null;
    setActionMode("decompose");
    openStage();
  }

  function buildAndOpen(){
    const ok = equationInput ? buildFromEquationInput() : buildFromInputs();
    if(ok && state) openStage();
  }

  function randomAndOpen(){
    if(equationInput){
      fillRandomEquationInput({build:true});
      if(state) openStage();
      return;
    }
    randomExercise();
    if(state) openStage();
  }

  function uid(){ return Math.random().toString(36).slice(2, 9); }
  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
  function numberOr(value, fallback){ const n = Number(value); return Number.isFinite(n) ? n : fallback; }
  function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
  function pushHistory(){ if(state) history.push(clone(state)); if(history.length > 80) history.shift(); }
  function currentVar(){ return state && state.original && state.original.varChar ? state.original.varChar : "𝑥"; }
  function displayedUnknown(){ return unknownDisplayModeEl && unknownDisplayModeEl.value === "question" ? "?" : currentVar(); }
  function shouldKeepRemovedPieces(){ return !removedDisplayModeEl || removedDisplayModeEl.value !== "hide"; }
  function syncRemovedDisplayControls(value){
    if(removedDisplayModeEl) removedDisplayModeEl.value = value === "hide" ? "hide" : "keep";
  }
  function oppositeXEnabled(){
    return isRelativeUniverse() && oppositeXModeEl && oppositeXModeEl.value === "on";
  }

  function makeX(sign=1){ return { id:uid(), type:"x", sign: sign < 0 ? -1 : 1, value:null, removed:false }; }
  function makeXPieces(coef){
    const sign = coef < 0 ? -1 : 1;
    const count = Math.abs(Math.round(Number(coef) || 0));
    return Array.from({length:count}, () => makeX(sign));
  }
  function xSign(piece){ return piece && piece.sign === -1 ? -1 : 1; }
  function xPieceLabel(piece){
    const base = displayedUnknown();
    return xSign(piece) < 0 ? `−${base}` : base;
  }
  function formatXTerm(coef){
    const n = Number(coef) || 0;
    const v = displayedUnknown();
    const question = v === "?";
    if(n === 1) return v;
    if(n === -1) return `−${v}`;
    if(question){
      // Avec le point d'interrogation, « 3 × ? » se lit mieux que « 3? ».
      if(n < 0) return `−${Math.abs(n)} × ${v}`;
      return `${n} × ${v}`;
    }
    if(n < 0) return `−${Math.abs(n)}${v}`;
    return `${n}${v}`;
  }
  function makeToken(value, opts = {}){
    opts = opts || {};
    // unit : petite bille de Splat Équations (valeur 1, sans chiffre) ;
    // shareBatch : jetons nés d'un même partage, écrits « n × v » dans l'équation.
    const token = { id:uid(), type:"token", value:Number(value), removed:false, unit:opts.unit === true };
    if(opts.shareBatch) token.shareBatch = opts.shareBatch;
    return token;
  }
  function formatSignedNumber(n){
    const v = Number(n) || 0;
    if(v < 0) return `−${Math.abs(v)}`;
    return String(v);
  }

  function isRelativeUniverse(){
    return workUniverseEl && workUniverseEl.value === "relative";
  }

  function randomNonZeroInt(rng, a, b){
    let v = 0;
    for(let i=0; i<80 && v === 0; i++) v = randomInt(rng, a, b);
    return v === 0 ? (Math.abs(a) >= Math.abs(b) ? a : b) : v;
  }

  function positiveTokenColorForValue(value){
    // Inspiration Splat d'origine : en positif, les jetons numériques
    // reçoivent des couleurs variées selon leur valeur.
    const mag = Math.abs(Math.round(Number(value) || 0));
    const hue = ((mag * 37) % 360 + 360) % 360;
    return {
      fill:`hsla(${hue}, 78%, 54%, .20)`,
      stroke:`hsla(${hue}, 78%, 45%, .62)`
    };
  }

  function formatFusionTerm(n){
    const v = Number(n) || 0;
    return v < 0 ? `(−${Math.abs(v)})` : String(v);
  }

  function simplifiedRelativeEquationWriting(){
    return isRelativeUniverse() && equationWritingModeEl && equationWritingModeEl.value === "simplified";
  }

  function formatEquationTerm(n){
    const v = Number(n) || 0;
    if(v < 0){
      return simplifiedRelativeEquationWriting() ? `−${Math.abs(v)}` : `(−${Math.abs(v)})`;
    }
    return String(v);
  }

  function currentSignedWritingMode(){
    // « Détaillée : x + (−4) » = parenthèses ; « Simplifiée : x − 4 » = simplifiée.
    return simplifiedRelativeEquationWriting() ? "simplified" : "parentheses";
  }

  function splitEquationTermSign(term){
    const s = String(term == null ? "" : term).trim();
    const parenthesizedNegative = s.match(/^\(−(.+)\)$/);
    if(parenthesizedNegative) return {negative:true, body:parenthesizedNegative[1].trim()};
    if(s.startsWith("−")) return {negative:true, body:s.slice(1).trim()};
    if(s.startsWith("-")) return {negative:true, body:s.slice(1).trim()};
    return {negative:false, body:s};
  }

  function joinEquationTerms(terms){
    // Repris de la page import : en écriture détaillée, un terme négatif
    // s'écrit entre parenthèses quel qu'il soit — « 5 + (−x) » et non « 5 + −x ».
    const clean = (Array.isArray(terms) ? terms : [])
      .map(splitEquationTermSign)
      .filter(t => t.body !== "" && t.body !== "0");
    if(!clean.length) return "0";
    const mode = currentSignedWritingMode();
    return clean.map((term, index) => {
      if(index === 0) return term.negative ? `−${term.body}` : term.body;
      if(term.negative) return mode === "parentheses" ? ` + (−${term.body})` : ` − ${term.body}`;
      return ` + ${term.body}`;
    }).join("");
  }

  function equationDisplayTargetConstantFor(side){
    if(!state) return null;
    const otherSide = side === "left" ? "right" : "left";
    const sidePieces = activePieces(side).filter(p => !(p.type === "token" && Number(p.value) === 0));
    const otherPieces = activePieces(otherSide).filter(p => !(p.type === "token" && Number(p.value) === 0));

    const sideHasX = sidePieces.some(p => p.type === "x");
    const otherHasX = otherPieces.some(p => p.type === "x");
    if(sideHasX || !otherHasX) return null;

    const sideTokens = sidePieces.filter(p => p.type === "token");
    const otherTokens = otherPieces.filter(p => p.type === "token");
    if(sideTokens.length < 2 || otherTokens.length === 0) return null;

    const target = otherTokens.reduce((sum, p) => sum + Number(p.value || 0), 0);
    if(target === 0) return null;
    return target;
  }

  function piecesForEquationDisplay(side, pieces){
    const target = equationDisplayTargetConstantFor(side);
    if(target === null) return pieces;

    const index = pieces.findIndex(p => p.type === "token" && !p.removed && Number(p.value) === target);
    if(index < 0 || index === pieces.length - 1) return pieces;

    // L'ordre des objets sur le plateau reste inchangé. On déplace seulement
    // le terme à enlever à la fin de l'écriture algébrique :
    // x + 5 = 5 + 45 devient x + 5 = 45 + 5.
    const ordered = pieces.slice();
    const [matchingToken] = ordered.splice(index, 1);
    ordered.push(matchingToken);
    return ordered;
  }

  function getInitialTokenCount(rng=Math.random){
    const raw = initialTokenCountEl ? initialTokenCountEl.value : "1";
    if(raw === "mix") return randomInt(rng, 1, 3);
    return clamp(Math.round(numberOr(raw, 1)), 1, 3);
  }

  function shuffleCopy(arr, rng=Math.random){
    const out = arr.slice();
    for(let i=out.length-1; i>0; i--){
      const j = Math.floor(rng() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function splitRelativeValueForInitialTokens(value, count, rng=Math.random){
    value = Math.round(Number(value) || 0);
    count = clamp(Math.round(Number(count) || 1), 1, 3);
    if(count <= 1) return [value];

    // En relatif, quand le professeur demande plusieurs jetons, on cherche à
    // créer un vrai petit calcul relatif : des jetons verts ET rouges sur le
    // même plateau, tout en conservant exactement la bonne somme.
    const extra = randomInt(rng, 2, 9);

    if(count === 2){
      if(value === 0) return shuffleCopy([extra, -extra], rng);
      if(value > 0) return shuffleCopy([value + extra, -extra], rng);
      return shuffleCopy([value - extra, extra], rng);
    }

    if(value === 0){
      const a = randomInt(rng, 2, 8);
      const b = randomInt(rng, 2, 8);
      return shuffleCopy([a, b, -(a + b)], rng);
    }

    if(value > 0){
      const negative = -extra;
      const positiveTotal = value + extra;
      const cut = randomInt(rng, 1, Math.max(1, positiveTotal - 1));
      return shuffleCopy([cut, positiveTotal - cut, negative], rng).filter(v => v !== 0);
    }

    const positive = extra;
    const negativeTotalAbs = Math.abs(value - extra);
    const cut = randomInt(rng, 1, Math.max(1, negativeTotalAbs - 1));
    return shuffleCopy([-cut, -(negativeTotalAbs - cut), positive], rng).filter(v => v !== 0);
  }

  function splitValueForInitialTokens(value, count, rng=Math.random){
    value = Math.round(Number(value) || 0);
    count = clamp(Math.round(Number(count) || 1), 1, 3);

    if(isRelativeUniverse() && count > 1){
      const mixed = splitRelativeValueForInitialTokens(value, count, rng);
      if(mixed.length === count && mixed.reduce((s,v)=>s+v,0) === value) return mixed;
    }

    if(value === 0) return [0];

    // En positif, les constantes sont positives. En relatif avec 1 seul jeton,
    // on garde simplement le signe de la constante.
    const sign = value < 0 ? -1 : 1;
    const absValue = Math.abs(value);
    if(count <= 1 || absValue < count) return [value];

    const cuts = [];
    for(let i=0; i<count-1; i++) cuts.push(randomInt(rng, 1, absValue-1));
    cuts.sort((a,b)=>a-b);
    const points = [0, ...cuts, absValue];
    const parts = [];
    for(let i=0; i<points.length-1; i++){
      const part = points[i+1] - points[i];
      if(part > 0) parts.push(part * sign);
    }
    if(parts.length !== count) return splitValueForInitialTokens(value, count, rng);
    return parts;
  }

  function makeInitialTokens(value, rng=Math.random){
    return splitValueForInitialTokens(value, getInitialTokenCount(rng), rng).map(makeToken);
  }

  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function randomInt(rng,a,b){ return a + Math.floor(rng()*(b-a+1)); }

  function setActionMode(mode){
    actionMode = mode;
    deleteSelection = [];
    groupSelection = [];
    [toolDecompose, toolGroup, toolShare, toolShareUnits, toolDelete, toolAddBoth].forEach(btn => btn && btn.classList.remove("active"));
    if(mode === "decompose" && toolDecompose) toolDecompose.classList.add("active");
    if(mode === "group" && toolGroup) toolGroup.classList.add("active");
    if(mode === "share" && toolShare) toolShare.classList.add("active");
    if(mode === "unitShare" && toolShareUnits) toolShareUnits.classList.add("active");
    if(mode === "delete" && toolDelete) toolDelete.classList.add("active");
    if(mode === "addBoth" && toolAddBoth) toolAddBoth.classList.add("active");
    render();
  }

  function getSelectedMode(){
    const raw = modeEl ? modeEl.value : "axb";
    if(raw === "mix"){
      const modes = ["xpb", "axc", "axb", "both"];
      return modes[Math.floor(Math.random() * modes.length)];
    }
    return raw;
  }

  function getModeLabel(mode){
    if(mode === "xpb") return "x + b = c";
    if(mode === "axc") return "ax = c";
    if(mode === "both") return "ax + b = mx + d";
    return "ax + b = c";
  }


  function normalizeMathLetters(str){
    const map = {
      "𝑎":"a","𝑏":"b","𝑐":"c","𝑑":"d","𝑒":"e","𝑓":"f","𝑔":"g","ℎ":"h","𝑖":"i","𝑗":"j","𝑘":"k","𝑙":"l","𝑚":"m","𝑛":"n","𝑜":"o","𝑝":"p","𝑞":"q","𝑟":"r","𝑠":"s","𝑡":"t","𝑢":"u","𝑣":"v","𝑤":"w","𝑥":"x","𝑦":"y","𝑧":"z",
      "𝐴":"A","𝐵":"B","𝐶":"C","𝐷":"D","𝐸":"E","𝐹":"F","𝐺":"G","𝐻":"H","𝐼":"I","𝐽":"J","𝐾":"K","𝐿":"L","𝑀":"M","𝑁":"N","𝑂":"O","𝑃":"P","𝑄":"Q","𝑅":"R","𝑆":"S","𝑇":"T","𝑈":"U","𝑉":"V","𝑊":"W","𝑋":"X","𝑌":"Y","𝑍":"Z"
    };
    return String(str || "").replace(/[𝑎𝑏𝑐𝑑𝑒𝑓𝑔ℎ𝑖𝑗𝑘𝑙𝑚𝑛𝑜𝑝𝑞𝑟𝑠𝑡𝑢𝑣𝑤𝑥𝑦𝑧𝐴𝐵𝐶𝐷𝐸𝐹𝐺𝐻𝐼𝐽𝐾𝐿𝑀𝑁𝑂𝑃𝑄𝑅𝑆𝑇𝑈𝑉𝑊𝑋𝑌𝑍]/g, ch => map[ch] || ch);
  }

  function toMathItalicLetter(letter){
    const lower = String(letter || "x").trim().toLowerCase()[0] || "x";
    const map = {a:"𝑎",b:"𝑏",c:"𝑐",d:"𝑑",e:"𝑒",f:"𝑓",g:"𝑔",h:"ℎ",i:"𝑖",j:"𝑗",k:"𝑘",l:"𝑙",m:"𝑚",n:"𝑛",o:"𝑜",p:"𝑝",q:"𝑞",r:"𝑟",s:"𝑠",t:"𝑡",u:"𝑢",v:"𝑣",w:"𝑤",x:"𝑥",y:"𝑦",z:"𝑧"};
    return map[lower] || "𝑥";
  }

  function parseEquationSideForSplat(rawSide, sideName, ctx){
    let compact = normalizeMathLetters(rawSide)
      .replace(/[×·]/g, "*")
      .replace(/[−–—]/g, "-")
      .replace(/\s+/g, "");

    if(!compact){
      throw new Error(`Le membre ${sideName} est vide.`);
    }
    if(/[(),;]/.test(compact) || /[\/]/.test(compact)){
      throw new Error("Utilise seulement des sommes simples : par exemple 2x + 4 = 18.");
    }
    if(/[.]/.test(compact)){
      throw new Error("Les décimaux ne sont pas acceptés ici : utilise seulement des entiers.");
    }
    if(!/^[0-9a-zA-Z+*\-]+$/.test(compact)){
      throw new Error("Caractère non reconnu. Utilise des entiers, une lettre, +, − et ×.");
    }
    if(!/^[+-]/.test(compact)) compact = "+" + compact;

    const matches = [...compact.matchAll(/([+-])([^+-]+)/g)];
    if(!matches.length || matches.map(m => m[0]).join("") !== compact){
      throw new Error(`Expression non reconnue dans le membre ${sideName}.`);
    }

    let coef = 0;
    let constant = 0;
    const pieces = [];

    for(const m of matches){
      const sign = m[1] === "-" ? -1 : 1;
      let term = m[2];
      if(!term){
        throw new Error(`Il manque un terme dans le membre ${sideName}.`);
      }
      const letters = term.match(/[a-zA-Z]/g) || [];
      if(letters.length > 1){
        throw new Error("Un terme ne doit contenir qu’une seule inconnue.");
      }

      if(letters.length === 1){
        const variable = letters[0].toLowerCase();
        if(ctx.variable && ctx.variable !== variable){
          throw new Error("Utilise une seule lettre inconnue dans toute l’équation.");
        }
        ctx.variable = variable;
        let rawCoef = term.replace(/[a-zA-Z]/g, "");
        rawCoef = rawCoef.replace(/\*/g, "");
        const n = rawCoef === "" ? 1 : Number(rawCoef);
        if(!Number.isInteger(n)){
          throw new Error(`Coefficient non reconnu dans le membre ${sideName}.`);
        }
        const signedCoef = sign * n;
        coef += signedCoef;
        if(signedCoef !== 0) pieces.push({type:"x", coef:signedCoef});
      }else{
        if(term.includes("*")){
          throw new Error(`Produit numérique inutile dans le membre ${sideName}. Écris directement le résultat.`);
        }
        const n = Number(term);
        if(!Number.isInteger(n)){
          throw new Error(`Nombre non reconnu dans le membre ${sideName}.`);
        }
        const signed = sign * n;
        constant += signed;
        if(signed !== 0) pieces.push({type:"token", value:signed});
      }
    }

    return {coef, constant, pieces};
  }

  function inferModeFromParsedEquation(left, right){
    const leftHasX = left.coef !== 0;
    const rightHasX = right.coef !== 0;
    const leftHasB = left.constant !== 0;
    if(leftHasX && rightHasX) return "both";
    if(leftHasX && !leftHasB) return "axc";
    if(Math.abs(left.coef) === 1 && leftHasB) return "xpb";
    return "axb";
  }

  function parseEquationInputToModel(rawEquation){
    const original = String(rawEquation || "").trim();
    if(!original){
      throw new Error("Écris une équation à construire.");
    }

    const normalized = normalizeMathLetters(original).replace(/[−–—]/g, "-");
    const sides = normalized.split("=");
    if(sides.length !== 2){
      throw new Error("Il faut exactement un signe égal.");
    }

    const ctx = {variable:null};
    const left = parseEquationSideForSplat(sides[0], "de gauche", ctx);
    const right = parseEquationSideForSplat(sides[1], "de droite", ctx);
    if(!ctx.variable){
      throw new Error("Il faut une inconnue : par exemple x, n ou a.");
    }

    const relative = isRelativeUniverse();
    const allowOppositeX = oppositeXEnabled();
    if(!relative && (left.constant < 0 || right.constant < 0)){
      throw new Error("En Splat positif, les constantes doivent rester positives. Passe en Splat relatif pour utiliser des nombres négatifs.");
    }
    if(!allowOppositeX && (left.coef < 0 || right.coef < 0)){
      throw new Error("Pour construire une équation avec −x, choisis Splat relatif puis active les taches opposées.");
    }
    if(Math.abs(left.coef) + Math.abs(right.coef) > 16){
      throw new Error("Cette équation crée trop de taches pour rester lisible.");
    }
    if(left.pieces.length + right.pieces.length > 80){
      throw new Error("Cette équation crée trop d’objets pour rester lisible.");
    }

    const denominator = left.coef - right.coef;
    const numerator = right.constant - left.constant;
    if(denominator === 0){
      throw new Error("Cette équation ne donne pas une solution unique utilisable ici.");
    }
    if(numerator % denominator !== 0){
      throw new Error("Équation refusée : la solution n’est pas un nombre entier.");
    }
    const x = numerator / denominator;
    if(x === 0){
      throw new Error("Équation refusée : la solution 0 n’est pas prise en charge dans cette version.");
    }
    if(!relative && x < 0){
      throw new Error("En Splat positif, la solution doit être positive. Passe en Splat relatif pour une solution négative.");
    }

    return {
      left,
      right,
      x,
      variable:toMathItalicLetter(ctx.variable),
      mode:inferModeFromParsedEquation(left, right)
    };
  }

  function piecesFromParsedSide(parsedSide, options={}){
    const preserveWrittenTokens = options.preserveWrittenTokens === true;
    const pieces = [];
    for(const item of parsedSide.pieces){
      if(item.type === "x"){
        pieces.push(...makeXPieces(item.coef));
      }else if(item.type === "token" && item.value !== 0){
        // Quand l'équation est écrite dans le champ, une somme comme
        // 3 + 4 doit vraiment créer deux jetons 3 et 4.
        // Sinon, avec le réglage « 2 jetons », chaque terme serait redécoupé
        // et on obtiendrait trop de jetons sur le plateau.
        if(preserveWrittenTokens) pieces.push(makeToken(item.value));
        else pieces.push(...makeInitialTokens(item.value));
      }
    }
    return pieces;
  }

  function buildFromEquationInput(){
    state = null;
    initialState = null;
    try{
      const model = parseEquationInputToModel(equationInput ? equationInput.value : "");
      if(modeEl && modeEl.value !== "mix") modeEl.value = model.mode;
      syncTeacherControls({validate:false});
      state = {
        original:{
          mode:model.mode,
          modeLabel:getModeLabel(model.mode),
          a:model.left.coef,
          b:model.left.constant,
          rightA:model.right.coef,
          d:model.right.constant,
          x:model.x,
          c:model.left.coef * model.x + model.left.constant,
          varChar:model.variable
        },
        left:piecesFromParsedSide(model.left, {preserveWrittenTokens:true}),
        right:piecesFromParsedSide(model.right, {preserveWrittenTokens:true}),
        steps:[],
        stepOps:[],
        conclusionDone:false
      };
      recordEquationStep();
      history = [];
      selectedPieceRef = null;
      deleteSelection = [];
      groupSelection = [];
      pendingFusion = null;
      initialState = clone(state);
      setActionMode("decompose");
      clearTeacherInfo();
      return true;
    }catch(err){
      setTeacherInfo(false, err && err.message ? err.message : "Équation impossible à construire.");
      return false;
    }
  }

  function coefText(coef, variable){
    if(coef === 1) return variable;
    if(coef === -1) return `-${variable}`;
    return `${coef}${variable}`;
  }

  function joinInputTerms(terms){
    if(!terms.length) return "0";
    let out = "";
    for(const raw of terms){
      const term = String(raw);
      if(!out){
        out = term.startsWith("-") ? `−${term.slice(1)}` : term;
      }else if(term.startsWith("-")){
        out += ` − ${term.slice(1)}`;
      }else{
        out += ` + ${term}`;
      }
    }
    return out;
  }

  function sideInputText(coef, constant, variable){
    const terms = [];
    if(coef !== 0) terms.push(coefText(coef, variable));
    if(constant !== 0) terms.push(String(constant));
    return joinInputTerms(terms);
  }

  function selectedEquationTokenCount(rng=Math.random){
    const raw = initialTokenCountEl ? initialTokenCountEl.value : "1";
    if(raw === "mix") return randomInt(rng, 1, 3);
    return clamp(Math.round(numberOr(raw, 1)), 1, 3);
  }

  function splitValueForEquationWriting(value, count, rng=Math.random){
    value = Math.round(Number(value) || 0);
    count = clamp(Math.round(Number(count) || 1), 1, 3);
    if(value === 0) return [];
    if(count <= 1) return [value];

    const parts = splitValueForInitialTokens(value, count, rng).filter(v => v !== 0);
    if(parts.length === count && parts.reduce((sum, v) => sum + v, 0) === value){
      return parts;
    }
    return [value];
  }

  function sideInputTextWithTokenWriting(coef, constant, variable, tokenCount, rng=Math.random){
    const xTerm = coef !== 0 ? coefText(coef, variable) : null;
    const numberTerms = splitValueForEquationWriting(constant, tokenCount, rng).map(v => String(v));

    if(!xTerm) return joinInputTerms(numberTerms);
    if(!numberTerms.length) return joinInputTerms([xTerm]);

    // Pour rendre visible la décomposition en jetons, on place parfois
    // une partie numérique avant la lettre et le reste après :
    // 3 + 2x + 4 = ... au lieu de seulement 2x + 7 = ...
    if(numberTerms.length >= 2){
      const cut = randomInt(rng, 1, numberTerms.length - 1);
      return joinInputTerms([...numberTerms.slice(0, cut), xTerm, ...numberTerms.slice(cut)]);
    }

    return rng() < .5 ? joinInputTerms([xTerm, ...numberTerms]) : joinInputTerms([...numberTerms, xTerm]);
  }

  function makeEquationTextFromParts(leftCoef, leftConst, rightCoef, rightConst, variable, options={}){
    const rng = options.rng || Math.random;
    const tokenCount = options.tokenCount || 1;
    return `${sideInputTextWithTokenWriting(leftCoef, leftConst, variable, tokenCount, rng)} = ${sideInputTextWithTokenWriting(rightCoef, rightConst, variable, tokenCount, rng)}`;
  }

  function currentExampleList(){
    const relative = isRelativeUniverse();
    const allowOppositeX = oppositeXEnabled();
    const mode = modeEl ? modeEl.value : "axb";
    if(relative && allowOppositeX){
      return ["2x − 5 = 9", "3x + 4 = x − 8", "−x + 6 = −3", "2x − 7 = −x + 8"];
    }
    if(relative){
      return ["2x − 5 = 9", "x + 7 = −4", "3x − 6 = 12", "4x + 5 = −7"];
    }
    if(mode === "xpb") return ["x + 4 = 18", "7 + x = 20", "x + 9 = 12"];
    if(mode === "axc") return ["3x = 24", "5x = 45", "2x = 18"];
    if(mode === "both") return ["3x + 5 = x + 17", "4x + 2 = 2x + 18", "5x + 1 = 2x + 22"];
    return ["2x + 4 = 18", "3x + 6 = 27", "4x + 5 = 17"];
  }

  function renderEquationExamples(){
    if(!equationExamples) return;
    equationExamples.innerHTML = "";
    for(const text of currentExampleList()){
      const btn = document.createElement("button");
      btn.className = "exampleChip";
      btn.type = "button";
      btn.textContent = text;
      btn.addEventListener("click", () => {
        if(equationInput){
          equationInput.value = text;
          clearTeacherInfo();
          equationInput.focus();
          equationInput.select();
        }
      });
      equationExamples.appendChild(btn);
    }
  }

  function makeRandomEquationText(guard=0){
    const rng = Math.random;
    const relative = isRelativeUniverse();
    const allowOppositeX = oppositeXEnabled();
    const tokenCount = selectedEquationTokenCount(rng);
    const modeRaw = modeEl ? modeEl.value : "axb";
    const modes = ["xpb", "axc", "axb", "both"];
    const mode = modeRaw === "mix" ? modes[randomInt(rng,0,modes.length-1)] : modeRaw;
    const letters = ["x","n","a","t","m"];
    const variable = letters[randomInt(rng,0,letters.length-1)];
    const x = relative ? randomNonZeroInt(rng,-10,10) : randomInt(rng,2,12);
    const coef = (min,max) => {
      const v = randomInt(rng,min,max);
      return allowOppositeX && rng() < .35 ? -v : v;
    };
    const positiveConst = (min,max) => randomInt(rng, Math.max(min, tokenCount), Math.max(max, tokenCount));

    let leftCoef = mode === "xpb" ? 1 : coef(2,5);
    let leftConst = mode === "axc" ? 0 : (relative ? randomNonZeroInt(rng,-12,12) : positiveConst(2,18));
    let rightCoef = 0;
    let rightConst = leftCoef * x + leftConst;

    if(mode === "both"){
      leftCoef = coef(3,5);
      do{ rightCoef = coef(1,4); }while(rightCoef === leftCoef);
      leftConst = relative ? randomNonZeroInt(rng,-12,12) : positiveConst(2,14);
      rightConst = (leftCoef - rightCoef) * x + leftConst;
      if(!relative && rightConst < tokenCount && guard < 200) return makeRandomEquationText(guard + 1);
      if(relative && rightConst === 0 && guard < 200) return makeRandomEquationText(guard + 1);
    }

    if(!relative && rightConst < tokenCount && guard < 200) return makeRandomEquationText(guard + 1);
    if(!relative && rightConst <= 0 && guard < 200) return makeRandomEquationText(guard + 1);

    return makeEquationTextFromParts(leftCoef, leftConst, rightCoef, rightConst, variable, {tokenCount, rng});
  }

  function fillRandomEquationInput(options={build:false, focus:true, select:true}){
    if(!equationInput) return false;
    equationInput.value = makeRandomEquationText();
    clearTeacherInfo();
    if(options.build) return buildFromEquationInput();
    if(options.focus !== false) equationInput.focus();
    if(options.select !== false) equationInput.select();
    renderEquationExamples();
    return true;
  }

  function refreshEquationProposalFromMenus(){
    // Dans le menu d'accueil, la proposition du champ « Créer une équation »
    // doit suivre immédiatement les réglages : univers, type, jetons, taches opposées...
    // On ne prend pas le focus pour éviter un saut visuel quand l'utilisateur manipule les menus.
    if(appLayoutMode !== "start") return false;
    return fillRandomEquationInput({build:false, focus:false, select:false});
  }

  function syncTeacherControls(options={validate:false}){
    const mode = modeEl ? modeEl.value : "axb";
    const showA = !(mode === "xpb");
    const showB = !(mode === "axc");
    const showRightCoef = mode === "both" || mode === "mix";
    const showRightConstC = mode !== "both";
    const showRightConstD = mode === "both" || mode === "mix";

    if(coefAWrap) coefAWrap.style.display = showA ? "" : "none";
    if(constBWrap) constBWrap.style.display = showB ? "" : "none";
    if(coefCWrap) coefCWrap.style.display = showRightCoef ? "" : "none";
    if(constCWrap) constCWrap.style.display = showRightConstC ? "" : "none";
    if(constDWrap) constDWrap.style.display = showRightConstD ? "" : "none";
    if(options.validate !== false) updateProfEquationInfo();
  }

  function integerField(el, fallback){
    return Math.round(numberOr(el && el.value, fallback));
  }

  function setTeacherInfo(ok, html){
    if(!profEquationInfo) return;
    profEquationInfo.style.display = "block";
    profEquationInfo.innerHTML = html;
    profEquationInfo.style.background = ok ? "#f0fdf4" : "#fff7ed";
    profEquationInfo.style.borderColor = ok ? "rgba(22,163,74,.22)" : "rgba(249,115,22,.28)";
    profEquationInfo.style.color = ok ? "#166534" : "#9a3412";
  }

  function clearTeacherInfo(){
    if(!profEquationInfo) return;
    profEquationInfo.innerHTML = "";
    profEquationInfo.style.display = "none";
  }

  function setTeacherNeutralInfo(html){
    if(!profEquationInfo) return;
    profEquationInfo.style.display = "block";
    profEquationInfo.innerHTML = html;
    profEquationInfo.style.background = "#f8fafc";
    profEquationInfo.style.borderColor = "rgba(15,23,42,.08)";
    profEquationInfo.style.color = "#334155";
  }

  function markManualEquationDirty(){
    // Pas de message permanent pendant la saisie : on signale seulement les erreurs au moment de Créer.
    clearTeacherInfo();
  }

  function computeTeacherEquation(modeOverride=null){
    const selectedMode = modeOverride || getSelectedMode();
    const relative = isRelativeUniverse();
    const maxConst = 200;
    const allowOppositeX = oppositeXEnabled();
    function clampNonZeroCoef(value, fallback){
      const raw = Math.round(numberOr(value, fallback));
      if(allowOppositeX){
        const v = clamp(raw, -8, 8);
        return v === 0 ? fallback : v;
      }
      return clamp(raw, 1, 8);
    }
    let a = selectedMode === "xpb" ? 1 : clampNonZeroCoef(coefAEl && coefAEl.value, 2);
    if(!allowOppositeX && selectedMode !== "xpb") a = Math.max(2, a);
    const b = selectedMode === "axc" ? 0 : (relative ? clamp(integerField(constBEl, 0), -maxConst, maxConst) : clamp(integerField(constBEl, 0), 0, maxConst));
    const rightA = selectedMode === "both" ? clampNonZeroCoef(coefCEl && coefCEl.value, 1) : 0;
    const rightValue = selectedMode === "both"
      ? (relative ? clamp(integerField(constDEl, 0), -maxConst, maxConst) : clamp(integerField(constDEl, 1), 0, maxConst))
      : (relative ? clamp(integerField(constCEl, 1), -maxConst, maxConst) : clamp(integerField(constCEl, 1), 1, maxConst));

    let numerator = 0;
    let denominator = 1;

    if(selectedMode === "xpb"){
      numerator = rightValue - b;
      denominator = 1;
    }else if(selectedMode === "axc"){
      numerator = rightValue;
      denominator = a;
    }else if(selectedMode === "both"){
      numerator = rightValue - b;
      denominator = a - rightA;
      if(denominator === 0){
        return {ok:false, message:"Équation refusée : les coefficients des deux membres sont identiques, donc on n’a pas une solution unique utilisable ici."};
      }
    }else{
      numerator = rightValue - b;
      denominator = a;
    }

    if(numerator % denominator !== 0){
      return {ok:false, message:"Équation refusée : la solution n’est pas un nombre entier."};
    }

    const x = numerator / denominator;
    if(x === 0){
      return {ok:false, message:"Équation refusée : la solution 0 n’est pas prise en charge dans cette version."};
    }
    if(!relative && x < 0){
      return {ok:false, message:"Équation refusée : en Splat positif, la solution doit être positive."};
    }

    return {
      ok:true,
      mode:selectedMode,
      modeLabel:getModeLabel(selectedMode),
      a,
      b,
      rightA,
      d:selectedMode === "both" ? rightValue : 0,
      c:selectedMode === "both" ? a * x + b : rightValue,
      x
    };
  }

  function maybeSwapEquationSides(rng=Math.random){
    // Variation pédagogique : une équation peut être présentée dans les deux sens.
    // On échange uniquement les deux membres entiers, sans modifier la logique mathématique.
    if(!state) return;
    if(rng() < 0.5){
      const temp = state.left;
      state.left = state.right;
      state.right = temp;
    }
  }

  function updateProfEquationInfo(){
    if(!profEquationInfo || !modeEl) return;
    const rawMode = modeEl.value;
    if(rawMode === "mix"){
      clearTeacherInfo();
      return;
    }

    const result = computeTeacherEquation(rawMode);
    if(!result.ok){
      setTeacherInfo(false, result.message);
      return;
    }
    clearTeacherInfo();
  }

  function buildFromInputs(){
    state = null;
    initialState = null;
    const eq = computeTeacherEquation();
    if(!eq.ok){
      setTeacherInfo(false, eq.message);
      return false;
    }

    const selectedMode = eq.mode;
    const a = eq.a;
    const b = eq.b;
    const rightA = eq.rightA;
    const d = eq.d;
    const x = eq.x;

    coefAEl.value = a;
    constBEl.value = b;
    if(coefCEl) coefCEl.value = rightA || 1;
    if(constCEl && selectedMode !== "both") constCEl.value = eq.c;
    if(constDEl && selectedMode === "both") constDEl.value = d;
    clearTeacherInfo();

    const varChar = variableChars[Math.floor(Math.random() * variableChars.length)];
    state = {
      original:{mode:selectedMode, modeLabel:getModeLabel(selectedMode), a,b,rightA,d,x,c:eq.c,varChar},
      left:[],
      right:[],
      steps:[],
      stepOps:[],
      conclusionDone:false
    };

    if(selectedMode === "both"){
      state.left = makeXPieces(a).concat(b !== 0 ? makeInitialTokens(b) : []);
      state.right = makeXPieces(rightA).concat(d !== 0 ? makeInitialTokens(d) : []);
    }else{
      const rightValue = eq.c;
      state.left = makeXPieces(a).concat(b !== 0 ? makeInitialTokens(b) : []);
      state.right = rightValue !== 0 ? makeInitialTokens(rightValue) : [];
    }

    maybeSwapEquationSides(Math.random);
    recordEquationStep();
    history = [];
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    pendingFusion = null;
    initialState = clone(state);
    setActionMode("decompose");
    return true;
  }

  function randomExercise(){
    const rng = Math.random;
    const relative = isRelativeUniverse();

    let selectedMode = modeEl ? modeEl.value : "axb";
    if(selectedMode === "mix"){
      const modes = ["xpb", "axc", "axb", "both"];
      selectedMode = modes[randomInt(rng,0,modes.length-1)];
    }

    const allowOppositeX = oppositeXEnabled();
    const randomCoef = (minAbs=2, maxAbs=5) => {
      const v = randomInt(rng, minAbs, maxAbs);
      return allowOppositeX && rng() < 0.45 ? -v : v;
    };
    let a = selectedMode === "xpb" ? 1 : randomCoef(2,5);
    const x = relative ? randomNonZeroInt(rng,-12,12) : randomInt(rng,3,15);
    let b = selectedMode === "axc" ? 0 : (relative ? randomNonZeroInt(rng,-18,18) : randomInt(rng,2,18));
    let rightA = 0;
    let d = 0;

    if(selectedMode === "both"){
      a = randomCoef(3,5);
      do{ rightA = randomCoef(1,4); }while(rightA === a);
      b = relative ? randomNonZeroInt(rng,-14,14) : randomInt(rng,2,14);
      d = (a - rightA) * x + b;
      if(relative && d === 0){
        b += x > 0 ? -1 : 1;
        d = (a - rightA) * x + b;
      }
    }

    coefAEl.value = a;
    constBEl.value = b;
    if(coefCEl) coefCEl.value = rightA || 1;
    if(selectedMode === "both"){
      if(constDEl) constDEl.value = d;
    }else{
      if(constCEl) constCEl.value = a * x + b;
    }
    clearTeacherInfo();

    const varChar = variableChars[Math.floor(rng() * variableChars.length)];
    state = {
      original:{mode:selectedMode, modeLabel:getModeLabel(selectedMode), a,b,rightA,d,x,c:a*x+b,varChar},
      left:[],
      right:[],
      steps:[],
      stepOps:[],
      conclusionDone:false
    };

    if(selectedMode === "both"){
      state.left = makeXPieces(a).concat(b !== 0 ? makeInitialTokens(b, rng) : []);
      state.right = makeXPieces(rightA).concat(d !== 0 ? makeInitialTokens(d, rng) : []);
    }else{
      const rightValue = a*x + b;
      state.left = makeXPieces(a).concat(b !== 0 ? makeInitialTokens(b, rng) : []);
      state.right = rightValue !== 0 ? makeInitialTokens(rightValue, rng) : [];
    }

    maybeSwapEquationSides(rng);
    recordEquationStep();
    history = [];
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    pendingFusion = null;
    initialState = clone(state);
    setActionMode("decompose");
    return true;
  }

  function activePieces(side){ return state[side].filter(p => !p.removed); }
  function renderPiecesForSide(side){ return shouldKeepRemovedPieces() ? state[side] : activePieces(side); }

  function sideExpression(side){
    const pieces = piecesForEquationDisplay(
      side,
      activePieces(side).filter(p => !(p.type === "token" && Number(p.value) === 0))
    );
    const terms = [];
    const xPieces = pieces.filter(p => p.type === "x");
    const xSigns = Array.from(new Set(xPieces.map(p => xSign(p))));
    const canCombineAllXOfSameSign = xSigns.length <= 1;
    // Réception en billes : toutes les billes unitaires d'un membre ne font
    // qu'un seul nombre dans l'équation.
    const unitSum = pieces
      .filter(p => p.type === "token" && p.unit)
      .reduce((sum,p)=>sum + Number(p.value || 0), 0);
    // Jetons nés d'un même partage : écrits en produit « 3 × 4 », une seule fois.
    const renderedShareBatches = new Set();
    const tokenTerm = piece => {
      if(!piece.shareBatch) return formatEquationTerm(piece.value);
      if(renderedShareBatches.has(piece.shareBatch)) return null;
      renderedShareBatches.add(piece.shareBatch);
      const batch = pieces.filter(candidate => candidate.type === "token" && candidate.shareBatch === piece.shareBatch);
      const value = Number(piece.value);
      if(batch.length < 2 || batch.some(candidate => Number(candidate.value) !== value)) return formatEquationTerm(value);
      return value < 0
        ? `−${batch.length} × ${Math.abs(value)}`
        : `${batch.length} × ${formatSignedNumber(value)}`;
    };

    if(canCombineAllXOfSameSign){
      let xDone = false;
      let unitDone = false;
      for(const p of pieces){
        if(p.type === "x"){
          if(!xDone){
            const coef = xPieces.reduce((total, item) => total + xSign(item), 0);
            if(coef !== 0) terms.push(formatXTerm(coef));
            xDone = true;
          }
        }else if(p.unit){
          if(!unitDone){
            if(unitSum !== 0) terms.push(formatEquationTerm(unitSum));
            unitDone = true;
          }
        }else{
          const term = tokenTerm(p);
          if(term) terms.push(term);
        }
      }
      return joinEquationTerms(terms);
    }

    let i = 0;
    let unitDone = false;
    while(i < pieces.length){
      const p = pieces[i];
      if(p.type === "x"){
        // Dès qu'il y a des taches opposées dans le même membre, on ne les
        // simplifie pas automatiquement dans l'équation : il faut que l'élève
        // fasse le regroupement de la paire nulle sur le plateau. On regroupe
        // seulement les séries consécutives de même signe pour garder une
        // écriture lisible sans masquer le geste x + (−x) = 0.
        const sign = xSign(p);
        let count = 0;
        while(i < pieces.length && pieces[i].type === "x" && xSign(pieces[i]) === sign){
          count++;
          i++;
        }
        const coef = sign * count;
        if(coef !== 0) terms.push(formatXTerm(coef));
      }else if(p.unit){
        if(!unitDone){
          if(unitSum !== 0) terms.push(formatEquationTerm(unitSum));
          unitDone = true;
        }
        i++;
      }else{
        const term = tokenTerm(p);
        if(term) terms.push(term);
        i++;
      }
    }
    return joinEquationTerms(terms);
  }

  function getConclusionInfo(){
    const left = activePieces("left").filter(p => !(p.type === "token" && Number(p.value) === 0));
    const right = activePieces("right").filter(p => !(p.type === "token" && Number(p.value) === 0));
    if(left.length === 0 || right.length === 0) return null;
    const isAllTokens = arr => arr.every(p => p.type === "token");
    const isAllX = arr => arr.every(p => p.type === "x");
    const allSameXSign = arr => isAllX(arr) && arr.length > 0 && arr.every(p => xSign(p) === xSign(arr[0]));
    const allSameToken = arr => isAllTokens(arr) && arr.every(p => p.value === arr[0].value);

    // Avec les taches opposées, on évite le raccourci magique −x = n → x = −n.
    // L'élève devra d'abord utiliser l'action "opposé des deux membres" dans une étape suivante.
    if(allSameToken(left) && allSameXSign(right) && right.length === left.length && xSign(right[0]) > 0){
      return {value:left[0].value, count:right.length, xSide:"right", tokenSide:"left"};
    }
    if(allSameToken(right) && allSameXSign(left) && left.length === right.length && xSign(left[0]) > 0){
      return {value:right[0].value, count:left.length, xSide:"left", tokenSide:"right"};
    }
    return null;
  }

  function getSolvedValue(){
    const info = getConclusionInfo();
    return info ? info.value : null;
  }

  function productExpressionForConclusion(info){
    const factor = formatFusionTerm(info.value);
    return `${info.count} × ${factor}`;
  }

  function equationBeforeConclusion(info){
    const xTerm = formatXTerm(info.count);
    const product = productExpressionForConclusion(info);
    return info.xSide === "left" ? `${xTerm} = ${product}` : `${product} = ${xTerm}`;
  }

  function finalEquationForConclusion(info){
    const unknown = displayedUnknown();
    const value = formatSignedNumber(info.value);
    return info.xSide === "left" ? `${unknown} = ${value}` : `${value} = ${unknown}`;
  }

  function currentEquationString(){
    const info = getConclusionInfo();
    if(info && (info.count === 1 || (state && state.conclusionDone))) return finalEquationForConclusion(info);
    if(info) return equationBeforeConclusion(info);
    return `${sideExpression("left")} = ${sideExpression("right")}`;
  }

  function simplifyPlateauForConclusion(info){
    if(!state || !info) return;

    // Au moment de conclure, on passe du modèle “autant de taches
    // que de parts identiques” à la lecture finale : une tache vaut un jeton.
    // On garde le côté où se trouvait l’inconnue pour ne pas inverser
    // visuellement la situation que les élèves viennent de construire.
    const finalX = makeX(1);
    const finalToken = makeToken(info.value);

    if(info.xSide === "left"){
      state.left = [finalX];
      state.right = [finalToken];
    }else{
      state.left = [finalToken];
      state.right = [finalX];
    }
  }

  function concludeSolution(){
    if(!state) return;
    const info = getConclusionInfo();
    if(!info) return;
    pushHistory();
    simplifyPlateauForConclusion(info);
    delete state.pendingShareConclusion;
    state.conclusionDone = true;
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    // La conclusion correspond à la division des deux membres par le nombre de taches.
    // C'est ici, et non au moment du partage du plateau, que l'on affiche l'opération.
    recordEquationStep(makeBothSidesOperation(`÷ ${info.count}`));
    render();
  }

  function finalizePendingShare(expectedId){
    const pending = state && state.pendingShareConclusion;
    if(!pending || pending.id !== expectedId) return;
    pending.finalizing = false;
    pushHistory();
    simplifyPlateauForConclusion({
      value:pending.each,
      count:pending.count,
      xSide:pending.xSide,
      tokenSide:pending.tokenSide
    });
    delete state.pendingShareConclusion;
    state.conclusionDone = true;
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    render();
  }

  function recordEquationStep(operation=null){
    if(!state) return;
    const eq = currentEquationString();
    if(!state.steps) state.steps = [];
    if(!state.stepOps) state.stepOps = [];
    if(state.steps[state.steps.length - 1] !== eq){
      if(state.steps.length > 0){
        state.stepOps.push(operation || null);
      }
      state.steps.push(eq);
    }
  }

  function compactOperationLabel(raw){
    return String(raw || "").replace(/\s*×\s*/g, "×").replace(/\s+/g, "");
  }

  function makeBothSidesOperation(label){
    return {type:"bothSides", label:String(label || "")};
  }

  function formatSignedOperationNumber(value){
    const n = Number(value || 0);
    if(n < 0) return `−${Math.abs(n)}`;
    return `+${n}`;
  }

  function formatSignedOperationX(coef){
    const n = Number(coef || 0);
    const abs = Math.abs(n);
    const v = displayedUnknown();
    const body = abs === 1 ? v : `${abs}${v}`;
    return n < 0 ? `−${body}` : `+${body}`;
  }

  function formatSubtractBothSidesOperation(info){
    if(!info) return "";
    if(info.type === "x"){
      const coef = Number(info.coef || 0);
      return formatSignedOperationX(-coef);
    }
    const value = Number(info.value || 0);
    return formatSignedOperationNumber(-value);
  }

  function updateCurrentEquationStep(){
    if(!state) return;
    const eq = currentEquationString();
    if(!state.steps) state.steps = [];
    if(!state.stepOps) state.stepOps = [];
    if(state.steps.length === 0){
      state.steps.push(eq);
      return;
    }
    state.steps[state.steps.length - 1] = eq;
  }

  function isSolvedEquationString(eq){
    const {lhs, rhs} = splitEquation(eq);
    const v = displayedUnknown();
    return (lhs === v && /^[−-]?\d+$/.test(rhs)) || (rhs === v && /^[−-]?\d+$/.test(lhs));
  }

  function splitEquation(eq){
    const parts = String(eq).split("=");
    if(parts.length < 2) return {lhs:String(eq), rhs:""};
    return {lhs:parts[0].trim(), rhs:parts.slice(1).join("=").trim()};
  }

  function escapeHtml(value){
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderOperationRow(operation){
    if(!operation || operation.type !== "bothSides" || !operation.label) return "";
    const label = escapeHtml(operation.label);
    const arrow = `<span class="operationArrow" aria-hidden="true">↓</span>`;
    return `<div class="equationOpRow" aria-label="Même opération dans les deux membres : ${label}"><span class="operationCell opLeft"><span class="operationWrap"><span class="opLabel">${label}</span>${arrow}</span></span><span class="eq"></span><span class="operationCell opRight"><span class="operationWrap">${arrow}<span class="opLabel">${label}</span></span></span></div>`;
  }

  function renderEquationHistory(){
    const steps = state.steps || [];
    const stepOps = state.stepOps || [];
    if(!steps.length){ equationHistory.innerHTML = ""; return; }
    const rows = [];
    steps.forEach((eq, i) => {
      if(i > 0){
        rows.push(renderOperationRow(stepOps[i - 1]));
      }
      const {lhs, rhs} = splitEquation(eq);
      const isCurrent = i === steps.length - 1;
      const solved = isSolvedEquationString(eq);
      const cls = `${isCurrent ? "currentStep" : "historyStep"}${solved ? " solvedStep" : ""}`;
      rows.push(`<div class="equationRow ${cls}"><span class="lhs">${escapeHtml(lhs)}</span><span class="eq">=</span><span class="rhs">${escapeHtml(rhs)}</span></div>`);
    });
    equationHistory.innerHTML = `<div class="equationList" aria-label="Étapes de résolution">${rows.join("")}</div>`;
    equationHistory.scrollTop = equationHistory.scrollHeight;
  }

  // MODE RÉCEPTION — au départ, l'équation reçue s'annonce par l'égalité des
  // deux quantités ; la consigne s'efface au premier geste de l'élève.
  const INITIAL_EQUALITY_INSTRUCTION = "<strong>Il y a la même quantité à gauche qu’à droite.</strong>";
  function setInstruction(html){
    instructionZone.innerHTML = initialEqualityInstructionVisible
      ? INITIAL_EQUALITY_INSTRUCTION
      : (html || "");
  }
  function dismissInitialEqualityInstruction(){
    initialEqualityInstructionVisible = false;
  }
  function showInitialEqualityInstruction(){
    initialEqualityInstructionVisible = true;
    setInstruction("");
  }

  function getPieceBySideAndId(ref){
    if(!ref || !state || !state[ref.side]) return null;
    return state[ref.side].find(p => p.id === ref.id) || null;
  }

  function selectedDeleteIds(){ return new Set(deleteSelection.map(ref => ref.id)); }

  function selectedDeletePiecesBySide(){
    const left = [], right = [];
    for(const ref of deleteSelection){
      const p = getPieceBySideAndId(ref);
      if(!p || p.removed) continue;
      if(ref.side === "left") left.push(p);
      if(ref.side === "right") right.push(p);
    }
    return {left, right};
  }

  function zeroXPairSelectionInfo(){
    const {left, right} = selectedDeletePiecesBySide();
    const selected = left.length ? left : right;
    const side = left.length ? "left" : (right.length ? "right" : null);
    if(!oppositeXEnabled()) return {ok:false, reason:"disabled", left, right};
    if(!side || (left.length && right.length)) return {ok:false, reason:"oneSideOnly", left, right};
    if(selected.length < 2) return {ok:false, reason:"notEnough", left, right};
    if(selected.some(p => p.type !== "x")) return {ok:false, reason:"notOnlyX", left, right};
    const coef = selected.reduce((sum,p)=>sum + xSign(p), 0);
    if(coef !== 0) return {ok:false, reason:"notZero", left, right, coef};
    return {ok:true, side, selected, left, right};
  }

  function cancelZeroXPair(){
    const info = zeroXPairSelectionInfo();
    if(!info.ok) return;
    pushHistory();
    const ids = new Set(deleteSelection.map(ref => ref.id));
    for(const p of state[info.side]){
      if(ids.has(p.id)) p.removed = true;
    }
    deleteSelection = [];
    recordEquationStep();
    render();
  }

  function deletionGroupInfo(){
    const {left, right} = selectedDeletePiecesBySide();
    if(left.length === 0 || right.length === 0) return {ok:false, reason:"needBoth", left, right};
    const all = left.concat(right);
    const firstType = all[0].type;
    if(all.some(p => p.type !== firstType)) return {ok:false, reason:"mixedTypes", left, right};
    if(firstType === "x"){
      const leftCoef = left.reduce((sum,p)=>sum + xSign(p), 0);
      const rightCoef = right.reduce((sum,p)=>sum + xSign(p), 0);
      if(leftCoef !== rightCoef) return {ok:false, reason:"differentXCoef", left, right, leftCoef, rightCoef};
      if(leftCoef === 0) return {ok:false, reason:"zeroXSelection", left, right, leftCoef, rightCoef};
      return {ok:true, type:"x", coef:leftCoef, label:formatXTerm(leftCoef), left, right};
    }
    const leftSum = left.reduce((s,p)=>s + Number(p.value || 0), 0);
    const rightSum = right.reduce((s,p)=>s + Number(p.value || 0), 0);
    if(leftSum !== rightSum) return {ok:false, reason:"differentSums", left, right, leftSum, rightSum};
    return {ok:true, type:"token", value:leftSum, label:String(leftSum), left, right};
  }

  function selectForDeletion(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.removed) return;
    const alreadyIndex = deleteSelection.findIndex(ref => ref.side === side && ref.id === id);
    if(alreadyIndex >= 0){ deleteSelection.splice(alreadyIndex,1); render(); return; }
    const currentPieces = deleteSelection.map(getPieceBySideAndId).filter(Boolean);
    if(currentPieces.length && piece.type !== currentPieces[0].type) deleteSelection = [];
    deleteSelection.push({side,id});
    render();
  }

  function deleteMatching(){
    const info = deletionGroupInfo();
    if(!info.ok) return;
    pushHistory();
    const ids = selectedDeleteIds();
    for(const side of ["left","right"]){
      for(const p of state[side]) if(ids.has(p.id)) p.removed = true;
    }
    const opLabel = formatSubtractBothSidesOperation(info);
    deleteSelection = [];
    recordEquationStep(makeBothSidesOperation(opLabel));
    render();
  }

  function selectedGroupIds(){ return new Set(groupSelection.map(ref => ref.id)); }

  function selectedGroupPieces(){
    const pieces = [];
    for(const ref of groupSelection){
      const p = getPieceBySideAndId(ref);
      if(!p || p.removed) continue;
      pieces.push({ref, piece:p});
    }
    return pieces;
  }

  function groupSelectionInfo(){
    const selected = selectedGroupPieces();
    if(selected.length < 2) return {ok:false, reason:"notEnough", selected};
    const side = selected[0].ref.side;
    if(selected.some(x => x.ref.side !== side)) return {ok:false, reason:"differentSides", selected};

    const firstType = selected[0].piece.type;
    if(selected.some(x => x.piece.type !== firstType)) return {ok:false, reason:"mixedTypes", selected};

    if(firstType === "token"){
      const sum = selected.reduce((total, x) => total + Number(x.piece.value || 0), 0);
      return {ok:true, kind:"tokens", side, sum, selected};
    }

    if(firstType === "x"){
      if(!oppositeXEnabled()) return {ok:false, reason:"oppositeDisabled", selected};
      const coef = selected.reduce((total, x) => total + xSign(x.piece), 0);
      if(coef !== 0) return {ok:false, reason:"notZeroX", side, coef, selected};
      return {ok:true, kind:"zeroX", side, coef, selected};
    }

    return {ok:false, reason:"unsupported", selected};
  }

  function selectForGrouping(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.removed) return;

    const canSelect = piece.type === "token" || (piece.type === "x" && oppositeXEnabled());
    if(!canSelect){
      setInstruction(oppositeXEnabled()
        ? "En mode Regrouper, sélectionne des jetons numériques ou des taches opposées."
        : "En mode Regrouper, sélectionne seulement des jetons numériques.");
      return;
    }

    const alreadyIndex = groupSelection.findIndex(ref => ref.side === side && ref.id === id);
    if(alreadyIndex >= 0){
      groupSelection.splice(alreadyIndex, 1);
      render();
      return;
    }

    // On regroupe uniquement dans un même membre et avec une même nature d’objet.
    if(groupSelection.length){
      const currentPieces = selectedGroupPieces();
      const currentType = currentPieces.length ? currentPieces[0].piece.type : null;
      if(groupSelection[0].side !== side || currentType !== piece.type) groupSelection = [];
    }

    groupSelection.push({side, id});
    render();
  }

  function openGroupDialog(){
    const info = groupSelectionInfo();
    if(!info.ok || info.kind !== "tokens") return;
    const values = info.selected.map(x => formatSignedNumber(x.piece.value));
    groupDialogText.innerHTML = `${values.join(" + ")} = ?`;
    groupInput.value = "";
    groupFeedback.textContent = "";
    openAppDialog(groupDialog, groupInput, {
      allowMinus:isRelativeUniverse(),
      submitLabel:"Regrouper",
      onSubmit:applyGroup
    });
  }

  function applyZeroXGroup(info){
    if(!info || !info.ok || info.kind !== "zeroX") return;
    pushHistory();
    const arr = state[info.side];
    const ids = new Set(info.selected.map(x => x.ref.id));
    const indexes = info.selected.map(x => arr.findIndex(p => p.id === x.ref.id)).filter(i => i >= 0);
    const firstIndex = Math.min(...indexes);

    // Même logique visuelle que 1 + (−1) : on remplace la paire par un
    // jeton 0 temporaire, puis il disparaît progressivement.
    const zero = makeToken(0);
    zero.transientZero = true;
    const positions = info.selected
      .map(x => x.piece)
      .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
    if(positions.length){
      zero.x = positions.reduce((sum,p)=>sum + p.x, 0) / positions.length;
      zero.y = positions.reduce((sum,p)=>sum + p.y, 0) / positions.length;
    }

    const filtered = arr.filter(p => !ids.has(p.id));
    filtered.splice(firstIndex, 0, zero);
    state[info.side] = filtered;

    groupSelection = [];
    deleteSelection = [];
    selectedPieceRef = null;
    recordEquationStep();
    render();
    setInstruction("Paire nulle : <strong>x + (−x) = 0</strong>, puis le 0 disparaît.");
    setTimeout(() => removeTransientZero(info.side, zero.id), 950);
  }

  function applyGroup(){
    const info = groupSelectionInfo();
    if(!info.ok){
      if(groupFeedback) groupFeedback.textContent = "Sélectionne au moins deux jetons du même membre.";
      return;
    }

    if(info.kind === "zeroX"){
      applyZeroXGroup(info);
      return;
    }

    if(info.kind !== "tokens") return;

    const answer = Number(String(groupInput.value || "").replace(/−/g, "-"));
    if(!Number.isFinite(answer) || Math.round(answer) !== answer){
      groupFeedback.textContent = "Écris un nombre entier.";
      groupInput.select();
      return;
    }

    if(answer !== info.sum){
      groupFeedback.textContent = "Ce n’est pas encore la bonne somme.";
      groupInput.select();
      return;
    }

    pushHistory();
    const arr = state[info.side];
    const ids = new Set(info.selected.map(x => x.ref.id));
    const indexes = info.selected.map(x => arr.findIndex(p => p.id === x.ref.id)).filter(i => i >= 0);
    const firstIndex = Math.min(...indexes);
    const merged = makeToken(info.sum);
    const coords = info.selected
      .map(x => x.piece)
      .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
    if(coords.length){
      merged.x = coords.reduce((sum,p)=>sum + p.x, 0) / coords.length;
      merged.y = coords.reduce((sum,p)=>sum + p.y, 0) / coords.length;
    }

    state[info.side] = arr.filter(p => !ids.has(p.id));
    state[info.side].splice(firstIndex, 0, merged);
    groupSelection = [];
    deleteSelection = [];
    selectedPieceRef = null;
    recordEquationStep();
    groupDialog.close();
    render();
    setInstruction(`Jetons regroupés : <strong>${formatSignedNumber(info.sum)}</strong>.`);
  }

  function getShareOpportunity(){
    const left = activePieces("left");
    const right = activePieces("right");
    const leftTokens = left.filter(p => p.type === "token");
    const rightTokens = right.filter(p => p.type === "token");
    const leftX = left.filter(p => p.type === "x");
    const rightX = right.filter(p => p.type === "x");
    // Seules des taches positives ouvrent un partage final : face à des taches
    // −x, « x = 4 » serait faux, l'élève doit d'abord prendre l'opposé.
    if(rightTokens.length === 1 && rightX.length === 0 && leftTokens.length === 0 && leftX.length >= 2 && xSign(leftX[0]) > 0 && leftX.every(p => xSign(p) === xSign(leftX[0]))){
      const value = rightTokens[0].value;
      if(value % leftX.length === 0) return {tokenSide:"right", xSide:"left", token:rightTokens[0], count:leftX.length, result:value/leftX.length};
    }
    if(leftTokens.length === 1 && leftX.length === 0 && rightTokens.length === 0 && rightX.length >= 2 && xSign(rightX[0]) > 0 && rightX.every(p => xSign(p) === xSign(rightX[0]))){
      const value = leftTokens[0].value;
      if(value % rightX.length === 0) return {tokenSide:"left", xSide:"right", token:leftTokens[0], count:rightX.length, result:value/rightX.length};
    }
    return null;
  }

  function pendingShareFinalEquation(pending){
    const unknown = displayedUnknown();
    const value = formatSignedNumber(pending.each);
    return pending.xSide === "left" ? `${unknown} = ${value}` : `${value} = ${unknown}`;
  }

  function beginPendingShareConclusion(opportunity, each){
    const pending = {
      id:uid(),
      count:opportunity.count,
      each:Number(each),
      xSide:opportunity.xSide,
      tokenSide:opportunity.tokenSide,
      finalizing:false
    };
    state.pendingShareConclusion = pending;
    if(!state.steps) state.steps = [];
    if(!state.stepOps) state.stepOps = [];
    const finalEquation = pendingShareFinalEquation(pending);
    if(state.steps[state.steps.length - 1] !== finalEquation){
      if(state.steps.length > 0){
        state.stepOps.push(makeBothSidesOperation(`÷ ${pending.count}`));
      }
      state.steps.push(finalEquation);
    }
  }

  function decompositionMatchesFinalShare(opportunity, side, id, values){
    if(!opportunity || opportunity.tokenSide !== side || opportunity.token.id !== id) return false;
    if(values.length !== opportunity.count) return false;
    return values.every(value => Number(value) === Number(opportunity.result));
  }

  function applyTokenSplit(side, id, values, historyMode="record", operation=null){
    const arr = state[side];
    const idx = arr.findIndex(p => p.id === id);
    if(idx < 0) return;
    const opportunity = getShareOpportunity();
    const isFinalShare = decompositionMatchesFinalShare(opportunity, side, id, values);
    pushHistory();
    if(isFinalShare){
      beginPendingShareConclusion(opportunity, Number(opportunity.result));
    }else{
      arr.splice(idx, 1, ...values.map(makeToken));
      if(historyMode === "record") recordEquationStep(operation);
      else updateCurrentEquationStep();
    }
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    render();
  }

  function applySharedTokenSplit(side, id, partCount, partValue){
    const arr = state[side];
    const idx = arr.findIndex(piece => piece.id === id);
    if(idx < 0) return;
    const count = Math.round(Number(partCount) || 0);
    const each = Number(partValue);
    if(count < 2 || !Number.isFinite(each)) return;

    const opportunity = getShareOpportunity();
    pushHistory();
    const isFinalShare = !!opportunity
      && opportunity.tokenSide === side
      && opportunity.token.id === id
      && opportunity.count === count;
    if(isFinalShare){
      beginPendingShareConclusion(opportunity, each);
    }else{
      // Les parts d'un même partage s'écrivent en produit dans l'équation
      // (« 3 × 4 »), comme la conclusion écrit déjà « 3x = 3 × 5 ».
      const shareBatch = uid();
      arr.splice(idx, 1, ...Array.from({length:count}, () => makeToken(each, {shareBatch})));
      recordEquationStep();
    }
    selectedPieceRef = null;
    deleteSelection = [];
    groupSelection = [];
    render();
  }

  function parseSum(text){
    // Repris de la page import : une soustraction s'écrit naturellement,
    // « 30 − 2 » vaut 30 + (−2) (utile en Splat relatif).
    const raw = String(text || "").replace(/−/g,"-").replace(/\s+/g,"");
    if(!raw) return null;
    if(!/^[+-]?\d+(?:[+-]\d+)*$/.test(raw)) return null;
    return (raw.match(/[+-]?\d+/g) || []).map(Number).filter(Number.isFinite);
  }

  function openDecomposeDialog(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.type !== "token" || piece.removed) return;
    selectedPieceRef = {side,id};
    dialogText.innerHTML = `Décomposer le jeton <strong>${formatSignedNumber(piece.value)}</strong> en une somme.`;
    decomposeInput.value = "";
    presetChips.classList.remove("open");
    presetChips.innerHTML = "";
    openAppDialog(decomposeDialog, decomposeInput, {
      expression:true,
      allowMinus:isRelativeUniverse(),
      submitLabel:"Décomposer",
      onSubmit:applyDecomposeInput
    });
  }

  function getSmartDecompositionSuggestions(side, piece){
    const value = Number(piece.value);
    const otherSide = side === "left" ? "right" : "left";
    const suggestions = [];

    // 1) Aide prioritaire : si l'autre membre contient déjà une quantité numérique,
    // on propose de faire apparaître cette quantité pour pouvoir la supprimer ensuite.
    // Exemple : 14 d'un côté et 30 de l'autre -> 30 = 14 + 16.
    const otherTokens = activePieces(otherSide).filter(p => p.type === "token");
    const targets = [];
    for(const t of otherTokens){
      const v = Number(t.value);
      if(Number.isFinite(v) && v > 0) targets.push(v);
    }
    const otherSum = otherTokens.reduce((sum,p)=>sum + Number(p.value || 0), 0);
    if(otherSum > 0) targets.push(otherSum);

    for(const target of targets){
      if(target > 0 && target < value){
        suggestions.push([target, value - target]);
      }
    }

    // 2) Aide de partage : si on doit partager en autant de parts qu'il reste de taches.
    const left = activePieces("left");
    const right = activePieces("right");
    const leftX = left.filter(p => p.type === "x").length;
    const rightX = right.filter(p => p.type === "x").length;
    const leftTokens = left.filter(p => p.type === "token").length;
    const rightTokens = right.filter(p => p.type === "token").length;
    const usefulShareCount =
      (side === "right" && rightX === 0 && leftTokens === 0 && leftX >= 2) ? leftX :
      (side === "left" && leftX === 0 && rightTokens === 0 && rightX >= 2) ? rightX :
      0;
    if(usefulShareCount >= 2 && value % usefulShareCount === 0){
      suggestions.push(Array.from({length:usefulShareCount}, () => value / usefulShareCount));
    }

    // 3) Propositions générales, utiles mais secondaires.
    for(let n=2;n<=6;n++){
      if(value % n === 0){
        const part = value / n;
        suggestions.push(Array.from({length:n},()=>part));
      }
    }
    if(value > 3){ suggestions.push([1, value-1]); }
    if(value > 5){ suggestions.push([2, value-2]); }

    const unique = [];
    const seen = new Set();
    for(const s of suggestions){
      if(!Array.isArray(s) || s.length < 2) continue;
      if(s.some(v => !Number.isFinite(Number(v)) || Number(v) <= 0)) continue;
      const sum = s.reduce((a,b)=>a+Number(b), 0);
      if(sum !== value) continue;
      const key = s.join("+");
      if(!seen.has(key)){ seen.add(key); unique.push(s); }
    }
    return unique.slice(0, 8);
  }

  function showDecomposeSuggestions(){
    if(!selectedPieceRef) return;
    const piece = getPieceBySideAndId(selectedPieceRef);
    if(!piece) return;
    const suggestions = getSmartDecompositionSuggestions(selectedPieceRef.side, piece);
    presetChips.innerHTML = suggestions.map(s => `<button class="chip" type="button" data-values="${s.join(",")}">${s.join(" + ")}</button>`).join("");
    presetChips.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const values = btn.dataset.values.split(",").map(Number);
        applyTokenSplit(selectedPieceRef.side, selectedPieceRef.id, values);
        decomposeDialog.close();
      });
    });
    presetChips.classList.add("open");
  }

  function applyDecomposeInput(){
    if(!selectedPieceRef) return;
    const piece = getPieceBySideAndId(selectedPieceRef);
    if(!piece) return;
    const values = parseSum(decomposeInput.value);
    if(!values || values.length < 2){
      dialogText.innerHTML = `Écris une somme avec au moins deux termes, par exemple <strong>${Math.floor(piece.value/2)} + ${piece.value - Math.floor(piece.value/2)}</strong>.`;
      return;
    }
    const sum = values.reduce((a,b)=>a+b,0);
    if(sum !== piece.value){
      dialogText.innerHTML = `La somme doit faire <strong>${piece.value}</strong>. Ici, elle fait <strong>${sum}</strong>.`;
      return;
    }
    if(!isRelativeUniverse() && values.some(v => v < 0)){
      dialogText.innerHTML = "En Splat positif, écris une somme de nombres <strong>positifs</strong>.";
      return;
    }
    applyTokenSplit(selectedPieceRef.side, selectedPieceRef.id, values);
    decomposeDialog.close();
  }

  function openShareDialog(side, id){
    const piece = state[side].find(p => p.id === id);
    if(!piece || piece.type !== "token" || piece.removed) return;
    selectedPieceRef = {side,id};
    const value = Number(piece.value);
    shareDialogText.innerHTML = `Partager le jeton <strong>${value}</strong> en parts égales.`;
    const choices = [];
    for(let n=2;n<=8;n++){
      if(value % n === 0) choices.push({n, part:value/n});
    }
    if(!choices.length){
      shareChoices.innerHTML = `<div class="dialogText">Aucun partage entier simple proposé.</div>`;
    }else{
      shareChoices.innerHTML = choices.map(c => `<button class="chip" type="button" data-n="${c.n}" data-part="${c.part}">${c.n} parts de ${c.part}</button>`).join("");
      shareChoices.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const n = Number(btn.dataset.n);
          const part = Number(btn.dataset.part);
          // Partager équitablement est une action sur le plateau :
          // on fait apparaître le produit (ex. 2 × 12), mais on ne note pas encore :2.
          // La division des deux membres est affichée au moment de "Conclure".
          applySharedTokenSplit(side, id, n, part);
          shareDialog.close();
        });
      });
    }
    openAppDialog(shareDialog);
  }

  function blobPath(cx, cy, r){
    const n = 36, lobes = 5, pts = [];
    for(let i=0;i<n;i++){
      const a = (Math.PI*2*i)/n;
      const k = 0.90 + 0.16*Math.sin(lobes*a) + 0.04*Math.sin(2*lobes*a);
      const rr = r*k;
      pts.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr]);
    }
    function cr2bz(p0,p1,p2,p3){
      const t = 1/6;
      return [p1[0]+(p2[0]-p0[0])*t, p1[1]+(p2[1]-p0[1])*t, p2[0]-(p3[0]-p1[0])*t, p2[1]-(p3[1]-p1[1])*t, p2[0], p2[1]];
    }
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for(let i=0;i<n;i++){
      const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
      const [c1x,c1y,c2x,c2y,x,y] = cr2bz(p0,p1,p2,p3);
      d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x} ${y}`;
    }
    return d + " Z";
  }

  function tokenAreaForTray(tray){
    // PATCH 0.4 : zone de manipulation plus grande et plus proche des bords.
    // Le jeton doit pouvoir circuler presque partout sur le plateau.
    // On garde seulement une marge intérieure pour éviter qu'il colle au bord.
    return {x:tray.x+42, y:tray.y+54, w:tray.w-84, h:tray.h-96};
  }

  function tokenPlacementAreaForTray(tray){
    if(!isPhoneLayout()) return tokenAreaForTray(tray);
    // Au téléphone, les nouveaux jetons se rangent d'abord dans le tiers bas.
    // Ils restent ensuite déplaçables sur toute la surface du plateau.
    return {
      x:tray.x+48,
      y:tray.y+tray.h*.62,
      w:tray.w-96,
      h:tray.h*.32
    };
  }

  function rowsForSplats(n){
    if(n <= 1) return [n];
    if(n === 2) return [2];
    if(n === 3) return [2,1];
    if(n === 4) return [2,2];
    if(!isPhoneLayout()) return [3, n-3];
    if(n <= 6) return [3, n-3];
    return [3,3,n-6];
  }

  function splatPositionsForItems(tray, items){
    const xs = items.filter(p => p.type === "x");
    const out = new Map();
    // PATCH 0.7.2 : taches légèrement plus grandes et mieux espacées.
    // Elles doivent pouvoir cacher visuellement un jeton numéroté,
    // sans se toucher lorsque plusieurs inconnues sont présentes.
    // Réception au téléphone : taches plus grandes, zone élargie (page import).
    const mobileLayout = isMobileImportLayout();
    const splatArea = isPhoneLayout()
      ? {x:tray.x+70, y:tray.y+54, w:tray.w-140, h:tray.h*.55}
      : {
          x:tray.x+(mobileLayout ? 45 : 70),
          y:tray.y+80,
          w:tray.w-(mobileLayout ? 90 : 140),
          // Ordinateur : 400 dans la géométrie d'origine (plateau de 650), et
          // proportionnel quand le cadre est plus plat (PATCH ESPACE 2026-08-22).
          h:mobileLayout ? Math.min(760, tray.h * .58) : Math.min(400, tray.h * .62)
        };
    const rows = rowsForSplats(xs.length);
    const radius = commonSplatRadius();
    let k = 0;
    for(let r=0;r<rows.length;r++){
      const cols = rows[r];
      const cellW = splatArea.w / Math.max(1, cols);
      const cy = splatArea.y + splatArea.h*((r+.5)/rows.length);
      for(let c=0;c<cols && k<xs.length;c++){
        const cx = splatArea.x + cellW*(c+.5);
        out.set(xs[k].id, {cx,cy,r:mobileLayout ? 108 : radius});
        k++;
      }
    }
    return out;
  }

  function avoidSplatsOnDrop(tray, items, cx, cy, r=40){
    // Si le jeton est relâché sur une tache, on le repousse doucement
    // vers le bord libre le plus proche, plutôt que de le bloquer dans la zone basse.
    let p = {cx, cy};
    const splats = Array.from(splatPositionsForItems(tray, items).values());

    for(let pass=0; pass<5; pass++){
      let changed = false;
      for(const s of splats){
        const minDist = s.r + r + 16;
        let dx = p.cx - s.cx;
        let dy = p.cy - s.cy;
        let dist = Math.hypot(dx, dy);
        if(dist < minDist){
          if(dist < 0.001){
            dx = 1; dy = 0; dist = 1;
          }
          const push = minDist - dist;
          p.cx += (dx / dist) * push;
          p.cy += (dy / dist) * push;
          p = clampTokenPosition(tray, p.cx, p.cy, r, false);
          changed = true;
        }
      }
      if(!changed) break;
    }
    return p;
  }

  function clampTokenPosition(tray, cx, cy, r=40, avoid=true, side=null){
    const area = tokenAreaForTray(tray);
    let p = {
      cx: clamp(cx, area.x + r, area.x + area.w - r),
      cy: clamp(cy, area.y + r, area.y + area.h - r)
    };
    if(avoid && side && state && state[side]){
      p = avoidSplatsOnDrop(tray, state[side], p.cx, p.cy, r);
    }
    return p;
  }

  function tokenOverlapsExisting(candidate, placed, minDist){
    for(const p of placed){
      // Sans distance imposée (réception : billes et jetons mêlés), on s'appuie
      // sur les rayons réels des deux jetons.
      const required = Number.isFinite(minDist) ? minDist : ((candidate.r || TOKEN_R_DESKTOP) + (p.r || TOKEN_R_DESKTOP) + 10);
      if(Math.hypot(candidate.cx - p.cx, candidate.cy - p.cy) < required) return true;
    }
    return false;
  }

  function tokenOverlapsSplats(candidate, splats, tokenR){
    for(const s of splats){
      if(Math.hypot(candidate.cx - s.cx, candidate.cy - s.cy) < s.r + tokenR + 18) return true;
    }
    return false;
  }

  function randomTokenPositionInTray(tray, sideName, visible, placed, token){
    const area = tokenPlacementAreaForTray(tray);
    const splats = Array.from(splatPositionsForItems(tray, visible).values());
    const r = tokenRadius(token);
    // Réception : billes et jetons mêlés, la distance suit les rayons réels.
    const minTokenDist = isImportLayout() ? undefined : r * 2.12;

    // Placement naturel : au téléphone on commence dans la zone basse ;
    // dans tous les cas, on évite les taches et les jetons trop proches.
    for(let attempt=0; attempt<140; attempt++){
      const cx = area.x + r + Math.random() * Math.max(1, area.w - 2*r);
      const cy = area.y + r + Math.random() * Math.max(1, area.h - 2*r);
      const p = clampTokenPosition(tray, cx, cy, r, true, sideName);
      p.r = r;
      if(tokenOverlapsSplats(p, splats, r)) continue;
      if(tokenOverlapsExisting(p, placed, minTokenDist)) continue;
      return p;
    }

    // Deuxième passe : on accepte que les jetons soient plus proches,
    // mais toujours pas sur une tache.
    for(let attempt=0; attempt<100; attempt++){
      const cx = area.x + r + Math.random() * Math.max(1, area.w - 2*r);
      const cy = area.y + r + Math.random() * Math.max(1, area.h - 2*r);
      const p = clampTokenPosition(tray, cx, cy, r, true, sideName);
      p.r = r;
      if(tokenOverlapsSplats(p, splats, r)) continue;
      if(tokenOverlapsExisting(p, placed, r * 1.82)) continue;
      return p;
    }

    // Secours déterministe : si le plateau est très chargé, on reprend
    // une position corrigée par l'évitement des taches.
    const fallback = {
      cx: area.x + area.w * (0.28 + Math.random()*0.44),
      cy: area.y + area.h * (0.56 + Math.random()*0.34)
    };
    const p = clampTokenPosition(tray, fallback.cx, fallback.cy, r, true, sideName);
    p.r = r;
    return p;
  }

  function separateTokenPositions(tray, visible, tokens, sideName){
    // PATCH 0.7.3 : après le placement naturel, on effectue une petite
    // relaxation géométrique pour supprimer les derniers chevauchements
    // entre jetons, tout en continuant à éviter les taches.
    if(tokens.length < 2) return;

    for(let pass=0; pass<18; pass++){
      let moved = false;

      for(let i=0; i<tokens.length; i++){
        for(let j=i+1; j<tokens.length; j++){
          const a = tokens[i];
          const b = tokens[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let dist = Math.hypot(dx, dy);

          if(dist < 0.001){
            dx = 1;
            dy = 0;
            dist = 1;
          }

          // Avec des billes (réception), la distance suit les deux rayons réels.
          const minDist = (a.unit || b.unit) ? tokenRadius(a) + tokenRadius(b) + 12 : tokenRadius() * 2.10;
          if(dist < minDist){
            const push = (minDist - dist) / 2;
            const ux = dx / dist;
            const uy = dy / dist;

            let pa = clampTokenPosition(tray, a.x - ux * push, a.y - uy * push, tokenRadius(a), true, sideName);
            let pb = clampTokenPosition(tray, b.x + ux * push, b.y + uy * push, tokenRadius(b), true, sideName);

            a.x = pa.cx;
            a.y = pa.cy;
            b.x = pb.cx;
            b.y = pb.cy;
            moved = true;
          }
        }
      }

      // Une passe de sécurité contre les taches après les déplacements entre jetons.
      for(const t of tokens){
        const safe = clampTokenPosition(tray, t.x, t.y, tokenRadius(t), true, sideName);
        if(Math.abs(safe.cx - t.x) > 0.5 || Math.abs(safe.cy - t.y) > 0.5){
          t.x = safe.cx;
          t.y = safe.cy;
          moved = true;
        }
      }

      if(!moved) break;
    }
  }

  function layoutItems(tray, items, splatLayoutItems=items){
    const visible = items;
    const tokens = visible.filter(p => p.type === "token");
    const out = new Map();

    // Une tache supprimée n'est plus dessinée, mais sa case reste réservée :
    // les taches encore visibles ne changent pas de place après la suppression.
    const splatPositions = splatPositionsForItems(tray, splatLayoutItems);
    for(const [id, pos] of splatPositions.entries()) out.set(id, pos);

    const sideName = tray.x < 800 ? "left" : "right";
    const placedTokens = [];

    for(const token of tokens){
      if(Number.isFinite(token.x) && Number.isFinite(token.y)){
        const r = tokenRadius(token);
        const clamped = clampTokenPosition(tray, token.x, token.y, r, true, sideName);
        token.x = clamped.cx;
        token.y = clamped.cy;
        placedTokens.push({cx:clamped.cx, cy:clamped.cy, r});
      }else{
        const p = randomTokenPositionInTray(tray, sideName, visible, placedTokens, token);
        token.x = p.cx;
        token.y = p.cy;
        placedTokens.push({cx:p.cx, cy:p.cy, r:tokenRadius(token)});
      }
    }

    separateTokenPositions(tray, visible, tokens, sideName);
    for(const token of tokens){
      out.set(token.id, {cx:token.x, cy:token.y, r:tokenRadius(token)});
    }

    return out;
  }

        <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(15,23,42,.50)" stroke-width="3"></line>

  function drawSharedTray(leftTray, rightTray){
    const x = leftTray.x;
    const y = Math.min(leftTray.y, rightTray.y);
    const right = rightTray.x + rightTray.w;
    const bottom = Math.max(leftTray.y + leftTray.h, rightTray.y + rightTray.h);
    drawTray({x, y, w:right-x, h:bottom-y}, "");
    const divider = document.createElementNS("http://www.w3.org/2000/svg", "line");
    divider.setAttribute("x1", 800);
    divider.setAttribute("x2", 800);
    divider.setAttribute("y1", y);
    divider.setAttribute("y2", bottom);
    divider.setAttribute("class", "trayDivider");
    svg.appendChild(divider);
