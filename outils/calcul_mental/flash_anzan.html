    @media (min-width: 1024px) and (max-height: 820px) {
      .shell { padding: 10px 0; }
      .panel { --pad-haut: 14px; padding: var(--pad-haut) 42px 16px; }
      h1 { font-size: 1.9rem; }
      .modes { margin: 10px 0 2px; }
      .ligne { padding: 3px 0; }
      .reglages-ecran .bas { margin-top: 12px; }
    }
    /* Téléphone tenu en largeur : pendant la séance, la barre du site
       s'efface et la réponse passe à droite, comme sur ordinateur. */
    @media (max-height: 500px) and (orientation: landscape) {
      body.en-seance .shell { width: calc(100% - 20px); padding: 6px 0 0; }
      body.en-seance .panel { padding: 8px 16px 8px; border-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
      .vue-jeu.avec-reponse { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 18px; margin-top: 6px; }
      .vue-jeu.avec-reponse .zone-rep { justify-content: center; padding-top: 0; --touche-h: 44px; --touche-ecart: 2px; }
      .vue-jeu.avec-reponse .case { width: 100%; height: 46px; font-size: 1.7rem; }
      .vue-jeu.avec-reponse .keypad, .vue-jeu.avec-reponse .valider { width: 100%; }
      .vue-jeu.avec-reponse .keypad { margin-top: 6px; }
      .valider { margin-top: 6px; }
      .rangee .primary, .rangee .secondary { min-height: 44px; }
      .vue-jeu.avec-reponse .astuce-clavier { display: none; }
      .verdict { padding: 8px; }
      .verdict .val { font-size: 2.4rem; }
      .correction .bas { margin-top: 8px; }
      .correction .bas .astuce { display: none; }
      .score { font-size: 2.6rem; }
    }
    /* Les écrans courts (téléphone dans Safari, petit portable) : le pavé
       se resserre avant la colonne de nombres. */
    @media (max-height: 700px) {
      .zone-rep { --touche-h: 46px; --touche-ecart: 2px; }
      .case { height: 54px; font-size: 1.9rem; }
      .valider { margin-top: 8px; }
      .primary, .rangee .secondary { min-height: 48px; }
    }

    @media print {
      .site-footer, .rond { display: none; }
      .panel { box-shadow: none; }
    }

  <script src="./flash_anzan_core.js?v=20261022-1"></script>
  <script>
    (function () {
      "use strict";
      const CORE = window.MATHSGO_FLASH_ANZAN_CORE;
      const $ = id => document.getElementById(id);
      const corps = document.body;
      const racine = document.documentElement;

      // -----------------------------------------------------------------
      // Les réglages gardés sur l'appareil (au lot 2 : sur le compte de
      // l'élève). Chaque mode garde ses propres derniers réglages.
      // -----------------------------------------------------------------
      const CLE = "mathsgo-flash-anzan-v1";
      function lireMemoire() {
        let brut = null;
        try { brut = JSON.parse(window.localStorage.getItem(CLE) || "null"); } catch (e) { brut = null; }
        const b = brut && typeof brut === "object" ? brut : {};
        return {
          mode: CORE.MODES.includes(b.mode) ? b.mode : "flash",
          flash: CORE.normaliser("flash", b.flash),
          colonne: CORE.normaliser("colonne", b.colonne)
        };
      }
      function ecrireMemoire() {
        try { window.localStorage.setItem(CLE, JSON.stringify(memoire)); } catch (e) { /* navigation privée : tant pis */ }
      }
      const memoire = lireMemoire();
      const reglages = () => memoire[memoire.mode];

      // -----------------------------------------------------------------
      // L'écran des réglages
      // -----------------------------------------------------------------
      function texteLimite(s) { return s ? `${s} s` : "sans"; }
      function dessinerReglages() {
        const mode = memoire.mode;
        const r = reglages();
        document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
        document.querySelectorAll("[data-pour]").forEach(l => { l.hidden = l.dataset.pour !== mode; });
        document.querySelectorAll("[data-reglage]").forEach(b => {
          const cle = b.dataset.reglage;
          if (!(cle in r)) return;
          b.setAttribute("aria-pressed", String(String(r[cle]) === b.dataset.valeur));
        });
        $("val-chiffresMin").textContent = r.chiffresMin;
        $("val-chiffresMax").textContent = r.chiffresMax;
        $("val-nombres").textContent = r.nombres;
        if (mode === "flash") {
          $("val-temps").textContent = CORE.secondes(CORE.tempsEnSecondes(r.temps));
          $("temps-total").textContent = `soit ${CORE.secondes(r.nombres * CORE.tempsEnSecondes(r.temps))} en tout`;
        } else {
          $("val-limite").textContent = texteLimite(r.limite);
        }
        const {chiffres, nombres} = CORE.BORNES;
        const bornes = {
          chiffresMin: [r.chiffresMin <= chiffres.min, r.chiffresMin >= chiffres.max],
          chiffresMax: [r.chiffresMax <= chiffres.min, r.chiffresMax >= chiffres.max],
          nombres: [r.nombres <= nombres.min, r.nombres >= nombres.max],
          temps: [r.temps === CORE.TEMPS[0], r.temps === CORE.TEMPS[CORE.TEMPS.length - 1]],
          limite: [r.limite === CORE.LIMITES[0], r.limite === CORE.LIMITES[CORE.LIMITES.length - 1]]
        };
        document.querySelectorAll("[data-pas]").forEach(b => {
          const borne = bornes[b.dataset.pas];
          if (borne) b.disabled = Number(b.dataset.sens) < 0 ? borne[0] : borne[1];
        });
        ajusterEchelle();
      }
      document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
        memoire.mode = b.dataset.mode;
        ecrireMemoire();
        dessinerReglages();
      }));
      document.querySelectorAll("[data-reglage]").forEach(b => b.addEventListener("click", () => {
        const r = reglages();
        const cle = b.dataset.reglage;
        const brut = b.dataset.valeur;
        const valeur = /^\d+$/.test(brut) ? Number(brut) : brut;
        memoire[memoire.mode] = CORE.normaliser(memoire.mode, {...r, [cle]: valeur});
        ecrireMemoire();
        dessinerReglages();
      }));
      document.querySelectorAll("[data-pas]").forEach(b => b.addEventListener("click", () => {
        const r = reglages();
        const cle = b.dataset.pas;
        const sens = Number(b.dataset.sens);
        let suivant;
        if (cle === "chiffresMin") suivant = CORE.changerChiffres(r, "min", sens);
        else if (cle === "chiffresMax") suivant = CORE.changerChiffres(r, "max", sens);
        else if (cle === "nombres") suivant = {...r, nombres: r.nombres + sens};
        else if (cle === "temps") suivant = {...r, temps: CORE.pas(CORE.TEMPS, r.temps, sens)};
        else suivant = {...r, limite: CORE.pas(CORE.LIMITES, r.limite, sens)};
        memoire[memoire.mode] = CORE.normaliser(memoire.mode, suivant);
        ecrireMemoire();
        dessinerReglages();
      }));

      // -----------------------------------------------------------------
      // Le son : un bip fabriqué par la page (WebAudio), programmé à
      // l'avance au même instant que le changement de nombre.
      // -----------------------------------------------------------------
      let audio = null;
      let bips = [];
      function preparerSon() {
        if (audio) { if (audio.state === "suspended") audio.resume().catch(() => {}); return; }
        const Contexte = window.AudioContext || window.webkitAudioContext;
        if (!Contexte) return;
        try { audio = new Contexte(); } catch (e) { audio = null; }
      }
      function programmerBips(t0, nombres, tempsMs) {
        couperBips();
        if (!audio || seance.reglages.son !== "bip") return;
        const maintenant = performance.now();
        const base = audio.currentTime;
        const duree = Math.min(0.06, tempsMs / 2000);
        for (let i = 0; i < nombres; i += 1) {
          bip(BIP_NOMBRE, base + Math.max(0, (t0 + i * tempsMs - maintenant) / 1000), duree);
        }
      }
      // Un bip : la fréquence, l'instant (horloge du son), la durée.
      const BIP_NOMBRE = 880;
      const BIP_DECOMPTE = 440; // plus grave (choix de Gwenaël, 22/10/2026)
      function bip(frequence, debut, duree) {
        try {
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = "sine";
          osc.frequency.value = frequence;
          gain.gain.setValueAtTime(0, debut);
          gain.gain.linearRampToValueAtTime(0.22, debut + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.001, debut + duree);
          osc.connect(gain).connect(audio.destination);
          osc.start(debut);
          osc.stop(debut + duree + 0.01);
          bips.push(osc);
        } catch (e) { /* pas de son : la séance continue */ }
      }
      function bipDecompte() {
        if (!audio || seance.reglages.son !== "bip") return;
        bip(BIP_DECOMPTE, audio.currentTime + 0.01, 0.09);
      }
      function couperBips() {
        bips.forEach(osc => { try { osc.stop(0); osc.disconnect(); } catch (e) {} });
        bips = [];
      }

      // L'écran ne se met pas en veille pendant une séance (si le navigateur
      // le permet ; sinon, rien).
      let veille = null;
      async function garderEcranAllume() {
        if (veille || !("wakeLock" in navigator)) return;
        try {
          veille = await navigator.wakeLock.request("screen");
          veille.addEventListener("release", () => { veille = null; });
        } catch (e) { veille = null; }
      }
      function rendreVeille() {
        if (veille) { veille.release().catch(() => {}); veille = null; }
      }

      // -----------------------------------------------------------------
      // La séance
      // -----------------------------------------------------------------
      const seance = {
        mode: "flash",
        reglages: null,
        calculs: [],
        resultats: [],
        index: 0,
        phase: "aucune", // decompte, flash, reponse, correction, fin
        reponse: "",
        jeton: 0,
        attente: null,
        image: null,
        chrono: null,
        revus: 0, // fois où « ↻ Revoir » a rejoué le calcul en cours
        echeance: 0, // instant (performance.now) où le temps limite est fini ; 0 = sans limite
        tailleFlash: 0
      };
      const rng = CORE.mulberry32((Math.random() * 4294967296) >>> 0);

      function montrerVue(nom) {
        $("vue-jeu").hidden = nom !== "jeu";
        $("vue-correction").hidden = nom !== "correction";
        $("vue-fin").hidden = nom !== "fin";
      }
      function annulerMinuteries() {
        seance.jeton += 1;
        if (seance.attente) { window.clearTimeout(seance.attente); seance.attente = null; }
        if (seance.image) { window.cancelAnimationFrame(seance.image); seance.image = null; }
        if (seance.chrono) { window.cancelAnimationFrame(seance.chrono); seance.chrono = null; }
        couperBips();
      }

      function demarrerSeance() {
        preparerSon();
        seance.mode = memoire.mode;
        seance.reglages = {...reglages()};
        seance.calculs = CORE.tirerSeance(seance.reglages, rng);
        seance.resultats = [];
        seance.index = 0;
        $("ecran-reglages").hidden = true;
        $("ecran-seance").hidden = false;
        corps.classList.add("en-seance");
        racine.style.setProperty("--echelle", "1");
        garderEcranAllume();
        window.scrollTo(0, 0);
        lancerCalcul();
      }

      function texteCompte() {
        return `Calcul ${seance.index + 1} / ${seance.reglages.calculs}`;
      }

      function lancerCalcul() {
        annulerMinuteries();
        montrerVue("jeu");
        $("compte").textContent = texteCompte();
        $("chrono").hidden = true;
        seance.echeance = 0;
        seance.reponse = "";
        dessinerReponse();
        // Relecture Codex (A1) : un décompte coupé par la flèche ne doit pas
        // rester affiché au calcul suivant, même dans l'autre mode.
        $("decompte").hidden = true;
        $("indic").hidden = true;
        $("nombre").textContent = "";
        $("zone-rep").hidden = true;
        $("revoir").hidden = true;
        $("rangee-valider").classList.remove("avec-revoir");
        seance.revus = 0;
        $("vue-jeu").classList.remove("avec-reponse");
        $("question").hidden = true;
        $("colonne").hidden = true;
        $("nombre").hidden = true;
        $("scene").classList.remove("defile");
        if (seance.mode === "flash") decompter(3);
        else montrerColonne();
      }

      // ---- Le Flash ----
      const DECOMPTE_MS = 800; // comme Défi tables
      function decompter(n) {
        seance.phase = "decompte";
        const jeton = seance.jeton;
        $("decompte").hidden = false;
        $("decompte").textContent = n;
        bipDecompte();
        $("indic").hidden = false;
        $("indic").textContent = `⚡ ${CORE.resume("flash", seance.reglages, {avecMode: false})}`;
        seance.attente = window.setTimeout(() => {
          if (jeton !== seance.jeton) return;
          if (n > 1) decompter(n - 1);
          else lancerFlash();
        }, DECOMPTE_MS);
      }

      // La taille du nombre est fixée d'après le plus long nombre possible et
      // la taille du cadre, puis elle ne bouge plus pendant tout le calcul.
      function fixerTailleFlash() {
        const scene = $("scene");
        const nombre = $("nombre");
        const r = seance.reglages;
        const essai = document.createElement("div");
        essai.className = "nombre";
        essai.style.cssText = "position:absolute;visibility:hidden;font-size:100px";
        essai.innerHTML = (r.operations === "plusmoins" ? '<span class="moins">−</span>' : "") + "8".repeat(r.chiffresMax);
        scene.appendChild(essai);
        const largeur100 = essai.getBoundingClientRect().width;
        scene.removeChild(essai);
        const largeurDispo = scene.clientWidth * 0.9;
        const hauteurDispo = scene.clientHeight * 0.66;
        const taille = Math.max(24, Math.floor(Math.min(largeurDispo / largeur100 * 100, hauteurDispo, 380)));
        seance.tailleFlash = taille;
        nombre.style.fontSize = `${taille}px`;
        nombre.style.width = `${Math.ceil(largeur100 * taille / 100) + 2}px`;
        nombre.style.height = `${taille}px`;
      }

      function lancerFlash() {
        seance.phase = "flash";
        const jeton = seance.jeton;
        $("decompte").hidden = true;
        $("indic").hidden = true;
        const nombre = $("nombre");
        nombre.textContent = "";
        nombre.hidden = false;
        fixerTailleFlash();
        const termes = seance.calculs[seance.index].termes;
        const tempsMs = seance.reglages.temps * 100;
        const n = termes.length;
        const t0 = performance.now() + 40;
        programmerBips(t0, n, tempsMs);
        let dejaIndex = -2;
        let dejaVisible = null;
        const image = maintenant => {
          if (jeton !== seance.jeton) return;
          const e = CORE.etatAuTemps(maintenant - t0, n, tempsMs);
          if (e.fini) {
            nombre.textContent = "";
            seance.image = null;
            demanderReponse();
            return;
          }
          if (e.index !== dejaIndex || e.visible !== dejaVisible) {
            dejaIndex = e.index;
            dejaVisible = e.visible;
            if (e.visible) {
              const terme = termes[e.index];
              nombre.innerHTML = (terme.signe < 0 ? '<span class="moins">−</span>' : "") + terme.valeur;
            } else {
              nombre.textContent = "";
            }
          }
          seance.image = window.requestAnimationFrame(image);
        };
        seance.image = window.requestAnimationFrame(image);
      }

      function demanderReponse() {
        seance.phase = "reponse";
        $("nombre").hidden = true;
        $("question").hidden = false;
        $("revoir").hidden = false;
        $("rangee-valider").classList.add("avec-revoir");
        $("zone-rep").hidden = false;
        $("vue-jeu").classList.add("avec-reponse");
      }

      // ---- La colonne ----
      function montrerColonne() {
        seance.phase = "reponse";
        const calcul = seance.calculs[seance.index];
        const colonne = $("colonne");
        colonne.innerHTML = calcul.termes.map(t =>
          `<span class="nb">${t.signe < 0 ? '<span class="moins">−</span>' : ""}${t.valeur}</span>`).join("") + '<i class="trait"></i>';
        colonne.hidden = false;
        $("zone-rep").hidden = false;
        $("vue-jeu").classList.add("avec-reponse");
        tailleColonne();
        if (seance.reglages.limite) lancerChrono(seance.reglages.limite);
      }
      // Toute la colonne à l'écran si possible ; en dessous de 20 px, elle
      // garde 20 px et défile dans son cadre.
      function tailleColonne() {
        const scene = $("scene");
        const colonne = $("colonne");
        const r = seance.reglages;
        scene.classList.remove("defile");
        const lignes = r.nombres + 0.5;
        const parHauteur = (scene.clientHeight - 24) / (lignes * 1.08);
        const parLargeur = (scene.clientWidth * 0.8) / ((r.chiffresMax + 1) * 0.66);
        const maxi = window.innerWidth >= 900 ? 64 : 44;
        const taille = Math.floor(Math.min(parHauteur, parLargeur, maxi));
        colonne.style.fontSize = `${Math.max(20, taille)}px`;
        if (taille < 20 || scene.scrollHeight > scene.clientHeight + 1) scene.classList.add("defile");
      }

      function lancerChrono(secondes) {
        const chrono = $("chrono");
        chrono.hidden = false;
        const total = secondes * 1000;
        const debut = performance.now();
        seance.echeance = debut + total;
        const jeton = seance.jeton;
        const tic = maintenant => {
          if (jeton !== seance.jeton) return;
          const reste = Math.max(0, total - (maintenant - debut));
          chrono.style.setProperty("--reste", (reste / total).toFixed(4));
          $("chrono-s").textContent = Math.ceil(reste / 1000);
          if (reste <= 0) { seance.chrono = null; valider(true); return; }
          seance.chrono = window.requestAnimationFrame(tic);
        };
        seance.chrono = window.requestAnimationFrame(tic);
      }

      // ---- La réponse ----
      function dessinerReponse() {
        const c = $("case");
        c.textContent = seance.reponse;
        c.classList.toggle("vide", seance.reponse === "");
        $("valider").disabled = seance.reponse === "";
      }
      function touche(cle) {
        if (seance.phase !== "reponse") return;
        if (/^\d$/.test(cle)) {
          if (seance.reponse.length >= 8) return;
          seance.reponse = seance.reponse === "0" ? cle : seance.reponse + cle;
        } else if (cle === "backspace") {
          seance.reponse = seance.reponse.slice(0, -1);
        } else if (cle === "clear") {
          seance.reponse = "";
        }
        dessinerReponse();
      }
      $("keypad").addEventListener("click", e => {
        const b = e.target.closest("button[data-key]");
        if (b) touche(b.dataset.key);
      });
      $("valider").addEventListener("click", () => valider(false));

      // « ↻ Revoir » : les mêmes nombres, à la même vitesse, après un nouveau
      // décompte. Ce qui est déjà tapé reste. Le score ne change pas (on est à
      // l'entraînement) ; le nombre de fois est gardé pour plus tard.
      function revoir() {
        if (seance.phase !== "reponse" || seance.mode !== "flash") return;
        annulerMinuteries();
        seance.revus += 1;
        $("question").hidden = true;
        $("zone-rep").hidden = true;
        $("vue-jeu").classList.remove("avec-reponse");
        decompter(3);
      }
      $("revoir").addEventListener("click", revoir);

      function valider(tempsEcoule) {
        if (seance.phase !== "reponse") return;
        // Relecture Codex (A3) : l'échéance se juge à l'heure de la validation,
        // pas à l'ordre dans lequel le clic et l'image du chrono arrivent.
        if (seance.echeance && performance.now() >= seance.echeance) tempsEcoule = true;
        if (!tempsEcoule && seance.reponse === "") return;
        const calcul = seance.calculs[seance.index];
        const ecrit = seance.reponse;
        const juste = !tempsEcoule && Number(ecrit) === calcul.total;
        seance.resultats.push({calcul, ecrit, juste, tempsEcoule: Boolean(tempsEcoule), revus: seance.revus});
        if (seance.chrono) { window.cancelAnimationFrame(seance.chrono); seance.chrono = null; }
        if (tempsEcoule) {
          $("chrono").style.setProperty("--reste", "0");
          $("chrono-s").textContent = "0";
        }
        montrerCorrection(seance.resultats[seance.resultats.length - 1]);
      }

      // ---- La correction ----
      function suiteHtml(calcul) {
        return calcul.termes.map((t, i) =>
          (i === 0 ? "" : `<span class="op">${t.signe < 0 ? "−" : "+"}</span>`) + `<span>${t.valeur}</span>`).join("")
          + `<span class="op">=</span><span class="tot">${calcul.total}</span>`;
      }
      function montrerCorrection(res) {
        seance.phase = "correction";
        montrerVue("correction");
        const v = $("verdict");
        v.className = `verdict ${res.juste ? "ok" : "ko"}`;
        if (res.juste) {
          v.innerHTML = `<div class="titre"><span class="rond" aria-hidden="true">✓</span>Juste&nbsp;!</div><div class="val">${res.calcul.total}</div>`;
        } else if (res.tempsEcoule) {
          // Choix de Gwenaël (22/10/2026) : le temps fini se dit ; ce qui était
          // tapé n'est barré que s'il était faux. Ça compte faux.
          const fauxTape = res.ecrit && Number(res.ecrit) !== res.calcul.total;
          v.innerHTML = '<div class="titre">⏱ Temps écoulé</div>'
            + (fauxTape ? `<div class="ecrit">Tu as écrit <s>${res.ecrit}</s></div>` : "")
            + `<div class="bonne">La bonne réponse&nbsp;:</div><div class="val">${res.calcul.total}</div>`;
        } else {
          v.innerHTML = '<div class="titre"><span class="rond" aria-hidden="true">✗</span>Pas tout à fait</div>'
            + (res.ecrit ? `<div class="ecrit">Tu as écrit <s>${res.ecrit}</s></div>` : "")
            + `<div class="bonne">La bonne réponse&nbsp;:</div><div class="val">${res.calcul.total}</div>`;
        }
        $("suite").innerHTML = suiteHtml(res.calcul);
        replierCalcul(true);
        const reste = seance.reglages.calculs - seance.index - 1;
        $("suivant").textContent = reste > 0 ? "Calcul suivant →" : "Fin de la séance →";
        $("encore").textContent = reste > 1 ? `Encore ${reste} calculs` : reste === 1 ? "Encore 1 calcul" : "";
        $("encore").hidden = reste === 0;
      }
      function replierCalcul(replie) {
        $("suite").hidden = replie;
        $("voir-calcul").setAttribute("aria-expanded", String(!replie));
        $("voir-calcul-texte").textContent = replie ? "Voir le calcul" : "Le calcul";
        $("voir-calcul-fleche").textContent = replie ? "▾" : "▴";
      }
      $("voir-calcul").addEventListener("click", () => replierCalcul(!$("suite").hidden));
      function suivant() {
        if (seance.phase !== "correction") return;
        seance.index += 1;
        if (seance.index >= seance.reglages.calculs) finir(false);
        else lancerCalcul();
      }
      $("suivant").addEventListener("click", suivant);

      // ---- La fin ----
      // « arretee » : la flèche a arrêté la séance ; ce qui est fait est
      // gardé (au lot 2, il partira au professeur : « 6/7 arrêtée »).
      function finir(arretee) {
        annulerMinuteries();
        seance.phase = "fin";
        rendreVeille();
        montrerVue("fin");
        $("chrono").hidden = true;
        $("compte").textContent = arretee ? "Séance arrêtée" : "Séance terminée";
        const justes = seance.resultats.filter(r => r.juste).length;
        $("score").innerHTML = `${justes}<small>&nbsp;/ ${seance.resultats.length}</small>`;
        $("tag-fin").textContent = CORE.resume(seance.mode, seance.reglages);
        $("liste").innerHTML = seance.resultats.map((r, i) => {
          const marque = r.juste
            ? '<span class="m v" aria-label="juste">✓</span>'
            : '<span class="m x" aria-label="faux">✗</span>';
          // Lot 1c (relecture Codex de B2) : une bonne réponse tapée mais pas
          // validée à temps n'est pas barrée dans le bilan non plus.
          const barre = r.ecrit && Number(r.ecrit) !== r.calcul.total;
          const valeur = barre ? `<s>${r.ecrit}</s>${r.calcul.total}` : `${r.calcul.total}`;
          const voir = r.juste ? "" : `<button type="button" class="voir" aria-expanded="false" data-voir="${i}">Voir</button>`;
          return `<li class="item"><div class="ligne-item"><span class="n">${i + 1}</span>${marque}<span class="r">${valeur}</span>${voir}</div>`
            + (r.juste ? "" : `<div class="suite" hidden>${suiteHtml(r.calcul)}</div>`) + "</li>";
        }).join("");
      }
      $("liste").addEventListener("click", e => {
        const b = e.target.closest("[data-voir]");
        if (!b) return;
        const suite = b.closest(".item").querySelector(".suite");
        suite.hidden = !suite.hidden;
        b.setAttribute("aria-expanded", String(!suite.hidden));
        b.textContent = suite.hidden ? "Voir" : "Cacher";
      });
      function versReglages() {
        annulerMinuteries();
        rendreVeille();
        seance.phase = "aucune";
        corps.classList.remove("en-seance");
        $("ecran-seance").hidden = true;
        $("ecran-reglages").hidden = false;
        dessinerReglages();
        $("titre").focus({preventScroll: true});
      }
      $("vers-reglages").addEventListener("click", versReglages);
      $("rejouer").addEventListener("click", demarrerSeance);
      $("partir").addEventListener("click", demarrerSeance);

      // La flèche : arrête la séance. Rien de fait → retour aux réglages ;
      // sinon l'écran de fin, avec ce qui est fait. Depuis la fin → réglages.
      $("retour").addEventListener("click", () => {
        if (seance.phase === "fin") { versReglages(); return; }
        if (seance.resultats.length === 0) { versReglages(); return; }
        // Relecture Codex (B1) : « arrêtée » = moins de calculs faits que
        // prévu (c'est ce qui servira au professeur au lot 2).
        finir(seance.resultats.length < seance.reglages.calculs);
      });

      // ---- Le clavier de l'ordinateur ----
      // Le bouton qui a le focus y est-il arrivé au clavier (Tab) ? Pas avec
      // :focus-visible : Chrome le rallume dès qu'une touche est pressée.
      let focusParPointeur = null;
      document.addEventListener("pointerdown", e => {
        focusParPointeur = e.target && e.target.closest ? e.target.closest("button, a") : null;
      }, true);
      document.addEventListener("keydown", e => { if (e.key === "Tab") focusParPointeur = null; }, true);
      function focusAuClavier(el) {
        return el.closest("button, a") !== focusParPointeur;
      }
      document.addEventListener("keydown", e => {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        // Relecture Codex (A2, puis lot 1c) : tout bouton ou lien atteint AU
        // CLAVIER (Tab : une touche du pavé, Voir le calcul, la flèche, le
        // plein écran) fait sa propre action sur Entrée. Après un toucher ou
        // un clic, Entrée garde son raccourci : valider, puis continuer.
        const cible = e.target && e.target.closest ? e.target : null;
        if (e.key === "Enter" && cible && cible.closest("button, a") && focusAuClavier(cible)) return;
        if (seance.phase === "reponse") {
          if (/^\d$/.test(e.key)) { e.preventDefault(); touche(e.key); }
          else if (e.key === "Backspace") { e.preventDefault(); touche("backspace"); }
          else if (e.key === "Delete") { e.preventDefault(); touche("clear"); }
          else if (e.key === "Enter") { e.preventDefault(); if (!e.repeat) valider(false); }
        } else if (seance.phase === "correction" && e.key === "Enter") {
          e.preventDefault();
          if (!e.repeat) suivant();
        }
      });

      // Un onglet caché arrête les images : un Flash interrompu reprend au
      // retour avec un nouveau calcul et un nouveau décompte.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (seance.phase === "decompte" || seance.phase === "flash") {
            annulerMinuteries();
            seance.phase = "interrompu";
          }
          return;
        }
        if (corps.classList.contains("en-seance") && seance.phase !== "fin") garderEcranAllume();
        if (seance.phase === "interrompu") {
          seance.calculs[seance.index] = CORE.tirerCalcul(seance.reglages, rng);
          lancerCalcul();
        }
      });

      // -----------------------------------------------------------------
      // Le plein écran (Défi tables)
      // -----------------------------------------------------------------
      (function setupFullscreen() {
        const boutons = [...document.querySelectorAll("[data-fullscreen-toggle]")];
        if (!boutons.length) return;
        const nativeFullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
        const sync = () => {
          const active = Boolean(nativeFullscreenElement()) || racine.classList.contains("fullscreen-fallback");
          corps.classList.toggle("fullscreen-active", active);
          boutons.forEach(button => {
            button.setAttribute("aria-pressed", String(active));
            button.setAttribute("aria-label", active ? "Quitter le plein écran" : "Passer en plein écran");
            button.title = active ? "Quitter le plein écran" : "Plein écran";
          });
          ajusterEchelle();
          surRedimension();
        };
        const leave = async () => {
          racine.classList.remove("fullscreen-fallback");
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (nativeFullscreenElement() && exit) { try { await exit.call(document); } catch (_) {} }
          sync();
        };
        const enter = async () => {
          const request = racine.requestFullscreen || racine.webkitRequestFullscreen;
          if (request) {
            try { await request.call(racine); sync(); return; } catch (_) { /* repli CSS */ }
          }
          racine.classList.add("fullscreen-fallback");
          window.scrollTo({top: 0, behavior: "auto"});
          sync();
        };
        boutons.forEach(button => button.addEventListener("click", () => {
          const active = Boolean(nativeFullscreenElement()) || racine.classList.contains("fullscreen-fallback");
          if (active) leave(); else enter();
        }));
        document.addEventListener("fullscreenchange", sync);
        document.addEventListener("webkitfullscreenchange", sync);
        document.addEventListener("keydown", event => {
          if (event.key !== "Escape" || !racine.classList.contains("fullscreen-fallback")) return;
          event.preventDefault();
          leave();
        });
      })();

      // -----------------------------------------------------------------
      // Sur ordinateur, l'écran des réglages tient entier dans la fenêtre :
      // réduit jusqu'à × 0,75 s'il le faut, jamais agrandi (comme Défi
      // tables). En séance, le cadre prend la hauteur de l'écran : ×1.
      // -----------------------------------------------------------------
      function ajusterEchelle() {
        if (window.innerWidth < 1024 || corps.classList.contains("en-seance")) {
          racine.style.setProperty("--echelle", "1");
          return;
        }
        corps.classList.add("mesure-cadre");
        const tient = z => {
          racine.style.setProperty("--echelle", z.toFixed(3));
          return corps.offsetHeight <= window.innerHeight;
        };
        let z = 1;
        if (!tient(1)) {
          let bas = 0.75, haut = 1;
          if (!tient(bas)) z = bas;
          else {
            while (haut - bas > 0.005) {
              const milieu = (bas + haut) / 2;
              if (tient(milieu)) bas = milieu; else haut = milieu;
            }
            z = Math.floor(bas * 200) / 200;
          }
        }
        corps.classList.remove("mesure-cadre");
        racine.style.setProperty("--echelle", z.toFixed(3));
      }
      // Un changement de taille en pleine séance (plein écran, rotation) :
      // la taille du Flash est refaite au calcul suivant, jamais pendant
      // qu'un nombre s'affiche ; la colonne est recalculée tout de suite.
      function surRedimension() {
        if (seance.phase === "reponse" && seance.mode === "colonne") tailleColonne();
      }
      window.addEventListener("resize", () => { ajusterEchelle(); surRedimension(); });

      dessinerReglages();
    })();
  </script>
</body>
</html>
