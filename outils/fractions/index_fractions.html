<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maths&amp;go — Fractions</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #6b7280;
      --paper: rgba(255, 252, 246, 0.84);
      --line: rgba(74, 59, 37, 0.12);
      --blue: #2563eb;
      --green: #0f9f8f;
      --orange: #d97706;
      --purple: #7c3aed;
      --rose: #db2777;
      --shadow: 0 18px 44px rgba(60, 42, 20, 0.11);
      --shadow-strong: 0 28px 62px rgba(60, 42, 20, 0.18);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f7efe2;
      overflow-x: hidden;
    }

    /* Fond Fractions conservé */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 211, 134, 0.52), transparent 31%),
        radial-gradient(circle at 78% 20%, rgba(172, 219, 255, 0.42), transparent 34%),
        radial-gradient(circle at 50% 86%, rgba(199, 179, 255, 0.36), transparent 40%),
        linear-gradient(135deg, #fff7e8 0%, #f6efe2 36%, #eef7fb 70%, #f5efff 100%);
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: -10%;
      opacity: 0.95;
      background:
        radial-gradient(circle at 24% 64%, rgba(255, 255, 255, 0.42), transparent 24%),
        radial-gradient(circle at 72% 34%, rgba(255, 255, 255, 0.24), transparent 18%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), transparent 42%);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.38;
      background-image:
        linear-gradient(rgba(92, 73, 45, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 73, 45, 0.05) 1px, transparent 1px),
        radial-gradient(rgba(92, 73, 45, 0.08) 0.7px, transparent 0.7px);
      background-size: 88px 88px, 88px 88px, 18px 18px;
      mask-image: radial-gradient(circle at 50% 42%, #000 0 46%, transparent 78%);
    }

    .shape,
    .fraction-disc,
    .fraction-rect {
      position: absolute;
      animation: float 15s ease-in-out infinite alternate;
      will-change: transform;
    }

    .shape-1 {
      width: 460px;
      height: 150px;
      top: 54px;
      left: -145px;
      opacity: 0.72;
      border-radius: 999px;
      filter: blur(42px);
      transform: rotate(-7deg);
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.15), rgba(20, 184, 166, 0.06), transparent);
    }

    .shape-2 {
      width: 340px;
      height: 340px;
      top: 18%;
      right: -95px;
      opacity: 0.55;
      border-radius: 50%;
      filter: blur(28px);
      animation-delay: -4s;
      background: conic-gradient(from -18deg,
        rgba(245, 158, 11, 0.22) 0 24%,
        rgba(255, 255, 255, 0.15) 24% 30%,
        rgba(20, 184, 166, 0.18) 30% 55%,
        rgba(255, 255, 255, 0.12) 55% 63%,
        rgba(124, 58, 237, 0.15) 63% 100%);
    }

    .shape-3 {
      width: 470px;
      height: 122px;
      bottom: 46px;
      left: 27%;
      opacity: 0.58;
      border-radius: 999px;
      filter: blur(44px);
      transform: rotate(5deg);
      animation-delay: -8s;
      background: linear-gradient(90deg, rgba(236, 72, 153, 0.12), rgba(245, 158, 11, 0.08), transparent);
    }

    .fraction-rect {
      width: 188px;
      height: 42px;
      top: 32%;
      left: 6%;
      opacity: 0.68;
      border: 1px solid rgba(86, 69, 42, 0.1);
      box-shadow: 0 14px 34px rgba(80, 60, 28, 0.08);
      transform: rotate(-7deg);
      background: linear-gradient(90deg,
        rgba(37, 99, 235, 0.14) 0 24.4%, rgba(255, 255, 255, 0.9) 24.4% 25.6%,
        rgba(245, 158, 11, 0.15) 25.6% 49.4%, rgba(255, 255, 255, 0.9) 49.4% 50.6%,
        rgba(20, 184, 166, 0.14) 50.6% 74.4%, rgba(255, 255, 255, 0.9) 74.4% 75.6%,
        rgba(124, 58, 237, 0.12) 75.6% 100%);
    }

    .fraction-disc {
      width: 156px;
      height: 156px;
      opacity: 0.72;
      border: 1px solid rgba(86, 69, 42, 0.08);
      border-radius: 50%;
      box-shadow: inset 0 0 0 15px rgba(255, 255, 255, 0.18), 0 20px 55px rgba(80, 60, 28, 0.08);
    }

    .disc-1 {
      top: 10%;
      right: 18%;
      animation-delay: -7s;
      background: conic-gradient(from -90deg,
        rgba(245, 158, 11, 0.18) 0 25%, rgba(20, 184, 166, 0.17) 25% 50%,
        rgba(37, 99, 235, 0.16) 50% 75%, rgba(124, 58, 237, 0.15) 75% 100%);
    }

    .disc-2 {
      width: 118px;
      height: 118px;
      right: 22%;
      bottom: 5%;
      opacity: 0.5;
      animation-delay: -2s;
      background: repeating-conic-gradient(from -90deg,
        rgba(245, 158, 11, 0.15) 0 36deg,
        rgba(20, 184, 166, 0.14) 36deg 72deg,
        rgba(37, 99, 235, 0.14) 72deg 108deg,
        rgba(124, 58, 237, 0.13) 108deg 144deg);
    }

    .disc-3 {
      width: 84px;
      height: 84px;
      top: 43%;
      left: 7%;
      opacity: 0.42;
      animation-delay: -5s;
      background: conic-gradient(from -90deg,
        rgba(37, 99, 235, 0.13) 0 33.333%,
        rgba(20, 184, 166, 0.13) 33.333% 66.666%,
        rgba(245, 158, 11, 0.13) 66.666% 100%);
    }

    @keyframes float {
      0% { translate: 0 0; rotate: 0deg; scale: 1; }
      100% { translate: 0 18px; rotate: 2deg; scale: 1.018; }
    }

    .wrap {
      width: min(1080px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 38px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      height: 54px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .logo-link {
      display: block;
      width: 124px;
      opacity: 0.97;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .logo-link:hover { transform: translateY(-1px); opacity: 1; }

    .logo-link:focus-visible {
      outline: 3px solid rgba(245, 158, 11, 0.35);
      outline-offset: 5px;
      border-radius: 10px;
    }

    .logo-link img { display: block; width: 100%; height: auto; }

    main {
      display: grid;
      gap: 27px;
      margin-top: 18px;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--ink);
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.64);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 440px));
      justify-content: center;
      gap: 22px;
    }

    .card {
      --accent: var(--blue);
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
      backdrop-filter: blur(12px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--accent) 38%, white);
      box-shadow: var(--shadow-strong), inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .card:focus-visible {
      outline: 4px solid color-mix(in srgb, var(--accent) 30%, transparent);
      outline-offset: 5px;
    }

    .preview {
      aspect-ratio: 16 / 10;
      padding: 16px;
      overflow: hidden;
      position: relative;
      border-bottom: 1px solid rgba(74, 59, 37, 0.1);
      background:
        radial-gradient(260px 160px at 16% 12%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(250, 245, 236, 0.82));
    }

    .preview > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border: 1px solid rgba(74, 59, 37, 0.14);
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 14px 28px rgba(60, 42, 20, 0.11);
    }

    .preview > img.bandes-plateau { object-position: center 43%; }
    .preview > img.mur { object-position: center 44%; }

    .paper-stack {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .paper-stack img {
      width: 58%;
      height: 86%;
      position: absolute;
      top: 7%;
      object-fit: cover;
      object-position: center;
      border: 1px solid rgba(74, 59, 37, 0.18);
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 13px 26px rgba(60, 42, 20, 0.14);
    }

    .paper-stack img:first-child {
      left: 3%;
      transform: rotate(-3deg);
    }

    .paper-stack img:last-child {
      right: 3%;
      transform: rotate(3deg);
    }

    .label {
      min-height: 76px;
      padding: 16px 72px 18px 20px;
      display: grid;
      place-items: center;
      position: relative;
      text-align: center;
      font-size: clamp(1.08rem, 1.55vw, 1.38rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 900;
    }

    .arrow {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      background: var(--accent);
      border-radius: 13px;
      box-shadow: 0 11px 22px rgba(60, 42, 20, 0.16);
      font-size: 1.35rem;
      font-weight: 950;
    }

    @media (max-width: 900px) {
      .wrap { width: min(100% - 24px, 640px); padding: 18px 0 28px; }
      .topbar { height: 48px; }
      .logo-link { width: 112px; }
      main { margin-top: 14px; gap: 22px; }
      .grid { grid-template-columns: 1fr; }
      .fraction-disc, .fraction-rect { opacity: 0.4; }
    }

    @media (max-width: 560px) {
      .preview { padding: 11px; }
      .fraction-disc, .fraction-rect { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shape, .fraction-disc, .fraction-rect { animation-play-state: paused; }
      .logo-link, .card { transition: none; }
    }
  </style>
