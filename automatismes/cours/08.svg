<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Pythagore : additionner les aires</title><desc id="desc">Triangle rectangle côtés3,4,5. Carrés extérieurs d’aires9,16,25.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Pythagore : additionner les aires</text><g transform="translate(30,28) scale(0.85)"><polygon points="240,170 300,170 240,90" fill="white" stroke="#075a9c" stroke-width="2"/><polygon points="160,90 240,90 240,170 160,170" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><polygon points="240,170 300,170 300,230 240,230" fill="#fff0d6" stroke="#a85b00" stroke-width="2"/><polygon points="240,90 300,170 380,110 320,30" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="199" y="135" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="normal">16</text><text x="270" y="207" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#a85b00" text-anchor="middle" font-weight="normal">9</text><text x="310" y="103" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="normal">25</text><text x="265" y="158" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><text x="250" y="133" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172b3a" text-anchor="middle" font-weight="normal">4</text><text x="288" y="123" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172b3a" text-anchor="middle" font-weight="normal">5</text><line x1="240" y1="159" x2="251" y2="159" stroke="#172b3a" stroke-width="2"/><line x1="251" y1="159" x2="251" y2="170" stroke="#172b3a" stroke-width="2"/></g><text x="110" y="248" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">3² + 4² = 5²</text></svg>