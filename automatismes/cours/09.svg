<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Trois angles, un angle plat</title><desc id="desc">Barre180°composée de portions50°,60°,70°.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Trois angles, un angle plat</text><text x="300" y="75" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">Les trois angles du triangle font 180°.</text><rect x="75" y="105" width="125.0" height="65" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="137.5" y="145" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">50°</text><rect x="200.0" y="105" width="150.0" height="65" fill="#fff0d6" stroke="#075a9c" stroke-width="2"/><text x="275.0" y="145" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">60°</text><rect x="350.0" y="105" width="175.0" height="65" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="437.5" y="145" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">70°</text><text x="300" y="220" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b3a" text-anchor="middle" font-weight="normal">50° + 60° + 70° = 180°</text></svg>