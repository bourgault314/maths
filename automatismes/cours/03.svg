<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Additionner : choisir les mêmes parts</title><desc id="desc">Trois bandes de même longueur unité sont partagées en6.3parts et2parts donnent5parts.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Additionner : choisir les mêmes parts</text><rect x="70" y="65" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="120" y="65" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="170" y="65" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="220" y="65" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><rect x="270" y="65" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><rect x="320" y="65" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><text x="470" y="90" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172b3a" text-anchor="middle" font-weight="normal">1/2 = 3/6</text><rect x="70" y="120" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="120" y="120" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="170" y="120" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><rect x="220" y="120" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><rect x="270" y="120" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><rect x="320" y="120" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><text x="470" y="145" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172b3a" text-anchor="middle" font-weight="normal">1/3 = 2/6</text><rect x="70" y="175" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="120" y="175" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="170" y="175" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="220" y="175" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="270" y="175" width="50" height="35" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="320" y="175" width="50" height="35" fill="white" stroke="#075a9c" stroke-width="2"/><text x="470" y="200" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172b3a" text-anchor="middle" font-weight="normal">5/6</text><text x="300" y="255" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="normal">1/2 + 1/3 = 3/6 + 2/6 = 5/6</text></svg>