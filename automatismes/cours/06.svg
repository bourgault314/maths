<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Deux parts inconnues égales</title><desc id="desc">Deux parts xet une part3composent11. Retirer3laisse8pour les deux parts.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Deux parts inconnues égales</text><text x="300" y="65" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#172b3a" text-anchor="middle" font-weight="normal">2x + 3 = 11</text><rect x="80" y="90" width="160" height="45" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="160" y="120" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">x</text><rect x="240" y="90" width="160" height="45" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="320" y="120" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">x</text><rect x="400" y="90" width="120" height="45" fill="#fff0d6" stroke="#a85b00" stroke-width="2"/><text x="460" y="120" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><rect x="80" y="155" width="440" height="40" fill="white" stroke="#075a9c" stroke-width="2"/><text x="300" y="183" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">11</text><text x="300" y="230" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="normal">11 − 3 = 8 ; 8 ÷ 2 = 4</text><text x="300" y="263" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#075a9c" text-anchor="middle" font-weight="normal">x = 4</text></svg>