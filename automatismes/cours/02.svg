<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Deux grandeurs, la même proportion</title><desc id="desc">Deux droites alignées :0à5kg et0à20euros.3kg correspond à12euros,5kg à20euros.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Deux grandeurs, la même proportion</text><line x1="75" y1="95" x2="525" y2="95" stroke="#172b3a" stroke-width="2"/><text x="550" y="101" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">kg</text><line x1="75" y1="88" x2="75" y2="102" stroke="#172b3a" stroke-width="2"/><text x="75" y="127" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">0</text><line x1="165" y1="88" x2="165" y2="102" stroke="#172b3a" stroke-width="2"/><text x="165" y="127" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">1</text><line x1="255" y1="88" x2="255" y2="102" stroke="#172b3a" stroke-width="2"/><text x="255" y="127" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">2</text><line x1="345" y1="88" x2="345" y2="102" stroke="#172b3a" stroke-width="2"/><text x="345" y="127" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#075a9c" text-anchor="middle" font-weight="normal">3</text><line x1="435" y1="88" x2="435" y2="102" stroke="#172b3a" stroke-width="2"/><text x="435" y="127" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">4</text><line x1="525" y1="88" x2="525" y2="102" stroke="#172b3a" stroke-width="2"/><text x="525" y="127" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#075a9c" text-anchor="middle" font-weight="normal">5</text><line x1="75" y1="175" x2="525" y2="175" stroke="#172b3a" stroke-width="2"/><text x="550" y="181" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">€</text><line x1="75" y1="168" x2="75" y2="182" stroke="#172b3a" stroke-width="2"/><text x="75" y="207" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">0</text><line x1="165" y1="168" x2="165" y2="182" stroke="#172b3a" stroke-width="2"/><text x="165" y="207" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">4</text><line x1="255" y1="168" x2="255" y2="182" stroke="#172b3a" stroke-width="2"/><text x="255" y="207" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">8</text><line x1="345" y1="168" x2="345" y2="182" stroke="#172b3a" stroke-width="2"/><text x="345" y="207" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#075a9c" text-anchor="middle" font-weight="normal">12</text><line x1="435" y1="168" x2="435" y2="182" stroke="#172b3a" stroke-width="2"/><text x="435" y="207" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">16</text><line x1="525" y1="168" x2="525" y2="182" stroke="#172b3a" stroke-width="2"/><text x="525" y="207" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#075a9c" text-anchor="middle" font-weight="normal">20</text><line x1="345" y1="133" x2="345" y2="165" stroke="#a85b00" stroke-width="2" stroke-dasharray="4 4"/><line x1="525" y1="133" x2="525" y2="165" stroke="#a85b00" stroke-width="2" stroke-dasharray="4 4"/><text x="300" y="253" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">3 kg → 12 €     1 kg → 4 €     5 kg → 20 €</text></svg>