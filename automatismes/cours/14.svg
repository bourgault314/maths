<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">La médiane : la position centrale</title><desc id="desc">Cinq valeurs ordonnées1,3,4,7,9. La troisième4est encadrée par deux valeurs de chaque côté.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">La médiane : la position centrale</text><circle cx="100" cy="125" r="30" fill="white" stroke="#075a9c" stroke-width="2"/><text x="100" y="133" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172b3a" text-anchor="middle" font-weight="normal">1</text><text x="100" y="190" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">1ᵉ</text><circle cx="200" cy="125" r="30" fill="white" stroke="#075a9c" stroke-width="2"/><text x="200" y="133" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><text x="200" y="190" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">2ᵉ</text><circle cx="300" cy="125" r="30" fill="#fff0d6" stroke="#a85b00" stroke-width="2"/><text x="300" y="133" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172b3a" text-anchor="middle" font-weight="normal">4</text><text x="300" y="190" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">3ᵉ</text><circle cx="400" cy="125" r="30" fill="white" stroke="#075a9c" stroke-width="2"/><text x="400" y="133" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172b3a" text-anchor="middle" font-weight="normal">7</text><text x="400" y="190" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">4ᵉ</text><circle cx="500" cy="125" r="30" fill="white" stroke="#075a9c" stroke-width="2"/><text x="500" y="133" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172b3a" text-anchor="middle" font-weight="normal">9</text><text x="500" y="190" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">5ᵉ</text><text x="300" y="243" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172b3a" text-anchor="middle" font-weight="normal">5 valeurs rangées → la 3ᵉ est la médiane : 4</text></svg>