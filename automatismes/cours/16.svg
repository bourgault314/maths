<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Une fonction : calcul et point</title><desc id="desc">Machine transforme3en7par×2puis+1. Dans un repère schématique, le point de coordonnées3,7correspond.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Une fonction : calcul et point</text><text x="80" y="100" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><line x1="105" y1="92" x2="150" y2="92" stroke="#172b3a" stroke-width="2"/><rect x="150" y="62" width="220" height="60" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="260" y="101" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="normal">× 2 puis + 1</text><line x1="370" y1="92" x2="420" y2="92" stroke="#172b3a" stroke-width="2"/><text x="450" y="100" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#075a9c" text-anchor="middle" font-weight="normal">7</text><line x1="350" y1="230" x2="535" y2="230" stroke="#172b3a" stroke-width="2"/><line x1="350" y1="230" x2="350" y2="135" stroke="#172b3a" stroke-width="2"/><text x="410" y="252" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><text x="335" y="166" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172b3a" text-anchor="middle" font-weight="normal">7</text><line x1="410" y1="230" x2="410" y2="160" stroke="#a85b00" stroke-width="2" stroke-dasharray="4 4"/><line x1="350" y1="160" x2="410" y2="160" stroke="#a85b00" stroke-width="2" stroke-dasharray="4 4"/><circle cx="410" cy="160" r="4" fill="#075a9c" stroke="#075a9c" stroke-width="2"/><text x="456" y="155" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172b3a" text-anchor="middle" font-weight="normal">(3 ; 7)</text><text x="180" y="180" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172b3a" text-anchor="middle" font-weight="normal">f(3) = 2 × 3 + 1 = 7</text><text x="540" y="240" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#172b3a" text-anchor="middle" font-weight="normal">x</text><text x="337" y="139" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#172b3a" text-anchor="middle" font-weight="normal">y</text></svg>