<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Distribuer sur les deux termes</title><desc id="desc">Rectangle de hauteur3, coupé en largeurs xet2 ; ses aires sont3xet6.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Distribuer sur les deux termes</text><rect x="110" y="95" width="250" height="95" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><rect x="360" y="95" width="100" height="95" fill="#fff0d6" stroke="#a85b00" stroke-width="2"/><text x="235" y="80" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">x &gt; 0</text><text x="410" y="80" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">2</text><text x="85" y="150" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">3</text><text x="235" y="151" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#172b3a" text-anchor="middle" font-weight="normal">3x</text><text x="410" y="151" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#a85b00" text-anchor="middle" font-weight="normal">6</text><text x="300" y="245" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172b3a" text-anchor="middle" font-weight="normal">3(x + 2) = 3x + 6</text></svg>