<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Déplier la surface d’un cylindre</title><desc id="desc">Patron avec deux disques rayon2et rectangle dont les côtés mesurent4πet3. Dessin schématique non à l’échelle.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Déplier la surface d’un cylindre</text><rect x="80" y="115" width="251.327" height="60" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><circle cx="205.664" cy="75" r="40" fill="white" stroke="#075a9c" stroke-width="2"/><circle cx="205.664" cy="215" r="40" fill="white" stroke="#075a9c" stroke-width="2"/><line x1="205.664" y1="75" x2="245.664" y2="75" stroke="#a85b00" stroke-width="2"/><text x="280" y="81" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172b3a" text-anchor="middle" font-weight="normal">r = 2</text><text x="382" y="150" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172b3a" text-anchor="middle" font-weight="normal">h = 3</text><text x="125" y="202" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="normal">4π</text><text x="455" y="250" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#172b3a" text-anchor="middle" font-weight="normal">2πr = 4π</text></svg>