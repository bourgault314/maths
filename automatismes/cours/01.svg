<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Un quart du tout</title><desc id="desc">Une barre représentant80est partagée en4parts égales. Une part vaut20et représente25%.</desc><rect width="600" height="280" fill="white"/><text x="300" y="29" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="bold">Un quart du tout</text><text x="300" y="65" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">80 = 100 %</text><rect x="80" y="95" width="110" height="65" fill="#fff0d6" stroke="#075a9c" stroke-width="2"/><text x="135" y="135" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">20</text><rect x="190" y="95" width="110" height="65" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="245" y="135" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">20</text><rect x="300" y="95" width="110" height="65" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="355" y="135" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">20</text><rect x="410" y="95" width="110" height="65" fill="#e3f1fa" stroke="#075a9c" stroke-width="2"/><text x="465" y="135" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#172b3a" text-anchor="middle" font-weight="normal">20</text><text x="135" y="187" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#a85b00" text-anchor="middle" font-weight="normal">25 %</text><text x="300" y="245" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#172b3a" text-anchor="middle" font-weight="normal">25 % de 80 = 80 ÷ 4 = 20</text></svg>