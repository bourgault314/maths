  <script>
    /* Adresse courte des QR codes du livret « SPLAT! classique » (monde 2) :
       /splat/classique/livret/?f=7  →  la série en ligne de la fiche 7, etc.
       Chaque cible est EXACTEMENT le lien « Le jeu de l'élève » de la carte des mondes
       (outils/splat_univers.html, MONDES[1]) : même étape (parcours=m2eN), mêmes cartes,
       donc la même empreinte de reprise. La fiche 7 enchaîne les trois activités de
       Claire (paramètre « suite ») : son adresse complète dépasse 500 caractères, trop
       pour un QR lisible de 17 mm — d'où cette page. Un test épingle ces trois cibles
       sur les constantes de la carte des mondes ; si une graine change là-bas, la
       changer ici aussi (et régénérer les QR : _sources/livret-splat-classique/render.py --qr). */
    var M2A1 = "mode=U&equation=X_PLUS_A_EQ_B&tasksMin=1&tasksMax=1&visibleMax=15&hiddenMax=10&totalMin=1&totalMax=25&cards=4&seed=974&unknown=question";
    var M2A2 = "mode=U&equation=AX_EQ_B&tasksMin=2&tasksMax=5&hiddenMax=10&totalMin=5&totalMax=25&cards=4&seed=477&unknown=question";
    var M2A3 = "mode=U&equation=AX_PLUS_C_EQ_B&tasksMin=2&tasksMax=5&visibleMax=15&hiddenMax=10&totalMin=5&totalMax=25&cards=4&seed=478&unknown=question";
    var FICHES = {
      "7": "/splat/classique/?" + M2A1 + "&eleve=1&parcours=m2e1&suite=" + encodeURIComponent(M2A2) + ";" + encodeURIComponent(M2A3),
      "8": "/splat/classique/?mode=N&equation=X_PLUS_A_EQ_B&cards=12&seed=347&unknown=question&eleve=1&parcours=m2e4",
      "9": "/splat/classique/?mode=N&equation=AX_PLUS_C_EQ_B&tasksMax=5&cards=12&seed=18&unknown=question&eleve=1&parcours=m2e5"
    };
    var f = new URLSearchParams(window.location.search).get("f");
    var cible = Object.prototype.hasOwnProperty.call(FICHES, f) ? FICHES[f] : "/outils/splat_univers.html";
    window.location.replace(new URL(cible, window.location.origin).toString());
  </script>
