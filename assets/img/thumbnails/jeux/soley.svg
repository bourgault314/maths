      <path d="M0-55v-16M0 55v16M-55 0h-16M55 0h16M-39-39l-12-12M39 39l12 12M39-39l12-12M-39 39l-12 12"/>
    </g>
    <circle r="40" fill="url(#sun)"/>
    <circle cx="-12" cy="-7" r="4" fill="#79420f"/>
    <circle cx="12" cy="-7" r="4" fill="#79420f"/>
    <path d="M-13 11Q0 24 13 11" fill="none" stroke="#79420f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#glow)">
