<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Solèy — jeu de fractions</title>
  <desc id="desc">Un rayon de soleil est partagé en deux et guidé vers deux cases créoles.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241b4d"/>
      <stop offset=".5" stop-color="#71335f"/>
      <stop offset="1" stop-color="#e0785a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".42" cy=".35">
      <stop offset="0" stop-color="#fff8d7"/>
      <stop offset=".58" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#ff9138"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="320" rx="28" fill="url(#sky)"/>
  <rect width="720" height="320" rx="28" fill="url(#grid)"/>
  <g opacity=".22" fill="#160f32">
    <path d="M0 274L86 198l70 55 72-93 98 114z"/>
    <path d="M392 320l95-132 63 81 74-124 96 122v53z"/>
  </g>

  <g transform="translate(104 160)" filter="url(#glow)">
