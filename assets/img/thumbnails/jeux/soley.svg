      <circle cx="43" cy="2" r="14" fill="#10182e" stroke="#ffc94d" stroke-width="3"/>
      <text x="43" y="7" font-size="14" fill="#fff3c4">A</text>
    </g>
    <g transform="translate(560 202)">
      <path d="M-54 28L0-10l54 38" fill="#df5548" stroke="#852e2a" stroke-width="4"/>
      <rect x="-46" y="27" width="92" height="64" rx="6" fill="#fff0d8" stroke="#8a6b4a" stroke-width="4"/>
      <rect x="-34" y="47" width="20" height="44" rx="3" fill="#7a5230"/>
      <rect x="20" y="40" width="16" height="15" rx="2" fill="#ffc94d"/>
      <text x="9" y="75" font-size="26" fill="#3b2a17">1/2</text>
