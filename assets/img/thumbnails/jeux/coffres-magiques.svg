<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Coffres magiques à deux</title>
  <desc id="description">Un défi sur les quatre opérations et un plateau de seize runes pour deux joueurs bleu et corail.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0fbf9"/>
      <stop offset=".58" stop-color="#f6faff"/>
      <stop offset="1" stop-color="#fff5e8"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a77b50"/>
      <stop offset="1" stop-color="#62412d"/>
    </linearGradient>
    <radialGradient id="rune" cx="35%" cy="25%" r="85%">
      <stop stop-color="#fff" offset="0"/>
      <stop stop-color="#def4f4" offset=".52"/>
      <stop stop-color="#a9d6d7" offset="1"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff6a8"/>
      <stop offset="1" stop-color="#f5b323"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#173a5e" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="720" height="320" fill="url(#background)"/>
  <circle cx="36" cy="300" r="126" fill="#dceeff" opacity=".7"/>
  <circle cx="698" cy="22" r="94" fill="#ffe7cf" opacity=".78"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="38" y="58" fill="#078a82" font-size="15" font-weight="850" letter-spacing="3">JEU À DEUX</text>
    <text x="36" y="108" fill="#143e62" font-size="40" font-weight="850">Coffres</text>
    <text x="36" y="151" fill="#143e62" font-size="40" font-weight="850">magiques</text>
    <text x="39" y="190" fill="#557083" font-size="17" font-weight="650">Deux runes voisines,</text>
    <text x="39" y="217" fill="#557083" font-size="16" font-weight="650">+  −  ×  ÷  : quatre opérations.</text>

    <g transform="translate(39 247)">
      <rect width="112" height="38" rx="19" fill="#dcebff"/>
      <circle cx="20" cy="19" r="9" fill="#0755b8"/>
      <text x="37" y="25" fill="#063f86" font-size="16" font-weight="850">3 clés</text>
      <rect x="122" width="112" height="38" rx="19" fill="#ffe1dc"/>
      <circle cx="142" cy="19" r="9" fill="#ef5b45"/>
      <text x="159" y="25" fill="#9f2f21" font-size="16" font-weight="850">2 clés</text>
    </g>
  </g>

  <g transform="translate(352 16)" filter="url(#shadow)">
    <rect width="332" height="288" rx="25" fill="#fff" stroke="#d2e1eb" stroke-width="2"/>

    <g transform="translate(24 17)">
      <rect width="284" height="54" rx="15" fill="url(#gold)" stroke="#dcad34" stroke-width="2"/>
      <g transform="translate(17 10)" fill="none" stroke="#76550c" stroke-width="3">
        <rect x="0" y="10" width="25" height="21" rx="4"/>
        <path d="M5 11V8a7.5 7.5 0 0 1 15 0v3"/>
        <circle cx="12.5" cy="20" r="2" fill="#76550c"/>
      </g>
      <text x="162" y="22" fill="#76550c" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="850" text-anchor="middle" letter-spacing="1.5">OUVRE LE COFFRE AVEC</text>
      <text x="162" y="44" fill="#3d4860" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="900" text-anchor="middle">un quotient de 4</text>
    </g>

    <g transform="translate(61 82)">
      <rect x="-11" y="-11" width="232" height="198" rx="20" fill="url(#wood)"/>
      <g font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle" dominant-baseline="central">
        <g fill="url(#rune)" stroke="#bfd4de" stroke-width="2">
          <rect x="0" y="0" width="48" height="38" rx="10"/><rect x="54" y="0" width="48" height="38" rx="10"/><rect x="108" y="0" width="48" height="38" rx="10"/><rect x="162" y="0" width="48" height="38" rx="10"/>
          <rect x="0" y="44" width="48" height="38" rx="10"/><rect x="54" y="44" width="48" height="38" rx="10"/><rect x="108" y="44" width="48" height="38" rx="10"/><rect x="162" y="44" width="48" height="38" rx="10"/>
          <rect x="0" y="88" width="48" height="38" rx="10"/><rect x="54" y="88" width="48" height="38" rx="10"/><rect x="108" y="88" width="48" height="38" rx="10"/><rect x="162" y="88" width="48" height="38" rx="10"/>
          <rect x="0" y="132" width="48" height="38" rx="10"/><rect x="54" y="132" width="48" height="38" rx="10"/><rect x="108" y="132" width="48" height="38" rx="10"/><rect x="162" y="132" width="48" height="38" rx="10"/>
        </g>
        <rect x="54" y="44" width="48" height="38" rx="10" fill="#ffdd72" stroke="#f0a800" stroke-width="3"/>
        <rect x="108" y="44" width="48" height="38" rx="10" fill="#bff0d8" stroke="#087a55" stroke-width="3"/>
        <g fill="#17405e">
          <text x="24" y="19">8</text><text x="78" y="19">3</text><text x="132" y="19">9</text><text x="186" y="19">4</text>
          <text x="24" y="63">2</text><text x="78" y="63">8</text><text x="132" y="63">2</text><text x="186" y="63">6</text>
          <text x="24" y="107">4</text><text x="78" y="107">8</text><text x="132" y="107">3</text><text x="186" y="107">9</text>
          <text x="24" y="151">6</text><text x="78" y="151">2</text><text x="132" y="151">5</text><text x="186" y="151">7</text>
        </g>
      </g>
    </g>
  </g>
</svg>
