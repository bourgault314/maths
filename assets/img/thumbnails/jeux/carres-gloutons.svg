<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Les Carrés gloutons</title>
  <desc id="description">Un plateau de points et carrés avec des segments bleus et orange, des étoiles et des visages gloutons.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9eb"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="blue-box" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c7e4ff"/>
    </linearGradient>
    <linearGradient id="orange-box" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff2dc"/>
      <stop offset="1" stop-color="#ffd5a4"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173a5e" flood-opacity=".16"/>
    </filter>
    <filter id="line-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#173a5e" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="720" height="320" fill="url(#background)"/>
  <circle cx="62" cy="268" r="108" fill="#dff1ff" opacity=".72"/>
  <circle cx="675" cy="41" r="92" fill="#ffedc8" opacity=".72"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="42" y="76" fill="#b45309" font-size="15" font-weight="850" letter-spacing="3">JEU DE STRATÉGIE</text>
    <text x="40" y="126" fill="#10294a" font-size="39" font-weight="850">Les Carrés</text>
    <text x="40" y="168" fill="#10294a" font-size="39" font-weight="850">gloutons</text>
    <text x="42" y="207" fill="#5b6879" font-size="17" font-weight="650">Ferme un carré, marque un point</text>
    <text x="42" y="234" fill="#5b6879" font-size="17" font-weight="650">et rejoue aussitôt.</text>
    <g transform="translate(42 258)">
      <circle cx="10" cy="10" r="10" fill="#0f6cf9"/>
      <text x="29" y="16" fill="#0755b8" font-size="17" font-weight="800">Toi</text>
      <circle cx="90" cy="10" r="10" fill="#f97316"/>
      <text x="109" y="16" fill="#a34907" font-size="17" font-weight="800">Gloubi</text>
    </g>
  </g>

  <g transform="translate(388 18)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="292" height="284" rx="26" fill="#fff" stroke="#d3e0eb" stroke-width="2"/>

    <g transform="translate(26 22)">
      <rect x="9" y="9" width="62" height="62" rx="11" fill="url(#blue-box)" stroke="#0755b8" stroke-width="2.5"/>
      <rect x="89" y="9" width="62" height="62" rx="11" fill="url(#orange-box)" stroke="#d95f02" stroke-width="2.5"/>
      <rect x="169" y="89" width="62" height="62" rx="11" fill="url(#orange-box)" stroke="#d95f02" stroke-width="2.5"/>
      <rect x="89" y="169" width="62" height="62" rx="11" fill="url(#blue-box)" stroke="#0755b8" stroke-width="2.5"/>

      <g fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round">
        <path d="M0 0H240M0 80H240M0 160H240M0 240H240"/>
        <path d="M0 0V240M80 0V240M160 0V240M240 0V240"/>
      </g>

      <g fill="none" stroke-linecap="round" filter="url(#line-shadow)">
        <g stroke="#0f6cf9" stroke-width="10">
          <path d="M0 0H80M0 0V80M0 80H80M80 0V80"/>
          <path d="M80 160V240M80 240H160M160 160V240M80 160H160"/>
          <path d="M160 80H240"/>
        </g>
        <g stroke="#f97316" stroke-width="10">
          <path d="M80 0H160M80 0V80M80 80H160M160 0V80"/>
          <path d="M160 80H240M160 80V160M160 160H240M240 80V160"/>
          <path d="M0 160H80M240 160V240"/>
        </g>
      </g>

      <g fill="#173a5e" stroke="#fff" stroke-width="3">
        <circle cx="0" cy="0" r="8"/><circle cx="80" cy="0" r="8"/><circle cx="160" cy="0" r="8"/><circle cx="240" cy="0" r="8"/>
        <circle cx="0" cy="80" r="8"/><circle cx="80" cy="80" r="8"/><circle cx="160" cy="80" r="8"/><circle cx="240" cy="80" r="8"/>
        <circle cx="0" cy="160" r="8"/><circle cx="80" cy="160" r="8"/><circle cx="160" cy="160" r="8"/><circle cx="240" cy="160" r="8"/>
        <circle cx="0" cy="240" r="8"/><circle cx="80" cy="240" r="8"/><circle cx="160" cy="240" r="8"/><circle cx="240" cy="240" r="8"/>
      </g>

      <g aria-hidden="true">
        <g transform="translate(40 40)">
          <circle r="24" fill="#fff" stroke="#0755b8" stroke-width="2.5"/>
          <polygon points="0,-19 4.5,-6.2 18.1,-5.9 7.3,2.4 11.2,15.4 0,7.8 -11.2,15.4 -7.3,2.4 -18.1,-5.9 -4.5,-6.2" fill="#0755b8"/>
        </g>
        <g transform="translate(120 200)">
          <circle r="24" fill="#fff" stroke="#0755b8" stroke-width="2.5"/>
          <polygon points="0,-19 4.5,-6.2 18.1,-5.9 7.3,2.4 11.2,15.4 0,7.8 -11.2,15.4 -7.3,2.4 -18.1,-5.9 -4.5,-6.2" fill="#0755b8"/>
        </g>
        <g transform="translate(120 40)">
          <circle r="24" fill="#fff8eb" stroke="#d95f02" stroke-width="2.5"/>
          <circle cx="-8" cy="-6" r="2.7" fill="#9a3f00"/>
          <circle cx="8" cy="-6" r="2.7" fill="#9a3f00"/>
          <path d="M1 8q9 1 6 13l-9-3z" fill="#ef6a69" stroke="#9a3f00" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M-12 4Q0 16 12 4" fill="none" stroke="#9a3f00" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g transform="translate(200 120)">
          <circle r="24" fill="#fff8eb" stroke="#d95f02" stroke-width="2.5"/>
          <circle cx="-8" cy="-6" r="2.7" fill="#9a3f00"/>
          <circle cx="8" cy="-6" r="2.7" fill="#9a3f00"/>
          <path d="M1 8q9 1 6 13l-9-3z" fill="#ef6a69" stroke="#9a3f00" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M-12 4Q0 16 12 4" fill="none" stroke="#9a3f00" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
