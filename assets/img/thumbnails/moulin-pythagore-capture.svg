<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Puzzle de Périgal recomposé dans le carré de l’hypoténuse">
  <rect width="720" height="320" fill="#fff"/>

  <!-- Un seul moulin : les cinq pièces sont toutes réunies dans c². -->
  <g transform="translate(28 18) scale(.78)" stroke="#172033" stroke-width="3" stroke-linejoin="round">
    <!-- Triangle rectangle et carrés a², b² laissés vides. -->
    <path d="M112 118V28H250V118Z" fill="#fff"/>
    <path d="M22 118H112V208H22Z" fill="#fff"/>
    <path d="M112 118h18v18h-18" fill="none" stroke="#0f766e" stroke-width="2.6"/>
    <path d="M112 118H250L112 208Z" fill="#fff"/>

    <!-- Carré de l’hypoténuse : solution de Périgal à cinq pièces. -->
    <path d="M250 118 339 254 203 343 112 208Z" fill="#fff"/>
    <path d="M250 118 169 160 169 252 286 252Z" fill="#d90072"/>
    <path d="M112 208 169 160 169 252 184 313 203 343Z" fill="#969696"/>
    <path d="M169 252H239V313H184Z" fill="#13ad13"/>
    <path d="M239 252H286L339 254 239 313Z" fill="#ffd071"/>
    <path d="M184 313H239L203 343Z" fill="#169de8"/>
    <path d="M169 160V252M169 252H286M184 313H239M239 252V313" fill="none"/>
    <path d="M250 118 339 254 203 343 112 208Z" fill="none"/>

    <g fill="#475569" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="850" text-anchor="middle">
      <text x="181" y="81">b²</text>
      <text x="67" y="171">a²</text>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="548" y="110" fill="#063f86" font-size="25" font-weight="800">Moulin de Pythagore</text>
    <text x="548" y="188" fill="#111827" font-size="48" font-weight="850">a² + b² = c²</text>
    <text x="548" y="234" fill="#64748b" font-size="20" font-weight="700">Périgal · 5 pièces</text>
  </g>
</svg>
