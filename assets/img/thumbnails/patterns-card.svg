<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">La ruche hexagonale</title>
  <desc id="desc">Un grand pattern hexagonal aux couleurs bleu, turquoise, orange et violet.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="48%" r="66%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#11386e" flood-opacity=".12"/>
    </filter>
    <polygon id="hex" points="0,-66 57.16,-33 57.16,33 0,66 -57.16,33 -57.16,-33"/>
  </defs>

  <rect width="1200" height="750" fill="url(#background)"/>

  <g transform="translate(600 375)" filter="url(#shadow)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">
    <!-- Rangée 1 -->
    <g fill="#11386e">
      <use href="#hex" transform="translate(-171.48 -297)"/>
      <use href="#hex" transform="translate(-57.16 -297)"/>
      <use href="#hex" transform="translate(57.16 -297)"/>
      <use href="#hex" transform="translate(171.48 -297)"/>
    </g>

    <!-- Rangée 2 -->
    <use href="#hex" transform="translate(-228.64 -198)" fill="#11386e"/>
    <use href="#hex" transform="translate(-114.32 -198)" fill="#069a9a"/>
    <use href="#hex" transform="translate(0 -198)" fill="#069a9a"/>
    <use href="#hex" transform="translate(114.32 -198)" fill="#069a9a"/>
    <use href="#hex" transform="translate(228.64 -198)" fill="#11386e"/>

    <!-- Rangée 3 -->
    <use href="#hex" transform="translate(-285.8 -99)" fill="#11386e"/>
    <use href="#hex" transform="translate(-171.48 -99)" fill="#069a9a"/>
    <use href="#hex" transform="translate(-57.16 -99)" fill="#f5a623"/>
    <use href="#hex" transform="translate(57.16 -99)" fill="#f5a623"/>
    <use href="#hex" transform="translate(171.48 -99)" fill="#069a9a"/>
    <use href="#hex" transform="translate(285.8 -99)" fill="#11386e"/>

    <!-- Rangée centrale -->
    <use href="#hex" transform="translate(-342.96 0)" fill="#11386e"/>
    <use href="#hex" transform="translate(-228.64 0)" fill="#069a9a"/>
    <use href="#hex" transform="translate(-114.32 0)" fill="#f5a623"/>
    <use href="#hex" fill="#6b45a5"/>
    <use href="#hex" transform="translate(114.32 0)" fill="#f5a623"/>
    <use href="#hex" transform="translate(228.64 0)" fill="#069a9a"/>
    <use href="#hex" transform="translate(342.96 0)" fill="#11386e"/>

    <!-- Rangée 5 -->
    <use href="#hex" transform="translate(-285.8 99)" fill="#11386e"/>
    <use href="#hex" transform="translate(-171.48 99)" fill="#069a9a"/>
    <use href="#hex" transform="translate(-57.16 99)" fill="#f5a623"/>
    <use href="#hex" transform="translate(57.16 99)" fill="#f5a623"/>
    <use href="#hex" transform="translate(171.48 99)" fill="#069a9a"/>
    <use href="#hex" transform="translate(285.8 99)" fill="#11386e"/>

    <!-- Rangée 6 -->
    <use href="#hex" transform="translate(-228.64 198)" fill="#11386e"/>
    <use href="#hex" transform="translate(-114.32 198)" fill="#069a9a"/>
    <use href="#hex" transform="translate(0 198)" fill="#069a9a"/>
    <use href="#hex" transform="translate(114.32 198)" fill="#069a9a"/>
    <use href="#hex" transform="translate(228.64 198)" fill="#11386e"/>

    <!-- Rangée 7 -->
    <g fill="#11386e">
      <use href="#hex" transform="translate(-171.48 297)"/>
      <use href="#hex" transform="translate(-57.16 297)"/>
      <use href="#hex" transform="translate(57.16 297)"/>
      <use href="#hex" transform="translate(171.48 297)"/>
    </g>
  </g>
</svg>
