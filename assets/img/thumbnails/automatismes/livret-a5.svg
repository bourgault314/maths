<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <defs><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".18"/></filter></defs>
  <rect width="720" height="320" fill="#f4f5f7"/>
  <text x="32" y="43" fill="#171d29" font-family="system-ui,sans-serif" font-size="24" font-weight="820">Livret d’automatismes A5</text>
  <text x="32" y="68" fill="#717b8a" font-family="system-ui,sans-serif" font-size="15">Composer six blocs dans tous les domaines puis imprimer le livret</text>
  <g transform="translate(32 92)" font-family="system-ui,sans-serif">
    <rect width="236" height="190" rx="16" fill="#fff" stroke="#d7dce2"/>
    <text x="18" y="27" fill="#586170" font-size="12" font-weight="780">PARAMÈTRES</text>
    <text x="18" y="56" fill="#272f3c" font-size="13" font-weight="700">Titre</text><rect x="18" y="65" width="200" height="29" rx="7" fill="#f8f9fb" stroke="#d5dbe2"/><text x="30" y="84" fill="#374151" font-size="12">AUTOMATISMES</text>
    <text x="18" y="117" fill="#272f3c" font-size="13" font-weight="700">Niveau</text><rect x="18" y="126" width="94" height="29" rx="7" fill="#f8f9fb" stroke="#d5dbe2"/><text x="30" y="145" fill="#374151" font-size="12">Cycle 4</text>
    <rect x="18" y="168" width="200" height="34" rx="9" fill="#111827"/><text x="118" y="190" fill="#fff" font-size="13" font-weight="760" text-anchor="middle">Imprimer le livret</text>
  </g>
  <g transform="translate(308 86) rotate(-2 100 110)" filter="url(#shadow)" font-family="system-ui,sans-serif">
    <rect width="170" height="220" rx="4" fill="#fff" stroke="#bcc4ce"/><text x="14" y="22" fill="#111827" font-size="10" font-weight="800">AUTOMATISMES</text><text x="155" y="22" fill="#111827" font-size="10" font-weight="800" text-anchor="end">/ 30</text>
    <g font-size="10" fill="#253244"><rect x="12" y="35" width="146" height="49" rx="5" fill="#f6f8fb" stroke="#d6dde6"/><text x="20" y="51" font-weight="800">A · Nombres et calculs</text><text x="20" y="67">1. −7 + 12 =</text><text x="92" y="67">2. 3/4 de 20 =</text><rect x="12" y="92" width="146" height="49" rx="5" fill="#f6f8fb" stroke="#d6dde6"/><text x="20" y="108" font-weight="800">B · Géométrie</text><text x="20" y="124">1. Hypoténuse : 3² + 4² =</text><rect x="12" y="149" width="146" height="49" rx="5" fill="#f6f8fb" stroke="#d6dde6"/><text x="20" y="165" font-weight="800">C · Données</text><text x="20" y="181">1. 25 % de 80 =</text></g>
  </g>
  <g transform="translate(491 98) rotate(3 94 105)" filter="url(#shadow)" font-family="system-ui,sans-serif">
    <rect width="170" height="210" rx="4" fill="#fff" stroke="#bcc4ce"/><text x="14" y="22" fill="#111827" font-size="10" font-weight="800">LIVRET · SUITE</text><g font-size="10" fill="#253244"><rect x="12" y="35" width="146" height="44" rx="5" fill="#f6f8fb" stroke="#d6dde6"/><text x="20" y="51" font-weight="800">D · Algèbre</text><text x="20" y="67">1. Réduire 3x + 5x =</text><rect x="12" y="87" width="146" height="44" rx="5" fill="#f6f8fb" stroke="#d6dde6"/><text x="20" y="103" font-weight="800">E · Probabilités</text><text x="20" y="119">1. Pile avec une pièce =</text><rect x="12" y="139" width="146" height="44" rx="5" fill="#f6f8fb" stroke="#d6dde6"/><text x="20" y="155" font-weight="800">F · Algorithmique</text><text x="20" y="171">1. Répéter 4 fois...</text></g></g>
</svg>
