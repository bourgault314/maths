<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Splat Équations</title>
  <desc id="desc">Un plateau Splat accompagné d’une résolution d’équation sans tableau.</desc>
  <rect width="720" height="320" fill="#eef2f7"/>
  <rect x="26" y="25" width="668" height="280" rx="22" fill="#94a3b8" opacity=".18"/>
  <rect x="22" y="18" width="676" height="284" rx="22" fill="#fff"/>

  <g transform="translate(42 39)">
    <rect x="0" y="34" width="332" height="216" rx="16" fill="#fcfcfd" stroke="#cbd5e1" stroke-width="2"/>
    <g transform="translate(125 0)">
      <rect width="82" height="68" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
      <text x="41" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">TOTAL</text>
      <text x="41" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#0f172a">34</text>
    </g>
    <g fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5">
      <circle cx="42" cy="98" r="10"/><circle cx="78" cy="145" r="10"/><circle cx="54" cy="206" r="10"/>
      <circle cx="280" cy="91" r="10"/><circle cx="299" cy="153" r="10"/><circle cx="274" cy="215" r="10"/>
    </g>
    <path d="M137 106c15-17 29-5 44-17 16-12 34-1 34 18 0 17 18 22 25 36 9 18-5 32-22 39-17 7-17 30-36 38-18 8-31-8-40-22-10-15-30-9-43-22-13-14-3-31 4-45 8-15-2-33 8-43 8-9 16-4 26-2z" fill="#050505"/>
  </g>

  <g transform="translate(420 63)">
    <text x="120" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="850" fill="#2563eb">RÉSOUDRE L’ÉQUATION</text>
    <rect x="-4" y="22" width="248" height="190" rx="18" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/>
    <text x="120" y="73" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#0f172a">16 + 2 × ? = 34</text>
    <path d="M36 92h168" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#0f172a">2 × ? = 18</text>
    <text x="120" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" font-weight="700" fill="#2563eb">? = 9</text>
  </g>
</svg>
