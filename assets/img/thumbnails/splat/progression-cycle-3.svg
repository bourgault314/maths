<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">SPLAT! — une progression possible, cycle 3</title>
  <desc id="desc">Une miniature typographique simple pour la progression SPLAT! du cycle 3.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b74"/>
      <stop offset="1" stop-color="#082d59"/>
    </linearGradient>
  </defs>

  <rect width="720" height="320" rx="24" fill="url(#background)"/>
  <rect x="55" y="53" width="116" height="38" rx="19" fill="#f59e0b"/>
  <text x="113" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="900" letter-spacing=".8" fill="#082d59">CYCLE 3</text>

  <text x="55" y="169" font-family="system-ui, sans-serif" font-size="67" font-weight="950" fill="#fff">SPLAT!</text>
  <text x="55" y="223" font-family="system-ui, sans-serif" font-size="37" font-weight="750" fill="#dbeafe">Une progression possible</text>

  <rect x="55" y="263" width="610" height="4" rx="2" fill="#f59e0b" opacity=".9"/>
</svg>
