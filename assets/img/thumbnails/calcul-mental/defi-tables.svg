<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Défi tables de multiplication</title>
  <desc id="description">Aperçu du défi avec une égalité à facteur manquant, un chronomètre, une barre de progression et un clavier numérique.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9fbf7"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#087a71"/>
      <stop offset="1" stop-color="#0755b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173a5e" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="720" height="320" fill="url(#background)"/>
  <circle cx="42" cy="284" r="112" fill="#d7f3eb" opacity=".72"/>
  <circle cx="686" cy="28" r="98" fill="#fff0b8" opacity=".7"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="42" y="67" fill="#087a71" font-size="15" font-weight="850" letter-spacing="2.6">CALCUL MENTAL</text>
    <text x="40" y="119" fill="#10294a" font-size="41" font-weight="850">Défi tables</text>
    <text x="42" y="158" fill="#4f687b" font-size="19" font-weight="680">25 égalités en 1 minute</text>
    <g transform="translate(42 187)">
      <rect width="164" height="39" rx="12" fill="#fff" stroke="#c8dbe8" stroke-width="2"/>
      <text x="82" y="26" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">produits directs</text>
      <rect y="49" width="186" height="39" rx="12" fill="#fff" stroke="#c8dbe8" stroke-width="2"/>
      <text x="93" y="75" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">facteurs manquants</text>
    </g>

    <g transform="translate(328 19)" filter="url(#shadow)">
      <rect width="350" height="282" rx="25" fill="#fff" stroke="#d3e2ec" stroke-width="2"/>
      <text x="25" y="35" fill="#36546e" font-size="16" font-weight="850">8 / 25</text>
      <rect x="258" y="14" width="68" height="31" rx="16" fill="#e5f7eb"/>
      <text x="292" y="35" fill="#147447" font-size="17" font-weight="900" text-anchor="middle">0:42</text>
      <rect x="25" y="57" width="300" height="8" rx="4" fill="#dfebf3"/>
      <rect x="25" y="57" width="96" height="8" rx="4" fill="url(#progress)"/>
      <rect x="25" y="80" width="300" height="77" rx="16" fill="#f3f8fb"/>
      <text x="175" y="130" fill="#143451" font-size="37" font-weight="900" text-anchor="middle">7 × ? = 42</text>
      <rect x="25" y="169" width="300" height="39" rx="11" fill="#fff" stroke="#aac9dc" stroke-width="3"/>
      <text x="175" y="195" fill="#143451" font-size="22" font-weight="900" text-anchor="middle">6</text>
      <g transform="translate(68 220)" fill="#f8fcff" stroke="#a9c8da">
        <rect width="61" height="37" rx="9"/><rect x="76" width="61" height="37" rx="9"/><rect x="152" width="61" height="37" rx="9"/>
      </g>
      <g fill="#143451" font-size="17" font-weight="900" text-anchor="middle">
        <text x="98" y="245">4</text><text x="174" y="245">5</text><text x="250" y="245">6</text>
      </g>
    </g>
  </g>
</svg>
