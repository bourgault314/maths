<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Défi calcul mental</title>
  <desc id="description">Aperçu du défi avec un complément à calculer, un chronomètre, une barre de progression et un clavier numérique.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff7e9"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d95f02"/>
      <stop offset="1" stop-color="#0755b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173a5e" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="720" height="320" fill="url(#background)"/>
  <circle cx="44" cy="286" r="112" fill="#ffebc5" opacity=".72"/>
  <circle cx="685" cy="26" r="96" fill="#dceeff" opacity=".78"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="42" y="67" fill="#b45309" font-size="15" font-weight="850" letter-spacing="2.6">AUTOMATISMES</text>
    <text x="40" y="119" fill="#10294a" font-size="41" font-weight="850">Défi calcul</text>
    <text x="42" y="158" fill="#4f687b" font-size="19" font-weight="680">30 calculs en 3 minutes</text>
    <g transform="translate(42 187)">
      <rect width="132" height="39" rx="12" fill="#fff" stroke="#d7dce5" stroke-width="2"/>
      <text x="66" y="26" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">+ et −</text>
      <rect x="143" width="135" height="39" rx="12" fill="#fff" stroke="#d7dce5" stroke-width="2"/>
      <text x="210" y="26" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">compléments</text>
      <rect y="49" width="184" height="39" rx="12" fill="#fff" stroke="#d7dce5" stroke-width="2"/>
      <text x="92" y="75" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">× 10 et × 100</text>
    </g>

    <g transform="translate(328 19)" filter="url(#shadow)">
      <rect width="350" height="282" rx="25" fill="#fff" stroke="#d3e2ec" stroke-width="2"/>
      <text x="25" y="35" fill="#36546e" font-size="16" font-weight="850">12 / 30</text>
      <rect x="258" y="14" width="68" height="31" rx="16" fill="#e5f7eb"/>
      <text x="292" y="35" fill="#147447" font-size="17" font-weight="900" text-anchor="middle">1:54</text>
      <rect x="25" y="57" width="300" height="8" rx="4" fill="#dfebf3"/>
      <rect x="25" y="57" width="120" height="8" rx="4" fill="url(#progress)"/>
      <rect x="25" y="80" width="300" height="77" rx="16" fill="#f3f8fb"/>
      <text x="175" y="128" fill="#143451" font-size="33" font-weight="900" text-anchor="middle">650 + ? = 1 000</text>
      <rect x="25" y="169" width="300" height="39" rx="11" fill="#fff" stroke="#aac9dc" stroke-width="3"/>
      <text x="175" y="195" fill="#143451" font-size="22" font-weight="900" text-anchor="middle">350</text>
      <g transform="translate(68 220)" fill="#f8fcff" stroke="#a9c8da">
        <rect width="61" height="37" rx="9"/><rect x="76" width="61" height="37" rx="9"/><rect x="152" width="61" height="37" rx="9"/>
      </g>
      <g fill="#143451" font-size="17" font-weight="900" text-anchor="middle">
        <text x="98" y="245">1</text><text x="174" y="245">2</text><text x="250" y="245">3</text>
      </g>
    </g>
  </g>
</svg>
