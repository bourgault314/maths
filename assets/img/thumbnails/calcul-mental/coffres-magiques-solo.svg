<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Coffres magiques en calcul mental</title>
  <desc id="description">Un défi de quotient et un plateau de seize runes pour trouver dix clés en utilisant les quatre opérations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eafaf6"/>
      <stop offset=".58" stop-color="#f5faff"/>
      <stop offset="1" stop-color="#fff3d9"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a77b50"/>
      <stop offset="1" stop-color="#62412d"/>
    </linearGradient>
    <radialGradient id="rune" cx="35%" cy="25%" r="85%">
      <stop stop-color="#fff" offset="0"/>
      <stop stop-color="#def4f4" offset=".52"/>
      <stop stop-color="#a9d6d7" offset="1"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff7b8"/>
      <stop offset="1" stop-color="#f6ca51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#173a5e" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="720" height="320" fill="url(#background)"/>
  <circle cx="34" cy="300" r="126" fill="#d8f3ec" opacity=".74"/>
  <circle cx="698" cy="22" r="94" fill="#ffebbd" opacity=".72"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="38" y="55" fill="#078a82" font-size="15" font-weight="850" letter-spacing="2.8">CALCUL MENTAL</text>
    <text x="36" y="104" fill="#143e62" font-size="39" font-weight="850">Coffres</text>
    <text x="36" y="146" fill="#143e62" font-size="39" font-weight="850">magiques</text>
    <text x="39" y="181" fill="#557083" font-size="16" font-weight="650">Additionne, soustrais,</text>
    <text x="39" y="206" fill="#557083" font-size="16" font-weight="650">multiplie ou divise.</text>

    <g transform="translate(39 230)">
      <rect width="164" height="45" rx="22.5" fill="#e9f4ff"/>
      <g transform="translate(15 11)" fill="none" stroke="#0755b8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2">
        <circle cx="9" cy="11" r="7"/>
        <path d="M16 11h18v6h-5v5h-6v-5h-7"/>
      </g>
      <text x="51" y="29" fill="#0755b8" font-size="17" font-weight="900">6 / 10 clés</text>
    </g>
    <g transform="translate(40 286)" fill="#078a82" font-size="15" font-weight="900">
      <text x="0" y="0">+</text>
      <text x="34" y="0">−</text>
      <text x="66" y="0">×</text>
      <text x="99" y="0">÷</text>
    </g>
  </g>

  <g transform="translate(352 16)" filter="url(#shadow)">
    <rect width="332" height="288" rx="25" fill="#fff" stroke="#d2e1eb" stroke-width="2"/>

    <g transform="translate(24 17)">
      <rect width="284" height="54" rx="15" fill="url(#gold)" stroke="#dcad34" stroke-width="2"/>
      <g transform="translate(17 10)" fill="none" stroke="#76550c" stroke-width="3">
        <rect x="0" y="10" width="25" height="21" rx="4"/>
        <path d="M5 11V8a7.5 7.5 0 0 1 15 0v3"/>
        <circle cx="12.5" cy="20" r="2" fill="#76550c"/>
      </g>
      <text x="162" y="22" fill="#76550c" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="850" text-anchor="middle" letter-spacing="1.5">OUVRE LE COFFRE AVEC</text>
      <text x="162" y="44" fill="#3d4860" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="900" text-anchor="middle">un quotient de 4</text>
    </g>

    <g transform="translate(61 82)">
      <rect x="-11" y="-11" width="232" height="198" rx="20" fill="url(#wood)"/>
      <g font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="900" text-anchor="middle" dominant-baseline="central">
        <g fill="url(#rune)" stroke="#bfd4de" stroke-width="2">
          <rect x="0" y="0" width="48" height="38" rx="10"/><rect x="54" y="0" width="48" height="38" rx="10"/><rect x="108" y="0" width="48" height="38" rx="10"/><rect x="162" y="0" width="48" height="38" rx="10"/>
          <rect x="0" y="44" width="48" height="38" rx="10"/><rect x="54" y="44" width="48" height="38" rx="10"/><rect x="108" y="44" width="48" height="38" rx="10"/><rect x="162" y="44" width="48" height="38" rx="10"/>
          <rect x="0" y="88" width="48" height="38" rx="10"/><rect x="54" y="88" width="48" height="38" rx="10"/><rect x="108" y="88" width="48" height="38" rx="10"/><rect x="162" y="88" width="48" height="38" rx="10"/>
          <rect x="0" y="132" width="48" height="38" rx="10"/><rect x="54" y="132" width="48" height="38" rx="10"/><rect x="108" y="132" width="48" height="38" rx="10"/><rect x="162" y="132" width="48" height="38" rx="10"/>
        </g>
        <rect x="54" y="88" width="48" height="38" rx="10" fill="#ffdd72" stroke="#f0a800" stroke-width="3"/>
        <rect x="108" y="88" width="48" height="38" rx="10" fill="#bff0d8" stroke="#087a55" stroke-width="3"/>
        <g fill="#17405e">
          <text x="24" y="19">8</text><text x="78" y="19">3</text><text x="132" y="19">10</text><text x="186" y="19">5</text>
          <text x="24" y="63">12</text><text x="78" y="63">4</text><text x="132" y="63">9</text><text x="186" y="63">2</text>
          <text x="24" y="107">7</text><text x="78" y="107">24</text><text x="132" y="107">6</text><text x="186" y="107">11</text>
          <text x="24" y="151">3</text><text x="78" y="151">8</text><text x="132" y="151">4</text><text x="186" y="151">9</text>
        </g>
      </g>
    </g>
  </g>
</svg>
