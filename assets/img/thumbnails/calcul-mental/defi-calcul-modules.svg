<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Défi calcul, module par module</title>
  <desc id="description">Aperçu de l’appli : une droite graduée qui passe la dizaine en deux sauts, 236 + 4 puis + 3, et le calcul 236 + 7 à compléter.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff7e9"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173a5e" flood-opacity=".15"/>
    </filter>
    <marker id="pointe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#0755b8"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="url(#background)"/>
  <circle cx="44" cy="286" r="112" fill="#ffebc5" opacity=".72"/>
  <circle cx="685" cy="26" r="96" fill="#dceeff" opacity=".78"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="42" y="67" fill="#b45309" font-size="15" font-weight="850" letter-spacing="2.6">CALCUL MENTAL</text>
    <text x="40" y="119" fill="#10294a" font-size="41" font-weight="850">Défi calcul</text>
    <text x="42" y="158" fill="#4f687b" font-size="19" font-weight="680">Module par module</text>
    <g transform="translate(42 187)">
      <rect width="134" height="39" rx="12" fill="#fff" stroke="#c8dbe8" stroke-width="2"/>
      <text x="67" y="26" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">compléments</text>
      <rect x="146" width="128" height="39" rx="12" fill="#fff" stroke="#c8dbe8" stroke-width="2"/>
      <text x="210" y="26" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">doubles</text>
      <rect y="49" width="200" height="39" rx="12" fill="#fff" stroke="#c8dbe8" stroke-width="2"/>
      <text x="100" y="75" fill="#0755b8" font-size="16" font-weight="800" text-anchor="middle">passer la dizaine</text>
    </g>

    <g transform="translate(340 19)" filter="url(#shadow)">
      <rect width="340" height="282" rx="25" fill="#fff" stroke="#d3e2ec" stroke-width="2"/>
      <text x="170" y="36" fill="#087a71" font-size="16" font-weight="850" text-anchor="middle">236 + 7 = 236 + 4 + 3</text>

      <!-- la droite : deux sauts, le premier jusqu'à la dizaine -->
      <g transform="translate(0 2)">
        <path d="M58 80 Q122 50 186 80" fill="none" stroke="#0755b8" stroke-width="3" marker-end="url(#pointe)"/>
        <path d="M186 80 Q230 58 274 80" fill="none" stroke="#0755b8" stroke-width="3" marker-end="url(#pointe)"/>
        <text x="122" y="61" fill="#0755b8" font-size="17" font-weight="900" text-anchor="middle">+ 4</text>
        <text x="230" y="66" fill="#0755b8" font-size="17" font-weight="900" text-anchor="middle">+ 3</text>
        <line x1="32" y1="88" x2="304" y2="88" stroke="#143451" stroke-width="3" stroke-linecap="round"/>
        <g stroke="#143451" stroke-width="3">
          <line x1="58" y1="80" x2="58" y2="96"/><line x1="186" y1="80" x2="186" y2="96"/><line x1="274" y1="80" x2="274" y2="96"/>
        </g>
        <g font-size="17" font-weight="900" text-anchor="middle">
          <rect x="35" y="102" width="46" height="27" rx="7" fill="#fff" stroke="#143451" stroke-width="2"/>
          <text x="58" y="121" fill="#143451">236</text>
          <rect x="163" y="102" width="46" height="27" rx="7" fill="#e5f7eb" stroke="#147447" stroke-width="2"/>
          <text x="186" y="121" fill="#147447">240</text>
          <rect x="251" y="102" width="46" height="27" rx="7" fill="#fff" stroke="#0755b8" stroke-width="2"/>
          <text x="274" y="121" fill="#0755b8">?</text>
        </g>
      </g>

      <!-- J'écris -->
      <rect x="24" y="142" width="292" height="120" rx="16" fill="#f3f8fb"/>
      <g font-size="23" font-weight="900" fill="#143451">
        <text x="180" y="177" text-anchor="end">236 + 4 =</text>
        <rect x="190" y="157" width="58" height="28" rx="6" fill="#e5f7eb" stroke="#147447" stroke-width="2"/>
        <text x="219" y="178" fill="#147447" font-size="19" text-anchor="middle">240</text>
        <text x="180" y="213" text-anchor="end">240 + 3 =</text>
        <rect x="190" y="193" width="58" height="28" rx="6" fill="#fff" stroke="#0755b8" stroke-width="3"/>
        <text x="180" y="249" text-anchor="end" fill="#9fb3c3">236 + 7 =</text>
        <rect x="190" y="229" width="58" height="28" rx="6" fill="#fff" stroke="#d3e2ec" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
