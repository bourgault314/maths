  <script>window.AXELLE_CHALLENGE={kind:"calcul",total:30,duration:180,storageKey:"axelle-defi-calcul-best",message:score=>score>=15?"Tes procédures de calcul deviennent rapides et sûres. Essaie encore pour battre ton score.":score>=8?"Plusieurs procédures sont en place. Refaire de petites séries va les automatiser.":"Commence tranquillement par les compléments et les calculs avec 9, puis retente une série."};</script>

<body>
  <main class="shell">
    <header class="topbar"><a href="../../">← Bureau d’Axelle</a><a href="/" aria-label="Accueil maths&go"><img src="/assets/img/mathsgo-logo.png" alt="maths&go" width="1338" height="622"></a></header>
    <section class="panel">
      <div id="intro" class="intro"><span class="hero-icon" aria-hidden="true">⚡</span><p class="eyebrow">Défi calcul</p><h1>30 calculs en 3 minutes</h1><p>Additions, soustractions, compléments et multiplications par 10 ou 100. Chaque essai crée une nouvelle série.</p><p id="best-intro" class="best"></p><button id="start" class="primary" type="button">Lancer le défi</button></div>
      <div id="play" hidden><div class="status"><span id="question-count">1 / 30</span><strong id="time" aria-live="polite">3:00</strong></div><div class="progress-track"><b id="progress"></b></div><article class="question"><p id="question-kind" class="eyebrow">Calcul</p><div id="expression" class="expression"></div><label for="answer">Ta réponse</label><input id="answer" class="answer" inputmode="none" readonly aria-readonly="true"><div class="keypad" aria-label="Clavier numérique"><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="clear">Effacer</button><button type="button" data-key="0">0</button><button type="button" data-key="backspace" aria-label="Effacer un chiffre">⌫</button></div><div class="actions"><button id="validate" class="primary" type="button">Valider</button><button id="skip" class="secondary" type="button">Passer</button></div></article></div>
      <div id="result" class="result" hidden><span class="hero-icon" aria-hidden="true">🏁</span><p class="eyebrow">Défi terminé</p><h1 id="result-title"></h1><p id="result-detail"></p><p id="result-message" class="result-message"></p><p id="result-best" class="best"></p><div class="result-actions"><button id="retry" class="primary" type="button">Nouvelle série</button><a class="secondary" href="../../">Retour au Bureau</a></div></div>
    </section>
  </main><footer>Aucun résultat n’est envoyé</footer>
