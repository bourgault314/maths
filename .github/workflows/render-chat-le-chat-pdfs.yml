name: Rendu temporaire des PDF Chat

on:
  push:
    branches: [agent/stabiliser-projection-chat]

permissions:
  contents: write

jobs:
  rendre:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: agent/stabiliser-projection-chat

      - name: Générer et vérifier les sources
        run: |
          python3 _sources/chat-le-chat/gen_projection.py
          python3 _sources/chat-le-chat/gen_projection.py --check
          python3 _sources/chat-le-chat/gen.py
          python3 _sources/chat-le-chat/verify.py

      - name: Produire les deux PDF avec Chromium
        run: python3 _sources/chat-le-chat/render_pdfs.py --publish

      - name: Enregistrer les PDF et retirer ce workflow temporaire
        run: |
          rm .github/workflows/render-chat-le-chat-pdfs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/chat-cest-toi-le-chat-projection.html
          git add outils/chat-cest-toi-le-chat.pdf outils/chat-cest-toi-le-chat-cartes-compactes.pdf
          git add .github/workflows/render-chat-le-chat-pdfs.yml
          git commit -m "Générer les PDF Chat avec Chromium"
          git push origin HEAD:agent/stabiliser-projection-chat
