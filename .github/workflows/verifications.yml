# Vérifications automatiques maths&go
#
# Ce workflow tourne sur les serveurs de GitHub à chaque pull request et à
# chaque mise à jour de main. Il exécute les scripts de contrôle du dossier
# scripts/ (lecture seule uniquement — les scripts qui écrivent des fichiers
# en sont volontairement exclus). Si une étape bloquante échoue, la pull
# request affiche une croix rouge : ne pas fusionner sans comprendre pourquoi.
#
# Trois coches exigées par le ruleset de main, sur chaque pull request :
#   - « verifications »     : le site (contrôles rapides + tests Node) ;
#   - « serveur (SQLite) »  : les tests de bout en bout du serveur de suivi
#                             (_serveur/tests/lancer.php) sur une base SQLite jetable ;
#   - « serveur (MySQL) »   : les mêmes tests sur un vrai MySQL 8, comme en
#                             production (le limiteur et les verrous y prennent
#                             un autre chemin que sur SQLite).
# Les tests serveur tournent sur PHP 8.2, la version de la production.
#
# Les deux coches « serveur » ne sont réclamées que si la pull request touche au
# serveur (voir le job « changements » ci-dessous). Sur une pull request qui ne
# change qu'un outil du site, elles sont SAUTÉES : la coche existe, elle est
# verte, et la fusion reste possible.
#
# Depuis le lot « vérifications plus rapides » (21/11/2026), une seule batterie
# complète par fusion :
#   - sur une pull request, « node --test » ne joue que les fichiers de test qui
#     concernent les fichiers changés (scripts/tests-cibles.mjs) ; si la pull
#     request touche l'outillage des tests (ce workflow, package.json…), tout ;
#   - à l'arrivée sur main, le dimanche et sur « Run workflow » : la batterie
#     complète, partagée entre quatre machines qui tournent en même temps
#     (job « batterie ») ;
#   - la publication (publier.yml) ne rejoue plus rien : elle attend que CE
#     workflow soit vert sur main, puis met le site en ligne. Ce qu'un ciblage
#     aurait raté se voit donc avant la mise en ligne, jamais après.
# Avant ce lot : 15 min par pull request, la batterie rejouée par la publication
# (12 min de plus après chaque fusion). Le dépôt est public depuis le 21/11/2026 :
# GitHub prête des machines à quatre processeurs, sans compter les minutes.

name: Vérifications

on:
  pull_request:
  push:
    branches: [main]
  # Un rendez-vous hebdomadaire sur main : tout est rejoué, y compris ce qui ne
  # tourne jamais sur une pull request (les mesures de temps, qui rougissent au
  # hasard sur une machine partagée). Dimanche 18:00 UTC = 22 h à La Réunion.
  schedule:
    - cron: "0 18 * * 0"
  # Et le même passage complet à la demande, depuis l'onglet « Actions ».
  workflow_dispatch:

# Un seul passage à la fois par pull request. Quand on pousse deux fois de
# suite, le premier passage vérifie un état déjà remplacé : il occupe une
# machine pour rien, et son échec envoie un mail qui ne veut plus rien dire.
#
# Sur main, RIEN n'est annulé : chaque état publié doit avoir été vérifié en
# entier, et le rendez-vous hebdomadaire ne doit pas être coupé par un push.
# D'où la condition sur cancel-in-progress, et le groupe qui retombe sur le SHA
# (hors pull request, chaque commit a le sien : aucun passage n'en annule un autre).
concurrency:
  group: verifications-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Faut-il lancer les tests du serveur de suivi ?
  #
  # Ils durent une minute et n'apprennent rien sur une pull request qui ne
  # touche qu'un outil du site — mais ils tirent à chaque fois, et un test de
  # bout en bout qui tire souvent finit par rougir sans raison.
  #
  # Même chose à l'arrivée sur main : avant le 06/10/2026, chaque fusion les
  # relançait sans condition (≈ 825 minutes facturées sur 30 jours, pour des
  # fusions qui, neuf fois sur dix, ne touchaient pas au serveur). Le serveur
  # n'est jamais mis en ligne par ce workflow (dépôt FTP à la main) : ces tests
  # ne gardent aucune publication, et le passage du dimanche les rejoue tous.
  #
  # Pourquoi pas un « paths: » sur le workflow entier ? Parce qu'un workflow qui
  # ne se déclenche pas ne produit AUCUNE coche : « serveur (SQLite) » resterait
  # « Expected » pour toujours, et la fusion serait bloquée sans rien à cliquer.
  # Un job SAUTÉ, lui, produit bien sa coche.
  changements:
    runs-on: ubuntu-latest
    outputs:
      serveur: ${{ steps.tri.outputs.serveur }}
      tests_tout: ${{ steps.cibles.outputs.tout }}
      tests_cibles: ${{ steps.cibles.outputs.cibles }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tout l'historique : sans lui, la base de la pull request (ou l'état
          # de main avant la fusion) n'est pas là, et le « git diff » ci-dessous
          # n'a rien à comparer.
          fetch-depth: 0

      - name: Décider si les tests du serveur doivent tourner
        id: tri
        env:
          EVENEMENT: ${{ github.event_name }}
          # Pull request : sa base et sa tête. Arrivée sur main : main avant la
          # fusion (« before ») et main après. Les autres événements ne trient pas.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TETE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tout() {
            echo "serveur=true" >> "$GITHUB_OUTPUT"
            echo "-> $1"
            exit 0
          }
          # Rendez-vous hebdomadaire et lancement à la main : on ne trie pas,
          # tout tourne. Seules les pull requests et l'arrivée sur main sont triées.
          case "$EVENEMENT" in
            pull_request|push) ;;
            *) tout "événement « $EVENEMENT » : les tests du serveur tournent." ;;
          esac
          # Une branche qui vient de naître n'a pas d'état précédent : GitHub
          # donne alors un « before » fait de zéros. Rien à comparer : tout.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) tout "pas d'état précédent : par prudence, les tests du serveur tournent." ;;
          esac
          # En cas de doute — un SHA absent, un diff impossible — on lance tout.
          # Mieux vaut une minute de trop qu'un contrôle sauté par erreur.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || tout "base introuvable : par prudence, les tests du serveur tournent."
          git cat-file -e "$TETE^{commit}" 2>/dev/null || tout "tête introuvable : par prudence, les tests du serveur tournent."
          souche=$(git merge-base "$BASE" "$TETE") || tout "souche commune introuvable : par prudence, les tests du serveur tournent."
          fichiers=$(git diff --name-only "$souche" "$TETE") || tout "diff impossible : par prudence, les tests du serveur tournent."
          echo "Fichiers modifiés depuis $souche :"
          echo "$fichiers" | sed 's/^/  /'
          # Ce que le serveur de suivi lit vraiment. Hors _serveur/, la liste ne
          # se devine pas : elle vient de _serveur/tests/lancer.php lui-même, qui
          # compare octet pour octet les moteurs de Défi tables, de SPLAT! et de Coffres et
          # les images servies à ceux du dépôt (« octet pour octet le fichier de
          # l'appli », « le logo et les icônes sont servis d'ici »). Toucher l'un de ces
          # fichiers sans recopier sa copie dans _serveur/public/ rend les tests
          # du serveur rouges : ils doivent donc tourner.
          # Les workflows eux-mêmes en font partie : les modifier, c'est changer
          # la façon dont ces tests sont lancés.
          motif='^_serveur/'
          motif="$motif"'|^\.github/workflows/'
          motif="$motif"'|^outils/calcul_mental/defi_tables_mon_parcours\.js$'
          motif="$motif"'|^outils/calcul_mental/defi_tables_core\.js$'
          motif="$motif"'|^assets/js/splat-parcours\.js$'
          motif="$motif"'|^assets/js/coffres-parcours\.js$'
          motif="$motif"'|^assets/img/mathsgo-logo-390\.png$'
          motif="$motif"'|^assets/img/mathsgo-logo-print\.png$'
          motif="$motif"'|^assets/img/apple-touch-icon\.png$'
          motif="$motif"'|^favicon\.svg$'
          motif="$motif"'|^favicon\.ico$'
          if echo "$fichiers" | grep -qE "$motif"; then
            echo "serveur=true" >> "$GITHUB_OUTPUT"
            echo "-> une dépendance du serveur a bougé : les tests du serveur tournent."
          else
            echo "serveur=false" >> "$GITHUB_OUTPUT"
            echo "-> aucune dépendance du serveur n'a bougé : ses tests sont sautés."
          fi

      # Quels fichiers de « node --test » jouer sur cette pull request ? Le
      # script répond « tout » si elle touche l'outillage des tests, si le calcul
      # échoue, ou si plus de la moitié des fichiers sont concernés. Hors pull
      # request, tout : la batterie complète tourne une fois par fusion.
      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Choisir les tests de la pull request
        id: cibles
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENEMENT" != "pull_request" ]; then
            echo "tout=true" >> "$GITHUB_OUTPUT"
            echo "-> événement « $EVENEMENT » : la batterie complète tourne."
            exit 0
          fi
          node scripts/tests-cibles.mjs "$BASE" "$TETE" --github

  # Les contrôles rapides du site (quelques secondes), à chaque passage, et sur
  # une pull request les tests Node choisis par « changements ».
  controles:
    needs: changements
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Catalogue (cohérence des ressources)
        run: node scripts/validate-catalogue.mjs

      - name: Référencement (métadonnées et pages hors catalogue)
        run: node scripts/generate-seo.mjs --check

      - name: Sitemap (chaque URL correspond à un fichier)
        run: node scripts/validate-sitemap.mjs

      - name: Icônes (chaque page déclare la sienne)
        run: node scripts/validate-icone.mjs

      - name: Automatismes (intégrité de la page publique)
        run: node scripts/validate-automatismes-public.mjs

      - name: Automatismes V2 (périmètre et provenance)
        run: node scripts/validate-automatismes-v2.mjs

      - name: Outils Pythagore
        run: node scripts/validate-pythagore-tools.mjs

      - name: Moteur d'aimantation Pythagore
        run: node scripts/validate-pythagore-snap-engine.mjs

      # Quatre fichiers à la fois : la machine prêtée à un dépôt public a quatre
      # processeurs. La liste vient de l'environnement (jamais écrite dans le
      # script) ; vide, rien ne tourne — « node --test » sans fichier jouerait tout.
      - name: Tests Node de la pull request
        if: needs.changements.outputs.tests_tout != 'true'
        env:
          CIBLES: ${{ needs.changements.outputs.tests_cibles }}
        run: |
          if [ -z "$CIBLES" ]; then echo "aucun fichier de test concerné"; exit 0; fi
          echo "$CIBLES" | tr ' ' '\n'
          node --test --test-concurrency=4 $CIBLES

      - name: Audit mobile (informatif, ne bloque pas)
        run: node scripts/audit-mobile.mjs
        continue-on-error: true

  # La batterie complète de « node --test », partagée en quatre parts qui
  # tournent en même temps sur quatre machines (--test-shard). À l'arrivée sur
  # main, le dimanche, sur « Run workflow », et sur une pull request qui touche
  # l'outillage des tests.
  batterie:
    name: batterie (${{ matrix.part }}/4)
    needs: changements
    if: needs.changements.outputs.tests_tout == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Tests Node (une part sur quatre)
        run: node --test --test-concurrency=4 --test-shard=${{ matrix.part }}/4

  # La coche « verifications », exigée par le ruleset : verte seulement si les
  # contrôles rapides ET les tests (ciblés ou complets) le sont. Elle tourne
  # TOUJOURS, sauf passage annulé (if: !cancelled()) : un job sauté compterait
  # comme réussi, et une batterie rouge laisserait passer la fusion.
  verifications:
    needs: [changements, controles, batterie]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Bilan des contrôles et des tests
        env:
          CHANGEMENTS: ${{ needs.changements.result }}
          CONTROLES: ${{ needs.controles.result }}
          BATTERIE: ${{ needs.batterie.result }}
          TOUT: ${{ needs.changements.outputs.tests_tout }}
        run: |
          echo "changements : $CHANGEMENTS ; contrôles : $CONTROLES ; batterie : $BATTERIE (complète : $TOUT)"
          [ "$CHANGEMENTS" = "success" ] || { echo "le tri a échoué"; exit 1; }
          [ "$CONTROLES" = "success" ] || { echo "les contrôles rapides ou les tests ciblés ont échoué"; exit 1; }
          if [ "$TOUT" = "true" ]; then
            [ "$BATTERIE" = "success" ] || { echo "la batterie complète a échoué"; exit 1; }
          fi
          echo "tout est vert"

  # Le serveur de suivi : les tests de bout en bout (un vrai serveur PHP est
  # lancé sur une copie de _serveur/public/, puis interrogé comme le ferait
  # l'appli). D'abord sur SQLite, la base par défaut de lancer.php.
  serveur-sqlite:
    name: serveur (SQLite)
    needs: changements
    if: needs.changements.outputs.serveur == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer PHP 8.2 (version de la production)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          # openssl : la sauvegarde chiffrée du lot 12 (sauvegarde.php) en dépend.
          extensions: curl, mbstring, ctype, pdo_sqlite, pdo_mysql, openssl
          coverage: none
          tools: none

      - name: Tests du serveur sur SQLite
        env:
          # Les mesures de temps ne tournent qu'au rendez-vous hebdomadaire et
          # sur lancement à la main : sur une machine partagée, un chronomètre
          # rougit au hasard. Ce qu'elles gardent est vérifié à chaque pull
          # request, sans chronomètre, par tests/suivi-temps-constant.test.mjs.
          SUIVI_TESTS_TEMPS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: php _serveur/tests/lancer.php

      # En cas d'échec, lancer.php garde le journal du serveur de test : c'est lui
      # qui dit pourquoi une requête a répondu 500. On affiche ses lignes d'erreur
      # et on le joint en entier à l'exécution (onglet « Artifacts »).
      - name: Journal du serveur de test (seulement en cas d'échec)
        if: failure()
        run: |
          if [ -f /tmp/suivi-test-serveur.log ]; then
            lignes=$(grep -iE "PHP (Fatal|Warning|Parse|Notice|Deprecated)|\[500\]|exception" /tmp/suivi-test-serveur.log | head -200 || true)
            if [ -n "$lignes" ]; then
              echo "Lignes d'erreur du serveur de test (500, PHP Fatal/Warning...) :"
              echo "$lignes"
            else
              echo "(aucune erreur serveur : les échecs sont des réponses différentes de celles attendues)"
            fi
          else
            echo "(pas de journal : lancer.php n'a pas démarré, ou a échoué avant de lancer le serveur)"
          fi
      - name: Joindre le journal complet (seulement en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journal-serveur-de-test-sqlite
          path: /tmp/suivi-test-serveur.log
          if-no-files-found: ignore

  # Les mêmes tests sur MySQL 8, comme en production. GitHub démarre un MySQL
  # jetable à côté de la machine de test ; ses identifiants ne servent qu'ici
  # et la base est vidée au début de chaque passage par lancer.php.
  serveur-mysql:
    name: serveur (MySQL)
    needs: changements
    if: needs.changements.outputs.serveur == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: suivi_test
          MYSQL_USER: suivi
          MYSQL_PASSWORD: suivi-test-ci
          MYSQL_ROOT_PASSWORD: root-test-ci
        ports:
          - 3306:3306
        # Attendre que MySQL réponde sur le réseau (pendant son initialisation,
        # il n'écoute que sur un socket local : le ping TCP échoue, c'est voulu).
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer PHP 8.2 (version de la production)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          # openssl : la sauvegarde chiffrée du lot 12 (sauvegarde.php) en dépend.
          extensions: curl, mbstring, ctype, pdo_sqlite, pdo_mysql, openssl
          coverage: none
          tools: none

      - name: Tests du serveur sur MySQL
        env:
          SUIVI_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=suivi_test;charset=utf8mb4"
          SUIVI_TEST_UTILISATEUR: suivi
          SUIVI_TEST_MOTDEPASSE: suivi-test-ci
          # Voir la note du job SQLite : les mesures de temps ne tournent qu'au
          # rendez-vous hebdomadaire et sur lancement à la main.
          SUIVI_TESTS_TEMPS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: php _serveur/tests/lancer.php

      # En cas d'échec, lancer.php garde le journal du serveur de test : c'est lui
      # qui dit pourquoi une requête a répondu 500. On affiche ses lignes d'erreur
      # et on le joint en entier à l'exécution (onglet « Artifacts »).
      - name: Journal du serveur de test (seulement en cas d'échec)
        if: failure()
        run: |
          if [ -f /tmp/suivi-test-serveur.log ]; then
            lignes=$(grep -iE "PHP (Fatal|Warning|Parse|Notice|Deprecated)|\[500\]|exception" /tmp/suivi-test-serveur.log | head -200 || true)
            if [ -n "$lignes" ]; then
              echo "Lignes d'erreur du serveur de test (500, PHP Fatal/Warning...) :"
              echo "$lignes"
            else
              echo "(aucune erreur serveur : les échecs sont des réponses différentes de celles attendues)"
            fi
          else
            echo "(pas de journal : lancer.php n'a pas démarré, ou a échoué avant de lancer le serveur)"
          fi
      - name: Joindre le journal complet (seulement en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journal-serveur-de-test-mysql
          path: /tmp/suivi-test-serveur.log
          if-no-files-found: ignore
