# Publication du site maths&go
#
# Remplace la publication automatique « brute » de GitHub Pages par une
# publication contrôlée en deux temps :
#   1. vérifier (les contrôles bloquants doivent tous passer) ;
#   2. assembler puis publier le site.
# Si une vérification échoue, le site en ligne reste sur sa version
# précédente : rien de cassé ne peut plus être publié.
#
# L'assemblage reprend ce que GitHub Pages publiait : tout le dépôt, sauf
# les fichiers commençant par « . » ou « _ » (sources LaTeX, serveur de
# suivi, fichiers techniques) que l'ancien système excluait déjà. Depuis le
# lot « petits correctifs de sécurité » (11/11/2026, constat F09 de l'audit
# GPT du 09/11), les dossiers techniques de la RACINE (tests/, scripts/,
# docs/), AGENTS.md et tous les fichiers de test (*.test.js, .mjs, .cjs)
# n'entrent plus non plus : un test du dépôt privé se lisait sur
# https://mathsgo.re/tests/…. Les exclusions sont ANCRÉES (« /scripts/ ») :
# auto/scripts/, que les Automatismes chargent, reste publié. L'archive
# assemblée est ensuite contrôlée par scripts/verifier-publication.mjs, qui
# tourne depuis le dépôt (il n'est pas publié) et tient la même liste.
#
# Ce workflow ne prend effet que lorsque le réglage GitHub Pages du dépôt
# est positionné sur « GitHub Actions » (au lieu de « Deploy from a
# branch »). Retour en arrière possible à tout moment en remettant
# l'ancien réglage.

name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Seul l'état le plus récent de main doit être publié. Cela évite qu'un
  # déploiement obsolète bloque la correction suivante dans la file Pages.
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Générer la fiche des tables depuis sa source
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python _sources/defi-tables/generer_pdf.py

      # Depuis le 06/10/2026, c'est le SEUL passage de ces contrôles à
      # l'arrivée sur main : le job « verifications » de verifications.yml n'y
      # tourne plus, puisqu'il jouait exactement les mêmes commandes sur le même
      # commit. tests/ci-tests-serveur-cibles.test.mjs garde les deux listes
      # alignées. « --test-concurrency=2 » : voir verifications.yml (deux
      # processeurs sur la machine de GitHub, deux fichiers de test à la fois).
      - name: Vérifications bloquantes
        run: |
          node --test --test-concurrency=2
          node scripts/validate-catalogue.mjs
          node scripts/generate-seo.mjs --check
          node scripts/validate-sitemap.mjs
          node scripts/validate-icone.mjs
          node scripts/validate-automatismes-public.mjs
          node scripts/validate-automatismes-v2.mjs
          node scripts/validate-pythagore-tools.mjs
          node scripts/validate-pythagore-snap-engine.mjs

      - name: Assembler le site
        run: |
          mkdir _site
          rsync -a --exclude '.*' --exclude '_*' \
            --exclude '/tests/' --exclude '/scripts/' --exclude '/docs/' \
            --exclude '/AGENTS.md' \
            --exclude 'node_modules' \
            --exclude '*.test.js' --exclude '*.test.mjs' --exclude '*.test.cjs' \
            --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'axelle/daily/template-index.html' \
            ./ _site/
          test ! -e _site/axelle/daily/template-index.html
          node scripts/verifier-publication.mjs _site
          echo "Fichiers assemblés : $(find _site -type f | wc -l)"

      - name: Empaqueter pour publication
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  publier:
    needs: construire
    # Utiliser le pool standard, comme la construction, évite qu'une image
    # particulière sans exécuteur disponible bloque la mise en ligne.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
