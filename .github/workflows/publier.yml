# Publication du site maths&go
#
# Remplace la publication automatique « brute » de GitHub Pages par une
# publication contrôlée en deux temps :
#   1. vérifier : c'est le workflow « Vérifications » (verifications.yml), qui
#      joue sur main la batterie complète et les contrôles rapides ;
#   2. assembler puis publier le site — seulement quand ce passage-là est VERT.
# Si une vérification échoue, le site en ligne reste sur sa version
# précédente : rien de cassé ne peut plus être publié.
#
# Avant le lot « vérifications plus rapides » (21/11/2026), ce workflow
# rejouait lui-même toute la batterie (« Vérifications bloquantes »), juste
# après la pull request qui venait de la passer : 12 minutes entre la fusion
# et la mise en ligne, et deux fois les mêmes tests. Il attend maintenant le
# verdict de « Vérifications » sur le même commit (workflow_run), sans rien
# rejouer.
#
# L'assemblage reprend ce que GitHub Pages publiait : tout le dépôt, sauf
# les fichiers commençant par « . » ou « _ » (sources LaTeX, serveur de
# suivi, fichiers techniques) que l'ancien système excluait déjà. Depuis le
# lot « petits correctifs de sécurité » (11/11/2026, constat F09 de l'audit
# GPT du 09/11), les dossiers techniques de la RACINE (tests/, scripts/,
# docs/), AGENTS.md et tous les fichiers de test (*.test.js, .mjs, .cjs)
# n'entrent plus non plus : un test du dépôt privé se lisait sur
# https://mathsgo.re/tests/…. Les exclusions sont ANCRÉES (« /scripts/ ») :
# auto/scripts/, que les Automatismes chargent, reste publié. L'archive
# assemblée est ensuite contrôlée par scripts/verifier-publication.mjs, qui
# tourne depuis le dépôt (il n'est pas publié) et tient la même liste.
#
# Ce workflow ne prend effet que lorsque le réglage GitHub Pages du dépôt
# est positionné sur « GitHub Actions » (au lieu de « Deploy from a
# branch »). Retour en arrière possible à tout moment en remettant
# l'ancien réglage.

name: Publication

on:
  # Quand « Vérifications » a fini sur main. Le job ci-dessous ne publie que si
  # ce passage est vert, et seulement pour une arrivée sur main (push) ou un
  # « Run workflow » lancé sur main — pas pour le passage du dimanche, qui ne
  # change rien au site. Pour republier à la main : « Run workflow » sur
  # « Vérifications », branche main.
  workflow_run:
    workflows: ["Vérifications"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Pas d'annulation d'une publication en cours : deux fusions rapprochées
  # attendent leur tour, et l'étape « Encore le dernier état de main ? »
  # empêche un état dépassé d'écraser le plus récent.
  cancel-in-progress: false

jobs:
  construire:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      publier: ${{ steps.dernier.outputs.publier }}
    steps:
      - name: Récupérer le dépôt (le commit vérifié)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Deux fusions rapprochées : si celle-ci a fini ses vérifications APRÈS la
      # suivante, elle ne doit pas remettre en ligne un état plus ancien. Elle
      # s'efface : le commit suivant a (ou aura) sa propre publication.
      - name: Encore le dernier état de main ?
        id: dernier
        env:
          VERIFIE: ${{ github.event.workflow_run.head_sha }}
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" = "$VERIFIE" ]; then
            echo "publier=true" >> "$GITHUB_OUTPUT"
            echo "-> $VERIFIE est le dernier état de main : on publie."
          else
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "-> main est déjà à $main : $VERIFIE ne sera pas publié (le suivant le sera)."
          fi

      - name: Installer Node.js
        if: steps.dernier.outputs.publier == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Installer Python
        if: steps.dernier.outputs.publier == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Générer la fiche des tables depuis sa source
        if: steps.dernier.outputs.publier == 'true'
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python _sources/defi-tables/generer_pdf.py

      - name: Assembler le site
        if: steps.dernier.outputs.publier == 'true'
        run: |
          mkdir _site
          rsync -a --exclude '.*' --exclude '_*' \
            --exclude '/tests/' --exclude '/scripts/' --exclude '/docs/' \
            --exclude '/AGENTS.md' \
            --exclude 'node_modules' \
            --exclude '*.test.js' --exclude '*.test.mjs' --exclude '*.test.cjs' \
            --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'axelle/daily/template-index.html' \
            ./ _site/
          test ! -e _site/axelle/daily/template-index.html
          node scripts/verifier-publication.mjs _site
          echo "Fichiers assemblés : $(find _site -type f | wc -l)"

      - name: Empaqueter pour publication
        if: steps.dernier.outputs.publier == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  publier:
    needs: construire
    if: needs.construire.outputs.publier == 'true'
    # Utiliser le pool standard, comme la construction, évite qu'une image
    # particulière sans exécuteur disponible bloque la mise en ligne.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
