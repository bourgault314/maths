name: Correctif ponctuel du menu Moulin

on:
  push:
    branches: [fix/moulin-menu-coches-seules-20260910]
    paths: [.github/workflows/moulin-menu-patch-20260910.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'bourgault314/maths'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/moulin-menu-coches-seules-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retirer uniquement la couleur du menu et adapter son contrôle
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          p = Path('outils/plateaux_manipulation/moulin_pythagore.html')
          before = p.read_bytes()
          assert blob_sha(before) == '677aed463cec6766ca7e8014b5b8475efbb0e949', 'Le fichier a changé : arrêt sans écrasement.'
          line = b'  #puzzleSelect.dejaReussi{border-color:#86efac; background:#f0fdf4; color:#14532d;}\n'
          assert before.count(line) == 1, 'La règle CSS attendue doit être unique.'
          after = before.replace(line, b'', 1)
          assert before.split(b'<script>')[1:] == after.split(b'<script>')[1:], 'Aucune modification JavaScript autorisée.'
          assert before.split(b'</style>', 1)[1] == after.split(b'</style>', 1)[1], 'Tout ce qui suit les styles doit rester identique.'
          p.write_bytes(after)
          print('Une seule règle CSS retirée. HTML, JavaScript, géométrie et impression identiques.')
          v = Path('scripts/validate-pythagore-tools.mjs')
          original = v.read_bytes()
          assert blob_sha(original) == '0634e5ee0c62297f2d5eb34cffb6ef37971a1569', 'Le validateur a changé : arrêt sans écrasement.'
          old = "if(!html.includes('#puzzleSelect.dejaReussi')) fail('Un découpage déjà réussi doit se voir sur le menu fermé : une coche dans un <option> ne peut être ni colorée ni grossie.');"
          new = "if(html.includes('#puzzleSelect.dejaReussi')) fail('Le menu doit rester neutre après une réussite : seule la coche du découpage indique la réussite, sans colorer toute la liste.');"
          old, new = old.encode(), new.encode()
          assert original.count(old) == 1, 'Le contrôle historique doit être unique.'
          v.write_bytes(original.replace(old, new, 1))
          print('Ancien contrôle imposant le menu vert remplacé par le contrôle du menu neutre. Les autres contrôles sont conservés.')
          PY
          git diff --check
          git diff --stat
      - name: Vérifier les outils et les puzzles de Pythagore
        run: |
          node scripts/validate-pythagore-tools.mjs
          node scripts/validate-pythagore-snap-engine.mjs
      - name: Vérifier les coches et le compteur sur plusieurs progressions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const html = fs.readFileSync('outils/plateaux_manipulation/moulin_pythagore.html', 'utf8');
          const options = [...html.matchAll(/<option value="([^"]+)"[^>]*>([^<]*)<\/option>/g)].map(([, value, textContent]) => ({value, textContent, dataset: {}}));
          assert.equal(options.length, 14);
          let erase = null;
          const classes = {toggle(){}};
          const puzzleSelect = {options, classList: classes, querySelector(){return erase;}, appendChild(row){erase = row;}};
          const scoreReussites = {style: {setProperty(){}}, classList: classes, setAttribute(){}};
          const state = {puzzle: 'perigal', reussites: new Set()};
          const context = vm.createContext({state, puzzleSelect, scoreReussites, decoupages: () => options, VALEUR_EFFACER: '__effacer-progression', document: {createElement(){return {dataset: {}, remove(){erase = null;}};}}});
          const source = html.match(/  function rafraichirProgression\(\)\{[\s\S]*?(?=\n  function marquerReussite)/)?.[0];
          assert.ok(source);
          vm.runInContext(source, context);
          const refresh = () => vm.runInContext('rafraichirProgression()', context);
          const checked = () => options.filter(o => o.textContent.startsWith('✔ ')).map(o => o.value);
          refresh();
          assert.equal(scoreReussites.textContent, '0/14');
          assert.deepEqual(checked(), []);
          assert.equal(erase, null);
          state.reussites.add('perigal');
          refresh(); refresh();
          assert.equal(scoreReussites.textContent, '1/14');
          assert.deepEqual(checked(), ['perigal']);
          assert.equal(options[0].textContent, '✔ 1. Périgal (5 pièces)');
          assert.ok(erase);
          state.puzzle = 'bhaskara';
          refresh();
          assert.deepEqual(checked(), ['perigal']);
          state.reussites.add('bhaskara');
          refresh();
          assert.equal(scoreReussites.textContent, '2/14');
          assert.deepEqual(checked(), ['perigal', 'bhaskara']);
          state.reussites.clear();
          refresh();
          assert.equal(scoreReussites.textContent, '0/14');
          assert.deepEqual(checked(), []);
          assert.equal(erase, null);
          console.log('OK — coche uniquement sur les puzzles réussis, compteur, changement de puzzle, absence de doubles coches et effacement.');
          JS
      - name: Exécuter les tests du dépôt
        run: |
          node --test > /tmp/moulin-node-tests.log 2>&1 || { tail -n 120 /tmp/moulin-node-tests.log; exit 1; }
          tail -n 15 /tmp/moulin-node-tests.log
      - name: Enregistrer uniquement la correction du Moulin et son contrôle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outils/plateaux_manipulation/moulin_pythagore.html scripts/validate-pythagore-tools.mjs
          git commit -m 'fix(moulin): garder les coches sans colorer tout le menu'
          git push origin HEAD:refs/heads/fix/moulin-menu-coches-seules-20260910
