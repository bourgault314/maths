<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Livret SPLAT! Système — un exemple résolu</title>
<link rel="stylesheet" href="commun.css">
<style>
/* Pages 2 et 3 en LARGEUR (livret tablette, lot M4-4) : le bandeau, puis à gauche la carte et ce
   qu'elle dit, à droite les dessins de la correction de l'outil (drawSysCorrectionBlocs : les blocs
   encadrés du corrigé 2 par page, lot M4-3). Rien n'est redessiné ici : render.py (JS_PAGE)
   remplit les emplacements. Aucun logo (décision du 25/09/2026). */
.tete{position:relative;height:31mm;flex:0 0 auto}
.tete .fond{position:absolute;inset:0;width:297mm;height:31mm;display:block}
.tete .bloc{position:absolute;left:14mm;top:6mm}
.tete .sur{font-size:12px;font-weight:700;color:#fde7d6;text-transform:uppercase;letter-spacing:2.6px}
.tete h1{margin:1mm 0 0;font-size:28px;line-height:1;font-weight:700;color:#fff;letter-spacing:-1px}
.corps{flex-direction:row;gap:5mm;padding:1mm 10mm 3mm}
.gauche{flex:0 0 76mm;display:flex;flex-direction:column;gap:3.5mm;min-height:0}
.droite{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3mm;min-height:0}
.carte{border:1.6px solid #0f172a;border-radius:4px;padding:1.5mm 2mm 2mm;background:#fff;display:flex;flex-direction:column}
.carte svg{width:100%;height:auto;display:block}
.lg{font-size:11.5px;font-weight:700;color:#334155;text-align:center;margin-bottom:0.6mm}
.texte{display:flex;flex-direction:column;gap:2mm;font-size:12.5px;line-height:1.35;color:#334155}
.texte p{margin:0}
.texte b{color:#431407}
.texte .but{background:#fdf0e6;border:1px solid #efc9a8;border-radius:6px;padding:2mm 3mm;font-weight:700;color:#0f172a}
.texte .but b{color:#7c2d12}
/* un grand dessin (toute la correction, ou le schéma à compléter) */
.dessin{flex:1 1 auto;min-height:0;display:flex;align-items:flex-start;justify-content:center}
.dessin svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
/* ou des étapes, chacune avec sa pastille et sa légende */
.etapes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3mm}
.et{display:grid;grid-template-columns:9mm 46mm 1fr;align-items:center;column-gap:3mm}
.et .badge{position:relative;width:9mm;height:9mm}
.et .badge svg{position:absolute;inset:0;width:9mm;height:9mm}
.et .badge b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px}
.et h3{margin:0;font-size:12.5px;font-weight:700;color:#7c2d12;line-height:1.2}
.et .leg{margin:0.8mm 0 0;font-size:11px;line-height:1.3;color:#334155}
.et svg.outil{width:100%;height:auto;display:block}
.atoi{margin:0;font-size:12.5px;font-weight:700;color:#0f172a;line-height:1.35;background:#fff;border:1.4px solid #92400e;border-radius:6px;padding:2.2mm 3.5mm;display:flex;align-items:center;gap:3mm}
.atoi svg{flex:0 0 auto;width:7mm;height:7mm}
.atoi b{color:#7c2d12}
</style></head>
<body>
