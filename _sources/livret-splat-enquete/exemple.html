<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Livret SPLAT! Enquête — un exemple résolu</title>
<link rel="stylesheet" href="commun.css">
<style>
/* ---------- bandeau ---------- */
.tete{position:relative;height:34mm;flex:0 0 auto}
.tete .fond{position:absolute;inset:0;width:210mm;height:34mm;display:block}
.tete .bloc{position:absolute;left:14mm;top:6.5mm}
.tete .sur{font-size:12px;font-weight:700;color:#fce7f3;text-transform:uppercase;letter-spacing:2.6px}
.tete h1{margin:1mm 0 0;font-size:30px;line-height:1;font-weight:700;color:#fff;letter-spacing:-1px}
/* ---------- la carte ---------- */
.corps{padding:0 14mm 3mm;justify-content:flex-start;gap:6mm}
.haut{display:flex;gap:5mm;align-items:stretch;margin-top:1mm}
.carte{flex:0 0 96mm;border:1.6px solid #0f172a;border-radius:4px;padding:1.5mm 2mm;background:#fff;display:flex;flex-direction:column}
.carte svg{width:100%;height:auto;display:block;margin:auto 0}
.lg{font-size:11.5px;font-weight:700;color:#334155;text-align:center;margin-bottom:0.6mm}
.enquete{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.2mm;font-size:12.5px;line-height:1.35;color:#334155}
.enquete p{margin:0}
.enquete b{color:#4a0d2b}
.enquete q{quotes:"«\00a0" "\00a0»";font-weight:700;color:#0f172a}
.enquete .but{background:#fce7f3;border:1px solid #f0abc9;border-radius:6px;padding:2mm 3mm;font-weight:700;color:#0f172a}
/* ---------- les schémas successifs du pas à pas (lot « pages 2 », 30/09/2026) : ceux de la
     projection (G3) — les barres, le schéma regroupé, puis un dessin par opération — et, en
     texte, « Je réponds » (la phrase encadrée) puis « Je vérifie » (03/10/2026). Jusqu'à cinq dessins : une colonne (le titre à
     gauche du dessin) ; au-delà : deux colonnes (le titre au-dessus). ---------- */
.etapes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;row-gap:4mm;column-gap:6mm}
.et{display:grid;grid-template-columns:9.5mm 47mm 1fr;align-items:center;column-gap:3mm}
.et.texte{grid-template-columns:9.5mm 1fr;background:#fce7f3;border:1px solid #f0abc9;border-radius:6px;padding:1.6mm 3mm 1.6mm 1.6mm}
.et.texte .leg{font-size:12px;margin-top:0.6mm}
/* « Je réponds » et « Je vérifie » (03/10/2026) : deux endroits, comme à l'écran. Une colonne :
   côte à côte (le bandeau garde sa hauteur, les schémas leur taille) ; deux colonnes : l'un sous
   l'autre. La réponse est encadrée sur fond blanc (lisible en noir et blanc). */
.et.texte .duo{display:flex;gap:7mm;align-items:flex-start}
.et.texte .duo>div:first-child{flex:0 1 auto}
.et.texte .rep{margin:0.5mm 0 0;padding:0.5mm 2.5mm;background:#fff;border:1.2px solid #0f172a;border-radius:4px;font-size:12px;color:#0f172a;line-height:1.3}
.et.texte .duo .leg{margin-top:1.2mm}
.etapes.deux .et.texte .duo{flex-direction:column;gap:1.2mm}
.etapes.deux .et.texte .duo .leg{margin-top:0.4mm}
.et .num{box-sizing:border-box;width:7.5mm;height:7.5mm;border:0.6mm solid #831843;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#831843;font-size:13px;font-weight:800;justify-self:center}
.et h3{margin:0;font-size:12.5px;font-weight:700;color:#831843;line-height:1.2}
.et .leg{margin:0.8mm 0 0;font-size:11px;line-height:1.3;color:#334155}
.et .leg:empty{display:none}
.et .leg b{color:#0f172a}
.et .dessin{width:100%;height:auto;display:block}
/* deux colonnes : on lit de haut en bas, à gauche puis à droite (choisi par Gwenaël le
   30/09/2026 : les schémas successifs sont l'un sous l'autre, comme en projection) ; un filet
   entre les deux. render.py pose le saut de colonne (.saut). */
.etapes.deux{display:block;column-count:2;column-gap:8mm;column-rule:1px solid #cbd5e1;column-fill:auto}
.etapes.deux .et{break-inside:avoid;margin-bottom:3.5mm}
.etapes.deux .et:last-child,.etapes.deux .et.avant-saut{margin-bottom:0}
.etapes.deux .et.saut{break-before:column}
.etapes.deux .et:not(.texte){grid-template-columns:7mm 1fr;column-gap:2mm;row-gap:1mm}
.etapes.deux .et:not(.texte) .num{width:6mm;height:6mm;border-width:0.5mm;font-size:11px}
.etapes.deux .et:not(.texte) .dessin{grid-column:1 / -1}
.etapes.deux .et:not(.texte) .leg{font-size:10px;line-height:1.25;margin-top:0.3mm}
.atoi{margin:0;font-size:13px;font-weight:700;color:#0f172a;line-height:1.35;background:#fff;border:1.4px solid #be185d;border-radius:6px;padding:2.4mm 3.5mm;display:flex;align-items:center;gap:3mm}
.atoi svg{flex:0 0 auto;width:7mm;height:7mm}
.atoi b{color:#831843}
</style></head>
<body>

<header class="tete">
  <svg class="fond" viewBox="0 0 210 34" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs><linearGradient id="deg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be185d"/><stop offset=".45" stop-color="#d23f7c"/><stop offset="1" stop-color="#fbe3ee"/>
    </linearGradient></defs>
    <path fill="url(#deg3)" d="M0,0 H210 V25 C203,31 199,33 191,32 C183,31 180,26 172,27 C163,28 159,33 150,32 C141,31 138,26 129,27 C120,28 116,33 107,32 C98,31 95,26 86,27 C77,28 73,33 64,32 C55,31 52,26 43,27 C34,28 30,33 21,32 C13,31 7,29 0,27 Z"/>
  </svg>
  <div class="bloc">
    <div class="sur">Un exemple résolu</div>
    <h1>L'enquête pas à pas</h1>
  </div>
</header>

<div class="corps">
  <!-- La carte et les dessins sont ceux de l'outil (outils/splat.html) : les schémas successifs
       du pas à pas de la projection (lot G3), au profil d'impression de la correction ; puis la
       dernière étape, « Je réponds » puis « Je vérifie », en texte. render.py les redemande à
       l'outil, pose les étapes dans la liste et écrit les légendes À PARTIR DE LA CARTE. -->
  <section class="haut">
    <div class="carte">
      <div class="lg">La carte et son indice</div>
      <svg class="ex ex-carte" viewBox="100 10 1460 830" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La carte de l'exemple"></svg>
    </div>
    <div class="enquete"></div>
  </section>

  <ol class="etapes"></ol>
  <!-- La consigne des fiches, ici ET sur la couverture (23/09/2026) : en page 2, elle est en
       face de la fiche 10 (ou 15) quand le livret est ouvert, juste après l'exemple. -->
  <p class="atoi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l3.5-.8L19 7.7 16.3 5 3.8 17.5 3 21z" fill="#be185d"/><path d="M14.8 6.5l2.7 2.7" stroke="#fff" stroke-width="1.4"/></svg><span><b>À toi&nbsp;!</b> Sur les fiches, sous chaque carte, <b>dessine le schéma en barres</b> pour t'aider, comme dans cet exemple, puis trouve ce que cache chaque tache.</span></p>
</div>

</body></html>
